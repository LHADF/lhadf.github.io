# Imágenes de la tarjeta del inicio, del álbum «Liturgical Cliparts» (grabados de una sola tinta). El álbum no está
# en el repositorio: tools/ilustraciones.py convierte cada original («album») en src/assets/ilu/<clave>.webp.
# Cada imagen dice cuándo va:
#   propia: nombre de la celebración o del día en el calendario (también en Cuaresma)
#   domingos: domingos o fiestas cuyo evangelio ilustra, con el ciclo: (A), (B), (C) o (ABC)
#   comun: clave de base/comunes/ (en Cuaresma las memorias sin imagen propia llevan la del tiempo)
#   tiempo: adviento, navidad, cuaresma o pascua
#   generica: true, para cualquier día sin otra
#   guarda: rosetas, rombos o zigzag, a los dos costados de las figuras muy angostas
# Orden: propia → domingo → común → tiempo → genérica. Si el día tiene varias, cambian en cada hora.
# «descartadas»: lo que no se usa del álbum, con el motivo.
