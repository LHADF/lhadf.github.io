# Salmo 118, 1-8. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: HIMNO A LA REVELACIÓN DE LA LEY
texto:
- |-
  Dichoso el que, con vida intachable,
  camina en la voluntad del Señor;
  dichoso el que, guardando sus preceptos,
  lo busca de todo corazón;
  el que, sin cometer iniquidad,
  anda por sus senderos.
- |-
  Tú promulgas tus decretos
  para que se observen exactamente.
  Ojalá esté firme mi camino,
  para cumplir tus consignas;
  entonces no sentiré vergüenza
  al mirar tus mandatos.
- |-
  Te alabaré con sincero corazón
  cuando aprenda tus justos mandamientos.
  Quiero guardar tus leyes exactamente,
  tú no me abandones.
titulo: Salmo 118, 1-8
