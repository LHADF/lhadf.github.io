# Salmo 103 III. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  ¡Cuántas son tus obras, Señor,
  y todas las hiciste con sabiduría!;
  la tierra está llena de tus creaturas.
- |-
  Ahí está el mar: ancho y dilatado,
  en él bullen, sin número,
  animales pequeños y grandes;
  lo surcan las naves, y el Leviatán
  que modelaste para que retoce.
- |-
  Todos ellos aguardan
  a que les eches comida a su tiempo:
  se la echas, y la atrapan;
  abres tu mano, y se sacian de bienes;
- |-
  escondes tu rostro, y se espantan;
  les retiras el aliento, y expiran
  y vuelven a ser polvo;
  envías tu aliento, y los creas,
  y repueblas la faz de la tierra.
- |-
  Gloria a Dios para siempre,
  goce el Señor con sus obras.
  Cuando él mira la tierra, ella tiembla;
  cuando toca los montes, humean.
- |-
  Cantaré al Señor mientras viva,
  tocaré para mi Dios mientras exista:
  que le sea agradable mi poema,
  y yo me alegraré con el Señor.
- |-
  Que se acaben los pecadores en la tierra,
  que los malvados no existan más.
  ¡Bendice, alma mía, al Señor!
titulo: Salmo 103 III
