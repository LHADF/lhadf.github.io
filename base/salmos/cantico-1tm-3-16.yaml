# Cántico 1Tm 3, 16. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ALABAD AL SEÑOR, TODAS LAS NACIONES
texto:
- R. Alabad al Señor, todas las naciones.
- |-
  Cristo, manifestado en fragilidad humana,
  santificado por el Espíritu.
- R. Alabad al Señor, todas las naciones.
- |-
  Cristo, mostrado a los ángeles,
  proclamado a los gentiles.
- R. Alabad al Señor, todas las naciones.
- |-
  Cristo, objeto de fe para el mundo,
  elevado a la gloria.
- R. Alabad al Señor, todas las naciones.
titulo: Cántico 1Tm 3, 16
