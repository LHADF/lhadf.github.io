# Salmo 12. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: SÚPLICA DEL JUSTO EN SUS DIFICULTADES COTIDIANAS
texto:
- |-
  ¿Hasta cuándo, Señor, seguirás olvidándome?
  ¿Hasta cuándo me esconderás tu rostro?
  ¿Hasta cuándo he de estar preocupado,
  con el corazón apenado todo el día?
  ¿Hasta cuándo va a triunfar mi enemigo?
- |-
  Atiende y respóndeme, Señor, Dios mío;
  da luz a mis ojos
  para que no me duerma en la muerte,
  para que no diga mi enemigo: «lo he vencido»,
  ni se alegre mi adversario de mi fracaso.
- |-
  Porque yo confío en tu misericordia:
  alegra mi corazón con tu auxilio,
  y cantaré al Señor por el bien que me ha hecho.
titulo: Salmo 12
