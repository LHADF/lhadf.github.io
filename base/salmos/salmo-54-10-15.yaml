# Salmo 54, 2-15. 17-24 II. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
# Corte del Oficio de lectura (26/11/2026): el de la Hora intermedia es otro y va con otra clave; texto de la misma base, cortado como la Liturgia Horarum. Cotejar con el libro. (vv. 10-15)
subtitulo: ''
texto:
- |-
  Violencia y discordia veo en la ciudad:
  día y noche hacen la ronda
  sobre las murallas;
- |-
  en su recinto, crimen e injusticia;
  dentro de ella, calamidades;
  no se apartan de su plaza
  la crueldad y el engaño.
- |-
  Si mi enemigo me injuriase,
  lo aguantaría;
  si mi adversario se alzase contra mí,
  me escondería de él;
- |-
  pero eres tú, mi compañero,
  mi amigo y confidente,
  a quien me unía una dulce intimidad:
  juntos íbamos entre el bullicio
  por la casa de Dios.
titulo: Salmo 54, 2-15. 17-24 II
