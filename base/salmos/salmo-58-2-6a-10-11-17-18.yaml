# Salmo 58, 2-6a. 10-11. 17-18. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ORACIÓN PIDIENDO LA PROTECCIÓN DE DIOS ANTE LOS ENEMIGOS
texto:
- |-
  Líbrame de mi enemigo, Dios mío;
  protégeme de mis agresores,
  líbrame de los malhechores,
  sálvame de los hombres sanguinarios.
- |-
  Mira que me están acechando,
  y me acosan los poderosos:
  sin que yo haya pecado ni faltado, Señor,
  sin culpa mía, avanzan para acometerme.
- |-
  Despierta, ven a mi encuentro, mira:
  tú, el Señor de los ejércitos,
  el Dios de Israel.
- |-
  Estoy velando contigo, fuerza mía,
  porque tú, ¡oh Dios!, eres mi alcázar.
- |-
  Que tu favor se adelante, ¡oh Dios!,
  y me haga ver la derrota del enemigo.
- |-
  Pero yo cantaré tu fuerza,
  por la mañana aclamaré tu misericordia;
  porque has sido mi alcázar
  y mi refugio en el peligro.
- |-
  Y tocaré en tu honor, fuerza mía,
  porque tú, ¡oh Dios!, eres mi alcázar.
titulo: Salmo 58, 2-6a. 10-11. 17-18
