# Cántico Ex 15, 1-4. 8-13. 17-18. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: HIMNO A DIOS, DESPUÉS DE LA VICTORIA DEL MAR ROJO
texto:
- |-
  Cantaré al Señor, sublime es su victoria,
  caballos y carros ha arrojado en el mar.
  Mi fuerza y mi poder es el Señor,
  él fue mi salvación.
- |-
  Él es mi Dios: yo lo alabaré;
  el Dios de mis padres: yo lo ensalzaré.
  El Señor es un guerrero,
  su nombre es «El Señor».
- |-
  Los carros del faraón los lanzó al mar,
  ahogó en el mar rojo a sus mejores capitanes.
- |-
  Al soplo de tu ira se amontonaron las aguas,
  las corrientes se alzaron como un dique,
  las olas se cuajaron en el mar.
- |-
  Decía el enemigo: «Los perseguiré y alcanzaré,
  repartiré el botín, se saciará mi codicia,
  empuñaré la espada, los agarrará mi mano.»
- |-
  Pero sopló tu aliento y los cubrió el mar,
  se hundieron como plomo en las aguas formidables.
- |-
  ¿Quién como tú, Señor, entre los dioses?
  ¿Quién como tú, terrible entre los santos,
  temibles por tus proezas, autor de maravillas?
- |-
  Extendiste tu diestra: se los tragó la tierra;
  guiaste con misericordia a tu pueblo rescatado,
  los llevaste con tu poder hasta tu santa morada.
- |-
  Lo introduces y lo plantas en el monte de tu heredad,
  lugar del que hiciste tu trono, Señor;
  santuario, Señor, que fundaron tus manos.
  El Señor reina por siempre jamás.
titulo: Cántico Ex 15, 1-4. 8-13. 17-18
