# Salmo 135 II. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
# Corte del Oficio de lectura (26/11/2026): el de Vísperas es otro y va con otra clave; texto de la misma base, cortado como la Liturgia Horarum. Cotejar con el libro. (vv. 10-15)
subtitulo: ''
texto:
- |-
  El hirió a Egipto en sus primogénitos:
  porque es eterna su misericordia.
- |-
  Y sacó a Israel de aquel país:
  porque es eterna su misericordia.
- |-
  Con mano poderosa, con brazo extendido:
  porque es eterna su misericordia.
- |-
  Él dividió en dos partes el mar Rojo:
  porque es eterna su misericordia.
- |-
  Y condujo por en medio a Israel:
  porque es eterna su misericordia.
- |-
  Arrojó en el mar Rojo al Faraón:
  porque es eterna su misericordia.
titulo: Salmo 135 II
