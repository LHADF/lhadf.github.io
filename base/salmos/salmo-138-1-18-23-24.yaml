# Salmo 138, 1-18. 23-24. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: I TODO ESTÁ PRESENTE A LOS OJOS DE DIOS
texto:
- |-
  Señor, tú me sondeas y me conoces;
  me conoces cuando me siento o me levanto,
  de lejos penetras mis pensamientos;
  distingues mi camino y mi descanso,
  todas mis sendas te son familiares.
- |-
  No ha llegado la palabra a mi lengua,
  y ya, Señor, te la sabes toda.
  Me envuelves por doquier,
  me cubres con tu mano.
  Tanto saber me sobrepasa,
  es sublime, y no lo abarco.
- |-
  ¿Adónde iré lejos de tu aliento,
  adónde escaparé de tu mirada?
  Si escalo el cielo, allí estás tú;
  si me acuesto en el abismo, allí te encuentro;
- |-
  si vuelo hasta el margen de la aurora,
  si emigro hasta el confín del mar,
  allí me alcanzará tu izquierda,
  tu diestra llegará hasta mí.
- |-
  Si digo: «Que al menos la tiniebla me encubra,
  que la luz se haga noche en torno a mí»,
  ni la tiniebla es oscura para ti,
  la noche es clara como el día.
titulo: Salmo 138, 1-18. 23-24
