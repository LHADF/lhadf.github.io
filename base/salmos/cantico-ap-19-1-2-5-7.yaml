# Cántico Ap 19, 1-2, 5-7. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: LAS BODAS DEL CORDERO - Cf
texto:
- El cántico siguiente se dice con todos los Aleluia intercalados cuando el oficio es cantado. Cuando el Oficio se dice sin canto es suficiente decir el Aleluia sólo al principio y al final de cada estrofa.
- |-
  Aleluia.
  La salvación y la gloria y el poder son de nuestro Dios
  (R. Aleluia)
  porque sus juicios son verdaderos y justos.
  R. Aleluia, (aleluia).
- |-
  Aleluia.
  Alabad al Señor sus siervos todos.
  (R. Aleluia)
  Los que le teméis, pequeños y grandes.
  R. Aleluia, (aleluia).
- |-
  Aleluia.
  Porque reina el Señor, nuestro Dios, dueño de todo.
  (R. Aleluia)
  Alegrémonos y gocemos y démosle gracias.
  R. Aleluia, (aleluia).
- |-
  Aleluia.
  Llegó la boda del cordero.
  (R. Aleluia)
  Su esposa se ha embellecido.
  R. Aleluia, (aleluia).
titulo: Cántico Ap 19, 1-2, 5-7
