# Salmo 116. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: INVITACIÓN UNIVERSAL A LA ALABANZA DIVINA
texto:
- |-
  Alabad al Señor, todas las naciones,
  aclamadlo, todos los pueblos:
- |-
  Firme es su misericordia con nosotros,
  su fidelidad dura por siempre.
titulo: Salmo 116
