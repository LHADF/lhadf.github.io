# Salmo 17, 31-51 IV. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: EL SEÑOR REVELA SU PODER SALVADOR
texto:
- |-
  Perfecto es el camino de Dios,
  acendrada es la promesa del Señor;
  él es escudo para los que a él se acogen.
- |-
  ¿Quién es dios fuera del Señor?
  ¿Qué roca hay fuera de nuestro Dios?
  Dios me ciñe de valor
  y me enseña un camino perfecto;
- |-
  él me da pies de ciervo,
  y me coloca en las alturas;
  él adiestra mis manos para la guerra,
  y mis brazos para tensar la ballesta.
titulo: Salmo 17, 31-51 IV
