# Cántico Is 42, 10-16. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: CÁNTICO NUEVO AL DIOS VENCEDOR Y SALVADOR
texto:
- |-
  Cantad al Señor un cántico nuevo,
  llegue su alabanza hasta el confín de la tierra;
  muja el mar y lo que contiene,
  las islas y sus habitantes;
- |-
  alégrese el desierto con sus tiendas,
  los cercados que habita Cadar;
  exulten los habitantes de Petra,
  clamen desde la cumbre de las montañas;
  den gloria al Señor,
  anuncien su alabanza en las islas.
- |-
  El Señor sale como un héroe,
  excita su ardor como un guerrero,
  lanza el alarido,
  mostrándose valiente frente al enemigo.
- |-
  «Desde antiguo guardé silencio,
  me callaba y aguantaba;
  mas ahora grito como la mujer cuando da a luz,
  jadeo y resuello.
- |-
  Agostaré montes y collados,
  secaré toda su hierba,
  convertiré los ríos en yermo,
  desecaré los estanques;
  conduciré a los ciegos
  por el camino que no conocen,
  los guiaré por senderos que ignoran.
  Ante ellos convertiré la tiniebla en luz,
  lo escabroso en llano.»
titulo: Cántico Is 42, 10-16
