# Salmo 16. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: DIOS, ESPERANZA DEL INOCENTE PERSEGUIDO
texto:
- |-
  Señor, escucha mi apelación,
  atiende a mis clamores,
  presta oído a mi súplica,
  que en mis labios no hay engaño:
  emane de ti la sentencia,
  miren tus ojos la rectitud.
- |-
  Aunque sondees mi corazón,
  visitándolo de noche,
  aunque me pruebes al fuego,
  no encontrarás malicia en mí.
- |-
  Mi boca no ha faltado
  como suelen los hombres;
  según tus mandatos yo me he mantenido
  en la senda establecida.
  Mis pies estuvieron firmes en tus caminos,
  y no vacilaron mis pasos.
- |-
  Yo te invoco porque tú me respondes, Dios mío;
  inclina el oído y escucha mis palabras.
  Muestra las maravillas de tu misericordia,
  tú que salvas de los adversarios
  a quien se refugia a tu derecha.
- |-
  Guárdame como a las niñas de tus ojos,
  a la sombra de tus alas escóndeme
  de los malvados que me asaltan,
  del enemigo mortal que me cerca.
titulo: Salmo 16 I
