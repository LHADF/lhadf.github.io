# Cántico Dt 32, 1-12. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: BENEFICIOS DE DIOS PARA CON SU PUEBLO
texto:
- |-
  Escuchad, cielos, y hablaré;
  oye, tierra, los dichos de mi boca;
  descienda como lluvia mi doctrina,
  destile como rocío mi palabra;
  como llovizna sobre la hierba,
  como sereno sobre el césped;
  voy a proclamar el nombre del Señor:
  dad gloria a nuestro Dios.
- |-
  Él es la Roca, sus obras son perfectas,
  sus caminos son justos,
  es un Dios fiel, sin maldad;
  es justo y recto.
- |-
  Hijos degenerados, se portaron mal con él,
  generación malvada y pervertida.
  ¿Así le pagas al Señor,
  pueblo necio e insensato?
  ¿no es él tu padre y tu creador,
  el que te hizo y te constituyó?
- |-
  Acuérdate de los días remotos,
  considera las edades pretéritas,
  pregunta a tu padre y te lo contará,
  a tus ancianos y te lo dirán:
- |-
  Cuando el Altísimo daba a cada pueblo su heredad,
  y distribuía a los hijos de Adán,
  trazando las fronteras de las naciones,
  según el número de los hijos de Dios,
  la porción del Señor fue su pueblo,
  Jacob fue la parte de su heredad.
- |-
  Lo encontró en una tierra desierta,
  en una soledad poblada de aullidos:
  lo rodeó cuidando de él,
  lo guardó como a las niñas de sus ojos.
- |-
  Como el águila incita a su nidada,
  revolando sobre los polluelos,
  así extendió sus alas, los tomó
  y los llevó sobre sus plumas.
- |-
  El Señor solo los condujo
  no hubo dioses extraños con él.
titulo: Cántico Dt 32, 1-12
