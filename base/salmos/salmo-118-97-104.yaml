# Salmo 118, 97-104. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  ¡Cuánto amo tu voluntad!:
  todo el día la estoy meditando;
  tu mandato me hace más sabio que mis enemigos,
  siempre me acompaña;
  soy más docto que todos mis maestros,
  porque medito tus preceptos.
- |-
  Soy más sagaz que los ancianos,
  porque cumplo tus leyes;
  aparto mi pie de toda senda mala,
  para guardar tu palabra;
  no me aparto de tus mandamientos,
  porque tú me has instruido.
- |-
  ¡Qué dulce al paladar tu promesa:
  más que miel en la boca!
  Considero tus decretos,
  y odio el camino de la mentira.
titulo: Salmo 118, 97-104
