# Salmo 68, 2-22. 30-37 II. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  Pero mi oración se dirige a ti,
  Dios mío, el día de tu favor;
  que me escuche tu gran bondad,
  que tu fidelidad me ayude:
- |-
  arráncame del cieno, que no me hunda;
  líbrame de los que me aborrecen,
  y de las aguas sin fondo.
- |-
  Que no me arrastre la corriente,
  que no me trague el torbellino,
  que no se cierre la poza sobre mí.
- |-
  Respóndeme, Señor, con la bondad de tu gracia,
  por tu gran compasión vuélvete hacia mí;
  no escondas tu rostro a tu siervo:
  estoy en peligro, respóndeme en seguida.
- |-
  Acércate a mí, rescátame,
  líbrame de mis enemigos:
  estás viendo mi afrenta,
  mi vergüenza y mi deshonra;
  a tu vista están los que me acosan.
- |-
  La afrenta me destroza el corazón, y desfallezco.
  Espero compasión, y no la hay;
  consoladores, y no los encuentro.
  En mi comida me echaron hiel,
  para mi sed me dieron vinagre.
titulo: Salmo 68, 2-22. 30-37 II
