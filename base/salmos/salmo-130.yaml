# Salmo 130. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: COMO UN NIÑO, ISRAEL SE ABANDONÓ EN LOS BRAZOS DE DIOS
texto:
- |-
  Señor, mi corazón no es ambicioso,
  ni mis ojos altaneros;
  no pretendo grandezas
  que superan mi capacidad;
  sino que acallo y modero mis deseos,
  como un niño en brazos de su madre.
- |-
  Espere Israel en el Señor
  ahora y por siempre.
titulo: Salmo 130
