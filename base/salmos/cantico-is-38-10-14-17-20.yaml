# Cántico Is 38, 10-14. 17-20. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ANGUSTIA DE UN MORIBUNDO Y ALEGRÍA DE LA CURACIÓN
texto:
- |-
  Yo pensé: «En medio de mis días
  tengo que marchar hacia las puertas del abismo;
  me privan del resto de mis años.»
- |-
  Yo pensé: «Ya no veré más al Señor
  en la tierra de los vivos,
  ya no miraré a los hombres
  entre los habitantes del mundo.
- |-
  Levantan y enrollan mi vida
  como una tienda de pastores.
  Como un tejedor devanaba yo mi vida,
  y me cortan la trama.»
- |-
  Día y noche me estás acabando,
  sollozo hasta el amanecer.
  Me quiebras los huesos como un león,
  día y noche me estas acabando.
- |-
  Estoy piando como una golondrina,
  gimo como una paloma.
  Mis ojos mirando al cielo se consumen:
  ¡Señor, que me oprimen, sal fiador por mí!
- |-
  Me has curado, me has hecho revivir,
  la amargura se me volvió paz
  cuando detuviste mi alma ante la tumba vacía
  y volviste la espalda a todos mis pecados.
- |-
  El abismo no te da gracias,
  ni la muerte te alaba,
  ni esperan en tu fidelidad
  los que bajan a la fosa.
- |-
  Los vivos, los vivos son quienes te alaban:
  como yo ahora.
  El Padre enseña a sus hijos tu fidelidad.
- |-
  Sálvame, Señor, y tocaremos nuestras arpas
  todos nuestros días en la casa del Señor.
titulo: Cántico Is 38, 10-14. 17-20
