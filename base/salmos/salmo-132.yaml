# Salmo 132. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: FELICIDAD DE LA CONCORDIA FRATERNA
texto:
- |-
  Ved qué paz y qué alegría,
  convivir los hermanos unidos.
- |-
  Es ungüento precioso en la cabeza,
  que va bajando por la barba,
  que baja por la barba de Aarón,
  hasta la franja de su ornamento.
- |-
  Es rocío del Hermón, que va bajando
  sobre el monte Sión.
  Porque allí manda el Señor la bendición:
  la vida para siempre.
titulo: Salmo 132
