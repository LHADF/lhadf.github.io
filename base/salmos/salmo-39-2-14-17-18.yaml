# Salmo 39, 2-14. 17-18. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ACCIÓN DE GRACIAS Y PETICIÓN DE AUXILIO
texto:
- |-
  Yo esperaba con ansia al Señor;
  él se inclinó y escuchó mi grito;
- |-
  me levantó de la fosa fatal,
  de la charca fangosa;
  afianzó mis pies sobre roca,
  y aseguró mis pasos;
- |-
  me puso en la boca un cántico nuevo,
  un himno a nuestro Dios.
  Muchos, al verlo, quedaron sobrecogidos
  y confiaron en el Señor.
- |-
  Dichoso el hombre que ha puesto
  su confianza en el Señor,
  y no acude a los idólatras,
  que se extravían con engaños.
- |-
  ¡Cuántas maravillas has hecho,
  Señor, Dios mío,
  cuántos planes en favor nuestro!
  Nadie se te puede comparar:
  intento proclamarlas, decirlas,
  pero superan todo número.
- |-
  Tú no quieres sacrificios ni ofrendas,
  y, en cambio, me abriste el oído;
  no pides sacrificio expiatorio,
  entonces yo digo: «Aquí estoy
  -como está escrito en mi libro-
  para hacer tu voluntad.»
- |-
  Dios mío, lo quiero,
  y llevo tu ley en las entrañas.
- |-
  He proclamado tu salvación
  ante la gran asamblea;
  no he cerrado los labios:
  Señor, tú lo sabes.
- |-
  No me he guardado en el pecho tu defensa,
  he proclamado tu fidelidad y tu salvación,
  no he negado tu misericordia y tu lealtad
  ante la gran asamblea.
- |-
  Tú, Señor, no me niegues tu clemencia,
  que tu misericordia y tu lealtad me guarden siempre,
  porque me cercan desgracias sin cuento.
- |-
  Se me echan encima mis culpas,
  y no puedo huir;
  son más que los cabellos de mi cabeza,
  y me falta el valor.
- |-
  Señor, dígnate librarme;
  Señor, date prisa en socorrerme.
- |-
  Alégrense y gocen contigo
  todos los que te buscan;
  digan siempre: «Grande es el Señor»,
  los que desean tu salvación.
- |-
  Yo soy pobre y desdichado,
  pero el Señor cuida de mí;
  tú eres mi auxilio y mi liberación:
  Dios mío, no tardes.
titulo: Salmo 39, 2-14. 17-18
