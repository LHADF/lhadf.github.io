# Salmo 104 II. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  Llamó al hambre sobre aquella tierra:
  cortando el sustento de pan;
  por delante había enviado a un hombre,
  a José, vendido como esclavo;
- |-
  le trabaron los pies con grillos,
  le metieron el cuello en la argolla,
  hasta que se cumplió su predicción,
  y la palabra del Señor lo acreditó.
- |-
  El rey lo mandó desatar,
  el Señor de pueblos le abrió la prisión,
  lo nombró administrador de su casa,
  señor de todas sus posesiones,
  para que a su gusto instruyera a los príncipes
  y enseñase sabiduría a los ancianos.
titulo: Salmo 104 II
