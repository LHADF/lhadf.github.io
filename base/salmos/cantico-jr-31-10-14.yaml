# Cántico Jr 31, 10-14. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: FELICIDAD DEL PUEBLO REDIMIDO
texto:
- |-
  Escuchad, pueblos, la palabra del Señor,
  anunciadla en las islas remotas:
  «El que dispersó a Israel lo reunirá,
  lo guardará como un pastor a su rebaño;
  porque el Señor redimió a Jacob,
  lo rescató de una mano más fuerte.»
- |-
  Vendrán con aclamaciones a la altura de Sión,
  afluirán hacia los bienes del Señor:
  hacia el trigo y el vino y el aceite,
  y los rebaños de ovejas y de vacas;
  su alma será como un huerto regado,
  y no volverán a desfallecer.
- |-
  Entonces se alegrará la doncella en la danza,
  gozarán los jóvenes y los viejos;
  convertiré su tristeza en gozo,
  los alegraré y aliviaré sus penas;
  alimentaré a los sacerdotes con manjares sustanciosos,
  y mi pueblo se saciará de mis bienes.
titulo: Cántico Jr 31, 10-14
