# Salmo 36 I. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: LA VERDADERA Y LA FALSA FELICIDAD
texto:
- |-
  No te exasperes por los malvados,
  no envidies a los que obran el mal:
  se secarán pronto, como la hierba,
  como el césped verde se agostarán.
- |-
  Confía en el Señor y haz el bien,
  habita tu tierra y practica la lealtad;
  sea el Señor tu delicia,
  y él te dará lo que pide tu corazón.
- |-
  Encomienda tu camino al Señor,
  confía en él, y él actuará:
  hará brillar tu justicia como el amanecer;
  tu derecho, como el mediodía.
- |-
  Descansa en el Señor y espera en él,
  no te exasperes por el hombre que triunfa
  empleando la intriga:
- |-
  cohíbe la ira, reprime el coraje,
  no te exasperes, no sea que obres mal;
  porque los que obran mal son excluidos,
  pero los que esperan en el Señor poseerán la tierra.
- |-
  Aguarda un momento: desapareció el malvado,
  fíjate en su sitio: ya no está;
  en cambio, los sufridos poseen la tierra
  y disfrutan de paz abundante.
titulo: Salmo 36 I
