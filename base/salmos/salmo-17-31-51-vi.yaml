# Salmo 17, 31-51 VI. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  Viva el Señor, bendita sea mi Roca,
  sea ensalzado mi Dios y Salvador:
  el Dios que me dió el desquite
  y me sometió los pueblos;
- |-
  que me libró de mis enemigos,
  me levantó sobre los que resistían
  y me salvó del hombre cruel.
- |-
  Por eso te daré gracias entre las naciones, Señor,
  y tañeré en honor de tu nombre:
  tú diste gran victoria a tu rey,
  tuviste misericordia de tu Ungido,
  de David y su linaje por siempre.
titulo: Salmo 17, 31-51 VI
