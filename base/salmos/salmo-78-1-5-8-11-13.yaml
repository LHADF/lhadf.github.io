# Salmo 78, 1-5. 8-11. 13. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: LAMENTACIÓN ANTE LA DESTRUCCIÓN DE JERUSALÉN
texto:
- |-
  Dios mío, los gentiles han entrado en tu heredad,
  han profanado tu santo templo,
  han reducido Jerusalén a ruinas.
- |-
  Echaron los cadáveres de tus siervos
  en pasto a las aves del cielo,
  y la carne de tus fieles
  a las fieras de la tierra,
- |-
  Derramaron su sangre como agua
  en torno a Jerusalén,
  y nadie la enterraba.
- |-
  Fuimos el escarnio de nuestros vecinos,
  la irrisión y la burla de los que nos rodean.
- |-
  ¿Hasta cuándo, Señor?
  ¿Vas a estar siempre enojado?
  ¿Va a arder como fuego tu cólera?
- |-
  No recuerdes contra nosotros
  las culpas de nuestros padres;
  que tu compasión nos alcance pronto,
  pues estamos agotados.
- |-
  Socórrenos, Dios salvador nuestro,
  por el honor de tu nombre;
  líbranos y perdona nuestros pecados
  a causa de tu nombre.
- |-
  ¿Por qué han de decir los gentiles:
  «Dónde está su Dios»?
  Que a nuestra vista conozcan los gentiles la venganza
  de la sangre de tus siervos derramada.
- |-
  Llegue a tu presencia el gemido del cautivo:
  con tu brazo poderoso, salva a los condenados a muerte.
- |-
  Mientras, nosotros, pueblo tuyo,
  ovejas de tu rebaño,
  te daremos gracias siempre,
  cantaremos tus alabanzas
  de generación en generación.
titulo: Salmo 78, 1-5. 8-11. 13
