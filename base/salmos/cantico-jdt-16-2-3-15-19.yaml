# Cántico Jdt 16, 2-3. 15-19. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: HIMNO A DIOS CREADOR DEL MUNDO Y PROTECTOR DE SU PUEBLO
texto:
- |-
  ¡Alabad a mi Dios con tambores,
  elevad cantos al Señor con cítaras,
  ofrecedle los acordes de un salmo de alabanza,
  ensalzad e invocad su nombre!
  porque el Señor es un Dios quebrantador de guerras,
  su nombre es el Señor.
- |-
  Cantaré a mi Dios un cántico nuevo:
  Señor, tú eres grande y glorioso,
  admirable en tu fuerza, invencible.
- |-
  Que te sirva toda la creación,
  porque tú lo mandaste y existió;
  enviaste tu aliento y la construiste,
  nada puede resistir a tu voz.
- |-
  Sacudirán las olas los cimientos de los montes,
  las peñas en tu presencia se derretirán como cera,
  pero tú serás propicio a tus fieles.
titulo: Cántico Jdt 16, 2-3. 15-19
