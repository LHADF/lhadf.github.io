# Salmo 106 II. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  Entraron en naves por el mar,
  comerciando por las aguas inmensas.
  Contemplaron las obras de Dios,
  sus maravillas en el océano.
- |-
  Él habló y levantó un viento tormentoso,
  que alzaba las olas a lo alto:
  subían al cielo, bajaban al abismo,
  su vida se marchitaba por el mareo,
  rodaban, se tambaleaban como ebrios,
  y no les valía su pericia.
  Pero gritaron al Señor en su angustia,
  y los arrancó de la tribulación.
- |-
  Apaciguó la tormenta en suave brisa,
  y enmudecieron las olas del mar.
  Se alegraron de aquella bonanza,
  y él los condujo al ansiado puerto.
  Den gracias al Señor por su misericordia,
  por las maravillas que hace con los hombres.
- |-
  Aclámenlo en la asamblea del pueblo,
  alábenlo en el consejo de los ancianos.
titulo: Salmo 106 II
