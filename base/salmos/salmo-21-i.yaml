# Salmo 21 I. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: EL SIERVO DE DIOS SUFRIENTE ORA Y DIOS LE RESPONDE
texto:
- |-
  Dios mío, Dios mío, ¿por qué me has abandonado?;
  a pesar de mis gritos, mi oración no te alcanza.
- |-
  Dios mío, de día te grito, y no respondes;
  de noche, y no me haces caso;
  aunque tú habitas en el santuario,
  esperanza de Israel.
- |-
  En ti confiaban nuestros padres;
  confiaban, y los ponías a salvo;
  a ti gritaban, y quedaban libres,
  en ti confiaban, y no los defraudaste.
- |-
  Pero yo soy un gusano, no un hombre,
  vergüenza de la gente, desprecio del pueblo;
  al verme se burlan de mí,
  hacen visajes, menean la cabeza:
  «Acudió al Señor, que lo ponga a salvo;
  que lo libre si tanto lo quiere.»
- |-
  Tú eres quien me sacó del vientre,
  me tenías confiado en los pechos de mi madre;
  desde el seno pasé a tus manos,
  desde el vientre materno tú eres mi Dios.
  No te quedes lejos, que el peligro está cerca
  y nadie me socorre.
titulo: Salmo 21 I
