# Cántico Is 33, 13-16. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: DIOS JUZGARÁ CON JUSTICIA
texto:
- |-
  Los lejanos, escuchad lo que he hecho;
  los cercanos, reconoced mi fuerza.
- |-
  Temen en Sión los pecadores,
  y un temblor se apodera de los perversos:
  «¿Quién de nosotros habitará un fuego devorador,
  quién de nosotros habitará una hoguera perpetua?».
- |-
  El que procede con justicia y habla con rectitud
  y rehúsa el lucro de la opresión;
  el que sacude la mano rechazando el soborno
  y tapa su oído a propuestas sanguinarias,
  el que cierra los ojos para no ver la maldad:
  ése habitará en lo alto,
  tendrá su alcázar en un picacho rocoso,
  con abasto de pan y provisión de agua.
titulo: Cántico Is 33, 13-16
