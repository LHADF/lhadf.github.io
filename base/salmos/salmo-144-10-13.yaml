# Salmo 144 II. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
# Corte del Oficio de lectura (26/11/2026): el de Vísperas es otro y va con otra clave; texto de la misma base, cortado como la Liturgia Horarum. Cotejar con el libro. (vv. 10-13)
subtitulo: ''
texto:
- |-
  Que todas tus creaturas te den gracias, Señor,
  que te bendigan tus fieles;
  que proclamen la gloria de tu reinado,
  que hablen de tus hazañas;
- |-
  explicando tus proezas a los hombres,
  la gloria y majestad de tu reinado.
  Tu reinado es un reinado perpetuo,
  tu gobierno va de edad en edad.
titulo: Salmo 144 II
