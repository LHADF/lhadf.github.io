# Cántico Is 66, 10-14a. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: CONSUELO Y GOZO PARA LA CIUDAD SANTA
texto:
- |-
  Festejad a Jerusalén, gozad con ella,
  todos los que la amáis,
  alegraos de su alegría,
  los que por ella llevasteis luto;
  a su pecho seréis alimentados
  y os saciaréis de sus consuelos
  y apuraréis las delicias
  de sus pechos abundantes.
- |-
  Porque así dice el Señor:
  «Yo haré derivar hacia ella
  como un río la paz,
  como un torrente en crecida,
  las riquezas de las naciones.
- |-
  Llevarán en brazos a sus criaturas
  y sobre las rodillas las acariciarán;
  como a un niño a quien su madre consuela,
  así os consolaré yo
  y en Jerusalén seréis consolados.
- |-
  Al verlo se alegrará vuestro corazón
  y vuestros huesos florecerán como un prado.»
titulo: Cántico Is 66, 10-14a
