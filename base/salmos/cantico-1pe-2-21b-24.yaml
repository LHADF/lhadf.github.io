# Cántico 1Pe 2, 21b-24. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: PASIÓN VOLUNTARIA DE CRISTO, SIERVO DE DIOS
texto:
- |-
  Cristo padeció por nosotros,
  dejándonos un ejemplo
  para que sigamos sus huellas.
- |-
  El no cometió pecado
  ni encontraron engaño en su boca;
  cuando le insultaban,
  no devolvía el insulto;
  en su pasión no profería amenazas;
  al contrario,
  se ponía en manos del que juzga justamente.
- |-
  Cargado con nuestros pecados subió al leño,
  para que, muertos al pecado,
  vivamos para la justicia.
  Sus heridas nos han curado.
titulo: Cántico 1Pe 2, 21b-24
