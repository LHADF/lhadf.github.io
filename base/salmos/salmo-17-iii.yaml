# Salmo 17 III. Texto de la Liturgia de las Horas en español; estrofas separadas por renglón en blanco.
subtitulo: ''
texto:
- |-
  El Señor retribuyó mi justicia,
  retribuyó la pureza de mis manos,
  porque seguí los caminos del Señor
  y no me rebelé contra mi Dios;
  porque tuve presentes sus mandamientos
  y no me aparté de sus preceptos;
- |-
  Le fui enteramente fiel,
  guardándome de toda culpa;
  el Señor retribuyó mi justicia,
  la pureza de mis manos en su presencia.
- |-
  Con el fiel, tú eres fiel;
  con el íntegro, tú eres íntegro;
  con el sincero, tú eres sincero;
  con el astuto, tú eres sagaz.
  Tú salvas al pueblo afligido
  y humillas los ojos soberbios.
- |-
  Señor, tú eres mi lámpara;
  Dios mío, tú alumbras mis tinieblas.
  Fiado en ti, me meto en la refriega;
  fiado en mi Dios, asalto la muralla.
titulo: Salmo 17 III
