    lectura1:
      titulo: VISIÓN DE LA JERUSALÉN CELESTIAL
      texto: |-
        Vino uno de los siete ángeles que tenía las siete copas llenas de las siete últimas plagas, y me habló, diciendo:«Ven y te mostraré la desposada, la esposa del Cordero.»

        Me transportó en espíritu a un monte altísimo y me enseñó la ciudad santa, Jerusalén, que bajaba del cielo, de junto a Dios, y traía la gloria de Dios. Su resplandor era como el de una piedra muy preciosa, como jaspe cristalino. Tenía una muralla grande y alta con doce puertas; y, sobre las puertas, doce ángeles y nombres grabados, que son los de las doce tribus de los hijos de Israel; tres puertas al oriente; tres puertas al norte; tres puertas al mediodía; tres puertas al occidente. La muralla de la ciudad se asienta sobre doce piedras, que llevan los nombres de los doce apóstoles del Cordero.

        El que hablaba conmigo tenía una caña de medir, de oro, para medir la ciudad, sus puertas y su muralla. La ciudad es un cuadrado: su largo es igual a su ancho. Midió la ciudad con la caña, y tenía doce mil estadios. Su largo, ancho y alto son iguales.

        Midió luego su muralla, y tenía ciento cuarenta y cuatro codos con medida humana, la empleada por el ángel. El material de esta muralla es jaspe y la ciudad es de oro puro semejante al vidrio puro.

        Las piedras en que se asienta la muralla de la ciudad están adornadas de toda clase de piedras preciosas: la primera piedra es de jaspe; la segunda, de zafiro; la tercera, de calcedonia; la cuarta, de esmeralda; la quinta, de sardónica; la sexta, de cornalina; la séptima, de crisólito; la octava, de berilo; la novena, de topacio; la décima, de crisoprasa; la undécima, de jacinto; la duodécima, de amatista.

        Y las doce puertas son doce perlas, cada una de las puertas hecha de una sola perla; y la plaza de la ciudad es de oro puro, transparente como el cristal.

        Pero no vi santuario alguno en ella; porque el Señor, Dios todopoderoso, y el Cordero, es su santuario. La ciudad no necesita ni de sol ni de luna que la alumbren, porque la ilumina la gloria de Dios, y su lámpara es el Cordero. Las naciones caminarán a su luz, y los reyes de la tierra irán a llevarle su esplendor. Sus puertas no se cerrarán con el día — porque allí no habrá noche— y traerán a ella el esplendor y los tesoros de las naciones. Nada profano entrará en ella, ni los que cometen abominación y mentira, sino solamente los inscritos en el libro de la vida del Cordero.
      ref: Del libro del Apocalipsis 21, 9-27
    resp1:
      ref: Cf. Ap 21, 21; Tb 13, 21. 22. 13
      vr:
