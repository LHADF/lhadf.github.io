    lectura1:
    - etiqueta: 'En tiempo de cuaresma:'
      texto:
        titulo: PROFECÍA DEL HIJO DE DAVID
        texto: |-
          En aquellos días, cuando David se estableció en su casa, dijo al profeta Natán: "Mira, yo habito en una casa de cedro, mientras el Arca de la Alianza del Señor está bajo una tienda de campaña". Natán respondió a David: "Puedes hacer todo lo que tienes pensado, porque el Señor está contigo".

          Pero aquella misma noche, la palabra del Señor llegó a Natán en estos términos: "Ve a decirle a mi servidor David: Así habla el Señor: No eres tú el que me edificará la casa para que yo la habite. Porque desde el día en que hice subir a Israel hasta el día de hoy, nunca habité en una casa, sino que anduve de carpa en carpa y de morada en morada. Y mientras iba caminando entre todo Israel, ¿acaso dije a uno solo de sus Jueces, a los que mandé apacentar a mi pueblo: 'Por qué no me han edificado una casa de cedro'?

          Ahora, esto es lo que le dirás a mi servidor David: Así habla el Señor de los ejércitos: Yo te saqué del campo de pastoreo, de detrás del rebaño, para que fueras el jefe de mi pueblo Israel. Estuve contigo dondequiera que fuiste y exterminé a todos tus enemigos delante de ti. Yo haré que tu nombre sea tan grande como el de los grandes de la tierra. Fijaré un lugar para mi pueblo Israel y lo plantaré para que tenga allí su morada. Ya no será perturbado, y los malhechores no seguirán devorándolo como antes. Desde el día en que constituí jueces sobre mi pueblo Israel, yo he sometido a todos tus enemigos.

          Y ahora te anuncio que el Señor te edificará una casa. Sí, cuando llegues al término de tus días y te vayas con tus padres, yo elevaré después de ti a uno de tus descendientes, a uno de entre tus hijos, y afianzaré su realeza. Él me edificará una Casa y yo afianzaré su trono para siempre. Yo seré un padre para él, y él será para mí un hijo. Y jamás retiraré de él mi fidelidad, como se la retiré a aquel que te precedió. Lo estableceré en mi Casa y en mi reino para siempre, y su trono será estable eternamente".

          Natán comunicó a David todas estas palabras y toda esta visión.
        ref: Del primer libro de las Crónicas 17, 1-15
    - etiqueta: 'opcion: 2'
      texto:
        titulo: EL EMMANUEL REY PACÍFICO
        texto: |-
          En aquellos días, habló el Señor a Ajaz, diciendo:

          «Pide una señal al Señor, tu Dios: en lo hondo del abismo o en lo alto del cielo.»

          Respondió Ajaz:

          «No la pido, no quiero tentar al Señor.»

          Entonces dijo Isaías:

          «Escucha, heredero de David: ¿No os basta cansar a los hombres, que cansáis incluso a mi Dios? Pues el Señor, por su cuenta, os dará él mismo una señal. Mirad: la joven ha concebido y dará a luz un hijo, y le pondrá por nombre Emmanuel, porque tenemos a Dios-con-nosotros.

          Saldrá un renuevo del tronco de Jesé, y de su raíz brotará un vástago. Sobre él se posará el espíritu del Señor: espíritu de sabiduría y de inteligencia, espíritu de consejo y de fortaleza, espíritu de ciencia y de temor del Señor.

          No juzgará por apariencias ni sentenciará sólo de oídas; juzgará a los pobres con justicia, con rectitud a los desamparados. Herirá al violento con la vara de su boca, y al malvado con el aliento de sus labios. La justicia será el ceñidor de su cintura, y la lealtad el cinturón de sus caderas.

          Habitará el lobo con el cordero, y la pantera se echará con el cabrito, el novillo y el león pacerán juntos: y un niño pequeño los conducirá. La vaca pastará con el oso, sus crías yacerán juntas; el león comerá paja con el buey. El niño jugará junto al agujero del áspid, la criatura meterá la mano en el escondrijo de la serpiente. Nadie hará daño ni estrago por todo mi Monte Santo: porque estará lleno el país de ciencia del Señor, como las aguas colman el mar.»
        ref: Del libro del profeta Isaías 7, 10-14; 8, 10; 11, 1-9
