    lectura1:
      titulo: ESTOS SON LOS QUE VIENEN DE LA GRAN TRIBULACIÓN
      texto: |-
        En aquellos días, yo, Juan, vi una muchedumbre inmensa, que nadie podría contar, de toda nación, razas, pueblos y lenguas, de pie delante del trono y del Cordero, vestidos con vestiduras blancas y con palmas en sus manos. Y gritaban con voz potente: ¡La salvación es de nuestro Dios, que está sentado en el trono, y del Cordero!

        Y todos los ángeles que estaban alrededor del trono y de los ancianos y de los cuatro vivientes, cayeron rostro a tierra ante el trono, y adoraron a Dios, diciendo: Amén. La bendición y la gloria y la sabiduría y la acción de gracias y el honor y el poder y la fuerza son de nuestro Dios, por los siglos de los siglos. Amén.

        Y uno de los ancianos me dijo: Esos que están vestidos con vestiduras blancas ¿quiénes son y de dónde han venido? Yo le respondí: Señor mío, tú lo sabrás: Él me respondió: Estos son los que vienen de la gran tribulación: han lavado y blanqueado sus mantos en la sangre del Cordero. Por eso están ante el trono de Dios dándole culto día y noche en su templo. El que se sienta en el trono acampará entre ellos. Ya no pasarán hambre ni sed, no les hará daño el sol ni el bochorno. Porque el Cordero que está delante del trono será su pastor, y los conducirá hacia fuentes de aguas vivas. Y Dios enjugará las lágrimas de sus ojos.
