apostoles:
  nombre: Común de apóstoles
  himno: ¡Guardadnos en la fe y en la unidad
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder.
  - - R
    - Y las maravillas que realizó.
  lectura1:
    titulo: SIGAMOS EL EJEMPLO DEL APÓSTOL, COMO ÉL SUGUIÓ EL DE CRISTO
    texto: |-
      Hermanos: Que la gente sólo vea en nosotros servidores de Cristo y administradores de los misterios de Dios. Ahora, en un administrador lo que se busca es que sea fiel. Por lo que a mí se refiere, me importa muy poco ser juzgado por vosotros o por cualquier tribunal humano. Ni siquiera yo mismo juzgo mi actuación. Cierto que mi conciencia nada me reprocha, mas no por eso me creo justificado. Mi juez será el Señor. No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.

      Estas verdades, hermanos, las he expuesto por vuestro provecho, aplicándolas a mi persona y a Apolo. Así, por esta aplicación, aprenderéis aquello de: «No más de lo que está escrito», a fin de que nadie se enorgullezca de un apóstol y desprecie a otro. Porque, ¿quién es el que te distingue? ¿Qué tienes que no hayas recibido? Y, si lo recibiste, ¿por qué te glorías como si no lo hubieras recibido? ¡Ya estáis satisfechos! ¡Os habéis hecho ya ricos! ¡Habéis ganado un reino sin ayuda nuestra! ¡Ya lo podíais haber ganado! ¡Así tendríamos nosotros parte en vuestro reino!

      Por lo que veo, Dios nos ha asignado a los apóstoles el último lugar, como a condenados a muerte; porque hemos venido a ser el espectáculo del mundo, de los ángeles y de los hombres. Nosotros somos insensatos por Cristo, vosotros sensatos en Cristo; nosotros débiles, vosotros fuertes; vosotros estimados, nosotros despreciados. Todavía ahora pasamos hambre, sed y desnudez. Somos maltratados y arrojados de una parte a otra, y nos fatigamos trabajando con nuestras manos. Cuando nos maldicen, bendecimos; cuando nos persiguen, soportamos; cuando nos injurian, respondemos con dulzura. Hemos venido a ser hasta ahora como basura del mundo, como el desecho de la humanidad.

      No os escribo esto para confundiros, sino para amonestaros como a hijos míos carísimos. Aunque tengáis, en efecto, diez mil maestros que os lleven a Cristo, de hecho sólo tenéis un padre. Yo os engendré para Cristo por la predicación del evangelio.

      Os exhorto, pues, a que seáis mis imitadores, como yo ¡mito a Cristo.
    ref: De la primera carta del apóstol san Pablo a los Corintios 4, 1-16
  resp1:
    ref: Jn 15, 15; Mt 13, 11. 16
    vr:
    - - R
      - Ya no os llamaré siervos; os he llamado amigos, * porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
    - - V
      - A vosotros ha concedido Dios conocer los misterios del reino de los cielos; dichosos vuestros ojos porque ven, y vuestros oídos porque oyen.
    - - R
      - Porque todo cuanto me ha comunicado el Padre os lo he dado a conocer. La segunda lectura es del Propio de los santos. En las solemnidades y fiestas, después del segundo responsorio se dice el himno Te Deum. La oración como en el Propio de los santos.
varios-martires:
  nombre: 'Común de mártires: para varios mártires'
  himno: Pléyade santa y noble de mártires insignes
  salmodia:
  - ant: Los mártires derramaron su sangre por Cristo y consiguieron así el premio eterno.
    salmo: salmo-2
  - ant: Los justos viven eternamente y han recibido de Dios su recompensa.
    salmo: salmo-32-i
  - ant: Vosotros, mis santos, que luchasteis en el mundo, recibiréis la recompensa de vuestro esfuerzo.
    salmo: salmo-32-ii
  versiculo:
  - - V
    - Nosotros esperamos en el Señor.
  - - R
    - Él es nuestro auxilio y escudo.
  lectura1:
    titulo: NADA PUEDE APARTARNOS DEL AMOR DE DIOS MANIFESTADO EN CRISTO JESÚS
    texto: |-
      Hermanos: Los padecimientos de esta vida presente tengo por cierto que no son nada en comparación con la gloria futura que se ha de revelar en nosotros. La creación entera está en expectación suspirando por esa manifestación gloriosa de los hijos de Dios; porque las creaturas todas quedaron sometidas al desorden, no porque a ello tendiesen de suyo, sino por culpa del hombre que las sometió. Y abrigan la esperanza de quedar ellas, a su vez, libres de la esclavitud de la corrupción, para tomar parte en la libertad gloriosa que han de recibir los hijos de Dios.

      La creación entera, como bien lo sabemos, va suspirando y gimiendo toda ella, hasta el momento presente, como con dolores de parto. Y no es ella sola, también nosotros, que poseemos las primicias del Espíritu, suspiramos en nuestro interior, anhelando la redención de nuestro cuerpo. Sólo en esperanza poseemos esta salvación; ahora bien, una esperanza, cuyo objeto estuviese ya a la vista, no sería ya esperanza. Pues, ¿cómo es posible esperar una cosa que está ya a la vista? Pero, si estamos esperando lo que no vemos, lo esperamos con anhelo y constancia.

      De la misma manera, el Espíritu acude en ayuda de nuestra debilidad, pues no sabemos pedir como conviene; y el Espíritu mismo aboga por nosotros con gemidos que no pueden ser expresados en palabras. Y aquel que escudriña los corazones sabe cuáles son los deseos del Espíritu y que su intercesión en favor de los fieles es según el querer de Dios.

      Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.

      ¿Qué decir a todo esto? Si Dios está con nosotros, ¿quién estará contra nosotros? El que no perdonó a su propio Hijo, sino que lo entregó a la muerte por todos nosotros, ¿cómo no nos dará con él todo lo demás? ¿Quién se atreverá a acusar a los elegidos de Dios? Siendo Dios quien justifica, ¿quién podrá condenar? ¿Acaso Cristo Jesús, el que murió por nosotros? Más aún, ¿el que fue resucitado y está a la diestra de Dios intercediendo por nosotros? ¿Quién podrá apartarnos del amor de Cristo? ¿La aflicción? ¿La angustia? ¿La persecución? ¿El hambre? ¿La desnudez? ¿El peligro? ¿La espada? (Como dice la Escritura: «Por tu causa nos llevan a la muerte uno y otro día; nos tratan como a ovejas que van al matadero.») Pero en todo esto vencemos fácilmente por aquel que nos ha amado.

      Pues estoy convencido de que ni muerte, ni vida, ni ángeles, ni principados, ni presente, ni futuro, ni potencias, ni altura, ni profundidad, ni creatura alguna, podrá apartarnos del amor de Dios manifestado en Cristo Jesús, Señor nuestro.
    ref: De la carta del apóstol san Pablo a los Romanos 8, 18-39
  resp1:
    ref: Mt 5, 44-45. 48
