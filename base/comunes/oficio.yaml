virgen-maria:
  nombre: Común de la Santísima Virgen María
  himno: María, pureza en vuelo
  salmodia:
  - ant: María ha recibido la bendición del Señor y la misericordia de Dios, su salvador.
    salmo: salmo-23
  - ant: El Altísimo consagra su morada.
    salmo: salmo-45
  - ant: ¡Qué pregón tan glorioso para ti, Virgen María!
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas.
  - - R
    - Meditándolas en su corazón.
  lectura1:
    titulo: ORÁCULO DEL PROFETA NATÁN
    texto: |-
      En aquellos días, morando ya David en su casa, dijo a Natán, profeta:

      «Mira, yo habito en una casa de cedro, mientras el arca de la alianza del Señor está bajo pieles.»

      Respondió Natán a David:

      «Haz todo cuanto tienes en tu corazón, porque Dios está contigo.»

      Pero aquella misma noche vino la palabra de Dios a Natán en estos términos:

      «Vete y di a mi siervo David: Así dice el Señor: No serás tú quien me edifique Casa para que habite yo en ella. Pues no he habitado en casa alguna desde el día en que hice subir a los israelitas hasta el día de hoy; sino que he andado de tienda en tienda y de morada en morada. En todo el tiempo que he ido de un lado para otro con todo Israel, ¿he dicho acaso a alguno de los Jueces de Israel, a los que mandé me apacentaran a mi pueblo: Por qué no me edificáis una Casa de cedro?

      Di, pues, ahora esto a mi siervo David:

      Así habla el Señor de los ejércitos: Yo te he tomado del pastizal, de detrás del rebaño, para que seas caudillo de mi pueblo Israel. He estado contigo donde quiera que has ido, he eliminado a todos tus enemigos de delante de ti y voy a hacerte un nombre grande como el nombre de los grandes de la tierra. Fijaré un lugar a mi pueblo Israel, y lo plantaré allí para que more en él; no será ya perturbado, y los malhechores no seguirán oprimiéndole como al principio, y como en los días en que instituí Jueces sobre mi pueblo Israel. Someteré a todos tus enemigos. El Señor te anuncia que te edificará una casa.

      Cuando se cumplan tus días para ir con tus padres, afirmaré después de ti la descendencia que saldrá de tus entrañas y consolidaré su reino. Él me edificará una casa y yo afirmaré su trono para siempre. Yo seré para él un padre, y él será para mí un hijo, y no apartaré de él mi amor, como le aparté de aquel que fue antes de ti. Yo le estableceré en mi casa y en mi reino para siempre, y su trono estará firme eternamente.»

      Conforme a todas estas palabras, y conforme a toda esta visión, habló Natán a David.
    ref: Del primer libro de las Crónicas 17, 1-15
