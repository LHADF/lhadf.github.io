  variantes:
    lectura1:
    - etiqueta: 'En tiempo de Cuaresma:'
      texto:
        titulo: LA DEDICACIÓN DEL TEMPLO
        texto: |-
          En aquellos días, Salomón reunió junto a él en Jerusalén, a los ancianos de Israel, a todos los jefes de las tribus y a los príncipes de las casas paternas de los israelitas, para subir el Arca de la Alianza del Señor desde la Ciudad de David, o sea, desde Sión. Todos los hombres de Israel se reunieron junto al rey Salomón en el mes de Etaním —el séptimo mes— durante la Fiesta. Cuando llegaron todos los ancianos de Israel, los sacerdotes levantaron el Arca, y subieron el Arca del Señor, con la Carpa del Encuentro y todos los objetos sagrados que había en la Carpa. Los que trasladaron todo eso fueron los sacerdotes y los levitas.

          Mientras los sacerdotes salían del Santo, la nube llenó la Casa del Señor, de manera que los sacerdotes no pudieron continuar sus servicios a causa de la nube, porque la gloria del Señor llenaba la Casa. Entonces Salomón dijo: "El Señor ha decidido habitar en la nube oscura. Sí, yo te he construido la Casa de tu señorío, un lugar donde habitarás para siempre".

          Salomón se puso ante el altar del Señor, frente a toda la asamblea de Israel, extendió sus manos hacia el cielo y dijo: “Señor, Dios de Israel, ni arriba en el cielo ni abajo en la tierra hay un Dios como tú, que mantienes la Alianza y eres fiel con tus servidores, cuando caminan delante de ti de todo corazón. Tú has cumplido, en favor de mi padre David, la promesa que le habías hecho, y hoy mismo has realizado con tu mano lo que había dicho tu boca. Y ahora, Señor, Dios de Israel, cumple en favor de tu servidor David, mi padre, la promesa que le hiciste, diciendo: 'Nunca te faltará un descendiente que esté sentado delante de mí en el trono de Israel, con tal que tus hijos vigilen su conducta, caminando en mi presencia como has caminado tú'.

          Y ahora, Dios de Israel, que se verifique la promesa que hiciste a mi padre, tu servidor David. Pero, ¿es posible que Dios habite realmente en la tierra? Si el cielo y lo más alto del cielo no pueden contenerte, ¡cuánto menos esta Casa que yo he construido! No obstante, Señor, Dios mío, vuelve tu rostro hacia la oración y la súplica de tu servidor, y escucha el clamor y la oración que te dirige hoy tu servidor. Que tus ojos estén abiertos día y noche sobre esta Casa, sobre el lugar del que tú dijiste: 'Allí residirá mi Nombre'. ¡Escucha la oración que tu servidor dirige hacia este lugar! ¡Escucha la súplica y la oración que tu servidor y tu pueblo Israel dirijan hacia este lugar! ¡Escucha desde tu morada en el cielo, escucha y perdona!”
        ref: Del primer libro de los reyes 8, 1-4. 10-13. 22-30
    - etiqueta: 'opcion: 2'
      texto:
        titulo: COMO PIEDRAS VIVAS, ENTRÁIS EN LA CONSTRUCIÓN DEL TEMPLO DEL ESPÍRITU
        texto: |-
          Hermanos: Después de haberos despojado de oda maldad y de toda falsedad, de las hipocresías y envidias, y de toda clase de murmuración, apeteced, como niños recién nacidos, la leche pura espiritual. Con ella podréis crecer hasta alcanzar la salvación, si es que realmente habéis saboreado lo bueno que es el Señor.

          Acercándoos al Señor, la piedra viva, rechazada por los hombres, pero escogida y apreciada por Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo. Por eso se lee en la Escritura: «Ved que pongo en Sión una piedra angular escogida y preciosa. Y quien tenga fe en ella no será defraudado.»

          Por consiguiente, a vosotros, que tenéis fe, os corresponde el honor; mas, para los que no tienen fe, «la piedra que desecharon los arquitectos es ahora la piedra angular, y ha venido a ser piedra de tropiezo y roca de escándalo». Y tropiezan en ella porque no tienen fe en la palabra de Cristo, para la cual estaban destinados.

          Vosotros, en cambio, sois «linaje escogido, sacerdocio regio, nación santa, pueblo adquirido por Dios, para proclamar las hazañas del que os llamó a salir de la tiniebla y a entrar en su luz maravillosa». Vosotros, que en otro tiempo «njo erais pueblo», sois ahora «pueblo de Dios»; vosotros, que estabais «excluidos de la misericordia», sois ahora «objeto de la misericordia de Dios».

          Hermanos, os exhorto a que, como forasteros y peregrinos que sois, os abstengáis de las pasiones terrenas que hacen guerra al alma. Observad entre los gentiles una conducta ejemplar. Así, por aquello mismo en que os calumnian como a malhechores, darán gloria a Dios, cuando vean y consideren vuestras buenas obras, el día en que él venga a «visitarlos» con su gracia.

          Sed sumisos a toda humana autoridad a causa del Señor: ya sea al soberano, en cuanto que tiene el mando; o bien a los gobernadores, como delegados suyos que son para castigar a los malhechores y para alabanza de los hombres de bien. Porque ésta es la voluntad de Dios: que, obrando el bien, hagáis callar a la ignorancia de los hombres insensatos. Portaos en esto como hombres libres, no como quienes se sirven de la libertad sólo para ocultar su maldad, sino como conviene a los que son siervos de Dios. Sed deferentes con todos, amad a vuestros hermanos, temed a Dios y honrad al soberano.
        ref: De la primera carta del apóstol san Pedro 2, 1-17
    resp1:
    - etiqueta: 'En tiempo de Cuaresma:'
      texto:
        ref: Mt 18, 19-20; 2Cro 7, 15
