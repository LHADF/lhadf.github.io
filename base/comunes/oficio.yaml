      vr:
      - - R
        - Un letrado que entiende del reino de los cielos * es como un padre de familia que va sacando del arca lo nuevo y lo antiguo.
      - - V
        - En corazón sensato habita la sabiduría, aun en medio de necios se da a conocer. Aleluia.
      - - R
        - Es como un padre de familia que va sacando del arca lo nuevo y lo antiguo.
  variantes:
    lectura1:
    - etiqueta: 'En tiempo de cuaresma:'
      texto:
        titulo: EL HOMBRE SABIO, CONOCEDOR DE LAS ESCRITURAS
        texto: |-
          Oré, y me fue dada la prudencia, supliqué, y descendió sobre mí el espíritu de la Sabiduría. La preferí a los cetros y a los tronos, y tuve por nada las riquezas en comparación con ella. No la igualé a la piedra más preciosa, porque todo el oro, comparado con ella, es un poco de arena; y la plata, a su lado, será considerada como barro. La amé más que a la salud y a la hermosura, y la quise más que a la luz del día, porque su resplandor no tiene ocaso.

          Junto con ella me vinieron todos los bienes, y ella tenía en sus manos una riqueza incalculable. Yo gocé de todos esos bienes, porque la Sabiduría es la que los dirige, aunque ignoraba que ella era su madre. La aprendí con sinceridad y la comunico sin envidia, y a nadie le oculto sus riquezas. Porque ella es para los hombres un tesoro inagotable: los que la adquieren se ganan la amistad de Dios, ya que son recomendados a él por los dones de la instrucción. Invocación a Dios, fuente de Sabiduría.

          Que Dios me conceda hablar con inteligencia, y que mis pensamientos sean dignos de los dones recibidos, porque él mismo es el guía de la Sabiduría y el que dirige a los sabios. En sus manos estamos nosotros y nuestras palabras, y también todo el saber y la destreza para obrar.

          Pues hay en ella un espíritu inteligente, santo, único, múltiple, sutil, ágil, perspicaz, inmaculado, claro, impasible, amante del bien, agudo, incoercible, bienhechor, amigo del hombre, firme, seguro, sereno, que todo lo puede, todo lo observa, penetra todos los espíritus, los inteligentes, los puros, los más sutiles. Porque a todo movimiento supera en movilidad la sabiduría, todo lo atraviesa y penetra en virtud de su pureza.

          Es un hálito del poder de Dios, una emanación pura de la gloria del Todopoderoso, por lo que nada manchado llega a alcanzarla. Es un reflejo de la luz eterna, un espejo sin mancha de la actividad de Dios, una imagen de su bondad.

          Aun siendo sola, lo puede todo; salir de sí misma, todo lo renueva; en todas las edades entra en las almas santas y forma en ellas amigos de Dios y profetas, porque Dios no ama sino a quien vive con la sabiduría. Es ella, en efecto, más bella que el sol, supera a todas las constelaciones; comparada con la luz sale vencedora, porque a la luz sucede la noche, pero contra la sabiduría no prevalece la maldad.
        ref: Del libro de la Sabiduría 7, 7-16. 22-30
    - etiqueta: 'opcion: 2'
      texto:
        titulo: EL HOMBRE SABIO, CONOCEDOR DE LAS ESCRITURAS
        texto: |-
          El que se entrega de lleno a meditar la ley del Altísimo indaga la sabiduría de sus predecesores y estudia las profecías, examina las explicaciones de autores famosos y penetra por parábolas intrincadas, indaga el misterio de proverbios y da vueltas a enigmas.

          Presta servicio ante los poderosos y se presenta ante los jefes; viaja por países extranjeros, probando el bien y el mal de los hombres; madruga por el Señor, su creador, y reza delante del Altísimo; abre la boca para suplicar, pidiendo perdón de sus pecados.

          Si el Señor lo quiere, él se llenará de espíritu de inteligencia; Dios le hará derramar sabias palabras, y él confesará al Señor en su oración. Dios guiará sus consejos prudentes, y él meditará sus misterios; Dios le comunicará su doctrina y enseñanza, y él se gloriará de la ley del Altísimo.

          Muchos alabarán su inteligencia, que no perecerá jamás; nunca faltará su recuerdo, y su fama vivirá por generaciones. Los pueblos contarán su sabiduría y la asamblea anunciará su alabanza.
        ref: Del libro de Ben Sirá 39, 1-14
    resp1:
    - etiqueta: 'En tiempo de cuaresma:'
      texto:
        ref: Sab 7, 7-8; Sant 1, 5
        vr:
        - - R
          - Oré, y me fue dada la prudencia, * supliqué, y descendió sobre mí el espíritu de la Sabiduría.
        - - V
          - Si a alguno de vosotros le falta sabiduría, que la pida a Dios, y la recibirá, porque él la da a todos generosamente, sin exigir nada en cambio.
        - - R
          - Supliqué, y descendió sobre mí el espíritu de la Sabiduría.
    - etiqueta: 'opcion: 2'
      texto:
        ref: Sir 15, 5-6
        vr:
        - - R
          - En la asamblea le da la palabra, * y el Señor lo llena de espíritu, sabiduría e inteligencia.
        - - V
          - Alcanzará gozo y alegría.
        - - R
          - Y el Señor lo llena de espíritu, sabiduría e inteligencia.
virgenes:
  nombre: Común de vírgenes
  himno: Esta mujer no quiso
  salmodia:
  - ant: Virgen ilustre, sensata, prudente en tu decisión, tienes como esposo del alma al Verbo inmaculado.
    salmo: salmo-18-a
  - ant: Por amor a mi Señor Jesucristo, tuve en nada los bienes de este mundo y del tiempo presente.
    salmo: salmo-44-i
  - ant: Prendado está el rey de tu belleza, porque él es tu Señor y tu Dios.
    salmo: salmo-44-ii
  versiculo:
  - - V
    - Me enseñarás el sendero de la vida.
  - - R
    - Me saciarás de gozo en tu presencia.
  lectura1:
    titulo: LA VIRGINIDAD CRISTIANA
    texto: |-
      Hermanos: Respecto al celibato no tengo órdenes del Señor, sino que doy mi parecer como hombre de fiar que soy, por la misericordia del Señor. Estimo que es un bien, por la necesidad actual: quiero decir que es un bien vivir así.

      ¿Estás unido a una mujer? No busques la separación. ¿Estás libre? No busques mujer; aunque si te casas, no haces mal; y si una soltera se casa, tampoco hace mal. Pero estos tales sufrirán la tribulación de la carne. Yo respeto vuestras razones.

      Os digo esto, hermanos: el momento es apremiante. Queda como solución: que los que tienen mujer vivan como si no la tuvieran; los que lloran, como si no lloraran; los que están alegres, como si no lo estuvieran; los que compran, como si no poseyeran; los que negocian en el mundo, como si no disfrutaran de él: porque la presentación de este mundo se termina.

      Quiero que os ahorréis preocupaciones: el célibe se preocupa de los asuntos del Señor, buscando contentar al Señor; en cambio, el casado se preocupa de los asuntos del mundo, buscando contentar a su mujer, y anda dividido. Lo mismo, la mujer sin marido y la soltera se preocupan de los asuntos del Señor, consagrándose a ellos en cuerpo y alma; en cambio, la casada se preocupa de los asuntos del mundo, buscando contentar a su marido. Os digo todo esto para vuestro bien, no para poneros una trampa, sino para induciros a una cosa noble y al trato con el Señor sin preocupaciones.

      Si, a pesar de todo, alguien cree faltar a la conveniencia respecto de su doncella, por estar en la flor de su edad, y conviene proceder así, haga lo que quiera, no hace mal; cásense. Mas el que permanece firme en su corazón, y sin presión alguna y en pleno uso de su libertad está resuelto en su interior a guardar a su doncella, hará bien. Así pues, el que casa a su doncella obra bien. Y el que no la casa obra mejor.

      La mujer está ligada a su marido mientras él viva; mas una vez muerto el marido, queda libre para casarse con quien quiera, pero en el Señor. Sin embargo, será más feliz si permanece así según mi consejo; que yo también creo tener el Espíritu de Dios.
    ref: De la primera carta del apóstol san Pablo a los Corintios 7, 25-40
  resp1:
    ref: null
    vr:
    - - R
      - Prendado está el rey de tu belleza, obra de sus manos; él es tu Dios y tu rey. * Tu rey es al mismo tiempo tu esposo.
    - - V
