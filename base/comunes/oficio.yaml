    lectura1:
      titulo: LOS APÓSTOLES EN LA IGLESIA PRIMITIVA
      texto: |-
        En aquel tiempo, los Apóstoles hacían muchos signos y prodigios en el pueblo. Todos solían congregarse unidos en un mismo espíritu, bajo el pórtico de Salomón, pero ningún otro se atrevía a unirse al grupo de los Apóstoles, aunque el pueblo hablaba muy bien de ellos. Aumentaba cada vez más el número de los que creían en el Señor, tanto hombres como mujeres. Y hasta sacaban a los enfermos a las calles, poniéndolos en catres y camillas, para que cuando Pedro pasara, por lo menos su sombra cubriera a alguno de ellos. La multitud acudía también de las ciudades vecinas a Jerusalén, trayendo enfermos o poseídos por espíritus impuros, y todos quedaban curados.

        Intervino entonces el Sumo Sacerdote con todos sus partidarios, los de la secta de los saduceos. Llenos de envidia, hicieron arrestar a los Apóstoles y los enviaron a la prisión pública. Pero durante la noche, el Ángel del Señor abrió las puertas de la prisión y los hizo salir. Luego les dijo: "Id al Templo y anunciad al pueblo todo lo que se refiere a esta nueva vida".

        Los Apóstoles, obedeciendo la orden, entraron en el Templo en las primeras horas del día, y se pusieron a enseñar. Entre tanto, llegaron el Sumo Sacerdote y sus partidarios, convocaron al Sanedrín y a todo el Senado del pueblo de Israel, y mandaron a buscarlos a la cárcel. Cuando llegaron los guardias a la prisión, no los encontraron. Entonces volvieron y dijeron: "Encontramos la prisión cuidadosamente cerrada y a los centinelas de guardia junto a las puertas, pero cuando las abrimos, no había nadie adentro".

        Al oír esto, el jefe del Templo y los sumos sacerdotes quedaron perplejos y no podían explicarse qué había sucedido. En ese momento llegó uno, diciendo: "Los hombres que habéis arrestado, están en el Templo y enseñan al pueblo". El jefe de la guardia salió con sus hombres y trajeron a los Apóstoles, pero sin violencia, por temor de ser apedreados por el pueblo.

        Los hicieron comparecer ante el Sanedrín, y el Sumo Sacerdote les dijo: "Nosotros os habíamos prohibido expresamente predicar en ese nombre, y vosotros habéis llenado Jerusalén con su doctrina. ¡Así queréis hacer recaer sobre nosotros la sangre de ese hombre!" Pedro, junto con los Apóstoles, respondió: "Hay que obedecer a Dios antes que a los hombres. El Dios de nuestros padres ha resucitado a Jesús, al que vosotros crucificasteis. Pero Dios lo exaltó con su poder, haciéndolo príncipe y Salvador, a fin de conceder a Israel la conversión y el perdón de los pecados. Nosotros somos testigos de esto, y el Espíritu Santo que Dios ha enviado a los que le obedecen".
      ref: De los Hechos de los Apóstoles 5, 12-32
    resp1:
      ref: Act 4, 33. 31
      vr:
      - - R
        - Los apóstoles daban testimonio con mucho poder de la resurrección del Señor Jesús * y la gracia de Dios abundaba en todos ellos, aleluia.
      - - V
        - Llenos del Espíritu Santo, anunciaban con firmeza la Palabra de Dios.
      - - R
        - Y la gracia de Dios abundaba en todos ellos, aleluia.
  variantes:
    lectura1:
    - etiqueta: 'En tiempo de cuaresma:'
      texto:
        titulo: LOS APÓSTOLES PREDICAN LA CRUZ
        texto: |-
          Hermanos: El mensaje de la cruz es una locura para los que se pierden, pero para los que se salvan —para nosotros— es fuerza de Dios. Porque está escrito: Destruiré la sabiduría de los sabios y rechazaré la ciencia de los inteligentes. ¿Dónde está el sabio? ¿Dónde el hombre culto? ¿Dónde el razonador sutil de este mundo? ¿Acaso Dios no ha demostrado que la sabiduría del mundo es una necedad?

          En efecto, ya que el mundo, con su sabiduría, no reconoció a Dios en las obras que manifiestan su sabiduría, Dios quiso salvar a los que creen por la locura de la predicación. Mientras los judíos piden milagros y los griegos van en busca de sabiduría, nosotros, en cambio, predicamos a un Cristo crucificado, escándalo para los judíos y locura para los paganos, pero fuerza y sabiduría de Dios para los que han sido llamados, tanto judíos como griegos. Porque la locura de Dios es más sabia que la sabiduría de los hombres, y la debilidad de Dios es más fuerte que la fortaleza de los hombres.

          Hermanos, tened en cuenta quiénes son los que han sido llamados: no hay entre vosotros muchos sabios, hablando humanamente, ni son muchos los poderosos ni los nobles. Al contrario, Dios eligió lo que el mundo tiene por necio, para confundir a los sabios; lo que el mundo tiene por débil, para confundir a los fuertes; lo que es vil y despreciable y lo que no vale nada, para aniquilar a lo que vale. Así, nadie podrá gloriarse delante de Dios. Por él, estáis unidos a Cristo Jesús, que por disposición de Dios, se convirtió para nosotros en sabiduría y justicia, en santificación y redención, a fin de que, como está escrito: El que se gloría, que se gloríe en el Señor.

          Por mi parte, hermanos, cuando os visité para anunciaros el misterio de Dios, no llegué con el prestigio de la elocuencia o de la sabiduría. Al contrario, no quise saber nada, fuera de Jesucristo, y Jesucristo crucificado. Por eso, me presenté a vosotros débil, temeroso y vacilante. Mi palabra y mi predicación no tenían nada de la argumentación persuasiva de la sabiduría humana, sino que eran demostración del poder del Espíritu, para que vosotros no basarais vuestra fe en la sabiduría de los hombres, sino en el poder de Dios.
        ref: De la primera carta del apóstol san Pablo a los Corintios 1, 18-2, 5
    - etiqueta: 'opcion: 2'
      texto:
        titulo: SIGAMOS EL EJEMPLO DEL APÓSTOL, COMO ÉL SUGUIÓ EL DE CRISTO
        texto: |-
          Hermanos: Que la gente sólo vea en nosotros servidores de Cristo y administradores de los misterios de Dios. Ahora, en un administrador lo que se busca es que sea fiel. Por lo que a mí se refiere, me importa muy poco ser juzgado por vosotros o por cualquier tribunal humano. Ni siquiera yo mismo juzgo mi actuación. Cierto que mi conciencia nada me reprocha, mas no por eso me creo justificado. Mi juez será el Señor. No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.

          Estas verdades, hermanos, las he expuesto por vuestro provecho, aplicándolas a mi persona y a Apolo. Así, por esta aplicación, aprenderéis aquello de: «No más de lo que está escrito», a fin de que nadie se enorgullezca de un apóstol y desprecie a otro. Porque, ¿quién es el que te distingue? ¿Qué tienes que no hayas recibido? Y, si lo recibiste, ¿por qué te glorías como si no lo hubieras recibido? ¡Ya estáis satisfechos! ¡Os habéis hecho ya ricos! ¡Habéis ganado un reino sin ayuda nuestra! ¡Ya lo podíais haber ganado! ¡Así tendríamos nosotros parte en vuestro reino!

          Por lo que veo, Dios nos ha asignado a los apóstoles el último lugar, como a condenados a muerte; porque hemos venido a ser el espectáculo del mundo, de los ángeles y de los hombres. Nosotros somos insensatos por Cristo, vosotros sensatos en Cristo; nosotros débiles, vosotros fuertes; vosotros estimados, nosotros despreciados. Todavía ahora pasamos hambre, sed y desnudez. Somos maltratados y arrojados de una parte a otra, y nos fatigamos trabajando con nuestras manos. Cuando nos maldicen, bendecimos; cuando nos persiguen, soportamos; cuando nos injurian, respondemos con dulzura. Hemos venido a ser hasta ahora como basura del mundo, como el desecho de la humanidad.

          No os escribo esto para confundiros, sino para amonestaros como a hijos míos carísimos. Aunque tengáis, en efecto, diez mil maestros que os lleven a Cristo, de hecho sólo tenéis un padre. Yo os engendré para Cristo por la predicación del evangelio.

          Os exhorto, pues, a que seáis mis imitadores, como yo ¡mito a Cristo.
        ref: De la primera carta del apóstol san Pablo a los Corintios 4, 1-16
    resp1:
    - etiqueta: 'En tiempo de cuaresma:'
      texto:
        ref: Mt 10, 18. 19-20
        vr:
        - - R
          - Cuando os presentéis ante los reyes y los gobernadores no penséis en cómo vais a hablar, * porque en ese momento ya se os sugerirá lo que tenéis que decir.
        - - V
          - No sois vosotros los que hablaréis, sino que el Espíritu de vuestro Padre hablará en vosotros.
        - - R
          - Porque en ese momento ya se os sugerirá lo que tenéis que decir.
    - etiqueta: 'opcion: 2'
      texto:
        ref: Jn 15, 15; Mt 13, 11. 16
        vr:
        - - R
          - Ya no os llamaré siervos; os he llamado amigos, * porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
        - - V
          - A vosotros ha concedido Dios conocer los misterios del reino de los cielos; dichosos vuestros ojos porque ven, y vuestros oídos porque oyen.
        - - R
          - Porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
varios-martires:
  nombre: 'Común de mártires: para varios mártires'
  himno: Pléyade santa y noble de mártires insignes
  salmodia:
  - ant: Los santos mártires derramaron su sangre por Cristo; por ello han conseguido el premio eterno.
    salmo: salmo-32-ii
  - ant: Los justos viven eternamente, reciben de Dios su recompensa.
    salmo: salmo-32-i
  - ant: A vosotros, mis santos, que habéis luchado en este mundo, yo os daré la recompensa de vuestro esfuerzo.
    salmo: salmo-2
  versiculo:
  - - V
    - Nosotros esperamos en el Señor.
  - - R
    - Él es nuestro auxilio y escudo.
  lectura1:
    titulo: LA VIDA DE LOS JUSTOS ESTÁ EN MANOS DE DIOS
    texto: |-
      La vida de los justos está en manos de Dios y no los tocará el tormento. La gente insensata pensaba que morían, consideraba su tránsito como una desgracia, y su partida de entre nosotros como una destrucción; pero ellos están en paz.

      La gente pensaba que cumplían una pena, pero ellos esperaban de lleno la inmortalidad; sufrieron pequeños castigos, recibirán grandes favores, porque Dios los puso a prueba y los halló dignos de sí; los probó como oro en crisol, los recibió como sacrificio de holocausto; a la hora de la cuenta resplandecerán como chispas que prenden por un cañaveral; gobernarán naciones, someterán pueblos, y el Señor reinará sobre ellos eternamente.

      Los que confían en él comprenderán la verdad, los fieles a su amor seguirán a su lado; porque quiere a sus devotos, se apiada de ellos y mira por sus elegidos.

      Los impíos serán castigados por sus razonamientos: menospreciaron al justo y se apartaron del Señor; desdichado el que desdeña la sabiduría y la instrucción: vana es su esperanza, baldíos sus afanes e inútiles sus obras; necias son sus mujeres, depravados sus hijos y maldita su posteridad.

      Dichosa la estéril irreprochable que desconoce la unión pecaminosa: alcanzará su fruto el día de la cuenta; y el eunuco que no cometió delitos con sus manos ni tuvo malos deseos contra el Señor: por su fidelidad recibirá favores extraordinarios y un lote codiciable en el templo del Señor. Pues quien se afana por el bien obtiene frutos espléndidos; la sensatez es tronco inconmovible.
    ref: Del libro de la Sabiduría 3, 1-15
  resp1:
    ref: Cf. Ef 4, 4. 5
    vr:
    - - R
      - Muchos santos derramaron por el Señor su sangre gloriosa, amaron a Cristo durante su vida, lo imitaron en la muerte. * Por esto merecieron la corona del triunfo.
    - - V
      - Tenían un solo espíritu y una sola fe.
    - - R
      - Por esto merecieron la corona del triunfo.
  lectura2:
    titulo: LOS QUE DESEAMOS ALCANZAR LAS PROMESAS DEL SEÑOR DEBEMOS IMITARLE EN TODO
    texto: |-
      Os saludo, queridos hermanos, y desearía gozar de vuestra presencia, pero la dificultad de entrar en vuestra cárcel no me lo permite. Pues, ¿qué otra cosa más deseada y gozosa pudiera ocurrirme que no fuera unirme a vosotros, para que me abrazarais con aquellas manos que, conservándose puras, inocentes y fieles a la fe del Señor, han rechazado los sacrificios sacrílegos?

      ¿Qué cosa más agradable y más excelsa que poder besar ahora vuestros labios, que han confesado de manera solemne al Señor, y qué desearía yo con más ardor sino estar en medio de vosotros para ser contemplado con los mismos ojos, que, habiendo despreciado al mundo, han sido dignos de contemplar a Dios?

      Pero como no tengo la posibilidad de participar con mi presencia en esta alegría, os envío esta carta, como representación mía, para que vosotros la leáis y la escuchéis. En ella os felicito, y al mismo tiempo os exhorto a que perseveréis con constancia y fortaleza en la confesión de la gloria del cielo; y, ya que habéis comenzado a recorrer el camino que recorrió el Señor, continuad por vuestra fortaleza espiritual hasta recibir la corona, teniendo como protector y guía al mismo Señor que dijo: Sabed que ya estoy con vosotros todos los días, hasta el fin del mundo.

      ¡Feliz cárcel, dignificada por vuestra presencia! ¡Feliz cárcel, que traslada al cielo a los hombres de Dios! ¡Oh tinieblas más resplandecientes que el mismo sol y más; brillantes que la luz de este mundo, donde han sido edificados los templos de Dios y santificados vuestros miembros por la confesión del nombre del Señor!

      Que ahora ninguna otra cosa ocupe vuestro corazón y vuestro espíritu sino los preceptos divinos y los mandamientos celestes, con los que el Espíritu Santo siempre os animaba a soportar los sufrimientos del martirio. Nadie se preocupe ahora de la muerte sino de la inmortalidad, ni del sufrimiento temporal sino de la gloria eterna, ya que está escrito: Mucho le place al Señor la muerte de sus fieles. Y en otro lugar: El sacrificio que agrada a Dios es un espíritu quebrantado; un corazón quebrantado y humillado, tú no lo desprecias.

      Y también, cuando la sagrada Escritura habla de los tormentos que consagran a los mártires de Dios y los santifican en la prueba, afirma: La gente pensaba que cumplían una pena, pero ellos esperaban de lleno la inmortalidad. Gobernarán naciones, someterán pueblos, y el Señor reinará sobre ellos eternamente.

      Por tanto, si pensáis que habéis de juzgar y reinar con Cristo Jesús, necesariamente debéis de regocijaros y superar las pruebas de la hora presente en vista del gozo de los bienes futuros. Pues, como sabéis, desde el comienzo del mundo las cosas han sido dispuestas de tal forma que la justicia sufre aquí una lucha con el siglo. Ya desde el mismo comienzo, el justo Abel fue asesinado, y a partir de él siguen el mismo camino los justos, los profetas y los apóstoles.

      El mismo Señor ha sido en sí mismo el ejemplar para todos ellos, enseñando que ninguno puede llegar a su reino sino aquellos que sigan su mismo camino: El que se ama a si mismo se pierde, y el que se aborrece a sí mismo en este mundo se guardará para la vida eterna. Y en otro lugar: No tengáis miedo a los que matan el cuerpo, pero no pueden matar el alma. No, temed al que puede destruir con el fuego alma y cuerpo.

      También el apóstol Pablo nos dice que todos los que deseamos alcanzar las promesas del Señor debemos imitarle en todo: Somos hijos de Dios —dice— y, si somos hijos, también herederos; herederos de Dios y coherederos con Cristo, ya que sufrimos con él para ser también con él glorificados.
    autor: |-
      De las cartas de san Cipriano, obispo y mártir
      (Carta 6,1-2: CSEL 3, 480-482)
