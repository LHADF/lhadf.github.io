  lectura1:
    titulo: RECOMENDACIONES DE PABLO SOBRE LAS CUALIDADES Y LOS DEBERES DE LOS OBISPOS
    texto: |-
      Querido hermano: Es preciso que el obispo sea irreprochable, como administrador que es de la casa de Dios: que no sea soberbio ni iracundo, ni dado al vino ni pendenciero, ni codicioso de torpes ganancias. Más bien, debe ser hospitalario, amigo de todo lo bueno, discreto, recto, religioso, dueño de sí y muy adicto al auténtico mensaje de la verdad transmitida. Así podrá exhortar y animar con sana instrucción y rebatir a los contradictores.

      Hay, en verdad, muchos insubordinados, charlatanes y embaucadores, sobre todo de entre los partidarios de la circuncisión. Es necesario irles tapando la boca, porque van revolviendo familias enteras, enseñando lo que no se debe, con la mira puesta en vergonzosas ganancias. Pero tú enseña lo que es conforme a la sana doctrina.

      Los ancianos, que sean moderados, dignos, discretos, íntegros y vigorosos en la fe, en la caridad, en la constancia. Las ancianas, de igual modo, que observen un porte religioso, como conviene a una profesión santa; que no se den a la murmuración ni al mucho vino; que sean maestras de buenas costumbres, para poder inspirar sentimientos de modestia a las más jóvenes. Así les enseñarán a ser buenas esposas y buenas madres de familia, a ser discretas, honestas, hacendosas, bondadosas, dóciles a sus maridos. Así no darán motivo para que se hable mal del Evangelio de Dios.

      Asimismo, a los jóvenes, anímalos a vivir con moderación en todas las cosas. Y tú sé modelo por tus buenas obras, con desinterés e integridad en la enseñanza, con gravedad, con genuina e incensurable doctrina, para que nuestros adversarios se vean confundidos, al no tener nada malo que decir contra nosotros.
    ref: 'Para un santo papa u obispo: De la carta del apóstol san Pablo a Tito 1, 7-11; 2, 18'
  resp1:
    ref: Hch 20, 28; 1 Co 4, 2
    vr:
    - - R
      - Tened cuidado del rebaño que el Espíritu Santo os ha encargado guardar, * como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo.
    - - V
      - En un administrador lo que se busca es que sea fiel.
    - - R
      - 'Como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Para un santo presbítero: De la primera carta del apóstol san Pedro 5, 1-11 DEBERES DE LOS PRESBÍTEROS Y DE LOS FIELES A los presbíteros en esa comunidad, yo, presbítero como ellos, testigo de los sufrimientos de Cristo y partícipe de la gloria que va a descubrirse, os exhorto: Sed pastores del rebaño de Dios a vuestro cargo, gobernándolo, no a la fuerza sino de buena gana, como Dios quiere, no por sórdida ganancia, sino con generosidad, no como dominadores sobre la heredad de Dios, sino convirtiéndoos en modelos del rebaño. Y, cuando aparezca el supremo Pastor, recibiréis la corona de gloria que no se marchita. Asimismo vosotros, jóvenes, sed sumisos a los presbíteros, y sed humildes unos con otros, porque Dios resiste a los soberbios, pero da su gracia a los humildes. Inclinaos bajo la poderosa mano de Dios, para que a su tiempo os eleve. Descargad en él todas vuestras preocupaciones, porque él se interesa
        por vosotros. Sed sobrios, estad despiertos: vuestro enemigo, el diablo, como león rugiente, ronda buscando a quien devorar; resistidle, firmes en la fe. Y sabed que la misma clase de padecimientos están sufriendo vuestros hermanos, dispersos por el mundo. Tras un breve padecer, el Dios de toda gracia, que os ha llamado a su eterna gloria en Cristo Jesús, él mismo os restablecerá, os afianzará, os robustecerá. A él la gloria y el poder, por los siglos de los siglos. Amén. Responsorio 1 Co 4, 1-2; Pr 20, 6'
    - - R
      - Que la gente sólo vea en nosotros servidores de Cristo y administradores de los misterios de Dios. * Ahora, en un administrador lo que se busca es que sea fiel.
    - - V
      - Muchos hombres se dicen piadosos, pero un hombre fiel, ¿quién lo encontrará?
    - - R
      - Ahora, en un administrador lo que se busca es que sea fiel.
  lectura2:
    titulo: EN PEDRO PERMANECE LO QUE CRISTO INSTITUYÓ
    texto: |-
      Aunque nosotros, queridos hermanos, nos vemos débiles y agobiados cuando pensamos en las obligaciones de nuestro ministerio, hasta tal punto que, al querer actuar con entrega y energía, nos sentimos condicionados por nuestra fragilidad, sin embargo, contando con la constante protección del Sacerdote eterno y todopoderoso, semejante a nosotros, pero también igual al Padre, de aquel que quiso humillarse en su divinidad hasta tal punto que la unió a nuestra humanidad para elevar nuestra naturaleza a la dignidad divina, digna y piadosamente nos gozamos de su especial providencia, pues, aunque delegó en muchos pastores el cuidado de sus ovejas, sin embargo, continúa él mismo velando sobre su amada grey.

      También nosotros recibimos alivio en nuestro ministerio apostólico de su especial y constante protección, y nunca nos vemos desprovistos de su ayuda. Es tal, en efecto, la solidez de los cimientos sobre los que se levanta el edificio de la Iglesia que, por muy grande que sea la mole del edificio que sostienen, no se resquebrajan.

      La firmeza de aquella fe del príncipe de los apóstoles, que mereció ser alabada por el Señor, es eterna. Y así como persiste lo que Pedro afirmó de Cristo, así permanece también lo que Cristo edificó sobre Pedro. Permanece, pues, lo que la Verdad dispuso, y el bienaventurado Pedro, firme en aquella solidez de piedra que le fue otorgada, no ha abandonado el timón de la Iglesia que el Señor le encomendara.

      Pedro ha sido colocado por encima de todo, de tal forma que en los mismos nombres que tiene podemos conocer hasta qué punto estaba unido a Cristo: él, en efecto, es llamado: piedra, fundamento, portero del reino de los cielos, árbitro de lo que hay que atar y desatar; por ello, hay que acatar en los cielos el fallo de las sentencias que él da en la tierra.

      Pedro sigue ahora cumpliendo con mayor plenitud y eficacia la misión que le fue encomendada, y, glorificado en Cristo y con Cristo, continúa ejerciendo los servicios que le fueron confiados.

      Si, pues, hacemos algo rectamente y lo ejecutamos con prudencia, si algo alcanzamos de la misericordia divina con nuestra oración cotidiana, es en virtud y por los méritos de aquel cuyo poder pervive en esta sede y cuya autoridad brilla en la misma.

      Todo ello es fruto, amados hermanos, de aquella confesión que, inspirada por el Padre en el corazón de Pedro, supera todas las incertidumbres de las opiniones humanas y alcanza la firmeza de la roca que no será nunca cuarteada por ninguna violencia.

      En toda la Iglesia, Pedro confiesa diariamente: Tú eres el Mesías, el Hijo de Dios vivo, y toda lengua que confiesa al Señor está guiada por el magisterio de esta confesión.
    autor: |-
      De los sermones de san León Magno, papa
      (Sermón 3 en el aniversario de su consagración episcopal, 2-3: PL 54,145-146)
  resp2:
    ref: Mt 16, 18; Sal 47, 9
    vr:
    - - R
      - 'Dijo Jesús a Simón: «Yo te digo: Tú eres Pedro, y sobre esta piedra edificaré mi Iglesia, * y los poderes del infierno no la derrotarán.»'
    - - V
      - Dios la ha fundado para siempre.
    - - R
      - 'Y los poderes del infierno no la derrotarán. Para un santo fundador de una iglesia: Del tratado de san Hilario, obispo, sobre el salmo ciento veintiséis (Núms. 7-10: PL 9, 696-697) DIOS EDIFICA Y GUARDA SU CIUDAD Si el Señor no construye la casa, en vano se cansan los albañiles. Sois templo de Dios y el Espíritu de Dios habita en vosotros. Este es, pues, el templo de Dios, lleno de su doctrina y de su poder, capaz de contener al Señor en el santuario del corazón. Sobre esto ha hablado el profeta en el salmo: Santo es tu templo, admirable por su justicia. La santidad, la justicia y la continencia humana son un templo para Dios. Dios debe, pues, construir su casa. Construida por manos de hombres, no se sostendría; apoyada en doctrinas del mundo, no se mantendría en pie; protegida por nuestros ineficaces desvelos y trabajos, no se vería segura. Esta casa debe ser construida y custodiada de manera muy diferente: no sobre la tierra ni sobre la movediza y deslizante arena, sino sobre
        sus propios fundamentos, los profetas y los apóstoles. Esta casa debe construirse con piedras vivas, debe encontrar su trabazón en Cristo, la piedra angular, debe crecer por la unión mutua de sus elementos hasta que llegue a ser el varón perfecto y consiga la medida de la plenitud del cuerpo de Cristo; debe, en fin, adornarse con la belleza de las gracias espirituales y resplandecer con su hermosura. Edificada por Dios, es decir, por su palabra, no se derrumbará. Esta casa irá creciendo en cada uno de nosotros con diversas construcciones, según las diferencias de los fieles, para dar ornato y amplitud a la ciudad dichosa. El Señor es desde antiguo el atento guardián de esta ciudad: cuando protegió a Abrahán peregrino y eligió a Isaac para el sacrificio; cuando enriqueció a su siervo Jacob y, en Egipto, ennobleció a José, vendido por sus hermanos; cuando fortaleció a Moisés contra el Faraón y eligió a Josué como jefe del ejército; cuando liberó a David de todos los peligros y concedió
        a Salomón el don de la sabiduría; cuando asistió a los profetas, arrebató a Elías y eligió a Eliseo; cuando protegió a Daniel y, en el horno, refrigeró con una brisa suave a los niños, juntándose con ellos como uno más; cuando, por medio del ángel, anunció a José que la Virgen había concebido por la fuerza divina, y confirmó a María; cuando envió como precursor a Juan y eligió a los apóstoles, y cuando rogó al Padre, diciendo: Padre santo, guárdalos en tu nombre a los que me has dado; yo guardaba en tu nombre a los que me diste; finalmente, cuando él mismo, después de su pasión, nos promete que velará siempre sobre nosotros: Yo estoy con vosotros todos los días, hasta el fin del mundo. Ésta es la protección eterna de aquella bienaventurada y santa ciudad, que, compuesta de muchos, pero formando una sola, es en cada uno de nosotros la ciudad de Dios. Esta ciudad, por tanto, debe ser edificada por Dios para que crezca hasta su completo acabamiento. Comenzar una edificación no significa
        su perfección; pero mediante la edificación se va preparando la perfección final. Responsorio 1 Pe 2, 4-5; Sal 117, 22'
    - - R
      - Acercándoos al Señor, la piedra viva, * también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo.
    - - V
      - Él es ahora la piedra angular.
    - - R
