    lectura1:
      titulo: EL GRAN SIGNO DE UNA MUJER APARECIÓ EN EL CIELO
      texto: |-
        En aquellos días, se abrió el Templo de Dios que está en el cielo y quedó a la vista el Arca de su Alianza, y hubo rayos, voces, truenos y un temblor de tierra, y cayó una fuerte granizada.

        Apareció una figura portentosa en el cielo: Una mujer vestida de sol, la luna por pedestal, coronada con doce estrellas. Estaba encinta, y gritaba entre los espasmos del parto, y por el tormento de dar a luz. Y apareció otra señal en el cielo: Un enorme dragón rojo, con siete cabezas y diez cuernos y siete diademas en las cabezas. Su cola arrastraba una tercera parte de las estrellas del cielo, y las precipitó sobre la tierra. El Dragón se puso delante de la mujer que iba a dar a luz, para devorar a su hijo en cuanto naciera. La mujer tuvo un hijo varón que debía regir a todas las naciones con un cetro de hierro. Pero el hijo fue elevado hasta Dios y hasta su trono, y la mujer huyó al desierto, donde Dios le había preparado un refugio para que allí fuera alimentada durante mil doscientos sesenta días.

        Entonces se trabó una batalla en el cielo: Miguel y sus Ángeles combatieron contra el Dragón, y este contraatacó con sus ángeles, pero fueron vencidos y expulsados del cielo. Y así fue precipitado el enorme Dragón, la antigua Serpiente, llamada Diablo o Satanás, y el seductor del mundo entero fue arrojado sobre la tierra con todos sus ángeles.

        Se oyó una gran voz en el cielo: «Ahora se estableció la salud y el poderío, y el reinado de nuestro Dios, y la potestad de su Cristo; porque fue precipitado el acusador de nuestros hermanos, el que los acusaba ante nuestro Dios día y noche. Ellos lo vencieron en virtud de la sangre del Cordero y por la palabra del testimonio que dieron, y no amaron tanto su vida que temieran la muerte. Por esto, estad alegres, cielos, y los que moráis en sus tiendas., pero ay de vosotros, tierra y mar, porque el Diablo ha descendido hasta vosotros con todo su furor, sabiendo que le queda poco tiempo!.»

        El Dragón, al verse precipitado sobre la tierra, se lanzó en persecución de la mujer que había dado a luz al hijo varón. Pero la Mujer recibió las dos alas de la gran águila para volar hasta su refugio en el desierto, donde debía ser alimentada durante tres años y medio, lejos de la serpiente. La serpiente vomitó detrás de la mujer como un río de agua, para que la arrastrara. Pero la tierra vino en ayuda de la Mujer: abrió su boca y se tragó el río que el Dragón había vomitado. Despechado el dragón por causa de la mujer, se marchó a hacer la guerra al resto de su descendencia, a los que guardan los mandamientos de Dios y mantienen el testimonio de Jesús.
      ref: Del Apocalipsis del apóstol san Juan 11, 19—12, 17
