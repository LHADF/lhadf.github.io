    lectura1:
    - etiqueta: 'Para un santo presbítero:'
      texto:
        titulo: EL BUEN COMBATE DEL PRESBÍTERO, HOMBRE DE DIOS
        texto: |-
          Querido hermano: Los presbíteros que dirigen bien merecen doble honorario, sobre todo los que se atarean predicando y enseñando; porque dice la Escritura: «No le pondrás bozal al buey que trilla», y también: «El obrero merece su jornal.» No admitas una acusación contra un presbítero, a menos que esté apoyada por dos o tres testigos. A los que pequen, repréndelos públicamente, para que los demás escarmienten.

          Por Dios, por Jesucristo y por los ángeles elegidos, te pido encarecidamente que observes estas normas, excluyendo todo prejuicio y sin ser parcial en nada. A ninguno le impongas las manos a la ligera, ni te hagas cómplice de pecados ajenos; tú, consérvate honesto.

          La codicia es la raíz de todos los males, y muchos, arrastrados por ella, se han apartado de la fe y se han acarreado muchos sufrimientos. Tú en cambio, hombre de Dios, huye de todo esto; practica la justicia, la piedad, la fe, el amor, la paciencia, la delicadeza. Combate el buen combate de la fe. Conquista la vida eterna a la que fuiste llamado, y de la que hiciste noble profesión ante muchos testigos.

          En presencia de Dios, que da la vida al universo, y de Cristo Jesús, que dio testimonio ante Poncio Pilato con tan noble profesión: te insisto en que guardes el mandamiento sin mancha ni reproche, hasta la manifestación de nuestro Señor Jesucristo.
        ref: De la primera carta del apóstol san Pablo a Timoteo 5, 17-22; 6, 10-14
    - etiqueta: 'Para un santo papa u obispo en tiempo de cuaresma:'
      texto:
        titulo: ESTRECHA RELACIÓN DE PABLO CON LA IGLESIA DE TESALÓNICA
        texto: |-
          Bien sabéis vosotros, hermanos, que nuestra ¡da a vosotros no fue estéril, sino que, después de haber padecido sufrimientos e injurias en Filipos, como sabéis, confiados en nuestro Dios, tuvimos la valentía de predicaros el Evangelio de Dios entre frecuentes luchas. Nuestra exhortación no procede del error, ni de la impureza ni con engaño, sino que así como hemos sido juzgados aptos por Dios para confiarnos el Evangelio, así lo predicamos, no buscando agradar a los hombres, sino a Dios que examina nuestros corazones.

          Nunca nos presentamos, bien lo sabéis, con palabras aduladoras, ni con pretextos de codicia, Dios es testigo, ni buscando gloria humana, ni de vosotros ni de nadie. Aunque pudimos imponer nuestra autoridad por ser apóstoles de Cristo, nos mostramos amables con vosotros, como una madre que cuida con cariño de sus hijos. De esta manera, amándoos a vosotros, queríamos daros no sólo el Evangelio de Dios, sino incluso nuestro propio ser, porque habíais llegado a sernos muy queridos.

          Pues recordáis, hermanos, nuestros trabajos y fatigas. Trabajando día y noche, para no ser gravosos a ninguno de vosotros, os proclamamos el Evangelio de Dios. Vosotros sois testigos, y Dios también, de cuán santa, justa e irreprochablemente nos comportamos con vosotros, los creyentes. Como un padre a sus hijos, lo sabéis bien, a cada uno de vosotros os exhortábamos y alentábamos, conjurándoos a que vivieseis de una manera digna de Dios, que os ha llamado a su reino y gloria.

          Continuamente damos gracias a Dios, porque, habiendo recibido la palabra de Dios predicada por nosotros, la acogisteis, no como palabra humana, sino —como es en realidad— como palabra de Dios, que ejerce su acción en vosotros, los creyentes.

          Pues ¿cuál es nuestra esperanza, nuestro gozo, la corona de la que nos sentiremos orgullosos, ante nuestro Señor Jesús en su venida, sino vosotros? Sí, vosotros sois nuestra gloria y nuestro gozo.
        ref: De la primera carta del apóstol san Pablo a los Tesalonicenses 2, 1-13. 19-20
    - etiqueta: 'Para un santo papa u obispo en tiempo pascual:'
      texto:
        titulo: EXHORTACIÓN DE PABLO A LOS PASTORES DE LA IGLESIA DE ÉFESO
        texto: |-
          En aquellos días, desde Mileto, mandó Pablo llamar a los presbíteros de la iglesia de Éfeso. Cuando se presentaron les dijo: «Vosotros sabéis que todo el tiempo que he estado aquí desde el día que por primera vez puse pie en Asia, he servido al Señor con toda humildad, en las penas y pruebas que me han procurado las maquinaciones de los judíos. Sabéis que no he ahorrado medio alguno, que he predicado y enseñado en público y en privado, insistiendo a judíos y griegos a que se convirtieran y crean en nuestro Señor Jesús.

          Y ahora me dirijo a Jerusalén, forzado por el Espíritu. No sé lo que me espera allí, sólo sé que el Espíritu Santo, de ciudad en ciudad, me asegura que me aguardan cárceles y luchas. Pero a mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios.

          He pasado por aquí predicando el reino, y ahora sé que ninguno de vosotros me volverá a ver. Por eso declaro hoy que no soy responsable de la suerte de nadie: nunca me he reservado nada, os he anunciado enteramente el plan de Dios.

          Tened cuidado de vosotros y del rebaño que el Espíritu Santo os ha encargado guardar, corno pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Ya sé que, cuando os deje, se meterán entre vosotros lobos feroces que no tendrán piedad del rebaño. Incluso algunos de vosotros deformarán la doctrina y arrastrarán a los discípulos. Por eso, estad alerta: acordaos que durante tres años, de día y de noche, no he cesado de aconsejar con lágrimas en los ojos a cada uno en particular. Ahora os dejo en manos de Dios y de su palabra que es gracia, y tiene poder para construiros y daros parte en la herencia de los santos.

          A nadie le he pedido dinero, oro ni ropa. Bien sabéis que estas manos han ganado lo necesario para mí y mis compañeros. Siempre os he enseñado que es nuestro deber trabajar para socorrer a los necesitados, acordándonos de las palabras del Señor Jesús: "Más dichoso es el que da que el que recibe."»

          Cuando terminó de hablar, se pusieron todos de rodillas, y Pablo rezó con todos ellos. Hubo abundantes lágrimas por parte de todos, y, echándose al cuello de Pablo, lo abrazaron afectuosamente. Estaban afligidos, sobre todo porque les había dicho que ya no lo volverían a ver. Y así lo acompañaron hasta la nave.
        ref: De los Hechos de los apóstoles 20, 17-38
    - etiqueta: 'Para un santo presbítero:'
      texto:
        titulo: DEBERES DE LOS PRESBÍTEROS Y DE LOS FIELES
        texto: |-
          Querido hermano: los presbíteros que ejercen su cargo debidamente merecen un doble reconocimiento, sobre todo, los que dedican todo su esfuerzo a la predicación y a la enseñanza. Porque dice la Escritura: No pondrás bozal al buey que trilla, y también: El obrero tiene derecho a su salario. No admitas acusaciones contra un presbítero, a menos que estén avaladas por dos o tres testigos. A los que incurran en pecado, repréndelos públicamente, para que sirva de escarmiento a los demás.

          Delante de Dios, de Jesucristo y de sus ángeles elegidos, te ordeno que observes estas indicaciones, sin prejuicios y procediendo con imparcialidad. No te apresures a imponer las manos a nadie, y no te hagas cómplice de pecados ajenos. Consérvate puro.

          Porque la codicia es la raíz de todos los males, y muchos, arrastrados por ella, se han apartado de la fe y se han acarreado muchos sufrimientos.

          Tú en cambio, hombre de Dios, huye de todo esto, practica la justicia, la religión, la fe, el amor, la paciencia, la delicadeza. Combate el buen combate de la fe. Conquista la vida eterna a la que fuiste llamado, y de la que hiciste noble profesión ante muchos testigos.

          Y ahora, en presencia de Dios que da la vida al universo y de Cristo Jesús que dio testimonio ante Poncio Pilato: te insisto en que guardes el mandamiento sin mancha ni reproche, hasta la venida de Nuestro Señor Jesucristo.
        ref: De la primera carta del apóstol san Pablo a Timoteo 5, 17-22; 6, 10-14
    - etiqueta: 'Para un santo papa u obispo:'
      texto:
        titulo: RECOMENDACIONES DE PABLO SOBRE LAS CUALIDADES Y LOS DEBERES DE LOS OBISPOS
        texto: |-
          Querido hermano: Es preciso que el obispo sea irreprochable, como administrador que es de la casa de Dios: que no sea soberbio ni iracundo, ni dado al vino ni pendenciero, ni codicioso de torpes ganancias. Más bien, debe ser hospitalario, amigo de todo lo bueno, discreto, recto, religioso, dueño de sí y muy adicto al auténtico mensaje de la verdad transmitida. Así podrá exhortar y animar con sana instrucción y rebatir a los contradictores.

          Hay, en verdad, muchos insubordinados, charlatanes y embaucadores, sobre todo de entre los partidarios de la circuncisión. Es necesario irles tapando la boca, porque van revolviendo familias enteras, enseñando lo que no se debe, con la mira puesta en vergonzosas ganancias. Pero tú enseña lo que es conforme a la sana doctrina.

          Los ancianos, que sean moderados, dignos, discretos, íntegros y vigorosos en la fe, en la caridad, en la constancia. Las ancianas, de igual modo, que observen un porte religioso, como conviene a una profesión santa; que no se den a la murmuración ni al mucho vino; que sean maestras de buenas costumbres, para poder inspirar sentimientos de modestia a las más jóvenes. Así les enseñarán a ser buenas esposas y buenas madres de familia, a ser discretas, honestas, hacendosas, bondadosas, dóciles a sus maridos. Así no darán motivo para que se hable mal del Evangelio de Dios.

          Asimismo, a los jóvenes, anímalos a vivir con moderación en todas las cosas. Y tú sé modelo por tus buenas obras, con desinterés e integridad en la enseñanza, con gravedad, con genuina e incensurable doctrina, para que nuestros adversarios se vean confundidos, al no tener nada malo que decir contra nosotros.
        ref: De la carta del apóstol san Pablo a Tito 1, 7-11; 2, 18
    - etiqueta: 'Para un santo presbítero:'
      texto:
        titulo: DEBERES DE LOS PRESBÍTEROS Y DE LOS FIELES
        texto: |-
          A los presbíteros en esa comunidad, yo, presbítero como ellos, testigo de los sufrimientos de Cristo y partícipe de la gloria que va a descubrirse, os exhorto: Sed pastores del rebaño de Dios a vuestro cargo, gobernándolo, no a la fuerza sino de buena gana, como Dios quiere, no por sórdida ganancia, sino con generosidad, no como dominadores sobre la heredad de Dios, sino convirtiéndoos en modelos del rebaño. Y, cuando aparezca el supremo Pastor, recibiréis la corona de gloria que no se marchita.

          Asimismo vosotros, jóvenes, sed sumisos a los presbíteros, y sed humildes unos con otros, porque Dios resiste a los soberbios, pero da su gracia a los humildes. Inclinaos bajo la poderosa mano de Dios, para que a su tiempo os eleve. Descargad en él todas vuestras preocupaciones, porque él se interesa por vosotros.

          Sed sobrios, estad despiertos: vuestro enemigo, el diablo, como león rugiente, ronda buscando a quien devorar; resistidle, firmes en la fe. Y sabed que la misma clase de padecimientos están sufriendo vuestros hermanos, dispersos por el mundo.

          Tras un breve padecer, el Dios de toda gracia, que os ha llamado a su eterna gloria en Cristo Jesús, él mismo os restablecerá, os afianzará, os robustecerá. A él la gloria y el poder, por los siglos de los siglos. Amén.
        ref: De la primera carta del apóstol san Pedro 5, 1-11
    resp1:
