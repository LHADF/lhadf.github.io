    lectura1:
      titulo: DICHOSOS LOS INVITADOS AL BANQUETE DE BODAS DEL CORDERO
      texto: |-
        En aquellos días, yo, Juan, miré, y allí estaba el Cordero de pie sobre el monte Sión, y con él ciento cuarenta y cuatro mil que llevaban grabado en la frente el nombre del Cordero y el nombre de su Padre. Oí también un sonido que bajaba del cielo, parecido al estruendo de grandes cataratas, y como el estampido de un trueno poderoso; era el son de arpistas que tañían sus arpas delante del trono, delante de los cuatro seres vivientes y los ancianos, cantando un cántico nuevo. Y nadie podía aprender el cántico fuera de los ciento cuarenta y cuatro mil, los rescatados de la tierra. Ellos son el cortejo del Cordero adondequiera que vaya; son los rescatados como primicias de la humanidad para Dios y el Cordero. En sus labios no se encontró mentira: son irreprochables.

        Y salió una voz del trono que decía: Alabad a nuestro Dios todos sus siervos y los que le teméis, pequeños y grandes. Y oí como el ruido de muchedumbre inmensa y como el ruido de grandes aguas y como el fragor de fuertes truenos. Y decían: Aleluia. Porque ha establecido su reinado el Señor, nuestro Dios todopoderoso. Con alegría y regocijo démosle gloria, porque han llegado las bodas del Cordero, y su Esposa se ha engalanado y se le ha concedido vestirse de lino deslumbrante de blancura, el lino son las buenas acciones de los santos.

        Luego me dice: Escribe: Dichosos los invitados al banquete de bodas del Cordero. Y añadió: Estas palabras de Dios son verdaderas. Entonces yo caí a sus pies para adorarlo, pero él me advirtió: No hagas eso, porque yo soy tu compañero de servicio y el de tus hermanos que poseen el testimonio de Jesús. El testimonio de Jesús es el espíritu profético. ¡Es a Dios a quien debes adorar!"
      ref: Del libro del Apocalipsis 14, 1-5; 19, 5-9
    resp1:
      ref: Ap 14, 23; 19, 6; 12, 10; 19, 5
      vr:
      - - R
        - 'Oí un sonido que bajaba del cielo, como el estampido de un trueno poderoso: ha establecido su reinado el Señor, nuestro Dios todopoderoso. * Ahora se estableció la salud y el poderío, y el reinado de nuestro Dios, y la potestad de su Cristo. Aleluia.'
      - - V
        - 'Y salió una voz del trono que decía: Alabad a nuestro Dios todos sus siervos y los que le teméis, pequeños y grandes.'
      - - R
        - Ahora se estableció la salud y el poderío, y el reinado de nuestro Dios, y la potestad de su Cristo. Aleluia.
    resp2:
      ref: Ef 5, 8-9; Mt 5, 14. 16
      vr:
      - - R
        - Sois luz en el Señor. Caminad como hijos de la luz. * Toda bondad, justicia y verdad son fruto de la luz.
      - - V
        - Vosotros sois la luz del mundo. Alumbre vuestra luz a los hombres. Aleluia.
      - - R
        - Toda bondad, justicia y verdad son fruto de la luz.
  variantes:
    lectura1:
    - etiqueta: 'Para un santo que vivió en el matrimonio:'
      texto:
        titulo: GLORIFICAD EN VUESTROS CORAZONES A CRISTO SEÑOR
        texto: |-
          Maridos, en la vida común sed comprensivos con la mujer, que es un ser más frágil, respetándolas, ya que son también coherederas de la gracia de la vida, para que vuestras oraciones no encuentren obstáculo.

          Procurad todos tener un mismo pensar y un mismo sentir: con afecto fraternal, con ternura, con humildad. No devolváis mal por mal o insulto por insulto; al contrario, responded con una bendición, porque para esto habéis sido llamados: para heredar una bendición. Porque, si uno ama la vida y quiere ver días felices, refrene su lengua del mal y sus labios de la falsedad; apártese del mal y obre el bien, busque la paz y corra tras ella, pues los ojos del Señor se fijan en los justos y sus oídos atienden a sus ruegos; pero el Señor hace frente a los que practican el mal.

          Y además, ¿quién podrá haceros daño si os dais con empeño a lo bueno? Dichosos vosotros si tenéis que sufrir por causa de la justicia; no les tengáis miedo ni os amedrentéis. Glorificad en vuestros corazones a Cristo Señor y estad siempre prontos para dar razón de vuestra esperanza a todo el que os la pidiere; pero con mansedumbre y respeto y en buena conciencia, para que en aquello mismo en que sois calumniados queden confundidos los que denigran vuestra buena conducta en Cristo; que mejor es padecer haciendo el bien, si tal es la voluntad de Dios, que padecer haciendo el mal.
        ref: De la primera carta del apóstol san Pedro 3, 7-17
    - etiqueta: 'En tiempo de cuaresma:'
      texto:
        titulo: LOS JUSTOS SON VERDADEROS HIJOS DE DIOS
        texto: 'El justo se mantendrá de pie, completamente seguro frente a aquellos que lo oprimieron y despreciaron sus padecimientos. Ellos, al verlo, serán presa de un terrible temor y quedarán desconcertados por lo imprevisto de su salvación. Llenos de remordimiento y lanzando gemidos, se dirán unos a otros, con el espíritu angustiado: "Este es el que antes poníamos en ridículo y convertíamos en objeto de escarnio. ¡Insensatos de nosotros! Su vida nos parecía una locura y su fin una ignominia. ¿Cómo ha sido incluido entre los hijos de Dios y participa de la herencia de los santos? ¡Qué lejos nos apartamos del camino de la verdad! La luz de la justicia nunca nos ha iluminado ni el sol ha salido para nosotros. Nos hemos hartado de los senderos del mal y la perdición, hemos atravesado desiertos sin caminos, ¡pero no hemos conocido el camino del Señor! ¿De qué nos sirvió nuestra arrogancia? ¿De qué nos valió jactarnos de las riquezas? Todo eso se desvaneció como una sombra, como una noticia
          fugaz; como una nave que surca el mar agitado, sin que pueda descubrirse la huella de su paso ni la estela de su quilla entre las olas; o como un pájaro que vuela por el aire sin dejar rastros de su trayecto: él golpea la brisa con el látigo de sus plumas y la corta con un agudo silbido, se abre camino batiendo las alas y después no queda ni una señal de su paso; o como una flecha arrojada hacia el blanco: el aire desplazado vuelve en seguida a su lugar, y se ignora el camino que ella siguió. Así también nosotros, desaparecimos apenas nacidos y no tenemos para mostrar ninguna señal de virtud, porque nos hemos consumido en nuestra maldad". Sí, la esperanza del impío es como brizna llevada por el viento, como espuma ligera arrastrada por el huracán: ella se disipa como el humo por el viento, se desvanece como el recuerdo del huésped de un día. Pero los justos viven para siempre; su recompensa está en el Señor y el Altísimo se preocupa de ellos. Por eso, recibirán la espléndida realeza
          y la hermosa diadema de las manos del Señor; porque él los protegerá con su mano derecha y los defenderá con su brazo.'
        ref: Del libro de la Sabiduría 5, 1-16
    - etiqueta: 'opcion: 3'
      texto:
        titulo: VUESTRA VIDA ESTÁ OCULTA CON CRISTO EN DIOS
        texto: |-
          Hermanos: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra. Porque habéis muerto y vuestra vida está oculta con Cristo en Dios; cuando se manifieste Cristo, que es vuestra vida, os manifestaréis también vosotros con él, revestidos de gloria.

          Mortificad las pasiones de vuestro hombre terrenal: la fornicación, la impureza, la concupiscencia, los malos deseos y la avaricia, que es una idolatría. Por ellas se desata la cólera de Dios.

          En todo eso anduvisteis también vosotros, cuando vivíais entregados a ellas. Pero ahora dejad también vosotros a un lado todo eso: la ira, la indignación, la malignidad, la maledicencia y el torpe lenguaje. No os engañéis unos a otros.

          Despojaos del hombre viejo con sus malas pasiones y revestíos del hombre nuevo, que se va renovando hasta alcanzar un conocimiento pleno de Dios y se va configurando con la imagen del que lo creó. Así, ya no hay griego ni judío, ni circunciso ni incircunciso, ni bárbaro ni escita, ni esclavo ni libre. Sólo Cristo todo y en todos.

          Por lo tanto, como pueblo elegido de Dios, pueblo sacro y amado, sea vuestro uniforme: la misericordia entrañable, la bondad, la humildad, la dulzura, la comprensión. Sobrellevaos mutuamente y perdonaos, cuando alguno tenga quejas contra otro. El Señor os ha perdonado: haced vosotros lo mismo.

          Por encima de todo, procurad el amor, que es el ceñidor de la unidad consumada. Que la paz de Cristo actúe de árbitro en vuestro corazón: a ella habéis sido convocados, en un solo cuerpo. Y vivid siempre agradecidos. Que la palabra de Cristo habite entre vosotros en toda su riqueza; enseñaos unos a otros con toda sabiduría; exhortaos mutuamente. Cantad a Dios, dadle gracias de todo corazón, con salmos, himnos y cánticos inspirados.

          Todo lo que de palabra o de obra realicéis, sea todo en nombre de Jesús, ofreciendo la Acción de Gracias a Dios Padre por medio de él.
        ref: De la carta del apóstol san Pablo a los Colosenses 3, 1-17
    - etiqueta: 'Para un santo que vivió en el matrimonio:'
      texto:
        titulo: LA SANTIDAD DEL MATRIMONIO CRISTIANO
        texto: |-
          Hermanos: Vivid sumisos unos a otros como lo pide el respeto debido a Cristo.

          Las mujeres deben someterse a sus maridos como si se sometieran al Señor; porque el marido es cabeza de la mujer, como Cristo es cabeza de la Iglesia y salvador de ella, que es su cuerpo. Ahora bien, como la Iglesia está sometida a Cristo, así también las mujeres deben someterse en todo a sus maridos.

          Y vosotros, maridos, amad a vuestras mujeres, como Cristo amó a su Iglesia y se entregó a la muerte por ella para santificarla, purificándola en el baño del agua, que va acompañado de la palabra, y para hacerla comparecer ante su presencia toda resplandeciente, sin mancha ni defecto ni cosa parecida, sino santa e inmaculada. Así deben también los maridos amar a sus mujeres, como a sus propios cuerpos. Amar a su mujer es amarse a sí mismo.

          Nadie aborrece jamás su propia carne, sino que la alimenta y la cuida con cariño. Lo mismo hace Cristo con la Iglesia, porque somos miembros de su cuerpo. «Por eso dejará el hombre a su padre y a su madre y se unirá a su mujer y serán los dos una sola carne.» ¡Gran misterio es éste! Y yo lo refiero a Cristo y a la Iglesia.
        ref: De la carta del apóstol san Pablo a los Efesios 5, 21-32
    resp1:
