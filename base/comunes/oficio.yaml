# Comunes de oficio, del libro (Liturgia de las Horas, tomo III; tools/importar/comunes_libro.py).
# Se usan para las celebraciones sin textos propios en la base (base/santoral/adf.yaml) y para lo que les falte.
# «oraciones»: las que el libro da «en su defecto», con N. en lugar del nombre; «para» dice a quién corresponde cada una.
# El común de doctores trae solo algunas partes: el resto se copió del de pastores. Se corrigen acá.
dedicacion:
  nombre: Común de la dedicación de una iglesia
  himno: No rechazaremos
  salmodia:
  - ant: ¡Portones!, alzad los dinteles, levantaos, puertas antiguas. Cuando el salmo 23 se ha dicho en el Invitatorio, aquí se dice el salmo 94.
    salmo: salmo-23
  - ant: ¡Qué deseables son tus moradas, Señor de los ejércitos! †
    salmo: salmo-83
  - ant: ¡Qué pregón tan glorioso para ti, ciudad de Dios!
    salmo: salmo-86
  versiculo:
  - - V
    - Me postraré hacia tu santuario.
  - - R
    - Daré gracias a tu nombre, Señor.
  lectura1:
    titulo: COMO PIEDRAS VIVAS, ENTRÁIS EN LA CONSTRUCIÓN DEL TEMPLO DEL ESPÍRITU
    texto: |-
      Hermanos: Después de haberos despojado de oda maldad y de toda falsedad, de las hipocresías y envidias, y de toda clase de murmuración, apeteced, como niños recién nacidos, la leche pura espiritual. Con ella podréis crecer hasta alcanzar la salvación, si es que realmente habéis saboreado lo bueno que es el Señor.

      Acercándoos al Señor, la piedra viva, rechazada por los hombres, pero escogida y apreciada por Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo. Por eso se lee en la Escritura: «Ved que pongo en Sión una piedra angular escogida y preciosa. Y quien tenga fe en ella no será defraudado.»

      Por consiguiente, a vosotros, que tenéis fe, os corresponde el honor; mas, para los que no tienen fe, «la piedra que desecharon los arquitectos es ahora la piedra angular, y ha venido a ser piedra de tropiezo y roca de escándalo». Y tropiezan en ella porque no tienen fe en la palabra de Cristo, para la cual estaban destinados.

      Vosotros, en cambio, sois «linaje escogido, sacerdocio regio, nación santa, pueblo adquirido por Dios, para proclamar las hazañas del que os llamó a salir de la tiniebla y a entrar en su luz maravillosa». Vosotros, que en otro tiempo «njo erais pueblo», sois ahora «pueblo de Dios»; vosotros, que estabais «excluidos de la misericordia», sois ahora «objeto de la misericordia de Dios».

      Hermanos, os exhorto a que, como forasteros y peregrinos que sois, os abstengáis de las pasiones terrenas que hacen guerra al alma. Observad entre los gentiles una conducta ejemplar. Así, por aquello mismo en que os calumnian como a malhechores, darán gloria a

      Dios, cuando vean y consideren vuestras buenas obras, el día en que él venga a «visitarlos» con su gracia.

      Sed sumisos a toda humana autoridad a causa del Señor: ya sea al soberano, en cuanto que tiene el mando; o bien a los gobernadores, como delegados suyos que son para castigar a los malhechores y para alabanza de los hombres de bien. Porque ésta es la voluntad de Dios: que, obrando el bien, hagáis callar a la ignorancia de los hombres insensatos. Portaos en esto como hombres libres, no como quienes se sirven de la libertad sólo para ocultar su maldad, sino como conviene a los que son siervos de Dios. Sed deferentes con todos, amad a vuestros hermanos, temed a Dios y honrad al soberano.
    ref: De la primera carta del apóstol san Pedro 2, 1-17
  resp1:
    ref: Tb 13, 21; Ap 21, 19-21
    vr:
    - - R
      - Las murallas de Jerusalén serán adornadas con piedras preciosas. * Y sus torres serán batidas con oro.
    - - V
      - Las puertas de Jerusalén serán rehechas con zafiros y esmeraldas, y con piedras preciosas sus murallas.
    - - R
      - Y sus torres serán batidas con oro.
  lectura2:
    titulo: SOMOS EDIFICADOS A MANERA DE PIEDRAS VIVAS COMO CASA Y ALTAR DE DIOS
    texto: |-
      Todos los que creemos en Cristo Jesús somos llamados piedras vivas, de acuerdo con lo que afirma la Escritura: Vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo.

      Cuando se trata de piedras materiales, sabemos que se tiene cuidado de colocar en los cimientos las piedras más sólidas y resistentes con el fin de que todo el peso del edificio pueda descansar con seguridad sobre ellas. Hay que entender que esto se aplica también a las piedras vivas, de las cuales algunas son como cimiento del edificio espiritual. ¿Cuáles son estas piedras que se colocan como cimiento? Los apóstoles y profetas. Así lo afirma Pablo cuando nos dice: Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular.

      Para que te prepares con mayor interés, tú que me escuchas, a la construcción de este edificio, para que seas una de las piedras próximas a los cimientos, debes saber que es Cristo mismo el cimiento de este edificio que estamos describiendo. Así lo afirma el apóstol Pablo: Nadie puede poner otro cimiento fuera del ya puesto, que es Jesucristo. ¡Bienaventurados, pues, aquellos que construyen edificios espirituales sobre cimiento tan noble!

      Pero en este edificio de la Iglesia conviene también que haya un altar. Ahora bien, yo creo que son capaces de llegar a serlo todos aquellos que, entre vosotros, piedras vivas, están dispuestos a dedicarse a la oración, para ofrecer a Dios día y noche sus intercesiones, y a inmolarle las víctimas de sus súplicas; ésos son, en efecto, aquellos con los que Jesús edifica su altar.

      Considera, pues, qué alabanza se tributa a las piedras del altar. La Escritura afirma que se construyó, según está escrito en el libro de la ley de Moisés, un altar de piedras sin labrar, a las que no había tocado el hierro. ¿Cuáles, piensas tú, que son estas piedras sin labrar? Quizá estas piedras sin labrar y sin mancha sean los santos apóstoles, quienes, por su unanimidad y su concordia, formaron como un único altar. Pues se nos dice, en efecto, que todos ellos perseveraban unánimes en la oración, y que abriendo sus labios decían:

      Señor, tú penetras el corazón de todos. Ellos, por tanto, que oraban concordes con una misma voz y un mismo espíritu, son dignos de formar un único altar sobre el que Jesús ofrezca su sacrificio al Padre.

      Pero nosotros también, por nuestra parte, debemos esforzarnos por tener todos un mismo pensar y un mismo sentir, no obrando por envidia ni por ostentación, sino permaneciendo en el mismo espíritu y en los mismos sentimientos, con el fin de que también nosotros podamos llegar a ser piedras aptas para la construcción del altar.
    autor: |-
      De las Homilías de Orígenes, presbítero, sobre el libro de Josué
      (Homilía 9, 1-2: SC 71, 244-246)
  resp2:
    ref: Cf. Is 2, 2. 3; Sal 125, 6
    vr:
    - - R
      - 'La casa del Señor está firme en la cima de los montes, encumbrada sobre todas las montañas. * Hacia ella caminarán pueblos numerosos y dirán: «Gloria a ti, Señor».'
    - - V
      - Al volver, vuelven cantando, trayendo sus gavillas.
    - - R
      - 'Hacia ella caminarán pueblos numerosos y dirán: «Gloria a ti, Señor».'
virgen-maria:
  nombre: Común de la Santísima Virgen María
  himno: María, pureza en vuelo
  salmodia:
  - ant: María ha recibido la bendición del Señor y la misericordia de Dios, su salvador. Cuando el salmo 23 se ha dicho en el Invitatorio, aquí se dice el salmo 94.
    salmo: salmo-23
  - ant: El Altísimo consagra su morada.
    salmo: salmo-45
  - ant: ¡Qué pregón tan glorioso para ti, Virgen María!
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas.
  - - R
    - Meditándolas en su corazón.
  lectura1:
    titulo: EL EMMANUEL REY PACÍFICO
    texto: |-
      En aquellos días, habló el Señor a Ajaz, diciendo: «Pide una señal al Señor, tu Dios: en lo hondo del abismo o en lo alto del cielo.»

      Respondió Ajaz: «No la pido, no quiero tentar al Señor.»

      Entonces dijo Isaías: «Escucha, heredero de David: ¿No os basta cansar a los hombres, que cansáis incluso a mi Dios? Pues el Señor, por su cuenta, os dará él mismo una señal. Mirad: la joven ha concebido y dará a luz un hijo, y le pondrá por nombre Emmanuel, porque tenemos a Dios-con-nosotros.

      Saldrá un renuevo del tronco de Jesé, y de su raíz brotará un vástago. Sobre él se posará el espíritu del Señor: espíritu de sabiduría y de inteligencia, espíritu de consejo y de fortaleza, espíritu de ciencia y de temor del Señor.

      No juzgará por apariencias ni sentenciará sólo de oídas; juzgará a los pobres con justicia, con rectitud a los desamparados. Herirá al violento con la vara de su boca, y al

      malvado con el aliento de sus labios. La justicia será el ceñidor de su cintura, y la lealtad el cinturón de sus caderas.

      Habitará el lobo con el cordero, y la pantera se echará con el cabrito, el novillo y el león pacerán juntos: y un niño pequeño los conducirá. La vaca pastará con el oso, sus crías yacerán juntas; el león comerá paja con el buey. El niño jugará junto al agujero del áspid, la criatura meterá la mano en el escondrijo de la serpiente. Nadie hará daño ni estrago por todo mi Monte Santo: porque estará lleno el país de ciencia del Señor, como las aguas colman el mar.»
    ref: Del libro del profeta Isaías 7, 10-14; 8, 10; 11, 1-9
  resp1:
    ref: Cf. Is 7, 14; cf. 9, 6. 7
    vr:
    - - R
      - 'Mirad: la joven ha concebido y dará a luz un hijo, * y tendrá por nombre «Consejero admirable» y «Dios poderoso».'
    - - V
      - Se sentará sobre el trono de David y reinará para siempre.
    - - R
      - Y tendrá por nombre «Consejero admirable» y «Dios poderoso».
  lectura2:
    titulo: LA BENDICIÓN DEL PADRE HA BRILLADO PARA LOS HOMBRES POR MEDIO DE MARÍA
    texto: |-
      Alégrate, llena de gracia, el Señor está contigo. ¿Y qué puede ser más sublime que este gozo, oh Virgen Madre? ¿O qué cosa puede ser más excelente que esta gracia, que, viniendo de Dios, sólo tú has obtenido? ¿Acaso se puede imaginar una gracia más agradable o más espléndida? Todas las demás no se pueden comparar a las maravillas que se realizan en ti; todas las demás son inferiores a tu gracia; todas, incluso las más excelsas, son secundarias y gozan de una claridad muy inferior.

      El Señor está contigo. ¿Y quién es el que puede competir contigo? Dios proviene de ti; ¿quién no te cederá el paso, quién habrá que no te conceda con gozo la primacía y la precedencia? Por todo ello, contemplando tus excelsas prerrogativas, que destacan sobre las de todas las criaturas, te aclamo con el máximo entusiasmo: Alégrate, llena de gracia, el Señor está contigo. Pues tú eres la fuente del gozo no sólo para los hombres, sino también para los ángeles del cielo.

      Verdaderamente, bendita tú entre las mujeres, pues has cambiado la maldición de Eva en bendición; pues has hecho que Adán, que yacía postrado por una maldición, fuera bendecido por medio de ti.

      Verdaderamente, bendita tú entre las mujeres, pues por medio de ti la bendición del Padre ha brillado para los hombres y los ha liberado de la antigua maldición.

      Verdaderamente, bendita tú entre las mujeres, pues por medio de ti encuentran la salvación tus progenitores; pues tú has engendrado al Salvador que les concederá la salvación eterna.

      Verdaderamente, bendita tú entre las mujeres, pues sin concurso de varón has dado a luz aquel fruto que es bendición para todo el mundo, al que ha redimido de la maldición que no producía sino espinas.

      Verdaderamente, bendita tú entre las mujeres, pues a pesar de ser una mujer, criatura de Dios como todas las demás, has llegado a ser, de verdad, Madre de Dios. Pues lo que nacerá de ti es, con toda verdad, el Dios hecho hombre, y, por lo tanto, con toda justicia y con toda razón, te llamas Madre de Dios, pues de verdad das a luz a Dios.

      Tú tienes en tu seno al mismo Dios, hecho hombre en tus entrañas, quien, como un esposo, saldrá de ti para conceder a todos los hombres el gozo y la luz divina.

      Dios ha puesto en ti, oh Virgen, su tienda como en un cielo puro y resplandeciente. Saldrá de ti como el esposo de su alcoba e, imitando el recorrido del sol, recorrerá en su vida el camino de la futura salvación para todos los vivientes, y, extendiéndose de un extremo a otro del cielo, llenará con calor divino y vivificante todas las cosas.
    autor: |-
      De los sermones de san Sofronio, obispo
      (Sermón 2, en la Anunciación de la Santísima Virgen, 21-22. 26: PG 87, 3, 3242. 3250)
  resp2:
    ref: S. Sofronio, Disertación 2
    vr:
    - - R
      - Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva. * Por ti la bendición del Padre ha brillado sobre los hombres.
    - - V
      - Por ti alcanzan la salvación tus progenitores.
    - - R
      - Por ti la bendición del Padre ha brillado sobre los hombres.
santa-maria-sabado:
  nombre: Memoria de santa María en sábado
  himno: Rosa entre rosas
  oraciones:
  - para: ''
    texto: Señor Dios todopoderoso, haz que, por la intercesión de santa María, la Virgen, nosotros, tus hijos, gocemos de plena salud de alma y cuerpo, vivamos alegres en medio de las dificultades del mundo y alcancemos la felicidad de tu reino eterno. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Perdona, Señor, las culpas de tus fieles y haz que, quienes no logramos agradarte con nuestros actos seamos salvados por la intercesión de la Madre de tu Hijo, nuestro Señor Jesucristo. Él que vive y reina contigo.
  - para: ''
    texto: Ven en ayuda de nuestra debilidad, Dios de misericordia, y haz que, al recordar hoy a la Madre de tu Hijo, por su intercesión nos veamos libres de nuestras culpas. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Que venga en nuestra ayuda, Señor, la poderosa intercesión de la Virgen María; así nos veremos libres de todo peligro y gozaremos de tu paz. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Concédenos, Señor, la valiosa intercesión de la Virgen María, cuya gloriosa memoria hoy celebramos, y danos parte en los dones de tu amor por la intercesión de aquella a la que hiciste llena de gracia. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Te pedimos, Señor, que la maternal intercesión de la Madre de tu Hijo libre de los males del mundo y conduzca a los gozos de tu reino a los fieles que se alegran al saberse protegidos por la Virgen María. Por nuestro Señor Jesucristo.
