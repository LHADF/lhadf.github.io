      - - R
        - 'Y ésta es la palabra: la Buena Noticia anunciada a vosotros.'
  pascua:
    lectura1:
      titulo: EL ESPÍRITU PENETRA HASTA LA PROFUNDIDAD DE DIOS
      texto: 'Hermanos, cuando fui a vosotros, no fui con el prestigio de la palabra o de la sabiduría a anunciaros el misterio de Dios, pues no quise saber entre vosotros otra cosa sino a Jesucristo, y éste crucificado. Y me presenté ante vosotros débil, tímido y tembloroso. Y mi palabra y mi predicación no tuvieron nada de los persuasivos discursos de la sabiduría, sino que fueron una demostración del Espíritu y del poder para que vuestra fe se fundase, no en sabiduría de hombres, sino en el poder de Dios. Sin embargo, hablamos de sabiduría entre los perfectos, pero no de sabiduría de este mundo ni de los príncipes de este mundo, abocados a la ruina; sino que hablamos de una sabiduría de Dios, misteriosa, escondida, destinada por Dios desde antes de los siglos para gloria nuestra, desconocida de todos los príncipes de este mundo —pues de haberla conocido no hubieran crucificado al Señor de la Gloria—. Más bien, como dice la Escritura, anunciamos: “lo que ni el ojo vio, ni el oído oyó,
        ni al corazón del hombre llegó, lo que Dios preparó para los que le aman”. Porque a nosotros nos lo reveló Dios por medio del Espíritu; y el Espíritu todo lo sondea, hasta las profundidades de Dios. En efecto, ¿qué hombre conoce lo íntimo del hombre sino el espíritu del hombre que está en él? Del mismo modo, nadie conoce lo íntimo de Dios, sino el Espíritu de Dios. Y nosotros no hemos recibido el espíritu del mundo, sino el Espíritu que viene de Dios, para conocer las gracias que Dios nos ha otorgado, de las cuales también hablamos, no con palabras aprendidas de sabiduría humana, sino aprendidas del Espíritu, expresando realidades espirituales. El hombre naturalmente no capta las cosas del Espíritu de Dios; son necedad para él. Y no las puede conocer pues sólo espiritualmente pueden ser juzgadas. En cambio, el hombre de espíritu lo juzga todo; y a él nadie puede juzgarle. Porque “¿quién conoció la mente del Señor para instruirle?” Pero nosotros tenemos la mente de Cristo.'
      ref: De la primera carta del apóstol san Pablo a los Corintios 2, 1-16
    resp1:
      ref: 1 Co 1, 21. 23. 25
      vr:
