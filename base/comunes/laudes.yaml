# Comunes de Laudes, deducidos del santoral (tools/importar/comunes.py): de cada parte, el texto que más celebraciones
# de ese común comparten. PROVISORIO, a cotejar con el libro. Se usan para las celebraciones propias de ADF sin textos propios
# (base/santoral/adf.yaml).
virgen-maria:
  nombre: Común de la Santísima Virgen María
  celebraciones: 17
  himno: Eres tú la mujer llena de gloria
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Por Eva se cerraron a los hombres las puertas del paraíso, y por María Virgen han sido abiertas de nuevo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
apostoles:
  nombre: Común de apóstoles
  celebraciones: 9
  himno: Vosotros, que escuchasteis la llamada
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  salmodia:
  - ant: 'Éste es mi mandamiento: que os améis unos a otros como yo os he amado.'
    salmo: salmo-62-2-9
  - ant: Nadie tiene amor más grande que el que da la vida por sus amigos.
    salmo: cantico-dn-3-57-88-56
  - ant: Vosotros sois mis amigos si hacéis lo que yo os mando.
    salmo: salmo-149
varios-martires:
  nombre: Común de varios mártires
  celebraciones: 7
  himno: Testigos de la sangre
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - Los justos viven eternamente.
  - - R
    - Los justos viven eternamente.
  - - V
    - Reciben de Dios su recompensa.
  - - R
    - Viven eternamente.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los justos viven eternamente.
  ant_benedictus: Dichosos los perseguidos por causa de la justicia, pues de ellos es el reino de los cielos.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
