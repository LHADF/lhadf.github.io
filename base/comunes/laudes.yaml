  - para: ''
    texto: Señor Dios, que cada año nos alegras con la fiesta de santa N., concede a los que celebramos su memoria imitar también los ejemplos de su vida santa. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Derrama, Señor, sobre nosotros el espíritu de tu sabiduría y amor con que llenaste a tu hija santa N., para que, a imitación suya, te obedezcamos siempre con sencillez y te agrademos con nuestra fe y nuestras buenas obras. Por nuestro Señor Jesucristo.
  - para: varias santas mujeres
    texto: Dios todopoderoso, la admirable vida de tus santas N. y N. nos da a todos ejemplo saludable; concédenos ahora que su poderosa intercesión nos obtenga también las ayudas del cielo. Por nuestro Señor Jesucristo.
  - para: un santo que se ha consagrado a una actividad caritativa
    texto: Señor, Dios todopoderoso, tú nos has revelado que toda la ley se compendia en el amor a ti y al prójimo; concédenos que, imitando la caridad de santa N., podamos ser un día contados entre los elegidos de tu reino. Por nuestro Señor Jesucristo.
