# Comunes de laudes, del libro (Liturgia de las Horas, tomo III; tools/importar/comunes_libro.py).
# Se usan para las celebraciones sin textos propios en la base (base/santoral/adf.yaml) y para lo que les falte.
# «oraciones»: las que el libro da «en su defecto», con N. en lugar del nombre; «para» dice a quién corresponde cada una.
# El común de doctores trae solo algunas partes: el resto se copió del de pastores. Se corrigen acá.
dedicacion:
  nombre: Común de la dedicación de una iglesia
  himno: Piedra angular y fundamento es Cristo
  salmodia:
  - ant: Mi casa se llama casa de oración.
    salmo: salmo-62-2-9
  - ant: Bendito eres, Señor, en el templo de tu santa gloria.
    salmo: cantico-dn-3-57-88-56
  - ant: Cantad al Señor en la asamblea de los fieles.
    salmo: salmo-149
  lectura:
    ref: Is 56, 7
    texto: Los traeré a mi monte santo, los alegraré en mi casa de oración; aceptaré sobre mi altar sus holocaustos y sacrificios; porque mi casa es casa de oración y así la llamarán todos los pueblos.
  responsorio:
  - - V
    - Grande es el Señor y muy digno de alabanza.
  - - R
    - Grande es el Señor y muy digno de alabanza.
  - - V
    - En la ciudad de nuestro Dios, en su monte santo.
  - - R
    - Muy digno de alabanza.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Grande es el Señor y muy digno de alabanza.
  ant_benedictus: «Zaqueo, baja en seguida, porque hoy tenlo que alojarme en tu casa.» Él bajó en seguida, y lo recibió muy contento. «Hoy Dios ha dado la salvación a esta casa.» Aleluia.
  preces:
    intro: 'Como piedras vivas, edificadas sobre Cristo, la piedra escogida, oremos al Padre todopoderoso por su Iglesia amada, y confesemos nuestra fe en ella diciendo:'
    respuesta: Ésta es la casa de Dios y la puerta del cielo.
    preces:
    - - Padre del cielo, tú que eres el labrador de la vid,
      - guarda, purifica y acrecienta tu viña, haciendo que sus sarmientos llenen toda la tierra.
    - - Pastor eterno, protege y acrecienta tu rebaño,
      - y haz que todas las ovejas se reúnan en un solo rebaño bajo el cayado del único pastor, Jesucristo, tu Hijo.
    - - Sembrador todopoderoso, siembra la Palabra en tu campo,
      - y haz que dé frutos del ciento por uno para la vida eterna.
    - - Arquitecto prudente, santifica tu familia, que es la Iglesia,
      - haz que aparezca ante el mundo como ciudad celestial, esposa sin tacha y Jerusalén del cielo.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras que Cristo nos enseñó:'
  oraciones:
  - para: ''
    texto: 'Cuando el Oficio se celebra en la misma iglesia dedicada: Señor, tú que nos haces revivir cada año el día de la consagración de esta iglesia: escucha las súplicas de tu pueblo y concédenos que, en este lugar, sepamos ofrecerte siempre un servicio digno y obtengamos de ti una redención cada vez más plena. Por nuestro Señor Jesucristo. Cuando el Oficio se celebra fuera de la iglesia dedicada: Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo corno cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por nuestro Señor Jesucristo.'
  - para: ''
    texto: 'Señor, Dios nuestro, que has congregado tu Iglesia y has hecho de ella el cuerpo de tu Hijo: haz que tu pueblo, reunido en tu nombre, te venere, te ame, te siga y, llevado por ti, alcance el reino que le tienes prometido. Por nuestro Señor Jesucristo.'
  inv_ant: Congregados en la casa de Dios, adoremos a Cristo, esposo de la Iglesia.
virgen-maria:
  nombre: Común de la Santísima Virgen María
  himno: Quién podrá tanto alabarte
  salmodia:
  - ant: Dichosa eres, María, porque de ti vino la salvación del mundo; tú que ahora vives ya en la gloria del Señor, intercede por nosotros ante tu Hijo.
    salmo: salmo-62-2-9
  - ant: Tú eres la gloria de Jerusalén; tú, la alegría de Israel; tú, el orgullo de nuestra raza.
    salmo: cantico-dn-3-57-88-56
  - ant: ¡Alégrate, Virgen María! Tú llevaste en el seno a Cristo, el Salvador.
    salmo: salmo-149
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Por Eva se cerraron a los hombres las puertas del paraíso, y por María Virgen han sido abiertas de nuevo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oraciones:
  - para: ''
    texto: Señor Dios todopoderoso, haz que, por la intercesión de santa María, la Virgen, nosotros, tus hijos, gocemos de plena salud de alma y cuerpo, vivamos alegres en medio de las dificultades del mundo y alcancemos la felicidad de tu reino eterno. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Perdona, Señor, las culpas de tus fieles y haz que quienes no logramos agradarte con nuestros actos seamos salvados por la intercesión de la Madre de tu Hijo, nuestro Señor Jesucristo. Él que vive y reina contigo.
  - para: ''
    texto: Ven en ayuda de nuestra debilidad, Dios de misericordia, y haz que, al recordar hoy a la Madre de tu Hijo, por su intercesión nos veamos libres de nuestras culpas. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Que venga en nuestra ayuda, Señor, la poderosa intercesión de la Virgen María; así nos veremos libres de todo peligro y gozaremos de tu paz. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Concédenos, Señor, la valiosa intercesión de la Virgen María, cuya gloriosa memoria hoy celebramos, y danos parte en los dones de tu amor por la intercesión de aquella a la que hiciste llena de gracia. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Te pedimos, Señor, que la maternal intercesión de la Madre de tu Hijo libre de los males del mundo y conduzca a los gozos de tu reino a los fieles que se alegran al saberse protegidos por la Virgen María. Por nuestro Señor Jesucristo.
  inv_ant: Venid, adoremos a Cristo, Hijo de María Virgen.
santa-maria-sabado:
  nombre: Memoria de santa María en sábado
  himno: Salve, Madre, en la tierra de mis amores
  lectura:
    ref: Ga 4, 4-5
    texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
  responsorio:
  - - V
    - Después del parto, ¡oh Virgen!, has permanecido intacta.
  - - R
    - Después del parto, ¡oh Virgen!, has permanecido intacta.
  - - V
    - Madre de Dios, intercede por nosotros.
  - - R
    - ¡Oh Virgen!, has permanecido intacta.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Después del parto, ¡oh Virgen!, has permanecido intacta.
  ant_benedictus: Celebremos con todo nuestro afecto la conmemoración de la santísima Virgen María, para que ella interceda por nosotros ante nuestro Señor Jesucristo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
