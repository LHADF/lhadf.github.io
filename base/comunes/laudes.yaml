virgenes:
  nombre: Común de vírgenes
  celebraciones: 9
  himno: Nos apremia el amor, vírgenes santas
  lectura:
    ref: Ct 8, 7
    texto: Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.
  responsorio:
  - - V
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - V
    - Tu rostro buscaré, Señor.
  - - R
    - Buscad mi rostro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  ant_benedictus: Ésta es la virgen prudente que, unida a Cristo, resplandece como el sol en el reino celestial.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa Clara, que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
santos-varones:
  nombre: Común de santos varones
  celebraciones: 12
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: «El que cumple la voluntad de Dios, ése es mi hermano y mi hermana y mi madre», dice el Señor.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
santas-mujeres:
  nombre: Común de santas mujeres
  celebraciones: 4
  himno: Finísimo fue el lino con que ella
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Dios la socorre al despuntar la aurora.
  - - R
    - Dios la socorre al despuntar la aurora.
  - - V
    - Teniendo a Dios en medio no vacila.
  - - R
    - Al despuntar la aurora.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la socorre al despuntar la aurora.
  preces:
    intro: 'Unidos, hermanos, a las mujeres santas, aclamemos a Jesús, nuestro Salvador, y supliquémosle diciendo:'
    preces:
    - - Señor Jesús, que perdonaste a la mujer pecadora sus muchos pecados porque tenía mucho amor,
      - perdónanos también a nosotros porque hemos pecado mucho.
    - - Señor Jesús, que fuiste asistido en tu misión evangélica por mujeres piadosas,
      - haz que también nosotros seamos fieles en nuestra misión apostólica.
    - - Señor Jesús, a quien María escuchaba y Marta servía,
      - concédenos servirte siempre con fe y amor.
    - - Señor Jesús, que llamaste hermano, hermana y madre a todos los que cumplen tu voluntad,
      - haz que todos nosotros la cumplamos siempre de palabra y de obra.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Fieles a la recomendación del Salvador, digamos al Padre común:'
