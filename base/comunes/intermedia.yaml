# Comunes de intermedia, de la extracción del libro (los cuatro tomos; extraccion/a_base_comunes.py).
# Se usan para las celebraciones sin textos propios en la base (base/santoral/adf.yaml) y para lo que les falte.
# «oraciones»: con N. en lugar del nombre; «para» dice a quién corresponde cada una (la app elige por el nombre).
# «pascua»: lo que cambia en el tiempo pascual. «variantes»: las otras opciones del libro, con su etiqueta.
# «hereda» (y «hereda_mujeres», para las santas): el común del que se toma lo que este no trae.
# Desde ahora la base es la fuente: se corrige acá.
dedicacion:
  nombre: Común de la dedicación de una iglesia
  tercia:
    lectura:
      ref: 1 Co 3, 16-17
      texto: '¿No sabéis que sois templo de Dios y que el Espíritu de Dios habita en vosotros? Si alguno destruye el templo de Dios, Dios lo destruirá a él; porque el templo de Dios es santo: ese templo sois vosotros.'
    ant: El templo del Señor es santo, es campo de Dios, es edificación de Dios.
    versiculo:
    - - V
      - Señor, yo amo la belleza de tu casa.
    - - R
      - El lugar donde reside tu gloria.
    pascua:
      ant: El templo del Señor es santo, es campo de Dios, es edificación de Dios. Aleluia.
      versiculo:
      - - V
        - Señor, yo amo la belleza de tu casa. Aleluia.
      - - R
        - El lugar donde reside tu gloria. Aleluia.
  sexta:
    lectura:
      ref: 2 Co 6, 16
      texto: 'Nosotros somos templo del Dios vivo, como dijo Dios: «Habitaré en medio de ellos y andaré entre ellos; yo seré su Dios, y ellos serán mi pueblo.»'
    ant: La santidad es el adorno de tu casa, Señor, por días sin término.
    versiculo:
    - - V
      - Desead la paz a Jerusalén.
    - - R
      - Vivan seguros los que te aman.
    pascua:
      ant: La santidad es el adorno de tu casa, Señor, por días sin término. Aleluia.
      versiculo:
      - - V
        - Desead la paz a Jerusalén. Aleluia.
      - - R
        - Vivan seguros los que te aman. Aleluia.
  nona:
    lectura:
      ref: Jr 7, 2b. 4-5a. 7a
      texto: '¡Escucha, Judá, la palabra del Señor, los que entráis por estas puertas para adorar al Señor! No os creáis seguros con palabras engañosas, repitiendo: «Es el templo del Señor, el templo del Señor, el templo del Señor.» Si enmendáis vuestra conducta y vuestras acciones, entonces habitaré con vosotros en este lugar.'
    ant: Ésta es la casa del Señor, construida sólidamente sobre roca firme.
    versiculo:
    - - V
      - Entrad por las puertas del Señor con acción de gracias.
    - - R
      - Por sus atrios con himnos.
    opciones:
      lectura:
      - ref: Ag 2, 6a. 7.9
        texto: 'Así dice el Señor de los ejércitos: «Pondré en movimiento todos los pueblos; vendrán las riquezas de todo el mundo, y llenaré de gloria este templo —dice el Señor de los ejércitos—. La gloria de este segundo templo será mayor que la del primero; y en este sitio daré la paz —oráculo del Señor de los ejércitos—.»'
    pascua:
      ant: Ésta es la casa del Señor, construida sólidamente sobre roca firme. Aleluia.
      versiculo:
      - - V
        - Entrad por las puertas del Señor con acción de gracias. Aleluia.
      - - R
        - Por sus atrios con himnos. Aleluia.
virgen-maria:
  nombre: Común de la Santísima Virgen María
  tercia:
    lectura:
      ref: So 3, 14. 15b
      texto: Regocíjate, hija de Sión; grita de júbilo, Israel; alégrate y gózate de todo corazón, hija de Jerusalén. El Señor será el rey de Israel, en medio de ti.
    ant: Todos se dedicaban a la oración en común, con María la madre de Jesús.
    versiculo:
    - - V
      - Dichosos los que escuchan la palabra de Dios.
    - - R
      - Y la cumplen.
    pascua:
      ant: Todos se dedicaban a la oración en común, con María la madre de Jesús. Aleluia.
      versiculo:
      - - V
        - Dichosos los que escuchan la palabra de Dios. Aleluia.
      - - R
        - Y la cumplen. Aleluia.
  sexta:
    lectura:
      ref: Za 9, 9a
      texto: Alégrate, hija de Sión; canta, hija de Jerusalén. Mira a tu Rey que viene a ti, justo y victorioso.
    ant: 'Dijo la madre de Jesús: «Haced lo que él diga.»'
    versiculo:
    - - V
      - Dichoso el seno de santa María Virgen.
    - - R
      - Que llevó al Hijo del eterno Padre.
    pascua:
      ant: 'Dijo la madre de Jesús: «Haced lo que él diga.» Aleluia.'
      versiculo:
      - - V
        - Dichoso el seno de santa María Virgen. Aleluia.
      - - R
        - Que llevó al Hijo del eterno Padre. Aleluia.
  nona:
    lectura:
      ref: Jdt 13, 18-19
      texto: Que el Altísimo te bendiga, hija, más que a todas las mujeres de la tierra. Bendito el Señor, creador del cielo y tierra, que enderezó tu golpe contra la cabeza del general enemigo. Los que recuerden esta hazaña de Dios jamás perderán la confianza que tú inspiras.
    ant: 'Dijo el Señor a su madre: «Mujer, ahí tienes a tu hijo.» Luego dijo al discípulo: «Ahí tienes a tu madre.»'
    versiculo:
    - - V
      - Bendita tú entre las mujeres.
    - - R
      - Y bendito el fruto de tu vientre.
    pascua:
      ant: 'Dijo el Señor a su madre: «Mujer, ahí tienes a tu hijo.» Luego dijo al discípulo: «Ahí tienes a tu madre.» Aleluia.'
      versiculo:
      - - V
        - Bendita tú entre las mujeres. Aleluia.
      - - R
        - Y bendito el fruto de tu vientre. Aleluia.
apostoles:
  nombre: Común de apóstoles
  tercia:
    lectura:
      ref: 2 Co 5, 19b-20
      texto: Dios nos ha confiado el mensaje de la reconciliación. Por eso nosotros actuamos como enviados de Cristo, y es como si Dios mismo os exhortara por medio nuestro. En nombre de Cristo os pedimos que os reconciliéis con Dios.
    ant: 'Id y proclamad el Evangelio del Señor: gratis habéis recibido, dad gratis.'
    versiculo:
    - - V
      - A toda la tierra alcanza su pregón.
    - - R
      - Y hasta los límites del orbe su lenguaje.
    pascua:
      ant: 'Id y proclamad el Evangelio del Señor: gratis habéis recibido, dad gratis. Aleluia.'
      versiculo:
      - - V
        - A toda la tierra alcanza su pregón. Aleluia.
      - - R
        - Y hasta los límites del orbe su lenguaje. Aleluia.
  sexta:
    lectura:
      ref: Hch 5, 12a. 14
      texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
    ant: Yo estoy con vosotros todos los días, hasta el fin del mundo.
    versiculo:
    - - V
      - Guardaron los preceptos del Señor.
    - - R
      - Las normas y mandatos que les ordenó.
    pascua:
      ant: Yo estoy con vosotros todos los días, hasta el fin del mundo. Aleluia.
      versiculo:
      - - V
        - Guardaron los preceptos del Señor. Aleluia.
      - - R
        - Las normas y mandatos que les ordenó. Aleluia.
  nona:
    lectura:
      ref: Hch 5, 41-42
      texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
    ant: Con vuestra perseverancia, salvaréis vuestras almas.
    versiculo:
    - - V
      - Estad alegres, dice el Señor.
    - - R
      - Porque vuestros nombres están inscritos en el cielo.
    pascua:
      ant: Con vuestra perseverancia, salvaréis vuestras almas. Aleluia.
      versiculo:
      - - V
        - Estad alegres, dice el Señor. Aleluia.
      - - R
        - Porque vuestros nombres están inscritos en el cielo. Aleluia.
varios-martires:
  nombre: 'Común de mártires: para varios mártires'
  tercia:
    lectura:
      ref: 1 Pe 5, 10-11
      texto: Tras un breve padecer, el Dios de toda gracia, que os ha llamado a su eterna gloria en Cristo Jesús, él mismo os restablecerá, os afianzará, os robustecerá. A él la gloria y el poder, por los siglos de los siglos. Amén.
    ant: El Señor les dio la victoria en la dura batalla, para que supieran que la sabiduría es más fuerte que nada.
    versiculo:
    - - V
      - Los santos que esperan en el Señor.
    - - R
      - Serán fuertes y no fallarán.
    pascua:
      ant: El Señor les dio la victoria en la dura batalla, para que supieran que la sabiduría es más fuerte que nada. Aleluia.
      versiculo:
      - - V
        - Los santos que esperan en el Señor. Aleluia.
      - - R
        - Serán fuertes y no fallarán. Aleluia.
  sexta:
    lectura:
      ref: Cf. Hb 11, 33
      texto: Los santos, por la fe, subyugaron reinos, ejercieron la justicia, alcanzaron lo prometido, por su fe en Cristo nuestro Señor.
    ant: El Señor los coronó con una diadema de justicia, y les dio un nombre santo y glorioso.
    versiculo:
    - - V
      - Vuestra tristeza.
    - - R
      - Se convertirá en alegría.
    pascua:
      ant: El Señor los coronó con una diadema de justicia, y les dio un nombre santo y glorioso. Aleluia.
      versiculo:
      - - V
        - Vuestra tristeza. Aleluia.
      - - R
        - Se convertirá en alegría. Aleluia.
  nona:
    lectura:
      ref: Sb 3, 1-2a. 3b
      texto: Las almas de los justos están en las manos de Dios y no los alcanzará tormento alguno. Creyeron los insensatos que habían muerto; pero ellos están en la paz.
    ant: Al ir, iban llorando, llevando la semilla.
    versiculo:
    - - V
      - Al volver, vuelven cantando.
    - - R
      - Trayendo sus gavillas.
    pascua:
      ant: Al ir, iban llorando, llevando la semilla. Aleluia.
      versiculo:
      - - V
        - Al volver, vuelven cantando. Aleluia.
      - - R
        - Trayendo sus gavillas. Aleluia.
un-martir:
  nombre: 'Común de mártires: para un mártir'
  tercia:
    lectura:
      ref: 1 Pe 5, 10-11
      texto: Tras un breve padecer, el Dios de toda gracia, que os ha llamado a su eterna gloria en Cristo Jesús, él mismo os restablecerá, os afianzará, os robustecerá. A él la gloria y el poder, por los siglos de los siglos. Amén.
    ant: El Señor le dio la victoria en la dura batalla, para que supiera que la sabiduría es más fuerte que nada.
    versiculo:
    - - V
      - El Señor lo [la] revistió con un manto de gloria.
    - - R
      - Y puso sobre su cabeza la corona de vencedor.
    pascua:
      ant: El Señor le dio la victoria en la dura batalla, para que supiera que la sabiduría es más fuerte que nada. Aleluia.
      lectura:
        ref: Ap 2,10
        texto: No temas nada de lo que vas a sufrir, porque el diablo va a meter a algunos de vosotros en la cárcel para poneros a prueba; tus apuros durarán diez días. Sé fiel hasta la muerte, y te daré la corona de la vida.
      versiculo:
      - - V
        - El Señor lo [la] revistió con un manto de gloria. Aleluia.
      - - R
        - Y puso sobre su cabeza la corona de vencedor. Aleluia.
    variantes:
      lectura:
      - etiqueta: 'opcion: 1'
        texto:
          ref: 1 Pe 5, 10-11
          texto: Tras un breve padecer, el mismo Dios de toda gracia, que os ha llamado en Cristo a su eterna gloria, os restablecerá, os afianzará, os robustecerá. Suyo es el poder por los siglos. Amén.
      versiculo:
      - etiqueta: 'opcion: 2'
        texto:
        - - V
          - Los santos que esperan en el Señor.
        - - R
          - Serán fuertes y no fallarán.
  sexta:
    lectura:
      ref: St 1, 12
      texto: Dichoso el hombre que soporta la prueba, porque, una vez aquilatado, recibirá la corona de la vida que el Señor ha prometido a los que lo aman.
    ant: El Señor lo [la] coronó con una diadema de justicia, y le dio un nombre de gloria.
    versiculo:
    - - V
      - En Dios confío y no temo.
    - - R
      - ¿Qué podrá hacerme un mortal?
    pascua:
      ant: El Señor lo [la] coronó con una diadema de justicia, y le dio un nombre de gloria. Aleluia.
      lectura:
        ref: Ap 3, 21
        texto: Al que salga vencedor lo sentaré en mi trono, junto a mí; lo mismo que yo, cuando vencí, me senté en el trono de mi Padre, junto a él.
      versiculo:
      - - V
        - En Dios confío y no temo. Aleluia.
      - - R
        - ¿Qué podrá hacerme un mortal? Aleluia.
    variantes:
      lectura:
      - etiqueta: 'opcion: 2'
        texto:
          ref: Cf. Hb 11, 33
          texto: Los santos, por la fe, subyugaron reinos, ejercieron la justicia, alcanzaron lo prometido, por su fe en Cristo nuestro Señor.
      versiculo:
      - etiqueta: 'opcion: 2'
        texto:
        - - V
          - Vuestra tristeza.
        - - R
          - Se convertirá en alegría.
  nona:
    lectura:
      ref: Sb 3, 1-2a. 3b
      texto: Las almas de los justos están en las manos de Dios y no los alcanzará tormento alguno. Creyeron los insensatos que habían muerto; pero ellos están en la paz.
    ant: Al ir, iban llorando, llevando la semilla.
    versiculo:
    - - V
      - Al volver, vuelven cantando.
    - - R
      - Trayendo sus gavillas.
    pascua:
      ant: Al ir, iban llorando, llevando la semilla. Aleluia.
      lectura:
        ref: Ap 19, 7.9
        texto: Con alegría y regocijo, demos gloria a Dios, porque han llegado las bodas del Cordero. Dichosos los invitados al banquete de bodas del Cordero.
      versiculo:
      - - V
        - Al volver, vuelven cantando. Aleluia.
      - - R
        - Trayendo sus gavillas. Aleluia.
    variantes:
      lectura:
      - etiqueta: 'opcion: 1'
        texto:
          ref: Sb 13, 1-2a. 3b
          texto: La vida de los justos está en manos de Dios y no los tocará el tormento. La gente insensata pensaba que morían, pero ellos están en paz.
pastores:
  nombre: Común de pastores
  tercia:
    lectura:
      ref: 1 Tm 4, 16
      texto: Vigílate a ti mismo y a tu enseñanza; sé constante en ello; obrando así, te salvarás a ti mismo y a los que te escuchan.
    ant: Padre, como tú me enviaste al mundo, así también los envío yo al mundo.
    versiculo:
    - - V
      - Escogió el Señor a su siervo.
    - - R
      - Para pastorear a Jacob, su heredad.
    pascua:
      ant: Padre, como tú me enviaste al mundo, así también los envío yo al mundo. Aleluia.
      versiculo:
      - - V
        - Escogió el Señor a su siervo. Aleluia.
      - - R
        - Para pastorear a Jacob, su heredad. Aleluia.
  sexta:
    lectura:
      ref: 1 Tm 1, 12
      texto: Doy gracias a Cristo Jesús, nuestro Señor, que me hizo capaz, se fió de mí y me confió este ministerio.
    ant: El que os recibe a vosotros me recibe a mí, y el que me recibe a mí recibe al que me ha enviado.
    versiculo:
    - - V
      - No me avergüenzo del Evangelio.
    - - R
      - Que es una fuerza de Dios para la salvación.
    pascua:
      ant: El que os recibe a vosotros me recibe a mí, y el que me recibe a mí recibe al que me ha enviado. Aleluia.
      versiculo:
      - - V
        - No me avergüenzo del Evangelio. Aleluia.
      - - R
        - Que es una fuerza de Dios para la salvación. Aleluia.
  nona:
    lectura:
      ref: 1 Tm 3, 13
      texto: Los que ejercen bien el diaconado alcanzan un puesto honroso y grande entereza en la fe de Cristo Jesús.
    ant: Somos colaboradores de Dios, y vosotros campo de Dios, edificación de Dios.
    versiculo:
    - - V
      - Si el Señor no construye la casa.
    - - R
      - En vano se cansan los albañiles.
    pascua:
      ant: Somos colaboradores de Dios, y vosotros campo de Dios, edificación de Dios. Aleluia.
      versiculo:
      - - V
        - Si el Señor no construye la casa. Aleluia.
      - - R
        - En vano se cansan los albañiles. Aleluia.
virgenes:
  nombre: Común de vírgenes
  tercia:
    lectura:
      ref: Sb 8, 21
      texto: Comprendí que no podría poseer la sabiduría si Dios no me la daba, y ya era un fruto de la prudencia saber de quién procedía esta gracia.
    ant: Para mí lo bueno es estar junto a Dios, y hacer del Señor mi refugio.
    versiculo:
    - - V
      - Ésta es la virgen sensata.
    - - R
      - Que el Señor encontró velando.
    pascua:
      ant: Para mí lo bueno es estar junto a Dios, y hacer del Señor mi refugio. Aleluia.
      versiculo:
      - - V
        - Ésta es la virgen sensata. Aleluia.
      - - R
        - Que el Señor encontró velando. Aleluia.
  sexta:
    lectura:
      ref: 1 Co 7, 25
      texto: Respecto al celibato no tengo órdenes del Señor, sino que doy mi parecer como hombre de fiar que soy, por la misericordia del Señor.
    ant: Sosténme, Señor, con tu promesa y viviré, que no quede frustrada mi esperanza.
    versiculo:
    - - V
      - Ésta es la virgen sensata.
    - - R
      - Una del número de las prudentes.
    pascua:
      ant: Sosténme, Señor, con tu promesa y viviré, que no quede frustrada mi esperanza. Aleluia.
      versiculo:
      - - V
        - Ésta es la virgen sensata. Aleluia.
      - - R
        - Una del número de las prudentes. Aleluia.
  nona:
    lectura:
      ref: Ap 19, 6. 7
      texto: Reina el Señor, nuestro Dios, dueño de todo; alegrémonos y gocemos y démosle gracias, porque llegó la boda del Cordero, y su esposa se ha embellecido.
    ant: Qué hermosa y resplandeciente es la generación casta.
    versiculo:
    - - V
      - Encontré al amor de mi alma.
    - - R
      - Lo abracé y ya no lo soltaré.
    pascua:
      ant: Qué hermosa y resplandeciente es la generación casta. Aleluia.
      versiculo:
      - - V
        - Encontré al amor de mi alma. Aleluia.
      - - R
        - Lo abracé y ya no lo soltaré. Aleluia.
santos-varones:
  nombre: Común de santos varones
  tercia:
    lectura:
      ref: Ga 6, 8
      texto: Lo que uno siembre, eso cosechará. El que siembre en su carne, de la carne cosechará corrupción; el que siembre en el Espíritu, del Espíritu cosechará vida eterna.
    ant: Quien guarda la palabra de Cristo ha llegado ciertamente a la plenitud del amor.
    versiculo:
    - - V
      - El Señor enseña su camino a los humildes.
    - - R
      - Hace caminar a los humildes con rectitud.
    pascua:
      ant: Quien guarda la palabra de Cristo ha llegado ciertamente a la plenitud del amor. Aleluia.
      versiculo:
      - - V
        - El Señor enseña su camino a los humildes. Aleluia.
      - - R
        - Hace caminar a los humildes con rectitud. Aleluia.
  sexta:
    lectura:
      ref: 1 Co 9, 26. 27a
      texto: Yo corro, no como a la ventura; y ejerzo el pugilato, no como dando golpes en el vacío, sino que golpeo mi cuerpo y lo esclavizo.
    ant: El que cumple la voluntad de mi Padre que está en el cielo, éste entrará en el reino de los cielos.
    versiculo:
    - - V
      - Dichoso el hombre a quien tú educas, Señor.
    - - R
      - Al que enseñas tu ley.
    pascua:
      ant: El que cumple la voluntad de mi Padre que está en el cielo, éste entrará en el reino de los cielos. Aleluia.
      versiculo:
      - - V
        - Dichoso el hombre a quien tú educas, Señor. Aleluia.
      - - R
        - Al que enseñas tu ley. Aleluia.
  nona:
    lectura:
      ref: Flp 4, 8, 9b
      texto: Todo lo que es verdadero, noble, justo, puro, amable, laudable, todo lo que es virtud o mérito, tenedlo en cuenta, hermanos. Y el Dios de la paz estará con vosotros.
    ant: Nadie vio, Señor, fuera de ti, lo que has preparado para los que te aman.
    versiculo:
    - - V
      - Que se alegren los que se acogen a ti.
    - - R
      - Que se llenen de gozo los que aman tu nombre.
    pascua:
      ant: Nadie vio, Señor, fuera de ti, lo que has preparado para los que te aman. Aleluia.
      versiculo:
      - - V
        - Que se alegren los que se acogen a ti. Aleluia.
      - - R
        - Que se llenen de gozo los que aman tu nombre. Aleluia.
santas-mujeres:
  nombre: Común de santas mujeres
  tercia:
    lectura:
      ref: Ga 6, 8
      texto: Lo que uno siembre, eso cosechará. El que siembre en su carne, de la carne cosechará corrupción; el que siembre en el Espíritu, del Espíritu cosechará vida eterna.
    ant: Sobre mis siervos y siervas derramaré mi Espíritu.
    versiculo:
    - - V
      - Dichosos los que con vida intachable.
    - - R
      - Caminan en la voluntad del Señor.
    pascua:
      ant: Sobre mis siervos y siervas derramaré mi Espíritu. Aleluia.
      versiculo:
      - - V
        - Dichosos los que con vida intachable. Aleluia.
      - - R
        - Caminan en la voluntad del Señor. Aleluia.
  sexta:
    lectura:
      ref: 1 Co 9, 26. 27a
      texto: Yo corro, no como a la ventura; y ejerzo el pugilato, no como dando golpes en el vacío, sino que golpeo mi cuerpo y lo esclavizo.
    ant: Mi corazón y mi carne se alegran por el Dios vivo.
    versiculo:
    - - V
      - Encontré al amor de mi alma.
    - - R
      - Lo abracé y ya no lo soltaré.
    pascua:
      ant: Mi corazón y mi carne se alegran por el Dios vivo. Aleluia.
      versiculo:
      - - V
        - Encontré al amor de mi alma. Aleluia.
      - - R
        - Lo abracé y ya no lo soltaré. Aleluia.
  nona:
    lectura:
      ref: Flp 4, 8, 9b
      texto: Todo lo que es verdadero, noble, justo, puro, amable, laudable, todo lo que es virtud o mérito, tenedlo en cuenta, hermanos. Y el Dios de la paz estará con vosotros.
    ant: Mi amado es para mí y yo para él.
    versiculo:
    - - V
      - Para ti es mi música, Señor.
    - - R
      - Voy a explicar el camino perfecto.
    pascua:
      ant: Mi amado es para mí y yo para él. Aleluia.
      versiculo:
      - - V
        - Para ti es mi música, Señor. Aleluia.
      - - R
        - Voy a explicar el camino perfecto. Aleluia.
difuntos:
  nombre: Oficio de difuntos
  salmodia_propia: true
  tercia:
    lectura:
      ref: Jb 19, 25-26
      texto: Sé que mi Redentor vive y que en el último día yo resucitaré de la tierra; y de nuevo me revestiré de mi piel; y en mi carne veré a Dios.
    ant: Vuélvete, Señor, liberta mi alma.
    versiculo:
    - - V
      - ¿Por qué te acongojas, alma mía, por qué te me turbas?
    - - R
      - Espera en Dios, que volverás a alabarlo.
    opciones:
      lectura:
      - ref: 2M 7, 9a
        texto: Cuando hayamos muerto por su ley, el rey del universo nos resucitará para una vida eterna.
      himno:
      - Camino del sepulcro, preguntábamos
    himno: Dejad que el grano se muera
  sexta:
    lectura:
      ref: Sb 1, 13-14a. 15
      texto: Dios no hizo la muerte, ni se recrea en la destrucción de los vivientes; todo lo creó para que subsistiera, porque la justicia es inmortal.
    ant: Sana, Señor, mi alma, porque he pecado contra ti.
    versiculo:
    - - V
      - Aunque camine por cañadas oscuras, nada temo.
    - - R
      - Porque tú, Señor, vas conmigo.
    himno: Dejad que el grano se muera
    opciones:
      himno:
      - Camino del sepulcro, preguntábamos
  nona:
    lectura:
      ref: Is 25, 8
      texto: Aniquilará Dios la muerte para siempre. El Señor Dios enjugará las lágrimas de todos los rostros, y el oprobio de su pueblo lo alejará de todo el país —lo ha dicho el Señor—.
    ant: Oh Dios, sálvame por tu nombre, sal por mí con tu poder.
    versiculo:
    - - V
      - Escucha, Señor, mis súplicas.
    - - R
      - A ti acude todo mortal.
    himno: Dejad que el grano se muera
    opciones:
      himno:
      - Camino del sepulcro, preguntábamos
