santos-varones:
  nombre: Común de santos varones
  himno: Cuando, Señor, el día ya declina
  salmodia:
  - ant: Fue hallado intachable y perfecto; su gloria será eterna.
    salmo: salmo-14
  - ant: El Señor protege a sus santos y les muestra su amor y su misericordia.
    salmo: salmo-111
  - ant: Los santos cantaban un cántico nuevo ante el trono de Dios y del Cordero, y sus voces llenaban toda la tierra.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
  responsorio:
  - - V
    - El Señor es justo y ama la justicia.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Los buenos verán su rostro.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es justo y ama la justicia.
  ant_magnificat: 'Empleado fiel y cumplidor, pasa al banquete de tu Señor. Para varios santos: Se mantuvieron fieles hasta la muerte y recibieron del Señor la corona de la vida.'
  preces:
    intro: 'Pidamos a Dios Padre, fuente de toda santidad, que con la intercesión y el ejemplo de los santos nos ayude, y digamos:'
    respuesta: Haz que seamos santos, porque tú, Señor, eres santo.
    preces:
    - - Padre santo, que has querido que nos llamemos y seamos hijos tuyos,
      - haz que la Iglesia santa, extendida por los confines de la tierra, cante tus grandezas.
    - - Padre santo, que deseas que vivamos de una manera digna, buscando siempre tu beneplácito,
      - ayúdanos a dar fruto de buenas obras.
    - - Padre santo, que nos reconciliaste contigo por medio de Cristo,
      - guárdanos en tu nombre para que todos seamos uno.
    - - Padre santo, que nos convocas al banquete de tu reino,
      - haz que comiendo el pan que ha bajado del cielo alcancemos la perfección del amor. Padre santo, perdona a los pecadores sus delitos, — y admite a los difuntos en tu reino para que puedan contemplar tu rostro.
  padrenuestro_intro: 'Porque nos llamamos y somos hijos de Dios, nos atrevemos a decir:'
  oraciones:
  - para: ''
    texto: Confesamos, Señor, que sólo tú eres santo y que sin ti nadie es bueno, y humildemente te pedimos que la intercesión de san N. venga en nuestra ayuda para que de tal forma vivamos en el mundo que merezcamos llegar a la contemplación de tu gloria. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Concédenos, Señor todopoderoso, que el ejemplo de san N. nos estimule a una vida más perfecta y que cuantos celebramos su fiesta sepamos también imitar sus ejemplos. Por nuestro Señor Jesucristo.
  - para: varios santos
    texto: Dios todopoderoso y eterno, que al premiar a los santos nos ofreces una prueba de tu gran amor hacia los hombres, te pedimos que la intercesión y el ejemplo de los santos nos sirva siempre de ayuda para seguir más fielmente a Jesucristo, tu Hijo. Él que vive y reina contigo.
  - para: un santo religioso
    texto: Tú, Señor, que concediste a san N. el don de imitar con fidelidad a Cristo pobre y humilde, concédenos también a nosotros, por intercesión de este santo, la gracia de que, viviendo fielmente nuestra vocación, tendamos hacia la perfección que nos propones en la persona de tu Hijo. Él que vive y reina contigo.
  - para: un santo abad
    texto: Tú, Señor, que nos has dado un modelo de perfección evangélica en la vida ejemplar de san N., abad, concédenos en medio de los acontecimientos de este mundo, que sepamos adherirnos, con todo nuestro corazón, a los bienes de tu reino eterno. Él que vive y reina contigo.
  - para: un santo que se ha consagrado a una actividad caritativa
    texto: Señor Dios todopoderoso, que nos has revelado que el amor a Dios y al prójimo es el compendio de toda tu ley, haz que, imitando la caridad de san N., seamos contados un día entre los elegidos de tu reino. Por nuestro Señor Jesucristo.
  - para: un santo educador
    texto: Señor Dios todopoderoso, que de entre tus fieles elegiste a san N. para que manifestara a sus hermanos el camino que conduce a ti, concédenos que su ejemplo nos ayude a seguir a Jesucristo, nuestro maestro, para que logremos así alcanzar un día, junto con nuestros hermanos, la gloria de tu reino eterno. Por nuestro Señor Jesucristo.
  primeras:
    salmodia:
    - ant: Alabad a nuestro Dios, todos sus santos.
      salmo: salmo-112
    - ant: Dichosos los que tienen hambre y sed de la justicia, porque ellos quedarán saciados.
      salmo: salmo-145
    - ant: Bendito sea Dios, que nos ha elegido para ser santos e inmaculados en el amor.
      salmo: cantico-ef-1-3-10
    lectura:
      ref: Flp 3, 7-8
      texto: Todo lo que para mí era ganancia lo he estimado pérdida comparado con Cristo. Más aún, lo estimo pérdida comparado con la excelencia del conocimiento de Cristo Jesús, mi Señor. Por él lo perdí todo, y todo lo estimo basura con tal de ganar a Cristo.
    responsorio:
    - - V
      - El Señor lo amó y lo enalteció.
    - - R
      - El Señor lo amó y lo enalteció.
    - - V
      - Lo revistió con vestidura de gloria.
    - - R
      - El Señor lo amó y lo enalteció.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo
    - - R
      - El Señor lo amó y lo enalteció.
    ant_magnificat: 'Lo asemejaré a un hombre prudente, que edificó su casa sobre roca. Para varios santos: Los ojos del Señor están puestos en sus fieles, en los que esperan en su misericordia.'
