varios-martires:
  nombre: 'Común de mártires: para varios mártires'
  himno: Espíritus sublimes, ¡oh mártires gloriosos!
  salmodia:
  - ant: Los cuerpos de los santos fueron sepultados en paz, y su fama vive por generaciones.
    salmo: salmo-114
  - ant: Vi las almas de los sacrificados a causa de la palabra de Dios y del testimonio que mantuvieron.
    salmo: salmo-115
  - ant: Éstos son aquellos santos que entregaron sus cuerpos para ser fieles a la alianza de Dios y han lavado sus vestiduras con la sangre del Cordero.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1 Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Alegraos, justos, y gozad con el Señor.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  - - V
    - Aclamadlo, los rectos de corazón.
  - - R
    - Y gozad con el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  ant_magnificat: Se alegran en el cielo los santos que siguieron las huellas de Cristo; y, porque lo amaron hasta derramar su sangre, reinan con el Señor eternamente.
  preces:
    intro: 'A la misma hora en que el Rey de los mártires ofreció su vida, en la última cena, y la entregó en la cruz, démosle gracias, diciendo:'
    respuesta: Te glorificamos, Señor.
    preces:
    - - 'Porque nos amaste hasta el extremo, Salkvador nuestro, principio y origen de todo martirio: Te glorificamos, Señor.'
    - - 'Porque no cesas de llamar a los pecadores arrepentidos, para los premios de tu reino: Te glorificamos, Señor.'
    - - 'Porque has dado a la Iglesia, como sacrificio, a sangre de la alianza nueva y eterna para el perdón de los pecados: Te glorificamos, Señor.'
    - - 'Porque, con tu gracia, nos has dado perseverancia en la fe, durante el día que ahora termina: Te glorificamos, Señor.'
    - - Porque has asociado a tu muerte a nuestros hermanos difuntos. Te glorificamos, Señor.
  padrenuestro_intro: ''
  oraciones:
  - para: ''
    texto: 'Dios todopoderoso y eterno, que diste a los santos mártires N. y N. la valentía de aceptar la muerte por el nombre de Cristo: concede también tu fuerza a nuestra debilidad para que, a ejemplo de aquellos que no dudaron en morir por ti, nosotros sepamos también ser fuertes, confesando tu nombre con nuestras vidas. Por nuestro Señor Jesucristo.'
  - para: ''
    texto: Que la poderosa intercesión de los santos mártires N. y N. sea nuestra ayuda, Señor, y que su oración nos haga fuertes en la confesión intrépida de tu verdad. Por nuestro Señor Jesucristo.
  - para: las mártires vírgenes
    texto: Tú, Señor, que nos alegras hoy con la fiesta anual de las santas N. y N., concédenos la ayuda de sus méritos, ya que has querido iluminarnos con el ejemplo de su virginidad y de su fortaleza. Por nuestro Señor Jesucristo.
  - para: las santas mujeres
    texto: Señor, ya que por don tuyo la fuerza se realiza en la debilidad, concede a cuantos estamos celebrando la victoria de las santas mártires N. y N. que obtengamos la fortaleza de vencer nuestras dificultades como ellas vencieron los tormentos del martirio. Por nuestro Señor Jesucristo.
  pascua:
    salmodia:
    - ant: Los cuerpos de los santos fueron sepultados en paz, y su fama vive por generaciones. Aleluia.
      salmo: salmo-114
    - ant: Vi las almas de los sacrificados a causa de la palabra de Dios y del testimonio que mantuvieron. Aleluia.
      salmo: salmo-115
    - ant: Éstos son aquellos santos que entregaron sus cuerpos para ser fieles a la alianza de Dios y han lavado sus vestiduras con la sangre del Cordero. Aleluia.
      salmo: cantico-ap-4-11-5-9-10-12
    lectura:
      ref: Ap 7, 14-17
      texto: 'Estos son los que vienen de la gran tribulación: han lavado y blanqueado sus mantos en la sangre del Cordero. Por eso están ante el trono de Dios dándole culto día y noche en su templo. El que se sienta en el trono acampará entre ellos. Ya no pasarán hambre ni sed, no les hará daño el sol ni el bochorno. Porque el Cordero que está delante del trono será su pastor, y los conducirá hacia fuentes de aguas vivas. Y Dios enjugará las lágrimas de sus ojos.'
    responsorio:
    - - V
      - Los justos brillarán en la presencia del Señor. Aleluia, aleluia.
    - - R
      - Los justos brillarán en la presencia del Señor. Aleluia, aleluia.
    - - V
      - Se alegrarán los de corazón sincero.
    - - R
      - Aleluia, aleluia.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo.
    - - R
      - Los justos brillarán en la presencia del Señor. Aleluia, aleluia.
    ant_magnificat: Alegraos, santos, delante del Cordero, porque el reino de Dios está preparado para vosotros desde la constitución del mundo. Aleluia.
  variantes:
    preces:
    - etiqueta: 'opcion: 2'
      texto:
        intro: 'En esta hora en la que el Señor, cenando con sus discípulos, presentó al Padre su propia vida que luego entregó en la cruz, aclamemos al Rey de los mártires, diciendo:'
        respuesta: Te glorificamos, Señor.
        preces:
        - - Te damos gracias, Señor, principio, ejemplo y rey de los mártires,
          - porque nos amaste hasta el extremo.
        - - Te damos gracias, Señor, porque no cesas de llamar a los pecadores arrepentidos,
          - y les das parte en los premios de tu reino.
        - - Te damos gracias, Señor, porque has dado a la Iglesia, como sacrificio para el perdón de los pecados,
          - la sangre de la alianza nueva y eterna.
        - - Te damos gracias, Señor, porque con tu gracia nos has dado perseverar en la fe,
          - durante el día que ahora termina.
        - - Te damos gracias, Señor,
          - porque has asociado a nuestros hermanos difuntos a tu muerte.
  primeras:
    salmodia:
    - ant: Muchos tormentos sufrieron los santos antes de alcanzar la palma del martirio.
      salmo: salmo-117-i
    - ant: Los santos han llegado al reino con la palma del martirio, y de la mano de Dios han recibido una corona de gloria.
      salmo: salmo-117-ii
    - ant: Los mártires murieron por Cristo, pero ahora viven eternamente.
      salmo: cantico-1pe-2-21b-24
    lectura:
      ref: Rm 8, 35. 37-39
      texto: ¿Quién podrá apartarnos del amor de Cristo? ¿La aflicción? ¿La angustia? ¿La persecución? ¿El hambre? ¿La desnudez? ¿El peligro? ¿La espada? En todo esto vencemos fácilmente por aquel que nos ha amado. Pues estoy convencido de que ni muerte, ni vida, ni ángeles, ni principados, ni presente, ni futuro, ni potencias, ni altura, ni profundidad, ni creatura alguna, podrá apartarnos del amor de Dios manifestado en Cristo Jesús, Señor nuestro.
    responsorio:
    - - V
      - Las almas de los justos están en las manos de Dios.
    - - R
      - Las almas de los justos están en las manos de Dios.
    - - V
      - Y no los alcanzará tormento alguno.
    - - R
      - Las almas de los justos están en las manos de Dios.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo.
    - - R
      - Las almas de los justos están en las manos de Dios.
    ant_magnificat: A éstos pertenece el reino de los cielos, porque no sobrepreciaron la vida de la tierra, y, lavando sus túnicas con la sangre del Cordero, alcanzaron los premios del reino eterno.
