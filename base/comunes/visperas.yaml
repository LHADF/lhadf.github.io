  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oraciones:
  - para: ''
    texto: Dios de poder y misericordia, que diste tu fuerza al mártir san N. para que pudiera resistir el dolor de su martirio, concédenos que quienes celebramos hoy el día de su victoria, con tu protección, vivamos libres de las asechanzas del enemigo. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Dios todopoderoso y eterno, que concediste a san N. luchar por la fe hasta derramar su sangre, haz que, ayudados por su intercesión, soportemos por tu amor nuestras dificultades y con valentía caminemos hacia ti que eres la fuente de toda vida. Por nuestro Señor Jesucristo.
