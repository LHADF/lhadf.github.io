santas-mujeres:
  nombre: Común de santas mujeres
  himno: Finísimo fue el lino con que ella
  salmodia:
  - ant: Tu sierva, Señor, se regocijó con tu salvación.
    salmo: salmo-121
  - ant: Como está sólido el fundamento sobre la roca, así estuvo la voluntad de Dios en el corazón de la mujer santa.
    salmo: salmo-126
  - ant: El Señor te ha dado su fuerza, por ello serás bendita eternamente.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
  responsorio:
  - - V
    - Dios la eligió y la predestinó.
  - - R
    - Dios la eligió y la predestinó.
  - - V
    - Le hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la eligió y la predestinó.
  ant_magnificat: Mi corazón se regocija por el Señor y queda saciado, porque gozo con mi salvación.
  preces:
    intro: 'Supliquemos a Dios en bien de su Iglesia por intercesión de las santas mujeres y digámosle:'
    respuesta: Acuérdate, Señor, de tu Iglesia.
    preces:
    - - Por intercesión de las santas mártires, que con la fuerza del espíritu superaron la muerte del cuerpo,
      - concede, Señor, a tu Iglesia ser fuerte en la tentación.
    - - Por intercesión de las santas esposas, que por medio del matrimonio crecieron en tu amor,
      - concede, Señor, a tu Iglesia la fecundidad apostólica.
    - - Por intercesión de las santas viudas, que por la hospitalidad y la oración superaron la soledad,
      - concede, Señor, a tu Iglesia ser para el mundo signo manifiesto de tu amor a los hombres.
    - - Por intercesión de las santas madres, que engendraron sus hijos no sólo para la vida del mundo, sino también para la salvación eterna,
      - concede, Señor, a tu Iglesia engendrar para tu reino a todos los pueblos. Por intercesión de todas las mujeres santas, que han sido ya admitidas a contemplar la belleza de tu rostro, — concede, Señor, a los difuntos de la Iglesia gozar también de la luz eterna de tu presencia.
  padrenuestro_intro: 'Fieles a la recomendación del Salvador, digamos al Padre común:'
  oraciones:
  - para: ''
    texto: Tú, Señor, que todos los años nos alegras con la fiesta de santa N., concede a los que estamos celebrando su memoria imitar también los ejemplos de su vida santa. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Concédenos, Señor, un conocimiento profundo y un amor intenso a tu santo nombre, semejantes a los que diste a santa N., para que así, sirviéndote con sinceridad y lealtad, a ejemplo suyo también nosotros te agrademos con nuestra fe y con nuestras obras. Por nuestro Señor Jesucristo.
  - para: varias santas mujeres
    texto: Señor todopoderoso y eterno, que nos has dado como ejemplo para imitar la vida de las santas N. y N., concédenos también que su valiosa intercesión venga siempre en nuestra ayuda. Por nuestro Señor Jesucristo.
  - para: una santa religiosa
    texto: Tú, Señor, que concediste a santa N. el don de imitar con fidelidad a Cristo pobre y humilde, concédenos también a nosotros, por intercesión de esta santa, la gracia de que, viviendo fielmente nuestra vocación, tendamos hacia la perfección que nos propones en la persona de tu Hijo. Él que vive y reina contigo.
  - para: una santa que se ha consagrado a una actividad caritativaa
    texto: Señor Dios todopoderoso, que nos has revelado que el amor a Dios y al prójimo es el compendio de toda tu ley, haz que, imitando la caridad de santa N., seamos contados un día entre los elegidos de tu reino. Por nuestro Señor Jesucristo.
  - para: una santa educadora
    texto: Señor Dios todopoderoso, que de entre tus fieles elegiste a santa N. para que manifestara a sus hermanos el camino que conduce a ti, concédenos que su ejemplo nos ayude a seguir a Jesucristo, nuestro maestro, para que logremos así alcanzar un día, junto con nuestros hermanos, la gloria de tu reino eterno. Por nuestro Señor Jesucristo.
