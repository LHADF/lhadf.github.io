      - ant: Engendraste al que te creó y permanecerás virgen para siempre. Aleluia.
        salmo: salmo-147
      - ant: Tú eres la mujer a quien Dios ha bendecido, y por ti hemos recibido el fruto de la vida. Aleluia.
        salmo: cantico-ef-1-3-10
      responsorio:
      - - V
