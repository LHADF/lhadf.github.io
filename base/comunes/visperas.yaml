        - concede la abundancia de tu gracia a todos los hombres.
      - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
        - y que todos los fieles perseveren unánimes en oración con María, la madre de Jesús. Tú que coronaste a María como reina del cielo, — haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino.
    padrenuestro_intro: 'Confiando en el Señor, que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
    oraciones:
    - para: ''
      texto: Señor Dios todopoderoso, haz que, por la intercesión de santa María, la Virgen, nosotros, tus hijos, gocemos de plena salud de alma y cuerpo, vivamos alegres en medio de las dificultades del mundo y alcancemos la felicidad de tu reino eterno. Por nuestro Señor Jesucristo.
