# Comunes de visperas, del libro (Liturgia de las Horas, tomo III; tools/importar/comunes_libro.py).
# Se usan para las celebraciones sin textos propios en la base (base/santoral/adf.yaml) y para lo que les falte.
# «oraciones»: las que el libro da «en su defecto», con N. en lugar del nombre; «para» dice a quién corresponde cada una.
# El común de doctores trae solo algunas partes: el resto se copió del de pastores. Se corrigen acá.
dedicacion:
  nombre: Común de la dedicación de una iglesia
  himno: Nueva Jerusalén y ciudad santa
  salmodia:
  - ant: El Altísimo consagra su morada; teniendo a Dios en medio, no vacila.
    salmo: salmo-45
  - ant: Vamos alegres a la casa del Señor.
    salmo: salmo-121
  - ant: Alabad al Señor, nuestro Dios, todos sus santos. El cántico siguiente se dice con Aleluia, tal como está aquí, solamente cuando el Oficio es cantado. Cuando el Oficio se dice sin canto es suficiente decir Aleluia sólo al principio y al final de cada estrofa.
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Ap 21, 2-3. 22. 27
    texto: 'Vi la ciudad santa, la nueva Jerusalén, que descendía del cielo, enviada por Dios, arreglada como una novia que se adorna para su esposo. Y escuché una voz potente que decía desde el trono: «Ésta es la morada de Dios con los hombres, y acampará entre ellos. Ellos serán su pueblo y Dios estará con ellos.» Pero no vi santuario alguno en ella; porque el Señor, Dios todopoderoso, y el Cordero, es su santuario. Nada profano entrará en ella, ni los que cometen abominación y mentira, sino solamente los inscritos en el libro de la vida del Cordero.'
  responsorio:
  - - V
    - Dichosos, Señor, los que habitan en tu casa.
  - - R
    - Dichosos, Señor, los que habitan en tu casa.
  - - V
    - Alabándote siempre.
  - - R
    - En tu casa.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dichosos, Señor, los que habitan en tu casa.
  ant_magnificat: 'Santificó el Señor su tabernáculo, porque ésta es la casa de Dios, donde se invoca su nombre, del cual está escrito: «Mi nombre habitará allí», dice el Señor.'
  preces:
    intro: 'Oremos, hermanos, a nuestro Salvador, que dio su vida para reunir a los hijos de Dios dispersos, y digámosle:'
    respuesta: Acuérdate, Señor, de tu Iglesia.
    preces:
    - - Señor Jesús, que cimentaste tu casa en la roca,
      - confirma y robustece la fe y la esperanza de tu Iglesia.
    - - Señor Jesús, de cuyo costado salió sangre y agua,
      - renueva la Iglesia con los sacramentos de la nueva y eterna alianza.
    - - Señor Jesús, que estás en medio de los que se reúnen en tu nombre,
      - a tiende la oración unánime de tu Iglesia congregada.
    - - Señor Jesús, que con el Padre haces morada en los que te aman,
      - perfecciona a tu Iglesia por la caridad. Señor Jesús, que no echas fuera a ninguno de los que vienen a ti, — acoge a todos los difuntos en la mansión del Padre.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras que Cristo nos enseñó:'
  oraciones:
  - para: ''
    texto: 'Cuando el Oficio se celebra en la misma iglesia dedicada: Señor, tú que nos haces revivir cada año el día de la consagración de esta iglesia: escucha las súplicas de tu pueblo y concédenos que, en este lugar, sepamos ofrecerte siempre un servicio digno y obtengamos de ti una redención cada vez más plena. Por nuestro Señor Jesucristo. Cuando el Oficio se celebra fuera de la iglesia dedicada: Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo como cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por nuestro Señor Jesucristo.'
  - para: ''
    texto: 'Señor, Dios nuestro, que has congregado tu Iglesia y has hecho de ella el cuerpo de tu Hijo: haz que tu pueblo, reunido en tu nombre, te venere, te ame, te siga y, llevado por ti, alcance el reino que le tienes prometido. Por nuestro Señor Jesucristo.'
  primeras:
    salmodia:
    - ant: 'En las plazas de Jerusalén reina la alegría y en sus casas resuena el canto de gozo: «Aleluia».'
      salmo: salmo-146
    - ant: El Señor ha reforzado los cerrojos de tus puertas y ha bendecido a tus hijos dentro de ti.
      salmo: salmo-147
    - ant: En la ciudad de Dios se alegra la muchedumbre de los santos y los ángeles cantan himnos de júbilo ante el trono de Dios. Aleluia. El cántico siguiente se dice con Aleluia, tal como está aquí, solamente cuando el Oficio es cantado. Cuando el Oficio se dice sin canto es suficiente decir Aleluia sólo al principio y al final de cada estrofa.
      salmo: cantico-ap-19-1-2-5-7
    lectura:
      ref: Ef 2, 19-22
      texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
    responsorio:
    - - V
      - La santidad, Señor, es el adorno de tu casa.
    - - R
      - La santidad, Señor, es el adorno de tu casa.
    - - V
      - Por días sin término,
    - - R
      - Es el adorno de tu casa.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo.
    - - R
      - La santidad, Señor, es el adorno de tu casa.
    ant_magnificat: Gozad con Jerusalén, todos los que la amáis, y alegraos por siempre más de su alegría.
    preces:
      intro: 'Oremos, hermanos, a nuestro Salvador, que dio su vida para reunir a los hijos de Dios dispersos, y digámosle:'
      respuesta: Acuérdate, Señor, de tu Iglesia.
      preces:
      - - Señor Jesús, que cimentaste tu casa en la roca,
        - confirma y robustece la fe y la esperanza de tu Iglesia.
      - - Señor Jesús, de cuyo costado salió sangre y agua,
        - renueva la Iglesia con los sacramentos de la nueva y eterna alianza.
      - - Señor Jesús, que estás en medio de los que se reúnen en tu nombre,
        - atiende la oración unánime de tu Iglesia congregada.
      - - Señor Jesús, que con el Padre haces morada en los que te aman,
        - perfecciona a tu Iglesia por la caridad. Señor Jesús, que no echas fuera a ninguno de los que vienen a ti, — acoge a todos los difuntos en la mansión del Padre.
    padrenuestro_intro: 'Terminemos nuestra oración con las palabras que Cristo nos enseñó:'
    oraciones:
    - para: ''
      texto: 'Cuando el Oficio se celebra en la misma iglesia dedicada: Señor, tú que nos haces revivir cada año el día de la consagración de esta iglesia: escucha las súplicas de tu pueblo y concédenos que, en este lugar, sepamos ofrecerte siempre un servicio digno y obtengamos de ti una redención cada vez más plena. Por nuestro Señor Jesucristo. Cuando el Oficio se celebra fuera de la iglesia dedicada: Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo corno cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por nuestro Señor Jesucristo.'
    - para: ''
      texto: 'Señor, Dios nuestro, que has congregado tu Iglesia y has hecho de ella el cuerpo de tu Hijo: haz que tu pueblo, reunido en tu nombre, te venere, te ame, te siga y, llevado por ti, alcance el reino que le tienes prometido. Por nuestro Señor Jesucristo.'
virgen-maria:
  nombre: Común de la Santísima Virgen María
  himno: Todos te deben servir
  salmodia:
  - ant: Alégrate, María, llena de gracia, el Señor está contigo.
    salmo: salmo-121
  - ant: Aquí está la esclava del Señor, hágase en mí según tu palabra.
    salmo: salmo-126
  - ant: Bendita tú entre las mujeres y bendito el fruto de tu vientre.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Ga 4, 4-5
    texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
  responsorio:
  - - V
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - V
    - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  - - R
    - El Señor está contigo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  ant_magnificat: Dichosa tú, María, que has creído; porque lo que te ha dicho el Señor se cumplirá.
  preces:
    intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    respuesta: Que la llena de gracia interceda por nosotros.
    preces:
    - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
      - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - - Tú que nos diste a María por madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores,
      - y a todos abundancia de salud y de paz.
    - - Tú que hiciste de María la llena de gracia,
      - concede la abundancia de tu gracia a todos los hombres.
    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús. Tú que coronaste a María como reina del cielo, — haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino.
  padrenuestro_intro: 'Confiando en el Señor, que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oraciones:
  - para: ''
    texto: Señor Dios todopoderoso, haz que, por la intercesión de santa María, la Virgen, nosotros, tus hijos, gocemos de plena salud de alma y cuerpo, vivamos alegres en medio de las dificultades del mundo y alcancemos la felicidad de tu reino eterno. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Perdona, Señor, las culpas de tus fieles y haz que, quienes no logramos agradarte con nuestros actos seamos salvados por la intercesión de la Madre de tu Hijo, nuestro Señor Jesucristo. Él que vive y reina contigo.
  - para: ''
    texto: Ven en ayuda de nuestra debilidad, Dios de misericordia, y haz que, al recordar hoy a la Madre de tu Hijo, por su intercesión nos veamos libres de nuestras culpas. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Que venga en nuestra ayuda, Señor, la poderosa intercesión de la Virgen María; así nos veremos libres de todo peligro y gozaremos de tu paz. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Concédenos, Señor, la valiosa intercesión de la Virgen María, cuya gloriosa memoria hoy celebramos, y danos parte en los dones de tu amor por la intercesión de aquella a la que hiciste llena de gracia. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Te pedimos, Señor, que la maternal intercesión de la Madre de tu Hijo libre de los males del mundo y conduzca a los gozos de tu reino a los fieles que se alegran al saberse protegidos por la Virgen María. Por nuestro Señor Jesucristo.
  primeras:
    salmodia:
    - ant: Dichosa eres, Virgen María que llevaste en tu seno al Creador del mundo.
      salmo: salmo-112
    - ant: Engendraste al que te creó y permanecerás virgen para siempre.
      salmo: salmo-147
    - ant: Tú eres la mujer a quien Dios ha bendecido, y por ti hemos recibido el fruto de la vida.
      salmo: cantico-ef-1-3-10
    lectura:
      ref: Ga 4, 4-5
      texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la Ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
    responsorio:
    - - V
      - Después del parto, ¡oh Virgen!, has permanecido intacta.
    - - R
      - Después del parto, ¡oh Virgen!, has permanecido intacta.
    - - V
      - Madre de Dios, intercede por nosotros
    - - R
      - ¡Oh Virgen!, has permanecido intacta.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo
    - - R
      - Después del parto, ¡oh Virgen!, has permanecido intacta.
    ant_magnificat: El Señor ha mirado mi humillación y el Poderoso ha hecho obras grandes por mí.
    preces:
      intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la Madre de su Hijo, y supliquémosle diciendo:'
      respuesta: Que la llena de gracia interceda por nosotros.
      preces:
      - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
        - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
      - - Tú que nos diste a María por madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores,
        - ya todos abundancia de salud y de paz.
