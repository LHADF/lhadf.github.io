apostoles:
  nombre: Común de apóstoles
  himno: Benditos son los pies de los que llegan
  salmodia:
  - ant: Vosotros sois los que habéis perseverado conmigo en mis pruebas.
    salmo: salmo-115
  - ant: Yo estoy en medio de vosotros como el que sirve.
    salmo: salmo-125
  - ant: Ya no os llamo siervos, a vosotros os llamo amigos, porque todo lo que he oído a mi Padre os lo he dado a conocer.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Ef 4, 11-13,
    texto: Cristo ha constituido a unos, apóstoles; a otros, profetas; a otros, evangelistas; a otros, pastores y doctores, para el perfeccionamiento de los fieles, en función de su ministerio, y para la edificación del cuerpo de Cristo, hasta que lleguemos todos a la unidad en la fe y en el conocimiento del Hijo de Dios, al hombre perfecto, a la medida de Cristo en su plenitud.
  responsorio:
  - - V
    - Contad a los pueblos la gloria del Señor.
  - - R
    - Contad a los pueblos la gloria del Señor.
  - - V
    - Sus maravillas a todas las naciones.
  - - R
    - Contad a los pueblos la gloria del Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Contad a los pueblos la gloria del Señor.
  ant_magnificat: Cuando llegue la renovación y el Hijo del hombre se siente en el trono de su gloria, os sentaréis también vosotros en doce tronos para regir a las doce tribus de Israel.
  preces:
    intro: 'Hermanos: Edificados sobre el cimiento de los apóstoles, oremos al Padre por su pueblo santo, diciendo:'
    respuesta: Acuérdate, Señor, de tu Iglesia.
    preces:
    - - Padre santo, que quisiste que tu Hijo resucitado de entre los muertos se manifestara en primer lugar a los apóstoles,
      - haz que también nosotros seamos testigos de Cristo hasta los confines del mundo.
    - - Padre santo, tú que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
      - haz que sepamos proclamar el Evangelio a todas las criaturas.
    - - Tú que enviaste a tu Hijo a sembrar la semilla de la palabra,
      - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
    - - Tú que enviaste a tu Hijo para que reconciliara el mundo contigo,
      - haz que también nosotros cooperemos a la reconciliación de los hombres.
    - - Tú que quisiste que tu Hijo resucitara el primero de entre los muertos,
      - concede a todos los que son de Cristo resucitar con él, el día de su venida.
  padrenuestro_intro: 'Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  primeras:
    salmodia:
    - ant: Llamó Jesús a sus discípulos, escogió doce entre ellos, y les dio el nombre de apóstoles.
      salmo: salmo-116
    - ant: Dejaron las redes y siguieron al Señor, su redentor.
      salmo: salmo-147
    - ant: Vosotros sois mis amigos, porque permanecisteis en mi amor.
      salmo: cantico-ef-1-3-10
    lectura:
      ref: Hch 2, 42
      texto: Los hermanos eran constantes en escuchar la enseñanza de los apóstoles, en la vida común, en la fracción del pan y en las oraciones. Todo el mundo estaba impresionado por los muchos prodigios y signos que los apóstoles hacían en Jerusalén. Los creyentes vivían todos unidos, y lo tenían todo en común; vendían posesiones y, bienes, y lo repartían entre todos según la necesidad de cada uno.
    responsorio:
    - - V
      - En esto conocerán todos que sois mis discípulos.
    - - R
      - En esto conocerán todos que sois mis discípulos.
    - - V
      - En que os améis unos a otros.
    - - R
      - En esto conocerán todos que sois mis discípulos.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo
    - - R
      - En esto conocerán todos que sois mis discípulos.
    ant_magnificat: No sois vosotros los que me habéis elegido, soy yo quien os he elegido; y os he destinado para que vayáis y deis fruto, y vuestro fruto dure.
    preces:
      intro: 'Hermanos: Edificados sobre el cimiento de los apóstoles, oremos al Padre por su pueblo santo, diciendo:'
      respuesta: Acuérdate, Señor, de tu Iglesia.
      preces:
      - - Padre santo, que quisiste que tu Hijo resucitado de entre los muertos se manifestara en primer lugar a los apóstoles.
        - haz que también nosotros seamos testigos de Cristo hasta los confines del mundo.
      - - Padre santo, tú que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
        - haz que sepamos proclamar el Evangelio a todas las creaturas.
      - - Tú que enviaste a tu Hijo a sembrar la semilla de la palabra,
        - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
      - - Tú que enviaste a tu Hijo para que reconciliara al mundo contigo,
        - haz que también nosotros cooperemos a la reconciliación de los hombres. Tú que quisiste que tu Hijo resucitara el primero de entre los muertos, — concede a todos los que son de Cristo resucitar con él, el día de su venida.
    padrenuestro_intro: 'Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
varios-martires:
  nombre: 'Común de mártires: para varios mártires'
  himno: Espíritus sublimes, ¡oh mártires gloriosos!
  salmodia:
  - ant: Los cuerpos de los santos fueron sepultados en paz, y su fama vive por generaciones.
    salmo: salmo-114
  - ant: Vi las almas de los sacrificados a causa de la palabra de Dios y del testimonio que mantuvieron.
    salmo: salmo-115
  - ant: Éstos son aquellos santos que entregaron sus cuerpos para ser fieles a la alianza de Dios y han lavado sus vestiduras con la sangre del Cordero.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1 Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Alegraos, justos, y gozad con el Señor.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  - - V
    - Aclamadlo, los rectos de corazón.
  - - R
    - Y gozad con el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  ant_magnificat: Se alegran en el cielo los santos que siguieron las huellas de Cristo; y, porque lo amaron hasta derramar su sangre, reinan con el Señor eternamente.
  preces:
    intro: 'En esta hora en la que el Señor, cenando con sus discípulos, presentó al Padre su propia vida que luego entregó en la cruz, aclamemos al Rey de los mártires, diciendo:'
    respuesta: Te glorificamos, Señor.
    preces:
    - - Te damos gracias, Señor, principio, ejemplo y rey de los mártires,
      - porque nos amaste hasta el extremo.
    - - Te damos gracias, Señor, porque no cesas de llamar a los pecadores arrepentidos,
      - y les das parte en los premios de tu reino.
    - - Te damos gracias, Señor, porque has dado a la Iglesia, como sacrificio para el perdón de los pecados,
      - la sangre de la alianza nueva y eterna.
    - - Te damos gracias, Señor, porque con tu gracia nos has dado perseverar en la fe,
