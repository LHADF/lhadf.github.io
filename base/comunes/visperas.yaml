      salmo: salmo-112
    - ant: Glorifica al Señor, Jerusalén, que ha bendecido a tus hijos dentro de ti.
      salmo: salmo-147
    - ant: El Señor te prefiere a ti, y tu Dios encontrará la alegría contigo.
      salmo: cantico-ef-1-3-10
    lectura:
      ref: Flp 3, 7-8
      texto: Todo lo que para mí era ganancia lo he estimado pérdida comparado con Cristo. Más aún, lo estimo pérdida comparado con la excelencia del conocimiento de Cristo Jesús, mi Señor. Por él lo perdí todo, y todo lo estimo basura con tal de ganar a Cristo.
