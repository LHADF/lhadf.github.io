      - - R
        - Después del parto, ¡oh Virgen!, has permanecido intacta. Aleluia, aleluia.
      - - V
        - Madre de Dios, intercede por nosotros.
      - - R
        - Aleluia, aleluia.
      - - V
        - Gloria al Padre, y al Hijo, y al Espíritu Santo.
      - - R
        - Después del parto, ¡oh Virgen!, has permanecido intacta. Aleluia, aleluia.
