      texto: 'Estos son los que vienen de la gran tribulación: han lavado y blanqueado sus mantos en la sangre del Cordero. Por eso están ante el trono de Dios dándole culto día y noche en su templo. El que se sienta en el trono acampará entre ellos. Ya no pasarán hambre ni sed, no les hará daño el sol ni el bochorno. Porque el Cordero que está delante del trono será su pastor, y los conducirá hacia fuentes de aguas vivas. Y Dios enjugará las lágrimas de sus ojos.'
