  nombre: Común de doctores de la Iglesia
virgenes:
  nombre: Común de vírgenes
  himno: Dichosa tú, que, entre todas
  salmodia:
  - ant: Quiero ser solamente tuya, oh Cristo esposo, a ti vengo con mi lámpara encendida.
    salmo: salmo-121
  - ant: Dichosos los limpios de corazón, porque ellos verán a Dios.
    salmo: salmo-126
  - ant: Mi alma se siente firme, está cimentada en Cristo, el Señor.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: 1 Co 7, 32. 34
    texto: El célibe se preocupa de los asuntos del Señor, buscando contentar al Señor; lo mismo, la mujer sin marido y la soltera se preocupan de los asuntos del Señor, consagrándose a ellos en cuerpo y alma.
  responsorio:
  - - V
    - Llevan ante el Rey al séquito de vírgenes, las traen entre alegría.
  - - R
    - Llevan ante el Rey al séquito de vírgenes, las traen entre alegría.
  - - V
    - Van entrando en el palacio real.
  - - R
    - Las traen entre alegría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Llevan ante el Rey al séquito de vírgenes, las traen entre alegría.
  ant_magnificat: 'Para una santa virgen y mártir: En una sola víctima celebramos un doble triunfo: la gloria de la virginidad y la victoria sobre la muerte; permaneció virgen y obtuvo la palma del martirio. Para una santa virgen: Ven, esposa de Cristo, recibe la corona eterna que el Señor te trae preparada. Para varias santas vírgenes: Éste es el grupo que busca al Señor, que viene a la presencia de nuestro Dios.'
  preces:
    intro: 'Alabemos con gozo a Cristo, que elogió a los que permanecen vírgenes, a causa del reino de Dios, y supliquémosle diciendo:'
    respuesta: Jesús, rey de las vírgenes, escúchanos.
    preces:
    - - Señor Jesucristo, tú que como esposo amante colocaste junto a ti a la Iglesia sin mancha ni arruga,
      - haz que sea siempre santa e inmaculada.
    - - Señor Jesucristo, a cuyo encuentro salieron las vírgenes santas con sus lámparas encendidas,
      - no permitas que falte nunca el óleo de la fidelidad en las lámparas de las vírgenes que se han consagrado a ti.
    - - Señor Jesucristo, a quien la Iglesia virgen guardó siempre fidelidad intacta,
      - concede a todos los cristianos la integridad y la pureza de la fe.
    - - Tú que concedes hoy a tu pueblo alegrarse por la fiesta de santa N., virgen,
      - concédele también gozar siempre de su valiosa intercesión. Tú que recibiste en el banquete de tus bodas a las vírgenes santas, — admite también a nuestros hermanos difuntos en el convite festivo de tu reino.
  padrenuestro_intro: 'Oremos con Jesús, diciendo a nuestro Padre:'
  oraciones:
  - para: ''
    texto: Tú, Señor, que te complaces en habitar en los limpios y sinceros de corazón, por intercesión de santa N., virgen, concédenos vivir de tal manera que merezcamos tenerte siempre entre nosotros. Por nuestro Señor Jesucristo.
  - para: ''
    texto: Escucha, Señor, nuestras plegarias y concede a los que celebramos la virtud de santa N., virgen, crecer siempre en tu amor y perseverar en él hasta el fin. Que vive y reina contigo.
  - para: varias santas vírgenes
    texto: Te pedimos, Señor, que manifiestes la grandeza de tu amor hacia nosotros, para que así como hoy podemos alegrarnos al celebrar la fiesta de las santas vírgenes N. y N., así podamos también disfrutar un día de su compañía en la felicidad de tu reino.
  primeras:
    salmodia:
    - ant: Venid, hijas, contemplad al Señor y quedaréis radiantes.
      salmo: salmo-112
    - ant: Ahora te seguimos de todo corazón, te respetamos y buscamos tu rostro; Señor, no nos defraudes.
      salmo: salmo-147
    - ant: Alegraos, vírgenes de Cristo, y gozad de vuestro desposorio divino que no tendrá fin.
      salmo: cantico-ef-1-3-10
    lectura:
      ref: 1 Co 7, 32. 34
      texto: El célibe se preocupa de los asuntos del Señor, buscando contentar al Señor; lo mismo, la mujer sin marido y la soltera se preocupan de los asuntos del Señor, consagrándose a ellos en cuerpo y alma.
    responsorio:
    - - V
      - Mi porción es el Señor, dice mi alma.
    - - R
      - Mi porción es el Señor, dice mi alma.
    - - V
      - Bueno es el Señor para el alma que lo busca.
    - - R
      - Dice mi alma.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo
    - - R
      - Mi porción es el Señor, dice mi alma.
    ant_magnificat: 'Para una santa virgen y mártir: Mirad, la virgen esforzada sigue ya al Cordero que fue crucificado por nosotros; también ella, como el Señor, ha sido víctima pura, una hostia inmaculada. Para una santa virgen: Al llegar el Esposo la virgen prudente entró con la lámpara encendida al banquete de bodas de su Señor. Para varias santas vírgenes: Vírgenes prudentes, preparad vuestras lámparas: mirad, el Esposo viene, salid a su encuentro.'
