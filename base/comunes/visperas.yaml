pastores:
  nombre: Común de pastores
  himno: Cantemos al Señor con alegría
  salmodia:
  - ant: Soy ministro del Evangelio por don de la gracia de Dios.
    salmo: salmo-14
  - ant: Administrador fiel y solícito a quien el amo ha puesto al frente de su servidumbre.
    salmo: salmo-111
  - ant: Mis ovejas escucharán mi voz, y habrá un solo rebaño y un solo pastor.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: 1 Pe 5, 1-4
    texto: 'A los presbíteros en esa comunidad, yo, presbítero como ellos, testigo de los sufrimientos de Cristo y partícipe de la gloria que va a descubrirse, os exhorto: Sed pastores del rebaño de Dios a vuestro cargo, gobernándolo, no a la fuerza, sino de buena gana, como Dios quiere, no por sórdida ganancia, sino con generosidad, no como dominadores sobre la heredad de Dios, sino convirtiéndoos en modelos del rebaño. Y, cuando aparezca el supremo Pastor, recibiréis la corona de gloria que no se marchita.'
  responsorio:
  - - V
    - Éste es el que ama a sus hermanos, el que ora mucho por su pueblo.
  - - R
    - Éste es el que ama a sus hermanos, el que ora mucho por su pueblo.
  - - V
    - El que entregó su vida por sus hermanos.
  - - R
    - El que ora mucho por su pueblo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Éste es el que ama a sus hermanos, el que ora mucho por su pueblo.
  ant_magnificat: Éste es el criado fiel y solícito, a quien el amo ha puesto al frente de su servidumbre para que les reparta la ración a sus horas.
  preces:
    intro: 'Glorifiquemos a Cristo, constituido pontífice en favor de los hombres en lo que se refiere a Dios, y supliquémosle humildemente diciendo:'
    respuesta: Salva a tu pueblo, Señor.
    preces:
    - - Tú que por medio de pastores santos y eximios has glorificado a tu Iglesia,
      - haz que todos los cristianos resplandezcan por su virtud.
    - - Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles,
      - purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos.
    - - Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos,
      - llena también de tu Espíritu a todos los pastores del pueblo de Dios.
    - - Tú que fuiste la heredad de los santos pastores,
      - no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti. Tú que por medio de los pastores de la Iglesia das la vida eterna a tus ovejas para que nadie las arrebate de tu mano, — salva a los difuntos, por quienes entregaste tu vida.
  padrenuestro_intro: 'Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oraciones:
  - para: un santo papa
    texto: Dios todopoderoso y eterno, que quisiste que san N., papa, presidiera a todo tu pueblo y lo iluminara con su ejemplo y sus palabras, por su intercesión protege a los pastores de la Iglesia y a sus rebaños y hazlos progresar por el camino de la salvación eterna. Por nuestro Señor Jesucristo.
  - para: un santo obispo
    texto: Señor, tú que colocaste a san N. en el número de los santos pastores y lo hiciste brillar por el ardor de la caridad y de aquella fe que vence al mundo, haz que también nosotros, por su intercesión, perseveremos firmes en la fe y arraigados en el amor merezcamos así participar de su gloria. Por nuestro Señor Jesucristo.
  - para: un santo fundador de una Iglesia
    texto: Señor, tú que por la predicación de san N. (obispo) llamaste a nuestros padres a la luz admirable del Evangelio, te pedimos que, por su intercesión, nosotros crezcamos también en tu gracia y en el conocimiento de nuestro Señor Jesucristo. Que vive y reina contigo.
  - para: un santo pastor
    texto: Señor, luz de los fieles y pastor de las almas, tú que elegiste a san N. (obispo) para que, en la Iglesia apacentara tus ovejas con su palabra y las iluminara con su ejemplo, te pedimos que, por su intercesión, nos concedas perseverar en la fe que él nos enseñó con su palabra y seguir el camino que nos mostró con su ejemplo. Por nuestro Señor Jesucristo.
  - para: un santo pastor
    texto: Señor, tú que diste a san N. la abundancia del espíritu de verdad y de amor para que fuera un buen pastor de tu pueblo, concede a cuantos celebramos hoy su fiesta adelantar en la virtud, imitando sus ejemplos, y sentirnos protegidos con su valiosa intercesión. Por nuestro Señor Jesucristo.
  - para: un santo misionero
    texto: Dios y Señor nuestro, que con tu amor hacia los hombres quisiste que san N. anunciara a los pueblos la riqueza insondable que es Cristo, concédenos, por su intercesión, crecer en el conocimiento del misterio de Cristo y vivir siempre según las enseñanzas del Evangelio, fructificando con toda clase de buenas obras. Por nuestro Señor Jesucristo.
  primeras:
    salmodia:
    - ant: Os daré pastores conforme a mi corazón, que os apacienten con ciencia y doctrina.
      salmo: salmo-112
    - ant: Yo mismo apacentaré mis ovejas; buscaré a las perdidas y haré volver a las descarriadas.
      salmo: salmo-145
    - ant: El buen pastor da su vida por las ovejas.
      salmo: cantico-ef-1-3-10
    lectura:
      ref: 1 Pe 5, 1-4
      texto: 'A los presbíteros en esa comunidad, yo, presbítero como ellos, testigo de los sufrimientos de Cristo y partícipe de la gloria que va a descubrirse, os exhorto: Sed pastores del rebaño de Dios a vuestro cargo, gobernándolo, no a la fuerza, sino de buena gana, como Dios quiere, no por sórdida ganancia, sino con generosidad, no como dominadores sobre la heredad de Dios, sino convirtiéndoos en modelos del rebaño. Y, cuando aparezca el supremo Pastor, recibiréis la corona de gloria que no se marchita.'
    responsorio:
    - - V
      - Sacerdotes del Señor, bendecid al Señor.
    - - R
      - Sacerdotes del Señor, bendecid al Señor.
    - - V
      - Santos y humildes de corazón, alabad a Dios.
    - - R
      - Bendecid al Señor.
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo.
    - - R
      - Sacerdotes del Señor, bendecid al Señor.
    ant_magnificat: 'Antífona para un santo papa u obispo: Sacerdote del Altísimo, modelo de virtudes, pastor bueno del pueblo, tú agradaste al Señor. Para un santo presbítero: Me he hecho todo para todos, para salvarlos a todos.'
