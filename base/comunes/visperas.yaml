    salmo: salmo-114
  - ant: A quien me sirva, mi Padre del cielo lo premiará.
    salmo: salmo-115
  - ant: El que pierda su vida por mí la encontrará para siempre.
    salmo: cantico-ap-4-11-5-9-10-12
