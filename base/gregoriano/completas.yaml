# Partes en gregoriano de Completas (ADF) y su traducción literal bajo los neumas.
# Las partituras son los archivos .gabc de esta carpeta (texto latino con i y æ, según docs/diseno.md).
# Traducción interlineal: literal, propia (no es el texto español del sync), palabra por palabra: un par «latín = español»
# por palabra latina, en el orden del texto. Solo se agrupan palabras cuando ir una por una confundiría (p. ej. «Dei Génitrix»).
# La prueba verifica que las palabras de los pares sean exactamente las del texto latino.

invocacion:
  # Tono solemne: domingos y solemnidades (también sus I Vísperas, el Triduo y las Octavas de Navidad y Pascua);
  # festivo: fiestas; ferial: ferias, memorias y conmemoraciones. En Cuaresma se omite el Aleluya.
  solemne: deus-in-adiutorium-solemnis.gabc
  festivo: deus-in-adiutorium-festivus.gabc
  ferial: deus-in-adiutorium-ferialis.gabc
  traduccion:
    - Deus, = Dios [mío],
    - in = en
    - adiutórium = auxilio
    - meum = mío
    - inténde. = atiende.
    - Dómine, = Señor,
    - ad = para
    - adiuvándum = ayudar
    - me = me
    - festína. = apresúrate.
    - Glória = Gloria
    - Patri, = al Padre,
    - et = y
    - Fílio, = al Hijo,
    - et = y
    - Spirítui = al Espíritu
    - Sancto. = Santo.
    - Sicut = Como
    - erat = era
    - in = en
    - princípio, = el principio,
    - et = y
    - nunc, = ahora,
    - et = y
    - semper, = siempre,
    - et = y
    - in = por
    - sǽcula = los siglos
    - sæculórum. = de los siglos.
    - Amen. = Amén.
    - Allelúia. = Aleluya.
cantico_evangelico:
  antifona: salva-nos.gabc
  cantico: nunc-dimittis-3a.gabc
  traduccion_antifona:
    - Salva = Salva
    - nos, = nos,
    - Dómine, = Señor,
    - vigilántes, = despiertos,
    - custódi = guarda
    - nos = nos
    - dormiéntes, = dormidos,
    - ut = para que
    - vigilémus = velemos
    - cum = con
    - Christo, = Cristo,
    - et = y
    - requiescámus = descansemos
    - in = en
    - pace. = paz.
    - Allelúia. = Aleluya.
  traduccion_cantico:   # primer versículo, en partitura
    - Nunc = Ahora
    - dimíttis = despides
    - servum = al siervo
    - tuum, = tuyo,
    - Dómine, = Señor,
    - secúndum = según
    - verbum = la palabra
    - tuum = tuya
    - in = en
    - 'pace: = paz:'
  # Del segundo versículo en adelante, pautados en latín, con su traducción
  tono_cantico: 3a
  # Marcas escritas a mano, como en el libro de Completas ADF: **negrita** = acento, _cursiva_ = preparación.
  versos:
    - quia vidérunt óculi **me**i * salutá_re_ **tu**um,
    - '**quod** pa**rás**ti * ante fáciem ómnium po_pu_**ló**rum,'
    - Lumen ad revelatiónem **génti**um, * et glóriam plebis tu_æ_ **Ís**rael.
    - Glória Patri, et **Fíli**o, * et Spíritu_i_ **Sanc**to.
    - Sicut erat in princípio, et **nunc** et **sem**per, * et in sǽcula sæculó_rum_. **A**men.
  # Primer versículo, para Completas recitadas (cantadas, va en partitura)
  primer_verso: 'Nunc dimíttis servum **tu**um, **Dómi**ne, * secúndum verbum tuum _in_ **pa**ce:'
  # Traducción palabra por palabra de cada versículo (del segundo en adelante), en el orden del texto; el * no lleva par
  traduccion_versos:
    - - quia = porque
      - vidérunt = vieron
      - óculi = los ojos
      - mei = míos
      - salutáre = la salvación
      - tuum, = tuya,
    - - quod = que
      - parásti = preparaste
      - ante = ante
      - fáciem = el rostro
      - ómnium = de todos
      - populórum, = los pueblos,
    - - Lumen = Luz
      - ad = para
      - revelatiónem = revelación
      - géntium, = de las naciones,
      - et = y
      - glóriam = gloria
      - plebis = del pueblo
      - tuæ = tuyo
      - Israel. = Israel.
    - - Glória = Gloria
      - Patri, = al Padre,
      - et = y
      - Fílio, = al Hijo,
      - et = y
      - Spirítui = al Espíritu
      - Sancto. = Santo.
    - - Sicut = Como
      - erat = era
      - in = en
      - princípio, = el principio,
      - et = y
      - nunc = ahora
      - et = y
      - semper, = siempre,
      - et = y
      - in = por
      - sǽcula = los siglos
      - sæculórum. = de los siglos.
      - Amen. = Amén.

conclusion:
  partitura: noctem-quietam.gabc
  traduccion:
    - Noctem = Una noche
    - quiétam = tranquila
    - et = y
    - finem = un fin
    - perféctum = perfecto
    - concédat = conceda
    - nobis = a nosotros
    - Dóminus = el Señor
    - omnípotens. = todopoderoso.
    - Amen. = Amén.
# Tono de los salmos en español. Sin uso mientras los salmos van sin partitura ni pautas.
# Provisorio: 8 G para todos. Se cambia acá, por juego de Completas (códigos: 1D, 2D, 3a, 4E, 5a, 6F, 7a, 8G…).
tonos_salmos:
  domingo: 8G
  lunes: 8G
  martes: 8G
  miercoles: 8G
  jueves: 8G
  viernes: 8G
  sabado: 8G

# Himno en gregoriano: primera opción todos los días (las demás, los himnos en español de la base)
himno:
  titulo: Te lucis ante términum
  partitura: te-lucis-dominicis.gabc
  traduccion:
    - Te = A ti,
    - lucis = de la luz
    - ante = antes del
    - términum, = término,
    - Rerum = de las cosas
    - Creátor, = Creador,
    - póscimus, = pedimos,
    - Ut = que
    - pro = por
    - tua = tu
    - cleméntia = clemencia
    - Sis = seas
    - præsul = protector
    - et = y
    - custódia. = custodia.
    - Procul = Lejos
    - recédant = se vayan
    - sómnia, = los sueños,
    - Et = y
    - nóctium = de las noches
    - phantásmata; = los fantasmas;
    - Hostémque = y al enemigo
    - nostrum = nuestro
    - cómprime, = reprime,
    - Ne = para que no
    - polluántur = se manchen
    - córpora. = los cuerpos.
    - Præsta, = Concede,
    - Pater = Padre
    - piíssime, = piadosísimo,
    - Patríque = y al Padre
    - compar = igual,
    - Únice, = Unigénito,
    - Cum = con
    - Spíritu = el Espíritu
    - Paráclito = Paráclito
    - Regnans = reinando
    - per = por
    - omne = todo
    - sǽculum. = siglo.
    - Amen. = Amén.

# Respuesta a la lectura breve
lectura_respuesta:
  - Deo grátias. = Demos gracias a Dios.

# Responsorio breve cantado (opción). Por ahora, el del Tiempo Ordinario (fuera de Pascua, Triduo y Octavas).
responsorio:
  ordinario:
    partitura: in-manus-tuas.gabc
    traduccion:
      - In = En
      - manus = manos
      - tuas, = tuyas,
      - Dómine, = Señor,
      - Comméndo = encomiendo
      - spíritum = el espíritu
      - meum. = mío.
      - In = En
      - manus. = manos.
      - Redemísti = Redimiste
      - nos, = nos,
      - Dómine, = Señor,
      - Deus = Dios
      - veritátis. = de la verdad.
      - Comméndo. = Encomiendo.
      - Glória = Gloria
      - Patri, = al Padre,
      - et = y
      - Fílio, = al Hijo,
      - et = y
      - Spirítui = al Espíritu
      - Sancto. = Santo.
      - In = En
      - manus. = manos.

# Antífonas finales de la Virgen en gregoriano. Solemne: domingos y solemnidades (y sus I Vísperas, Triduo y Octavas); simple: los demás días.
# Adviento y Navidad: Alma Redemptóris; de la Candelaria al fin de Cuaresma: Ave Regína cælórum; Pascua: Regína cæli (sin versículo).
# Tiempo Ordinario: domingos y solemnidades (y sus I Vísperas), Salve solemne; los demás días, Salve simple
# (siempre seleccionada al abrir) y Sub tuum præsídium como opción. Asunción: Ave Regina cælórum, simple o solemne.
marianas:
  salve_simple:
    titulo: Salve Regina
    partitura: salve-regina-simple.gabc
    traduccion: &salve
      - Salve, = Salve,
      - Regína, = Reina,
      - mater = madre
      - 'misericórdiæ: = de misericordia:'
      - Vita, = vida,
      - dulcédo, = dulzura,
      - et = y
      - spes = esperanza
      - nostra, = nuestra,
      - salve. = salve.
      - Ad = A
      - te = ti
      - clamámus, = clamamos,
      - éxsules, = desterrados,
      - fílii = hijos
      - Hevæ. = de Eva.
      - Ad = A
      - te = ti
      - suspirámus, = suspiramos,
      - geméntes = gimiendo
      - et = y
      - flentes = llorando
      - in = en
      - hac = este
      - lacrimárum = de lágrimas
      - valle. = valle.
      - Eia = Ea,
      - ergo, = pues,
      - Advocáta = abogada
      - nostra, = nuestra,
      - illos = esos
      - tuos = tuyos
      - misericórdes = misericordiosos
      - óculos = ojos
      - ad = a
      - nos = nosotros
      - convérte. = vuelve.
      - Et = Y
      - Iesum, = a Jesús,
      - benedíctum = bendito
      - fructum = fruto
      - ventris = del vientre
      - tui, = tuyo,
      - nobis = a nosotros
      - post = después de
      - hoc = este
      - exsílium = destierro
      - osténde. = muestra.
      - O = Oh
      - 'clemens: = clemente:'
      - O = oh
      - 'pia: = piadosa:'
      - O = oh
      - dulcis = dulce
      - Virgo = Virgen
      - María. = María.
  salve_solemne:
    titulo: Salve Regina
    partitura: salve-regina-solemne.gabc
    traduccion: *salve
  sub_tuum:
    titulo: Sub tuum præsídium
    partitura: sub-tuum-praesidium.gabc
    traduccion:
      - Sub = Bajo
      - tuum = tu
      - præsídium = amparo
      - confúgimus, = nos refugiamos,
      - sancta = santa
      - 'Dei Génitrix: = Madre de Dios:'
      - nostras = nuestras
      - deprecatiónes = súplicas
      - ne = no
      - despícias = desprecies
      - in = en
      - 'necessitátibus: = las necesidades:'
      - sed = sino
      - a = de
      - perículis = los peligros
      - cunctis = todos
      - líbera = libra
      - nos = nos
      - semper, = siempre,
      - Virgo = Virgen
      - gloriósa = gloriosa
      - et = y
      - benedícta. = bendita.
  ave_simple:
    titulo: Ave Regina cælórum (simple)
    partitura: ave-regina-caelorum-simple.gabc
    traduccion: &ave
      - Ave, = Salve,
      - Regína = Reina
      - cælórum, = de los cielos,
      - Ave, = salve,
      - Dómina = Señora
      - 'Angelórum: = de los ángeles:'
