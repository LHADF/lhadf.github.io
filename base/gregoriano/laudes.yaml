# Partes en latín de Laudes (ADF) y su traducción interlineal literal, palabra por palabra (docs/diseno.md).
# Cada renglón: «latín = español», en el orden del texto latino.

# Invitatorio (solo los domingos): versículo y respuesta, antes de la antífona y el Salmo 94
invitatorio:
  partitura: domine-labia-mea-aperies.gabc
  traduccion:
    - Dómine, = Señor,
    - lábia = los labios
    - mea = míos
    - apéries. = abrirás.
    - Et = Y
    - os = la boca
    - meum = mía
    - annuntiábit = anunciará
    - laudem = la alabanza
    - tuam. = tuya.

# Cántico de Zacarías (Lc 1, 68-79), Neovulgata, como en la Liturgia Horarum. Recitado (por ahora sin tono).
# A verificar con Universalis: «in remissiónem peccatórum eórum» (Neovulgata) — algunas ediciones traen «remissióne».
benedictus:
  titulo: Cántico de Zacarías
  ref: Lc 1, 68-79
  versos:
    - Benedíctus Dóminus Deus Israel, * quia visitávit et fecit redemptiónem plebi suæ
    - et eréxit cornu salútis nobis * in domo David púeri sui,
    - sicut locútus est per os sanctórum, * qui a sǽculo sunt, prophetárum eius,
    - salútem ex inimícis nostris * et de manu ómnium, qui odérunt nos;
    - ad faciéndam misericórdiam cum pátribus nostris * et memorári testaménti sui sancti,
    - iusiurándum, quod iurávit ad Abraham patrem nostrum, * datúrum se nobis,
    - ut sine timóre, de manu inimicórum liberáti, * serviámus illi
    - in sanctitáte et iustítia coram ipso * ómnibus diébus nostris.
    - 'Et tu, puer, prophéta Altíssimi vocáberis: * præíbis enim ante fáciem Dómini paráre vias eius,'
    - ad dandam sciéntiam salútis plebi eius * in remissiónem peccatórum eórum,
    - per víscera misericórdiæ Dei nostri, * in quibus visitábit nos óriens ex alto,
    - illumináre his, qui in ténebris et in umbra mortis sedent, * ad dirigéndos pedes nostros in viam pacis.
    - Glória Patri, et Fílio, * et Spirítui Sancto.
    - Sicut erat in princípio, et nunc et semper, * et in sǽcula sæculórum. Amen.
  traduccion_versos:
    - - Benedíctus = Bendito
      - Dóminus = el Señor
      - Deus = Dios
      - Israel, = de Israel,
      - quia = porque
      - visitávit = visitó
      - et = e
      - fecit = hizo
      - redemptiónem = redención
      - plebi = para el pueblo
      - suæ = suyo
    - - et = y
      - eréxit = levantó
      - cornu = el cuerno
      - salútis = de salvación
      - nobis = para nosotros
      - in = en
      - domo = la casa
      - David = de David
      - púeri = siervo
      - sui, = suyo,
    - - sicut = como
      - locútus est = habló
      - per = por
      - os = la boca
      - sanctórum, = de los santos,
      - qui = que
      - a = desde
      - sǽculo = antiguo
      - sunt, = son,
      - prophetárum = profetas
      - eius, = suyos,
    - - salútem = salvación
      - ex = de
      - inimícis = los enemigos
      - nostris = nuestros
      - et = y
      - de = de
      - manu = la mano
      - ómnium, = de todos
      - qui = los que
      - odérunt = odian
      - nos; = nos;
    - - ad = para
      - faciéndam = hacer
      - misericórdiam = misericordia
      - cum = con
      - pátribus = los padres
      - nostris = nuestros
      - et = y
      - memorári = recordar
      - testaménti = la alianza
      - sui = suya
      - sancti, = santa,
    - - iusiurándum, = el juramento,
      - quod = que
      - iurávit = juró
      - ad = a
      - Abraham = Abraham
      - patrem = padre
      - nostrum, = nuestro,
      - datúrum = que concedería
      - se = él
      - nobis, = a nosotros,
    - - ut = para que
      - sine = sin
      - timóre, = temor,
      - de = de
      - manu = la mano
      - inimicórum = de los enemigos
      - liberáti, = librados,
      - serviámus = sirvamos
      - illi = a él
    - - in = en
      - sanctitáte = santidad
      - et = y
      - iustítia = justicia
      - coram = delante de
      - ipso = él
      - ómnibus = todos
      - diébus = los días
      - nostris. = nuestros.
    - - Et = Y
      - tu, = tú,
      - puer, = niño,
      - prophéta = profeta
      - Altíssimi = del Altísimo
      - 'vocáberis: = serás llamado:'
