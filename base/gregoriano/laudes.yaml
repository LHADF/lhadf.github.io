# La monición antes del Padre nuestro (la propia del día, en la base) se dice solo en domingos, fiestas y solemnidades.

# Conclusión (bendición): melodía del «Noctem quiétam» (dominus-nos-benedicat.gabc)
conclusion:
  partitura: dominus-nos-benedicat.gabc
  traduccion:
    - Dóminus = El Señor
    - nos = nos
    - benedícat, = bendiga,
    - et = y
    - ab = de
    - omni = todo
    - malo = mal
    - deféndat, = defienda,
    - et = y
    - ad = a
    - vitam = la vida
    - perdúcat = conduzca
    - ætérnam. = eterna.
    - Amen. = Amén.

# Conclusión cuando preside un ministro ordenado (opción en la app). Graduale Romanum 1974, p. 817:
# tono A (ferias, memorias y fiestas) y tono B (domingos y solemnidades).
bendicion:
  simple: benedicat-vos-a.gabc
  solemne: benedicat-vos-b.gabc
  traduccion:
    - Dóminus = El Señor
    - 'vobíscum. = [esté] con vosotros.'
    - Et = Y
    - cum = con
    - spíritu = el espíritu
    - tuo. = tuyo.
    - Benedícat = Bendiga
    - vos = os
    - omnípotens = todopoderoso
    - Deus, = Dios,
    - Pater, = Padre,
    - et = e
    - Fílius, = Hijo,
    - et = y
    - Spíritus = Espíritu
    - Sanctus. = Santo.
    - Amen. = Amén.
  # Despedida después de la bendición (por ahora sin partitura: falta el GABC)
  despedida:
    - Ite = Id
    - in = en
    - pace. = paz.
    - "Deo = [Demos] a Dios"
    - grátias. = gracias.

