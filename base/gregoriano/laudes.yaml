# Padre nuestro: en latín. Lo entona el que preside hasta el asterisco; desde ahí lo dicen todos (negrita).
# Traducción: la habitual, por frases (no palabra por palabra).
pater_noster:
  - Pater noster, = Padre nuestro,
  - '* qui es in cælis, = que estás en el cielo,'
  - sanctificétur nomen tuum; = santificado sea tu Nombre;
  - advéniat regnum tuum; = venga a nosotros tu reino;
  - fiat volúntas tua, = hágase tu voluntad
  - sicut in cælo, et in terra. = en la tierra como en el cielo.
  - Panem nostrum cotidiánum = Danos hoy
  - da nobis hódie; = nuestro pan de cada día;
  - et dimítte nobis débita nostra, = perdona nuestras ofensas,
  - sicut et nos dimíttimus = como también nosotros perdonamos
  - debitóribus nostris; = a los que nos ofenden;
  - et ne nos indúcas in tentatiónem; = no nos dejes caer en la tentación,
  - sed líbera nos a malo. = y líbranos del mal.
# La monición antes del Padre nuestro (la propia del día, en la base) se dice solo en domingos, fiestas y solemnidades.

# Conclusión (bendición): melodía del «Noctem quiétam» (dominus-nos-benedicat.gabc)
conclusion:
  partitura: dominus-nos-benedicat.gabc
  traduccion:
    - Dóminus = El Señor
    - nos = nos
    - benedícat, = bendiga,
    - et = y
    - ab = de
    - omni = todo
    - malo = mal
    - deféndat, = defienda,
    - et = y
    - ad = a
    - vitam = la vida
    - perdúcat = conduzca
    - ætérnam. = eterna.
    - Amen. = Amén.

# Conclusión cuando preside un ministro ordenado (opción en la app). Graduale Romanum 1974, p. 817:
# tono A (ferias, memorias y fiestas) y tono B (domingos y solemnidades).
bendicion:
  simple: benedicat-vos-a.gabc
  solemne: benedicat-vos-b.gabc
  traduccion:
    - Dóminus = El Señor
    - vobíscum. = con vosotros.
    - Et = Y
    - cum = con
    - spíritu = el espíritu
    - tuo. = tuyo.
    - Benedícat = Bendiga
    - vos = os
    - omnípotens = todopoderoso
    - Deus, = Dios,
    - Pater, = Padre,
    - et = e
    - Fílius, = Hijo,
    - et = y
    - Spíritus = Espíritu
    - Sanctus. = Santo.
    - Amen. = Amén.
  # Despedida después de la bendición (por ahora sin partitura: falta el GABC)
  despedida:
    - Ite = Id
    - in = en
    - pace. = paz.
    - Deo = A Dios
    - grátias. = gracias.
