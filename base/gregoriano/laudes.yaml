# Partes en latín de Laudes (ADF) y su traducción interlineal literal, palabra por palabra (docs/diseno.md).
# Cada renglón: «latín = español», en el orden del texto latino.

# Invitatorio (solo los domingos): versículo y respuesta, antes de la antífona y el Salmo 94
invitatorio:
  partitura: domine-labia-mea-aperies.gabc
  traduccion:
    - Dómine, = Señor,
    - lábia = los labios
    - mea = míos
    - apéries. = abrirás.
    - Et = Y
    - os = la boca
    - meum = mía
    - annuntiábit = anunciará
    - laudem = la alabanza
    - tuam. = tuya.

# Cántico de Zacarías (Lc 1: 68-79): texto y división en versículos del PDF «NVG - Benedíctus» de ADF. Recitado (por ahora sin tono).
benedictus:
  titulo: Cántico de Zacarías
  ref: Lc 1, 68-79
  versos:
    - Benedíctus Dóminus Deus Ísrael, * quia visitávit et fecit redemptiónem plebi suæ;
    - 'et eréxit cornu salútis nobis, * in domo David, púeri sui:'
    - sicut locútus est per os sanctórum, * qui a sǽculo sunt, prophetárum eius.
    - 'Salútem ex inimícis nostris, * et de manu ómnium, qui odérunt nos:'
    - ad faciéndam misericórdiam cum pátribus nostris, * et memorári testaménti sui sancti;
    - iusiurándum, quod iurávit ad Ábraham, patrem nostrum. * Datúrum se nobis,
    - ut sine timóre, de manu inimicórum liberáti, * serviámus illi,
    - in sanctitáte et iustítia coram ipso, * ómnibus diébus nostris.
    - 'Et tu, puer, prophéta Altíssimi vocáberis: * præíbis enim ante fáciem Dómini paráre vias eius,'
    - ad dandam sciéntiam salútis plebi eius, * in remissiónem peccatórum eórum.
    - 'Per víscera misericórdiæ Dei nostri, * in quibus visitábit nos Oriens ex alto:'
    - illumináre his, qui in ténebris et in umbra mortis sedent, * ad dirigéndos pedes nostros in viam pacis.
    - Glória Patri, et Fílio, * et Spirítui Sancto.
    - Sicut erat in princípio, et nunc et semper, * et in sǽcula sæculórum. Amen.
  traduccion_versos:
    - - Benedíctus = Bendito
      - Dóminus = el Señor
      - Deus = Dios
      - Israel, = de Israel,
      - quia = porque
      - visitávit = visitó
      - et = e
      - fecit = hizo
      - redemptiónem = redención
      - plebi = para el pueblo
      - suæ = suyo
    - - et = y
      - eréxit = levantó
      - cornu = el cuerno
      - salútis = de salvación
      - nobis = para nosotros
      - in = en
      - domo = la casa
      - David = de David
      - púeri = siervo
      - sui, = suyo,
    - - sicut = como
      - locútus est = habló
      - per = por
      - os = la boca
      - sanctórum, = de los santos,
      - qui = que
      - a = desde
      - sǽculo = antiguo
      - sunt, = son,
      - prophetárum = profetas
      - eius, = suyos,
    - - salútem = salvación
      - ex = de
      - inimícis = los enemigos
      - nostris = nuestros
      - et = y
      - de = de
      - manu = la mano
      - ómnium, = de todos
      - qui = los que
      - odérunt = odian
      - nos; = nos;
    - - ad = para
