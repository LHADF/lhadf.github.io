# Magníficat (Lc 1: 46-55) para Vísperas: texto y división en versículos del PDF «NVG - Magníficat» de ADF.
# Falta la traducción interlineal palabra por palabra (se hará al armar Vísperas).
titulo: Cántico de María
ref: Lc 1, 46-55
versos:
  - Magníficat * ánima mea Dóminum.
  - Et exsultávit spíritus meus * in Deo salvatóre meo.
  - 'Quia respéxit humilitátem ancíllæ suæ: * ecce enim ex hoc beátam me dicent omnes generatiónes.'
  - 'Quia fecit mihi magna qui potens est: * et sanctum nomen eius.'
  - Et misericórdia eius in progénies et progénies * timéntibus eum.
  - 'Fecit poténtiam in bráchio suo: * dispérsit supérbos mente cordis sui.'
  - Depósuit poténtes de sede, * et exaltávit húmiles.
  - 'Esuriéntes implévit bonis: * et dívites dimísit inánes.'
  - Suscépit Ísrael púerum suum, * recordátus misericórdiæ.
  - Sicut locútus est ad patres nostros, * Ábraham et sémini eius in sǽcula.
  - Glória Patri, et Fílio, * et Spirítui Sancto.
  - Sicut erat in princípio, et nunc et semper, * et in sǽcula sæculórum. Amen.
# Traducción interlineal literal, palabra por palabra, de cada versículo (el * no lleva par)
