    estrofas:
    - - - En clara vox = He aquí que una voz clara
        - redárguit = reprende
      - - Obscúra quæque, = todo lo oscuro,
        - 'pérsonans: = resonando:'
      - - Procul = lejos
        - fugéntur sómnia, = huyan los sueños;
      - - Ab alto = desde lo alto
        - Iesus prómicat. = Jesús resplandece.
    - - - Mens iam resúrgat = Que el alma se levante ya,
        - tórpida, = adormecida,
      - - Non ámplius = no más
        - 'iacens humi: = tendida en el suelo;'
      - - Sidus refúlget = brilla un astro
        - iam novum, = ya nuevo,
      - - Ut tollat = para quitar
        - omne nóxium. = todo lo dañino.
    - - - En Agnus = He aquí que el Cordero
        - ad nos míttitur = es enviado a nosotros
      - - Laxáre gratis = para perdonar gratis
        - 'débitum: = la deuda;'
      - - Omnes simul = todos juntos
        - cum lácrimis = con lágrimas
      - - Precémur = pidamos
        - indulgéntiam. = perdón.
    - - - Ut cum secúndo = Para que, cuando por segunda vez
        - fúlserit, = resplandezca
      - - Metúque = y de temor
        - mundum cínxerit, = envuelva al mundo,
      - - Non pro reátu = no por la culpa
        - púniat, = nos castigue,
      - - Sed nos = sino que nos
        - pius = compasivo
        - tunc prótegat. = proteja entonces.
    - - - Virtus, honor, = Poder, honor,
        - laus, glória = alabanza y gloria
      - - Deo Patri = a Dios Padre
        - cum Fílio, = con el Hijo,
      - - Sancto simul Paráclito, = y al Santo Paráclito,
      - - In sæculórum sǽcula. = por los siglos de los siglos.
    amen: Amen. = Amén.

  te-saeculorum-principem:
    titulo: Te sæculórum Príncipem
    partitura: te-saeculorum-principem.gabc
    fuente: The Liber Usualis, 1961, p. 1716
    estrofas:
    - - - Te = A ti,
        - sæculórum Príncipem, = Príncipe de los siglos,
      - - Te, Christe, = a ti, oh Cristo,
        - Regem Géntium, = Rey de las naciones,
      - - Te méntium, = a ti, de las mentes,
        - Te córdium = a ti, de los corazones,
      - - Unum = único
        - fatémur árbitrum. = árbitro te confesamos.
    - - - Scelésta turba = La turba malvada
        - 'clámitat: = grita:'
      - - Regnáre Christum = Que reine Cristo
        - 'nólumus: = no queremos.'
      - - Te nos = A ti nosotros,
        - ovántes = exultantes,
        - ómnium = de todos
      - - Regem suprémum = Rey supremo
