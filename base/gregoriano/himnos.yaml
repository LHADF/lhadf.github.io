    - - - O Christe, = Oh Cristo,
        - Princeps Pácifer, = Príncipe pacífico,
      - - Mentes rebélles = las mentes rebeldes
        - 'súbiice: = somete;'
      - - Tuóque amóre = y con tu amor
        - dévios, = a los extraviados
      - - Ovíle in unum = en un solo redil
