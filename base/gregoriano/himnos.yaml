      - - Dígitus = dedo
        - patérnæ déxteræ, = de la diestra del Padre,
      - - Tu rite = tú, fiel
        - promíssum Patris, = promesa del Padre,
      - - Sermóne ditans = que enriqueces con la palabra
        - gúttura. = nuestros labios.
    - - - Accénde lumen = Enciende la luz
        - sénsibus, = en los sentidos,
      - - Infúnde amórem = infunde tu amor
        - córdibus, = en los corazones,
      - - Infírma = lo débil
        - nostri córporis = de nuestro cuerpo
      - - Virtúte firmans = fortalece con fuerza
        - pérpeti. = perpetua.
    - - - Hostem repéllas = Aleja al enemigo
        - lóngius, = lejos de nosotros,
      - - Pacémque = y la paz
        - 'dones prótinus: = danos pronto;'
      - - Ductóre sic te = así, contigo como guía
        - prǽvio, = que nos precede,
      - - Vitémus = evitemos
        - omne nóxium. = todo mal.
    - - - Per te sciámus = Por ti conozcamos,
        - da Patrem, = concédenos, al Padre,
      - - Noscámus atque = y conozcamos también
        - Fílium, = al Hijo,
      - - Teque = y a ti,
        - utriúsque Spíritum = Espíritu de ambos,
      - - Credámus = creamos
        - omni témpore. = en todo tiempo.
    - - - Deo Patri = A Dios Padre
        - sit glória, = sea la gloria,
      - - Et Fílio, = y al Hijo,
        - qui a mórtuis = que de entre los muertos
      - - Surréxit, = resucitó,
        - ac Paráclito, = y al Paráclito,
      - - In sæculórum sǽcula. = por los siglos de los siglos.
    amen: Amen. = Amén.

  iesu-redemptor-omnium:
    titulo: Iesu, Redémptor ómnium
    partitura: iesu-redemptor-omnium.gabc
    fuente: The Liber Usualis, 1961, p. 365
    estrofas:
    - - - Iesu = Jesús,
        - Redémptor ómnium, = Redentor de todos,
      - - Quem = a quien,
        - lucis ante oríginem, = antes del origen de la luz,
      - - Parem = igual
        - patérnæ glóriæ, = a la gloria paterna,
      - - Pater suprémus = el Padre supremo
        - édidit. = engendró.
    - - - Tu lumen = Tú, luz
        - et splendor Patris, = y resplandor del Padre,
      - - Tu spes perénnis = tú, esperanza perenne
        - 'ómnium: = de todos:'
      - - Inténde = atiende
        - quas fundunt preces = las súplicas que elevan
      - - Tui per orbem sérvuli. = tus siervos por el mundo.
    - - - Meménto, = Recuerda,
        - rerum Cónditor, = Creador de las cosas,
      - - Nostri quod olim = que en otro tiempo, de nuestro
        - córporis, = cuerpo,
      - - Sacráta ab alvo Vírginis = del sagrado seno de la Virgen
      - - Nascéndo, = al nacer,
        - formam súmpseris. = tomaste la forma.
    - - - Testátur hoc = Lo atestigua
        - præsens dies, = el día presente,
      - - Currens = que recorre
        - 'per anni círculum, = el ciclo del año:'
      - - Quod solus = que tú solo,
        - e sinu Patris = del seno del Padre,
      - - Mundi salus = salvación del mundo,
        - advéneris. = viniste.
    - - - Hunc = A él
        - astra, tellus, ǽquora, = los astros, la tierra, los mares,
      - - Hunc = a él
        - omne quod cælo subest, = todo lo que está bajo el cielo,
      - - Salútis auctórem novæ = autor de la nueva salvación,
      - - Novo salútat cántico. = lo saluda con un cántico nuevo.
    - - - Et nos, = Y nosotros,
        - beáta quos sacri = a quienes la dichosa
      - - Rigávit unda sánguinis, = ola de sangre sagrada bañó,
      - - Natális ob diem tui, = por el día de tu nacimiento,
      - - Hymni tribútum = el tributo de un himno
        - sólvimus. = te ofrecemos.
    - - - Iesu, = Jesús,
        - tibi sit glória, = a ti sea la gloria,
      - - Qui natus es = que naciste
        - de Vírgine, = de la Virgen,
      - - Cum Patre = con el Padre
        - et almo Spíritu, = y el Espíritu benigno,
      - - In sempitérna sǽcula. = por los siglos eternos.
    amen: Amen. = Amén.
