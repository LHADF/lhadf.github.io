      - - Transverberáto péctore. = de tu pecho traspasado.
    - - - Te = A ti
        - natiónum Prǽsides = los gobernantes de las naciones
      - - Honóre tollant = te ensalcen con honor
        - público, = público,
      - - Colant = te veneren
        - magístri, iúdices, = maestros y jueces,
      - - Leges et artes = las leyes y las artes
        - éxprimant. = te expresen.
    - - - Submíssa = Sometidas,
        - regum = de los reyes
        - fúlgeant = brillen
      - - Tibi dicáta = a ti consagradas
        - 'insígnia: = las insignias;'
      - - Mitíque sceptro = y a tu suave cetro
        - pátriam = la patria
      - - Domósque = y los hogares
