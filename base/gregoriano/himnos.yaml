    - - - Ad hoc = Para esto,
        - cruénta ab árbore, = del árbol ensangrentado
      - - Pendes = pendes
        - 'apértis bráchiis: = con los brazos abiertos;'
      - - Diráque = y por la cruel
        - fossum cúspide = lanza traspasado
      - - Cor = el corazón
        - igne flagrans = ardiendo en fuego
