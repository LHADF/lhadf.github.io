# Oraciones para la recitación del Oficio divino (ADF, 2026): preparatoria y conclusiva.
# Texto latino y traducción de ADF, renglón por renglón («latín = español»). Las rúbricas van como en el original.
# En ADF la preparatoria se reza antes de las I Vísperas del domingo, como introducción al oficio de toda la semana.
titulo: Oraciones para la recitación del Oficio divino
preparatoria:
  titulo: Oración preparatoria
  rubrica: 'Para bien disponer a los que van a cantar o recitar la Liturgia de las Horas, se puede agregar antes la siguiente oración, especialmente para dar comienzo a una nueva semana litúrgica o al inicio de un nuevo día:'
  texto:
    - Áperi, Dómine, os meum = Abre, Señor, mis labios
    - 'ad benedicéndum nomen sanctum tuum: = para bendecir tu santo Nombre:'
    - munda cor meum = purifica también mi corazón
    - ab ómnibus vanis, = de todo pensamiento vano,
    - pervérsis et aliénis cogitatiónibus; = perverso y distraído;
    - intelléctum illúmina, = ilumina mi entendimiento
    - afféctum inflámma, = y enciende mi sentimiento,
    - ut digne, atténte ac devóte = para que dignamente, con atención y devoción,
    - hoc Offícium recitáre váleam, = pueda recitar este Oficio,
    - et exaudíri mérear = y merezca ser escuchado
    - ante conspéctum divínæ maiestátis tuæ. = en la presencia de tu divina majestad.
  pausa: 'Después de una breve pausa:'
  final:
    - Per Christum Dóminum nostrum. = Por Cristo, nuestro Señor.
    - Amen. = Amén.
conclusiva:
  titulo: Oración conclusiva
  rubrica: 'El Papa León X concedió indulgencia por los defectos y culpas incurridos por la fragilidad humana durante la recitación del Oficio si se recita la siguiente oración con devoción, que debe decirse de rodillas:'
  texto:
    - Sacrosánctæ et indivíduæ Trinitáti, = A la sacrosanta e indivisa Trinidad,
    - crucifíxi Dómini nostri Iesu Christi humanitáti, = a la humanidad crucificada de nuestro Señor Jesucristo,
    - beatíssimæ et gloriosíssimæ = de la bienaventurada y gloriosísima
    - sempérque Vírginis Maríæ = siempre Virgen María
    - fœcúndæ integritáti, = a la fecunda virginidad,
    - et ómnium Sanctórum universitáti = y a toda la asamblea de los santos
    - sit sempitérna laus, honor, virtus et glória = sea siempre la alabanza, el honor, el poder y la gloria
    - ab omni creatúra, = por toda creatura,
    - nobísque remíssio ómnium peccatórum, = y a nosotros se nos conceda la remisión de todos nuestros pecados,
    - per infiníta sǽcula sæculórum. = por los siglos de los siglos.
  respuesta:
    - Amen. = Amén.
  versiculo:
    - Beáta víscera Maríæ Vírginis, = Bienaventurado el seno de María Virgen,
    - quæ portavérunt ætérni Patris Fílium. = que llevó al Hijo del eterno Padre.
  respuesta_versiculo:
    - Et beáta úbera, = Y bienaventurados los pechos
    - quæ lactavérunt Christum Dóminum. = que amamantaron a Cristo, el Señor.
  despues:
    - Pater noster… = Padre nuestro…
    - Ave, María… = Dios te salve, María…
