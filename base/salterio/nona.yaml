# Salterio de Nona: cuatro semanas (Tiempo Ordinario).
semana_1:
  domingo:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Ga 6, 9-10
      texto: No nos cansemos de practicar el bien; que a su tiempo cosecharemos si no desmayamos. Así que, mientras tengamos oportunidad, hagamos el bien a todos, pero especialmente a los miembros de la Iglesia.
    versiculo:
    - - V
      - Te invoco de todo corazón; respóndeme, Señor.
    - - R
      - Y guardaré tus leyes.
    oracion: Dios nuestro, que quisiste hacernos hijos de la luz por la adopción de la gracia, concédenos que no seamos envueltos por las tinieblas del error, sino que permanezcamos siempre en el esplendor de la verdad. Por Cristo nuestro Señor.
  lunes:
    himno: Oh Jesús, que en tu cruz has demostrado
    lectura:
      ref: 1Pe 1, 17-19
      texto: Tomad en serio vuestro proceder en esta vida. Ya sabéis con qué os rescataron, no con bienes efímeros, con oro o plata, sino a precio de la sangre de Cristo, el cordero sin defecto ni mancha.
    versiculo:
    - - V
      - Sálvame, Señor, y ten misericordia de mí.
    - - R
      - En la asamblea te bendeciré, Señor.
    oracion: 'Tú nos has convocado, Señor, en tu presencia en esta misma hora en que los apóstoles subían al templo para la oración de la tarde: concédenos que las súplicas que ahora te dirigimos en nombre de Jesús, tu Hijo, alcancen la salvación a cuantos lo invocan. Por Cristo nuestro Señor.'
  martes:
    himno: Oh Jesús, que en tu cruz has demostrado
    lectura:
      ref: Jb 5, 17-18
      texto: 'Dichoso el hombre a quien corrige Dios: no rechaces el escarmiento del Todopoderoso, porque él hiere y venda la herida, golpea y cura con su mano.'
    versiculo:
    - - V
      - Trata con misericordia a tu siervo.
    - - R
      - Enséñame tus leyes.
    oracion: Dios nuestro, que enviaste un ángel al centurión Cornelio para que le revelara el camino de la salvación, ayúdanos a trabajar cada día con mayor entrega en la salvación de los hombres, para que, junto con todos nuestros hermanos, incorporados a la Iglesia de tu Hijo, podamos llegar a ti. Por Cristo nuestro Señor.
  miercoles:
    himno: Oh Jesús, que en tu cruz has demostrado
    lectura:
      ref: St 4, 7-8a. 10
      texto: Vivid sometidos a Dios. Resistid al diablo y huirá de vosotros. Acercaos a Dios y él se acercará a vosotros. Humillaos en la presencia del Señor y él os ensalzará.
    versiculo:
    - - V
      - Los ojos del Señor están puestos en sus fieles.
    - - R
      - En los que esperan en su misericordia.
    oracion: 'Señor Jesucristo, que por la salvación de los hombres extendiste tus brazos en la cruz: haz que todas nuestras acciones te sean agradables y sirvan para manifestar al mundo tu redención. Tú que vives y reinas por los siglos de los siglos.'
  jueves:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Am 9, 6
      texto: El Señor construye en el cielo su morada, cimenta sobre la tierra su bóveda; convoca las aguas del mar y las derrama sobre la superficie de la tierra. Su nombre es el Señor.
    versiculo:
    - - V
      - El cielo proclama la gloria de Dios.
    - - R
      - El firmamento pregona la obra de sus manos.
    oracion: Contempla, Señor, a tu familia en oración, y haz que imitando los ejemplos de paciencia de tu Hijo no decaiga nunca ante la adversidad. Por Cristo nuestro Señor.
  viernes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Col 3, 12-13
      texto: 'Como pueblo elegido de Dios, pueblo sacro y amado, sea vuestro uniforme: la misericordia entrañable, la bondad, la humildad, la dulzura, la comprensión. Sobrellevaos mutuamente y perdonaos, cuando alguno tenga quejas contra otro. El Señor os ha perdonado; haced vosotros lo mismo.'
    versiculo:
    - - V
      - El Señor es compasivo y misericordioso.
    - - R
      - Lento a la ira y rico en clemencia.
    oracion: Señor Jesucristo, tú que, crucificado a la hora de nona, diste al ladrón arrepentido el reino eterno; míranos a nosotros, que como él confesamos nuestras culpas, y concédenos poder entrar, también como él, después de la muerte, en tu paraíso. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Sb 7, 27a; 8, 1
      texto: La sabiduría de Dios, aún siendo sola, lo puede todo; sin salir de sí misma, todo lo renueva. Se despliega vigorosamente de un confín al otro del mundo y gobierna de excelente manera todo el universo.
    versiculo:
    - - V
      - Qué magníficas son tus obras, Señor.
    - - R
      - Qué profundos tus designios.
    oracion: Escucha, Señor, nuestra oración y danos la abundancia de tu paz, para que, por intercesión de la santísima Virgen María, después de haberte servido durante toda nuestra vida, podamos presentarnos ante ti sin temor alguno. Por Cristo, nuestro Señor.
semana_2:
  domingo:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: 2Co 1, 21-22
      texto: Dios es quien nos confirma en Cristo a nosotros junto con vosotros. Él nos ha ungido, él nos ha sellado, y ha puesto en nuestros corazones, como prenda suya, el Espíritu.
    versiculo:
    - - V
      - El Señor es mi luz y mi salvación.
    - - R
      - El Señor es la defensa de mi vida.
    oracion: Oh Dios, que por medio de la humillación de tu Hijo levantaste a la humanidad caída, conserva a tus fieles en continua alegría y concede los gozos del cielo a quienes has librado de la muerte eterna. Por Cristo nuestro Señor.
  lunes:
    himno: Oh Jesús, que en tu cruz has demostrado
    lectura:
      ref: Ez 34, 31
      texto: 'Dice el Señor Dios: «Vosotros sois rebaño mío, ovejas de mi grey; y yo soy vuestro Dios.»'
    versiculo:
    - - V
      - El Señor es mi pastor, nada me falta.
    - - R
      - En verdes praderas me hace recostar.
    oracion: 'Tú nos has convocado, Señor, en tu presencia en esta misma hora en que los apóstoles subían al templo para la oración de la tarde: concédenos que las súplicas que ahora te dirigimos en nombre de Jesús, tu Hijo, alcancen la salvación a cuantos lo invocan. Por Cristo nuestro Señor.'
  martes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: 1Co 12, 24b. 25-26
      texto: Dios quiso que no hubiera divisiones en el cuerpo, porque todos los miembros por igual se preocupan unos de otros. Cuando un miembro sufre, todos sufren con él; cuando un miembro es honrado, todos le felicitan.
    versiculo:
    - - V
      - Señor Dios nuestro, reúnenos de entre los gentiles.
    - - R
      - Daremos gracias a tu santo nombre.
    oracion: Dios nuestro, que enviaste un ángel al centurión Cornelio para que le revelara el camino de la salvación, ayúdanos a trabajar cada día con mayor entrega en la salvación de los hombres, para que, junto con todos nuestros hermanos, incorporados a la Iglesia de tu Hijo, podamos llegar a ti. Por Cristo nuestro Señor.
  miercoles:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: 1S 16, 7b
      texto: La mirada de Dios no es como la mirada del hombre, pues el hombre mira las apariencias, pero el Señor mira el corazón.
    versiculo:
    - - V
      - Señor, sondéame y conoce mi corazón.
    - - R
      - Guíame por el camino eterno.
    oracion: 'Señor Jesucristo, que por la salvación de los hombres extendiste tus brazos en la cruz: haz que todas nuestras acciones te sean agradables y sirvan para manifestar al mundo tu redención. Tú que vives y reinas por los siglos de los siglos.'
  jueves:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Ga 5, 22. 23a. 25
      texto: 'El fruto del Espíritu es: amor, alegría, paz, comprensión, servicialidad, bondad, lealtad, amabilidad, dominio de sí. Si vivimos por el Espíritu marchemos tras el Espíritu.'
    versiculo:
    - - V
      - Indícame, Señor, el camino que he de seguir.
    - - R
      - Tu espíritu que es bueno me guíe por tierra llana.
    oracion: Contempla, Señor, a tu familia en oración, y haz que imitando los ejemplos de paciencia de tu Hijo no decaiga nunca ante la adversidad. Por Cristo nuestro Señor.
  viernes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Sb 1, 13-15
      texto: Dios no hizo la muerte, ni se recrea en la destrucción de los vivientes; todo lo creó para que subsistiera; las creaturas del mundo son saludables, no hay en ellas veneno de muerte ni imperio del abismo sobre la tierra, porque la justicia es inmortal.
    versiculo:
    - - V
      - Arrancó el Señor mi alma de la muerte.
    - - R
      - Caminaré en presencia del Señor en el país de la vida.
    oracion: Señor Jesucristo, tú que, crucificado a la hora de nona, diste al ladrón arrepentido el reino eterno; míranos a nosotros, que como él confesamos nuestras culpas, y concédenos poder entrar, también como él, después de la muerte, en tu paraíso. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Danos, Señor, la firme voluntad
    lectura:
      ref: Jr 6, 16
      texto: 'Poneos en los caminos y mirad, preguntad a las sendas antiguas: «¿Es éste el buen camino?» Caminad por él, y hallaréis reposo para vuestra alma.'
    versiculo:
    - - V
      - Tus preceptos son mi herencia perpetua.
    - - R
      - La alegría de mi corazón.
    oracion: Escucha, Señor, nuestra oración y danos la abundancia de tu paz, para que, por intercesión de la santísima Virgen María, después de haberte servido durante toda nuestra vida, podamos presentarnos ante ti sin temor alguno. Por Cristo, nuestro Señor.
semana_3:
  domingo:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: 2Tm 1, 9
      texto: Dios nos ha salvado y nos ha llamado con santa llamada, no según nuestras obras, sino según su propio propósito y su gracia, que nos dio con Cristo Jesús antes de los tiempos eternos.
    versiculo:
    - - V
      - El Señor los condujo seguros, sin alarmas.
    - - R
      - Los hizo entrar por las santas fronteras.
    oracion: Señor Dios, que muestras la luz de tu verdad a los que andan extraviados, para que puedan volver al camino recto, concede a todos los cristianos que se aparten de todo lo que sea indigno de ese nombre que llevan, y que cumplan lo que ese nombre significa. Por Cristo nuestro Señor.
  lunes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Col 1, 21-22
      texto: A vosotros, que antes estabais enajenados y enemigos en vuestra mente por las obras malas, ahora os ha reconciliado en su cuerpo de carne mediante la muerte, presentándoos ante él como santos sin mancha y sin falta.
    versiculo:
    - - V
      - Tañed para el Señor, fieles suyos.
    - - R
      - Dad gracias a su nombre santo.
    oracion: 'Tú nos has convocado, Señor, en tu presencia en esta misma hora en que los apóstoles subían al templo para la oración de la tarde: concédenos que las súplicas que ahora te dirigimos en nombre de Jesús, tu Hijo, alcancen la salvación a cuantos lo invocan. Por Cristo nuestro Señor.'
  martes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Pr 22, 22-23
      texto: No robes al pobre, porque es pobre, no oprimas al desgraciado en el tribunal, porque el Señor defenderá su causa y pondrá zancadillas a los que se las ponían.
    versiculo:
    - - V
      - Librará al pobre que clamaba.
    - - R
      - Y salvará la vida de los pobres.
    oracion: Dios nuestro, que enviaste un ángel al centurión Cornelio para que le revelara el camino de la salvación, ayúdanos a trabajar cada día con mayor entrega en la salvación de los hombres, para que, junto con todos nuestros hermanos, incorporados a la Iglesia de tu Hijo, podamos llegar a ti. Por Cristo nuestro Señor.
  miercoles:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Col 3, 14-15
      texto: 'Por encima de todo, procurad el amor, que es el ceñidor de la unidad consumada. Que la paz de Cristo actúe de árbitro en vuestro corazón: a ella habéis sido convocados, en un solo cuerpo.'
    versiculo:
    - - V
      - Los sufridos poseen la tierra.
    - - R
      - Y disfrutan de paz abundante.
    oracion: 'Señor Jesucristo, que por la salvación de los hombres extendiste tus brazos en la cruz: haz que todas nuestras acciones te sean agradables y sirvan para manifestar al mundo tu redención. Tú que vives y reinas por los siglos de los siglos.'
  jueves:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Est 10, 9
      texto: Mi pueblo es Israel, que clamó a Dios y fue salvado. Salvó el Señor a su pueblo y nos liberó de todos estos males; obró Dios grandes señales y prodigios como nunca los hubo en los demás pueblos.
    versiculo:
    - - V
      - Te doy gracias, Señor, porque me escuchaste.
    - - R
      - Y fuiste mi salvación.
    oracion: Contempla, Señor, a tu familia en oración, y haz que imitando los ejemplos de paciencia de tu Hijo no decaiga nunca ante la adversidad. Por Cristo nuestro Señor.
  viernes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Ef 2, 8-9
      texto: Estáis salvados por la gracia y mediante la fe. Y no se debe a vosotros, sino que es un don de Dios; y tampoco se debe a las obras, para que nadie pueda presumir.
    versiculo:
    - - V
      - Conozca la tierra, Señor, tus caminos.
    - - R
      - Todos los pueblos tu salvación.
    oracion: Señor Jesucristo, tú que, crucificado a la hora de nona, diste al ladrón arrepentido el reino eterno; míranos a nosotros, que como él confesamos nuestras culpas, y concédenos poder entrar, también como él, después de la muerte, en tu paraíso. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Mi 6, 8
      texto: 'Se te ha dado a conocer, oh hombre, lo que es bueno, lo que Dios desea de ti: simplemente que practiques la justicia, que ames la misericordia, y que camines humildemente con tu Dios.'
    versiculo:
    - - V
      - Mi alegría es el camino de tus preceptos.
    - - R
      - Señor, no olvidaré tus palabras.
    oracion: Escucha, Señor, nuestra oración y danos la abundancia de tu paz, para que, por intercesión de la santísima Virgen María, después de haberte servido durante toda nuestra vida, podamos presentarnos ante ti sin temor alguno. Por Cristo, nuestro Señor.
semana_4:
  domingo:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Ct 8, 6b-7
      texto: 'El amor es fuerte como la muerte, es cruel la pasión como el abismo; es centella de fuego, llamarada divina: las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos.'
    versiculo:
    - - V
      - Yo te amo, Señor, tú eres mi fortaleza.
    - - R
      - Mi escudo, mi fuerza salvadora.
    oracion: Mira con misericordia a estos tus hijos, Señor, y multiplica tu gracia sobre nosotros, para que, fervorosos en la fe, la esperanza y el amor, perseveremos en el fiel cumplimiento de tus mandamientos. Por Cristo nuestro Señor.
  lunes:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Ba 4, 21b-22
      texto: 'Hijos, clamad al Señor: él os librará de la tiranía y de la mano de vuestros enemigos. Yo espero del Eterno vuestra salvación, del Santo me ha venido la alegría, por la misericordia que llegará pronto a vosotros de parte del Eterno, vuestro Salvador.'
    versiculo:
    - - V
      - Recuerda, Señor, tu ternura.
    - - R
      - Y tu misericordia, que son eternas.
    oracion: 'Tú nos has convocado, Señor, en tu presencia en esta misma hora en que los apóstoles subían al templo para la oración de la tarde: concédenos que las súplicas que ahora te dirigimos en nombre de Jesús, tu Hijo, alcancen la salvación a cuantos lo invocan. Por Cristo nuestro Señor.'
  martes:
    himno: Oh Jesús, que en tu cruz has demostrado
    lectura:
      ref: Is 55, 10-11
      texto: 'Como bajan la lluvia y la nieve del cielo, y no vuelven allá, sino después de empapar la tierra, de fecundarla y hacerla germinar, para que dé semilla al sembrador y pan al que come, así será mi palabra, que sale de mi boca: no volverá a mí vacía; sino que hará mi voluntad y cumplirá mi encargo.'
    versiculo:
    - - V
      - El Señor envía su mensaje a la tierra.
    - - R
      - Y su palabra corre veloz.
    oracion: Dios nuestro, que enviaste un ángel al centurión Cornelio para que le revelara el camino de la salvación, ayúdanos a trabajar cada día con mayor entrega en la salvación de los hombres, para que, junto con todos nuestros hermanos, incorporados a la Iglesia de tu Hijo, podamos llegar a ti. Por Cristo nuestro Señor.
  miercoles:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Col 3, 23-24
      texto: 'Lo que hacéis, hacedlo con toda el alma, como para servir al Señor y no a los hombres: sabiendo bien que recibiréis del Señor en recompensa la herencia. Servid a Cristo Señor.'
    versiculo:
    - - V
      - El Señor es mi heredad y mi copa.
    - - R
      - Mi suerte está en tu mano.
    oracion: 'Señor Jesucristo, que por la salvación de los hombres extendiste tus brazos en la cruz: haz que todas nuestras acciones te sean agradables y sirvan para manifestar al mundo tu redención. Tú que vives y reinas por los siglos de los siglos.'
  jueves:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Hb 12, 1b-2
      texto: Después de habernos despojado de todo el peso y del equipaje que nos distraía, corramos también nosotros con firmeza y constancia la carrera para nosotros preparada. Llevemos los ojos fijos en Jesús, caudillo y consumador de la fe, quien, para ganar el gozo que se le ofrecía, sufrió con toda constancia la cruz, pasando por encima de su ignominia; y está sentado a la diestra del trono de Dios.
    versiculo:
    - - V
      - Mi alma espera en el Señor.
    - - R
      - Espera en su palabra.
    oracion: Contempla, Señor, a tu familia en oración, y haz que imitando los ejemplos de paciencia de tu Hijo no decaiga nunca ante la adversidad. Por Cristo nuestro Señor.
  viernes:
    himno: Danos, Señor, la firme voluntad
    lectura:
      ref: 1Jn 4, 9-11
      texto: 'En esto se manifestó el amor que Dios nos tiene: en que Dios envió al mundo a su Hijo único para que vivamos por medio de él. En esto consiste el amor: no en que nosotros hayamos amado a Dios, sino en que él nos amó y nos envió a su Hijo como propiciación por nuestros pecados. Queridos, si Dios nos amó de esta manera, también nosotros debemos amarnos unos a otros.'
    versiculo:
    - - V
      - Fíjate, ¡oh Dios!, en nuestro Escudo.
    - - R
      - Mira el rostro de tu Ungido.
    oracion: Señor Jesucristo, tú que, crucificado a la hora de nona, diste al ladrón arrepentido el reino eterno; míranos a nosotros, que como él confesamos nuestras culpas, y concédenos poder entrar, también como él, después de la muerte, en tu paraíso. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Fundamento de todo lo que existe
    lectura:
      ref: Flp 4, 8. 9b
      texto: Todo lo que es verdadero, noble, justo, puro, amable, laudable, todo lo que es virtud o mérito, tenedlo en cuenta, hermanos. Y el Dios de la paz estará con vosotros.
    versiculo:
    - - V
      - Te ensalzaré, Dios mío, mi rey.
    - - R
      - Bendeciré tu nombre por siempre jamás.
    oracion: Escucha, Señor, nuestra oración y danos la abundancia de tu paz, para que, por intercesión de la santísima Virgen María, después de haberte servido durante toda nuestra vida, podamos presentarnos ante ti sin temor alguno. Por Cristo, nuestro Señor.
