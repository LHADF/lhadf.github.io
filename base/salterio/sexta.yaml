# Salterio de Sexta: cuatro semanas (Tiempo Ordinario).
semana_1:
  domingo:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Ga 6, 8
      texto: Lo que uno siembre, eso cosechará. El que siembre en su carne, de la carne cosechará corrupción; el que siembre en el Espíritu, del Espíritu cosechará vida eterna.
    versiculo:
    - - V
      - Tu palabra, Señor, es eterna.
    - - R
      - Tu fidelidad de generación en generación.
    oracion: Dios nuestro, que quisiste hacernos hijos de la luz por la adopción de la gracia, concédenos que no seamos envueltos por las tinieblas del error, sino que permanezcamos siempre en el esplendor de la verdad. Por Cristo nuestro Señor.
  lunes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: St 1, 19-20. 26
      texto: Sea todo hombre pronto para escuchar, tardo para hablar, remiso para la cólera. El hombre encolerizado no obra lo que agrada a Dios. Quien piensa que sirve a Dios y no refrena su lengua se engaña a sí mismo. No vale nada su religión.
    versiculo:
    - - V
      - Bendigo al Señor en todo momento.
    - - R
      - Su alabanza está siempre en mi boca.
    oracion: 'Señor, tú eres el dueño de la viña y de los sembrados, tú el que repartes las tareas y distribuyes el justo salario a los trabajadores: ayúdanos a soportar el peso del día y el calor de la jornada sin quejarnos nunca de tus planes. Por Cristo, nuestro Señor.'
  martes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Pr 3, 13-15
      texto: 'Dichoso el que encuentra sabiduría, el que alcanza inteligencia: adquirirla vale más que la plata y su renta más que el oro, es más valiosa que las perlas ni se le comparan las joyas.'
    versiculo:
    - - V
      - Te gusta un corazón sincero.
    - - R
      - En mi interior me inculcas sabiduría.
    oracion: Dios nuestro, que revelaste a Pedro tu plan de salvar a todas las naciones, danos tu gracia para que todas nuestras acciones sean agradables a tus ojos y útiles a tu designio de amor y salvación universal. Por Cristo nuestro Señor.
  miercoles:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: 1Pe 1, 15-16
      texto: 'Como es santo el que os llamó, sed también santos en toda vuestra conducta, porque está escrito: «Sed santos, porque yo soy santo.»'
    versiculo:
    - - V
      - Que tus sacerdotes se vistan de justicia.
    - - R
      - Que tus fieles te aclamen con júbilo.
    oracion: Dios todopoderoso y lleno de amor, que a la mitad de nuestra jornada concedes un descanso a nuestra fatiga, contempla complacido el trabajo empezado, remedia nuestras deficiencias, y haz que nuestras obras te sean agradables. Por Cristo nuestro Señor.
  jueves:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Am 5, 8
      texto: El Señor creó las Pléyades y Orión, convierte la sombra en aurora, oscurece el día en noche; convoca las aguas del mar y las derrama sobre la superficie de la tierra. Su nombre es el Señor.
    versiculo:
    - - V
      - Honor y majestad lo preceden.
    - - R
      - Fuerza y esplendor están en su templo.
    oracion: Dios todopoderoso y eterno, ante ti no existe ni la oscuridad ni las tinieblas, haz, pues, brillar sobre nosotros la claridad de tu luz, para que, guardando tus preceptos, caminemos siempre por tus sendas con el corazón jubiloso. Por Cristo nuestro Señor.
  viernes:
    himno: El pan de cada día
    lectura:
      ref: 2Co 13, 4
      texto: Aunque por su condición de debilidad humana Cristo fue crucificado, ahora tiene vida por la omnipotencia de Dios. Y nosotros, aunque débiles ahora con su debilidad, por la omnipotencia de Dios tendremos vida con él.
    versiculo:
    - - V
      - Mi alma está pegada al polvo.
    - - R
      - Reanímame, Señor, con tus palabras.
    oracion: Señor Jesucristo, tú que a la hora de sexta subiste a la cruz por nuestra salvación mientras el mundo vivía sumergido en las tinieblas; concédenos que tu luz nos ilumine siempre para que, guiados por ella, podamos alcanzar la vida eterna. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Jr 17, 9-10
      texto: Nada más falso y enfermo que el corazón, ¿quién lo entenderá? Yo, el Señor, penetro el corazón, sondeo las entrañas; para dar al hombre según su conducta, según el fruto de sus acciones.
    versiculo:
    - - V
      - Absuélveme, Señor, de lo que se me oculta.
    - - R
      - Preserva a tu siervo de la arrogancia.
    oracion: Señor, fuego ardiente de amor eterno, haz que, inflamados en tu amor, te amemos a ti sobre todas las cosas y a nuestro prójimo por amor tuyo. Por Cristo, nuestro Señor.
semana_2:
  domingo:
    himno: Cuando la luz del día está en su cumbre
    lectura:
      ref: Rm 8, 26
      texto: De la misma manera, el Espíritu acude en ayuda de nuestra debilidad, pues no sabemos pedir como conviene; y el Espíritu mismo aboga por nosotros con gemidos que no pueden ser expresados en palabras.
    versiculo:
    - - V
      - Que llegue mi clamor a tu presencia, Señor.
    - - R
      - Con tus palabras dame inteligencia.
    oracion: Oh Dios, que por medio de la humillación de tu Hijo levantaste a la humanidad caída, conserva a tus fieles en continua alegría y concede los gozos del cielo a quienes has librado de la muerte eterna. Por Cristo nuestro Señor.
  lunes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Jr 32,40
      texto: Haré con ellos alianza eterna y no cesaré de hacerles bien. Pondré en sus corazones mi temor para que no se aparten de mí.
    versiculo:
    - - V
      - De Dios viene mi salvación y mi gloria.
    - - R
      - Él es mi refugio.
    oracion: 'Señor, tú eres el dueño de la viña y de los sembrados, tú el que repartes las tareas y distribuyes el justo salario a los trabajadores: ayúdanos a soportar el peso del día y el calor de la jornada sin quejarnos nunca de tus planes. Por Cristo, nuestro Señor.'
  martes:
    himno: El pan de cada día
    lectura:
      ref: 1Co 12, 12-13
      texto: Lo mismo que el cuerpo es uno y tiene muchos miembros, y todos los miembros del cuerpo, a pesar de ser muchos, son un solo cuerpo, así es también Cristo. Todos nosotros, judíos y griegos, esclavos y libres, hemos sido bautizados en un mismo Espíritu, para formar un solo cuerpo. Y todos hemos bebido de un solo Espíritu.
    versiculo:
    - - V
      - Padre santo, guárdanos en tu nombre.
    - - R
      - Para que seamos perfectamente uno.
    oracion: Dios nuestro, que revelaste a Pedro tu plan de salvar a todas las naciones, danos tu gracia para que todas nuestras acciones sean agradables a tus ojos y útiles a tu designio de amor y salvación universal. Por Cristo nuestro Señor.
  miercoles:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Is 55, 8-9
      texto: Mis planes no son vuestros planes, vuestros caminos no son mis caminos —oráculo del Señor—. Como el cielo es más alto que la tierra, mis caminos son más altos que los vuestros, mis planes, que vuestros planes.
    versiculo:
    - - V
      - Señor de los ejércitos, ¿quién como tú?
    - - R
      - El poder y la fidelidad te rodean.
    oracion: Dios todopoderoso y lleno de amor, que a la mitad de nuestra jornada concedes un descanso a nuestra fatiga, contempla complacido el trabajo empezado, remedia nuestras deficiencias, y haz que nuestras obras te sean agradables. Por Cristo nuestro Señor.
  jueves:
    himno: El pan de cada día
    lectura:
      ref: Ga 5, 16-17
      texto: Si vivís según el Espíritu, no daréis satisfacción a las apetencias de la carne. Pues la carne desea contra el espíritu, y el espíritu contra la carne, como que son entre sí antagónicos, de forma que no hacéis lo que quisierais.
    versiculo:
    - - V
      - Tú eres bueno, Señor, y haces el bien.
    - - R
      - Instrúyeme en tus leyes.
    oracion: Dios todopoderoso y eterno, ante ti no existe ni la oscuridad ni las tinieblas, haz, pues, brillar sobre nosotros la claridad de tu luz, para que, guardando tus preceptos, caminemos siempre por tus sendas con el corazón jubiloso. Por Cristo nuestro Señor.
  viernes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Ba 4, 28-29
      texto: Como os inclinasteis a apartaros de Dios, así convertidos lo buscaréis diez veces más, pues el que trajo sobre vosotros el castigo, os traerá con la redención la eterna alegría.
    versiculo:
    - - V
      - Del Señor viene la misericordia.
    - - R
      - Y la redención copiosa.
    oracion: Señor Jesucristo, tú que a la hora de sexta subiste a la cruz por nuestra salvación mientras el mundo vivía sumergido en las tinieblas; concédenos que tu luz nos ilumine siempre para que, guiados por ella, podamos alcanzar la vida eterna. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: 1R 2, 2b-3
      texto: Esfuérzate y sé hombre. Sé fiel al Señor tu Dios marchando por sus caminos, guardando sus mandamientos, sus leyes y sus preceptos, como están escritos en la ley de Moisés, para que seas afortunado en cuanto hicieras y dondequiera que vayas.
    versiculo:
    - - V
      - Guíame, Señor, por la senda de tus mandatos.
    - - R
      - Porque ella es mi gozo.
    oracion: Señor, fuego ardiente de amor eterno, haz que, inflamados en tu amor, te amemos a ti sobre todas las cosas y a nuestro prójimo por amor tuyo. Por Cristo, nuestro Señor.
semana_3:
  domingo:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Rm 8, 22-23
      texto: La creación entera, como bien lo sabemos, va suspirando y gimiendo toda ella, hasta el momento presente, como con dolores de parto. Y no es ella sola, también nosotros, que poseemos las primicias del Espíritu, suspiramos en nuestro interior, anhelando la redención de nuestro cuerpo.
    versiculo:
    - - V
      - Bendice, alma mía, al Señor.
    - - R
      - El rescata tu vida de la fosa.
    oracion: Señor Dios, que muestras la luz de tu verdad a los que andan extraviados, para que puedan volver al camino recto, concede a todos los cristianos que se aparten de todo lo que sea indigno de ese nombre que llevan, y que cumplan lo que ese nombre significa. Por Cristo nuestro Señor.
  lunes:
    himno: El pan de cada día
    lectura:
      ref: Rm 6, 22
      texto: Ahora, libertados del dominio del pecado y hechos siervos de Dios, tenéis como fruto la santidad, y como desenlace la vida eterna.
    versiculo:
    - - V
      - Tú, Señor, vas a devolvernos la vida.
    - - R
      - Para que tu pueblo se alegre contigo.
    oracion: 'Señor, tú eres el dueño de la viña y de los sembrados, tú el que repartes las tareas y distribuyes el justo salario a los trabajadores: ayúdanos a soportar el peso del día y el calor de la jornada sin quejarnos nunca de tus planes. Por Cristo, nuestro Señor.'
  martes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Dt 15, 7-8
      texto: Si hay entre los tuyos un pobre, un hermano, en una ciudad tuya, en esa tierra tuya que va a darte el Señor, tu Dios, no endurezcas el corazón ni cierres la mano a tu hermano pobre.
    versiculo:
    - - V
      - Señor, tú escuchas los deseos de los humildes.
    - - R
      - Les prestas oído y los animas.
    oracion: Dios nuestro, que revelaste a Pedro tu plan de salvar a todas las naciones, danos tu gracia para que todas nuestras acciones sean agradables a tus ojos y útiles a tu designio de amor y salvación universal. Por Cristo nuestro Señor.
  miercoles:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: 1Co 13, 8-9, 13
      texto: 'El amor no pasa nunca. El don de predicar se acabará. El don de lenguas enmudecerá. El saber se acabará. Mi conocer es por ahora inmaduro; entonces podré conocer como Dios me conoce. En una palabra: quedan la fe, la esperanza, el amor: éstas tres. La más grande es el amor.'
    versiculo:
    - - V
      - Que tu misericordia, Señor, venga sobre nosotros.
    - - R
      - Como lo esperamos de ti.
    oracion: Dios todopoderoso y lleno de amor, que a la mitad de nuestra jornada concedes un descanso a nuestra fatiga, contempla complacido el trabajo empezado, remedia nuestras deficiencias, y haz que nuestras obras te sean agradables. Por Cristo nuestro Señor.
  jueves:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Dt 4, 7
      texto: ¿Cuál de las naciones grandes tiene unos dioses tan cercanos como el Señor, nuestro Dios, siempre que lo invocamos?
    versiculo:
    - - V
      - Cerca está el Señor de los que lo invocan.
    - - R
      - Y escucha sus gritos.
    oracion: Dios todopoderoso y eterno, ante ti no existe ni la oscuridad ni las tinieblas, haz, pues, brillar sobre nosotros la claridad de tu luz, para que, guardando tus preceptos, caminemos siempre por tus sendas con el corazón jubiloso. Por Cristo nuestro Señor.
  viernes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Rm 3, 21-22a
      texto: Ahora, sin la ley, la justicia de Dios se ha manifestado, recibiendo testimonio de la ley y de los profetas; justicia de Dios por la fe en Jesucristo para todos los que creen en él.
    versiculo:
    - - V
      - Los mandatos del Señor son rectos y alegran el corazón.
    - - R
      - La norma del Señor es límpida y da luz a los ojos.
    oracion: Señor Jesucristo, tú que a la hora de sexta subiste a la cruz por nuestra salvación mientras el mundo vivía sumergido en las tinieblas; concédenos que tu luz nos ilumine siempre para que, guiados por ella, podamos alcanzar la vida eterna. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Ga 5, 26; 6, 2
      texto: No busquemos la vanagloria, provocándonos y teniéndonos envidia mutuamente. Ayudaos a llevar mutuamente vuestras cargas, y así cumpliréis la ley de Cristo.
    versiculo:
    - - V
      - Ved qué paz y qué alegría, convivir los hermanos unidos.
    - - R
      - Allí manda el Señor la bendición.
    oracion: Señor, fuego ardiente de amor eterno, haz que, inflamados en tu amor, te amemos a ti sobre todas las cosas y a nuestro prójimo por amor tuyo. Por Cristo, nuestro Señor.
semana_4:
  domingo:
    himno: Cuando la luz del día está en su cumbre
    lectura:
      ref: Dt 10, 12
      texto: ¿Qué es lo que te exige el Señor, tu Dios? Que temas al Señor, tu Dios, que sigas sus caminos y lo ames, que sirvas al Señor, tu Dios, con todo el corazón y con toda el alma.
    versiculo:
    - - V
      - Señor, ¿quién puede hospedarse en tu tienda?
    - - R
      - El que procede honradamente y tiene intenciones leales.
    oracion: Mira con misericordia a estos tus hijos, Señor, y multiplica tu gracia sobre nosotros, para que, fervorosos en la fe, la esperanza y el amor, perseveremos en el fiel cumplimiento de tus mandamientos. Por Cristo nuestro Señor.
  lunes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Sb 15, 1. 3
      texto: Tú, Dios nuestro, eres bueno, leal y paciente, y con misericordia gobiernas todas las cosas. La perfecta justicia consiste en conocerte a ti, y reconocer tu poder es la raíz de la inmortalidad.
    versiculo:
    - - V
      - Tú, Señor, eres Dios clemente y misericordioso.
    - - R
      - Lento a la cólera, rico en piedad y leal.
    oracion: 'Señor, tú eres el dueño de la viña y de los sembrados, tú el que repartes las tareas y distribuyes el justo salario a los trabajadores: ayúdanos a soportar el peso del día y el calor de la jornada sin quejarnos nunca de tus planes. Por Cristo, nuestro Señor.'
  martes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Dt 30, 11. 14
      texto: 'El precepto que yo te mando hoy no es cosa que te exceda, ni inalcanzable; el mandamiento está muy cerca de ti: en tu corazón y en tu boca. Cúmplelo.'
    versiculo:
    - - V
      - Lámpara es tu palabra para mis pasos, Señor.
    - - R
      - Luz en mi sendero.
    oracion: Dios nuestro, que revelaste a Pedro tu plan de salvar a todas las naciones, danos tu gracia para que todas nuestras acciones sean agradables a tus ojos y útiles a tu designio de amor y salvación universal. Por Cristo nuestro Señor.
  miercoles:
    himno: El pan de cada día
    lectura:
      ref: Col 3, 17
      texto: Todo lo que de palabra o de obra realicéis, sea todo en nombre de Jesús, ofreciendo la Acción de Gracias a Dios Padre por medio de él.
    versiculo:
    - - V
      - Te ofreceré un sacrificio de alabanza.
    - - R
      - Invocando tu nombre, Señor.
    oracion: Dios todopoderoso y lleno de amor, que a la mitad de nuestra jornada concedes un descanso a nuestra fatiga, contempla complacido el trabajo empezado, remedia nuestras deficiencias, y haz que nuestras obras te sean agradables. Por Cristo nuestro Señor.
  jueves:
    himno: El pan de cada día
    lectura:
      ref: Sb 1, 1-2
      texto: Amad la justicia, los que juzgáis la tierra, pensad rectamente del Señor y con sencillez de corazón buscadlo. Porque se deja hallar de los que no le tientan, se manifiesta a los que no desconfían de él.
    versiculo:
    - - V
      - Confía en el Señor y haz el bien.
    - - R
      - Habita tu tierra y practica la lealtad.
    oracion: Dios todopoderoso y eterno, ante ti no existe ni la oscuridad ni las tinieblas, haz, pues, brillar sobre nosotros la claridad de tu luz, para que, guardando tus preceptos, caminemos siempre por tus sendas con el corazón jubiloso. Por Cristo nuestro Señor.
  viernes:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: 1Jn 3, 6
      texto: 'En esto hemos conocido el amor: en que él dio su vida por nosotros. También nosotros debemos dar nuestra vida por los hermanos.'
    versiculo:
    - - V
      - Dad gracias al Señor porque es bueno.
    - - R
      - Porque es eterna su misericordia.
    oracion: Señor Jesucristo, tú que a la hora de sexta subiste a la cruz por nuestra salvación mientras el mundo vivía sumergido en las tinieblas; concédenos que tu luz nos ilumine siempre para que, guiados por ella, podamos alcanzar la vida eterna. Tú que vives y reinas por los siglos de los siglos.
  sabado:
    himno: Este mundo del hombre, en que él se afana
    lectura:
      ref: Rm 15, 5-7
      texto: El Dios que es fuente de esa paciencia y de ese ánimo os conceda tener un mismo sentir entre vosotros según la mente de Cristo Jesús. Así con un mismo corazón y una misma boca daréis gloria al Dios y Padre de nuestro Señor Jesucristo. Por eso acogeos amigablemente unos a otros, como Cristo os acogió para gloria de Dios.
    versiculo:
    - - V
      - El Señor ama a su pueblo.
    - - R
      - Y adorna con la victoria a los humildes.
    oracion: Señor, fuego ardiente de amor eterno, haz que, inflamados en tu amor, te amemos a ti sobre todas las cosas y a nuestro prójimo por amor tuyo. Por Cristo, nuestro Señor.
