# Salterio de Completas: un juego por día. Los salmos se citan por su clave (base/salmos/).
# salmodia_pascua: antífona del Tiempo pascual.
domingo:
  nombre: Después de las II Vísperas de los domingos y solemnidades
  salmodia:
  - ant: Al amparo del Altísimo no temo el espanto nocturno.
    salmos:
    - salmo-90
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-90
  lectura:
    ref: Ap 22, 4-5
    texto: Verán el rostro del Señor, y tendrán su nombre en la frente. Y no habrá más noche, y no necesitarán luz de lámpara ni de sol, porque el Señor Dios alumbrará sobre ellos, y reinarán por los siglos de los siglos.
  oracion: Humildemente te pedimos, Señor, que después de haber celebrado en este día los misterios de la resurrección de tu Hijo, sin temor alguno, descansemos en tu paz, y mañana nos levantemos alegres para cantar nuevamente tus alabanzas. Por Cristo nuestro Señor.
lunes:
  nombre: Lunes
  salmodia:
  - ant: Tú, Señor, eres clemente y rico en misericordia.
    salmos:
    - salmo-85
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-85
  lectura:
    ref: 1Ts 5, 9-10
    texto: Dios nos ha puesto para obtener la salvación por nuestro Señor Jesucristo, que murió por nosotros, para que, velando o durmiendo, vivamos junto con él.
  oracion: Concede, Señor, a nuestros cuerpos fatigados el descanso necesario, y haz que la simiente del reino que con nuestro trabajo hemos sembrado hoy crezca y germine para la cosecha de la vida eterna. Por Cristo nuestro Señor.
martes:
  nombre: Martes
  salmodia:
  - ant: No me escondas tu rostro, ya que confío en ti.
    salmos:
    - salmo-142-1-11
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-142-1-11
  lectura:
    ref: 1Pe 5, 8-9
    texto: 'Sed sobrios, estad despiertos: vuestro enemigo, el diablo, como león rugiente, ronda buscando a quien devorar; resistidle, firmes en la fe.'
  oracion: Ilumina, Señor, nuestra noche y concédenos un descanso tranquilo; que mañana nos levantemos en tu nombre y podamos contemplar, con salud y gozo, el clarear del nuevo día. Por Cristo nuestro Señor.
miercoles:
  nombre: Miércoles
  salmodia:
  - ant: Sé tú, Señor, la roca de mi refugio, un baluarte donde me salve.
    salmos:
    - salmo-30-2-6
  - ant: Desde lo hondo a ti grito, Señor.
    salmos:
    - salmo-129
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-30-2-6
    - salmo-129
  lectura:
    ref: Ef 4, 26-27
    texto: No lleguéis a pecar; que la puesta del sol no os sorprenda en vuestro enojo. No dejéis lugar al diablo.
  oracion: 'Señor Jesucristo, tú que eres manso y humilde de corazón ofreces a los que vienen a ti un yugo llevadero y una carga ligera; dígnate, pues, aceptar los deseos y las acciones del día que hemos terminado: que podamos descansar durante la noche para que así, renovado nuestro cuerpo y nuestro espíritu, perseveremos constantes en tu servicio. Tú que vives y reinas por los siglos de los siglos.'
jueves:
  nombre: Jueves
  salmodia:
  - ant: Mi carne descansa serena.
    salmos:
    - salmo-15
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-15
  lectura:
    ref: 1Ts 5, 23
    texto: Que el mismo Dios de la paz os consagre totalmente y que todo vuestro ser, alma y cuerpo, sea custodiado sin reproche hasta la Parusía de nuestro Señor Jesucristo.
  oracion: Señor, Dios nuestro, concédenos un descanso tranquilo que restaure nuestras fuerzas, desgastadas ahora por el trabajo del día; así, fortalecidos con tu ayuda, te serviremos siempre con todo nuestro cuerpo y nuestro espíritu. Por Cristo nuestro Señor.
viernes:
  nombre: Viernes
  salmodia:
  - ant: Señor, Dios mío, de día te pido auxilio, de noche grito en tu presencia.
    salmos:
    - salmo-87
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-87
  lectura:
    ref: Jr 14, 9
    texto: 'Tú estás en medio de nosotros, Señor, tu nombre ha sido invocado sobre nosotros: no nos abandones, Señor Dios nuestro.'
  oracion: 'Señor, Dios todopoderoso: ya que con nuestro descanso vamos a imitar a tu Hijo que reposó en el sepulcro, te pedimos que, al levantarnos mañana, lo imitemos también resucitando a una vida nueva. Por Cristo nuestro Señor.'
sabado:
  nombre: Después de las I Vísperas de los domingos y solemnidades
  salmodia:
  - ant: Ten piedad de mí, Señor, y escucha mi oración.
    salmos:
    - salmo-4
  - ant: Durante la noche, bendecid al Señor.
    salmos:
    - salmo-133
  salmodia_pascua:
  - ant: Aleluya, aleluya, aleluya.
    salmos:
    - salmo-4
    - salmo-133
  lectura:
    ref: Dt 6, 4-7
    texto: 'Escucha, Israel: El Señor, nuestro Dios, es solamente uno. Amarás al Señor, tu Dios, con todo el corazón, con toda el alma, con todas las fuerzas. Las palabras que hoy te digo quedarán en tu memoria; se las repetirás a tus hijos y hablarás de ellas estando en casa y yendo de camino, acostado y levantado.'
  oracion: Guárdanos, Señor, durante esta noche y haz que mañana, ya al clarear el nuevo día, la celebración del domingo nos llene con la alegría de la resurrección de tu Hijo. Que vive y reina por los siglos de los siglos.
