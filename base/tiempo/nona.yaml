5 de enero, del Tiempo de Navidad:
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Mi 2, 12
    texto: Yo te he de reunir, Jacob; congregaré tus supervivientes, Israel. Los juntaré como ovejas en un redil, como un rebaño en el aprisco.
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Señor Dios, que iniciaste admirablemente la obra de la redención con el nacimiento de tu Hijo, fortalece en nosotros la fe, para que, siguiendo sus enseñanzas, podamos alcanzar la prometida recompensa de la gloria. Por Cristo nuestro Señor.
Epifanía del Señor:
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: Te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.
  lectura:
    ref: Za 2, 11
    texto: Aquel día, se unirán al Señor muchos pueblos, y serán pueblo mío. Habitaré en medio de ti, y comprenderás que el Señor de los ejércitos me ha enviado a ti.
  versiculo:
  - - V
    - Bendecid, pueblos, a nuestro Dios.
  - - R
    - Haced resonar sus alabanzas.
  oracion: Señor, tú que manifestaste a tu Hijo en este día a todas las naciones por medio de una estrella, concédenos, a los que ya te conocemos por la fe, llegar a contemplar, cara a cara, la hermosura infinita de tu gloria. Por Cristo nuestro Señor.
Jueves después de la Epifanía:
  himno: Fundamento de todo lo que existe
  ant: Te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.
  lectura:
