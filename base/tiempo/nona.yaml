Natividad del Señor:
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Hch 10, 36
    texto: 'Dios envió su palabra a los israelitas, anunciando la paz que traería Jesucristo: Jesús es el Señor de todos.'
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Dios nuestro, que de modo admirable creaste al hombre a tu imagen y semejanza y de un modo todavía más admirable elevaste su condición por medio de Jesucristo, concédenos compartir la divinidad de aquel que se ha dignado compartir nuestra humanidad. Por Cristo nuestro Señor.
