    texto: ¡Señor, escucha! ¡Señor, perdona! ¡Señor, atiende y obra! ¡No tardes más, por ti mismo, oh Dios mío, pues tu nombre se invoca sobre tu pueblo!
  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Dios todopoderoso, que nos has mandado preparar el camino para la venida de Cristo, no permitas que desfallezcamos por nuestras debilidades los que esperamos la llegada consoladora del médico celestial. Él, que vive y reina por los siglos de los siglos.
Jueves de la II semana de Adviento:
  himno: Oh Dios, tenaz vigor de toda cosa
