    ref: Is 61, 11
    texto: Como el suelo hecha sus brotes, como un jardín hace brotar sus semillas, así el Señor hará brotar la justicia y los himnos, ante todos los pueblos.
  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Dios nuestro, que te has dignado revelar al mundo el esplendor de tu gloria por medio del parto de la santísima Virgen María, concédenos venerar con fe íntegra y celebrar con sincero rendimiento el gran misterio de la encarnación de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Viernes de la III semana de Adviento:
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: 'María dijo: «¿Qué significa este saludo? Me quedo perpleja ante estas palabras de que daré a luz un Rey sin perder mi virginidad.»'
  lectura:
    ref: Ba 3, 5-6a
    texto: No te acuerdes de las iniquidades de nuestros padres, sino acuérdate de tu mano y de tu nombre en esta hora. Pues eres el Señor, Dios nuestro.
  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Que tu gracia, Señor, nos prepare y nos acompañe siempre a los que esperamos anhelantes la venida de tu Hijo, a fin de que obtengamos los auxilios nicesarios para la vida presente y para llegar con felicidad a la futura. Por Cristo nuestro Señor.
IV Domingo de Adviento (A):
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: 'María dijo: «¿Qué significa este saludo? Me quedo perpleja ante estas palabras de que daré a luz un Rey sin perder mi virginidad.»'
  lectura:
    ref: Cf. 2Ts 1, 6. 7. 10
    texto: Es justo a los ojos de Dios que a vosotros, los atribulados, os pague con descanso eterno, descanso que será en nuestra compañía. Esto sucederá el día de la revelación de Jesús, el Señor, cuando venga del cielo con los ángeles ejecutadores de su poder, cuando venga aquel día para ser glorificado en sus santos y para ser la admiración de los que han tenido fe.
  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Señor, derrama tu gracia sobre nosotros, que hemos conocido por el anuncio del ángel la encarnación de tu Hijo, para que lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por Cristo nuestro Señor.
IV Domingo de Adviento (B):
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: 'María dijo: «¿Qué significa este saludo? Me quedo perpleja ante estas palabras de que daré a luz un Rey sin perder mi virginidad.»'
  lectura:
    ref: Is 61, 11
    texto: Como el suelo hecha sus brotes, como un jardín hace brotar sus semillas, así el Señor hará brotar la justicia y los himnos, ante todos los pueblos.
  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Jesús, Señor nuestro, ven pronto, no tardes más, para que se reanimen con tu venida los que confían en tu amor. Tú que vives y reinas por los siglos de los siglos.
