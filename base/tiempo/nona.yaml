  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso y eterno, que por el nuevo nacimiento del bautismo has infundido en nosotros la vida eterna, concédenos alcanzar la plenitud de la gloria a los que, por la justificación, has hecho capaces de llegar a la inmortalidad. Por Cristo nuestro Señor.
