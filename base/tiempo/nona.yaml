XXIX Domingo del Tiempo Ordinario (B):
  himno: Danos, Señor, la firme voluntad
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por Cristo nuestro Señor.
XXIX Domingo del Tiempo Ordinario (C):
  himno: Danos, Señor, la firme voluntad
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por Cristo nuestro Señor.
XXX Domingo del Tiempo Ordinario (A):
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por Cristo nuestro Señor.
XXX Domingo del Tiempo Ordinario (B):
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por Cristo nuestro Señor.
XXX Domingo del Tiempo Ordinario (C):
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por Cristo nuestro Señor.
XXXI Domingo del Tiempo Ordinario (A):
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
XXXI Domingo del Tiempo Ordinario (B):
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
