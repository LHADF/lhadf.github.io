II Domingo del Tiempo Ordinario (A):
  oracion: Dios todopoderoso y eterno, que gobiernas a un tiempo cielo y tierra, escucha paternalmente las súplicas de tu pueblo y haz que los días de nuestra vida transcurran en tu paz. Por Cristo nuestro Señor.
II Domingo del Tiempo Ordinario (B):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Dios todopoderoso y eterno, que gobiernas a un tiempo cielo y tierra, escucha paternalmente las súplicas de tu pueblo y haz que los días de nuestra vida transcurran en tu paz. Por Cristo nuestro Señor.
