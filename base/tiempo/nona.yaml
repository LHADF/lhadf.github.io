  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios omnipotente y misericordioso, te pedimos que nos envíes al Espíritu Santo para que habite en nosotros y nos transforme en templos de su gloria. Por Cristo nuestro Señor.
Miércoles de la VII semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Ef 4, 23-24
    texto: 'Renovaos en la mente y en el espíritu y vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios misericordioso, concede a tu Iglesia, congregada por el Espíritu Santo, que se entregue plenamente a ti y que viva siempre unificada por el amor, según tú se lo has mandado. Por Cristo nuestro Señor.
Jueves de la VII semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Col 1, 12-14
    texto: Damos gracias a Dios Padre, que nos ha hecho capaces de compartir la herencia del pueblo santo en la luz. Él nos ha sacado del dominio de las tinieblas, y nos ha trasladado al reino de su Hijo querido, por cuya sangre hemos recibido la redención, el perdón de los pecados.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Tu Espíritu, Señor, infunda en nosotros la fuerza de sus dones, para que nuestros pensamientos te sean gratos y nuestra voluntad esté siempre sometida a la tuya. Por Cristo nuestro Señor.
Viernes de la VII semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Co 5, 7-8
    texto: Tirad fuera la levadura vieja para que seáis una masa nueva, ya que ahora sois panes ázimos, pues Cristo, nuestro cordero pascual, ha sido inmolado. Así, pues, celebremos nuestra fiesta no con la vieja levadura ni con levadura de malicia y perversidad, sino con los panes ázimos de pureza y verdad.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, que nos has abierto las puertas de la eternidad con la glorificación de tu Hijo Jesucristo y con la venida del Espíritu Santo, concédenos que, por la recepción de dones tan grandes, nuestra fe vaya más y más en aumento y nuestra entrega a ti sea cada día más completa. Por Cristo nuestro Señor.
Lunes de la V semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Tm 2, 8. 11
    texto: 'Acuérdate de Cristo Jesús, del linaje de David, que vive resucitado de entre los muertos, como enseño en mi mensaje de salud. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor Dios, que unes en un mismo sentir los corazones de los que te aman, impulsa a tu pueblo a amar lo que pides y a desear lo que prometes, para que, en medio de la inestabilidad de las cosas humanas, estén firmemente anclados nuestros corazones en el deseo de la verdadera felicidad. Por Cristo nuestro Señor.
Domingo de Pentecostés (A):
  himno: Salvador del mundo
  ant: No seréis vosotros los que habléis, el Espíritu de vuestro Padre hablará por vosotros. Aleluia.
  lectura:
    ref: 2Co 1, 21-22
    texto: Dios es quien nos confirma en Cristo a nosotros junto con vosotros. Él nos ha ungido, él nos ha sellado, y ha puesto en nuestros corazones, como prenda suya, el Espíritu.
  versiculo:
  - - V
    - Los apóstoles hablaban en otras lenguas. Aleluia.
  - - R
    - Las grandezas de Dios. Aleluia.
  oracion: Dios todopoderoso, haz brillar sobre nosotros el resplandor de tu gloria, para que la claridad de tu luz fortalezca con la gracia del Espíritu Santo a los que, por tu bondad, hemos recibido en el bautismo una vida nueva. Por Cristo nuestro Señor.
