III Domingo del Tiempo Ordinario (A):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Dios todopoderoso y eterno, dirige nuestras acciones según tu voluntad, para que, invocando el nombre de tu Hijo, abundemos en buenas obras. Por Cristo nuestro Señor.
III Domingo del Tiempo Ordinario (B):
  oracion: Dios todopoderoso y eterno, dirige nuestras acciones según tu voluntad, para que, invocando el nombre de tu Hijo, abundemos en buenas obras. Por Cristo nuestro Señor.
III Domingo del Tiempo Ordinario (C):
  oracion: Dios todopoderoso y eterno, dirige nuestras acciones según tu voluntad, para que, invocando el nombre de tu Hijo, abundemos en buenas obras. Por Cristo nuestro Señor.
IV Domingo del Tiempo Ordinario (A):
  oracion: Concédenos, Señor, Dios nuestro, venerarte con toda el alma y amar a todos los hombres con afecto espiritual. Por Cristo nuestro Señor.
IV Domingo del Tiempo Ordinario (B):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Concédenos, Señor, Dios nuestro, venerarte con toda el alma y amar a todos los hombres con afecto espiritual. Por Cristo nuestro Señor.
IV Domingo del Tiempo Ordinario (C):
  oracion: Concédenos, Señor, Dios nuestro, venerarte con toda el alma y amar a todos los hombres con afecto espiritual. Por Cristo nuestro Señor.
V Domingo del Tiempo Ordinario (A):
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por Cristo nuestro Señor.
V Domingo del Tiempo Ordinario (B):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por Cristo nuestro Señor.
V Domingo del Tiempo Ordinario (C):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por Cristo nuestro Señor.
Miércoles de Ceniza:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Dn 4, 24b
    texto: Rompe tus pecados con obras de justicia y tus iniquidades con misericordia para con los pobres, para que tu ventura sea larga.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: 'Al empezar esta Cuaresma, te pedimos, Señor, que nos des un verdadero espíritu de conversión: así la austeridad de la penitencia de estos días nos servirá de ayuda en nuestra lucha contra el espíritu del mal. Por Cristo nuestro Señor.'
Jueves después de Ceniza:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Hb 10, 35-36
    texto: No perdáis vuestra confianza. Ella lleva en sí una gran recompensa. Tenéis necesidad de constancia, para que, cumpliendo la voluntad de Dios, podáis alcanzar la promesa.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Tu gracia, Señor, inspire nuestras acciones, las sostenga y acompañe, para que todo nuestro trabajo cuaresmal brote de ti, como una fuente, y a ti tienda, como a su fin. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (A):
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (B):
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (C):
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
Viernes después de Ceniza:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: St 1, 27
    texto: 'La religión pura y sin mancha ante Dios, nuestro Padre, consiste en esto: en visitar a los huérfanos y a las viudas en su aflicción, y en conservarse limpio de toda mancha en este mundo.'
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Te pedimos, Señor, que nos ayudes a continuar animosos estos días de penitencia que acabamos de empezar y que nuestras prácticas externas de penitencia estén siempre acompañadas por la sinceridad de un corazón que desea convertirse. Por Cristo nuestro Señor.
Sábado después de Ceniza:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Ga 6, 7b-8
    texto: De Dios nadie se burla. Lo que cada uno siembre, eso cosechará. El que siembre en su carne, de la carne cosechará corrupción; el que siembre en el Espíritu, del Espíritu cosechará vida eterna.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Dios todopoderoso y eterno, mira compasivo nuestra debilidad y extiende sobre nosotros tu mano para protegernos. Por Cristo nuestro Señor.
I Domingo de Cuaresma (A):
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Dt 4, 29. 31
    texto: Buscarás al Señor, tu Dios, y, si lo buscas con todo el corazón y con toda el alma, lo encontrarás. Al cabo de los años, cuando te cerquen y alcancen todas estas maldiciones, te convertirás al Señor, tu Dios, y escucharás su voz; porque el Señor, tu Dios, es un Dios compasivo; no te dejará ni te destruirá, ni se olvidará de la alianza que con juramento ofreció a vuestros padres.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: 'Te pedimos, Señor todopoderoso, que las celebraciones y las penitencias de esta Cuaresma nos ayuden a progresar en el camino de nuestra conversión: así conoceremos mejor y viviremos con mayor plenitud las riquezas inagotables del misterio de Cristo. Él, que vive y reina por los siglos de los siglos.'
