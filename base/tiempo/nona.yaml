  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Mueve, Señor, nuestros corazones para que se adhieran siempre a obrar el bien; que, tendiendo sin desfallecer hacia lo mejor, alcancemos vivir también en la eternidad los bienes del misterio pascual. Por Cristo nuestro Señor.
VII Domingo de Pascua (A):
  himno: Reina el Señor allí donde ninguno
  ant: Levantando las manos, les dio su bendición y fue elevándose al cielo. Aleluia.
  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Ensalzad al Rey de reyes. Aleluia.
  - - R
    - Cantad un himno a Dios. Aleluia.
  oracion: Concédenos, Señor, rebosar de alegría al celebrar la gloriosa ascensión de tu Hijo, y elevar a ti una cumplida acción de gracias, pues el triunfo de Cristo es ya nuestra victoria y, ya que él es la cabeza de la Iglesia, haz que nosotros, que somos su cuerpo, nos sintamos atraídos por una irresistible esperanza hacia donde él nos precedió. Por Cristo nuestro Señor.
