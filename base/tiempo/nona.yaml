Lunes de la Octava de Pascua:
  himno: Salvador del mundo
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: 2Tm 2, 8.11
    texto: 'Acuérdate de Cristo Jesús, del linaje de David, que vive resucitado de entre los muertos, como enseño en mi mensaje de salud. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él.'
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que haces crecer a tu Iglesia dándole continuamente nuevos hijos por el bautismo, concédenos ser siempre fieles en nuestra vida a la fe que en ese sacramento hemos recibido. Por Cristo nuestro Señor.
Martes de la Octava de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Señor Dios, que nos has proporcionado el remedio de nuestros males por el misterio pascual, colma a tu pueblo de tus dones celestiales, para que alcance la perfecta libertad y llegue a gozar plenamente en el cielo de la alegría que ya ha comenzado a gustar en la tierra. Por Cristo nuestro Señor.
Miércoles de la Octava de Pascua:
  himno: Salvador del mundo
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: Cf. Ef 4, 23-24
    texto: 'Renovaos en la mente y en el espíritu y vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que todos los años nos alegras con la solemnidad de la resurrección del Señor, concédenos que la celebración de estas fiestas aquí en la tierra nos lleve a gozar de la eterna alegría en el cielo. Por Cristo nuestro Señor.
Jueves de la Octava de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: Cf. Col 1, 12-14
    texto: Damos gracias a Dios Padre, que nos ha hecho capaces de compartir la herencia del pueblo santo en la luz. Él nos ha sacado del dominio de las tinieblas, y nos ha trasladado al reino de su Hijo querido, por cuya sangre hemos recibido la redención, el perdón de los pecados.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Oh Dios, que has reunido a pueblos diversos en la confesión de tu nombre, concede a los que han renacido en la fuente bautismal una misma fe en su espíritu y una misma caridad en sus vidas. Por Cristo nuestro Señor.
Viernes de la Octava de Pascua:
  himno: Salvador del mundo
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: 1Co 5, 7-8
    texto: Tirad fuera la levadura vieja para que seáis una masa nueva, ya que ahora sois panes ázimos, pues Cristo, nuestro cordero pascual, ha sido inmolado. Así, pues, celebremos nuestra fiesta no con la vieja levadura ni con levadura de malicia y perversidad, sino con los panes ázimos de pureza y verdad.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios todopoderoso y eterno, que por el misterio pascual restableciste tu alianza con los hombres, concédenos realizar en nuestra vida lo que en estas fiestas proclama nuestra fe. Por Cristo nuestro Señor.
Sábado de la Octava de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: 2Co 5, 14-15
    texto: El amor de Cristo nos apremia, al pensar que, si uno murió por todos, consiguientemente todos murieron en él; y murió por todos, para que los que viven no vivan ya para sí, sino para aquél que murió y resucitó por ellos.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que con la abundancia de tu gracia no cesas de aumentar en todos los pueblos el número de tus hijos, mira con amor a tus elegidos que han nacido a una nueva vida por el sacramento del bautismo y concédeles alcanzar una dichosa inmortalidad. Por Cristo nuestro Señor.
II Domingo de Pascua (de la Divina Misericordia) (A):
  himno: Salvador del mundo
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: Rm 6, 4
    texto: Por nuestro bautismo fuimos sepultados con Cristo, para participar de su muerte; para que, así como Cristo fue resucitado de entre los muertos por la gloria del Padre, así también nosotros vivamos una vida nueva.
  versiculo:
  - - V
    - Este es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Señor Dios, cuya misericordia es eterna, tú que reanimas la fe de tu pueblo con la celebración anual de las fiestas pascuales, aumenta en nosotros los dones de tu gracia, para que comprendamos mejor la excelencia del bautismo que nos ha purificado, la grandeza del Espíritu que nos ha reengendrado y el precio de la sangre que nos ha redimido. Por Cristo nuestro Señor.
