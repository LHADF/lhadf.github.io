  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Dios todopoderoso, haz que Cristo, el resplandor de tu gloria, nazca en nuestros corazones, para que, por su venida, nos veamos libres de toda oscuridad y seamos transformados en hijos de la luz. Por Cristo nuestro Señor.
Viernes de la II semana de Adviento:
  ant: 'María dijo: «¿Qué significa este saludo? Me quedo perpleja ante estas palabras de que daré a luz un Rey sin perder mi virginidad.»'
  lectura:
    ref: Ba 3, 5-6a
    texto: No te acuerdes de las iniquidades de nuestros padres, sino acuérdate de tu mano y de tu nombre en esta hora. Pues eres el Señor, Dios nuestro.
  versiculo:
  - - V
    - Ven, Señor, y no tardes.
  - - R
    - Perdona los pecados de tu pueblo.
  oracion: Dios todopoderoso, concede a tu pueblo permanecer siempre en vela aguardando la venida de tu Hijo, para que cumpliendo lo que el mismo autor de nuestra salvación nos enseñó, podamos salir a su encuentro con nuestras lámparas encendidas. Por Cristo nuestro Señor.
III Domingo de Adviento «Gaudete» (A):
