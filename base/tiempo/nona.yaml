    texto: 'La religión pura y sin mancha ante Dios, nuestro Padre, consiste en esto: en visitar a los huérfanos y a las viudas en su aflicción, y en conservarse limpio de toda mancha en este mundo.'
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Infunde, Señor, tu gracia en nuestros corazones, para que sepamos refrenar nuestros excesos mundanos y seguir fielmente las inspiraciones que nos vienen de ti. Por Cristo nuestro Señor.
Sábado de la III semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Ga 6, 7b-8
    texto: De Dios nadie se burla. Lo que cada uno siembre, eso cosechará. El que siembre en su carne, de la carne cosechará corrupción; el que siembre en el Espíritu, del Espíritu cosechará vida eterna.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, danos la gracia de celebrar esta Cuaresma con alegría y de penetrar a fondo el verdadero sentido del misterio pascual, para que podamos alcanzar plenamente su eficacia. Por Cristo nuestro Señor.
IV Domingo de Cuaresma «Lætare» (A):
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Dt 4, 29. 31
    texto: Buscarás al Señor, tu Dios, y, si lo buscas con todo el corazón y con toda el alma, lo encontrarás. Al cabo de los años, cuando te cerquen y alcancen todas estas maldiciones, te convertirás al Señor, tu Dios, y escucharás su voz; porque el Señor, tu Dios, es un Dios compasivo; no te dejará ni te destruirá, ni se olvidará de la alianza que con juramento ofreció a vuestros padres.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor Dios, que por tu Palabra hecha carne has reconciliado contigo admirablemente al género humano, haz que el pueblo cristiano se apreste a celebrar las próximas fiestas pascuales con una fe viva y con una entrega generosa. Por Cristo nuestro Señor.
