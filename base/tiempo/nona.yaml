Lunes de la I semana de Cuaresma:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Is 58, 6a. 7
    texto: 'El ayuno que yo quiero es éste: Partir tu pan con el hambriento, hospedar a los pobres sin techo, vestir al que ves desnudo, y no cerrarte a tu propia carne.'
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Conviértenos a ti, Dios salvador nuestro, y ayúdanos a progresar en el conocimiento de tu palabra, para que así la celebración de esta Cuaresma dé en nosotros fruto abundante. Por Cristo nuestro Señor.
Martes de la I semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Is 58, 1-2a
    texto: Grita a voz en cuello, sin cejar, alza la voz como una trompeta, denuncia a mi pueblo sus delitos, a la casa de Jacob sus pecados. Consultan mi oráculo a diario, muestran afan de saber mis caminos, como si fueran un pueblo que practicara la justicia y no hubiesen abandonado los preceptos de Dios.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, mira con amor a tu pueblo, que trata de purificar su espíritu en estos días cuaresmales con la moderación en el uso de las cosas terrenas, y haz que esta sobriedad alimente en él el deseo de poseerte. Por Cristo nuestro Señor.
Miércoles de la I semana de Cuaresma:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Dn 4, 24b
    texto: Rompe tus pecados con obras de justicia y tus iniquidades con misericordia para con los pobres, para que tu ventura sea larga.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, mira complacido a tu pueblo, que con fervor desea entregarse a una vida santa, y, ya que con sus privaciones se esfuerza por dominar el cuerpo, que la práctica de las buenas obras transforme su alma. Por Cristo nuestro Señor.
Jueves de la I semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Hb 10, 35-36
    texto: No perdáis vuestra confianza. Ella lleva en sí una gran recompensa. Tenéis necesidad de constancia, para que, cumpliendo la voluntad de Dios, podáis alcanzar la promesa.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, haz que nos inclinemos siempre a pensar con rectitud y a practicar el bien con diligencia y, puesto que no podemos existir sin ti, concédenos vivir siempre según tu voluntad. Por Cristo nuestro Señor.
VII Domingo del Tiempo Ordinario (A):
  oracion: Concédenos, Dios todopoderoso, que la constante meditación de tu doctrina nos impulse a hablar y a actuar siempre según tu voluntad. Por Cristo nuestro Señor.
VII Domingo del Tiempo Ordinario (C):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Concédenos, Dios todopoderoso, que la constante meditación de tu doctrina nos impulse a hablar y a actuar siempre según tu voluntad. Por Cristo nuestro Señor.
Viernes de la I semana de Cuaresma:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: St 1, 27
    texto: 'La religión pura y sin mancha ante Dios, nuestro Padre, consiste en esto: en visitar a los huérfanos y a las viudas en su aflicción, y en conservarse limpio de toda mancha en este mundo.'
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, haz que tu pueblo vaya penetrando debidamente el sentido de la Cuaresma y se prepare así a las fiestas pascuales, para que la penitencia corporal, propia de este tiempo, sirva para la renovación espiritual de todos tus fieles. Por Cristo nuestro Señor.
