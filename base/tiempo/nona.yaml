Lunes de la V semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Jr 31, 2. 3b-4a
    texto: 'Así dice el Señor: «Halló gracia en el desierto el pueblo escapado de la espada; camina a su descanso. Con amor eterno te amé, por eso prolongué mi misericordia. Volveré a construirte y serás reconstruida, Virgen de Israel.»'
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, Dios nuestro, que por el amor inefable que nos tienes nos enriqueces con toda clase de bendiciones, concédenos pasar de nuestras antiguas faltas a una vida nueva, para prepararnos convenientemente a la gloria del reino celestial. Por Cristo nuestro Señor.
Martes de la V semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: 1Co 1, 25-27a
    texto: Lo necio de Dios es más sabio que los hombres; y lo débil de Dios es más fuerte que los hombres. Lo necio del mundo lo ha escogido Dios para confundir a los sabios.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Concédenos, Señor, ser perseverantes en el fiel cumplimiento de tu voluntad, para que en nuestros días crezca tu pueblo no sólo en número, sino también en santidad. Por Cristo nuestro Señor.
Miércoles de la V semana de Cuaresma:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Hb 9, 28
    texto: Cristo, después de haberse ofrecido una sola vez para quitar los pecados de las multitudes, aparecerá por segunda vez, sin relación ya con el pecado, para dar la salvación a los que lo esperan.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Dios misericordioso, ilumina los corazones de tus hijos que tratan de purificarse por la penitencia de la Cuaresma y, ya que nos infundes el deseo de servirte con amor, dígnate escuchar paternalmente nuestras súplicas. Por Cristo nuestro Señor.
Jueves de la V semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Hb 9, 11-12
    texto: Cristo se presentó como sumo sacerdote de los bienes futuros y entró de una vez para siempre en el santuario. Entró a través de una Tienda de Reunión más sublime y perfecta, no fabricada por mano de hombre, es decir, no perteneciente a este mundo. Y entró no con sangre de machos cabríos ni de novillos, sino con su propia sangre, obteniendo para nosotros una redención eterna.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Señor, atiende a nuestras súplicas y concédenos tu protección, ya que hemos puesto toda nuestra esperanza en tu misericordia; purifícanos de toda mancha de pecado y haz que nos mantengamos en una vida santa, para que lleguemos a recibir la herencia que nos tienes prometida. Por Cristo nuestro Señor.
Viernes de la V semana de Cuaresma:
  himno: Ojos de aquel publicano
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: Is 53, 6-7
    texto: 'Todos errábamos como ovejas, cada uno siguiendo su camino; y el Señor cargó sobre él todos nuestros crímenes. Maltratado, voluntariamente se humillaba y no abría la boca: como cordero llevado al matadero, como oveja ante el esquilador, enmudecía y no abría la boca.'
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Perdona, Señor, las culpas que hemos cometido a causa de nuestra debilidad y, por tu misericordia, líbranos de la esclavitud en que nos tienen cautivos nuestros pecados. Por Cristo nuestro Señor.
Domingo de Ramos en la Pasión del Señor (A):
  himno: Ojos de aquel publicano
  ant: Para mí la vida es Cristo, y la muerte una ganancia; líbreme Dios de gloriarme si no es en la cruz de nuestro Señor Jesucristo.
  lectura:
    ref: 1Pe 5, 10-11
    texto: Tras un breve padecer, el Dios de toda gracia, que os ha llamado a su eterna gloria en Cristo Jesús, él mismo os restablecerá, os afianzará, os robustecerá. A él la gloria y el poder, por los siglos de los siglos. Amén.
  versiculo:
  - - V
    - Adoremos el signo de la cruz.
  - - R
    - Por el que recibimos la salvación.
  oracion: Dios todopoderoso y eterno, que quisiste que nuestro Salvador se anonadase, haciéndose hombre y muriendo en la cruz, para que todos nosotros imitáramos su ejemplo de humildad, concédenos seguir las enseñanzas de su pasión, para que un día participemos en su resurrección gloriosa. Por Cristo nuestro Señor.
