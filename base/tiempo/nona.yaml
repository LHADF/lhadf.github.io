Lunes de la III semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Tm 2, 8. 11
    texto: 'Acuérdate de Cristo Jesús, del linaje de David, que vive resucitado de entre los muertos, como enseño en mi mensaje de salud. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor Dios, que muestras la luz de tu verdad a los que andan extraviados, para que puedan volver al camino recto, concede a todos los cristianos que se aparten de todo lo que sea indigno de ese nombre que llevan, y que cumplan lo que ese nombre significa. Por Cristo nuestro Señor.
Martes de la III semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor, tú que abres las puertas del reino celestial a los que han renacido por el agua y por el Espíritu Santo, acrecienta en tus hijos la gracia que les has dado, para que no se vean privados de tus promesas los que han sido ya purificados de sus culpas. Por Cristo nuestro Señor.
Miércoles de la III semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Ef 4, 23-24
    texto: 'Renovaos en la mente y en el espíritu y vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Protege, Señor, a tu pueblo y, ya que le has dado la gracia de la fe, concédele la participación eterna en la resurrección de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Jueves de la III semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Col 1, 12-14
    texto: Damos gracias a Dios Padre, que nos ha hecho capaces de compartir la herencia del pueblo santo en la luz. Él nos ha sacado del dominio de las tinieblas, y nos ha trasladado al reino de su Hijo querido, por cuya sangre hemos recibido la redención, el perdón de los pecados.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso y eterno, que en estos días de Pascua nos has revelado con más plenitud la grandeza de tu amor, concédenos, ya que nos has librado de las tinieblas del error, que nos adhiramos más firmemente a tus enseñanzas. Por Cristo nuestro Señor.
Viernes de la III semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Co 5, 7-8
    texto: Tirad fuera la levadura vieja para que seáis una masa nueva, ya que ahora sois panes ázimos, pues Cristo, nuestro cordero pascual, ha sido inmolado. Así, pues, celebremos nuestra fiesta no con la vieja levadura ni con levadura de malicia y perversidad, sino con los panes ázimos de pureza y verdad.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor, ya que nos has dado a conocer los dones que nos trae la resurrección de tu Hijo, concédenos también que el Espíritu Santo, el Amor increado, nos haga resucitar a una nueva vida. Por Cristo nuestro Señor.
Sábado de la III semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Co 5, 14-15
    texto: El amor de Cristo nos apremia, al pensar que, si uno murió por todos, consiguientemente todos murieron en él; y murió por todos, para que los que viven no vivan ya para sí, sino para aquel que murió y resucitó por ellos.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, que en la fuente bautismal has infundido una vida nueva a los que creen en ti, defiende con tu protección a los que han renacido en Cristo, para que venzan las insidias del mal y conserven los dones que de ti han recibido. Por Cristo nuestro Señor.
IV Domingo de Pascua (A):
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Rm 6, 4
    texto: Por nuestro bautismo fuimos sepultados con Cristo, para participar de su muerte; para que, así como Cristo fue resucitado de entre los muertos por la gloria del Padre, así también nosotros vivamos una vida nueva.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso y eterno, que has dado a tu Iglesia el gozo inmenso de la resurrección de Jesucristo, te pedimos que nos lleves a gozar de las alegrías celestiales, para que así llegue también el humilde rebaño hasta donde penetró su victorioso Pastor. Él, que vive y reina por los siglos de los siglos.
