Martes de la II semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso, haz que sepamos anunciar al mundo la victoria de Cristo resucitado y, ya que nos has dado la prenda de su obra redentora, concédenos llegar a poseer plenamente los dones prometidos. Por Cristo nuestro Señor.
Miércoles de la II semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Ef 4, 23-24
    texto: 'Renovaos en la mente y en el espíritu y vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor, al renovar en este año el recuerdo del misterio pascual, que restituyó a la naturaleza humana en su primitiva dignidad y le trajo la esperanza de la resurrección, te pedimos que nos enseñes a recibir con un amor constante y fiel este misterio que con fe celebramos. Por Cristo nuestro Señor.
Sábado de la V semana de Cuaresma:
  himno: Cada tarde se nos van los días
  ant: Acreditémonos ante Dios por nuestra constancia en las tribulaciones, por nuestra sed de ser justos.
  lectura:
    ref: 1Jn 2, 8b-10
    texto: Las tinieblas van pasando y ya brilla la luz verdadera. Quien dice que está en la luz y aborrece a su hermano está todavía en las tinieblas. Quien ama a su hermano está siempre en la luz; y no hay ocasión de ruina en él.
  versiculo:
  - - V
    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Dios nuestro, aunque continuamente realizas la salvación de los hombres, sin embargo, concedes a tu pueblo gracias más abundantes en este tiempo de Cuaresma; dígnate, pues, mirar con amor el esfuerzo cuaresmal de tus elegidos y concede tu ayuda tanto a los catecúmenos que van a recibir el bautismo como a tus hijos que ya lo hemos recibido. Por Cristo nuestro Señor.
Viernes de la II semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Co 5, 7-8
    texto: Tirad fuera la levadura vieja para que seáis una masa nueva, ya que ahora sois panes ázimos, pues Cristo, nuestro cordero pascual, ha sido inmolado. Así, pues, celebremos nuestra fiesta no con la vieja levadura ni con levadura de malicia y perversidad, sino con los panes ázimos de pureza y verdad.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, que quisiste que tu Hijo muriera en el patíbulo de la cruz para librarnos del poder del enemigo, te pedimos nos concedas alcanzar la gracia de la resurrección. Por Cristo nuestro Señor.
Sábado de la II semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Co 5, 14-15
    texto: El amor de Cristo nos apremia, al pensar que, si uno murió por todos, consiguientemente todos murieron en él; y murió por todos, para que los que viven no vivan ya para sí, sino para aquel que murió y resucitó por ellos.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por Cristo nuestro Señor.
III Domingo de Pascua (A):
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Rm 6, 4
    texto: Por nuestro bautismo fuimos sepultados con Cristo, para participar de su muerte; para que, así como Cristo fue resucitado de entre los muertos por la gloria del Padre, así también nosotros vivamos una vida nueva.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor, que tu pueblo se regocije siempre al verse renovado y rejuvenecido por la resurrección de Jesucristo, y que la alegría de haber recobrado la dignidad de la adopción filial le dé la firme esperanza de resucitar gloriosamente como Jesucristo. Él, que vive y reina por los siglos de los siglos.
III Domingo de Pascua (B):
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
