Miércoles después de la Epifanía:
  himno: Fundamento de todo lo que existe
  ant: Te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.
  lectura:
    ref: 1Jn 1, 5
    texto: 'El mensaje que de él hemos recibido y os transmitimos es éste: Dios es luz, y en él no hay tiniebla alguna.'
  versiculo:
  - - V
    - Bendecid, pueblos, a nuestro Dios.
  - - R
    - Haced resonar sus alabanzas.
  oracion: Señor, Dios nuestro, luz radiante de todas las naciones, concede una paz estable a todos los pueblos de la tierra, y haz que aquella luz resplandeciente, que condujo a los magos al conocimiento de tu Hijo, ilumine también nuestros corazones. Por Cristo nuestro Señor.
