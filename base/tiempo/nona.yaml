    - Mi sacrificio es un espíritu contrito.
  - - R
    - Un corazón quebrantado y humillado tú no lo desprecias.
  oracion: Padre eterno, convierte hacia ti nuestros corazones, para que, viviendo consagrados a tu servicio, te busquemos siempre a ti, que eres lo único necesario, y practiquemos la caridad en todas nuestras acciones. Por Cristo nuestro Señor.
