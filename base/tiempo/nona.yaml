  himno: Danos, Señor, la firme voluntad
  oracion: Dios todopoderoso y eterno, que con la magnificencia de tu amor sobrepasas los méritos y aun los deseos de los que te suplican, derrama sobre nosotros tu misericordia, para que libres nuestra conciencia de toda inquietud y nos concedas aun aquello que no nos atrevemos a pedir. Por Cristo nuestro Señor.
