Día V de la Octava de la Natividad:
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Hch 10, 36
    texto: 'Dios envió su palabra a los israelitas, anunciando la paz que traería Jesucristo: Jesús es el Señor de todos.'
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Dios todopoderoso, Dios invisible, que con la venida de tu Hijo has disipado las tinieblas del mundo, míranos con amor y ayúdanos a celebrar con nuestros cantos y alabanzas la gloria del nacimiento de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Día VI de la Octava de la Natividad:
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Cf. Tb 14, 6-7
    texto: Todas las naciones de la tierra se convertirán y temerán a Dios sinceramente; arrojarán los ídolos y bendecirán como es justo al Dios de los siglos. Todos los israelitas que se salven aquellos días, acordándose sinceramente de Dios, se reunirán e irán a Jerusalén. Los que aman sinceramente al Señor se alegrarán.
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Concédenos, Dios todopoderoso, que el nacimiento de tu Hijo en nuestra carne mortal nos libre de la antigua servidumbre del pecado que pesa aún sobre nosotros. Por Cristo nuestro Señor.
Día VII de la Octava de la Natividad:
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Is 65, 1
    texto: 'Ofrecí una respuesta a los que no me preguntaban, me dejé encontrar de quienes no me buscaban; y dije: «Aquí estoy, aquí estoy», a un pueblo que no invocaba mi nombre.'
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Dios todopoderoso y eterno, que en el nacimiento de tu Hijo nos has dado la fuente y la cumbre de toda religión, concédenos contarnos siempre en el rebaño de aquel en quien está la salvación de todo el género humano. Por Cristo nuestro Señor.
2 de enero, del Tiempo de Navidad:
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Za 8, 7-8
    texto: Yo libertaré a mi pueblo del país de oriente y del país de occidente, y los traeré para que habiten en medio de Jerusalén. Ellos serán mi pueblo y yo seré su Dios con verdad y con justicia.
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Te pedimos, Dios todopoderoso, que tu Salvador, que has enviado del cielo como una luz nueva para redimir al mundo, nazca también en nuestros corazones y los renueve continuamente. Por Cristo nuestro Señor.
3 de enero, del Tiempo de Navidad:
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Is 60, 4-5
    texto: Tus hijos, Jerusalén, llegan de lejos, a tus hijas las traen en brazos. Cuando esto veas, te pondrás radiante de alegría; se estremecerá y se ensanchará tu corazón, pues se volcarán sobre ti los tesoros del mar, vendrán a ti las riquezas de las naciones.
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Dios nuestro, que quisiste que en el parto de la santísima Virgen María la carne de tu Hijo no quedara sometida a la antigua sentencia dada al género humano, concédenos, ya que por el nacimiento de Cristo hemos entrado a participar de esta renovación de la creatura, que nos veamos libres del contagio de la antigua condición. Por Cristo nuestro Señor.
