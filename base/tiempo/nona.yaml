    - Perdona los pecados de tu pueblo.
  oracion: Señor, despierta en nuestros corazones el deseo de preparar la venida de tu Hijo, para que, cuando venga, podamos servirte libres de toda mancha. Por Cristo nuestro Señor.
Sábado de la II semana de Adviento:
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: 'María dijo: «¿Qué significa este saludo? Me quedo perpleja ante estas palabras de que daré a luz un Rey sin perder mi virginidad.»'
  lectura:
    ref: Is 61, 11
