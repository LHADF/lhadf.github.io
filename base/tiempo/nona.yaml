Martes de la V semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, que por la resurrección de Cristo nos restituyes el derecho de entrar en la vida eterna, fortifica la fe y la esperanza de tu pueblo, para que esperemos siempre confiadamente la realización de todo aquello que nos tienes prometido. Por Cristo nuestro Señor.
Miércoles de la V semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Ef 4, 23-24
    texto: 'Renovaos en la mente y en el espíritu y vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, que amas la inocencia y la restituyes a quien la ha perdido, dirige hacia ti los corazones de tus hijos, para que vivan siempre a la luz de la verdad los que han sido librados por ti de las tinieblas del error. Por Cristo nuestro Señor.
Jueves de la V semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Col 1, 12-14
    texto: Damos gracias a Dios Padre, que nos ha hecho capaces de compartir la herencia del pueblo santo en la luz. Él nos ha sacado del dominio de las tinieblas, y nos ha trasladado al reino de su Hijo querido, por cuya sangre hemos recibido la redención, el perdón de los pecados.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, cuya gracia nos transforma de culpables en justos, de infelices en dichosos, no dejes de favorecernos con la acción de tu gracia y con tus dones, y concédenos a los que hemos alcanzado ya la justificación por la fe la fuerza necesaria para perseverar siempre en ella. Por Cristo nuestro Señor.
Sábado de la V semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Co 5, 14-15
