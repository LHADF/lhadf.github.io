    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor, haz que tu pueblo viva siempre en la alegría al ver renovada la juventud de su espíritu, y que el gozo de haber recobrado la dignidad de la adopción divina le dé la firme esperanza de resucitar un día a la verdadera felicidad. Por Cristo nuestro Señor.
X Domingo del Tiempo Ordinario (A):
  himno: Oh Jesús, que en tu cruz has demostrado
  oracion: Dios nuestro, de quien todo bien procede, concédenos seguir siempre tus inspiraciones, para que tratemos de hacer continuamente lo que es recto y, con tu ayuda, lo llevemos siempre a cabo. Por Cristo nuestro Señor.
