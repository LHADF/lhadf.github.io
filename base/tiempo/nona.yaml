Viernes Santo de la Pasión del Señor:
  himno: Cruz de Cristo
  ant: 'A media tarde, Jesús gritó: «Dios mío, Dios mío, ¿por qué me has abandonado?»'
  lectura:
    ref: Is 53, 6-7
    texto: 'Todos errábamos como ovejas, cada uno siguiendo su camino; y el Señor cargó sobre él todos nuestros crímenes. Maltratado, voluntariamente se humillaba y no abría la boca: como cordero llevado al matadero, como oveja ante el esquilador, enmudecía y no abría la boca.'
  versiculo:
  - - V
    - Me confinó a las tinieblas.
  - - R
    - Como a los muertos ya olvidados.
  oracion: Mira, Señor, con bondad a tu familia santa, por la cual Jesucristo nuestro Señor aceptó el tormento de la cruz, entregándose a sus propios enemigos. Por Cristo nuestro Señor.
Sábado Santo:
  himno: Cruz de Cristo
  ant: Su tabernáculo está en Jerusalén, su morada en la paz.
  lectura:
    ref: 1Jn 2, 8b-10
    texto: Las tinieblas van pasando y ya brilla la luz verdadera. Quien dice que está en la luz y aborrece a su hermano está todavía en las tinieblas. Quien ama a su hermano está siempre en la luz; y no hay ocasión de ruina en él.
  versiculo:
  - - V
    - Después de sepultar al Señor, sellaron el sepulcro.
  - - R
    - Y pusieron guardias para custodiarlo.
  oracion: Dios todopoderoso, cuyo Unigénito descendió al lugar de los muertos y salió victorioso del sepulcro, te pedimos que concedas a todos tus fieles, sepultados con Cristo por el bautismo, resucitar también con él a la vida eterna. Por Cristo nuestro Señor.
Domingo de Pascua de la Resurrección del Señor (A):
  himno: Reina el Señor allí donde ninguno
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
  lectura:
    ref: Rm 6, 4
    texto: Por nuestro bautismo fuimos sepultados con Cristo, para participar de su muerte; para que, así como Cristo fue resucitado de entre los muertos por la gloria del Padre, así también nosotros vivamos una vida nueva.
  versiculo:
  - - V
    - Este es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que en este día nos abriste las puertas de la vida por medio de tu Hijo, vencedor de la muerte, concédenos a todos los que celebramos su gloriosa resurrección que, por la nueva vida que tu Espíritu nos comunica, lleguemos también nosotros a resucitar a la luz de la vida eterna. Por Cristo nuestro Señor.
Domingo de Pascua de la Resurrección del Señor (B):
  himno: Reina el Señor allí donde ninguno
  ant: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
