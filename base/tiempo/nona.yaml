Lunes de la IV semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Tm 2, 8. 11
    texto: 'Acuérdate de Cristo Jesús, del linaje de David, que vive resucitado de entre los muertos, como enseño en mi mensaje de salud. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Oh Dios, que por medio de la humillación de tu Hijo levantaste a la humanidad caída, conserva a tus fieles en continua alegría y concede los gozos del cielo a quienes has librado de la esclavitud del pecado. Por Cristo nuestro Señor.
Martes de la IV semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Col 3, 1-2
    texto: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios. Poned vuestro corazón en las cosas del cielo, no en las de la tierra.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso, concédenos que la celebración de las fiestas de Cristo resucitado aumente en nosotros la alegría de saber que estamos salvados. Por Cristo nuestro Señor.
Miércoles de la IV semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Ef 4, 23-24
    texto: 'Renovaos en la mente y en el espíritu y vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios nuestro, vida de los creyentes, gloria de los humildes, felicidad de los justos, atiende benignamente a nuestras súplicas y haz que quienes deseamos ardientemente el cumplimiento de tus promesas seamos siempre colmados por la abundancia de tus beneficios. Por Cristo nuestro Señor.
Jueves de la IV semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Col 1, 12-14
    texto: Damos gracias a Dios Padre, que nos ha hecho capaces de compartir la herencia del pueblo santo en la luz. Él nos ha sacado del dominio de las tinieblas, y nos ha trasladado al reino de su Hijo querido, por cuya sangre hemos recibido la redención, el perdón de los pecados.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Señor Dios nuestro, que al restaurar la naturaleza humana le otorgaste una dignidad mayor que la que tuvo en sus orígenes, mantén siempre tus inefables designios de amor hacia nosotros, y conserva en quienes hemos renacido por el bautismo los dones que de tu bondad hemos recibido. Por Cristo nuestro Señor.
Viernes de la IV semana de Pascua:
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Co 5, 7-8
    texto: Tirad fuera la levadura vieja para que seáis una masa nueva, ya que ahora sois panes ázimos, pues Cristo, nuestro cordero pascual, ha sido inmolado. Así, pues, celebremos nuestra fiesta no con la vieja levadura ni con levadura de malicia y perversidad, sino con los panes ázimos de pureza y verdad.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios, autor de nuestra salvación y de nuestra liberación, escucha nuestras súplicas, y a quienes redimiste por la sangre de tu Hijo concédeles poder vivir para ti, y en ti gozar de la felicidad eterna. Por Cristo nuestro Señor.
Lunes de la II semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Tm 2, 8. 11
    texto: 'Acuérdate de Cristo Jesús, del linaje de David, que vive resucitado de entre los muertos, como enseño en mi mensaje de salud. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él.'
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por Cristo nuestro Señor.
Sábado de la IV semana de Pascua:
  himno: Salvador del mundo
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 2Co 5, 14-15
    texto: El amor de Cristo nos apremia, al pensar que, si uno murió por todos, consiguientemente todos murieron en él; y murió por todos, para que los que viven no vivan ya para sí, sino para aquel que murió y resucitó por ellos.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque ya es tarde. Aleluia.
  oracion: Dios todopoderoso y eterno, asístenos con tu gracia para que llevemos a su más plena realidad, en nosotros mismos, el misterio pascual que estamos celebrando, y para que así los que hemos renacido en el bautismo demos frutos abundantes de vida cristiana y alcancemos finalmente los goces de la vida eterna. Por Cristo nuestro Señor.
V Domingo de Pascua (A):
  himno: Reina el Señor allí donde ninguno
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Rm 6, 4
