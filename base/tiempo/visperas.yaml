    texto: Sed bondadosos y compasivos unos con otros, y perdonaos mutuamente como también Dios os ha perdonado en Cristo. Sed en una palabra, imitadores de Dios, como hijos amados que sois. Y vivid en el amor a ejemplo de Cristo, que os amó y se entregó por nosotros a Dios como oblación de suave fragancia.
