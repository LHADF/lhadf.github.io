  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: «No juzguéis y no seréis juzgados; con la medida con que midais se os medirá a vosotros», dice el Señór.
  preces:
    intro: 'Bendigamos a Dios, nuestro Padre, que por la palabra de su Hijo prometió escuchar la oración de los que se reúnen en su nombre, y, confiados en esta promesa, supliquémosle, diciendo:'
    preces:
    - - Señor, tú que en la montaña del Sinaí diste a conocer tu ley por medio de Moisés y la perfeccionaste luego por Cristo,
      - haz que todos los hombres descubran que tienen esta ley inscrita en el corazón y que la deben guardar para hacer efectiva la alianza que has hecho con ellos.
    - - Concede a los superiores fraternal solicitud hacia los que les han sido confiados,
      - y a los súbditos espíritu de obediente colaboración.
    - - Fortalece el espíritu y el corazón de los misioneros
      - y suscita en todas partes colaboradores de su obra.
    - - Que los niños crezcan en gracia y en edad,
      - y que los jóvenes se abran con sinceridad a tu amor.
    - - Acuérdate de nuestros hermanos que ya duermen el sueño de la paz
      - y dales parte en la vida eterna.
    respuesta: Escucha a tu pueblo, Señor.
  padrenuestro_intro: 'Digamos a nuestro Padre, juntamente con Jesús, la oración que él nos enseñó:'
  oracion: Señor, tu que para nuestro progreso espiritual nos mandas dominar nuestro cuerpo mediante la austeridad, ayúdanos a huir también de todo pecado y a entregarnos, con amor filial, al cumplimiento de tus mandatos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la II semana de Cuaresma:
  himno: No me pesa, Señor, haber faltado
  lectura:
    ref: St 2, 14. 17. 18b
    texto: 'Hermanos, ¿qué provecho saca uno con decir: «Yo tengo fe», si no tiene obras? ¿Podrá acaso salvarlo la fe? La fe, si no va acompañada de las obras, está muerta en su soledad. Pruébame tu fe sin obras que yo por mis obras te probaré mi fe.'
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
