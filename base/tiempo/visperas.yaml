XII Domingo del Tiempo Ordinario (A):
  ant_magnificat: No tengáis miedo a los que matan el cuerpo, pero no pueden matar el alma.
XII Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'Los discípulos se preguntaban unos a otros: ¿«Quién es éste? ¡Hasta el viento y el mar lo obedecen!»'
XII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Si alguno quiere venir en pos de mí, renúnciese a sí mismo, tome cada día su cruz y sígame.
XIII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: El que a vosotros recibe a mí me recibe, y recibe también a aquel que me ha enviado.
XIII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Una mujer enferma tocó el vestido de Jesús y, al instante, notó en su cuerpo que estaba curada.
XIII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Con ánimo decidido, Jesús subía a Jerusalén, al encuentro de su pasión.
XIII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios nuestro, que quisiste hacernos hijos de la luz por la adopción de la gracia, concédenos que no seamos envueltos por las tinieblas del error, sino que permanezcamos siempre en el esplendor de la verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
