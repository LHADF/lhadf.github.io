  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: ¿Pretendéis quitarme la vida, a mí, que os he manifestado la verdad?
  preces:
    intro: 'Alabemos a Dios todopoderoso y providente, que conoce todas nuestras necesidades pero quiere ante todo que busquemos su reino; supliquémosle, pues, diciendo:'
    preces:
    - - Padre santo, que nos diste a Cristo como pastor de nuestras vidas, ayuda a los pastores y a los pueblos a ellos confiados, para que no falte nunca al rebaño la solicitud de sus pastores
      - ni falte a los pastores la obediencia de su rebaño.
    - - Mueve a los cristianos para que con amor fraternal se interesen por los enfermos
      - y que en ellos socorran a tu Hijo.
    - - Haz que entren a formar parte de tu Iglesia los que aún no creen en el Evangelio,
      - y que, con sus buenas obras, la hagan crecer en el amor.
    - - A nosotros, pecadores, concédenos tu perdón
      - y la reconciliación con tu Iglesia.
    - - A los que murieron concédeles resucitar a la vida eterna
      - y morar eternamente contigo.
    respuesta: Venga, Señor, tu reino y su justicia.
  padrenuestro_intro: 'Invoquemos a Dios Padre con la oración que nos enseñó Jesús:'
  oracion: Dios misericordioso, ilumina los corazones de tus hijos que tratan de purificarse por la penitencia de la Cuaresma y, ya que nos infundes el deseo de servirte con amor, dígnate escuchar paternalmente nuestras súplicas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la V semana de Cuaresma:
  himno: Señor, la luz del día ya se apaga
  lectura:
    ref: Hb 13, 12-15
    texto: Jesús, para santificar con su propia sangre al pueblo, padeció la muerte fuera de la ciudad. Salgamos, pues, hacia él fuera del campamento, cargando con su oprobio. Porque no tenemos aquí ciudad permanente, sino que vamos buscando la futura. Por medio de él ofrezcamos continuamente a Dios un sacrificio de alabanza, es decir, el tributo de los labios que van bendiciendo su nombre.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
