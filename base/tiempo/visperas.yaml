  padrenuestro_intro: 'Digamos ahora todos juntos la oración que el mismo Cristo nos enseñó:'
  oracion: Dios misericordioso, concede a tu Iglesia, congregada por el Espíritu Santo, que se entregue plenamente a ti y que viva siempre unificada por el amor, según tú se lo has mandado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
