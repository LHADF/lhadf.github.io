XVI Domingo del Tiempo Ordinario (A):
  ant_magnificat: Al fin de los tiempos, el Hijo del hombre separará el trigo de la cizaña; entonces los santos brillarán como el sol en el reino de su Padre.
XVI Domingo del Tiempo Ordinario (B):
  ant_magnificat: Desde todas las aldeas, se dirigieron hacia Jesús; y él se movió a compasión, porque estaban como ovejas sin pastor.
XVI Domingo del Tiempo Ordinario (C):
  ant_magnificat: Sólo una cosa es necesaria; María ha escogido la mejor parte, y no se la quitarán nunca.
XVII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Un letrado que entiende del reino de los cielos es como un padre de familia que va sacando del arca lo nuevo y lo antiguo.
XVII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: 'Jesús, viendo que venía a él una gran multitud, preguntó a Felipe: «¿Dónde compraremos panes, para que coma toda esta gente?»'
XVII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: 'Estaba Jesús un día haciendo oración y, después que terminó, uno de sus discípulos le dijo: «Señor, enséñanos a orar.»'
XVII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios, protector de los que en ti esperan, sin ti nada es fuerte ni santo; aumenta los signos de tu misericordia sobre nosotros, para que, bajo tu dirección, de tal modo nos sirvamos de las cosas pasajeras que por ellas alcancemos con mayor plenitud las eternas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVII Domingo del Tiempo Ordinario:
