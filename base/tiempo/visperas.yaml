  himno: Oh bondadoso Creador, escucha
  preces:
    intro: 'Demos gloria y alabanza a Dios Padre que, por medio de su Hijo, la Palabra encarnada, nos hace renacer de un germen incorruptible y eterno, y supliquémosle, diciendo:'
    preces:
    - - Escucha, Dios de misericordia, la oración que te presentamos en favor de tu pueblo
      - y concede a tus fieles desear tu palabra más que el alimento del cuerpo.
    - - Enséñanos a amar de verdad y sin discriminación a nuestros hermanos y a los hombres de todas las razas,
      - y a trabajar por su bien y por la concordia mutua.
    - - Pon tus ojos en los catecúmenos que se preparan para el bautismo
      - y haz de ellos piedras vivas y templo espiritual en tu honor.
    - - Tú que por la predicación de Jonás exhortaste a los ninivitas a la penitencia,
      - haz que tu palabra llame a los pecadores a la conversión.
    - - Haz que los moribundos esperen confiadamente el encuentro con Cristo,
      - su juez, y gocen eternamente de tu presencia.
    respuesta: Señor, ten piedad de tu pueblo.
  oracion: Te pedimos, Señor, que enciendas nuestros corazones en aquel mismo amor con que tu Hijo ama al mundo y que lo impulsó a entregarse a la muerte por salvarlo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Unidos fraternalmente, dirijamos al Padre nuestra oración común:'
  salmodia:
  - ant: Así como fue levantada en alto la serpiente en el desierto, así deberá ser levantado en alto el Hijo del hombre.
    salmo: salmo-109-1-5-7
  - ant: El Señor de los ejércitos es protección liberadora, rescate salvador.
    salmo: salmo-113-a
  - ant: Él fue herido por nuestras rebeldías, triturado por nuestros crímenes, por sus llagas hemos sido curados.
    salmo: cantico-1pe-2-21b-24
  lectura:
    ref: Hch 13, 26-30a
    texto: Hermanos, a vosotros envía Dios este mensaje de salvación. Los habitantes de Jerusalén y sus jefes no reconocieron a Jesús, pero, al condenarlo a muerte, dieron cumplimiento a las palabras de los profetas que se leen cada sábado. Y, a pesar de que no encontraron en él causa alguna digna de muerte, pidieron a Pilato que lo hiciera morir. Una vez que cumplieron todo lo que de él estaba escrito, lo bajaron de la cruz y lo depositaron en un sepulcro. Pero Dios lo resucitó de entre los muertos.
V Domingo de Cuaresma (A):
  ant_magnificat: Yo soy la resurrección y la vida; quien a mí se una con viva fe, aunque muera, vivirá
V Domingo de Cuaresma (B):
  ant_magnificat: Cuando sea yo levantado en alto sobre la tierra, atraeré a todos hacia mí
V Domingo de Cuaresma (C):
  ant_magnificat: Mujer, yo no te condeno; vete, y en adelante no peques más.
Lunes de la V semana de Cuaresma:
  himno: Ésta es la hora para el buen amigo
  lectura:
    ref: Rm 5, 8-9
    texto: Dios nos demuestra el amor que nos tiene en el hecho de que, siendo todavía pecadores, murió Cristo por nosotros. Así que con mayor razón, ahora que hemos sido justificados por su sangre, seremos salvados por él de la cólera divina.
  responsorio:
