II Domingo de Pascua (de la Divina Misericordia) · I Vísperas:
  himno: Revestidos de blancas vestiduras
  preces:
    intro: 'Oremos a Cristo, que resucitando de entre los muertos destruyó la muerte y nos dio nueva vida, y digámosle:'
    preces:
    - - Tu que eres la piedra rechazada por los arquitectos, pero convertida en piedra angular,
      - conviértenos a nosotros en piedras vivas de tu Iglesia.
    - - Tú que eres el testigo fiel y el primogénito de entre los muertos,
      - haz que tu Iglesia sea también siempre testimonio ante el mundo.
    - - Tú que eres el único esposo de la Iglesia, nacida de tu costado,
      - haz que todos nosotros seamos signos de tus bodas con la Iglesia.
    - - Tú que eres el primero y el último, el que estabas muerto y ahora vives por los siglos de los siglos,
      - concede a todos los bautizados perseverar fieles hasta la muerte, a fin de recibir la corona de la victoria.
    - - Tu que eres la lámpara que ilumina la ciudad santa de Dios,
      - alumbra con tu claridad a nuestros hermanos difuntos.
    respuesta: Tú que vives eternamente, escúchanos, Señor.
  oracion: Señor Dios, cuya misericordia es eterna, tú que reanimas la fe de tu pueblo con la celebración anual de las fiestas pascuales, aumenta en nosotros los dones de tu gracia, para que comprendamos mejor la excelencia del bautismo que nos ha purificado, la grandeza del Espíritu que nos ha reengendrado y el precio de la sangre que nos ha redimido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Sintiéndonos verdaderos hijos de Dios, digamos a nuestro Padre:'
  ant_magnificat: 'Ocho días después, estando cerradas las puertas, se presentó Jesús y, en presencia de todos, exclamó: «La paz sea con vosotros.» Aleluia.'
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: 1Pe 2, 9-10
    texto: Vosotros sois linaje escogido, sacerdocio regio, nación santa, pueblo adquirido por Dios para proclamar las hazañas del que os llamó a salir de la tiniebla y a entrar en su luz maravillosa. Vosotros, que en otro tiempo no erais pueblo, sois ahora pueblo de Dios; vosotros, que estabais excluidos de la misericordia, sois ahora objeto de la misericordia de Dios.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
II Domingo de Pascua (de la Divina Misericordia):
  himno: Al fin será la paz y la corona
  preces:
    intro: 'Oremos a Dios Padre, que resucitó a su Hijo Jesucristo y lo exaltó a su derecha, y digámosle:'
    preces:
    - - Padre justo, que por la victoria de la cruz elevaste a Cristo sobre la tierra,
      - atrae hacia él a todos los hombres.
    - - Por tu Hijo glorificado, envía, Señor, sobre tu Iglesia al Espíritu Santo,
      - a fin de que tu pueblo sea en medio del mundo signo de la unidad de los hombres.
    - - Conserva en la fe de su bautismo a la nueva prole renacida del agua y del Espíritu Santo,
      - para que alcance la vida eterna.
    - - Por tu Hijo glorificado, ayuda, Señor, a los que sufren, da la libertad a los presos, la salud a los enfermos
      - y la abundancia de tus bienes a todos los hombres.
    - - A nuestros hermanos difuntos, a quienes mientras vivían en este mundo diste el cuerpo y la sangre de tu Hijo glorioso,
      - concédeles la gloria de la resurrección en el último día.
    respuesta: Haz que participemos, Señor, de la gloria de Cristo.
  oracion: Señor Dios, cuya misericordia es eterna, tú que reanimas la fe de tu pueblo con la celebración anual de las fiestas pascuales, aumenta en nosotros los dones de tu gracia, para que comprendamos mejor la excelencia del bautismo que nos ha purificado, la grandeza del Espíritu que nos ha reengendrado y el precio de la sangre que nos ha redimido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  ant_magnificat: ¿No has creído, Tomás, sino después de haberme visto? Dichosos los que sin ver han creído. Aleluia.
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Hb 10, 12-14
    texto: Cristo, habiendo ofrecido un solo sacrificio en expiación de los pecados, está sentado para siempre a la diestra de Dios, y espera el tiempo que falta «hasta que sus enemigos sean puestos por escabel de sus pies». Así, con una sola oblación, ha llevado para siempre a la perfección en la gloria a los que ha santificado.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
