  preces:
    intro: 'Bendigamos a Dios Padre, que con tanta generosidad ha derramado los dones del Espíritu Santo sobre todos los pueblos, y pidámosle que no cese nunca de derramar su gracia sobre el mundo; digamos:'
    preces:
    - - Señor, tú que nos has dado a tu Elegido como luz de los pueblos,
      - abre los ojos de los ciegos y libra de toda esclavitud a los que viven en tinieblas.
    - - Tú que ungiste a Cristo con la fuerza del Espíritu Santo, para que realizara la salvación de los hombres,
      - haz que sintamos cómo pasa de nuevo por el mundo, haciendo el bien y curando a todos.
    - - Envía a tu Espíritu, que es la luz de los corazones,
      - para que confirme en la fe a los que viven en medio de incertidumbres y dudas.
    - - Envía a tu Espíritu, que es descanso en el trabajo,
      - para que reconforte a los que se sienten fatigados y desanimados.
    - - Realiza la esperanza de los que ya han muerto,
      - y haz que cuando venga el Señor obtengan una resurrección gloriosa.
    respuesta: Que la gracia del Espíritu Santo abunde, Señor, en el mundo.
  padrenuestro_intro: 'Dirijamos ahora al Padre nuestra oración con las mismas palabras que Cristo nos enseñó:'
  oracion: Dios nuestro, que nos has abierto las puertas de la eternidad con la glorificación de tu Hijo Jesucristo y con la venida del Espíritu Santo, concédenos que, por la recepción de dones tan grandes, nuestra fe vaya más y más en aumento y nuestra entrega a ti sea cada día más completa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
