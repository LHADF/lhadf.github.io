  ant_magnificat: 'Preguntó Herodes a los magos: «¿Qué signo habéis visto sobre el Rey recién nacido?» «Vimos una estrella resplandeciente, cuyo fulgor ilumina al mundo entero.»'
  preces:
    intro: 'Glorifiquemos a Cristo, Palabra de Dios, que ha venido para arrojar a lo hondo del mar todos nuestros delitos y, llenos de confianza en su poder, digámosle suplicantes:'
    preces:
    - - Sacerdote eterno, que al entrar en el mundo llevaste a plenitud el culto divino,
      - haz que, por medio de la Iglesia, todos participen del culto que tú has instituido.
    - - Médico de las almas y de los cuerpos, que viniste a visitar a los que estábamos enfermos,
      - concede la salud a quienes carecen de ella y fortifica a los que se sienten débiles.
    - - Tú que en tu nacimiento eres motivo de alegría para todos,
      - ayuda a los pobres, compadécete de los pecadores y haz que todos encuentren en ti su alegría.
    - - Rey vencedor, que has venido a destruir las cadenas de nuestra antigua esclavitud,
      - haz justicia a los oprimidos y consuela a los encarcelados.
    - - Tú que has venido al mundo para ser la puerta de entrada en el cielo,
      - haz que los difuntos tengan, por ti, acceso al Padre.
    respuesta: Muéstranos, Señor, tu misericordia.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres y que su amor se extienda por toda la tierra, pidamos al Padre que su reino venga a nosotros:'
  oracion: Señor, Dios nuestro, luz radiante de todas las naciones, concede una paz estable a todos los pueblos de la tierra, y haz que aquella luz resplandeciente, que condujo a los magos al conocimiento de tu Hijo, ilumine también nuestros corazones. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
