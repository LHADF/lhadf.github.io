    ref: Ef 2, 3b-5
    texto: Eramos por nuestro natural hijos de cólera, como los demás. Pero Dios, que es rico en misericordia, por el gran amor con que nos amó, aun cuando estábamos muertos por nuestros pecados, nos vivificó con Cristo —por pura gracia habéis sido salvados—.
  responsorio:
  - - V
    - Será la bendición de todos los pueblos.
  - - R
    - Será la bendición de todos los pueblos.
