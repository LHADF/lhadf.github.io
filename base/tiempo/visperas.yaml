  himno: Las banderas reales se adelantan
  preces:
    intro: 'Adoremos a Cristo, quien, próximo ya a su pasión, al contemplar a Jerusalén, lloró por ella, porque no había aceptado el tiempo de gracia; arrepintiéndonos, pues, de nuestros pecados, supliquémosle, diciendo:'
    preces:
    - - Tú que quisiste reunir a los hijos de Jerusalén, como la gallina reúne a sus polluelos bajo las alas,
      - enséñanos a reconocer el tiempo de tu visita.
    - - No abandones a los fieles que te abandonaron,
      - antes concédenos la gracia de la conversión y volveremos a ti, Señor, Dios nuestro.
    - - Tú que, por tu pasión, has dado con largueza la gracia al mundo,
      - concédenos que, fieles a nuestro bautismo, vivamos constantemente de tu Espíritu.
    - - Que tu pasión nos estimule a vivir renunciando al pecado,
      - para que, libres de toda esclavitud, podamos celebrar santamente tu resurrección.
    - - Tú que reinas en la gloria del Padre,
      - acuérdate de los que hoy han muerto.
    respuesta: Ten piedad de tu pueblo, Señor.
  oracion: Dios todopoderoso y eterno, que quisiste que nuestro Salvador se anonadase, haciéndose hombre y muriendo en la cruz, para que todos nosotros imitáramos su ejemplo de humildad, concédenos seguir las enseñanzas de su pasión, para que un día participemos en su resurrección gloriosa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Porque la victoria de Cristo es nuestra victoria, nos atrevemos a decir a Dios:'
  ant_magnificat: Salve, Rey nuestro, Hijo de David, Redentor del mundo; ya los profetas te anunciaron como el Salvador que había de venir.
  salmodia:
  - ant: Todos los días me sentaba en el templo para enseñar y nunca me prendisteis; ahora, flagelado, me lleváis para ser crucificado.
    salmo: salmo-118-105-112
  - ant: El Señor me ayuda, por eso no sentía los ultrajes.
    salmo: salmo-15
  - ant: El Señor Jesús se rebajó hasta someterse incluso a la muerte y una muerte de cruz.
    salmo: cantico-flp-2-6-11
