  himno: Al fin será la paz y la corona
  preces:
    intro: 'Oremos a Dios Padre, que resucitó a su Hijo Jesucristo y lo exaltó a su derecha, y digámosle:'
    preces:
    - - Padre justo, que por la victoria de la cruz elevaste a Cristo sobre la tierra,
      - atrae hacia él a todos los hombres.
    - - Por tu Hijo glorificado, envía, Señor, sobre tu Iglesia al Espíritu Santo,
      - a fin de que tu pueblo sea en medio del mundo signo de la unidad de los hombres.
    - - Conserva en la fe de su bautismo a la nueva prole renacida del agua y del Espíritu Santo,
      - para que alcance la vida eterna.
    - - Por tu Hijo glorificado, ayuda, Señor, a los que sufren, da la libertad a los presos, la salud a los enfermos
      - y la abundancia de tus bienes a todos los hombres.
    - - A nuestros hermanos difuntos, a quienes mientras vivían en este mundo diste el cuerpo y la sangre de tu Hijo glorioso,
      - concédeles la gloria de la resurrección en el último día.
    respuesta: Haz que participemos, Señor, de la gloria de Cristo.
  oracion: Concédenos, Dios todopoderoso, continuar celebrando con amor ferviente estos días de alegría en honor de Cristo resucitado, y que los misterios que estamos recordando transformen nuestra vida y se manifiesten en nuestras obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  salmodia:
  - ant: Dios resucitó a Cristo de entre los muertos y lo hizo sentar en su gloria. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Habéis renunciado a los ídolos para consagraros al Dios vivo. Aleluia.
    salmo: salmo-113-b
  - ant: Aleluia. La salvación y la gloria y el poder son de nuestro Dios. Aleluia.
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Hb 10, 12-14
    texto: Cristo, habiendo ofrecido un solo sacrificio en expiación de los pecados, está sentado para siempre a la diestra de Dios, y espera el tiempo que falta «hasta que sus enemigos sean puestos por escabel de sus pies». Así, con una sola oblación, ha llevado para siempre a la perfección en la gloria a los que ha santificado.
VI Domingo de Pascua (A):
  ant_magnificat: El que me ama guardará mi palabra; mi Padre lo amará y vendremos a fijar en él nuestra morada. Aleluia
VI Domingo de Pascua (B):
  ant_magnificat: Vosotros sois mis amigos si hacéis lo que os mando. Aleluia
VI Domingo de Pascua (C):
  ant_magnificat: La paz os dejo, mi paz os doy. Aleluia
Lunes de la VI semana de Pascua:
  himno: Cantarán, llorarán razas y hombres
  salmodia:
  - ant: Bendito el que viene en nombre del Señor. Aleluia.
    salmo: salmo-44-i
  - ant: Dichosos los invitados a la cena del Señor. Aleluia.
    salmo: salmo-44-ii
  - ant: De su plenitud todos hemos recibido gracia tras gracia. Aleluia.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Hb 8, 1b-3a
    texto: Tenemos un sumo sacerdote que está sentado a la diestra del trono de la Majestad en los cielos. Él es ministro del santuario y de la verdadera Tienda de Reunión, que fue fabricada por el Señor y no por hombre alguno. Todo sumo sacerdote es instituido para ofrecer oblaciones y sacrificios.
  responsorio:
