XII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: 'El Señor preguntó: «Y vosotros, ¿quién decís que soy yo?» «Tú eres el ungido de Dios.»'
XII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Concédenos vivir siempre, Señor, en el amor y respeto a tu santo nombre, porque jamás dejas de dirigir a quienes estableces en el sólido fundamento de tu amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
