# Propio del tiempo de Vísperas: por feria (nombre del Ordo). «· I Vísperas» = primeras vísperas (se rezan la tarde anterior);
# en los domingos, «(A)», «(B)» o «(C)» cuando cambia con el ciclo. Solo figura lo que cambia respecto del salterio.
I Domingo de Adviento (A) · I Vísperas:
  lectura:
    ref: 1Ts 5, 23-24
    texto: Que el mismo Dios de la paz os consagre totalmente y que todo vuestro ser -espíritu, alma y cuerpo- sea custodiado sin reproche hasta la Parusía de nuestro Señor Jesucristo. Fiel es a sus promesas el que os ha convocado; y él las cumplirá.
