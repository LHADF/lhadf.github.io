  - - R
    - Muéstranos, Señor, tu misericordia.
  himno: Escucha, casa de David
  preces:
    intro: 'Hermanos, oremos a Cristo, el Señor que viene a salvar a todos los hombres, y digámosle confiadamente:'
    preces:
    - - Señor Jesucristo, que por el misterio de la encarnación manifestaste al mundo la gloria de tu divinidad,
      - vivifica al mundo con tu venida.
    - - Tú que participaste de nuestra debilidad,
      - concédenos tu misericordia.
    - - Tú que en tu primera venida viniste humildemente para salvar al mundo de sus pecados,
      - absuélvenos de todas las culpas, cuando vuelvas de nuevo con gloria y majestad.
    - - Tú que lo gobiernas todo con tu poder,
      - ayúdanos, por tu bondad, a alcanzar la herencia eterna.
    - - Tú que estás sentado a la derecha del Padre,
      - alegra con la visión de tu rostro a nuestros hermanos difuntos.
    respuesta: Ven, Señor Jesús.
  oracion: Señor, derrama tu gracia sobre nosotros, que hemos conocido por el anuncio del ángel la encarnación de tu Hijo, para que lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres, digamos al Padre:'
  salmodia:
  - ant: Contemplad cuán glorioso es el que viene a salvar a todos los pueblos.
    salmo: salmo-109-1-5-7
  - ant: 'Lo torcido se enderece, lo escabroso se iguale: ven, Señor, y no tardes más. Aleluia.'
    salmo: salmo-111
  - ant: Se dilatará su principado con una paz sin límites. Aleluia.
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Flp 4, 4-5
    texto: 'Estad siempre alegres en el Señor. Otra vez os lo digo: Estad alegres. Que vuestra bondad sea conocida de todos. El Señor está cerca.'
IV Domingo de Adviento (A):
  ant_magnificat: Oh Adonai, Pastor de la casa de Israel, que te apareciste a Moisés en la zarza ardiente y en el Sinaí le diste tu ley, ven a librarnos con el poder de tu brazo.
IV Domingo de Adviento (B):
  ant_magnificat: Oh llave de David y cetro de la casa de Israel, que abres y nadie puede cerrar, cierras y nadie puede abrir, ven y libra a los cautivos que viven en tinieblas y en sombras de muerte.
IV Domingo de Adviento (C):
  ant_magnificat: Oh llave de David y cetro de la casa de Israel, que abres y nadie puede cerrar, cierras y nadie puede abrir, ven y libra a los cautivos que viven en tinieblas y en sombras de muerte.
Natividad del Señor (A) · I Vísperas:
  himno: Hoy nace el sol divinal
  salmodia:
  - ant: El Rey de la paz ha sido glorificado y toda la tierra desea contemplar su rostro.
    salmo: salmo-112
  - ant: Envía su mensaje a la tierra, y su palabra corre veloz.
    salmo: salmo-147
  - ant: El que era la Palabra substancial del Padre, engendrado antes del tiempo, hoy se ha anonadado a sí mismo, haciéndose carne por nosotros.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: Ga 4, 4-5
    texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
  responsorio:
  - - V
    - Hoy sabréis que vendrá el Señor.
  - - R
    - Hoy sabréis que vendrá el Señor.
  - - V
    - Y mañana veréis su gloria.
  - - R
    - Hoy sabréis que vendrá el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Hoy sabréis que vendrá el Señor.
  ant_magnificat: Cuando salga el sol, veréis al Rey de reyes, que viene del Padre, como el esposo que sale de su alcoba.
  preces:
    intro: 'Adoremos a Cristo, que se anonadó a sí mismo y tomó la condición de esclavo, probado en todo exactamente como nosotros, menos en el pecado, y supliquémosle con fe ardiente, diciendo:'
    preces:
    - - Tú que al entrar en el mundo has inaugurado el tiempo nuevo anunciado por los profetas,
      - haz que tu Iglesia se rejuvenezca siempre.
    - - Tú que asumiste las debilidades de los hombres,
      - dígnate ser luz para los que no ven, fuerza para los débiles, consuelo para los tristes.
    - - Tú que naciste pobre y humilde,
      - mira con amor a los pobres y dígnate consolarlos.
    - - Tú que anuncias a todos la alegría de una vida sin fin por tu nacimiento terreno,
      - alegra a los agonizantes con la esperanza de un nacimiento a una vida eterna.
    - - Tú que descendiste al mundo para que los hombres pudiesen ascender al cielo,
      - admite en tu gloria a todos los difuntos.
    respuesta: Por tu nacimiento, socorre Señor, a quienes has redimido.
  padrenuestro_intro: 'Porque Dios ha infundido en nuestros corazones un espíritu filial, nos atrevemos a decir:'
  oracion: Dios nuestro, que cada año nos alegras con la festividad llena de esperanza de nuestra redención, concédenos que así como ahora acogemos a tu Hijo llenos de júbilo como redentor, así también lo recibamos llenos de confianza cuando vuelva como juez. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
