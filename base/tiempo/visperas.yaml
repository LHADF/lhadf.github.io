  padrenuestro_intro: 'Unidos fraternalmente, acudamos ahora al Padre de todos:'
  oracion: Dios nuestro, que, para tu mayor gloria y para la salvación del género humano, has constituido a Jesucristo como sumo y eterno sacerdote, haz que el pueblo que él conquistó con su sangre reciba plenamente, al participar del memorial de su pasión, los tesoros que dimanan de su muerte y resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: Cristo, por nosotros, se sometió incluso a la muerte.
Viernes Santo de la Pasión del Señor:
  himno: Brazos rígidos y yertos
  salmodia:
  - ant: Escuchad, pueblos todos, y mirad mi dolor.
    salmo: salmo-115
  - ant: Mi aliento desfallece, mi corazón dentro de mí está yerto.
    salmo: salmo-142-1-11
  - ant: 'Jesús, después de haber probado el vinagre, exclamó: «Todo está cumplido»; e, inclinando la cabeza, expiró.'
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 1Pe 2, 21b-24
    texto: Cristo padeció por nosotros, dejándonos un ejemplo para que sigamos sus huellas. Él no cometió pecado ni encontraron engaño en su boca; cuando le insultaban, no devolvía el insulto; en su pasión no profería amenazas; al contrario, se ponía en manos del que juzga justamente. Cargado con nuestros pecados subió al leño, para que, muertos al pecado, vivamos para la justicia. Sus heridas nos han curado.
  ant_magnificat: Siendo enemigos, hemos sido reconciliados con Dios por la muerte de su Hijo.
  padrenuestro_intro: ''
  oracion: Mira, Señor, con bondad a tu familia santa, por la cual Jesucristo nuestro Señor aceptó el tormento de la cruz, entregándose a sus propios enemigos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: Cristo, por nosotros, se sometió incluso a la muerte, y una muerte de cruz.
  responsorio:
  - - V
    - El Señor es justo y ama la justicia.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Los buenos verán su rostro.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es justo y ama la justicia.
  preces:
    intro: 'Pidamos a Dios Padre, fuente de toda santidad, que con la intercesión y el ejemplo de los santos nos ayude, y digamos:'
    preces:
    - - Padre santo, que has querido que nos llamemos y seamos hijos tuyos,
      - haz que la Iglesia santa, extendida por los confines de la tierra, cante tus grandezas.
    - - Padre santo, que deseas que vivamos de una manera digna, buscando siempre tu beneplácito,
      - ayúdanos a dar fruto de buenas obras.
    - - Padre santo, que nos reconciliaste contigo por medio de Cristo,
      - guárdanos en tu nombre para que todos seamos uno.
    - - Padre santo, que nos convocas al banquete de tu reino,
      - haz que comiendo el pan que ha bajado del cielo alcancemos la perfección del amor.
    - - Da tu perdón pleno a los difuntos.
      - ''
    respuesta: Haz que seamos santos, porque tú, Señor, eres santo.
Sábado Santo:
  himno: Venid al huerto, perfumes
  salmodia:
  - ant: Oh muerte, yo seré tu muerte; país de los muertos, yo seré tu aguijón.
    salmo: salmo-115
  - ant: Como estuvo Jonás en el vientre del cetáceo tres días y tres noches, así estará el Hijo del hombre en el seno de la tierra.
    salmo: salmo-142-1-11
  - ant: «Destruid este templo —dice el Señor— y yo lo levantaré en tres días»; esto lo decía refiriéndose al templo de su propio cuerpo.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 1Pe 1, 18-21
    texto: 'Ya sabéis con qué os rescataron: no con bienes efímeros, con oro o plata, sino a precio de la sangre de Cristo, el cordero sin defecto ni mancha. Ya de antes de la creación del mundo estaba él predestinado para eso; y al fin de los tiempos se ha manifestado por amor a vosotros. Por él creéis en Dios que lo resucitó de entre los muertos y lo glorificó. Así vuestra fe y esperanza se centran en Dios.'
  ant_magnificat: Ahora ha entrado el Hijo del hombre en su gloria, y Dios ha recibido su glorificación por él; Dios, a su vez, pronto lo revestirá de su misma gloria.
  preces:
    intro: 'Adoremos a nuestro Redentor, que por nosotros y por todos los hombres quiso morir y ser sepultado, para resucitar de entre los muertos, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesús, de tu corazón traspasado salió sangre y agua, signo de cómo la Iglesia nacía de tu costado;
      - por tu muerte, por tu sepultura y por tu resurrección vivifica, pues, a tu Iglesia.
    - - Tú que te acordaste incluso de los apóstoles que habían olvidado la promesa de tu resurrección,
      - no olvides tampoco a los que por no creer en tu triunfo viven sin esperanza.
    - - Cordero de Dios, víctima pascual inmolada por todos los hombres,
      - atrae desde tu cruz a todos los pueblos de la tierra.
    - - Dios del universo, que contienes en ti todas las cosas y aceptaste, sin embargo, ser contenido en un sepulcro,
      - libra a toda la humanidad de la muerte y concédele una inmortalidad gloriosa.
    - - Cristo, Hijo de Dios vivo, que colgado en la cruz prometiste el paraíso al ladrón arrepentido, mira con amor a los difuntos,
      - semejantes a ti por la muerte y la sepultura, y hazlos también semejantes a ti por su resurrección.
    respuesta: Señor, ten piedad de nosotros.
  padrenuestro_intro: 'Siguiendo la enseñanza de Jesucristo, que nos ha hecho hijos de Dios, digamos juntos a nuestro Padre:'
  oracion: Dios todopoderoso, cuyo Unigénito descendió al lugar de los muertos y salió victorioso del sepulcro, te pedimos que concedas a todos tus fieles, sepultados con Cristo por el bautismo, resucitar también con él a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: Cristo, por nosotros, se sometió incluso a la muerte, y una muerte de cruz; por eso Dios lo levantó sobre todo y le concedió el «Nombre-sobre-todo-nombre».
  responsorio:
  - - V
    - Resplandecerán los justos en presencia de Dios. Aleluia, aleluia.
  - - R
    - Resplandecerán los justos en presencia de Dios. Aleluia, aleluia.
  - - V
    - Y se alegrarán los rectos de corazón.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Resplandecerán los justos en presencia de Dios. Aleluia, aleluia.
Domingo de Pascua de la Resurrección del Señor:
  himno: Al fin será la paz y la corona
  preces:
    intro: 'Oremos a Cristo, el Señor, que murió y resucitó por los hombres, y ahora intercede por nosotros, y digámosle:'
    preces:
    - - Cristo, luz y salvación de todos los pueblos,
      - derrama el fuego del Espíritu Santo sobre los que has querido fueran testigos de tu resurrección en el mundo.
    - - Que el pueblo de Israel te reconozca como el Mesías de su esperanza
      - y la tierra toda se llene del conocimiento de tu gloria.
    - - Consérvanos, Señor, en la comunión de tu Iglesia
      - y haz que juntamente con todos nuestros hermanos obtengamos el premio y el descanso de nuestros trabajos.
    - - Tú que has vencido a la muerte, nuestro enemigo, destruye en nosotros el poder del mal, tu enemigo,
      - para que vivamos siempre para ti, vencedor inmortal.
    - - Cristo Salvador, tú que te hiciste obediente hasta la muerte y has sido elevado a la derecha del Padre,
      - recibe en tu reino glorioso a nuestros hermanos difuntos.
    respuesta: Cristo, Rey victorioso, escucha nuestra oración.
  oracion: Dios nuestro, que en este día nos abriste las puertas de la vida por medio de tu Hijo, vencedor de la muerte, concédenos a todos los que celebramos su gloriosa resurrección que, por la nueva vida que tu Espíritu nos comunica, lleguemos también nosotros a resucitar a la luz de la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Unamos nuestra oración a la de Jesús, nuestro abogado ante el Padre, y digamos como él nos enseñó:'
  ant_magnificat: 'La tarde de aquel mismo día, el primero de la semana, estando cerradas las puertas del lugar donde se hallaban los discípulos, se presentó Jesús; y en presencia de todos exclamó: «La paz sea con vosotros.» Aleluia.'
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Hb 10, 12-14
    texto: Cristo, habiendo ofrecido un solo sacrificio en expiación de los pecados, está sentado para siempre a la diestra de Dios, y espera el tiempo que falta «hasta que sus enemigos sean puestos por escabel de sus pies». Así, con una sola oblación, ha llevado para siempre a la perfección en la gloria a los que ha santificado.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Lunes de la Octava de Pascua:
  himno: Cantarán, llorarán razas y hombres
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Hb 8, 1b-3a
    texto: Tenemos un sumo sacerdote que está sentado a la diestra del trono de la Majestad en los cielos. Él es ministro del santuario y de la verdadera Tienda de Reunión, que fue fabricada por el Señor y no por hombre alguno. Todo sumo sacerdote es instituido para ofrecer oblaciones y sacrificios.
  ant_magnificat: 'Jesús salió al encuentro de las mujeres y les dijo: «Buenos días.» Ellas se acercaron y se abrazaron a sus pies. Aleluia.'
  preces:
    intro: 'Con espíritu gozoso, invoquemos a Cristo, a cuya humanidad dio vida el Espíritu Santo, haciéndolo fuente de vida para los hombres, y digámosle:'
    preces:
    - - Cristo, salvador del mundo y rey de la nueva creación, haz que, ya desde ahora, con el espíritu vivamos en tu reino,
      - donde estás sentado a la derecha del Padre.
    - - Señor, tú que vives en tu Iglesia hasta el fin de los tiempos,
      - condúcela por el Espíritu Santo al conocimiento de toda verdad.
    - - Que los enfermos, los moribundos y todos los que sufren encuentren luz en tu victoria,
      - y que tu gloriosa resurrección los consuele y los conforte.
    - - Al terminar este día, te ofrecemos nuestro homenaje, oh Cristo, luz imperecedera,
      - y te pedimos que con la gloria de tu resurrección ilumines a nuestros hermanos difuntos.
    respuesta: Renueva y da vida a todas las cosas, Señor.
  padrenuestro_intro: 'Porque Jesucristo nos ha hecho participar de su propia vida, somos hijos de Dios y por ello nos atrevemos a decir:'
  oracion: Dios nuestro, que haces crecer a tu Iglesia dándole continuamente nuevos hijos por el bautismo, concédenos ser siempre fieles en nuestra vida a la fe que en ese sacramento hemos recibido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Martes de la Octava de Pascua:
  himno: Nos reúne de nuevo el misterio
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: 1Pe 2, 4-5
    texto: Acercándoos al Señor, la piedra viva, rechazada por los hombres, pero escogida y apreciada por Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo.
  ant_magnificat: Mientras estaba llorando junto al sepulcro, vi a mi Señor. Aleluia.
  preces:
    intro: 'Aclamemos alegres a Cristo, que después de ser sepultado en el seno de la tierra resucitó gloriosamente a vida nueva, y digámosle confiados:'
    preces:
    - - 'Te rogamos, Señor, por los obispos, los presbíteros y los diáconos: que sirvan con celo a tu pueblo'
      - y lo conduzcan por los caminos del bien.
    - - 'Te rogamos, Señor, por los que sirven a tu Iglesia con el estudio de tu palabra:'
      - que escudriñen tu doctrina con pureza de corazón y deseo de adoctrinar a tu pueblo.
    - - 'Te rogamos, Señor, por todos los fieles de la Iglesia: que combatan bien el combate de la fe'
      - y, habiendo corrido hasta la meta, alcancen la corona merecida.
    - - Tú que en la cruz cancelaste la nota de cargo de nuestra deuda,
      - destruye también en nosotros toda clase de esclavitud y líbranos de toda tiniebla.
    - - Tú que al bajar al lugar de los muertos abriste las puertas del abismo,
      - recibe a nuestros hermanos difuntos en tu reino.
    respuesta: Rey de la gloria, escúchanos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Señor Dios, que nos has proporcionado el remedio de nuestros males por el misterio pascual, colma a tu pueblo de tus dones celestiales, para que alcance la perfecta libertad y llegue a gozar plenamente en el cielo de la alegría que ya ha comenzado a gustar en la tierra. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
