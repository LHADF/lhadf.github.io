Natividad del Señor:
  himno: Te diré mi amor, Rey mío
  salmodia:
  - ant: Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora.
    salmo: salmo-109-1-5-7
  - ant: Del Señor viene la misericordia y la redención copiosa.
    salmo: salmo-129
  - ant: En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo.
    salmo: cantico-col-1-12-20
  lectura:
    ref: 1Jn 1, 1-3
    texto: 'Lo que existía desde un principio, lo que hemos oído, lo que hemos visto con nuestros ojos, lo que contemplamos y lo que tocaron nuestras manos acerca de la Palabra de vida (porque la vida se ha manifestado, y nosotros hemos visto y testificamos y os anunciamos esta vida eterna, la que estaba con el Padre y se nos ha manifestado): lo que hemos visto y oído os lo anunciamos, a fin de que viváis en comunión con nosotros. Y esta nuestra comunión de vida es con el Padre y con su Hijo Jesucristo.'
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: 'Hoy ha nacido Jesucristo; hoy ha aparecido el Salvador; hoy en la tierra cantan los ángeles, se alegran los arcángeles; hoy saltan de gozo los justos, diciendo: «Gloria a Dios en el cielo.» Aleluia.'
  preces:
    intro: 'Aclamemos alegres a Cristo, ante cuyo nacimiento los ángeles anunciaron la paz a la tierra, y supliquémosle, diciendo:'
    preces:
    - - Tú que con el misterio de tu nacimiento consuelas a la Iglesia,
      - cólmala también de todos tus bienes.
    - - Tú que has venido como pastor supremo y obispo de nuestras vidas,
      - haz que el papa y todos los obispos sean buenos administradores de la múltiple gracia de Dios.
    - - Rey de la eternidad, tú que al nacer quisiste experimentar las limitaciones humanas, sometiéndote a la brevedad de una vida como la nuestra,
      - haz que nosotros, caducos y mortales, seamos partícipes de tu vida eterna.
    - - Tú que, esperado durante largos siglos, viniste en el tiempo de la historia señalado por tu Padre,
      - manifiesta tu presencia a los que todavía te están esperando.
    - - Tú que, hecho carne, restauraste la naturaleza humana deteriorada por la muerte,
      - concede la plena salvación a los difuntos.
    respuesta: Que tu nacimiento, Señor, traiga la paz a todos los hombres.
