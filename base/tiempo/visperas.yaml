IV Domingo de Cuaresma «Lætare» · I Vísperas:
  himno: Insigne defensor de nuestra causa
  preces:
    intro: 'Bendigamos al Señor, solícito y providente para con todos los hombres, e invoquémosle, diciendo:'
    preces:
    - - Señor, fuente de todo bien y origen de toda verdad, llena con tus dones a todos los obispos
      - y conserva en la doctrina de los apóstoles a los fieles que les han sido confiados.
    - - Que aquellos que se nutren con el mismo pan de vida vivan unidos en la caridad,
      - para que todos seamos uno en el cuerpo de tu Hijo.
    - - Que nos despojemos de nuestra vieja condición humana y de sus obras,
      - y nos renovemos a imagen de Cristo, tu Hijo.
    - - Concede a tu pueblo que por la penitencia obtenga el Perdón de sus pecados
      - y tenga parte en los méritos de Jesucristo.
    - - Haz que nuestros hermanos difuntos puedan alabarte eternamente en el cielo,
      - y que nosotros esperemos confiadamente unirnos a ellos en tu reino.
    respuesta: Salva, Señor, a los que has redimido.
  oracion: Señor Dios, que por tu Palabra hecha carne has reconciliado contigo admirablemente al género humano, haz que el pueblo cristiano se apreste a celebrar las próximas fiestas pascuales con una fe viva y con una entrega generosa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Pidamos a nuestro Padre, con las palabras que Cristo nos enseñó, que nos dé la fuerza que necesitamos para no caer en la tentación:'
  salmodia:
  - ant: Vamos a la casa del Señor, con alegría.
    salmo: salmo-121
  - ant: Despierta, tú que duermes, surge de entre los muertos; y Cristo con su luz te alumbrará.
    salmo: salmo-129
  - ant: Dios, por el gran amor con que nos amó, aún cuando estábamos muertos por nuestros pecados, nos vivificó con Cristo.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 2Co 6, 1-4a
    texto: 'Os exhortamos a que deis pruebas de no haber recibido en vano la gracia de Dios, pues dice él en la Escritura: «En el tiempo propicio te escuché, y te ayudé en el día de salvación.» Ahora es el tiempo propicio, ahora es el día de salvación. A nadie queremos dar nunca motivo de escándalo, a fin de no hacer caer en descrédito nuestro ministerio, antes al contrario, queremos acreditarnos siempre en todo como verdaderos servidores de Dios.'
