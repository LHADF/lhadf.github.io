  himno: Insigne defensor de nuestra causa
  preces:
    intro: 'Glorifiquemos a Cristo, el Señor, que ha querido ser nuestro Maestro, nuestro ejemplo y nuestro hermano, y supliquémosle, diciendo:'
    preces:
    - - Cristo, hecho en todo semejante a nosotros, excepto en el pecado, haz que nos alegremos con los que se alegran y sepamos llorar con los que están tristes,
      - para que nuestro amor crezca y sea verdadero.
    - - Concédenos saciar tu hambre en los hambrientos
      - y tu sed en los sedientos.
    - - Tú que resucitaste a Lázaro de la muerte,
      - haz que, por la fe y la penitencia, los pecadores vuelvan a la vida cristiana.
    - - Haz que todos, según el ejemplo de la Virgen María y de los santos,
      - sigan con más diligencia y perfección tus enseñanzas.
    - - Concédenos, Señor,
      - que nuestros hermanos difuntos sean admitidos a la gloria de la resurrección y gocen eternamente de tu amor.
    respuesta: Renueva, Señor, a tu pueblo.
  oracion: Te pedimos, Señor, que enciendas nuestros corazones en aquel mismo amor con que tu Hijo ama al mundo y que lo impulsó a entregarse a la muerte por salvarlo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Pidamos a nuestro Padre que nos dé la fuerza que necesitamos para no caer en la tentación:'
  salmodia:
  - ant: Pondré mi ley en sus corazones; yo seré su Dios, y ellos serán mi pueblo.
    salmo: salmo-140-1-9
  - ant: Todo lo estimo pérdida comparado con la excelencia del conocimiento de Cristo Jesús, mi Señor.
    salmo: salmo-141
  - ant: A pesar de ser Hijo, aprendió en sus padecimientos la obediencia.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 1Pe 1, 18-21
    texto: 'Ya sabéis con qué os rescataron: no con bienes efímeros, con oro o plata, sino a precio de la sangre de Cristo, el cordero sin defecto ni mancha. Ya de antes de la creación del mundo estaba él predestinado para eso; y al fin de los tiempos se ha manifestado por amor a vosotros. Por él creéis en Dios que lo resucitó de entre los muertos y lo glorificó. Así vuestra fe y esperanza se centran en Dios.'
