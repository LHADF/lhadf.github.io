    intro: 'Acudamos a nuestro Salvador, maravillosamente transfigurado ante sus discípulos en el monte santo, y digámosle con fe:'
    preces:
    - - 'Oh Cristo, que, antes de entregarte a la pasión, quisiste manifestar en tu cuerpo transfigurado la gloria de la resurrección futura, te pedimos por la Iglesia que sufre:'
      - que, en medio de las dificultades del mundo, viva transfigurada por la esperanza de tu victoria.
    - - 'Cristo, Señor nuestro, que tomando a Pedro, Santiago y Juan los llevaste contigo a un monte alto, te pedimos por el papa Francisco y por los obispos:'
      - que, llenos de aquella paz y alegría que son fruto de la esperanza en la resurrección, sirvan fielmente a tu pueblo.
    - - 'Cristo Jesús, que desde el monte santo hiciste brillar tu rostro sobre Moisés y Elías, te pedimos por Israel, el pueblo que hiciste tuyo desde tiempos antiguos:'
      - concédele que alcance la plenitud de la redención.
    - - 'Cristo, esperanza nuestra, que iluminaste al mundo entero cuando sobre ti amaneció la gloria del Creador, te pedimos por todos los hombres de buena voluntad:'
      - haz que caminen siempre siguiendo el resplandor de tu luz.
    - - Cristo, Salvador nuestro, que transformarás nuestro frágil cuerpo en cuerpo glorioso como el tuyo,
      - 'te pedimos por nuestros hermanos difuntos: transfórmalos a imagen tuya y admítelos ya en tu gloria.'
    respuesta: Ilumina, Señor, nuestras tinieblas.
  padrenuestro_intro: 'Llenos de esperanza, oremos al Padre como Cristo nos enseñó:'
  oracion: Señor Dios, que en la gloriosa transfiguración de Jesucristo confirmaste los misterios de la fe con el testimonio de Moisés y de Elías, y nos hiciste entrever en la gloria de tu Hijo la grandeza de nuestra definitiva adopción filial, haz que escuchemos siempre la voz de tu Hijo amado y lleguemos a ser un día sus coherederos en la gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVIII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Dios hizo llover maná para el pueblo, les dio pan del cielo. Aleluia.
  oracion: Señor, danos tu misericordia y atiende a las súplicas de tus hijos; concede la tranquilidad y la paz a los que nos gloriamos de tenerte como creador y como guía, y consérvalas en nosotros para siempre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVIII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: No os afanéis por los bienes de la tierra; su abundancia no es bastante para salvar la vida.
  oracion: Señor, danos tu misericordia y atiende a las súplicas de tus hijos; concede la tranquilidad y la paz a los que nos gloriamos de tenerte como creador y como guía, y consérvalas en nosotros para siempre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVIII Domingo del Tiempo Ordinario:
  oracion: Señor, danos tu misericordia y atiende a las súplicas de tus hijos; concede la tranquilidad y la paz a los que nos gloriamos de tenerte como creador y como guía, y consérvalas en nosotros para siempre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVIII Domingo del Tiempo Ordinario (A):
  ant_magnificat: Conmovido por la gente que lo seguía y escuchaba su palabra, Jesús les dio pan en abundancia.
XVIII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Trabajad no por el alimento perecedero, sino por el alimento que permanece y que da vida eterna.
XVIII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Si en verdad deseáis llegar a ser ricos, amad las riquezas verdaderas.
XIX Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Jesús subió a un monte apartado a orar y, llegada la noche, permaneció allí solo.
XIX Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Con la fuerza de aquella comida, Elías caminó cuarenta días y cuarenta noches hasta el monte de Dios.
XIX Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Estad alertas como los ciervos que están esperando a su amo.
XIX Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XIX Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XIX Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'Jesús extendió la mano para salvar a Pedro del agua, y le dijo: «Hombre de poca fe, ¿por qué has dudado?»'
XIX Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'Yo os lo aseguro con toda verdad: el que cree en mí tiene vida eterna. Aleluia.'
XIX Domingo del Tiempo Ordinario (C):
  ant_magnificat: Dichosos aquellos siervos, a quienes el amo a su llegada encuentra velando; os aseguro que los hará sentar a la mesa y se prestará a servirles.
XX Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Mi casa es casa de oración y así la llamarán todos los pueblos; a ella los traeré y en ella los alegraré.
XX Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Venid a comer de mi pan y a beber el vino que he mezclado; seguid el camino de la prudencia.
XX Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Sabéis juzgar el aspecto del cielo, ¿y no sois capaces de juzgar las señales de los tiempos mesiánicos?
XX Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios, que has preparado bienes invisibles para los que te aman, infunde el amor de tu nombre en nuestros corazones, para que, amándote en todo y sobre todas las cosas, consigamos tus promesas que superan todo deseo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XX Domingo del Tiempo Ordinario:
  oracion: Oh Dios, que has preparado bienes invisibles para los que te aman, infunde el amor de tu nombre en nuestros corazones, para que, amándote en todo y sobre todas las cosas, consigamos tus promesas que superan todo deseo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XX Domingo del Tiempo Ordinario (A):
  ant_magnificat: Mujer, grande es tu fe; que se cumpla lo que deseas.
XX Domingo del Tiempo Ordinario (B):
  ant_magnificat: Yo soy el pan vivo bajado del cielo. El que coma de este pan vivirá para siempre. Aleluia.
XX Domingo del Tiempo Ordinario (C):
  ant_magnificat: He venido a traer fuego al mundo, y ¡cuánto deseo que esté ya ardiendo!
XXI Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: 'Pondré en el hombro de mi siervo la llave de mi casa: lo que él abra nadie lo cerrará, lo que él cierre nadie lo abrirá.'
XXI Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: El Hijo del hombre ha subido al cielo, de donde había bajado; pan que da la vida al mundo.
XXI Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: '«Yo vendré para reunir a los pueblos de toda lengua: acudirán para ver mi gloria», dice el Señor.'
XXI Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor Dios, que unes en un mismo sentir los corazones de los que te aman, impulsa a tu pueblo a amar lo que pides y a desear lo que prometes, para que, en medio de la inestabilidad de las cosas humanas, estén firmemente anclados nuestros corazones en el deseo de la verdadera felicidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXI Domingo del Tiempo Ordinario:
  oracion: Señor Dios, que unes en un mismo sentir los corazones de los que te aman, impulsa a tu pueblo a amar lo que pides y a desear lo que prometes, para que, en medio de la inestabilidad de las cosas humanas, estén firmemente anclados nuestros corazones en el deseo de la verdadera felicidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXI Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'Yo te daré las llaves del reino de los cielos, Simón Pedro: todo lo que atares sobre la tierra será atado en el cielo, y todo lo que desatares sobre la tierra será desatado en el cielo.'
XXI Domingo del Tiempo Ordinario (B):
  ant_magnificat: Señor, ¿a quién vamos a ir? Tú tienes palabras de vida eterna; y nosotros hemos creído y sabemos que tú eres el Mesías, el Hijo de Dios. Aleluia.
XXI Domingo del Tiempo Ordinario (C):
  ant_magnificat: Vendrán muchos del oriente y del occidente a sentarse con Abraham, Isaac y Jacob en el reino de los cielos.
XXII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: El Hijo del hombre vendrá revestido de la gloria de su Padre, y entonces pagará a cada uno según su conducta.
XXII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Cumplid los preceptos del Señor, porque ellos son vuestra sabiduría y vuestra prudencia a los ojos de los pueblos.
XXII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Hazte pequeño en las grandezas humanas, y alcanzarás el favor de Dios; porque él revela sus secretos a los humildes.
XXII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios todopoderoso, de quien procede todo don perfecto, infunde en nuestros corazones el amor de tu nombre, para que, haciendo más religiosa nuestra vida, aumentes el bien en nosotros y con solicitud amorosa lo conserves. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXII Domingo del Tiempo Ordinario:
  oracion: Oh Dios todopoderoso, de quien procede todo don perfecto, infunde en nuestros corazones el amor de tu nombre, para que, haciendo más religiosa nuestra vida, aumentes el bien en nosotros y con solicitud amorosa lo conserves. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXII Domingo del Tiempo Ordinario (A):
  ant_magnificat: ¿De qué le sirve al hombre ganar todo el mundo, si arruina su vida?
XXII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Escuchad y comprended las tradiciones que el Señor os ha dado.
XXII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Cuando te inviten a una boda, ve a ponerte en el último puesto; el que te invitó te pondrá junto a sí, y será esto para ti un honor ante todos los comensales.
XXIII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Si tu hermano comete un pecado, ve y corrígele a solas. Si te hace caso, habrás ganado a tu hermano para Dios.
XXIII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: 'Los oídos de los sordos se abrirán y la lengua del mudo cantará: es Dios mismo quien nos viene a salvar. Aleluia.'
XXIII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: ¿Quién conocerá tu designio, si tú no le das la sabiduría enviando tu Santo Espíritu desde el cielo?
XXIII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIII Domingo del Tiempo Ordinario:
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIII Domingo del Tiempo Ordinario (A):
  ant_magnificat: «Donde estén dos o tres reunidos en mi nombre, allí estoy yo en medio de ellos», dice el Señor.
XXIII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Todo lo ha hecho bien, ha hecho oír a los sordos y hablar a los mudos. Aleluia.
XXIII Domingo del Tiempo Ordinario (C):
  ant_magnificat: «El que no carga su cruz para venir en pos de mí no puede ser mi discípulo», dice el Señor.
XXIV Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Recuerda la alianza del Señor, y perdona las ofensas de tu prójimo.
XXIV Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Nuestra gloria es la cruz de nuestro Señor Jesucristo.
XXIV Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: 'Haced fiesta y alegraos: tu hermano había muerto y ha vuelto a la vida, se había perdido y lo hemos hallado.'
XXIV Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor Dios, creador y soberano de todas las cosas, vuelve a nosotros tus ojos de bondad y haz que te sirvamos con todo el corazón, para que experimentemos los efectos de tu misericordia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIV Domingo del Tiempo Ordinario:
  oracion: Señor Dios, creador y soberano de todas las cosas, vuelve a nosotros tus ojos de bondad y haz que te sirvamos con todo el corazón, para que experimentemos los efectos de tu misericordia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIV Domingo del Tiempo Ordinario (A):
  ant_magnificat: «No debes perdonar hasta siete veces, sino hasta setenta veces siete», dice el Señor.
XXIV Domingo del Tiempo Ordinario (B):
  ant_magnificat: «El que pierda su vida por mí y por el Evangelio la salvará», dice el Señor.
XXIV Domingo del Tiempo Ordinario (C):
  ant_magnificat: Hay gran alegría entre los ángeles de Dios, por un solo pecador que se arrepiente.
XXV Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: «Como el cielo es más alto que la tierra, mis caminos son más altos que los vuestros», dice el Señor.
XXV Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Todo el que acoge a uno de estos niños por amor a mí me acoge a mí en persona y a aquel que me ha enviado.
XXV Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Granjeaos amigos con estas riquezas de pecado; para que, cuando vengan ellas a faltar, haya quien os reciba en las moradas eternas.
XXV Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios, has hecho del amor a ti y a los hermanos la plenitud de la ley; concédenos cumplir tus mandamientos y llegar así a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXV Domingo del Tiempo Ordinario:
  oracion: Oh Dios, has hecho del amor a ti y a los hermanos la plenitud de la ley; concédenos cumplir tus mandamientos y llegar así a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXV Domingo del Tiempo Ordinario (A):
  ant_magnificat: «Id también vosotros a mi viña y os daré lo que sea justo», dice el Señor.
XXV Domingo del Tiempo Ordinario (B):
  ant_magnificat: «El mayor de entre vosotros hágase el servidor de todos —dice el Señor—, pues el que se humilla será levantado.» Aleluia.
XXV Domingo del Tiempo Ordinario (C):
  ant_magnificat: Nadie puede servir a dos señores; no podéis servir a Dios y al dinero.
XXVI Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: «Si el malvado recapacita y se convierte de los delitos cometidos, ciertamente vivirá», dice el Señor.
XXVI Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: ¡Ojalá que todo el pueblo del Señor fuera profeta y recibiera el espíritu del Señor!
XXVI Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Si no quieren hacer caso a Moisés y a los profetas, tampoco se dejarán convencer aunque resucite un muerto.
XXVI Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor Dios, que manifiestas tu poder de una manera admirable sobre todo cuando perdonas y ejerces tu misericordia, infunde constantemente tu gracia en nosotros, para que, tendiendo hacia lo que nos prometes, consigamos los bienes celestiales. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVI Domingo del Tiempo Ordinario:
  oracion: Señor Dios, que manifiestas tu poder de una manera admirable sobre todo cuando perdonas y ejerces tu misericordia, infunde constantemente tu gracia en nosotros, para que, tendiendo hacia lo que nos prometes, consigamos los bienes celestiales. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVI Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'No todo el que me diga: «Señor, Señor», entrará en el reino de los cielos, sino el que cumpla la voluntad de mi Padre celestial. Aleluia.'
XXVI Domingo del Tiempo Ordinario (B):
  ant_magnificat: «Todo aquel que os dé a beber un vaso de agua por el hecho de que sois de Cristo, yo os aseguro que de ninguna manera perderá su recompensa», dice el Señor.
XXVI Domingo del Tiempo Ordinario (C):
  ant_magnificat: Hijo, recuerda que ya recibiste tus bienes durante tu vida; Lázaro, en cambio, recibió males. Ahora él recibe aquí consuelo, y tú tormento.
XXVII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: La viña del Señor de los ejércitos es la casa de Israel. Aleluia.
XXVII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: El hombre se unirá a su mujer y serán los dos una sola carne. ¡Gran misterio es éste! Y yo lo refiero a Cristo y a la Iglesia.
XXVII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: He aquí que sucumbe quien no tiene el alma recta, pero el justo vivirá por su fe.
XXVII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios todopoderoso y eterno, que con la magnificencia de tu amor sobrepasas los méritos y aun los deseos de los que te suplican, derrama sobre nosotros tu misericordia, para que libres nuestra conciencia de toda inquietud y nos concedas aun aquello que no nos atrevemos a pedir. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVII Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, que con la magnificencia de tu amor sobrepasas los méritos y aun los deseos de los que te suplican, derrama sobre nosotros tu misericordia, para que libres nuestra conciencia de toda inquietud y nos concedas aun aquello que no nos atrevemos a pedir. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVII Domingo del Tiempo Ordinario (A):
  ant_magnificat: A los malvados les dará una muerte afrentosa, y arrendará su viña a otros viñadores que le entreguen los frutos a su tiempo.
XXVII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Dejad que los niños vengan a mí, porque de los que son como ellos es el reino de los cielos.
XXVII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Somos solamente tus siervos, Señor; no hemos hecho más que lo que teníamos que hacer.
XXVIII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Dios ha preparado para todos los pueblos un festín. Aleluia.
XXVIII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: ¡Qué difícilmente entrarán en el reino de Dios los que poseen riquezas!
XXVIII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: ¿No ha vuelto ninguno a dar gloria a Dios, sino este extranjero? Levántate y vete; tu fe te ha salvado.
XXVIII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Te pedimos, Señor, que tu gracia continuamente nos preceda y acompañe, de manera que estemos dispuestos a obrar siempre el bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVIII Domingo del Tiempo Ordinario:
  oracion: Te pedimos, Señor, que tu gracia continuamente nos preceda y acompañe, de manera que estemos dispuestos a obrar siempre el bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVIII Domingo del Tiempo Ordinario (A):
  ant_magnificat: A la hora de la cena el Señor llama a todos los invitados:«Venid, que ya está todo preparado.» Aleluia.
XXVIII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Vosotros, que lo habéis dejado todo y me habéis seguido, recibiréis el ciento por uno y poseeréis la vida eterna.
XXVIII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Uno de los leprosos curados por Jesús volvió sobre sus pasos, glorificando a Dios a grandes voces.
XXIX Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: De oriente a occidente no hay otro dios fuera de mí. Yo soy el Señor y no hay otro.
XXIX Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: «Vosotros beberéis del cáliz que yo he de beber y recibiréis el bautismo que yo he de recibir», dice el Señor.
XXIX Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Moisés sostuvo en alto las manos hasta la puesta del sol.
XXIX Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIX Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIX Domingo del Tiempo Ordinario (A):
  ant_magnificat: Dad al César lo que es del César, y a Dios lo que es de Dios. Aleluia.
XXIX Domingo del Tiempo Ordinario (B):
  ant_magnificat: El Hijo del hombre ha venido a servir y a dar su vida en rescate por las multitudes.
XXIX Domingo del Tiempo Ordinario (C):
  ant_magnificat: Cuando venga el Hijo del hombre, ¿encontrará fe sobre la tierra?
XXX Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: La caridad no hace nada malo al prójimo; así que amar es cumplir la ley entera.
XXX Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: El Señor salva a su pueblo, conduce al ciego y al cojo por un camino llano. Aleluia.
XXX Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: El Señor recibe benévolamente a los que le honran; los gritos del pobre atraviesan las nubes.
XXX Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXX Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXX Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'El principal mandamiento es éste: Amarás al Señor, tu Dios, con todo tu corazón. Aleluia.'
XXX Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'Jesús dijo al ciego: «Anda, tu fe te ha salvado.» Al instante recobró la vista y fue siguiéndolo.'
XXX Domingo del Tiempo Ordinario (C):
  ant_magnificat: El publicano bajó a su casa justificado, porque todo aquel que se exalta será humillado, y el que se humilla será exaltado.
XXXI Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: El que se exalta será humillado, y el que se humilla será exaltado.
XXXI Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: El Señor, Dios nuestro, es el único. Ama al Señor, tu Dios, con todo tu corazón, con toda tu alma, con toda tu mente y con todas tus fuerzas. Guarda en tu corazón sus mandamientos.
XXXI Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Amas a todos los seres, Señor, y nada de lo que hiciste aborreces; para que todos se aparten del mal y crean en ti, Dios nuestro.
XXXI Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXI Domingo del Tiempo Ordinario:
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXI Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'Uno solo es vuestro maestro, el que está en el cielo: Cristo, el Señor.'
XXXI Domingo del Tiempo Ordinario (B):
  ant_magnificat: Ama al Señor, tu Dios, con todo tu corazón, ama a tu prójimo como a ti mismo. No existe otro mandamiento mayor que estos dos.
XXXI Domingo del Tiempo Ordinario (C):
  ant_magnificat: El Hijo del hombre ha venido a buscar y a salvar lo que estaba perdido.
XXXII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Aunque el esposo tarde, velad, porque no sabéis el día ni la hora.
XXXII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: 'Esta mujer ha dado todo su sustento al Señor: y no le falta lo necesario para vivir.'
XXXII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Vale la pena morir a manos de los hombres, cuando se espera que Dios mismo nos resucitará.
XXXII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXII Domingo del Tiempo Ordinario:
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXII Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'A medianoche se oyó una voz que decía: «Mirad, el Esposo viene, salid a su encuentro.»'
XXXII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Ésta pobre viuda ha dado más que todos, porque de su misma pobreza ha dado todo lo que tenía.
XXXII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Dios no es un Dios de muertos, sino de vivos, pues para él todos viven. Aleluia.
XXXIII Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: «Al que tiene se le dará, y tendrá abundante, pero al que no tiene se le quitará hasta lo que tiene», dice el Señor.
XXXIII Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: El cielo y la tierra pasarán, pero mis palabras no pasarán.
XXXIII Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: «A los que respetan mi nombre los alumbraré con el sol de la justicia», dice el Señor.
XXXIII Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXIII Domingo del Tiempo Ordinario:
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXIII Domingo del Tiempo Ordinario (A):
  ant_magnificat: Muy bien, siervo bueno, ya que has sido fiel en lo poco, entra a participar en el gozo de tu Señor.
XXXIII Domingo del Tiempo Ordinario (B):
  ant_magnificat: Verán venir al Hijo del hombre sobre las nubes del cielo con gran poder y majestad.
XXXIII Domingo del Tiempo Ordinario (C):
  ant_magnificat: «Con vuestra perseverancia salvaréis vuestras vidas», dice el Señor.
