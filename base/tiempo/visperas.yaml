II Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Éste es el Cordero de Dios que quita el pecado del mundo. Aleluia.
II Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Al oír las palabras de Juan Bautista, dos de los discípulos siguieron al Señor.
II Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: ¡Oh boda feliz de Caná de Galilea, en la que estaba invitado Jesús, con María, su madre!
II Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios todopoderoso y eterno, que gobiernas a un tiempo cielo y tierra, escucha paternalmente las súplicas de tu pueblo y haz que los días de nuestra vida transcurran en tu paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
II Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, que gobiernas a un tiempo cielo y tierra, escucha paternalmente las súplicas de tu pueblo y haz que los días de nuestra vida transcurran en tu paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
II Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'Juan, testigo de la luz, dice: «Jesús es el Hijo de Dios.»'
II Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'Andrés dijo a Simón Pedro: «Hemos dado con el Mesías.»Y lo presentó a Jesús.'
II Domingo del Tiempo Ordinario (C):
  ant_magnificat: En Caná de Galilea dio Jesús la primera señal por la que reveló su gloria.
III Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Iba Jesús proclamando la Buena Noticia del reino y sanaba todas las enfermedades de la gente.
III Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: «Se ha cumplido el tiempo y está cerca el reino de Dios», dice el Señor.
III Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: El sábado, según su costumbre, Jesús entró en la sinagoga a leer las palabras de los profetas.
III Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios todopoderoso y eterno, dirige nuestras acciones según tu voluntad, para que, invocando el nombre de tu Hijo, abundemos en buenas obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
III Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, dirige nuestras acciones según tu voluntad, para que, invocando el nombre de tu Hijo, abundemos en buenas obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
III Domingo del Tiempo Ordinario (A):
  ant_magnificat: Dejando al momento las redes, los discípulos siguieron a Jesús.
III Domingo del Tiempo Ordinario (B):
  ant_magnificat: «Venid en pos de mí —dice el Señor—, y os haré pescadores de hombres.»
III Domingo del Tiempo Ordinario (C):
  ant_magnificat: Hoy tiene su cumplimiento ante vuestros ojos lo que habéis oído contar de mí en las palabras de la Escritura.
IV Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Sentado Jesús en lo alto, sobre la montaña, enseñaba al pueblo, y sus discípulos lo rodeaban.
IV Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Estaban todos admirados de la doctrina de Jesús, pues les enseñaba como quien tiene autoridad.
IV Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Todos se maravillaban de las palabras que salían de la boca de Dios.
IV Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Concédenos, Señor, Dios nuestro, venerarte con toda el alma y amar a todos los hombres con afecto espiritual. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo del Tiempo Ordinario:
  oracion: Concédenos, Señor, Dios nuestro, venerarte con toda el alma y amar a todos los hombres con afecto espiritual. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo del Tiempo Ordinario (A):
  ant_magnificat: Dichosos los que obran la paz, porque ellos serán llamados hijos de Dios.
IV Domingo del Tiempo Ordinario (B):
  ant_magnificat: La fama de Jesús se extendió rápidamente por todas partes en el país de Galilea, y todos glorificaban a Dios.
IV Domingo del Tiempo Ordinario (C):
  ant_magnificat: Querían matar a Jesús, pero él, atravesando por medio de ellos, siguió su camino.
V Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Sed como la luz que alumbra a todos los que están en la casa.
V Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Llegada la tarde, después de haberse puesto el sol, le presentaron a Jesús todos los enfermos y poseídos por el demonio, y él los curó.
V Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: La gente se agolpaba sobre Jesús, para escuchar la palabra de Dios.
V Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
V Domingo del Tiempo Ordinario:
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
V Domingo del Tiempo Ordinario (A):
  ant_magnificat: Vosotros, mis discípulos, sois la sal de la tierra y la luz del mundo.
V Domingo del Tiempo Ordinario (B):
  ant_magnificat: Para eso he venido, para traer a todos el mensaje de la salvación.
V Domingo del Tiempo Ordinario (C):
  ant_magnificat: «Apártate de mí, Señor, que soy un hombre pecador.» «Ten ánimo, Simón. De hoy en adelante vas a ser pescador de hombres.»
VI Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Si vuestra virtud no es superior a la de los escribas y fariseos, no entraréis en el reino de los cielos.
VI Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Jesús tocó con la mano al leproso y al instante desapareció la lepra.
VI Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Dichosos vosotros, los pobres, porque vuestro es el reino de Dios. Dichosos los que ahora padecéis hambre, porque seréis saciados.
VI Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VI Domingo del Tiempo Ordinario:
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VI Domingo del Tiempo Ordinario (A):
  ant_magnificat: Quien cumpla y enseñe mi ley será grande en el reino de los cielos.
VI Domingo del Tiempo Ordinario (B):
  ant_magnificat: El leproso curado proclamaba ante todo el mundo las maravillas del Señor.
VI Domingo del Tiempo Ordinario (C):
  ant_magnificat: Dichosos seréis cuando los hombres os aborrezcan, a causa del Hijo del hombre; alegraos entonces y saltad de gozo, porque será grande en el cielo vuestra recompensa.
Miércoles de Ceniza:
  himno: Heme, Señor, a tus divinas plantas
  lectura:
    ref: Flp 2, 12b-15a
    texto: Trabajad por vuestra salvación con respeto y seriedad. Porque es Dios el que obra en vosotros haciendo que queráis y obréis movidos por lo que a él le agrada. Hacedlo todo sin murmuraciones ni discusiones, a fin de que seáis irreprensibles y sencillos, hijos de Dios sin mancha.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
    - Señor, ten misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Cuando des limosna, que no sepa tu mano izquierda lo que hace tu derecha.
  preces:
    intro: 'Demos gracias a Dios Padre, que estableció en la sangre de Cristo una alianza nueva y eterna con su pueblo y la renueva en el sacramento del altar, y supliquémosle, diciendo:'
    preces:
    - - Dirige, Señor, el sentir de los pueblos y la mente de sus gobernantes por los caminos de tu voluntad,
      - para que procuren con empeño el bien común.
    - - Aumenta el fervor de aquellos que, habiéndolo dejado todo, siguieron a Cristo,
      - para que su vida sea luz para los hombres y claro testimonio de la santidad de tu Iglesia.
    - - Tú que creaste a todos los hombres a imagen tuya,
      - haz que sintamos horror de las injusticias y desigualdades entre los hombres.
    - - Llama a tu amistad y a tu verdad a los que viven alejados de ti,
      - y a nosotros enséñanos cómo podemos ayudarlos.
    - - Admite a los difuntos en tu gloria,
      - para que te alaben eternamente.
    respuesta: Bendice, Señor, a tu pueblo.
  padrenuestro_intro: 'Ya que por Jesucristo somos hijos de Dios, digamos confiados a nuestro Padre:'
  oracion: 'Al empezar esta Cuaresma, te pedimos, Señor, que nos des un verdadero espíritu de conversión: así la austeridad de la penitencia de estos días nos servirá de ayuda en nuestra lucha contra el espíritu del mal. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
Jueves después de Ceniza:
  himno: Señor, la luz del día ya se apaga
  lectura:
    ref: St 4, 7-8. 10
    texto: Vivid sometidos a Dios. Resistid al diablo y huirá de vosotros. Acercaos a Dios y él se acercará a vosotros. Pecadores, lavaos las manos; purificad vuestros corazones, gente que obráis con doblez. Humillaos en la presencia del Señor y él os ensalzará.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
    - Señor, ten misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: «Quien pierda su vida por amor a mí la salvará para siempre», dice el Señor.
  preces:
    intro: 'Celebremos la misericordia de Dios, que nos ilumina con la gracia del Espíritu Santo para que nuestra vida resplandezca con obras de fe y santidad, y supliquémosle, diciendo:'
    preces:
    - - Señor, fuente y autor de toda santidad, haz que los obispos, sacerdotes y diáconos, al participar de la mesa eucarística, se unan más plenamente a Cristo,
      - para que vean renovada la gracia que les fue conferida por la imposición de manos.
    - - Impulsa a tus fieles para que, con santidad de vida, participen activamente de la mesa de la palabra y del cuerpo de Cristo
      - y vivan lo que han recibido por la fe y los sacramentos.
    - - Concédenos, Señor, que reconozcamos la dignidad de todo hombre redimido con la sangre de tu Hijo
      - y que respetemos su libertad y su conciencia
    - - Haz que todos los hombres sepan moderar sus deseos de bienes temporales
      - y que atiendan a las necesidades de los demás.
    - - Acuérdate, Señor,
      - de todos los que has llamado hoy a la eternidad y concédeles el don de la eterna bienaventuranza.
    respuesta: Renueva, Señor, al pueblo redimido por Cristo.
  padrenuestro_intro: 'Invoquemos a Dios Padre con la oración que nos enseñó Jesús:'
  oracion: Tu gracia, Señor, inspire nuestras acciones, las sostenga y acompañe, para que todo nuestro trabajo cuaresmal brote de ti, como una fuente, y a ti tienda, como a su fin. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes después de Ceniza:
  himno: Muere la vida y vivo yo sin vida
  lectura:
    ref: St 5, 16. 19-20
    texto: Confesaos mutuamente vuestros pecados y rogad unos por otros, para alcanzar vuestra curación, pues la oración ferviente del justo tiene gran eficacia. Hermanos, si alguno de entre vosotros se desvía de la verdad y otro logra convertirlo, sepa que quien convierte a un pecador de su camino equivocado salvará su alma de la muerte y cubrirá la multitud de sus pecados.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
    - Señor, ten misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Vendrán días en que se les quitará el esposo y entonces los invitados a las bodas ayunarán.
  preces:
    intro: 'Adoremos al Salvador de los hombres, que muriendo destruyó la muerte y resucitando restauró la vida, y digámosle humildemente:'
    preces:
    - - Redentor nuestro, concédenos que, por la penitencia, nos unamos más plenamente a tu pasión,
      - para que consigamos la gloria de la resurrección.
    - - Concédenos que imitemos a tu Madre, consuelo de los afligidos,
      - para que podamos consolar a los tristes, mediante el consuelo con que nosotros somos por ti consolados.
    - - Concede a tus fieles participar en tu pasión por medio de sus sufrimientos,
      - para que tu salvación se manifieste también en ellos.
    - - Tú que te humillaste, haciéndote obediente hasta la muerte y una muerte de cruz,
      - enséñanos a ser obedientes y a tener paciencia.
    - - Dígnate transfigurar a los difuntos a semejanza de tu cuerpo glorioso
      - y concédenos a nosotros ser un día partícipes de la gloria de ellos.
    respuesta: Santifica, Señor, al pueblo que redimiste con tu sangre.
  padrenuestro_intro: 'Ya que por Jesucristo somos hijos de Dios, oremos confiados a nuestro Padre:'
  oracion: Te pedimos, Señor, que nos ayudes a continuar animosos estos días de penitencia que acabamos de empezar y que nuestras prácticas externas de penitencia estén siempre acompañadas por la sinceridad de un corazón que desea convertirse. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
I Domingo de Cuaresma · I Vísperas:
  responsorio:
  - - V
    - Escúchanos, Señor, y ten piedad, porque hemos pecado contra ti.
  - - R
    - Escúchanos, Señor, y ten piedad, porque hemos pecado contra ti.
  - - V
    - Cristo, oye los ruegos de los que te suplicamos.
  - - R
    - Porque hemos pecado contra ti.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Escúchanos, Señor, y ten piedad, porque hemos pecado contra ti.
  himno: Insigne defensor de nuestra causa
  preces:
    intro: 'Glorifiquemos a Cristo, el Señor, que ha querido ser nuestro Maestro, nuestro ejemplo y nuestro hermano, y supliquémosle, diciendo:'
    preces:
    - - Cristo, hecho en todo semejante a nosotros, excepto en el pecado, haz que nos alegremos con los que se alegran y sepamos llorar con los que están tristes,
      - para que nuestro amor crezca y sea verdadero.
    - - Concédenos saciar tu hambre en los hambrientos
      - y tu sed en los sedientos.
    - - Tú que resucitaste a Lázaro de la muerte,
      - haz que, por la fe y la penitencia, los pecadores vuelvan a la vida cristiana.
    - - Haz que todos, según el ejemplo de la Virgen María y de los santos,
      - sigan con más diligencia y perfección tus enseñanzas.
    - - Concédenos, Señor,
      - que nuestros hermanos difuntos sean admitidos a la gloria de la resurrección y gocen eternamente de tu amor.
    respuesta: Renueva, Señor, a tu pueblo.
  oracion: 'Te pedimos, Señor todopoderoso, que las celebraciones y las penitencias de esta Cuaresma nos ayuden a progresar en el camino de nuestra conversión: así conoceremos mejor y viviremos con mayor plenitud las riquezas inagotables del misterio de Cristo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
  padrenuestro_intro: 'Pidamos a nuestro Padre que nos dé la fuerza que necesitamos para no caer en la tentación:'
  ant_magnificat: No sólo de pan vive el hombre, sino de toda palabra que sale de la boca de Dios.
  salmodia:
  - ant: Con espíritu humilde y corazón contrito te seamos aceptos; que este sea hoy nuestro sacrificio, y que sea agradable en tu presencia, Señor, Dios nuestro.
    salmo: salmo-140-1-9
  - ant: 'Entonces clamarás al Señor y él te responderá, gritarás y él te dirá: «Aquí estoy.»'
    salmo: salmo-141
  - ant: Cristo murió por nuestros pecados, el justo por los injustos, para llevarnos a Dios; muerto en la carne, pero vivificado en el espíritu.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 2Co 6, 1-4a
    texto: 'Os exhortamos a que deis pruebas de no haber recibido en vano la gracia de Dios, pues dice él en la Escritura: «En el tiempo propicio te escuché, y te ayudé en el día de salvación.» Ahora es el tiempo propicio, ahora es el día de salvación. A nadie queremos dar nunca motivo de escándalo, a fin de no hacer caer en descrédito nuestro ministerio, antes al contrario, queremos acreditarnos siempre en todo como verdaderos servidores de Dios.'
