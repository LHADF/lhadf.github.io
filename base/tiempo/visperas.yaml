XIII Domingo del Tiempo Ordinario (A):
  ant_magnificat: Quien quiera conservar su vida la perderá, quien por mi causa la perdiere la encontrará.
XIII Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'Entrando en la casa Jesús dijo: «La niña no está muerta; está durmiendo.» La tomó de la mano y exclamó: «Niña, yo te lo mando, levántate.»'
XIII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Nadie que pone la mano en el arado y mira atrás es apto para el reino de Dios.
XIV Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Tomad sobre vosotros mi yugo, y aprended de mí que soy manso y humilde de corazón.
XIV Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Jesús recorría las aldeas y predicaba en las sinagogas.
XIV Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: La mies es mucha y los operarios son pocos. Rogad, pues, al dueño de la mies que envíe trabajadores a ella.
XIV Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios, que por medio de la humillación de tu Hijo levantaste a la humanidad caída, conserva a tus fieles en continua alegría y concede los gozos del cielo a quienes has librado de la muerte eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
