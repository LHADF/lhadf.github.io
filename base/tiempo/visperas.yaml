    intro: 'Glorifiquemos a Cristo, bendito por los siglos, y pidámosle que envíe el Espíritu Santo a los que ha redimido con su muerte y resurrección; digamos:'
    preces:
    - - Envía a la Iglesia el Espíritu de la unidad,
      - para que desaparezcan todas las disensiones, odios y divisiones.
    - - Tú que libraste a los hombres del dominio de Satanás,
      - libra también al mundo de los males que lo afligen.
    - - Tú que, dócil al Espíritu Santo, diste cumplimiento a tu misión,
      - haz que los sacerdotes encuentren en la oración la fuerza y la luz del Espíritu, para ser fieles a su ministerio.
    - - Que tu Espíritu guíe a los gobernantes,
      - para que busquen y realicen el bien común.
    - - Tú que vives en la gloria del Padre,
      - acoge a los difuntos en tu reino.
    respuesta: Salva, Señor, a los que has redimido.
  padrenuestro_intro: 'Llenos de fe, invoquemos juntos al Padre, repitiendo la oración que Cristo nos enseñó:'
  oracion: Tu Espíritu, Señor, infunda en nosotros la fuerza de sus dones, para que nuestros pensamientos te sean gratos y nuestra voluntad esté siempre sometida a la tuya. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la VII semana de Pascua:
  himno: Ven, Creador, Espíritu amoroso
  salmodia:
