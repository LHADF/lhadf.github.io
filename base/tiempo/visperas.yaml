  ant_magnificat: El Espíritu de verdad, que procede del Padre, él mismo declarará en mi favor; y también vosotros seréis testigos. Aleluia.
  preces:
    intro: 'Llenos de gozo, oremos a Cristo, el Señor, que con su resurrección ha iluminado al mundo entero, y digámosle:'
    preces:
    - - Señor Jesús, que te hiciste compañero de camino de los discípulos que dudaban de ti,
      - acompaña también a tu Iglesia peregrina entre las dificultades e incertidumbres de esta vida.
    - - No permitas que tus fieles sean tardos y necios para creer,
      - y aumenta su fe para que te proclamen vencedor de la muerte.
    - - Mira, Señor, con bondad a cuantos no te reconocieron en su camino,
      - y manifiéstate a ellos para que te confiesen como salvador suyo.
    - - Tú que por la cruz reconciliaste a todos los hombres, uniéndolos, en tu cuerpo,
      - concede la paz y la unidad a las naciones.
    - - Tú que eres el juez de vivos y muertos,
      - otorga a los difuntos que creyeron en ti la remisión de todas sus culpas.
    respuesta: Cristo, vida nuestra, escúchanos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Te pedimos, Señor, que los dones recibidos en esta Pascua den fruto abundante en toda nuestra vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la VI semana de Pascua:
  himno: Nos reúne de nuevo el misterio
  salmodia:
  - ant: Aspirad a los bienes de arriba, no a los de la tierra. Aleluia.
    salmo: salmo-48-i
  - ant: El Señor me salva de las garras del abismo. Aleluia.
    salmo: salmo-48-ii
  - ant: Tuyos son, Señor, el poder y la riqueza, la fuerza y la gloria. Aleluia.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1Pe 2, 4-5
    texto: Acercándoos al Señor, la piedra viva, rechazada por los hombres, pero escogida y apreciada por Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo.
  responsorio:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
