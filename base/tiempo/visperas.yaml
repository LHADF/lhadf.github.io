Miércoles de la Octava de Pascua:
  himno: Hoy rompe la clausura
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Hb 7, 24-27
    texto: 'Jesús, como permanece para siempre, tiene un sacerdocio eterno. De aquí que tiene poder para llevar a la salvación definitiva a cuantos por él se vayan acercando a Dios, porque vive para siempre para interceder por ellos. Y tal era precisamente el sumo sacerdote que nos convenía: santo, sin maldad, sin mancha, excluido del número de los pecadores y exaltado más alto que los cielos. No tiene necesidad, como los sumos sacerdotes, de ofrecer víctimas cada día, primero por sus propios pecados y luego por los del pueblo. Esto lo hizo una vez por todas, ofreciéndose a sí mismo.'
  ant_magnificat: Entró Jesús y se quedó con ellos; y, estando juntos a la mesa, tomó el pan y, rezada la bendición, lo partió y se lo dio. Aleluia.
  preces:
    intro: 'Oremos a Cristo, que resucitó de entre los muertos y está sentado a la derecha del Padre, y digámosle:'
    preces:
    - - Acuérdate, Señor, de los que se han consagrado a tu servicio,
      - que sean para tu pueblo ejemplo de santidad.
    - - Concede, Señor, el espíritu de justicia a los que gobiernan las naciones
      - y haz que trabajen en bien de la paz, para que todos podamos vivir según tu ley.
    - - Concede la paz a nuestros días
      - y multiplica los bienes de la tierra, para que los pobres puedan gozar de las riquezas de tu bondad.
    - - Cristo salvador, que con tu triunfo has iluminado el mundo entero y con tu resurrección has dado a los hombres una prenda de su inmortalidad,
      - concede la luz eterna a nuestros hermanos difuntos.
    respuesta: Cristo, que vives por siempre para interceder por los hombres, escucha nuestra oración.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Dios nuestro, que todos los años nos alegras con la solemnidad de la resurrección del Señor, concédenos que la celebración de estas fiestas aquí en la tierra nos lleve a gozar de la eterna alegría en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
  responsorio:
