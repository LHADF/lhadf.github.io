  himno: Éste es el tiempo en que llegas
  preces:
    intro: 'Invoquemos a Cristo, alegría y júbilo de cuantos esperan su llegada, y digámosle:'
    preces:
    - - Esperamos alegres tu venida,
      - ven, Señor Jesús.
    - - Tú que existes antes de los tiempos,
      - ven y salva a los que viven en el tiempo.
    - - Tú que creaste el mundo y a todos los que en él habitan,
      - ven a restaurar la obra de tus manos.
    - - Tú que no despreciaste nuestra naturaleza mortal,
      - ven y arráncanos del dominio de la muerte.
    - - Tú que viniste para que tuviéramos vida abundante,
      - ven y danos tu vida eterna.
    - - Tú que quieres congregar a todos los hombres en tu reino,
      - ven y reúne a cuantos desean contemplar tu rostro.
    respuesta: Ven, Señor, y no tardes más.
  oracion: Señor, despierta en tus fieles el deseo de prepararse a la venida de Cristo por la práctica de las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino celestial. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Pidamos ahora con grande confianza la venida del reino de Dios, con las palabras que Cristo nos enseñó:'
  ant_magnificat: 'Mirad: el Señor viene de lejos y su resplandor ilumina toda la tierra.'
  salmodia:
  - ant: 'Anunciad a los pueblos y decidles: «Mirad, viene Dios, nuestro Salvador.»'
    salmo: salmo-140-1-9
  - ant: 'Mirad: el Señor vendrá y todos sus santos vendrán con él; en aquel día habrá una gran luz. Aleluia.'
    salmo: salmo-141
  - ant: Vendrá el Señor con gran poder y lo contemplarán todos los hombres.
    salmo: cantico-flp-2-6-11
