Jueves de la Octava de Pascua:
  himno: Es la Pascua real, no ya la sombra
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: 1Pe 3, 18. 21b-22
    texto: 'Cristo murió por los pecados una vez para siempre: el inocente por los culpables, para conduciros a Dios. Como era hombre, lo mataron; pero, como poseía el Espíritu, fue devuelto a la vida. Lo que actualmente os salva no consiste en limpiar una suciedad corporal, sino en impetrar de Dios una conciencia pura, por la resurrección de Jesucristo, que llegó al cielo, se le sometieron ángeles autoridades y poderes, y está a la derecha de Dios.'
  ant_magnificat: Mirad mis manos y mis pies; soy yo. Aleluia.
  preces:
    intro: 'Glorifiquemos a Cristo, resucitado de entre los muertos como primicia de los que se han dormido, y supliquémosle, diciendo:'
    preces:
    - - 'Acuérdate, Señor, de tu Iglesia santa, edificada sobre el cimiento de los apóstoles y extendida hasta los confines del mundo:'
      - que tus bendiciones abundantes se derramen sobre cuantos creen en ti.
    - - Tú, Señor, que eres el médico de nuestros cuerpos y de nuestras almas,
      - visítanos con tu amor y sálvanos.
    - - Tú que experimentaste los dolores de la cruz y ahora estás lleno de gloria,
      - levanta y consuela a los enfermos y líbralos de sus sufrimientos.
    - - Tú que anunciaste la resurrección a los que yacían en las tinieblas del abismo,
      - libra a los prisioneros y oprimidos y da pan a los hambrientos.
    - - Tú, Señor, que en la cruz destruiste nuestra muerte y mereciste para todos el don de la inmortalidad,
      - concede a nuestros hermanos difuntos la vida nueva de tu reino.
    respuesta: Tú que has resucitado de entre los muertos, escucha, Señor, nuestra oración.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Oh Dios, que has reunido a pueblos diversos en la confesión de tu nombre, concede a los que han renacido en la fuente bautismal una misma fe en su espíritu y una misma caridad en sus vidas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Viernes de la Octava de Pascua:
  himno: Tu cuerpo es preciosa lámpara
  salmodia:
  - ant: María Magdalena y la otra María fueron a ver el sepulcro. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Venid y ved el lugar donde habían puesto al Señor. Aleluia.
    salmo: salmo-113-a
  - ant: 'Dijo Jesús: «No temáis. Id a decir a mis hermanos que vayan a Galilea, que allí me verán.» Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Hb 5, 8-10
    texto: Cristo, aunque era Hijo de Dios, aprendió por experiencia, en sus padecimientos, la obediencia, y, habiendo así llegado hasta la plena consumación, se convirtió en causa de salvación para todos los que lo obedecen, proclamado por Dios sumo sacerdote «según el rito de Melquisedec».
  ant_magnificat: 'El discípulo predilecto de Jesús dijo: «¡Es el Señor!» Aleluia.'
  preces:
    intro: 'Invoquemos a Cristo, camino, verdad y vida, y digámosle:'
    preces:
    - - 'Te rogamos, Señor, por los ministros de tu Iglesia: que, al distribuir entre sus hermanos el pan de vida,'
      - encuentren también ellos en el pan que distribuyen su alimento y fortaleza.
    - - 'Te pedimos por todo el pueblo cristiano: que viva, Señor, como pide la vocación a que ha sido convocado'
      - y se esfuerce por mantener la unidad del Espíritu con el vínculo de la paz.
    - - 'Te pedimos por los que rigen los destinos de las naciones: que cumplan su misión con espíritu de justicia y con amor,'
      - para que haya paz y concordia entre los pueblos.
    - - Señor, que podamos celebrar tu santa resurrección con tus ángeles y tus santos,
      - y que nuestros hermanos difuntos, a quienes encomendamos a tu bondad, se alegren también en tu reino.
    respuesta: Hijo de Dios vivo, bendice a tu pueblo.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Dios todopoderoso y eterno, que por el misterio pascual restableciste tu alianza con los hombres, concédenos realizar en nuestra vida lo que en estas fiestas proclama nuestra fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
