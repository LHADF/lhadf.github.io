  himno: Ven, Creador, Espíritu amoroso
  preces:
    intro: 'Celebremos la gloria de Dios, quien, al llegar a su término en Pentecostés los cincuenta días de Pascua, llenó a los apóstoles del Espíritu Santo, y supliquemos con ánimo gozoso y confiado, diciendo:'
    preces:
    - - Tú que, al comienzo de los tiempos, creaste el cielo y la tierra y, al llegar la etapa final de la historia, quisiste que Cristo fuera cabeza de toda la creación,
      - por tu Espíritu renueva la faz de la tierra y conduce a los hombres a la salvación.
    - - Tú que infundiste el aliento de vida en el rostro de Adán,
      - envía ahora tu Espíritu a la Iglesia, para que, vivificada y rejuvenecida, comunique tu vida al mundo.
    - - Ilumina a todos los hombres con la luz de tu Espíritu y disipa las tinieblas de nuestro mundo,
      - para que el odio se convierta en amor, el sufrimiento en gozo y la guerra en paz.
    - - Fecundiza el mundo con tu Espíritu, agua viva que mana del costado de Cristo,
      - para que la tierra entera se vea libre de todo mal.
    - - Tú que, por obra del Espíritu Santo, conduces sin cesar a los hombres a la vida eterna,
      - dígnate llevar, por este mismo Espíritu, a los difuntos al gozo eterno de tu presencia.
    respuesta: Envía tu Espíritu, Señor, y renueva la faz de la tierra.
  oracion: Dios todopoderoso y eterno, que has querido que la celebración del misterio pascual se prolongara simbólicamente durante cincuenta días, te pedimos que, por la acción del Espíritu Santo, lleves a la unidad en el amor a todas las naciones de la tierra, y que sus diversas lenguas se unan para proclamar unánimemente la gloria de tu nombre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestros labios:'
  ant_magnificat: Ven, Espíritu Santo, llena los corazones de tus fieles y enciende en ellos el fuego de tu amor, tú que con la diversidad de lenguas congregaste todos los pueblos en la confesión de una sola fe. Aleluia.
  salmodia:
  - ant: Cuando llegó el día de Pentecostés, estaban todos reunidos en un mismo lugar. Aleluia.
    salmo: salmo-112
  - ant: Aparecieron sobre los apóstoles unas como lenguas de fuego, y se posó sobre cada uno de ellos el Espíritu Santo. Aleluia.
    salmo: salmo-146
  - ant: El Espíritu, que procede del Padre, él me glorificará. Aleluia.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: Rm 8, 11
    texto: Si el Espíritu de aquel que resucitó a Jesús de entre los muertos habita en vosotros, el mismo que resucitó a Cristo Jesús de entre los muertos vivificará también vuestros cuerpos mortales por obra de su Espíritu que habita en vosotros.
Domingo de Pentecostés:
  responsorio:
  - - V
    - El Espíritu del Señor llena el universo. Aleluia, aleluia.
  - - R
    - El Espíritu del Señor llena el universo. Aleluia, aleluia.
  - - V
    - Y él, que todo lo mantiene unido, conoce todas las voces.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo
  - - R
    - El Espíritu del Señor llena el universo. Aleluia, aleluia.
  himno: Ven, Creador, Espíritu amoroso
  preces:
    intro: 'Oremos a Dios Padre, que por medio de Cristo ha congregado a la Iglesia, y digamos suplicantes:'
    preces:
    - - Tú que quieres que todos los que nos llamamos cristianos, unidos por un solo bautismo en el mismo Espíritu, formemos una única Iglesia,
      - haz que cuantos creen en ti sean un solo corazón y una sola alma.
    - - Tú que con tu Espíritu llenaste el universo,
      - haz que los hombres construyan un mundo nuevo en justicia y paz.
    - - Señor, padre de todos los hombres, que quieres reunir en la confesión de la única fe a tus hijos dispersos,
      - ilumina a todos los hombres con la gracia del Espíritu Santo.
    - - Tú que por tu Espíritu lo renuevas todo,
      - concede la salud a los enfermos, el consuelo a los que viven tristes y la salvación a todos los hombres.
    - - Tú que por tu Espíritu resucitaste a tu Hijo de entre los muertos,
      - infunde nueva vida a los que han muerto.
    respuesta: Envía, Señor, a la Iglesia tu Espíritu Santo.
  oracion: Dios nuestro, que por el misterio de Pentecostés santificas a tu Iglesia en todo pueblo y nación, derrama los dones del Espíritu Santo por toda la extensión de la tierra, y aquellas maravillas que obraste en los comienzos de la predicación evangélica continúa realizándolas ahora en los corazones de tus fieles. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestros labios:'
  ant_magnificat: Hoy han llegado a su término los días de Pentecostés, aleluia; hoy el Espíritu Santo se apareció a los discípulos en forma de lenguas de fuego y los enriqueció con sus dones, enviándolos a predicar a todo el mundo y a dar testimonio de que el que crea y se bautice se salvará. Aleluia.
  salmodia:
  - ant: El Espíritu del Señor llena el universo. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Confirma, oh Dios, lo que has realizado en nosotros, desde tu santo templo de Jerusalén. Aleluia.
    salmo: salmo-113-a
  - ant: Todos quedaron llenos del Espíritu Santo y comenzaron a hablar. Aleluia.
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Ef 4,3-6
    texto: Esforzaos por mantener la unidad del Espíritu, con el vínculo de la paz. Un solo cuerpo y un solo Espíritu, como una sola es la meta de la esperanza en la vocación a la que habéis sido convocados. Un Señor, una fe, un bautismo. Un Dios, Padre de todo, que lo trasciende todo, y lo penetra todo, y lo invade todo.
IX Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: 'No todo el que me dice: «¡Señor, Señor!» entrará en el reino de los cielos, sino el que cumpla la voluntad de mi Padre celestial.'
IX Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: 'Jesús, apenado por la dureza de corazón de los fariseos, les dijo: «El sábado se ha hecho para el hombre, no el hombre para el sábado.»'
IX Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Jesús, a petición de los ancianos, se fue a casa del centurión para curar a su criado.
IX Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor, nos acogemos confiadamente a tu providencia, que nunca se equivoca, y te suplicamos que apartes de nosotros todo mal y nos concedas aquellos beneficios que pueden ayudarnos para la vida presente y la futura. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IX Domingo del Tiempo Ordinario:
