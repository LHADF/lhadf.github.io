X Domingo del Tiempo Ordinario (A):
  ant_magnificat: Yo quiero misericordia y no sacrificios, pues no he venido a llamar a los justos, sino a los pecadores.
X Domingo del Tiempo Ordinario (B):
  ant_magnificat: El que hace la voluntad de Dios es mi hermano y mi hermana y mi madre.
X Domingo del Tiempo Ordinario (C):
  ant_magnificat: 'Un gran profeta ha surgido entre nosotros: Dios ha visitado a su pueblo.'
XI Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: A la vista de las multitudes, Jesús se movió a compasión, porque estaban extenuados y abatidos, como ovejas sin pastor.
XI Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Jesús anunciaba el reino de Dios con muchas parábolas.
XI Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: Una mujer pecadora bañaba con sus lágrimas los pies del Señor y derramaba perfume sobre ellos.
XI Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Oh Dios, fuerza de los que en ti esperan, escucha nuestras súplicas y, puesto que el hombre es frágil y sin ti nada puede, concédenos la ayuda de tu gracia, para observar tus mandamientos y agradarte con nuestros deseos y acciones. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
