  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: '«No tienes aún cincuenta años, y ¿has visto a Abraham?» «Os aseguro con toda verdad: antes que Abraham naciese, ya existía yo.»'
  preces:
    intro: 'Oremos a Cristo, el Señor, que nos dio el mandamiento nuevo de amarnos unos a otros, y digámosle:'
    preces:
    - - Maestro bueno, enséñanos a amarte en nuestros hermanos
      - y a servirte en cada uno de ellos.
    - - Tú que en la cruz pediste al Padre el perdón para tus verdugos,
      - concédenos amar a nuestros enemigos y orar por los que nos persiguen.
    - - Señor, que la participación en el misterio de tu cuerpo y de tu sangre acreciente en nosotros el amor, la fortaleza y la confianza,
      - y dé vigor a los débiles, consuelo a los tristes y esperanza a los agonizantes.
    - - Señor, luz del mundo, que, por el agua, concediste al ciego de nacimiento el poder ver la luz,
      - ilumina a nuestros catecúmenos por el sacramento del agua y de la palabra.
    - - Concede la plenitud de tu amor a los difuntos
      - y haz que un día nos contemos entre tus elegidos.
    respuesta: Acrecienta, Señor, la caridad de tu Iglesia.
  padrenuestro_intro: 'Con el gozo de sabernos hijos de Dios, acudamos a nuestro Padre, diciendo:'
  oracion: Señor, atiende a nuestras súplicas y concédenos tu protección, ya que hemos puesto toda nuestra esperanza en tu misericordia; purifícanos de toda mancha de pecado y haz que nos mantengamos en una vida santa, para que lleguemos a recibir la herencia que nos tienes prometida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la V semana de Cuaresma:
  himno: Muere la vida y vivo yo sin vida
  lectura:
    ref: 1Pe 2, 21b-24
    texto: Cristo padeció por nosotros, dejándonos un ejemplo para que sigamos sus huellas. Él no cometió pecado ni encontraron engaño en su boca; cuando le insultaban, no devolvía el insulto; en su pasión no profería amenazas; al contrario, se ponía en manos del que juzga justamente. Cargado con nuestros pecados subió al leño, para que, muertos al pecado, vivamos para la justicia. Sus heridas nos han curado.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
