    intro: 'Oremos a Cristo, que resucitó de entre los muertos y está sentado a la derecha del Padre, y digámosle:'
    preces:
    - - Acuérdate, Señor, de los que se han consagrado a tu servicio,
      - que sean para tu pueblo ejemplo de santidad.
    - - Concede, Señor, el espíritu de justicia a los que gobiernan las naciones
      - y haz que trabajen en bien de la paz, para que todos podamos vivir según tu ley.
    - - Concede la paz a nuestros días
      - y multiplica los bienes de la tierra, para que los pobres puedan gozar de las riquezas de tu bondad.
    - - Cristo salvador, que con tu triunfo has iluminado el mundo entero y con tu resurrección has dado a los hombres una prenda de su inmortalidad,
      - concede la luz eterna a nuestros hermanos difuntos.
    respuesta: Cristo, que vives por siempre para interceder por los hombres, escucha nuestra oración.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Dios nuestro, que amas la inocencia y la restituyes a quien la ha perdido, dirige hacia ti los corazones de tus hijos, para que vivan siempre a la luz de la verdad los que han sido librados por ti de las tinieblas del error. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
