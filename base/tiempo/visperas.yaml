XIV Domingo del Tiempo Ordinario (A):
  ant_magnificat: Venid a mí todos los que andáis rendidos y agobiados, que yo os daré descanso.
XIV Domingo del Tiempo Ordinario (B):
  ant_magnificat: Jesús vino a los suyos, y los suyos no lo recibieron. Pero a cuantos lo recibieron, les dio poder de llegar a ser hijos de Dios.
XIV Domingo del Tiempo Ordinario (C):
  ant_magnificat: 'Los discípulos llegaron llenos de gozo porque los demonios se les sometían. Jesús les dijo: «Alegraos más bien porque vuestros nombres están inscritos en el cielo.»'
XV Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Jesús subió a una barca, y con muchas parábolas enseñaba a la gente.
XV Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: Llamó Jesús junto a sí a los Doce y comenzó a enviarlos de dos en dos a anunciar la salvación.
XV Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: 'Así está escrito en la ley: «Amarás al Señor tu Dios con todo tu corazón, y a tu prójimo como a ti mismo.»'
XV Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Señor Dios, que muestras la luz de tu verdad a los que andan extraviados, para que puedan volver al camino recto, concede a todos los cristianos que se aparten de todo lo que sea indigno de ese nombre que llevan, y que cumplan lo que ese nombre significa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
