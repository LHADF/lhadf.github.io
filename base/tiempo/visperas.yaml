IX Domingo del Tiempo Ordinario (A):
  ant_magnificat: Todo el que escucha estas mis palabras y las pone por obra será como el varón inteligente, que construyó su casa sobre roca.
IX Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'Jesús dice: «El Hijo del hombre es dueño también del sábado.»'
IX Domingo del Tiempo Ordinario (C):
  ant_magnificat: «Ni siquiera en Israel he encontrado una fe tan grande», dice el Señor.
X Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Jesús, al pasar, llamó a Mateo, el publicano; él se levantó y siguió al Señor.
X Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: «Si en una familia anida la discordia, no puede durar mucho tiempo», dice el Señor.
X Domingo del Tiempo Ordinario (C) · I Vísperas:
  ant_magnificat: 'A la entrada de la ciudad de Naím, Jesús confortó a una madre viuda, diciéndole: «Mujer, no llores.»'
X Domingo del Tiempo Ordinario · I Vísperas:
  oracion: Dios nuestro, de quien todo bien procede, concédenos seguir siempre tus inspiraciones, para que tratemos de hacer continuamente lo que es recto y, con tu ayuda, lo llevemos siempre a cabo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
