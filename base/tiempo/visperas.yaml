  ant_magnificat: Al divisar la estrella, los magos sintieron grandísimo gozo; entraron en la casa y ofrecieron al Señor oro, incienso y mirra.
  preces:
    intro: 'Bendito sea el Señor Jesucristo, que ha visitado a los que vivían en tinieblas y en sombra de muerte a fin de iluminarlos; supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, que al venir al mundo diste nacimiento a la Iglesia, tu cuerpo,
      - haz que esta Iglesia crezca y se construya en la caridad.
    - - Tú que con tu poder gobiernas el cielo y la tierra,
      - haz que los pueblos y sus gobernantes reconozcan y confiesen tu soberanía divina.
    - - Tú que, al hacerte hombre, has sido constituido sacerdote eterno,
      - haz que todos los sacerdotes sean ministros idóneos de tu redención.
    - - Tú que en el seno de María Virgen desposaste místicamente la humanidad con la divinidad,
      - bendice a las vírgenes que se han consagrado a ti para tenerte como su único y celestial esposo.
    - - Tú que al unirte a nuestra naturaleza mortal destruiste la muerte introducida por el pecado,
      - transforma en vida eterna la muerte de nuestros difuntos.
    respuesta: Oh Cristo, sol que naces de lo alto, ilumínanos con tu luz.
  padrenuestro_intro: 'Como Jesucristo, también nosotros somos hijos de Dios; por eso con él nos atrevemos a decir:'
  oracion: Te pedimos, Señor, que ilumines nuestros corazones con el esplendor de tu divinidad, para que podamos pasar a través de las tinieblas de este mundo y llegar a la patria de la eterna claridad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
