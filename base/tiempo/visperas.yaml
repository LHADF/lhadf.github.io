  ant_magnificat: Pedid y se os dará; buscad y hallaréis; llamad y se os abrirá.
  preces:
    intro: 'Oremos a Cristo, el Señor, que nos dio el mandamiento nuevo de amarnos unos a otros, y digámosle:'
    preces:
    - - Maestro bueno, enséñanos a amarte en nuestros hermanos
      - y a servirte en cada uno de ellos.
    - - Tú que en la cruz pediste al Padre el perdón para tus verdugos,
      - concédenos amar a nuestros enemigos y orar por los que nos persiguen.
    - - Señor, que la participación en el misterio de tu cuerpo y de tu sangre acreciente en nosotros el amor, la fortaleza y la confianza,
      - y dé vigor a los débiles, consuelo a los tristes y esperanza a los agonizantes.
    - - Señor, luz del mundo, que, por el agua, concediste al ciego de nacimiento el poder ver la luz,
      - ilumina a nuestros catecúmenos por el sacramento del agua y de la palabra.
    - - Concede la plenitud de tu amor a los difuntos
      - y haz que un día nos contemos entre tus elegidos.
    respuesta: Acrecienta, Señor, la caridad de tu Iglesia.
  padrenuestro_intro: 'Con el gozo de sabernos hijos de Dios, acudamos a nuestro Padre, diciendo:'
  oracion: Señor, haz que nos inclinemos siempre a pensar con rectitud y a practicar el bien con diligencia y, puesto que no podemos existir sin ti, concédenos vivir siempre según tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la I semana de Cuaresma:
  himno: Muere la vida y vivo yo sin vida
  lectura:
    ref: St 5, 16. 19-20
    texto: Confesaos mutuamente vuestros pecados y rogad unos por otros, para alcanzar vuestra curación, pues la oración ferviente del justo tiene gran eficacia. Hermanos, si alguno de entre vosotros se desvía de la verdad y otro logra convertirlo, sepa que quien convierte a un pecador de su camino equivocado salvará su alma de la muerte y cubrirá la multitud de sus pecados.
  responsorio:
