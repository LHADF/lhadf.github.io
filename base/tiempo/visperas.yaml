  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Sobre mi persona testifico yo, y testifica en mi favor el Padre que me ha enviado.
  preces:
    intro: 'Invoquemos al Señor Jesús, que nos ha salvado a nosotros, su pueblo, librándonos de nuestros pecados, y digámosle humildemente:'
    preces:
    - - 'Te pedimos, Señor Jesús, por tu Iglesia santa, por la que te entregaste para consagrarla con el baño del agua y con la palabra:'
      - purifícala y renuévala por la penitencia.
    - - Maestro bueno, haz que los jóvenes descubran el camino que les preparas
      - y que respondan siempre con generosidad a tus llamadas.
    - - Tú que te compadeciste de los enfermos que acudían a ti, levanta la esperanza de nuestros enfermos
      - y haz que imitemos tu gesto generoso y estemos siempre atentos al bien de los que sufren.
    - - Haz, Señor, que recordemos siempre nuestra condición de hijos tuyos, recibida en el bautismo,
      - y que vivamos siempre para ti.
    - - Da tu paz y el premio eterno a los difuntos
      - y reúnenos un día con ellos en tu reino.
    respuesta: Jesús, Hijo de David, compadécete de nosotros.
  padrenuestro_intro: 'Con el gozo de sabernos hijos de Dios, acudamos a nuestro Padre, diciendo:'
  oracion: Señor, Dios nuestro, que por el amor inefable que nos tienes nos enriqueces con toda clase de bendiciones, concédenos pasar de nuestras antiguas faltas a una vida nueva, para prepararnos convenientemente a la gloria del reino celestial. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la V semana de Cuaresma:
  himno: No me pesa, Señor, haber faltado
  lectura:
    ref: 1Co 1, 27b-30
    texto: 'Lo débil del mundo lo ha escogido Dios para humillar el poder. Aún más: ha escogido la gente baja del mundo, lo despreciable, lo que no cuenta, para anular a lo que cuenta; de modo que nadie pueda gloriarse en presencia del Señor. Por él vosotros sois en Cristo Jesús, en este Cristo que Dios ha hecho para nosotros sabiduría, justicia, santificación y redención.'
  responsorio:
