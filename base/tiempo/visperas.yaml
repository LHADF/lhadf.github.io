    - Al ver al Señor.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  ant_magnificat: El Espíritu me glorificará, porque tomará de lo que es mío para dároslo a conocer. Aleluia.
  preces:
    intro: 'Imploremos a Dios Padre, que por la resurrección de su Hijo de entre los muertos nos ha abierto el camino de la vida eterna, y digámosle:'
    preces:
    - - Dios de nuestros padres, que has glorificado a tu Hijo Jesús, resucitándolo de entre los muertos,
      - convierte nuestros corazones, para que vivamos la nueva vida de tu Hijo resucitado.
    - - Tú que nos has devuelto al Pastor y guardián de nuestras vidas, cuando éramos ovejas descarriadas,
      - consérvanos en fidelidad a tu Evangelio, bajo la guía de los obispos de tu Iglesia.
    - - Tú que elegiste a los primeros discípulos de tu Hijo de entre el pueblo de Israel,
      - revela a los hijos de este pueblo el cumplimiento de las promesas que hiciste a sus padres.
    - - Acuérdate, Señor, de los huérfanos, de las viudas, de los esposos que viven separados y de todos nuestros hermanos abandonados,
      - y no permitas que vivan en la soledad los que fueron reconciliados por la muerte de tu Hijo.
    - - Tú que llamaste a ti a Esteban, el cual confesó que Jesús estaba a tu derecha,
      - recibe a nuestros hermanos difuntos que esperaron tu venida en la fe y en el amor.
    respuesta: Por la victoria de Cristo, salva, Señor, a tus redimidos.
  padrenuestro_intro: 'Digamos ahora todos juntos la oración que nos enseñó el mismo Jesús:'
  oracion: Concédenos, Señor, que, así como ahora celebramos en la fe la gloriosa resurrección de tu Hijo Jesucristo, así también merezcamos regocijarnos con todos los santos, cuando vuelva él triunfalmente al fin de los tiempos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Ascensión del Señor:
  himno: Es la Pascua real, no ya la sombra
  salmodia:
  - ant: Cristo está constituido por Dios juez de vivos y muertos. Aleluia.
    salmo: salmo-71-i
  - ant: Él será la bendición de todos los pueblos. Aleluia.
    salmo: salmo-71-ii
  - ant: Ayer como hoy, Jesucristo es el mismo y lo será siempre. Aleluia.
    salmo: cantico-ap-11-17-18-12-10b-12a
  lectura:
    ref: 1Pe 3, 18. 21b-22
    texto: 'Cristo murió por los pecados una vez para siempre: el inocente por los culpables, para conduciros a Dios. Como era hombre, lo mataron; pero, como poseía el Espíritu, fue devuelto a la vida. Lo que actualmente os salva no consiste en limpiar una suciedad corporal, sino en impetrar de Dios una conciencia pura, por la resurrección de Jesucristo, que llegó al cielo, se le sometieron ángeles autoridades y poderes, y está a la derecha de Dios.'
  responsorio:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - V
    - Al ver al Señor.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  ant_magnificat: Vuestra tristeza se convertirá en gozo, y nadie os quitará vuestra alegría. Aleluia.
  preces:
    intro: 'Alabemos y glorifiquemos a Cristo, a quien Dios Padre constituyó fundamento de nuestra esperanza y primicia de la humanidad resucitada, y aclamémoslo, suplicantes:'
    preces:
    - - Señor Jesús, tú que, por tu propia sangre y por tu resurrección, penetraste en el santuario de Dios,
      - llévanos contigo al reino del Padre.
    - - Tú que, por tu resurrección, robusteciste la fe de tus discípulos y los enviaste a anunciar el Evangelio al mundo,
      - haz que los obispos y presbíteros sean fieles heraldos de tu Evangelio.
    - - Tú que, por tu resurrección, eres nuestra reconciliación y nuestra paz,
      - haz que todos los bautizados vivan en la unidad de una sola fe y de un solo amor.
    - - Tú que, por tu resurrección, diste la salud, al tullido del templo,
      - mira con bondad a los enfermos y manifiesta en ellos tu gloria.
    - - Tú que, por tu resurrección, fuiste constituido primogénito de los muertos que resucitan,
      - haz que los difuntos que en ti creyeron y esperaron participen de tu gloria.
    respuesta: Rey de la gloria, escúchanos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Señor, Dios nuestro, que has otorgado a tu pueblo el don de la redención, concédenos vivir eternamente la alegría de la resurrección de tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la VI semana de Pascua:
  himno: Tu cuerpo es preciosa lámpara
  salmodia:
  - ant: El Señor ha salvado mi vida de los lazos del abismo. Aleluia.
    salmo: salmo-114
  - ant: El Señor guarda a su pueblo como a las niñas de sus ojos. Aleluia.
    salmo: salmo-120
  - ant: Mi fuerza y mi poder es el Señor, él fue mi salvación. Aleluia.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: Hb 5, 8-10
    texto: Cristo, aunque era Hijo de Dios, aprendió por experiencia, en sus padecimientos, la obediencia, y, habiendo así llegado hasta la plena consumación, se convirtió en causa de salvación para todos los que lo obedecen, proclamado por Dios sumo sacerdote «según el rito de Melquisedec».
  responsorio:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - V
    - Al ver al Señor.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  ant_magnificat: Vuestro Padre dará desde el cielo el Espíritu Santo a quienes se lo pidan. Aleluia.
  preces:
    intro: 'Oremos a Cristo, fuente de toda vida y principio de todo bien, y digámosle confiadamente:'
    preces:
    - - Jesús salvador, tú que, muerto en la carne, fuiste devuelto a la vida por el Espíritu,
      - haz que nosotros, muertos al pecado, vivamos también de tu Espíritu.
    - - Tú que enviaste a tus discípulos al mundo entero para que proclamaran tu Evangelio a todos los pueblos,
      - haz que cuantos anuncian el Evangelio a los hombres vivan de tu Espíritu.
    - - Tú que recibiste todo poder en el cielo y en la tierra para dar testimonio de la verdad,
      - guarda en tu verdad a quienes nos gobiernan.
    - - Tú que todo lo renuevas y nos mandas esperar anhelantes la llegada de tu reino,
      - haz que, cuanto más esperemos el cielo nuevo y la tierra nueva que nos prometes, con tanto mayor empeño trabajemos por la edificación del mundo presente.
    - - Tú que descendiste a la mansión de la muerte para anunciar el gozo del Evangelio a los difuntos,
      - sé tú mismo la eterna alegría de todos los que mueren.
    respuesta: Instaura, Señor, tu reino en el mundo.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Escucha, Señor, nuestra oración y haz que mediante la predicación del Evangelio llegue a ser realidad en todo el mundo la salvación inaugurada en la glorificación de tu Hijo, y que todos los hombres alcancen la adopción filial que él anunció con su palabra de verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VII Domingo de Pascua · I Vísperas:
  responsorio:
  - - V
