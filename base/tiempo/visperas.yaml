  ant_magnificat: 'Os digo la verdad: Os conviene que yo me vaya; porque, si no me voy, el Abogado no vendrá a vosotros. Aleluia.'
  preces:
    intro: 'Invoquemos a Cristo, que con su resurrección ha reanimado la esperanza de su pueblo, y digámosle:'
    preces:
    - - Señor Jesús, de cuyo costado abierto salió sangre y agua,
      - haz de la Iglesia tu esposa inmaculada.
    - - Pastor supremo de la Iglesia, que después de tu resurrección encomendaste a Pedro, al confesarte su amor, el cuidado de tus ovejas,
      - concede al papa Francisco un amor ardiente y un celo apostólico.
    - - Tú que concediste una pesca abundante a los discípulos que pescaban en el mar,
      - envía operarios que continúen su trabajo apostólico.
    - - Tú que preparaste a la orilla del mar el pan y los peces para los discípulos,
      - no permitas que nuestros hermanos mueran de hambre por culpa nuestra.
    - - Señor Jesús, nuevo Adán, que nos das la vida, transforma a nuestros difuntos a imagen tuya,
      - para que compartan contigo la alegría de tu reino.
    respuesta: Señor Jesús, tú que siempre vives para interceder por nosotros, escúchanos.
  padrenuestro_intro: 'Sintiéndonos verdaderos hijos de Dios, digamos a nuestro Padre:'
  oracion: Señor, haz que tu pueblo viva siempre en la alegría al ver renovada la juventud de su espíritu, y que el gozo de haber recobrado la dignidad de la adopción divina le dé la firme esperanza de resucitar un día a la verdadera felicidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la VI semana de Pascua:
  himno: Hoy rompe la clausura
  salmodia:
  - ant: No se turbe vuestro corazón; tan sólo creed en mí. Aleluia.
    salmo: salmo-61
  - ant: ¡Oh Dios!, que te alaben los pueblos, que se alegren por tu salvación. Aleluia.
    salmo: salmo-66
  - ant: Su resplandor eclipsa el cielo, la tierra se llena de su alabanza. Aleluia.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Hb 7, 24-27
    texto: 'Jesús, como permanece para siempre, tiene un sacerdocio eterno. De aquí que tiene poder para llevar a la salvación definitiva a cuantos por él se vayan acercando a Dios, porque vive para siempre para interceder por ellos. Y tal era precisamente el sumo sacerdote que nos convenía: santo, sin maldad, sin mancha, excluido del número de los pecadores y exaltado más alto que los cielos. No tiene necesidad, como los sumos sacerdotes, de ofrecer víctimas cada día, primero por sus propios pecados y luego por los del pueblo. Esto lo hizo una vez por todas, ofreciéndose a sí mismo.'
  responsorio:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
