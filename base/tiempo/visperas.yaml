  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Si no queréis creerme a mí, creed a esas obras, que hago en nombre de Dios.
  preces:
    intro: 'Oremos a Jesús, el Señor, que santificó por su propia sangre al pueblo, y digámosle:'
    preces:
    - - Redentor nuestro, por tu pasión, concede a tus fieles la fuerza necesaria para mortificar sus cuerpos, ayúdalos en su lucha contra el mal y fortalece su esperanza,
      - para que se dispongan a celebrar santamente tu resurrección.
    - - Haz que los cristianos cumplan con su misión profética anunciando al mundo tu Evangelio
      - y dando testimonio de él por su fe, esperanza y caridad.
    - - Conforta, Señor, a los que están tristes,
      - y otórganos a nosotros el poder consolar a nuestros hermanos.
    - - Haz que tus fieles aprendan a participar en tu pasión con sus propios sufrimientos,
      - para que sus vidas manifiesten tu salvación a los hombres.
    - - Tú que eres autor de la vida,
      - acuérdate de los difuntos y dales parte en tu gloriosa resurrección.
    respuesta: Compadécete, Señor, de tu pueblo.
  padrenuestro_intro: 'Con el gozo de sabernos hijos de Dios, acudamos a nuestro Padre, diciendo:'
  oracion: Perdona, Señor, las culpas que hemos cometido a causa de nuestra debilidad y, por tu misericordia, líbranos de la esclavitud en que nos tienen cautivos nuestros pecados. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
