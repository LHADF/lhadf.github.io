  - ant: Nos rescataron a precio de la sangre de Cristo, el cordero sin defecto ni mancha.
    salmo: salmo-110
  - ant: Él soportó nuestros sufrimientos y aguantó nuestros dolores.
    salmo: cantico-1pe-2-21b-24
  lectura:
