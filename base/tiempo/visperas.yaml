  himno: Te diré mi amor, Rey mío
  salmodia:
  - ant: Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora.
    salmo: salmo-109-1-5-7
