      - haz que Dios sea honrado en todas las familias.
    - - Tú que quisiste que tus padres, angustiados, te encontraran al cabo de tres días en la casa de tu Padre,
      - enséñanos a buscar siempre primero el reino de Dios y su justicia.
    - - Tú que has dado parte en tu gloria a María y a José,
      - admite también a nuestros difuntos en la familia de los santos.
    respuesta: Tú eres, Señor, el modelo y el salvador de los hombres.
  padrenuestro_intro: 'Alegres porque Jesucristo nos ha hecho hijos de Dios, digamos:'
  oracion: Dios nuestro, que has querido darnos en la Sagrada Familia ejemplos preclaros de virtudes domésticas, concédenos saber imitar su vida y su amor recíproco, para que un día podamos ir a disfrutar con ella de la alegría eterna de tu morada. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Día VII de la Octava de la Natividad (B) · I Vísperas:
  himno: Al caer de la tarde
  salmodia:
  - ant: Jacob engendró a José, el esposo de María, de la cual nació Jesús, que es el Mesías.
    salmo: salmo-112
  - ant: José, hijo de David, no temas recibir a María como esposa, porque lo concebido en ella es obra del Espíritu Santo.
    salmo: salmo-147
  - ant: Los pastores vinieron presurosos y encontraron a María y a José, y al niño acostado en un pesebre.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: 2Co 8, 9
    texto: Conocéis el ejemplo de liberalidad de nuestro Señor Jesucristo, que, siendo rico, se hizo pobre por vosotros, para que os enriquecierais con su pobreza.
  responsorio:
  - - V
    - La Palabra se hizo carne y puso su morada entre nosotros.
  - - R
    - La Palabra se hizo carne y puso su morada entre nosotros.
  - - V
    - Y de su plenitud hemos recibido todos.
  - - R
    - Y puso su morada entre nosotros.
  - - V
    - Gloria al Padre. y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne y puso su morada entre nosotros.
  ant_magnificat: El niño Jesús se quedó en Jerusalén, sin que sus padres se diesen cuenta de ello; creían ellos que vendría en la caravana y lo buscaron entre parientes y conocidos.
  preces:
    intro: 'Adoremos a Cristo, Hijo del Dios vivo, que quiso ser también hijo de una familia humana, y aclamémoslo, diciendo:'
    preces:
    - - Cristo Jesús. por el misterio de tu sumisión a María y a José,
      - enséñanos a respetar y a obedecer a los que nos gobiernan legítimamente.
    - - Tú que amaste a tus padres y fuiste amado por ellos,
      - afianza a todas las familias en el amor y la concordia.
    - - Tú que estuviste siempre atento a las cosas de tu Padre,
      - haz que Dios sea honrado en todas las familias.
    - - Tú que quisiste que tus padres, angustiados, te encontraran al cabo de tres días en la casa de tu Padre,
      - enséñanos a buscar siempre primero el reino de Dios y su justicia.
    - - Tú que has dado parte en tu gloria a María y a José,
      - admite también a nuestros difuntos en la familia de los santos.
    respuesta: Tú eres, Señor, el modelo y el salvador de los hombres.
  padrenuestro_intro: 'Alegres porque Jesucristo nos ha hecho hijos de Dios, digamos:'
  oracion: Dios nuestro, que has querido darnos en la Sagrada Familia ejemplos preclaros de virtudes domésticas, concédenos saber imitar su vida y su amor recíproco, para que un día podamos ir a disfrutar con ella de la alegría eterna de tu morada. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Día VI de la Octava de la Natividad:
  himno: Entonad un canto
  salmodia:
  - ant: Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora.
    salmo: salmo-109-1-5-7
  - ant: Del Señor viene la misericordia y la redención copiosa.
    salmo: salmo-129
  - ant: En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Cf. 2Pe 1, 3-4
    texto: Cristo, con su divino poder, nos ha concedido todo lo referente a la vida eterna y a la verdadera religión, mediante el perfecto conocimiento del que nos convocó por su propia gloria y virtud. Por ellas nos ha hecho merced de las preciosas y magníficas promesas, para que así seáis partícipes de la naturaleza divina, escapando de la corrupción existente en el mundo por causa de la concupiscencia.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: Te glorificamos, santa Madre de Dios, porque de ti ha nacido Cristo; oh María, salva a todos los que te enaltecen.
  preces:
    intro: 'Aclamemos a Cristo, el jefe salido de Belén, tierra de Judá, para ser el pastor del pueblo de Israel, y digámosle:'
    preces:
    - - Cristo salvador, deseado de todos los pueblos, haz que tu Evangelio llegue a aquellos que aún no han oído la palabra de vida
      - y atrae a ti a todos los hombres.
    - - Cristo Señor, haz que tu Iglesia se dilate por el mundo y arraigue en los pueblos,
      - para que en ella se congreguen los hombres de toda lengua y nación.
    - - Rey de reyes, dirige la mente y la voluntad de los que gobiernan,
      - para que procuren la justicia y trabajen por la libertad y la paz de las naciones.
    - - Señor todopoderoso, tú que eres la fortaleza de los frágiles, ayuda a los que están tentados, levanta a los decaídos, protege a los que están en peligro,
      - consuela a los que se sienten decepcionados o desesperados y robustece la confianza de los perseguidos.
    - - Tú que eres el consuelo de los tristes,
      - conforta a los agonizantes y llévalos a los goces de tu paraíso.
    respuesta: Que tu gracia, Señor, nos acompañe siempre.
  padrenuestro_intro: 'Alegres porque Jesucristo nos ha hecho hijos de Dios, digamos:'
  oracion: Concédenos, Dios todopoderoso, que el nacimiento de tu Hijo en nuestra carne mortal nos libre de la antigua servidumbre del pecado que pesa aún sobre nosotros. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
3 de enero, del Tiempo de Navidad:
  himno: Te diré mi amor, Rey mío
  salmodia:
  - ant: No podéis servir a Dios y al dinero.
    salmo: salmo-48-i
  - ant: «Atesorad tesoros en el cielo», dice el Señor.
    salmo: salmo-48-ii
  - ant: Digno es el Cordero degollado de recibir el honor y la gloria.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1Jn 1, 5b. 7
    texto: Dios es luz y en él no hay tiniebla alguna. Si caminamos en la luz, lo mismo que está él en la luz, entonces vivimos en comunión unos con otros; y la sangre de Jesús, su Hijo, nos purifica de todo pecado.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: Alegrémonos en el Señor y exultemos en el Espíritu, porque ha aparecido en el mundo la salvación eterna. Aleluia.
  preces:
    intro: 'Con el nacimiento de Cristo el pueblo de Dios ha dado su mejor fruto y su más bella flor; digamos, pues, con alegría, aclamando a nuestro Salvador:'
    preces:
    - - Cristo, vida nuestra, que has venido al mundo para ser cabeza de la Iglesia,
      - da crecimiento a tu cuerpo y haz que se construya en el amor.
    - - Tú que has querido ser adorado no sólo como Dios, sino también como hombre,
      - concédenos tener parte en tu divinidad.
    - - Tú que por la encarnación has sido constituido mediador de los hombres,
      - haz que los ministros de tu Iglesia, ayudados por tu gracia, vivan íntimamente unidos a ti por la santidad de sus vidas.
    - - Tú que al venir al mundo instauraste un nuevo orden entre los hombres,
      - haz que todos los pueblos conozcan tu salvación.
    - - Tú que al nacer destruiste el poder de la muerte,
      - libra a todos los difuntos de todo vínculo de pecado.
    respuesta: Que tu nacimiento, Señor, sea la alegría del mundo.
  padrenuestro_intro: 'Alegres porque Jesucristo nos ha hecho hijos de Dios, digamos:'
  oracion: Dios nuestro, que quisiste que en el parto de la santísima Virgen María la carne de tu Hijo no quedara sometida a la antigua sentencia dada al género humano, concédenos, ya que por el nacimiento de Cristo hemos entrado a participar de esta renovación de la creatura, que nos veamos libres del contagio de la antigua condición. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
4 de enero, del Tiempo de Navidad:
  himno: Te diré mi amor, Rey mío
  salmodia:
  - ant: Eres el más bello de los hombres, en tus labios se derrama la gracia.
    salmo: salmo-44-i
  - ant: Llega el esposo, salid a recibirlo.
    salmo: salmo-44-ii
  - ant: Dios proyectó hacer que todas las cosas tuviesen a Cristo por cabeza, cuando llegase el momento culminante.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Rm 8, 3b-4
    texto: Dios envió a su propio Hijo, sometido a una existencia semejante a la de la carne de pecado. Así dictó sentencia de condenación contra el pecado, que ejercía su poder en la vida según la carne. De este modo la exigencia y el fin de la ley tuvieron cumplimiento en nosotros, que no vivimos la vida puramente natural según la carne, sino la vida sobrenatural según el espíritu.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: Yo procedo y vengo del Padre; no he venido por cuenta propia, sino que he sido enviado por él.
  preces:
    intro: 'Cristo ha venido a nosotros y se ha entregado por nosotros para redimirnos de toda iniquidad y para reservarse para sí, como posesión propia, un pueblo purificado y lleno de fervor por las buenas obras; invoquémoslo, pues, con plena fe, diciendo:'
    preces:
    - - Por tu santa Iglesia, para que todos sus hijos renazcan a nueva vida.
      - Señor, ten piedad.
    - - Por los pobres, prisioneros y fugitivos, para que en nuestro amor te descubran a ti, Hijo de Dios hecho hombre.
      - Señor, ten piedad.
    - - Para que nuestro gozo llegue a ser pleno y comprendamos la grandeza del don que el Padre nos ha dado en tu persona.
      - Señor, ten piedad.
    - - Para que los fieles difuntos, iluminados por la claridad de tu nacimiento,
      - contemplen tu rostro y no haya ya más noche ni tinieblas para ellos.
    respuesta: Señor, ten piedad.
  padrenuestro_intro: 'Gracias a Jesucristo somos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Te pedimos, Dios todopoderoso, que tu Salvador, que has enviado del cielo como una luz nueva para redimir al mundo, nazca también en nuestros corazones y los renueve continuamente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Epifanía del Señor · I Vísperas:
  himno: Reyes que venís por ellas
  salmodia:
  - ant: Engendrado antes de la aurora de los siglos, el Señor, nuestro Salvador, hoy se ha manifestado al mundo.
    salmo: salmo-134-i
  - ant: El Señor, nuestro Dios, es grande, más que todos los dioses.
    salmo: salmo-134-ii
  - ant: Esta estrella resplandece como llama viva y revela al Dios, Rey de reyes; los magos la contemplaron y ofrecieron sus dones al gran Rey.
    salmo: cantico-1tm-3-16
  lectura:
    ref: 2Tm 1, 9-10
    texto: Dios nos ha salvado y nos ha llamado con santa llamada, no según nuestras obras, sino según su propio propósito y su gracia, que nos dio con Cristo Jesús antes de los tiempos eternos. Esta gracia se nos otorgó en Cristo Jesús antes de la creación de los siglos y se ha manifestado ahora con la aparición de nuestro salvador, Cristo Jesús. Él ha aniquilado la muerte, y ha hecho brillar la vida y la inmortalidad por el Evangelio.
  responsorio:
  - - V
    - Será la bendición de todos los pueblos.
  - - R
    - Será la bendición de todos los pueblos.
  - - V
    - Lo proclamarán dichoso todas las razas de la tierra.
  - - R
    - Todos los pueblos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Será la bendición de todos los pueblos.
  ant_magnificat: 'Los magos, al ver la estrella, se dijeron: «Éste es el signo del gran Rey; vayamos a buscarlo y ofrezcámosle nuestros dones: oro, incienso y mirra.» Aleluia.'
  preces:
    intro: 'Veneremos a nuestro Salvador, adorado hoy por los magos, y digámosle suplicantes:'
    preces:
    - - Rey de los pueblos, tú que llamaste a los magos, primicia de los pueblos gentiles, para que te adoraran,
      - concédenos también a nosotros el espíritu de adoración.
    - - Rey de la gloria, que riges a tu pueblo con justicia,
      - concede a los hombres paz abundante.
    - - Rey eterno, que subsistes por los siglos, envíanos tu palabra
      - y haz que penetre en nosotros como la llovizna que empapa la tierra.
    - - Rey de justicia, que has venido a librar al pobre que no tiene protector,
      - ten piedad de los indigentes y afligidos.
    - - Señor Jesús, cuyo nombre es eterno,
      - da parte a nuestros hermanos difuntos en el reino que preparas a tus elegidos.
    respuesta: Salva, Señor, la vida de los pobres.
  padrenuestro_intro: 'Gracias a Jesucristo somos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Señor, tú que manifestaste a tu Hijo en este día a todas las naciones por medio de una estrella, concédenos, a los que ya te conocemos por la fe, llegar a contemplar, cara a cara, la hermosura infinita de tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Epifanía del Señor:
  himno: Reyes que venís por ellas
  salmodia:
  - ant: El Rey de la paz ha sido glorificado por encima de todos los reyes de la tierra.
    salmo: salmo-109-1-5-7
  - ant: 'Ha brillado una luz en las tinieblas para los hombres de buena voluntad: el Señor justo, clemente y compasivo.'
    salmo: salmo-111
  - ant: Vendrán todas las naciones y se postrarán en tu acatamiento, Señor.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: Tt 3, 4-5
    texto: Dios, nuestro Salvador, hizo aparecer su misericordia y su amor por los hombres. Y nos trajo la salud, no en consideración a las buenas obras que hubiésemos practicado nosotros, sino por pura misericordia suya, mediante el baño bautismal de regeneración y renovación que obra el Espíritu Santo.
  responsorio:
  - - V
    - Será la bendición de todos los pueblos.
  - - R
    - Será la bendición de todos los pueblos.
  - - V
    - Lo proclamarán dichoso todas las razas de la tierra.
  - - R
    - Todos los pueblos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Será la bendición de todos los pueblos.
  ant_magnificat: 'Veneramos este día santo, honrado con tres prodigios: hoy la estrella condujo a los magos al pesebre; hoy el agua se convirtió en vino en las bodas de Caná; hoy Cristo fue bautizado por Juan en el Jordán, para salvarnos. Aleluia.'
  preces:
    intro: 'Veneremos a nuestro Salvador, adorado hoy por los magos, y digámosle suplicantes:'
    preces:
    - - Rey de los pueblos, tú que llamaste a los magos, primicia de los pueblos gentiles, para que te adoraran,
      - concédenos también a nosotros el espíritu de adoración.
    - - Rey de la gloria, que riges a tu pueblo con justicia,
      - concede a los hombres paz abundante.
    - - Rey eterno, que subsistes por los siglos, envíanos tu palabra
      - y haz que penetre en nosotros como la llovizna que empapa la tierra.
    - - Rey de justicia, que has venido a librar al pobre que no tiene protector,
      - ten piedad de los indigentes y afligidos.
    - - Señor Jesús, cuyo nombre es eterno,
      - da parte a nuestros hermanos difuntos en el reino que preparas a tus elegidos.
    respuesta: Salva, Señor, la vida de los pobres.
  padrenuestro_intro: 'Gracias a Jesucristo somos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Señor, tú que manifestaste a tu Hijo en este día a todas las naciones por medio de una estrella, concédenos, a los que ya te conocemos por la fe, llegar a contemplar, cara a cara, la hermosura infinita de tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Bautismo del Señor · I Vísperas:
  responsorio:
  - - V
    - Escucha, Señor, la voz de tu pueblo.
  - - R
    - Escucha, Señor, la voz de tu pueblo.
  - - V
    - Y ábreles una fuente de agua viva.
  - - R
    - Escucha, Señor, la voz de tu pueblo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Escucha, Señor, la voz de tu pueblo.
  himno: Porque el bautismo hoy empieza
  preces:
    intro: 'Roguemos a nuestro Redentor, bautizado por Juan en el Jordán, y supliquémosle, diciendo:'
    preces:
    - - Cristo, siervo de Dios, en quien el Padre tiene todo su gozo,
      - envía tu Espíritu sobre nosotros.
    - - Cristo, elegido de Dios, tú que no rompiste la caña resquebrajada ni apagaste la mecha humeante,
      - compadécete de cuantos te buscan con sinceridad.
    - - Cristo, Hijo de Dios, a quien el Padre ha elegido como nueva alianza del pueblo y luz de las naciones,
      - abre por el bautismo los ojos de los que no ven.
    - - Cristo, salvador de los hombres, a quien el Padre ungió con el Espíritu Santo y envió para salvación del mundo,
      - haz que todos los hombres te conozcan y crean en ti para que así obtengan la vida eterna.
    - - Cristo, esperanza nuestra, que llevas la luz de la salvación a los pueblos que yacen en las tinieblas de la ignorancia,
      - recibe en tu reino a nuestros difuntos.
    respuesta: Envía, Señor, tu Espíritu sobre nosotros.
  oracion: Dios todopoderoso y eterno, que proclamaste solemnemente a Cristo como tu Hijo amado, cuando era bautizado en el Jordán y descendía el Espíritu Santo sobre él, concede a tus hijos de adopción, renacidos del agua y del Espíritu Santo, que se conserven siempre dignos de tu complacencia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Ya que somos la familia de Dios, digamos con grande confianza a nuestro Padre del cielo:'
  ant_magnificat: El Salvador vino a ser bautizado para renovar al hombre envejecido; quiso restaurar por el agua nuestra naturaleza deteriorada y nos vistió con su incorruptibilidad.
  salmodia:
  - ant: Juan bautizaba en el desierto, predicando un bautismo de arrepentimiento para remisión de los pecados.
    salmo: salmo-134-i
  - ant: Yo os bautizo con agua; pero él os bautizará con el Espíritu Santo y con fuego.
    salmo: salmo-134-ii
  - ant: En seguida que fue bautizado, Jesús salió del agua y, de pronto, se le abrieron los cielos.
    salmo: cantico-1tm-3-16
  lectura:
    ref: Hch 10, 37-38
    texto: 'Vosotros sabéis lo acaecido en toda Judea: cómo Jesús de Nazaret empezó su actividad por Galilea después del Bautismo predicado por Juan; cómo Dios lo ungió con poder del Espíritu Santo; cómo pasó haciendo el bien y devolviendo la salud a todos los que estaban esclavizados por el demonio, porque Dios estaba con él.'
II Domingo después de Navidad · I Vísperas:
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  himno: Te diré mi amor, Rey mío
  preces:
    intro: 'Adoremos a Cristo, que se anonadó a sí mismo y tomó la condición de esclavo, probado en todo exactamente como nosotros, menos en el pecado, y supliquémosle con fe ardiente, diciendo:'
    preces:
    - - Tú que al entrar en el mundo has inaugurado el tiempo nuevo anunciado por los profetas,
      - haz que tu Iglesia se rejuvenezca siempre.
    - - Tú que asumiste las debilidades de los hombres,
      - dígnate ser luz para los que no ven, fuerza para los débiles, consuelo para los tristes.
    - - Tú que naciste pobre y humilde,
      - mira con amor a los pobres y dígnate consolarlos.
    - - Tú que anuncias a todos la alegría de una vida sin fin por tu nacimiento terreno,
      - alegra a los agonizantes con la esperanza de un nacimiento a una vida eterna.
    - - Tú que descendiste al mundo para que los hombres pudiesen ascender al cielo,
      - admite en tu gloria a todos los difuntos.
    respuesta: Por tu nacimiento, socorre Señor, a quienes has redimido.
  oracion: Dios omnipotente y eterno, resplandor de las almas fieles, dígnate llenar el mundo de tu gloria y muéstrate a todos los pueblos con la claridad de tu luz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Porque Dios ha infundido en nuestros corazones un espíritu filial, nos atrevemos a decir:'
  ant_magnificat: El Don del cielo ha penetrado en las entrañas de la Virgen pura; y ella lleva en su seno un misterio que no había sospechado.
  salmodia:
  - ant: Con su consentimiento la Virgen concibió y, permeneciendo virgen, dio a luz al Rey de reyes.
    salmo: salmo-118-105-112
  - ant: Gozad con Jerusalén, porque el Señor hará derivar hacia ella como un río la paz.
    salmo: salmo-15
  - ant: Nos ha nacido el que es Dios de Dios, Luz de Luz, que ya existía desde el principio.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 1Jn 5, 20
    texto: Sabemos que el Hijo de Dios ha venido y nos ha dado inteligencia, para que conozcamos al Dios verdadero y para que estemos en él, su verdadero Hijo, el cual es Dios verdadero y es vida eterna.
II Domingo después de Navidad:
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  himno: Te diré mi amor, Rey mío
  preces:
    intro: 'Aclamemos alegres a Cristo, ante cuyo nacimiento los ángeles anunciaron la paz a la tierra, y supliquémosle, diciendo:'
    preces:
    - - Tú que con el misterio de tu nacimiento consuelas a la Iglesia,
      - cólmala también de todos tus bienes.
    - - Tú que has venido como pastor supremo y obispo de nuestras vidas,
      - haz que el papa y todos los obispos sean buenos administradores de la múltiple gracia de Dios.
    - - Rey de la eternidad, tú que al nacer quisiste experimentar las limitaciones humanas, sometiéndote a la brevedad de una vida como la nuestra,
      - haz que nosotros, caducos y mortales, seamos partícipes de tu vida eterna.
    - - Tú que, esperado durante largos siglos, viniste en el tiempo de la historia señalado por tu Padre,
      - manifiesta tu presencia a los que todavía te están esperando.
    - - Tú que, hecho carne, restauraste la naturaleza humana deteriorada por la muerte,
      - concede la plena salvación a los difuntos.
    respuesta: Que tu nacimiento, Señor, traiga la paz a todos los hombres.
  oracion: Dios omnipotente y eterno, resplandor de las almas fieles, dígnate llenar el mundo de tu gloria y muéstrate a todos los pueblos con la claridad de tu luz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Ya que somos la familia de Dios, digamos con grande confianza a nuestro Padre del cielo:'
  ant_magnificat: Dichoso el seno que llevó al Hijo del eterno Padre y el pecho que alimentó a Cristo, el Señor.
  salmodia:
  - ant: Nos ilumina el día de la nueva redención, del cumplimiento de las antiguas promesas, del anuncio de la felicidad eterna.
    salmo: salmo-109-1-5-7
  - ant: Mostró el Señor su gracia y su lealtad.
    salmo: salmo-113-b
  - ant: 'El Señor, el Rey de reyes, ha nacido por nosotros en la tierra: mirad, ha llegado ya la salvación del mundo y la redención de los hombres. Aleluia.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: 1Jn 1, 1-3
    texto: 'Lo que existía desde un principio, lo que hemos oído, lo que hemos visto con nuestros ojos, lo que contemplamos y lo que tocaron nuestras manos acerca de la Palabra de vida (porque la vida se ha manifestado, y nosotros hemos visto y testificamos y os anunciamos esta vida eterna, la que estaba con el Padre y se nos ha manifestado): lo que hemos visto y oído os lo anunciamos, a fin de que viváis en comunión con nosotros. Y esta nuestra comunión de vida es con el Padre y con su Hijo Jesucristo.'
Lunes después de la Epifanía:
  himno: Reyes que venís por ellas
  salmodia:
  - ant: Eres el más bello de los hombres, en tus labios se derrama la gracia.
    salmo: salmo-44-i
  - ant: Llega el esposo, salid a recibirlo.
    salmo: salmo-44-ii
  - ant: Dios proyectó hacer que todas las cosas tuviesen a Cristo por cabeza, cuando llegase el momento culminante.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Cf. 2Pe 1, 3-4
