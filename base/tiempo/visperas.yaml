  oracion: Dios todopoderoso, concede a tu pueblo permanecer siempre en vela aguardando la venida de tu Hijo, para que cumpliendo lo que el mismo autor de nuestra salvación nos enseñó, podamos salir a su encuentro con nuestras lámparas encendidas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
