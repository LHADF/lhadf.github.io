XV Domingo del Tiempo Ordinario (B):
  ant_magnificat: Los discípulos, sin llevar pan, ni alforja, ni dinero, predicaban a la gente para que se convirtiesen.
XV Domingo del Tiempo Ordinario (C):
  ant_magnificat: Ten cuidado del prójimo, y yo te abonaré a mi vuelta lo que hayas gastado en su favor.
XVI Domingo del Tiempo Ordinario (A) · I Vísperas:
  ant_magnificat: Abriré mis labios para hablar en parábolas; declararé cosas que han estado ocultas desde la creación del mundo.
XVI Domingo del Tiempo Ordinario (B) · I Vísperas:
  ant_magnificat: «Venid conmigo a retiraros a un lugar apartado y descansad un poco», dice el Señor.
