  himno: Oh bondadoso Creador, escucha
  preces:
    intro: 'Demos gloria y alabanza a Dios Padre que, por medio de su Hijo, la Palabra encarnada, nos hace renacer de un germen incorruptible y eterno, y supliquémosle, diciendo:'
    preces:
    - - Escucha, Dios de misericordia, la oración que te presentamos en favor de tu pueblo
      - y concede a tus fieles desear tu palabra más que el alimento del cuerpo.
    - - Enséñanos a amar de verdad y sin discriminación a nuestros hermanos y a los hombres de todas las razas,
      - y a trabajar por su bien y por la concordia mutua.
    - - Pon tus ojos en los catecúmenos que se preparan para el bautismo
      - y haz de ellos piedras vivas y templo espiritual en tu honor.
    - - Tú que por la predicación de Jonás exhortaste a los ninivitas a la penitencia,
      - haz que tu palabra llame a los pecadores a la conversión.
    - - Haz que los moribundos esperen confiadamente el encuentro con Cristo,
      - su juez, y gocen eternamente de tu presencia.
    respuesta: Señor, ten piedad de tu pueblo.
  oracion: 'Te pedimos, Señor todopoderoso, que las celebraciones y las penitencias de esta Cuaresma nos ayuden a progresar en el camino de nuestra conversión: así conoceremos mejor y viviremos con mayor plenitud las riquezas inagotables del misterio de Cristo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
  padrenuestro_intro: 'Unidos fraternalmente, dirijamos al Padre nuestra oración común:'
  ant_magnificat: Vela sobre nosotros, Salvador eterno; sé tú nuestro protector, que no nos sorprenda el tentador astuto.
  salmodia:
  - ant: Al Señor, tu Dios, adorarás y a él sólo darás culto.
    salmo: salmo-109-1-5-7
  - ant: Ahora es el tiempo propicio, ahora es el día de salvación.
    salmo: salmo-113-a
  - ant: Ya veis que subimos a Jerusalén, y todas las cosas que fueron escritas acerca del Hijo del hombre van a tener ya su cumplimiento.
    salmo: cantico-1pe-2-21b-24
  lectura:
    ref: 1Co 9, 24-25
    texto: Los atletas que corren en el estadio corren todos, pero uno sólo consigue el premio. Corred como él, para conseguirlo. Todo atleta se impone moderación en todas sus cosas. Ellos lo hacen para alcanzar una corona que se marchita; nosotros una que no se ha de marchitar jamás.
Lunes de la I semana de Cuaresma:
  himno: Ésta es la hora para el buen amigo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
    - Señor, ten misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Lo que hicisteis con uno de estos mis humildes hermanos conmigo lo hicisteis.
  preces:
    intro: 'Invoquemos al Señor Jesús, que nos ha salvado a nosotros, su pueblo, librándonos de nuestros pecados, y digámosle humildemente:'
    preces:
    - - 'Te pedimos, Señor Jesús, por tu Iglesia santa, por la que te entregaste para consagrarla con el baño del agua y con la palabra:'
      - purifícala y renuévala por la penitencia.
    - - Maestro bueno, haz que los jóvenes descubran el camino que les preparas
      - y que respondan siempre con generosidad a tus llamadas.
    - - Tú que te compadeciste de los enfermos que acudían a ti, levanta la esperanza de nuestros enfermos
      - y haz que imitemos tu gesto generoso y estemos siempre atentos al bien de los que sufren.
    - - Haz, Señor, que recordemos siempre nuestra condición de hijos tuyos, recibida en el bautismo,
      - y que vivamos siempre para ti.
    - - Da tu paz y el premio eterno a los difuntos
      - y reúnenos un día con ellos en tu reino.
    respuesta: Jesús, Hijo de David, compadécete de nosotros.
  padrenuestro_intro: 'Con el gozo de sabernos hijos de Dios, acudamos a nuestro Padre, diciendo:'
  oracion: Conviértenos a ti, Dios salvador nuestro, y ayúdanos a progresar en el conocimiento de tu palabra, para que así la celebración de esta Cuaresma dé en nosotros fruto abundante. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la I semana de Cuaresma:
  himno: No me pesa, Señor, haber faltado
  lectura:
    ref: St 2, 14. 17. 18b
    texto: 'Hermanos, ¿qué provecho saca uno con decir: «Yo tengo fe», si no tiene obras? ¿Podrá acaso salvarlo la fe? La fe, si no va acompañada de las obras, está muerta en su soledad. Pruébame tu fe sin obras que yo por mis obras te probaré mi fe.'
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
    - Señor, ten misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Tú, cuando vayas a rezar, entra en tu aposento, cierra la puerta y ora a tu Padre.
  preces:
    intro: 'A Cristo, el Señor, que nos mandó velar y orar a fin de no sucumbir en la tentación, digámosle confiadamente:'
    preces:
    - - Señor, tú que prometiste estar presente cuando tus discípulos se reúnen en tu nombre para orar,
      - haz que oremos siempre unidos a ti en el Espíritu Santo, a fin de que tu reino llegue a todos los hombres.
    - - Purifica de todo pecado a la Iglesia penitente
      - y haz que viva siempre en la esperanza y el gozo del Espíritu Santo.
    - - Amigo del hombre, haz que estemos siempre atentos, como tú nos mandaste, al bien del prójimo,
      - para que la luz de tu amor brille a través de nosotros ante todos los hombres.
    - - Rey pacífico, haz que tu paz reine en el mundo
      - y que nosotros trabajemos sin cesar para conseguirla.
    - - Tú que has muerto para que nosotros tengamos vida,
      - da la vida eterna a los que han muerto.
    respuesta: Señor, escucha y ten piedad.
  padrenuestro_intro: 'Terminemos nuestra oración diciendo juntos las palabras del Señor y pidiendo al Padre que nos libre de todo mal:'
  oracion: Señor, mira con amor a tu pueblo, que trata de purificar su espíritu en estos días cuaresmales con la moderación en el uso de las cosas terrenas, y haz que esta sobriedad alimente en él el deseo de poseerte. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
