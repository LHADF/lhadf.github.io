  preces:
    intro: 'Oremos a Cristo, vida y resurrección de todos los hombres, y digámosle con fe:'
    preces:
    - - 'Te rogamos, Señor, por tu Iglesia extendida por todo el mundo:'
      - santifícala y haz que cumpla su misión de llevar tu reino a todos los hombres.
    - - 'Te pedimos por los que sufren hambre y por los que están tristes, por los enfermos, los oprimidos y los desterrados:'
      - dales, Señor, ayuda y consuelo.
    - - 'Te pedimos por los que se han apartado de ti por el error o por el pecado:'
      - que obtengan la gracia de tu perdón y el don de una vida nueva.
    - - Salvador del mundo, tú que fuiste crucificado, resucitaste y has de venir a juzgar al mundo,
      - ten piedad de nosotros, pecadores.
    - - Te rogamos, Señor, por los que viven en el mundo y por los que han salido ya de él,
      - con la esperanza de la resurrección.
    respuesta: Hijo de Dios vivo, protege a tu pueblo.
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  salmodia:
