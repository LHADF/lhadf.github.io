  himno: Oh bondadoso Creador, escucha
  preces:
    intro: 'Demos siempre gracias a Cristo, nuestra cabeza y nuestro maestro, que vino a servir y a hacer el bien a todos, y digámosle humilde y confiadamente:'
    preces:
    - - Asiste, Señor, a los obispos y presbíteros de la Iglesia y haz que cumplan bien su misión de ser instrumentos tuyos, cabeza y pastor de la Iglesia,
      - para que por medio de ti conduzcan a todos los hombres al Padre.
    - - Que tus ángeles sean compañeros de camino de los que están de viaje,
      - para que se vean libres de todo peligro de cuerpo y de alma.
    - - Enséñanos, Señor, a servir a todos los hombres,
      - imitándote a ti, que viniste a servir y no a ser servido.
    - - Haz que en toda comunidad humana reine un espíritu fraternal,
      - para que, estando tú en medio de ella, sea como una plaza fuerte.
    - - Sé misericordioso, Señor,
      - con todos los difuntos y admítelos a contemplar la luz de tu rostro.
    respuesta: Atiende, Señor, a tu Iglesia.
  oracion: Señor Dios, que por tu Palabra hecha carne has reconciliado contigo admirablemente al género humano, haz que el pueblo cristiano se apreste a celebrar las próximas fiestas pascuales con una fe viva y con una entrega generosa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Unidos fraternalmente, dirijamos al Padre nuestra oración común:'
  salmodia:
  - ant: Él ha sido constituido por Dios Juez de vivos y muertos.
    salmo: salmo-109-1-5-7
  - ant: 'Dichoso el que se apiada por amor del Señor: su recuerdo será perpetuo.'
    salmo: salmo-111
  - ant: Lo que Dios había dicho por los profetas, que su Mesías tenía que padecer, lo ha cumplido.
    salmo: cantico-1pe-2-21b-24
  lectura:
    ref: 1Co 9, 24-25
    texto: Los atletas que corren en el estadio corren todos, pero uno sólo consigue el premio. Corred como él, para conseguirlo. Todo atleta se impone moderación en todas sus cosas. Ellos lo hacen para alcanzar una corona que se marchita; nosotros una que no se ha de marchitar jamás.
IV Domingo de Cuaresma «Lætare» (A):
  ant_magnificat: He lavado mis ojos en la fuente; ahora veo, Señor, y creo en ti
IV Domingo de Cuaresma «Lætare» (B):
  ant_magnificat: 'El Hijo del Hombre será levantado en alto: el que cre en él tendrá vida eterna'
IV Domingo de Cuaresma «Lætare» (C):
  ant_magnificat: 'Este hermano tuyo había muerto y ha vuelto a la vida, se había perdido y lo hemos hallado: hagamos fiesta y alegrémonos.'
Lunes de la IV semana de Cuaresma:
  himno: Ésta es la hora para el buen amigo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  - - V
    - Sáname, porque he pecado contra ti.
  - - R
    - Señor, ten misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: 'Comprobó el padre que en aquella misma hora le había dicho Jesús: «Tu hijo se encuentra bien»; y creyó él y toda su casa.'
  preces:
    intro: 'Bendigamos a Dios, nuestro Padre, que por la palabra de su Hijo prometió escuchar la oración de los que se reúnen en su nombre, y, confiados en esta promesa, supliquémosle, diciendo:'
    preces:
    - - Señor, tú que en la montaña del Sinaí diste a conocer tu ley por medio de Moisés y la perfeccionaste luego por Cristo,
      - haz que todos los hombres descubran que tienen esta ley inscrita en el corazón y que la deben guardar para hacer efectiva la alianza que has hecho con ellos.
    - - Concede a los superiores fraternal solicitud hacia los que les han sido confiados,
      - y a los súbditos espíritu de obediente colaboración.
    - - Fortalece el espíritu y el corazón de los misioneros
      - y suscita en todas partes colaboradores de su obra.
    - - Que los niños crezcan en gracia y en edad,
      - y que los jóvenes se abran con sinceridad a tu amor.
    - - Acuérdate de nuestros hermanos que ya duermen el sueño de la paz
      - y dales parte en la vida eterna.
    respuesta: Escucha a tu pueblo, Señor.
  padrenuestro_intro: 'Digamos a nuestro Padre, juntamente con Jesús, la oración que él nos enseñó:'
  oracion: Dios nuestro, que renuevas el mundo por medio de sacramentos divinos, haz que tu Iglesia progrese por la celebración de estos sacramentos de vida eterna y no permitas que le falten nunca los auxilios necesarios para su vida terrena. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la IV semana de Cuaresma:
  himno: No me pesa, Señor, haber faltado
  lectura:
    ref: St 2, 14. 17. 18b
    texto: 'Hermanos, ¿qué provecho saca uno con decir: «Yo tengo fe», si no tiene obras? ¿Podrá acaso salvarlo la fe? La fe, si no va acompañada de las obras, está muerta en su soledad. Pruébame tu fe sin obras que yo por mis obras te probaré mi fe.'
  responsorio:
  - - V
    - 'Yo dije: «Señor, ten misericordia.»'
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
