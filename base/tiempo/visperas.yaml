  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Yo dije: «Señor, ten misericordia.»'
  ant_magnificat: Todos vosotros sois hermanos; no déis entre vosotros a nadie el título de padre, porque uno solo es vuestro Padre, el que está en los cielos; ni os proclaméis maestros, porque uno solo es vuestro maestro, el Mesías.
  preces:
    intro: 'Oremos a Jesús, el Señor, que levantado en la cruz atrae a todos hacia él, y digámosle:'
    preces:
    - - Señor, que la luz con que resplandece el misterio de la cruz atraiga a todos los hombres,
      - para que te reconozcan como camino, verdad y vida.
    - - Da tu agua viva a todos los sedientos de verdad,
      - para que su sed quede eternamente saciada.
    - - Ilumina a los científicos y a los artistas,
      - para que el progreso sea también camino de salvación.
    - - Mueve los corazones de los que se apartaron de ti a causa del pecado o del escándalo,
      - para que se conviertan a ti y permanezcan en tu amor.
    - - Admite en tu reino a todos los difuntos,
      - para que se alegren eternamente con la Virgen María y con todos los santos.
    respuesta: Atrae, Señor, a todos hacia ti.
  padrenuestro_intro: 'Que el Espíritu que habita en nosotros y nos une en su amor nos ayude a decir:'
  oracion: Señor, vela con amor constante sobre tu Iglesia, edificada en la debilidad humana, y, pues sin ti la naturaleza mortal sucumbe, que tu Protección la preserve siempre del mal y la encamine por las sendas de la salvación. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
