XVII Domingo del Tiempo Ordinario (A):
  ant_magnificat: 'El reino de los cielos es una perla fina: el que la encuentra vende todo lo que tiene y la compra.'
XVII Domingo del Tiempo Ordinario (B):
  ant_magnificat: 'La gente, al ver la señal que Jesús había hecho, comenzó a decir: «Éste es, sin duda, el profeta que iba a venir al mundo.»'
XVII Domingo del Tiempo Ordinario (C):
  ant_magnificat: Pedid y recibiréis; buscad y hallaréis; llamad y se os abrirá.
