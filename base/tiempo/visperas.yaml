  ant_magnificat: Nadie tiene más amor que el que da la vida por sus amigos. Aleluia.
  preces:
    intro: 'Invoquemos a Cristo, camino, verdad y vida, y digámosle:'
    preces:
    - - 'Te rogamos, Señor, por los ministros de tu Iglesia: que, al distribuir entre sus hermanos el pan de vida,'
      - encuentren también ellos en el pan que distribuyen su alimento y fortaleza.
    - - 'Te pedimos por todo el pueblo cristiano: que viva, Señor, como pide la vocación a que ha sido convocado'
      - y se esfuerce por mantener la unidad del Espíritu con el vínculo de la paz.
    - - 'Te pedimos por los que rigen los destinos de las naciones: que cumplan su misión con espíritu de justicia y con amor,'
      - para que haya paz y concordia entre los pueblos.
    - - Señor, que podamos celebrar tu santa resurrección con tus ángeles y tus santos,
      - y que nuestros hermanos difuntos, a quienes encomendamos a tu bondad, se alegren también en tu reino.
    respuesta: Hijo de Dios vivo, bendice a tu pueblo.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Señor, concédenos realizar plenamente en nosotros mismos el misterio pascual, para que la alegría que experimentamos en estas fiestas nos dé una fuerza constante que nos lleve a la salvación. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VI Domingo de Pascua (A) · I Vísperas:
  ant_magnificat: Yo rogaré al Padre y él os dará otro Abogado que esté con vosotros para siempre. Aleluia
VI Domingo de Pascua (B) · I Vísperas:
  ant_magnificat: Guardad mis mandamientos, para que mi gozo esté en vosotros, y vuestro gozo quede colmado. Aleluia
VI Domingo de Pascua (C) · I Vísperas:
  ant_magnificat: El Espíritu Santo, que el Padre enviará en mi nombre, os traerá a la memoria todo lo que os he hablado. Aleluia
