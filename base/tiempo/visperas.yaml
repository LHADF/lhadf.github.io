  ant_magnificat: Predicad el reino, curad a los enfermos, arrojad a los demonios; dad gratuitamente lo que de gracia habéis recibido.
XI Domingo del Tiempo Ordinario (B):
  ant_magnificat: La pequeña semilla se transforma en un árbol, y ofrece cobijo a las aves del cielo.
XI Domingo del Tiempo Ordinario (C):
  ant_magnificat: 'Dijo Jesús a aquella mujer: «Tu fe te ha salvado, vete en paz.»'
