  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  ant_magnificat: Lo que de la carne nace carne es, y lo que nace del Espíritu espíritu es. Aleluia.
  preces:
    intro: 'Llenos de gozo, oremos a Cristo, el Señor, que con su resurrección ha iluminado al mundo entero, y digámosle:'
    preces:
    - - Señor Jesús, que te hiciste compañero de camino de los discípulos que dudaban de ti,
      - acompaña también a tu Iglesia peregrina entre las dificultades e incertidumbres de esta vida.
    - - No permitas que tus fieles sean tardos y necios para creer,
      - y aumenta su fe para que te proclamen vencedor de la muerte.
    - - Mira, Señor, con bondad a cuantos no te reconocieron en su camino,
      - y manifiéstate a ellos para que te confiesen como salvador suyo.
    - - Tú que por la cruz reconciliaste a todos los hombres, uniéndolos, en tu cuerpo,
      - concede la paz y la unidad a las naciones.
    - - Tú que eres el juez de vivos y muertos,
      - otorga a los difuntos que creyeron en ti la remisión de todas sus culpas.
    respuesta: Cristo, vida nuestra, escúchanos.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la II semana de Pascua:
  himno: Nos reúne de nuevo el misterio
  salmodia:
  - ant: Aspirad a los bienes de arriba, no a los de la tierra. Aleluia.
    salmo: salmo-48-i
  - ant: El Señor me salva de las garras del abismo. Aleluia.
    salmo: salmo-48-ii
  - ant: Tuyos son, Señor, el poder y la riqueza, la fuerza y la gloria. Aleluia.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1Pe 2, 4-5
    texto: Acercándoos al Señor, la piedra viva, rechazada por los hombres, pero escogida y apreciada por Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo.
  responsorio:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  - - V
    - Al ver al Señor.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los discípulos se llenaron de alegría. Aleluia. Aleluia.
  ant_magnificat: ¿Verdad que nuestros corazones ardían dentro de nosotros, mientras nos hablaba Jesús en el camino? Aleluia.
  preces:
    intro: 'Invoquemos a Cristo, que con su resurrección ha reanimado la esperanza de su pueblo, y digámosle:'
    preces:
    - - Señor Jesús, de cuyo costado abierto salió sangre y agua,
      - haz de la Iglesia tu esposa inmaculada.
    - - Pastor supremo de la Iglesia, que después de tu resurrección encomendaste a Pedro, al confesarte su amor, el cuidado de tus ovejas,
      - concede al papa Francisco un amor ardiente y un celo apostólico.
    - - Tú que concediste una pesca abundante a los discípulos que pescaban en el mar,
      - envía operarios que continúen su trabajo apostólico.
    - - Tú que preparaste a la orilla del mar el pan y los peces para los discípulos,
      - no permitas que nuestros hermanos mueran de hambre por culpa nuestra.
    - - Señor Jesús, nuevo Adán, que nos das la vida, transforma a nuestros difuntos a imagen tuya,
      - para que compartan contigo la alegría de tu reino.
    respuesta: Señor Jesús, tú que siempre vives para interceder por nosotros, escúchanos.
  padrenuestro_intro: 'Sintiéndonos verdaderos hijos de Dios, digamos a nuestro Padre:'
  oracion: Dios todopoderoso, haz que sepamos anunciar al mundo la victoria de Cristo resucitado y, ya que nos has dado la prenda de su obra redentora, concédenos llegar a poseer plenamente los dones prometidos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la II semana de Pascua:
  himno: Hoy rompe la clausura
  salmodia:
  - ant: No se turbe vuestro corazón; tan sólo creed en mí. Aleluia.
    salmo: salmo-61
  - ant: ¡Oh Dios!, que te alaben los pueblos, que se alegren por tu salvación. Aleluia.
    salmo: salmo-66
  - ant: Su resplandor eclipsa el cielo, la tierra se llena de su alabanza. Aleluia.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Hb 7, 24-27
