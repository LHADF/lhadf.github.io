  himno: Éste es el tiempo en que llegas
  preces:
    intro: 'Oremos a Jesucristo, nuestro redentor, que es camino, verdad y vida de los hombres, y digámosle:'
    preces:
    - - Jesús, Hijo del Altísimo, anunciado por el ángel Gabriel a María Virgen,
      - ven a reinar para siempre sobre tu pueblo.
    - - Santo de Dios, ante cuya venida el precursor saltó de gozo en el seno de Isabel,
      - ven y alegra al mundo con la gracia de la salvación.
    - - Jesús, Salvador, cuyo nombre el ángel reveló a José,
      - ven a salvar al pueblo de sus pecados.
    - - Luz del mundo, a quien esperaban Simeón y todos los justos,
      - ven a consolar a tu pueblo.
    - - Sol naciente, de quien Zacarías profetizó que nos visitaría de lo alto,
      - ven a iluminar a los que viven en tiniebla y en sombra de muerte.
    respuesta: Ven, Señor, y quédate con nosotros.
  oracion: Señor, despierta en tus fieles el deseo de prepararse a la venida de Cristo por la práctica de las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino celestial. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Pidamos ahora con grande confianza la venida del reino de Dios, con las palabras que Cristo nos enseñó:'
  ant_magnificat: No temas, María, porque has encontrado gracia ante Dios. Concebirás en tu seno y darás a luz un hijo. Aleluia.
  salmodia:
  - ant: Hija de Sión, alégrate; salta de gozo, hija de Jerusalén. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: 'Vendrá nuestro rey, Cristo, el Señor: el cordero de quien Juan anunció la venida.'
    salmo: salmo-113-a
  - ant: Llego enseguida y traigo conmigo mi salario, para pagar a cada uno según sus propias obras.
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: Flp 4, 4-5
    texto: 'Estad siempre alegres en el Señor. Otra vez os lo digo: Estad alegres. Que vuestra bondad sea conocida de todos. El Señor está cerca.'
Lunes de la I semana de Adviento:
  himno: Jesucristo, Palabra del Padre
  lectura:
    ref: Flp 3, 20b-21
    texto: Esperamos que venga como salvador Cristo Jesús, el Señor. Él transfigurará nuestro cuerpo de humilde condición en un cuerpo glorioso, semejante al suyo, en virtud del poder que tiene para someter a su imperio todas las cosas.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: El ángel del Señor anunció a María, y concibió por obra del Espíritu Santo. Aleluia.
  preces:
    intro: 'Oremos al Señor, que vendrá y nos salvará, y digámosle:'
    preces:
    - - Señor Jesús, ungido del Padre y salvador de los hombres,
      - ven pronto y sálvanos.
    - - Tú que viniste al mundo,
      - líbranos del pecado del mundo.
    - - Tú que Viniste del Padre,
      - muéstranos el camino para ir al Padre.
    - - Tú que fuiste concebido por obra del Espíritu Santo,
      - renuévanos a nosotros con la fuerza de este mismo Espíritu Santo.
    - - Tú que te hiciste hombre en el seno de la Virgen María,
      - líbranos de la corrupción de la carne.
    - - Acuérdate, Señor,
      - de todos los hombres que desde el comienzo del mundo esperaron en ti.
    respuesta: Ven, Señor, y sálvanos.
  padrenuestro_intro: 'Siguiendo la enseñanza del Salvador, oremos a Dios, diciendo:'
  oracion: Concédenos, Señor Dios nuestro, anhelar de tal manera la llegada de tu Hijo Jesucristo, que, cuando llame a nuestras puertas, nos encuentre velando en oración y cantando sus alabanzas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la I semana de Adviento:
  himno: Éste es el tiempo en que llegas
  lectura:
    ref: Cf. 1Co 1,7b-9
    texto: Esperamos vivamente la revelación de Jesucristo, Señor nuestro. Él nos fortalecerá hasta el fin, de modo que nos encontremos libres de culpa en el día de Jesucristo, nuestro Señor. Fiel es Dios, por quien hemos sido convocados a la unión con su Hijo.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: Buscad al Señor mientras se deja encontrar, invocadlo mientras está cerca. Aleluia.
  preces:
    intro: 'Cristo, palabra eterna, ha inaugurado un camino nuevo y vivo, a través del velo de su propia carne, para entrar en el santuario; pidámosle, pues, con humildad:'
    preces:
    - - Oh Dios, en quien vivimos, nos movemos y existimos,
      - ven a revelarnos que somos estirpe tuya.
    - - Tú que no estás lejos de ninguno de nosotros,
      - muéstrate en seguida a todos los que te buscan.
    - - Padre de los pobres y consuelo de los afligidos,
      - da la libertad a los cautivos y la alegría a los tristes.
    - - Tú que destruyes la muerte y haces brillar la vida,
      - líbranos a nosotros y a todos los difuntos de la muerte eterna.
    respuesta: Ven, Señor, y sálvanos.
  padrenuestro_intro: 'Digamos con Jesús a nuestro Padre del cielo la oración de los hijos de Dios:'
  oracion: Señor, Dios nuestro, acoge favorablemente nuestras súplicas y concédenos tu ayuda en las tribulaciones, para que, reanimados por la venida de tu Hijo, que ya se acerca, no volvamos a caer más en nuestras antiguas faltas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la I semana de Adviento:
  himno: Jesucristo, Palabra del Padre
  lectura:
    ref: 1 Co 4, 5
    texto: No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: De Sión saldrá la ley, de Jerusalén la palabra del Señor.
  preces:
    intro: 'Invoquemos a Dios Padre, que nos envió a su Hijo para que nos trajera una paz sin límites, y digámosle:'
    preces:
    - - Mira, Padre santo, a tu Iglesia
      - y ven a visitar tu viña, la cepa que tu diestra plantó.
    - - Señor Dios, que eres siempre fiel a tus promesas, acuérdate de los hijos de Abraham
      - y da cumplimiento en ellos a las promesas que hiciste a sus padres.
    - - Mira, Dios de clemencia, a los paganos, y llámalos, por tu misericordia,
      - para que también ellos te alaben y glorifiquen.
    - - Visita, Pastor eterno, las ovejas de tu rebaño
      - Y reúnelas a todas en tus verdes praderas.
    - - Acuérdate también de los que han salido de este mundo en tu paz
      - y recíbelos en el reino de tu Hijo.
    respuesta: Venga tu reino, Señor.
  padrenuestro_intro: 'Jesucristo nos ha revelado que Dios es nuestro Padre; por eso nos atrevemos a decir:'
  oracion: Señor, Dios nuestro, prepara tú mismo nuestros corazones, para que, cuando venga tu Hijo Jesucristo, nos encuentre dignos del festín de la vida eterna y merezcamos ser invitados por él mismo a la mesa de su reino celestial. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la I semana de Adviento:
  himno: Jesucristo, Palabra del Padre
  lectura:
    ref: St 5, 7-8. 9b
    texto: Aguardad con paciencia, hermanos, hasta la manifestación del Señor. Ved cómo el labrador espera el precioso fruto de la tierra. Lo va aguardando pacientemente, hasta que la tierra reciba las lluvias tempranas y las tardías. Aguardad también vosotros con toda paciencia, fortaleced vuestros corazones, porque la manifestación del Señor está ya cerca. Mirad que el juez está a las puertas.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  preces:
    intro: 'Imploremos a Cristo, luz resplandeciente que brilla para los que habitan en tierras de sombra, como anunciaron los profetas, y digámosle:'
    preces:
    - - Cristo, Palabra de Dios, que en el principio creaste todas las cosas y en la etapa final del mundo tomaste nuestra naturaleza humana,
      - ven y arráncanos de la muerte.
    - - Luz verdadera que alumbra a todo hombre,
      - ven y disipa las tinieblas de nuestra ignorancia.
    - - Hijo único que estás en el seno del Padre,
      - ven y danos a conocer el amor de Dios.
    - - Cristo Jesús, que viniste a nosotros como Hijo del hombre,
      - concede a cuantos te reciben el poder de ser hijos de Dios.
    - - Tú que abres las puertas de todas las cárceles,
      - admite en el festín de tus bodas a cuantos aguardan a su entrada.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Siguiendo la enseñanza del Salvador, oremos a Dios, diciendo:'
  oracion: Muestra, Señor, tu poder y ven a socorrernos, para que la abundancia de tu misericordia nos alcance los bienes que nuestros pecados han retardado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la I semana de Adviento:
  himno: Jesucristo, Palabra del Padre
  lectura:
    ref: 2Pe 3,8b-9
    texto: Para el Señor un día es como mil años, y mil años como un día. No es tardo el Señor en el cumplimiento de sus promesas, como algunos piensan. Lo que hace es aguardarnos pacientemente, porque no quiere que nadie perezca, sino que todos vengáis a arrepentiros.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: 'Yo desde Egipto llamé a mi Hijo: vendrá y salvará a su pueblo.'
  preces:
    intro: 'Invoquemos confiados a Cristo, pastor y guardián de nuestras vidas, y digámosle:'
    preces:
    - - Buen Pastor del rebaño de Dios,
      - ven a reunir a todos los hombres en tu Iglesia.
    - - Ayuda, Señor, a los pastores de tu pueblo peregrino,
      - para que apacienten sin desfallecer a tu grey hasta que vuelvas.
    - - Escoge de entre nosotros pregoneros de tu palabra,
      - para que anuncien tu Evangelio hasta los confines del mundo.
    - - Ten compasión de los que en su trabajo desfallecen a mitad del camino;
      - haz que encuentren un amigo que los levante.
    - - Muestra tu gloria en el gozo de tu reino a los que en este destierro escucharon tu voz.
      - ''
    respuesta: Favorécenos, Señor, por tu bondad.
  padrenuestro_intro: 'Digamos con Jesús a nuestro Padre del cielo la oración de los hijos de Dios:'
  oracion: Muestra, Señor, tu poder y ven a nosotros, para que por tu protección nos veamos libres de los peligros que nos amenazan a causa de nuestros pecados. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
