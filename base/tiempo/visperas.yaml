  ant_magnificat: El Abogado, el Espíritu, permanece con vosotros y estará en vosotros. Aleluia.
  preces:
    intro: 'Demos gracias a Cristo, que por medio del Espíritu Santo levantó la esperanza de los apóstoles y llena de dones a la Iglesia, y, unidos a todos los fieles, supliquémosle, diciendo:'
    preces:
    - - Señor Jesús, mediador entre Dios y los hombres, tú que has elegido a los sacerdotes como colaboradores tuyos,
      - haz que por la acción de tus ministros todos los hombres lleguen al Padre.
    - - Haz que los pobres y los ricos se ayuden mutuamente, reconociéndote a ti como único Señor,
      - y que los ricos no pongan su gloria en sus bienes.
    - - Revela tu Evangelio a todos los pueblos,
      - para que todos alcancen el don de la fe.
    - - Envía tu Espíritu consolador a los que viven desconsolados,
      - para que enjugue las lágrimas de los que lloran.
    - - Purifica a los difuntos de todas sus culpas y recíbelos en tu reino,
      - junto con tus santos y elegidos.
    respuesta: Levanta, Señor, la esperanza de tu Iglesia.
  padrenuestro_intro: 'Concluyamos nuestras súplicas con la oración que el mismo Cristo nos enseñó:'
  oracion: Ayúdanos, Señor, Dios nuestro, con la fuerza del Espíritu Santo, para que podamos mantenernos fieles a tu voluntad y llevar una conducta digna de tu amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
