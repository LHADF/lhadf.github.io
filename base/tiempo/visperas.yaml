Jueves Santo:
  himno: En la Cena del Cordero
  salmodia:
  - ant: El primogénito de entre los muertos, el príncipe de los reyes de la tierra ha hecho de nosotros un reino para Dios, su Padre.
    salmo: salmo-71-i
  - ant: El Señor librará al pobre que clamaba, al afligido que no tenía protector.
    salmo: salmo-71-ii
  - ant: Los santos vencieron en virtud de la sangre del Cordero y por la palabra del testimonio que dieron.
    salmo: cantico-ap-11-17-18-12-10b-12a
  lectura:
    ref: Hb 13, 12-15
    texto: Jesús, para santificar con su propia sangre al pueblo, padeció la muerte fuera de la ciudad. Salgamos, pues, hacia él fuera del campamento, cargando con su oprobio. Porque no tenemos aquí ciudad permanente, sino que vamos buscando la futura. Por medio de él ofrezcamos continuamente a Dios un sacrificio de alabanza, es decir, el tributo de los labios que van bendiciendo su nombre.
  ant_magnificat: Cuando estaban cenando, Jesús tomó pan, rezó la bendición, lo partió y lo dio a sus discípulos.
  preces:
    intro: 'Adoremos a nuestro Salvador, que en la última Cena, la noche misma en que iba a ser entregado, confió a su Iglesia la celebración perenne del memorial de su muerte y resurrección; oremos, diciendo:'
    preces:
