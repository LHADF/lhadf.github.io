  lectura:
    ref: Cf. 1Co 1,7b-9
    texto: Esperamos vivamente la revelación de Jesucristo, Señor nuestro. Él nos fortalecerá hasta el fin, de modo que nos encontremos libres de culpa en el día de Jesucristo, nuestro Señor. Fiel es Dios, por quien hemos sido convocados a la unión con su Hijo.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: No cohabitaban todavía y María se encontró encinta por obra del Espíritu Santo. Aleluia.
  preces:
    intro: 'Cristo, palabra eterna, ha inaugurado un camino nuevo y vivo, a través del velo de su propia carne, para entrar en el santuario; pidámosle, pues, con humildad:'
    preces:
    - - Oh Dios, en quien vivimos, nos movemos y existimos,
      - ven a revelarnos que somos estirpe tuya.
    - - Tú que no estás lejos de ninguno de nosotros,
      - muéstrate en seguida a todos los que te buscan.
    - - Padre de los pobres y consuelo de los afligidos,
      - da la libertad a los cautivos y la alegría a los tristes.
    - - Tú que destruyes la muerte y haces brillar la vida,
      - líbranos a nosotros y a todos los difuntos de la muerte eterna.
    respuesta: Ven, Señor, y sálvanos.
  padrenuestro_intro: 'Digamos con Jesús a nuestro Padre del cielo la oración de los hijos de Dios:'
  oracion: Dios nuestro, que por medio de tu Hijo has hecho que volvamos a nacer como nuevas creaturas, mira con amor estas obras de tu misericordia y, por la venida de tu Hijo, borra en nosotros toda huella de pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la III semana de Adviento:
  himno: Jesucristo, Palabra del Padre
  lectura:
    ref: 1 Co 4, 5
    texto: No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: Tú eres, Señor, el que has de venir, tú aquel a quien esperamos, tú el que salvarás a tu pueblo.
  preces:
    intro: 'Invoquemos a Dios Padre, que nos envió a su Hijo para que nos trajera una paz sin límites, y digámosle:'
    preces:
    - - Mira, Padre santo, a tu Iglesia
      - y ven a visitar tu viña, la cepa que tu diestra plantó.
    - - Señor Dios, que eres siempre fiel a tus promesas, acuérdate de los hijos de Abraham
      - y da cumplimiento en ellos a las promesas que hiciste a sus padres.
    - - Mira, Dios de clemencia, a los paganos, y llámalos, por tu misericordia,
      - para que también ellos te alaben y glorifiquen.
    - - Visita, Pastor eterno, las ovejas de tu rebaño
      - Y reúnelas a todas en tus verdes praderas.
    - - Acuérdate también de los que han salido de este mundo en tu paz
      - y recíbelos en el reino de tu Hijo.
    respuesta: Venga tu reino, Señor.
  padrenuestro_intro: 'Jesucristo nos ha revelado que Dios es nuestro Padre; por eso nos atrevemos a decir:'
  oracion: Concédenos, Dios todopoderoso, que la ya cercana solemnidad del nacimiento de tu Hijo nos depare los auxilios que necesitamos en esta vida y nos alcance el premio de la eterna felicidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la III semana de Adviento:
  himno: Éste es el tiempo en que llegas
  lectura:
    ref: St 5, 7-8. 9b
    texto: Aguardad con paciencia, hermanos, hasta la manifestación del Señor. Ved cómo el labrador espera el precioso fruto de la tierra. Lo va aguardando pacientemente, hasta que la tierra reciba las lluvias tempranas y las tardías. Aguardad también vosotros con toda paciencia, fortaleced vuestros corazones, porque la manifestación del Señor está ya cerca. Mirad que el juez está a las puertas.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: Festejad a Jerusalén, gozad con ella, todos los que la amáis, alegraos para siempre de su alegría.
  preces:
    intro: 'Imploremos a Cristo, luz resplandeciente que brilla para los que habitan en tierras de sombra, como anunciaron los profetas, y digámosle:'
    preces:
    - - Cristo, Palabra de Dios, que en el principio creaste todas las cosas y en la etapa final del mundo tomaste nuestra naturaleza humana,
      - ven y arráncanos de la muerte.
    - - Luz verdadera que alumbra a todo hombre,
      - ven y disipa las tinieblas de nuestra ignorancia.
    - - Hijo único que estás en el seno del Padre,
      - ven y danos a conocer el amor de Dios.
    - - Cristo Jesús, que viniste a nosotros como Hijo del hombre,
      - concede a cuantos te reciben el poder de ser hijos de Dios.
    - - Tú que abres las puertas de todas las cárceles,
      - admite en el festín de tus bodas a cuantos aguardan a su entrada.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Siguiendo la enseñanza del Salvador, oremos a Dios, diciendo:'
  oracion: Señor, que la venida salvadora de tu Hijo alegre a tus siervos, a quienes ahora entristece el peso de sus culpas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la III semana de Adviento:
  himno: Jesucristo, Palabra del Padre
  lectura:
    ref: 2Pe 3,8b-9
    texto: Para el Señor un día es como mil años, y mil años como un día. No es tardo el Señor en el cumplimiento de sus promesas, como algunos piensan. Lo que hace es aguardarnos pacientemente, porque no quiere que nadie perezca, sino que todos vengáis a arrepentiros.
  responsorio:
  - - V
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  - - V
    - Que brille tu rostro y nos salve.
  - - R
    - Señor Dios de los ejércitos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ven a salvarnos, Señor Dios de los ejércitos.
  ant_magnificat: 'Ésta es la declaración que hizo Juan: «El que viene después de mí ya existía antes que yo.»'
  preces:
    intro: 'Invoquemos confiados a Cristo, pastor y guardián de nuestras vidas, y digámosle:'
    preces:
    - - Buen Pastor del rebaño de Dios,
      - ven a reunir a todos los hombres en tu Iglesia.
    - - Ayuda, Señor, a los pastores de tu pueblo peregrino,
      - para que apacienten sin desfallecer a tu grey hasta que vuelvas.
    - - Escoge de entre nosotros pregoneros de tu palabra,
      - para que anuncien tu Evangelio hasta los confines del mundo.
    - - Ten compasión de los que en su trabajo desfallecen a mitad del camino;
      - haz que encuentren un amigo que los levante.
    - - Muestra tu gloria en el gozo de tu reino a los que en este destierro escucharon tu voz.
      - ''
    respuesta: Favorécenos, Señor, por tu bondad.
  padrenuestro_intro: 'Digamos con Jesús a nuestro Padre del cielo la oración de los hijos de Dios:'
  oracion: Que tu gracia, Señor, nos prepare y nos acompañe siempre a los que esperamos anhelantes la venida de tu Hijo, a fin de que obtengamos los auxilios nicesarios para la vida presente y para llegar con felicidad a la futura. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo de Adviento (A) · I Vísperas:
  ant_magnificat: Oh Sabiduría, que brotaste de los labios del Altísimo, abarcando del uno al otro confín y ordenándolo todo con firmeza y suavidad, ven y muéstranos el camino de la salvación.
IV Domingo de Adviento (B) · I Vísperas:
  ant_magnificat: Oh Emmanuel, rey y legislador nuestro, esperanza de las naciones y salvador de los pueblos, ven a salvarnos, Señor, Dios nuestro.
IV Domingo de Adviento (C) · I Vísperas:
  ant_magnificat: Oh Adonai, Pastor de la casa de Israel, que te apareciste a Moisés en la zarza ardiente y en el Sinaí le diste tu ley, ven a librarnos con el poder de tu brazo.
IV Domingo de Adviento · I Vísperas:
  responsorio:
  - - V
    - Muéstranos, Señor, tu misericordia.
  - - R
    - Muéstranos, Señor, tu misericordia.
  - - V
    - Y danos tu salvación.
  - - R
    - Muéstranos, Señor, tu misericordia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Muéstranos, Señor, tu misericordia.
  himno: Escucha, casa de David
  preces:
    intro: 'Oremos, hermanos, a Cristo, el Señor, que nació de la Virgen María, y digámosle:'
    preces:
    - - Hijo unigénito de Dios, que has de venir al mundo como mensajero de la alianza,
      - haz que el mundo te reciba y te reconozca.
    - - Tú que, engendrado en el seno del Padre, quisiste hacerte hombre en el seno de María,
      - líbranos de la corrupción de la carne.
    - - Tú que, siendo la vida, quisiste experimentar la muerte,
      - concédenos superar la sentencia de la muerte.
    - - Tú que, al venir al juicio, traerás contigo la recompensa,
      - haz que tu amor sea entonces nuestro premio.
    - - Señor Jesucristo, tú que por tu muerte socorriste a los muertos,
      - escucha las súplicas que te dirigimos por nuestros difuntos.
    respuesta: Ven, Señor Jesús.
  oracion: Señor, derrama tu gracia sobre nosotros, que hemos conocido por el anuncio del ángel la encarnación de tu Hijo, para que lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  padrenuestro_intro: 'Pidamos ahora a nuestro Padre que sea la ayuda de nuestra debilidad:'
  salmodia:
  - ant: 'Mirad: vendrá el deseado de todos los pueblos y se llenará de gloria la casa del Señor. Aleluia.'
    salmo: salmo-121
  - ant: 'Ven, Señor, y no tardes: perdona los pecados de tu pueblo, Israel.'
    salmo: salmo-129
  - ant: 'Mirad: se cumple ya el tiempo en el que Dios envía a su Hijo al mundo.'
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 1Ts 5, 23-24
    texto: Que el mismo Dios de la paz os consagre totalmente y que todo vuestro ser -espíritu, alma y cuerpo- sea custodiado sin reproche hasta la Parusía de nuestro Señor Jesucristo. Fiel es a sus promesas el que os ha convocado; y él las cumplirá.
IV Domingo de Adviento:
  responsorio:
  - - V
    - Muéstranos, Señor, tu misericordia.
  - - R
    - Muéstranos, Señor, tu misericordia.
  - - V
    - Y danos tu salvación.
  - - R
