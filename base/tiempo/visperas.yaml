Martes Santo:
  himno: Brille la cruz del Verbo, luminosa
  salmodia:
  - ant: 'Oía las burlas de la gente: «Terror por doquier», pero el Señor está conmigo, como fuerte guerrero.'
    salmo: salmo-48-i
  - ant: Sal fiador por mí ante ti mismo, Señor, ¿pues quién, si no, me dará la mano?
    salmo: salmo-48-ii
  - ant: Fuiste degollado, Señor, y por tu sangre nos compraste para Dios.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1Co 1, 27b-30
    texto: 'Lo débil del mundo lo ha escogido Dios para humillar el poder. Aún más: ha escogido la gente baja del mundo, lo despreciable, lo que no cuenta, para anular a lo que cuenta; de modo que nadie pueda gloriarse en presencia del Señor. Por él vosotros sois en Cristo Jesús, en este Cristo que Dios ha hecho para nosotros sabiduría, justicia, santificación y redención.'
