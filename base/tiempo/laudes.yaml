  ant_benedictus: «Yo mismo te auxilio —dice el Señor— y yo, el santo de Israel, soy tu redentor.»
  preces:
    intro: 'Imploremos, hermanos, a Dios Padre, que ha enviado a su Hijo para salvar al mundo, y digámosle suplicantes:'
    preces:
    - - Padre lleno de amor, no permitas que nuestra vida y nuestras obras rechacen a Cristo, tu enviado,
      - pues nuestra lengua lo proclama con fe plena.
    - - Tú que enviaste a tu Hijo para salvación de los hombres,
      - aleja de nuestra nación y del mundo entero toda desgracia y todo dolor.
    - - Que la tierra entera se alegre por la venida de tu Hijo,
      - experimentando cada día más la felicidad que en ti se encierra.
    - - Concédenos, por tu misericordia, llevar ya desde ahora una vida sobria y religiosa,
      - mientras aguardamos la dichosa esperanza, la aparición gloriosa de Jesucristo.
    respuesta: Muéstranos, Señor, tu misericordia.
  padrenuestro_intro: 'Con el gozo que nos da el saber que Cristo viene para hacernos hijos de Dios, digamos al Padre:'
  oracion: Señor, despierta en nuestros corazones el deseo de preparar la venida de tu Hijo, para que, cuando venga, podamos servirte libres de toda mancha. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
