  - ant: Tú defendiste, Señor, la causa de mi alma y rescataste mi vida, Señor, Dios mío.
    salmo: cantico-is-38-10-14-17-20
  - ant: Mi siervo justificará a muchos, porque cargó sobre sí los crímenes de ellos.
    salmo: salmo-64
  lectura:
