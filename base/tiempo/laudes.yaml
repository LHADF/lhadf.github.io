  preces:
    intro: 'Oremos a Cristo, el Señor, que ha congregado a su Iglesia por el Espíritu Santo, y digámosle con fe:'
    preces:
    - - Señor Jesús, que, exaltado en la cruz, hiciste que brotaran torrentes de agua viva de tu costado,
      - envíanos a tu Espíritu Santo, fuente de vida.
    - - Tú que, glorificado a la derecha de Dios, derramaste sobre tus discípulos el Espíritu Santo,
      - envía este mismo Espíritu al mundo, para que renueve la faz de la tierra.
    - - Tú que, por el Espíritu Santo, diste a los apóstoles el poder de perdonar los pecados y el poder de retenerlos,
      - destruye el pecado del mundo.
    - - Tú que prometiste darnos el Espíritu Santo, para que nos lo enseñara todo y nos fuera recordando lo que nos habías dicho,
      - envíanos este Espíritu, para que ilumine nuestra fe.
    - - Tú que prometiste enviarnos el Espíritu de verdad, para que diéramos testimonio de ti,
      - envíanos este Espíritu, para que nos haga tus testigos fieles.
    respuesta: Renueva, Señor, la faz de la tierra.
  lectura:
    ref: Hch 5, 30-32
    texto: El Dios de nuestros padres resucitó a Jesús, a quien vosotros matasteis colgándole de un madero. La diestra de Dios lo exaltó haciéndolo jefe y salvador, para otorgar a Israel la conversión, el perdón de los pecados. Testigos de esto somos nosotros y el Espíritu Santo, que Dios da a los que le obedecen.
  ant_benedictus: Recibid el Espíritu Santo; quedan perdonados los pecados a quienes los perdonéis. Aleluia.
IX Domingo del Tiempo Ordinario:
  oracion: Señor, nos acogemos confiadamente a tu providencia, que nunca se equivoca, y te suplicamos que apartes de nosotros todo mal y nos concedas aquellos beneficios que pueden ayudarnos para la vida presente y la futura. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IX Domingo del Tiempo Ordinario (A):
  ant_benedictus: «El que, después de haber escuchado estas palabras que acabo de decir, no las pone por obra —dice el Señor— será como el necio, que construyó su casa sobre arena.»
IX Domingo del Tiempo Ordinario (B):
  ant_benedictus: ¿No es más apropiado para un sábado hacer el bien y salvar una vida?
IX Domingo del Tiempo Ordinario (C):
  ant_benedictus: Señor, yo no soy digno de que entres en mi casa; pero basta que digas una palabra y mi criado quedará sano.
X Domingo del Tiempo Ordinario:
  oracion: Dios nuestro, de quien todo bien procede, concédenos seguir siempre tus inspiraciones, para que tratemos de hacer continuamente lo que es recto y, con tu ayuda, lo llevemos siempre a cabo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
X Domingo del Tiempo Ordinario (A):
  ant_benedictus: Muchos publicanos y pecadores se sentaron a la mesa con Jesús.
X Domingo del Tiempo Ordinario (B):
  ant_benedictus: Todo será perdonado; pero el que blasfeme contra el Espíritu Santo no obtendrá jamás perdón.
X Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'Jesús dijo al joven que estaba muerto: «Levántate.». Y lo llevó a su madre.'
  preces:
    intro: 'Invoquemos a Dios, Padre todopoderoso, que resucitó a Jesús, nuestro jefe y salvador, y aclamémoslo, diciendo:'
    preces:
    - - Padre santo, que hiciste pasar a tu Hijo amado de las tinieblas de la muerte a la luz de tu gloria,
      - haz que podamos llegar también nosotros a tu luz admirable.
    - - Tú que nos has salvado por la fe,
      - haz que vivamos hoy según la fe que profesamos en nuestro bautismo.
    - - Tú que quieres que busquemos las cosas de arriba, donde está Cristo sentado a tu derecha,
      - líbranos de la seducción del pecado.
    - - Haz que nuestra vida, oculta en ti con Cristo, brille en el mundo,
      - para que aparezcan los cielos nuevos y la tierra nueva.
    respuesta: Ilumínanos, Señor, con la luz de Cristo.
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestra boca:'
XI Domingo del Tiempo Ordinario:
  oracion: Oh Dios, fuerza de los que en ti esperan, escucha nuestras súplicas y, puesto que el hombre es frágil y sin ti nada puede, concédenos la ayuda de tu gracia, para observar tus mandamientos y agradarte con nuestros deseos y acciones. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XI Domingo del Tiempo Ordinario (A):
  ant_benedictus: Señor, envía más trabajadores a tu mies.
XI Domingo del Tiempo Ordinario (B):
  ant_benedictus: Sucede con el reino de Dios como con un hombre que siembra la semilla en la tierra. Ya duerma, ya vele todo el día, el grano germina y va creciendo.
XI Domingo del Tiempo Ordinario (C):
  ant_benedictus: Mujer, quedan perdonados tus pecados, porque has amado mucho.
XII Domingo del Tiempo Ordinario:
  oracion: Concédenos vivir siempre, Señor, en el amor y respeto a tu santo nombre, porque jamás dejas de dirigir a quienes estableces en el sólido fundamento de tu amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XII Domingo del Tiempo Ordinario (A):
  ant_benedictus: «Lo que os confío al oído, pregonadlo de lo alto de los terrados», dice el Señor.
XII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Se levantó el Señor e increpó al viento y al mar; y sobrevino gran bonanza.
XII Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'El Hijo del hombre tiene que sufrir mucho: tiene que ser condenado y muerto, pero al tercer día resucitará.'
XIII Domingo del Tiempo Ordinario:
  oracion: Dios nuestro, que quisiste hacernos hijos de la luz por la adopción de la gracia, concédenos que no seamos envueltos por las tinieblas del error, sino que permanezcamos siempre en el esplendor de la verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XIII Domingo del Tiempo Ordinario (A):
  ant_benedictus: «El que no toma su cruz y sigue en pos de mí no es digno de mí», dice el Señor.
XIII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Hija mía, tu fe te ha curado; vete en paz.
XIII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Las raposas tienen sus cuevas, y los pájaros del cielo sus nidos; pero el Hijo del hombre no tiene dónde reclinar su cabeza.
XIV Domingo del Tiempo Ordinario:
  oracion: Oh Dios, que por medio de la humillación de tu Hijo levantaste a la humanidad caída, conserva a tus fieles en continua alegría y concede los gozos del cielo a quienes has librado de la muerte eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XIV Domingo del Tiempo Ordinario (A):
  ant_benedictus: Yo te bendigo, oh Padre, Señor del cielo y de la tierra, porque has ocultado estas cosas a los sabios y prudentes y las has descubierto a los pequeños.
XIV Domingo del Tiempo Ordinario (B):
  ant_benedictus: 'Muchos quedaban admirados de Cristo y se preguntaban: «¿De dónde le viene tanta sabiduría?»'
XIV Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'En cualquier casa donde entréis, decid: «La paz sea en esta casa»; y que vuestra paz los inunde.'
XV Domingo del Tiempo Ordinario:
  oracion: Señor Dios, que muestras la luz de tu verdad a los que andan extraviados, para que puedan volver al camino recto, concede a todos los cristianos que se aparten de todo lo que sea indigno de ese nombre que llevan, y que cumplan lo que ese nombre significa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XV Domingo del Tiempo Ordinario (A):
  ant_benedictus: La semilla es la palabra de Dios, el sembrador es Cristo; todo el que lo escuche vivirá eternamente.
XV Domingo del Tiempo Ordinario (B):
  ant_benedictus: Enviados por el Señor, los discípulos arrojaban a los demonios, ungían con aceite a muchos enfermos y los sanaban.
XV Domingo del Tiempo Ordinario (C):
  ant_benedictus: El buen samaritano se acercó al herido y le curó las llagas.
XVI Domingo del Tiempo Ordinario:
  oracion: Mira con misericordia a estos tus hijos, Señor, y multiplica tu gracia sobre nosotros, para que, fervorosos en la fe, la esperanza y el amor, perseveremos en el fiel cumplimiento de tus mandamientos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVI Domingo del Tiempo Ordinario (A):
  ant_benedictus: El reino de los cielos se parece a la levadura que una mujer mezcla con tres medidas de harina, hasta que se fermenta toda la masa.
XVI Domingo del Tiempo Ordinario (B):
  ant_benedictus: Volvieron a reunirse los apóstoles con Jesús y le refirieron todo lo que habían hecho y enseñado.
XVI Domingo del Tiempo Ordinario (C):
  ant_benedictus: Una hermana de Marta, llamada María, sentada a los pies del Señor, escuchaba sus palabras.
XVII Domingo del Tiempo Ordinario:
  oracion: Oh Dios, protector de los que en ti esperan, sin ti nada es fuerte ni santo; aumenta los signos de tu misericordia sobre nosotros, para que, bajo tu dirección, de tal modo nos sirvamos de las cosas pasajeras que por ellas alcancemos con mayor plenitud las eternas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Sucede con el reino de los cielos como con una red que se echa en el mar; una vez llena, separan los peces buenos y tiran los malos.
XVII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Un muchacho ofreció cinco panes de cebada y dos peces. Jesús dijo la acción de gracias y los repartió, dándoles cuanto querían.
XVII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Si vosotros, siendo malos como sois, sabéis dar cosas buenas a vuestros hijos, ¿con cuanta mayor razón dará vuestro Padre desde el cielo el Espíritu Santo a quienes se lo pidan?
XVIII Domingo del Tiempo Ordinario:
  oracion: Señor, danos tu misericordia y atiende a las súplicas de tus hijos; concede la tranquilidad y la paz a los que nos gloriamos de tenerte como creador y como guía, y consérvalas en nosotros para siempre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XVIII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Jesús multiplicó los panes, y comieron todos hasta quedar satisfechos.
XVIII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Yo soy el pan de vida; el que venga a mí no tendrá más hambre, y el que crea en mí jamás tendrá sed.
XVIII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Si habéis sido resucitados con Cristo, buscad las cosas de arriba. Aleluia.
XIX Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XIX Domingo del Tiempo Ordinario (A):
  ant_benedictus: 'De madrugada, Jesús, caminando por encima del mar, vino hacia sus discípulos y les dijo: «Tened valor, que soy yo; no tengáis miedo.»'
XIX Domingo del Tiempo Ordinario (B):
  ant_benedictus: El pan que yo voy a dar es mi carne ofrecida por la vida del mundo.
XIX Domingo del Tiempo Ordinario (C):
  ant_benedictus: Donde está tu tesoro, allí está tu corazón.
XX Domingo del Tiempo Ordinario:
  oracion: Oh Dios, que has preparado bienes invisibles para los que te aman, infunde el amor de tu nombre en nuestros corazones, para que, amándote en todo y sobre todas las cosas, consigamos tus promesas que superan todo deseo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XX Domingo del Tiempo Ordinario (A):
  ant_benedictus: Dios encerró a todos los hombres en la desobediencia, a fin de hacer misericordia con todos.
XX Domingo del Tiempo Ordinario (B):
  ant_benedictus: El que come mi carne y bebe mi sangre permanece en mí, y yo en él.
XX Domingo del Tiempo Ordinario (C):
  ant_benedictus: Jesús quiso recibir el bautismo del sufrimiento y beber el cáliz de la pasión.
XXI Domingo del Tiempo Ordinario:
  oracion: Señor Dios, que unes en un mismo sentir los corazones de los que te aman, impulsa a tu pueblo a amar lo que pides y a desear lo que prometes, para que, en medio de la inestabilidad de las cosas humanas, estén firmemente anclados nuestros corazones en el deseo de la verdadera felicidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXI Domingo del Tiempo Ordinario (A):
  ant_benedictus: '«Tú eres el Mesías, el Hijo de Dios, vivo.» «Bienaventurado eres tú, Simón: mi Padre te lo ha revelado.»'
XXI Domingo del Tiempo Ordinario (B):
  ant_benedictus: El espíritu es el que da vida; la carne no vale nada. Las palabras que acabo de deciros son espíritu y son vida.
XXI Domingo del Tiempo Ordinario (C):
  ant_benedictus: «Procurad entrar por la puerta estrecha —dice el Señor—; es la puerta de la vida.»
XXII Domingo del Tiempo Ordinario:
  oracion: Oh Dios todopoderoso, de quien procede todo don perfecto, infunde en nuestros corazones el amor de tu nombre, para que, haciendo más religiosa nuestra vida, aumentes el bien en nosotros y con solicitud amorosa lo conserves. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Presentad vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable.
XXII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Recibid con docilidad la palabra de Dios que ha sido sembrada en vosotros, y que tiene poder para salvar vuestras almas.
XXII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Invita a tu mesa a los pobres que no tienen con qué pagarte; porque Dios te lo recompensará en la resurrección de los justos.
XXIII Domingo del Tiempo Ordinario:
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIII Domingo del Tiempo Ordinario (A):
  ant_benedictus: El único deber vuestro ha de ser amaros los unos a los otros. Porque quien ama al prójimo ya ha cumplido la ley.
XXIII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Abre, Señor, nuestro corazón para que comprendamos tus palabras; abre nuestros labios y proclamaremos tu alabanza.
XXIII Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'Dice el Señor: El que no renuncia a todos sus bienes no puede ser mi discípulo.'
XXIV Domingo del Tiempo Ordinario:
  oracion: Señor Dios, creador y soberano de todas las cosas, vuelve a nosotros tus ojos de bondad y haz que te sirvamos con todo el corazón, para que experimentemos los efectos de tu misericordia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIV Domingo del Tiempo Ordinario (A):
  ant_benedictus: El Padre celestial os perdonará, si vosotros perdonáis de corazón a vuestro hermano.
XXIV Domingo del Tiempo Ordinario (B):
  ant_benedictus: El que quiera venir en pos de mí, renúnciese a sí mismo, tome su cruz y sígame.
XXIV Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'Sentencia verdadera y digna de universal adhesión es ésta: Cristo Jesús vino al mundo para salvar a los pecadores. Aleluia.'
XXV Domingo del Tiempo Ordinario:
  oracion: Oh Dios, has hecho del amor a ti y a los hermanos la plenitud de la ley; concédenos cumplir tus mandamientos y llegar así a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXV Domingo del Tiempo Ordinario (A):
  ant_benedictus: El rico hacendado sale muy de mañana a contratar jornaleros para su viña.
XXV Domingo del Tiempo Ordinario (B):
  ant_benedictus: El Hijo del hombre tenía que sufrir y resucitar para salvar al mundo.
XXV Domingo del Tiempo Ordinario (C):
  ant_benedictus: Sed fieles en lo poco, y Dios os confiará las riquezas verdaderas.
XXVI Domingo del Tiempo Ordinario:
  oracion: Señor Dios, que manifiestas tu poder de una manera admirable sobre todo cuando perdonas y ejerces tu misericordia, infunde constantemente tu gracia en nosotros, para que, tendiendo hacia lo que nos prometes, consigamos los bienes celestiales. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVI Domingo del Tiempo Ordinario (A):
  ant_benedictus: Todo el que hace la voluntad del Padre es verdadero hijo de Dios. Aleluia.
XXVI Domingo del Tiempo Ordinario (B):
  ant_benedictus: «El que no está contra nosotros está a nuestro favor», dice el Señor.
XXVI Domingo del Tiempo Ordinario (C):
  ant_benedictus: Dichosos los pobres de espíritu, porque de ellos es el reino de los cielos.
XXVII Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, que con la magnificencia de tu amor sobrepasas los méritos y aun los deseos de los que te suplican, derrama sobre nosotros tu misericordia, para que libres nuestra conciencia de toda inquietud y nos concedas aun aquello que no nos atrevemos a pedir. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVII Domingo del Tiempo Ordinario (A):
  ant_benedictus: La piedra que rechazaron los constructores vino a convertirse en piedra angular para el nuevo templo de Dios.
XXVII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Quien no recibe la doctrina del reino de Dios con las disposiciones de un niño no puede entrar en la casa del Padre.
XXVII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Conserva el precioso depósito de la fe, bajo la acción del Espíritu Santo que mora en nosotros. Aleluia.
XXVIII Domingo del Tiempo Ordinario:
  oracion: Te pedimos, Señor, que tu gracia continuamente nos preceda y acompañe, de manera que estemos dispuestos a obrar siempre el bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXVIII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Salid a las encrucijadas, y a todos cuantos encontréis invitadlos a las bodas.
XXVIII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Invoqué y vino a mí un espíritu de sabiduría; todos los bienes me vinieron con ella.
XXVIII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Si tenemos constancia en el sufrir, reinaremos con Cristo; si le somos infieles, él permanece fiel.
XXIX Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXIX Domingo del Tiempo Ordinario (A):
  ant_benedictus: Jesús, maestro, tú enseñas con veracidad la manera de vivir según Dios. Aleluia.
XXIX Domingo del Tiempo Ordinario (B):
  ant_benedictus: El que quiera ser el mayor, que sea vuestro servidor; y el que quiera ser el primero, que sea esclavo de todos.
XXIX Domingo del Tiempo Ordinario (C):
  ant_benedictus: Dios hará justicia a sus elegidos que claman a él día y noche.
XXX Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXX Domingo del Tiempo Ordinario (A):
  ant_benedictus: Amarás al prójimo como a ti mismo.
XXX Domingo del Tiempo Ordinario (B):
  ant_benedictus: ¡Hijo de David, ten compasión de mí! ¡Señor, que vea!
XXX Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'El publicano, quedándose a cierta distancia y sin levantar los ojos, se daba golpes de pecho e iba repitiendo: «¡Dios mío, ten compasión de mí, que soy un pecador!»'
XXXI Domingo del Tiempo Ordinario:
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXI Domingo del Tiempo Ordinario (A):
  ant_benedictus: 'Uno solo es vuestro Padre: el Dios de cielo y tierra.'
XXXI Domingo del Tiempo Ordinario (B):
  ant_benedictus: Amar al prójimo como a sí mismos vale más que todos los holocaustos y sacrificios.
XXXI Domingo del Tiempo Ordinario (C):
  ant_benedictus: Zaqueo, muy contento, recibió a Jesús en su casa. A esta casa hoy ha llegado la salvación.
XXXII Domingo del Tiempo Ordinario:
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Saldremos al encuentro del Señor, y así estaremos siempre con él.
XXXII Domingo del Tiempo Ordinario (B):
  ant_benedictus: 'Nos tiene como gente triste, aunque estamos siempre alegres; por mendigos, aún cuando enriquecemos a muchos; o por gente que nada tiene, cuando en realidad todo lo poseemos: poseemos al Señor de cielo y tierra.'
XXXII Domingo del Tiempo Ordinario (C):
  ant_benedictus: El que alcance a ser digno de tener parte en el otro mundo es hijo de la resurrección e hijo de Dios.
XXXIII Domingo del Tiempo Ordinario:
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
XXXIII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Nosotros somos hijos de la luz e hijos del día; por eso, estemos alerta en espera del Señor.
XXXIII Domingo del Tiempo Ordinario (B):
  ant_benedictus: Los justos brillarán como el fulgor del firmamento por toda la eternidad.
XXXIII Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'Por mi causa os perseguirán; eso os dará ocasión de profesar vuestra fe: yo os daré palabras y sabiduría a las que no podrá hacer frente ningún adversario vuestro.'
