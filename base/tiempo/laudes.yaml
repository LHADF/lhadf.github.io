    texto: 'Yo como cordero manso, llevado al matadero, no sabía los planes homicidas que contra mí planeaban: «Talemos el árbol en su lozanía, arranquémoslo de la tierra de los vivos, que su nombre no se pronuncie más.» Pero tú, Señor de los ejércitos, juzgas rectamente, escudriñas las entrañas y el corazón; veré tu venganza contra ellos, porque a ti he encomendado mi causa.'
