    texto: Derramaré sobre la casa de David y sobre los habitantes de Jerusalén un espíritu de gracia y de oración. Me mirarán a mí, a quien traspasaron, harán llanto como llanto por el hijo único y llorarán como se llora al primogénito. Aquel día será grande el luto de Jerusalén.
