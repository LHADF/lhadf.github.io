      - y anhelemos vivir íntimamente unidos a ti.
    - - Tú que quisiste experimentar nuestras dolencias,
      - socorre a los enfermos y a los que morirán en el día de hoy.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Recitemos las palabras de Jesús, pidiendo al Padre que venga su reino:'
  oracion: Dios nuestro, que has proclamado tu salvación a todos los confines de la tierra, concédenos esperar con alegría las fiestas del nacimiento del Salvador, Jesucristo, tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
