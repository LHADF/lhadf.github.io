  padrenuestro_intro: 'Como Cristo nos enseñó, pidamos al Padre que perdone nuestros pecados, diciendo:'
  oracion: Dios todopoderoso, mira la fragilidad de nuestra naturaleza y, con la fuerza de la pasión de tu Hijo, levanta nuestra esperanza. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes Santo:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Ojos muertos que miráis
  salmodia:
