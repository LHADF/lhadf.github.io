II Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, que gobiernas a un tiempo cielo y tierra, escucha paternalmente las súplicas de tu pueblo y haz que los días de nuestra vida transcurran en tu paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
II Domingo del Tiempo Ordinario (A):
  ant_benedictus: El Espíritu Santo bajó del cielo como una paloma y se posó sobre Jesús.
II Domingo del Tiempo Ordinario (B):
  ant_benedictus: '«Maestro, ¿dónde vives?» Jesús les contestó: «Venid y lo veréis.»'
II Domingo del Tiempo Ordinario (C):
  ant_benedictus: Jesús, a petición de María, su madre, cambió el agua en el vino de la nueva Alianza.
III Domingo del Tiempo Ordinario:
  oracion: Dios todopoderoso y eterno, dirige nuestras acciones según tu voluntad, para que, invocando el nombre de tu Hijo, abundemos en buenas obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
III Domingo del Tiempo Ordinario (A):
  ant_benedictus: «Arrepentíos —dice el Señor—, porque se acerca el reino de Dios.»
III Domingo del Tiempo Ordinario (B):
  ant_benedictus: Convertíos y creed la Buena Noticia», dice el Señor.
III Domingo del Tiempo Ordinario (C):
  ant_benedictus: El Espíritu del Señor está sobre mí, me envió a evangelizar a los pobres.
IV Domingo del Tiempo Ordinario:
  oracion: Concédenos, Señor, Dios nuestro, venerarte con toda el alma y amar a todos los hombres con afecto espiritual. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo del Tiempo Ordinario (A):
  ant_benedictus: Dichosos los limpios de corazón, porque ellos verán a Dios.
IV Domingo del Tiempo Ordinario (B):
  ant_benedictus: Jesús de Nazareth, el Santo de Dios, ha visitado a su pueblo y lo ha redimido.
IV Domingo del Tiempo Ordinario (C):
  ant_benedictus: 'Jesús, hablando en Nazaret, donde se había criado, dijo: «Tened por cierto que ningún profeta es bien recibido en su patria.»'
V Domingo del Tiempo Ordinario:
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
V Domingo del Tiempo Ordinario (A):
  ant_benedictus: Vosotros sois la luz del mundo; alumbre vuestra luz a los hombres para que, viendo vuestras buenas obras, den gloria a vuestro Padre celestial.
V Domingo del Tiempo Ordinario (B):
  ant_benedictus: Se levantó Jesús muy de mañana y fue a un lugar solitario, donde se puso a hacer oración.
V Domingo del Tiempo Ordinario (C):
  ant_benedictus: Maestro, toda la noche hemos estado trabajando y no hemos recogido nada, pero, ya que tú lo mandas, voy a echar la red.
VI Domingo del Tiempo Ordinario:
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VI Domingo del Tiempo Ordinario (A):
  ant_benedictus: Si al llevar tu ofrenda al altar no estás en paz con el hermano, ve primero a reconciliarte con él; luego, presenta tu ofrenda.
VI Domingo del Tiempo Ordinario (B):
  ant_benedictus: '«Señor, si tú quieres, puedes curarme.» Respondió Jesús: «Quiero, queda limpio.»'
VI Domingo del Tiempo Ordinario (C):
  ant_benedictus: Dichosos los que ahora lloráis, porque reiréis.
Miércoles de Ceniza:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Cuando vuelto hacia ti de mi pecado
  salmodia:
  - ant: Contra ti, contra ti solo pequé, Señor; ten misericordia de mí.
    salmo: salmo-50
  - ant: Reconocemos, Señor, nuestra impiedad; hemos pecado contra ti.
    salmo: cantico-jr-14-17-21
  - ant: El Señor es Dios y nosotros somos su pueblo y ovejas de su rebaño.
    salmo: salmo-99
  lectura:
    ref: Dt 7, 6. 8-9
    texto: El Señor, tu Dios, te eligió para que fueras, entre todos los pueblos de la tierra, el pueblo de su propiedad. Por el amor que os tiene y por mantener el juramento que había hecho a vuestros padres, os sacó de Egipto con mano fuerte y os rescató de la esclavitud, del dominio del Faraón, rey de Egipto. Así conocerás que el Señor, tu Dios, es el Dios verdadero, el Dios fiel que mantiene su alianza y su favor, por mil generaciones, con los que lo aman y guardan sus preceptos.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Cuando ayunéis, no os hagáis los melancólicos como los hipócritas.
  preces:
    intro: 'Demos gracias a Dios Padre, que nos concede el don de iniciar hoy el tiempo cuaresmal; roguémosle que, durante estos días de salvación, la acción de su Espíritu purifique nuestros corazones y los llene de su amor, y digámosle:'
    preces:
    - - Danos vivir de toda palabra
      - que sale de tu boca.
    - - Haz que practiquemos la caridad no sólo en los acontecimientos importantes,
      - sino también en lo pequeño de nuestra vida de cada día.
    - - Ayúdanos a privarnos de lo superfluo,
      - para compartir lo nuestro con los hermanos necesitados.
    - - Concédenos llevar en nuestros cuerpos la pasión de tu Hijo,
      - tú que nos has vivificado en su cuerpo.
    respuesta: Danos, Señor, tu Espíritu Santo.
  padrenuestro_intro: 'Digamos al Padre, unidos a Jesús, la oración que él nos enseñó:'
  oracion: 'Al empezar esta Cuaresma, te pedimos, Señor, que nos des un verdadero espíritu de conversión: así la austeridad de la penitencia de estos días nos servirá de ayuda en nuestra lucha contra el espíritu del mal. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
Jueves después de Ceniza:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Pastor que con tus silbos amorosos
  lectura:
    ref: Cf. 1R 8, 51a. 52-53a
    texto: Nosotros, Señor, somos tu pueblo y tu heredad; que tus ojos estén abiertos a las súplicas de tu siervo y a la súplica de tu pueblo Israel, para escuchar todos sus clamores hacia ti. Porque tú nos separaste para ti como herencia tuya de entre todos los pueblos de la tierra.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: «Si alguno quiere venir en pos de mi —dice el Señor—, renúnciese a sí mismo, tome cada día su cruz y sígame.»
  preces:
    intro: 'Celebremos la bondad de Dios, que por Cristo se reveló como Padre nuestro, y digámosle de todo corazón:'
    preces:
    - - Concédenos vivir con toda plenitud el misterio de la Iglesia,
      - a fin de que nosotros y todos los hombres encontremos en ella un sacramento eficaz de salvación.
    - - Padre, que amas a todos los hombres, haz que cooperemos al progreso de la comunidad humana
      - y que en todo busquemos tu reino con nuestros esfuerzos.
    - - Haz que tengamos hambre y sed de justicia
      - y acudamos a nuestra fuente, que es Cristo, el cual entregó su vida para que fuéramos saciados.
    - - Perdona, Señor, todos nuestros pecados
      - y dirige nuestra vida por el camino de la sencillez y de la santidad.
    respuesta: Acuérdate, Señor, de que somos hijos tuyos.
  padrenuestro_intro: 'Porque sabemos que somos hijos de Dios, llenos de confianza nos atrevemos a decir:'
  oracion: Tu gracia, Señor, inspire nuestras acciones, las sostenga y acompañe, para que todo nuestro trabajo cuaresmal brote de ti, como una fuente, y a ti tienda, como a su fin. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes después de Ceniza:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Delante de la cruz los ojos míos
  lectura:
    ref: Is 53, 11b-12
    texto: Mi siervo justificará a muchos, porque cargó sobre sí los crímenes de ellos. Le daré una multitud como parte, y tendrá como despojo una muchedumbre, porque se entregó a sí mismo a la muerte y fue contado entre los malhechores; él tomó sobre sí el pecado de las multitudes e intercedió por los pecadores.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Cuando veas a alguien desnudo, cúbrelo, y no desprecies a tu semejante; entonces brillará tu luz como la aurora, y tu justicia te abrirá camino.
  preces:
    intro: 'Acudamos a Cristo, nuestro Salvador, que nos redimió con su muerte y resurrección, y supliquémosle, diciendo:'
    preces:
    - - Tú que subiste a Jerusalén para sufrir la pasión y entrar así en la gloria,
      - conduce a tu Iglesia a la Pascua eterna.
    - - Tú que, exaltado en la cruz, quisiste ser atravesado por la lanza del soldado,
      - sana nuestras heridas.
    - - Tú que convertiste el madero de la cruz en árbol de vida,
      - haz que los renacidos en el bautismo gocen de la abundancia de los frutos de este árbol.
    - - Tú que, clavado en la cruz, perdonaste al ladrón arrepentido,
      - perdónanos también a nosotros, pecadores.
    respuesta: Señor, ten piedad de nosotros.
  padrenuestro_intro: 'Como Cristo nos enseñó, pidamos al Padre que perdone nuestros pecados, diciendo:'
  oracion: Te pedimos, Señor, que nos ayudes a continuar animosos estos días de penitencia que acabamos de empezar y que nuestras prácticas externas de penitencia estén siempre acompañadas por la sinceridad de un corazón que desea convertirse. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Sábado después de Ceniza:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Los hombros traigo cargados
  lectura:
    ref: Is 1, 16-18
    texto: «Lavaos, purificaos, apartad de mi vista vuestras malas acciones. Cesad de obrar mal, aprended a obrar bien; buscad lo que es justo, haced justicia al oprimido, defended al huérfano, proteged a la viuda. Entonces, venid, y litigaremos —dice el Señor—. Aunque vuestros pecados sean como la grana, blanquearán como la nieve; aunque sean rojos como escarlata, quedarán blancos como lana.»
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Atesorad tesoros en el cielo, donde no hay polilla ni herrumbre que los corroa.
  preces:
    intro: 'Demos gracias siempre y en todo lugar a Cristo, nuestro Salvador, y supliquémosle, diciendo:'
    preces:
    - - Concédenos guardar sin mancha nuestros cuerpos,
      - para que el Espíritu Santo pueda habitar en ellos.
    - - Desde el comienzo del día acrecienta en nosotros el amor a nuestros hermanos
      - y el deseo de cumplir tu voluntad en todas las acciones de esta jornada.
    - - Danos hambre del alimento que perdura y da vida eterna,
      - y que tú diariamente nos proporcionas.
    - - Que interceda por nosotros tu santísima Madre, refugio de pecadores,
      - para que obtengamos el perdón de nuestros pecados.
    respuesta: Ayúdanos, Señor, con tu gracia.
  padrenuestro_intro: 'Pidamos al Padre que nos libre de todo mal, repitiendo la oración que Cristo nos enseñó:'
  oracion: Dios todopoderoso y eterno, mira compasivo nuestra debilidad y extiende sobre nosotros tu mano para protegernos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
I Domingo de Cuaresma:
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que fuiste triturado por nuestros crímenes.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  oracion: 'Te pedimos, Señor todopoderoso, que las celebraciones y las penitencias de esta Cuaresma nos ayuden a progresar en el camino de nuestra conversión: así conoceremos mejor y viviremos con mayor plenitud las riquezas inagotables del misterio de Cristo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
  himno: Oh sol de salvación, oh Jesucristo
  padrenuestro_intro: 'Ya que la fuerza para no caer en la tentación nos viene de Dios, acudamos al Padre, diciendo:'
  salmodia:
  - ant: Toda mi vida te bendeciré, Señor, y alzaré las manos invocándote.
    salmo: salmo-62-2-9
  - ant: Cantad y exaltad a Dios eternamente.
    salmo: cantico-dn-3-57-88-56
  - ant: El Señor ama a su pueblo y adorna con la victoria a los humildes.
    salmo: salmo-149
  preces:
    intro: 'Ahora es el tiempo propicio, ahora es el día de salvación; acudamos, pues, a nuestro Redentor que nos concede estos días de perdón, y, bendiciéndole, digamos:'
    preces:
    - - Cristo, vida nuestra, tú que por el bautismo nos has sepultado místicamente contigo en la muerte, para que contigo también resucitemos,
      - concédenos andar hoy en vida nueva.
    - - Señor Jesús, tú que pasaste por el mundo haciendo el bien,
      - haz que también nosotros seamos solícitos del bien de todos los hombres.
    - - Ayúdanos, Señor, a trabajar concordes en la edificación de nuestra ciudad terrena,
      - sin olvidar nunca tu reino eterno.
    - - Tú, Señor, que eres médico de los cuerpos y de las almas,
      - sana las dolencias de nuestro espíritu para que crezcamos cada día en santidad.
    respuesta: Infúndenos, Señor, un espíritu nuevo.
  lectura:
    ref: Cf. Ne 8, 9. 10
    texto: 'Este día está consagrado al Señor vuestro Dios; no hagáis duelo ni lloréis. No estéis tristes: la alegría del Señor es vuestra fortaleza.'
  ant_benedictus: Fue llevado Jesús por el Espíritu al desierto, para ser tentado por el demonio; y, después de ayunar cuarenta días y cuarenta noches, sintió hambre.
