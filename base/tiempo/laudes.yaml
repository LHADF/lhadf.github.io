Lunes de la I semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: ¡Cuántas veces, Señor, me habéis llamado
  lectura:
    ref: Ex 19, 4-6a
    texto: Vosotros habéis visto cómo os saqué sobre alas de águila y os traje hacia mí; ahora pues, si queréis obedecerme y guardar mi alianza, seréis mi especial propiedad entre todos los pueblos, pues mía es toda la tierra. Seréis para mí un reino de sacerdotes y una nación santa.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Venid, benditos de mi Padre, a tomar posesión del reino que está preparado para vosotros desde la creación del mundo.
  preces:
    intro: 'Bendigamos a Jesús, nuestro Salvador, que por su muerte nos ha abierto el camino de salvación, y digámosle confiados:'
    preces:
    - - Señor de misericordia, que en el bautismo nos diste una vida nueva,
      - te pedimos que nos hagas cada día más conformes a ti.
    - - Enséñanos, Señor, a ser hoy alegría para los que sufren
      - y haz que sepamos servirte en cada uno de los necesitados.
    - - Que procuremos, Señor, hacer lo bueno, lo recto y lo verdadero ante ti
      - y que busquemos tu rostro con sinceridad de corazón.
    - - Perdona, Señor, las faltas que hemos cometido contra la unidad de tu familia
      - y haz que tengamos un solo corazón y un solo espíritu.
    respuesta: Danos caminar por tus senderos, Señor.
  padrenuestro_intro: 'Dirijámonos a Dios con la oración que Cristo nos enseñó:'
  oracion: Conviértenos a ti, Dios salvador nuestro, y ayúdanos a progresar en el conocimiento de tu palabra, para que así la celebración de esta Cuaresma dé en nosotros fruto abundante. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la I semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Edificaste una torre
  lectura:
    ref: Jl 2, 12-13
    texto: Convertíos a mí de todo corazón con ayuno, con llanto, con luto. Rasgad vuestros corazones y no vuestras vestiduras, y convertíos al Señor, vuestro Dios, porque es compasivo y misericordioso, lento a la cólera y rico en piedad; y se arrepiente de las amenazas.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Señor, enséñanos a orar, como enseñó Juan a sus discípulos.
  preces:
    intro: 'Bendigamos a Cristo, pan vivo bajado del cielo, y digámosle:'
    preces:
    - - Señor, sacia nuestra hambre en el banquete de tu eucaristía
      - y danos participar plenamente de los bienes de tu sacrificio pascual.
    - - Concédenos, Maestro bueno, escuchar tu palabra con corazón noble
      - y haz que perseveremos hasta dar fruto.
    - - Que con nuestro trabajo, Señor, cooperemos contigo para mejorar el mundo,
      - para que así, por la acción de tu Iglesia, reine en él la paz.
    - - Reconocemos, Señor, que hemos pecado;
      - perdona nuestras faltas por tu gran misericordia.
    respuesta: Cristo, pan de las almas y salvación de los hombres, fortalece nuestra debilidad.
  padrenuestro_intro: 'Unidos fraternalmente, acudamos ahora al Padre de todos:'
  oracion: Señor, mira con amor a tu pueblo, que trata de purificar su espíritu en estos días cuaresmales con la moderación en el uso de las cosas terrenas, y haz que esta sobriedad alimente en él el deseo de poseerte. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la I semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Cuando vuelto hacia ti de mi pecado
  lectura:
    ref: Dt 7, 6. 8-9
    texto: El Señor, tu Dios, te eligió para que fueras, entre todos los pueblos de la tierra, el pueblo de su propiedad. Por el amor que os tiene y por mantener el juramento que había hecho a vuestros padres, os sacó de Egipto con mano fuerte y os rescató de la esclavitud, del dominio del Faraón, rey de Egipto. Así conocerás que el Señor, tu Dios, es el Dios verdadero, el Dios fiel que mantiene su alianza y su favor, por mil generaciones, con los que lo aman y guardan sus preceptos.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: 'Esta raza es una raza perversa: pide una señal, pero no se le dará otra señal que la de Jonás.'
  preces:
    intro: 'Bendigamos al Autor de nuestra salvación, que ha querido renovar en sí mismo todas las cosas, y digámosle:'
    preces:
    - - Señor, tú que nos has prometido un cielo nuevo y una tierra nueva, renuévanos sin cesar por tu Espíritu Santo,
      - para que lleguemos a gozar eternamente de ti en la nueva Jerusalén.
    - - Que trabajemos, Señor, para que el mundo se impregne de tu Espíritu
      - y se logre así más eficazmente la justicia, el amor y la paz universal.
    - - Enséñanos, Señor, a corregir nuestra pereza y nuestra desidia
      - y a poner nuestro corazón en los bienes eternos.
    - - Líbranos del mal
      - y presérvanos de la fascinación de la vanidad que oscurece la mente y oculta el bien.
    respuesta: Renuévanos, Señor, por tu Espíritu Santo.
  padrenuestro_intro: 'Digamos al Padre, unidos a Jesús, la oración que él nos enseñó:'
  oracion: Señor, mira complacido a tu pueblo, que con fervor desea entregarse a una vida santa, y, ya que con sus privaciones se esfuerza por dominar el cuerpo, que la práctica de las buenas obras transforme su alma. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la I semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Pastor que con tus silbos amorosos
  lectura:
    ref: Cf. 1R 8, 51a. 52-53a
    texto: Nosotros, Señor, somos tu pueblo y tu heredad; que tus ojos estén abiertos a las súplicas de tu siervo y a la súplica de tu pueblo Israel, para escuchar todos sus clamores hacia ti. Porque tú nos separaste para ti como herencia tuya de entre todos los pueblos de la tierra.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Si vosotros, siendo malos como sois, sabéis dar cosas buenas a vuestros hijos, ¡con cuánta mayor razón las dará vuestro Padre celestial al que se las pida!
  preces:
    intro: 'Glorifiquemos a Cristo, nuestro Señor, que resplandece como luz del mundo para que siguiéndolo no caminemos en tinieblas, sino que tengamos la luz de la vida, y digámosle:'
    preces:
    - - Cristo, amigo de los hombres, haz que sepamos progresar hoy en tu imitación,
      - para que lo que perdimos por culpa del primer Adán lo recuperemos en el segundo.
    - - Que tu palabra sea siempre luz en nuestro sendero, para que, realizando siempre la verdad en el amor,
      - hagamos crecer todas las cosas en ti.
    - - Enséñanos, Señor, a trabajar por el bien de todos los hombres,
      - para que así, por nuestra acción, la Iglesia ilumine a toda la sociedad humana.
    - - Que por nuestra sincera conversión crezcamos en tu amistad
      - y expiemos las faltas cometidas contra tu bondad y tu sabiduría.
    respuesta: Que tu palabra, Señor, sea luz para nuestros pasos.
  padrenuestro_intro: 'Porque sabemos que somos hijos de Dios, llenos de confianza nos atrevemos a decir:'
  oracion: Señor, haz que nos inclinemos siempre a pensar con rectitud y a practicar el bien con diligencia y, puesto que no podemos existir sin ti, concédenos vivir siempre según tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la I semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Delante de la cruz los ojos míos
  lectura:
    ref: Is 53, 11b-12
    texto: Mi siervo justificará a muchos, porque cargó sobre sí los crímenes de ellos. Le daré una multitud como parte, y tendrá como despojo una muchedumbre, porque se entregó a sí mismo a la muerte y fue contado entre los malhechores; él tomó sobre sí el pecado de las multitudes e intercedió por los pecadores.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Si vuestra virtud no es superior a la de los escribas y fariseos, no entraréis en el reino de los cielos.
  preces:
    intro: 'Demos gracias a Cristo, el Señor, que al morir en cruz nos dio la vida, y digámosle con fe:'
    preces:
    - - Maestro y Salvador nuestro, tú que nos revelaste con tu palabra el designio de Dios y nos renovaste con tu gloriosa pasión,
      - no permitas que nuestros días transcurran entre vicios y pecados.
    - - Que sepamos, Señor, mortificarnos hoy al tomar los manjares del cuerpo,
      - para ayudar con nuestra abstinencia a los hambrientos y necesitados.
    - - Que vivamos santamente este día de penitencia cuaresmal
      - y lo consagremos a tu servicio mediante obras de misericordia.
    - - Sana, Señor, nuestras voluntades rebeldes
      - y llénanos de tu gracia y de tus dones.
    respuesta: Tú que por nosotros moriste, escúchanos, Señor.
  padrenuestro_intro: 'Que el Espíritu que habita en nosotros y nos une en su amor nos ayude a decir:'
  oracion: Señor, haz que tu pueblo vaya penetrando debidamente el sentido de la Cuaresma y se prepare así a las fiestas pascuales, para que la penitencia corporal, propia de este tiempo, sirva para la renovación espiritual de todos tus fieles. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
