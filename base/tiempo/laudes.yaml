  ant_benedictus: '«Yo te digo, Pedro: No has de perdonar hasta siete veces, sino hasta setenta veces siete», dice el Señor.'
  preces:
    intro: 'Bendigamos a Cristo, pan vivo bajado del cielo, y digámosle:'
    preces:
    - - Señor, sacia nuestra hambre en el banquete de tu eucaristía
      - y danos participar plenamente de los bienes de tu sacrificio pascual.
    - - Concédenos, Maestro bueno, escuchar tu palabra con corazón noble
      - y haz que perseveremos hasta dar fruto.
    - - Que con nuestro trabajo, Señor, cooperemos contigo para mejorar el mundo,
      - para que así, por la acción de tu Iglesia, reine en él la paz.
    - - Reconocemos, Señor, que hemos pecado;
      - perdona nuestras faltas por tu gran misericordia.
    respuesta: Cristo, pan de las almas y salvación de los hombres, fortalece nuestra debilidad.
  padrenuestro_intro: 'Unidos fraternalmente, acudamos ahora al Padre de todos:'
  oracion: Tu gracia, Señor, nos socorra siempre, nos haga vivir entregados a tu servicio y nos sirva de ayuda constante. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la III semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Cuando vuelto hacia ti de mi pecado
  lectura:
    ref: Dt 7, 6. 8-9
    texto: El Señor, tu Dios, te eligió para que fueras, entre todos los pueblos de la tierra, el pueblo de su propiedad. Por el amor que os tiene y por mantener el juramento que había hecho a vuestros padres, os sacó de Egipto con mano fuerte y os rescató de la esclavitud, del dominio del Faraón, rey de Egipto. Así conocerás que el Señor, tu Dios, es el Dios verdadero, el Dios fiel que mantiene su alianza y su favor, por mil generaciones, con los que lo aman y guardan sus preceptos.
  responsorio:
