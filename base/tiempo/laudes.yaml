  ant_benedictus: 'Desde oriente vinieron unos magos a Belén para adorar al Señor, y, abriendo sus cofres, le ofrecieron regalos: oro, como a rey soberano; incienso, como a Dios verdadero; y mirra, como a hombre mortal. Aleluia.'
  preces:
    intro: 'Aclamemos a Cristo, salvador enviado por Dios, a quien han contemplado los confines de la tierra, y digámosle:'
    preces:
    - - Redentor de todos los pueblos, que al venir al mundo destruiste el muro que separaba a Israel de las naciones paganas,
      - haz que desaparezcan del mundo todas las discriminaciones que atentan contra la dignidad humana.
    - - Tú que por tu encarnación y tu nacimiento quisiste habitar entre nosotros,
      - enséñanos a descubrir tu presencia en la Iglesia y en todos los hombres.
    - - Tú que nos has dado el pleno conocimiento de Dios, nuestro Padre,
      - ayúdanos a vivir plenamente de tu palabra por nuestra fe y por nuestras obras.
    - - Tú que eres el «Dios-con-nosotros» que has renovado maravillosamente la creación entera,
      - 'haz que en nosotros todo se renueve también: el corazón, las palabras y las obras.'
    respuesta: Gloria a ti, Señor Jesús.
  padrenuestro_intro: 'A pesar de que en el mundo existe el odio y la division, oremos a aquel que nos ha hermanado en Jesucristo diciento:'
  oracion: Te pedimos, Señor, que ilumines nuestros corazones con el esplendor de tu divinidad, para que podamos pasar a través de las tinieblas de este mundo y llegar a la patria de la eterna claridad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
