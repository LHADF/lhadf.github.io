  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  oracion: Dios omnipotente y eterno, resplandor de las almas fieles, dígnate llenar el mundo de tu gloria y muéstrate a todos los pueblos con la claridad de tu luz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  himno: Ver a Dios en la criatura
  padrenuestro_intro: 'Gracias a Jesucristo somos hijos de Dios; por eso nos atrevemos a decir:'
  inv_ant: A Cristo, que por nosotros ha nacido, venid, adorémosle.
  salmodia:
  - ant: Amanece la luz para el justo, porque ha nacido el salvador de todos los hombres. Aleluia.
    salmo: salmo-117
  - ant: Cantemos un himno al Señor nuestro Dios. Aleluia.
    salmo: cantico-dn-3-52-57
  - ant: El pueblo que caminaba en tinieblas vio una grande luz.
    salmo: salmo-150
  preces:
    intro: 'Glorifiquemos a Cristo, Palabra eterna del Padre, engendrado antes de los siglos y nacido por nosotros en el tiempo, y aclamémosle, diciendo:'
    preces:
    - - Cristo, Palabra eterna, que al venir al mundo anunciaste la alegría a la tierra,
      - alegra nuestros corazones con la gracia de tu visita.
    - - Salvador del mundo, que con tu nacimiento nos has revelado la fidelidad de Dios,
      - haz que nosotros seamos también fieles a las promesas de nuestro bautismo.
    - - Rey del cielo y de la tierra, que por tus ángeles anunciaste la paz a los hombres,
      - conserva nuestras vidas en tu paz.
    - - Señor, tú que viniste para ser la vid verdadera que nos diera el fruto de la vida,
      - haz que permanezcamos siempre en ti y demos fruto abundante.
    respuesta: Que se goce la tierra, Señor, ante tu venida.
  lectura:
    ref: Hb 1, 1-2
    texto: A través de muchas etapas y de muchas maneras habló Dios en otro tiempo a nuestros antepasados por ministerio de los profetas; en estos tiempos, que son los últimos, nos ha hablado por medio de su Hijo, a quien ha constituido heredero de todas las cosas y por quien creó los mundos.
  ant_benedictus: 'La Virgen siempre fiel dio a luz al Verbo de Dios hecho carne, pero permaneció virgen aún después del parto; alabémosla, pues, diciendo todos: Bendita tú entre las mujeres.'
