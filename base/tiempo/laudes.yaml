  preces:
    intro: 'Alabemos a Cristo, que con su poder reconstruyó el templo destruido de su cuerpo, y supliquémosle:'
    preces:
    - - Cristo Salvador, que en tu resurrección anunciaste la alegría a las mujeres y a los apóstoles y salvaste al universo entero,
      - conviértenos en testigos de tu resurrección.
    - - Tú que has prometido la resurrección universal y has anunciado una vida nueva,
      - haz de nosotros mensajeros del Evangelio de la vida.
    - - Tú que te apareciste repetidas veces a los apóstoles y les comunicaste el Espíritu Santo,
      - renuévanos por el Espíritu consolador.
    - - Tú que prometiste estar con tus discípulos hasta el fin del mundo,
      - quédate hoy con nosotros y sé siempre nuestro compañero.
    respuesta: Concédenos, Señor, los frutos de tu resurrección.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Dios nuestro, que por la resurrección de Cristo nos restituyes el derecho de entrar en la vida eterna, fortifica la fe y la esperanza de tu pueblo, para que esperemos siempre confiadamente la realización de todo aquello que nos tienes prometido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
