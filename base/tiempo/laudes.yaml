  ant_benedictus: Despierta, despierta, ponte en pie, Jerusalén, desata las correas de tu cuello, cautiva hija de Sión.
  preces:
    renglones:
    - 'El Señor, Padre todopoderoso, tenderá otra vez su mano, para rescatar el resto de su pueblo; supliquémosle, pues, confiados:'
    - Venga tu reino, Señor.
    - Concédenos, Señor, dar aquel fruto que pide la conversión,
    - para que podamos recibir tu reino que se acerca.
    - Prepara, Señor, en nuestros corazones, un camino para tu Palabra que ha de venir;
    - así tu gloria se manifestará al mundo por medio de nosotros.
    - Abaja los montes y las colinas de nuestro orgullo y levanta los valles de nuestros desánimos y de nuestras cobardías.
    - Destruye los muros del odio que dividen a las naciones
    - y allana los caminos de la concordia entre los hombres.
  padrenuestro_intro: 'El Señor se acerca para salvarnos; por eso nos atrevemos a pedir la venida de su reino, diciendo:'
  oracion: Dios nuestro, que por medio de tu Hijo has hecho que volvamos a nacer como nuevas creaturas, mira con amor estas obras de tu misericordia y, por la venida de tu Hijo, borra en nosotros toda huella de pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
