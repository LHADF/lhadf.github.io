  preces:
    intro: 'Dirijamos nuestra oración a Dios Padre, que por la resurrección de Jesucristo nos ha dado vida nueva, y digámosle:'
    preces:
    - - Señor, Padre clementísimo, tú que nos has revelado tu plan de salvación, proyectado desde antes de la creación del mundo y eres fiel en todas tus promesas,
      - escucha con amor nuestras plegarias.
    - - Purifícanos con tu verdad y encamina nuestros pasos por las sendas de la santidad,
      - para que hagamos siempre el bien según tu agrado.
    - - Haz resplandecer tu rostro sobre nosotros,
      - para que, libres de todo mal, nos saciemos con los bienes de tu casa.
    - - Tú que por Cristo nos reconciliaste contigo,
      - danos la paz a nosotros y a todos los hombres del mundo.
    respuesta: Ilumínanos, Señor, con la claridad de Jesucristo.
  padrenuestro_intro: 'Porque deseamos que la luz de Cristo ilumine a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Señor, ya que nos has dado a conocer los dones que nos trae la resurrección de tu Hijo, concédenos también que el Espíritu Santo, el Amor increado, nos haga resucitar a una nueva vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
