  padrenuestro_intro: 'Como Cristo nos enseñó, pidamos al Padre que perdone nuestros pecados, diciendo:'
  oracion: Dios nuestro, digno, con toda justicia, de ser amado sobre todas las cosas, derrama sobre nosotros los dones de tu gracia, para que la herencia celestial, que la muerte de tu Hijo nos hace esperar confiadamente, logre ser alcanzada por nosotros en virtud de su resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes Santo de la Pasión del Señor:
  inv_ant: A Cristo, Hijo de Dios, que nos redimió con su sangre preciosa, venid, adorémosle.
  himno: Brazos rígidos y yertos
  salmodia:
  - ant: Dios no perdonó a su propio Hijo, sino que lo entregó a la muerte por todos nosotros.
    salmo: salmo-50
  - ant: Jesucristo nos ama y nos ha lavado de nuestros pecados con su sangre.
    salmo: cantico-ha-3-2-4-13a-15-19
  - ant: Tu cruz adoramos, Señor, y tu santa resurrección alabamos y glorificamos; por el madero ha venido la alegría al mundo entero.
    salmo: salmo-147
  lectura:
    ref: Is 52, 13-15
    texto: 'Mirad: mi siervo tendrá éxito, será enaltecido y ensalzado sobremanera. Y, así como muchos se horrorizaron de él, pues tan desfigurado estaba que ya ni parecía hombre, no tenía ni aspecto humano, así también muchos pueblos se admirarán de él y, a su vista, los reyes enmudecerán de asombro porque verán algo jamás narrado y contemplarán algo inaudito.'
  ant_benedictus: 'Fijaron encima de su cabeza un letrero indicando el motivo de su condenación: «Éste es Jesús, el rey de los judíos.»'
  preces:
    intro: 'Adoremos a nuestro Redentor, que por nosotros y por todos los hombres quiso morir y ser sepultado para resucitar de entre los muertos, y supliquémosle, diciendo:'
    preces:
    - - Señor y Maestro nuestro, que por nosotros te sometiste incluso a la muerte,
      - enséñanos a someternos siempre a la voluntad del Padre.
    - - Tú que siendo nuestra vida quisiste morir en la cruz para destruir la muerte y todo su poder,
      - haz que contigo sepamos morir también al pecado y resucitemos contigo a vida nueva.
    - - Rey nuestro, que como un gusano fuiste el desprecio del pueblo y la vergüenza de la gente,
      - haz que tu Iglesia no se acobarde ante la humillación, sino que como tú proclame en toda circunstancia el honor del Padre.
    - - Salvador de todos los hombres, que diste tu vida por los hermanos,
      - enséñanos a amarnos mutuamente con un amor semejante al tuyo.
    - - Tú que al ser elevado en la cruz atrajiste hacia ti a todos los hombres,
      - reúne en tu reino a todos los hijos de Dios dispersos por el mundo.
    respuesta: Señor, ten piedad de nosotros.
  padrenuestro_intro: 'Porque la muerte de Cristo nos ha hecho agradables a Dios, nos atrevemos a orar al Padre, diciendo:'
  oracion: Mira, Señor, con bondad a tu familia santa, por la cual Jesucristo nuestro Señor aceptó el tormento de la cruz, entregándose a sus propios enemigos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: Cristo, por nosotros, se sometió incluso a la muerte, y una muerte de cruz.
Sábado Santo:
  inv_ant: A Cristo, el Señor, que por nosotros murió, y por nosotros fue sepultado, venid, adorémosle.
  himno: Venid al huerto, perfumes
  salmodia:
  - ant: Harán llanto como llanto por el hijo único, porque siendo inocente fue muerto el Señor.
    salmo: salmo-63
  - ant: Líbrame, Señor, de las puertas del abismo.
    salmo: cantico-is-38-10-14-17-20
  - ant: Estaba muerto, pero ahora vivo por los siglos de los siglos, y tengo las llaves de la muerte y del hades.
    salmo: salmo-150
  lectura:
    ref: Os 6,1-3a
    texto: 'Esto dice el Señor: «En su aflicción me buscarán, diciendo: "Volvamos al Señor. Él, que nos despedazó, nos sanará; él, que nos hirió, nos vendará. En dos días nos sanará, y al tercero nos levantará, y viviremos en su presencia."»'
  ant_benedictus: Salvador del mundo, sálvanos; tú que con tu cruz y con tu sangre nos redimiste, socórrenos, Dios nuestro.
  preces:
    intro: 'Adoremos a nuestro Redentor, que por nosotros y por todos los hombres quiso morir y ser sepultado, para resucitar de entre los muertos, y supliquémosle, diciendo:'
    preces:
    - - Oh Señor, que junto a tu cruz y a tu sepulcro tuviste a tu Madre dolorosa que participó en tu aflicción,
      - haz que tu pueblo sepa también participar en tu pasión.
    - - Señor Jesús, que como grano de trigo caíste en la tierra para morir y dar con ello fruto abundante,
      - haz que también nosotros sepamos morir al pecado y vivir para Dios.
    - - Oh Pastor de la Iglesia, que quisiste ocultarte en el sepulcro para dar la vida a los hombres,
      - haz que nosotros sepamos también vivir escondidos contigo en Dios.
    - - Nuevo Adán, que quisiste bajar al reino de la muerte, para librar a cuantos, desde el origen del mundo, estaban encarcelados,
      - haz que todos los hombres, muertos al pecado, escuchen tu voz y vivan.
    - - Cristo, Hijo de Dios vivo, que has querido que por el bautismo fuéramos sepultados contigo en la muerte,
      - haz que siguiéndote a ti caminemos también nosotros en novedad de vida.
    respuesta: Señor, ten piedad de nosotros.
  padrenuestro_intro: 'Movidos por el espíritu filial que Cristo nos mereció con su muerte, digamos al Padre:'
  oracion: Dios todopoderoso, cuyo Unigénito descendió al lugar de los muertos y salió victorioso del sepulcro, te pedimos que concedas a todos tus fieles, sepultados con Cristo por el bautismo, resucitar también con él a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: Cristo, por nosotros, se sometió incluso a la muerte, y una muerte de cruz; por eso Dios lo levantó sobre todo y le concedió el «Nombre-sobre-todo-nombre».
Domingo de Pascua de la Resurrección del Señor:
  oracion: Dios nuestro, que en este día nos abriste las puertas de la vida por medio de tu Hijo, vencedor de la muerte, concédenos a todos los que celebramos su gloriosa resurrección que, por la nueva vida que tu Espíritu nos comunica, lleguemos también nosotros a resucitar a la luz de la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
  himno: Estaba al alba María
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestra boca:'
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  preces:
    intro: 'Oremos a Cristo, autor de la vida, a quien Dios resucitó de entre los muertos, quien por su poder nos resucitará también a nosotros, y digámosle:'
    preces:
    - - Cristo, luz esplendorosa que brillas en las tinieblas, rey de la vida y salvador de los que han muerto,
      - concédenos vivir hoy en tu alabanza.
    - - Señor Jesús, que anduviste los caminos de la pasión y de la cruz,
      - concédenos que, unidos a ti en el dolor y en la muerte, resucitemos también contigo.
    - - Hijo del Padre, maestro y hermano nuestro, tú que has hecho de nosotros un pueblo de reyes y sacerdotes,
      - enséñanos a ofrecer con alegría nuestro sacrificio de alabanza.
    - - Rey de la gloria, esperamos anhelantes el día de tu manifestación gloriosa,
      - para poder contemplar tu rostro y ser semejantes a ti.
    respuesta: Cristo, vida nuestra, sálvanos.
  lectura:
    ref: Hch 10, 40-43
    texto: Dios resucitó a Jesús al tercer día e hizo que se apareciese no a todo el pueblo, sino a nosotros, que somos los testigos elegidos de antemano por Dios. Nosotros hemos comido y bebido con él, después que Dios lo resucitó de entre los muertos. Y él nos mandó predicar al pueblo y atestiguar que ha sido constituido por Dios juez de vivos y muertos. De él hablan todos los profetas y aseguran que cuantos tengan fe en él recibirán por su nombre el perdón de sus pecados.
  ant_benedictus: Muy de madrugada, el primer día de la semana, llegaron al sepulcro, apenas salido el sol. Aleluia.
Lunes de la Octava de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: La bella flor que en el suelo
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Rm 10, 8b-10
    texto: «Cerca de ti está la palabra, en tu boca y en tu corazón», es decir, el mensaje de la fe que nosotros predicamos. Porque, si proclamas con tu boca a Jesús como Señor y crees en tu corazón que Dios lo resucitó de entre los muertos, serás salvo. Pues con el corazón creemos para obtener la justificación y con la boca hacemos profesión de nuestra fe para alcanzar la salvación.
  ant_benedictus: 'Id en seguida a decir a sus discípulos: «Ha resucitado el Señor de entre los muertos.» Aleluia.'
  preces:
    intro: 'Glorifiquemos a Cristo, a quien el Padre ha enaltecido dándole en herencia todas las naciones, y digámosle suplicantes:'
    preces:
    - - Señor Jesucristo, que en tu victoria destruiste el poder del abismo, venciendo la muerte y el pecado,
      - haz que también nosotros venzamos hoy el pecado.
    - - Tú que alejaste de nosotros la muerte y nos has dado nueva vida,
      - concédenos andar hoy por la senda de esta vida nueva.
    - - Tú que diste vida a los muertos, haciendo pasar a la humanidad entera de la muerte a la vida,
      - concede el don de la vida eterna a cuantos se relacionarán hoy con nosotros.
    - - Tú que llenaste de confusión a los que hacían guardia ante tu sepulcro y alegraste a los discípulos con tus apariciones,
      - llena de gozo a cuantos te sirven.
    respuesta: Por tu victoria, sálvanos, Señor.
  padrenuestro_intro: 'Porque deseamos que la luz de Cristo alumbre a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Dios nuestro, que haces crecer a tu Iglesia dándole continuamente nuevos hijos por el bautismo, concédenos ser siempre fieles en nuestra vida a la fe que en ese sacramento hemos recibido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Martes de la Octava de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Estaba al alba María
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Hch 13, 30-33
    texto: 'Dios resucitó a Jesús de entre los muertos. Y durante muchos días se apareció a los que con él habían subido de Galilea a Jerusalén: éstos, efectivamente, dan ahora testimonio de él ante el pueblo. Y nosotros os damos la buena nueva: la promesa que Dios hizo a nuestros padres la ha cumplido él ahora con nosotros, sus hijos, resucitando a Jesús, según está escrito en el salmo segundo: «Tú eres mi Hijo; yo te he engendrado hoy.»'
  ant_benedictus: 'Jesús dijo: «¡María!» Ella, volviéndose, exclamó: «¡Maestro!» Jesús le dijo: «Suéltame, que aún no he subido al Padre.» Aleluia.'
  preces:
    intro: 'Alabemos a Cristo, que con su poder reconstruyó el templo destruido de su cuerpo, y supliquémosle:'
    preces:
    - - Cristo Salvador, que en tu resurrección anunciaste la alegría a las mujeres y a los apóstoles y salvaste al universo entero,
      - conviértenos en testigos de tu resurrección.
    - - Tú que has prometido la resurrección universal y has anunciado una vida nueva,
      - haz de nosotros mensajeros del Evangelio de la vida.
    - - Tú que te apareciste repetidas veces a los apóstoles y les comunicaste el Espíritu Santo,
      - renuévanos por el Espíritu consolador.
    - - Tú que prometiste estar con tus discípulos hasta el fin del mundo,
      - quédate hoy con nosotros y sé siempre nuestro compañero.
    respuesta: Concédenos, Señor, los frutos de tu resurrección.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Señor Dios, que nos has proporcionado el remedio de nuestros males por el misterio pascual, colma a tu pueblo de tus dones celestiales, para que alcance la perfecta libertad y llegue a gozar plenamente en el cielo de la alegría que ya ha comenzado a gustar en la tierra. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Miércoles de la Octava de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Gloriosa aurora de este nuevo día
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Rm 6, 8-11
    texto: Si verdaderamente hemos muerto con Cristo, tenemos fe de que también viviremos con él, pues sabemos que Cristo, una vez resucitado de entre los muertos, ya no muere; la muerte no tiene ya poder sobre él. Su muerte fue un morir al pecado de una vez para siempre, mas su vida es un vivir para Dios. Así también, considerad vosotros que estáis muertos al pecado, pero que vivís para Dios en unión con Cristo Jesús.
  ant_benedictus: Empezando por Moisés y continuando por todos los profetas, Jesús les fue explicando todos los pasajes de la Escritura que a él se referían. Aleluia.
  preces:
    intro: 'Oremos a Cristo, que fue entregado por nuestros pecados y resucitado para nuestra justificación, y aclamémoslo, diciendo:'
    preces:
    - - Salvador nuestro, Señor Jesús, que con tu victoria sobre la muerte nos has alegrado y con tu resurrección nos has exaltado y nos has enriquecido,
      - ilumina hoy nuestras mentes y santifica nuestra jornada con la gracia de tu Espíritu Santo.
    - - Tú que en el cielo eres glorificado por los ángeles y en la tierra eres adorado por los hombres,
      - recibe la adoración que en espíritu y verdad te tributamos en estas fiestas de tu resurrección.
    - - Sálvanos, Señor Jesús, muestra tu amor y tu misericordia al pueblo que confía en tu resurrección
      - y, compadecido de nosotros, defiéndenos hoy de todo mal.
    - - Rey de la gloria y vida nuestra, haz que, cuando te manifiestes al mundo,
      - podamos aparecer también nosotros juntamente contigo en la gloria.
    respuesta: Por tu victoria, sálvanos, Señor.
  oracion: Dios nuestro, que todos los años nos alegras con la solemnidad de la resurrección del Señor, concédenos que la celebración de estas fiestas aquí en la tierra nos lleve a gozar de la eterna alegría en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
Jueves de la Octava de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: El agua pura, don de la mañana
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Rm 8, 10-11
    texto: Si Cristo está en vosotros, aunque vuestro cuerpo haya muerto por causa del pecado, el espíritu tiene vida por la justificación. Y si el Espíritu de aquel que resucitó a Jesús de entre los muertos habita en vosotros, el mismo que resucitó a Cristo Jesús de entre los muertos vivificará también vuestros cuerpos mortales por obra de su Espíritu que habita en vosotros.
  ant_benedictus: 'Se presentó Jesús en medio de sus discípulos y les dijo: «La paz sea con vosotros.» Aleluia.'
  preces:
    intro: 'Glorifiquemos a Cristo resucitado y siempre presente en su Iglesia, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesús, vencedor del pecado y de la muerte,
      - permanece en medio de nosotros, tú que vives por los siglos de los siglos.
    - - Señor, ven a nosotros con tu poder invencible
      - y muéstranos la bondad de Dios Padre.
    - - Señor, ayuda al mundo abrumado por las discordias,
      - ya que tú solo tienes el poder de salvar y reconciliar.
    - - Confírmanos en la fe de la victoria final
      - y arraiga en nosotros la esperanza de tu manifestación gloriosa.
    respuesta: Quédate con nosotros, Señor.
  padrenuestro_intro: 'Porque Jesucristo nos ha hecho participar de su propia vida, somos hijos de Dios, y por ello nos atrevemos a decir:'
  oracion: Oh Dios, que has reunido a pueblos diversos en la confesión de tu nombre, concede a los que han renacido en la fuente bautismal una misma fe en su espíritu y una misma caridad en sus vidas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Viernes de la Octava de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Tu cuerpo es lazo de amores
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Hch 5, 30-32
    texto: El Dios de nuestros padres resucitó a Jesús, a quien vosotros matasteis colgándole de un madero. La diestra de Dios lo exaltó haciéndolo jefe y salvador, para otorgar a Israel la conversión, el perdón de los pecados. Testigos de esto somos nosotros y el Espíritu Santo, que Dios da a los que le obedecen.
  ant_benedictus: Ésta fue la tercera vez que se apareció Jesús a los discípulos después de su resurrección de entre los muertos. Aleluia.
  preces:
    intro: 'Dirijamos nuestra oración a Dios Padre, que por la resurrección de Jesucristo nos ha dado vida nueva, y digámosle:'
    preces:
    - - Señor, Padre clementísimo, tú que nos has revelado tu plan de salvación, proyectado desde antes de la creación del mundo y eres fiel en todas tus promesas,
      - escucha con amor nuestras plegarias.
    - - Purifícanos con tu verdad y encamina nuestros pasos por las sendas de la santidad,
      - para que hagamos siempre el bien según tu agrado.
    - - Haz resplandecer tu rostro sobre nosotros,
      - para que, libres de todo mal, nos saciemos con los bienes de tu casa.
    - - Tú que por Cristo nos reconciliaste contigo,
      - danos la paz a nosotros y a todos los hombres del mundo.
    respuesta: Ilumínanos, Señor, con la claridad de Jesucristo.
  padrenuestro_intro: 'Porque deseamos que la luz de Cristo ilumine a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Dios todopoderoso y eterno, que por el misterio pascual restableciste tu alianza con los hombres, concédenos realizar en nuestra vida lo que en estas fiestas proclama nuestra fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
Sábado de la Octava de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Velaron las estrellas el sueño de su muerte
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Rm 14, 7-9
    texto: Ninguno de nosotros vive para sí y ninguno muere para sí. Que si vivimos, vivimos para el Señor; y si morimos, para el Señor morimos. En fin, que tanto en vida como en muerte somos del Señor. Para esto murió Cristo y retornó a la vida, para ser Señor de vivos y muertos.
  ant_benedictus: Después de su resurrección, que tuvo lugar a la mañana del primer día de la semana, Jesús se apareció primero a María Magdalena, de la que había arrojado siete demonios. Aleluia.
  preces:
    intro: 'Oremos a Cristo, pan de vida, que en el último día resucitará a los que se alimentan con su palabra y con su cuerpo, y digámosle:'
    preces:
    - - Hijo de Dios, que resucitado de entre los muertos eres el Príncipe de la vida,
      - bendice y santifica a tus fieles y a todos los hombres.
    - - Tú que concedes paz y alegría a todos los que creen en ti,
      - danos vivir como hijos de la luz y alegrarnos de tu victoria.
    - - Aumenta la fe de tu Iglesia, peregrina en la tierra,
      - para que dé al mundo testimonio de tu resurrección.
    - - Tú que, habiendo padecido mucho, has entrado ya en la gloria del Padre,
      - convierte en gozo la tristeza de los afligidos.
    respuesta: Señor, danos paz y alegría.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Dios nuestro, que con la abundancia de tu gracia no cesas de aumentar en todos los pueblos el número de tus hijos, mira con amor a tus elegidos que han nacido a una nueva vida por el sacramento del bautismo y concédeles alcanzar una dichosa inmortalidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
II Domingo de Pascua (de la Divina Misericordia):
  oracion: Señor Dios, cuya misericordia es eterna, tú que reanimas la fe de tu pueblo con la celebración anual de las fiestas pascuales, aumenta en nosotros los dones de tu gracia, para que comprendamos mejor la excelencia del bautismo que nos ha purificado, la grandeza del Espíritu que nos ha reengendrado y el precio de la sangre que nos ha redimido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  en_lugar_del_responsorio: 'Éste es el día en que actuó el Señor: sea él nuestra alegría y nuestro gozo. Aleluia.'
  himno: Estaba al alba María
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestra boca:'
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  salmodia:
  - ant: Cristo ha resucitado y con su claridad ilumina al pueblo rescatado con su sangre. Aleluia.
    salmo: salmo-62-2-9
  - ant: Ha resucitado del sepulcro nuestro Redentor; cantemos un himno al Señor, nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Aleluia. Ha resucitado el Señor, tal como os lo había anunciado. Aleluia.
    salmo: salmo-149
  preces:
    intro: 'Invoquemos a Dios, Padre todopoderoso, que resucitó a Jesús, nuestro jefe y salvador, y aclamémoslo, diciendo:'
    preces:
    - - Padre santo, que hiciste pasar a tu Hijo amado de las tinieblas de la muerte a la luz de tu gloria,
      - haz que podamos llegar también nosotros a tu luz admirable.
    - - Tú que nos has salvado por la fe,
      - haz que vivamos hoy según la fe que profesamos en nuestro bautismo.
    - - Tú que quieres que busquemos las cosas de arriba, donde está Cristo sentado a tu derecha,
      - líbranos de la seducción del pecado.
    - - Haz que nuestra vida, oculta en ti con Cristo, brille en el mundo,
      - para que aparezcan los cielos nuevos y la tierra nueva.
    respuesta: Ilumínanos, Señor, con la luz de Cristo.
  lectura:
    ref: Hch 10, 40-43
    texto: Dios resucitó a Jesús al tercer día e hizo que se apareciese no a todo el pueblo, sino a nosotros, que somos los testigos elegidos de antemano por Dios. Nosotros hemos comido y bebido con él, después que Dios lo resucitó de entre los muertos. Y él nos mandó predicar al pueblo y atestiguar que ha sido constituido por Dios juez de vivos y muertos. De él hablan todos los profetas y aseguran que cuantos tengan fe en él recibirán por su nombre el perdón de sus pecados.
  ant_benedictus: Trae tu mano y métela en mi costado; y no seas incrédulo sino fiel. Aleluia.
Lunes de la II semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: La bella flor que en el suelo
  salmodia:
  - ant: Como busca la cierva corrientes de agua, así mi alma te busca a ti, Dios mío. Aleluia.
    salmo: salmo-41
  - ant: Llena, Señor, a Sión de tu majestad y al templo de tu gloria. Aleluia.
    salmo: cantico-sir-36-1-7-13-16
  - ant: La gloria de Dios ilumina la ciudad santa y el cordero es su sol. Aleluia.
    salmo: salmo-18-a
  lectura:
    ref: Rm 10, 8b-10
    texto: «Cerca de ti está la palabra, en tu boca y en tu corazón», es decir, el mensaje de la fe que nosotros predicamos. Porque, si proclamas con tu boca a Jesús como Señor y crees en tu corazón que Dios lo resucitó de entre los muertos, serás salvo. Pues con el corazón creemos para obtener la justificación y con la boca hacemos profesión de nuestra fe para alcanzar la salvación.
  responsorio:
  - - V
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - V
    - El que por nosotros colgó del madero.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre,y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  ant_benedictus: 'Os digo con toda verdad: el que no nace de arriba no podrá entrar en el reino de Dios. Aleluia.'
  preces:
    intro: 'Oremos a Dios Padre todopoderoso, glorificado por la muerte y resurrección de Cristo, y digámosle confiados:'
    preces:
    - - Padre, fuente de toda luz, que has querido iluminar el mundo con la gloria de Cristo resucitado,
      - ilumina, desde el principio de este día, nuestras almas con la luz de la fe.
    - - Tú que por medio de tu Hijo, resucitado de entre los muertos, has abierto a los hombres las puertas de la salvación,
      - haz que, a través de los trabajos de este día, se acreciente nuestra esperanza.
    - - Tú que por medio de tu Hijo resucitado has derramado sobre el mundo tu Espíritu Santo,
      - enciende nuestros corazones con el fuego de este mismo Espíritu.
    - - Tú que para librarnos entregaste a tu Hijo a la muerte,
      - haz que él sea hoy para nosotros salvación y redención.
    respuesta: Ilumina, Señor, nuestras mentes.
  padrenuestro_intro: 'Terminemos nuestra oración con la plegaria que Cristo nos enseñó:'
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la II semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Estaba al alba María
  salmodia:
  - ant: Os habéis acercado al monte de Sión, a la ciudad del Dios vivo. Aleluia.
    salmo: salmo-42
  - ant: Tú, Señor, detuviste mi alma ante la tumba vacía. Aleluia.
    salmo: cantico-is-38-10-14-17-20
  - ant: Tú has cuidado de nuestra tierra y la has enriquecido sin medida. Aleluia.
    salmo: salmo-64
  lectura:
    ref: Hch 13, 30-33
    texto: 'Dios resucitó a Jesús de entre los muertos. Y durante muchos días se apareció a los que con él habían subido de Galilea a Jerusalén: éstos, efectivamente, dan ahora testimonio de él ante el pueblo. Y nosotros os damos la buena nueva: la promesa que Dios hizo a nuestros padres la ha cumplido él ahora con nosotros, sus hijos, resucitando a Jesús, según está escrito en el salmo segundo: «Tú eres mi Hijo; yo te he engendrado hoy.»'
  responsorio:
  - - V
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
