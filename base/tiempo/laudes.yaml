# Propio del tiempo de Laudes: por feria (nombre del Ordo); en los domingos, «(A)», «(B)» o «(C)» cuando cambia con el ciclo.
# Solo figura lo que cambia respecto del salterio (base/salterio/laudes.yaml).
I Domingo de Adviento:
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que has de venir al mundo.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  oracion: Señor, despierta en tus fieles el deseo de prepararse a la venida de Cristo por la práctica de las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino celestial. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  himno: Ven, Señor, no tardes
  padrenuestro_intro: 'Como nos enseñó el Salvador, nos atrevemos a decir:'
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  salmodia:
  - ant: Aquel día los montes destilarán dulzura y las colinas manarán leche y miel. Aleluia.
    salmo: salmo-62-2-9
  - ant: Los montes y las colinas aclamarán en presencia del Señor y los árboles del bosque aplaudirán, porque viene el Señor y reinará eternamente. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Vendrá el gran profeta y renovará Jerusalén. Aleluia.
    salmo: salmo-149
  preces:
    intro: 'Oremos a Dios Padre, que nos concede la gracia de esperar la revelación de nuestro Señor Jesucristo, y digámosle confiados:'
    preces:
    - - Santifica, Señor, todo nuestro ser, alma y cuerpo,
      - y guárdanos libres de culpa hasta el día de la venida de tu Hijo.
    - - Haz que durante este día caminemos en santidad
      - y llevemos una vida justa y religiosa.
    - - Haz que nos revistamos de nuestro Señor Jesucristo
      - y que nos llenemos del Espíritu Santo.
    - - Concédenos, Señor, que vivamos siempre preparados
      - para el día de la manifestación gloriosa de tu Hijo.
    respuesta: Muéstranos, Señor, tu misericordia.
  lectura:
    ref: Rm 13, 11b-12
    texto: Ya es hora que despertéis del sueño, pues la salud está ahora más cerca que cuando abrazamos la fe. La noche va pasando, el día está encima; desnudémonos, pues, de las obras de las tinieblas y vistámonos de las armas de la luz.
  ant_benedictus: El Espíritu Santo descenderá sobre ti, María; no temas, concebirás en tu seno al Hijo de Dios. Aleluia.
Lunes de la I semana de Adviento:
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  himno: Una clara voz resuena
  lectura:
    ref: Is 2, 3
    texto: 'Venid, subamos al monte del Señor, a la casa del Dios de Jacob: él nos instruirá en sus caminos, y marcharemos por sus sendas; porque de Sión saldrá la ley, de Jerusalén la palabra del Señor.'
  responsorio:
  - - V
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - V
    - Su gloria aparecerá sobre ti.
  - - R
    - Amanecerá el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  ant_benedictus: 'Levanta tu mirada, Jerusalén, y contempla el poder de tu Rey: mira, tu Salvador viene a librarte de tus cadenas.'
  preces:
    intro: 'El Señor Jesucristo, luz de luz e Hijo de Dios vivo, nos arrancará de nuestras tinieblas para que podamos contemplar su gloria; acudamos, pues, a él y digámosle confiadamente:'
    preces:
    - - Oh Luz indestructible que vienes a iluminar nuestras tinieblas,
      - despierta nuestra fe aletargada.
    - - Haz que andemos con seguridad durante el día,
      - guiados por el resplandor de tu claridad.
    - - Enséñanos a tener la verdadera bondad,
      - y haz que ella sirva para iluminar a los hombres.
    - - Ven a crear la nueva tierra que anhelamos,
      - en la que habite la justicia y la paz.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Digamos a nuestro Padre, con toda confianza:'
  oracion: Concédenos, Señor Dios nuestro, anhelar de tal manera la llegada de tu Hijo Jesucristo, que, cuando llame a nuestras puertas, nos encuentre velando en oración y cantando sus alabanzas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la I semana de Adviento:
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  himno: Ven, Señor, no tardes
  lectura:
    ref: Gn 49, 10
    texto: No se apartará de Judá el cetro, ni el bastón de mando de entre sus rodillas, hasta que venga el que ha de venir, aquel a quien le está reservado, a quien rendirán homenaje las naciones.
  responsorio:
  - - V
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - V
    - Su gloria aparecerá sobre ti.
  - - R
    - Amanecerá el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  ant_benedictus: Saldrá un renuevo del tronco de Jesé, la gloria del Señor llenará toda la tierra y contemplarán todos la salvación de Dios.
  preces:
    renglones:
    - 'El Señor, Padre todopoderoso, tenderá otra vez su mano, para rescatar el resto de su pueblo; supliquémosle, pues, confiados:'
    - Venga tu reino, Señor.
    - Concédenos, Señor, dar aquel fruto que pide la conversión,
    - para que podamos recibir tu reino que se acerca.
    - Prepara, Señor, en nuestros corazones, un camino para tu Palabra que ha de venir;
    - así tu gloria se manifestará al mundo por medio de nosotros.
    - Abaja los montes y las colinas de nuestro orgullo y levanta los valles de nuestros desánimos y de nuestras cobardías.
    - Destruye los muros del odio que dividen a las naciones
    - y allana los caminos de la concordia entre los hombres.
  padrenuestro_intro: 'El Señor se acerca para salvarnos; por eso nos atrevemos a pedir la venida de su reino, diciendo:'
  oracion: Señor, Dios nuestro, acoge favorablemente nuestras súplicas y concédenos tu ayuda en las tribulaciones, para que, reanimados por la venida de tu Hijo, que ya se acerca, no volvamos a caer más en nuestras antiguas faltas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la I semana de Adviento:
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  himno: Una clara voz resuena
  lectura:
    ref: Is 7, 14b-15
    texto: 'Mirad: la Virgen ha concebido y dará a luz un hijo, y le pondrá por nombre Emmanuel: «Dios-con-nosotros». Éste comerá requesón y miel, hasta que aprenda a rechazar el mal y a escoger el bien.'
  responsorio:
  - - V
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - V
    - Su gloria aparecerá sobre ti.
  - - R
    - Amanecerá el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  ant_benedictus: Viene detrás de mi uno que puede más que yo, y yo no soy digno ni de desatar la correa de sus sandalias.
  preces:
    intro: 'Cristo, Palabra de Dios, ha querido acampar entre nosotros para que contemplemos su gloria; alegres, pues, por la esperanza, digamos:'
    preces:
    - - Príncipe de la justicia y de la rectitud,
      - haz justicia a los pobres y desamparados.
    - - Rey de la paz, que de las espadas forjas arados y de las lanzas podaderas,
      - convierte nuestras envidias en amor y nuestra hambre de venganza en deseos de perdón.
    - - Tú, que no juzgas por apariencias,
      - discierne quienes son los que realmente te pertenecen.
    - - Cuando vengas en una nube con gran poder y gloria,
      - haz que nos podamos mantener en pie delante de ti.
    respuesta: Quédate con nosotros, Señor.
  padrenuestro_intro: 'Pidamos a Dios que su reino se haga cada día más visible entre nosotros:'
  oracion: Señor, Dios nuestro, prepara tú mismo nuestros corazones, para que, cuando venga tu Hijo Jesucristo, nos encuentre dignos del festín de la vida eterna y merezcamos ser invitados por él mismo a la mesa de su reino celestial. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la I semana de Adviento:
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  himno: Una clara voz resuena
  lectura:
    ref: Is 45, 8
    texto: Cielos, destilad el rocío; nubes, derramad al Justo; ábrase la tierra y brote la salvación, y con ella germine la justicia.
  responsorio:
  - - V
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - V
    - Su gloria aparecerá sobre ti.
