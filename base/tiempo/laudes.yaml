  ant_benedictus: Voy a prepararos un lugar, pero volveré otra vez, para tomaros y llevaros conmigo, para que donde yo esté, estéis también vosotros. Aleluia.
  preces:
    intro: 'Dirijamos nuestra oración a Dios Padre, que por el Espíritu resucitó a Jesús de entre los muertos y vivificará también nuestros cuerpos mortales; digámosle:'
    preces:
    - - Padre santo, tú que al resucitar a tu Hijo de entre los muertos manifestaste que habías aceptado su sacrificio,
      - acepta también la ofrenda de nuestro día y condúcenos a la plenitud de la vida.
    - - Bendice, Señor, las acciones de nuestro día
      - y ayúdanos a buscar en ellas tu gloria y el bien de nuestros hermanos.
    - - Que el trabajo de hoy sirva para la edificación de un mundo nuevo
      - y nos conduzca también a tu reino eterno.
    - - Te pedimos, Señor, que nos hagas ser siempre solícitos del bien de los hombres
      - y que nos ayudes a amarnos mutuamente.
    respuesta: Vivifícanos, Señor, con tu Espíritu Santo.
  padrenuestro_intro: 'Dirijamos ahora al Padre nuestra oración con las mismas palabras que Cristo nos enseñó:'
  oracion: Dios, autor de nuestra salvación y de nuestra liberación, escucha nuestras súplicas, y a quienes redimiste por la sangre de tu Hijo concédeles poder vivir para ti, y en ti gozar de la felicidad eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Sábado de la IV semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Velaron las estrellas el sueño de su muerte
