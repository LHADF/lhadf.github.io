  padrenuestro_intro: 'Ya que la fuerza para no caer en la tentación nos viene de Dios, repitamos juntos la oración que Cristo nos enseñó y pidamos al Padre que nos libre siempre del mal:'
  oracion: Dios nuestro, que, para librarnos del poder del enemigo, quisiste que tu Hijo muriera en la cruz, concédenos alcanzar la gracia de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves Santo:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: No me mueve, mi Dios, para quererte
  salmodia:
  - ant: Mira, Señor, y contempla que estoy en peligro, respóndeme en seguida.
    salmo: salmo-79
  - ant: 'Él es mi Dios y Salvador: confiaré y no temeré.'
    salmo: cantico-is-12-1-6
  - ant: El Señor nos alimentó con flor de harina, nos sació con miel silvestre.
    salmo: salmo-80
  lectura:
    ref: Hb 2, 9b-10
    texto: Vemos a Jesús coronado de gloria y de honor por haber padecido la muerte. Así, por amorosa dignación de Dios, gustó la muerte en beneficio de todos. Pues como quisiese Dios, por quien y para quien son todas las cosas, llevar un gran número de hijos a la gloria, convenía ciertamente que perfeccionase por medio del sufrimiento al que iba a guiarlos a la salvación.
