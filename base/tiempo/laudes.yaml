  ant_benedictus: El Salvador del mundo aparecerá como el sol naciente y descenderá al seno de la Virgen como la lluvia desciende sobre el césped. Aleluia.
  preces:
    intro: 'Hermanos, oremos a Cristo, el redentor, que viene a librar del poder de la muerte a los que se convierten a él, y digámosle:'
    preces:
    - - Que al anunciar tu venida, Señor,
      - nuestro corazón se sienta libre de toda vanidad.
    - - Que la Iglesia que tú fundaste, Señor,
      - glorifique tu nombre por todo el mundo.
    - - Que tu ley, Señor, sea luz para nuestros ojos
      - y sirva de protección a los pueblos que confiesan tu nombre.
    - - Tú que por la Iglesia nos anuncias el gozo de tu venida,
      - concédenos también el deseo de recibirte.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Con el gozo que nos da el saber que Cristo viene para hacernos hijos de Dios, digamos al Padre:'
  oracion: Dios nuestro, que te has dignado revelar al mundo el esplendor de tu gloria por medio del parto de la santísima Virgen María, concédenos venerar con fe íntegra y celebrar con sincero rendimiento el gran misterio de la encarnación de tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
