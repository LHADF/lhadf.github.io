  ant_benedictus: La Palabra se hizo carne y puso su morada entre nosotros, llena de gracia y de verdad, y de su plenitud todos hemos recibido gracia sobre gracia. Aleluia.
  preces:
    intro: 'Acudamos alegres a nuestro Redentor, al Hijo de Dios hecho hombre para renovar al hombre, y digámosle confiados:'
    preces:
    - - Oh Jesús, Hijo de Dios vivo, esplendor del Padre, luz increada, rey de la gloria, sol de justicia e hijo de la Virgen María,
      - ilumina con la luz de tu encarnación el día que ahora empezamos.
    - - Oh Jesús, consejero admirable, Dios poderoso, padre sempiterno, príncipe de la paz,
      - haz que los ejemplos de tu humanidad santa sean norma para nuestra vida.
    - - Oh Jesús, todopoderoso y paciente, humilde de corazón y obediente,
      - manifiesta a todos los hombres la belleza de la humildad.
    - - Oh Jesús, padre de los pobres, gloria de los fieles, pastor bueno, luz indeficiente, sabiduría infinita y bondad inmensa, camino, verdad y vida para todos,
      - concede a tu Iglesia el espíritu de pobreza.
    respuesta: Quédate con nosotros, oh Enmanuel.
  padrenuestro_intro: 'Como Jesucristo, también nosotros somos hijos de Dios; por eso con él nos atrevemos a decir:'
  oracion: Dios nuestro, que quisiste que en el parto de la santísima Virgen María la carne de tu Hijo no quedara sometida a la antigua sentencia dada al género humano, concédenos, ya que por el nacimiento de Cristo hemos entrado a participar de esta renovación de la creatura, que nos veamos libres del contagio de la antigua condición. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
