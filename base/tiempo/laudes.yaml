Epifanía del Señor:
  inv_ant: A Cristo, que se nos ha manifestado, venid, adorémosle.
  himno: Estrella nunca vista se aparece
  salmodia:
  - ant: Los magos, abriendo sus cofres, ofrecieron al Señor oro, incienso y mirra. Aleluia.
    salmo: salmo-62-2-9
  - ant: Mares y ríos, bendecid al Señor; manantiales, ensalzad con himnos a nuestro Dios. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Llega tu luz, Jerusalén, y la gloria del Señor alborea sobre ti y caminarán las naciones a tu luz. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Is 52, 7-10
    texto: '¡Qué hermosos son sobre los montes los pies del mensajero que anuncia la paz, que trae la dicha, que anuncia la salvación, que dice a Sión: «Ya reina tu Dios»! Escucha: tus vigías gritan, cantan a coro, porque ven cara a cara al Señor, que vuelve a Sión. Prorrumpid a una en gritos de júbilo, soledades de Jerusalén, porque el Señor consuela a su pueblo y ha rescatado a Jerusalén: el Señor desnuda su santo brazo a la vista de todas las naciones, y verán los confines de la tierra la victoria de nuestro Dios.'
  responsorio:
  - - V
    - Se postrarán ante él todos los reyes.
  - - R
    - Se postrarán ante él todos los reyes.
  - - V
    - Todos los pueblos le servirán.
  - - R
    - Y todos los reyes.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Se postrarán ante él todos los reyes.
  ant_benedictus: Hoy la Iglesia se ha unido a su celestial Esposo, porque, en el Jordán, Cristo ha lavado los pecados de ella, los magos acuden con regalos a las bodas del Rey y los invitados se alegran por el agua convertida en vino. Aleluia.
  preces:
    intro: 'Veneremos a nuestro Salvador, adorado hoy por los magos, y aclamémoslo con alegría, diciendo:'
    preces:
    - - Cristo Jesús, que te manifestaste revestido de nuestra frágil carne humana,
      - santifícanos por la palabra de Dios y por la oración.
    - - Cristo Jesús, santificado por el Espíritu,
      - líbranos de todo error.
    - - Cristo Jesús, mostrado a los ángeles,
      - danos a gustar, ya en la tierra, de los bienes de tu reino.
    - - Cristo Jesús, proclamado a los gentiles,
      - ilumina el corazón de todos los hombres con la luz del Espíritu Santo.
    - - Cristo Jesús, en quien el mundo ha creído,
      - aumenta la fe en todos los creyentes.
    - - Cristo Jesús, que has subido a la gloria,
      - enciende en nosotros el deseo de tu reino.
    respuesta: Luz de luz, ilumina nuestro día.
  padrenuestro_intro: 'Alegres porque Jesucristo nos ha hecho hijos de Dios, digamos:'
  oracion: Señor, tú que manifestaste a tu Hijo en este día a todas las naciones por medio de una estrella, concédenos, a los que ya te conocemos por la fe, llegar a contemplar, cara a cara, la hermosura infinita de tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
