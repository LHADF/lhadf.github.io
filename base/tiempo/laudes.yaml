  ant_benedictus: Dios, vuestro Padre, hace salir su sol sobre malos y buenos.
  oracion: Concédenos, Dios todopoderoso, que la constante meditación de tu doctrina nos impulse a hablar y a actuar siempre según tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Lunes de la II semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: ¡Cuántas veces, Señor, me habéis llamado
  lectura:
    ref: Ex 19, 4-6a
    texto: Vosotros habéis visto cómo os saqué sobre alas de águila y os traje hacia mí; ahora pues, si queréis obedecerme y guardar mi alianza, seréis mi especial propiedad entre todos los pueblos, pues mía es toda la tierra. Seréis para mí un reino de sacerdotes y una nación santa.
  responsorio:
