    - El que por nosotros colgó del madero.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre,y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  ant_benedictus: Yo soy el alfa y la omega, el primero y el último; yo soy el vástago y la descendencia de David, el lucero radiante de la mañana. Aleluia.
  preces:
    intro: 'Oremos agradecidos a Dios, Padre de nuestro Señor Jesucristo, el Cordero inmaculado que quitó el pecado del mundo y nos comunica su vida nueva, y digámosle:'
    preces:
    - - Dios, autor de la vida, acuérdate de la muerte y resurrección del Cordero inmolado en la cruz
      - y atiende su continua intercesión por nosotros.
    - - Haz, Señor, que, tirada fuera la vieja levadura de la malicia y de la perversidad,
      - vivamos la Pascua de Cristo con panes ázimos de pureza y de verdad.
    - - Que sepamos rechazar hoy el pecado de discordia y de envidia,
      - y seamos más sensibles a las necesidades de nuestros hermanos.
    - - Concédenos vivir auténticamente el espíritu evangélico,
      - para que hoy y siempre sigamos el camino de tus mandatos.
    respuesta: Autor de la vida, vivifícanos.
  padrenuestro_intro: 'Porque deseamos que la luz de Cristo alumbre a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Dios todopoderoso, haz que sepamos anunciar al mundo la victoria de Cristo resucitado y, ya que nos has dado la prenda de su obra redentora, concédenos llegar a poseer plenamente los dones prometidos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la II semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Gloriosa aurora de este nuevo día
  salmodia:
  - ant: Te vio el mar, ¡oh Dios!, te vio el mar mientras guiabas a tu pueblo por las aguas caudalosas. Aleluia.
    salmo: salmo-76
  - ant: El Señor da la muerte y la vida. Aleluia.
    salmo: cantico-1s-2-1-10
  - ant: Amanece la luz para el justo, y la alegría para los rectos de corazón. Aleluia.
    salmo: salmo-96
  lectura:
    ref: Rm 6, 8-11
    texto: Si verdaderamente hemos muerto con Cristo, tenemos fe de que también viviremos con él, pues sabemos que Cristo, una vez resucitado de entre los muertos, ya no muere; la muerte no tiene ya poder sobre él. Su muerte fue un morir al pecado de una vez para siempre, mas su vida es un vivir para Dios. Así también, considerad vosotros que estáis muertos al pecado, pero que vivís para Dios en unión con Cristo Jesús.
