  preces:
    intro: 'Dirijámonos a Dios, que quiso manifestar a Jesús resucitado a los apóstoles, y digámosle suplicantes:'
    preces:
    - - Señor, fuente de toda luz, te aclamamos con acción de gracias en esta mañana, porque nos has llamado a participar de tu luz admirable
      - y nos has querido dar la salvación.
    - - Haz, Señor, que la fuerza del Espíritu Santo nos purifique y nos fortalezca,
      - para que con nuestro trabajo hagamos más humana la vida de los hombres.
    - - Haz que nos entreguemos de tal modo al servicio de nuestros hermanos,
      - que logremos hacer de la familia humana una ofrenda agradable a tus ojos.
    - - Llénanos, desde el principio de este nuevo día, de tu misericordia,
      - para que en toda nuestra jornada nos gocemos en tu alabanza.
    respuesta: Ilumínanos, Señor, con la claridad de tu Cristo.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Dios nuestro, vida de los creyentes, gloria de los humildes, felicidad de los justos, atiende benignamente a nuestras súplicas y haz que quienes deseamos ardientemente el cumplimiento de tus promesas seamos siempre colmados por la abundancia de tus beneficios. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
