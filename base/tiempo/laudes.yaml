  ant_benedictus: 'Decid a los cobardes de corazón: «Sed fuertes; mirad al Señor, nuestro Dios, que viene.»'
  preces:
    intro: 'Oremos, hermanos, a Cristo, nuestro redentor, que ha venido para darnos la justificación, y digámosle con júbilo:'
    preces:
    - - Señor, cuya venida en la carne anunciaron antiguamente los profetas,
      - haz germinar en nosotros la semilla de las virtudes.
    - - Concede a los que anunciamos al mundo tu salvación
      - que encontremos también en ti nuestra salvación.
    - - Tú que viniste a librar a los oprimidos,
      - cura las dolencias de los que sufren.
    - - Tú que reconciliaste al mundo con Dios en tu primera venida,
      - absuélvenos de toda condenación cuando vengas como juez.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Repitamos las palabras de Jesús, pidiendo al Padre que venga su reino:'
  oracion: Dios todopoderoso, concede a tu pueblo permanecer siempre en vela aguardando la venida de tu Hijo, para que cumpliendo lo que el mismo autor de nuestra salvación nos enseñó, podamos salir a su encuentro con nuestras lámparas encendidas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
