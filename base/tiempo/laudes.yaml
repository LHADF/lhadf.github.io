  ant_benedictus: 'Os lo aseguro con toda verdad: el que cree en mí tiene vida eterna. Aleluia.'
  preces:
    intro: 'Glorifiquemos a Cristo resucitado y siempre presente en su Iglesia, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesús, vencedor del pecado y de la muerte,
      - permanece en medio de nosotros, tú que vives por los siglos de los siglos.
    - - Señor, ven a nosotros con tu poder invencible
      - y muéstranos la bondad de Dios Padre.
    - - Señor, ayuda al mundo abrumado por las discordias,
      - ya que tú solo tienes el poder de salvar y reconciliar.
    - - Confírmanos en la fe de la victoria final
      - y arraiga en nosotros la esperanza de tu manifestación gloriosa.
    respuesta: Quédate con nosotros, Señor.
  padrenuestro_intro: 'Porque Jesucristo nos ha hecho participar de su propia vida, somos hijos de Dios, y por ello nos atrevemos a decir:'
  oracion: Dios todopoderoso y eterno, que en estos días de Pascua nos has revelado con más plenitud la grandeza de tu amor, concédenos, ya que nos has librado de las tinieblas del error, que nos adhiramos más firmemente a tus enseñanzas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
