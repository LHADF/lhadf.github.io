  ant_benedictus: La paz sea con vosotros, soy yo; aleluia; no tengáis miedo. Aleluia.
  preces:
    intro: 'Oremos a Cristo, que nos ha manifestado la vida eterna, y digámosle confiados:'
    preces:
    - - Pastor eterno, contempla con amor a tu pueblo, que se levanta ahora del descanso,
      - y aliméntalo durante este día con tu palabra y tu eucaristía.
    - - No permitas que seamos arrebatados por el lobo que devora o entregados por el mercenario que huye,
      - sino haz que escuchemos siempre tu voz de buen pastor.
    - - Tú que actúas siempre juntamente con los ministros de tu Evangelio y confirmas su palabra con tu gracia,
      - haz que durante este día proclamemos tu resurrección con nuestras palabras y con nuestra vida.
    - - Sé, Señor, tú mismo nuestro gozo, el gozo que nadie puede arrebatarnos,
      - y haz que, alejados de toda tristeza, fruto del pecado, tengamos hambre de poseer tu vida eterna.
    respuesta: Que tu resurrección, Señor, nos haga crecer en gracia.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
