  ant_benedictus: «Si permanecéis en mi palabra seréis en verdad discípulos míos —dice el Señor— y llegaréis al conocimiento de la verdad y la verdad os librará de la esclavitud.»
  preces:
    intro: 'Bendigamos al Autor de nuestra salvación, que ha querido renovar en sí mismo todas las cosas, y digámosle:'
    preces:
    - - Señor, tú que nos has prometido un cielo nuevo y una tierra nueva, renuévanos sin cesar por tu Espíritu Santo,
      - para que lleguemos a gozar eternamente de ti en la nueva Jerusalén.
    - - Que trabajemos, Señor, para que el mundo se impregne de tu Espíritu
      - y se logre así más eficazmente la justicia, el amor y la paz universal.
    - - Enséñanos, Señor, a corregir nuestra pereza y nuestra desidia
      - y a poner nuestro corazón en los bienes eternos.
    - - Líbranos del mal
      - y presérvanos de la fascinación de la vanidad que oscurece la mente y oculta el bien.
    respuesta: Renuévanos, Señor, por tu Espíritu Santo.
  padrenuestro_intro: 'Digamos al Padre, unidos a Jesús, la oración que él nos enseñó:'
  oracion: Dios misericordioso, ilumina los corazones de tus hijos que tratan de purificarse por la penitencia de la Cuaresma y, ya que nos infundes el deseo de servirte con amor, dígnate escuchar paternalmente nuestras súplicas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la V semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Pastor que con tus silbos amorosos
  lectura:
    ref: Hb 2, 9b-10
    texto: Vemos a Jesús coronado de gloria y de honor por haber padecido la muerte. Así, por amorosa dignación de Dios, gustó la muerte en beneficio de todos. Pues como quisiese Dios, por quien y para quien son todas las cosas, llevar un gran número de hijos a la gloria, convenía ciertamente que perfeccionase por medio del sufrimiento al que iba a guiarlos a la salvación.
