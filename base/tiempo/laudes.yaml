  ant_benedictus: El Señor ha visitado y redimido a su pueblo.
  preces:
    intro: 'Alabemos a Cristo, que se ha hecho para nosotros sabiduría, justicia, santificación y redención, y supliquémosle confiados, diciendo:'
    preces:
    - - Rey del universo, a quien los pastores encontraron envuelto en pañales,
      - ayúdanos a imitar siempre tu pobreza y tu sencillez.
    - - Señor del cielo, que desde tu solio real bajaste a lo más humilde de la tierra,
      - enséñanos a honrar siempre a nuestros hermanos de condición más humilde.
    - - Oh Cristo, luz eterna, que al asumir nuestra carne no fuiste contaminado por nuestro pecado,
      - haz que tus fieles, al usar de los bienes de este mundo, no se vean manchados por ellos.
    - - Esposo divino de la Iglesia, que eres para ella torre de fortaleza,
      - haz que todos tus fieles perseveren unidos a ella y en ella encuentren la salvación.
    respuesta: Que tu nacimiento, Señor, nos salve.
  padrenuestro_intro: 'Ya que somos la familia de Dios, digamos con grande confianza a nuestro Padre del cielo:'
  oracion: Señor Dios, que iniciaste admirablemente la obra de la redención con el nacimiento de tu Hijo, fortalece en nosotros la fe, para que, siguiendo sus enseñanzas, podamos alcanzar la prometida recompensa de la gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
II Domingo después de Navidad:
  responsorio:
