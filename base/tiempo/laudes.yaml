  ant_benedictus: Para esto murió Cristo y retornó a la vida, para ser Señor de vivos y muertos. Aleluia.
  preces:
    intro: 'Oremos a Cristo, pan de vida, que en el último día resucitará a los que se alimentan con su palabra y con su cuerpo, y digámosle:'
    preces:
    - - Hijo de Dios, que resucitado de entre los muertos eres el Príncipe de la vida,
      - bendice y santifica a tus fieles y a todos los hombres.
    - - Tú que concedes paz y alegría a todos los que creen en ti,
      - danos vivir como hijos de la luz y alegrarnos de tu victoria.
    - - Aumenta la fe de tu Iglesia, peregrina en la tierra,
      - para que dé al mundo testimonio de tu resurrección.
    - - Tú que, habiendo padecido mucho, has entrado ya en la gloria del Padre,
      - convierte en gozo la tristeza de los afligidos.
    respuesta: Señor, danos paz y alegría.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Dios todopoderoso y eterno, que por el nuevo nacimiento del bautismo has infundido en nosotros la vida eterna, concédenos alcanzar la plenitud de la gloria a los que, por la justificación, has hecho capaces de llegar a la inmortalidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VI Domingo de Pascua:
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros. Aleluia, aleluia.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros. Aleluia, aleluia.
