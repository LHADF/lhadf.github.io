  ant_benedictus: Despierta, despierta Sión, vístete de la fuerza del brazo del Señor.
  preces:
    intro: 'Invoquemos confiados a Cristo, fuerza y sabiduría de Dios, cuyo gozo es estar con los hijos de los hombres, y digámosle:'
    preces:
    - - Señor Jesucristo, que nos has llamado al reino de tu luz,
      - haz que nuestra vida sea agradable a Dios Padre.
    - - Tú que, desconocido por el mundo, has acampado entre nosotros,
      - manifiesta tu rostro a todos los hombres.
    - - Tú que estás más cerca de nosotros que nosotros mismos,
      - fortalece nuestros corazones con la esperanza de la salvación.
    - - Tú que eres la fuente de toda santidad,
      - consérvanos santos y sin mancha hasta el día de tu venida.
    respuesta: Quédate junto a nosotros, Señor.
  padrenuestro_intro: 'Digamos a nuestro Padre con toda confianza:'
  oracion: Señor, que la venida salvadora de tu Hijo alegre a tus siervos, a quienes ahora entristece el peso de sus culpas. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la III semana de Adviento:
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  himno: Una clara voz resuena
  lectura:
    ref: Jr 30, 21-22
    texto: 'Esto dice el Señor: «Saldrá de Jacob un príncipe, su señor saldrá de en medio de él; me lo acercaré y se llegará a mí. Vosotros seréis mi pueblo y yo seré vuestro Dios.»'
  responsorio:
  - - V
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  - - V
    - Su gloria aparecerá sobre ti.
  - - R
    - Amanecerá el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre ti, Jerusalén, amanecerá el Señor.
  ant_benedictus: Guardad el derecho, practicad la justicia, que mi salvación está para llegar.
  preces:
    intro: 'Por medio de su Hijo, Dios ha manifestado su gloria a los hombres; démosle gracias con gozo, diciendo:'
    preces:
    - - Señor, haz que sepamos acogernos mutuamente,
      - como Cristo nos acogió a nosotros para dar gloria a Dios.
    - - Cólmanos de alegría y paz en nuestra fe,
      - para que rebosemos de esperanza por la fuerza del Espíritu Santo.
    - - Con tu bondad y tu inmensa compasión ven, Señor,
      - en ayuda de todos y sal al encuentro de los que te desean aun sin saberlo.
    - - Tú que llamas y santificas a los que eliges,
      - llévanos a nosotros, pecadores, a tu felicidad y corónanos en tu reino.
    respuesta: Glorificado sea tu nombre, Señor.
  padrenuestro_intro: 'El Señor se acerca para salvarnos; por eso nos atrevemos a pedir la venida de su reino, diciendo:'
  oracion: Que tu gracia, Señor, nos prepare y nos acompañe siempre a los que esperamos anhelantes la venida de tu Hijo, a fin de que obtengamos los auxilios nicesarios para la vida presente y para llegar con felicidad a la futura. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo de Adviento:
  himno: Que viene Cristo repiten
IV Domingo de Adviento (A):
  inv_ant: El Señor está cerca, venid adorémosle.
  salmodia:
  - ant: 'Tocad la trompeta en Sión, porque está cerca el día del Señor. Mirad: viene a salvarnos. Aleluia.'
    salmo: salmo-117
  - ant: 'Vendrá el Señor, salid a su encuentro diciendo: «Grande es tu origen, y tu reino no tendrá fin: Dios fuerte, dominador, príncipe de la paz.» Aleluia.'
    salmo: cantico-dn-3-52-57
  - ant: Tu palabra omnipotente, Señor, vendrá desde su trono real. Aleluia.
    salmo: salmo-150
  lectura:
    ref: Rm 13, 11b-12
    texto: Ya es hora que despertéis del sueño, pues la salud está ahora más cerca que cuando abrazamos la fe. La noche va pasando, el día está encima; desnudémonos, pues, de las obras de las tinieblas y vistámonos de las armas de la luz.
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que has de venir al mundo.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  ant_benedictus: 'No dejéis de velar: pronto llegará el Señor, nuestro Dios.'
  preces:
    intro: 'Roguemos, hermanos, al Señor Jesús, juez de vivos y muertos, y digámosle:'
    preces:
    - - Señor Jesucristo, tú que viniste a salvar a los pecadores,
      - líbranos de caer en la tentación.
    - - Tú que vendrás con gloria para juzgar a tu pueblo,
      - muestra en nosotros tu poder salvador.
    - - Ayúdanos a cumplir con fortaleza de espíritu los preceptos de tu ley,
      - para que podamos esperar tu venida sin temor.
    - - Tú que eres bendito por los siglos,
      - concédenos, por tu misericordia, que llevando ya desde ahora una vida sobria y religiosa esperemos con gozo tu gloriosa aparición.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Porque Jesucristo mismo nos lo enseñó, nos atrevemos a decir:'
  oracion: Señor, derrama tu gracia sobre nosotros, que hemos conocido por el anuncio del ángel la encarnación de tu Hijo, para que lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo de Adviento (B):
  inv_ant: Hoy sabréis que vendrá el Señor, y mañana veréis su gloria.
  salmodia:
  - ant: Tú Belén, tierra de Judá, de ningún modo eres la menor, porque de ti saldrá un jefe, que gobernará a mi pueblo Israel.
    salmo: salmo-117
  - ant: Levantaos, alzad la cabeza; se acerca vuestra liberación.
    salmo: cantico-dn-3-52-57
  - ant: «Mañana será el día de vuestra salvación», dice el Señor de los ejércitos.
    salmo: salmo-150
  lectura:
    ref: Is 11, 1-3a
    texto: 'Saldrá un renuevo del tronco de Jesé, y de su raíz brotará un vástago. Sobre él se posará el espíritu del Señor: espíritu de sabiduría y de inteligencia, espíritu de consejo y de fortaleza, espíritu de ciencia y de temor del Señor.'
  responsorio:
  - - V
    - Mañana quedará borrada la iniquidad de la tierra.
  - - R
    - Mañana quedará borrada la iniquidad de la tierra.
  - - V
    - Y sobre nosotros reinará el Salvador del mundo.
  - - R
    - Quedará borrada la iniquidad de la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Mañana quedará borrada la iniquidad de la tierra.
  ant_benedictus: A María le llegó el tiempo de su alumbramiento, y dio a luz a su Hijo primogénito.
  preces:
    intro: 'Hermanos, oremos con todo nuestro espíritu a Cristo redentor, que vendrá con gran poder y gloria, y digámosle:'
    preces:
    - - Señor Jesucristo, que vendrás con poder desde el cielo,
      - mira nuestra pequeñez y haz que seamos dignos de tus dones.
    - - Tú que viniste a anunciar la Buena Noticia a los hombres,
      - danos fuerza para que también nosotros anunciemos el Evangelio a nuestros hermanos.
    - - Tú que desde el trono del Padre todo lo gobiernas,
      - haz que aguardemos con alegría la dicha que esperamos, tu aparición gloriosa.
    - - Consuélanos, Señor, con los dones de tu divinidad,
      - a los que anhelamos la gracia de tu venida.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Pidamos que el reino de Dios llegue a todos los hombres:'
  oracion: Jesús, Señor nuestro, ven pronto, no tardes más, para que se reanimen con tu venida los que confían en tu amor. Tú que vives y reinas con el Padre en la unidad del Espíritu Santo y eres Dios, por los siglos de los siglos.
