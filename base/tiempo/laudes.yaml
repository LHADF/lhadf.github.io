  preces:
    intro: 'Glorifiquemos a Cristo, Verbo eterno del Padre, manifestado en la carne, contemplado por los ángeles y predicado a los paganos, y digámosle devotamente:'
    preces:
    - - Libertador del género humano, que naciendo de la Virgen has venido a renovar el mundo,
      - líbranos por intercesión de María de toda corrupción de la carne.
    - - Tú que desde el cielo hiciste brillar en la tierra la justicia increada,
      - ilumina con la claridad de tu luz el día que empezamos y toda nuestra vida.
    - - Hijo de Dios, que nos has revelado el amor del Padre,
      - haz que también nuestra caridad manifieste a los hombres el amor de Dios.
    - - Tú que quisiste acampar entre nosotros,
      - haz que seamos dignos de morar contigo en tu reino.
    respuesta: Te adoramos, Hijo unigénito de Dios.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres y que su amor se extienda por toda la tierra, pidamos al Padre que su reino venga a nosotros:'
  oracion: Te pedimos, Dios todopoderoso, que tu Salvador, que has enviado del cielo como una luz nueva para redimir al mundo, nazca también en nuestros corazones y los renueve continuamente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
