  himno: Estaba al alba María
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestra boca:'
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  salmodia:
  - ant: El que tenga sed que venga a beber de balde el agua de la vida. Aleluia.
    salmo: salmo-62-2-9
  - ant: Adorad al Señor que ha creado el cielo y la tierra, el mar y las fuentes del agua. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Los fieles festejan la gloria del Señor. Aleluia.
    salmo: salmo-149
  preces:
    intro: 'Oremos a Cristo, autor de la vida, a quien Dios resucitó de entre los muertos, quien por su poder nos resucitará también a nosotros, y digámosle:'
    preces:
    - - Cristo, luz esplendorosa que brillas en las tinieblas, rey de la vida y salvador de los que han muerto,
      - concédenos vivir hoy en tu alabanza.
    - - Señor Jesús, que anduviste los caminos de la pasión y de la cruz,
      - concédenos que, unidos a ti en el dolor y en la muerte, resucitemos también contigo.
    - - Hijo del Padre, maestro y hermano nuestro, tú que has hecho de nosotros un pueblo de reyes y sacerdotes,
      - enséñanos a ofrecer con alegría nuestro sacrificio de alabanza.
    - - Rey de la gloria, esperamos anhelantes el día de tu manifestación gloriosa,
      - para poder contemplar tu rostro y ser semejantes a ti.
    respuesta: Cristo, vida nuestra, sálvanos.
  lectura:
    ref: Hch 10, 40-43
    texto: Dios resucitó a Jesús al tercer día e hizo que se apareciese no a todo el pueblo, sino a nosotros, que somos los testigos elegidos de antemano por Dios. Nosotros hemos comido y bebido con él, después que Dios lo resucitó de entre los muertos. Y él nos mandó predicar al pueblo y atestiguar que ha sido constituido por Dios juez de vivos y muertos. De él hablan todos los profetas y aseguran que cuantos tengan fe en él recibirán por su nombre el perdón de sus pecados.
