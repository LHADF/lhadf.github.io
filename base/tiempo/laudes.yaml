Natividad del Señor:
  inv_ant: A Cristo, que por nosotros ha nacido, venid, adorémosle.
  himno: Hoy grande gozo en el cielo
  salmodia:
  - ant: «¿A quién habéis visto, pastores? Hablad, contádnoslo, ¿quién se ha aparecido en la tierra?» «Hemos visto al recién nacido y a los coros de ángeles alabando al Señor.» Aleluia.
    salmo: salmo-62-2-9
  - ant: 'El ángel dijo a los pastores: «Os anuncio una gran alegría: hoy os ha nacido el Salvador del mundo.» Aleluia.'
    salmo: cantico-dn-3-57-88-56
  - ant: Hoy nos ha nacido un niño que se llamará Dios poderoso. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Hb 1, 1-2
    texto: A través de muchas etapas y de muchas maneras habló Dios en otro tiempo a nuestros antepasados por ministerio de los profetas; en estos tiempos, que son los últimos, nos ha hablado por medio de su Hijo, a quien ha constituido heredero de todas las cosas y por quien creó los mundos.
  responsorio:
  - - V
    - El Señor revela su salvación. Aleluia, aleluia.
  - - R
    - El Señor revela su salvación. Aleluia, aleluia.
  - - V
    - Los confines de la tierra la han contemplado.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor revela su salvación. Aleluia, aleluia.
  ant_benedictus: Gloria a Dios en el cielo, y en la tierra paz a los hombres que ama el Señor. Aleluia.
  preces:
    intro: 'Glorifiquemos a Cristo, Palabra eterna del Padre, engendrado antes de los siglos y nacido por nosotros en el tiempo, y aclamémoslo, diciendo:'
    preces:
    - - Cristo, Palabra eterna, que al venir al mundo anunciaste la alegría a la tierra,
      - alegra nuestros corazones con la gracia de tu visita.
    - - Salvador del mundo, que con tu nacimiento nos has revelado la fidelidad de Dios,
      - haz que nosotros seamos también fieles a las promesas de nuestro bautismo.
    - - Rey del cielo y de la tierra, que por tus ángeles anunciaste la paz a los hombres,
      - conserva nuestras vidas en tu paz.
    - - Señor, tú que viniste para ser la vid verdadera que nos diera el fruto de vida,
      - haz que permanezcamos siempre en ti y demos fruto abundante.
    respuesta: Que se goce la tierra, Señor, ante tu venida.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres y que su amor se extienda por toda la tierra, pidamos al Padre que su reino venga a nosotros:'
  oracion: Dios todopoderoso, concédenos que, al vernos envueltos en la luz nueva de tu Palabra hecha carne, hagamos resplandecer en nuestras obras la fe que haces brillar en nuestra mente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
