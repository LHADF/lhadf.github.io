  padrenuestro_intro: 'Siguiendo la enseñanza de Jesucristo, que nos ha hecho hijos de Dios, digamos juntos a nuestro Padre:'
  oracion: Dios todopoderoso y eterno, concédenos participar tan vivamente en las celebraciones de la pasión del Señor que alcancemos tu perdón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles Santo:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: En tus manos, Señor, pongo mi vida
  salmodia:
  - ant: En mi angustia te busco, Señor, y extiendo las manos sin descanso.
    salmo: salmo-76
  - ant: Si hemos muerto con Cristo, tenemos fe en que viviremos también con él.
    salmo: cantico-1s-2-1-10
  - ant: Cristo Jesús ha sido hecho por Dios para nosotros sabiduría, justicia, santificación y redención.
    salmo: salmo-96
  lectura:
    ref: Is 50, 5-7
    texto: 'El Señor me abrió el oído; yo no me resistí ni me eché atrás: ofrecí la espalda a los que me golpeaban, las mejillas a los que mesaban mi barba; no me tapé el rostro ante ultrajes ni salivazos. El Señor me ayuda, por eso no sentía los ultrajes; por eso endurecí el rostro como pedernal, sabiendo que no quedaría defraudado.'
  responsorio:
