  preces:
    intro: 'Oremos confiados a Dios Padre, que quiso que Cristo fuera la primicia de la resurrección de los hombres, y aclamémoslo, diciendo:'
    preces:
    - - Tú que por la columna de fuego iluminaste a tu pueblo en el desierto,
      - ilumina hoy con la resurrección de Cristo el día que empezamos.
    - - Tú que por la voz de Moisés adoctrinaste a tu pueblo en el Sinaí,
      - haz que Cristo, por su resurrección, sea hoy palabra de vida para nosotros.
    - - Tú que con el maná alimentaste a tu pueblo peregrino en el desierto,
      - haz que Cristo, por su resurrección, sea durante este día nuestro pan de vida.
    - - Tú que por el agua de la roca diste de beber a tu pueblo en el desierto,
      - por la resurrección de tu Hijo danos hoy parte en tu Espíritu de vida.
    respuesta: Que el Señor Jesús sea nuestra vida.
  padrenuestro_intro: 'Por Jesús hemos sido hechos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Señor Dios nuestro, que al restaurar la naturaleza humana le otorgaste una dignidad mayor que la que tuvo en sus orígenes, mantén siempre tus inefables designios de amor hacia nosotros, y conserva en quienes hemos renacido por el bautismo los dones que de tu bondad hemos recibido. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
