  preces:
    intro: 'Oremos a Dios Padre, a quien pertenece el honor y la gloria por los siglos de los siglos, y pidámosle nos conceda ir creciendo en la esperanza por la acción del Espíritu Santo; digámosle:'
    preces:
    - - Padre todopoderoso, envía tu Espíritu para que interceda por nosotros,
      - porque no sabemos pedir lo que nos conviene.
    - - Envíanos tu Espíritu, luz esplendorosa,
      - y haz que penetre hasta lo más íntimo de nuestro ser.
    - - No nos abandones, Señor, en el abismo en que nos sumergen nuestros pecados,
      - porque somos obra de tus manos.
    - - Concédenos comprensión para asistir a los débiles y frágiles en la fe,
      - no con impaciencia y resentimiento, sino con auténtica caridad.
    respuesta: Ven, Señor, en nuestra ayuda y sálvanos.
  padrenuestro_intro: 'Dirijamos ahora al Padre nuestra oración con las mismas palabras que Cristo nos enseñó:'
  oracion: Dios nuestro, que nos has abierto las puertas de la eternidad con la glorificación de tu Hijo Jesucristo y con la venida del Espíritu Santo, concédenos que, por la recepción de dones tan grandes, nuestra fe vaya más y más en aumento y nuestra entrega a ti sea cada día más completa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
