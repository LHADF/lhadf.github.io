  oracion: Señor, que ves a tu pueblo esperando con gran fe la solemnidad del nacimiento de tu Hijo, concédenos celebrar la obra tan grande de nuestra salvación con cánticos jubilosos de alabanza y con una inmensa alegría. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  salmodia:
  - ant: 'Vendrá el Señor y no tardará: iluminará lo escondido en las tinieblas y se manifestará a todos los hombres. Aleluia.'
    salmo: salmo-92
  - ant: Los montes y las colinas se abajarán. Lo torcido se enderezará y lo escabroso se igualará. Ven, Señor, no tardes. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Salvaré a Sión y mostraré mi gloria en Jerusalén. Aleluia.
    salmo: salmo-148
  lectura:
    ref: Rm 13, 11b-12
    texto: Ya es hora que despertéis del sueño, pues la salud está ahora más cerca que cuando abrazamos la fe. La noche va pasando, el día está encima; desnudémonos, pues, de las obras de las tinieblas y vistámonos de las armas de la luz.
III Domingo de Adviento «Gaudete» (A):
  inv_ant: Al Rey que viene, al Señor que se acerca, venid, adorémosle.
  himno: Ven, Señor, no tardes
  ant_benedictus: 'Habiéndose enterado Juan en la cárcel de las obras de Cristo, envió a sus discípulos a que le preguntasen: «¿Eres tú el que ha de venir o hemos de esperar a otro?»'
  preces:
    intro: 'Oremos a Dios Padre, que nos concede la gracia de esperar la revelación de nuestro Señor Jesucristo, y digámosle confiados:'
    preces:
    - - Santifica, Señor, todo nuestro ser, alma y cuerpo,
      - y guárdanos libres de culpa hasta el día de la venida de tu Hijo.
    - - Haz que durante este día caminemos en santidad
      - y llevemos una vida justa y religiosa.
    - - Haz que nos revistamos de nuestro Señor Jesucristo
      - y que nos llenemos del Espíritu Santo.
    - - Concédenos, Señor, que vivamos siempre preparados
      - para el día de la manifestación gloriosa de tu Hijo.
    respuesta: Muéstranos, Señor, tu misericordia.
  padrenuestro_intro: 'Como nos enseñó el Salvador, nos atrevemos a decir:'
III Domingo de Adviento «Gaudete» (B):
  inv_ant: El Señor está cerca, venid adorémosle.
  himno: La pena que la tierra soportaba
  ant_benedictus: Entended que el reino de Dios está ya cerca; os aseguro que no tardará.
  preces:
    intro: 'Oremos a Dios Padre, que trazó desde antiguo un plan de salvación para su pueblo, y digámosle:'
    preces:
    - - Oh Dios, que prometiste a tu pueblo un vástago que haría justicia,
      - vela por la santidad de tu Iglesia.
    - - Inclina, oh Dios, el corazón de los hombres a tu palabra
      - y afianza la santidad de tus fieles.
    - - Por tu Espíritu consérvanos en el amor,
      - para que podamos recibir la misericordia de tu Hijo que se acerca.
    - - Haz que nos mantengamos firmes, Dios de clemencia,
      - hasta el día de la manifestación de nuestro Señor Jesucristo.
    respuesta: Guarda a tu pueblo, Señor.
  padrenuestro_intro: 'Pidamos ahora con grande confianza la venida del reino de Dios, con las palabras que Cristo nos enseñó:'
