VII Domingo del Tiempo Ordinario (A):
  ant_benedictus: Dios, vuestro Padre, hace salir su sol sobre malos y buenos.
  oracion: Concédenos, Dios todopoderoso, que la constante meditación de tu doctrina nos impulse a hablar y a actuar siempre según tu voluntad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
