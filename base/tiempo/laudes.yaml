  ant_benedictus: 'Los pastores se dijeron unos a otros: «Vayamos a Belén a ver el suceso que nos ha dado a conocer el Señor.»'
  preces:
    intro: 'Ya que Dios en su misericordia nos ha enviado a Cristo, príncipe de la paz, digamos con toda confianza:'
    preces:
    - - Dios todopoderoso, Padre de nuestro Señor Jesucristo, en estos días en que celebramos tu amor que salva a los hombres,
      - recibe las alabanzas que te tributa la Iglesia.
    - - Tú que desde el principio prometiste que, por Cristo, darías tu victoria a los hombres,
      - haz que todos los pueblos sean iluminados por la luz del Evangelio.
    - - Para gloria de tu Hijo, cuyo día Abraham contempló lleno de alegría, los patriarcas esperaron, los profetas anunciaron y todos los pueblos desearon,
      - haz que el pueblo de Israel alcance la salvación.
    - - Tú que quisiste que el nacimiento de tu Hijo fuera anunciado por los espíritus celestiales y celebrado por los apóstoles, los mártires y los fieles de todos los siglos,
      - concede a la tierra aquella paz que anunciaron los ángeles.
    respuesta: Concede, Señor, la paz a todos los hombres.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres y que su amor se extienda por toda la tierra, pidamos al Padre que su reino venga a nosotros:'
  oracion: Dios todopoderoso, Dios invisible, que con la venida de tu Hijo has disipado las tinieblas del mundo, míranos con amor y ayúdanos a celebrar con nuestros cantos y alabanzas la gloria del nacimiento de tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Día VI de la Octava de la Natividad:
  inv_ant: A Cristo, que por nosotros ha nacido, venid, adorémosle.
  himno: Niño, que por darme vida
  salmodia:
  - ant: «¿A quién habéis visto, pastores? Hablad, contádnoslo, ¿quién se ha aparecido en la tierra?» «Hemos visto al recién nacido y a los coros de ángeles alabando al Señor.» Aleluia.
