    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Uno solo es vuestro maestro, Cristo el Señor, que está en los cielos.
  preces:
    intro: 'Demos gracias a Dios, nuestro Padre, que nos dio a su Hijo unigénito, Palabra hecha carne, para que vivamos de ella, e invoquémosle, diciendo:'
    preces:
    - - Concédenos escuchar con más frecuencia tu palabra en este tiempo cuaresmal,
      - para que en la gran solemnidad que se avecina nos unamos con mayor fervor a Cristo, nuestra Pascua.
    - - Que tu Espíritu Santo nos asista,
      - para que seamos testigos de tu verdad y de tu bondad ante los vacilantes y equivocados.
    - - Concédenos vivir más profundamente el misterio de Cristo,
      - para que podamos dar testimonio de él con más fuerza y claridad.
    - - En este tiempo de penitencia, Señor, renueva y purifica a tu Iglesia,
      - para que se manifieste con más claridad como signo de salvación.
    respuesta: Que la palabra de Cristo habite en nosotros con toda su riqueza.
  padrenuestro_intro: 'Porque sabemos que somos hijos de Dios, llenos de confianza nos atrevemos a decir:'
  oracion: Señor, vela con amor constante sobre tu Iglesia, edificada en la debilidad humana, y, pues sin ti la naturaleza mortal sucumbe, que tu Protección la preserve siempre del mal y la encamine por las sendas de la salvación. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la II semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Cuando vuelto hacia ti de mi pecado
  lectura:
    ref: Dt 7, 6. 8-9
    texto: El Señor, tu Dios, te eligió para que fueras, entre todos los pueblos de la tierra, el pueblo de su propiedad. Por el amor que os tiene y por mantener el juramento que había hecho a vuestros padres, os sacó de Egipto con mano fuerte y os rescató de la esclavitud, del dominio del Faraón, rey de Egipto. Así conocerás que el Señor, tu Dios, es el Dios verdadero, el Dios fiel que mantiene su alianza y su favor, por mil generaciones, con los que lo aman y guardan sus preceptos.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: El Hijo del hombre no ha venido a ser servido, sino a servir y a entregar su vida como rescate de una multitud.
  preces:
    intro: 'Demos gracias a Dios Padre, que por el Espíritu Santo ha derramado su amor en nuestros corazones, y supliquémosle, diciendo:'
    preces:
    - - Concédenos, Señor, el espíritu de fe y de acción de gracias,
      - para recibir siempre con gozo lo bueno y soportar con paciencia lo adverso.
    - - Haz que practiquemos la caridad no sólo en los acontecimientos importantes,
      - sino también en lo pequeño de nuestra vida de cada día.
    - - Ayúdanos a privarnos de lo superfluo,
      - para compartir lo nuestro con los hermanos necesitados.
    - - Concédenos llevar en nuestros cuerpos la pasión de tu Hijo,
      - tú que nos has vivificado en su cuerpo.
    respuesta: Danos, Señor, tu Espíritu Santo.
  padrenuestro_intro: 'Recitemos juntos la oración que Cristo nos enseñó y pidamos al Padre que nos libre siempre del mal:'
  oracion: Señor, haz que tu pueblo persevere siempre en el camino del bien que tú le has enseñado; protégelo en sus necesidades temporales, para que, sin angustia, pueda tender a los bienes eternos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Jueves de la II semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Pastor que con tus silbos amorosos
  lectura:
    ref: Cf. 1R 8, 51a. 52-53a
    texto: Nosotros, Señor, somos tu pueblo y tu heredad; que tus ojos estén abiertos a las súplicas de tu siervo y a la súplica de tu pueblo Israel, para escuchar todos sus clamores hacia ti. Porque tú nos separaste para ti como herencia tuya de entre todos los pueblos de la tierra.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Hijo mío, acuérdate de que ya recibiste tus bienes en la vida; Lázaro, en cambio, recibió males.
  preces:
    intro: 'Celebremos la bondad de Dios, que por Cristo se reveló como Padre nuestro, y digámosle de todo corazón:'
    preces:
    - - Concédenos vivir con toda plenitud el misterio de la Iglesia,
      - a fin de que nosotros y todos los hombres encontremos en ella un sacramento eficaz de salvación.
    - - Padre, que amas a todos los hombres, haz que cooperemos al progreso de la comunidad humana
      - y que en todo busquemos tu reino con nuestros esfuerzos.
    - - Haz que tengamos hambre y sed de justicia
      - y acudamos a nuestra fuente, que es Cristo, el cual entregó su vida para que fuéramos saciados.
    - - Perdona, Señor, todos nuestros pecados
      - y dirige nuestra vida por el camino de la sencillez y de la santidad.
    respuesta: Acuérdate, Señor, de que somos hijos tuyos.
  padrenuestro_intro: 'Porque sabemos que somos hijos de Dios, llenos de confianza nos atrevemos a decir:'
  oracion: Dios nuestro, que amas la inocencia y la devuelves a quienes la han perdido, atrae hacia ti nuestros corazones, para que, inflamados por el fuego de tu Espíritu, permanezcamos firmes en la fe y seamos diligentes para hacer el bien. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la II semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Delante de la cruz los ojos míos
  lectura:
    ref: Is 53, 11b-12
    texto: Mi siervo justificará a muchos, porque cargó sobre sí los crímenes de ellos. Le daré una multitud como parte, y tendrá como despojo una muchedumbre, porque se entregó a sí mismo a la muerte y fue contado entre los malhechores; él tomó sobre sí el pecado de las multitudes e intercedió por los pecadores.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Dará una muerte afrentosa a esos malvados y arrendará la viña a otros viñadores, que le paguen la renta a su tiempo.
  preces:
    intro: 'Acudamos a Cristo, nuestro Salvador, que nos redimió con su muerte y resurrección, y supliquémosle, diciendo:'
    preces:
    - - Tú que subiste a Jerusalén para sufrir la pasión y entrar así en la gloria,
      - conduce a tu Iglesia a la Pascua eterna.
    - - Tú que, exaltado en la cruz, quisiste ser atravesado por la lanza del soldado,
      - sana nuestras heridas.
    - - Tú que convertiste el madero de la cruz en árbol de vida,
      - haz que los renacidos en el bautismo gocen de la abundancia de los frutos de este árbol.
    - - Tú que, clavado en la cruz, perdonaste al ladrón arrepentido,
      - perdónanos también a nosotros, pecadores.
    respuesta: Señor, ten piedad de nosotros.
  padrenuestro_intro: 'Como Cristo nos enseñó, pidamos al Padre que perdone nuestros pecados, diciendo:'
  oracion: Concédenos, Dios todopoderoso, que, purificados por la penitencia cuaresmal, lleguemos totalmente convertidos a las próximas fiestas pascuales. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Sábado de la II semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Los hombros traigo cargados
  lectura:
    ref: Is 1, 16-18
    texto: «Lavaos, purificaos, apartad de mi vista vuestras malas acciones. Cesad de obrar mal, aprended a obrar bien; buscad lo que es justo, haced justicia al oprimido, defended al huérfano, proteged a la viuda. Entonces, venid, y litigaremos —dice el Señor—. Aunque vuestros pecados sean como la grana, blanquearán como la nieve; aunque sean rojos como escarlata, quedarán blancos como lana.»
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Padre mío, he pecado contra el cielo y contra ti; ya no merezco ser llamado hijo tuyo, trátame como a uno de tus jornaleros.
  preces:
    intro: 'Demos gracias siempre y en todo lugar a Cristo, nuestro Salvador, y supliquémosle, diciendo:'
    preces:
    - - Concédenos guardar sin mancha nuestros cuerpos,
      - para que el Espíritu Santo pueda habitar en ellos.
    - - Desde el comienzo del día acrecienta en nosotros el amor a nuestros hermanos
      - y el deseo de cumplir tu voluntad en todas las acciones de esta jornada.
    - - Danos hambre del alimento que perdura y da vida eterna,
      - y que tú diariamente nos proporcionas.
    - - Que interceda por nosotros tu santísima Madre, refugio de pecadores,
      - para que obtengamos el perdón de nuestros pecados.
    respuesta: Ayúdanos, Señor, con tu gracia.
  padrenuestro_intro: 'Pidamos al Padre que nos libre de todo mal, repitiendo la oración que Cristo nos enseñó:'
  oracion: Dios nuestro, que por medio de tus admirables sacramentos nos concedes participar, ya desde este mundo, de los bienes celestiales, guíanos tú mismo en el camino de la vida, para que alcancemos un día aquella luz en la que habitas con tus santos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
III Domingo de Cuaresma:
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que fuiste triturado por nuestros crímenes.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  oracion: Dios nuestro, fuente de toda bondad y misericordia, que nos otorgas un remedio para nuestros pecados por el ayuno, la oración y la limosna, recibe con agrado la confesión que te hacemos de nuestra debilidad y, ya que nos oprime el peso de nuestras culpas, levántanos con el auxilio de tu misericordia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  himno: Oh sol de salvación, oh Jesucristo
  padrenuestro_intro: 'Ya que la fuerza para no caer en la tentación nos viene de Dios, acudamos al Padre, diciendo:'
  salmodia:
  - ant: Tus mandatos, Señor, son fieles y seguros, más que la voz de aguas caudalosas.
    salmo: salmo-92
  - ant: Manantiales, bendecid al Señor, ensalzadlo con himnos por los siglos.
    salmo: cantico-dn-3-57-88-56
  - ant: Reyes y pueblos del orbe, alabad al Señor.
    salmo: salmo-148
  preces:
    intro: 'Ahora es el tiempo propicio, ahora es el día de salvación; acudamos, pues, a nuestro Redentor que nos concede estos días de perdón, y, bendiciéndole, digamos:'
    preces:
    - - Cristo, vida nuestra, tú que por el bautismo nos has sepultado místicamente contigo en la muerte, para que contigo también resucitemos,
      - concédenos andar hoy en vida nueva.
    - - Señor Jesús, tú que pasaste por el mundo haciendo el bien,
      - haz que también nosotros seamos solícitos del bien de todos los hombres.
    - - Ayúdanos, Señor, a trabajar concordes en la edificación de nuestra ciudad terrena,
      - sin olvidar nunca tu reino eterno.
    - - Tú, Señor, que eres médico de los cuerpos y de las almas,
      - sana las dolencias de nuestro espíritu para que crezcamos cada día en santidad.
    respuesta: Infúndenos, Señor, un espíritu nuevo.
  lectura:
    ref: Cf. Ne 8, 9. 10
    texto: 'Este día está consagrado al Señor vuestro Dios; no hagáis duelo ni lloréis. No estéis tristes: la alegría del Señor es vuestra fortaleza.'
III Domingo de Cuaresma (A):
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  ant_benedictus: 'Dios es espíritu: adoradlo en espíritu y en verdad'
III Domingo de Cuaresma (B):
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  ant_benedictus: «Destruid este templo —dice el Señor— y yo lo levantaré en tres días»; esto lo decía refiriéndose al templo de su propio cuerpo
III Domingo de Cuaresma (C):
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  ant_benedictus: El Señor, el Dios de vuestros padres, me ha enviado a vosotros
VIII Domingo del Tiempo Ordinario (A):
  ant_benedictus: No podéis servir a Dios y al dinero; Dios es el único Señor.
  oracion: Dirige, Señor, la marcha del mundo, según tu voluntad, por los caminos de la paz, y que tu Iglesia se regocije con la alegría de tu servicio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
VIII Domingo del Tiempo Ordinario (C):
  ant_benedictus: Un árbol bueno no puede dar frutos malos, ni un árbol malo puede dar frutos buenos.
  oracion: Dirige, Señor, la marcha del mundo, según tu voluntad, por los caminos de la paz, y que tu Iglesia se regocije con la alegría de tu servicio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
