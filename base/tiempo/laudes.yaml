  preces:
    intro: 'Oremos agradecidos a Dios, Padre de nuestro Señor Jesucristo, el Cordero inmaculado que quitó el pecado del mundo y nos comunica su vida nueva, y digámosle:'
    preces:
    - - Dios, autor de la vida, acuérdate de la muerte y resurrección del Cordero inmolado en la cruz
      - y atiende su continua intercesión por nosotros.
    - - Haz, Señor, que, tirada fuera la vieja levadura de la malicia y de la perversidad,
      - vivamos la Pascua de Cristo con panes ázimos de pureza y de verdad.
    - - Que sepamos rechazar hoy el pecado de discordia y de envidia,
      - y seamos más sensibles a las necesidades de nuestros hermanos.
    - - Concédenos vivir auténticamente el espíritu evangélico,
      - para que hoy y siempre sigamos el camino de tus mandatos.
    respuesta: Autor de la vida, vivifícanos.
  padrenuestro_intro: 'Porque deseamos que la luz de Cristo alumbre a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Dios todopoderoso, concédenos que la celebración de las fiestas de Cristo resucitado aumente en nosotros la alegría de saber que estamos salvados. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la IV semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Gloriosa aurora de este nuevo día
  salmodia:
  - ant: Elévate sobre el cielo, Dios mío. Aleluia.
    salmo: salmo-107
  - ant: El Señor hará brotar la justicia y los himnos ante todos los pueblos. Aleluia.
    salmo: cantico-is-61-10-62-5
