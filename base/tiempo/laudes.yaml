  ant_benedictus: «Si yo arrojo los demonios por el poder de Dios es señal de que ha llegado a vosotros el reino de Dios», dice el Señor.
  preces:
    intro: 'Glorifiquemos a Cristo, nuestro Señor, que resplandece como luz del mundo para que siguiéndolo no caminemos en tinieblas, sino que tengamos la luz de la vida, y digámosle:'
    preces:
    - - Cristo, amigo de los hombres, haz que sepamos progresar hoy en tu imitación,
      - para que lo que perdimos por culpa del primer Adán lo recuperemos en el segundo.
    - - Que tu palabra sea siempre luz en nuestro sendero,
      - para que, realizando siempre la verdad en el amor, hagamos crecer todas las cosas en ti.
    - - Enséñanos, Señor, a trabajar por el bien de todos los hombres,
      - para que así, por nuestra acción, la Iglesia ilumine a toda la sociedad humana.
    - - Que por nuestra sincera conversión crezcamos en tu amistad
      - y expiemos las faltas cometidas contra tu bondad y tu sabiduría.
    respuesta: Que tu palabra, Señor, sea luz para nuestros pasos.
  padrenuestro_intro: 'Porque sabemos que somos hijos de Dios, llenos de confianza nos atrevemos a decir:'
  oracion: Te pedimos, Señor, que, cuanto más se aproxima la fiesta de nuestra salvación, con tanta mayor fe nos preparemos a celebrar el misterio pascual. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la III semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Delante de la cruz los ojos míos
  lectura:
    ref: Is 53, 11b-12
    texto: Mi siervo justificará a muchos, porque cargó sobre sí los crímenes de ellos. Le daré una multitud como parte, y tendrá como despojo una muchedumbre, porque se entregó a sí mismo a la muerte y fue contado entre los malhechores; él tomó sobre sí el pecado de las multitudes e intercedió por los pecadores.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: 'Uno de los escribas se acercó a Jesús para preguntarle cuál era el primero de todos los mandamientos. Jesús le respondió: «Amarás al Señor, tu Dios, con todo tu corazón.»'
  preces:
    intro: 'Demos gracias a Cristo, el Señor, que al morir en cruz nos dio la vida, y digámosle con fe:'
    preces:
    - - Maestro y Salvador nuestro, tú que nos revelaste con tu palabra el designio de Dios y nos renovaste con tu gloriosa pasión,
      - no permitas que nuestros días transcurran entre vicios y pecados.
    - - Que sepamos, Señor, mortificarnos hoy al tomar los manjares del cuerpo,
      - para ayudar con nuestra abstinencia a los hambrientos y necesitados.
    - - Que vivamos santamente este día de penitencia cuaresmal
      - y lo consagremos a tu servicio mediante obras de misericordia.
    - - Sana, Señor, nuestras voluntades rebeldes
      - y llénanos de tu gracia y de tus dones.
    respuesta: Tú que por nosotros moriste, escúchanos, Señor.
  padrenuestro_intro: 'Que el Espíritu que habita en nosotros y nos une en su amor nos ayude a decir:'
  oracion: Infunde, Señor, tu gracia en nuestros corazones, para que sepamos refrenar nuestros excesos mundanos y seguir fielmente las inspiraciones que nos vienen de ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Sábado de la III semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: Los hombros traigo cargados
  lectura:
    ref: Is 1, 16-18
    texto: «Lavaos, purificaos, apartad de mi vista vuestras malas acciones. Cesad de obrar mal, aprended a obrar bien; buscad lo que es justo, haced justicia al oprimido, defended al huérfano, proteged a la viuda. Entonces, venid, y litigaremos —dice el Señor—. Aunque vuestros pecados sean como la grana, blanquearán como la nieve; aunque sean rojos como escarlata, quedarán blancos como lana.»
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: 'El publicano, quedándose a cierta distancia, no se atrevía ni siquiera a levantar los ojos al cielo; y se daba golpes de pecho, mientras decía: «¡Dios mío, ten compasión de mí, que soy un pecador!»'
  preces:
    intro: 'Glorifiquemos a Cristo, que para hacer de nosotros creaturas nuevas ha instituido el baño del bautismo y nos alimenta con su palabra y su carne, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesús, tú que eres manso y humilde de corazón, danos entrañas de misericordia, bondad y humildad
      - y danos comprensión para con todos.
    - - Que sepamos ayudar a los necesitados y consolar a los que sufren,
      - para imitarte a ti, el buen Samaritano.
    - - Que María, la Virgen Madre, interceda por las vírgenes que se han consagrado a tu servicio,
      - para que vivan su virginidad con un grande amor hacia ti, en bien de la Iglesia.
    - - Concédenos la abundancia de tu misericordia
      - y perdona la multitud de nuestros pecados y el castigo que por ellos merecemos.
    respuesta: Renuévanos con tu gracia, Señor.
  padrenuestro_intro: 'Digamos juntos la oración que Cristo nos enseñó y pidamos al Padre que nos libre del mal:'
  oracion: Señor, danos la gracia de celebrar esta Cuaresma con alegría y de penetrar a fondo el verdadero sentido del misterio pascual, para que podamos alcanzar plenamente su eficacia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
IV Domingo de Cuaresma «Lætare»:
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que fuiste triturado por nuestros crímenes.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  oracion: Señor Dios, que por tu Palabra hecha carne has reconciliado contigo admirablemente al género humano, haz que el pueblo cristiano se apreste a celebrar las próximas fiestas pascuales con una fe viva y con una entrega generosa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
  himno: Oh sol de salvación, oh Jesucristo
  padrenuestro_intro: 'Invoquemos a Dios Padre con la oración que nos enseñó Jesús:'
  salmodia:
  - ant: Tú eres mi Dios, te doy gracias; Dios mío, yo te ensalzo.
    salmo: salmo-117
  - ant: Capaz eres, Señor, de liberarnos de la mano del poderoso; líbranos, Señor, Dios nuestro.
    salmo: cantico-dn-3-52-57
  - ant: Alabad al Señor por sus obras mangníficas.
    salmo: salmo-150
  preces:
    intro: 'Glorifiquemos a Dios, cuya bondad es infinita, y elevemos a él nuestra oración por medio de Jesucristo, que está siempre vivo para interceder en favor nuestro; digámosle:'
    preces:
    - - Dios de misericordia, haz que hoy nos entreguemos generosamente a las obras de amor al prójimo,
      - para que tu misericordia, a través de nosotros, llegue a todos los hombres.
    - - Tú que en el arca salvaste a Noé de las aguas del diluvio,
      - salva por el agua del bautismo a los catecúmenos.
    - - Concédenos vivir no sólo de pan,
      - sino de toda palabra que sale de tu boca.
    - - Haz que, con tu ayuda, venzamos toda disensión
      - y podamos gozarnos en el don de tu paz y de tu amor.
    respuesta: Enciende, Señor, en nosotros la llama de tu amor.
  lectura:
    ref: Cf. Ne 8, 9. 10
    texto: 'Este día está consagrado al Señor vuestro Dios; no hagáis duelo ni lloréis. No estéis tristes: la alegría del Señor es vuestra fortaleza.'
IV Domingo de Cuaresma «Lætare» (A):
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  ant_benedictus: Nadie, a no ser Cristo, el Hijo de Dios, ha dado la vista a un ciego de nacimiento
IV Domingo de Cuaresma «Lætare» (B):
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  ant_benedictus: Con inmenso amor, Dios, aun cuando estábamos muertos por nuestros pecados, nos ha vivificado con Cristo
IV Domingo de Cuaresma «Lætare» (C):
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  ant_benedictus: Padre, he pecado contra ti; ya no merezco ser hijo tuyo
Lunes de la IV semana de Cuaresma:
  inv_ant: 'Ojalá escuchéis hoy la voz del Señor: «No endurezcáis vuestro corazón.»'
  himno: ¡Cuántas veces, Señor, me habéis llamado
  lectura:
    ref: Ex 19, 4-6a
    texto: Vosotros habéis visto cómo os saqué sobre alas de águila y os traje hacia mí; ahora pues, si queréis obedecerme y guardar mi alianza, seréis mi especial propiedad entre todos los pueblos, pues mía es toda la tierra. Seréis para mí un reino de sacerdotes y una nación santa.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: Había un funcionario de la corte que tenía un hijo enfermo en Cafarnaúm; y, habiéndose enterado de que Jesús había vuelto a Galilea, le pidió que bajase a curar a su hijo.
  preces:
    intro: 'Alabemos a Dios, nuestro Padre, que nos concede ofrecerle el sacrificio de alabanza cuaresmal, y supliquémosle, diciendo:'
    preces:
    - - Dios todopoderoso y compasivo, concédenos el espíritu de oración y de penitencia,
      - y danos un verdadero deseo de amarte a ti y a nuestros hermanos.
    - - Concédenos ser constructores de tu reino, para que todas las cosas tengan a Cristo por cabeza
      - y abunde la justicia y la paz en toda la tierra.
    - - Haz que sepamos descubrir la bondad y hermosura de tu creación,
      - para que su belleza se haga alabanza en nuestros labios.
    - - Perdónanos por haber ignorado la presencia de Cristo en los pobres, los sencillos y los marginados,
      - y por no haber atendido a tu Hijo en estos hermanos nuestros.
    respuesta: Ilumínanos, Señor, con tu palabra.
  padrenuestro_intro: 'Impulsados por el Espíritu que nos hace clamar: «¡Padre!», invoquemos a nuestro Dios:'
  oracion: Dios nuestro, que renuevas el mundo por medio de sacramentos divinos, haz que tu Iglesia progrese por la celebración de estos sacramentos de vida eterna y no permitas que le falten nunca los auxilios necesarios para su vida terrena. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Martes de la IV semana de Cuaresma:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Edificaste una torre
  lectura:
    ref: Jl 2, 12-13
    texto: Convertíos a mí de todo corazón con ayuno, con llanto, con luto. Rasgad vuestros corazones y no vuestras vestiduras, y convertíos al Señor, vuestro Dios, porque es compasivo y misericordioso, lento a la cólera y rico en piedad; y se arrepiente de las amenazas.
  responsorio:
  - - V
    - Él me librará de la red del cazador.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Me cubrirá con su plumaje.
  - - R
    - Él me librará de la red del cazador.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Él me librará de la red del cazador.
  ant_benedictus: 'El que me curó me dijo: «Toma tu camilla y vete en paz.»'
  preces:
    intro: 'Demos gracias a Dios, nuestro Padre, que nos dio a su Hijo unigénito, Palabra hecha carne, para que vivamos de ella, e invoquémosle, diciendo:'
    preces:
    - - Concédenos escuchar con más frecuencia tu palabra en este tiempo cuaresmal,
      - para que en la gran solemnidad que se avecina nos unamos con mayor fervor a Cristo, nuestra Pascua.
    - - Que tu Espíritu Santo nos asista,
      - para que seamos testigos de tu verdad y de tu bondad ante los vacilantes y equivocados.
    - - Concédenos vivir más profundamente el misterio de Cristo,
      - para que podamos dar testimonio de él con más fuerza y claridad.
    - - En este tiempo de penitencia, Señor, renueva y purifica a tu Iglesia,
      - para que se manifieste con más claridad como signo de salvación.
    respuesta: Que la palabra de Cristo habite en nosotros con toda su riqueza.
  padrenuestro_intro: 'Porque sabemos que somos hijos de Dios, llenos de confianza nos atrevemos a decir:'
  oracion: Señor, que las saludables prácticas de la Cuaresma dispongan los corazones de tus hijos, para que celebren dignamente el misterio pascual y extiendan por todas partes el anuncio de tu salvación. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
