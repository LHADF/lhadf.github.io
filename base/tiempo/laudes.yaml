  preces:
    intro: 'Oremos, hermanos, a Cristo el Señor, luz que alumbra a todo hombre, y digámosle con gozo:'
    preces:
    - - Que la luz de tu presencia disipe, Señor, nuestras tinieblas
      - y nos haga dignos de recibir tus dones.
