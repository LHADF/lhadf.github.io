  ant_benedictus: Del cielo viene el Señor excelso y en su mano trae la potestad y el imperio.
  preces:
    intro: 'El Señor Jesucristo, luz de luz e Hijo de Dios vivo, nos arrancará de nuestras tinieblas para que podamos contemplar su gloria; acudamos, pues, a él y digámosle confiadamente:'
    preces:
    - - Oh Luz indestructible que vienes a iluminar nuestras tinieblas,
      - despierta nuestra fe aletargada.
    - - Haz que andemos con seguridad durante el día,
      - guiados por el resplandor de tu claridad.
    - - Enséñanos a tener la verdadera bondad,
      - y haz que ella sirva para iluminar a los hombres.
    - - Ven a crear la nueva tierra que anhelamos,
      - en la que habite la justicia y la paz.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Digamos a nuestro Padre, con toda confianza:'
  oracion: Escucha, Señor, nuestras plegarias e ilumina las tinieblas de nuestro espíritu con la venida de tu Hijo. Que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
