    salmo: salmo-149
  lectura:
    ref: Is 9, 6
    texto: 'Un niño nos ha nacido, un hijo se nos ha dado; lleva sobre sus hombros el señorío y será llamado: «Consejero admirable», «Dios poderoso», «Padre sempiterno» y «Príncipe de la paz».'
  responsorio:
  - - V
    - El Señor revela su salvación. Aleluia, aleluia.
  - - R
    - El Señor revela su salvación. Aleluia, aleluia.
  - - V
    - Los confines de la tierra la han contemplado.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor revela su salvación. Aleluia, aleluia.
  ant_benedictus: 'Al nacer el Señor, los ángeles cantaban, diciendo: «La salvación es de nuestro Dios, que está sentado en el trono, y del Cordero».'
  preces:
    intro: 'Oremos a Cristo, el Señor, en quien el Padre ha querido renovar todas las cosas, y digámosle:'
    preces:
    - - Hijo de Dios, que en el principio estabas junto al Padre y, al llegar el tiempo señalado por él, quisiste nacer como hombre,
      - haz que todos nos amemos como hermanos.
    - - Tú que te has hecho pobre para que, con tu pobreza, nosotros nos hagamos ricos y te anonadaste para que, con tu humillación, nosotros resucitáramos y llegáramos a participar de tu gloria,
      - haz que seamos anunciadores fieles de tu Evangelio.
    - - Tú que nos has iluminado cuando vivíamos aún en tinieblas y en sombra de muerte,
      - concédenos también la santidad, la justicia y la paz.
    - - Otórganos un corazón recto y sincero, que atienda siempre a tu palabra
      - y lleve a plenitud en nosotros y en todos los hombres tu plan de salvación.
    respuesta: Hijo amado de Dios, escucha nuestra oración.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres y que su amor se extienda por toda la tierra, pidamos al Padre que su reino venga a nosotros:'
  oracion: Concédenos, Dios todopoderoso, que el nacimiento de tu Hijo en nuestra carne mortal nos libre de la antigua servidumbre del pecado que pesa aún sobre nosotros. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
