    intro: 'Adoremos a Cristo, que al entrar en Jerusalén fue aclamado por las multitudes como rey y mesías; acojámosle también nosotros con gozo, diciendo:'
    preces:
    - - Hosanna a ti, Hijo de David y Rey eterno;
      - hosanna a ti, vencedor de la muerte y del mal.
    - - Tú que subiste a Jerusalén para sufrir la pasión y entrar así en la gloria,
      - conduce a tu Iglesia a la Pascua eterna.
    - - Tú que convertiste el madero de la cruz en árbol de vida,
      - haz que los renacidos en el bautismo gocen de la abundancia de los frutos de este árbol.
    - - Salvador nuestro, que viniste a salvar a los pecadores,
      - conduce a tu reino a los que en ti creen, esperan y te aman.
    respuesta: Bendito el que viene en nombre del Señor.
  lectura:
    ref: Za 9, 9
    texto: Alégrate, hija de Sión; canta, hija de Jerusalén. Mira a tu Rey que viene a ti, justo y victorioso; modesto y cabalgando en un asno, en un pollino de borrica.
  ant_benedictus: 'Aclamemos con palmas de victoria al Señor que viene, y salgamos a su encuentro con himnos y cantos, dándole gloria y diciendo: «Bendito eres, Señor.»'
Lunes Santo:
  inv_ant: A Cristo, el Señor, que por nosotros fue tentado y por nosotros murió, venid, adorémosle.
  himno: Dieron muerte al Heredero
  salmodia:
  - ant: 'Exclamó Jesús: «Siento en mi alma angustias de muerte; aguardad aquí y velad conmigo.»'
    salmo: salmo-41
  - ant: Ahora viene el juicio de este mundo; ahora el señor de este mundo va a ser arrojado fuera.
    salmo: cantico-sir-36-1-7-13-16
  - ant: Jesús, caudillo y consumador de la fe, sufrió con toda constancia la cruz, pasando por encima de su ignominia; y está sentado a la diestra del trono de Dios.
    salmo: salmo-18-a
  lectura:
    ref: Jr 11, 19-20
    texto: 'Yo como cordero manso, llevado al matadero, no sabía los planes homicidas que contra mí planeaban: «Talemos el árbol en su lozanía, arranquémoslo de la tierra de los vivos, que su nombre no se pronuncie más.» Pero tú, Señor de los ejércitos, juzgas rectamente, escudriñas las entrañas y el corazón; veré tu venganza contra ellos, porque a ti he encomendado mi causa.'
  responsorio:
