  padrenuestro_intro: 'Porque deseamos que la luz de Cristo alumbre a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Dios omnipotente y misericordioso, te pedimos que nos envíes al Espíritu Santo para que habite en nosotros y nos transforme en templos de su gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
