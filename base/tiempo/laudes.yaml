  - - V
    - Gloria al Padre,y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  ant_benedictus: Tendría aún muchas cosas que deciros, pero no estáis ahora en disposición de entenderlas; cuando venga el Espíritu de verdad, os conducirá a la verdad completa. Aleluia.
  preces:
    intro: 'Dirijámonos a Dios, que quiso manifestar a Jesús resucitado a los apóstoles, y digámosle suplicantes:'
    preces:
    - - Señor, fuente de toda luz, te aclamamos con acción de gracias en esta mañana, porque nos has llamado a participar de tu luz admirable
      - y nos has querido dar la salvación.
    - - Haz, Señor, que la fuerza del Espíritu Santo nos purifique y nos fortalezca,
      - para que con nuestro trabajo hagamos más humana la vida de los hombres.
    - - Haz que nos entreguemos de tal modo al servicio de nuestros hermanos,
      - que logremos hacer de la familia humana una ofrenda agradable a tus ojos.
    - - Llénanos, desde el principio de este nuevo día, de tu misericordia,
      - para que en toda nuestra jornada nos gocemos en tu alabanza.
    respuesta: Ilumínanos, Señor, con la claridad de tu Cristo.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Concédenos, Señor, que, así como ahora celebramos en la fe la gloriosa resurrección de tu Hijo Jesucristo, así también merezcamos regocijarnos con todos los santos, cuando vuelva él triunfalmente al fin de los tiempos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Ascensión del Señor:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: El agua pura, don de la mañana
  salmodia:
  - ant: Yo soy la vid, vosotros sois los sarmientos. Aleluia.
    salmo: salmo-79
  - ant: Sacaréis aguas con gozo de las fuentes de la salvación. Aleluia.
    salmo: cantico-is-12-1-6
  - ant: El Señor nos alimentó con flor de harina. Aleluia.
    salmo: salmo-80
  lectura:
    ref: Rm 8, 10-11
    texto: Si Cristo está en vosotros, aunque vuestro cuerpo haya muerto por causa del pecado, el espíritu tiene vida por la justificación. Y si el Espíritu de aquel que resucitó a Jesús de entre los muertos habita en vosotros, el mismo que resucitó a Cristo Jesús de entre los muertos vivificará también vuestros cuerpos mortales por obra de su Espíritu que habita en vosotros.
  responsorio:
  - - V
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - V
    - El que por nosotros colgó del madero.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre,y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  ant_benedictus: «Un poco de tiempo y no me veréis —dice el Señor—; todavía otro poco y me volveréis a ver, porque voy al Padre.» Aleluia.
  preces:
    intro: 'Oremos confiados a Dios Padre, que quiso que Cristo fuera la primicia de la resurrección de los hombres, y aclamémoslo, diciendo:'
    preces:
    - - Tú que por la columna de fuego iluminaste a tu pueblo en el desierto,
      - ilumina hoy con la resurrección de Cristo el día que empezamos.
    - - Tú que por la voz de Moisés adoctrinaste a tu pueblo en el Sinaí,
      - haz que Cristo, por su resurrección, sea hoy palabra de vida para nosotros.
    - - Tú que con el maná alimentaste a tu pueblo peregrino en el desierto,
      - haz que Cristo, por su resurrección, sea durante este día nuestro pan de vida.
    - - Tú que por el agua de la roca diste de beber a tu pueblo en el desierto,
      - por la resurrección de tu Hijo danos hoy parte en tu Espíritu de vida.
    respuesta: Que el Señor Jesús sea nuestra vida.
  padrenuestro_intro: 'Por Jesús hemos sido hechos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Señor, Dios nuestro, que has otorgado a tu pueblo el don de la redención, concédenos vivir eternamente la alegría de la resurrección de tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Viernes de la VI semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Tu cuerpo es lazo de amores
  salmodia:
  - ant: Confía, hijo, tus pecados son perdonados. Aleluia.
    salmo: salmo-50
  - ant: Tú, Señor, has salido con Cristo a salvar a tu pueblo. Aleluia.
    salmo: cantico-ha-3-2-4-13a-15-19
  - ant: Alaba a tu Dios, Sión, que ha puesto paz en tus fronteras. Aleluia.
    salmo: salmo-147
  lectura:
    ref: Hch 5, 30-32
    texto: El Dios de nuestros padres resucitó a Jesús, a quien vosotros matasteis colgándole de un madero. La diestra de Dios lo exaltó haciéndolo jefe y salvador, para otorgar a Israel la conversión, el perdón de los pecados. Testigos de esto somos nosotros y el Espíritu Santo, que Dios da a los que le obedecen.
  responsorio:
  - - V
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - V
    - El que por nosotros colgó del madero.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre,y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  ant_benedictus: Vemos a Jesús, coronado de gloria y de honor por haber padecido la muerte. Aleluia.
  preces:
    intro: 'Dirijamos nuestra oración a Dios Padre, que por el Espíritu resucitó a Jesús de entre los muertos y vivificará también nuestros cuerpos mortales; digámosle:'
    preces:
    - - Padre santo, tú que al resucitar a tu Hijo de entre los muertos manifestaste que habías aceptado su sacrificio,
      - acepta también la ofrenda de nuestro día y condúcenos a la plenitud de la vida.
    - - Bendice, Señor, las acciones de nuestro día
      - y ayúdanos a buscar en ellas tu gloria y el bien de nuestros hermanos.
    - - Que el trabajo de hoy sirva para la edificación de un mundo nuevo
      - y nos conduzca también a tu reino eterno.
    - - Te pedimos, Señor, que nos hagas ser siempre solícitos del bien de los hombres
      - y que nos ayudes a amarnos mutuamente.
    respuesta: Vivifícanos, Señor, con tu Espíritu Santo.
  padrenuestro_intro: 'Dirijamos ahora al Padre nuestra oración con las mismas palabras que Cristo nos enseñó:'
  oracion: Escucha, Señor, nuestra oración y haz que mediante la predicación del Evangelio llegue a ser realidad en todo el mundo la salvación inaugurada en la glorificación de tu Hijo, y que todos los hombres alcancen la adopción filial que él anunció con su palabra de verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Sábado de la VI semana de Pascua:
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  himno: Velaron las estrellas el sueño de su muerte
  salmodia:
  - ant: Tus acciones, Señor, son mi alegría, y mi júbilo las obras de tus manos. Aleluia.
    salmo: salmo-91
  - ant: El nos hace morir y él nos da la vida; él nos hirió y él nos vendará. Aleluia.
    salmo: cantico-dt-32-1-12
  - ant: Coronaste de gloria y dignidad a tu Cristo. Aleluia.
    salmo: salmo-8
  lectura:
    ref: Rm 14, 7-9
    texto: Ninguno de nosotros vive para sí y ninguno muere para sí. Que si vivimos, vivimos para el Señor; y si morimos, para el Señor morimos. En fin, que tanto en vida como en muerte somos del Señor. Para esto murió Cristo y retornó a la vida, para ser Señor de vivos y muertos.
  responsorio:
  - - V
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  - - V
    - El que por nosotros colgó del madero.
  - - R
    - Aleluia. Aleluia.
  - - V
    - Gloria al Padre,y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor ha resucitado del sepulcro. Aleluia. Aleluia.
  ant_benedictus: 'Yo os lo aseguro: cuanto pidáis al Padre en mi nombre os lo concederá. Aleluia.'
  preces:
    intro: 'Oremos a Cristo, que nos ha manifestado la vida eterna, y digámosle confiados:'
    preces:
    - - Pastor eterno, contempla con amor a tu pueblo, que se levanta ahora del descanso,
      - y aliméntalo durante este día con tu palabra y tu eucaristía.
    - - No permitas que seamos arrebatados por el lobo que devora o entregados por el mercenario que huye,
      - sino haz que escuchemos siempre tu voz de buen pastor.
    - - Tú que actúas siempre juntamente con los ministros de tu Evangelio y confirmas su palabra con tu gracia,
      - haz que durante este día proclamemos tu resurrección con nuestras palabras y con nuestra vida.
    - - Sé, Señor, tú mismo nuestro gozo, el gozo que nadie puede arrebatarnos,
      - y haz que, alejados de toda tristeza, fruto del pecado, tengamos hambre de poseer tu vida eterna.
    respuesta: Que tu resurrección, Señor, nos haga crecer en gracia.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Mueve, Señor, nuestros corazones para que se adhieran siempre a obrar el bien; que, tendiendo sin desfallecer hacia lo mejor, alcancemos vivir también en la eternidad los bienes del misterio pascual. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
