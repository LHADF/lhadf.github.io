  himno: Estaba al alba María
  padrenuestro_intro: 'Dirijámonos ahora al Padre con las palabras que el Espíritu del Señor resucitado pone en nuestra boca:'
  inv_ant: Verdaderamente ha resucitado el Señor. Aleluia.
  salmodia:
  - ant: No he de morir, viviré para contar las hazañas del Señor. Aleluia.
    salmo: salmo-117
  - ant: Bendito tu nombre, santo y glorioso. Aleluia.
    salmo: cantico-dn-3-52-57
  - ant: Dad gloria a nuestro Dios, él es la Roca, sus obras son perfectas, sus caminos son justos. Aleluia.
    salmo: salmo-150
  preces:
    intro: 'Invoquemos a Dios, Padre todopoderoso, que resucitó a Jesús, nuestro jefe y salvador, y aclamémoslo, diciendo:'
    preces:
    - - Padre santo, que hiciste pasar a tu Hijo amado de las tinieblas de la muerte a la luz de tu gloria,
      - haz que podamos llegar también nosotros a tu luz admirable.
    - - Tú que nos has salvado por la fe,
      - haz que vivamos hoy según la fe que profesamos en nuestro bautismo.
    - - Tú que quieres que busquemos las cosas de arriba, donde está Cristo sentado a tu derecha,
      - líbranos de la seducción del pecado.
    - - Haz que nuestra vida, oculta en ti con Cristo, brille en el mundo,
      - para que aparezcan los cielos nuevos y la tierra nueva.
    respuesta: Ilumínanos, Señor, con la luz de Cristo.
  lectura:
    ref: Hch 10, 40-43
    texto: Dios resucitó a Jesús al tercer día e hizo que se apareciese no a todo el pueblo, sino a nosotros, que somos los testigos elegidos de antemano por Dios. Nosotros hemos comido y bebido con él, después que Dios lo resucitó de entre los muertos. Y él nos mandó predicar al pueblo y atestiguar que ha sido constituido por Dios juez de vivos y muertos. De él hablan todos los profetas y aseguran que cuantos tengan fe en él recibirán por su nombre el perdón de sus pecados.
  ant_benedictus: Yo soy el Pastor de las ovejas; yo soy el camino, la verdad y la vida; yo soy el buen Pastor, y conozco a mis ovejas y ellas me conocen a mí. Aleluia.
