  ant_benedictus: Yo soy el buen Pastor, que apaciento a mis ovejas y doy mi vida por ellas. Aleluia.
  preces:
    intro: 'Oremos a Dios Padre todopoderoso, glorificado por la muerte y resurrección de Cristo, y digámosle confiados:'
    preces:
    - - Padre, fuente de toda luz, que has querido iluminar el mundo con la gloria de Cristo resucitado,
      - ilumina, desde el principio de este día, nuestras almas con la luz de la fe.
    - - Tú que por medio de tu Hijo, resucitado de entre los muertos, has abierto a los hombres las puertas de la salvación,
      - haz que, a través de los trabajos de este día, se acreciente nuestra esperanza.
    - - Tú que por medio de tu Hijo resucitado has derramado sobre el mundo tu Espíritu Santo,
      - enciende nuestros corazones con el fuego de este mismo Espíritu.
    - - Tú que para librarnos entregaste a tu Hijo a la muerte,
      - haz que él sea hoy para nosotros salvación y redención.
    respuesta: Ilumina, Señor, nuestras mentes.
  padrenuestro_intro: 'Terminemos nuestra oración con la plegaria que Cristo nos enseñó:'
  oracion: Oh Dios, que por medio de la humillación de tu Hijo levantaste a la humanidad caída, conserva a tus fieles en continua alegría y concede los gozos del cielo a quienes has librado de la esclavitud del pecado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
