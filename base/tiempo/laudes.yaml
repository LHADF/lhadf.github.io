  ant_benedictus: Tened por cierto que ningún profeta es bien recibido en su patria.
  preces:
    intro: 'Bendigamos a Jesús, nuestro Salvador, que por su muerte nos ha abierto el camino de salvación, y digámosle confiados:'
    preces:
    - - Señor de misericordia, que en el bautismo nos diste una vida nueva,
      - te pedimos que nos hagas cada día más conformes a ti.
    - - Enséñanos, Señor, a ser hoy alegría para los que sufren
      - y haz que sepamos servirte en cada uno de los necesitados.
    - - Que procuremos, Señor, hacer lo bueno, lo recto y lo verdadero ante ti
      - y que busquemos tu rostro con sinceridad de corazón.
    - - Perdona, Señor, las faltas que hemos cometido contra la unidad de tu familia
      - y haz que tengamos un solo corazón y un solo espíritu.
    respuesta: Danos caminar por tus senderos, Señor.
  padrenuestro_intro: 'Dirijámonos a Dios con la oración que Cristo nos enseñó:'
  oracion: Señor, purifica y protege siempre a tu Iglesia con tu constante misericordia y, ya que sin tu auxilio no puede vivir segura, dirígela siempre con tu protección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
