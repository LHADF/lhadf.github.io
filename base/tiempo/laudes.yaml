  preces:
    intro: 'Dando gracias al Padre, porque el Espíritu Santo da testimonio a nuestro espíritu de que somos hijos de Dios, digamos confiados:'
    preces:
    - - Señor, fuente de toda paciencia y consuelo, concédenos estar de acuerdo entre nosotros, como es propio de cristianos,
      - para que, unánimes, a una voz, te alabemos a ti, Padre de nuestro Señor Jesucristo.
    - - Haz que nos esforcemos por complacer y servir a nuestro prójimo,
      - para que realicemos el bien en favor de nuestros hermanos y los edifiquemos con nuestro ejemplo.
    - - No permitas que nos seduzca el espíritu del mundo, que está bajo el influjo del maligno,
      - y haz que seamos siempre dóciles al Espíritu que procede de ti.
    - - Tú que penetras el corazón del hombre,
      - guíanos por las sendas de la sinceridad y de la verdad.
    respuesta: Padre nuestro, escucha la voz de tus hijos.
  padrenuestro_intro: 'Concluyamos nuestra oración, diciendo juntos las palabras de Jesús, nuestro maestro:'
  oracion: Dios misericordioso, concede a tu Iglesia, congregada por el Espíritu Santo, que se entregue plenamente a ti y que viva siempre unificada por el amor, según tú se lo has mandado. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
