  ant_benedictus: Trabajad por conseguir no el alimento perecedero, sino el alimento que permanece y da vida eterna. Aleluia.
  preces:
    intro: 'Glorifiquemos a Cristo, a quien el Padre ha enaltecido dándole en herencia todas las naciones, y digámosle suplicantes:'
    preces:
    - - Señor Jesucristo, que en tu victoria destruiste el poder del abismo, venciendo la muerte y el pecado,
      - haz que también nosotros venzamos hoy el pecado.
    - - Tú que alejaste de nosotros la muerte y nos has dado nueva vida,
      - concédenos andar hoy por la senda de esta vida nueva.
    - - Tú que diste vida a los muertos, haciendo pasar a la humanidad entera de la muerte a la vida,
      - concede el don de la vida eterna a cuantos se relacionarán hoy con nosotros.
    - - Tú que llenaste de confusión a los que hacían guardia ante tu sepulcro y alegraste a los discípulos con tus apariciones,
      - llena de gozo a cuantos te sirven.
    respuesta: Por tu victoria, sálvanos, Señor.
  padrenuestro_intro: 'Porque deseamos que la luz de Cristo alumbre a todos los hombres, pidamos al Padre que su reino llegue a nosotros:'
  oracion: Señor Dios, que muestras la luz de tu verdad a los que andan extraviados, para que puedan volver al camino recto, concede a todos los cristianos que se aparten de todo lo que sea indigno de ese nombre que llevan, y que cumplan lo que ese nombre significa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
