  ant_benedictus: «Consolad, consolad a mi pueblo», dice el Señor, vuestro Dios.
  preces:
    intro: 'Cristo, Palabra de Dios, ha querido acampar entre nosotros para que contemplemos su gloria; alegres, pues, por la esperanza, digamos:'
    preces:
    - - Príncipe de la justicia y de la rectitud,
      - haz justicia a los pobres y desamparados.
    - - Rey de la paz, que de las espadas forjas arados y de las lanzas podaderas,
      - convierte nuestras envidias en amor y nuestra hambre de venganza en deseos de perdón.
    - - Tú, que no juzgas por apariencias,
      - discierne quienes son los que realmente te pertenecen.
    - - Cuando vengas en una nube con gran poder y gloria,
      - haz que nos podamos mantener en pie delante de ti.
    respuesta: Quédate con nosotros, Señor.
  padrenuestro_intro: 'Pidamos a Dios que su reino se haga cada día más visible entre nosotros:'
  oracion: Concédenos, Dios todopoderoso, que la ya cercana solemnidad del nacimiento de tu Hijo nos depare los auxilios que necesitamos en esta vida y nos alcance el premio de la eterna felicidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
