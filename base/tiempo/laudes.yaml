    intro: 'Bendigamos a Cristo, el Señor, por quien tenemos acceso al Padre en el Espíritu Santo, y supliquémosle, diciendo:'
    preces:
    - - Envíanos tu Espíritu, el huésped deseado de las almas,
      - y haz que nunca lo contristemos.
    - - Tú que resucitaste de entre los muertos y estás sentado a la derecha de Dios,
      - intercede siempre por nosotros ante el Padre.
    - - Haz que el Espíritu nos mantenga unidos a ti,
      - para que ni la tribulación ni la persecución ni los peligros nos separen nunca de tu amor.
    - - Enséñanos a amarnos mutuamente,
      - como tú nos amaste para gloria de Dios.
    respuesta: Escúchanos, Señor Jesús.
  padrenuestro_intro: 'Llenos de fe, invoquemos juntos al Padre, repitiendo la oración que Cristo nos enseñó:'
  oracion: Tu Espíritu, Señor, infunda en nosotros la fuerza de sus dones, para que nuestros pensamientos te sean gratos y nuestra voluntad esté siempre sometida a la tuya. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
