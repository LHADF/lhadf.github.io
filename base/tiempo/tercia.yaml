# Propio del tiempo de Tercia: por feria; solo lo que cambia respecto del salterio. «ant»: antífona propia de la hora para los tres salmos.
I Domingo de Adviento (A):
  himno: Oh Santo Espíritu, que con el Padre
  ant: Los profetas anunciaron que el Salvador nacería de María Virgen.
  lectura:
    ref: Rm 13, 13-14a
    texto: Andemos como en pleno día, con dignidad. No andemos en comilonas y borracheras, ni en deshonestidad ni lujuria, ni en riñas ni envidias; sino revestíos de Jesucristo, el Señor.
  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Señor, despierta en tus fieles el deseo de prepararse a la venida de Cristo por la práctica de las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino celestial. Por Cristo nuestro Señor.
