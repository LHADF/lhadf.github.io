  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
XXXI Domingo del Tiempo Ordinario (C):
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
XXXII Domingo del Tiempo Ordinario (A):
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por Cristo nuestro Señor.
XXXII Domingo del Tiempo Ordinario (B):
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por Cristo nuestro Señor.
XXXII Domingo del Tiempo Ordinario (C):
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por Cristo nuestro Señor.
XXXIII Domingo del Tiempo Ordinario (A):
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por Cristo nuestro Señor.
XXXIII Domingo del Tiempo Ordinario (B):
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por Cristo nuestro Señor.
XXXIII Domingo del Tiempo Ordinario (C):
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por Cristo nuestro Señor.
