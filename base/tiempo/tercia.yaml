XXV Domingo del Tiempo Ordinario (A):
  oracion: Oh Dios, has hecho del amor a ti y a los hermanos la plenitud de la ley; concédenos cumplir tus mandamientos y llegar así a la vida eterna. Por Cristo nuestro Señor.
