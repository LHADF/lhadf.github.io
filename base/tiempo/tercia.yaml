  - - R
    - Y no abría su boca.
  oracion: Dios todopoderoso, mira la fragilidad de nuestra naturaleza y, con la fuerza de la pasión de tu Hijo, levanta nuestra esperanza. Por Cristo nuestro Señor.
Martes Santo:
  himno: Amigo de los hombres, Jesucristo
