  oracion: Oh Dios, que has preparado bienes invisibles para los que te aman, infunde el amor de tu nombre en nuestros corazones, para que, amándote en todo y sobre todas las cosas, consigamos tus promesas que superan todo deseo. Por Cristo nuestro Señor.
