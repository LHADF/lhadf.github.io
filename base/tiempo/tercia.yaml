  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor Dios, que por tu Palabra hecha carne has reconciliado contigo admirablemente al género humano, haz que el pueblo cristiano se apreste a celebrar las próximas fiestas pascuales con una fe viva y con una entrega generosa. Por Cristo nuestro Señor.
Lunes de la IV semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Sb 11, 24-25a
    texto: Señor, tú te compadeces de todos porque todo lo puedes y disimulas los pecados de los hombres para que se arrepientan. Amas a todos los seres y nada de lo que hiciste aborreces.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Dios nuestro, que renuevas el mundo por medio de sacramentos divinos, haz que tu Iglesia progrese por la celebración de estos sacramentos de vida eterna y no permitas que le falten nunca los auxilios necesarios para su vida terrena. Por Cristo nuestro Señor.
Martes de la IV semana de Cuaresma:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Jl 2, 17
    texto: 'Entre el atrio y el altar lloren los sacerdotes, ministros del Señor, y digan: «Perdona, Señor, a tu pueblo; no entregues tu heredad al oprobio, no la dominen las naciones.»'
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor, que las saludables prácticas de la Cuaresma dispongan los corazones de tus hijos, para que celebren dignamente el misterio pascual y extiendan por todas partes el anuncio de tu salvación. Por Cristo nuestro Señor.
Miércoles de la IV semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Ez 18, 30b-32
    texto: «Arrepentíos y convertíos de vuestros delitos y no caeréis en pecado. Quitaos de encima los delitos que habéis perpetrado y estrenad un corazón nuevo y un espíritu nuevo; y así no moriréis, casa de Israel. Pues yo no me complazco en la muerte de nadie —oráculo del Señor—. ¡Arrepentíos y viviréis!»
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor Dios, que premias los méritos de los justos y concedes el perdón a los pecadores que se arrepienten y hacen penitencia, escucha benignamente nuestras súplicas y, por la humilde confesión de nuestras culpas, otórganos tu perdón. Por Cristo nuestro Señor.
Jueves de la IV semana de Cuaresma:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Is 55, 6-7
    texto: Buscad al Señor mientras se le puede encontrar, invocadlo mientras está cerca; que el malvado abandone su camino y el criminal sus planes; que regrese al Señor y él tendrá piedad, a nuestro Dios, que es rico en perdón.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Padre lleno de amor, concédenos que, purificados por la penitencia y santificados por la práctica de buenas obras, sepamos mantenernos siempre fieles a tus mandamientos y lleguemos libres de culpa a las fiestas de la Pascua. Por Cristo nuestro Señor.
Viernes de la IV semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Is 55, 3
    texto: 'Inclinad el oído, venid a mí: escuchadme y viviréis. Sellaré con vosotros alianza perpetua, la promesa que aseguré a David.'
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor Dios, que nos proporcionas abundantemente los auxilios que necesita nuestra fragilidad, haz que recibamos con alegría la redención que nos otorgas y que la manifestemos a los demás con nuestra propia vida. Por Cristo nuestro Señor.
Lunes de la II semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Sb 11, 24-25a
    texto: Señor, tú te compadeces de todos porque todo lo puedes y disimulas los pecados de los hombres para que se arrepientan. Amas a todos los seres y nada de lo que hiciste aborreces.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor, tu que para nuestro progreso espiritual nos mandas dominar nuestro cuerpo mediante la austeridad, ayúdanos a huir también de todo pecado y a entregarnos, con amor filial, al cumplimiento de tus mandatos. Por Cristo nuestro Señor.
Sábado de la IV semana de Cuaresma:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Ap 3, 19-20
    texto: Yo reprendo y corrijo a cuantos amo. ¡Ánimo, pues, y arrepiéntete! Mira que estoy a la puerta y llamo; si alguno escucha mi voz y me abre la puerta entraré en su casa, cenaré con él y él conmigo.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor, que tu amor misericordioso dirija siempre nuestros deseos y actividades, pues sabemos que sin tu ayuda no podemos complacerte. Por Cristo nuestro Señor.
V Domingo de Cuaresma (A):
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: 2Co 4, 10-11
    texto: Llevamos siempre en nosotros por todas partes los sufrimientos mortales de Jesús, para que también la vida de Jesús se manifieste en nosotros. Aun viviendo, estamos continuamente entregados a la muerte por Jesús para que también la vida de Jesús se manifieste en esta nuestra vida mortal.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Te pedimos, Señor, que enciendas nuestros corazones en aquel mismo amor con que tu Hijo ama al mundo y que lo impulsó a entregarse a la muerte por salvarlo. Por Cristo nuestro Señor.
V Domingo de Cuaresma (B):
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: 2Co 4, 10-11
    texto: Llevamos siempre en nosotros por todas partes los sufrimientos mortales de Jesús, para que también la vida de Jesús se manifieste en nosotros. Aun viviendo, estamos continuamente entregados a la muerte por Jesús para que también la vida de Jesús se manifieste en esta nuestra vida mortal.
