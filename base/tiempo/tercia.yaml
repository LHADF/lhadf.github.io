  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Señor, despierta en nuestros corazones el deseo de preparar la venida de tu Hijo, para que, cuando venga, podamos servirte libres de toda mancha. Por Cristo nuestro Señor.
Sábado de la II semana de Adviento:
  ant: Los profetas anunciaron que el Salvador nacería de María Virgen.
  lectura:
    ref: Is 4, 2
    texto: Aquel día, el vástago del Señor será joya y gloria, fruto del país, honor y ornamento para los supervivientes de Israel.
  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Dios todopoderoso, haz que Cristo, el resplandor de tu gloria, nazca en nuestros corazones, para que, por su venida, nos veamos libres de toda oscuridad y seamos transformados en hijos de la luz. Por Cristo nuestro Señor.
Viernes de la II semana de Adviento:
  ant: Los profetas anunciaron que el Salvador nacería de María Virgen.
  lectura:
    ref: Jr 29, 11. 13
    texto: 'Sé muy bien lo que pienso hacer con vosotros: designios de paz y no de aflicción, daros un porvenir y una esperanza. Me buscaréis y me encontraréis si me buscáis de todo corazón.'
  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Dios todopoderoso, concede a tu pueblo permanecer siempre en vela aguardando la venida de tu Hijo, para que cumpliendo lo que el mismo autor de nuestra salvación nos enseñó, podamos salir a su encuentro con nuestras lámparas encendidas. Por Cristo nuestro Señor.
