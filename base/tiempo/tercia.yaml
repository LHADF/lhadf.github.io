  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Is 55, 3
    texto: 'Inclinad el oído, venid a mí: escuchadme y viviréis. Sellaré con vosotros alianza perpetua, la promesa que aseguré a David.'
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Te pedimos, Señor, que nos ayudes a continuar animosos estos días de penitencia que acabamos de empezar y que nuestras prácticas externas de penitencia estén siempre acompañadas por la sinceridad de un corazón que desea convertirse. Por Cristo nuestro Señor.
Sábado después de Ceniza:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Ap 3, 19-20
    texto: Yo reprendo y corrijo a cuantos amo. ¡Ánimo, pues, y arrepiéntete! Mira que estoy a la puerta y llamo; si alguno escucha mi voz y me abre la puerta entraré en su casa, cenaré con él y él conmigo.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Dios todopoderoso y eterno, mira compasivo nuestra debilidad y extiende sobre nosotros tu mano para protegernos. Por Cristo nuestro Señor.
I Domingo de Cuaresma (A):
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: 1Ts 4, 1. 7
    texto: Hermanos, os rogamos y exhortamos en Jesús, el Señor, a que viváis como conviene que viváis para agradar a Dios, según aprendisteis de nosotros —cosa que ya hacéis—, y a que hagáis nuevos progresos. Pues Dios no nos ha llamado a una vida impura, sino sagrada.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: 'Te pedimos, Señor todopoderoso, que las celebraciones y las penitencias de esta Cuaresma nos ayuden a progresar en el camino de nuestra conversión: así conoceremos mejor y viviremos con mayor plenitud las riquezas inagotables del misterio de Cristo. Él, que vive y reina por los siglos de los siglos.'
