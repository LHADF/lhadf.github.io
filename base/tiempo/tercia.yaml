  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Te pedimos, Dios misericordioso, que en nuestra alegre marcha hacia el encuentro de tu Hijo no tropecemos en impedimentos terrenos, sino que, guiados por la sabiduría celestial, merezcamos participar de la gloria de aquel que vive y reina contigo.
