Sábado de la V semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: 1Jn 1, 8-9
    texto: Si decimos que no tenemos pecado, nos engañamos a nosotros mismos, y la verdad no está en nosotros. Si confesamos nuestros pecados, fiel y bondadoso es él para perdonarnos y purificarnos de toda iniquidad.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Dios nuestro, aunque continuamente realizas la salvación de los hombres, sin embargo, concedes a tu pueblo gracias más abundantes en este tiempo de Cuaresma; dígnate, pues, mirar con amor el esfuerzo cuaresmal de tus elegidos y concede tu ayuda tanto a los catecúmenos que van a recibir el bautismo como a tus hijos que ya lo hemos recibido. Por Cristo nuestro Señor.
