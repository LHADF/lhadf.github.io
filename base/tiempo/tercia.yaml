Miércoles de Ceniza:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Ez 18, 30b-32
    texto: «Arrepentíos y convertíos de vuestros delitos y no caeréis en pecado. Quitaos de encima los delitos que habéis perpetrado y estrenad un corazón nuevo y un espíritu nuevo; y así no moriréis, casa de Israel. Pues yo no me complazco en la muerte de nadie —oráculo del Señor—. ¡Arrepentíos y viviréis!»
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: 'Al empezar esta Cuaresma, te pedimos, Señor, que nos des un verdadero espíritu de conversión: así la austeridad de la penitencia de estos días nos servirá de ayuda en nuestra lucha contra el espíritu del mal. Por Cristo nuestro Señor.'
Jueves después de Ceniza:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Is 55, 6-7
    texto: Buscad al Señor mientras se le puede encontrar, invocadlo mientras está cerca; que el malvado abandone su camino y el criminal sus planes; que regrese al Señor y él tendrá piedad, a nuestro Dios, que es rico en perdón.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Tu gracia, Señor, inspire nuestras acciones, las sostenga y acompañe, para que todo nuestro trabajo cuaresmal brote de ti, como una fuente, y a ti tienda, como a su fin. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (A):
  himno: Ven, Espíritu Santo, luz y gozo
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (B):
  himno: Ven, Espíritu Santo, luz y gozo
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
