  oracion: Dios nuestro, que por medio de tu Hijo has hecho que volvamos a nacer como nuevas creaturas, mira con amor estas obras de tu misericordia y, por la venida de tu Hijo, borra en nosotros toda huella de pecado. Por Cristo nuestro Señor.
Jueves de la III semana de Adviento:
