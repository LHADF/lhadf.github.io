Natividad del Señor:
  himno: El trabajo, Señor, de cada día
  ant: José y María, la madre de Jesús, estaban maravillados de lo que se decía de él.
  lectura:
    ref: Tt 2, 11-12
    texto: Dios ha hecho aparecer a la vista de todos los hombres la gracia que nos trae la salud; y nos enseña a vivir con sensatez, justicia y religiosidad en esta vida, desechando la impiedad y las ambiciones del mundo.
  versiculo:
  - - V
    - Se acordó el Señor de su misericordia. Aleluia.
  - - R
    - Y de su fidelidad en favor de la casa de Israel. Aleluia.
  oracion: Dios nuestro, que de modo admirable creaste al hombre a tu imagen y semejanza y de un modo todavía más admirable elevaste su condición por medio de Jesucristo, concédenos compartir la divinidad de aquel que se ha dignado compartir nuestra humanidad. Por Cristo nuestro Señor.
