Sábado de la VII semana de Pascua:
  himno: Al Señor confesamos, ¡aleluia!
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Rm 5, 10-11
    texto: Si, siendo aún enemigos, fuimos reconciliados con Dios por la muerte de su Hijo, con mayor razón, estando ya reconciliados, seremos salvos por su vida. Y no sólo eso. Hasta ponemos nuestra gloria y confianza en Dios gracias a nuestro Señor Jesucristo, por cuyo medio hemos obtenido ahora la reconciliación.
  versiculo:
  - - V
    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Concédenos, Dios todopoderoso, seguir siempre realizando en toda nuestra vida el espíritu de estas fiestas pascuales, que hemos celebrado. Por Cristo nuestro Señor.
