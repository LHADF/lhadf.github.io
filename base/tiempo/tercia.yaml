    ref: Hch 2, 32. 36
    texto: 'Dios ha resucitado a Jesús; testigos somos todos nosotros. Así, pues, que todo el pueblo de Israel lo sepa con absoluta certeza: Dios ha constituido Señor y Mesías a este mismo Jesús, a quien vosotros habéis crucificado.'
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios todopoderoso y eterno, que por el misterio pascual restableciste tu alianza con los hombres, concédenos realizar en nuestra vida lo que en estas fiestas proclama nuestra fe. Por Cristo nuestro Señor.
Sábado de la Octava de Pascua:
  himno: Al Señor confesamos, ¡aleluia!
  ant: Cristo, una vez resucitado de entre los muertos, ya no muere. Aleluia.
  lectura:
    ref: Rm 5, 10-11
    texto: Si, siendo aún enemigos, fuimos reconciliados con Dios por la muerte de su Hijo, con mayor razón, estando ya reconciliados, seremos salvos por su vida. Y no sólo eso. Hasta ponemos nuestra gloria y confianza en Dios gracias a nuestro Señor Jesucristo, por cuyo medio hemos obtenido ahora la reconciliación.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que con la abundancia de tu gracia no cesas de aumentar en todos los pueblos el número de tus hijos, mira con amor a tus elegidos que han nacido a una nueva vida por el sacramento del bautismo y concédeles alcanzar una dichosa inmortalidad. Por Cristo nuestro Señor.
II Domingo de Pascua (de la Divina Misericordia) (A):
