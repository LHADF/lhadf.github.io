    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Escucha, Señor, nuestra oración y haz que mediante la predicación del Evangelio llegue a ser realidad en todo el mundo la salvación inaugurada en la glorificación de tu Hijo, y que todos los hombres alcancen la adopción filial que él anunció con su palabra de verdad. Por Cristo nuestro Señor.
