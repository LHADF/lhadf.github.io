    texto: Dios ha hecho aparecer a la vista de todos los hombres la gracia que nos trae la salud; y nos enseña a vivir con sensatez, justicia y religiosidad en esta vida, desechando la impiedad y las ambiciones del mundo.
  versiculo:
  - - V
    - Se acordó el Señor de su misericordia. Aleluia.
  - - R
    - Y de su fidelidad en favor de la casa de Israel. Aleluia.
  oracion: Dios todopoderoso, Dios invisible, que con la venida de tu Hijo has disipado las tinieblas del mundo, míranos con amor y ayúdanos a celebrar con nuestros cantos y alabanzas la gloria del nacimiento de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Día VI de la Octava de la Natividad:
  himno: El trabajo, Señor, de cada día
  ant: José y María, la madre de Jesús, estaban maravillados de lo que se decía de él.
  lectura:
    ref: Dt 4, 7
    texto: ¿Cuál de las naciones grandes tiene unos dioses tan cercanos como el Señor, nuestro Dios, siempre que lo invocamos?
  versiculo:
