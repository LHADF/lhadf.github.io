5 de enero, del Tiempo de Navidad:
  himno: El trabajo, Señor, de cada día
  ant: José y María, la madre de Jesús, estaban maravillados de lo que se decía de él.
  lectura:
    ref: Ez 20, 41-42a
    texto: Como aroma que calma os aceptaré, cuando os saque de los países y os reúna de entre las naciones en las que estáis dispersos, y muestre en vosotros mi santidad a la vista de los gentiles. Y sabréis que yo soy el Señor.
  versiculo:
  - - V
    - Se acordó el Señor de su misericordia. Aleluia.
  - - R
    - Y de su fidelidad en favor de la casa de Israel. Aleluia.
  oracion: Señor Dios, que iniciaste admirablemente la obra de la redención con el nacimiento de tu Hijo, fortalece en nosotros la fe, para que, siguiendo sus enseñanzas, podamos alcanzar la prometida recompensa de la gloria. Por Cristo nuestro Señor.
Epifanía del Señor:
  himno: El trabajo, Señor, de cada día
  ant: El misterio, escondido desde el comienzo de los siglos y generaciones, ahora se ha manifestado.
  lectura:
    ref: Ap 15, 4
    texto: ¿Quién no temerá, Señor, y glorificará tu nombre? Porque tú solo eres santo, porque vendrán todas las naciones y se postrarán en tu acatamiento.
  versiculo:
  - - V
    - Apareció en la tierra.
  - - R
    - Y convivió entre los hombres.
  oracion: Señor, tú que manifestaste a tu Hijo en este día a todas las naciones por medio de una estrella, concédenos, a los que ya te conocemos por la fe, llegar a contemplar, cara a cara, la hermosura infinita de tu gloria. Por Cristo nuestro Señor.
