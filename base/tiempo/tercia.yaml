  versiculo:
  - - V
    - Se humillaba voluntariamente.
  - - R
    - Y no abría su boca.
  oracion: Dios nuestro, que, para librarnos del poder del enemigo, quisiste que tu Hijo muriera en la cruz, concédenos alcanzar la gracia de la resurrección. Por Cristo nuestro Señor.
Jueves Santo:
  himno: Amigo de los hombres, Jesucristo
  ant: La víspera del día solemne de la Pascua, sabiendo Jesús que había llegado su hora, como amaba a los suyos, les dio la mayor prueba de amor que puede darse.
  lectura:
    ref: Hb 4, 14-15
    texto: Teniendo un sumo sacerdote que penetró y está en los cielos, Jesús, el Hijo de Dios, mantengamos firme la fe que profesamos. No tenemos un sacerdote incapaz de compadecerse de nuestras debilidades, al contrario, él mismo pasó por todas las pruebas a semejanza nuestra, fuera del pecado.
  versiculo:
  - - V
    - Se humillaba voluntariamente.
  - - R
    - Y no abría su boca.
  oracion: Dios nuestro, digno, con toda justicia, de ser amado sobre todas las cosas, derrama sobre nosotros los dones de tu gracia, para que la herencia celestial, que la muerte de tu Hijo nos hace esperar confiadamente, logre ser alcanzada por nosotros en virtud de su resurrección. Por Cristo nuestro Señor.
Viernes Santo de la Pasión del Señor:
  himno: Cruz preciosa
  ant: Era hacia la media mañana cuando crucificaron a Jesús.
  lectura:
    ref: Is 53, 2-3
    texto: Creció ante nosotros como un débil brote, como raíz en tierra árida. Lo vimos sin aspecto atrayente, sin gracia ni belleza, despreciado y rechazado por los hombres, como varón de dolores, acostumbrado a los sufrimientos, ante el cual se desvía la mirada, discriminado y desestimado.
  versiculo:
  - - V
    - Te adoramos, oh Cristo, y te bendecimos.
  - - R
    - Porque con tu santa cruz redimiste al mundo.
  oracion: Mira, Señor, con bondad a tu familia santa, por la cual Jesucristo nuestro Señor aceptó el tormento de la cruz, entregándose a sus propios enemigos. Por Cristo nuestro Señor.
Sábado Santo:
  himno: Cruz preciosa
  ant: Espero gozar de la dicha del Señor en el país de la vida.
  lectura:
    ref: 1Jn 1, 8-9
    texto: Si decimos que no tenemos pecado, nos engañamos a nosotros mismos, y la verdad no está en nosotros. Si confesamos nuestros pecados, fiel y bondadoso es él para perdonarnos y purificarnos de toda iniquidad.
  versiculo:
  - - V
    - No me entregarás a la muerte.
  - - R
    - Ni dejarás a tu fiel conocer la corrupción.
  oracion: Dios todopoderoso, cuyo Unigénito descendió al lugar de los muertos y salió victorioso del sepulcro, te pedimos que concedas a todos tus fieles, sepultados con Cristo por el bautismo, resucitar también con él a la vida eterna. Por Cristo nuestro Señor.
Domingo de Pascua de la Resurrección del Señor (A):
  himno: Al Señor confesamos, ¡aleluia!
  ant: Cristo, una vez resucitado de entre los muertos, ya no muere. Aleluia.
  lectura:
    ref: Cf. 1Co 15, 3b-5
    texto: Cristo murió por nuestros pecados, según las Escrituras, y fue sepultado; resucitó al tercer día y vive, según lo anunciaron también las Escrituras. Y se apareció a Cefas y luego a los Doce.
  versiculo:
  - - V
    - Este es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que en este día nos abriste las puertas de la vida por medio de tu Hijo, vencedor de la muerte, concédenos a todos los que celebramos su gloriosa resurrección que, por la nueva vida que tu Espíritu nos comunica, lleguemos también nosotros a resucitar a la luz de la vida eterna. Por Cristo nuestro Señor.
Domingo de Pascua de la Resurrección del Señor (B):
  himno: Al Señor confesamos, ¡aleluia!
  ant: Cristo, una vez resucitado de entre los muertos, ya no muere. Aleluia.
  lectura:
    ref: Cf. 1Co 15, 3b-5
