  - - R
    - Los reyes del mundo tu gloria.
  oracion: Escucha, Señor, nuestras plegarias e ilumina las tinieblas de nuestro espíritu con la venida de tu Hijo. Que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
Miércoles de la III semana de Adviento:
  ant: Los profetas anunciaron que el Salvador nacería de María Virgen.
  lectura:
    ref: Is 2, 11
    texto: Los ojos orgullosos serán humillados, será doblegada la arrogancia humana; sólo el Señor será ensalzado aquel día.
  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Concédenos, Dios todopoderoso, que la ya cercana solemnidad del nacimiento de tu Hijo nos depare los auxilios que necesitamos en esta vida y nos alcance el premio de la eterna felicidad. Por Cristo nuestro Señor.
Feria privilegiada de Adviento:
  ant: Los profetas anunciaron que el Salvador nacería de María Virgen.
  lectura:
    ref: Is 4, 2
    texto: Aquel día, el vástago del Señor será joya y gloria, fruto del país, honor y ornamento para los supervivientes de Israel.
  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Dios nuestro, que te has dignado revelar al mundo el esplendor de tu gloria por medio del parto de la santísima Virgen María, concédenos venerar con fe íntegra y celebrar con sincero rendimiento el gran misterio de la encarnación de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Viernes de la III semana de Adviento:
  ant: Los profetas anunciaron que el Salvador nacería de María Virgen.
  lectura:
    ref: Jr 29, 11. 13
    texto: 'Sé muy bien lo que pienso hacer con vosotros: designios de paz y no de aflicción, daros un porvenir y una esperanza. Me buscaréis y me encontraréis si me buscáis de todo corazón.'
  versiculo:
  - - V
    - Los gentiles temerán tu nombre, Señor.
  - - R
    - Los reyes del mundo tu gloria.
  oracion: Que tu gracia, Señor, nos prepare y nos acompañe siempre a los que esperamos anhelantes la venida de tu Hijo, a fin de que obtengamos los auxilios nicesarios para la vida presente y para llegar con felicidad a la futura. Por Cristo nuestro Señor.
IV Domingo de Adviento (A):
