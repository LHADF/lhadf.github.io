  versiculo:
  - - V
    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Dios todopoderoso y eterno, a quien confiadamente invocamos con el nombre de Padre, intensifica en nosotros el espíritu de hijos adoptivos tuyos, para que merezcamos entrar en posesión de la herencia que nos tienes prometida. Por Cristo nuestro Señor.
Sábado de la IV semana de Pascua:
  himno: Espíritu de Dios, la tierra llenas
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Rm 5, 10-11
    texto: Si, siendo aún enemigos, fuimos reconciliados con Dios por la muerte de su Hijo, con mayor razón, estando ya reconciliados, seremos salvos por su vida. Y no sólo eso. Hasta ponemos nuestra gloria y confianza en Dios gracias a nuestro Señor Jesucristo, por cuyo medio hemos obtenido ahora la reconciliación.
  versiculo:
  - - V
    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Dios todopoderoso y eterno, asístenos con tu gracia para que llevemos a su más plena realidad, en nosotros mismos, el misterio pascual que estamos celebrando, y para que así los que hemos renacido en el bautismo demos frutos abundantes de vida cristiana y alcancemos finalmente los goces de la vida eterna. Por Cristo nuestro Señor.
V Domingo de Pascua (A):
  himno: Al Señor confesamos, ¡aleluia!
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. 1Co 15, 3b-5
    texto: Cristo murió por nuestros pecados, según las Escrituras, y fue sepultado; resucitó al tercer día y vive, según lo anunciaron también las Escrituras. Y se apareció a Cefas y luego a los Doce.
  versiculo:
  - - V
    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Dios nuestro, que nos has enviado la redención y concedido la filiación adoptiva, protege con bondad a los hijos que tanto amas, y concédenos, por nuestra fe en Cristo, la verdadera libertad y la herencia eterna. Por Cristo nuestro Señor.
