  - - V
    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Señor, Dios nuestro, que has otorgado a tu pueblo el don de la redención, concédenos vivir eternamente la alegría de la resurrección de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Viernes de la VI semana de Pascua:
