  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor, mira complacido a tu pueblo, que con fervor desea entregarse a una vida santa, y, ya que con sus privaciones se esfuerza por dominar el cuerpo, que la práctica de las buenas obras transforme su alma. Por Cristo nuestro Señor.
Jueves de la I semana de Cuaresma:
