  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Oh Dios, que has reunido a pueblos diversos en la confesión de tu nombre, concede a los que han renacido en la fuente bautismal una misma fe en su espíritu y una misma caridad en sus vidas. Por Cristo nuestro Señor.
Viernes de la Octava de Pascua:
