Martes de la VI semana de Pascua:
  himno: Espíritu de Dios, la tierra llenas
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. Hch 4, 11-12
    texto: Jesús es la piedra que desecharon los arquitectos y que se ha convertido en piedra angular; en ningún otro se encuentra la salud, y no hay bajo el cielo otro nombre dado a los hombres por el que nosotros debamos salvarnos.
  versiculo:
  - - V
    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Señor, haz que tu pueblo viva siempre en la alegría al ver renovada la juventud de su espíritu, y que el gozo de haber recobrado la dignidad de la adopción divina le dé la firme esperanza de resucitar un día a la verdadera felicidad. Por Cristo nuestro Señor.
