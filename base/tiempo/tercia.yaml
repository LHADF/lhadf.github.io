    texto: Llevamos siempre en nosotros por todas partes los sufrimientos mortales de Jesús, para que también la vida de Jesús se manifieste en nosotros. Aun viviendo, estamos continuamente entregados a la muerte por Jesús para que también la vida de Jesús se manifieste en esta nuestra vida mortal.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Te pedimos, Señor, que enciendas nuestros corazones en aquel mismo amor con que tu Hijo ama al mundo y que lo impulsó a entregarse a la muerte por salvarlo. Por Cristo nuestro Señor.
Lunes de la V semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Ez 33, 10b. 11a
    texto: Nuestros crímenes y nuestros pecados pesan sobre nosotros y por causa de ellos nos consumimos. ¿Cómo podremos vivir? «Por mi vida —dice el Señor—, que yo no me complazco en la muerte del malvado, sino en que el malvado cambie de conducta y viva.»
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor, Dios nuestro, que por el amor inefable que nos tienes nos enriqueces con toda clase de bendiciones, concédenos pasar de nuestras antiguas faltas a una vida nueva, para prepararnos convenientemente a la gloria del reino celestial. Por Cristo nuestro Señor.
Martes de la V semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Cf. 1Co 1, 18-19
    texto: 'El mensaje de la cruz es necedad para los que están en vías de perdición; pero para los que están en vías de salvación es fuerza de Dios. Dice la Escritura: «Destruiré la sabiduría de los sabios, frustraré la sagacidad de los sagaces.»'
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Concédenos, Señor, ser perseverantes en el fiel cumplimiento de tu voluntad, para que en nuestros días crezca tu pueblo no sólo en número, sino también en santidad. Por Cristo nuestro Señor.
Miércoles de la V semana de Cuaresma:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: 1Tm 2, 4-6
    texto: Dios, nuestro Salvador, quiere que todos los hombres se salven y lleguen al pleno conocimiento de la verdad. Porque hay un solo Dios, y único es el mediador entre Dios y los hombres, Cristo Jesús, hombre también él, el cual se entregó a sí mismo como precio de rescate por todos. Éste es el testimonio que nos ha dado Dios a su tiempo.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Dios misericordioso, ilumina los corazones de tus hijos que tratan de purificarse por la penitencia de la Cuaresma y, ya que nos infundes el deseo de servirte con amor, dígnate escuchar paternalmente nuestras súplicas. Por Cristo nuestro Señor.
Jueves de la V semana de Cuaresma:
  himno: Como el fuego calcina
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Hb 4, 14-15
    texto: Teniendo un sumo sacerdote que penetró y está en los cielos, Jesús, el Hijo de Dios, mantengamos firme la fe que profesamos. No tenemos un sacerdote incapaz de compadecerse de nuestras debilidades, al contrario, él mismo pasó por todas las pruebas a semejanza nuestra, fuera del pecado.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Señor, atiende a nuestras súplicas y concédenos tu protección, ya que hemos puesto toda nuestra esperanza en tu misericordia; purifícanos de toda mancha de pecado y haz que nos mantengamos en una vida santa, para que lleguemos a recibir la herencia que nos tienes prometida. Por Cristo nuestro Señor.
Viernes de la V semana de Cuaresma:
  himno: Amigo de los hombres, Jesucristo
  ant: Han llegado los días de penitencia; expiemos nuestros pecados y salvaremos nuestras almas.
  lectura:
    ref: Is 53, 2-3
    texto: Creció ante nosotros como un débil brote, como raíz en tierra árida. Lo vimos sin aspecto atrayente, sin gracia ni belleza, despreciado y rechazado por los hombres, como varón de dolores, acostumbrado a los sufrimientos, ante el cual se desvía la mirada, discriminado y desestimado.
  versiculo:
  - - V
    - Señor, crea en mí un corazón puro.
  - - R
    - Renuévame por dentro con espíritu firme.
  oracion: Perdona, Señor, las culpas que hemos cometido a causa de nuestra debilidad y, por tu misericordia, líbranos de la esclavitud en que nos tienen cautivos nuestros pecados. Por Cristo nuestro Señor.
Domingo de Ramos en la Pasión del Señor (A):
  himno: Amigo de los hombres, Jesucristo
  ant: La víspera del día solemne de la Pascua, sabiendo Jesús que había llegado su hora, como amaba a los suyos, les dio la mayor prueba de amor que puede darse.
  lectura:
    ref: 2Co 4, 10-11
    texto: Llevamos siempre en nosotros por todas partes los sufrimientos mortales de Jesús, para que también la vida de Jesús se manifieste en nosotros. Aún viviendo, estamos continuamente entregados a la muerte por Jesús, para que también la vida de Jesús se manifieste en esta nuestra vida mortal.
  versiculo:
  - - V
    - Se humillaba voluntariamente.
  - - R
    - Y no abría su boca.
  oracion: Dios todopoderoso y eterno, que quisiste que nuestro Salvador se anonadase, haciéndose hombre y muriendo en la cruz, para que todos nosotros imitáramos su ejemplo de humildad, concédenos seguir las enseñanzas de su pasión, para que un día participemos en su resurrección gloriosa. Por Cristo nuestro Señor.
Domingo de Ramos en la Pasión del Señor (B):
  himno: Amigo de los hombres, Jesucristo
  ant: La víspera del día solemne de la Pascua, sabiendo Jesús que había llegado su hora, como amaba a los suyos, les dio la mayor prueba de amor que puede darse.
