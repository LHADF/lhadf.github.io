  versiculo:
  - - V
    - Se humillaba voluntariamente.
  - - R
    - Y no abría su boca.
  oracion: Dios todopoderoso y eterno, concédenos participar tan vivamente en las celebraciones de la pasión del Señor que alcancemos tu perdón. Por Cristo nuestro Señor.
Miércoles Santo:
  himno: Como el fuego calcina
  ant: La víspera del día solemne de la Pascua, sabiendo Jesús que había llegado su hora, como amaba a los suyos, les dio la mayor prueba de amor que puede darse.
  lectura:
    ref: 1Tm 2, 4-6
