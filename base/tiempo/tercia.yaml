Domingo de Pentecostés (A):
  himno: Fuego de Dios a nuestras frentes baje
  ant: El Espíritu Santo, viniendo del cielo, llenó invisiblemente el corazón de los apóstoles. Aleluia.
  lectura:
    ref: 1Co 12, 13
    texto: Todos nosotros, judíos y griegos, esclavos y libres, hemos sido bautizados en un mismo Espíritu, para formar un solo cuerpo. Y todos hemos bebido de un solo Espíritu.
  versiculo:
  - - V
    - El Espíritu Santo. Aleluia.
  - - R
    - Os lo enseñará todo. Aleluia.
  oracion: Dios todopoderoso, haz brillar sobre nosotros el resplandor de tu gloria, para que la claridad de tu luz fortalezca con la gracia del Espíritu Santo a los que, por tu bondad, hemos recibido en el bautismo una vida nueva. Por Cristo nuestro Señor.
