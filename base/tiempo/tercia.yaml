  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Co 12, 13
    texto: Todos nosotros, judíos y griegos, esclavos y libres, hemos sido bautizados en un mismo Espíritu, para formar un solo cuerpo. Y todos hemos bebido de un solo Espíritu.
