    - Verdaderamente ha resucitado el Señor. Aleluia.
  - - R
    - Y se ha aparecido a Simón. Aleluia.
  oracion: Dios nuestro, cuya gracia nos transforma de culpables en justos, de infelices en dichosos, no dejes de favorecernos con la acción de tu gracia y con tus dones, y concédenos a los que hemos alcanzado ya la justificación por la fe la fuerza necesaria para perseverar siempre en ella. Por Cristo nuestro Señor.
