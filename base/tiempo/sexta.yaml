Lunes de la Octava de Pascua:
  himno: Cuando la luz del día está en su cumbre
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: Col 2, 9-10a.12
    texto: En Cristo, en su cuerpo glorificado, habita toda la plenitud de la deidad; e, incorporados a él, alcanzáis también vosotros esa plenitud en él. con Cristo fuisteis sepultados en el bautismo, y con él resucitasteis mediante la fe en el poder de Dios, que lo resucitó de entre los muertos.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que haces crecer a tu Iglesia dándole continuamente nuevos hijos por el bautismo, concédenos ser siempre fieles en nuestra vida a la fe que en ese sacramento hemos recibido. Por Cristo nuestro Señor.
Martes de la Octava de Pascua:
  himno: Verbo de Dios, el sol de mediodía
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: Cf. 1Pe 3, 21-22a
    texto: A vosotros os salva el bautismo, el cual no es remoción de las manchas del cuerpo, sino la petición que hace a Dios una buena conciencia, en virtud de la resurrección de Jesucristo, que está a la diestra de Dios.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Señor Dios, que nos has proporcionado el remedio de nuestros males por el misterio pascual, colma a tu pueblo de tus dones celestiales, para que alcance la perfecta libertad y llegue a gozar plenamente en el cielo de la alegría que ya ha comenzado a gustar en la tierra. Por Cristo nuestro Señor.
Miércoles de la Octava de Pascua:
  himno: Cuando la luz del día está en su cumbre
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: 1Jn 5, 5-6a
    texto: ¿Quén es el que vence al mundo, sino el que cree que Jesús es el Hijo de Dios? Él, Jesucristo, vino por el agua y por la sangre; no con el agua solamente, sino con el agua y con la sangre.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que todos los años nos alegras con la solemnidad de la resurrección del Señor, concédenos que la celebración de estas fiestas aquí en la tierra nos lleve a gozar de la eterna alegría en el cielo. Por Cristo nuestro Señor.
Jueves de la Octava de Pascua:
  himno: Verbo de Dios, el sol de mediodía
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: Tt 3, 5b-7
    texto: Dios nos trajo la salud mediante el baño bautismal de regeneración y renovación que obra el Espíritu Santo. Él derramó con toda profusión sobre nosotros este Espíritu por Cristo Jesús, nuestro salvador. Así, justificados por la gracia de Cristo, hemos obtenido la esperanza de poseer en herencia la vida eterna.
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Oh Dios, que has reunido a pueblos diversos en la confesión de tu nombre, concede a los que han renacido en la fuente bautismal una misma fe en su espíritu y una misma caridad en sus vidas. Por Cristo nuestro Señor.
Viernes de la Octava de Pascua:
  himno: Cuando la luz del día está en su cumbre
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: Ga 3, 27-28
    texto: 'Todos los que habéis sido bautizados en Cristo os habéis revestido de Cristo. Ya no hay distinción entre judío y gentil, ni entre libre y esclavo, ni entre hombre y mujer: todos sois uno en Cristo Jesús.'
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios todopoderoso y eterno, que por el misterio pascual restableciste tu alianza con los hombres, concédenos realizar en nuestra vida lo que en estas fiestas proclama nuestra fe. Por Cristo nuestro Señor.
Sábado de la Octava de Pascua:
  himno: Verbo de Dios, el sol de mediodía
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: 1Co 15, 20-22
    texto: 'Cristo resucitó de entre los muertos: el primero de todos. Lo mismo que por un hombre hubo muerte, por otro hombre hay resurrección de los muertos. Y lo mismo que en Adán todos mueren, en Cristo todos serán llamados de nuevo a la vida.'
  versiculo:
  - - V
    - Éste es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que con la abundancia de tu gracia no cesas de aumentar en todos los pueblos el número de tus hijos, mira con amor a tus elegidos que han nacido a una nueva vida por el sacramento del bautismo y concédeles alcanzar una dichosa inmortalidad. Por Cristo nuestro Señor.
II Domingo de Pascua (de la Divina Misericordia) (A):
