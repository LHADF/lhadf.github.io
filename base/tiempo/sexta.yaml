    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Señor, concédenos realizar plenamente en nosotros mismos el misterio pascual, para que la alegría que experimentamos en estas fiestas nos dé una fuerza constante que nos lleve a la salvación. Por Cristo nuestro Señor.
