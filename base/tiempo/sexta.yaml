# Propio del tiempo de Sexta: por feria; solo lo que cambia respecto del salterio. «ant»: antífona propia de la hora para los tres salmos.
I Domingo de Adviento (A):
  himno: Cuando la luz del día está en su cumbre
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: 1 Ts 3, 12-13
    texto: Que el Señor os haga aumentar y rebosar en amor de unos con otros y con todos, así como os amamos nosotros, para que conservéis vuestros corazones intachables en santidad ante Dios, Padre nuestro, cuando venga nuestro Señor Jesucristo con todos sus santos.
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Señor, despierta en tus fieles el deseo de prepararse a la venida de Cristo por la práctica de las buenas obras, para que, colocados un día a su derecha, merezcan poseer el reino celestial. Por Cristo nuestro Señor.
