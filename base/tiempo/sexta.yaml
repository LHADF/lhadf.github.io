  - - R
    - Visítanos con tu salvación.
  oracion: Concédenos, Dios todopoderoso, que la ya cercana solemnidad del nacimiento de tu Hijo nos depare los auxilios que necesitamos en esta vida y nos alcance el premio de la eterna felicidad. Por Cristo nuestro Señor.
Feria privilegiada de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
