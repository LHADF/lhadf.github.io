  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Señor, que la venida salvadora de tu Hijo alegre a tus siervos, a quienes ahora entristece el peso de sus culpas. Por Cristo nuestro Señor.
Lunes de la III semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
