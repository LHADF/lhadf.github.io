  - - R
    - Visítanos con tu salvación.
  oracion: Lleguen a ti, Señor, nuestras plegarias y colma nuestros deseos de llegar a conocer más plenamente el gran misterio de la encarnación de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Martes de la II semana de Adviento:
  himno: Este mundo del hombre, en que él se afana
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Jr 23, 6
    texto: 'En sus días se salvará Judá, Israel habitará seguro. Y lo llamarán con este nombre: «El-Señor-nuestra-justicia.»'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Dios nuestro, que has proclamado tu salvación a todos los confines de la tierra, concédenos esperar con alegría las fiestas del nacimiento del Salvador, Jesucristo, tu Hijo. Él, que vive y reina por los siglos de los siglos.
Miércoles de la II semana de Adviento:
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Is 12, 2
    texto: 'Él es mi Dios y salvador: confiaré y no temeré, porque mi fuerza y mi poder es el Señor, él fue mi salvación.'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Dios todopoderoso, que nos has mandado preparar el camino para la venida de Cristo, no permitas que desfallezcamos por nuestras debilidades los que esperamos la llegada consoladora del médico celestial. Él, que vive y reina por los siglos de los siglos.
