VII Domingo de Pascua (A):
  himno: Verbo de Dios, el sol de mediodía
  ant: Asoma por un extremo del cielo, y su órbita llega al otro extremo. Aleluia.
  lectura:
    ref: Hb 8, 1b-3a
    texto: Tenemos un sumo sacerdote que está sentado a la diestra del trono de la Majestad en los cielos. Él es el ministro del santuario y de la verdadera Tienda de Reunión, que fue fabricada por el Señor y no por hombre alguno. Todo sumo sacerdote es instituido para ofrecer oblaciones y sacrificios.
  versiculo:
  - - V
    - El Señor puso en el cielo su trono. Aleluia.
  - - R
    - Su soberanía gobierna el universo. Aleluia.
  oracion: Concédenos, Señor, rebosar de alegría al celebrar la gloriosa ascensión de tu Hijo, y elevar a ti una cumplida acción de gracias, pues el triunfo de Cristo es ya nuestra victoria y, ya que él es la cabeza de la Iglesia, haz que nosotros, que somos su cuerpo, nos sintamos atraídos por una irresistible esperanza hacia donde él nos precedió. Por Cristo nuestro Señor.
