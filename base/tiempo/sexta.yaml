  oracion: Dios todopoderoso y eterno, que con la magnificencia de tu amor sobrepasas los méritos y aun los deseos de los que te suplican, derrama sobre nosotros tu misericordia, para que libres nuestra conciencia de toda inquietud y nos concedas aun aquello que no nos atrevemos a pedir. Por Cristo nuestro Señor.
XXVIII Domingo del Tiempo Ordinario (A):
  oracion: Te pedimos, Señor, que tu gracia continuamente nos preceda y acompañe, de manera que estemos dispuestos a obrar siempre el bien. Por Cristo nuestro Señor.
XXVIII Domingo del Tiempo Ordinario (B):
  oracion: Te pedimos, Señor, que tu gracia continuamente nos preceda y acompañe, de manera que estemos dispuestos a obrar siempre el bien. Por Cristo nuestro Señor.
XXVIII Domingo del Tiempo Ordinario (C):
  oracion: Te pedimos, Señor, que tu gracia continuamente nos preceda y acompañe, de manera que estemos dispuestos a obrar siempre el bien. Por Cristo nuestro Señor.
XXIX Domingo del Tiempo Ordinario (A):
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por Cristo nuestro Señor.
XXIX Domingo del Tiempo Ordinario (B):
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por Cristo nuestro Señor.
XXIX Domingo del Tiempo Ordinario (C):
  oracion: Dios todopoderoso y eterno, haz que nuestra voluntad sea siempre dócil a la tuya y que te sirvamos con un corazón sincero. Por Cristo nuestro Señor.
XXX Domingo del Tiempo Ordinario (A):
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por Cristo nuestro Señor.
XXX Domingo del Tiempo Ordinario (B):
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por Cristo nuestro Señor.
XXX Domingo del Tiempo Ordinario (C):
  oracion: Dios todopoderoso y eterno, aumenta en nosotros la fe, la esperanza y la caridad, y para que alcancemos lo que nos prometes haz que amemos lo que nos mandas. Por Cristo nuestro Señor.
XXXI Domingo del Tiempo Ordinario (A):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
XXXI Domingo del Tiempo Ordinario (B):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
XXXI Domingo del Tiempo Ordinario (C):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor de poder y de misericordia, cuyo favor hace digno y agradable el servicio de tus fieles, concédenos caminar sin tropiezos hacia los bienes que nos prometes. Por Cristo nuestro Señor.
XXXII Domingo del Tiempo Ordinario (A):
  himno: Este mundo del hombre, en que él se afana
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por Cristo nuestro Señor.
XXXII Domingo del Tiempo Ordinario (B):
  himno: Este mundo del hombre, en que él se afana
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por Cristo nuestro Señor.
XXXII Domingo del Tiempo Ordinario (C):
  himno: Este mundo del hombre, en que él se afana
  oracion: Dios omnipotente y misericordioso, aparta de nosotros todos los males, para que, con el alma y el cuerpo bien dispuestos, podamos libremente cumplir tu voluntad. Por Cristo nuestro Señor.
XXXIII Domingo del Tiempo Ordinario (A):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por Cristo nuestro Señor.
XXXIII Domingo del Tiempo Ordinario (B):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por Cristo nuestro Señor.
XXXIII Domingo del Tiempo Ordinario (C):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor, Dios nuestro, concédenos alegrarnos siempre en tu servicio, porque la profunda y verdadera alegría está en ser fiel a ti, autor de todo bien. Por Cristo nuestro Señor.
