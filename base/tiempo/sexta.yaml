Lunes de la V semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Jr 18, 20b
    texto: Acuérdate de cómo estuve en tu presencia, intercediendo en su favor, para apartar de ellos tu enojo.
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor, Dios nuestro, que por el amor inefable que nos tienes nos enriqueces con toda clase de bendiciones, concédenos pasar de nuestras antiguas faltas a una vida nueva, para prepararnos convenientemente a la gloria del reino celestial. Por Cristo nuestro Señor.
Martes de la V semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: 1Co 1, 22-24
    texto: 'Los judíos exigen signos, los griegos buscan sabiduría. Pero nosotros predicamos a Cristo crucificado: escándalo para los judíos, necedad para los gentiles; pero para los llamados a Cristo -judíos o griegos-: fuerza de Dios y sabiduría de Dios.'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Concédenos, Señor, ser perseverantes en el fiel cumplimiento de tu voluntad, para que en nuestros días crezca tu pueblo no sólo en número, sino también en santidad. Por Cristo nuestro Señor.
Miércoles de la V semana de Cuaresma:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Rm 15, 3
    texto: 'Cristo no buscó su propia complacencia, según está escrito: «Sobre mí cayeron los ultrajes de quienes te ultrajaron.»'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Dios misericordioso, ilumina los corazones de tus hijos que tratan de purificarse por la penitencia de la Cuaresma y, ya que nos infundes el deseo de servirte con amor, dígnate escuchar paternalmente nuestras súplicas. Por Cristo nuestro Señor.
Jueves de la V semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Hb 7, 26-27
    texto: 'Tal era precisamente el sumo sacerdote que nos convenía: santo, sin maldad, sin mancha, excluído del número de los pecadores y exaltado más alto que los cielos. No tiene necesidad, como los sumos sacerdotes, de ofrecer víctimas cada día, primero por los propios pecados y luego por los del pueblo. Esto lo hizo nuestro Señor Jesucristo una vez por todas, ofreciéndose a si mismo.'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor, atiende a nuestras súplicas y concédenos tu protección, ya que hemos puesto toda nuestra esperanza en tu misericordia; purifícanos de toda mancha de pecado y haz que nos mantengamos en una vida santa, para que lleguemos a recibir la herencia que nos tienes prometida. Por Cristo nuestro Señor.
Viernes de la V semana de Cuaresma:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Is 53, 4-5
    texto: 'Él soportó nuestros sufrimientos y aguantó nuestros dolores: nosotros lo estimamos leproso, herido de Dios y humillado; pero él fue herido por nuestras rebeldías, triturado por nuestros crímenes. Él soportó el castigo que nos trae la paz, por sus llagas hemos sido curados.'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Perdona, Señor, las culpas que hemos cometido a causa de nuestra debilidad y, por tu misericordia, líbranos de la esclavitud en que nos tienen cautivos nuestros pecados. Por Cristo nuestro Señor.
Domingo de Ramos en la Pasión del Señor (A):
  himno: La alegría de salvarse
  ant: Como el Padre me conoce a mí, yo conozco al Padre y doy mi vida por mis ovejas.
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  versiculo:
  - - V
    - Él soportó nuestros sufrimientos.
  - - R
    - Y aguantó nuestras rebeldías.
  oracion: Dios todopoderoso y eterno, que quisiste que nuestro Salvador se anonadase, haciéndose hombre y muriendo en la cruz, para que todos nosotros imitáramos su ejemplo de humildad, concédenos seguir las enseñanzas de su pasión, para que un día participemos en su resurrección gloriosa. Por Cristo nuestro Señor.
