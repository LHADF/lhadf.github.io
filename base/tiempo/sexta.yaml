  - - V
    - Él soportó nuestros sufrimientos.
  - - R
    - Y aguantó nuestras rebeldías.
  oracion: Dios todopoderoso y eterno, concédenos participar tan vivamente en las celebraciones de la pasión del Señor que alcancemos tu perdón. Por Cristo nuestro Señor.
Miércoles Santo:
  himno: Por el pecado primero
  ant: Como el Padre me conoce a mí, yo conozco al Padre y doy mi vida por mis ovejas.
  lectura:
    ref: Rm 15, 3
    texto: 'Cristo no buscó su propia complacencia, según está escrito: «Sobre mí cayeron los ultrajes de quienes te ultrajaron.»'
  versiculo:
  - - V
    - Él soportó nuestros sufrimientos.
  - - R
    - Y aguantó nuestras rebeldías.
  oracion: Dios nuestro, que, para librarnos del poder del enemigo, quisiste que tu Hijo muriera en la cruz, concédenos alcanzar la gracia de la resurrección. Por Cristo nuestro Señor.
Jueves Santo:
  himno: Jesús, contigo iremos al desierto
  ant: Como el Padre me conoce a mí, yo conozco al Padre y doy mi vida por mis ovejas.
  lectura:
    ref: Hb 7, 26-27
    texto: 'Tal era precisamente el sumo sacerdote que nos convenía: santo, sin maldad, sin mancha, excluido del número de los pecadores y exaltado más alto que los cielos. No tiene necesidad, como los sumos sacerdotes, de ofrecer víctimas cada día, primero por sus propios pecados y luego por los del pueblo. Esto lo hizo nuestro Señor Jesucristo una vez por todas, ofreciéndose a sí mismo.'
  versiculo:
  - - V
    - Él soportó nuestros sufrimientos.
  - - R
    - Y aguantó nuestras rebeldías.
  oracion: Dios nuestro, digno, con toda justicia, de ser amado sobre todas las cosas, derrama sobre nosotros los dones de tu gracia, para que la herencia celestial, que la muerte de tu Hijo nos hace esperar confiadamente, logre ser alcanzada por nosotros en virtud de su resurrección. Por Cristo nuestro Señor.
Viernes Santo de la Pasión del Señor:
  himno: ¡Misterio en el Calvario
  ant: Desde el mediodía hasta las tres de la tarde se extendieron las tinieblas sobre toda la tierra.
  lectura:
    ref: Is 53, 4-5
    texto: Él soportó nuestros sufrimientos y aguantó nuestros dolores; nosotros lo estimamos leproso, herido de Dios y humillado; pero él fue herido por nuestras rebeldías, triturado por nuestros crímenes. Él soportó el castigo que nos trae la paz, por sus llagas hemos sido curados.
  versiculo:
  - - V
    - Jesús, acuérdate de mí.
  - - R
    - Cuando vengas revestido de tu dignidad real.
  oracion: Mira, Señor, con bondad a tu familia santa, por la cual Jesucristo nuestro Señor aceptó el tormento de la cruz, entregándose a sus propios enemigos. Por Cristo nuestro Señor.
Sábado Santo:
  himno: ¡Misterio en el Calvario
  ant: Señor, sacaste mi vida del abismo.
  lectura:
    ref: 1Jn 2, 1b-2
    texto: Abogado tenemos ante el Padre, a Jesucristo , el justo. Él es propiciación por nuestros pecados, y no sólo por los nuestros, sino por los del mundo entero.
  versiculo:
  - - V
    - El Señor da la muerte y la vida.
  - - R
    - Hunde en el abismo y levanta.
  oracion: Dios todopoderoso, cuyo Unigénito descendió al lugar de los muertos y salió victorioso del sepulcro, te pedimos que concedas a todos tus fieles, sepultados con Cristo por el bautismo, resucitar también con él a la vida eterna. Por Cristo nuestro Señor.
Domingo de Pascua de la Resurrección del Señor (A):
  himno: Verbo de Dios, el sol de mediodía
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: Ef 2, 4-6
    texto: Dios, que es rico en misericordia, por el gran amor con que nos amó, aún cuando estábamos muertos por nuestros pecados, nos vivificó con Cristo —por pura gracia habéis sido salvados— y nos resucitó con él, y nos hizo sentar en los cielos con Cristo Jesús.
  versiculo:
  - - V
    - Este es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que en este día nos abriste las puertas de la vida por medio de tu Hijo, vencedor de la muerte, concédenos a todos los que celebramos su gloriosa resurrección que, por la nueva vida que tu Espíritu nos comunica, lleguemos también nosotros a resucitar a la luz de la vida eterna. Por Cristo nuestro Señor.
Domingo de Pascua de la Resurrección del Señor (B):
  himno: Verbo de Dios, el sol de mediodía
  ant: Fue entregado a la muerte por nuestros pecados, y resucitado para nuestra justificación. Aleluia.
  lectura:
    ref: Ef 2, 4-6
    texto: Dios, que es rico en misericordia, por el gran amor con que nos amó, aún cuando estábamos muertos por nuestros pecados, nos vivificó con Cristo —por pura gracia habéis sido salvados— y nos resucitó con él, y nos hizo sentar en los cielos con Cristo Jesús.
  versiculo:
  - - V
    - Este es el día en que actuó el Señor. Aleluia.
  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Dios nuestro, que en este día nos abriste las puertas de la vida por medio de tu Hijo, vencedor de la muerte, concédenos a todos los que celebramos su gloriosa resurrección que, por la nueva vida que tu Espíritu nos comunica, lleguemos también nosotros a resucitar a la luz de la vida eterna. Por Cristo nuestro Señor.
