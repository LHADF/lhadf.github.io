V Domingo del Tiempo Ordinario (A):
  himno: Cuando la luz del día está en su cumbre
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por Cristo nuestro Señor.
V Domingo del Tiempo Ordinario (B):
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por Cristo nuestro Señor.
V Domingo del Tiempo Ordinario (C):
  oracion: Señor, protege a tu pueblo con tu amor siempre fiel y, ya que sólo en ti hemos puesto nuestra esperanza, defiéndenos siempre con tu poder. Por Cristo nuestro Señor.
Miércoles de Ceniza:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Za 1, 3b-4b
    texto: 'Así dice el Señor de los ejércitos: «Convertíos a mí, y me convertiré a vosotros. No seáis como vuestros padres, a quienes predicaban los antiguos profetas: "Así dice el Señor: Convertíos de vuestra mala conducta y de vuestras malas obras", pero no me obedecieron.»'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: 'Al empezar esta Cuaresma, te pedimos, Señor, que nos des un verdadero espíritu de conversión: así la austeridad de la penitencia de estos días nos servirá de ayuda en nuestra lucha contra el espíritu del mal. Por Cristo nuestro Señor.'
Jueves después de Ceniza:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Dt 30, 2-3a
    texto: Si vuelves al Señor, tu Dios, si escuchas su voz en todo lo que yo te mando hoy, tú y tus hijos, con todo el corazón y con toda el alma, entonces el Señor, tu Dios, cambiará tu suerte y tendrá piedad de ti.
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Tu gracia, Señor, inspire nuestras acciones, las sostenga y acompañe, para que todo nuestro trabajo cuaresmal brote de ti, como una fuente, y a ti tienda, como a su fin. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (A):
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (B):
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
VI Domingo del Tiempo Ordinario (C):
  oracion: Oh Dios, has prometido permanecer con los rectos y sinceros de corazón; concédenos vivir de tal manera que merezcamos tenerte siempre con nosotros. Por Cristo nuestro Señor.
Viernes después de Ceniza:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Cf. Jr 3, 12b. 14a
    texto: «Volveos —oráculo del Señor—. No os pondré mala cara, porque soy compasivo y no me irrito para siempre. Volved, hijos rebeldes», oráculo del Señor.
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Te pedimos, Señor, que nos ayudes a continuar animosos estos días de penitencia que acabamos de empezar y que nuestras prácticas externas de penitencia estén siempre acompañadas por la sinceridad de un corazón que desea convertirse. Por Cristo nuestro Señor.
Sábado después de Ceniza:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Is 44, 21-22
    texto: 'Acuérdate de que eres mi siervo. Yo te formé, siervo mío eres, Israel, no te olvidaré. He disipado como niebla tus rebeliones, como nube tus pecados: vuelve a mí, que yo soy tu redentor.'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Dios todopoderoso y eterno, mira compasivo nuestra debilidad y extiende sobre nosotros tu mano para protegernos. Por Cristo nuestro Señor.
I Domingo de Cuaresma (A):
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
