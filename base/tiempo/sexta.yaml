    ref: Is 4, 3
    texto: 'A los que queden en Sión, a los restantes en Jerusalén, los llamarán santos: serán inscritos para vivir en Jerusalén.'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Dios nuestro, que te has dignado revelar al mundo el esplendor de tu gloria por medio del parto de la santísima Virgen María, concédenos venerar con fe íntegra y celebrar con sincero rendimiento el gran misterio de la encarnación de tu Hijo. Él, que vive y reina por los siglos de los siglos.
Viernes de la III semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Jr 30, 18
    texto: 'Esto dice el Señor: «Yo cambiaré la suerte de las tiendas de Jacob, me compadeceré de sus moradas.»'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Que tu gracia, Señor, nos prepare y nos acompañe siempre a los que esperamos anhelantes la venida de tu Hijo, a fin de que obtengamos los auxilios nicesarios para la vida presente y para llegar con felicidad a la futura. Por Cristo nuestro Señor.
