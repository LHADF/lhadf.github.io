  - - R
    - Sea él nuestra alegría y nuestro gozo. Aleluia.
  oracion: Señor Dios, cuya misericordia es eterna, tú que reanimas la fe de tu pueblo con la celebración anual de las fiestas pascuales, aumenta en nosotros los dones de tu gracia, para que comprendamos mejor la excelencia del bautismo que nos ha purificado, la grandeza del Espíritu que nos ha reengendrado y el precio de la sangre que nos ha redimido. Por Cristo nuestro Señor.
