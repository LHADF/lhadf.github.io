Epifanía del Señor:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: Cristo, cuando vino, anunció la buena nueva de la paz a los que estabais lejos y a los que estaban cerca.
  lectura:
    ref: Is 49, 6
    texto: 'El Señor me dijo: «Es poco que seas mi siervo para restablecer a las tribus de Jacob y hacer volver a los supervivientes de Israel; te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.»'
  versiculo:
  - - V
    - Los pueblos verán a tu Justo.
  - - R
    - Y los reyes de la tierra a tu Héroe.
  oracion: Señor, tú que manifestaste a tu Hijo en este día a todas las naciones por medio de una estrella, concédenos, a los que ya te conocemos por la fe, llegar a contemplar, cara a cara, la hermosura infinita de tu gloria. Por Cristo nuestro Señor.
