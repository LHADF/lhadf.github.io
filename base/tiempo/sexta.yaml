XVII Domingo del Tiempo Ordinario (A):
  oracion: Oh Dios, protector de los que en ti esperan, sin ti nada es fuerte ni santo; aumenta los signos de tu misericordia sobre nosotros, para que, bajo tu dirección, de tal modo nos sirvamos de las cosas pasajeras que por ellas alcancemos con mayor plenitud las eternas. Por Cristo nuestro Señor.
