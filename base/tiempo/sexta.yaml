Lunes de la IV semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Ez 18, 23
    texto: «¿Acaso quiero yo la muerte del malvado —oráculo del Señor— y no que se convierta de su conducta y que viva?»
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Dios nuestro, que renuevas el mundo por medio de sacramentos divinos, haz que tu Iglesia progrese por la celebración de estos sacramentos de vida eterna y no permitas que le falten nunca los auxilios necesarios para su vida terrena. Por Cristo nuestro Señor.
Martes de la IV semana de Cuaresma:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Jr 3, 25b
    texto: Pecamos contra el Señor, nuestro Dios, nosotros y nuestros padres, desde la juventud hasta el día de hoy, y no escuchamos la voz del Señor, nuestro Dios.
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor, que las saludables prácticas de la Cuaresma dispongan los corazones de tus hijos, para que celebren dignamente el misterio pascual y extiendan por todas partes el anuncio de tu salvación. Por Cristo nuestro Señor.
Miércoles de la IV semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Za 1, 3b-4b
    texto: 'Así dice el Señor de los ejércitos: «Convertíos a mí, y me convertiré a vosotros. No seáis como vuestros padres, a quienes predicaban los antiguos profetas: "Así dice el Señor: Convertíos de vuestra mala conducta y de vuestras malas obras", pero no me obedecieron.»'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor Dios, que premias los méritos de los justos y concedes el perdón a los pecadores que se arrepienten y hacen penitencia, escucha benignamente nuestras súplicas y, por la humilde confesión de nuestras culpas, otórganos tu perdón. Por Cristo nuestro Señor.
Jueves de la IV semana de Cuaresma:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Dt 30, 2-3a
    texto: Si vuelves al Señor, tu Dios, si escuchas su voz en todo lo que yo te mando hoy, tú y tus hijos, con todo el corazón y con toda el alma, entonces el Señor, tu Dios, cambiará tu suerte y tendrá piedad de ti.
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Padre lleno de amor, concédenos que, purificados por la penitencia y santificados por la práctica de buenas obras, sepamos mantenernos siempre fieles a tus mandamientos y lleguemos libres de culpa a las fiestas de la Pascua. Por Cristo nuestro Señor.
Viernes de la IV semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Cf. Jr 3, 12b. 14a
    texto: «Volveos —oráculo del Señor—. No os pondré mala cara, porque soy compasivo y no me irrito para siempre. Volved, hijos rebeldes», oráculo del Señor.
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor Dios, que nos proporcionas abundantemente los auxilios que necesita nuestra fragilidad, haz que recibamos con alegría la redención que nos otorgas y que la manifestemos a los demás con nuestra propia vida. Por Cristo nuestro Señor.
Lunes de la II semana de Cuaresma:
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Ez 18, 23
    texto: «¿Acaso quiero yo la muerte del malvado —oráculo del Señor— y no que se convierta de su conducta y que viva?»
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor, tu que para nuestro progreso espiritual nos mandas dominar nuestro cuerpo mediante la austeridad, ayúdanos a huir también de todo pecado y a entregarnos, con amor filial, al cumplimiento de tus mandatos. Por Cristo nuestro Señor.
Sábado de la IV semana de Cuaresma:
  himno: Jesús, contigo iremos al desierto
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: Is 44, 21-22
    texto: 'Acuérdate de que eres mi siervo. Yo te formé, siervo mío eres, Israel, no te olvidaré. He disipado como niebla tus rebeliones, como nube tus pecados: vuelve a mí, que yo soy tu redentor.'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Señor, que tu amor misericordioso dirija siempre nuestros deseos y actividades, pues sabemos que sin tu ayuda no podemos complacerte. Por Cristo nuestro Señor.
V Domingo de Cuaresma (A):
  himno: Por el pecado primero
  ant: «Por mi vida —dice el Señor—, no me complazco en la muerte del pecador, sino en que cambie de conducta y viva.»
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  versiculo:
  - - V
    - Aparta de mi pecado tu vista.
  - - R
    - Borra en mí toda culpa.
  oracion: Te pedimos, Señor, que enciendas nuestros corazones en aquel mismo amor con que tu Hijo ama al mundo y que lo impulsó a entregarse a la muerte por salvarlo. Por Cristo nuestro Señor.
