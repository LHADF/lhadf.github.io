    - Y los reyes de la tierra a tu Héroe.
  oracion: Te pedimos, Señor, que ilumines nuestros corazones con el esplendor de tu divinidad, para que podamos pasar a través de las tinieblas de este mundo y llegar a la patria de la eterna claridad. Por Cristo nuestro Señor.
