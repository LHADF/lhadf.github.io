  lectura:
    ref: Ez 34, 11-12
    texto: Yo mismo en persona buscaré mis ovejas, siguiendo su rastro. Como sigue el pastor el rastro de su rebaño cuando las ovejas se le dispersan, así seguiré yo el rastro de mis ovejas y las libraré, sacándolas de todos los lugares por donde se dispersaron.
