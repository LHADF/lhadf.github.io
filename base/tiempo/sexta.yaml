XII Domingo del Tiempo Ordinario (A):
  oracion: Concédenos vivir siempre, Señor, en el amor y respeto a tu santo nombre, porque jamás dejas de dirigir a quienes estableces en el sólido fundamento de tu amor. Por Cristo nuestro Señor.
