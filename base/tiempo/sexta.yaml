  himno: Este mundo del hombre, en que él se afana
  oracion: Señor, danos tu misericordia y atiende a las súplicas de tus hijos; concede la tranquilidad y la paz a los que nos gloriamos de tenerte como creador y como guía, y consérvalas en nosotros para siempre. Por Cristo nuestro Señor.
