Natividad del Señor:
  himno: Este mundo del hombre, en que él se afana
  ant: María conservaba todas estas cosas, meditándolas en su corazón.
  lectura:
    ref: 1Jn 4, 9
    texto: 'En esto se manifestó el amor que Dios nos tiene: en que Dios envió al mundo a su Hijo único para que vivamos por medio de él.'
  versiculo:
