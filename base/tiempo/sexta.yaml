Lunes de la I semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Cf. Is 10, 24. 27
    texto: 'Esto dice el Señor de los ejércitos: «Pueblo mío, que habitas en Sión, no temas.» Aquel día, la carga resbalará de tu hombro, arrancarán el yugo de tu cuello.'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Concédenos, Señor Dios nuestro, anhelar de tal manera la llegada de tu Hijo Jesucristo, que, cuando llame a nuestras puertas, nos encuentre velando en oración y cantando sus alabanzas. Por Cristo nuestro Señor.
Martes de la I semana de Adviento:
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Jr 23, 6
    texto: 'En sus días se salvará Judá, Israel habitará seguro. Y lo llamarán con este nombre: «El-Señor-nuestra-justicia.»'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Señor, Dios nuestro, acoge favorablemente nuestras súplicas y concédenos tu ayuda en las tribulaciones, para que, reanimados por la venida de tu Hijo, que ya se acerca, no volvamos a caer más en nuestras antiguas faltas. Por Cristo nuestro Señor.
Jueves de la I semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Ag 2, 7. 10
    texto: Todavía un poco más, y agitaré cielo y tierra, mar y continentes. La gloria de este segundo templo será mayor que la del primero y en este sitio daré la paz —oráculo del Señor de los ejércitos—.
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Muestra, Señor, tu poder y ven a socorrernos, para que la abundancia de tu misericordia nos alcance los bienes que nuestros pecados han retardado. Por Cristo nuestro Señor.
Miércoles de la I semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Is 12, 2
    texto: 'Él es mi Dios y salvador: confiaré y no temeré, porque mi fuerza y mi poder es el Señor, él fue mi salvación.'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Señor, Dios nuestro, prepara tú mismo nuestros corazones, para que, cuando venga tu Hijo Jesucristo, nos encuentre dignos del festín de la vida eterna y merezcamos ser invitados por él mismo a la mesa de su reino celestial. Por Cristo nuestro Señor.
Viernes de la I semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Jr 30, 18
    texto: 'Esto dice el Señor: «Yo cambiaré la suerte de las tiendas de Jacob, me compadeceré de sus moradas.»'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Muestra, Señor, tu poder y ven a nosotros, para que por tu protección nos veamos libres de los peligros que nos amenazan a causa de nuestros pecados. Por Cristo nuestro Señor.
Sábado de la I semana de Adviento:
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
  lectura:
    ref: Is 4, 3
    texto: 'A los que queden en Sión, a los restantes en Jerusalén, los llamarán santos: serán inscritos para vivir en Jerusalén.'
  versiculo:
  - - V
    - Acuérdate de nosotros, Señor, por amor a tu pueblo.
  - - R
    - Visítanos con tu salvación.
  oracion: Dios nuestro, que para librar al hombre de la antigua esclavitud del pecado enviaste a tu Hijo al mundo, concede a los que esperamos con devoción su venida la gracia de tu misericordia y el don de la verdadera libertad. Por Cristo nuestro Señor.
II Domingo de Adviento (A):
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
