  - - R
    - Visítanos con tu salvación.
  oracion: Señor, despierta en nuestros corazones el deseo de preparar la venida de tu Hijo, para que, cuando venga, podamos servirte libres de toda mancha. Por Cristo nuestro Señor.
Sábado de la II semana de Adviento:
  himno: Oh Señor, Dios eterno y bondadoso
  ant: 'El Ángel Gabriel saludó a María, diciendo: «Alégrate, llena de gracia, el Señor está contigo, bendita tú entre las mujeres.»'
