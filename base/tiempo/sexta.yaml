  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Señor Dios, que unes en un mismo sentir los corazones de los que te aman, impulsa a tu pueblo a amar lo que pides y a desear lo que prometes, para que, en medio de la inestabilidad de las cosas humanas, estén firmemente anclados nuestros corazones en el deseo de la verdadera felicidad. Por Cristo nuestro Señor.
Domingo de Pentecostés (A):
  himno: Cuando la luz del día está en su cumbre
  ant: Acrecienta, Señor, nuestra fe y, con el fuego de tu Espíritu, inflama nuestros corazones. Aleluia.
  lectura:
    ref: Tt 3, 5b-7
    texto: Dios nos trajo la salud mediante el baño bautismal de regeneración y renovación que obra el Espíritu Santo. Él derramó con toda profusión sobre nosotros este Espíritu por Cristo Jesús, nuestro Salvador. Así, justificados por la gracia de Cristo, hemos obtenido la esperanza de poseer en herencia la vida eterna.
  versiculo:
  - - V
    - El Espíritu Santo os enseñará. Aleluia.
  - - R
    - Todo lo que os he dicho. Aleluia.
  oracion: Dios todopoderoso, haz brillar sobre nosotros el resplandor de tu gloria, para que la claridad de tu luz fortalezca con la gracia del Espíritu Santo a los que, por tu bondad, hemos recibido en el bautismo una vida nueva. Por Cristo nuestro Señor.
