XI Domingo del Tiempo Ordinario (A):
  oracion: Oh Dios, fuerza de los que en ti esperan, escucha nuestras súplicas y, puesto que el hombre es frágil y sin ti nada puede, concédenos la ayuda de tu gracia, para observar tus mandamientos y agradarte con nuestros deseos y acciones. Por Cristo nuestro Señor.
