Sábado de la VII semana de Pascua:
  himno: Verbo de Dios, el sol de mediodía
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Co 15, 20-22
    texto: 'Cristo resucitó de entre los muertos: el primero de todos. Lo mismo que por un hombre hubo muerte, por otro hombre hay resurrección de los muertos. Y lo mismo que en Adán todos mueren, en Cristo todos serán llamados de nuevo a la vida.'
  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Concédenos, Dios todopoderoso, seguir siempre realizando en toda nuestra vida el espíritu de estas fiestas pascuales, que hemos celebrado. Por Cristo nuestro Señor.
Viernes de la V semana de Pascua:
  himno: Cuando la luz del día está en su cumbre
  ant: Aleluia, aleluia, aleluia.
