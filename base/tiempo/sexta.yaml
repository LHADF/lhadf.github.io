Miércoles después de la Epifanía:
  himno: Este mundo del hombre, en que él se afana
  ant: Cristo, cuando vino, anunció la buena nueva de la paz a los que estabais lejos y a los que estaban cerca.
  lectura:
    ref: Ap 21, 23-24
    texto: La ciudad santa de Jerusalén no necesita ni de sol ni de luna que la alumbren, porque la ilumina la gloria de Dios, y su lámpara es el Cordero. Las naciones caminarán a su luz, y los reyes de la tierra irán a llevarle su esplendor.
