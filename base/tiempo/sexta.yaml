    texto: En Cristo, en su cuerpo glorificado, habita toda la plenitud de la deidad; e, incorporados a él, alcanzáis también vosotros esa plenitud en él. Con Cristo fuisteis sepultados en el bautismo, y con él resucitasteis mediante la fe en el poder de Dios, que lo resucitó de entre los muertos.
  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Ayúdanos, Señor, Dios nuestro, con la fuerza del Espíritu Santo, para que podamos mantenernos fieles a tu voluntad y llevar una conducta digna de tu amor. Por Cristo nuestro Señor.
Martes de la VII semana de Pascua:
  himno: Verbo de Dios, el sol de mediodía
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Cf. 1Pe 3, 21-22a
    texto: A vosotros os salva el bautismo, el cual no es remoción de las manchas del cuerpo, sino la petición que hace a Dios una buena conciencia, en virtud de la resurrección de Jesucristo, que está a la diestra de Dios.
  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Dios omnipotente y misericordioso, te pedimos que nos envíes al Espíritu Santo para que habite en nosotros y nos transforme en templos de su gloria. Por Cristo nuestro Señor.
Miércoles de la VII semana de Pascua:
  himno: Cuando la luz del día está en su cumbre
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: 1Jn 5, 5-6a
    texto: ¿Quién es el que vence al mundo, sino el que cree que Jesús es el Hijo de Dios? Él, Jesucristo, vino por el agua y por la sangre; no con el agua solamente, sino con el agua y con la sangre.
  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Dios misericordioso, concede a tu Iglesia, congregada por el Espíritu Santo, que se entregue plenamente a ti y que viva siempre unificada por el amor, según tú se lo has mandado. Por Cristo nuestro Señor.
Jueves de la VII semana de Pascua:
  himno: Verbo de Dios, el sol de mediodía
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Tt 3, 5b-7
    texto: Dios nos trajo la salud mediante el baño bautismal de regeneración y renovación que obra el Espíritu Santo. Él derramó con toda profusión sobre nosotros este Espíritu por Cristo Jesús, nuestro salvador. Así, justificados por la gracia de Cristo, hemos obtenido la esperanza de poseer en herencia la vida eterna.
  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Tu Espíritu, Señor, infunda en nosotros la fuerza de sus dones, para que nuestros pensamientos te sean gratos y nuestra voluntad esté siempre sometida a la tuya. Por Cristo nuestro Señor.
Viernes de la VII semana de Pascua:
  himno: Cuando la luz del día está en su cumbre
  ant: Aleluia, aleluia, aleluia.
  lectura:
    ref: Ga 3, 27-28
    texto: 'Todos los que habéis sido bautizados en Cristo os habéis revestido de Cristo. Ya no hay distinción entre judío y gentil, ni entre libre y esclavo, ni entre hombre y mujer: todos sois uno en Cristo Jesús.'
  versiculo:
  - - V
    - Los discípulos se llenaron de alegría. Aleluia.
  - - R
    - Al ver al Señor. Aleluia.
  oracion: Dios nuestro, que nos has abierto las puertas de la eternidad con la glorificación de tu Hijo Jesucristo y con la venida del Espíritu Santo, concédenos que, por la recepción de dones tan grandes, nuestra fe vaya más y más en aumento y nuestra entrega a ti sea cada día más completa. Por Cristo nuestro Señor.
