# Himnos de Sexta en español, por primer verso.
Cuando la luz del día está en su cumbre:
- |-
  Cuando la luz del día está en su cumbre,
  eres, Señor Jesús, luz y alegría
  de quienes en la fe y en la esperanza
  celebran ya la fiesta de la Vida
- |-
  Eres resurrección, palabra y prenda
  de ser y de vivir eternamente;
  sembradas de esperanzas nuestras vidas,
  serán en ti cosecha para siempre.
- |-
  Ven ya, Señor Jesús, Salvador nuestro,
  de tu radiante luz llena este día,
  camino de alegría y de esperanza,
  cabal acontecer de nueva vida.
- |-
  Concédenos, oh Padre omnipotente,
  por tu Hijo Jesucristo, hermano nuestro,
  vivir ahora el fuego de tu Espíritu,
  haciendo de esta tierra un cielo nuevo. Amén.
El pan de cada día:
- |-
  El pan de cada día
  dánoslo hoy, Señor, a manos llenas;
  convierte en alegría
  nuestras labores buenas
  y acaricia el dolor de nuestras penas.
- |-
  ¡Horas de tedio largas
  sin la presencia buena de tus manos!
  ¡Ay, las horas amargas
  nos vuelven inhumanos,
  si no abrimos el alma a los hermanos!
- |-
  Santifica el momento
  de este ruido tenaz, de esta fatiga.
  Busquemos el aliento
  de tu presencia amiga
  que acreciente el esfuerzo y nos bendiga. Amén.
Este mundo del hombre en que él se afana:
- |-
  Este mundo del hombre en que él se afana
  tras la felicidad que tanto ansía,
  tú lo vistes, Señor, de luz temprana
  y de radiante sol al mediodía.
- |-
  Así el poder de tu presencia encierra
  el secreto más hondo de esta vida;
  un nuevo cielo y una nueva tierra
  colmarán nuestro anhelo sin medida.
- |-
  Poderoso Señor de nuestra historia,
  no tardes en venir gloriosamente;
  tu luz resplandeciente y tu victoria
  inunden nuestra vida eternamente. Amén.
Este mundo del hombre, en que él se afana:
- |-
  Este mundo del hombre, en que él se afana
  tras la felicidad que tanto ansía,
  tú lo vistes, Señor, de luz temprana
  y de radiante sol al mediodía.
- |-
  Así el poder de tu presencia encierra
  el secreto más hondo de esta vida;
  un nuevo cielo y una nueva tierra
  colmarán nuestro anhelo sin medida.
- |-
  Poderoso Señor de nuestra historia,
  no tardes en venir gloriosamente;
  tu luz resplandeciente y tu victoria
  inunden nuestra vida eternamente. Amén.
Jesús, contigo iremos al desierto:
- |-
  Jesús, contigo iremos al desierto
  en medio de la villa populosa,
  y tú nos brindarás el pan sabroso
  que alimentó tu alma silenciosa.
- |-
  Contigo pasaremos el mar Rojo,
  beberemos el agua de la roca;
  tú serás el pastor y, en la montaña,
  tú serás nuestra gracia esplendorosa.
- |-
  Contigo humildemente hasta el Calvario,
  contigo por la vía dolorosa,
  y al final, oh Jesús, por tu promesa,
  contigo viviremos en tu gloria. Amén.
La alegría de salvarse:
- |-
  La alegría de salvarse
  al pueblo fiel regocije;
  Jesús, redentor de todos,
  mató de la muerte al príncipe.
- |-
  La gente ramos de olivo
  y palmas doquier consigue:
  «De David hosanna al Hijo»
  con vivas voces repite.
- |-
  También nosotros corramos al
  encuentro del gran Príncipe,
  himnos cantando de gloria
  con palmas y gozo ilímite.
- |-
  Gloria a Dios Padre se dé,
  gloria al Hijo que en él vive,
  gloria al Espíritu Santo,
  por los siglos se le brinde. Amén.
Oh Señor, Dios eterno y bondadoso:
- |-
  Oh Señor, Dios eterno y bondadoso,
  tú diriges los tiempos y la vida;
  son por ti luminosas las mañanas,
  con tu sol das el fuego al mediodía.
- |-
  Que tu paz se derrame en nuestras almas
  y que apague el ardor de la discordia;
  que descansen los cuerpos fatigados,
  anhelando el reposo de tu gloria.
- |-
  Tu amistad danos, Padre omnipotente,
  sea Cristo la senda que sigamos,
  ilumine el Espíritu el desierto
  en que todos a ti peregrinamos. Amén.
Por el pecado primero:
- |-
  Por el pecado primero
  entró la muerte a la vida,
  y la muerte fue vencida
  por la vida del Cordero.
- |-
  El Padre lo hizo pecado
  para salvar al caído;
  el que nunca había sufrido
  se quiso crucificado.
- |-
  La humanidad pecadora
  está bien representada,
  mas la culpa fue lavada
  por la sangre redentora. Amén.
Te está cantando el martillo:
- |-
  Te está cantando el martillo
  y rueda en tu honor la rueda.
  Puede que la luz no pueda
  librar del humo su brillo.
  ¡Qué sudoroso y sencillo
  te pones a mediodía,
  Dios de esta dura porfía
  de estar sin pausa creando,
  y verte necesitando
  del hombre más cada día!
- |-
  Quien diga que Dios ha muerto
  que salga a la luz y vea
  si el mundo es o no tarea
  de un Dios que sigue despierto.
  Ya no es su sitio el desierto
  ni en la montaña se esconde;
  decid, si preguntan dónde,
  que Dios está -sin mortaja-
  en donde un hombre trabaja
  y un corazón le responde. Amén.
Verbo de Dios, el sol de mediodía:
- |-
  Verbo de Dios, el sol de mediodía,
  amable mensajero de tu rostro,
  fecunda nuestra tierra y la hermosea
  como fuente de luz, de vida y gozo.
- |-
  Más hermoso tu cuerpo, que es pleroma
  del infinito amor jamás gastado;
  y de ese mar sin fondo ni ribera
  la Iglesia es tu pleroma continuado.
- |-
  Verbo de Dios, que reinas sin fatiga,
  que emerges victorioso del trabajo,
  reina dichoso tú que nos esperas
  mientras nosotros vamos caminando. Amén.
¡Misterio en el Calvario:
- |-
  ¡Misterio en el Calvario,
  escándalo sangriento!:
  el Señor de la tierra
  esclavo en un madero.
- |-
  Víctima escarnecida,
  misterio y sacramento:
  el Señor de la gloria
  entre ladrones muerto.
- |-
  Tú sabes que los hombres
  ignoran lo que han hecho;
  mas tu perdón los cubre,
  Sacerdote y Cordero.
  ¡Misterio en el Calvario,
  escándalo sangriento!
- |-
  Al fin viene la hora
  que espera el universo:
  la cruz en él clavada
  y tu gracia al acecho.
  ¡Víctima escarnecida,
  misterio y sacramento!
- |-
  Tu sangre derramada
  floreció en el desierto.
  ¡Misterio del Calvario,
  escándalo sangriento!:
  la muerte muerta es vida
  clavada en un madero. Amén.
