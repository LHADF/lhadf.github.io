# Himnos de Vísperas en español, por primer verso.
Al caer de la tarde:
- |-
  Al caer de la tarde,
  toda la casa
  era aromas de vino
  y tierna hogaza.
  Mientras, la Madre
  era un ánfora llena
  de sus pesares.
- |-
  Al caer de la tarde,
  la Madre hilaba
  con aquellas sus manos
  de virgen casta.
  Mientras, el Niño
  soñaba que soñaba
  lirios y espinos.
- |-
  Al caer de la tarde,
  en el silencio,
  aserraban las sierras
  del carpintero.
  José pensaba
  que era el padre dichoso
  de la Palabra.
- |-
  Al caer de la tarde,
  Señor, atiende
  la amargura infinita
  que el mundo tiene.
  Colma el vacío
  de esta familia humana
  sin tu cariño. Amén.
Al cielo vais, Señora:
- |-
  Al cielo vais, Señora,
  allá os reciben con alegre canto;
  ¡oh, quién pudiera ahora
  asirse a vuestro manto
  para subir con vos al monte santo!
- |-
  De ángeles sois llevada,
  de quien servida sois desde la cuna,
  de estrellas coronada,
  cual reina habrá ninguna,
  pues os calza los pies la blanca luna.
- |-
  Volved los linces ojos,
  ave preciosa, sola humilde y nueva,
  al val de los abrojos
  que tales flores lleva,
  do suspirando están los hijos de Eva.
- |-
  Que, si con clara vista
  miráis las tristes almas de este suelo,
  con propiedad no vista
  las subiréis de vuelo,
  como perfecta piedra imán al cielo. Amén.
Al fin será la paz y la corona:
- |-
  Al fin será la paz y la corona,
  los vítores, las palmas sacudidas,
  y un aleluia inmenso como el cielo
  para cantar la gloria del Mesías.
- |-
  Será el estrecho abrazo de los hombres,
  sin muerte, sin pecado, sin envidia;
  será el amor perfecto del encuentro,
  será como quien llora de alegría.
- |-
  Porque hoy remonta el vuelo el sepultado
  y va por el sendero de la vida
  a saciarse de gozo junto al Padre
  y a preparar la mesa de familia.
- |-
  Se fue, pero volvía, se mostraba,
  lo abrazaban, hablaba, compartía;
  y escondido la Iglesia lo contempla,
  lo adora más presente todavía.
- |-
  Hundimos en sus ojos la mirada,
  y ya es nuestra la historia que principia,
  nuestros son los laureles de su frente,
  aunque un día le dimos las espinas.
- |-
  Que el tiempo y el espacio limitados
  sumisos al Espíritu se rindan,
  y dejen paso a Cristo omnipotente,
  a quien gozoso el mundo glorifica. Amén.
Alta ciudad de piedras vivas:
- |-
  Alta ciudad de piedras vivas,
  Jerusalén;
  visión de paz y cielos nuevos,
  ciudad del Rey.
- |-
  Tus puertas se abren jubilosas,
  visión de paz,
  y penetran los ríos de tus santos
  hasta el altar.
- |-
  Baluartes y murallas de oro,
  Jerusalén;
  tus calles, gemas y zafiros,
  ciudad del Rey.
- |-
  Jerusalén, Iglesia viva
  de eternidad;
  hacia ti caminan los hombres,
  sin descansar.
- |-
  Alta ciudad del Cristo vivo,
  que es nuestro hogar,
  al que volveremos, ya cansados
  de caminar.
- |-
  Cielos nuevos y tierra nueva,
  Jerusalén;
  morada de Dios Trino y Uno.
  Amén, amén.
Aplaudan a esta Rosa:
- |-
  Aplaudan a esta Rosa
  las rosas de la tierra;
  resuene su alabanza
  del sol a las estrellas.
- |-
  Una Rosa de gracia
  en un rosal de penas;
  por las culpas del mundo
  hirió su carne tierna.
- |-
  Roja Rosa del cielo,
  virgen Rosa limeña:
  un puñado de gozo
  y un haz de penitencias.
- |-
  Danos, Padre, el perfume
  de esta Rosa pequeña;
  que su rocío fecunde
  estas tierras de América. Amén.
Brazos rígidos y yertos:
- |-
  Brazos rígidos y yertos,
  por dos garfios traspasados,
  que aquí estáis, por mis pecados,
  para recibirme abiertos,
  para esperarme clavados.
- |-
  Cuerpo llagado de amores,
  yo te adoro y yo te sigo;
  yo, Señor de los señores,
  quiero partir tus dolores
  subiendo a la cruz contigo.
- |-
  Quiero en la vida seguirte
  y por sus caminos irte
  alabando y bendiciendo,
  y bendecirte sufriendo
  y muriendo bendecirte.
- |-
  Que no ame la poquedad
  de cosas que van y vienen;
  que adore la austeridad
  de estos sentires que tienen
  sabores de eternidad;
- |-
  que sienta una dulce herida
  de ansia de amor desmedida;
  que ame tu ciencia y tu luz;
  que vaya, en fin, por la vida
  como tú estás en la cruz:
- |-
  de sangre los pies cubiertos,
  llagadas de amor las manos,
  los ojos al mundo muertos
  y los dos brazos abiertos
  para todos mis hermanos. Amén.
Brille la cruz del Verbo, luminosa:
- |-
  Brille la cruz del Verbo, luminosa,
  brille como la carne sacratísima
  de aquel Jesús nacido de la Virgen
  que en la gloria del Padre vive y brilla.
- |-
  Gemía Adán doliente y conturbado,
  lágrimas Eva junto a Adán vertía;
  brillen sus rostros por la cruz gloriosa,
  cruz que se enciende cuando el Verbo expira.
- |-
  ¡Salve, cruz de los montes y caminos,
  junto al enfermo suave medicina,
  regio trono de Cristo en las familias,
  cruz de nuestra fe, salve cruz bendita!
- |-
  Reine el Señor crucificado,
  levantando la cruz donde moría;
  nuestros enfermos ojos buscan luz,
  nuestros labios el río de la vida.
- |-
  Te adoramos, oh cruz que fabricamos
  pecadores con manos deicidas;
  te adoramos, ornato del Señor,
  sacramento de nuestra eterna dicha. Amén.
Cabeza y Cuerpo, Cristo forma un todo:
- |-
  Cabeza y Cuerpo, Cristo forma un todo,
  Hijo de Dios e Hijo de María:
  un Hijo en quien se juntan muchos hijos:
  en su Madre ya la Iglesia se perfila.
- |-
  Una y otra son madres y son vírgenes,
  una y otra conciben del Espíritu,
  una y otra sin mancha ni pecado,
  al Padre celestial engendran hijos.
- |-
  María le da al Cuerpo la Cabeza,
  la Iglesia a la Cabeza le da el Cuerpo:
  una y otra son madre del Señor,
  ninguna sin la otra por entero.
- |-
  Gloria a la Trinidad inaccesible
  que ha querido morar entre nosotros,
  en María, en la Iglesia, en nuestra alma,
  para llenarnos de su eterno gozo. Amén.
Calor de Dios en sangre redentora:
- |-
  Calor de Dios en sangre redentora,
  y un río de piedad en tu costado;
  bajo tu cruz quédeme arrodillado,
  con ansia y gratitud siempre deudora.
- |-
  Conózcate, oh Cristo, en esta hora
  de tu perdón; mi beso apasionado,
  de ardientes labios en tu pie clavado,
  sea flecha de amor y paz de aurora.
- |-
  Conózcame en tu vía dolorosa
  y conozca, Señor, en los fulgores
  de tus siete palabras, mi caída;
- |-
  que en esta cruz pujante y misteriosa
  pongo, sobre el amor de mis amores,
  el amor entrañable de mi vida. Amén.
Cantad y alabad al Señor:
- |-
  Cantad y alabad al Señor,
  él nos ha dicho su nombre:
  Padre y Señor para el hombre.
  Vida, esperanza y amor.
- |-
  Cantad y alabad al Señor,
  Hijo del Padre, hecho hombre:
  Cristo Señor es su nombre.
  Vida, esperanza y amor.
- |-
  Cantad y alabad al Señor,
  divino don para el hombre:
  Santo Espíritu es su nombre.
  Vida, esperanza y amor.
- |-
  Cantad y alabad al Señor,
  él es fiel y nos llama,
  él nos espera y nos ama.
  Vida, esperanza y amor. Amén.
Cantarán, llorarán razas y hombres:
- |-
  Cantarán, llorarán razas y hombres,
  buscarán la esperanza en el dolor,
  el secreto de vida es ya presente:
  resucitó el Señor.
- |-
  Dejarán de llorar los que lloraban,
  brillará en su mirar la luz del sol,
  ya la causa del hombre está ganada:
  resucitó el Señor.
- |-
  Volverán entre cánticos alegres
  los que fueron llorando a su labor,
  traerán en sus brazos la cosecha:
  resucitó el Señor.
- |-
  Cantarán a Dios Padre eternamente
  la alabanza de gracias por su don,
  en Jesús ha brillado su Amor santo:
  resucitó el Señor. Amén.
Cante tu gloria célica armonía:
- |-
  Cante tu gloria célica armonía,
  tú que compartes con la siempre pura
  la misteriosa genealogía
  de la Escritura.
- |-
  Esposo virgen de la Virgen Madre,
  en quien Dios mismo declinó su oficio;
  réplica humilde del eterno Padre,
  padre nutricio.
- |-
  último anillo de las profecías,
  ¡oh patriarca de la nueva alianza!,
  entre tus brazos se acunó el Mesías,
  nuestra esperanza.
- |-
  Guarda a la Iglesia de quien fue figura
  la inmaculada y maternal María;
  guárdala intacta, firme y con ternura
  de eucaristía.
- |-
  Gloria a Dios Padre que en tu amor descuida
  gloria a Dios Hijo que te fue confiado,
  gloria al Espíritu que alentó tu vida
  para el Amado. Amén.
Cantemos al Señor con alegría:
- |-
  Cantemos al Señor con alegría,
  unidos a la voz del pastor santo;
  demos gracias a Dios, que es luz y guía,
  solícito pastor de su rebaño.
- |-
  Es su voz y su amor el que nos llama
  en la voz del pastor que él ha elegido,
  es su amor infinito el que nos ama
  en la entrega y amor de este otro cristo.
- |-
  Conociendo en la fe su fiel presencia,
  hambrientos de verdad y luz divina,
  sigamos al pastor que es providencia
  de pastos abundantes que son vida.
- |-
  Apacienta, Señor, guarda a tus hijos,
  manda siempre a tu mies trabajadores;
  cada aurora, a la puerta del aprisco,
  nos aguarde el amor de tus pastores. Amén.
Clara, virgen amable:
- |-
  Clara, virgen amable,
  esposa enamorada,
  dulce nos es tu nombre,
  muy suave tu fragancia.
- |-
  El gozo de la cruz
  danos, benigna hermana;
  danos tu amor castísimo
  y la pobreza santa.
- |-
  Gloria al hijo doliente
  en la cruz levantada;
  gloria a Jesús excelso
  en la paz de la patria. Amén.
Como el niño que no sabe dormirse:
- |-
  Como el niño que no sabe dormirse
  sin cogerse a la mano de su madre,
  así mi corazón viene a ponerse
  sobre tus manos, al caer la tarde.
- |-
  Como el niño que sabe que alguien vela
  su sueño de inocencia y esperanza,
  así descansará mi alma segura
  sabiendo que eres tú quien nos aguarda.
- |-
  Tú endulzarás mi última amargura,
  tú aliviarás el último cansancio,
  tú cuidarás los sueños de la noche,
  tú borrarás las huellas de mi llanto.
- |-
  Tú nos darás mañana nuevamente
  la antorcha de la luz y la alegría,
  y, por las horas que te traigo muertas,
  tú me darás una mañana viva. Amén.
Cristo, el Señor:
- |-
  Cristo, el Señor,
  como la primavera,
  como una nueva aurora,
  resucitó.
- |-
  Cristo, nuestra Pascua,
  es nuestro rescate,
  nuestra salvación.
- |-
  Es grano en la tierra,
  muerto y florecido,
  tierno pan de amor.
- |-
  Se rompió el sepulcro,
  se movió la roca,
  y el fruto brotó.
- |-
  Dueño de la muerte,
  en el árbol grita
  su resurrección.
- |-
  Humilde en la tierra,
  Señor de los cielos,
  su cielo nos dio.
- |-
  Ábranse de gozo
  las puertas del Hombre,
  que al hombre salvó.
- |-
  Gloria para siempre
  al Cordero humilde
  que nos redimió. Amén.
Cuando la luz se hace vaga:
- |-
  Cuando la luz se hace vaga
  y está cayendo la tarde,
  venimos a ti, Señor,
  para cantar tus bondades.
- |-
  Los pájaros se despiden
  piadosamente en los árboles,
  y buscan calor de nido
  y blandura de plumajes.
- |-
  Así vuelven fatigados
  los hombres a sus hogares,
  cargando sus ilusiones
  o escondiendo sus maldades.
- |-
  Quieren olvidar la máquina,
  olvidar sus vanidades;
  descansar de tanto ruido
  y morir a sus pesares.
- |-
  Ya todo pide silencio,
  se anuncia la noche amable:
  convierte, Padre, sus penas
  en abundancia de panes.
- |-
  Alivie tu mano pródiga,
  tu mano buena de Padre,
  el cansancio de sus cuerpos,
  sus codicias y sus males. Amén.
Cuando, Señor, el día ya declina:
- |-
  Cuando, Señor, el día ya declina,
  quedaos con el hombre, que, en la noche
  del tiempo y de la lucha en que camina,
  turba su corazón con su reproche.
- |-
  Disipad nuestras dudas, hombres santos,
  que en el alto glorioso del camino
  ya dejasteis atrás temores tantos
  de perder vuestra fe en el Don divino.
- |-
  Perdonad nuestros miedos, seguidores
  del camino en la fe que os fue ofrecido,
  hacednos con vosotros confesores
  de la fe y del amor que habéis vivido.
- |-
  Que tu amor, Padre santo, haga fuerte
  nuestro amor, nuestra fe en tu Hijo amado;
  que la hora suprema de la muerte
  sea encuentro en la luz, don consumado. Amén.
De hermosas contradicciones:
- |-
  De hermosas contradicciones
  te vemos, Reina, adornada,
  muy mujer para divina,
  muy celestial para humana.
- |-
  Con admiración, en ella
  se ve la ley derogada,
  muy humilde para Reina,
  muy exenta para esclava.
- |-
  Por su caudillo la tienen
  las celestiales escuadras,
  para combatir muy tierna,
  para niña muy armada.
- |-
  La dignidad de que goza
  con su modestia batalla,
  para mandar muy pequeña,
  para humillarse muy alta.
- |-
  Une en sus divinos ojos
  al temor la confianza,
  muy terrible para hermosa,
  para espantar muy amada.
- |-
  Colocada en el empíreo,
  en la celestial morada,
  corto solio a su grandeza,
  a su humildad mucho alcázar. Amén.
De una Virgen hermosa:
- |-
  De una Virgen hermosa
  celos tiene el sol,
  porque vio en sus brazos
  otro Sol mayor.
- |-
  Cuando del oriente
  salió el sol dorado,
  y otro Sol helado
  miró tan ardiente,
  quitó de la frente
  la corona bella,
  y a los pies de la Estrella
  su lumbre adoró,
  porque vio en sus brazos
  otro Sol mayor.
- |-
  «Hermosa María
  —dice el sol, vencido—,
  de vos ha nacido
  el Sol que podía
  dar al mundo el día
  que ha deseado.»
  Esto dijo, humillado,
  a María el sol,
  porque vio en sus brazos
  otro Sol mayor.
- |-
  Al Padre y al Hijo
  gloria y bendición,
  y al Espíritu Santo
  por los siglos honor. Amén.
Dichosa tú, que, entre todas:
- |-
  Dichosa tú, que, entre todas,
  fuiste por Dios sorprendida
  con tu lámpara encendida
  para el banquete de bodas.
- |-
  Con el abrazo inocente
  de un hondo pacto amoroso,
  vienes a unirte al Esposo
  por virgen y por prudente.
- |-
  Enséñanos a vivir,
  ayúdenos tu oración,
  danos en la tentación
  la gracia de resistir.
- |-
  Honor a la Trinidad
  por esta limpia victoria,
  y gloria por esta gloria
  que alegra a la humanidad. Amén.
Dios de la luz, presencia ardiente:
- |-
  Dios de la luz, presencia ardiente
  sin meridiano ni frontera:
  vuelves la noche mediodía,
  ciegas al sol con tu derecha.
- |-
  Como columna de la aurora,
  iba en la noche tu grandeza;
  te vio el desierto, y destellaron
  luz de tu gloria las arenas.
- |-
  Cerró la noche sobre Egipto
  como cilicio de tinieblas;
  para tu pueblo amanecías
  bajo los techos de las tiendas.
- |-
  Eres la luz, pero en tu rayo
  lanzas el día o la tiniebla:
  ciegas los ojos del soberbio,
  curas al pobre su ceguera.
- |-
  Cristo Jesús, tú que trajiste
  fuego a la entraña de la tierra,
  guarda encendida nuestra lámpara
  hasta la aurora de tu vuelta. Amén.
El cielo se maravilla:
- |-
  El cielo se maravilla,
  Virgen, viendo como a vos
  junto a sí os ha dado Dios
  la más eminente silla.
- |-
  Sobre los altos confines
  del más levantado cielo
  subisteis, Virgen, del suelo
  en hombros de serafines.
- |-
  Y mucho se maravilla
  el cielo de ver que a vos
  junto a sí os ha dado Dios
  la más eminente silla.
- |-
  ¡Oh Dios, quién supiera ahora
  significar la alegría
  que todo el cielo tendría
  con su nueva emperadora!
- |-
  Ángeles podrán decilla,
  Virgen, y lo que con vos
  hizo vuestro hijo y Dios
  cuando os dio tan alta silla. Amén.
El mal se destierra:
- |-
  El mal se destierra,
  ya vino el consuelo:
  Dios está en la tierra,
  ya la tierra es cielo.
- |-
  Ya el mundo es trasunto
  del eterno bien,
  pues está en Belén
  todo el cielo junto.
- |-
  Ya no habrá más guerra
  entre cielo y suelo:
  Dios está en la tierra,
  ya la tierra es cielo.
- |-
  Ya baja a ser hombre
  porque suba yo,
  ya están hombre y Dios
  en un solo nombre.
- |-
  Ya el hombre no tiene
  sueños de grandeza,
  porque el Dios que viene
  viene en la pobreza.
- |-
  Ya nadie se encierra
  en su propio miedo:
  Dios está en la tierra,
  ya la tierra es cielo. Amén.
En la Cena del Cordero:
- |-
  En la Cena del Cordero
  y habiendo ya cenado,
  acabada la figura,
  comenzó lo figurado.
- |-
  Por mostrar Dios a los suyos
  cómo está de amor llagado,
  todas las mercedes juntas
  en una las ha cifrado.
- |-
  Pan y vino material
  en sus manos ha tomado
  y, en lugar de pan y vino,
  cuerpo y sangre les ha dado.
- |-
  Si un bocado nos dio muerte,
  la vida se da en bocado;
  si el pecado dio el veneno,
  el remedio Dios lo ha dado.
- |-
  Haga fiesta el cielo y tierra
  y alégrese lo criado,
  pues Dios, no cabiendo en ello,
  en mi alma se ha encerrado. Amén.
En la cumbre de la Verna:
- |-
  En la cumbre de la Verna
  se han dado cita de amor
  el siervo con su Señor
  unidos en Pascua eterna.
- |-
  Del cielo el Señor venía,
  Hijo de Dios humanado,
  tenía el cuerpo llagado
  y el rostro resplandecía.
- |-
  ¡Oh Jesús, el mas hermoso
  entre los hijos de Adán,
  libres tus brazos están
  para el abrazo de esposo!
- |-
  Y Francisco se ha quedado
  de gracia y amor transido;
  por Cristo se encuentra herido
  en manos, pies y costado.
- |-
  Ved la Regla ya cumplida
  en el monte de la alianza;
  amor que la sangre alcanza
  es de aquel que da la vida.
- |-
  ¡Gloria a ti, Cristo benigno,
  en el precioso madero;
  para el gozo verdadero
  guárdanos bajo tu signo! Amén.
En la cumbre del monte:
- |-
  En la cumbre del monte,
  su cuerpo de barro
  se vistió de soles.
- |-
  En la cumbre del monte,
  su veste de nieve
  se cuajó de flores.
- |-
  En la cumbre del monte,
  excelso misterio:
  Cristo, Dios y hombre.
- |-
  En la cumbre del monte,
  a la fe se abrieron
  nuestros corazones. Amén.
Enfría, Señor, mi boca:
- |-
  Enfría, Señor, mi boca;
  Señor, reduce mi brasa;
  dame, como te lo pido,
  concordia de cuerpo y alma.
- |-
  Frente al perverso oleaje,
  ponme costado de gracia;
  dame, como te demando,
  concordia de cuerpo y alma.
- |-
  Señor, mitiga mi angustia;
  remite, Señor, mi ansia;
  dame, como te la clamo,
  concordia de cuerpo y alma.
- |-
  No dejes que los sentidos
  me rindan en la batalla;
  Señor, Señor, no me niegues
  concordia de cuerpo y alma. Amén.
Entonad un canto:
- |-
  Entonad un canto
  con voz celestial:
  «Dios niño ha nacido
  pobre en un portal.»
- |-
  Anúnciale el ángel
  la nueva al pastor,
  que niño ha nacido
  nuestro Salvador.
- |-
  Adoran pastores
  en sombras al Sol,
  que niño ha nacido,
  de una Virgen, Dios.
- |-
  Haciéndose hombre,
  al hombre salvó;
  un niño ha nacido,
  ha nacido Dios. Amén.
Envía Cristo a tu valiente jefe:
- |-
  Envía Cristo a tu valiente jefe,
  al ángel de la paz, a san Miguel,
  y crecerá tu pueblo, con su ayuda,
  próspero y fiel.
- |-
  Visite siempre nuestro sacro templo
  el ángel fuerte, el singular Gabriel,
  y arroje fuera al enemigo antiguo,
  falso luzbel.
- |-
  Envía al ángel que a tu pueblo sana;
  manda, oh Cristo, del cielo a Rafael,
  que acompañe a tu pueblo peregrino,
  nuevo Israel.
- |-
  Nos asistan tus ángeles gloriosos,
  Cristo, gloria del coro angelical,
  y con ellos cantemos al Dios trino
  himno triunfal. Amén.
Eres la luz y siembras claridades:
- |-
  Eres la luz y siembras claridades,
  eres amor y siembras armonía
  desde tu eternidad de eternidades.
- |-
  Por tu roja frescura de alegría,
  la tierra se estremece de rocío,
  Hijo eterno del Padre y de María.
- |-
  En el cielo del hombre, oscuro y frío,
  eres la luz total, fuego del fuego,
  que aplaca las pasiones y el hastío.
- |-
  Entro en tus esplendores, Cristo, ciego;
  mientras corre la vida paso a paso,
  pongo mis horas grises en tu brazo,
  y a ti, Señor, mi corazón entrego. Amén.
Es la Pascua real, no ya la sombra:
- |-
  Es la Pascua real, no ya la sombra,
  la verdadera pascua del Señor;
  la sangre del pasado es solo un signo,
  la mera imagen de la gran unción.
- |-
  En verdad, tú, Jesús, nos protegiste
  con tus sangrientas manos paternales;
  envolviendo en tus alas nuestras almas,
  la verdadera alianza tú sellaste.
- |-
  Y, en tu triunfo, llevaste a nuestra carne
  reconciliada con tu Padre eterno;
  y, desde arriba, vienes a llevarnos
  a la danza festiva de tu cielo.
- |-
  Oh gozo universal, Dios se hizo hombre
  para unir a los hombres con su Dios;
  se rompen las cadenas del infierno,
  y en los labios renace la canción.
- |-
  Cristo, Rey eterno, te pedimos
  que guardes con tus manos a tu Iglesia,
  que protejas y ayudes a tu pueblo
  y que venzas con él a las tinieblas. Amén.
Escucha, casa de David:
- |-
  Escucha, casa de David:
  La Virgen pura se halla encinta;
  Dios la acaricia y la fecunda
  y la hace Madre de la vida.
- |-
  La Virgen grávida nos lleva
  en el secreto de su dicha;
  la Virgen fiel nos abre ruta
  por su obediencia de discípula.
- |-
  Espera en calma la agraciada,
  con ella el mundo se arrodilla;
  levanta el pobre la mirada,
  con ella pide la venida.
- |-
  Nacido en tiempos sin aurora,
  el Hijo espera con María.
  ¡Oh Dios de amor, nuestra esperanza,
  cambia tu espera en parusía!
- |-
  ¡A ti, Jesús, Hijo esperado,
  aparecido en nuestros días,
  con santo júbilo cantamos!
  ¡Ven en tu reino, ven de prisa! Amén.
Espíritus sublimes:
- |-
  Espíritus sublimes,
  ¡oh mártires gloriosos!,
  felices moradores
  de la inmortal Sión,
  rogad por los que luchan
  en las batallas recias,
  que alcancen la victoria
  y eterno galardón.
- |-
  ¡Oh mártires gloriosos
  de rojas vestiduras,
  que brillan con eternos
  fulgores ante Dios!
  Con vuestro riego crezca
  de Cristo la semilla,
  y el campo de las mieses
  se cubra ya en sazón. Amén.
Este mundo es el camino:
- |-
  Este mundo es el camino
  para el otro, que es morada
  sin pesar;
  mas cumple tener buen tino
  para andar esta jornada
  sin errar.
  Partimos cuando nacemos,
  andamos mientras vivimos,
  y llegamos
  al tiempo que fenecemos;
  así que cuando morimos
  descansamos.
- |-
  Este mundo bueno fue
  si bien usásemos de él
  como debemos,
  porque, según nuestra fe,
  es para ganar aquel
  que atendemos;
  y aun aquel Hijo de Dios,
  para subirnos al cielo,
  descendió
  a nacer acá entre nos,
  y a vivir en este suelo
  do murió. Amén
Excelsa Reina de vírgenes:
- |-
  Excelsa Reina de vírgenes,
  de Dios Madre virginal,
  puerta y dulzura del cielo,
  esperanza del mortal.
- |-
  Cándida flor entre espinas,
  paloma de luz solar,
  nacida de nuestra estirpe
  donas medicina al mal.
- |-
  Alcázar inexpugnable,
  fúlgida estrella del mar,
  desbarata los ardides,
  guíenos tu claridad.
- |-
  Sola inmaculada brillas
  sin mancha original,
  y triunfas de la serpiente
  y su veneno letal.
- |-
  Disipa sombras de errores,
  aleja escollo fatal,
  y el que fluctúa extraviado
  halle en ti seguridad.
- |-
  Se tribute excelsa gloria
  a la augusta Trinidad
  que te embelleció de gracias
  y santidad singular. Amén.
Felipe santo:
- |-
  Felipe santo,
  Felipe higuera,
  Felipe, signo
  de nuestra América.
- |-
  Haznos apóstoles,
  de Dios profetas,
  casta de príncipes,
  vívidas piedras.
- |-
  Cuando tú subes
  la dura cuesta
  de la esperanza,
  la cruz te espera.
- |-
  Amado. Amada.
  Los dos se estrechan
  en un abrazo
  y en una entrega.
- |-
  La muerte muere
  de muerte negra
  cuando tu sangre
  moja la tierra.
- |-
  Porque otra llama
  tu sangre quema,
  triunfas perdiendo,
  callando enseñas.
- |-
  Eternos himnos
  por tu proeza
  México entone,
  de Dios poeta.
- |-
  Gloria sea al Padre
  y al Hijo sea,
  en el Espíritu,
  laude perfecta. Amén.
Feliz quien ha escuchado la llamada:
- |-
  Feliz quien ha escuchado la llamada
  al pleno seguimiento del Maestro,
  feliz porque él, con su mirada,
  lo eligió como amigo y compañero.
- |-
  Feliz el que ha abrazado la pobreza
  para llenar de Dios su vida toda,
  para servirlo a él con fortaleza,
  con gozo y con amor a todas horas.
- |-
  Feliz el mensajero de verdades
  que marcha por caminos de la tierra,
  predicando bondad contra maldades,
  pregonando la paz contra las guerras. Amén.
Felíz quién ha escuchado la llamada:
- |-
  Felíz quién ha escuchado la llamada
  al pleno seguimiento del Maestro,
  feliz porque él, con su mirada,
  lo eligió como amigo y compañero.
- |-
  Feliz el que ha abrazado la pobreza
  para llenar de Dios su vida toda,
  para servirlo a él con fortaleza,
  con gozo y con amor a todas horas.
- |-
  Feliz el mensajero de verdades
  que marcha por caminos de la tierra,
  predicando bondad contra maldades,
  pregonando la paz contra las guerras. Amén.
'Hacedor de la luz: tú que creaste':
- |-
  Hacedor de la luz: tú que creaste
  la que brilla en los días de este suelo,
  y que, mediante sus primeros rayos,
  diste principio al universo entero.
- |-
  Tú que nos ordenaste llamar día
  al tiempo entre la aurora y el ocaso,
  ahora que la noche se aproxima
  oye nuestra oración y nuestro llanto.
- |-
  Que cargados con todas nuestras culpas
  no perdamos el don de la otra vida,
  al no pensar en nada duradero
  y al continuar pecando todavía.
- |-
  Haz que, evitando todo lo dañoso
  y a cubierto de todo lo perverso,
  empujemos las puertas celestiales
  y arrebatemos el eterno premio.
- |-
  Escucha nuestra voz, piadoso Padre,
  que junto con tu Hijo Jesucristo
  y con el Santo Espíritu Paráclito,
  reinas y reinarás en todo siglo. Amén.
Heme, Señor, a tus divinas plantas:
- |-
  Heme, Señor, a tus divinas plantas,
  baja la frente y de rubor cubierta,
  porque mis culpas son tales y tantas,
  que tengo miedo a tus miradas santas
  y el pecho mío a respirar no acierta.
- |-
  Mas ¡ay!, que renunciar la lumbre hermosa
  de esos divinos regalados ojos
  es condenarme a noche tenebrosa;
  y esa noche es horrible, es espantosa
  para el que gime ante tus pies de hinojos.
- |-
  Dame licencia ya, Padre adorado,
  para mirarte y moderar mi miedo;
  mas no te muestres de esplendor cercado;
  muéstrate, Padre mío, en cruz clavado,
  porque sólo en la cruz mirarte puedo. Amén.
Hermanos, Dios ha nacido:
- |-
  Hermanos, Dios ha nacido
  sobre un pesebre. Aleluia.
  Hermanos, cantad conmigo:
  «Gloria a Dios en las alturas.»
- |-
  Desde su cielo ha traído
  mil alas hasta su cuna.
  Hermanos, cantad conmigo:
  «Gloria a Dios en las alturas.»
- |-
  Hoy mueren todos los odios
  y renacen las ternuras.
  Hermanos, cantad conmigo:
  «Gloria a Dios en las alturas.»
- |-
  El corazón más perdido
  ya sabe que alguien le busca.
  Hermanos, cantad conmigo:
  «Gloria a Dios en las alturas.»
- |-
  El cielo ya no está solo,
  la tierra ya no está a oscuras.
  Hermanos, cantad conmigo:
  «Gloria a Dios en las alturas.» Amén.
Hora de la tarde:
- |-
  Hora de la tarde,
  fin de las labores.
  Amo de las viñas,
  paga los trabajos
  de tus viñadores.
- |-
  Al romper el día
  nos apalabraste.
  Cuidamos tu viña
  del alba a la tarde.
- |-
  Ahora que nos pagas,
  nos lo das de balde,
  que a jornal de gloria
  no hay trabajo grande.
- |-
  Das al de la tarde
  lo que al mañanero.
  Son tuyas las horas
  y tuyo el viñedo.
- |-
  A lo que sembramos
  dale crecimiento.
  Tú que eres la viña,
  cuida los sarmientos. Amén.
Hoy el Verbo sacrosanto:
- |-
  Hoy el Verbo sacrosanto
  nace en carne, por tener
  en qué poder padecer
  por el hombre que ama tanto.
- |-
  Es condición ciertamente
  propia del enamorado,
  padecer por el amado
  trabajos ganosamente.
- |-
  Por esto, pues, Cristo santo
  nace en carne, por tener
  en qué poder padecer
  por el hombre que ama tanto.
- |-
  Nace en carne el Redentor
  pasible, porque sin falta
  la prueba de amor más alta
  es padecer por amor.
- |-
  Y, porque se entienda cuánto
  nos ha venido a querer,
  nace para padecer
  por el hombre que ama tanto.
- |-
  Qué grande misterio encierra
  Belén; cantadle, criaturas:
  «Gloria a Dios en las alturas
  y paz al hombre en la tierra.» Amén.
Hoy es del divino amor:
- |-
  Hoy es del divino amor
  la encarnación amorosa,
  fineza que es tan costosa
  que a las demás da valor.
- |-
  ¿Qué bien al mundo no ha dado
  la encarnación amorosa,
  si aun la culpa fue dichosa
  por haberla ocasionado?
- |-
  Ni ella sola ser podía
  causa, que, si se repara,
  para que Dios encarnara
  bastaba sólo María.
- |-
  Aunque de ser encarnado
  pudo ser doble el motivo:
  de todos por compasivo,
  de ella por enamorado.
- |-
  Y así al bajar este día
  al suelo por varios modos,
  fue por la culpa de todos
  y la gracia de María. Amén.
Hoy nace el sol divinal:
- |-
  Hoy nace el sol divinal
  de la Virgen sin mancilla;
  hoy el eterno se humilla
  y se hace hombre mortal.
- |-
  Hoy la reina celestial
  pare al rey del firmamento,
  sin recibir detrimento
  su pureza virginal.
- |-
  Adórote, Verbo eterno,
  Hijo del muy alto Padre,
  nacido de pobre madre
  en la yema del invierno.
- |-
  Gracias te doy, Niño tierno,
  pues con tu divinidad
  juntaste mi humanidad,
  por librarme del infierno. Amén.
Hoy rompe la clausura:
- |-
  Hoy rompe la clausura
  del surco empedernido
  el grano en él hundido
  por nuestra mano dura;
  y hoy da su flor primera
  la rama sin pecado
  del árbol mutilado
  por nuestra mano fiera.
- |-
  Hoy triunfa el buen Cordero
  que, en esta tierra impía,
  se dio con alegría
  por el rebaño entero;
  y hoy junta su extraviada
  majada y la conduce
  al sitio en que reluce
  la luz resucitada.
- |-
  Hoy surge, viva y fuerte,
  segura y vencedora,
  la Vida que hasta ahora
  yacía en honda muerte;
  y hoy alza del olvido
  sin fondo y de la nada
  al alma rescatada
  y al mundo redimido. Amén.
Insigne defensor de nuestra causa:
- |-
  Insigne defensor de nuestra causa,
  Señor y Salvador del pueblo humano,
  acoge nuestras súplicas humildes,
  perdona nuestras culpas y pecados.
- |-
  El día con sus gozos y sus penas
  pasó dejando huellas en el alma,
  igual que nuestros pies en su camino
  dejaron en el polvo sus pisadas.
- |-
  No dejes de mirarnos en la noche,
  dormida nuestra vida en su regazo;
  vigila el campamento de los hombres,
  camino de tu reino ya cercano.
- |-
  Ahuyenta de tu pueblo la zozobra,
  sé nube luminosa en el desierto,
  sé fuerza recobrada en el descanso,
  mañana y horizonte siempre abierto.
- |-
  Bendice, Padre santo, la tarea
  del pueblo caminante en la promesa;
  llegados a Emaús, tu Hijo amado
  nos parta el pan y el vino de la cena. Amén.
Jesucristo, Palabra del Padre:
- |-
  Jesucristo, Palabra del Padre,
  luz eterna de todo creyente:
  ven, Señor, porque ya se hace tarde,
  ven y escucha la súplica ardiente.
- |-
  Cuando el mundo dormía en tinieblas,
  en tu amor, tú quisiste ayudarlo
  y trajiste, viniendo a la tierra,
  esa vida que puede salvarlo.
- |-
  Ya madura la historia en promesas,
  sólo anhela tu pronto regreso;
  si el silencio madura la espera,
  el amor no soporta el silencio.
- |-
  Con María, la Iglesia te aguarda
  con anhelos de esposa y de Madre
  y reúne a sus hijos, los fieles,
  para juntos poder esperarte.
- |-
  Cuando vengas, Señor, en tu gloria,
  que podamos salir a tu encuentro
  y a tu lado vivamos por siempre,
  dando gracias al Padre en el reino. Amén.
La hermosa luz de eternidad inunda:
- |-
  La hermosa luz de eternidad inunda
  con fulgores divinos este día,
  que presenció la muerte de estos Príncipes
  y al pecador abrió el camino de la vida.
- |-
  Hoy lleváis la corona de la gloria,
  padres de Roma y jueces de los pueblos:
  el maestro del mundo, por la espada;
  y, por la cruz, el celestial portero.
- |-
  Dichosa tú que fuiste ennoblecida,
  oh Roma, con la sangre de estos Príncipes,
  y que, vestida con tan regia púrpura,
  excedes en nobleza a cuanto existe.
- |-
  Honra, poder y sempiterna gloria
  sean al Padre, al Hijo y al Espíritu
  que en unidad gobiernan toda cosa
  por infinitos e infinitos siglos. Amén.
Languidece, Señor, la luz del día:
- |-
  Languidece, Señor, la luz del día
  que alumbra la tarea de los hombres;
  mantén, Señor, mi lámpara encendida,
  claridad de mis días y mis noches.
- |-
  Confío en ti, Señor, alcázar mío,
  me guíen en la noche tus estrellas,
  alejas con su luz mis enemigos,
  yo sé que mientras duermo no me dejas.
- |-
  Dichosos los que viven en tu casa
  gozando de tu amor ya para siempre,
  dichosos los que llevan la esperanza
  de llegar a tu casa para verte.
- |-
  Que sea de tu Día luz y prenda
  este día en el trabajo ya vivido,
  recibe amablemente mi tarea,
  protégeme en la noche del camino.
- |-
  Acoge, Padre nuestro, la alabanza
  de nuestro sacrificio vespertino,
  que todo de tu amor es don y gracia
  en el Hijo Señor y el Santo Espíritu. Amén.
Las banderas reales se adelantan:
- |-
  Las banderas reales se adelantan
  y la cruz misteriosa en ellas brilla:
  la cruz en que la vida sufrió muerte
  y en que, sufriendo muerte, nos dio vida.
- |-
  Ella sostuvo el sacrosanto cuerpo
  que, al ser herido por la lanza dura,
  derramó sangre y agua en abundancia
  para lavar con ellas nuestras culpas.
- |-
  En ella se cumplió perfectamente
  lo que David profetizó en su verso,
  cuando dijo a los pueblos de la tierra:
  «Nuestro Dios reinará desde un madero.»
- |-
  ¡Árbol lleno de luz, árbol hermoso,
  árbol ornado con la regia púrpura,
  y destinado a que su tronco digno
  sintiera el roce de la carne pura!
- |-
  ¡Dichosa cruz que con tus brazos firmes,
  en que estuvo colgado nuestro precio,
  fuiste balanza para el cuerpo santo
  que arrebató su presa a los infiernos.
- |-
  A ti, que eres la única esperanza,
  te ensalzamos, oh cruz, y te rogamos
  que acrecientes la gracia de los justos
  y borres los delitos de los malos.
- |-
  Recibe, oh Trinidad, fuente salubre,
  la alabanza de todos los espíritus,
  y tú que con tu cruz nos das triunfo,
  añádenos el premio, oh Jesucristo. Amén.
Libra mis ojos de la muerte:
- |-
  Libra mis ojos de la muerte;
  dales la luz, que es su destino.
  Yo, como el ciego del camino,
  pido un milagro para verte.
- |-
  Haz de esta piedra de mis manos
  una herramienta constructiva,
  cura su fiebre posesiva
  y ábrela al bien de mis hermanos.
- |-
  Haz que mi pie vaya ligero.
  Da de tu pan y de tu vaso
  al que te sigue, paso a paso,
  por lo más duro del sendero.
- |-
  Que yo comprenda, Señor mío,
  al que se queja y retrocede;
  que el corazón no se me quede
  desentendidamente frío.
- |-
  Guarda mi fe del enemigo.
  ¡Tantos me dicen que estás muerto!
  Y entre la sombra y el desierto
  dame tu mano y ven conmigo. Amén
Llevaba roja la túnica:
- |-
  Llevaba roja la túnica
  y enrojecido el cabello.
  ¿De dónde, con pies sangrantes,
  avanzas tú, Lagarero?
  «Del monte de la batalla
  y de la victoria vengo;
  rojo fue mi atardecer,
  blanco será mi lucero.»
- |-
  Llevaba roja la túnica,
  roja de sangre y fuego.
- |-
  También de blanco le vi
  el vestido y el aliento;
  bello como las estrellas,
  como flor de cardo bello.
  Rojo como la amapola
  y blanco como un cordero:
  carmesíes sus heridas
  y blancos sus pensamientos.
- |-
  Llevaba blanca la túnica,
  blanca de amor y fuego.
- |-
  Por toda la negra tierra
  el chorro de sus veneros:
  sangre preciosa su sangre
  que hace blanco el sufrimiento.
  ¡Oh Cristo, de sangre roja!
  ¡Oh Cristo, dolor supremo!
  A ti el clamor de los hombres,
  en ti nuestros clavos fieros.
- |-
  Llevaba roja la túnica,
  roja de sangre y fuego. Amén.
Lo que en la tierra Pedro quiera atar:
- |-
  Lo que en la tierra Pedro quiera atar
  será con fuerza atado allá, en el cielo;
  lo que en la tierra mande desatar
  será soltado en el celeste reino.
  Al fin del tiempo, al mundo juzgará.
- |-
  Al Padre, gloria eterna por los siglos,
  al Hijo, el Unigénito, alabanzas,
  honor también al celestial Espíritu;
  a ti, Dios Uno y Trino, nuestras almas
  te alaben por los siglos infinitos. Amén.
Los pueblos que marchan y luchan:
- |-
  Los pueblos que marchan y luchan
  con firme tesón
  aclamen al Dios de la vida.
  Cantemos hosanna que viene el Señor.
- |-
  Agiten laureles y olivos,
  es Pascua de Dios,
  mayores y niños repitan:
  «Cantemos hosanna que viene el Señor.»
- |-
  Jesús victorioso y presente
  ofrece su don
  a todos los justos del mundo.
  Cantemos hosanna que viene el Señor.
- |-
  Resuenen en todo camino
  de paz y de amor
  alegres canciones que digan:
  «Cantemos hosanna que viene el Señor.»
- |-
  Que Dios, Padre nuestro amoroso,
  el Hijo y su Don
  a todos protejan y acojan.
  Cantemos hosanna que viene el Señor. Amén.
Luz mensajera de gozo:
- |-
  Luz mensajera de gozo,
  hermosura de la tarde,
  llama de la santa gloria,
  Jesús, luz de los mortales.
- |-
  Te saludamos, Señor,
  oh luz del mundo que traes
  en tu rostro sin pecado
  pura la divina imagen.
- |-
  Cuando el día se oscurece,
  buscando la luz amable
  nuestras miradas te siguen
  a ti, lumbre inapagable.
- |-
  Salve, Cristo venturoso,
  Hijo y Verbo en nuestra carne,
  brilla en tu frente el Espíritu,
  das el corazón del Padre.
- |-
  Es justo juntar las voces
  en el descanso del viaje,
  y el himno del universo
  a ti, Dios nuestro, cantarte.
- |-
  Oh Cristo que glorificas
  con tu vida nuestra sangre,
  acepta la sinfonía
  de nuestras voces filiales. Amén.
Mentes cansadas:
- |-
  Mentes cansadas,
  manos encallecidas,
  labriegos al fin de la jornada,
  jornaleros de tu viña,
  venimos, Padre,
  atardecidos de cansancio,
  agradecidos por la lucha,
  a recibir tu denario.
- |-
  Llenos de polvo,
  el alma hecha girones,
  romeros al filo de la tarde,
  peregrinos de tus montes,
  venimos, Padre,
  heridos por los desengaños,
  contentos por servir a tu mesa,
  a recibir tu denario.
- |-
  Hartos de todo,
  llenos de nada,
  sedientos al brocal de tus pozos
  y hambrientos de tu casa,
  venimos, Padre,
  el corazón entre tus brazos,
  la frente humilde de delitos,
  a recibir tu denario. Amén.
Morenez de morena hermosura:
- |-
  Morenez de morena hermosura,
  no nevado candor de jazmín;
  sí amalgama, crisol que madura
  nuestra sed del Amor, mar sin fin.
- |-
  Ella es reina, nosotros vasallos;
  ella es río, nosotros la sed;
  ella estrella, nosotros los rayos;
  ella nave, nosotros la red.
- |-
  Sobre el surco del llanto, sus ojos,
  sobre el hambre de Madre, su amor;
  sus dos manos, un viento de rezos,
  en la noche de América, sol.
- |-
  Cuando el valle se viste de sombras
  y el silencio es la voz del hogar,
  te loamos, Señor, que te nombras
  el Amor no agotado de amar. Amén.
Muere Jesús del Gólgota en la cumbre:
- |-
  Muere Jesús del Gólgota en la cumbre
  con amor perdonando al que le hería:
  siente deshecho el corazón María
  del dolor en la inmensa pesadumbre.
- |-
  Se aleja con pavor la muchedumbre
  cumplida ya la santa profecía;
  tiembla la tierra; el luminar del día,
  cegado a tanto horror, pierde su lumbre.
- |-
  Se abren las tumbas, se desgarra el velo
  y, a impulsos del amor, grande y fecundo,
  parece estar la cruz, signo de duelo,
- |-
  cerrando, augusta, con el pie el profundo,
  con la excelsa cabeza abriendo el cielo
  y con los brazos abarcando el mundo. Amén.
Muere la vida y vivo yo sin vida:
- |-
  Muere la vida y vivo yo sin vida
  ofendiendo la vida de mi muerte;
  sangre divina de las venas vierte
  y mi diamante su dureza olvida.
- |-
  Está la majestad de Dios tendida
  en una dura cruz, y yo de suerte
  que soy de sus dolores el más fuerte
  y de su cuerpo la mayor herida.
- |-
  ¡Oh duro corazón de mármol frío!
  ¿Tiene tu Dios abierto el lado izquierdo
  y no te vuelves un copioso río?
- |-
  Morir por él será divino acuerdo,
  mas eres tú mi vida, Cristo mío,
  y, como no la tengo, no la pierdo. Amén.
Mármol con sangre, tu frente:
- |-
  Mármol con sangre, tu frente;
  lirios con sangre, tus manos;
  tus ojos, soles con muerte;
  luna con muerte, tus labios.
- |-
  Así quiero verte, Cristo,
  sangriento jardín de nardos;
  así, con tus cinco llagas,
  cielo roto y estrellado.
- |-
  Rojo y blanco, blanco y rojo,
  te vio la niña del cántico:
  bien merecido lo tienes,
  por santo y enamorado.
- |-
  Abismo reclama abismo:
  ¿o no lo sabías acaso?;
  el amor llama a la muerte:
  muerte y amor son hermanos.
- |-
  Amor quema, amor hiende
  carne y alma, pecho y labio.
  Amor, espada de fuego;
  amor, cauterio y taladro.
- |-
  Así quiero verte, Cristo,
  con sangre, lirios y mármol;
  soles y lunas con muerte
  en tus ojos y en tus labios. Amén.
Mística Rosa de intocados pétalos:
- |-
  Mística Rosa de intocados pétalos,
  límpido cielo de infinitas lámparas,
  Musa celeste del Amor-Artífice,
  alba del alba.
- |-
  Si de tu esencia lo inefable tocó,
  no sé si es luz, o resplandor, o llama,
  o mar, o nieve, o limpidez, o nube,
  flor o fragancia.
- |-
  Como después del angustiado vuelo
  el trino posa en la mecida rama,
  regreso a ti - mi resplandor en ruinas -:
  tú eres mi casa.
- |-
  Dilapidé mi hacienda, Madre mía,
  bebí mi sed y devoré mi náusea.
  Lo tuve todo, y me han quedado sólo,
  sólo mis lágrimas.
- |-
  Mis manos todo de tu amor lo esperan,
  como la noche espera, Madre, el alba.
  Llévame siempre de la mano, llévame:
  sé tú mi lámpara.
- |-
  Llévame en pos de tu luciente aroma,
  ciclón de lirios, amapola en llamas,
  y, cuando el viento tu presencia anuncie,
  róbame el alma.
- |-
  Quiébrate, voz, ante el dintel sagrado
  de aquel que es Trino en Una sola llama,
  Llama que es Una en Tres incendios, Niña,
  llena de gracia. Amén.
No me pesa, Señor, haber faltado:
- |-
  No me pesa, Señor, haber faltado
  por el eterno mal que he merecido,
  ni me pesa tampoco haber perdido
  el cielo como pena a mi pecado.
- |-
  Pésame haber tus voces despreciado
  y tus justos mandatos infringido,
  porque con mis errores he ofendido
  tu corazón, Señor, por mí llagado.
- |-
  Llorar quiero mis culpas humillado,
  y buscar a mis males dulce olvido
  en la herida de amor de tu costado.
- |-
  Quiero tu amor pagar, agradecido,
  amándote cual siempre me has amado
  y viviendo contigo arrepentido. Amén.
Norabuena vengáis al mundo:
- |-
  Norabuena vengáis al mundo,
  niño de perlas,
  que sin vuestra vista
  no hay hora buena.
- |-
  Niño de jazmines,
  rosas y azucenas,
  niño de la niña
  después de él más bella,
  que tan buenos años,
  que tan buenas nuevas,
  que tan buenos días
  ha dado a la tierra;
  parabién merece,
  parabienes tenga,
  aunque tantos bienes
  como Dios posea.
- |-
  Norabuena vengáis al mundo,
  niño de perlas,
  que sin vuestra vista
  no hay hora buena.
- |-
  Mientras os tardasteis,
  dulce gloria nuestra,
  estábamos todos
  llenos de mil penas;
  mas, ya que vinisteis
  y a la tierra alegra
  ver que su esperanza
  cumplida en vos sea,
  digan los pastores,
  respondan las sierras,
  pues hombre os adoran
  y Dios os contemplan:
- |-
  Norabuena vengáis al mundo,
  niño de perlas,
  que sin vuestra vista
  no hay hora buena.
Nos dijeron de noche:
- |-
  Nos dijeron de noche
  que estabas muerto,
  y la fe estuvo en vela
  junto a tu cuerpo;
  La noche entera,
  la pasamos queriendo
  mover la piedra.
- |-
  Con la vuelta del sol,
  volverá a ver la tierra
  la gloria del Señor.
- |-
  No supieron contarlo
  los centinelas,
  nadie supo la hora
  ni la manera;
  antes del día,
  se cubrieron de gloria
  tus cinco heridas.
- |-
  Con la vuelta del sol,
  volverá a ver la tierra
  la gloria del Señor.
- |-
  Si los cinco sentidos
  buscan el sueño,
  que la fe tenga el suyo
  vivo y despierto;
  la fe velando,
  para verte de noche
  resucitando.
- |-
  Con la vuelta del sol,
  volverá a ver la tierra
  la gloria del Señor. Amén.
Nos reúne de nuevo el misterio:
- |-
  Nos reúne de nuevo el misterio
  del Señor que resurge a la vida,
  con su luz ilumina a la Iglesia,
  como el sol al nacer cada día.
- |-
  Resucita también nuestras almas,
  que tu muerte libró del castigo
  y vencieron contigo al pecado
  en las aguas del santo bautismo.
- |-
  Transfigura los cuerpos mortales
  que contemplan tu rostro glorioso,
  bella imagen del Dios invisible
  que ha querido habitar con nosotros.
- |-
  Cuando vengas, Señor, en tu gloria,
  que podamos salir a tu encuentro,
  y a tu lado vivamos por siempre
  dando gracias al Padre en el reino. Amén.
Nuestras vidas son los ríos:
- |-
  Nuestras vidas son los ríos
  que van a dar en la mar,
  que es el morir:
  allí van los señoríos
  derechos a se acabar
  y consumir;
  allí los ríos caudales,
  allí los otros medianos
  y más chicos;
  y, llegados, son iguales
  los que viven por sus manos
  y los ricos.
- |-
  Dejo las invocaciones
  de los famosos poetas
  y oradores;
  no curo de sus ficciones,
  que traen hierbas secretas
  sus sabores.
  Aquél sólo me encomiendo,
  aquél sólo invoco yo
  de verdad,
  que, en este mundo viviendo,
  el mundo no conoció
  su deidad. Amén.
Oh Cristo, tú no tienes:
- |-
  Oh Cristo, tú no tienes
  la lóbrega mirada de la muerte;
  tus ojos no se cierran:
  son agua limpia donde puedo verme.
- |-
  Oh Cristo, tú no puedes
  cicatrizar la llaga del costado:
  un corazón tras ella
  noches y días me estará esperando.
- |-
  Oh Cristo, tú conoces
  la intimidad oculta de mi vida;
  tú sabes mis secretos:
  te los voy confesando día a día.
- |-
  Oh Cristo, tú aleteas
  con los brazos unidos al madero;
  ¡oh valor que convida
  a levantarse puro sobre el suelo!
- |-
  Oh Cristo, tú sonríes
  cuando te hieren sordas las espinas;
  si mi cabeza hierve,
  haz, Señor, que te mire y te sonría.
- |-
  Oh Cristo, tú que esperas
  mi último beso darte ante la tumba,
  también mi joven beso
  descansa en ti de la incesante lucha. Amén.
Oh Dios, que eres el premio, la corona:
- |-
  Oh Dios, que eres el premio, la corona
  y la suerte de todos tus soldados,
  líbranos de los lazos de las culpas
  por este mártir a quien hoy cantamos.
- |-
  El conoció la hiel que está escondida
  en la miel de los goces de este suelo,
  y, por no haber cedido a sus encantos,
  está gozando los del cielo eterno.
- |-
  Él afrontó con ánimo seguro
  lo que sufrió con varonil coraje,
  y consiguió los celestiales dones
  al derramar por ti su noble sangre.
- |-
  Oh piadosísimo Señor de todo,
  te suplicamos con humilde ruego
  que, en el día del triunfo de este mártir,
  perdones los pecados de tus siervos.
- |-
  Gloria eterna al divino Jesucristo,
  que nació de una Virgen impecable,
  y gloria eterna al Santo Paracleto,
  y gloria eterna al sempiterno Padre. Amén.
Oh bondadoso Creador, escucha:
- |-
  Oh bondadoso Creador, escucha
  la voz de nuestras súplicas y el llanto
  que, mientras dura el sacrosanto ayuno
  de estos cuarenta días, derramamos.
- |-
  A ti, que escrutas nuestros corazones
  y que conoces todas sus flaquezas,
  nos dirigimos para suplicarte
  la gracia celestial de tu indulgencia.
- |-
  Mucho ha sido, en verdad, lo que pecamos,
  pero estamos, al fin, arrepentidos,
  y te pedimos, por tu excelso nombre,
  que nos cures los males que sufrimos.
- |-
  Haz que, contigo ya reconciliados,
  podamos dominar a nuestros cuerpos,
  y, llenos de tu amor y de tu gracia,
  no pequen más los corazones nuestros.
- |-
  Oh Trinidad Santísima, concédenos,
  oh simplicísima Unidad, otórganos
  que los efectos de la penitencia
  de estos días nos sean provechosos. Amén.
Oh príncipe absoluto de los siglos:
- |-
  Oh príncipe absoluto de los siglos,
  oh Jesucristo, rey de las naciones:
  te confesamos árbitro supremo
  de las mentes y de los corazones.
- |-
  En la tierra te adoran los mortales
  y los santos te alaban en el cielo,
  unidos a sus voces te aclamamos
  proclamándote rey del universo.
- |-
  Oh Jesucristo, príncipe pacífico:
  somete a los espíritus rebeldes,
  y haz que encuentren el rumbo los perdidos
  y que en un solo aprisco se congreguen.
- |-
  Para eso pendes de una cruz sangrienta,
  y abres en ella tus divinos brazos;
  para eso muestras en tu pecho herido
  tu ardiente corazón atravesado.
- |-
  Para eso estás oculto en los altares
  tras las imágenes del pan y el vino;
  para eso viertes de tu pecho abierto
  sangre de salvación para tus hijos.
- |-
  Por regir con amor el universo,
  glorificado seas, Jesucristo,
  y que contigo y con tu eterno Padre
  también reciba gloria el Santo Espíritu. Amén.
Patriarcas que fuisteis la semilla:
- |-
  Patriarcas que fuisteis la semilla
  del árbol de la fe en siglos remotos,
  al vencedor divino de la muerte
  rogadle por nosotros.
- |-
  Profetas que rasgasteis inspirados
  del porvenir el velo misterioso,
  al que sacó la luz de las tinieblas
  rogadle por nosotros.
- |-
  Almas cándidas, santos Inocentes
  que aumentáis de los ángeles el coro,
  al que llamó a los niños a su lado
  rogadle por nosotros.
- |-
  Apóstoles que echasteis en el mundo
  de la Iglesia el cimiento poderoso,
  al que es de la verdad depositario
  rogadle por nosotros.
- |-
  Mártires que ganasteis vuestra palma
  en la arena del circo, en sangre rojo,
  al que es fuente de vida y hermosura
  rogadle por nosotros.
- |-
  Monjes que de la vida en el combate
  pedisteis paz al claustro silencioso,
  al que es iris de calma en las tormentas
  rogadle por nosotros.
- |-
  Doctores cuyas plumas nos legaron
  de virtud y saber rico tesoro,
  al que es raudal de ciencia inextinguible
  rogadle por nosotros.
- |-
  Soldados del ejército de Cristo,
  santas y santos todos,
  rogadle que perdone nuestras culpas
  a aquel que vive y reina entre vosotros. Amén.
Porque el bautismo hoy empieza:
- |-
  Porque el bautismo hoy empieza
  y él lo quiere inaugurar,
  hoy se ha venido a lavar
  el Autor de la limpieza.
- |-
  Aunque es santo y redentor,
  nos da ejemplo singular:
  se quiere hoy purificar
  como cualquier pecador.
- |-
  Aunque él mismo es la Hermosura
  y no hay hermosura par,
  hoy quiere al agua bajar
  y hermosear nuestra basura.
- |-
  Nadie lo hubiera pensado:
  vino el pecado a quitar,
  y se hace ahora pasar
  por pecador y pecado.
- |-
  Gracias, Bondad y Belleza,
  pues te quisiste humillar
  y no te pesó lavar
  tu santidad y pureza. Amén.
Porque es tarde, Dios mío:
- |-
  Porque es tarde, Dios mío,
  porque anochece ya
  y se nubla el camino,
- |-
  porque temo perder
  las huellas que he seguido,
  no me dejes tan solo
  y quédate conmigo.
- |-
  Porque he sido rebelde
  y he buscado el peligro,
  y escudriñé curioso
  las cumbres y el abismo,
  perdóname, Señor,
  y quédate conmigo.
- |-
  Porque ardo en sed de ti
  y en hambre de tu trigo,
  ven, siéntate a mi mesa,
  dígnate ser mi amigo.
  ¡Qué aprisa cae la tarde...!
  ¡quédate conmigo! Amén.
Presentemos a Dios nuestras tareas:
- |-
  Presentemos a Dios nuestras tareas,
  levantemos orantes nuestras manos,
  porque hemos realizado nuestras vidas
  por el trabajo.
- |-
  Cuando la tarde pide ya descanso
  y Dios está más cerca de nosotros,
  es hora de encontrarnos en sus manos,
  llenos de gozo.
- |-
  En vano trabajamos la jornada,
  hemos corrido en vano hora tras hora,
  si la esperanza no enciende sus rayos
  en nuestra sombra.
- |-
  Hemos topado a Dios en el bullicio,
  Dios se cansó conmigo en el trabajo;
  es hora de buscar a Dios adentro,
  enamorado.
- |-
  La tarde es un trisagio de alabanza,
  la tarde tiene fuego del Espíritu:
  adoremos al Padre en nuestras obras,
  adoremos al Hijo. Amén.
Profeta de soledades:
- |-
  Profeta de soledades,
  labio hiciste de tus iras
  para fustigar mentiras
  y para gritar verdades.
- |-
  Desde el vientre escogido
  fuiste tú el pregonero,
  para anunciar al mundo
  la presencia del Verbo.
- |-
  El desierto encendido
  fue tu ardiente maestro,
  para allanar montañas
  y encender los senderos.
- |-
  Cuerpo de duro roble,
  alma azul de silencio;
  miel silvestre de rocas
  y un jubón de camello.
- |-
  No fuiste, Juan, la caña
  tronchada por el viento;
  sí la palabra ardiente
  tu palabra de acero.
- |-
  En el Jordán lavaste
  al más puro Cordero,
  que apacienta entre lirios
  y duerme en los almendros.
- |-
  En tu figura hirsuta
  se esperanzó tu pueblo:
  para una raza nueva
  abriste cielos nuevos.
- |-
  Sacudiste el azote
  ante el poder soberbio;
  y ante el Sol que nacía
  se apagó tu lucero.
- |-
  Por fin, en un banquete
  y en el placer de un ebrio,
  el vino de tu sangre
  santificó el desierto.
- |-
  Profeta de soledades,
  labio hiciste de tus iras
  para fustigar mentiras
  y para gritar verdades. Amén.
Publica, lengua, y canta:
- |-
  Publica, lengua, y canta
  el misterio del cuerpo glorioso
  y de la sangre santa
  que dio por mi reposo
  el fruto de aquel vientre generoso.
- |-
  A todos nos fue dado,
  de la Virgen purísima María
  por todos engendrado;
  y mientras acá vivía
  su celestial doctrina esparcía.
- |-
  De allí en nueva manera
  dio fin maravilloso a su jornada
  la noche ya postrera,
  la noche deseada,
  estando ya la cena aparejada.
- |-
  Convida a sus hermanos,
  y, cumplida la sombra y ley primero,
  con sus sagradas manos
  por el legal cordero
  les da a comer su cuerpo verdadero.
- |-
  Aquella criadora
  Palabra, con palabra, sin mudarse,
  lo que era pan agora
  en carne hace tornarse
  y el vino en propia sangre trastornarse.
- |-
  Y puesto que el grosero
  sentido se acobarda y desfallece,
  el corazón insano
  por eso no enflaquece,
  porque la fe le anima y favorece.
- |-
  Honremos pues, echados
  por tierra, tan divino sacramento,
  y queden desechados,
  pues vino el cumplimiento,
  los ritos del antiguo Testamento.
- |-
  Y si el sentido queda
  pasmado de tan alta y nueva cosa,
  lo que él no puede pueda,
  ose lo que él no osa,
  la fe determinada y animosa.
- |-
  ¡Gloria al Omnipotente,
  y al gran Engendrador y al Engendrado,
  y al inefablemente
  de entrambos inspirado
  igual loor, igual honor sea dado! Amén.
Que te alaben los célicos ejércitos:
- |-
  Que te alaben los célicos ejércitos
  y que te canten los cristianos coros,
  oh preclaro José, que fuiste dado
  a la Virgen en casto matrimonio.
- |-
  Al advertir su gravidez te asombras,
  y la duda te angustia en lo más íntimo,
  pero un ángel del cielo te revela
  que el niño concebido es del Espíritu.
- |-
  Tú estrechas al Señor en cuanto nace;
  después, huyes con él a tierra egipcia;
  luego, en Jerusalén notas su falta
  y, al encontrarlo, lloras de alegría.
- |-
  Más feliz que los otros elegidos,
  que sólo ven a Dios después de muertos,
  tú, por un privilegio misterioso,
  desde esta misma vida puedes verlo.
- |-
  Por este santo, Trinidad santísima,
  déjanos escalar el cielo santo,
  y nuestra gratitud te mostraremos
  con el fervor de un sempiterno canto. Amén.
Recuerde el alma dormida:
- |-
  Recuerde el alma dormida,
  avive el seso y despierte,
  contemplando
  cómo se pasa la vida,
  cómo se viene la muerte
  tan callando;
  cuán presto se va el placer,
  cómo, después de acordado,
  da dolor;
  cómo, a nuestro parecer,
  cualquiera tiempo pasado
  fue mejor.
- |-
  Pues si vemos lo presente
  cómo en un punto se es ido
  y acabado,
  si juzgamos sabiamente
  daremos lo no venido
  por pasado.
- |-
  No se engañe nadie, no,
  pensando que ha de durar
  lo que espera
  más que duró lo que vio,
  pues que todo ha de pasar
  por tal manera. Amén.
Reina del libro de la vieja alianza:
- |-
  Reina del libro de la vieja alianza:
  tu nombre es el versículo primero
  de consuelo, promesa y esperanza.
- |-
  Doncella que en tu vientre a Dios tendrías:
  se estremece de júbilo tu nombre
  en los labios quemados de Isaías.
- |-
  Reina del libro nuevo de la vida:
  reinas desde el silencio en cada página,
  oh reina silenciosa y escondida,
- |-
  y es tu presencia la del tallo leve
  que, al reventar el lirio, se recata
  debajo de los pétalos de nieve.
- |-
  Reina del claro mes de los renuevos,
  de la infancia del mundo y de la tierra,
  y de la luz y de los nidos nuevos,
- |-
  y Reina nuestra; Reina de las manos,
  con sangre y con estrellas, de tu Hijo,
  con flores y dolor, de sus hermanos.
- |-
  Los ángeles te aclaman soberana,
  pero mil veces más eres, Señora,
  sangre y dolor de nuestra raza humana. Amén.
Resplandeciente de alegría:
- |-
  Resplandeciente de alegría,
  amargo mar de los pesares,
  vestida de gracia y de gloria,
  te cantamos, oh Virgen María.
- |-
  Gozosa cuando a Dios concibes,
  cuando anhelante das el fruto,
  cuando lo ofreces y lo pierdes,
  al Hijo, que es la luz del mundo.
- |-
  Salve, primera de los mártires,
  en el dolor de tu martirio;
  tu corazón supo de espinas.
  tu alma de cruces y de lirios.
- |-
  Reina de gloria refulgente,
  Madre fecunda de la Iglesia,
  cuando las llamas del Paráclito
  del mundo ardieron las tristezas.
- |-
  Recoged las Aves Marías
  para un rosario de azucenas;
  cantad a María alabanzas,
  que es Madre de eterna belleza. Amén.
Retorna victorioso:
- |-
  Retorna victorioso
  la cruz en mano enhiesta como un cetro,
  como la llave que abre el paraíso;
  y a su lado retornan los cautivos
  vuelto en gozo las lágrimas y el duelo:
  ¡Jesús entra en el cielo!
- |-
  Vuelve el Esposo santo;
  el hijo más hermoso de la tierra
  regresa coronado de su viaje,
  y la Iglesia, la Esposa de su sangre,
  lo acompaña radiante de belleza:
  ¡Jesús entra en el cielo!
- |-
  Alzad vuestra esperanza,
  porque ha quedado el áncora clavada;
  si la tormenta agita el oleaje,
  no se agite la fe del navegante,
  que en la ribera Cristo nos amarra:
  ¡Jesús entra en el cielo!
- |-
  El Padre Dios se goza
  porque descansa el Hijo en su regazo
  al retorno triunfal de la pelea;
  goce la Iglesia, goce en su Cabeza,
  y alabe por los siglos a su Amado:
  ¡Jesús entra en el cielo!. Amén.
Revestidos de blancas vestiduras:
- |-
  Revestidos de blancas vestiduras,
  vayamos al banquete del Cordero
  y, terminado el cruce del mar Rojo
  alcemos nuestro canto al rey eterno.
- |-
  La caridad de Dios es quien nos brinda
  y quien nos da a beber su sangre propia,
  y el Amor sacerdote es quien se ofrece
  y quien los miembros de su cuerpo inmola.
- |-
  Las puertas salpicadas con tal sangre
  hacen temblar al ángel vengativo,
  y el mar deja pasar a los hebreos
  y sumerge después a los egipcios.
- |-
  Ya el Señor Jesucristo es nuestra pascua,
  ya el Señor Jesucristo es nuestra víctima:
  el ázimo purísimo y sincero
  destinado a las almas sin mancilla.
- |-
  Oh verdadera víctima del cielo,
  que tiene a los infiernos sometidos,
  ya rotas las cadenas de la muerte,
  y el premio de la vida recibido.
- |-
  Vencedor del averno subyugado,
  el Redentor despliega sus trofeos
  y, sujetando al rey de las tinieblas,
  abre de par en par el alto cielo.
- |-
  Para que seas, oh Jesús, la eterna
  dicha pascual de nuestras almas limpias,
  líbranos de la muerte del pecado
  a los que renacimos a la vida.
- |-
  Gloria sea a Dios Padre y a su Hijo,
  que de los muertos ha resucitado,
  así como también al sacratísimo
  Paracleto, por tiempo ilimitado. Amén.
Reyes que venís por ellas:
- |-
  Reyes que venís por ellas,
  no busquéis estrellas ya,
  porque donde el sol está
  no tienen luz las estrellas.
- |-
  Mirando sus luces bellas,
  no sigáis la vuestra ya,
  porque donde el sol está
  no tienen luz las estrellas.
- |-
  Aquí parad, que aquí está
  quien luz a los cielos da:
  Dios es el puerto más cierto,
  y si habéis hallado puerto
  no busquéis estrellas ya.
- |-
  No busquéis la estrella ahora:
  que su luz ha oscurecido
  este Sol recién nacido
  en esta Virgen Aurora.
- |-
  Ya no hallaréis luz en ellas,
  el Niño os alumbra ya,
  porque donde el sol está
  no tienen luz las estrellas.
- |-
  Aunque eclipsarse pretende,
  no reparéis en su llanto,
  porque nunca llueve tanto
  como cuando el sol se enciende.
- |-
  Aquellas lágrimas bellas
  la estrella oscurecen ya,
  porque donde el sol está
  no tienen luz las estrellas. Amén.
Salve, del mar Estrella:
- |-
  Salve, del mar Estrella,
  salve, Madre sagrada
  de Dios y siempre virgen,
  puerta del cielo santa.
- |-
  Tomando de Gabriel
  el «Ave», Virgen alma,
  mudando el nombre de Eva,
  paces divinas trata.
- |-
  La vista restituye,
  las cadenas desata,
  todos los males quita,
  todos los bienes causa.
- |-
  Muéstrate madre, y llegue
  por ti nuestra esperanza
  a quien, por darnos vida,
  nació de tus entrañas.
- |-
  Entre todas piadosa,
  Virgen, en nuestras almas,
  libres de culpa, infunde
  virtud humilde y casta.
- |-
  Vida nos presta pura,
  camino firme allana,
  que quien a Jesús llega
  eterno gozo alcanza.
- |-
  Al Padre, al Hijo, al Santo
  Espíritu alabanzas;
  una a los tres le demos,
  y siempre eternas gracias. Amén.
Santa unidad y Trinidad beata:
- |-
  Santa unidad y Trinidad beata:
  con los destellos de tu brillo eterno,
  infunde amor en nuestros corazones,
  mientras se va alejando el sol de fuego.
- |-
  Por la mañana te cantamos loas
  y por la tarde te elevamos ruegos,
  pidiéndote que estemos algún día
  entre los que te alaban en el cielo.
- |-
  Glorificado sean por los siglos
  de los siglos el Padre y su Unigénito,
  y que glorificado con entrambos
  sea por tiempo igual el Paracleto. Amén
Señor, la luz del día ya se apaga:
- |-
  Señor, la luz del día ya se apaga,
  la noche va extendiendo sus tinieblas;
  alumbra lo más hondo de las almas
  en este santo tiempo de Cuaresma.
- |-
  Conoces nuestra vida y nuestra historia
  y sabes que también hemos pecado,
  por eso hacia ti nos dirigimos
  confiando que seremos perdonados.
- |-
  Unidos con la Iglesia recorremos
  la senda que nos lleva hasta el Calvario,
  llevando en nuestro cuerpo tus dolores,
  sufriendo lo que aún no has completado.
- |-
  Escucha nuestra voz, amado Padre,
  que, junto con tu Hijo Jesucristo,
  enviaste tu Espíritu a los hombres,
  sellando con tu gracia sus destinos. Amén.
Señor, tú eres mi paz y mi consuelo:
- |-
  Señor, tú eres mi paz y mi consuelo
  al acabar el día su jornada,
  y, libres ya mis manos del trabajo,
  a hacerte ofrenda del trabajo vengo.
- |-
  Señor, tú eres mi paz y mi consuelo
  cuando las luces de este día acaban,
  y, ante las sombras de la noche oscura,
  mirarte a ti, mi luz, mirarte puedo.
- |-
  Señor, tú eres mi paz y mi consuelo,
  y aunque me abruma el peso del pecado,
  movido por tu amor y por tu gracia,
  mi salvación ponerla en ti yo quiero.
- |-
  Señor, tú eres mi paz y mi consuelo,
  muy dentro de mi alma tu esperanza
  sostenga mi vivir de cada día,
  mi lucha por el bien que tanto espero.
- |-
  Señor, tú eres mi paz y mi consuelo;
  por el amor de tu Hijo, tan amado,
  por el Espíritu de ambos espirado,
  conduce nuestra senda hacia tu encuentro. Amén.
'Señor, tú eres santo: yo adoro, yo creo':
- |-
  Señor, tú eres santo: yo adoro, yo creo;
  tu cielo es un libro de páginas bellas,
  do en noches tranquilas mi símbolo leo,
  que escribe tu mano con signos de estrellas.
- |-
  En vano con sombras el caos se cierra:
  tú miras al caos, la luz nace entonces;
  tú mides las aguas que ciñen la tierra,
  tú mides los siglos que muerden los bronces.
- |-
  El mar a la tierra pregunta tu nombre,
  la tierra a las aves que tienden su vuelo;
  las aves lo ignoran; preguntan al hombre,
  y el hombre lo ignora; pregúntanlo al cielo.
- |-
  EI mar con sus ecos ha siglos que ensaya
  formar ese nombre, y el mar no penetra
  misterios tan hondos, muriendo en la playa,
  sin que oigan los siglos o sílaba o letra.
- |-
  Señor, tú eres santo: yo te amo, yo espero;
  tus dulces bondades cautivan el alma;
  mi pecho gastaron con diente de acero
  los gustos del mundo, vacíos de calma.
- |-
  Concede a mis penas la luz de bonanza,
  la paz a mis noches, la paz a mis días;
  tu amor a mi pecho, tu fe y tu esperanza,
  que es bálsamo puro que al ánima envías. Amén.
Si morir no es despertar:
- |-
  Si morir no es despertar,
  si es simplemente morir,
  ¿para qué, muerte, vivir?,
  ¿para qué, muerte, empezar
  esta angustia, este llorar?
- |-
  Mas, si eres umbral y puerta
  del misterio, si honda y cierta
  aseguras mi esperanza,
  ¡qué cima de luz se alcanza
  viviendo una vida muerta! Amén.
Tan cerca, Saulo, de nosotros:
- |-
  Tan cerca, Saulo, de nosotros,
  de nuestras mordeduras,
  de nuestros viejos odios
  y de nuestras ternuras.
- |-
  Cerca de nuestras ansias,
  lejos de nuestros pasos,
  de nuestras veleidades
  y de nuestros fracasos.
- |-
  Dinos que Cristo en cruz
  es todo: pena y gozo,
  tu enseñanza y tu gloria,
  tu lucha y tu reposo.
- |-
  Que al corazón que a toda
  decisión está listo,
  todo es estiércol, todo,
  para ganar a Cristo. Amén.
Te bendecimos, Cristo, en esta noche:
- |-
  Te bendecimos, Cristo, en esta noche:
  Verbo de Dios y Luz de Luz eterna,
  emisor del Espíritu Paráclito;
  te bendecimos porque nos revelas
  la triple luz de una indivisa gloria
  y libras nuestras almas de tinieblas.
- |-
  A la noche y al día has ordenado
  que se releven siempre en paz fraterna;
  la noche compasiva pone término
  a nuestras aflicciones y tareas,
  y, para comenzar el nuevo surco,
  el día alegremente nos despierta.
- |-
  Da un sueño muy ligero a nuestros párpados,
  para que nuestra voz no permanezca
  muda por mucho tiempo en tu alabanza;
  mientras dormimos se mantenga en vela
  toda tu creación, cantando salmos
  en compañía de la turba angélica.
- |-
  Y, mientras duerme nuestro humilde cuerpo,
  nuestro espíritu cante a su manera:
  «Gloria al Padre y al Hijo y al Espíritu,
  en el día sin noche donde reinan;
  al Uno y Trino, honor, poder, victoria,
  por edades y edades sempiternas.» Amén.
Te diré mi amor, Rey mío:
- |-
  Te diré mi amor, Rey mío,
  en la quietud de la tarde,
  cuando se cierran los ojos
  y los corazones se abren.
- |-
  Te diré mi amor, Rey mío,
  con una mirada suave,
  te lo diré contemplando
  tu cuerpo que en pajas yace.
- |-
  Te diré mi amor, Rey mío,
  adorándote en la carne,
  te lo diré con mis besos,
  quizá con gotas de sangre.
- |-
  Te diré mi amor, Rey mío,
  con los hombres y los ángeles,
  con el aliento del cielo
  que espiran los animales.
- |-
  Te diré mi amor, Rey mío,
  con el amor de tu Madre,
  con los labios de tu Esposa
  y con la fe de tus mártires.
- |-
  Te diré mi amor, Rey mío,
  ¡oh Dios del amor más grande!
  ¡Bendito en la Trinidad,
  que has venido a nuestro valle! Amén.
Tristes estaban los apóstoles:
- |-
  Tristes estaban los apóstoles
  tras sepultar a Cristo
  que, a muerte despiadada,
  lo sentenciaron los impíos.
- |-
  Con dulces palabras, un ángel
  a las mujeres dijo
  que en Galilea el Señor
  habría muy pronto de ser visto.
- |-
  Mientras corrían presurosas
  a hablar a los discípulos,
  lo ven, besan sus pies,
  pues se les aparece vivo.
- |-
  Cuando lo saben los apóstoles
  acuden velocísimos
  a ver en Galilea
  el rostro adorable de Cristo.
- |-
  Sé, Jesús, de las almas júbilo
  y pascual regocijo,
  a tus triunfos asócianos,
  que en la gracia hemos renacido.
- |-
  Tribútese, oh Jesús, la gloria
  a ti, que, ya vencido
  el reino de la muerte,
  nos abre lúcido el camino. Amén.
Tu cuerpo es preciosa lámpara:
- |-
  Tu cuerpo es preciosa lámpara,
  llagado y resucitado,
  tu rostro es la luz del mundo,
  nuestra casa, tu costado.
- |-
  Tu cuerpo es ramo de abril
  y blanca flor del espino,
  y el fruto que nadie sabe
  tras la flor eres tú mismo.
- |-
  Tu cuerpo es salud sin fin,
  joven, sin daño de días;
  para el que busca vivir
  es la raíz de la vida. Amén.
Tú eres toda hermosa:
- |-
  Tú eres toda hermosa,
  ¡oh Madre del Señor!;
  tú eres de Dios gloria,
  la obra de su amor.
- |-
  ¡Oh rosa sin espinas,
  oh vaso de elección!
  de ti nació la vida,
  por ti nos vino Dios.
- |-
  Sellada fuente pura
  de gracia y de piedad,
  bendita cual ninguna,
  sin culpa original.
- |-
  Infunde en nuestro pecho
  la fuerza de tu amor,
  feliz Madre del Verbo,
  custodia del Señor. Amén.
Tú que eres, Cristo, el esplendor y el día:
- |-
  Tú que eres, Cristo, el esplendor y el día,
  y de la noche ahuyentas las tinieblas,
  Luz de Luz que a tus fieles
  cual luz te manifiestas,
- |-
  te pedimos, Señor, humildemente
  esta noche que estés de centinela,
  en ti hallemos reposo
  y la paz nos concedas.
- |-
  Si se entregan al sueño nuestros ojos,
  en ti vigile el corazón alerta,
  y rogamos tus hijos,
  Señor, que nos protejas.
- |-
  Defensor nuestro, míranos, rechaza
  al enemigo cruel que nos acecha
  y, a quienes redimiste
  con tu sangre, gobierna.
- |-
  A ti, Cristo, Señor del universo,
  y a ti, Padre, alabanza dondequiera,
  y al Amor, por los siglos
  loores. Amén.
Un amor casto y puro:
- |-
  Un amor casto y puro
  calladamente:
  más grande que la vida
  y que la muerte.
  Dulce su casa,
  y su marido en ella
  se contemplaba.
- |-
  Era su amor de madre
  como una rosa:
  pétalos de fragancia
  y espinas rojas.
  Y era su seno
  un arrullo de lirios
  y de silencios.
- |-
  Olor a roja viña
  y a tierna hogaza:
  y su mano prudente
  acariciaba.
  Sus dedos limpios
  iban tejiendo lana
  para sus hijos.
- |-
  Y Dios desde su cielo
  se sonreía,
  por la casta frescura
  de fuente limpia.
  Amor callado
  que vestía al Cordero
  de rojo y blanco. Amén.
Una mujer creyente de Israel:
- |-
  Una mujer creyente de Israel
  es para siempre madre de la vida;
  bendita por su fe la nueva Eva,
  morada santa donde Dios habita.
- |-
  Lo mismo que Isabel, la santa Iglesia
  hoy a su madre alaba y felicita:
  «¡Bendita seas, Dios está contigo,
  llena de gracia al par, Virgen María!
- |-
  Y bendito en la morada sempiterna
  aquel que tú llevaste, Peregrina,
  aquel que, con el Padre y el Espíritu,
  al bendecirte a ti nos bendecía.» Amén.
Ven, Creador, Espíritu amoroso:
- |-
  Ven, Creador, Espíritu amoroso,
  ven y visita el alma que a ti clama
  y con tu soberana gracia inflama
  los pechos que criaste poderoso.
- |-
  Tú que abogado fiel eres llamado,
  del Altísimo don, perenne fuente
  de vida eterna, caridad ferviente,
  espiritual unción, fuego sagrado.
- |-
  Tú te infundes al alma en siete dones,
  fiel promesa del Padre soberano;
  tú eres el dedo de su diestra mano,
  tú nos dictas palabras y razones.
- |-
  Ilustra con tu luz nuestros sentidos,
  del corazón ahuyenta la tibieza,
  haznos vencer la corporal flaqueza,
  con tu eterna virtud fortalecidos.
- |-
  Por ti, nuestro enemigo desterrado,
  gocemos de paz santa duradera,
  y, siendo nuestro guía en la carrera,
  todo daño evitemos y pecado.
- |-
  Por ti al eterno Padre conozcamos,
  y al Hijo, soberano omnipotente,
  y a ti, Espíritu, de ambos procedente,
  con viva fe y amor siempre creamos. Amén.
Ven, Espíritu divino:
- |-
  Ven, Espíritu divino,
  manda tu luz desde el cielo.
  Padre amoroso del pobre,
  don en tus dones espléndido,
  luz que penetra las almas,
  fuente del mayor consuelo.
- |-
  Ven, dulce huésped del alma,
  descanso de nuestro esfuerzo,
  tregua en el duro trabajo,
  brisa en las horas de fuego,
  gozo que enjuga las lágrimas
  y reconforta en los duelos.
- |-
  Entra hasta el fondo del alma,
  divina luz, y enriquécenos.
  Mira el vacío del hombre,
  si tú faltas por dentro;
  mira el poder del pecado,
  cuando no envías tu aliento.
- |-
  Riega la tierra en sequía,
  sana el corazón enfermo,
  lava las manchas, infunde
  calor de vida en el hielo,
  doma el espíritu indómito,
  guía al que tuerce el sendero.
- |-
  Reparte tus siete dones,
  según la fe de tus siervos;
  por tu bondad y tu gracia,
  dale al esfuerzo su mérito;
  salva al que busca salvarse
  y danos tu gozo eterno. Amén.
Vengo, Señor, cabe las ígneas huellas:
- |-
  Vengo, Señor, cabe las ígneas huellas
  de tus sacras heridas luminosas:
  quíntuple abrir de inmarcesibles rosas,
  suma constelación de cinco estrellas.
- |-
  Vengo a poblar sus oquedades bellas,
  a estudiar en sus aulas silenciosas,
  y a beber, con ternuras dolorosas,
  la miel de acíbar que pusiste en ellas.
- |-
  Cuando zozobre mi valor, inerme,
  y vaya en turbias ansias a abismarme
  y llagado también llegue yo a verme,
- |-
  deja a tus dulces llagas allegarme,
  y en sus íntimos claustros esconderme,
  y en su divina suavidad curarme. Amén.
Vengo, Señor, cansado:
- |-
  Vengo, Señor, cansado;
  ¡cuánta fatiga
  van cargando mis hombros
  al fin del día!
  Dame tu fuerza
  y una caricia tuya
  para mis penas.
- |-
  Salí por la mañana
  Entre los hombres,
  ¡y encontré tantos ricos
  que estaban pobres!
  La tierra llora,
  porque sin ti la vida
  es poca cosa.
- |-
  ¡Tantos hombres maltrechos,
  sin ilusiones!;
  en ti buscan asilo
  sus manos torpes.
  Tu amor amigo,
  todo tu santo fuego,
  para su frío.
- |-
  Yo roturé la tierra
  y puse trigo;
  tú diste el crecimiento
  para tus hijos.
  Así, en la tarde,
  con el cansancio a cuestas,
  te alabo, Padre.
- |-
  Quiero todos los días
  salir contigo,
  y volver a la tarde
  siendo tu amigo.
  Volver a casa
  y extenderte las manos,
  dándote gracias. Amén.
Venid al huerto, perfumes:
- |-
  Venid al huerto, perfumes,
  enjugad la blanca sábana:
  en el tálamo nupcial
  el Rey descansa.
- |-
  Muertos de negros sepulcros,
  venid a la tumba santa:
  la Vida espera dormida,
  la Iglesia aguarda.
- |-
  Llegad al jardín, creyentes,
  tened en silencio el alma:
  ya empiezan a ver los justos
  la noche clara.
- |-
  Oh dolientes de la tierra,
  verted aquí vuestras lágrimas:
  en la gloria de este cuerpo
  serán bañadas.
- |-
  Salve, cuerpo cobijado
  bajo las divinas alas;
  salve, casa del Espíritu,
  nuestra morada. Amén.
Verbo de Dios, eterna luz divina:
- |-
  Verbo de Dios, eterna luz divina,
  fuente eternal de toda verdad pura,
  gloria de Dios, que el cosmos ilumina,
  antorcha toda luz en noche oscura.
- |-
  Palabra eternamente pronunciada
  en la mente del Padre, ¡oh regocijo!,
  que en el tiempo a los hombres nos fue dada
  en el seno de Virgen, hecha Hijo.
- |-
  Las tinieblas de muerte y de pecado,
  en que yacía el hombre, así vencido,
  su verdad y su luz han disipado,
  con su vida y su muerte ha redimido.
- |-
  Con destellos de luz que Dios envía,
  no dejéis de brillar, faros divinos;
  de los hombres y pueblos sed su guía,
  proclamad la verdad en los caminos. Amén.
Vino a la vida para que la muerte:
- |-
  Vino a la vida para que la muerte
  dejara de vivir en nuestra vida,
  y para que lo que antes era vida
  fuera más muerte que la misma muerte.
- |-
  Vino a la vida para que la vida
  pudiera darnos vida con su muerte,
  y para que lo que antes era muerte
  fuera más vida que la misma vida.
- |-
  Desde entonces la vida es tanta vida
  y la muerte de ayer tan poca muerte,
  que si a la vida le faltara vida
- |-
  y a nuestra muerte le sobrara muerte,
  con esta vida nos daría tal vida
  para dar muerte al resto de la muerte. Amén.
Vivo sin vivir en mí:
- |-
  Vivo sin vivir en mí,
  y tan alta vida espero,
  que muero porque no muero.
- |-
  Cuando me gozo, Señor,
  con esperanza de verte,
  viendo que puedo perderte
  se me dobla mi dolor:
  viviendo en tanto pavor,
  y esperando como espero,
  que muero porque no muero.
- |-
  Sácame de esta muerte,
  mi Dios, y dame la vida,
  no me tengas impedida
  en este lazo tan fuerte;
  mira que muero por verte,
  y vivir sin ti no puedo,
  que muero porque no muero.
- |-
  Lloraré mi muerte ya
  y lamentaré mi vida,
  en tanto que detenida
  por mis pecados está.
  ¡Oh mi Dios, cuándo será
  cuando yo diga de nuevo
  que muero porque no muero!
- |-
  Vivo ya fuera de mí
  después de que muero de amor;
  porque vivo en el Señor
  que me quiso para sí:
  cuando el corazón le di,
  puso en mí este letrero:
  que muero porque no muero.
- |-
  Vivo sin vivir en mí,
  y tan alta vida espero,
  que muero porque no muero. Amén.
Ya no temo, Señor, la tristeza:
- |-
  Ya no temo, Señor, la tristeza,
  ya no temo, Señor, la soledad;
  porque eres, Señor, mi alegría,
  tengo siempre tu amistad.
- |-
  Ya no temo, Señor, a la noche,
  ya no temo, Señor, la oscuridad;
  porque brilla tu luz en las sombras,
  ya no hay noche, tú eres luz.
- |-
  Ya no temo, Señor, los fracasos,
  ya no temo, Señor, la ingratitud;
  porque el triunfo, Señor, en la vida,
  tú lo tienes, tú lo das.
- |-
  Ya no temo, Señor, los abismos,
  ya no temo, Señor, la inmensidad;
  porque eres, Señor, el camino
  y la vida, la verdad. Amén.
Yo he sentido, Señor, tu voz amante:
- |-
  Yo he sentido, Señor, tu voz amante,
  en el misterio de las noches bellas,
  y en el suave temblor de las estrellas
  la armonía gocé de tu semblante.
- |-
  No me llegó tu acento amenazante
  entre el fragor de trueno y de centellas;
  al ánima llamaron tus querellas
  como el tenue vagido de un infante.
- |-
  ¿Por qué no obedecí cuando te oía?
  ¿Quién me hizo abandonar tu franca vía
  y hundirme en las tinieblas del vacío?
- |-
  Haz, mi dulce Señor, que en la serena
  noche vuelva a escuchar tu cantilena;
  ¡ya no seré cobarde, Padre mío! Amén.
¡Columnas de la Iglesia, piedras vivas!:
- |-
  ¡Columnas de la Iglesia, piedras vivas!
  ¡Apóstoles de Dios, grito del Verbo!
  Benditos vuestros pies, porque han llegado
  para anunciar la paz al mundo entero.
- |-
  De pie en la encrucijada de la vida,
  del hombre peregrino y de los pueblos,
  lleváis agua de Dios a los cansados,
  hambre de Dios lleváis a los hambrientos.
- |-
  De puerta en puerta va vuestro mensaje,
  que es verdad y es amor y es Evangelio.
  no temáis, pecadores, que sus manos
  son caricias de paz y de consuelo.
- |-
  Gracias, Señor, que el pan de tu palabra
  nos llega por tu amor, pan verdadero;
  gracias, Señor, que el pan de vida nueva
  nos llega por tu amor, partido y tierno. Amén.
¡Oh qué dichoso este día:
- |-
  ¡Oh qué dichoso este día
  en que José, dulce suerte,
  entre Jesús y María
  rinde tributo a la muerte!
- |-
  Tuvo en la tierra su cielo;
  por un favor nunca visto,
  con la Virgen, su consuelo
  fue vivir sirviendo a Cristo.
- |-
  Ya con suprema leticia
  los justos lo aclamarán,
  lleva la buena noticia
  hasta el seno de Abraham.
- |-
  Si fue grande la agonía
  que sufrió en la encarnación,
  será inmensa la alegría
  que tendrá en resurrección.
- |-
  Quiera Dios que en nuestro trance
  no nos falte su favor,
  y piadoso nos alcance
  ver benigno al Redentor.
- |-
  Que en Jesús, José y María,
  gloria de la humanidad,
  resplandezca tu armonía,
  ¡oh indivisa Trinidad! Amén.
¡Virgen de vírgenes santas!:
- |-
  ¡Virgen de vírgenes santas!,
  llore yo con ansias tantas
  que el llanto dulce me sea;
  porque su pasión y muerte
  tenga en mi alma de suerte
  que siempre sus penas vea.
- |-
  Haz que su cruz me enamore
  y que en ella viva y more
  de mi fe y amor indicio;
  porque me inflame y encienda
  y contigo me defienda
  en el día del juicio.
- |-
  Haz que me ampare la muerte
  de Cristo, cuando en tan fuerte
  trance vida y alma estén;
  porque, cuando quede en calma
  el cuerpo, vaya mi alma
  a su eterna gloria. Amén.
«No, yo no dejo la tierra:
- |-
  «No, yo no dejo la tierra.
  No, yo no olvido a los hombres.
  Aquí, yo he dejado la guerra;
  arriba, están vuestros nombres.»
- |-
  ¿Qué hacéis mirando al cielo,
  varones, sin alegría?
  Lo que ahora parece un vuelo
  ya es vuelta y es cercanía.
- |-
  El gozo es mi testigo.
  La paz, mi presencia viva,
  que, al irme, se va conmigo
  la cautividad cautiva.
- |-
  El cielo ha comenzado.
  Vosotros sois mi cosecha.
  El Padre ya os ha sentado
  conmigo, a su derecha.
- |-
  Partid frente a la aurora.
  Salvad a todo el que crea.
  Vosotros marcáis mi hora.
  Comienza vuestra tarea. Amén.
¿Dónde está muerte, tu victoria?:
- |-
  ¿Dónde está muerte, tu victoria?
  ¿Dónde está muerte, tu aguijón?
  Todo es destello de su gloria,
  clara luz, resurrección.
- |-
  Fiesta es la lucha terminada,
  vida es la muerte del Señor,
  día la noche engalanada,
  gloria eterna de su amor.
- |-
  Fuente perenne de la vida,
  luz siempre viva de su don,
  Cristo es ya vida siempre unida
  a toda vida en aflicción.
- |-
  Cuando la noche se avecina,
  noche del hombre y su ilusión,
  Cristo es ya luz que lo ilumina,
  Sol de su vida y corazón.
- |-
  Demos al Padre la alabanza,
  por Jesucristo, Hijo y señor,
  denos su espíritu esperanza
  viva y eterna de su amor. Amén.
¿Quién es este que viene:
- |-
  ¿Quién es este que viene,
  recién atardecido,
  cubierto por su sangre
  como varón que pisa los racimos?
- |-
  Éste es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección.
- |-
  ¿Quién es este que vuelve,
  glorioso y malherido,
  y, a precio de su muerte,
  compra la paz y libra a los cautivos?
- |-
  Éste es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección.
- |-
  Se durmió con los muertos,
  y reina entre los vivos;
  no le venció la fosa,
  porque el Señor sostuvo a su elegido.
- |-
  Este es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección.
- |-
  Anunciad a los pueblos
  qué habéis visto y oído;
  aclamad al que viene
  como la paz, bajo un clamor de olivos.
- |-
  Este es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección. Amén.
¿Quién es éste que viene:
- |-
  ¿Quién es éste que viene,
  recién atardecido,
  cubierto por su sangre
  como varón que pisa los racimos?
- |-
  Éste es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección.
- |-
  ¿Quién es este que vuelve,
  glorioso y malherido,
  y, a precio de su muerte,
  compra la paz y libra a los cautivos?
- |-
  Éste es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección.
- |-
  Se durmió con los muertos,
  y reina entre los vivos;
  no le venció la fosa,
  porque el Señor sostuvo a su elegido.
- |-
  Este es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección.
- |-
  Anunciad a los pueblos
  qué habéis visto y oído;
  aclamad al que viene
  como la paz, bajo un clamor de olivos.
- |-
  Este es Cristo, el Señor,
  que venció nuestra muerte
  con su resurrección. Amén.
Ángel fiel de la verdad:
- |-
  Ángel fiel de la verdad,
  precursor del que es la gracia,
  mensajero de la luz,
  de Cristo perenne lámpara.
- |-
  Con la voz, vida y acciones,
  profecías anunciaba,
  añadiendo su martirio
  a las señales sagradas.
- |-
  Él, al nacer, descubrió
  al que es del mundo esperanza,
  y al propio autor del bautismo
  señaló sobre las aguas.
- |-
  De cuya muerte inocente,
  que da la vida a las almas,
  dio testimonio el Bautista
  con su sangre derramada.
- |-
  Concede, Padre piadoso,
  seguir de Juan las pisadas,
  para disfrutar con Cristo
  de la eterna venturanza. Amén.
Ángeles de la gloria y del servicio:
- |-
  Ángeles de la gloria y del servicio,
  que vivís junto a la fuente de la vida,
  la santidad de Dios es vuestra estancia
  y su divina faz es vuestra dicha.
- |-
  Ángeles servidores de la paz
  en Belén junto al Hijo de María,
  ángeles que rendís adoración
  en el desierto al vencedor Mesías,
- |-
  jóvenes de celestes vestiduras
  para anunciar en Pascua la noticia,
  la Iglesia reconoce vuestros pasos
  y da gracias al Padre que os envía.
- |-
  Ángeles invisibles y callados,
  vuestra gracia supera fantasía;
  sois gozo de la excelsa Trinidad
  y ayuda de la Iglesia peregrina.
- |-
  Honor y majestad a Jesucristo,
  cuyo rostro los ángeles ansían;
  honor y gratitud al Unigénito,
  al que nos dio su honor con su venida. Amén.
Ésta era una niña:
- |-
  Ésta era una niña
  con aire de flor,
  agua más que el río,
  fuego más que el sol.
  Vivía en el templo
  del rey Salomón,
  oyendo en los salmos
  ecos de otra voz.
- |-
  El Viento es contigo,
  contigo el León,
  contigo el Lucero,
  contigo el Amor.
  Tú, fuente sellada,
  hija del Amor;
  tú, el alba más bella,
  del más bello sol.
- |-
  Sé tú siempre niña,
  sé tú siempre don,
  sé como esta niña
  con aire de flor,
  agua más que el río,
  fuego más que el sol. Amén.
Ésta es la hora para el buen amigo:
- |-
  Ésta es la hora para el buen amigo,
  llena de intimidad y confidencia,
  y en la que, al examinar nuestra conciencia,
  igual que siente el rey, siente el mendigo.
- |-
  Hora en que el corazón encuentra abrigo
  para lograr alivio a su dolencia
  y, al evocar la edad de la inocencia,
  logra en el llanto bálsamo y castigo.
- |-
  Hora en que arrullas, Cristo, nuestra vida
  con tu amor y caricia inmensamente
  y que a humildad y a llanto nos convida.
- |-
  Hora en que un ángel roza nuestra frente
  y en que el alma, como cierva herida,
  sacia su sed en la escondida fuente. Amén.
Éste es el tiempo en que llegas:
- |-
  Éste es el tiempo en que llegas,
  Esposo, tan de repente,
  que invitas a los que velan
  y olvidas a los que duermen.
- |-
  Salen cantando a tu encuentro
  doncellas con ramos verdes
  y lámparas que guardaron
  copioso y claro el aceite.
- |-
  ¡Cómo golpean las necias
  las puertas de tu banquete!
  ¡Y cómo lloran a oscuras
  los ojos que no han de verte!
- |-
  Mira que estamos alerta,
  Esposo, por si vinieres,
  y está el corazón velando
  mientras los ojos se duermen.
- |-
  Danos un puesto a tu mesa,
  Amor que a la noche vienes,
  antes que la noche acabe
  y que la puerta se cierre. Amén.
