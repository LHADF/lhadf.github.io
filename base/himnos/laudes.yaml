# Himnos de Laudes en español, por título.
A la orilla del Jordán:
- |-
  A la orilla del Jordán,
  descalza el alma y los pies,
  bajan buscando pureza
  doce tribus de Israel.
- |-
  Piensan que a la puerta está
  el Mesías del Señor
  y que para recibirle
  gran limpieza es menester.
- |-
  Bajan hombres y mujeres,
  pobres y ricos también,
  y Juan, sobre todos ellos,
  derrama el agua y la fe.
- |-
  Mas ¿por qué se ha de lavar
  a la Pureza, por qué?
  Porque el bautismo hoy empieza
  y ha comenzado por él. Amén.
Al canto de los gallos:
- |-
  Al canto de los gallos
  viene la aurora;
  los temores se alejan
  como las sombras.
  ¡Dios, Padre nuestro,
  en tu nombre dormimos
  y amanecemos!
- |-
  Como luz nos visitas,
  Rey de los hombres,
  como amor que vigila
  siempre de noche;
  cuando el que duerme
  bajo el signo del sueño
  prueba la muerte.
- |-
  Del sueño del pecado
  nos resucitas,
  y es señal de tu gracia
  la luz amiga.
  ¡Dios que nos velas!,
  tú nos sacas por gracia
  de las tinieblas.
- |-
  Gloria al Padre y al Hijo,
  gloria al Espíritu,
  al que es paz, luz y vida,
  al Uno y Trino;
  gloria a su nombre
  y al misterio divino
  que nos lo esconde. Amén.
Al retornar este día:
- |-
  Al retornar este día,
  con voz alegre y canora,
  celebrando al Redentor,
  cantemos de Dios la gloria.
- |-
  Por Cristo, el Creador inmenso
  hizo la noche y la aurora,
  con inmóvil ley fijando
  la sucesión de las horas.
- |-
  La luz eterna eres tú,
  la antigua ley perfeccionas,
  y no conoces crepúsculo,
  y no te apagan las sombras.
- |-
  Concédenos, Padre eterno,
  que vivamos hoy con loa,
  con que agrademos a Cristo,
  si tu Espíritu nos colma. Amén.
Alfarero del hombre, mano trabajadora:
- |-
  Alfarero del hombre, mano trabajadora
  que, de los hondos limos iniciales,
  convocas a los pájaros a la primera aurora,
  al pasto los primeros animales.
- |-
  De mañana te busco, hecho de luz concreta,
  de espacio puro y tierra amanecida.
  De mañana te encuentro, vigor, origen, meta
  de los profundos ríos de la vida.
- |-
  El árbol toma cuerpo, y el agua melodía;
  tus manos son recientes en la rosa;
  se espesa la abundancia del mundo a mediodía,
  y estás de corazón en cada cosa.
- |-
  No hay brisa si no alientas, monte si no estás dentro,
  ni soledad en que no te hagas fuerte.
  Todo es presencia y gracia; vivir es este encuentro:
  tú, por la luz; el hombre, por la muerte.
- |-
  ¡Que se acabe el pecado! ¡Mira que es desdecirte
  dejar tanta hermosura en tanta guerra!
  Que el hombre no te obligue, Señor, a arrepentirte
  de haberle dado un día las llaves de la tierra. Amén.
Anunciaron ira divina:
- |-
  Anunciaron ira divina,
  que el cielo y la tierra calcina,
  los profetas del Señor.
- |-
  Yo temo al juicio severo,
  al examen justiciero
  del divino Redentor.
- |-
  La trompeta, con sus sones,
  llama a todas las naciones,
  las convoca al tribunal.
- |-
  Todos tiemblan por su suerte,
  al retornar de la muerte
  para el juicio universal.
- |-
  Un libro será llevado,
  donde figura anotado
  todo lo que hay que juzgar.
- |-
  Todo quedará patente
  cuando en el trono se siente
  el Rey del juicio final.
- |-
  Oh Dios santo, el uno y trino,
  llévanos por tu camino
  a la patria celestial. Amén.
Ayer, alba en el alba, subiste presurosa:
- |-
  Ayer, alba en el alba, subiste presurosa
  por servir a tu prima, cual sierva ante los siervos.
  Hoy a México bajas, cual Rosa misteriosa,
  para anuciar al indio que en sus ratos acervos
- |-
  jamás estará solo; porque jamás, oh Madre,
  has sido en nuestra historia cobarde subterfugio;
  porque tú eres la escala ante el Hijo del Padre:
  ¡tú el regazo y el puente; tú, defensa y refugio!
- |-
  Eres cifra y compendio de nuestra patria suave;
  eres signo y substancia de nuestra nueva raza;
  eres lámpara y cuna, eres báculo y ave,
  eres vínculo y nudo, eres tilma, eres casa.
- |-
  Por tus manos en hueco, patena de ternura,
  consagramos al Padre de todos los consuelos,
  por el Hijo, en la Llama quemaste la amargura
  del sudor hecho lágrimas y el júbilo hecho anhelos.
  Amén.
Brazos rígidos y yertos:
- |-
  Brazos rígidos y yertos,
  por dos garfios traspasados,
  que aquí estáis, por mis pecados,
  para recibirme abiertos,
  para esperarme clavados.
- |-
  Cuerpo llagado de amores,
  yo te adoro y yo te sigo;
  yo, Señor de los señores,
  quiero partir tus dolores
  subiendo a la cruz contigo.
- |-
  Quiero en la vida seguirte
  y por sus caminos irte
  alabando y bendiciendo,
  y bendecirte sufriendo
  y muriendo bendecirte.
- |-
  Que no ame la poquedad
  de cosas que van y vienen;
  que adore la austeridad
  de estos sentires que tienen
  sabores de eternidad;
- |-
  que sienta una dulce herida
  de ansia de amor desmedida;
  que ame tu ciencia y tu luz;
  que vaya, en fin, por la vida
  como tú estás en la cruz:
- |-
  de sangre los pies cubiertos,
  llagadas de amor las manos,
  los ojos al mundo muertos
  y los dos brazos abiertos
  para todos mis hermanos. Amén.
Brille la cruz del Verbo, luminosa:
- |-
  Brille la cruz del Verbo, luminosa,
  brille como la carne sacratísima
  de aquel Jesús nacido de la Virgen
  que en la gloria del Padre vive y brilla.
- |-
  Gemía Adán doliente y conturbado,
  lágrimas Eva junto a Adán vertía;
  brillen sus rostros por la cruz gloriosa,
  cruz que se enciende cuando el Verbo expira.
- |-
  ¡Salve, cruz de los montes y caminos,
  junto al enfermo suave medicina,
  regio trono de Cristo en las familias,
  cruz de nuestra fe, salve cruz bendita!
- |-
  Reine el Señor crucificado,
  levantando la cruz donde moría;
  nuestros enfermos ojos buscan luz,
  nuestros labios el río de la vida.
- |-
  Te adoramos, oh cruz que fabricamos
  pecadores con manos deicidas;
  te adoramos, ornato del Señor,
  sacramento de nuestra eterna dicha. Amén.
Cabeza y Cuerpo, Cristo forma un todo:
- |-
  Cabeza y Cuerpo, Cristo forma un todo,
  Hijo de Dios e Hijo de María:
  un Hijo en quien se juntan muchos hijos:
  en su Madre ya la Iglesia se perfila.
- |-
  Una y otra son madres y son vírgenes,
  una y otra conciben del Espíritu,
  una y otra sin mancha ni pecado,
  al Padre celestial engendran hijos.
- |-
  María le da al Cuerpo la Cabeza,
  la Iglesia a la Cabeza le da el Cuerpo:
  una y otra son madre del Señor,
  ninguna sin la otra por entero.
- |-
  Gloria a la Trinidad inaccesible
  que ha querido morar entre nosotros,
  en María, en la Iglesia, en nuestra alma,
  para llenarnos de su eterno gozo. Amén.
Cantemos al Señor con indecible gozo:
- |-
  Cantemos al Señor con indecible gozo,
  él guarde la esperanza de nuestro corazón,
  dejemos la inquietud posar entre sus manos,
  abramos nuestro espíritu a su infinito amor.
- |-
  Dichoso será aquel que siempre en él confía
  en horas angustiosas de lucha y de aflicción,
  confiad en el Señor si andáis atribulados,
  abramos nuestro espíritu a su infinito amor.
- |-
  Los justos saben bien que Dios siempre nos ama,
  en penas y alegrías su paz fue su bastión,
  la fuerza del Señor fue gloria en sus batallas,
  abramos nuestro espíritu a su infinito amor.
- |-
  Envíanos, Señor, tu luz esplendorosa
  si el alma se acongoja en noche y turbación,
  qué luz, qué dulce paz en Dios el hombre encuentra;
  abramos nuestro espíritu a su infinito amor.
- |-
  Recibe, Padre santo, el ruego y la alabanza,
  que a ti, por Jesucristo y por el Consolador,
  dirige en comunión tu amada y santa Iglesia;
  abramos nuestro espíritu a su infinito amor. Amén.
Cantemos hoy a los ángeles:
- |-
  Cantemos hoy a los ángeles,
  custodios nuestros y hermanos,
  que velan por los humanos
  y van de su bien en pos.
  Ven siempre la faz del Padre,
  él los ampara benigno,
  y luchan contra el maligno
  en las batallas de Dios.
- |-
  ¡Oh espíritus inmortales!
  Tenéis por reina a María,
  sois su vital letanía,
  su enamorada legión.
  Por vuestro medio nos llegan
  dones y gracias del cielo,
  la fe, la luz, el consuelo,
  la paz y la inspiración.
- |-
  Terribles como un ejército
  bien ordenado en batalla,
  vuestra asistencia no falla
  contra la insidia infernal.
  Silentes guardas y amigos,
  de nuestra noche luceros,
  seréis nuestros compañeros
  en la patria celestial.
- |-
  La gloria a Dios que ha creado
  ejército tan prolijo:
  que adore sumiso al Hijo,
  su rey y su plenitud,
  y que al Espíritu Santo,
  terrenos y celestiales,
  le rindan universales
  tributos de gratitud. Amén.
Con el gozo pascual:
- |-
  Con el gozo pascual,
  el sol de nuevo brilla
  cuando ven los apóstoles
  que Jesús resucita.
- |-
  En la carne de Cristo
  ven claras las heridas
  y paladinamente
  que está vivo predican.
- |-
  Cristo, rey clementísimo,
  nuestras almas habita
  para que te celebremos
  por siempre en nuestra vida.
- |-
  Sé, Jesús, de las almas
  la pascual alegría,
  que, en gracia renacidos,
  tu triunfo nos anima.
- |-
  A ti, Jesús, la gloria,
  que, la muerte vencida,
  abres por los apóstoles
  nuevas sendas de vida. Amén.
Con presunción de bélico soldado:
- |-
  Con presunción de bélico soldado,
  galán sale feroz, Pablo, atrevido,
  que, si ahora en la cuenta no ha caído,
  caerá muy presto del primer estado.
- |-
  ¿Adónde, Pablo, de soberbia armado,
  para quedar con una voz vencido?
  Seguid las letras, ¿dónde vais perdido?,
  que habéis de ser doctor del mayor grado.
- |-
  Aunque valor vuestra persona encierra,
  no es bien que nadie contra Dios presuma:
  que dará con los ojos por la tierra.
- |-
  La Iglesia espera vuestra docta suma:
  mirad que no sois vos para la guerra,
  dejad las armas y tomad la pluma. Amén.
Contigo sube el mundo cuando subes:
- |-
  Contigo sube el mundo cuando subes,
  y al son de tu alegría matutina
  nos alzamos los muertos de las tumbas;
  salvados respiramos vida pura,
  bebiendo de tus labios el Espíritu.
- |-
  Cuanto la lengua a proferir no alcanza
  tu cuerpo nos lo dice, ¡Oh Traspasado!
  Tu carne santa es luz de las estrellas,
  victoria de los hombres, fuego y brisa,
  y fuente bautismal, ¡oh Jesucristo!
- |-
  Cuanto el amor humano sueña y quiere,
  en tu pecho, en tu médula, en tus llagas
  vivo está, ¡oh Jesús glorificado!
  En ti, Dios fuerte, Hijo primogénito,
  callando, el corazón lo gusta y siente.
- |-
  Lo que fue, lo que existe, lo que viene,
  lo que en el Padre es vida incorruptible,
  tu cuerpo lo ha heredado y nos lo entrega.
  Tú nos haces presente la esperanza,
  tú que eres nuestro hermano para siempre.
- |-
  Cautivos de tu vuelo y exaltados
  contigo hasta la diestra poderosa,
  al Padre y al Espíritu alabamos;
  como espigas que doblan la cabeza,
  los hijos de la Iglesia te adoramos. Amén.
Creador sempiterno de las cosas:
- |-
  Creador sempiterno de las cosas,
  que gobiernas las noches y los días,
  y, alternando la luz y las tinieblas,
  alivias el cansancio de la vida.
- |-
  Pon tus ojos, Señor, en quien vacila,
  que a todos corrija tu mirada:
  con ella sostendrás a quien tropieza
  y harás que pague su delito en lágrimas.
- |-
  Alumbra con tu luz nuestros sentidos,
  desvanece el sopor de nuestras mentes,
  y sé el primero a quien, agradecidas,
  se eleven nuestras voces cuando suenen.
- |-
  Glorificado sea el Padre eterno,
  así como su Hijo Jesucristo,
  y así como el Espíritu Paráclito,
  ahora y por los siglos de los siglos. Amén.
Crece la luz bajo tu hermosa mano:
- |-
  Crece la luz bajo tu hermosa mano,
  Padre celeste, y suben
  los hombres matutinos al encuentro
  de Cristo Primogénito.
- |-
  El hizo amanecer ante tus ojos
  y enalteció la aurora,
  cuando aún no estaba el hombre sobre el mundo
  para poder cantarla.
- |-
  El es principio y fin del universo,
  y el tiempo, en su caída,
  se acoge al que es la fuerza de las cosas
  y en él rejuvenece.
- |-
  Él es quien nos reanima y fortalece,
  y hace posible el himno
  que, ante las maravillas de tus manos,
  cantamos jubilosos.
- |-
  He aquí la nueva luz que asciende y busca
  su cuerpo misterioso;
  he aquí, en la claridad de la mañana,
  el signo de tu rostro.
- |-
  Envía, Padre eterno, sobre el mundo
  el soplo de tu Hijo,
  potencia de tu diestra y primogénito
  de todos los que mueren. Amén.
Cristo es la vida que, viniendo al mundo:
- |-
  Cristo es la vida que, viniendo al mundo,
  con sus heridas extirpó la muerte,
  y, vuelto al Padre, a su derecha goza
  reino perenne.
- |-
  A él sigue Esteban, su primer discípulo,
  galardonado de gloriosa suerte,
  aquella que al morir le dio el Espíritu
  benignamente.
- |-
  Nube de piedras su existencia apaga,
  sin que la rabia de los malos cese,
  piadoso acaba perdonando a aquellos
  sayones crueles.
- |-
  Oh, te pedimos, santo protomártir,
  hoy habitante de la paz celeste,
  que, desde el alto empíreo, nos depares
  gratas mercedes.
- |-
  Gloria a la Trinidad hoy entonemos,
  que a Esteban coronó en dichosa muerte:
  luchó el mártir, triunfó, y reina en los cielos
  gloriosamente. Amén.
Cristo, cabeza, rey de los pastores:
- |-
  Cristo, cabeza, rey de los pastores,
  el pueblo entero, madrugando a fiesta,
  canta a la gloria de tu sacerdote
  himnos sagrados.
- |-
  Con abundancia de sagrado crisma,
  la unción profunda de tu Santo Espíritu
  lo armó guerrero y lo nombró en la Iglesia
  jefe del pueblo.
- |-
  El fue pastor y forma del rebaño,
  luz para el ciego, báculo del pobre,
  padre común, presencia providente,
  todo de todos.
- |-
  Tú que coronas sus merecimientos,
  danos la gracia de imitar su vida,
  y al fin, sumisos a su magisterio,
  danos su gloria. Amén.
Cristo, el Señor:
- |-
  Cristo, el Señor,
  como la primavera,
  como una nueva aurora,
  resucitó.
- |-
  Cristo, nuestra Pascua,
  es nuestro rescate,
  nuestra salvación.
- |-
  Es grano en la tierra,
  muerto y florecido,
  tierno pan de amor.
- |-
  Se rompió el sepulcro,
  se movió la roca,
  y el fruto brotó.
- |-
  Dueño de la muerte,
  en el árbol grita
  su resurrección.
- |-
  Humilde en la tierra,
  Señor de los cielos,
  su cielo nos dio.
- |-
  Ábranse de gozo
  las puertas del Hombre,
  que al hombre salvó.
- |-
  Gloria para siempre
  al Cordero humilde
  que nos redimió. Amén.
Cuando el gallo, tres veces:
- |-
  Cuando el gallo, tres veces
  negaste a tu Maestro;
  y él tres veces te dijo:
  «¿Me amas más que éstos?»
- |-
  Se te puso muy triste
  tu llanto y tu silencio:
  pero la Voz te habló de apacentar corderos.
- |-
  Tu pecado quemante
  se convirtió en incendio,
  y abriste tus dos brazos
  al madero sangriento.
- |-
  La cabeza hacia abajo
  y el corazón al cielo:
  porque, cuando aquel gallo,
  negaste a tu Maestro. Amén.
Cuando vuelto hacia ti de mi pecado:
- |-
  Cuando vuelto hacia ti de mi pecado
  iba pensando en confesar sincero
  el dolor desgarrado y verdadero
  del delito de haberte abandonado;
- |-
  cuando pobre volvime a ti humillado,
  me ofrecí como inmundo pordiosero;
  cuando, temiendo tu mirar severo,
  bajé los ojos, me sentí abrazado.
- |-
  Sentí mis labios por tu amor sellados
  y ahogarse entre tus lágrimas divinas
  la triste confesión de mis pecados.
- |-
  Llenóse el alma en luces matutinas,
  y, viendo ya mis males perdonados,
  quise para mi frente tus espinas. Amén.
Cuando, Señor, en quieta lontananza:
- |-
  Cuando, Señor, en quieta lontananza
  se encienden los fulgores de este día,
  no dejes de avivar nuestra esperanza,
  atiende al corazón que en ti confía.
- |-
  Van a pasar por manos laboriosas
  los granos de un rosario de ilusiones,
  acógelas, Señor, que son hermosas,
  amor y don de nuestros corazones.
- |-
  Mujer llena de Dios, oh santa Rosa,
  vivir para el Señor, para el Amado,
  fue el ansia de tu amor, gracia divina,
  llevada de su fuerza y de su mano.
- |-
  No olvides los que vamos de camino
  siguiendo en el desierto tus pisadas,
  aboga ante el Señor favor divino
  seguir como seguiste sus llamadas.
- |-
  Proclamen nuestros labios la grandeza
  del Padre que en el Hijo nos dio gozo,
  y, siendo nuestra herencia la pobreza,
  nos colma de su amor el Fuego Santo. Amén.
Dador de luz espléndido:
- |-
  Dador de luz espléndido,
  A cuya luz serena,
  Pasada ya la noche,
  El día se despliega.
- |-
  Mensajero de luz
  que de luz centellea,
  no es del alba el lucero:
  eres tú, Luz de veras,
- |-
  más brillante que el sol,
  todo luz y pureza;
  enciende nuestro pecho,
  alumbra el alma nuestra.
- |-
  Ven, Autor de la vida,
  prez de la luz paterna,
  sin cuya gracia el cuerpo
  se sobresalta y tiembla.
- |-
  A Cristo, rey piadoso,
  y al Padre gloria eterna,
  y por todos los siglos
  al Espíritu sea. Amén.
Dejado ya el descanso de la noche:
- |-
  Dejado ya el descanso de la noche,
  despierto en la alegría de tu amor,
  concédeme tu luz que me ilumine
  como ilumina el sol.
- |-
  No sé lo que será del nuevo día
  que entre luces y sombras viviré,
  pero sé que, si tú vienes conmigo,
  no fallará mi fe.
- |-
  Tal vez me esperen horas de desierto
  amargas y sedientas, mas yo sé
  que, si vienes conmigo de camino,
  jamás yo tendré sed.
- |-
  Concédeme vivir esta jornada
  en paz con mis hermanos y mi Dios,
  al sentarnos los dos para la cena,
  párteme el pan, Señor.
- |-
  Recibe, Padre santo, nuestro ruego,
  acoge por tu Hijo la oración
  que fluye del Espíritu en el alma
  que sabe de tu amor. Amén.
Delante de la cruz los ojos míos:
- |-
  Delante de la cruz los ojos míos
  quédenseme, Señor, así mirando,
  y sin ellos quererlo estén llorando,
  porque pecaron mucho y están fríos.
- |-
  Y estos labios que dicen mis desvíos,
  quédenseme, Señor, así cantando,
  y sin ellos quererlo estén rezando,
  porque pecaron mucho y son impíos.
- |-
  Y así con la mirada en vos prendida,
  y así con la palabra prisionera,
  como la carne a vuestra cruz asida,
- |-
  quédeseme, Señor, el alma entera;
  y así clavada en vuestra cruz mi vida,
  Señor, así, cuando queráis me muera. Amén.
Desde el albor de nuestra historia:
- |-
  Desde el albor de nuestra historia,
  suave, discreta y escondida,
  llega María a nuestra tierra,
  Virgen y Madre prometida.
- |-
  La luz del Hijo la rodea,
  por él es bella sin medida,
  y no hay bondad entre los hombres
  que pueda serle parecida.
- |-
  Suba al Señor cual blanca nube
  esta alabanza proferida:
  a Dios bendito bendecimos
  por la que fue la Bendecida. Amén.
Desde la cruz redentora:
- |-
  Desde la cruz redentora,
  el Señor nos dio el perdón,
  y, para darnos su amor,
  todo a la vez, sin medida,
  abrió en su pecho una herida
  y nos dio su corazón.
- |-
  Santa cruz de Jesucristo,
  abierta como dos brazos:
  rumbo de Dios y regazo
  en la senda del dolor,
  brazos tendidos de amor
  sosteniendo nuestros pasos.
- |-
  Sólo al chocar en las piedras
  el río canta al Creador;
  del mismo modo el dolor,
  como piedra de mi río,
  saca del corazón mío
  el mejor canto de amor. Amén.
Dieron muerte al Heredero:
- |-
  Dieron muerte al Heredero,
  su oblación es haz de luz,
  reina Dios desde el madero,
  fulge el signo de la cruz.
- |-
  En los cielos contemplamos
  nuestra prenda tan locuaz
  como símbolo divino
  de salud, de amor, de paz.
- |-
  ¡Resplandece, brilla, avanza,
  oh estandarte del gran Rey!
  ¡Oh cruz, única esperanza
  y resumen de su ley!
- |-
  Que presidas nuestra suerte
  -cada cual con nuestra cruz-
  y en la hora de la muerte
  nos conduzcas a Jesús.
- |-
  Gloria al Padre con el Hijo
  y el Espíritu de amor;
  las tres personas reciban
  por la cruz igual honor. Amén.
Edificaste una torre:
- |-
  Edificaste una torre
  para tu huerta florida;
  un lagar para tu vino
  y, para el vino, una viña.
- |-
  Y la viña no dio uvas,
  ni el lagar buena bebida:
  sólo racimos amargos
  y zumos de amarga tinta.
- |-
  Edificaste una torre,
  Señor, para tu guarida;
  un huerto de dulces frutos,
  una noria de aguas limpias,
  un blanco silencio de horas
  y un verde beso de brisas.
- |-
  Y esta casa que es tu torre,
  este mi cuerpo de arcilla,
  esta sangre que es tu sangre
  y esta herida que es tu herida
  te dieron frutos amargos,
  amargas uvas y espinas.
- |-
  ¡Rompe, Señor, tu silencio,
  rompe tu silencio y grita!
  Que mi lagar enrojezca
  cuando tu planta lo pise,
  y que tu mesa se endulce
  con el vino de tu viña. Amén.
El agua pura, don de la mañana:
- |-
  El agua pura, don de la mañana,
  da a los ojos el brillo de la vida,
  y el alma se despierta cuando escucha
  que el ángel dice: «¡Cristo resucita!»
- |-
  ¡Cómo quieren las venas de mi cuerpo
  ser música, ser cuerdas de la lira,
  y cantar, salmodiar como los pájaros,
  en esta Pascua santa la alegría!
- |-
  Mirad cuál surge Cristo transparente:
  en medio de los hombres se perfila
  su cuerpo humano, cuerpo del amigo
  deseado, serena compañía.
- |-
  El que quiera palparlo, aquí se acerque,
  entre con su fe en el Hombre que humaniza,
  derrame su dolor y su quebranto,
  dé riendas al amor, su gozo diga.
- |-
  A ti, Jesús ungido, te ensalzamos,
  a ti, nuestro Señor, que depositas
  tu santo y bello cuerpo en este mundo,
  como en el campo se echa la semilla. Amén.
El cielo y la tierra:
- |-
  El cielo y la tierra
  celebren, aplaudan
  a la Iglesia, esposa
  sin arruga y mancha.
- |-
  Descienda a nosotros
  la ciudad sagrada,
  en que todo es nuevo
  y de rica gala.
- |-
  En piedras preciosas
  está cimentada,
  y bien construida
  en brillos de gracia.
- |-
  Las piedras preciosas
  que están a su entrada
  muestran la hermosura
  de esta casa santa.
- |-
  Descienda a nosotros
  esta santa casa,
  que hizo el Rey eterno
  para su morada. Amén.
El pueblo que fue cautivo:
- |-
  El pueblo que fue cautivo
  y que tu mano libera
  no encuentra mayor palmera
  ni abunda en mejor olivo.
  Viene con aire festivo
  para enramar tu victoria,
  y no te ha visto en su historia,
  Dios de Israel, más cercano:
  ni tu poder más a mano
  ni más humilde tu gloria.
- |-
  ¡Gloria, alabanza y honor!
  Gritad: «¡Hosanna!», y haceos
  como los niños hebreos
  al paso del Redentor.
  ¡Gloria y honor
  al que viene en el nombre del Señor! Amén.
Emprenda la esperanza raudo vuelo:
- |-
  Emprenda la esperanza raudo vuelo
  siguiendo los caminos de nuestro Salvador,
  y libre de nostalgias, camino de los cielos,
  alegre el corazón.
- |-
  Dijeron que te fuiste a las alturas
  juntándote a los coros del «Gloria» de Belén,
  acaban hoy su canto en melodías puras
  con un solemne «Amén».
- |-
  Jamás te irás, Señor, porque eres nuestro,
  serás Hijo del hombre sin fin de eternidad;
  los hombres, por tu nombre, de Dios hijos dilectos,
  hermanos te serán.
- |-
  Asciende victorioso del combate,
  derrama sobre el mundo tu Espíritu de amor,
  retorna jubiloso al seno de tu Padre,
  tú volverás Señor. Amén.
En el nombre del Padre, del Hijo y del Espíritu:
- |-
  En el nombre del Padre, del Hijo y del Espíritu,
  salimos de la noche y estrenamos la aurora;
  saludamos el gozo de la luz que nos llega
  resucitada y resucitadora.
- |-
  Tu mano acerca el fuego a la tierra sombría,
  y el rostro de las cosas se alegra en tu presencia;
  silabeas el alba igual que una palabra,
  tú pronuncias el mar como sentencia.
- |-
  Regresa, desde el sueño, el hombre a su memoria,
  acude a su trabajo, madruga a sus dolores;
  le confías la tierra, y a la tarde la encuentras
  rica de pan y amarga de sudores.
- |-
  Y tú te regocijas, oh Dios, y tu prolongas
  en sus pequeñas manos tus manos poderosas,
  y estáis de cuerpo entero los dos así creando,
  los dos así velando por las cosas.
- |-
  ¡Bendita la mañana que trae la noticia
  de tu presencia joven, en gloria y poderío,
  la serena certeza con que el día proclama
  que el sepulcro de Cristo está vacío! Amén.
En la hora en que Cristo resucita:
- |-
  En la hora en que Cristo resucita,
  clama Miguel, el poderoso príncipe:
  «¿Quién como tú, mi Dios, Jesús humilde?
  Al pecado de los hombres descendiste
  y hoy el Padre te signa y te bendice.»
- |-
  En la hora en que Cristo resucita,
  Dice Gabriel, el que anunció a María:
  «¡Exulta, Iglesia, virgen afligida,
  el santo vencedor es tu Mesías!
  Nadie podrá dar muerte a tu alegría.»
- |-
  En la hora en que Cristo resucita,
  Proclama Rafael, el peregrino:
  «¡Glorificad conmigo a aquel que dijo:
  Yo soy la luz del mundo y el camino!
  ¡Bendecidle, que el viaje está cumplido!»
- |-
  En la hora en que Cristo resucita,
  se ha tendido la escala misteriosa
  y el coro de los ángeles le adora:
  «¡Somos, Señor, los siervos de tu gloria,
  cielo y tierra cantemos tu victoria!» Amén.
En tus manos, Señor, pongo mi vida:
- |-
  En tus manos, Señor, pongo mi vida
  con todas sus angustias y dolores;
  que en ti florezcan frescos mis amores
  y que halle apoyo en ti mi fe caída.
- |-
  Quiero ser como cera derretida
  que modelen tus dedos creadores;
  y morar para siempre sin temores
  de tu costado en la sangrienta herida.
- |-
  Vivir tu muerte y tus dolores grandes,
  disfrutar tus delicias verdaderas
  y seguir el camino por donde andes.
- |-
  Dame, Señor, huir de mis quimeras,
  dame, Señor, que quiera lo que mandes
  para poder querer lo que tú quieras. Amén.
Era pobre y silenciosa:
- |-
  Era pobre y silenciosa,
  pero con rayos de luz;
  olor a jazmín y a rosa
  y el Niño que la alboroza:
  es la casa de Jesús.
- |-
  Un taller de carpintero
  y un gran misterio de fe;
  manos callosas de obrero,
  justas manos de hombre entero:
  es la casa de José.
- |-
  Había júbilo y canto;
  ella lavaba y barría,
  y el arcángel saludando
  repetía noche y día:
  «Casa del Ave María.»
- |-
  Familia pobre y divina,
  pobre mesa, pobre casa,
  mucha unión, ninguna espina
  y el ejemplo que culmina
  en un amor que no pasa.
- |-
  Concede, Padre, Señor,
  una mesa y un hogar,
  amor para trabajar,
  padres a quienes querer
  y una sonrisa que dar. Amén.
Eres la luz y siembras claridades:
- |-
  Eres la luz y siembras claridades;
  abres los anchos cielos que sostienen,
  como un pilar, los brazos de tu Padre.
- |-
  Arrebatada en rojos torbellinos,
  el alba apaga estrellas lejanísimas;
  la tierra se estremece de rocío.
- |-
  Mientras la noche cede y se disuelve,
  la estrella matinal, signo de Cristo,
  levanta el nuevo día y lo establece.
- |-
  Eres la luz total, Día del Día,
  el Uno en todo, el Trino todo en Uno:
  ¡gloria a tu misteriosa teofanía! Amén.
Eres tú la mujer llena de gloria:
- |-
  Eres tú la mujer llena de gloria,
  alzada por encima de los astros;
  con tu sagrado pecho das la leche
  al que en su providencia te ha creado.
- |-
  Lo que Eva nos perdió tan tristemente,
  tú lo devuelves por tu fruto santo;
  para que al cielo ingresen los que lloran,
  eres tú la ventana del costado.
- |-
  Tú eres la puerta altísima del Rey
  y la entrada fulgente de la luz;
  la vida que esta Virgen nos devuelve
  aplauda el pueblo que alcanzó salud.
- |-
  Sea la gloria a ti, Señor Jesús,
  que de María Virgen has nacido,
  gloria contigo al Padre y al Paráclito,
  por sempiternos y gozosos siglos. Amén.
Es la Pascua real, no ya la sombra:
- |-
  Es la Pascua real, no ya la sombra,
  la verdadera pascua del Señor;
  la sangre del pasado es solo un signo,
  la mera imagen de la gran unción.
- |-
  En verdad, tú, Jesús, nos protegiste
  con tus sangrientas manos paternales;
  envolviendo en tus alas nuestras almas,
  la verdadera alianza tú sellaste.
- |-
  Y, en tu triunfo, llevaste a nuestra carne
  reconciliada con tu Padre eterno;
  y, desde arriba, vienes a llevarnos
  a la danza festiva de tu cielo.
- |-
  Oh gozo universal, Dios se hizo hombre
  para unir a los hombres con su Dios;
  se rompen las cadenas del infierno,
  y en los labios renace la canción.
- |-
  Cristo, Rey eterno, te pedimos
  que guardes con tus manos a tu Iglesia,
  que protejas y ayudes a tu pueblo
  y que venzas con él a las tinieblas. Amén.
Es verdad que las luces del alba:
- |-
  Es verdad que las luces del alba
  del día de hoy
  son más puras, radiantes y bellas,
  por gracia de Dios.
- |-
  Es verdad que yo siento en mi vida,
  muy dentro de mí,
  que la gracia de Dios es mi gracia,
  que no merecí.
- |-
  Es verdad que la gracia del Padre,
  en Cristo Jesús,
  es la gloria del hombre y del mundo
  bañados en luz.
- |-
  Es verdad que la Pascua de Cristo
  es pascua por mí,
  que su muerte y victoria me dieron
  eterno vivir.
- |-
  Viviré en alabanzas al Padre,
  que al Hijo nos dio,
  y que el santo Paráclito inflame
  nuestra alma en amor. Amén.
Escuchen qué cosa y cosa:
- |-
  Escuchen qué cosa y cosa
  tan maravillosa, aquesta:
  un padre que no ha engendrado
  a un Hijo, a quien otro engendra.
- |-
  Un hombre que da alimentos
  al mismo que lo alimenta;
  cría al que lo crió,
  y al mismo sustenta que lo sustenta.
- |-
  Manda a su propio Señor
  y a su Hijo Dios respeta;
  tiene por ama a una esclava,
  y por esposa a una reina.
- |-
  Celos tuvo y confianza,
  seguridad y sospechas,
  riesgos y seguridades,
  necesidad y riquezas.
- |-
  Tuvo, en fin, todas las cosas
  que pueden pensarse buenas;
  y es de María esposo y,
  de Dios, padre en la tierra. Amén.
Estaba al alba María:
- |-
  Estaba al alba María,
  llamándole con sus lágrimas.
- |-
  Vino la Gloria del Padre
  y amaneció el primer día.
  Envuelto en la blanca túnica
  de su propia luz divina
  —la sábana de la muerte
  dejada en tumba vacía—,
  Jesús, alzado, reinaba;
  pero ella no lo veía.
- |-
  Estaba al alba María,
  la fiel esposa que aguarda.
- |-
  Mueva el Espíritu al aura
  en el jardín de la vida.
  Las flores huelan la Pascua
  de la carne sin mancilla,
  y quede quieta la esposa
  sin preguntas ni fatiga.
  ¡Ya está delante el esposo,
  venido de la colina!
- |-
  Estaba al alba María,
  porque era la enamorada. Amén.
Estrella nunca vista se aparece:
- |-
  Estrella nunca vista se aparece
  a los remotos magos orientales,
  y, al juzgar de los fuegos celestiales,
  otra lumbre mayor los esclarece.
- |-
  Nacido sacro Rey se les ofrece,
  con nuevas maravillas y señales,
  para que reverentes y leales
  la obediencia le den como merece.
- |-
  Parten llevados de la luz y el fuego,
  del fuego de su amor; luz que los guía
  con claridad ardiente y soberana.
- |-
  Subió al trono de Dios el pío ruego,
  y, llenos de firmísima alegría,
  vieron la luz de Dios por nube humana.
- |-
  Gloria y loores por la eternidad
  tribútense a la Santa Trinidad. Amén.
Estás aquí, Señor, bien lo proclaman:
- |-
  Estás aquí, Señor, bien lo proclaman
  los justos que de siempre han esperado
  estar cerca de ti, porque te aman
  y luchan por el mundo que has salvado.
- |-
  Estás aquí, mi Dios, humilde hermano,
  presencia ante mis ojos revelada,
  Salvador eternal del pueblo humano,
  Luz de la Luz que brilla en tu mirada.
- |-
  Bienvenido, Mesías esperado;
  que deje el corazón toda amargura
  porque Dios, siendo Dios, nos ha salvado
  en locura de amor y de ternura.
- |-
  Demos gracias al Padre que ha querido
  darnos el Hijo eterno y bien amado,
  todo el pueblo de Dios le cante unido
  al Fuego del amor que lo ha engendrado. Amén.
Estáte, Señor, conmigo:
- |-
  Estáte, Señor, conmigo
  siempre, sin jamás partirte,
  y cuando decidas irte,
  llévame, Señor, contigo;
  porque el pensar que te irás
  me causa un terrible miedo
  de si yo sin ti me quedo,
  de si tú sin mí te vas.
- |-
  Llévame, en tu compañía
  donde tu vayas, Jesús,
  porque bien sé que eres tú
  la vida del alma mía;
  si tú vida no me das
  yo sé que vivir no puedo,
  ni si yo sin ti me quedo,
  ni si tú sin mí te vas.
- |-
  Por eso, más que a la muerte
  temo, Señor, tu partida,
  y quiero perder la vida
  mil veces más que perderte;
  pues la inmortal que tú das,
  sé que alcanzarla no puedo,
  cuando yo sin ti me quedo,
  cuando tú sin mí te vas. Amén.
Finísimo fue el lino con que ella:
- |-
  Finísimo fue el lino con que ella
  fue tejiendo, a lo largo de su vida,
  esa historia de amor que la hace bella
  a los ojos de Dios y bendecida.
- |-
  Supo trenzar con tino los amores
  del cielo y de la tierra, y santamente
  hizo altar del telar de sus labores,
  oración desgranada lentamente.
- |-
  Flor virgen, florecida en amor santo,
  llenó el hogar de paz y joven vida,
  su dulce fortaleza fue su encanto,
  la fuerza de su amor la fe vivida.
- |-
  Una escuela de fe fue su regazo,
  todos fueron dichosos a su vera,
  su muerte en el Señor fue un tierno abrazo,
  su vida será eterna primavera. Amén.
Gloriosa aurora de este nuevo día:
- |-
  Gloriosa aurora de este nuevo día,
  despierta en nuestras almas la alegría
  de ver nuestro Señor glorificado,
  vencidos ya la muerte y el pecado.
- |-
  Jesús llena de luz el mundo entero;
  de cuantos vivirán, él el primero
  entró en la luz de eternas claridades,
  glorioso ya sin fin de eternidades.
- |-
  Torrente de alegría, salte y fluya
  el grito jubiloso de aleluia,
  los hombres y los pueblos lo repitan,
  sus vidas en el Cristo resucitan.
- |-
  Jesús, presente y vivo en tus hermanos,
  acoge nuestras manos en tus manos,
  conduce el caminar de nuestras vidas
  por sendas de vivir ya redimidas.
- |-
  Recibe, Padre santo, la alabanza
  del pueblo que te aclama en la esperanza
  de ser junto a tu Hijo eternamente
  reunido por tu Espíritu clemente. Amén.
Gracias, Señor, por el día:
- |-
  Gracias, Señor, por el día,
  por tu mensaje de amor
  que nos das en cada flor;
  por esta luz de alegría,
  te doy las gracias, Señor.
- |-
  Gracias, Señor, por la espina
  que encontraré en el sendero,
  donde marcho pregonero
  de tu esperanza divina;
  gracias, por ser compañero.
- |-
  Gracias, Señor, porque dejas
  que abrase tu amor mi ser,
  porque haces aparecer
  tus flores a mis abejas,
  tan sedientas de beber.
- |-
  Gracias por este camino,
  donde caigo y me levanto,
  donde te entrego mi canto
  mientras marcho peregrino,
  Señor, a tu monte santo.
- |-
  Gracias, Señor, por la luz
  que ilumina mi existir;
  por este dulce dormir
  que me devuelve a tu cruz.
  ¡Gracias, Señor, por vivir! Amén.
Hoy desciende el Espíritu de fuego:
- |-
  Hoy desciende el Espíritu de fuego
  al corazón creyente de la Iglesia,
  el Señor que la quema y atraviesa
  enciende con su llama al universo.
- |-
  Ebrios del Santo Espíritu, los Doce
  rebosan de carismas y alabanzas;
  Dios baja al Sinaí, y en llamarada
  y en ímpetu de amor retumba el monte.
- |-
  Razas y pueblos quedan convocados;
  Dios se muestra en Sión, la bella altura,
  y en voz concorde aquí a los hombres junta,
  desde Babel dispersos en pecado.
- |-
  Se lanzan por el mundo los testigos;
  y sin ceñir espadas lo conquistan,
  y sin oro a los pobres dan la vida;
  el Espíritu guía y Cristo invicto.
- |-
  El Viento es brisa y fuerza de huracanes,
  y el Agua viva mueve los océanos;
  alzan los brazos y oran bendiciendo
  y el gozo transfigura sus semblantes.
- |-
  Espíritu de amor y de verdad,
  Espíritu confín de las promesas,
  oh Santo, a ti la gloria siempre sea,
  y a nosotros de ti la santidad. Amén.
Hoy grande gozo en el cielo:
- |-
  Hoy grande gozo en el cielo
  todos tienen,
  porque en un barrio del suelo
  nace Dios.
  ¡Qué gran gozo y alegría
  tengo yo!
- |-
  Mas no nace solamente
  en Belén,
  nace donde hay un caliente
  corazón.
  ¡Qué gran gozo y alegría
  tengo yo!
- |-
  Nace en mí, nace en cualquiera
  si hay amor;
  nace donde hay verdadera
  comprensión.
  ¡Qué gran gozo y alegría
  tiene Dios! Amén.
Jesús de dulce memoria:
- |-
  Jesús de dulce memoria,
  que das la paz verdadera;
  más dulce que toda miel
  es tu divina presencia.
- |-
  Nada se canta más suave,
  ni grato se experimenta,
  ni alegría mayor hay
  que de Cristo un alma llena.
- |-
  Jesús, tu dulzura excede
  -fuente de paz verdadera-
  todos los gozos humanos,
  cuanto el hombre soñar pueda.
- |-
  Si nuestras mentes visitas,
  la luz de verdad destella,
  el mundo aparece vano,
  todo, tu amor lo supera.
- |-
  Danos, benigno, perdón,
  de la gracia gran cosecha;
  haz que gocemos perennes
  de tu esplendor la presencia.
- |-
  Cantamos tus alabanzas,
  Jesús, sentado a la diestra
  de tu Padre, cuyo Amor
  tu ser divino revela. Amén.
La Virgen santa, grávida del Verbo:
- |-
  La Virgen santa, grávida del Verbo,
  en alas del Espíritu camina;
  la Madre que llevaba la Palabra,
  de amor movida, sale de visita.
- |-
  Y sienten las montañas silenciosas,
  y el mundo entero en sus entrañas vivas,
  que al paso de la Virgen ha llegado
  el anunciado gozo del Mesías.
- |-
  Alborozado Juan por su Señor,
  en el seno, feliz se regocija,
  y por nosotros rinde el homenaje
  y al Hijo santo da la bienvenida.
- |-
  Bendito en la morada sempiterna
  aquel que tú llevaste, Peregrina,
  aquel que, con el Padre y el Espíritu,
  al bendecirte a ti nos bendecía. Amén.
La bella flor que en el suelo:
- |-
  La bella flor que en el suelo
  plantada se vio marchita
  ya torna, ya resucita,
  ya su olor inunda el cielo.
- |-
  De tierra estuvo cubierta,
  pero no fructificó
  del todo, hasta que quedó
  en un árbol seco injerta.
  Y, aunque a los ojos del suelo
  se puso después marchita,
  ya torna, ya resucita,
  ya su olor inunda el cielo.
- |-
  Toda es de flores la fiesta,
  flores de finos olores,
  mas no se irá todo en flores,
  porque flor de fruto es ésta.
  Y, mientras su Iglesia grita
  mendigando algún consuelo,
  ya torna, ya resucita,
  ya su olor inunda el cielo.
- |-
  Que nadie se sienta muerto
  cuando resucita Dios,
  que, si el barco llega al puerto,
  llegamos junto con vos.
  Hoy la Cristiandad se quita
  sus vestiduras de duelo.
  Ya torna, ya resucita,
  ya su olor inunda el cielo. Amén.
La luz del Hijo la rodea:
- |-
  La luz del Hijo la rodea,
  por él es bella sin medida,
  y no hay bondad entre los hombres
  que pueda serle parecida.
- |-
  El Hijo santo que sostiene
  es quien la tiene protegida;
  para que el santo descendiera,
  fue sin pecado concebida.
- |-
  Desde el albor de nuestra historia,
  suave, discreta y escondida,
  llega María en la Escritura,
  Virgen y Madre prometida.
- |-
  Es ella Esposa del Espíritu,
  su vientre es cauce de la vida;
  es flor temprana de la Pascua,
  dando a Gabriel la fe rendida.
- |-
  Suba al Señor cual blanca nube
  esta alabanza proferida:
  a Dios bendito bendecimos
  por la que fue la Bendecida. Amén.
La pena que la tierra soportaba:
- |-
  La pena que la tierra soportaba,
  a causa del pecado, se ha trocado
  en canto que brota jubiloso
  en labios de María pronunciado.
- |-
  El sí de las promesas ha llegado,
  la alianza se cumple, poderosa,
  el Verbo eterno de los cielos
  con nuestra débil carne se desposa.
- |-
  Misterio que sólo la fe alcanza,
  María es nuevo templo de la gloria,
  rocío matinal, nube que pasa,
  luz nueva en presencia misteriosa.
- |-
  A Dios sea la gloria eternamente,
  al Hijo suyo amado Jesucristo,
  que quiso nacer para nosotros
  y darnos su Espíritu divino. Amén.
Las sombras oscuras huyen:
- |-
  Las sombras oscuras huyen,
  ya va pasando la noche;
  y el sol, con su luz de fuego,
  nos disipa los temores.
- |-
  Ya se apagan las estrellas
  y se han encendido soles;
  el rocío cae de los cielos
  en el cáliz de las flores.
- |-
  Las criaturas van vistiendo
  sus galas y sus colores,
  porque al nacer nuevo día
  hacen nuevas las canciones.
- |-
  ¡Lucero, Cristo, del alba,
  que paces entre esplendores,
  apacienta nuestras vidas
  ya sin sombras y sin noches!
- |-
  ¡Hermoso Cristo, el Cordero,
  entre collados y montes! Amén.
Llamando a trabajo al mundo:
- |-
  Llamando a trabajo al mundo
  la aurora de la mañana,
  saluda al son del martillo
  la casa nazaretana.
- |-
  Salve, padre de familia,
  de cuyas manos sudadas
  el Artífice divino
  copió labor artesana.
- |-
  Reinando en la cumbre del cielo
  junto a tu esposa sin mácula,
  oye a tus fieles devotos
  sumergidos en desgracias.
- |-
  Quita violencias y engaños
  y hurtos al pobre en ganancias,
  baste a todos el vivir
  con una sencilla holganza.
- |-
  Por ti, José, Dios altísimo
  dirija nuestras pisadas
  en paz y santa alegría
  por las sendas de la Patria. Amén.
Los hombros traigo cargados:
- |-
  Los hombros traigo cargados
  de graves culpas, mi Dios;
  dadme esas lágrimas vos
  y tomad estos pecados.
- |-
  Yo soy quien ha de llorar,
  por ser acto de flaqueza;
  que no hay en naturaleza
  más flaqueza que el pecar.
- |-
  Y, pues andamos trocados,
  que yo peco y lloráis vos,
  dadme esas lágrimas vos
  y tomad estos pecados.
- |-
  Vos sois quien cargar se puede
  estas mis culpas mortales,
  que la menor destas tales
  a cualquier peso excede;
- |-
  y, pues que son tan pesados
  aquestos yerros, mi Dios,
  dadme esas lágrimas vos
  y tomad estos pecados.
- |-
  Al Padre, al Hijo, al Amor,
  alegres cantad, criaturas,
  y resuene en las alturas
  toda gloria y todo honor. Amén.
Lucero del alba:
- |-
  Lucero del alba,
  aurora estremecida,
  luz de mi alma,
  Santa María.
- |-
  Hija del Padre,
  doncella en gracia concebida,
  virgen y madre,
  Santa María.
- |-
  Flor del Espíritu,
  ave, blancura, caricia,
  madre del Hijo,
  Santa María.
- |-
  Llena de ternura,
  bendita entre las benditas,
  madre de todos los hombres,
  Santa María. Amén.
Nacidos de la luz, hijos del día:
- |-
  Nacidos de la luz, hijos del día,
  Vamos hacia el Señor de la mañana.
  Su claridad disipa nuestras sombras
  y alegra y regocija nuestras almas.
- |-
  Que nuestro Dios, el Padre de la gloria,
  nos libre para siempre del pecado,
  y podamos así gozar la herencia
  que nos legó en su Hijo muy amado.
- |-
  Honor y gloria a Dios, Padre celeste,
  por medio de su Hijo Jesucristo,
  y al Don de toda luz, el Santo Espíritu,
  que vive por los siglos de los siglos. Amén.
Nada posee clara:
- |-
  Nada posee clara,
  nada le pertenece;
  como lirio del huerto
  libre respira y crece.
- |-
  Nada coge en su mano,
  nada que aquí fenece;
  pobre, en la cruz se abraza
  con Cristo que padece.
- |-
  Nada de lo que fluye
  su párpado estremece;
  Clara mira y escucha
  al Verbo que acontece. Amén.
Niño, que por darme vida:
- |-
  Niño, que por darme vida
  te pusiste mi vestido,
  bien que te viene nacido,
  mas no es hecho a tu medida.
- |-
  Aunque eres, si bien se apura,
  tan grande como tu Padre,
  hoy te da señora Madre
  un vestido de criatura.
- |-
  Traerásle toda la vida,
  sin mudar otro vestido,
  mas andarás encogido,
  por ser hecho a mi medida.
- |-
  No te vendrá nada holgado;
  que, aunque paño baladí,
  primero que dé de sí
  le tendrás todo rasgado.
- |-
  Y aun te costará la vida
  el habértele vestido,
  porque te traerá molido
  el ser hecho a mi medida.
- |-
  Al Mesías tributad,
  que nos trajo salvación,
  honor, gloria y bendición
  por toda la eternidad. Amén.
No lloréis, mis ojos:
- |-
  No lloréis, mis ojos,
  Niño Dios, callad;
  que si llora el cielo,
  ¿quién podrá cantar?
- |-
  Vuestra Madre hermosa,
  que cantando está,
  llorará también,
  si ve que lloráis.
- |-
  O es fuego o es frío
  la causa que os dan:
  si es amor, mis ojos,
  muy pequeño amáis.
- |-
  Enjugad las perlas,
  nácar celestial;
  que si llora el cielo,
  ¿quién podrá cantar?
- |-
  Los ángeles bellos
  cantan que les dais
  a los cielos gloria
  y a la tierra paz.
- |-
  De aquestas montañas
  descendiendo van
  pastores, cantando
  por daros solaz.
- |-
  Niño de mis ojos,
  ea, no haya más;
  que si llora el cielo,
  ¿quién podrá cantar? Amén.
No me mueve, mi Dios, para quererte:
- |-
  No me mueve, mi Dios, para quererte
  el cielo que me tienes prometido;
  ni me mueve el infierno tan temido
  para dejar por eso de ofenderte.
- |-
  Tú me mueves, Señor, muéveme el verte
  clavado en una cruz y escarnecido;
  muéveme ver tu cuerpo tan herido,
  muévenme tus afrentas y tu muerte.
- |-
  Muéveme, en fin, tu amor, y en tal manera,
  que, aunque no hubiera cielo, yo te amara,
  y, aunque no hubiera infierno, te temiera.
- |-
  No tienes que me dar porque te quiera;
  pues, aunque cuanto espero no esperara,
  lo mismo que te quiero te quisiera. Amén.
Nos apremia el amor, vírgenes santas:
- |-
  Nos apremia el amor, vírgenes santas,
  vosotras, que seguisteis su camino,
  guiadnos por las sendas de las almas
  que hicieron de su amor amar divino.
- |-
  Esperasteis en vela a vuestro Esposo
  en la noche fugaz de vuestra vida,
  cuando llamó a la puerta, vuestro gozo
  fue contemplar su gloria sin medida.
- |-
  Vuestra fe y vuestro amor, un fuego ardiente
  que mantuvo la llama en la tardanza,
  vuestra antorcha encendida ansiosamente
  ha colmado de luz vuestra esperanza.
- |-
  Pues gozáis ya las nupcias que el Cordero
  con la Iglesia de Dios ha celebrado,
  no dejéis que se apague nuestro fuego
  en la pereza y el sueño del pecado.
- |-
  Demos gracias a Dios y, humildemente,
  pidamos al Señor que su llamada
  nos encuentre en vigilia permanente,
  despiertos en la fe y en veste blanca. Amén.
Oh Dios, autor de la luz:
- |-
  Oh Dios, autor de la luz,
  de los cielos la lumbrera,
  que el universo sostienes
  abriendo tu mano diestra.
- |-
  La aurora, con mar de grana,
  cubriendo está las estrellas,
  bautizando humedecida
  con el rocío la tierra.
- |-
  Auséntanse ya las sombras,
  al orbe la noche deja,
  y al nuevo día el lucero,
  de Cristo imagen, despierta.
- |-
  Tú, día de día, oh Dios,
  y Luz de Luz, de potencia
  soberana, oh Trinidad,
  doquier poderoso reinas.
- |-
  Oh Salvador, ante ti
  inclinamos la cabeza,
  y ante el Padre y el Espíritu,
  dándote gloria perpetua. Amén.
Oh sol de salvación, oh Jesucristo:
- |-
  Oh sol de salvación, oh Jesucristo,
  alumbra lo más hondo de las almas,
  en tanto que la noche retrocede
  y el día sobre el mundo se levanta.
- |-
  Junto con este favorable tiempo
  danos ríos de lágrimas copiosas,
  para lavar el corazón que, ardiendo
  en jubilosa caridad, se inmola.
- |-
  La fuente que hasta ayer manó delitos
  ha de manar desde hoy perenne llanto,
  si con la vara de la penitencia
  el pecho empedernido es castigado.
- |-
  Ya se avecina el día, el día tuyo,
  volverá a florecer el universo;
  compartamos su gozo los que fuimos
  devueltos por tu mano a tus senderos.
- |-
  Oh Trinidad clemente, que te adoren
  tierra y cielo a tus pies arrodillados,
  y que nosotros, por tu gracia nuevos,
  cantemos en tu honor un nuevo canto. Amén
Oh tú, santa Unidad en Trinidad:
- |-
  Oh tú, santa Unidad en Trinidad,
  que riges con poder el universo,
  recibe las canciones de alabanza
  que, en vela matinal, cantan tus siervos.
- |-
  El lucero del alba ya refulge,
  caminando ante el sol cual mensajero;
  al caer las tinieblas de la noche,
  nos alumbra tu santa luz de nuevo.
- |-
  Demos gloria a Dios Padre, autor de todo,
  y al Señor Jesucristo, su unigénito,
  y al Santo Defensor de nuestras almas,
  ahora y por los siglos sempiternos. Amén.
Ojos muertos que miráis:
- |-
  Ojos muertos que miráis
  con mirar indescriptible
  y con fuerza irresistible
  atraéis y cautiváis,
  ¿por qué, si muertos estáis,
  tenéis tan viva expresión
  que así turbáis mi razón
  trocando vuestras miradas
  en dos punzantes espadas
  que parten mi corazón?
- |-
  Al veros, ojos piadosos,
  todo mi ser se conmueve.
  ¿Quién a miraros se atreve
  sin llorar, ojos llorosos?
  Me cautiváis amorosos,
  me reprendéis justicieros,
  inspiráis dolor y calma,
  sois tiernos y sois severos,
  y las borrascas del alma
  enfrenáis sólo con veros.
- |-
  ¡Ah! Permitid ojos píos,
  ojos que sois el encanto
  del cielo, que con mi llanto
  borre mis locos desvíos;
  bebí en cenagosos ríos
  aguas de ponzoñas llenas
  que, al infiltrarse en mis venas,
  causaron fiebres ardientes.
  ¡Cómo olvidé que erais fuentes
  de aguas dulces y serenas! Amén.
Oye turbado el tirano:
- |-
  Oye turbado el tirano
  que ha nacido un Soberano
  por su mal;
  un niño que es Rey eterno,
  que nace pobre en invierno
  y en portal.
- |-
  Aquellos magos de Oriente
  le trajeron de repente
  la noticia;
  y, loco de furia extraña,
  con sangre las cunas baña
  su sevicia.
- |-
  Y, en golpe de odio y espada,
  la furia de la nevada
  cercenó
  capullos de mariposas,
  y de rosales las rosas
  deshojó.
- |-
  De Raquel, roto el gemido
  y el sollozo contenido
  y sosegado,
  rojo llanto de congojas
  en esas mañanas rojas
  ha dejado.
- |-
  Danos, por tu Hijo amado,
  arrojar, Padre, el pecado
  de la guerra;
  pon la paz en la bonanza
  y que reine la esperanza
  en la tierra. Amén.
Palabra del Señor ya rubricada:
- |-
  Palabra del Señor ya rubricada
  es la vida del mártir ofrecida
  como prueba fiel de que la espada
  no puede ya truncar la fe vivida.
- |-
  Fuente de fe y de luz es su memoria,
  coraje para el justo en la batalla
  del bien, de la verdad, siempre victoria
  que, en vida y muerte, el justo en Cristo halla.
- |-
  Martirio es el dolor de cada día,
  si en Cristo y con amor es aceptado,
  fuego lento de amor que, en la alegría
  de servir al Señor, es consumado.
- |-
  Concédenos, oh Padre, sin medida,
  y tú, Señor Jesús crucificado,
  el fuego del Espíritu de vida
  para vivir el don que nos has dado. Amén.
Para vosotros, el misterio del Padre:
- |-
  Para vosotros, el misterio del Padre;
  con vosotros, la luz del Verbo;
  en vosotros, la llama del Amor
  que es fuego.
- |-
  ¡Hontanares de Dios!,
  ¡hombres del Evangelio!,
  ¡humildes inteligencias luminosas!,
  ¡grandes hombres de barro tierno!
- |-
  El mundo tiene hambre de infinito
  y sed de cielo;
  las criaturas nos atan a lo efímero
  y nos vamos perdiendo en el tiempo.
- |-
  Para nosotros,
  el misterio que aprendisteis del Padre;
  con nosotros, la luz que os dio el Verbo;
  en nosotros, el Amor ingénito.
- |-
  ¡Hombres de Cristo, maestros de la Iglesia!
  dadnos una vida y un anhelo,
  la angustia por la verdad,
  por el error el miedo.
- |-
  Dadnos una vida de rodillas
  ante el misterio,
  una visión de este mundo de muerte
  y una esperanza de cielo.
- |-
  Padre, te pedimos para la Iglesia
  la ciencia de estos maestros. Amén.
Pastor que con tus silbos amorosos:
- |-
  Pastor que con tus silbos amorosos
  me despertaste del profundo sueño:
  tú, que hiciste cayado de ese leño
  en que tiendes los brazos poderosos,
- |-
  vuelve los ojos a mi fe piadosos,
  pues te confieso por mi amor y dueño
  y la palabra de seguir te empeño
  tus dulces silbos y tus pies hermosos.
- |-
  Oye, Pastor, pues por amores mueres,
  no te espante el rigor de mis pecados,
  pues tan amigo de rendidos eres.
- |-
  Espera, pues, y escucha mis cuidados.
  Pero ¿cómo te digo que me esperes,
  si estás, para esperar, los pies clavados? Amén.
Por el dolor creyente que brota del pecado:
- |-
  Por el dolor creyente que brota del pecado,
  por no haberte querido de todo corazón,
  por haberte, Dios mío, tantas veces negado,
  con súplicas te pido, de rodillas, perdón.
- |-
  Por haberte perdido, por no haberte encontrado,
  porque es como un desierto nevado mi oración;
  porque es como una hiedra sobre el árbol cortado
  el recuerdo que brota cargado de ilusión,
- |-
  Porque es como la hiedra, déjame que te abrace,
  primero amargamente, lleno de flor después,
  y que a ti, viejo tronco, poco a poco me enlace,
  y que mi vieja sombra se derrame a tus pies. Amén
Pureza inmaculada:
- |-
  Pureza inmaculada,
  espejo del Señor,
  ¡oh fuente de la gracia,
  unida al redentor!
- |-
  Belleza sin mancilla,
  encanto virginal,
  tú eres la alegría,
  la gloria del mortal.
- |-
  ¡Oh vara florecida
  del tronco de Jesé!,
  en gracia concebida,
  ¡oh gloria de Israel!
- |-
  Dichosa por los siglos
  los pueblos te dirán:
  tú fuiste del Dios vivo
  la aurora celestial. Amén.
Que hoy bajó Dios a la tierra:
- |-
  Que hoy bajó Dios a la tierra
  es cierto; pero más cierto
  es que, bajando a María,
  bajó Dios a mejor cielo.
- |-
  Conveniencia fue de todos
  este divino misterio,
  pues el hombre, de fortuna,
  y Dios mejoró de asiento.
- |-
  Su sangre le dio María
  a logro, porque a su tiempo
  la que recibe encarnando
  restituya redimiendo.
- |-
  Un arcángel a pedir
  bajo su consentimiento,
  guardándole, en ser rogada,
  de reina sus privilegios.
- |-
  ¡Oh grandeza de María,
  que cuanto usa el Padre eterno
  de dominio con su Hijo,
  use con ella de ruego!
- |-
  A estrecha cárcel reduce
  de su grandeza lo inmenso
  y en breve morada cabe
  quien sólo cabe en sí mismo. Amén.
Que viene Cristo repiten:
- |-
  Que viene Cristo repiten
  con su clamor los profetas,
  previniendo que la gracia
  de la redención se acerca.
- |-
  Se anuncia nuestro mañana,
  los corazones se alegran,
  anunciadores de gloria
  miles de voces resuenan.
- |-
  Fue el primer advenimiento
  no de castigo ni de pena,
  sino por curar heridas
  salvando a quién pereciera.
- |-
  Mas que ha de venir de nuevo
  su venida nos alerta,
  a coronar a los justos
  y a darles la recompensa.
- |-
  Luz perenne se nos brinda,
  la salvación centellea,
  y un resplandor nos convoca
  a las mansiones etéreas.
- |-
  Oh Cristo, anhelamos verte
  cual Dios en visión perpetua,
  porque este gozo será
  bienaventuranza eterna. Amén.
Reina y Madre de Colombia:
- |-
  Reina y Madre de Colombia,
  te corona nuestro amor;
  Virgen santa del Rosario,
  protege al pueblo y nación.
- |-
  El santuario provinciano
  redunda en gracia y piedad,
  es centro de romerías
  centro de culto filial.
- |-
  Dichos la tierra amada
  que goza de tu favor;
  irradia, Madre, en tus hijos
  de tu imagen el fulgor.
- |-
  Concurre el fiel a tu templo
  para ofrecer su oblación;
  por campos y valles se oyen
  sus cánticos y oración.
- |-
  Gloria a ti, Jesús, nacido
  de la Madre virginal;
  al Espíritu y al Padre
  se rinda gloria inmortal. Amén.
Resplandeciente de alegría:
- |-
  Resplandeciente de alegría,
  amargo mar de los pesares,
  vestida de gracia y de gloria,
  te cantamos, oh Virgen María.
- |-
  Gozosa cuando a Dios concibes,
  cuando anhelante das el fruto,
  cuando lo ofreces y lo pierdes,
  al Hijo, que es la luz del mundo.
- |-
  Salve, primera de los mártires,
  en el dolor de tu martirio;
  tu corazón supo de espinas.
  tu alma de cruces y de lirios.
- |-
  Reina de gloria refulgente,
  Madre fecunda de la Iglesia,
  cuando las llamas del Paráclito
  del mundo ardieron las tristezas.
- |-
  Recoged las Aves Marías
  para un rosario de azucenas;
  cantad a María alabanzas,
  que es Madre de eterna belleza. Amén.
Salve divina María:
- |-
  Salve divina María,
  de la luz intacta Madre.
  Salve, pues tienes por Hijo
  al mismo Verbo del Padre.
- |-
  Todas las generaciones
  te bendicen a porfía,
  y de un siglo a otro
  repiten: «Ave María!»
- |-
  Como Hija, Madre y Esposa
  Dios te ha tenido consigo.
  Cuán feliz eres, María,
  porque el Señor es contigo.
- |-
  Por milagro sin ejemplo
  siendo Madre, Virgen eres.
  Salve, mil veces bendita
  entre todas las mujeres.
- |-
  También para siempre sea
  con gloria eterna ensalzado
  Jesús, el fruto bendito
  de tu vientre inmaculado. Amén.
Salve, atleta victorioso:
- |-
  Salve, atleta victorioso,
  ornato del Nuevo Mundo,
  con tu sangre has fecundado
  las espigas en el surco.
- |-
  Tú, el primero del Anáhuac,
  presentaste al Rey eterno
  las primicias de la siembra
  de la fe del Evangelio.
- |-
  Los colores encendidos
  de las rosas de ayate,
  cual respuesta de tu raza,
  florecieron en tu sangre.
- |-
  Que ese firme testimonio
  que sellaste con tu muerte
  dé a tu patria una fe viva,
  invencible y siempre fuerte.
- |-
  A Dios Padre demos gloria
  por la gloria de sus santos,
  a su Hijo Jesucristo
  y al Espíritu Paráclito. Amén.
Santa unidad y Trinidad beata:
- |-
  Santa unidad y Trinidad beata:
  con los destellos de tu brillo eterno,
  infunde amor en nuestros corazones,
  mientras se va alejando el sol de fuego.
- |-
  Por la mañana te cantamos loas
  y por la tarde te elevamos ruegos,
  pidiéndote que estemos algún día
  entre los que te alaban en el cielo.
- |-
  Glorificado sean por los siglos
  de los siglos el Padre y su Unigénito,
  y que glorificado con entrambos
  sea por tiempo igual el Paracleto. Amén
Sentencia de Dios al hombre:
- |-
  Sentencia de Dios al hombre
  antes que el día comience:
  «Que el pan no venga a tu mesa
  sin el sudor de tu frente.
- |-
  Ni el sol se te da de balde,
  ni el aire por ser quien eres:
  las cosas son herramientas
  y buscan quien las maneje.
- |-
  El mar les pone corazas
  de sal amarga a los peces;
  el hondo sol campesino
  madura a fuego las mieses.
- |-
  La piedra, con ser la piedra,
  guarda una chispa caliente;
  y en el rumor de la nube
  combaten el rayo y la nieve.
- |-
  A ti te inventé las manos
  y un corazón que no duerme;
  puse en tu boca palabras
  y pensamiento en tu frente.
- |-
  No basta con dar las gracias
  sin dar lo que las merece:
  a fuerza de gratitudes
  se vuelve la tierra estéril.» Amén.
Señor, cuando florece un nuevo día:
- |-
  Señor, cuando florece un nuevo día
  en el jardín del tiempo,
  no dejes que la espina del pecado
  vierta en él su veneno.
- |-
  El trabajo del hombre rompe el surco
  en el campo moreno;
  en frutos de bondad y de justicia
  convierte sus deseos.
- |-
  Alivia sus dolores con la hartura
  de tu propio alimento;
  y que vuelvan al fuego de tu casa
  cansados y contentos. Amén.
Señor, cómo quisiera:
- |-
  Señor, cómo quisiera
  en cada aurora aprisionar el día,
  y ser tu primavera
  en gracia y alegría,
  y crecer en tu amor más todavía.
- |-
  En cada madrugada
  abrir mi pobre casa, abrir la puerta,
  el alma enamorada,
  el corazón alerta,
  y conmigo tu mano siempre abierta.
- |-
  Ya despierta la vida
  con su canción de ruidos inhumanos;
  y tu amor me convida
  a levantar mis manos
  y a acariciarte en todos mis hermanos.
- |-
  Hoy elevo mi canto
  con toda la ternura de mi boca,
  al que es tres veces santo,
  a ti que eres mi Roca
  y en quien mi vida toda desemboca. Amén.
Señor, tú me llamaste:
- |-
  Señor, tú me llamaste
  para ser instrumento de tu gracia,
  para anunciar la buena nueva,
  para sanar las almas.
- |-
  Instrumento de paz y de justicia,
  pregonero de todas tus palabras,
  agua para calmar la sed hiriente,
  mano que bendice y que ama.
- |-
  Señor, tú me llamaste
  para curar los corazones heridos,
  para gritar, en medio de las plazas,
  que el Amor está vivo,
  para sacar del sueño a los que duermen
  y liberar al cautivo.
  Soy cera blanda entre tus dedos,
  haz lo que quieras conmigo.
- |-
  Señor, tú me llamaste
  para salvar al mundo ya cansado,
  para amar a los hombres
  que tú, Padre, me diste como hermanos.
  Señor, me quieres para abolir las guerras,
  y aliviar la miseria y el pecado;
  hacer temblar las piedras
  y ahuyentar a los lobos del rebaño. Amén.
Señor, yo sé que, en la mañana pura:
- |-
  Señor, yo sé que, en la mañana pura
  de este mundo, tu diestra generosa
  hizo la luz antes que toda cosa,
  porque todo tuviera su figura.
- |-
  Yo sé que te refleja la segura
  línea inmortal del lirio y de la rosa
  mejor que la embriagada y temerosa
  música de los vientos de la altura.
- |-
  Por eso te celebro yo en el frío
  pensar exacto a la verdad sujeto,
  y en la ribera sin temblor del río;
- |-
  por eso yo te adoro, mudo y quieto,
  y por eso, Señor, el dolor mío
  para llegar hasta ti se hizo soneto. Amén.
Si salvaste a Magdalena:
- |-
  Si salvaste a Magdalena
  y al ladrón de eterna pena,
  tú serás mi salvador.
- |-
  De tu amor yo no soy digno,
  mas tú, Señor, sé benigno,
  no arda yo en fuego eternal.
- |-
  Líbrame de todo daño,
  admíteme en tu rebaño,
  a tu diestra, sacro Rey.
- |-
  Librado ya del averno,
  sé mi guía al gozo eterno,
  a tu dulce corazón.
- |-
  Puesto, Jesús, yo de hinojos,
  con lágrimas en los ojos,
  te pido la salvación.
- |-
  Cuando el reo vaya al juicio,
  por tu muerte, sé propicio,
  por tu vida, Salvador.
- |-
  Oh Dios santo, el uno y trino,
  llévanos por tu camino
  a la patria celestial. Amén.
Sin dejar la derecha de su Padre:
- |-
  Sin dejar la derecha de su Padre,
  y para consumar su obra divina,
  el sumo Verbo, que ha venido al mundo,
  llega al fin a la tarde de su vida.
- |-
  Antes de ser, por uno de los suyos,
  dado a quienes la muerte le darían,
  en el vital banquete del cenáculo
  se dio a los suyos como vianda viva.
- |-
  Se dio a los suyos, bajo dos especies,
  en su carne y su sangre sacratísimas,
  a fin de alimentar en cuerpo y alma
  a cuantos hombres en este mundo habitan.
- |-
  Se dio, naciendo, como compañero;
  comiendo, se entregó como comida;
  muriendo, se empeñó como rescate;
  reinando, como premio se nos brinda.
- |-
  Hostia de salvación, que abres las puertas
  celestes de la gloria prometida:
  fortalece y socorre nuestras almas,
  asediadas por fuerzas enemigas.
- |-
  Glorificada eternamente sea
  la perpetua Deidad, que es una y trina,
  y que ella finalmente nos conceda,
  en la patria sin fin, vida infinita. Amén.
Sólo la Niña aquella, la Niña inmaculada:
- |-
  Sólo la Niña aquella, la Niña inmaculada,
  la Madre que del hijo recibió su hermosura,
  la Virgen que le dice a su Creador criatura,
  sólo esa Niña bella al cielo fue elevada.
- |-
  Los luceros formaron innumerables filas,
  tapizaron las nubes el cielo en su grandeza;
  y aquella Niña dulce de sin igual belleza
  llenaba todo el cielo con sus claras pupilas.
- |-
  Nuestro barro pequeño, de nostalgia extasiado,
  ardientemente quiere subir un día cualquiera
  al cielo, donde el barro de nuestra Niña espera
  purificar en gracia nuestro barro manchado. Amén.
Te damos gracias, Señor:
- |-
  Te damos gracias, Señor,
  porque has depuesto la ira
  y has detenido ante el pueblo
  la mano que lo castiga.
- |-
  Tú eres el Dios que nos salva,
  la luz que nos ilumina,
  la mano que nos sostiene
  y el techo que nos cobija.
- |-
  Y sacaremos con gozo
  del manantial de la Vida
  las aguas que dan al hombre
  la fuerza que resucita.
- |-
  Entonces proclamaremos:
  «¡Cantadle con alegría!
  ¡El nombre de Dios es grande!
  ¡Su caridad infinita!
- |-
  ¡Que alabe al Señor la tierra!
  Cantemos sus maravillas.
  ¡Qué grande, en medio del pueblo
  el Dios que nos justifica!». Amén.
Te doy gracias, Señor:
- |-
  Te doy gracias, Señor.
  ¡Tanto estabas enojado conmigo!
  Tú eres un Dios de amor,
  y ahora soy tu amigo,
  te busco a cada instante y te persigo.
- |-
  Eres tú mi consuelo,
  tú eres el Dios que salva y da la vida;
  eres todo el anhelo
  de esta alma que va herida,
  ansiándote sin tasa ni medida.
- |-
  En mi tierra desierta,
  tú de la salvación eres la fuente;
  eres el agua cierta
  que se vuelve torrente,
  y el corazón arrasa dulcemente.
- |-
  ¡Quiero escuchar tu canto!
  ¡Que tu Palabra abrase mi basura
  con alegría y llanto!
  ¡Que mi vida futura
  espejo sea sin fin de tu hermosura! Amén.
Testigos de la sangre:
- |-
  Testigos de la sangre
  con sangre rubricada,
  frutos de amor cortados
  al golpe de la espada.
- |-
  Testigos del amor
  en sumisión callada,
  canto y cielo en los labios
  al golpe de la espada.
- |-
  Testigos del dolor
  de vida enamorada;
  diario placer de muerte
  al golpe de la espada.
- |-
  Testigos del cansancio
  de una vida inmolada
  a golpe de Evangelio
  y al golpe de la espada.
- |-
  Demos gracias al Padre
  por la sangre sagrada;
  pidamos ser sus mártires,
  y a cada madrugada
  poder morir la vida
  al golpe de la espada. Amén.
Tu cuerpo es lazo de amores:
- |-
  Tu cuerpo es lazo de amores,
  de Dios y el hombre atadura;
  amor que a tu cuerpo acude
  como tu cuerpo perdura.
- |-
  Tu cuerpo, surco de penas,
  hoy es de luz y rocío;
  que lo vean los que lloran
  con ojos enrojecidos.
- |-
  Tu cuerpo espiritual
  es la Iglesia congregada;
  tan fuerte como tu cruz,
  tan bella como tu Pascua.
- |-
  Tu cuerpo sacramental
  es de tu carne y tu sangre,
  y la Iglesia, que es tu Esposa,
  se acerca para abrazarte. Amén.
Tú que revelaste a Juan:
- |-
  Tú que revelaste a Juan
  tus altísimos decretos
  y los íntimos secretos
  de hechos que sucederán,
  haz que yo logre entender
  cuanto Juan ha contado.
  Déjame, Señor, poner
  mi cabeza en tu costado.
- |-
  Tú que en la cena le abriste
  la puerta del corazón,
  y en la transfiguración
  junto a ti lo condujiste,
  permíteme penetrar
  en tu misterio sagrado.
  Déjame, Señor, posar
  mi cabeza en tu costado.
- |-
  Tú que en el monte Calvario
  entre tus manos dejaste
  el más santo relicario:
  la carne donde habitaste;
  tú que le dejaste ser
  el hijo bienadoptado.
  Déjame, Señor, poner
  mi cabeza en tu costado.
- |-
  Y tú, Juan, que a tanto amor
  con amor correspondiste
  y la vida entera diste
  por tu Dios y tu Señor,
  enséñame a caminar
  por donde tú has caminado.
  Enséñame a colocar
  la cabeza en su costado. Amén.
Tú, Cefas, eres Pedro y eres roca:
- |-
  Tú, Cefas, eres Pedro y eres roca,
  eres maestro fiel y gobernante
  de la barca divina en que viajamos
  de esta sombra a la aurora rutilante.
- |-
  Eres piedra angular en que se basa
  el templo espiritual del Dios viviente;
  tu humilde llanto canceló la culpa
  de tu culpable labio irreverente.
- |-
  Demos gracias al Padre y a su Hijo,
  y al Espíritu, fuego sempiterno,
  porque la Iglesia no será vencida
  por la fuerza terrible del infierno. Amén.
Un tan hermoso Doncel:
- |-
  Un tan hermoso Doncel
  hoy ha nacido en el suelo,
  que la luna y sol del cielo
  no lucen delante de él.
- |-
  Es un Niño en quien se halla
  hermosura tan sin par,
  que no se pueden hartar
  los ángeles de miralla.
- |-
  Y aun lo menos que hay en él
  es lo que mostró en el suelo,
  pues la luna y sol del cielo
  no lucen delante de él.
- |-
  Nació este hermoso Doncel
  de una graciosa Doncella,
  después de Dios la más bella
  de todo lo que no es él.
- |-
  Como al fin Madre de aquel
  que es Rey del cielo y del suelo,
  y que las lumbres del cielo
  no lucen delante de él.
- |-
  Al Padre, al Hijo, al Amor,
  alegres cantad, criaturas,
  y resuene en las alturas
  toda gloria y todo honor. Amén.
Una clara voz resuena:
- |-
  Una clara voz resuena
  que las tinieblas repudia,
  el sueño pesado ahuyéntase,
  Cristo en el cielo fulgura.
- |-
  Despierte el alma adormida
  y sus torpezas sacuda,
  que para borrar los males
  un astro nuevo relumbra.
- |-
  De arriba llega el Cordero
  que ha de lavar nuestras culpas;
  con lágrimas imploremos
  el perdón que nos depura,
- |-
  porque en su nueva venida
  que aterroriza y conturba,
  no tenga que castigarnos,
  más con piedad nos acuda.
- |-
  Al Padre eterno la gloria,
  loor al Hijo en la altura,
  y al Espíritu Paráclito
  por siempre alabanza suma. Amén.
Varón feliz de méritos excelsos:
- |-
  Varón feliz de méritos excelsos,
  que mantienes sin mancha tu pureza,
  santo eremita, mártir esforzado,
  magno profeta.
- |-
  Hoy, cuando triunfas valeroso, arranca
  de nuestro pecho el corazón de piedra,
  el camino torcido guía, allana
  las asperezas.
- |-
  Porque, al venir el Redentor piadoso
  y libres ya las mentes de torpeza,
  se digne colocar sus plantas límpidas
  sobre la tierra.
- |-
  La corte celestial con alabanzas
  a ti, Dios trino y uno, te celebra,
  mientras los redimidos imploramos
  hoy tu clemencia. Amén.
Veisme aquí, mi dulce Amor:
- |-
  Veisme aquí, mi dulce Amor,
  Amor dulce, veisme aquí.
  ¿Qué mandáis hacer de mi?
  Veis aquí mi corazón.
- |-
  Yo le pongo en vuestra palma
  mi cuerpo, mi vida y alma,
  mis entrañas y afición;
  dulce Esposo y redención,
  pues por vuestra me ofrecí.
  ¿Qué mandáis hacer de mí?
- |-
  Dadme muerte, dadme vida:
  dad salud o enfermedad,
  honra o deshonra me dad,
  dadme guerra o paz cumplida,
  flaqueza o fuerza a mi vida,
  que a todo diré que sí.
  ¿Qué queréis hacer de mí?
- |-
  Dadme riqueza o pobreza,
  dad consuelo o desconsuelo,
  dadme alegría o tristeza,
  dadme infierno o dadme cielo,
  vida, dulce, sol sin velo,
  pues del todo me rendí.
  ¿Qué mandáis hacer de mí?
- |-
  Si queréis, dadme oración,
  si no, dadme sequedad,
  si abundancia y devoción,
  y si no esterilidad,
  soberana Majestad,
  sólo hallo paz aquí.
  ¿Qué mandáis hacer de mí?
- |-
  Si queréis que esté holgando,
  quiero por amor holgar,
  si me mandáis trabajar,
  morir quiero trabajando. Amén.
Velaron las estrellas el sueño de su muerte:
- |-
  Velaron las estrellas el sueño de su muerte,
  sus luces de esperanzas las recogió ya el sol,
  en haces luminosos la aurora resplandece,
  es hoy el nuevo día en que el Señor actuó.
- |-
  Los pobres de sí mismos creyeron su palabra,
  la noche de los hombres fue grávida de Dios,
  él dijo volvería colmando su esperanza,
  más fuerte que la muerte fue su infinito amor.
- |-
  De angustia estremecida lloró y gimió la tierra,
  en lágrimas y sangre su humanidad vivió,
  pecado, mal y muerte perdieron ya su fuerza,
  el Cristo siempre vivo es hoy nuestro blasón.
- |-
  De gozo reverdecen los valles y praderas,
  los pájaros y flores, su canto y su color,
  celebran con los hombres la eterna primavera
  del día y la victoria en que el Señor actuó.
- |-
  Recibe, Padre santo, los cánticos y amores
  de cuantos en tu Hijo hallaron salvación,
  tu Espíritu divino nos llene de sus dones,
  los hombres y los pueblos se abran a tu Amor. Amén.
Ven, Francisco, a tus hermanos:
- |-
  Ven, Francisco, a tus hermanos,
  visita a los pobrecillos;
  ven traspasado de amor
  por las heridas de Cristo;
  como nueva primavera
  después del invierno frío.
- |-
  Ven, que los hombres te vean
  por el mundo peregrino:
  liberado, sin alforja
  y sin dinero en el cinto;
  y anuncia la paz y el bien
  con los labios florecidos.
- |-
  Ven con los brazos sin armas,
  hermano suave y pacífico;
  ven, menor de los menores,
  de corazón compasivo;
  profeta sin amargura,
  ven con el ramo de olivo.
- |-
  Ven, penitente gozoso,
  que lloras de regocijo;
  heraldo loco de amor
  y paz de los enemigos;
  ven por los barrios y plazas,
  juglar del perdón divino.
- |-
  Ven, ángel de buenas nuevas,
  háblanos de Jesucristo;
  ven, boca del Evangelio,
  cristiano sabio y sencillo;
  hermano tan deseado,
  Francisco tan bien querido. Amén
Ven, Señor, no tardes:
- |-
  Ven, Señor, no tardes,
  Ven, que te esperamos;
  Ven, Señor, no tardes,
  ven pronto, Señor.
- |-
  El mundo muere de frío,
  el alma perdió el calor,
  los hombres no son hermanos
  porque han matado al Amor.
- |-
  Envuelto en noche sombría,
  gime el mundo de pavor;
  va en busca de una esperanza,
  buscando tu fe, Señor.
- |-
  Al mundo le falta vida
  y le falta corazón;
  le falta cielo en la tierra,
  si no lo riega tu amor.
- |-
  Rompa el cielo su silencio,
  baje el rocío a la flor,
  ven, Señor, no tardes tanto,
  ven, Señor. Amén.
Venid al huerto, perfumes:
- |-
  Venid al huerto, perfumes,
  enjugad la blanca sábana:
  en el tálamo nupcial
  el Rey descansa.
- |-
  Muertos de negros sepulcros,
  venid a la tumba santa:
  la Vida espera dormida,
  la Iglesia aguarda.
- |-
  Llegad al jardín, creyentes,
  tened en silencio el alma:
  ya empiezan a ver los justos
  la noche clara.
- |-
  Oh dolientes de la tierra,
  verted aquí vuestras lágrimas:
  en la gloria de este cuerpo
  serán bañadas.
- |-
  Salve, cuerpo cobijado
  bajo las divinas alas;
  salve, casa del Espíritu,
  nuestra morada. Amén.
Ver a Dios en la criatura:
- |-
  Ver a Dios en la criatura,
  ver a Dios hecho mortal,
  ver en humano portal
  la celestial hermosura.
  ¡Gran merced y gran ventura
  a quien verlo mereció!
  ¡Quién lo viera y fuera yo!
- |-
  Ver llorar a la alegría,
  ver tan pobre a la riqueza,
  ver tan baja a la grandeza
  y ver que Dios lo quería.
  ¡Gran merced fue en aquel día
  la que el hombre recibió!
  ¡Quién lo viera y fuera yo!
- |-
  Poner paz en tanta guerra,
  calor donde hay tanto frío,
  ser de todos lo que es mío,
  plantar un cielo en la tierra.
  ¡Qué misión de escalofrío
  la que Dios nos confió!
  ¡Quién lo hiciera y fuera yo! Amén.
Vienes del trono de David profeta:
- |-
  Vienes del trono de David profeta
  y, radiante de luz, gloriosa brillas
  y, en carro de querubes, te levantas,
  Virgen María.
- |-
  Recibes en tu seno inmaculado
  al Hijo de quien eres sierva e hija;
  Dios en tu vientre virginal se humana,
  Virgen María.
- |-
  Tú misma adoras, en tu casto seno,
  a quien el cielo adora de rodillas
  y a quien pedimos la celeste gloria,
  Virgen María.
- |-
  Danos, Señor y Padre de las luces,
  que vives en eternas alegrías,
  habitar con la Reina de los cielos,
  Virgen María. Amén.
Vosotros sois la luz del mundo:
- |-
  Vosotros sois la luz del mundo
  y ardiente sal de la tierra,
  ciudad esbelta en el monte,
  fermento en la masa nueva.
- |-
  Vosotros sois los sarmientos,
  y yo la Vid verdadera;
  si el Padre poda las ramas,
  más fruto llevan las cepas.
- |-
  Vosotros sois la abundancia
  del reino que ya está cerca,
  los doce mil señalados
  que no caerán en la siega.
- |-
  Dichosos, porque sois limpios
  y ricos en la pobreza,
  y es vuestro el reino que sólo
  se gana con la violencia. Amén.
Vosotros sois luz del mundo:
- |-
  Vosotros sois luz del mundo
  y ardiente sal de la tierra,
  ciudad esbelta en el monte,
  fermento en la masa nueva.
- |-
  Vosotros sois los sarmientos,
  y yo la Vid verdadera;
  si el Padre poda las ramas,
  más fruto llevan las cepas.
- |-
  Vosotros sois la abundancia
  del reino que ya está cerca,
  los doce mil señalados
  que no caerán en la siega.
- |-
  Dichosos, porque sois limpios
  y ricos en la pobreza,
  y es vuestro el reino que sólo
  se gana con la violencia. Amén.
Vosotros, que escuchasteis la llamada:
- |-
  Vosotros, que escuchasteis la llamada
  de viva voz que Cristo os dirigía,
  abrid nuestro vivir y nuestra alma
  al mensaje de amor que él nos envía.
- |-
  Vosotros, que invitados al banquete
  gustasteis el sabor del nuevo vino,
  llenad el vaso, del amor que ofrece,
  al sediento de Dios en su camino.
- |-
  Vosotros, que tuvisteis tan gran suerte
  de verle dar a muertos nueva vida,
  no dejéis que el pecado y que la muerte
  nos priven de la vida recibida.
- |-
  Vosotros, que lo visteis ya glorioso,
  hecho Señor de gloria sempiterna,
  haced que nuestro amor conozca el gozo
  de vivir junto a él la vida eterna. Amén.
¡Cuántas veces, Señor, me habéis llamado:
- |-
  ¡Cuántas veces, Señor, me habéis llamado,
  y cuántas con vergüenza he respondido,
  desnudo como Adán, aunque vestido
  de las hojas del árbol del pecado!
- |-
  Seguí mil veces vuestro pie sagrado,
  fácil de asir, en una cruz asido,
  y atrás volví otras tantas atrevido,
  al mismo precio que me habéis comprado.
- |-
  Besos de paz os di para ofenderos,
  pero si fugitivos de su dueño
  yerran cuando los hallan los esclavos,
- |-
  hoy que vuelvo con lágrimas a veros,
  clavadme vos a vos en vuestro leño
  y tendréisme seguro con tres clavos. Amén.
¡Detente, aurora de este nuevo día:
- |-
  ¡Detente, aurora de este nuevo día,
  refleja en mis pupilas tu paisaje!
  Mensajera de amor, es tu equipaje
  la hermosura hecha luz y profecía.
- |-
  ¡Detente, aurora, dulce epifanía,
  rostro de Dios, qué bello es tu mensaje!
  Queme tu amor mi amor que va de viaje
  en lucha, y en trabajo y alegría.
- |-
  Avanzamos, corremos fatigados,
  mañana tras mañana enfebrecidos
  por la carga de todos los pecados.
- |-
  Arrópanos, Señor, con la esperanza;
  endereza, Señor, los pies perdidos,
  y recibe esta aurora de alabanza. Amén.
¡Qué hermoso el Rey en la campaña!:
- |-
  ¡Qué hermoso el Rey en la campaña!
  Iba vestido de verdad,
  y era su espada de conquista
  el fuerte amor que vence al mal.
- |-
  ¡Qué hermosa aquella estirpe suya,
  desde el divino manantial!
  Es rey de la casa de David,
  nacido en cuna virginal.
- |-
  Murió en la cruz ajusticiado
  por rey del pueblo de Abraham.
  ¡Éste es el Rey del universo!;
  si Dios lo ha escrito, escrito está.
- |-
  Rey que desarmas las conciencias,
  rey vencedor de Satanás,
  sobre las ruinas del pecado
  tú solo creas vida y paz.
- |-
  Oh Jesucristo, mi Señor,
  rey poderoso que vendrás,
  a tus hermanos pecadores
  mira con rostro familiar.
- |-
  ¡Bendito el Rey crucificado,
  el Rey de reyes inmortal,
  desde la altura de tu Padre
  reina con cetro de piedad! Amén.
¡Qué misterio tan profundo:
- |-
  ¡Qué misterio tan profundo
  éste de mi propio ser:
  he surgido del no-ser
  y me exalto y me confundo,
  mientras cantando me hundo
  en mi nada, y sombra, y lodo!
  Soy cadáver a tu modo,
  soy sueño, soy despertar,
  soy vida, soy palpitar,
  soy luz, soy llama, soy todo.
- |-
  Muerte, que das a mi vida
  trascendencia y plenitud,
  muerte que ardes de inquietud
  como rosa amanecida,
  cuando llegues encendida
  y silenciosa a mi puerto,
  besaré tu boca yerta
  y, en el umbral de mi adiós,
  al beso inmenso de Dios
  me dispondrás, muerte muerta. Amén.
«¿Qué será este niño?», decía la gente:
- |-
  «¿Qué será este niño?», decía la gente
  al ver a su padre mudo de estupor.
  «¿Si será un profeta?, ¿si será un vidente?»
  ¡De una madre estéril nace el Precursor!
- |-
  Antes de nacer, sintió su llegada,
  al fuego del niño lo cantó Isabel,
  y llamó a la Virgen: «Bienaventurada»,
  porque ella era el arca donde estaba él.
- |-
  El ya tan antiguo y nuevo Testamento
  en él se soldaron como en piedra imán;
  muchos se alegraron de su nacimiento:
  fue ese mensajero que se llamó Juan.
- |-
  Lo envió el Altísimo para abrir las vías
  del que trae al mundo toda redención:
  como el gran profeta, como el mismo Elías,
  a la faz del Hijo de su corazón.
- |-
  El no era la luz: vino a ser testigo
  de la que ya habita claridad sin fin;
  él no era el Señor: vino a ser su amigo,
  su siervo, su apóstol y su paladín.
- |-
  Cántanle los siglos, como Zacarías:
  «Y tú serás, niño, quien marche ante él;
  eres el heraldo que anuncia al Mesías,
  eres la esperanza del nuevo Israel.»
- |-
  El mundo se llena de gran regocijo,
  Juan es el preludio de la salvación;
  alabanza al Padre que nos dio tal Hijo,
  la gloria al Espíritu que fraguó la acción. Amén.
¿Habrá dolor más intenso:
- |-
  ¿Habrá dolor más intenso
  que tu dolor dolorido?
  ¿Habrá, Señora, un gemido
  más soledoso y más denso
  que el que te enluta, hondo y tenso,
  de morada y negra toca?
  ¡Oh turba que pasáis loca,
  hijas de Jerusalén,
  mirad la bondad sin bien:
  mojad con hiel vuestra boca!
- |-
  ¿No son más blandas las piedras
  y más compasivo el cielo
  que mi corazón sin duelo,
  cuando tú, como las hiedras
  junto a la cruz, no te arredras
  de ahogarte en esos oleajes
  de hiel? Obscuros celajes
  envolvían el Calvario,
  y tú eras, Madre, el sudario
  de aquel diluvio de ultrajes.
- |-
  Dame ese llanto bendito
  para llorar mis pecados;
  dame esos clavos clavados,
  esa corona, ese grito,
  ese puñal, ese escrito
  y esa cruz para loarte,
  para urgirte y consolarte,
  Oh Virgen de los Dolores,
  para ir sembrando de flores
  tu viacrucis parte a parte. Amén.
¿Qué diré yo, miserable:
- |-
  ¿Qué diré yo, miserable,
  quién me será favorable,
  si el justo tiene temor?
- |-
  Rey sublime y majestuoso,
  si a todos salvas piadoso,
  sálvame por tu bondad.
- |-
  Recuerda, Dios, que mi vida
  fue causa de tu venida;
  aquel día, ten piedad.
- |-
  Por buscarme, te has cansado;
  por salvarme, te han clavado;
  ¿será vana tu pasión?
- |-
  Justo juez, por tu clemencia,
  haz que logre tu indulgencia,
  haz que alcance tu perdón.
- |-
  De mis ojos brota el llanto,
  de mis culpas yo me espanto;
  oh Señor, perdón, piedad.
- |-
  Oh Dios santo, el uno y trino,
  llévanos por tu camino
  a la patria celestial. Amén.
Ésta era una niña:
- |-
  Ésta era una niña
  con aire de flor,
  agua más que el río,
  fuego más que el sol.
  Vivía en el templo
  del rey Salomón,
  oyendo en los salmos
  ecos de otra voz.
- |-
  Quemaban su pecho,
  con celeste ardor,
  palabras magníficas,
  silencio de Dios:
  «¡Oh Padre que habitas
  en alto esplendor,
  envía el rocío
  del Hijo de Dios!
  ¡Ábrase la tierra:
  brote el Salvador!
- |-
  ¡Lloved, rojas nubes,
  al Dios de Jacob!
  ¡Floreced, collados,
  al Justo, al Señor,
  lucero del alba,
  flor de la creación!»
- |-
  Y al solio del Padre
  subía su clamor,
  cual nube de incienso
  plegaria sin voz. Amén.
Piedra angular y fundamento es Cristo:
- 'Piedra angular y fundamento es Cristo

  del templo espiritual que al Padre alaba,

  en comunión de amor con el Espíritu

  viviente, en lo más íntimo del alma.'
- 'Piedras vivas son todos los cristianos,

  ciudad, reino de Dios edificándose,

  entre sonoros cánticos de júbilo,

  al Rey del universo, templo santo.'
- 'El cosmos de alegría se estremece

  en latido vital de nueva savia,

  al pregustar el gozo y la alegría

  de un cielo y una tierra renovados.'
- 'Cantad, hijos de Dios, adelantados

  del Cristo total, humanidad salvada,

  en la que Dios en todos será todo,

  comunión viva en plenitud colmada.'
- 'Demos gracias al Padre, que nos llama

  a ser sus hijos en el Hijo amado,

  abramos nuestro espíritu al Espíritu,

  adoremos a Dios que a todos nos salva. Amén.'
Quién podrá tanto alabarte:
- 'Quién podrá tanto alabarte

  según es tu merecer;

  quién sabrá también loarte

  que no le falte saber;

  pues que para nos valer'
- 'tanto vales,

  da remedio a nuestros males.'
- '¡Oh Madre de Dios y hombre!

  ¡Oh concierto de concordia!

  Tú que tienes por renombre

  Madre de misericordia;

  pues para quitar discordia

  tanto vales,

  da remedio a nuestros males.'
- 'Tú que estabas ya criada

  cuando el mundo se crió;

  tú que estabas muy guardada

  para quien de ti nació;

  pues por ti nos conoció,

  si nos vales,

  fenecerán nuestros males.'
- 'Tú que eres flor de las flores,

  tú que del cielo eres puerta,

  tú que eres olor de olores,

  tú que das gloria muy cierta;

  si de la muerte muy muerta

  no nos vales,

  no hay remedio a nuestros males. Amén.'
- 'Lucero del alba,

  luz de mi alma,

  santa María.'
- 'Virgen y Madre,

  hija del Padre,

  santa María.'
- 'Flor del Espíritu,

  Madre del Hijo,

  santa María.'
- 'Amor maternal

  del Cristo total,

  santa María. Amén.'
Salve, Madre, en la tierra de mis amores:
- |-
  Salve, Madre, en la tierra de mis amores
  te saludan los cantos que alza el amor.
  Reina de nuestras almas, flor de las flores,
  muestra aquí de tu gloria los resplandores,
  que en el cielo tan sólo te aman mejor.
- |-
  Virgen Santa, Virgen pura,
  vida, esperanza y dulzura
  del alma que en Ti confía,
  Madre de Dios, Madre mía.
- |-
  Mientras mi vida alentare
  todo mi amor para Ti,
  mas si mi amor te olvidare,
  Madre mía, Madre mía,
  aunque mi amor te olvidare,
  tú no te olvides de mí.
- |-
  Gloria al Padre, gloria al Hijo,
  gloria al Espíritu Santo,
  por los siglos de los siglos. Amén.
Quiero seguirte a ti, flor de las flores:
- |-
  Quiero seguirte a ti, flor de las flores,
  siempre decir cantar de tus loores;
  non me partir de te servir,
  mejor de las mejores.
- |-
  Gran confianza tengo yo en ti, Señora,
  mi esperanza está en ti, hora tras hora;
  de tribulanza, sin tardanza,
  venme a librar ahora.
- |-
  Estrella de la mar, puerto de belleza
  de todo mi dolor y mi tristeza,
  venme librar y confortar,
  Señora del alteza.
- |-
  Gloria al Padre, y al Hijo,
  y al Espíritu Santo. Amén.
Tú eres toda hermosa:
- |-
  Tú eres toda hermosa,
  ¡oh Madre del Señor!;
  tú eres de Dios gloria,
  la obra de su amor.
- |-
  ¡Oh rosa sin espinas,
  oh vaso de elección!,
  de ti nació la vida,
  por ti nos vino Dios.
- |-
  Sellada fuente pura
  de gracia y de piedad,
  bendita cual ninguna,
  sin culpa original.
- |-
  Infunde en nuestro pecho
  la fuerza de tu amor,
  feliz Madre del Verbo,
  custodia del Señor. Amén.
Éstos que van vestidos:
- 'Éstos que van vestidos

  de blancas vestiduras,

  ¿quiénes son, y de dónde han venido?'
- 'Todos éstos que ciñen llameantes laureles

  han venido del fondo de la tribulación.

  Todos éstos lavaron sus vestidos de boda

  en los ríos de sangre del Cordero de Dios.'
- 'Éstos que van vestidos

  de blancas vestiduras,

  ¿quiénes son, y de dónde han venido?'
- 'Son las gentes con hambre que jamás tendrán hambre,

  los sedientos que nunca sentirán ya la sed.

  Los abreva el Cordero con el agua de vida;

  los asume en su muerte; resucitan con él.'
- 'Éstos que van vestidos

  de blancas vestiduras,

  ¿quiénes son, y de dónde han venido?'
- 'Han venido del llanto para ser consolados;

  han salido del fuego y han buscado el frescor.

  El Señor les enjuga con sus manos las lágrimas,

  con sus manos les guarda contra el fuego del sol.'
- 'Testigos de amor

  de Cristo Señor,

  mártires santos.'
- Rosales en flor
- 'de Cristo el olor,

  mártires santos.'
- 'Palabras en luz

  de Cristo Jesús,

  mártires santos.'
- 'Corona inmortal

  del Cristo total,

  mártires santos. Amén.'
Quien entrega su vida por amor:
- 'Quien entrega su vida por amor

  la gana para siempre

  dice el Señor.'
- 'Aquí el bautismo proclama

  su voz de gloria y de muerte.

  Aquí la unción se hace fuerte

  contra el cuchillo y la llama.

  Mirad cómo se derrama

  mi sangre por cada herida.

  Si Cristo fue mi comida,

  dejadme ser pan y vino'
- 'en el lagar y el molino

  donde me arrancan la vida.'
Cristo, Cabeza, Rey de los pastores:
- 'Cristo, Cabeza, Rey de los pastores,

  el pueblo entero, madrugando a fiesta,

  canta a la gloria de tu sacerdote

  himnos sagrados.'
- 'Con abundancia de sagrado crisma,

  la unción profunda de tu Santo Espíritu

  lo armó guerrero y lo nombró en la Iglesia

  jefe del pueblo.'
- 'Él fue pastor y forma del rebaño,

  luz para el ciego, báculo del pobre,

  padre común, presencia providente,

  todo de todos.'
- 'Tú que coronas sus merecimientos,

  danos la gracia de imitar su vida

  y al fin, sumisos a su magisterio,

  danos su gloria. Amén.'
Experiencia de Dios fue vuestra ciencia:
- 'Experiencia de Dios fue vuestra ciencia,

  su Espíritu veraz os dio a beberla

  en la revelación, que es su presencia

  en velos de palabra siempre nueva.'
- 'Abristeis el camino para hallarla

  a todo el que de Dios hambre tenía,

  palabra del Señor que, al contemplarla,

  enciende nuestras luces que iluminan.'
- 'Saber de Dios en vida convertido

  es la virtud del justo, que, a su tiempo,

  si Dios le dio la luz, fue lo debido

  que fuera su verdad, su pensamiento.'
- 'En nuestro corazón de criaturas,

  nos encendió la luz para esconderla,

  que poco puede andar quien anda a oscuras

  por sendas de verdad sin poder verla.'
- 'Demos gracias a Dios humildemente

  y al Hijo, su Verdad que a todos guía,

  dejemos que su Luz, faro esplendente

  nos guié por el mar de nuestra vida. Amén.'
Cantemos nuestra fe y, al confesarla:
- 'Cantemos nuestra fe y, al confesarla,

  unidas nuestras voces de creyentes,

  pidamos al Señor que, al plocamarla,

  inunde con su luz a nuestras mentes.'
- 'El gozo de creer sea alegría

  de servir al Señor, y su Palabra

  simiente en crecimiento día a día,

  que al don de su verdad el mundo abra.'
- 'Clara en la fe y oscuro su camino

  de gracia y libertad en puro encuentro,

  si crees que Jesús es Dios que vino,

  no está lejos de tí, sino muy dentro.'
- 'Legión es la asamblea de los santos,

  que en el Señor Jesús puso confianza,

  sus frutos de justicia fueron tantos

  que vieron ya colmada su esperanza.'
- 'Demos gracias a Dios, que es nuestra roca,

  sigamos a Jesús con entereza,

  si nuestra fe vacila, si ella es poca,

  su Espíritu de amor nos dará fuerza. Amén.'
Dichosas sois vosotras que guardasteis:
- 'Dichosas sois vosotras que guardasteis

  con amor maternal en vuestro seno

  la palabra del Hijo que engendrasteis

  en la vida de fe y de amor pleno.'
- 'Dichosas sois vosotras que en la vida

  hicisteis de la fe vuestra entereza,

  vuestra gracia en la Gracia fue asumida,

  maravilla de Dios y de belleza.'
- 'Dichosas sois vosotras que supisteis

  ser hijas del amor que Dios os daba,

  y así, en la fe, de muchos madres fuisteis,

  fecunda plenitud que nunca acaba.'
- 'No dejéis de ser madres en la gloria

  de los hombres que luchan con anhelo,

  ante Dios vuestro amor haga memoria

  de los hijos que esperan ir al cielo. Amén.'
Cantan a tu gloria, Cristo Sacerdote:
- 'Cantan a tu gloria, Cristo Sacerdote,

  los cielos y la tierra:

  a ti que por amor te hiciste hombre

  y al Padre como víctima te ofrendas.'
- 'Tu sacrificio nos abrió las puertas,

  de par en par, del cielo;

  ante el trono de Dios, es elocuente

  tu holocausto en la cruz y tu silencio.'
- 'Todos los sacrificios de los hombres

  quedaron abolidos:

  todos eran figuras que anunciaban

  al Sacerdote eterno, Jesucristo.'
- 'No te basta el morir, que quieres darnos

  alimento de vida:'
- 'quedarte con nosotros y ofrecerte

  sobre el altar: hacerte eucaristía.'
- 'Clavado en cruz nos miras, te miramos,

  crece el amor, la entrega.

  Al Padre, en el Espíritu, contigo,

  eleva nuestro canto y nuestra ofrenda. Amén.

  Ant. 1. El Padre, por la sangre de la cruz de Cristo, hizo la paz con todos los seres del cielo

  y de la tierra.

  Los salmos y el cántico, del domingo de la I semana del salterio

  Ant. 2. Todo fue creado por Cristo y para Cristo.

  Ant. 3. Todo lo puso bajo sus pies, y lo dio a la Iglesia, como cabeza, sobre todo; ella es

  su cuerpo.'
Alabemos al Santo que nos mostró los caminos:
- 'Alabemos al Santo que nos mostró los caminos,

  nos abrió paso y facilitó el ingreso

  a la vida escondida en Cristo,

  a la contemplación en medio del fragor del mundo.'
- 'Mientras buscamos el rostro manso del Señor,

  que pasa en medio de las calles,

  Él, que es el modelo,

  nos esculpe con trazos divinos.'
- 'Esto es imagen del eterno diálogo,

  la prenda de la intimidad divina,

  de la que el Santo, lleno de gozo,

  disfruta en el cielo para siempre.'
- 'Entonemos con el corazón rebosante de alegría

  la alabanza a la gloria de la Santa Trinidad,

  que ha otorgado a san Josemaría

  la corona de los bienaventurados. Amén.'
