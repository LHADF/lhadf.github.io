# Himnos de Oficio de lectura en español, por primer verso.
A alumbrar la misma luz:
- |-
  A alumbrar la misma luz,
  a alegrar la misma gloria,
  a enriquecer las riquezas
  y a coronar las coronas,
- |-
  a hacer cielo al mismo cielo,
  a hacer la beldad hermosa,
  a ennoblecer la nobleza
  y a honrar a las mismas honras,
- |-
  sube la que es de los cielos
  honra, riqueza, corona,
  luz, hermosura y nobleza,
  cielo, perfección y gloria.
- |-
  Flamante ropa la viste,
  a quien las estrellas bordan,
  en cuya labor el sol
  a ningún rayo perdona.
- |-
  La luna a sus pies mendiga
  todo el candor que atesora,
  y ya, sin temer menguantes,
  plenitud de luces goza.
- |-
  A recibirla salieron
  las tres divinas personas
  con los aplausos de quien
  es Hija, Madre y Esposa. Amén.
A caminar sin ti, Señor, no atino:
- |-
  A caminar sin ti, Señor, no atino;
  tu palabra de fuego es mi sendero;
  me encontraste cansado y prisionero
  del desierto, del cardo y del espino.
- |-
  Descansa aquí conmigo del camino,
  que en Emaús hay trigo en el granero,
  hay un poco de vino y un alero
  que cobije tu sueño, Peregrino.
- |-
  Yo contigo, Señor, herido y ciego;
  tú conmigo, Señor, enfebrecido,
  el aire quieto, el corazón en fuego.
- |-
  Y en diálogo sediento y torturado
  se encontrarán en un solo latido,
  cara a cara, tu amor y mi pecado. Amén.
A ti, José, patriarca y artesano:
- |-
  A ti, José, patriarca y artesano,
  que habitas pobre y escondida casa,
  con voz alegre y corazón humilde
  nuestra voz canta.
- |-
  De regia estirpe, en posición modesta,
  sufres paciente, resignado callas,
  mientras sustentas, con trabajo duro,
  dos vidas santas.
- |-
  Fiel artesano y ejemplar modelo,
  das a los hombres pruebas bien preclaras
  de honra al trabajo, y de hacer la vida
  santificada.
- |-
  Sé compasivo con tus fieles siervos,
  refrena torpes, sórdidas ganancias;
  que crezca Cristo místico en los ámbitos
  de toda patria.
- |-
  Dios uno y trino, que eres a la vez
  Padre de todos y de todos alma,
  haz que imitemos de José la vida
  y muerte santa. Amén.
Alabemos a Dios que, en su Palabra:
- |-
  Alabemos a Dios que, en su Palabra,
  nos revela el designio salvador,
  y digamos en súplica confiada:
  «Renuévame por dentro, mi Señor.»
- |-
  No cerremos el alma a su llamada
  ni dejemos que arraigue el desamor;
  aunque dura es la lucha, su palabra
  será bálsamo suave en el dolor.
- |-
  Caminemos los días de esta vida
  como tiempo de Dios y de oración;
  él es fiel a la alianza prometida:
  «Si eres mi pueblo, yo seré tu Dios.»
- |-
  Tú dijiste, Jesús, que eras camino
  para llegar al Padre sin temor;
  concédenos la gracia de tu Espíritu
  que nos lleve al encuentro del Señor. Amén.
Alegría de nieve:
- |-
  Alegría de nieve
  por los caminos.
  Todo espera la gracia
  del Bien Nacido.
- |-
  Miserables los hombres,
  dura la tierra.
  Cuanta más nieve cae,
  más cielo cerca.
- |-
  La tierra tan dormida
  ya se despierta.
  Y hasta el hombre más muerto
  se despereza.
- |-
  Ya los montes se allanan
  y las colinas,
  y el corazón del hombre
  vuelve a la vida.
- |-
  Gloria al Padre y al Hijo,
  gloria al Espíritu,
  que han mirado a la tierra
  compadecidos. Amén.
Altas primicias de la fe de México:
- |-
  Altas primicias de la fe de México,
  mártir de Cristo que por Cristo inmolas
  tu joven sangre, con viril entrega,
  donde el sol nace.
- |-
  Haz de nosotros los testigos fieles
  del Evangelio, la palabra viva,
  hoy más que nunca del Amor heraldos,
  púgil de América.
- |-
  En ti crecemos, san Felipe, incólumes,
  porque en ti sube todo el Nuevo Mundo,
  para mirar, desde el más alto cedro,
  nuevos caminos.
- |-
  Por ti madure higos de luz la patria.
  Tu cuerpo, tilma de purpúreas rosas,
  deje a su paso el esplendor moreno
  de nuestra Madre.
- |-
  Himnos y coros se desgranen siempre
  en nuestras manos, como espadas fúlgidas,
  ante el Altísimo, luz una y trina,
  oh, san Felipe. Amén.
Alégrese tierra y cielo:
- |-
  Alégrese tierra y cielo,
  pues el Verbo que ha nacido
  viene, siendo Dios, vestido
  de carne en humano velo.
- |-
  De la raíz de Jesé
  salió la graciosa vara
  de más frescor y más clara
  que en jamás será ni fue.
- |-
  Della hizo el Verbo cielo,
  y fue tan esclarecido,
  que sale de allí vestido
  de carne en humano velo.
- |-
  La nieve siente y el hielo,
  aunque es Dios de Dios venido,
  porque Dios está vestido
  de carne en humano velo.
- |-
  En traje de humanidad
  nace el Verbo con cuidado
  por destruir el pecado
  y dar a Dios su heredad.
- |-
  Quiere dar al hombre el cielo
  por ser su amor tan subido;
  y, ansí, se muestra vestido
  de carne en humano velo.
- |-
  A la Santa Trinidad
  que nos dio la redención,
  gloria, honor y bendición
  por toda la eternidad. Amén.
Aquella noche santa:
- |-
  Aquella noche santa,
  te nos quedaste nuestro,
  con angustia tu vida,
  sin heridas tu cuerpo.
- |-
  Te nos quedaste vivo,
  porque ibas a ser muerto;
  porque iban a romperte,
  te nos quedaste entero.
  Gota a gota tu sangre,
  grano a grano tu cuerpo:
  un lagar y un molino
  en dos trozos de leño.
- |-
  Aquella noche santa,
  te nos quedaste nuestro.
- |-
  Te nos quedaste todo:
  amor y sacramento,
  ternura prodigiosa,
  todo en ti, tierra y cielo.
  Te quedaste conciso,
  te escondiste concreto,
  nada para el sentido,
  todo para el misterio.
- |-
  Aquella noche santa,
  te nos quedaste nuestro.
- |-
  Vino de sed herida,
  trigo de pan hambriento,
  toda tu hambre cercana,
  tú, blancura de fuego.
  En este frío del hombre
  y en su labio reseco,
  aquella noche santa,
  te nos quedaste nuestro.
- |-
  Te adoro, Cristo oculto,
  te adoro, trigo tierno. Amén.
Asidos de tu falda, con los ojos:
- |-
  Asidos de tu falda, con los ojos
  agrandados de asombro, con las manos
  apretadas de miedos y de enojos...
- |-
  ¡Pobres manos vacías de tus hijos!
  Ojos que alzan del suelo su vergüenza
  para quedar en tu mirada fijos;
- |-
  ojos que te confían nuestros sueños,
  manos que aprietan nuestras esperanzas:
  —si somos, ante ti, niños pequeños—.
- |-
  Con las manos así, con la mirada
  llena de la alba virgen de tus ojos,
  te llamamos: dulcísima abogada. Amén.
Ayer, en leve centella:
- |-
  Ayer, en leve centella,
  te vio Moisés sobre el monte;
  hoy no basta el horizonte
  para contener tu estrella.
- |-
  Los magos preguntan; y ella
  de un Dios infante responde
  que en duras pajas se acuesta
  y más se nos manifiesta
  cuanto más hondo se esconde. Amén.
Brotó de ti la gracia y nuestra vida:
- |-
  Brotó de ti la gracia y nuestra vida,
  oh Virgen manantial de toda dicha,
  cuando igual que la madre primeriza
  fuiste madre con gritos de alegría.
- |-
  Mujer de aldea y madre de los hombres,
  mujer de grandes gozos y dolores,
  ¡cómo esperan de ti los corazones,
  porque eres la más pobre de las pobres!
- |-
  El Rey de paz te acoge, en ti se goza,
  y en tu virginidad sella su gloria;
  ¡cante el mundo y la Iglesia deseosa
  al Señor que de gracia te corona! Amén.
Con entrega, Señor, a ti venimos:
- |-
  Con entrega, Señor, a ti venimos,
  escuchar tu palabra deseamos;
  que el Espíritu ponga en nuestros labios
  la alabanza al Padre de los cielos.
- |-
  Se convierta en nosotros la palabra
  en la luz que a los hombres ilumina,
  en la fuente que salta hasta la vida,
  en el pan que repara nuestras fuerzas;
- |-
  en el himno de amor y de alabanza
  que se canta en el cielo eternamente,
  y en la carne de Cristo se hizo canto
  de la tierra y del cielo juntamente.
- |-
  Gloria a ti, Padre nuestro, y a tu Hijo,
  el Señor Jesucristo, nuestro hermano,
  y al Espíritu Santo, que, en nosotros,
  glorifica tu nombre por los siglos. Amén
Con gozo el corazón cante la vida:
- |-
  Con gozo el corazón cante la vida,
  presencia y maravilla del Señor,
  de luz y de color bella armonía,
  sinfónica cadencia de su amor.
- |-
  Palabra esplendorosa de su Verbo,
  cascada luminosa de verdad,
  que fluye en todo ser que en él fue hecho
  imagen de su ser y de su amor.
- |-
  La fe cante al Señor, y su alabanza,
  palabra mensajera del amor,
  responda con ternura a su llamada
  en himno agradecido a su gran don.
- |-
  Dejemos que su amor nos llene el alma
  en íntimo diálogo con Dios,
  en puras claridades cara a cara,
  bañadas por los rayos de su sol.
- |-
  Al Padre subirá nuestra alabanza
  por Cristo, nuestro vivo intercesor,
  en alas de su Espíritu que inflama
  en todo corazón su gran amor. Amén.
Criaturas, alegraos:
- |-
  Criaturas, alegraos,
  pues la salud nos llega:
  el Redentor del hombre,
  Señor de cielo y tierra.
- |-
  María, toda gracia,
  abre a Cristo la puerta:
  pasa el Rey, y cerrada
  eternamente queda.
- |-
  La Madre es todo gozo,
  el hombre es todo espera,
  y Cristo presentado
  de gracia al mundo llena.
- |-
  Honor y gloria a Cristo,
  a quien el Padre engendra,
  y por el Santo Espíritu
  da a luz una doncella. Amén.
Cristo el Señor:
- |-
  Cristo el Señor,
  como la primavera,
  como una nueva aurora,
  resucitó.
- |-
  Cristo, nuestra Pascua,
  es nuestro rescate,
  nuestra salvación.
- |-
  Es grano en la tierra,
  muerto y florecido,
  tierno pan de amor.
- |-
  Se rompió el sepulcro,
  se movió la roca,
  y el fruto brotó.
- |-
  Dueño de la muerte,
  en el árbol grita
  su resurrección.
- |-
  Humilde en la tierra,
  Señor de los cielos,
  su cielo nos dió.
- |-
  Ábranse de gozo
  las puertas del Hombre
  que al hombre salvó.
- |-
  Gloria para siempre
  al Cordero humilde
  que nos redimió. Amén.
Cruz de Cristo:
- |-
  Cruz de Cristo,
  cuyos brazos
  todo el mundo han acogido.
- |-
  Cruz de Cristo,
  cuya sangre
  todo el mundo ha redimido.
- |-
  Cruz de Cristo,
  luz que brilla
  en la noche del camino.
- |-
  Cruz de Cristo,
  cruz del hombre,
  su bastón de peregrino.
- |-
  Cruz de Cristo,
  árbol de vida,
  vida nuestra, don eximio.
- |-
  Cruz de Cristo,
  altar divino
  de Dios-Hombre en sacrificio. Amén.
Custodio providente y fiel del Hijo:
- |-
  Custodio providente y fiel del Hijo,
  amor junto al Amor doquier presente,
  silencio del que ve la gloria inmensa
  de Dios omnipotente.
- |-
  Esposo enamorado de la Virgen,
  la mente ante el misterio reclinabas,
  rosal inmaculado que florece,
  es obra del Señor a quien amabas.
- |-
  Callada voluntad en Dios perdida,
  amor hecho mirada de confianza,
  fiel en el trabajo y en la prueba,
  provéenos de amor y de esperanza.
- |-
  Protege la asamblea de los justos,
  reunidos en la fe, cuerpo de Cristo;
  sé padre que nos lleve a nuestro Padre,
  amor del gran Amor que nos da el Hijo. Amén.
Custodio virgen de la Virgen Madre:
- |-
  Custodio virgen de la Virgen Madre,
  fiel pregonero del divino Verbo,
  que laves, Juan, sus manchas y pecados
  piden tus siervos.
- |-
  Río impetuoso de perenne fuente,
  riegas el mundo por el sol sediento,
  brindándole la ciencia que aprendiste
  del propio Verbo.
- |-
  Implora la piedad por nuestras culpas,
  tú, prez del mundo, resplandor del cielo,
  da poder penetrar los que enseñaste,
  santos misterios.
- |-
  Tú penetras del Padre en el arcano,
  al escribir la fe de tu evangelio,
  haznos, buen guía, que al Señor veamos
  allá en el cielo.
- |-
  Gloria y honor a Cristo para siempre
  que la Virgen dio a luz, Hijo unigénito,
  como a él, al Padre y al Amor divino
  gloria cantemos. Amén.
De la raíz de Jesé:
- |-
  De la raíz de Jesé
  dio la vara bella flor,
  fecundo parto ha tenido
  sin mengua de su pudor.
- |-
  Feliz recibe el pesebre
  a quien la luz fabricó,
  con el Padre hizo los cielos
  y está entre pañales hoy.
- |-
  Al mundo le ha dado leyes
  y diez esas leyes son,
  y al hacerse hombre no quiso
  romper la ley, la cumplió.
- |-
  Ha nacido ya la luz,
  muere la muerte, y huyó
  la noche, venid, oh pueblos,
  que María trajo a Dios.
- |-
  A ti, Jesús, de la Virgen
  nacido, gloria y honor,
  con el Padre y el Paráclito,
  sempiterna adoración. Amén.
De la salud la fuente:
- |-
  De la salud la fuente,
  coronada de juncos punzadores,
  un corazón ardiente
  buscaba triste y lleno de dolores,
  y, hallándola en la cruz, que atento mira,
  así gime, así llora, así suspira:
- |-
  «Señor, yo soy el ciervo
  que tan sediento busco esos cristales;
  si te ofendí, protervo,
  ya vuelvo arrepentido de mis males;
  y no me he de apartar de tu presencia
  sin perdón, sin favores, sin clemencia.
- |-
  En esa cruz clavado,
  arco de paz te hicieron tus finezas,
  y, pues enamorado
  así encender pretendes las tibiezas,
  que se abrasen las mías hoy te ruego
  con tu luz, con tu llama, con tu fuego.
- |-
  El Dios de las venganzas
  un tiempo los profetas te llamaron,
  mas ya mis esperanzas,
  desde que hombre te hiciste, mejoraron,
  pues Dios de amor te miran en prisiones,
  sin carcaj, sin saetas, sin arpones.» Amén.
De luz nueva se viste la tierra:
- |-
  De luz nueva se viste la tierra,
  porque el Sol que del cielo ha venido,
  en la entraña feliz de la Virgen,
  de su carne se ha revestido.
- |-
  El amor hizo nuevas las cosas,
  el Espíritu ha descendido
  y la sombra del que todo puede
  en la Virgen su luz ha encendido.
- |-
  Ya la tierra reclama su fruto
  y de bodas se anuncia alegría;
  el Señor que en los cielos habita
  se hizo carne en la Virgen María.
- |-
  Gloria a Dios, el Señor poderoso,
  a su Hijo y Espíritu Santo,
  que amoroso nos ha bendecido
  y a su reino nos ha destinado. Amén.
De un Dios que se encarnó muestra el misterio:
- |-
  De un Dios que se encarnó muestra el misterio
  la luz de Navidad.
  Comienza hoy, Jesús, tu nuevo imperio
  de amor y de verdad.
- |-
  El Padre eterno te engendró en su mente
  desde la eternidad,
  y antes que el mundo, ya eternamente,
  fue tu natividad.
- |-
  La plenitud del tiempo está cumplida;
  rocío bienhechor
  baja del cielo, trae nueva vida
  al mundo pecador.
- |-
  ¡Oh santa noche! Hoy Cristo nacía
  en mísero portal;
  Hijo de Dios, recibe de María
  la carne del mortal.
- |-
  Este Jesús en brazos de María
  es nuestra redención;
  cielos y tierra con su abrazo unía
  de paz y de perdón.
- |-
  Tú eres el Rey de paz, de ti recibe
  su luz el porvenir;
  ángel del gran Consejo, por ti vive
  cuanto llega a existir.
- |-
  A ti, Señor, y al Padre la alabanza,
  y de ambos al Amor.
  Contigo al mundo llega la esperanza;
  a ti gloria y honor. Amén.
De una Familia divina:
- |-
  De una Familia divina
  pasó a una Familia humana.
  Nació de una Virgen Madre
  una noche iluminada
  por ángeles y luceros
  en una pobre cabaña;
  tuvo un padre carpintero
  que todo el día trabajaba
  para darle de comer
  al hijo de la esperanza,
  que un día edificó los mundos
  por ser la eterna Palabra.
- |-
  De una Familia divina
  pasó a una Familia humana.
  Eterno Amor allá arriba;
  acá abajo amor sin mancha.
- |-
  Arriba, el Fuego inefable;
  acá, el calor de una casa.
  Allá, en el seno infinito,
  la canción nunca acabada;
  acá, la canción de cuna
  y la canción de una lanza.
- |-
  De una Familia divina
  pasó a una Familia humana.
  Vivió humilde en la obediencia
  su humildad humillada;
  pobre vivió en Nazaret
  quien rico en su Padre estaba,
  y siendo todo en la altura
  en el suelo se hizo nada.
- |-
  ¡Oh Jesús de Nazaret,
  hijo de Familia humana,
  por tu Familia divina,
  santifica nuestras casas! Amén.
Delante de tus ojos:
- |-
  Delante de tus ojos
  ya no enrojecemos
  a causa del antiguo
  pecado de tu pueblo.
  Arrancarás de cuajo
  el corazón soberbio
  y harás un pueblo humilde
  de corazón sincero.
- |-
  En medio de los pueblos
  nos guardas como un resto,
  para cantar tus obras
  y adelantar tu reino.
  Seremos raza nueva
  para los cielos nuevos;
  sacerdotal estirpe,
  según tu Primogénito.
- |-
  Caerán los opresores
  y exultarán los siervos;
  los hijos del oprobio
  serán tus herederos.
  Señalarás entonces
  el día del regreso
  para los que comían
  su pan en el destierro.
- |-
  ¡Exulten mis entrañas!
  ¡Alégrese mi pueblo!
  Porque el Señor, que es justo,
  revoca sus decretos:
  la salvación se anuncia
  donde acechó el infierno,
  porque el Señor habita
  en medio de su pueblo. Amén.
Dichosa la mujer que ha conservado:
- |-
  Dichosa la mujer que ha conservado,
  en su regazo, con amor materno,
  la palabra del Hijo que ha engendrado
  en la vida de fe y de amor pleno.
- |-
  Dichosas sois vosotras, que en la vida
  hicisteis de la fe vuestra entereza,
  vuestra gracia en la Gracia fue asumida,
  maravilla de Dios y de belleza.
- |-
  Dichosas sois vosotras, que supisteis
  ser hijas del amor que Dios os daba,
  y así, en la fe, madres de muchos fuisteis,
  fecunda plenitud que nunca acaba.
- |-
  No dejéis de ser madres, en la gloria,
  de los hombres que luchan con anhelo,
  ante Dios vuestro amor haga memoria
  de los hijos que esperan ir al cielo. Amén.
Dichoso Pedro, fiel pastor, recibe:
- |-
  Dichoso Pedro, fiel pastor, recibe
  las preces nuestras; rompe las cadenas
  de nuestras culpas, tú que recibiste
  poder de abrir los cielos y la tierra.
- |-
  Al Uno y Trino sempiterna gloria,
  honor, poder y jubilosos himnos,
  porque él mantiene en unidad al mundo,
  por todo el curso de incontables siglos. Amén.
Dichosos los que, oyendo la llamada:
- |-
  Dichosos los que, oyendo la llamada
  de la fe y del amor en vuestra vida,
  creísteis que la vida os era dada
  para darla en amor y con fe viva.
- |-
  Dichosos, si abrazasteis la pobreza
  para llenar de Dios vuestras alforjas,
  para servirle a él con fortaleza,
  con gozo y con amor a todas horas.
- |-
  Dichosos mensajeros de verdades,
  que fuisteis por caminos de la tierra,
  predicando bondad contra maldades,
  pregonando la paz contra las guerras.
- |-
  Dichosos, del amor dispensadores,
  dichosos, de los tristes el consuelo,
  dichosos, de los hombres servidores,
  dichosos, herederos de los cielos. Amén.
Dios de la tierra y del cielo:
- |-
  Dios de la tierra y del cielo,
  que, por dejarlas más claras,
  las grandes aguas separas,
  pones un límite al cielo.
- |-
  Tú que das cauce al riachuelo
  y alzas la nube a la altura,
  tú que, en cristal de frescura,
  sueltas las aguas del río
  sobre las tierras de estío,
  sanando su quemadura,
- |-
  danos tu gracia, piadoso,
  para que el viejo pecado
  no lleve al hombre engañado
  a sucumbir a su acoso.
- |-
  Hazlo en la fe luminoso,
  alegre en la austeridad,
  y hágalo tu claridad
  salir de sus vanidades;
  dale, Verdad de verdades,
  el amor a tu verdad. Amén.
El pecado del hombre ha dado muerte:
- |-
  El pecado del hombre ha dado muerte
  al Ungido de Dios y, en cruz clavado,
  con su muerte venció todo el pecado,
  con su amor del mortal cambió la suerte.
- |-
  Nueva vida dará a todas las gentes,
  saciará su gran sed siempre sentida,
  brotarán en el alma redimida
  de la vida de Dios copiosas fuentes.
- |-
  Luz que brilla en lo alto, y reverbera
  en la honda pupila dilatada
  de la angustia del hombre, que, en su espera,
- |-
  sin saberlo tal vez, sólo quisiera
  ver su cruz en tu cruz, luz deseada,
  para guardar muy dentro lo que viera. Amén.
En el principio, tu Palabra:
- |-
  En el principio, tu Palabra.
  Antes que el sol ardiera,
  antes del mar y las montañas,
  antes de las constelaciones,
  nos amó tu Palabra.
- |-
  Desde tu seno, Padre,
  era sonrisa su mirada,
  era ternura su sonrisa,
  era calor de brasa.
  En el principio, tu Palabra.
- |-
  Todo se hizo de nuevo,
  todo salió sin mancha,
  desde el arrullo del río
  hasta el rocío y la escarcha;
  nuevo el canto de los pájaros,
  porque habló tu Palabra.
- |-
  Y nos sigues hablando todo el día,
  aunque matemos la mañana
  y desperdiciemos la tarde,
  y asesinemos la alborada.
  Como una espada de fuego,
  en el principio, tu Palabra.
- |-
  Llénanos de tu presencia, Padre;
  Espíritu, satúranos de tu fragancia;
  danos palabras para responderte,
  Hijo, eterna Palabra. Amén.
En el principio, tu palabra:
- |-
  En el principio, tu palabra.
  Antes que el sol ardiera,
  antes del mar y las montañas,
  antes de las constelaciones,
  nos amó tu palabra
- |-
  Desde tu seno, Padre,
  era sonrisa su mirada,
  era ternura su sonrisa,
  era calor de brasa.
  En el principio, tu palabra.
- |-
  Todo se hizo de nuevo,
  todo salió sin mancha,
  desde el arrullo del río
  hasta el rocío y la escarcha;
  nuevo el canto de los pájaros,
  porque habló tu Palabra.
- |-
  Y nos sigues hablando todo el día,
  aunque matemos la mañana
  y desperdiciemos la tarde,
  y asesinemos la alborada.
  Como una espada de fuego,
  en el principio, tu Palabra.
- |-
  Llénanos de tu presencia, Padre;
  Espíritu satúranos de tu fragancia;
  danos palabras para responderte,
  Hijo, eterna Palabra. Amén
Eres mujer de casa y, además, peregrina:
- |-
  Eres mujer de casa y, además, peregrina,
  dedicada a lo tuyo como madre y esposa,
  pero sigues la huella por donde Dios camina
  y estás de corazón en cada cosa.
- |-
  Estás en la montaña antes del alba,
  —que el amor te apresura—,
  y en cualquier otro Belén por esperar que nazca
  de nuevo Dios, y preparar su cuna.
- |-
  Te haces de nuestra raza,
  pronuncias nuestra lengua con dulzura
  y nos pides te hagamos una Casa,
  para en ella mostrarnos tu sin igual ternura.
- |-
  Bajas, subes, que para eso eres ave,
  ayer por el Calvario y por el cielo,
  hoy por la patria suave,
  y en pos de ti volamos en tu vuelo.
- |-
  Gloria demos al Padre que no tuvo principio,
  gloria perenne a Cristo, que es el Hijo del Padre,
  y al Espíritu Santo, Consolador divino.
  ¡Que todo el universo los aclame! Amén.
Esta mujer no quiso:
- |-
  Esta mujer no quiso
  tomar varón ni darle su ternura,
  selló su compromiso
  con otro amor que dura
  sobre el amor de toda criatura.
- |-
  Y tanto se apresura
  a zaga de la huella del Amado,
  que en él se transfigura,
  y el cuerpo anonadado
  ya está por el amor resucitado.
- |-
  Aquí la Iglesia canta
  la condición futura de la historia,
  y el cuerpo se adelanta
  en esta humilde gloria
  a la consumación de su victoria.
- |-
  Mirad los regocijos
  de la que por estéril sollozaba
  y se llenó de hijos,
  porque el Señor miraba
  la pequeñez humilde de su esclava. Amén.
Este largo martirio de la vida:
- |-
  Este largo martirio de la vida,
  la fe tan viva y la esperanza muerta,
  el alma desvelada y tan despierta
  al dolor, y al consuelo tan dormida;
- |-
  esta perpetua ausencia y despedida,
  entrar el mal, cerrar tras sí la puerta,
  con diligencia y gana descubierta
  de que el bien no halle entrada ni salida;
- |-
  ser los alivios más sangrientos lazos
  y riendas libres de los desconciertos,
  efectos son, Señor, de mis pecados,
- |-
  de que me han de librar esos tus brazos
  que para recibirme están abiertos
  y por no castigarme están clavados. Amén.
Hondo saber de Dios fue vuestra ciencia:
- |-
  Hondo saber de Dios fue vuestra ciencia.
  su espíritu de verdad os dio a beberla
  en la Revelación, que es su presencia
  en velos de palabra siempre nueva.
- |-
  Abristeis el camino para hallarla
  a todo el que de Dios hambre tenía,
  palabra del Señor que, al contemplarla,
  enciende nuestras luces que iluminan.
- |-
  Saber de Dios en vida convertido
  es la virtud del justo, que, a su tiempo,
  si Dios le dio la luz, fue lo debido
  que fuera su verdad, su pensamiento.
- |-
  Demos gracias a Dios humildemente,
  y al Hijo, su verdad que a todos guía,
  dejemos que su Luz, faro esplendente,
  nos guíe por el mar de nuestra vida. Amén.
Hoy dos extremos se han visto:
- |-
  Hoy dos extremos se han visto,
  cuales nunca se verán:
  Cristo arrodillado a Juan,
  y Juan bautizando a Cristo.
- |-
  El mar y abismo profundo
  de la pureza infinita,
  que las inmundicias quita
  y los pecados del mundo,
- |-
  hoy del Bautista se ha visto
  ser lavado en el Jordán;
  Cristo arrodillado a Juan,
  y Juan bautizando a Cristo.
- |-
  Bautiza la voz al Verbo,
  el criado al Criador;
  ved qué humildad de Señor
  y qué autoridad de siervo.
- |-
  Favor otra vez no visto
  entre los hijos de Adán,
  Cristo arrodillado a Juan,
  y Juan bautizando a Cristo.
- |-
  Los cielos se abren,
  y allí la voz del Padre ha entonado:
  «Aqueste es mi Hijo amado,
  en el cual me complací.»
- |-
  Y el Paracleto se ha visto,
  testificando que están
  Cristo arrodillado a Juan,
  y Juan bautizando a Cristo.
- |-
  Qué grande misterio encierra
  el Jordán; cantad, criaturas:
  «Gloria a Dios en las alturas
  y paz al hombre en la tierra.» Amén.
La Madre piadosa estaba:
- |-
  La Madre piadosa estaba
  junto a la cruz, y lloraba
  mientras el Hijo pendía;
  cuya alma triste y llorosa,
  traspasada y dolorosa,
  fiero cuchillo tenía.
- |-
  ¡Oh cuán triste y afligida
  estaba la Madre herida,
  de tantos tormentos llena!
  Cuando triste contemplaba
  y dolorosa miraba
  del Hijo amado la pena.
- |-
  ¿Y cuál hombre no llorara
  si a la Madre contemplara
  de Cristo en tanto dolor?
  ¿Y quién no se entristeciera,
  Madre piadosa, si os viera
  sujeta a tanto rigor?
- |-
  Por los pecados del mundo,
  vio a Jesús en tan profundo
  tormento la dulce Madre.
  Vio morir al Hijo amado
  que rindió desamparado
  el espíritu a su Padre.
- |-
  ¡Oh dulce fuente de amor!,
  hazme sentir tu dolor
  para que llore contigo.
  Y que, por mi Cristo amado,
  mi corazón abrasado
  mas viva en él que conmigo. Amén.
La Palabra de Dios crucificada:
- |-
  La Palabra de Dios crucificada
  es testigo fiel de su elocuencia,
  es palabra de amor y, en su existencia,
  en la vida y la muerte fue probada.
- |-
  Por dar fe de su amor, nos dio su vida;
  por dar fe de la vida, fue exaltada
  sobre toda palabra pronunciada;
  por el Padre a los hombres ofrecida.
- |-
  La Palabra de Dios ya fue cumplida.
  El silencio de Dios está a la espera
  del amor de los hombres, Y él quisiera
  que esa Palabra fuera recibida,
  y en comunión de amor por siempre fuera
  plenitud de su don que a todos diera. Amén.
La noche estaba del silencio en medio:
- |-
  La noche estaba del silencio en medio,
  y las cosas suspensas, aguardando
  de la dichosa hora el punto, cuando
  reciba el mundo sin igual remedio.
- |-
  Puso entre el hombre y Dios la Virgen medio,
  su consentir humilde al ángel dando,
  y el resplandor del Padre, así encarnando,
  ya vecino al nacer confirma el medio.
- |-
  María, de extremado gozo llena
  y en vehemente ardor toda encendida,
  pide que salga el Sol que la enamora.
- |-
  Vistióse de blancura y luz serena,
  y, sobre humanas fuerzas conmovida,
  virgen y madre se mostró a la hora.
- |-
  Gloria y loores por la eternidad
  tribútense a la Santa Trinidad. Amén.
La santidad de Rosa cantad, ángeles:
- |-
  La santidad de Rosa cantad, ángeles,
  y todas las milicias de los cielos,
  y en todas partes canten sus virtudes
  las turbas de mortales en el suelo.
- |-
  Es la primera víctima de amores
  Que ofrece en sus altares nuestra América:
  un poderoso auxilio para el mundo
  y un refulgente ejemplo de inocencia.
- |-
  Les da a los ciegos el gozar la vista,
  desata las cadenas de las lenguas,
  levanta a los inválidos del lecho,
  y cura su oración toda dolencia.
- |-
  Oh Trinidad, perpetuas alabanzas
  te sean dadas hoy y en todo tiempo
  con santa Rosa lleva nuestras almas
  al gozo de las bodas del Cordero. Amén.
La tumba abierta dice al universo:
- |-
  La tumba abierta dice al universo:
  «¡Vive! ¡Gritad, oh fuego, luz y brisa,
  corrientes primordiales, firme tierra,
  al Nazareno, dueño de la vida.»
- |-
  La tumba visitada está exultando:
  «¡Vive! ¡Gritad, montañas y colinas!
  Le disteis vuestra paz, vuestra hermosura,
  para estar con el Padre en sus vigilias.»
- |-
  La tumba perfumada lo proclama:
  «¡Vive! ¡Gritad, las plantas y semillas:
  le disteis la bebida y alimento
  y él os lleva en su carne florecida!»
- |-
  La tumba santa dice a las mujeres:
  «¡Vive! ¡Gritad, creyentes matutinas,
  la noticia feliz a los que esperan,
  y colmad a los hombres de alegría!»
- |-
  ¡Vive el Señor Jesús, está delante,
  está por dentro, está emanando vida!
  ¡Cante la vida el triunfo del Señor,
  su gloria con nosotros compartida! Amén.
Levántame Señor, que estoy caído:
- |-
  Levántame Señor, que estoy caído,
  sin amor, sin temor, sin fe, sin miedo;
  quiérome levantar, y estoyme quedo;
  yo propio lo deseo, y yo lo impido.
- |-
  Estoy, siendo uno solo, dividido:
  a un tiempo muerto y vivo, triste y ledo;
  lo que puedo hacer, eso no puedo;
  huyo del mal y estoy en él metido.
- |-
  Tan obstinado estoy en mi porfía,
  que el temor de perderme y de perderte
  jamás de mi mal uso me desvía.
- |-
  Tu poder y bondad truequen mi suerte:
  que en otros veo enmienda cada día,
  y en mí nuevos deseos de ofenderte. Amén.
Lucero de la mañana:
- |-
  Lucero de la mañana,
  norte que muestra el camino,
  cuando turba de continuo
  nuestro mar la tramontana.
  Quien tanta grandeza explica
  sin alas puede volar,
  porque no podrá alabar
  a la que es más santa y rica.
- |-
  Sois pastora de tal suerte,
  que asegurais los rebaños
  de mortandades y daños,
  dando al lobo cruda muerte.
  Dais vida a quien se os aplica,
  y en los cielos y en la tierra
  librais las almas de guerra,
  como poderosa y rica.
- |-
  Si vuestro ejemplo tomasen
  las pastoras y pastores,
  yo fío que de dolores
  para siempre se librasen.
  Tanto Dios se os comunica,
  que sin fin os alabamos,
  y más cuando os contemplamos
  en el mundo la más rica. Amén.
Madre de la Divina Providencia:
- |-
  Madre de la Divina Providencia,
  a ti eleva confiado el cristiano
  sus votos en piadosa oración,
  fuente viva de amor.
- |-
  Para el pueblo que avanza por el mundo
  al ritmo del trabajo y el dolor,
  tu experiencia de fe da el sentido
  de la vida con Dios.
- |-
  Eres la Virgen fiel y silenciosa
  que al servicio de Dios y de su obra
  desde la Anunciación hasta la muerte
  dices tu humilde "Sí".
- |-
  Eres la Virgen-Madre admirable
  que en el Gólgota extiendes tu misión
  acogiendo a los hombre como hijos
  de tu amor y dolor.
- |-
  Eterna gloria sea al Dios vivo,
  Uno en el ser y Trino en las personas:
  Padre, Hijo y Espíritu de amor,
  que a todos da la vida. Amén.
María subió a la montaña:
- |-
  María subió a la montaña,
  y en ella subió el Señor;
  supo Isabel el misterio,
  y Juan exultó a su voz.
- |-
  El lucero aún no nacía
  ni había aparecido el Sol;
  no hablaba aún la Palabra
  y el pregonero exultó.
- |-
  Los vecinos, asombrados
  y mudos de admiración,
  vieron llegar por María
  la Buena Nueva de Dios. Amén.
Me ha calentado el sol ya tantos años:
- |-
  Me ha calentado el sol ya tantos años
  que pienso que mi entraña está madura
  y has de bajar, Señor, para arrancarme
  con tus manos inmensas y desnudas.
- |-
  Pleno y dorado estoy para tu sueño;
  por él navegaré como una luna
  que irá brillando silenciosamente,
  astro frutal sobre tu noche pura.
- |-
  Una nube vendrá y acaso borre
  mi luz para los vivos y, entre lluvia,
  zumo dulce de ti, te irá cayendo
  la savia de mi ser, como una música.
- |-
  Será que estaré muerto y entregado,
  otra vez, a la tierra de las tumbas.
  Pero, sangre inmortal, mi roja entraña
  de nuevo quemará tu luz futura. Amén.
Mensajeros de Dios:
- |-
  Mensajeros de Dios
  dadnos la Nueva;
  mensajeros de paz,
  sea paz nuestra.
- |-
  Mensajeros de luz,
  sea luz nuestra;
  mensajeros de fe,
  sea fe nuestra.
- |-
  Mensajeros del Rey,
  sea rey nuestro;
  mensajeros de amor,
  sea amor nuestro. Amén.
Muerte, puerto de mi vida:
- |-
  Muerte, puerto de mi vida,
  vida que en mi muerte estás,
  como no sé si vendrás
  de luna o de sol vestida,
  muriendo estoy en mi vida,
  viviendo en ti, muerte, estoy;
  pues, siendo lo que no soy
  y anhelando al que siempre es,
  con la inquietud de tus pies,
  hacia sus riberas voy.
- |-
  Tengo contigo una cita
  desde siempre, desde Dios;
  sólo una señal: adiós
  —sobre el corazón escrita—,
  es la palabra inaudita
  que digo a todas las cosas.
  y cunas, tálamos, fosas
  —claro silencio escondido—,
  de adioses el pecho herido,
  dicen adiós a las rosas. Amén.
Nacidos del amor para la vida:
- |-
  Nacidos del amor para la vida,
  vivieron un amor nunca acabado,
  murieron un amor crucificado
  en una carne débil no abatida.
- |-
  Hirieron con la sangre de su herida
  el animal salvaje del pecado,
  floreció su bautismo en el Amado
  con una santidad comprometida.
- |-
  Hombres como nosotros, compañeros
  del silencio extasiado o de la guerra,
  en la fatiga de todos los senderos.
- |-
  Danos, Padre, gozar su compañía,
  ser testigos del cielo aquí en la tierra
  y, como ellos, vivir en agonía. Amén.
Naciste del Padre, sin principio:
- |-
  Naciste del Padre, sin principio,
  antes que la luz resplandeciera;
  del seno sin mancha de María
  surges como luz en las tinieblas.
- |-
  Los pobres acuden a adorarte,
  solos, ellos velan en la noche,
  sintiendo admirados en tu llanto
  la voz del pastor de los pastores.
- |-
  El mundo se alegra en este día,
  gozan los patriarcas, los profetas;
  la flor ha nacido de la rama,
  flor que ha perfumado nuestra Iglesia.
- |-
  Los ángeles cantan hoy tu gloria,
  Padre, que enviaste a Jesucristo;
  unimos con ellos nuestras voces,
  oye, bondadoso, nuestros himnos. Amén.
Ninguno del ser humano:
- |-
  Ninguno del ser humano
  como vos se pudo ver:
  que a otros los dejan caer
  y después les dan la mano.
- |-
  Mas vos, Virgen, no caíste
  como los otros cayeron,
  que siempre la mano os dieron
  con que preservada fuiste.
- |-
  Yo, cien mil veces caído,
  os suplico que me deis
  la vuestra, y me levantéis
  porque no quede perdido.
- |-
  y por vuestra concepción,
  que fue de tan gran pureza,
  conserva en mí la limpieza
  del alma y del corazón,
- |-
  para que, de esta manera,
  suba con vos a gozar
  del que solo puede dar
  vida y gloria verdadera. Amén.
Nueva Jerusalén y ciudad santa:
- |-
  Nueva Jerusalén y ciudad santa,
  nuevo Israel, nueva morada
  de la comunidad de Dios en Cristo edificada,
  Iglesia santa.
- |-
  Esposa engalanada, con Cristo desposada
  por obra del Espíritu en sólida alianza,
  divino hogar, fuego de Dios que al mundo inflama,
  Iglesia santa.
- |-
  Edén de Dios y nuevo paraíso,
  donde el nuevo Adán recrea a sus hermanos,
  donde el «no» del pecador, por pura gracia,
  el «sí» eterno de amor de Dios alcanza,
  Iglesia santa.
- |-
  Adoremos a Dios omnipotente y a su Espíritu,
  que en el Hijo Jesús, Señor constituido,
  del hombre que ha caído raza de Dios levanta,
  Iglesia santa. Amén.
Ofrezcan los cristianos:
- |-
  Ofrezcan los cristianos
  ofrendas de alabanza
  a gloria de la Víctima
  propicia de la Pascua.
- |-
  Cordero sin pecado
  que a las ovejas salva,
  a Dios y a los culpables
  unió con nueva alianza.
- |-
  Lucharon vida y muerte
  en singular batalla,
  y, muerto el que es la Vida,
  triunfante se levanta.
- |-
  Rey vencedor, apiádate
  de la miseria humana
  y da a tus fieles parte
  en tu victoria santa. Amén.
Oh Rey perpetuo de los elegidos:
- |-
  Oh Rey perpetuo de los elegidos,
  oh Creador que todo lo creaste,
  oh Dios en quien el Hijo sempiterno
  es desde antes del tiempo igual al Padre.
- |-
  Oh tú que, sobre el mundo que nacía,
  imprimiste en Adán tu eterna imagen,
  confundiendo en su ser el noble espíritu
  y el miserable lodo de la carne.
- |-
  Oh tú que ayer naciste de la Virgen,
  y hoy del fondo de la tumba naces;
  oh tú que, resurgiendo de los muertos,
  de entre los muertos resurgir nos haces.
- |-
  Oh Jesucristo, libra de la muerte
  a cuantos hoy reviven y renacen,
  para que seas el perenne gozo
  pascual de nuestras mentes inmortales.
- |-
  Gloria al Padre celeste y gloria al Hijo,
  que de la muerte resurgió triunfante,
  y gloria con entrambos al divino Paracleto,
  por siglos incesantes. Amén.
Oh perpetuo Pastor que purificas:
- |-
  Oh perpetuo Pastor que purificas
  a tu grey con las aguas bautismales,
  en las que hallan limpieza nuestras mentes
  y sepulcro final nuestras maldades.
- |-
  Oh tú que, al ver manchada nuestra especie
  por obra del demonio y de sus fraudes,
  asumiste la carne de los hombres
  y su forma perdida reformaste.
- |-
  Oh tú que, en una cruz clavado un día,
  llegaste por amor a extremos tales,
  que pagaste la deuda de los hombres
  con el precio divino de tu sangre.
- |-
  Oh Jesucristo, libra de la muerte
  a cuantos hoy reviven y renacen,
  para que seas el perenne gozo
  pascual de nuestras mentes inmortales.
- |-
  Gloria al Padre celeste y gloria al Hijo,
  que de la muerte resurgió triunfante,
  y gloria con entrambos al divino Paracleto,
  por siglos incesantes. Amén.
Palabra del Señor ya rubricada:
- |-
  Palabra del Señor ya rubricada
  es la vida del mártir ofrecida
  como prueba fiel de que la espada
  no puede ya truncar la fe vivida.
- |-
  Fuente de fe y de luz es su memoria,
  coraje para el justo en la batalla
  del bien, de la verdad, siempre victoria
  que, en vida y muerte, el justo en Cristo halla.
- |-
  Martirio es el dolor de cada día,
  si en Cristo y con amor es aceptado,
  fuego lento de amor que, en la alegría
  de servir al Señor, es consumado.
- |-
  Concédenos, oh Padre, sin medida,
  y tú, Señor Jesús crucificado,
  el fuego del Espíritu de vida
  para vivir el don que nos has dado. Amén.
Para la cruz y la crucifixión:
- |-
  Para la cruz y la crucifixión,
  para la agonía debajo de los olivos,
  nada mejor
  que el monte Tabor.
- |-
  Para los largos días de pena y dolor,
  cuando se arrastra la vida inútilmente,
  nada mejor
  que el monte Tabor.
- |-
  Para el fracaso, la soledad, la incomprensión,
  cuando es gris el horizonte y el camino,
  nada mejor
  que el monte Tabor.
- |-
  Para el triunfo gozoso de la resurrección,
  cuando todo resplandece de cantos,
  nada mejor
  que el monte Tabor. Amén.
Pedro, roca; Pablo, espada:
- |-
  Pedro, roca; Pablo, espada.
  Pedro, la red en las manos;
  Pablo, tajante palabra.
- |-
  Pedro, llaves; Pablo, andanzas.
  y un trotar por los caminos
  con cansancio en las pisadas.
- |-
  Cristo tras los dos andaba:
  a uno lo tumbó en Damasco,
  y al otro lo hirió con lágrimas.
- |-
  Roma se vistió de gracia:
  crucificada la roca,
  y la espada muerta a espada. Amén.
Poner al Hijo en cruz, abierto el seno:
- |-
  Poner al Hijo en cruz, abierto el seno,
  sacrificarlo porque yo no muera,
  prueba es, mi Dios, de amor muy verdadera,
  mostraros para mí de amor tan lleno.
- |-
  Que —a ser yo Dios, Y vos hombre terreno—
  os diera el ser de Dios que yo tuviera
  y el que tengo de hombre me pusiera
  a trueque de gozar de un Dios tan bueno.
- |-
  y aún no era vuestro amor recompensado,
  pues a mí en excelencia me habéis hecho
  Dios, y a Dios al ser de hombre habéis bajado.
- |-
  Deudor quedaré siempre por derecho
  de la deuda que en cruz por mí ha pagado
  el Hijo por dejaros satisfecho. Amén.
Por la lanza en su costado:
- |-
  Por la lanza en su costado
  brotó el río de pureza,
  para lavar la bajeza
  a que nos bajó el pecado.
- |-
  Cristo, herida y manantial,
  tu muerte nos da la vida,
  que es gracia de sangre nacida
  en tu fuente bautismal.
- |-
  Sangre y agua del abismo
  de un corazón en tormento:
  Un Jordán de sacramento
  nos baña con el bautismo.
- |-
  y mientras dura la cruz
  y en ella el Crucificado,
  bajará de su costado
  un río de gracia y de luz.
- |-
  El Padre nos da la vida,
  el Espíritu el amor,
  y Jesucristo, el Señor,
  nos da la gracia perdida. Amén.
Porque eres Hijo de Dios:
- |-
  Porque eres Hijo de Dios
  y eres hijo de María,
  porque eres Palabra eterna
  de humana carne vestida,
  porque eres el Primogénito,
  del Padre la imagen viva,
  eres Rey de cielo y tierra,
  y ante ti todo se inclina.
- |-
  Cuando el pecado
  pobló de cardos y ortigas
  esta tierra que tu amor
  había poblado de risas,
  tomaste nuestra miseria
  y tomaste nuestra vida;
  te hiciste pecado amargo,
  te hiciste dolor y espina.
- |-
  Toma en tus manos ahora
  esta creación enemiga,
  y devuélvenos al Padre,
  criaturas buenas y limpias;
  toda criatura es tu reino
  por origen y conquista,
  y por ello te adoramos,
  camino, verdad y vida. Amén.
Primicias son del sol de su Palabra:
- |-
  Primicias son del sol de su Palabra
  las luces fulgurantes de este día;
  despierte el corazón, que es Dios quien llama,
  y su presencia es la que ilumina.
- |-
  Jesús es el que viene y el que pasa
  en Pascua permanente entre los hombres,
  resuena en cada hermano su palabra,
  revive en cada vida sus amores.
- |-
  Abrid el corazón, es él quien llama
  con voces apremiantes de ternura;
  venid: habla, Señor, que tu palabra
  es vida y salvación de quien la escucha.
- |-
  El día del Señor, eterna Pascua,
  que nuestro corazón inquieto espera,
  en ágape de amor ya nos alcanza,
  solemne memorial en toda fiesta.
- |-
  Honor y gloria al Padre que nos ama,
  y al Hijo que preside esta asamblea,
  cenáculo de amor le sea el alma,
  su Espíritu por siempre sea en ella. Amén.
Profeta de soledades:
- |-
  Profeta de soledades,
  labio hiciste de tus iras
  para fustigar mentiras
  y para gritar verdades.
- |-
  Sacudiste el azote
  ante el poder soberbio;
  y ante el Sol que nacía
  se apagó tu lucero.
- |-
  Por fin, en un banquete
  y en el placer de un ebrio,
  el vino de tu sangre
  santificó el desierto.
- |-
  Profeta de soledades,
  labio hiciste de tus iras
  para fustigar mentiras
  y para gritar verdades. Amen.
Puerta de Dios en el redil humano:
- |-
  Puerta de Dios en el redil humano
  fue Cristo, el buen Pastor que al mundo vino,
  glorioso va delante del rebaño,
  guiando su marchar por buen camino.
- |-
  Madero de la cruz es su cayado,
  su voz es la verdad que a todos llama,
  su amor es el del Padre, que le ha dado
  Espíritu de Dios, que a todos ama.
- |-
  Pastores del Señor son sus ungidos,
  nuevos cristos de Dios, son enviados
  a los pueblos del mundo redimidos;
  del único Pastor siervos amados.
- |-
  La cruz de su Señor es su cayado,
  la voz de la verdad es su llamada,
  los pastos de su amor, fecundo prado,
  son vida del Señor que nos es dada. Amén.
Pues busco, debo encontrar:
- |-
  Pues busco, debo encontrar;
  pues llamo, débenme abrir;
  pues pido, me deben dar;
  pues amo, débenme amar
  aquel que me hizo vivir.
- |-
  ¿Calla? Un día me hablará.
  ¿Pasa? No lejos irá.
  ¿Me pone a prueba? Soy fiel.
  ¿Pasa? No lejos irá:
  pues tiene alas mi alma, y va
  volando detrás de él.
- |-
  Es poderoso, mas no
  podrá mi amor esquivar;
  invisible se volvió,
  mas ojos de lince yo
  tengo y le habré de mirar.
- |-
  Alma, sigue hasta el final
  en pos del Bien de los bienes,
  y consuélate en tu mal
  pensando con fe total:
  ¿Le buscas? ¡Es que lo tienes! Amén
Pues, siendo tan gran señor:
- |-
  Pues, siendo tan gran señor,
  tenéis corte en una aldea,
  ¿quién hay que claro no vea
  que estáis herido de amor?
- |-
  No es menos de que en el suelo
  hay prendas que mucho amáis,
  pues el temblor que le dais
  jamás le distes al cielo.
- |-
  Y pues por darle favor
  tenéis corte en una aldea,
  ¿quién hay que claro no vea
  que estáis herido de amor?
- |-
  Esas lágrimas tan puras
  y ese grito enternecido,
  ¿qué son sino de un subido
  amor regalo y dulzura?
- |-
  Y pues ya, de amantes flor,
  tenéis corte en una aldea,
  ¿quién hay que claro no vea
  que estáis herido de amor?
- |-
  Qué grande misterio encierra
  Belén; cantadle, criaturas:
  «Gloria a Dios en las alturas
  y paz al hombre en la tierra.» Amén.
Que doblen las campanas jubilosas:
- |-
  Que doblen las campanas jubilosas,
  y proclamen el triunfo del amor,
  y llenen nuestras almas de aleluias,
  de gozo y esperanza en el Señor.
- |-
  Los sellos de la muerte han sido rotos,
  la vida para siempre es libertad,
  ni la muerte ni el mal son para el hombre
  su destino, su última verdad.
- |-
  Derrotados la muerte y el pecado,
  es de Dios toda historia y su final;
  esperad con confianza su venida:
  no temáis, con vosotros él está.
- |-
  Volverán encrespadas tempestades
  para hundir vuestra fe y vuestra verdad,
  es más fuerte que el mal y que su embate
  el poder del Señor, que os salvará.
- |-
  Aleluias cantemos a Dios Padre,
  aleluias al Hijo salvador,
  su Espíritu corone la alegría
  que su amor derramó en el corazón. Amén.
Salve, madre de misericordia:
- |-
  Salve, madre de misericordia,
  madre de esperanza y de perdón,
  madre de Dios y madre de gracia,
  madre llena de gozo y de amor.
- |-
  Jardín floral de virtudes lleno,
  todo fragante, de rico olor,
  madre querida, con tus consuelos
  atiende, pía, nuestro dolor.
- |-
  Te creó el Padre sumo, increado;
  su Unigénito tu seno honró;
  el Espíritu Almo te fecunda,
  a los tres damos gloria y honor. Amén.
Señor, Dios eterno, alegres te cantamos:
- |-
  Señor, Dios eterno, alegres te cantamos,
  a ti nuestra alabanza,
  a ti, Padre del cielo, te aclama la creación.
- |-
  Postrados ante ti, los ángeles te adoran
  y cantan sin cesar:
- |-
  Santo, santo, santo es el Señor,
  Dios del universo;
  llenos están el cielo y la tierra de tu gloria.
- |-
  A ti, Señor, te alaba el coro celestial de los apóstoles,
  la multitud de los profetas te enaltece,
  y el ejército glorioso de los mártires te aclama.
- |-
  A ti la Iglesia santa,
  por todos los confines extendida,
  con júbilo te adora y canta tu grandeza:
- |-
  Padre, infinitamente santo,
  Hijo eterno, unigénito de Dios,
  Santo Espíritu de amor y de consuelo.
- |-
  Oh Cristo, tú eres el Rey de la gloria,
  tú el Hijo y Palabra del Padre,
  tú el Rey de toda la creación.
- |-
  Tú, para salvar al hombre,
  tomaste la condición de esclavo
  en el seno de una virgen.
- |-
  Tú destruiste la muerte
  y abriste a los creyentes las puertas de la gloria.
- |-
  Tú vives ahora,
  inmortal y glorioso, en el reino del Padre.
- |-
  Tú vendrás algún día,
  como juez universal.
- |-
  Muéstrate, pues, amigo y defensor
  de los hombres que salvaste.
- |-
  Y recíbelos por siempre allá en tu reino,
  con tus santos y elegidos.
Señor, tú que llamaste:
- |-
  Señor, tú que llamaste
  del fondo del no ser todos los seres,
  prodigios del cincel de tu palabra,
  imágenes de ti resplandecientes;
- |-
  Señor, tú que creaste
  la bella nave azul en que navegan
  los hijos de los hombres, entre espacios
  repletos de misterio y luz de estrellas;
- |-
  Señor, tú que nos diste
  la inmensa dignidad de ser tus hijos,
  no dejes que el pecado y que la muerte
  destruyan en el hombre el ser divino.
- |-
  Señor, tú que salvaste
  al hombre de caer en el vacío,
  recréanos de nuevo en tu Palabra
  y llámanos de nuevo al paraíso.
- |-
  Oh Padre, tú que enviaste
  al mundo de los hombres a tu Hijo,
  no dejes que se apague en nuestras almas
  la luz esplendorosa de tu Espíritu. Amén
Señor, ¿a quién iremos:
- |-
  Señor, ¿a quién iremos,
  si tú eres la Palabra?
  A la voz de tu aliento
  se estremeció la nada;
  la hermosura brilló
  y amaneció la gracia.
- |-
  Señor, ¿a quién iremos,
  si tu voz no nos habla?
- |-
  Nos hablas en las voces
  de tu voz semejanza:
  en los goces pequeños
  y en las angustias largas.
- |-
  Señor, ¿a quién iremos,
  si tú eres la Palabra?
- |-
  En los silencios íntimos
  donde se siente el alma,
  tu clara voz creadora
  despierta la nostalgia.
- |-
  ¿A quién iremos, Verbo,
  entre tantas palabras?
- |-
  Al golpe de la vida,
  perdemos la esperanza;
  hemos roto el camino
  y el roce de tu planta.
- |-
  ¿A dónde iremos, dinos,
  Señor, si no nos hablas?
- |-
  ¡Verbo del Padre, Verbo
  de todas las mañanas,
  de las tardes serenas,
  de las noches cansadas!
- |-
  ¿A dónde iremos, Verbo,
  si tú eres la Palabra? Amén.
Si eres, muerte, lo más mío:
- |-
  Si eres, muerte, lo más mío
  y mi vida lo más tuyo,
  si con instantes construyo
  mi tumba, hueco de frío,
  si ensaya mi desvarío
  morir mi muerte en el sueño,
  ¿me empeñaré en otro empeño?
  ¿Estaré, muerte, maduro
  para el instante inseguro
  de adueñarme de tu ensueño?
- |-
  ¿Eres victoria vencida,
  o sol sin ningún ocaso?
  ¿Con mi sombra, a cada paso,
  va tu sombra confundida?
  ¿Cuándo estallará, encendida,
  ésta mi cárcel de lodo?
  ¿Dónde, con quién, de qué modo
  llegará, muerte, el momento
  de soltar mi voz al viento,
  tú en mi nada y yo en mi todo? Amén.
Si me desechas tú, Padre amoroso:
- |-
  Si me desechas tú, Padre amoroso,
  ¿a quién acudiré que me reciba?
  Tú al pecador dijiste generoso
  que no quieres su muerte, ¡oh Dios piadoso!,
  sino que llore y se convierta y viva.
- |-
  Cumple en mí la palabra que me has dado
  y escucha el ansia de mi afán profundo,
  no te acuerdes, Señor, de mi pecado;
  piensa tan sólo que en la cruz clavado
  eres, Dios mío, el Redentor del mundo. Amén.
Tanto al tirano le place:
- |-
  Tanto al tirano le place
  hacer de su orgullo ley,
  que por deshacer a un Rey
  un millar de reyes hace.
- |-
  Por matar a un enemigo
  siembra de sangre Belén,
  y en Belén, casa del trigo,
  no muere un Rey, nacen cien.
- |-
  Y así su cólera loca
  no puede implantar su ley,
  pues quiere matar a un Rey
  y corona a cuantos toca.
- |-
  La furia del mal así
  no puede vencer jamás,
  pues, cuando me hiere a mí,
  estás tú, Señor, detrás.
- |-
  Estás para convertir
  en corona cada muerte,
  para decirnos que el fuerte
  es el que sabe morir. Amén.
Testigos de amor:
- |-
  Testigos de amor
  de Cristo Señor,
  mártires santos.
- |-
  Rosales en flor
  de Cristo el olor,
  mártires santos.
- |-
  Palabras en luz
  de Cristo Jesús,
  mártires santos.
- |-
  Corona inmortal
  del Cristo total,
  mártires santos. Amén.
Tú eres toda hermosa:
- |-
  Tú eres toda hermosa,
  ¡oh Madre del Señor!;
  tú eres de Dios gloria,
  la obra de su amor.
- |-
  ¡Oh rosa sin espinas,
  oh vaso de elección!
  de ti nació la vida,
  por ti nos vino Dios.
- |-
  Sellada fuente pura
  de gracia y de piedad,
  bendita cual ninguna,
  sin culpa original.
- |-
  Infunde en nuestro pecho
  la fuerza de tu amor,
  feliz Madre del Verbo,
  custodia del Señor. Amén.
Tú, Señor, que asumiste la existencia:
- |-
  Tú, Señor, que asumiste la existencia,
  la lucha y el dolor que el hombre vive,
  no dejes sin la luz de tu presencia
  la noche de la muerte que lo aflige.
- |-
  Te rebajaste, Cristo, hasta la muerte,
  y una muerte de cruz, por amor nuestro;
  así te exaltó el Padre, al acogerte,
  sobre todo poder de tierra y cielo.
- |-
  Para ascender después gloriosamente,
  bajaste sepultado a los abismos;
  fue el amor del Señor omnipotente
  más fuerte que la muerte y su sino.
- |-
  Primicia de los muertos, tu victoria
  es la fe y la esperanza del creyente,
  el secreto final de nuestra historia,
  abierta a nueva vida para siempre.
- |-
  Cuando la noche llegue y sea el día
  de pasar de este mundo a nuestro Padre,
  concédenos la paz y la alegría
  de un encuentro feliz que nunca acabe. Amén.
Uno es Amor, y tres son los amados:
- |-
  Uno es Amor, y tres son los amados,
  bajo el techo del alma trasladados,
  que le son huertos, montes y collados;
  y es sueño lo demás.
- |-
  Una es la Luz, y tres los resplandores,
  una la Llama viva en tres ardores,
  que consumen el alma en sus fulgores;
  y es sueño lo demás.
- |-
  Tres los hermosos son,
  y una Hermosura sola,
  en que el alma abreva más dulzura
  cuanto más se remonta en la espesura;
  y es sueño lo demás. Amén.
Verbo que del cielo bajas:
- |-
  Verbo que del cielo bajas,
  Luz del Padre que, naciendo,
  socorres al mundo mísero
  con el correr de los tiempos:
- |-
  Ilumina el corazón,
  quema de amor nuestro pecho,
  y borren tus enseñanzas
  tantos deslices y yerros,
- |-
  para que, cuando regreses
  como juez de nuestros hechos,
  castigues el mal oculto
  y corones a los buenos.
- |-
  Que la maldad no nos lance
  por nuestras culpas al fuego,
  mas felices moradores
  nos veamos en tu reino.
- |-
  A Dios Padre y a su Hijo
  gloria y honor tributemos,
  y al Espíritu Paráclito,
  por los siglos sempiternos. Amén.
Vestida de sol y pétalos:
- |-
  Vestida de sol y pétalos,
  ha nacido nuestra paz:
  ¡por ella es azul el mar
  y por ella es limpio el fuego!
- |-
  Cuando con cetro de sombra
  reina la noche en el mundo
  y cintilante y oscuro
  el silencio voz se torna,
  como rosa misteriosa
  del más escondido huerto,
  vestida de sol y pétalos,
  ha nacido nuestra paz:
  ¡por ella es azul el mar
  y por ella es limpio el fuego!
- |-
  Lírica como una estrella,
  humilde como una esclava,
  milagrosa como el alba,
  emperatriz de las penas
  y de los júbilos reina,
  corazón del Evangelio,
  vestida de sol y pétalos,
  ha nacido nuestra paz:
  ¡por ella es azul el mar
  Y por ella es limpio el fuego! Amén.
Vinagre y hiel para sus labios pide:
- |-
  Vinagre y hiel para sus labios pide,
  y perdón para el pueblo que le hiere,
  que, como sólo porque viva muere,
  con su inmensa piedad sus culpas mide.
- |-
  Señor, que al que le deja no despide,
  que al siervo vil que le aborrece quiere,
  que, porque su traidor no desespere,
  a llamarle su amigo se comide.
- |-
  Ya no deja ignorancia al pueblo hebreo
  de que es Hijo de Dios, si agonizando
  hace de amor por su dureza empleo.
- |-
  Quien por sus enemigos expirado
  pide perdón, mejor, en tal deseo,
  mostró ser Dios, que el sol y el mar bramando. Amén.
Vivo sin vivir en mí:
- |-
  Vivo sin vivir en mí,
  y tan alta vida espero,
  que muero porque no muero.
- |-
  Esta divina unión
  del amor con que yo vivo
  hace a Dios ser mi cautivo
  y libre mi corazón;
  mas causa en mí tal pasión
  ver a Dios mi prisionero,
  que muero porque no muero.
- |-
  ¡Ay! ¡Qué larga es esta vida!
  ¡Qué duros estos destierros,
  esta cárcel, estos hierros
  en que el alma está metida!
  Sólo esperar la salida
  me causa dolor tan fiero,
  que muero porque no muero.
- |-
  ¡Ay! ¡Qué vida tan amarga
  do no se goza el Señor!
  y si es dulce el amor,
  no lo es la esperanza larga;
  quíteme Dios esta carga
  más pesada que el acero,
  que muero porque no muero.
- |-
  Sólo con la confianza
  vivo de que he de morir,
  porque, muriendo, el vivir
  me asegura mi esperanza;
  muerte do el vivir se alcanza,
  no te tardes que te espero,
  que muero porque no muero.
- |-
  Vivo sin vivir en mí,
  y tan alta vida espero,
  que muero porque no muero. Amén.
Voz más rica que un concierto:
- |-
  Voz más rica que un concierto
  y que sube hasta el Jordán
  es la voz, a campo abierto,
  del que clama en el desierto,
  y que lo llamaron Juan.
- |-
  Vio cómo el cielo se abría
  sobre el Cordero de Dios,
  y su voz le anunciaría.
  ¡Oh radiante profecía
  que por siempre unió a los dos!
- |-
  Más aún, en su presencia,
  con humilde sumisión,
  pide el que es Dios por esencia
  bautismo de penitencia
  para empezar su misión.
- |-
  Juan bautiza al Deseado,
  ¡doble abismo de humildad!:
  ante el Hijo muy amado,
  por el Padre proclamado,
  se rindió su caridad.
- |-
  ¡Oh sin par doxología!:
  voz del Padre en el Jordán,
  el Hijo que la acogía
  y la Paloma que ardía
  sobre Jesús y san Juan. Amén.
¡Espada de dos filos:
- |-
  ¡Espada de dos filos
  es, Señor, tu palabra!
  Penetra como fuego
  y divide la entraña.
- |-
  ¡Nada como tu voz,
  es terrible tu espada!
  ¡Nada como tu aliento,
  es dulce tu palabra!
- |-
  Tenemos que vivir
  encendida la lámpara,
  que para virgen necia
  no es posible la entrada.
  No basta con gritar
  sólo palabras vanas,
  ni tocar a la puerta
  cuando ya está cerrada.
- |-
  Espada de dos filos
  que me cercena el alma,
  que hiere a sangre y fuego
  esta carne mimada,
  que mata los ardores
  para encender la gracia.
- |-
  Vivir de tus incendios,
  luchar por tus batallas,
  dejar por los caminos
  rumor de tus sandalias.
  ¡Espada de dos filos
  es, Señor, tu palabra! Amén.
¡Oh Redentor, oh Cristo:
- |-
  ¡Oh Redentor, oh Cristo,
  Señor del universo,
  víctima y sacerdote,
  sacerdote y cordero!
- |-
  Para pagar la deuda
  que nos cerraba el cielo,
  tomaste entre tus manos
  la hostia de tu cuerpo
  y ofreciste tu sangre
  en el cáliz del pecho:
  altar blando, tu carne;
  altar duro, un madero.
- |-
  ¡Oh Cristo Sacerdote,
  hostia a la vez y templo!
  Nunca estuvo la vida
  de la muerte tan dentro,
  nunca abrió tan terribles
  el amor sus veneros.
- |-
  El pecado del hombre,
  tan huérfano del cielo,
  se hizo perdón de sangre
  y gracia de tu cuerpo. Amén.
¡Oh, bienvenido seas:
- |-
  ¡Oh, bienvenido seas,
  Paráclito eternal, que con tus dones
  nos nutres y recreas!
  Lluevan tus bendiciones
  sobre nuestros contritos corazones.
- |-
  Si alguna vez caemos,
  tú a levantarnos ven, y tú nos guía
  y alumbra si no vemos,
  y, si el pecho se enfría,
  ven y tu calor santo en él envía.
- |-
  Ven y nos fortalece,
  si alguna vez nuestro valor flaquea,
  y tu ley enderece
  el pié, si se ladea,
  si tímido se para o titubea.
- |-
  El fuego centellante,
  que sobre los apóstoles ardía,
  al pecho de diamante,
  al alma seca y fría,
  ablande y dé calor en este día.
- |-
  Y unidos y enlazados
  en tus lazos, Amor omnipotente,
  de pueblo apartados
  haz una sola gente,
  un corazón, un alma solamente. Amén.
¡Qué hermosos son los pies:
- |-
  ¡Qué hermosos son los pies
  del que anuncia la paz a sus hermanos!
  ¡Y qué hermosas las manos
  maduras en el surco y en la mies!
- |-
  Grita lleno de gozo,
  pregonero, que traes noticias buenas:
  se rompen las cadenas,
  y el sol de Cristo brilla esplendoroso.
- |-
  Grita sin miedo, grita,
  y denuncia a mi pueblo sus pecados;
  vivimos engañados,
  pues la belleza humana se marchita.
- |-
  Toda yerba es fugaz,
  la flor del campo pierde sus colores;
  levanta sin temores,
  pregonero, tu voz dulce y tenaz.
- |-
  Si dejas los pedazos
  de tu alma enamorada en el sendero,
  ¡qué dulces, mensajero,
  qué hermosos, que divinos son tus pasos! Amén.
¡Triste de mí que he cruzado:
- |-
  ¡Triste de mí que he cruzado
  de la vida los senderos
  por largo tiempo sin veros,
  ojos del Crucificado!
  Mas, de vuestra luz privado,
  me fue contraria la suerte...
  ¡Ojos muertos del Dios fuerte,
  olvidad viejos agravios
  y haced que os besen mis labios
  en la hora de mi muerte!
- |-
  ¡Ojos de Cristo, miradme!
  ¡Ojos muertos, conmovedme!
  ¡Ojos tiernos, atraedme!
  ¡Ojos llorosos, bañadme!
  ¡Ojos sin luz, alumbradme!
  ¡Ojos piadosos, seguidme
  por donde mi planta yerra,
  y por el haz de la tierra
  hacia el cielo conducidme! Amén.
«¿Quién como Dios?», fue el grito de victoria:
- |-
  «¿Quién como Dios?», fue el grito de victoria
  que el arcángel lanzó contra Luzbel.
  ¡Príncipe digno de eternal memoria!
  Desde aquella lejana prehistoria,
  lo repite su nombre: Mi-ca-el.
- |-
  No la espada, la cándida azucena
  lleva en su mano el ángel san Gabriel,
  cuando rinde a la virgen nazarena
  el mensaje de que ella, gracia plena,
  será Madre del Hijo: el Emmanuel.
- |-
  Medicina de Dios para Tobías,
  el peregrino arcángel Rafael
  sabe ser el mejor de nuestros guías,
  cura nuestras dolencias y agonías
  con la gracia de Dios y con la hiel.
- |-
  Arcangélico grupo septenario,
  que asiste ante el Dios vivo de Israel,
  ¡quién supiera cantar a ese ternario
  que se nos dio por guía y emisario
  en los designios que designa él!
- |-
  Ante el trono de Dios y del Cordero,
  caudillos de la hueste celestial,
  alabad al Dios trino y verdadero
  y mirad por el hombre, pasajero
  de un mundo que está enfermo y es mortal. Amén.
«¿Qué has visto de camino:
- |-
  «¿Qué has visto de camino,
  María, en la mañana?»
  «A mi Señor glorioso,
  la tumba abandonada,
- |-
  los ángeles testigos,
  sudarios y mortaja.
  ¡Resucitó de veras
  mi amor y mi esperanza!
- |-
  Venid a Galilea,
  allí el Señor aguarda;
  allí veréis los suyos
  la gloria de la Pascua.»
- |-
  Primicia de los muertos,
  sabemos por tu gracia
  que estás resucitado;
  la muerte en ti no manda.
- |-
  Rey vencedor, apiádate
  de la miseria humana
  y da a tus fieles parte
  en tu victoria santa. Amén.
¿Cuándo, Señor, te llevarás cautiva:
- |-
  ¿Cuándo, Señor, te llevarás cautiva
  la historia de pecado que el mundo concibió?;
  ¿cuándo, Señor, serán cielos y tierra
  el cielo de tu amor?
- |-
  ¿Cuándo, también, emprenderá su vuelo
  la débil esperanza de nuestro corazón?;
  ¿cuándo, Señor, florecerá en el barro
  tu sangre y tu pasión?
- |-
  ¿Cuándo, Señor, los gritos de los hombres
  serán clamor eterno de júbilo y de paz?;
  ¿cuándo, Señor, las penas y tristezas
  tu gloria alumbrarán?
- |-
  Y ¿cuándo, finalmente, Padre amado,
  seremos en el Hijo tus hijos de adopción?;
  ¿cuándo, Señor, será ya todo en todos
  tu Espíritu de amor? Amén.
¿Morirás, muerte, conmigo:
- |-
  ¿Morirás, muerte, conmigo
  cuando el encuentro concluyas?
  ¿Como un río de aleluias
  me encontraré en ti al amigo
  o al desamor enemigo?
  ¿Me encontraré la hermosura,
  o la nada hueca y dura?
  ¿Me encontraré con la vida,
  o contigo, siempre herida,
  siempre muerte, siempre oscura?
- |-
  Cuando llegues a mi puerta,
  quiero ir a ti, como al mar
  entra el río hecho cantar,
  toda mi sed a ti abierta,
  por no fatigar, incierta,
  mi impaciencia enamorada.
  Ni una lágrima salada
  de mis pupilas asome:
  ¡y el silencio baje y tome
  mi herida voz deslumbrada! Amén.
¿Por qué bajaste a nosotros?:
- |-
  ¿Por qué bajaste a nosotros?
  ¿Por qué nos salvas, oh Cristo?
  Desde el antiguo pecado,
  desde el antiguo castigo,
  llevamos la vida triste,
  tenemos roto el camino.
  Desde la serpiente artera,
  desde el orgullo maldito,
  la frente sólo sudores
  y el campo da sólo espinos.
- |-
  ¿Por qué bajaste a nosotros?
  ¿Por qué nos salvas, oh Cristo?
  En este mundo de vida
  la muerte lanza su grito.
  El Padre escuchó el lamento
  desgarrador e infinito,
  y en su locura de amor,
  nos envió a su propio Hijo.
- |-
  Tomó nuestra pobre carne,
  se convirtió en nuestro amigo,
  para matar en su cuerpo
  la grandeza del delito.
- |-
  ¿Por qué bajaste a nosotros?
  ¿Por qué nos salvas, oh Cristo,
  si tú nos lo diste todo
  y nosotros lo perdimos?
  Sabemos que por tu sangre
  compraste un fruto perdido:
  hombres de todas las razas
  y de todos los caminos,
  e hiciste de ellos un reino
  de sacerdotes, oh Cristo.
- |-
  Tómanos entre tus brazos,
  que entre llantos y gemidos
  tus creaturas esperamos
  volver a tu paraíso.
  ¡Entréganos a tu Padre,
  santo y eterno Principio! Amén.
¿Quién es este que viene:
- |-
  ¿Quién es este que viene,
  recién atardecido,
  cubierto por su sangre
  como varón que pisa los racimos?
- |-
  ¿Quién es este que vuelve,
  glorioso y malherido,
  y, a precio de su muerte,
  compra la paz y libra a los cautivos?
- |-
  Se durmió con los muertos,
  y reina entre los vivos;
  no le venció la fosa,
  porque el Señor sostuvo a su elegido.
- |-
  Anunciad a los pueblos
  qué habéis visto y oído;
  aclamad al que viene
  como la paz, bajo un clamor de olivos. Amén.
¿Quién es este viajero:
- |-
  ¿Quién es este viajero
  al que el Señor acecha en el camino
  y con su luz derriba por el suelo?
- |-
  ¿Quién es este violento
  al que el Señor elige de entre todos
  para mostrar la fuerza de su verbo?
- |-
  Contra Jesús, se dirigía a Damasco,
  y después, por Jesús,
  recorrerá la tierra, predicándolo.
  Cumplir con la ley era su orgullo;
  la gracia del Espíritu después,
  timbre de gloria, único.
- |-
  Para él sólo tendrá significado
  conocer a Jesús
  y a este Señor Jesús, ¡crucificado!
  Compartirá las pruebas del Señor
  y así compartirá también la gloria
  de la resurrección. Amén.
¿Quién es éste que viene:
- |-
  ¿Quién es éste que viene,
  recién atardecido,
  cubierto por su sangre
  como varón que pisa los racimos?
- |-
  ¿Quién es este que vuelve,
  glorioso y malherido,
  y, a precio de su muerte,
  compra la paz y libra a los cautivos?
- |-
  Se durmió con los muertos,
  y reina entre los vivos;
  no le venció la fosa,
  porque el Señor sostuvo a su elegido.
- |-
  Anunciad a los pueblos
  qué habéis visto y oído;
  aclamad al que viene
  como la paz, bajo un clamor de olivos. Amén.
¿Quién es éste viajero:
- |-
  ¿Quién es éste viajero
  al que el Señor acecha en el camino
  y con su luz derriba por el suelo?
- |-
  ¿Quién es éste violento
  al que el Señor elige de entre todos
  para mostrar la fuerza de su verbo?
- |-
  Contra Jesús, se dirigía a Damasco,
  y después, por Jesús,
  recorrerá la tierra, predicándolo.
  Cumplir con la ley era su orgullo;
  la gracia del Espíritu después,
  timbre de gloria, único.
- |-
  Para él sólo tendrá significado
  conocer a Jesús
  y a este Señor Jesús, ¡crucificado!
  Compartirá las pruebas del Señor
  y así compartirá también la gloria
  de la resurrección. Amén.
¿Qué tengo yo que mi amistad procuras?:
- |-
  ¿Qué tengo yo que mi amistad procuras?
  ¿Qué interés se te sigue, Jesús mío,
  que a mi puerta, cubierto de rocío,
  pasas las noches del invierno oscuras?
- |-
  ¡Oh, cuánto fueron mis entrañas duras,
  pues no te abrí! ¡Qué extraño desvarío
  si de mi ingratitud el hielo frío
  secó las llagas de tus plantas puras!
- |-
  ¡Cuántas veces el ángel me decía:
  «Alma, asómate ahora a la ventana,
  verás con cuánto amor llamar porfía!»
- |-
  y ¡cuántas, hermosura soberana:
  «Mañana le abriremos», respondía,
  para lo mismo responder mañana! Amén.
¿Y dejas, Pastor santo:
- |-
  ¿Y dejas, Pastor santo,
  tu grey en este valle hondo, oscuro,
  en soledad y llanto;
  y tú, rompiendo el puro
  aire, te vas al inmortal seguro?
- |-
  Los antes bienhadados
  y los ahora tristes y afligidos,
  a tus pechos criados,
  de ti desposeídos,
  ¿a dónde volverán ya sus sentidos?
- |-
  ¿Qué mirarán los ojos
  que vieron de tu rostro la hermosura
  que no les sea enojos?
  Quien gustó tu dulzura
  ¿qué no tendrá por llanto y amargura?
- |-
  Y a este mar turbado
  ¿quién le pondrá ya freno? ¿Quién concierto
  al fiero viento, airado,
  Estando tú encubierto?
  ¿Qué norte guiará la nave al puerto?
- |-
  Ay, nube envidiosa
  aun de este breve gozo, ¿qué te quejas?
  ¿Dónde vas presurosa?
  ¡Cuán rica tú te alejas!
  ¡Cuán pobres y cuán ciegos, ay, nos dejas! Amén.
Ángeles de la mañana:
- |-
  Ángeles de la mañana,
  ángeles del mediodía,
  de la tarde y de la noche
  son tu presencia divina.
- |-
  Llenos de gozo, Señor,
  te damos nuestra alegría,
  peregrinos de la tierra,
  huéspedes ya de tu vida.
- |-
  ¡Que nunca nos abandone,
  en el sueño o la vigilia,
  el ángel que nos pusiste
  como compañero y guía! Amén.
No rechazaremos:
- 'No rechazaremos

  la piedra angular.

  Sobre el cimiento de tu cuerpo

  levantaremos la ciudad.'
- 'Una ciudad para todos.

  Un gran techo común.

  Una mesa redonda como el mundo.

  Un pan de multitud.

  Un lenguaje de corazón abierto.

  Una esperanza: "Ven, Señor Jesús".'
- 'Suben las tribus del mundo,

  suben a la ciudad.

  Los que hablaban en lenguas diferentes'
- 'proclaman la unidad.

  Nadie grita: "¿Quién eres?", O: "¿De dónde?"

  Todos se llaman hijos de la paz.'
- '¡Jerusalén, ciudad dichosa!

  ¡Jerusalén, visión de paz!

  Sobre los cielos te levantas,

  alta ciudad de piedras vivas,

  y ángeles puros te coronan

  como una joven desposada.

  ¡Jerusalén, ciudad dichosa!'
- '[Desciendes virgen de los cielos

  y entras al tálamo de bodas

  para ser cuerpo del Esposo;

  tus azoteas y tus muros

  son construcción de oro purísimo.'
- 'Relampaguea jubilosa

  la pedrería de tus puertas;

  abres tus ámbitos sagrados

  y, por la palma de sus méritos,

  penetra en ellos el que sufre

  pasión por Cristo en este mundo.'
- '¡Oh hermosas piedras bien labradas,

  prueba tras prueba, golpe a golpe!

  ¡Como se ajustan en sus puestos

  bajo la mano del artífice,

  y permanecen duraderas

  en los sagrados edificios!]'
- 'Gloria y honor al Dios altísimo,

  al Padre, al Hijo y al Paráclito.

  Suyo el poder y la alabanza;

  suyo el reinado por los siglos. Amén.'
María, pureza en vuelo:
- 'María, pureza en vuelo,

  Virgen de vírgenes, danos

  la gracia de ser humanos

  sin olvidarnos del cielo.'
- 'Enséñanos a vivir;

  ayúdenos tu oración;

  danos en la tentación

  la gracia de resistir.'
- 'Honor a la Trinidad

  por esta limpia victoria.

  Y gloria por esta gloria

  que alegra la cristiandad. Amén.'
Rosa entre rosas:
- 'Rosa entre rosas

  flor de las flores,

  Virgen de vírgenes

  y Amor de amores.'
- 'Rosa en que el Señor

  puso su querer,

  flor la mas hermosa

  que se vio nacer,

  Virgen que hace dulce

  nuestro padecer,

  Amor que hace nuestros

  sus santos amores.'
- 'Rosa entre rosas

  flor de las flores,

  Virgen de vírgenes

  y Amor de amores.'
- 'Gloria a Dios Padre,

  gloria a Dios Hijo,

  igual por siempre,'
- 'gloria al Espíritu. Amén.

  II'
- 'Ruega por nosotros,

  amorosa Madre,

  para que tu Hijo,

  no nos desampare.'
- 'De tus ojos penden

  las felicidades;

  míranos, Señora,

  no nos desampares.'
- 'Bien veo, Señora,

  Madre de mi alma,

  que por mis pecados

  lagrimas derramas.'
- 'Gloria a Dios Padre,

  gloria a Dios Hijo,

  igual por siempre,

  gloria al Espíritu. Amén'
¡Guardadnos en la fe y en la unidad:
- '¡Guardadnos en la fe y en la unidad,

  vosotros, que ya estáis desde el principio

  en comunión con Cristo y con el Padre!'
- '¿A quién acudiremos

  cuando la fe va herida

  sino a vosotros, testigos vigilantes,'
- 'que anunciáis con palabra poderosa

  lo que era en el principio,

  lo que vieron de cerca vuestros ojos

  y lo que vuestras manos

  tocaron y palparon del Verbo de la vida?'
- '¡Guardadnos en la fe y en la unidad,

  vosotros, que ya estáis desde el principio

  en comunión con Cristo y con el Padre!'
- '¿En quién descansaremos

  la duda y la esperanza

  sino en vosotros, cimientos de la Iglesia,

  que habéis visto al Señor resucitado,

  y oísteis al Espíritu

  revelar por el fuego y la palabra

  el misterio de Cristo

  que estaba oculto en Dios desde los siglos?'
- '¡Guardadnos en la fe y en la unidad,

  vosotros, que ya estáis desde el principio

  en comunión con Cristo y con el Padre!'
- 'Voceros de Dios,

  heraldos de amor,

  apóstoles santos.'
- 'Locura de cruz,

  de Dios es la luz,

  apóstoles santos.'
- 'Mensaje del Rey,

  de amor es la ley,

  apóstoles santos.'
- 'De Cristo solaz

  sois cristos de paz,

  apóstoles santos.'
- 'Sois piedra frontal

  del reino final

  apóstoles santos.'
Pléyade santa y noble de mártires insignes:
- 'Pléyade santa y noble de mártires insignes,

  testigos inmortales del Cristo victimado;

  dichosos, pues sufristeis la cruz de vuestro Amado

  Señor, que a su dolor vuestro dolor ha unido.'
- 'Bebisteis por su amor el cáliz de la sangre,

  dichosos cireneos, camino del Calvario

  seguisteis, no dejasteis a Jesús solitario,

  llevasteis vuestra cruz junto a su cruz unida.'
- 'Rebosa ya el rosal de rosas escarlatas

  y la luz del sol tiñe de rojo el alto cielo,

  la muerte estupefacta contempla vuestro vuelo,

  enjambre de profetas y justos perseguidos.'
- 'Vuestro valor intrépido deshaga cobardías

  de cuantos en la vida persigue la injusticia;

  siguiendo vuestras huellas, hagamos la milicia,

  sirviendo con amor la paz de Jesucristo. Amén.'
Vosotros sois la luz del mundo:
- 'Vosotros sois la luz del mundo

  y ardiente sal de la tierra,

  ciudad esbelta en el monte,

  fermento en la masa nueva.'
- 'Vosotros sois los sarmientos,

  y yo la Vid verdadera:

  Si el Padre poda las ramas,

  más fruto llevan las cepas.'
- 'Vosotros sois la abundancia

  del Reino que ya está cerca;

  los doce mil señalados

  que no caerán en la siega.'
- '¡Dichosos porque sois limpios

  y ricos en la pobreza,

  y es vuestro el reino que sólo

  se gana con la violencia! Amén.'
Desde que mi voluntad:
- 'Desde que mi voluntad

  está a la vuestra rendida,

  conozco yo la medida

  de la mejor libertad.

  Venid, Señor, y tomad

  las riendas de mi albedrío;

  de vuestra mano me fío

  y a vuestra mano me entrego,

  que es poco lo que me niego

  si yo soy vuestro y vos mío.'
- 'A fuerza de amor humano

  me abraso en amor divino.

  La santidad es camino

  que va de mí hacia mi hermano.

  Me di sin tender la mano

  para cobrar el favor;

  me di en salud y en dolor

  a todos, y de tal suerte

  que me ha encontrado la muerte

  sin nada más que el amor.'
La mujer fuerte:
- 'La mujer fuerte

  puso en Dios su esperanza:

  Dios la sostiene.'
- 'Hizo del templo su casa;

  mantuvo ardiendo su lámpara.'
- 'En la mesa de los hijos,

  hizo a los pobres un sitio.'
- 'Guardó memoria a sus muertos;

  gastó en los vivos su tiempo.'
- 'Sirvió, consoló, a sus muertos;

  guardó para sí sus penas.'
- 'Vistió el dolor de plegaria;

  la soledad, de esperanza.'
- 'Y Dios la cubrió de gloria

  como de un velo de bodas.'
- 'La mujer fuerte

  puso en Dios su esperanza:

  Dios la sostiene. Amén'
A ti, Jesús, te alaban las naciones:
- 'A ti, Jesús, te alaban las naciones;

  que a tu reino nos llevas,

  y en ti cobra esperanza nuestra súplica,

  único mediador de cielo y tierra.'
- 'Verbo de Dios, por quien todo fue hecho,

  Nacido de María;

  Tú, la hostia pura, santa, inmaculada,

  que de ofrecerse a Dios sola fue digna.'
- 'Ungido por el Padre, Jesucristo,

  eterno sacerdote,

  reconcilias al cielo con la tierra,

  los hombres y los ángeles te adoren.'
- 'Dios de Dios verdadero, igual al Padre,

  por nosotros te ofreces

  en sacrificio, y mueres por nosotros,

  trocando en vida eterna nuestra muerte.'
- 'Clavado en cruz, nos miras, te miramos,

  crece el amor, la entrega

  Al Padre, en el Espíritu, contigo,

  eleva nuestro canto y nuestra ofrenda. Amén.'
Josemaría fue maestro, rector, padre nutricio:
- 'Josemaría fue maestro, rector, padre nutricio,

  guía, docto pastor y sacerdote,

  a quien tú, oh Cristo, infundiste

  una íntima visión de luz.'
- 'Que serían los hombres y las mujeres de Dios

  quienes te ayudarían a elevar la cruz

  en la cumbre del mundo; y así Cristo triunfador

  atraería a Sí todas las cosas.'
- 'Llamados desde la eternidad,

  antes ya de la constitución del mundo,

  haznos otros Cristos, sal, fermento, luz

  en las encrucijadas del mundo.'
- 'Sal que preserve de la corrupción,

  luz que ilumina los corazones de los hombres,

  vivo fermento

  que lleve el Pan vivo a todos los trabajos.'
- 'Sólo a ti, Dios eterno,

  Padre, Hijo con el Espíritu Santo,

  el sumo homenaje de gloria y alabanza,

  ahora y por siempre. Amén'
¡Dancemos! ¡cantemos!:
- '¡Dancemos! ¡cantemos!

  al Dador de la Vida,

  al Dueño de cuanto nos rodea,

  porque nos ha entregado sus flores y cantos.'
- '¡Dancemos! ¡cantemos!

  Por ti, Juan Diego, el más pequeño,

  olmos el Canto Florido;

  por ti vuelan en nuestra tierra

  las mariposas de jade

  y el reluciente colibrí abre sus alas.'
- '¡Dancemos! ¡cantemos!

  porque tú nos recuerdas que vivimos'
- 'en la tierra de nuestro sustento,

  en la tierra del maíz,

  de nuestra carne.'
- 'Suene para el Verdadero Dios por quien se vive

  el atabal de la alegría,

  el huehuetl de nuestro gozo.'
- '¡Dancemos! ¡cantemos!

  al Dios Antiguo y Nuevo,

  porque tú recogiste fragantes flores

  ahí donde perdura el Rocío

  y se abre el Brillante arcoíris

  que cubrió la montaña.'
- '¡Dancemos! ¡cantemos!

  vivimos agradecidos,

  ya no estamos tristes,

  no fuimos traicionados, Juan Diego.

  El Dios de nuestros padres y abuelos

  nos entrega plena su Palabra.'
- '¡Dancemos! ¡cantemos!

  Por ti se quedó entre nosotros, Juan Diego.

  Nuestra Madre, Nuestra Muchachita,

  tu Hija Menor, Nuestra Señora,

  Nuestra Niña,

  Tonantzin—Guadalupe.

  Amén.'
