# Himnos latinos de la Liturgia de las Horas (Apéndice IV del libro), para rezarlos recitados.
# Texto: Te decet hymnus (A. Lentini, 1984), del corpus «latin-ecclesiastic-accents» (proyecto Gregorio, CC0);
# donde el libro trae otro texto, el del libro. Latín con i, æ y œ.
# Cada renglón: «verso latino = traducción literal del verso». Cada estrofa, un elemento de la lista.
# amen: el himno termina con «Amen.» (traducción: «Amén.»).
# variantes: estrofas que cambian según el caso (número de estrofa, desde 1): papa, obispo, presbitero (pastores);
#   mujer, mujeres (mártires, religiosas); una, varios (difuntos). Sin variante, el texto principal.
# Cuándo va cada himno: latinos_cuando.yaml.

himnos:
  conditor-alme-siderum:
    titulo: Cónditor alme síderum
    amen: true
    estrofas:
    - |-
      Cónditor alme síderum, = Creador bondadoso de los astros,
      ætérna lux credéntium, = luz eterna de los creyentes,
      Christe, redémptor ómnium, = Cristo, redentor de todos,
      exáudi preces súpplicum. = escucha las súplicas de los que te imploran.
    - |-
      Qui cóndolens intéritu = Tú que, compadecido de que por la ruina
      mortis períre sǽculum, = de la muerte pereciera el mundo,
      salvásti mundum lánguidum, = salvaste al mundo enfermo,
      donans reis remédium, = dando a los culpables el remedio,
    - |-
      Vergénte mundi véspere, = al declinar la tarde del mundo,
      uti sponsus de thálamo, = como el esposo de la cámara nupcial,
      egréssus honestíssima = saliste del honestísimo
      Vírginis matris cláusula. = claustro de la Virgen madre.
    - |-
      Cuius forti poténtiæ = Ante cuyo fuerte poder
      genu curvántur ómnia; = se doblan todas las rodillas;
      cæléstia, terréstria = las cosas del cielo y de la tierra
      nutu faténtur súbdita. = con una señal se confiesan sometidas.
    - |-
      Te, Sancte, fide quǽsumus, = A ti, Santo, con fe te pedimos,
      ventúre iudex sǽculi, = juez que has de venir al fin del mundo:
      consérva nos in témpore = guárdanos en el tiempo [presente]
      hostis a telo pérfidi. = del dardo del enemigo pérfido.
    - |-
      Sit, Christe, rex piíssime, = Sea, Cristo, rey piadosísimo,
      tibi Patríque glória = a ti y al Padre la gloria
      cum Spíritu Paráclito, = con el Espíritu Paráclito
      in sempitérna sǽcula. = por los siglos sempiternos.
  te-lucis-ante-terminum:
    titulo: Te lucis ante términum
    amen: true
    estrofas:
    - |-
      Te lucis ante términum, = A ti, antes del término de la luz,
      rerum creátor, póscimus, = creador de las cosas, te pedimos
      ut sólita cleméntia = que, con tu acostumbrada clemencia,
      sis præsul et custódia. = seas protector y custodia.
    - |-
      Te corda nostra sómnient, = Que nuestros corazones sueñen contigo,
      te per sopórem séntiant, = que te sientan durante el sueño,
      tuámque semper glóriam = y que siempre tu gloria
      vicína luce cóncinant. = canten al acercarse la luz.
    - |-
      Vitam salúbrem tríbue, = Concede una vida saludable,
      nostrum calórem réfice = reanima nuestro ardor,
      tætram noctis calíginem = [y que] la tenebrosa oscuridad de la noche
      tua collústret cláritas. = la ilumine tu claridad.
    - |-
      Præsta, Pater omnípotens, = Concédelo, Padre omnipotente,
      per Iesum Christum Dóminum, = por Jesucristo, el Señor,
      qui tecum in perpétuum = que contigo por siempre
      regnat cum Sancto Spíritu. = reina con el Espíritu Santo.
  verbum-supernum-prodiens:
    titulo: Verbum supérnum pródiens
    amen: true
    estrofas:
    - |-
      Verbum supérnum pródiens, = Verbo celestial que procedes
      e Patris ætérni sinu, = del seno del Padre eterno,
      qui natus orbi súbvenis = que, nacido, socorres al mundo
      cursu declívi témporis: = en el curso declinante del tiempo:
    - |-
      Illúmina nunc péctora = ilumina ahora los corazones
      tuóque amóre cóncrema; = y abrásalos con tu amor,
      ut cor cadúca déserens = para que el corazón, dejando lo caduco,
      cæli volúptas ímpleat. = se llene del gozo del cielo.
    - |-
      Ut, cum tribúnal Iúdicis = Para que, cuando el tribunal del Juez
      damnábit igni nóxios, = condene al fuego a los culpables
      et vox amíca débitum = y la voz amiga, como es debido,
      vocábit ad cælum pios; = llame al cielo a los piadosos,
    - |-
      Non esca flammárum nigros = no seamos, como pasto de las llamas,
      volvámur inter túrbines, = arrastrados entre negros torbellinos,
      vultu Dei sed cómpotes = sino que, admitidos a [ver] el rostro de Dios,
      cæli fruámur gáudiis. = gocemos de las alegrías del cielo.
    - |-
      Patri, simúlque Fílio, = Al Padre, y a la vez al Hijo,
      tibíque, Sancte Spíritus, = y a ti, Espíritu Santo,
      sicut fuit, sit iúgiter = como fue, sea por siempre
      sæclum per omne glória. = por todos los siglos la gloria.
  vox-clara-ecce-intonat:
    titulo: Vox clara ecce íntonat
    amen: true
    estrofas:
    - |-
      Vox clara ecce íntonat, = He aquí que resuena una voz clara
      obscúra quæque íncrepat: = que reprende todo lo oscuro:
      procul fugéntur sómnia; = huyan lejos los sueños;
      ab æthre Christus prómicat. = desde lo alto resplandece Cristo.
    - |-
      Mens iam resúrgat tórpida = Levántese ya la mente adormecida,
      quæ sorde exstat sáucia = que yace herida por la suciedad;
      sidus refúlget iam novum, = brilla ya un astro nuevo,
      ut tollat omne nóxium. = para quitar todo lo dañino.
    - |-
      E sursum Agnus míttitur = De lo alto es enviado el Cordero
      laxáre gratis débitum; = para perdonar gratuitamente la deuda;
      omnes pro indulgéntia = todos, para [obtener] el perdón,
      vocem demus cum lácrimis, = elevemos la voz con lágrimas,
    - |-
      Secúndo ut cum fúlserit = para que, cuando brille por segunda vez
      mundúmque horror cínxerit, = y el espanto rodee al mundo,
      non pro reátu púniat, = no castigue [nuestra] culpa,
      sed nos pius tunc prótegat. = sino que entonces, piadoso, nos proteja.
    - |-
      Summo Parénti glória = Al Padre altísimo [sea] la gloria,
      Natóque sit victória, = y al Hijo sea la victoria,
      et Flámini laus débita = y al Espíritu la alabanza debida,
      per sæculórum sǽcula. = por los siglos de los siglos.
  nunc-sancte-nobis-spiritus:
    titulo: Nunc, Sancte, nobis, Spíritus
    amen: true
    estrofas:
    - |-
      Nunc, Sancte, nobis, Spíritus, = Ahora, Espíritu Santo,
      unum Patri cum Fílio, = uno con el Padre y el Hijo,
      dignáre promptus íngeri = dígnate, solícito, entrar en nosotros,
      nostro refúsus péctori. = derramado en nuestro pecho.
    - |-
      Os, lingua, mens, sensus, vigor = Boca, lengua, mente, sentidos, fuerzas
      confessiónem pérsonent, = hagan resonar la alabanza;
      flamméscat igne cáritas, = inflámese en fuego la caridad,
      accéndat ardor próximos. = encienda su ardor a los prójimos.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  rector-potens-verax-deus:
    titulo: Rector potens, verax Deus
    amen: true
    estrofas:
    - |-
      Rector potens, verax Deus, = Gobernante poderoso, Dios veraz,
      qui témperas rerum vices, = que regulas las vicisitudes de las cosas,
      splendóre mane ínstruis = que adornas la mañana con resplandor
      et ígnibus merídiem, = y con fuegos el mediodía:
    - |-
      Exstíngue flammas lítium, = apaga las llamas de las discordias,
      aufer calórem nóxium, = quita el calor dañino,
      confer salútem córporum, = concede la salud de los cuerpos
      verámque pacem córdium. = y la verdadera paz de los corazones.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  rerum-deus-tenax-vigor:
    titulo: Rerum, Deus, tenax vigor
    amen: true
    estrofas:
    - |-
      Rerum, Deus, tenax vigor, = Dios, fuerza que sostiene las cosas,
      immótus in te pérmanens, = que permaneces inmóvil en ti mismo
      lucis diúrnæ témpora = y determinas los tiempos de la luz del día
      succéssibus detérminans, = en su sucesión:
    - |-
      Largíre lumen véspere, = concede luz en la tarde,
      quo vita nusquam décidat, = para que la vida nunca decaiga,
      sed prǽmium mortis sacræ = sino que, como premio de una santa muerte,
      perénnis instet glória. = nos aguarde la gloria perenne.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  verbum-salutis-omnium:
    titulo: Verbum salútis ómnium
    amen: true
    estrofas:
    - |-
      Verbum salútis ómnium, = Al Verbo, salvación de todos,
      Patris ab ore pródiens, = que procede de la boca del Padre,
      Virgo beáta, súscipe = Virgen bienaventurada, recíbelo
      casto, María, víscere. = en tu seno casto, María.
    - |-
      Te nunc illústrat cǽlitus = A ti ahora te ilumina desde el cielo
      umbra fecúndi Spíritus, = la sombra del Espíritu fecundo,
      gestes ut Christum Dóminum, = para que lleves a Cristo, el Señor,
      æquálem Patri Fílium. = el Hijo igual al Padre.
    - |-
      Hæc est sacráti iánua = Esta es la puerta del templo sagrado,
      templi seráta iúgiter, = cerrada para siempre,
      soli suprémo Príncipi = que solo al Príncipe supremo
      pandens beáta límina. = abre los umbrales dichosos.
    - |-
      Olim promíssus vátibus, = Prometido antiguamente por los profetas,
      natus ante lucíferum, = nacido antes del lucero,
      quem Gábriel annúntiat, = el que Gabriel anuncia,
      terris descéndit Dóminus. = el Señor desciende a la tierra.
    - |-
      Læténtur simul ángeli, = Alégrense a una los ángeles,
      omnes exsúltent pópuli: = exulten todos los pueblos:
      excélsus venit húmilis = el excelso viene humilde
      salváre quod períerat. = a salvar lo que se había perdido.
    - |-
      Sit, Christe, rex piíssime, = Sea, Cristo, rey piadosísimo,
      tibi Patríque glória = a ti y al Padre la gloria
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  christe-qui-splendor-et-dies:
    titulo: Christe, qui, splendor et dies
    amen: true
    estrofas:
    - |-
      Christe, qui, splendor et dies, = Cristo, que, esplendor y día,
      noctis tenébras détegis, = descubres las tinieblas de la noche
      lucísque lumen créderis, = y eres creído luz de la luz,
      lumen beátis prǽdicans, = y anuncias la luz a los bienaventurados:
    - |-
      Precámur, sancte Dómine, = te rogamos, santo Señor,
      hac nocte nos custódias; = que esta noche nos guardes;
      sit nobis in te réquies, = que nuestro descanso esté en ti,
      quiétas horas tríbue. = concédenos horas tranquilas.
    - |-
      Somno si dantur óculi, = Si a los ojos se les da el sueño,
      cor semper ad te vígilet; = que el corazón vele siempre por ti;
      tuáque dextra prótegas = y con tu diestra protege
      fidéles, qui te díligunt. = a los fieles que te aman.
    - |-
      Defénsor noster, áspice, = Defensor nuestro, míranos,
      insidiántes réprime, = reprime a los que nos acechan,
      gubérna tuos fámulos, = gobierna a tus siervos,
      quos sánguine mercátus es. = a los que compraste con tu sangre.
    - |-
      Sit, Christe, rex piíssime, = Sea, Cristo, rey piadosísimo,
      tibi Patríque glória, = a ti y al Padre la gloria,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  veni-redemptor-gentium:
    titulo: Veni, redémptor géntium
    amen: true
    estrofas:
    - |-
      Veni, redémptor géntium, = Ven, redentor de las naciones,
      osténde partum Vírginis; = muestra el parto de la Virgen;
      mirétur omne sǽculum: = admírese todo el mundo:
      talis decet partus Deo. = tal parto conviene a Dios.
    - |-
      Non ex viríli sémine, = No de semilla de varón,
      sed mýstico spirámine = sino por soplo misterioso,
      Verbum Dei factum est caro = el Verbo de Dios se hizo carne
      fructúsque ventris flóruit. = y floreció el fruto del vientre.
    - |-
      Alvus tuméscit Vírginis, = Se hincha el seno de la Virgen,
      claustrum pudóris pérmanet, = permanece el claustro del pudor,
      vexílla virtútum micant, = brillan los estandartes de las virtudes,
      versátur in templo Deus. = Dios habita en [su] templo.
    - |-
      Procédat e thálamo suo, = Salga de su tálamo,
      pudóris aula régia, = el palacio real del pudor,
      géminæ gigas substántiæ = el gigante de doble sustancia,
      alácris ut currat viam. = para correr ágil su camino.
    - |-
      Æquális ætérno Patri, = Igual al Padre eterno,
      carnis tropǽo cíngere, = cíñete el trofeo de la carne,
      infírma nostri córporis = fortaleciendo lo débil de nuestro cuerpo
      virtúte firmans pérpeti. = con tu fuerza perpetua.
    - |-
      Præsépe iam fulget tuum = Ya brilla tu pesebre
      luménque nox spirat novum, = y la noche exhala una luz nueva,
      quod nulla nox intérpolet = que ninguna noche interrumpa
      fidéque iugi lúceat. = y que brille con fe continua.
    - |-
      Glória tibi, Dómine, = Gloria a ti, Señor,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et Sancto Spíritu, = con el Padre y el Espíritu Santo,
      in sempitérna sǽcula. = por los siglos sempiternos.
  magnis-prophetae-vocibus:
    titulo: Magnis prophétæ vócibus
    amen: true
    estrofas:
    - |-
      Magnis prophétæ vócibus = Con grandes voces los profetas
      veníre Christum núntiant, = anuncian que Cristo viene,
      lætæ salútis prǽvia, = precursora de la feliz salvación,
      qua nos redémit, grátia. = la gracia con que nos redimió.
    - |-
      Hinc mane nostrum prómicat = Por eso brilla nuestra mañana
      et corda læta exǽstuant, = y los corazones arden de alegría,
      cum vox fidélis pérsonat = cuando resuena la voz fiel,
      prænuntiátrix glóriæ. = mensajera de la gloria.
    - |-
      Advéntus hic primus fuit, = Esta fue la primera venida,
      puníre quo non sǽculum = en la que no vino a castigar
      venit, sed ulcus térgere, = al mundo, sino a limpiar la herida,
      salvándo quod períerat. = salvando lo que se había perdido.
    - |-
      At nos secúndus prǽmonet = Pero la segunda nos advierte
      adésse Christum iánuis, = que Cristo está a las puertas
      sanctis corónas réddere = para dar coronas a los santos
      cælíque regna pándere. = y abrir los reinos del cielo.
    - |-
      Ætérna lux promíttitur = Se promete una luz eterna
      sidúsque salvans prómitur; = y se muestra un astro que salva;
      iam nos iubar præfúlgidum = ya un resplandor brillantísimo
      ad ius vocat cæléstium. = nos llama al derecho de los habitantes del cielo.
    - |-
      Te, Christe, solum quǽrimus = A ti solo, Cristo, buscamos
      vidére, sicut es Deus, = ver, como eres, Dios,
      ut perpes hæc sit vísio = para que esta visión sea perpetua,
      perénne laudis cánticum. = cántico de alabanza perenne.
  certum-tenentes-ordinem:
    titulo: Certum tenéntes órdinem
    amen: true
    estrofas:
    - |-
      Certum tenéntes órdinem, = Guardando el orden establecido,
      pio poscámus péctore = pidamos con corazón piadoso,
      hora diéi tértia = en la hora tercera del día,
      trinæ virtútis glóriam, = la gloria del poder trino,
    - |-
      Ut simus habitáculum = para que seamos morada
      illi Sancto Spirítui, = de aquel Espíritu Santo
      qui quondam in apóstolis = que en otro tiempo, a los apóstoles,
      hac hora distribútus est. = a esta hora les fue repartido.
    - |-
      Hoc gradiénte órdine, = Avanzando con este orden,
      ornávit cuncta spléndide = adornó todo espléndidamente
      regni cæléstis cónditor = el creador del reino celestial
      ad nostra ætérna prǽmia. = para nuestros premios eternos.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  dicamus-laudes-domino:
    titulo: Dicámus laudes Dómino
    amen: true
    estrofas:
    - |-
      Dicámus laudes Dómino = Digamos alabanzas al Señor
      fervénte prompti spíritu; = con espíritu ferviente y dispuesto;
      hora volúta séxies = la hora sexta, que ha llegado,
      nos ad orándum próvocat. = nos invita a orar.
    - |-
      In hac enim fidélibus = Porque en ella a los fieles
      veræ salútis glória, = la gloria de la verdadera salvación,
      beáti Agni hóstia, = la víctima del Cordero bienaventurado,
      crucis virtúte rédditur. = por la fuerza de la cruz les es devuelta.
    - |-
      Cuius luce claríssima = Ante su luz clarísima
      tenébricat merídies; = se oscurece el mediodía;
      sumámus toto péctore = tomemos con todo el corazón
      tanti splendóris grátiam. = la gracia de tan gran esplendor.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  ternis-horarum-terminis:
    titulo: Ternis horárum términis
    amen: true
    estrofas:
    - |-
      Ternis horárum términis = Cumplidos tres plazos de horas,
      volútis, dante Dómino, = por don del Señor,
      trinum perfécte et únicum = al que es perfectamente trino y uno
      ipsum devóti psállimus. = le cantamos salmos con devoción.
    - |-
      Sacrum Dei mystérium = Guardando con corazón puro
      puro tenéntes péctore, = el sagrado misterio de Dios,
      Petri magístri régula = según la regla del maestro Pedro,
      signo salútis pródita, = transmitida con la señal de salvación,
    - |-
      Et nos psallámus spíritu, = salmodiemos también nosotros con el espíritu,
      hæréntes sic apóstolis, = unidos así a los apóstoles,
      ut plantas adhuc débiles = para que a las plantas aún débiles
      Christi virtúte dírigant. = las dirijan con el poder de Cristo.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  christe-redemptor-omnium-ex-patre:
    titulo: Christe, redémptor ómnium
    amen: true
    estrofas:
    - |-
      Christe, redémptor ómnium, = Cristo, redentor de todos,
      ex Patre, Patris Únice, = Unigénito del Padre, [nacido] del Padre,
      solus ante princípium = el único nacido antes del principio
      natus ineffabíliter, = de modo inefable:
    - |-
      Tu lumen, tu splendor Patris, = tú, luz, tú, resplandor del Padre,
      tu spes perénnis ómnium, = tú, esperanza perenne de todos,
      inténde quas fundunt preces = atiende las súplicas que elevan
      tui per orbem sérvuli. = tus siervos por el mundo.
    - |-
      Salútis auctor, récole = Autor de la salvación, recuerda
      quod nostri quondam córporis, = que en otro tiempo, de nuestro cuerpo,
      ex illibáta Vírgine = naciendo de la Virgen intacta,
      nascéndo, formam súmpseris. = tomaste la forma.
    - |-
      Hic præsens testátur dies, = Este día presente atestigua,
      currens per anni círculum, = al recorrer el ciclo del año,
      quod solus a sede Patris = que solo tú, desde el trono del Padre,
      mundi salus advéneris; = viniste como salvación del mundo.
    - |-
      Hunc cælum, terra, hunc mare, = A este, el cielo, la tierra, a este el mar,
      hunc omne quod in eis est, = a este todo lo que hay en ellos,
      auctórem advéntus tui = como autor de tu venida,
      laudat exsúltans cántico. = lo alaba exultante con un cántico.
    - |-
      Nos quoque, qui sancto tuo = También nosotros, que con tu santa
      redémpti sumus sánguine, = sangre fuimos redimidos,
      ob diem natális tui = por el día de tu nacimiento
      hymnum novum concínimus. = cantamos un himno nuevo.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  candor-aeternae-deitatis-alme:
    titulo: Candor ætérnæ Deitátis alme
    amen: true
    estrofas:
    - |-
      Candor ætérnæ Deitátis alme, = Resplandor bondadoso de la eterna Divinidad,
      Christe, tu lumen, vénia atque vita = Cristo, tú, luz, perdón y vida,
      ádvenis, morbis hóminum medéla, = vienes, remedio de las enfermedades de los hombres,
      porta salútis. = puerta de salvación.
    - |-
      Íntonat terræ chorus angelórum = El coro de los ángeles entona a la tierra
      cǽlicum carmen, nova sæcla dicens, = un canto celestial, anunciando tiempos nuevos,
      glóriam Patri, generíque nostro = gloria al Padre, y a nuestro linaje
      gáudia pacis. = los gozos de la paz.
    - |-
      Qui iaces parvus dóminans et orbi, = Tú que yaces pequeño y reinas también sobre el mundo,
      Vírginis fructus sine labe sanctæ, = fruto de la Virgen santa sin mancha,
      Christe, iam mundo potiáris omni, = Cristo, poséelo ya todo el mundo,
      semper amándus. = siempre digno de ser amado.
    - |-
      Násceris cælos pátriam datúrus, = Naces para darnos el cielo como patria,
      unus e nobis, caro nostra factus; = uno de nosotros, hecho carne nuestra;
      ínnova mentes, trahe caritátis = renueva las mentes, atrae los corazones
      péctora vinclis. = con los lazos de la caridad.
    - |-
      Cœtus exsúltans canit ecce noster, = He aquí que nuestra asamblea, exultante, canta,
      ángelis læto sociátus ore, = unida a los ángeles con boca alegre,
      et Patri tecum parilíque Amóri = al Padre contigo y al Amor igual [a ambos]
      cántica laudis. = cánticos de alabanza.
  a-solis-ortus-cardine:
    titulo: A solis ortus cárdine
    amen: true
    estrofas:
    - |-
      A solis ortus cárdine = Desde el punto donde sale el sol
      adúsque terræ límitem = hasta el límite de la tierra
      Christum canámus príncipem, = cantemos a Cristo príncipe,
      natum María Vírgine. = nacido de María Virgen.
    - |-
      Beátus auctor sǽculi = El bienaventurado autor del mundo
      servíle corpus índuit, = se revistió de un cuerpo de siervo,
      ut carne carnem líberans = para, liberando la carne con la carne,
      non pérderet quod cóndidit. = no perder lo que había creado.
    - |-
      Clausæ paréntis víscera = En las entrañas de la madre intacta
      cæléstis intrat grátia; = entra la gracia del cielo;
      venter puéllæ báiulat = el vientre de la doncella lleva
      secréta quæ non nóverat. = un secreto que no conocía.
    - |-
      Domus pudíci péctoris = La casa del pecho pudoroso
      templum repénte fit Dei; = se vuelve de repente templo de Dios;
      intácta nésciens virum = intacta, sin conocer varón,
      verbo concépit Fílium. = concibió por la palabra un Hijo.
    - |-
      Eníxa est puérpera = Dio a luz la parturienta
      quem Gábriel prædíxerat, = al que Gabriel había predicho,
      quem matris alvo géstiens = al que Juan, saltando en el seno de su madre,
      clausus Ioánnes sénserat. = encerrado, había percibido.
    - |-
      Feno iacére pértulit, = Soportó yacer en el heno,
      præsépe non abhórruit, = no rehusó el pesebre,
      parvóque lacte pastus est = y con un poco de leche se alimentó
      per quem nec ales ésurit. = aquel por quien ni el ave pasa hambre.
    - |-
      Gaudet chorus cæléstium = Se alegra el coro de los habitantes del cielo
      et ángeli canunt Deum, = y los ángeles cantan a Dios,
      palámque fit pastóribus = y se manifiesta a los pastores
      pastor, creátor ómnium. = el pastor, creador de todas las cosas.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  hostis-herodes-impie:
    titulo: Hostis Heródes ímpie
    amen: true
    estrofas:
    - |-
      Hostis Heródes ímpie, = Herodes, enemigo impío,
      Christum veníre quid times? = ¿por qué temes que venga Cristo?
      Non éripit mortália = No arrebata los reinos mortales
      qui regna dat cæléstia. = el que da los reinos celestiales.
    - |-
      Ibant magi, qua vénerant = Iban los magos por donde habían venido,
      stellam sequéntes prǽviam, = siguiendo la estrella que los precedía;
      lumen requírunt lúmine, = buscan la luz con la luz,
      Deum faténtur múnere. = confiesan a Dios con un don.
    - |-
      Lavácra puri gúrgitis = Las aguas del baño puro
      cæléstis Agnus áttigit; = tocó el Cordero celestial;
      peccáta quæ non détulit = los pecados que no tenía
      nos abluéndo sústulit. = los quitó lavándonos.
    - |-
      Novum genus poténtiæ: = Un nuevo género de poder:
      aquæ rubéscunt hýdriæ, = las tinajas de agua enrojecen,
      vinúmque iussa fúndere = y el agua, mandada a derramar vino,
      mutávit unda oríginem. = cambió su origen.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui te revélas géntibus, = que te revelas a las naciones,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  magi-videntes-parvulum:
    titulo: Magi vidéntes párvulum
    amen: true
    estrofas:
    - |-
      Magi vidéntes párvulum = Los magos, viendo al niño,
      eóa promunt múnera, = sacan los dones de oriente
      stratíque votis ófferunt = y, postrados, ofrecen en homenaje
      tus, myrrham et aurum régium. = incienso, mirra y oro real.
    - |-
      Agnósce clara insígnia = Reconoce las claras insignias
      virtútis ac regni tui, = de tu poder y de tu reino,
      Puer, cui trinam Pater = Niño, a quien el Padre
      prædestinávit índolem: = predestinó una triple condición:
    - |-
      Regem Deúmque annúntiant = Rey y Dios lo anuncian
      thesáurus et fragrans odor = el tesoro y el aroma fragante
      turis Sabǽi, at mýrrheus = del incienso de Saba, pero el polvo
      pulvis sepúlcrum prǽdocet. = de mirra preanuncia el sepulcro.
    - |-
      O sola magnárum úrbium = ¡Oh Belén, la única mayor
      maior Bethlem, cui cóntigit = que las grandes ciudades, a quien tocó
      ducem salútis cǽlitus = engendrar, encarnado desde el cielo,
      incorporátum gígnere! = al guía de la salvación!
    - |-
      Hunc et prophétis téstibus = A este, con los profetas como testigos
      isdémque signatóribus = y como signatarios ellos mismos,
      testátor et sator iubet = el testador y creador manda
      adíre regnum et cérnere: = entrar en posesión del reino y verlo:
    - |-
      Regnum quod ambit ómnia = el reino que abarca todas las cosas,
      dia et marína et térrea = las celestes, las del mar y las de la tierra,
      a solis ortu ad éxitum = desde la salida del sol hasta el ocaso,
      et tártara et cælum supra. = y el abismo y el cielo arriba.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui te revélas géntibus, = que te revelas a las naciones,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  quicumque-christum-quaeritis:
    titulo: Quicúmque Christum quǽritis
    amen: true
    estrofas:
    - |-
      Quicúmque Christum quǽritis, = Todos los que buscáis a Cristo,
      óculos in altum tóllite: = levantad los ojos a lo alto:
      illic licébit vísere = allí se podrá ver
      signum perénnis glóriæ. = la señal de la gloria perenne.
    - |-
      Hæc stella, quæ solis rotam = Esta estrella, que a la rueda del sol
      vincit decóre ac lúmine, = vence en belleza y en luz,
      venísse terris núntiat = anuncia que ha venido a la tierra
      cum carne terréstri Deum. = Dios con carne terrena.
    - |-
      En, Pérsici ex orbis sinu, = He aquí que, desde el seno del mundo persa,
      sol unde sumit iánuam, = de donde el sol toma su puerta,
      cernunt períti intérpretes = la ven los magos, intérpretes expertos,
      regále vexíllum magi. = [como] estandarte real.
    - |-
      «Quis iste tantus —ínquiunt— = «¿Quién es este tan grande —dicen—,
      regnátor astris ímperans, = soberano que manda a los astros,
      quem sic tremunt cæléstia, = ante quien así tiemblan las cosas celestes,
      cui lux et æthra insérviunt? = a quien sirven la luz y el éter?
    - |-
      Illústre quiddam cérnimus = Vemos algo ilustre
      quod nésciat finem pati, = que no conoce sufrir un fin,
      sublíme, celsum, intérminum, = sublime, excelso, sin término,
      antíquius cælo et chao. = más antiguo que el cielo y el caos.
    - |-
      Hic ille rex est géntium = Este es el rey de las naciones
      populíque rex Iudáici, = y rey del pueblo judío,
      promíssus Ábrahæ patri = prometido al padre Abraham
      eiúsque in ævum sémini». = y a su descendencia para siempre».
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui te revélas géntibus, = que te revelas a las naciones,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-lux-beata-caelitum:
    titulo: O lux beáta cǽlitum
    amen: true
    estrofas:
    - |-
      O lux beáta cǽlitum = Oh luz bienaventurada de los habitantes del cielo
      et summa spes mortálium, = y suma esperanza de los mortales,
      Iesu, cui doméstica = Jesús, a quien, al nacer, el amor
      arrísit orto cáritas; = de un hogar te sonrió;
    - |-
      María, dives grátia, = María, rica en gracia,
      o sola quæ casto potes = oh tú, la única que puedes
      fovére Iesum péctore, = abrigar a Jesús en tu casto pecho,
      cum lacte donans óscula; = dándole besos con la leche;
    - |-
      Tuque ex vetústis pátribus = y tú, elegido entre los antiguos padres
      delécte custos Vírginis, = como custodio de la Virgen,
      dulci patris quem nómine = a quien con el dulce nombre de padre
      divína Proles ínvocat: = invoca la Prole divina:
    - |-
      De stirpe Iesse nóbili = nacidos de la noble estirpe de Jesé
      nati in salútem géntium, = para la salvación de las naciones,
      audíte nos, qui súpplices = escuchadnos a nosotros, que suplicantes
      ex corde vota fúndimus. = derramamos de corazón nuestros votos.
    - |-
      Qua vestra sedes flóruit = Que la gracia de toda virtud
      virtútis omnis grátia, = con que floreció vuestra casa
      hanc detur in domésticis = se nos conceda poder reproducirla
      reférre posse móribus. = en las costumbres de nuestros hogares.
    - |-
      Iesu, tuis obœ́diens = Jesús, que te hiciste obediente
      qui factus es paréntibus, = a tus padres,
      cum Patre summo ac Spíritu = con el Padre altísimo y el Espíritu,
      semper tibi sit glória. = a ti sea siempre la gloria.
  dulce-fit-nobis-memorare-parvum:
    titulo: Dulce fit nobis memoráre parvum
    amen: true
    estrofas:
    - |-
      Dulce fit nobis memoráre parvum = Nos resulta dulce recordar la pequeña
      Názaræ tectum tenuémque cultum; = casa de Nazaret y su pobre vida;
      éxpedit Iesu tácitam reférre = conviene contar en verso
      cármine vitam. = la vida oculta de Jesús.
    - |-
      Arte qua Ioseph húmili excoléndus, = En el oficio humilde en que José lo ha de formar,
      ábdito Iesus iuvenéscit ævo, = Jesús crece en una edad escondida,
      seque fabrílis sócium labóris = y como compañero del trabajo de artesano
      ádicit ultro. = se ofrece por sí mismo.
    - |-
      Ássidet nato pia mater almo, = Se sienta junto a su Hijo la madre piadosa,
      ássidet sponso bona nupta, felix = se sienta junto a su esposo la buena esposa, feliz
      si potest curas releváre lassis = si puede aliviar las preocupaciones de los cansados
      múnere amíco. = con su servicio amistoso.
    - |-
      O neque expértes óperæ et labóris, = Oh vosotros, que no fuisteis ajenos a la tarea y al trabajo
      nec mali ignári, míseros iuváte; = ni ignorantes del mal, ayudad a los desdichados;
      quotquot implórant cólumen, benígno = a cuantos imploran vuestro amparo,
      cérnite vultu. = miradlos con rostro benigno.
    - |-
      Sit tibi, Iesu, decus atque virtus, = Sea a ti, Jesús, el honor y el poder,
      sancta qui vitæ documénta præbes, = que nos das santas enseñanzas de vida,
      quique cum summo Genitóre et almo = y que con el sumo Padre y el Espíritu
      Flámine regnas. = bondadoso reinas.
  christe-splendor-patris:
    titulo: Christe, splendor Patris
    amen: true
    estrofas:
    - |-
      Christe, splendor Patris, = Cristo, esplendor del Padre,
      Dei mater Virgo, = Virgen, madre de Dios,
      Ioseph, tam sacrórum = José, guardián
      pígnorum servátor, = de prendas tan sagradas:
    - |-
      Nitet vestra domus = brilla vuestra casa
      flóribus virtútum, = con las flores de las virtudes,
      unde gratiárum = de donde mana
      fons prománat ipse. = la fuente misma de las gracias.
    - |-
      Ángeli stupéntes = Los ángeles, asombrados,
      Natum Dei cernunt = ven al Hijo de Dios
      servi forma indútum = revestido de la forma de siervo,
      servis famulántem. = sirviendo a sus siervos.
    - |-
      Imus præes, Ioseph, = Tú, José, el último, presides,
      humilísque iubes; = y, humilde, mandas;
      iubes et María = mandas también a María,
      et utríque servis. = y a ambos sirves.
    - |-
      Cunctis præstant aulis = Supera a todos los palacios
      hæc egéna sæpta, = este pobre recinto,
      salus unde cœpit = donde comenzó la salvación
      géneris humáni. = del género humano.
    - |-
      Iesu, Mater, Ioseph, = Jesús, Madre, José,
      mansiónis vestræ = concedednos, en nuestras casas,
      nostras date sedes = gozar de los santos dones
      donis frui sanctis. = de vuestra morada.
    - |-
      Tibi laudes, Christe, = A ti las alabanzas, Cristo,
      spem qui nobis præbes, = que nos das la esperanza
      tuos per paréntes = de llegar, por medio de tus padres,
      cæli adíre domum. = a la casa del cielo.
  corde-natus-ex-parentis:
    titulo: Corde natus ex Paréntis
    amen: true
    estrofas:
    - |-
      Corde natus ex Paréntis = Nacido del corazón del Padre
      ante mundi exórdium, = antes del comienzo del mundo,
      Alpha et Ómega vocátus, = llamado Alfa y Omega,
      ipse fons et cláusula = él mismo fuente y término
      ómnium quæ sunt, fuérunt = de todo lo que es, lo que fue
      quæque post futúra sunt. = y lo que será después.
    - |-
      Córporis formam cadúci, = De un cuerpo caduco la forma,
      membra morti obnóxia = miembros sujetos a la muerte,
      índuit, ne gens períret = tomó, para que no pereciera el linaje
      primoplásti ex gérmine, = nacido del primer hombre,
      mérserat quam lex profúndo = al que una ley de culpa había hundido
      noxiális tártaro. = en el profundo abismo.
    - |-
      O beátus ortus ille, = ¡Oh bienaventurado aquel nacimiento,
      Virgo cum puérpera = cuando la Virgen parturienta,
      édidit nostram salútem = fecunda por el Espíritu Santo,
      feta Sancto Spíritu, = dio a luz a nuestra salvación,
      et puer redémptor orbis = y el niño redentor del mundo
      os sacrátum prótulit. = mostró su rostro sagrado!
    - |-
      Ecce, quem vates vetústis = He aquí al que los profetas en siglos antiguos
      concinébant sǽculis, = cantaban a una,
      quem prophetárum fidéles = al que las páginas fieles de los profetas
      páginæ spopónderant, = habían prometido:
      émicat promíssus olim: = brilla el prometido de antaño;
      cuncta colláudent eum! = ¡que todas las cosas lo alaben!
    - |-
      Glóriam Patri melódis = Gloria al Padre con voces
      personémus vócibus; = melodiosas hagamos resonar;
      glóriam Christo canámus, = gloria a Cristo cantemos,
      matre nato vírgine, = nacido de madre virgen,
      inclitóque sempitérnam = y gloria sempiterna
      glóriam Paráclito. = al ínclito Paráclito.
  radix-iesse-floruit:
    titulo: Radix Iesse iam flóruit
    amen: true
    estrofas:
    - |-
      Radix Iesse iam flóruit = La raíz de Jesé ya ha florecido
      et virga fructum édidit; = y la vara ha dado su fruto;
      fecúnda partum prótulit = la fecunda ha dado a luz un hijo
      et virgo mater pérmanet. = y la virgen permanece madre.
    - |-
      Præsǽpe poni pértulit = Soportó que lo pusieran en un pesebre
      qui lucis auctor éxstitit; = el que fue autor de la luz;
      cum Patre cælos cóndidit, = con el Padre creó los cielos,
      sub matre pannos índuit. = bajo la madre se vistió de pañales.
    - |-
      Legem dedit qui sǽculo, = El que dio la ley al mundo,
      cuius decem præcépta sunt, = cuyos preceptos son diez,
      dignándo factus est homo = dignándose, se hizo hombre
      sub legis esse vínculo. = para estar sujeto al vínculo de la ley.
    - |-
      Iam lux salúsque náscitur, = Ya nacen la luz y la salvación,
      nox díffugit, mors víncitur; = la noche huye, la muerte es vencida;
      veníte, gentes, crédite: = venid, naciones, creed:
      Deum María prótulit. = María dio a luz a Dios.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  fit-porta-christi-pervia:
    titulo: Fit porta Christi pérvia
    amen: true
    estrofas:
    - |-
      Fit porta Christi pérvia = La puerta se hace transitable para Cristo,
      omni reférta grátia, = llena de toda gracia,
      transítque rex, et pérmanet = y pasa el rey, y permanece
      clausa, ut fuit, per sǽcula. = cerrada, como estaba, por los siglos.
    - |-
      Summi Paréntis Fílius = El Hijo del sumo Padre
      procéssit aula Vírginis, = salió del palacio de la Virgen,
      sponsus, redémptor, cónditor, = esposo, redentor, creador,
      suæ gigas Ecclésiæ: = gigante de su Iglesia.
    - |-
      Honor matris et gáudium, = Honor y gozo de su madre,
      imménsa spes credéntium, = inmensa esperanza de los creyentes,
      lapis de monte véniens = piedra que viene del monte
      mundúmque replens grátia. = y llena el mundo de gracia.
    - |-
      Exsúltet omnis ánima, = Exulte toda alma,
      quod nunc salvátor géntium = porque ahora el salvador de las naciones,
      advénit mundi Dóminus = el Señor del mundo, ha venido
      redímere quos cóndidit. = a redimir a los que creó.
    - |-
      Christo sit omnis glória, = A Cristo sea toda la gloria,
      quem Pater Deum génuit, = a quien el Padre engendró Dios,
      quem Virgo mater édidit = a quien la Virgen madre dio a luz,
      fecúnda Sancto Spíritu. = fecunda por el Espíritu Santo.
  a-patre-unigenite:
    titulo: A Patre Unigénite
    amen: true
    estrofas:
    - |-
      A Patre Unigénite, = Unigénito del Padre,
      ad nos venis per Vírginem, = vienes a nosotros por la Virgen,
      baptísmi rore cónsecrans = consagrando a todos con el rocío del bautismo,
      cunctos, fide regénerans. = regenerándolos por la fe.
    - |-
      De cælo celsus pródiens = Saliendo, excelso, del cielo,
      éxcipis formam hóminis, = tomas la forma del hombre,
      factúram morte rédimens, = redimiendo con la muerte a tu criatura,
      gáudia vitæ lárgiens. = concediendo los gozos de la vida.
    - |-
      Hoc te, Redémptor, quǽsumus: = Esto te pedimos, Redentor:
      illábere propítius, = desciende propicio [sobre nosotros]
      clarúmque nostris córdibus = y da a nuestros corazones
      lumen præbe deíficum. = la clara luz divina.
    - |-
      Mane nobíscum, Dómine, = Quédate con nosotros, Señor,
      noctem obscúram rémove, = aparta la noche oscura,
      omne delíctum áblue, = lava todo delito,
      pie medélam tríbue. = concede, piadoso, el remedio.
    - |-
      O Christe, vita, véritas, = Oh Cristo, vida, verdad,
      tibi sit omnis glória, = a ti sea toda la gloria,
      quem Patris atque Spíritus = a quien el esplendor del Padre y del Espíritu
      splendor revélat cǽlitus. = revela desde el cielo.
  implente-munus-debitum:
    titulo: Implénte munus débitum
    amen: true
    estrofas:
    - |-
      Implénte munus débitum = Cumpliendo el oficio debido
      Ioánne, rerum cónditor = Juan, el creador de las cosas,
      Iordáne mersus hac die = sumergido en el Jordán en este día,
      aquam lavándo díluit, = purificó el agua al lavarse.
    - |-
      Non ipse mundári volens = No quería él ser purificado,
      de ventre natus Vírginis, = nacido del seno de la Virgen,
      peccáta sed mortálium = sino quitar los pecados de los mortales
      suo lavácro tóllere. = con su propio baño.
    - |-
      Dicénte Patre quod «meus = Diciendo el Padre: «Este
      diléctus hic est Fílius», = es mi Hijo amado»,
      suménte Sancto Spíritu = y tomando el Espíritu Santo
      formam colúmbæ cǽlitus, = forma de paloma desde el cielo,
    - |-
      Hoc mýstico sub nómine = bajo este nombre misterioso
      micat salus Ecclésiæ; = brilla la salvación de la Iglesia;
      Persóna trina cómmanet = la Persona trina permanece
      unus Deus per ómnia. = un solo Dios en todo.
    - |-
      O Christe, vita, véritas, = Oh Cristo, vida, verdad,
      tibi sit omnis glória, = a ti sea toda la gloria,
      quem Patris atque Spíritus = a quien el esplendor del Padre y del Espíritu
      splendor revélat cǽlitus. = revela desde el cielo.
  iesus-refulsit-omnium:
    titulo: Iesus refúlsit ómnium
    amen: true
    estrofas:
    - |-
      Iesus refúlsit ómnium = Jesús ha resplandecido, piadoso redentor
      pius redémptor géntium; = de todas las naciones;
      totum genus fidélium = que todo el linaje de los fieles
      laudis celébret cánticum. = celebre un cántico de alabanza.
    - |-
      Denis ter ævi círculis = Viviendo ya tres decenas de años
      iam parte vivens córporis, = en la condición del cuerpo,
      lympham petit baptísmatis = pide el agua del bautismo,
      cunctis carens contágiis. = libre de todo contagio.
    - |-
      Felix Ioánnes mérgere = Feliz Juan tiembla de sumergir
      illum treméscit flúmine, = en el río a aquel
      potest suo qui sánguine = que puede con su sangre
      peccáta mundi térgere. = lavar los pecados del mundo.
    - |-
      Vox ergo Prolem de polis = Entonces la voz del Padre excelso,
      testátur excélsi Patris, = desde el cielo, da testimonio de su Hijo,
      fluítque virtus Spíritus = y fluye la fuerza del Espíritu
      sancti datrix charísmatis. = Santo, dador del carisma.
    - |-
      Nos, Christe, voce súpplici = Nosotros, Cristo, con voz suplicante
      precámur, omnes prótege, = te rogamos: protégenos a todos
      ac mente fac nitéscere = y haz que brillemos en la mente
      tibíque mundos vívere. = y vivamos puros para ti.
    - |-
      O Christe, vita, véritas, = Oh Cristo, vida, verdad,
      tibi sit omnis glória, = a ti sea toda la gloria,
      quem Patris atque Spíritus = a quien el esplendor del Padre y del Espíritu
      splendor revélat cǽlitus. = revela desde el cielo.
  audi-benigne-conditor:
    titulo: Audi, benígne Cónditor
    amen: true
    estrofas:
    - |-
      Audi, benígne Cónditor, = Escucha, Creador benigno,
      nostras preces cum flétibus, = nuestras súplicas con llanto,
      sacráta in abstinéntia = derramadas en el sagrado
      fusas quadragenária. = ayuno de cuarenta días.
    - |-
      Scrutátor alme córdium, = Escrutador bondadoso de los corazones,
      infírma tu scis vírium; = tú conoces la debilidad de las fuerzas;
      ad te revérsis éxhibe = a los que vuelven a ti muéstrales
      remissiónis grátiam. = la gracia del perdón.
    - |-
      Multum quidem peccávimus, = Mucho, en verdad, hemos pecado,
      sed parce confiténtibus, = pero perdona a los que confiesan,
      tuíque laude nóminis = y para alabanza de tu nombre
      confer medélam lánguidis. = da remedio a los enfermos.
    - |-
      Sic corpus extra cónteri = Concede que así el cuerpo por fuera
      dona per abstinéntiam, = se domine por la abstinencia,
      ieiúnet ut mens sóbria = para que la mente sobria ayune
      a labe prorsus críminum. = del todo de la mancha de los pecados.
    - |-
      Præsta, Beáta Trínitas, = Concédelo, bienaventurada Trinidad,
      concéde, simplex Únitas, = otórgalo, Unidad simple,
      ut fructuósa sint tuis = que sean fructuosos para los tuyos
      hæc parcitátis múnera. = estos dones del ayuno.
  ex-more-docti-mystico:
    titulo: Ex more docti mýstico
    amen: true
    estrofas:
    - |-
      Ex more docti mýstico = Instruidos por la costumbre mística,
      servémus abstinéntiam, = guardemos la abstinencia
      deno diérum círculo = en el ciclo bien conocido de diez días
      ducto quater notíssimo. = repetido cuatro veces.
    - |-
      Lex et prophétæ prímitus = La ley y los profetas primero
      hanc prætulérunt, póstmodum = la anunciaron; después
      Christus sacrávit, ómnium = Cristo la consagró, de todos
      rex atque factor témporum. = los tiempos rey y creador.
    - |-
      Utámur ergo párcius = Usemos, pues, con más moderación
      verbis, cibis et pótibus, = las palabras, la comida y la bebida,
      somno, iocis et árctius = el sueño, las bromas, y más estrictamente
      perstémus in custódia. = perseveremos en la vigilancia.
    - |-
      Vitémus autem péssima = Evitemos además los males peores,
      quæ súbruunt mentes vagas, = que arruinan las mentes inconstantes,
      nullúmque demus cállido = y no demos al astuto
      hosti locum tyránnidis. = enemigo lugar para su tiranía.
    - |-
      Præsta, Beáta Trínitas, = Concédelo, bienaventurada Trinidad,
      concéde, simplex Únitas, = otórgalo, Unidad simple,
      ut fructuósa sint tuis = que sean fructuosos para los tuyos
      hæc parcitátis múnera. = estos dones del ayuno.
  precemur-omnes-cernui:
    titulo: Precémur omnes cérnui
    amen: true
    estrofas:
    - |-
      Precémur omnes cérnui, = Oremos todos postrados,
      clamémus atque sínguli, = clamemos cada uno,
      plorémus ante iúdicem, = lloremos ante el juez,
      flectámus iram víndicem: = aplaquemos la ira vengadora.
    - |-
      Nostris malis offéndimus = Con nuestros males hemos ofendido
      tuam, Deus, cleméntiam; = tu clemencia, oh Dios;
      effúnde nobis désuper, = derrama sobre nosotros desde lo alto,
      remíssor, indulgéntiam. = tú que perdonas, la indulgencia.
    - |-
      Meménto quod sumus tui, = Recuerda que somos, aunque frágiles,
      licet cadúci, plásmatis; = obra de tus manos;
      ne des honórem nóminis = no des el honor de tu nombre,
      tui, precámur, álteri. = te rogamos, a otro.
    - |-
      Laxa malum quod fécimus, = Perdona el mal que hicimos,
      auge bonum quod póscimus, = aumenta el bien que pedimos,
      placére quo tandem tibi = para que al fin podamos agradarte
      possímus hic et pérpetim. = aquí y para siempre.
    - |-
      Præsta, Beáta Trínitas, = Concédelo, bienaventurada Trinidad,
      concéde, simplex Únitas, = otórgalo, Unidad simple,
      ut fructuósa sint tuis = que sean fructuosos para los tuyos
      hæc parcitátis múnera. = estos dones del ayuno.
  iesu-quadragenariae:
    titulo: Iesu, quadragenáriæ
    amen: true
    estrofas:
    - |-
      Iesu, quadragenáriæ = Jesús, que consagraste
      dicátor abstinéntiæ, = la abstinencia de cuarenta días,
      qui ob salútem méntium = que por la salvación de las almas
      præcéperas ieiúnium, = habías mandado el ayuno:
    - |-
      Adésto nunc Ecclésiæ, = asiste ahora a la Iglesia,
      adésto pæniténtiæ, = asiste a la penitencia
      qua supplicámus cérnui = con la que, postrados, suplicamos
      peccáta nostra dílui. = que nuestros pecados sean lavados.
    - |-
      Tu retroácta crímina = Tú, los crímenes pasados
      tua remítte grátia = perdónalos con tu gracia,
      et a futúris ádhibe = y contra los futuros pon
      custódiam mitíssime, = tu custodia, oh mansísimo,
    - |-
      Ut, expiáti ánnuis = para que, purificados por los actos
      compunctiónis áctibus, = anuales de compunción,
      tendámus ad paschália = tendamos a los gozos pascuales,
      digne colénda gáudia. = que han de celebrarse dignamente.
    - |-
      Te rerum univérsitas, = Que el universo de las cosas te adore,
      clemens, adóret, Trínitas, = clemente Trinidad,
      et nos novi per véniam = y nosotros, renovados por el perdón,
      novum canámus cánticum. = cantemos un cántico nuevo.
  nunc-tempus-acceptabile:
    titulo: Nunc tempus acceptábile
    amen: true
    estrofas:
    - |-
      Nunc tempus acceptábile = Ahora brilla el tiempo favorable,
      fulget datum divínitus, = dado por Dios,
      ut sanet orbem lánguidum = para que sane al mundo enfermo
      medéla parsimóniæ. = el remedio de la sobriedad.
    - |-
      Christi decóro lúmine = Con la hermosa luz de Cristo
      dies salútis émicat, = resplandece el día de la salvación,
      dum corda culpis sáucia = mientras la abstinencia reforma
      refórmat abstinéntia. = los corazones heridos por las culpas.
    - |-
      Hanc mente nos et córpore, = Haz, oh Dios, que la guardemos
      Deus, tenére pérfice, = con la mente y con el cuerpo,
      ut appetámus próspero = para que deseemos, con un feliz
      perénne pascha tránsitu. = tránsito, la Pascua perenne.
    - |-
      Te rerum univérsitas, = Que el universo de las cosas te adore,
      clemens, adóret, Trínitas, = clemente Trinidad,
      et nos novi per véniam = y nosotros, renovados por el perdón,
      novum canámus cánticum. = cantemos un cántico nuevo.
  iam-christe-sol-iustitiae:
    titulo: Iam, Christe, sol iustítiæ
    amen: true
    estrofas:
    - |-
      Iam, Christe, sol iustítiæ, = Ya, Cristo, sol de justicia,
      mentis dehíscant ténebræ, = ábranse las tinieblas de la mente,
      virtútum ut lux rédeat, = para que vuelva la luz de las virtudes,
      terris diem cum réparas. = cuando devuelves el día a la tierra.
    - |-
      Dans tempus acceptábile = Al dar el tiempo favorable,
      et pǽnitens cor tríbue, = concede también un corazón penitente,
      convértat ut benígnitas = para que convierta la benignidad
      quos longa suffert píetas; = a los que soporta tu larga piedad;
    - |-
      Quiddámque pæniténtiæ = y concede llevar algo de penitencia
      da ferre, quo fit démptio, = por la que se obtenga el perdón
      maióre tuo múnere, = con tu don mayor,
      culpárum quamvis grándium. = aunque las culpas sean grandes.
    - |-
      Dies venit, dies tua, = Viene el día, tu día,
      per quam reflórent ómnia; = por el que todo vuelve a florecer;
      lætémur in hac ut tuæ = alegrémonos en él, como devueltos
      per hanc redúcti grátiæ. = por él a tu gracia.
    - |-
      Te rerum univérsitas, = Que el universo de las cosas te adore,
      clemens, adóret, Trínitas, = clemente Trinidad,
      et nos novi per véniam = y nosotros, renovados por el perdón,
      novum canámus cánticum. = cantemos un cántico nuevo.
  dei-fide-qua-vivimus:
    titulo: Dei fide, qua vívimus
    amen: true
    estrofas:
    - |-
      Dei fide, qua vívimus, = Con la fe de Dios, por la que vivimos,
      qua spe perénni crédimus, = con la que creemos en la esperanza perenne,
      per caritátis grátiam = por la gracia de la caridad
      Christi canámus glóriam, = cantemos la gloria de Cristo,
    - |-
      Qui ductus hora tértia = que, conducido a la hora tercia
      ad passiónis hóstiam, = al sacrificio de la pasión,
      crucis ferens suspéndia = soportando el suplicio de la cruz,
      ovem redúxit pérditam. = devolvió la oveja perdida.
    - |-
      Precémur ergo súbditi, = Roguemos, pues, sometidos [a él],
      redemptióne líberi, = libres por la redención,
      ut éruat a sǽculo = que arranque del mundo
      quos solvit a chirógrapho. = a los que libró del documento [de la deuda].
    - |-
      Christum rogámus et Patrem, = A Cristo rogamos y al Padre,
      Christi Patrísque Spíritum; = al Espíritu de Cristo y del Padre;
      unum potens per ómnia, = Trinidad, una y poderosa en todo,
      fove precántes, Trínitas. = favorece a los que te suplican.
  qua-christus-hora-sitiit:
    titulo: Qua Christus hora sítiit
    amen: true
    estrofas:
    - |-
      Qua Christus hora sítiit = La hora en que Cristo tuvo sed
      crucem vel in qua súbiit, = o en la que subió a la cruz,
      quos præstat in hac psállere = a los que concede salmodiar en ella
      ditet siti iustítiæ. = los enriquezca con sed de justicia.
    - |-
      Simul sit his esúries, = Que tengan también hambre,
      quam ipse de se sátiet, = que él mismo sacie de sí,
      crimen sit ut fastídium = para que el pecado les cause hastío
      virtúsque desidérium. = y la virtud, deseo.
    - |-
      Charísma Sancti Spíritus = Que el carisma del Espíritu Santo
      sic ínfluat psalléntibus, = se derrame así sobre los que salmodian,
      ut carnis æstus frígeat = que el ardor de la carne se enfríe
      et mentis algor férveat. = y el frío de la mente arda.
    - |-
      Christum rogámus et Patrem, = A Cristo rogamos y al Padre,
      Christi Patrísque Spíritum; = al Espíritu de Cristo y del Padre;
      unum potens per ómnia, = Trinidad, una y poderosa en todo,
      fove precántes, Trínitas. = favorece a los que te suplican.
  ternis-ter-horis-numerus:
    titulo: Ternis ter horis númerus
    amen: true
    estrofas:
    - |-
      Ternis ter horis númerus = El número de tres veces tres horas
      nobis sacrátus pánditur, = se nos abre consagrado,
      sanctóque Iesu nómine = y en el santo nombre de Jesús
      munus precémur véniæ. = pidamos el don del perdón.
    - |-
      Latrónis, en, conféssio = He aquí que la confesión del ladrón
      Christi merétur grátiam; = merece la gracia de Cristo;
      laus nostra vel devótio = que nuestra alabanza y nuestra devoción
      mercétur indulgéntiam. = obtengan la indulgencia.
    - |-
      Mors per crucem nunc ínterit = La muerte perece ahora por la cruz
      et post ténebras lux redit; = y tras las tinieblas vuelve la luz;
      horror dehíscat críminum, = que se disipe el horror de los pecados,
      splendor nitéscat méntium. = que brille el esplendor de las almas.
    - |-
      Christum rogámus et Patrem, = A Cristo rogamos y al Padre,
      Christi Patrísque Spíritum; = al Espíritu de Cristo y del Padre;
      unum potens per ómnia, = Trinidad, una y poderosa en todo,
      fove precántes, Trínitas. = favorece a los que te suplican.
  vexilla-regis-prodeunt:
    titulo: Vexílla regis pródeunt
    amen: true
    estrofas:
    - |-
      Vexílla regis pródeunt, = Avanzan los estandartes del rey,
      fulget crucis mystérium, = brilla el misterio de la cruz,
      quo carne carnis cónditor = en la que con la carne el creador de la carne
      suspénsus est patíbulo; = fue colgado en el patíbulo;
    - |-
      Quo, vulnerátus ínsuper = en la que, herido además
      mucróne diro lánceæ, = por la punta cruel de la lanza,
      ut nos laváret crímine, = para lavarnos del pecado
      manávit unda et sánguine. = manó agua y sangre.
    - |-
      Arbor decóra et fúlgida, = ¡Árbol hermoso y resplandeciente,
      ornáta regis púrpura, = adornado con la púrpura del rey,
      elécta digno stípite = elegido para tocar con tu digno tronco
      tam sancta membra tángere! = miembros tan santos!
    - |-
      Beáta, cuius bráchiis = Dichoso, de cuyos brazos
      sæcli pepéndit prétium; = colgó el precio del mundo;
      statéra facta est córporis = se hizo balanza del cuerpo
      prædam tulítque tártari. = y arrebató la presa al abismo.
    - |-
      Salve, ara, salve, víctima, = ¡Salve, altar; salve, víctima,
      de passiónis glória; = por la gloria de la pasión,
      qua Vita mortem pértulit = en la que la Vida soportó la muerte
      et morte vitam réddidit! = y con la muerte devolvió la vida!
    - |-
      O crux, ave, spes única! = ¡Oh cruz, salve, esperanza única!
      in hac triúmphi glória = En esta gloria del triunfo
      piis adáuge grátiam = aumenta a los piadosos la gracia
      reísque dele crímina. = y borra los crímenes a los culpables.
    - |-
      Te, fons salútis, Trínitas, = A ti, fuente de salvación, Trinidad,
      colláudet omnis spíritus; = te alabe todo espíritu;
      quos per crucis mystérium = a los que salvas por el misterio de la cruz,
      salvas, fove per sǽcula. = protégelos por los siglos.
  pange-lingua-gloriosi-proelium:
    titulo: Pange, lingua, gloriósi
    amen: true
    estrofas:
    - |-
      Pange, lingua, gloriósi = Canta, lengua, el combate
      prœ́lium certáminis, = de la gloriosa lucha,
      et super crucis tropǽo = y sobre el trofeo de la cruz
      dic triúmphum nóbilem, = proclama el noble triunfo,
      quáliter redémptor orbis = cómo el redentor del mundo,
      immolátus vícerit. = inmolado, venció.
    - |-
      De paréntis protoplásti = Del engaño del primer padre
      fraude factor cóndolens, = compadecido el creador,
      quando pomi noxiális = cuando, al morder el fruto dañino,
      morte morsu córruit, = cayó en la muerte,
      ipse lignum tunc notávit, = él mismo señaló entonces el árbol
      damna ligni ut sólveret. = para reparar los daños del árbol.
    - |-
      Hoc opus nostræ salútis = Esta obra de nuestra salvación
      ordo depopóscerat, = la había exigido el orden [divino],
      multifórmis perditóris = para burlar con arte el arte
      arte ut artem fálleret, = del traidor de mil formas
      et medélam ferret inde, = y traer el remedio de donde
      hostis unde lǽserat. = el enemigo había herido.
    - |-
      Quando venit ergo sacri = Cuando llegó, pues, la plenitud
      plenitúdo témporis, = del tiempo sagrado,
      missus est ab arce Patris = fue enviado desde el alcázar del Padre
      Natus, orbis cónditor, = el Hijo, creador del mundo,
      atque ventre virgináli = y del seno virginal
      carne factus pródiit. = salió hecho carne.
    - |-
      Lustra sex qui iam perácta = Cumplidos ya seis lustros,
      tempus implens córporis, = completando el tiempo de su vida corporal,
      se volénte, natus ad hoc, = por su voluntad, nacido para esto,
      passióni déditus, = entregado a la pasión,
      agnus in crucis levátur = el cordero es levantado en la cruz
      immolándus stípite. = para ser inmolado en el madero.
    - |-
      Æqua Patri Filióque, = Igual al Padre y al Hijo,
      ínclito Paráclito, = al ínclito Paráclito,
      sempitérna sit Beátæ = sea a la bienaventurada Trinidad
      Trinitáti glória, = la gloria sempiterna,
      cuius alma nos redémit = cuya gracia bondadosa nos redimió
      atque servat grátia. = y nos conserva.
  en-acetum-fel-arundo:
    titulo: En acétum, fel, arúndo
    amen: true
    estrofas:
    - |-
      En acétum, fel, arúndo, = He aquí el vinagre, la hiel, la caña,
      sputa, clavi, láncea; = los salivazos, los clavos, la lanza;
      mite corpus perforátur, = es perforado el cuerpo manso,
      sanguis, unda prófluit; = fluyen sangre y agua;
      terra, pontus, astra, mundus = ¡la tierra, el mar, los astros, el mundo,
      quo lavántur flúmine! = con qué río son lavados!
    - |-
      Crux fidélis, inter omnes = ¡Cruz fiel, entre todos
      arbor una nóbilis! = el único árbol noble!
      Nulla talem silva profert = Ningún bosque produce otro igual
      flore, fronde, gérmine. = en flor, en hoja, en fruto.
      Dulce lignum, dulci clavo = ¡Dulce leño, que con dulce clavo
      dulce pondus sústinens! = sostienes un dulce peso!
    - |-
      Flecte ramos, arbor alta, = Dobla tus ramas, árbol alto,
      tensa laxa víscera, = afloja tus entrañas tensas,
      et rigor lentéscat ille = y que se ablande aquella rigidez
      quem dedit natívitas, = que te dio la naturaleza,
      ut supérni membra regis = para que los miembros del rey celestial
      miti tendas stípite. = los extiendas en un tronco blando.
    - |-
      Sola digna tu fuísti = Solo tú fuiste digno
      ferre sæcli prétium, = de llevar el precio del mundo
      atque portum præparáre = y de preparar, como un navegante,
      nauta mundo náufrago, = el puerto al mundo náufrago,
      quem sacer cruor perúnxit = tú, a quien ungió la sangre sagrada
      fusus Agni córpore. = derramada del cuerpo del Cordero.
    - |-
      Æqua Patri Filióque, = Igual al Padre y al Hijo,
      ínclito Paráclito, = al ínclito Paráclito,
      sempitérna sit Beátæ = sea a la bienaventurada Trinidad
      Trinitáti glória, = la gloria sempiterna,
      cuius alma nos redémit = cuya gracia bondadosa nos redimió
      atque servat grátia. = y nos conserva.
  celsae-salutis-gaudia:
    titulo: Celsæ salútis gáudia
    amen: true
    estrofas:
    - |-
      Celsæ salútis gáudia = Los gozos de la excelsa salvación
      mundus fidélis iúbilet: = celebre con júbilo el mundo fiel:
      Iesus, redémptor ómnium, = Jesús, redentor de todos,
      mortis perémit príncipem. = aniquiló al príncipe de la muerte.
    - |-
      Palmæ et olívæ súrculos = Llevando por el camino ramos
      cœtus viándo déferens, = de palma y de olivo, la multitud
      «Hosánna David fílio» = «Hosanna al hijo de David»
      claris frequéntat vócibus. = repite con voces claras.
    - |-
      Nos ergo summo príncipi = Nosotros, pues, al príncipe supremo
      currámus omnes óbviam; = corramos todos al encuentro;
      melos canéntes glóriæ, = cantando melodías de gloria,
      palmas gerámus gáudii. = llevemos palmas de alegría.
    - |-
      Cursúsque nostros lúbricos = Y que nuestros pasos vacilantes
      donis beátis súblevet, = los levante con dones felices,
      grates ut omni témpore = para que en todo tiempo
      ipso ferámus débitas. = le demos las gracias debidas.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-memoriale-mortis-domini:
    titulo: O memoriále mortis Dómini
    amen: true
    estrofas:
    - |-
      O memoriále mortis Dómini, = Oh memorial de la muerte del Señor,
      panis vivus vitam præstans hómini, = pan vivo que das la vida al hombre,
      præsta meæ menti de te vívere = concede a mi mente vivir de ti
      et te illi semper dulce sápere. = y que siempre le sepas dulce.
    - |-
      Pie pelicáne, Iesu Dómine, = Piadoso pelícano, Señor Jesús,
      me immúndum munda tuo sánguine, = límpiame a mí, impuro, con tu sangre,
      cuius una stilla salvum fácere = de la que una sola gota puede salvar
      totum mundum quit ab omni scélere. = al mundo entero de todo crimen.
    - |-
      Te cum reveláta cernam fácie = Cuando te vea con el rostro descubierto,
      visu tandem lætus tuæ glóriæ, = alegre al fin con la visión de tu gloria,
      Patri, tibi laudes et Spirítui = al Padre, a ti y al Espíritu las alabanzas
      dicam beatórum iunctus cœ́tui. = diré, unido a la asamblea de los bienaventurados.
  salva-redemptor-plasma-tuum-nobile:
    titulo: Salva, Redémptor, plasma tuum nóbile
    amen: true
    estrofas:
    - |-
      Salva, Redémptor, plasma tuum nóbile, = Salva, Redentor, a tu noble criatura,
      signátum sancto vultus tui lúmine, = marcada con la santa luz de tu rostro;
      ne lacerári sinas fraude dǽmonum, = no permitas que la desgarre el engaño de los demonios,
      propter quod mortis exsolvísti prétium. = por la cual pagaste el precio de la muerte.
    - |-
      Dole captívos esse tuos sérvulos, = Duélete de que tus siervos estén cautivos,
      absólve reos, compedítos érige, = absuelve a los culpables, levanta a los encadenados,
      et quos cruóre redemísti próprio, = y a los que redimiste con tu propia sangre,
      rex bone, tecum fac gaudére pérpetim. = rey bueno, haz que se gocen contigo para siempre.
  crux-mundi-benedictio:
    titulo: Crux, mundi benedíctio
    amen: true
    estrofas:
    - |-
      Crux, mundi benedíctio, = Cruz, bendición del mundo,
      spes cértaque redémptio, = esperanza y redención segura,
      olim gehénnæ báiula, = en otro tiempo portadora del infierno,
      nunc clara cæli iánua, = ahora clara puerta del cielo:
    - |-
      In te levátur hóstia = en ti es levantada la víctima
      ad se qui traxit ómnia, = que atrajo hacia sí todas las cosas,
      quam mundi princeps ímpetit = a la que ataca el príncipe del mundo
      suúmque nihil ínvenit. = y no encuentra nada suyo.
    - |-
      Patri, tibi, Paráclito = Al Padre, a ti y al Paráclito
      sit æqua, Iesu, glória, = sea igual gloria, Jesús,
      qui nos crucis victória = que nos concedes gozar
      concédis usque pérfrui. = siempre de la victoria de la cruz.
  per-crucem-christe-quaesumus:
    titulo: Per crucem, Christe, quǽsumus
    amen: true
    estrofas:
    - |-
      Per crucem, Christe, quǽsumus, = Por la cruz, Cristo, te pedimos:
      ad vitæ transfer prǽmium = lleva al premio de la vida
      quos ligni fixus stípite = a los que, clavado en el madero,
      dignátus es redímere. = te dignaste redimir.
    - |-
      Tuæ legis artículus = Un artículo de tu ley
      vetus cassat chirógraphum; = anula el antiguo documento [de la deuda];
      antíqua perit sérvitus, = perece la antigua servidumbre,
      vera libértas rédditur. = se devuelve la verdadera libertad.
    - |-
      Patri, tibi, Paráclito = Al Padre, a ti y al Paráclito
      sit æqua, Iesu, glória, = sea igual gloria, Jesús,
      qui nos crucis victória = que nos concedes gozar
      concédis usque pérfrui. = siempre de la victoria de la cruz.
  christe-caelorum-domine:
    titulo: Christe, cælórum Dómine
    amen: true
    estrofas:
    - |-
      Christe, cælórum Dómine, = Cristo, Señor de los cielos,
      mundi salvátor máxime, = salvador supremo del mundo,
      qui crucis omnes múnere = que con el don de la cruz
      mortis solvísti légibus, = libraste a todos de las leyes de la muerte:
    - |-
      Te nunc orántes póscimus, = orando ahora, te pedimos
      tua consérves múnera, = que conserves tus dones,
      quæ sacra per mystéria = que por los sagrados misterios
      cunctis donásti géntibus. = diste a todas las naciones.
    - |-
      Tu agnus mitis, ínnocens, = Tú, cordero manso, inocente,
      oblátus terræ víctima, = ofrecido como víctima de la tierra,
      sanctórum vestes ómnium = lavaste con tu sangre
      tuo lavásti sánguine. = las vestiduras de todos los santos.
    - |-
      Quos redemísti prétio = A los que redimiste con el precio
      tui sacráti córporis, = de tu cuerpo sagrado,
      cælo resúrgens ádvehis = resucitando los llevas al cielo,
      ubi te laudant pérpetim. = donde te alaban para siempre.
    - |-
      Quorum nos addas número, = Que nos agregues a su número,
      te deprecámur, Dómine, = te suplicamos, Señor,
      qui Patri nos ex ómnibus = tú que de entre todos los pueblos
      fecísti regnum pópulis. = nos hiciste un reino para el Padre.
  tibi-redemptor-omnium:
    titulo: Tibi, Redémptor ómnium
    amen: true
    estrofas:
    - |-
      Tibi, Redémptor ómnium, = A ti, Redentor de todos,
      hymnum defléntes cánimus; = te cantamos un himno entre lágrimas;
      ignósce nobis, Dómine, = perdónanos, Señor,
      ignósce confiténtibus. = perdona a los que confiesan.
    - |-
      Qui vires hostis véteris = Tú que quebrantas por la cruz
      per crucem mortis cónteris, = las fuerzas del antiguo enemigo de la muerte,
      qua nos vexíllum fídei, = [cruz] que llevamos como estandarte de la fe,
      fronte signáti, férimus, = marcados en la frente,
    - |-
      Illum a nobis iúgiter = dígnate rechazarlo
      repéllere dignáveris, = continuamente de nosotros,
      ne possit umquam lǽdere = para que nunca pueda dañar
      redémptos tuo sánguine. = a los redimidos con tu sangre.
    - |-
      Qui propter nos ad ínferos = Tú que por nosotros a los infiernos
      descéndere dignátus es, = te dignaste descender,
      ut mortis debitóribus = para dar a los deudores de la muerte
      vitæ donáres múnera, = los dones de la vida,
    - |-
      Tu es qui certo témpore = tú eres quien, en el tiempo fijado,
      datúrus finem sǽculo, = al poner fin al mundo,
      iustus cunctórum mérita = justo remunerador, establecerás
      remunerátor státues. = los méritos de todos.
    - |-
      Te ergo, Christe, quǽsumus, = Te pedimos, pues, Cristo,
      ut nostra cures vúlnera, = que cures nuestras heridas,
      qui es cum Patre et Spíritu = tú que con el Padre y el Espíritu
      laudándus in perpétuum. = eres digno de alabanza para siempre.
  auctor-salutis-unice:
    titulo: Auctor salútis únice
    amen: true
    estrofas:
    - |-
      Auctor salútis únice, = Único autor de la salvación,
      mundi redémptor ínclite, = ínclito redentor del mundo,
      rex, Christe, nobis ánnue = rey, Cristo, concédenos
      crucis fecúndæ glóriam. = la gloria de la cruz fecunda.
    - |-
      Tu morte mortem díruens = Tú, destruyendo con la muerte la muerte
      vitámque vita lárgiens, = y dando la vida con la vida,
      mortis minístrum súbdolum = habías vencido al astuto
      devíceras diábolum. = ministro de la muerte, el diablo.
    - |-
      Piis amóris ártibus = Por las piadosas artes del amor
      somno sepúlcri tráditus, = entregado al sueño del sepulcro,
      sedes reclúdis ínferi = abres las moradas del infierno
      patrésque dicis líberos. = y declaras libres a los padres.
    - |-
      Nunc in Paréntis déxtera = Ahora, víctima sagrada que brillas
      sacráta fulgens víctima, = a la derecha del Padre,
      audi, precámur, vívido = escucha, te rogamos, a los redimidos
      tuo redémptos sánguine, = con tu sangre vivificante,
    - |-
      Quo te diébus ómnibus = para que, siguiéndote todos los días
      puris sequéntes móribus, = con costumbres puras,
      advérsus omnes ímpetus = contra todos los asaltos
      crucis ferámus lábarum. = llevemos el lábaro de la cruz.
    - |-
      Patri, tibi, Paráclito = Al Padre, a ti y al Paráclito
      sit æqua, Iesu, glória, = sea igual gloria, Jesús,
      qui nos crucis victória = que nos concedes gozar
      concédis usque pérfrui. = siempre de la victoria de la cruz.
  ad-cenam-agni-providi:
    titulo: Ad cenam Agni próvidi
    amen: true
    estrofas:
    - |-
      Ad cenam Agni próvidi, = Preparados para la cena del Cordero,
      stolis salútis cándidi, = blancos con las vestiduras de la salvación,
      post tránsitum maris Rubri = después del paso del mar Rojo
      Christo canámus príncipi. = cantemos a Cristo, nuestro príncipe.
    - |-
      Cuius corpus sanctíssimum = Su cuerpo santísimo,
      in ara crucis tórridum, = abrasado en el altar de la cruz,
      sed et cruórem róseum = y también su sangre rosada
      gustándo, Deo vívimus. = gustando, vivimos para Dios.
    - |-
      Protécti paschæ véspero = Protegidos en la tarde de la Pascua
      a devastánte ángelo, = del ángel exterminador,
      de Pharaónis áspero = del duro imperio del Faraón
      sumus erépti império. = hemos sido arrancados.
    - |-
      Iam pascha nostrum Christus est, = Ya Cristo es nuestra Pascua,
      agnus occísus ínnocens; = cordero inocente inmolado;
      sinceritátis ázyma = él, como ázimo de sinceridad,
      qui carnem suam óbtulit. = ofreció su carne.
    - |-
      O vera, digna hóstia, = ¡Oh víctima verdadera y digna,
      per quam frangúntur tártara, = por la que se quebranta el abismo,
      captíva plebs redímitur, = el pueblo cautivo es redimido
      reddúntur vitæ prǽmia! = y se devuelven los premios de la vida!
    - |-
      Consúrgit Christus túmulo, = Se levanta Cristo del sepulcro,
      victor redit de bárathro, = vuelve vencedor del abismo,
      tyránnum trudens vínculo = empujando al tirano encadenado
      et paradísum réserans. = y abriendo el paraíso.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-rex-aeterne-domine:
    titulo: O rex ætérne, Dómine
    amen: true
    estrofas:
    - |-
      O rex ætérne, Dómine, = Oh rey eterno, Señor,
      semper cum Patre Fílius, = Hijo siempre con el Padre,
      iuxta tuam imáginem = según tu imagen
      Adam plasmásti hóminem. = formaste al hombre Adán.
    - |-
      Quem diábolus decéperat = Al que el diablo había engañado,
      hostis humáni géneris, = enemigo del género humano,
      eius et formam córporis = de él también la forma del cuerpo
      sumpsísti tu de Vírgine, = tomaste tú de la Virgen,
    - |-
      Ut nos Deo coniúngeres = para unirnos a Dios
      per carnis contubérnium, = por la convivencia de la carne,
      datúrus in baptísmate, = para darnos en el bautismo,
      Redémptor, indulgéntiam. = Redentor, el perdón.
    - |-
      Tu crucem propter hóminem = Tú, por el hombre, la cruz
      suscípere dignátus es; = te dignaste tomar;
      dedísti tuum sánguinem = diste tu sangre
      nostræ salútis prétium. = como precio de nuestra salvación.
    - |-
      Tu surrexísti, glóriam = Tú resucitaste, recibiendo
      a Patre sumens débitam; = del Padre la gloria debida;
      per te et nos resúrgere = por ti también nosotros resucitaremos,
      devóta mente crédimus. = lo creemos con mente devota.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  iesu-redemptor-saeculi:
    titulo: Iesu, redémptor sǽculi
    amen: true
    estrofas:
    - |-
      Iesu, redémptor sǽculi, = Jesús, redentor del mundo,
      Verbum Patris altíssimi, = Verbo del Padre altísimo,
      lux lucis invisíbilis, = luz de la luz invisible,
      custos tuórum pérvigil: = guardián siempre en vela de los tuyos:
    - |-
      Tu fabricátor ómnium = tú, artífice de todas las cosas
      discrétor atque témporum, = y ordenador de los tiempos,
      fessa labóre córpora = a los cuerpos cansados por el trabajo
      noctis quiéte récrea. = recréalos con el descanso de la noche.
    - |-
      Qui frangis ima tártara, = Tú que quebrantas el profundo abismo,
      tu nos ab hoste líbera, = líbranos del enemigo,
      ne váleat sedúcere = para que no pueda seducir
      tuo redémptos sánguine, = a los redimidos con tu sangre,
    - |-
      Ut, dum graváti córpore = para que, mientras, cargados con el cuerpo,
      brevi manémus témpore, = permanecemos un breve tiempo,
      sic caro nostra dórmiat = nuestra carne duerma de tal modo
      ut mens sopórem nésciat. = que la mente no conozca el sopor.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  hic-est-dies-verus-dei:
    titulo: Hic est dies verus Dei
    amen: true
    estrofas:
    - |-
      Hic est dies verus Dei, = Este es el verdadero día de Dios,
      sancto serénus lúmine, = sereno con la santa luz,
      quo díluit sanguis sacer = en el que la sangre sagrada lavó
      probrósa mundi crímina. = los vergonzosos crímenes del mundo.
    - |-
      Fidem refúndit pérditis = Devuelve la fe a los perdidos
      cæcósque visu illúminat; = e ilumina con la vista a los ciegos;
      quem non gravi solvit metu = ¿a quién no libra de un grave temor
      latrónis absolútio? = la absolución del ladrón?
    - |-
      Opus stupent et ángeli, = Se asombran de la obra también los ángeles,
      pœnam vidéntes córporis = viendo el castigo del cuerpo
      Christóque adhæréntem reum = y al culpable, unido a Cristo,
      vitam beátam cárpere. = alcanzar la vida bienaventurada.
    - |-
      Mystérium mirábile, = Misterio admirable:
      ut ábluat mundi luem, = que, para lavar la mancha del mundo,
      peccáta tollat ómnium = quite los pecados de todos
      carnis vítia mundans caro, = la carne, purificando los vicios de la carne.
    - |-
      Quid hoc potest sublímius, = ¿Qué puede haber más sublime que esto:
      ut culpa quærat grátiam, = que la culpa busque la gracia,
      metúmque solvat cáritas = que la caridad disipe el temor
      reddátque mors vitam novam? = y que la muerte devuelva una vida nueva?
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  laetare-caelum-desuper:
    titulo: Lætáre, cælum, désuper
    amen: true
    estrofas:
    - |-
      Lætáre, cælum, désuper, = Alégrate, cielo, desde lo alto,
      appláude, tellus ac mare: = aplaudan la tierra y el mar:
      Christus resúrgens post crucem = Cristo, resucitando después de la cruz,
      vitam dedit mortálibus. = dio la vida a los mortales.
    - |-
      Iam tempus accéptum redit, = Ya vuelve el tiempo favorable,
      dies salútis cérnitur, = se ve el día de la salvación,
      quo mundus Agni sánguine = en el que el mundo, por la sangre del Cordero,
      refúlsit a calígine. = resplandeció [saliendo] de la oscuridad.
    - |-
      Mors illa, mortis pássio, = Aquella muerte, pasión de la muerte,
      est críminis remíssio; = es el perdón del pecado;
      illǽsa virtus pérmanet, = el poder permanece intacto;
      victus dedit victóriam. = el vencido dio la victoria.
    - |-
      Nostræ fuit gustus spei = Esta fue una prueba anticipada de nuestra esperanza,
      hic, ut fidéles créderent = para que los fieles creyeran
      se posse post resúrgere, = que podrán después resucitar
      vitam beátam súmere. = y alcanzar la vida bienaventurada.
    - |-
      Nunc ergo pascha cándidum = Ahora, pues, la Pascua luminosa,
      causa bonórum tálium = causa de tales bienes,
      colámus omnes strénue = celebrémosla todos con empeño,
      tanto repléti múnere. = llenos de tan gran don.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  aurora-lucis-rutilat:
    titulo: Auróra lucis rútilat
    amen: true
    estrofas:
    - |-
      Auróra lucis rútilat, = La aurora de la luz resplandece,
      cælum resúltat láudibus, = el cielo resuena de alabanzas,
      mundus exsúltans iúbilat, = el mundo exultante se regocija,
      gemens inférnus úlulat, = el infierno gime y aúlla,
    - |-
      Cum rex ille fortíssimus, = cuando aquel rey fortísimo,
      mortis confráctis víribus, = quebrantadas las fuerzas de la muerte,
      pede concúlcans tártara = pisoteando con su pie el abismo,
      solvit caténa míseros. = libra de la cadena a los desdichados.
    - |-
      Ille, quem clausum lápide = Aquel a quien, encerrado bajo la piedra,
      miles custódit ácriter, = el soldado custodia con rigor,
      triúmphans pompa nóbili, = triunfando con noble cortejo,
      victor surgit de fúnere. = se levanta vencedor del sepulcro.
    - |-
      Inférni iam gemítibus = Ya acabados los gemidos
      solútis et dolóribus, = y los dolores del infierno,
      quia surréxit Dóminus = porque resucitó el Señor,
      respléndens clamat ángelus. = clama el ángel resplandeciente.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  chorus-novae-ierusalem:
    titulo: Chorus novæ Ierúsalem
    amen: true
    estrofas:
    - |-
      Chorus novæ Ierúsalem = El coro de la nueva Jerusalén
      hymni novam dulcédinem = entone la nueva dulzura del himno,
      promat, colens cum sóbriis = celebrando con gozos sobrios
      paschále festum gáudiis, = la fiesta pascual,
    - |-
      Quo Christus invíctus leo, = en la que Cristo, león invicto,
      dracóne surgens óbruto, = levantándose tras aplastar al dragón,
      dum voce viva pérsonat, = mientras resuena su voz viva,
      a morte functos éxcitat. = despierta de la muerte a los difuntos.
    - |-
      Quam devorárat ímprobus, = La presa que había devorado,
      prædam refúndit tártarus; = el malvado abismo la devuelve;
      captivitáte líbera = libres de la cautividad,
      Iesum sequúntur ágmina. = las multitudes siguen a Jesús.
    - |-
      Triúmphat ille spléndide = Él triunfa espléndidamente
      et dignus amplitúdine, = y, digno de su grandeza,
      soli políque pátriam = de la tierra y del cielo hace una sola patria,
      unam facit rem públicam. = una sola república.
    - |-
      Ipsum canéndo súpplices = Cantándole, como soldados,
      Regem precémur mílites, = supliquemos al Rey
      ut in suo claríssimo = que en su clarísimo palacio
      nos órdinet palátio. = nos dé un lugar.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  iam-surgit-hora-tertia:
    titulo: Iam surgit hora tértia
    amen: true
    estrofas:
    - |-
      Iam surgit hora tértia, = Ya llega la hora tercia,
      qua Christus ascéndit crucem; = en la que Cristo subió a la cruz;
      nil ínsolens mens cógitet, = que la mente no piense nada soberbio,
      inténdat afféctum precis. = que dirija su afecto a la oración.
    - |-
      Qui corde Christum súscipit, = Quien recibe a Cristo en su corazón
      innóxium sensum gerit = tiene un sentir inocente
      votísque præstat sédulis = y con votos constantes consigue
      Sanctum meréri Spíritum. = merecer el Espíritu Santo.
    - |-
      Hæc hora, quæ finem dedit = Esta es la hora que puso fin
      diri vetérno críminis; = al antiguo letargo del cruel pecado;
      hinc iam beáta témpora = desde aquí comenzaron ya los tiempos dichosos
      cœpére Christi grátia. = por la gracia de Cristo.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  venite-servi-supplices:
    titulo: Veníte, servi, súpplices
    amen: true
    estrofas:
    - |-
      Veníte, servi, súpplices, = Venid, siervos, suplicantes,
      et mente et ore extóllite = y con la mente y con la boca ensalzad
      dignis beátum láudibus = con alabanzas dignas
      nomen Dei cum cántico. = el nombre bienaventurado de Dios, con un cántico.
    - |-
      Hoc namque tempus illud est, = Porque este es aquel tiempo
      quo sæculórum iúdicem = en que al juez de los siglos
      iniústa morti trádidit = entregó a la muerte
      mortálium senténtia. = la sentencia injusta de los mortales.
    - |-
      Et nos amóre débito, = Y nosotros, con el amor debido,
      timóre iusto súbditi, = sometidos con justo temor,
      advérsus omnes ímpetus = contra todos los asaltos
      quos sævus hostis íncutit, = que lanza el enemigo cruel,
    - |-
      Unum rogémus et Patrem = roguemos al único [Dios], Padre,
      Deum regémque Fílium = y al Hijo, Dios y rey,
      simúlque Sanctum Spíritum, = y a la vez al Espíritu Santo,
      in Trinitáte Dóminum. = Señor en la Trinidad.
  haec-hora-quae-resplenduit:
    titulo: Hæc hora, quæ resplénduit
    amen: true
    estrofas:
    - |-
      Hæc hora, quæ resplénduit = Esta es la hora que resplandeció
      crucísque solvit núbila, = y disipó las nubes de la cruz,
      mundum ténebris éxuens, = despojando al mundo de las tinieblas,
      reddens seréna lúmina. = devolviendo la luz serena.
    - |-
      Hæc hora, qua resúscitans = Esta es la hora en que, resucitando
      Iesus sepúlcris córpora, = Jesús los cuerpos de los sepulcros,
      prodíre mortis líbera = les mandó salir libres de la muerte,
      iussit refúso spíritu. = devuelto el espíritu.
    - |-
      Nováta sæcla crédimus = Creemos que los siglos renovados,
      mortis solútis légibus, = rotas las leyes de la muerte,
      vitæ beátæ múnera = corren un curso perenne
      cursum perénnem cúrrere. = de dones de la vida bienaventurada.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui morte victa prǽnites, = que, vencida la muerte, resplandeces,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  iesu-nostra-redemptio:
    titulo: Iesu, nostra redémptio
    amen: true
    estrofas:
    - |-
      Iesu, nostra redémptio = Jesús, nuestra redención,
      amor et desidérium, = amor y deseo,
      Deus creátor ómnium, = Dios creador de todas las cosas,
      homo in fine témporum, = hombre al final de los tiempos:
    - |-
      Quæ te vicit cleméntia, = ¿qué clemencia te venció
      ut ferres nostra crímina, = para que cargaras con nuestros pecados,
      crudélem mortem pátiens, = padeciendo una muerte cruel
      ut nos a morte tólleres; = para arrancarnos de la muerte,
    - |-
      Inférni claustra pénetrans, = penetrando los cerrojos del infierno,
      tuos captívos rédimens; = redimiendo a tus cautivos,
      victor triúmpho nóbili = vencedor con noble triunfo,
      ad dextram Patris résidens? = sentado a la derecha del Padre?
    - |-
      Ipsa te cogat píetas, = Que esa misma piedad te mueva
      ut mala nostra súperes = a vencer nuestros males
      parcéndo, et voti cómpotes = perdonando, y, cumplido nuestro deseo,
      nos tuo vultu sáties. = a saciarnos con tu rostro.
    - |-
      Tu esto nostrum gáudium, = Sé tú nuestro gozo,
      qui es futúrus prǽmium; = tú que serás nuestro premio;
      sit nostra in te glória = sea nuestra gloria en ti
      per cuncta semper sǽcula. = siempre, por todos los siglos.
  aeterne-rex-altissime:
    titulo: Ætérne rex altíssime
    amen: true
    estrofas:
    - |-
      Ætérne rex altíssime, = Rey eterno y altísimo,
      redémptor et fidélium, = redentor también de los fieles,
      quo mors solúta déperit, = por quien la muerte, deshecha, perece
      datur triúmphus grátiæ, = y se da el triunfo de la gracia:
    - |-
      Scandis tribúnal déxteræ = subes al tribunal de la derecha
      Patris tibíque cǽlitus = del Padre, y desde el cielo se te
      fertur potéstas ómnium, = confiere el poder sobre todas las cosas,
      quæ non erat humánitus, = que no tenías en lo humano,
    - |-
      Ut trina rerum máchina = para que la triple estructura de las cosas
      cæléstium, terréstrium = de lo celeste, de lo terrestre
      et inferórum cóndita, = y de lo infernal, creada,
      flectat genu iam súbdita. = doble ya, sometida, la rodilla.
    - |-
      Tremunt vidéntes ángeli = Tiemblan los ángeles al ver
      versam vicem mortálium; = cambiada la suerte de los mortales;
      culpat caro, purgat caro, = la carne peca, la carne purifica,
      regnat caro Verbum Dei. = reina la carne, Verbo de Dios.
    - |-
      Tu, Christe, nostrum gáudium, = Tú, Cristo, gozo nuestro,
      manens perénne prǽmium, = que permaneces como premio perenne,
      mundi regis qui fábricam, = que gobiernas la fábrica del mundo,
      mundána vincens gáudia. = venciendo los gozos mundanos:
    - |-
      Hinc te precántes quǽsumus, = por eso, suplicantes, te pedimos:
      ignósce culpis ómnibus = perdona todas nuestras culpas
      et corda sursum súbleva = y levanta los corazones hacia lo alto,
      ad te supérna grátia, = hacia ti, con la gracia celestial,
    - |-
      Ut, cum rubénte cœ́peris = para que, cuando comiences a brillar,
      clarére nube iúdicis, = juez, en la nube rojiza,
      pœnas repéllas débitas, = apartes las penas merecidas
      reddas corónas pérditas. = y devuelvas las coronas perdidas.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui scandis ad cæléstia, = que subes a lo celestial,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  optatus-votis-omnium:
    titulo: Optátus votis ómnium
    amen: true
    estrofas:
    - |-
      Optátus votis ómnium = Deseado por los votos de todos,
      sacrátus illúxit dies, = ha amanecido el día sagrado
      quo Christus, mundi spes, Deus, = en que Cristo, esperanza del mundo, Dios,
      conscéndit cælos árduos. = subió a los altos cielos,
    - |-
      Magni triúmphum prœ́lii, = el triunfo del gran combate,
      mundi perémpto príncipe, = aniquilado el príncipe del mundo,
      Patris præséntans vúltibus = presentando a la mirada del Padre
      victrícis carnis glóriam. = la gloria de la carne vencedora.
    - |-
      In nube fertur lúcida = Es llevado en una nube luminosa
      et spem facit credéntibus, = y da esperanza a los creyentes,
      iam paradísum réserans = abriendo ya el paraíso
      quem protoplásti cláuserant. = que los primeros padres habían cerrado.
    - |-
      O grande cunctis gáudium, = ¡Oh gran gozo para todos:
      quod partus nostræ Vírginis, = que el Hijo de nuestra Virgen,
      post sputa, flagra, post crucem = después de los salivazos, los azotes, después de la cruz,
      patérnæ sedi iúngitur. = se une al trono del Padre!
    - |-
      Agámus ergo grátias = Demos, pues, gracias
      nostræ salútis víndici, = al vengador de nuestra salvación,
      nostrum quod corpus véxerit = porque llevó nuestro cuerpo
      sublíme ad cæli régiam. = a lo alto, al palacio del cielo.
    - |-
      Sit nobis cum cæléstibus = Que sea para nosotros con los del cielo
      commúne manens gáudium: = un gozo común y permanente:
      illis, quod semet óbtulit, = para ellos, porque se les ofreció;
      nobis, quod se non ábstulit. = para nosotros, porque no se nos quitó.
    - |-
      Nunc, Christe, scandens ǽthera = Ahora, Cristo, que subes al cielo,
      ad te cor nostrum súbleva, = eleva hacia ti nuestro corazón,
      tuum Patrísque Spíritum = enviándonos desde el cielo
      emíttens nobis cǽlitus. = tu Espíritu y el del Padre.
  veni-creator-spiritus:
    titulo: Veni, creátor Spíritus
    amen: true
    estrofas:
    - |-
      Veni, creátor Spíritus, = Ven, Espíritu creador,
      mentes tuórum vísita, = visita las mentes de los tuyos,
      imple supérna grátia, = llena de la gracia de lo alto
      quæ tu creásti, péctora. = los corazones que tú creaste.
    - |-
      Qui díceris Paráclitus, = Tú que eres llamado Paráclito,
      donum Dei altíssimi, = don del Dios altísimo,
      fons vivus, ignis, cáritas = fuente viva, fuego, caridad
      et spiritális únctio. = y unción espiritual.
    - |-
      Tu septifórmis múnere, = Tú, septiforme en tus dones,
      dextræ Dei tu dígitus, = tú, dedo de la diestra de Dios,
      tu rite promíssum Patris = tú, el prometido solemnemente por el Padre,
      sermóne ditans gúttura. = que enriqueces las gargantas con la palabra.
    - |-
      Accénde lumen sénsibus, = Enciende tu luz en los sentidos,
      infúnde amórem córdibus, = infunde amor en los corazones,
      infírma nostri córporis, = fortaleciendo lo débil de nuestro cuerpo
      virtúte firmans pérpeti. = con tu fuerza perpetua.
    - |-
      Hostem repéllas lóngius = Aleja más y más al enemigo
      pacémque dones prótinus; = y danos pronto la paz;
      ductóre sic te prǽvio = yendo tú así delante como guía,
      vitémus omne nóxium. = evitemos todo lo dañino.
    - |-
      Per te sciámus da Patrem = Concédenos conocer por ti al Padre
      noscámus atque Fílium, = y conocer también al Hijo,
      te utriúsque Spíritum = y en ti, Espíritu de ambos,
      credámus omni témpore. = creamos en todo tiempo.
  lux-iucunda-lux-insignis:
    titulo: Lux iucúnda, lux insígnis
    amen: true
    estrofas:
    - |-
      Lux iucúnda, lux insígnis, = Luz alegre, luz insigne,
      qua de throno missus ignis = en la que, enviado desde el trono, el fuego
      in Christi discípulos, = [vino] sobre los discípulos de Cristo:
      corda replet, linguas ditat, = llena los corazones, enriquece las lenguas,
      ad concórdes nos invítat = nos invita a melodías concordes
      cordis, linguæ módulos. = del corazón y de la lengua.
    - |-
      Consolátor alme, veni, = Consolador bondadoso, ven,
      linguas rege, corda leni: = gobierna las lenguas, suaviza los corazones:
      nihil fellis aut venéni = nada de hiel ni de veneno
      sub tua præséntia. = en tu presencia.
    - |-
      Nova facti creatúra, = Hechos una nueva criatura,
      te laudámus mente pura, = te alabamos con mente pura,
      grátiæ nunc, sed natúra = ahora hijos de la gracia, pero por naturaleza
      prius iræ fílii. = antes hijos de la ira.
    - |-
      Tu qui dator es et donum, = Tú que eres dador y don,
      nostri cordis omne bonum, = todo el bien de nuestro corazón,
      cor ad laudem redde pronum, = haz el corazón inclinado a la alabanza,
      nostræ linguæ formans sonum = formando el sonido de nuestra lengua
      in tua præcónia. = para tus alabanzas.
    - |-
      Tu nos purges a peccátis, = Purifícanos de los pecados,
      auctor ipse pietátis, = tú, autor mismo de la piedad,
      et in Christo renovátis = y a nosotros, renovados en Cristo,
      da perféctæ novitátis = danos los plenos gozos
      plena nobis gáudia. = de la perfecta novedad.
  beata-nobis-gaudia:
    titulo: Beáta nobis gáudia
    amen: true
    estrofas:
    - |-
      Beáta nobis gáudia = Gozos bienaventurados
      anni redúxit órbita, = nos ha traído el curso del año,
      cum Spíritus Paráclitus = cuando el Espíritu Paráclito
      effúlsit in discípulos. = brilló sobre los discípulos.
    - |-
      Ignis vibránte lúmine = El fuego, con luz vibrante,
      linguæ figúram détulit, = tomó la forma de lengua,
      verbis ut essent próflui = para que fueran abundantes en palabras
      et caritáte férvidi. = y fervientes en caridad.
    - |-
      Linguis loquúntur ómnium; = Hablan las lenguas de todos;
      turbæ pavent gentílium, = se espantan las multitudes de los gentiles,
      musto madére députant, = juzgan que están ebrios de mosto
      quos Spíritus repléverat. = los que el Espíritu había llenado.
    - |-
      Patráta sunt hæc mýstice = Esto se cumplió místicamente
      Paschæ perácto témpore, = acabado el tiempo de la Pascua,
      sacro diérum número, = en el número sagrado de los días,
      quo lege fit remíssio. = en que por la ley se hace la remisión.
    - |-
      Te nunc, Deus piíssime, = A ti ahora, Dios piadosísimo,
      vultu precámur cérnuo: = te rogamos con el rostro inclinado:
      illápsa nobis cǽlitus = concédenos los dones
      largíre dona, o Spíritus. = que bajaron del cielo, oh Espíritu.
    - |-
      Dudum sacráta péctora = En otro tiempo llenaste con tu gracia
      tua replésti grátia; = los corazones consagrados;
      dimítte nunc peccámina = perdona ahora los pecados
      et da quiéta témpora. = y danos tiempos tranquilos.
    - |-
      Per te sciámus da Patrem = Concédenos conocer por ti al Padre
      noscámus atque Fílium, = y conocer también al Hijo,
      te utriúsque Spíritum = y en ti, Espíritu de ambos,
      credámus omni témpore. = creamos en todo tiempo.
  iam-christus-astra-ascenderat:
    titulo: Iam Christus astra ascénderat
    amen: true
    estrofas:
    - |-
      Iam Christus astra ascénderat, = Ya Cristo había subido a los astros,
      regréssus unde vénerat, = volviendo de donde había venido,
      promíssa Patris múnera, = para dar el don prometido del Padre,
      Sanctum datúrus Spíritum, = el Espíritu Santo,
    - |-
      Cum hora felix tértia = cuando la feliz hora tercia
      repénte mundo íntonat, = de repente resuena en el mundo,
      Apóstolis orántibus = anunciando a los apóstoles en oración
      Deum venísse núntians. = que Dios había venido.
    - |-
      De Patris ergo lúmine = De la luz del Padre, pues,
      decórus ignis almus est, = es el fuego hermoso y bondadoso
      qui fida Christi péctora = que llena los corazones fieles a Cristo
      calóre verbi cómpleat. = con el calor de la palabra.
    - |-
      Descénde, Sancte Spíritus, = Desciende, Espíritu Santo,
      ad nostra corda altária = a nuestros corazones, altares;
      orna tibi virtútibus, = adórnalos para ti con virtudes
      tibíque templa dédica. = y conságralos como templos para ti.
    - |-
      Per te sciámus da Patrem = Concédenos conocer por ti al Padre
      noscámus atque Fílium, = y conocer también al Hijo,
      te utriúsque Spíritum = y en ti, Espíritu de ambos,
      credámus omni témpore. = creamos en todo tiempo.
  urbs-ierusalem-beata:
    titulo: Urbs Ierúsalem beáta
    amen: true
    estrofas:
    - |-
      Urbs Ierúsalem beáta, = Ciudad de Jerusalén bienaventurada,
      dicta pacis vísio, = llamada visión de paz,
      quæ constrúitur in cælis = que se construye en los cielos
      vivis ex lapídibus, = con piedras vivas,
      angelísque coronáta = y coronada por los ángeles
      sicut sponsa cómite, = como una esposa por su cortejo:
    - |-
      Nova véniens e cælo, = nueva, viniendo del cielo,
      nuptiáli thálamo = preparada para la cámara nupcial,
      præparáta, ut intácta = para unirse intacta
      copulétur Dómino. = al Señor.
      Platéæ et muri eius = Sus plazas y sus muros
      ex auro puríssimo; = son de oro purísimo;
    - |-
      Portæ nitent margarítis = las puertas brillan con perlas,
      ádytis paténtibus, = con los santuarios abiertos,
      et virtúte meritórum = y por la fuerza de los méritos
      illuc introdúcitur = es introducido allí
      omnis qui ob Christi nomen = todo el que por el nombre de Cristo
      hic in mundo prémitur. = es oprimido aquí en el mundo.
    - |-
      Tunsiónibus, pressúris = Pulidas por golpes y presiones,
      expolíti lápides = las piedras
      suis coaptántur locis = se ajustan en su lugar
      per manum artíficis; = por la mano del artífice;
      disponúntur permansúri = se disponen para permanecer
      sacris ædifíciis. = en los edificios sagrados.
    - |-
      Glória et honor Deo = Gloria y honor a Dios
      usquequáque altíssimo, = altísimo en todas partes,
      una Patri Filióque = a la vez al Padre y al Hijo
      atque Sancto Flámini, = y al Espíritu Santo,
      quibus laudes et potéstas = a quienes las alabanzas y el poder
      per ætérna sǽcula. = por los siglos eternos.
  christe-cunctorum-dominator-alme:
    titulo: Christe, cunctórum dominátor alme
    amen: true
    estrofas:
    - |-
      Christe, cunctórum dominátor alme, = Cristo, soberano bondadoso de todas las cosas,
      plebs tibi supplex résonet in aula, = que tu pueblo suplicante resuene en el templo,
      ánnuo cuius rédeunt colénda = cuyas fiestas, que han de celebrarse, vuelven
      témpore festa. = cada año.
    - |-
      Hic locus nempe vocitátur aula = Este lugar, en efecto, es llamado palacio
      regis imménsi nitidíque cæli = del rey inmenso, y del cielo resplandeciente
      porta, quæ vitæ pátriam peténtes = puerta, que a todos los que buscan la patria de la vida
      áccipit omnes. = recibe.
    - |-
      Hæc tuam plebem sacra cogit ædes, = Esta casa sagrada reúne a tu pueblo,
      hæc sacraméntis pia ditat usque, = esta, piadosa, lo enriquece siempre con los sacramentos,
      cǽlicis escis alit in perénnis = lo alimenta con manjares celestiales para los dones
      múnera vitæ. = de la vida perenne.
    - |-
      Quǽsumus ergo, Deus, ut seréno = Te pedimos, pues, oh Dios, que con rostro sereno
      ádnuas vultu fámulos gubérnans, = asientas, gobernando a tus siervos,
      qui tui summo célebrant amóre = que con sumo amor celebran
      gáudia templi. = los gozos de tu templo.
    - |-
      Æqua laus summum célebret Paréntem = Que una alabanza igual celebre al Padre altísimo
      teque, Salvátor, pie rex, per ævum; = y a ti, Salvador, rey piadoso, por siempre;
      Spíritus Sancti résonet per omnem = que la gloria del Espíritu Santo resuene
      glória mundum. = por todo el mundo.
  angularis-fundamentum:
    titulo: Anguláris fundaméntum
    amen: true
    estrofas:
    - |-
      Anguláris fundaméntum = Como fundamento angular
      lapis Christus missus est, = ha sido puesta la piedra, Cristo,
      qui paríetum compáge = que en la trabazón de las paredes
      in utróque néctitur, = se une a ambos lados;
      quem Sion sancta suscépit, = a quien recibió la santa Sion,
      in quo credens pérmanet. = en quien permanece el creyente.
    - |-
      Omnis illa Deo sacra = Toda aquella ciudad sagrada
      et dilécta cívitas, = y amada por Dios,
      plena módulis in laude = llena de melodías en la alabanza
      et canóre iúbilo, = y de canto jubiloso,
      trinum Deum unicúmque = al Dios trino y uno
      cum fervóre prǽdicat. = proclama con fervor.
    - |-
      Hoc in templo, summe Deus, = A este templo, Dios altísimo,
      exorátus ádveni, = ven, invocado,
      et cleménti bonitáte = y con bondad clemente
      precum vota súscipe; = recibe los votos de las súplicas;
      largam benedictiónem = derrama aquí continuamente
      hic infúnde iúgiter. = una abundante bendición.
    - |-
      Hic promereántur omnes = Que aquí merezcan todos
      petíta acquírere = obtener lo que pidan
      et adépta possidére = y poseer lo alcanzado
      cum sanctis perénniter, = con los santos para siempre,
      paradísum introíre = y entrar en el paraíso,
      transláti in réquiem. = trasladados al descanso.
    - |-
      Glória et honor Deo = Gloria y honor a Dios
      usquequáque altíssimo, = altísimo en todas partes,
      una Patri Filióque = a la vez al Padre y al Hijo
      atque Sancto Flámini, = y al Espíritu Santo,
      quibus laudes et potéstas = a quienes las alabanzas y el poder
      per ætérna sǽcula. = por los siglos eternos.
  maria-quae-mortalium:
    titulo: María, quæ mortálium
    amen: true
    estrofas:
    - |-
      María, quæ mortálium = María, que recibes con amor
      preces amánter éxcipis, = las súplicas de los mortales,
      rogámus ecce súpplices, = he aquí que te rogamos suplicantes:
      nobis adésto pérpetim. = asístenos siempre.
    - |-
      Adésto, si nos críminum = Asístenos, si la horrible cadena
      caténa stringit hórrida; = de los pecados nos aprieta;
      cito resólve cómpedes = desata pronto los grillos
      quæ corda culpis ílligant. = que atan los corazones con las culpas.
    - |-
      Succúrre, si nos sǽculi = Socórrenos, si la imagen engañosa
      fallax imágo péllicit, = del mundo nos seduce,
      ne mens salútis trámitem, = para que la mente no abandone el camino
      oblíta cæli, déserat. = de la salvación, olvidada del cielo.
    - |-
      Succúrre, si vel córpori = Socórrenos, si una suerte adversa
      advérsa sors impéndeat; = amenaza también al cuerpo;
      fac sint quiéta témpora, = haz que los tiempos sean tranquilos,
      ætérnitas dum lúceat. = mientras brilla la eternidad.
    - |-
      Tuis et esto fíliis = Y sé para tus hijos
      tutéla mortis témpore, = amparo en la hora de la muerte,
      ut, te iuvánte, cónsequi = para que, con tu ayuda, se nos conceda
      perénne detur prǽmium. = alcanzar el premio perenne.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui veste te mirábili = que te rodearon con el admirable
      circumdedérunt grátiæ. = vestido de la gracia.
  quem-terra-pontus-aethera:
    titulo: Quem terra, pontus, ǽthera
    amen: true
    estrofas:
    - |-
      Quem terra, pontus, ǽthera = Al que la tierra, el mar y el cielo
      colunt, adórant, prǽdicant = veneran, adoran y proclaman,
      trinam regéntem máchinam, = el que rige la triple estructura [del mundo],
      claustrum Maríæ báiulat. = lo lleva el seno de María.
    - |-
      Cui luna, sol et ómnia = Aquel a quien la luna, el sol y todas las cosas
      desérviunt per témpora, = sirven a través de los tiempos,
      perfúsa cæli grátia = inundadas por la gracia del cielo,
      gestant puéllæ víscera. = lo llevan las entrañas de una doncella.
    - |-
      Beáta mater múnere, = Madre dichosa por el don [recibido],
      cuius, supérnus ártifex, = en cuyo seno, como en un arca,
      mundum pugíllo cóntinens, = quedó encerrado el artífice celestial,
      ventris sub arca clausus est. = que contiene el mundo en su puño.
    - |-
      Beáta cæli núntio, = Dichosa por el mensaje del cielo,
      fecúnda Sancto Spíritu, = fecunda por el Espíritu Santo,
      desiderátus géntibus = por cuyo seno fue dado a luz
      cuius per alvum fusus est. = el deseado de las naciones.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-gloriosa-domina:
    titulo: O gloriósa dómina
    amen: true
    estrofas:
    - |-
      O gloriósa dómina, = Oh gloriosa señora,
      excélsa super sídera, = excelsa sobre los astros,
      qui te creávit próvide, = al que te creó con providencia
      lactas sacráto úbere. = lo amamantas con tu pecho sagrado.
    - |-
      Quod Eva tristis ábstulit, = Lo que la triste Eva quitó,
      tu reddis almo gérmine; = tú lo devuelves con tu fruto bondadoso;
      intrent ut astra flébiles, = para que los que lloran entren en los astros,
      sternis benígna sémitam. = benigna, preparas el camino.
    - |-
      Tu regis alti iánua = Tú eres la entrada del rey altísimo
      et porta lucis fúlgida; = y la puerta resplandeciente de la luz;
      vitam datam per Vírginem, = la vida dada por la Virgen,
      gentes redémptæ, pláudite. = pueblos redimidos, aplaudidla.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui veste te mirábili = que te rodearon con el admirable
      circumdedérunt grátiæ. = vestido de la gracia.
  ave-maris-stella:
    titulo: Ave, maris stella
    amen: true
    estrofas:
    - |-
      Ave, maris stella, = Salve, estrella del mar,
      Dei mater alma, = madre bondadosa de Dios,
      atque semper virgo, = y siempre virgen,
      felix cæli porta. = feliz puerta del cielo.
    - |-
      Sumens illud «Ave» = Recibiendo aquel «Ave»
      Gabriélis ore, = de la boca de Gabriel,
      funda nos in pace, = afiánzanos en la paz,
      mutans Evæ nomen. = cambiando el nombre de Eva.
    - |-
      Solve vincla reis, = Desata las cadenas de los culpables,
      profer lumen cæcis, = da luz a los ciegos,
      mala nostra pelle, = aleja nuestros males,
      bona cuncta posce. = pide para nosotros todos los bienes.
    - |-
      Monstra te esse matrem, = Muestra que eres madre;
      sumat per te precem = que reciba por ti nuestra súplica
      qui pro nobis natus = el que, nacido por nosotros,
      tulit esse tuus. = aceptó ser tuyo.
    - |-
      Virgo singuláris, = Virgen singular,
      inter omnes mitis, = mansa entre todas,
      nos culpis solútos = a nosotros, libres de culpas,
      mites fac et castos. = haznos mansos y castos.
    - |-
      Vitam præsta puram, = Concede una vida pura,
      iter para tutum, = prepara un camino seguro,
      ut vidéntes Iesum = para que, viendo a Jesús,
      semper collætémur. = nos alegremos siempre juntos.
    - |-
      Sit laus Deo Patri, = Alabanza a Dios Padre,
      summo Christo decus, = honor a Cristo altísimo,
      Spirítui Sancto = al Espíritu Santo
      honor, tribus unus. = honra, a los tres, uno solo.
  o-virgo-mater-filia:
    titulo: O virgo mater, fília
    amen: true
    estrofas:
    - |-
      O virgo mater, fília = Oh virgen madre, hija
      tui beáta Fílii, = de tu Hijo, bienaventurada,
      sublímis et humíllima = sublime y humildísima
      præ creatúris ómnibus. = más que todas las criaturas.
    - |-
      Divíni tu consílii = Tú eres el término fijado desde siempre
      fixus ab ævo términus, = del designio divino,
      tu decus et fastígium = tú, el honor y la cumbre más alta
      natúræ nostræ máximum: = de nuestra naturaleza:
    - |-
      Quam sic prompsísti nóbilem = tú la ennobleciste de tal modo
      ut summus eius cónditor = que su supremo creador
      in ipsa per te fíeret = se hiciera, por ti, en ella misma,
      arte miránda cónditus. = con arte admirable, criatura.
    - |-
      In útero virgíneo = En el seno virginal
      amor revíxit ígneus, = revivió el amor ardiente,
      cuius calóre gérminant = por cuyo calor germinan
      flores in terra cǽlici. = en la tierra flores del cielo.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui veste te mirábili = que te rodearon con el admirable
      circumdedérunt grátiæ. = vestido de la gracia.
  quae-caritatis-fulgidum:
    titulo: Quæ caritátis fúlgidum
    amen: true
    estrofas:
    - |-
      Quæ caritátis fúlgidum = Tú que eres, Virgen, para los del cielo
      es astrum, Virgo, súperis, = el astro resplandeciente de la caridad,
      spei nobis mortálibus = para nosotros, los mortales, eres de la esperanza
      fons vivax es et prófluus. = fuente viva y abundante.
    - |-
      Sic vales, celsa Dómina, = Tanto puedes, excelsa Señora,
      in Nati cor piíssimi, = ante el corazón de tu Hijo piadosísimo,
      ut qui fidénter póstulat, = que quien pide con confianza
      per te secúrus ímpetret. = obtiene seguro por ti.
    - |-
      Opem tua benígnitas = Tu benignidad no solo
      non solum fert poscéntibus, = da ayuda a los que la piden,
      sed et libénter sǽpius = sino que muchas veces, gustosa,
      precántum vota prǽvenit. = se adelanta a los deseos de los que ruegan.
    - |-
      In te misericórdia, = En ti la misericordia,
      in te magnificéntia; = en ti la magnificencia;
      tu bonitátis cúmulas = tú reúnes en ti todo lo bueno
      quicquid creáta póssident. = que poseen las criaturas.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui veste te mirábili = que te rodearon con el admirable
      circumdedérunt grátiæ. = vestido de la gracia.
  exsultet-caelum-laudibus:
    titulo: Exsúltet cælum láudibus
    amen: true
    estrofas:
    - |-
      Exsúltet cælum láudibus, = Exulte el cielo con alabanzas,
      resúltet terra gáudiis: = resuene la tierra de gozo:
      Apostolórum glóriam = la gloria de los apóstoles
      sacra canunt sollémnia. = cantan las sagradas solemnidades.
    - |-
      Vos, sæcli iusti iúdices = Vosotros, jueces justos del mundo
      et vera mundi lúmina, = y verdaderas luces de la tierra,
      votis precámur córdium, = os rogamos con los votos del corazón:
      audíte preces súpplicum. = escuchad las súplicas de los que os imploran.
    - |-
      Qui cælum verbo cláuditis = Vosotros, que con la palabra cerráis el cielo
      serásque eius sólvitis, = y abrís sus cerrojos,
      nos a peccátis ómnibus = desatadnos de todos los pecados
      sólvite iussu, quǽsumus. = con vuestro mandato, os pedimos.
    - |-
      Quorum præcépto súbditur = Vosotros, a cuyo mandato están sometidas
      salus et languor ómnium, = la salud y la enfermedad de todos,
      sanáte ægros móribus, = sanad a los enfermos de costumbres,
      nos reddéntes virtútibus, = devolviéndonos a las virtudes,
    - |-
      Ut, cum iudex advénerit = para que, cuando venga como juez
      Christus in fine sǽculi, = Cristo al fin del mundo,
      nos sempitérni gáudii = nos haga partícipes
      fáciat esse cómpotes. = del gozo sempiterno.
    - |-
      Deo sint laudes glóriæ, = A Dios sean las alabanzas de la gloria,
      qui dat nos evangélicis = que nos concede ser instruidos por vosotros
      per vos doctrínis ínstrui = en las enseñanzas del Evangelio
      et prósequi cæléstia. = y alcanzar las cosas celestiales.
  o-sempiternae-curiae:
    titulo: O sempitérnæ cúriæ
    amen: true
    estrofas:
    - |-
      O sempitérnæ cúriæ = Oh príncipes de la corte eterna
      regis suprémi príncipes, = del rey supremo,
      quos ipse Iesus édocens = a quienes Jesús mismo, instruyéndoos,
      donávit orbi Apóstolos, = dio al mundo como apóstoles:
    - |-
      Supérna vos Ierúsalem, = la Jerusalén celestial,
      lucérna cuius Agnus est, = cuya lámpara es el Cordero,
      gemmas micántes póssidet, = os posee como gemas brillantes,
      præclára vos fundámina. = como cimientos preclaros.
    - |-
      Vos et celébrat grátulans = Y os celebra, gozosa,
      nunc sponsa Christi Ecclésia, = la Iglesia, esposa de Cristo,
      quam sermo vester éxciit, = a la que vuestra palabra despertó,
      quam consecrástis sánguine. = a la que consagrasteis con vuestra sangre.
    - |-
      Cadéntibus cum sǽculis = Cuando, al caer los siglos,
      iudex Redémptor séderit, = el Redentor se siente como juez,
      qua laude vos sedébitis, = ¡con qué alabanza os sentaréis,
      senátus altæ glóriæ! = senado de la alta gloria!
    - |-
      Nos ergo vestra iúgiter = Que, pues, vuestra oración
      prex adiuvándo róboret, = nos fortalezca siempre ayudándonos,
      fudístis ut quæ sémina = para que las semillas que esparcisteis
      in grana cæli flóreant. = florezcan en granos del cielo.
    - |-
      Ætérna Christo glória, = Gloria eterna a Cristo,
      qui fecit esse núntios = que os hizo mensajeros
      vos Patris, atque Spíritus = del Padre, y os llenó del Espíritu
      replévit almo númine. = con su poder bondadoso.
  tristes-erant-apostoli:
    titulo: Tristes erant Apóstoli
    amen: true
    estrofas:
    - |-
      Tristes erant Apóstoli = Estaban tristes los apóstoles
      de nece sui Dómini, = por la muerte de su Señor,
      quem morte crudelíssima = a quien con la muerte más cruel
      sævi damnárant ímpii. = habían condenado los impíos feroces.
    - |-
      Sermóne blando Ángelus = Con palabra amable el ángel
      prædíxit muliéribus: = predijo a las mujeres:
      «In Galilǽa Dóminus = «En Galilea el Señor
      vidéndus est quantócius». = ha de ser visto cuanto antes».
    - |-
      Illæ dum pergunt cóncitæ = Mientras ellas van presurosas
      Apóstolis hoc dícere, = a decir esto a los apóstoles,
      vidéntes eum vívere, = viéndolo vivo,
      ósculant pedes Dómini. = besan los pies del Señor.
    - |-
      Quo ágnito, discípuli = Sabido esto, los discípulos
      in Galilǽa própere = van rápidamente a Galilea
      pergunt vidére fáciem = para ver el rostro
      desiderátam Dómini. = deseado del Señor.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium, = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Sit, Christe, tibi glória, = Gloria a ti, Cristo,
      qui regno mortis óbruto, = que, destruido el reino de la muerte,
      pandísti per Apóstolos = abriste por los apóstoles
      vitæ lucísque sémitas. = los caminos de la vida y de la luz.
  claro-paschali-gaudio:
    titulo: Claro pascháli gáudio
    amen: true
    estrofas:
    - |-
      Claro pascháli gáudio = Con claro gozo pascual
      sol mundo nitet rádio = brilla el sol para el mundo con su rayo,
      Cum Christum iam Apóstoli = cuando los apóstoles ven ya a Cristo
      visu cernunt corpóreo. = con la vista del cuerpo.
    - |-
      Osténsa sibi vúlnera = Mostradas a ellos las heridas
      in Christi carne fúlgida = resplandecientes en la carne de Cristo,
      resurrexísse Dóminum = que el Señor ha resucitado
      voce faténtur pública. = lo confiesan con voz pública.
    - |-
      Rex, Christe, clementíssime, = Rey, Cristo, clementísimo,
      tu corda nostra pósside = posee tú nuestros corazones,
      ut tibi laudes débitas = para que te demos las alabanzas debidas
      reddámus omni témpore. = en todo tiempo.
    - |-
      Esto perénne méntibus = Sé para nuestras almas, Jesús,
      paschále, Iesu, gáudium, = el gozo pascual perenne,
      et nos renátos grátiæ = y a nosotros, renacidos a la gracia,
      tuis triúmphis ággrega. = únenos a tus triunfos.
    - |-
      Sit, Christe, tibi glória, = Gloria a ti, Cristo,
      qui regno mortis óbruto, = que, destruido el reino de la muerte,
      pandísti per Apóstolos = abriste por los apóstoles
      vitæ lucísque sémitas. = los caminos de la vida y de la luz.
  sanctorum-meritis-inclita-gaudia:
    titulo: Sanctórum méritis ínclita gáudia
    amen: true
    estrofas:
    - |-
      Sanctórum méritis ínclita gáudia = Los gozos ínclitos por los méritos de los santos
      pangámus, sócii, géstaque fórtia; = cantemos, compañeros, y sus hazañas valerosas;
      nam gliscit ánimus prómere cántibus = pues el alma arde por celebrar con cantos
      victórum genus óptimum. = al linaje excelente de los vencedores.
    - |-
      Hi sunt quos rétinens mundus inhórruit, = Estos son los que el mundo, reteniéndolos, aborreció,
      ipsum nam stérili flore peráridum = pues lo despreciaron del todo, árido con su flor
      sprevére pénitus teque secúti sunt, = estéril, y te siguieron a ti,
      rex, Christe, bone cǽlitum. = Cristo, buen rey de los del cielo.
    - |-
      Hi pro te fúrias sǽvaque sústinent; = Estos soportan por ti furias y crueldades;
      non murmur résonat, non querimónia, = no resuena un murmullo, ni una queja,
      sed corde tácito mens bene cónscia = sino que, con corazón callado, el alma bien consciente
      consérvat patiéntiam. = conserva la paciencia.
    - |-
      Quæ vox, quæ póterit lingua retéxere = ¿Qué voz, qué lengua podrá contar
      quæ tu martýribus múnera prǽparas? = los dones que preparas a los mártires?
      Rubri nam flúido sánguine láureis = Pues, rojos de sangre que corre, con laureles
      ditántur bene fúlgidis. = bien resplandecientes se enriquecen.
    - |-
      Te, trina Déitas únaque, póscimus, = Te pedimos, Divinidad trina y una,
      ut culpas ábluas, nóxia súbtrahas, = que laves las culpas, quites lo dañino,
      des pacem fámulis, nos quoque glóriam = des la paz a tus siervos, y a nosotros también, la gloria
      per cuncta tibi sǽcula. = por todos los siglos a ti.
    variantes:
      mujeres:
        2: |-
          Hæ sunt quos rétinens mundus inhórruit, = Estas son las que el mundo, reteniéndolas, aborreció,
          ipsum nam stérili flore peráridum = pues lo despreciaron del todo, árido con su flor
          sprevére pénitus teque secútæ sunt, = estéril, y te siguieron a ti,
          rex, Christe, bone cǽlitum. = Cristo, buen rey de los del cielo.
        3: |-
          Hæ pro te fúrias sǽvaque sústinent; = Estas soportan por ti furias y crueldades;
          non murmur résonat, non querimónia, = no resuena un murmullo, ni una queja,
          sed corde tácito mens bene cónscia = sino que, con corazón callado, el alma bien consciente
          consérvat patiéntiam. = conserva la paciencia.
  rex-gloriose-martyrum:
    titulo: Rex glorióse mártyrum
    amen: true
    estrofas:
    - |-
      Rex glorióse mártyrum, = Rey glorioso de los mártires,
      coróna confiténtium, = corona de los confesores,
      qui respuéntes térrea = que a los que rechazan lo terreno
      perdúcis ad cæléstia, = los conduces a lo celestial:
    - |-
      Aurem benígnam prótinus = presta pronto tu oído benigno
      appóne nostris vócibus; = a nuestras voces;
      tropǽa sacra pángimus, = cantamos los sagrados trofeos,
      ignósce quod delíquimus. = perdona lo que hemos pecado.
    - |-
      Tu vincis in martýribus = Tú vences en los mártires,
      parcéndo confessóribus; = perdonando a los confesores;
      tu vince nostra crímina = vence tú nuestros crímenes,
      donándo indulgéntiam. = dándonos la indulgencia.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  aeterna-christi-munera:
    titulo: Ætérna Christi múnera
    amen: true
    estrofas:
    - |-
      Ætérna Christi múnera = Los dones eternos de Cristo
      et mártyrum victórias, = y las victorias de los mártires,
      laudes feréntes débitas, = ofreciendo las alabanzas debidas,
      lætis canámus méntibus. = cantemos con almas alegres.
    - |-
      Ecclesiárum príncipes, = Príncipes de las iglesias,
      belli triumpháles duces, = jefes triunfadores de la guerra,
      cæléstis aulæ mílites = soldados del palacio celestial
      et vera mundi lúmina. = y verdaderas luces del mundo.
    - |-
      Terróre victo sǽculi = Vencido el terror del mundo
      pœnísque spretis córporis, = y despreciadas las penas del cuerpo,
      mortis sacræ compéndio = por el atajo de una muerte santa
      lucem beátam póssident. = poseen la luz bienaventurada.
    - |-
      Tortóris insáni manu = Por la mano del verdugo enloquecido
      sanguis sacrátus fúnditur, = es derramada la sangre sagrada,
      sed pérmanent immóbiles = pero permanecen inmóviles
      vitæ perénnis grátia. = por la gracia de la vida perenne.
    - |-
      Devóta sanctórum fides, = La fe devota de los santos,
      invícta spes credéntium, = la esperanza invicta de los creyentes,
      perfécta Christi cáritas = la caridad perfecta de Cristo
      mundi triúmphat príncipem. = triunfa del príncipe del mundo.
    - |-
      In his patérna glória, = En ellos [está] la gloria del Padre,
      in his volúntas Spíritus, = en ellos la voluntad del Espíritu,
      exsúltat in his Fílius, = exulta en ellos el Hijo,
      cælum replétur gáudio. = el cielo se llena de gozo.
    - |-
      Te nunc, Redémptor, quǽsumus, = Ahora, Redentor, te pedimos
      ut mártyrum consórtio = que a la compañía de los mártires
      iungas precántes sérvulos = unas a tus siervos que te suplican,
      in sempitérna sǽcula. = por los siglos sempiternos.
  deus-tuorum-militum:
    titulo: Deus, tuórum mílitum
    amen: true
    estrofas:
    - |-
      Deus, tuórum mílitum = Oh Dios, herencia, corona y premio
      sors et coróna, prǽmium, = de tus soldados,
      laudes canéntes mártyris = a los que cantan las alabanzas del mártir
      absólve nexu críminis. = desátalos del lazo del pecado.
    - |-
      Hic testis ore prótulit = Este testigo proclamó con la boca
      quod cordis arca crédidit, = lo que creyó en el arca del corazón;
      Christum sequéndo répperit = siguiendo a Cristo, lo encontró
      effusióne sánguinis. = con el derramamiento de su sangre.
    - |-
      Hic nempe mundi gáudia = Este, en efecto, considerando con razón
      et blandiménta nóxia = caducos los gozos del mundo
      cadúca rite députans, = y sus halagos dañinos,
      pervénit ad cæléstia. = llegó a lo celestial.
    - |-
      Pœnas cucúrrit fórtiter = Corrió valerosamente a las penas
      et sústulit viríliter; = y las soportó con fortaleza;
      pro te refúndens sánguinem, = derramando por ti su sangre,
      ætérna dona póssidet. = posee los dones eternos.
    - |-
      Ob hoc precátu súpplici = Por esto, con súplica humilde,
      te póscimus, piíssime; = te pedimos, oh piadosísimo:
      in hoc triúmpho mártyris = en este triunfo del mártir
      dimítte noxam sérvulis, = perdona la culpa a tus siervos,
    - |-
      Ut consequámur múneris = para que alcancemos también
      ipsíus et consórtia, = la participación de su premio
      lætémur ac perénniter = y nos alegremos para siempre,
      iuncti polórum sédibus. = unidos en las moradas del cielo.
    - |-
      Laus et perénnis glória = Alabanza y gloria perenne
      tibi, Pater, cum Fílio, = a ti, Padre, con el Hijo,
      Sancto simul Paráclito = y a la vez al Santo Paráclito,
      in sæculórum sǽcula. = por los siglos de los siglos.
    variantes:
      mujer:
        2: |-
          Hæc testis ore prótulit = Esta testigo proclamó con la boca
          quod cordis arca crédidit, = lo que creyó en el arca del corazón;
          Christum sequéndo répperit = siguiendo a Cristo, lo encontró
          effusióne sánguinis. = con el derramamiento de su sangre.
        3: |-
          Hæc nempe mundi gáudia = Esta, en efecto, considerando con razón
          et blandiménta nóxia = caducos los gozos del mundo
          cadúca rite députans, = y sus halagos dañinos,
          pervénit ad cæléstia. = llegó a lo celestial.
  beate-martyr-prospera:
    titulo: Beáte martyr, próspera
    amen: true
    estrofas:
    - |-
      Beáte martyr, próspera = Bienaventurado mártir, haz próspero
      diem triumphálem tuum, = tu día triunfal,
      quo sánguinis merces tibi = en el que, como recompensa de tu sangre,
      coróna vincénti datur. = se te da la corona al vencer.
    - |-
      Hic te ex ténebris sǽculi, = Este día te sacó de las tinieblas del mundo,
      tortóre victo et iúdice, = vencidos el verdugo y el juez,
      evéxit ad cælum dies = y te llevó al cielo,
      Christóque ovántem réddidit. = y te devolvió, triunfante, a Cristo.
    - |-
      Nunc angelórum párticeps = Ahora, compañero de los ángeles,
      collúces insígni stola, = brillas con la insigne vestidura
      quam testis indomábilis = que, testigo indomable,
      rivis cruóris láveras. = habías lavado con ríos de sangre.
    - |-
      Adésto nunc et óbsecra, = Asístenos ahora y suplica
      placátus ut Christus suis = que Cristo, aplacado, a los suyos
      inclínet aurem prósperam, = incline su oído propicio
      noxas nec omnes ímputet. = y no les impute todas las culpas.
    - |-
      Paulísper huc illábere = Desciende aquí un momento,
      Christi favórem déferens, = trayendo el favor de Cristo,
      sensus graváti ut séntiant = para que los sentidos agobiados sientan
      levámen indulgéntiæ. = el alivio del perdón.
    - |-
      Honor Patri cum Fílio = Honor al Padre con el Hijo
      et Spíritu Paráclito, = y al Espíritu Paráclito,
      qui te coróna pérpeti = que te ciñen con corona perpetua
      cingunt in aula glóriæ. = en el palacio de la gloria.
    variantes:
      mujer:
        1: |-
          Beáta martyr, próspera = Bienaventurada mártir, haz próspero
          diem triumphálem tuum, = tu día triunfal,
          quo sánguinis merces tibi = en el que, como recompensa de tu sangre,
          coróna vincénti datur. = se te da la corona al vencer.
  martyr-dei-qui-unicum:
    titulo: Martyr Dei, qui únicum
    amen: true
    estrofas:
    - |-
      Martyr Dei, qui únicum = Mártir de Dios, que, siguiendo
      Patris sequéndo Fílium = al Hijo único del Padre,
      victis triúmphas hóstibus, = triunfas sobre los enemigos vencidos,
      victor fruens cæléstibus, = vencedor que gozas de lo celestial:
    - |-
      Tui precátus múnere = por el don de tu súplica
      nostrum reátum dílue, = lava nuestra culpa,
      arcens mali contágium, = apartando el contagio del mal,
      vitæ repéllens tǽdium. = alejando el hastío de la vida.
    - |-
      Solúta sunt iam víncula = Ya están desatadas las cadenas
      tui sacráti córporis; = de tu cuerpo sagrado;
      nos solve vinclis sǽculi = desátanos de las cadenas del mundo
      amóre Fílii Dei. = por amor del Hijo de Dios.
    - |-
      Honor Patri cum Fílio = Honor al Padre con el Hijo
      et Spíritu Paráclito, = y al Espíritu Paráclito,
      qui te coróna pérpeti = que te ciñen con corona perpetua
      cingunt in aula glóriæ. = en el palacio de la gloria.
    variantes:
      mujer:
        1: |-
          Martyr Dei, quæ únicum = Mártir de Dios, que, siguiendo
          Patris sequéndo Fílium = al Hijo único del Padre,
          victis triúmphas hóstibus, = triunfas sobre los enemigos vencidos,
          victrix fruens cæléstibus, = vencedora que gozas de lo celestial:
  virginis-proles-opifexque-matris:
    titulo: Vírginis Proles opiféxque Matris
    amen: true
    estrofas:
    - |-
      Vírginis Proles opiféxque Matris, = Hijo de la Virgen y creador de tu Madre,
      Virgo quem gessit peperítque Virgo, = a quien llevó y dio a luz una Virgen,
      vírginis festum cánimus tropǽum: = cantamos el trofeo festivo de una virgen:
      áccipe votum. = recibe nuestro voto.
    - |-
      Hæc tua virgo, dúplici beáta = Esta virgen tuya, dichosa por doble
      sorte dum gestit frágilem domáre = suerte, mientras se alegra de dominar
      córporis sexum, dómuit cruéntum = la frágil condición del cuerpo, dominó con su cuerpo
      córpore sæclum. = al mundo sangriento.
    - |-
      Inde nec mortem nec amíca mortis = Por eso, sin temer ni la muerte ni los crueles
      sæva pœnárum génera pavéscens, = géneros de tormentos, amigos de la muerte,
      sánguine fuso méruit sacrátum = derramando su sangre, mereció subir
      scándere cælum. = al cielo sagrado.
    - |-
      Huius obténtu, Deus alme, nostris = Por su intercesión, Dios bondadoso,
      parce iam culpis, vítiis revúlsis, = perdona ya nuestras culpas, arrancados los vicios,
      quo tibi puri résonet per ævum = para que resuene para ti por siempre el himno
      péctoris hymnus. = de un corazón puro.
  o-christe-flos-convallium:
    titulo: O Christe, flos convállium
    amen: true
    estrofas:
    - |-
      O Christe, flos convállium, = Oh Cristo, flor de los valles,
      te láudibus extóllimus, = te ensalzamos con alabanzas,
      quod hanc ornásti vírginem = porque adornaste a esta virgen
      palmis quoque martýrii. = también con las palmas del martirio.
    - |-
      Hæc prudens, fortis, sápiens, = Ella, prudente, fuerte, sabia,
      fidem proféssa, líbere, = habiendo confesado libremente la fe,
      pro te dira supplícia = por ti recibió crueles suplicios
      excépit impertérrita. = sin temor.
    - |-
      Sic spreto mundi príncipe, = Así, despreciado el príncipe del mundo,
      tuo ditáta múnere, = enriquecida con tu don,
      cruénto parta prœ́lio, = conquistados en un combate sangriento,
      ætérna tulit prǽmia. = obtuvo los premios eternos.
    - |-
      Huius, Redémptor, méritis = Por sus méritos, Redentor,
      nos pius adde sócios, = piadoso, únenos [a ella] como compañeros,
      ut, mente pura, frúctibus = para que con mente pura gocemos
      tui fruámur sánguinis. = de los frutos de tu sangre.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-castitatis-signifer:
    titulo: O castitátis sígnifer
    amen: true
    estrofas:
    - |-
      O castitátis sígnifer = Oh abanderado de la castidad
      et fortitúdo mártyrum, = y fortaleza de los mártires,
      utrísque reddens prǽmia, = que das a ambos sus premios,
      audi benígnus súpplices. = escucha benigno a los que te suplican.
    - |-
      Hæc virgo magni péctoris, = Esta virgen de gran corazón,
      beáta sorte dúplici = dichosa por doble suerte
      bináque palma nóbilis, = y noble por doble palma,
      hic tóllitur præcóniis. = es ensalzada aquí con alabanzas.
    - |-
      Hæc te fatéri pértinax, = Ella, obstinada en confesarte,
      tortóris acre bráchium = armó con valor contra sí
      armávit in se strénue = el brazo cruel del verdugo
      tibíque fudit spíritum. = y entregó por ti su espíritu.
    - |-
      Sic sæviéntis vúlnera = Así, enseñando a vencer las heridas
      et blandiéntis víncere = del mundo cuando se ensaña
      mundi docens illécebram, = y su seducción cuando halaga,
      fidem docet nos íntegram. = nos enseña la fe íntegra.
    - |-
      Huius favóre débita = Por su favor, perdónanos
      nobis remíttas ómnia, = todas nuestras deudas,
      foménta tollens críminum = quitando lo que alimenta los pecados
      tuámque subdens grátiam. = y concediéndonos tu gracia.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  vir-celse-forma-fulgida:
    titulo: Vir celse, forma fúlgida
    amen: true
    estrofas:
    - |-
      Vir celse, forma fúlgida = Varón excelso, imagen resplandeciente
      virtútis, hymnum súscipe, = de la virtud, recibe el himno
      qui iure dum te prǽdicat, = que, mientras te alaba con justicia,
      Dei canit magnália. = canta las maravillas de Dios.
    - |-
      Qui sempitérnus Póntifex = El Pontífice sempiterno,
      stirpem Deo mortálium = que reunió con Dios el linaje
      revínxit, atque réddidit = de los mortales y nos devolvió
      paci novo nos fœ́dere, = a la paz con una nueva alianza,
    - |-
      Te fecit ipse próvidus = él mismo, previsor, te hizo
      sui minístrum múneris, = ministro de su oficio,
      Patri datúrum glóriam = para dar gloria al Padre
      eiúsque vitam plébibus. = y su vida a los pueblos.
    - |-
      Virtúte factus dítior = Enriquecido con la fuerza
      te consecrántis Spíritus, = del Espíritu que te consagró,
      præsul, salútis pínguia = como obispo diste
      tu tradidísti pábula. = los pastos abundantes de la salvación.
    - |-
      Locátus in cæléstibus, = Colocado en el cielo,
      sanctæ meménto Ecclésiæ, = acuérdate de la santa Iglesia,
      oves ut omnes páscua = para que todas las ovejas busquen
      Christi petant felícia. = los pastos dichosos de Cristo.
    - |-
      Sit Trinitáti glória, = Gloria a la Trinidad,
      quæ sancti honóris múnia = que corona con gozos dignos
      tibi minístro sédulo = a ti, su ministro diligente,
      dignis corónat gáudiis. = los oficios del santo ministerio.
    variantes:
      presbitero:
        4: |-
          Regális huius cúlminis = Habiendo alcanzado la altura
          adéptus altitúdinem, = de esta cumbre real,
          verbo fuísti et móribus = fuiste con la palabra y las costumbres
          doctor, sacérdos, hóstia. = doctor, sacerdote, víctima.
      papa:
        4: |-
          Tu Petri ovíle cǽlitus = Tú regías el redil de Pedro
          sumptis regébas clávibus, = con las llaves recibidas del cielo,
          gregémque verbo grátiæ, = y al rebaño, con la palabra de la gracia
          puris fovébas áctibus. = y con acciones puras, lo cuidabas.
  sacrata-nobis-gaudia:
    titulo: Sacráta nobis gáudia
    amen: true
    estrofas:
    - |-
      Sacráta nobis gáudia = Gozos sagrados
      dies redúxit ánnua, = nos ha traído el día anual,
      laudántur in qua débito = en el que se alaba con el debido
      cultu duces ovílium. = culto a los guías de los rebaños.
    - |-
      En pro gregis custódia = He aquí que por la custodia del rebaño
      nullos labóres néglegunt, = no descuidan ningún trabajo,
      tutántur illum, sánius = lo protegen, dándole
      impertiéntes pábulum. = un pasto más sano.
    - |-
      Arcent lupos e fínibus, = Alejan a los lobos de sus confines,
      procul latrónes éxigunt, = echan lejos a los ladrones,
      replent oves pinguédine, = llenan de abundancia a las ovejas,
      ovíle numquam déserunt. = nunca abandonan el redil.
    - |-
      Tot nunc potíti gáudiis, = Ahora que gozáis de tantos gozos,
      gregum duces sanctíssimi, = santísimos guías de los rebaños,
      nobis rogáte grátiam = pedid para nosotros la gracia
      apud tribúnal iúdicis. = ante el tribunal del juez.
    - |-
      Ætérne, Christe, póntifex, = Cristo, pontífice eterno,
      tibi sit æqua glória = a ti sea igual gloria
      cum Patre et almo Spíritu = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  christe-pastorum-caput-atque-princeps:
    titulo: Christe, pastórum caput atque princeps
    amen: true
    estrofas:
    - |-
      Christe, pastórum caput atque princeps, = Cristo, cabeza y príncipe de los pastores,
      géstiens huius celebráre festum, = deseosa de celebrar la fiesta de este,
      débitas sacro pia turba psallit = la multitud piadosa canta las alabanzas debidas
      cármine laudes, = con un canto sagrado.
    - |-
      Hunc tibi eléctum fáciens minístrum = A este, haciéndolo tu ministro elegido
      ac sacerdótem sócians, dedísti = y asociándolo al sacerdocio, lo diste
      dux ut astáret pópulo fidélis = para que asistiera al pueblo como guía fiel
      ac bonus altor. = y buen sustentador.
    - |-
      Hic gregis ductor fuit atque forma, = Este fue guía y modelo del rebaño,
      lux erat cæco, mísero levámen, = era luz para el ciego, alivio para el desdichado,
      próvidus cunctis pater omnibúsque = padre previsor para todos, y para todos
      ómnia factus. = se hizo todo.
    - |-
      Christe, qui sanctis méritam corónam = Cristo, que a los santos das en el cielo
      reddis in cælis, dócili magístrum = la corona merecida, haz que, dóciles, sigamos
      fac sequi vita, similíque tandem = al maestro en la vida y que al fin alcancemos
      fine potíri. = un fin semejante.
    - |-
      Æqua laus summum célebret Paréntem = Que una alabanza igual celebre al Padre altísimo
      teque, Salvátor, pie rex, per ævum; = y a ti, Salvador, rey piadoso, por siempre;
      Spíritus Sancti résonet per omnem = que la gloria del Espíritu Santo resuene
      glória mundum. = por todo el mundo.
    variantes:
      obispo:
        2: |-
          Strénuum bello púgilem supérni = Al valiente luchador, tu Espíritu
          chrísmatis pleno tuus unxit intus = lo ungió por dentro con el don pleno del crisma
          Spíritus dono, posuítque sanctam = celestial, y lo puso para apacentar
          páscere gentem. = al pueblo santo.
      papa:
        2: |-
          Quas oves Petro déderas, ovíle = Las ovejas que habías dado a Pedro, para que
          orbis ut totus fíeret sacrátum, = todo el mundo llegara a ser un redil sagrado,
          hic tuo nutu pósitus suprémo = este, puesto por tu voluntad en la cumbre
          cúlmine rexit. = suprema, las gobernó.
  dum-sacerdotum-celebrant-fideles:
    titulo: Dum sacerdótum célebrant fidéles
    amen: true
    estrofas:
    - |-
      Dum sacerdótum célebrant fidéles = Mientras los fieles celebran las fiestas
      festa sollémni veneránda cultu, = de los sacerdotes, dignas de veneración con culto solemne,
      in tuas laudes honor hic redúndat, = este honor redunda en tu alabanza,
      summe Sacérdos. = Sacerdote supremo.
    - |-
      Cuius ex dono potuére patres = Por tu don pudieron los padres
      sémitas lucis pópulos docére, = enseñar a los pueblos los caminos de la luz,
      móribus sanctis régere atque verbo = regirlos con santas costumbres y apacentarlos
      páscere vitæ. = con la palabra de vida.
    - |-
      Sed nec advérsis póterant movéri = Pero tampoco las adversidades podían apartarlos
      a tuæ certo fídei tenóre, = del curso firme de tu fe,
      quos futurórum rata præmiórum = pues los animaba la esperanza cierta
      spes animábat. = de los premios futuros.
    - |-
      Unde post vitæ frágilis labóres = Por eso, después de los trabajos de la frágil vida,
      rite decúrsos, pátrias adépti = debidamente recorridos, alcanzadas las moradas
      cǽlitus sedes, sólida beáti = de la patria celestial, gozan dichosos
      pace fruúntur. = de una paz firme.
    - |-
      Glóriæ summum decus atque laudis, = Que el sumo honor de la gloria y de la alabanza,
      rex, tibi, regum, Déitas perénnis, = a ti, Rey de reyes, Divinidad perenne,
      quicquid est rerum célebret per omne = lo celebre todo lo que existe, por todo
      tempus et ævum. = tiempo y edad.
  inclitus-rector-pater-atque-prudens:
    titulo: Ínclitus rector pater atque prudens
    amen: true
    estrofas:
    - |-
      Ínclitus rector pater atque prudens, = Ínclito pastor, padre y prudente,
      cuius insígnem cólimus triúmphum, = cuyo insigne triunfo celebramos,
      iste conféssor sine fine lætus = este confesor, alegre sin fin,
      regnat in astris. = reina en los astros.
    - |-
      Qui sacerdótis, ducis ac magístri = Él asumió el oficio sagrado de sacerdote,
      munus insúmpsit pópulis sacrátum, = guía y maestro, para los pueblos,
      præsul et vitæ sápiens parávit = y como obispo sabio preparó los dones
      dona beátæ. = de la vida dichosa.
    - |-
      Nunc eum nisu rogitémus omnes, = Roguémosle ahora todos con empeño
      ábluat nostrum pius ut reátum, = que, piadoso, lave nuestra culpa
      et sua ducat prece nos ad alta = y con su súplica nos lleve a las altas
      cúlmina cæli. = cumbres del cielo.
    - |-
      Sit Deo soli decus et potéstas, = Sea a Dios solo el honor y el poder,
      laus in excélsis, honor ac perénnis, = la alabanza en las alturas, el honor perenne,
      qui suis totum móderans gubérnat = que, moderándolo todo, gobierna el mundo
      légibus orbem. = con sus leyes.
    variantes:
      presbitero:
        2: |-
          Ipse dux clarus fuit et magíster, = Él fue guía ilustre y maestro,
          éxhibens sacræ documénta vitæ = mostrando las enseñanzas de una vida santa
          ac Deo semper sátagens placére = y esforzándose siempre por agradar a Dios
          péctore mundo. = con corazón puro.
      papa:
        2: |-
          Qui Petri summa cáthedra resídens, = Sentado en la cátedra suprema de Pedro,
          præsul imménsi gregis et magíster, = pastor y maestro de un rebaño inmenso,
          regna per claves Dómini poténter = con poder abre, por las llaves del Señor,
          cǽlica pandit. = los reinos del cielo.
  hi-sacerdotes-domini-sacrati:
    titulo: Hi sacerdótes Dómini sacráti
    amen: true
    estrofas:
    - |-
      Hi sacerdótes Dómini sacráti, = Estos sacerdotes consagrados al Señor,
      consecratóres Dómini fidéles = fieles consagradores del Señor,
      atque pastóres pópuli fuére = fueron también pastores del pueblo
      ímpigro amóre. = con amor diligente.
    - |-
      Namque suscéptæ benedictiónis = Pues, guardando los dones de la bendición
      dona servántes, studuére, lumbos = recibida, se esforzaron, con la cintura
      fórtiter cincti, mánibus corúscas = fuertemente ceñida, por llevar en las manos
      ferre lucérnas. = lámparas brillantes.
    - |-
      Sicque suspénsi vigilésque, quando = Y así, atentos y en vela, cuando
      iánuam pulsans Dóminus veníret, = el Señor viniera llamando a la puerta,
      obviavérunt properánti alácres = le salieron al encuentro, prontos
      pándere limen. = a abrirle la entrada.
    - |-
      Glóriæ summum decus atque laudis, = Que el sumo honor de la gloria y de la alabanza,
      rex, tibi, regum, Déitas perénnis, = a ti, Rey de reyes, Divinidad perenne,
      quicquid est rerum célebret per omne = lo celebre todo lo que existe, por todo
      tempus et ævum. = tiempo y edad.
  aeterne-sol-qui-lumine:
    titulo: Ætérne sol, qui lúmine
    amen: true
    estrofas:
    - |-
      Ætérne sol, qui lúmine = Sol eterno, que con tu luz
      creáta comples ómnia, = llenas todo lo creado,
      supréma lux et méntium, = luz suprema también de las mentes,
      te corda nostra cóncinunt. = te cantan nuestros corazones.
    - |-
      Tuo fovénte Spíritu, = Con el aliento de tu Espíritu,
      hic viva luminária = aquí brillaron luminarias vivas
      fulsére, per quæ sǽculis = por las que a través de los siglos
      patent salútis sémitæ. = se abren los caminos de la salvación.
    - |-
      Quod verba missa cǽlitus, = Lo que las palabras enviadas del cielo,
      natíva mens quod éxhibet, = lo que la mente por naturaleza muestra,
      per hos minístros grátiæ = por estos ministros de la gracia
      novo nitóre cláruit. = brilló con nuevo resplandor.
    - |-
      Horum corónæ párticeps, = Partícipe de su corona,
      doctrína honéstus lúcida, = honrado por una doctrina luminosa,
      hic vir beátus splénduit = brilló aquí este varón bienaventurado
      quem prædicámus láudibus. = que proclamamos con alabanzas.
    - |-
      Ipso favénte, quǽsumus, = Con su favor, te pedimos,
      nobis, Deus, percúrrere = concédenos, oh Dios, recorrer
      da veritátis trámitem, = el camino de la verdad,
      possímus ut te cónsequi. = para que podamos alcanzarte.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  doctor-aeternus-coleris-piusque:
    titulo: Doctor ætérnus cóleris piúsque
    amen: true
    estrofas:
    - |-
      Doctor ætérnus cóleris piúsque, = Eres venerado como doctor eterno y piadoso,
      Christe, qui leges áperis salútis, = Cristo, que abres las leyes de la salvación,
      verba qui vitæ mérito putáris = tú, de quien con razón se piensa que solo
      solus habére. = tienes palabras de vida.
    - |-
      Teque clamámus, bone Pastor orbis, = Y te aclamamos, buen Pastor del mundo,
      cǽlitus semper solidásse Sponsæ = porque desde el cielo afirmaste siempre
      verba, constánter quibus illa mundo = las palabras de tu Esposa, para que ella
      lumen adésset. = fuera siempre luz para el mundo.
    - |-
      Ipse quin præbes fámulos corúscos, = Más aún, nos das servidores brillantes,
      áureas stellas velut emicántes, = como estrellas de oro que resplandecen,
      certa qui nobis réserent beátæ = que nos abran las enseñanzas seguras
      dógmata vitæ. = de la vida dichosa.
    - |-
      Unde te laudes récinant, Magíster, = Por eso te cantan alabanzas, Maestro,
      Spíritus fundis bona qui stupénda = porque derramas bienes asombrosos del Espíritu
      ore doctórum, tua quo poténter = por boca de los doctores, por los que poderosamente
      lux patet alma. = se muestra tu luz bondadosa.
    - |-
      Quique nunc iustus celebrátur, instet = Y el justo que ahora es celebrado, insista
      ut tuam plebem per amœ́na lucis = para que concedas a tu pueblo avanzar por las delicias
      des gradi, donec tibi dicat hymnos = de la luz, hasta que te diga himnos
      lúmine pleno. = en la luz plena.
  iesu-corona-virginum:
    titulo: Iesu, coróna vírginum
    amen: true
    estrofas:
    - |-
      Iesu, coróna vírginum, = Jesús, corona de las vírgenes,
      quem Mater illa cóncipit = a quien concibió aquella Madre
      quæ sola virgo párturit, = que sola, virgen, dio a luz,
      hæc vota clemens áccipe, = recibe, clemente, estos votos.
    - |-
      Qui pascis inter lília = Tú que te apacientas entre los lirios,
      sæptus choréis vírginum, = rodeado de coros de vírgenes,
      sponsus decórus glória = esposo hermoso en la gloria,
      sponsísque reddens prǽmia. = que das a tus esposas los premios.
    - |-
      Quocúmque pergis, vírgines = Adondequiera que vas, las vírgenes
      sequúntur, atque láudibus = te siguen y con alabanzas
      post te canéntes cúrsitant = corren tras de ti cantando
      hymnósque dulces pérsonant. = y entonan dulces himnos.
    - |-
      Te deprecámur, lárgius = Te suplicamos que aumentes
      nostris adáuge méntibus = generosamente en nuestras mentes
      nescíre prorsus ómnia = el no conocer en absoluto ninguna
      corruptiónis vúlnera. = herida de la corrupción.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  dulci-depromat-carmine:
    titulo: Dulci deprómat cármine
    amen: true
    estrofas:
    - |-
      Dulci deprómat cármine = Con dulce canto
      devóta plebs sollémnia, = celebre el pueblo devoto esta solemnidad,
      dum in cælórum cúlmine = mientras en la cumbre de los cielos
      hæc virgo micat glória. = brilla esta virgen en la gloria.
    - |-
      Virgo, quæ Christi láudibus = La virgen que ya con valentía
      vacávit iam viríliter, = se dedicó a las alabanzas de Cristo
      sanctórum nunc agmínibus = ahora se une felizmente
      coniúngitur felíciter. = a las filas de los santos.
    - |-
      Vicit per pudicítiam = Venció por la pureza
      infírmæ carnis vítium; = el vicio de la carne débil;
      sprevit mundi blandítiam = despreció los halagos del mundo
      Christi sequens vestígium. = siguiendo las huellas de Cristo.
    - |-
      Per hanc nos, Christe, dírige = Por ella, Cristo, dirígenos,
      servans a cunctis hóstibus; = guardándonos de todos los enemigos;
      culpárum lapsus córrige = corrige las caídas de nuestras culpas,
      nos ímbuens virtútibus. = impregnándonos de virtudes.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  gaudentes-festum-colimus:
    titulo: Gaudéntes festum cólimus
    amen: true
    estrofas:
    - |-
      Gaudéntes festum cólimus = Gozosos celebramos la fiesta
      sanctárum Christi vírginum, = de las santas vírgenes de Cristo,
      quæ puro corde Dóminum = que con corazón puro siguieron
      secútæ sunt in láudibus. = al Señor entre alabanzas.
    - |-
      O castitátis lílium, = Oh lirio de la castidad,
      rex vírginum sanctíssime, = rey santísimo de las vírgenes,
      tu, custos pudicítiæ, = tú, guardián de la pureza,
      fraudes repélle dǽmonum. = rechaza los engaños de los demonios.
    - |-
      Qui castis in viscéribus = Tú que en las entrañas castas
      placáris clementíssime, = te complaces, clementísimo,
      nostros reátus dílue, = lava nuestras culpas,
      dimíttens quæ peccávimus. = perdonando lo que hemos pecado.
    - |-
      Grates precántes ágimus; = Suplicantes, te damos gracias;
      errámus, viam dírige; = erramos: dirige el camino;
      tu, pater indulgéntiæ, = tú, padre de la indulgencia,
      nobis succúrre, quǽsumus. = socórrenos, te pedimos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  aptata-virgo-lampade:
    titulo: Aptáta, virgo, lámpade
    amen: true
    estrofas:
    - |-
      Aptáta, virgo, lámpade = Con la lámpara preparada, virgen,
      ad núptias ingréssa es = entraste a las bodas
      ætérni regis glóriæ, = del rey eterno de la gloria,
      quem laudant turbæ cǽlicæ. = a quien alaban las multitudes del cielo.
    - |-
      Grata convíva súperis, = Grata comensal de los del cielo,
      cælésti sponso iúngeris = te unes al esposo celestial
      ampléxu casti fœ́deris, = en el abrazo de una alianza casta,
      pudóris dives méritis. = rica en los méritos de la pureza.
    - |-
      Normam vivéndi ínstrue, = Instrúyenos en la norma de vida,
      nos prece tua cónfove, = favorécenos con tu súplica,
      possímus ut resístere = para que podamos resistir
      hostis nostri versútiæ. = las astucias de nuestro enemigo.
    - |-
      Exémplar vitæ vírginum, = Modelo de vida de las vírgenes,
      María roget Fílium, = María ruegue a su Hijo
      ut eius adiutórium = que su auxilio
      nos iuvet per exsílium. = nos ayude durante el destierro.
    - |-
      Sit Deitáti glória = Gloria sea a la Divinidad
      per infiníta sǽcula = por los siglos infinitos
      pro vírginis victória, = por la victoria de la virgen,
      qua gaudet cæli cúria. = con la que se alegra la corte del cielo.
  iesu-redemptor-omnium-perpes-corona:
    titulo: Iesu, redémptor ómnium
    amen: true
    estrofas:
    - |-
      Iesu, redémptor ómnium, = Jesús, redentor de todos,
      perpes coróna cǽlitum, = corona perpetua de los del cielo,
      in hac die cleméntius = en este día, con más clemencia,
      nostris favéto vócibus, = favorece nuestras voces,
    - |-
      Sacri tui qua nóminis = [día] en que el bondadoso confesor
      conféssor almus cláruit, = de tu sagrado nombre brilló,
      cuius celébrat ánnua = cuya solemnidad anual
      devóta plebs sollémnia. = celebra el pueblo devoto.
    - |-
      Per illa quæ sunt sǽculi = Por las cosas del mundo
      gressu seréno tránsiit, = pasó con paso sereno,
      tibi fidélis iúgiter = fiel a ti continuamente,
      iter salútis pérsequens. = siguiendo el camino de la salvación.
    - |-
      At rite mundi gáudiis = Y, con razón, no aplicando el corazón
      non cor cadúcis ápplicans, = a los gozos caducos del mundo,
      cum ángelis cæléstibus = alegre con los ángeles del cielo
      lætus potítur prǽmiis. = goza de los premios.
    - |-
      Huius benígnus ánnue = Concédenos, benigno,
      nobis sequi vestígia; = seguir sus huellas;
      huius precátu sérvulis = por su súplica, a tus siervos
      dimítte noxam críminis. = perdónales la culpa del pecado.
    - |-
      Sit, Christe, rex piíssime, = Sea, Cristo, rey piadosísimo,
      tibi Patríque glória = a ti y al Padre la gloria
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  inclitos-christi-famulos-canamus:
    titulo: Ínclitos Christi fámulos canámus
    amen: true
    estrofas:
    - |-
      Ínclitos Christi fámulos canámus, = Cantemos a los ínclitos siervos de Cristo,
      quos, fide claros nitidísque gestis, = a quienes, ilustres por la fe y por obras resplandecientes,
      hac die tellus sociáta cælo = en este día la tierra, unida al cielo,
      láudibus ornat. = adorna con alabanzas.
    - |-
      Quippe qui mites, húmiles, pudíci, = Porque, mansos, humildes, pudorosos,
      nésciam culpæ coluére vitam, = llevaron una vida que no conoció la culpa,
      donec e terris ánimus volávit = hasta que el alma voló de la tierra,
      liber ad astra. = libre, a los astros.
    - |-
      Inde iam gaudent míseris adésse, = Por eso ya se alegran de asistir a los desdichados,
      fléntium tergunt lácrimas, medéntur = enjugan las lágrimas de los que lloran, curan
      méntium plagis, vitiáta reddunt = las heridas de las almas, devuelven la salud
      membra salúti. = a los miembros dañados.
    - |-
      Nostra laus ergo résonet benígnis = Resuene, pues, nuestra alabanza a estos
      his Dei servis referátque grates, = benignos siervos de Dios, y les dé gracias,
      qui pia pergant ope nos iuváre = para que sigan ayudándonos con su piadoso auxilio
      rebus in arctis. = en las estrecheces.
    - |-
      Sit Deo soli decus et potéstas, = Sea a Dios solo el honor y el poder,
      laus in excélsis honor ac perénnis, = la alabanza en las alturas, el honor perenne,
      qui suis totum móderans gubérnat = que, moderándolo todo, gobierna el mundo
      légibus orbem. = con sus leyes.
  iesu-corona-celsior:
    titulo: Iesu, coróna célsior
    amen: true
    estrofas:
    - |-
      Iesu, coróna célsior = Jesús, corona más excelsa
      et véritas sublímior, = y verdad más sublime,
      qui confiténti sérvulo = que al siervo que te confiesa
      reddis perénne prǽmium, = le das el premio perenne:
    - |-
      Da supplicánti cœ́tui, = da a la asamblea que te suplica,
      huius rogátu cǽlitis, = por el ruego de este santo del cielo,
      remissiónem críminum = la remisión de los pecados,
      rumpéndo nexum vínculi. = rompiendo el lazo de la cadena.
    - |-
      Nil vanitátis díligens, = No amando nada vano,
      terréna sic exércuit, = se ocupó de lo terreno de tal modo
      ut mente tota férvidus = que, ferviente con toda el alma,
      tibi placéret únice. = te agradaba solo a ti.
    - |-
      Te, Christe, rex piíssime, = Confesándote aquí continuamente
      hic confiténdo iúgiter, = a ti, Cristo, rey piadosísimo,
      calcávit hostem fórtiter = pisoteó con valentía al enemigo
      supérbum ac satéllitem. = soberbio y a su secuaz.
    - |-
      Virtúte clarus et fide, = Ilustre en la virtud y en la fe,
      oratióni sédulus = asiduo en la oración
      ac membra servans sóbria, = y guardando sobrios sus miembros,
      dapes supérnas óbtinet. = obtiene los manjares del cielo.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      tibíque soli Fílio = y a ti, su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  beata-caeli-gaudia:
    titulo: Beáta cæli gáudia
    amen: true
    estrofas:
    - |-
      Beáta cæli gáudia, = Los gozos dichosos del cielo,
      confessiónis prǽmium, = premio de la confesión [de la fe],
      Christi o fidéles ásseclæ, = oh fieles seguidores de Cristo,
      iam possidétis áffatim. = ya los poseéis en abundancia.
    - |-
      Laudes benígnis áuribus = Escuchad con oídos benignos
      audíte, quas effúndimus = las alabanzas que os dirigimos
      nos éxsules de pátria = nosotros, desterrados de la patria,
      vobis sacráto cántico. = con un canto sagrado.
    - |-
      Amóre Christi pérciti = Impulsados por el amor de Cristo
      crucem tulístis ásperam, = llevasteis la cruz áspera,
      obœdiéntes, ímpigri = obedientes, diligentes
      et caritáte férvidi. = y fervientes de caridad.
    - |-
      Sprevístis artes dǽmonum = Despreciasteis las artes de los demonios
      fallaciásque sǽculi; = y los engaños del mundo;
      Christum faténdo móribus = confesando a Cristo con las costumbres,
      migrástis inter sídera. = emigrasteis entre los astros.
    - |-
      Iam nunc potíti glória = Ya que gozáis de la gloria,
      adéste votis ómnium = asistid a los votos de todos
      ardénter exoptántium = los que desean ardientemente
      exémpla vestra prósequi. = seguir vuestros ejemplos.
    - |-
      Sit Trinitáti glória, = Gloria a la Trinidad,
      quæ pro sua cleméntia = que, por su clemencia
      vobísque suffragántibus = y con vuestra intercesión,
      nos ducat ad cæléstia. = nos lleve a lo celestial.
  fortem-virili-pectore:
    titulo: Fortem viríli péctore
    amen: true
    estrofas:
    - |-
      Fortem viríli péctore = A la mujer fuerte, de pecho varonil,
      laudémus omnes féminam, = alabemos todos,
      quæ sanctitátis glória = que por la gloria de la santidad
      ubíque fulget ínclita. = brilla ínclita en todas partes.
    - |-
      Hæc sancto amóre sáucia, = Ella, herida por el santo amor,
      huius cadúca sǽculi = mientras pisotea lo caduco
      dum calcat, ad cæléstia = de este mundo, recorrió el arduo
      iter perégit árduum. = camino hacia lo celestial.
    - |-
      Carnem domans ieiúniis, = Dominando la carne con ayunos
      dulcíque mentem pábulo = y alimentando la mente con el dulce
      oratiónis nútriens, = alimento de la oración,
      cæli potítur gáudiis. = goza de los gozos del cielo.
    - |-
      Rex Christe, virtus fórtium, = Rey Cristo, fuerza de los fuertes,
      qui magna solus éfficis, = que solo haces grandes cosas,
      huius precátu, quǽsumus, = por su ruego, te pedimos,
      audi benígnus súpplices. = escucha benigno a los que te suplican.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui nos beátæ sérvulæ = que nos concedes esperar la intercesión
      speráre das suffrágia = de tu bienaventurada sierva
      et sempitérna prǽmia. = y los premios sempiternos.
  christe-cunctorum-sator-et-redemptor:
    titulo: Christe, cunctórum sator et redémptor
    amen: true
    estrofas:
    - |-
      Christe, cunctórum sator et redémptor, = Cristo, creador y redentor de todas las cosas,
      síderum, terræ, maris atque rector, = gobernante de los astros, de la tierra y del mar,
      ómnium laudes tibi personántum = perdona la culpa de todos
      solve reátum, = los que te cantan alabanzas,
    - |-
      Vase qui gemmas frágili recóndis, = tú que guardas gemas en un vaso frágil,
      víribus fluxas ánimo pudícas = haciendo de mujeres débiles en fuerzas
      féminas reddens faciénsque claros = almas pudorosas, y haciéndolas llevar
      ferre triúmphos. = ilustres triunfos.
    - |-
      Quas et in sensu téneras vidémus, = A las que vemos tiernas en el sentir,
      prærogatíva mériti corónas, = las coronas con el privilegio del mérito,
      íncolas regni facis et perénnes = y las haces moradoras perennes
      esse supérni. = del reino celestial.
    - |-
      Sit Patri summo decus atque virtus, = Sea al Padre altísimo el honor y el poder,
      laus tibi Nato celebrísque cultus, = la alabanza a ti, el Hijo, y un culto solemne,
      Flámini Sancto párilis potéstas = al Espíritu Santo un poder igual,
      nunc et in ævum. = ahora y por siempre.
  haec-femina-laudabilis:
    titulo: Hæc fémina laudábilis
    amen: true
    estrofas:
    - |-
      Hæc fémina laudábilis = Esta mujer digna de alabanza
      et honoráta méritis, = y honrada por sus méritos,
      ut sanctis pollet móribus, = así como sobresale por sus santas costumbres,
      triúmphat sic cum ángelis. = así triunfa con los ángeles.
    - |-
      Ex corde devotíssimo = Con un corazón devotísimo,
      orans Deum cum lácrimis, = orando a Dios con lágrimas,
      vigíliis, ieiúniis = se mantenía en vigilias
      hærébat hæc assíduis. = y ayunos asiduos.
    - |-
      Contémnens mundi glóriam = Despreciando la gloria del mundo
      ac mente semper íntegra, = y con la mente siempre íntegra,
      perféctam post iustítiam = después de una justicia perfecta
      migrávit super sídera. = emigró sobre los astros.
    - |-
      Quæ sanctitátis áctibus = La que con actos de santidad
      sua ditávit límina, = enriqueció su casa
      lætátur nunc perpétuis = se alegra ahora con los premios perpetuos
      cæléstis ædis prǽmiis. = de la morada celestial.
    - |-
      Laus uni ac trino Dómino, = Alabanza al Señor uno y trino,
      qui nos eius precátibus, = que por sus súplicas,
      perácto vitæ término, = acabado el término de la vida,
      coniúngat cæli cívibus. = nos una a los ciudadanos del cielo.
  hae-feminae-laudabiles:
    titulo: Hæ féminæ laudábiles
    amen: true
    estrofas:
    - |-
      Hæ féminæ laudábiles = Estas mujeres dignas de alabanza
      et honorátæ méritis, = y honradas por sus méritos,
      ut sanctis pollent móribus, = así como sobresalen por sus santas costumbres,
      triúmphant sic cum ángelis. = así triunfan con los ángeles.
    - |-
      Ex corde devotíssimo = Con un corazón devotísimo,
      in fletu orántes Dóminum, = orando al Señor entre lágrimas,
      vigíliis, ieiúniis = se mantenían en vigilias
      hærébant istæ assíduis. = y ayunos asiduos.
    - |-
      Spernéntes mundi glóriam = Despreciando la gloria del mundo
      ac mente semper íntegra, = y con la mente siempre íntegra,
      perféctam post iustítiam = después de una justicia perfecta
      migrárunt super sídera. = emigraron sobre los astros.
    - |-
      Quæ sanctitátis áctibus = Las que con actos de santidad
      sua ditárunt límina, = enriquecieron sus casas
      lætántur nunc perpétuis = se alegran ahora con los premios perpetuos
      cæléstis ædis prǽmiis. = de la morada celestial.
    - |-
      Laus uni ac trino Dómino, = Alabanza al Señor uno y trino,
      qui nos eárum précibus, = que por sus súplicas,
      perácto vitæ término, = acabado el término de la vida,
      coniúngat cæli cívibus. = nos una a los ciudadanos del cielo.
  nobilem-christi-famulam-diserta:
    titulo: Nóbilem Christi fámulam disérta
    amen: true
    estrofas:
    - |-
      Nóbilem Christi fámulam disérta = A la noble sierva de Cristo, con voz
      voce cantémus, decus æmulátam = elocuente cantemos, que imitó la gloria
      féminæ fortis, sacra cui profúdit = de la mujer fuerte, a quien la página sagrada
      página laudes. = prodigó alabanzas.
    - |-
      Cui fides vivax, pia spes amórque = En ella, la fe viva, la esperanza piadosa y el amor
      in Deum fervens, óperum bonórum = ferviente a Dios, raíz fecunda
      fértilis radix, amor unde fratrum = de buenas obras, de donde el amor a los hermanos
      náscitur ultro. = nace espontáneamente.
    - |-
      Motus illíus méritis, remítte, = Movido por sus méritos, perdona,
      sóntibus nobis scelus omne, Iesu, = Jesús, a nosotros, culpables, todo pecado,
      ut tibi puro resonémus æquas = para que con pecho puro te cantemos
      péctore laudes. = las alabanzas debidas.
    - |-
      Sit Patri summo decus atque virtus, = Sea al Padre altísimo el honor y el poder,
      laus tibi Nato celebrísque cultus, = la alabanza a ti, el Hijo, y un culto solemne,
      Flámini Sancto párilis potéstas = al Espíritu Santo un poder igual,
      nunc et in ævum. = ahora y por siempre.
  nobiles-christi-famulas-diserta:
    titulo: Nóbiles Christi fámulas disérta
    amen: true
    estrofas:
    - |-
      Nóbiles Christi fámulas disérta = A las nobles siervas de Cristo, con voz
      voce cantémus, decus æmulátas = elocuente cantemos, que imitaron la gloria
      féminæ fortis, sacra cui profúdit = de la mujer fuerte, a quien la página sagrada
      página laudes. = prodigó alabanzas.
    - |-
      Non eas mundus láqueis revíncit, = No las atrapa el mundo con sus lazos
      iussa quæ Patris súbeunt voléntes, = a ellas, que cumplen gustosas los mandatos del Padre,
      ut bonum Christi sátagant ubíque = para esforzarse por esparcir por todas partes
      spárgere odórem. = el buen olor de Cristo.
    - |-
      Edómant corpus, precibúsque mentem = Dominan el cuerpo, y alimentan la mente
      nútriunt sanctis; peritúra temnunt = con santas oraciones; desprecian las ganancias
      lucra, ut inquírant sibi permanéntis = perecederas, para buscar para sí los premios
      prǽmia vitæ. = de la vida que permanece.
    - |-
      Sit Deo soli decus et potéstas, = Sea a Dios solo el honor y el poder,
      laus in excélsis honor ac perénnis, = la alabanza en las alturas, el honor perenne,
      qui suis totum móderans gubérnat = que, moderándolo todo, gobierna el mundo
      légibus orbem. = con sus leyes.
  laeti-colentes-famulum:
    titulo: Læti coléntes fámulum
    amen: true
    estrofas:
    - |-
      Læti coléntes fámulum = Alegres, venerando al siervo
      qui te perfécte cóluit, = que te sirvió perfectamente,
      tibi gratánter, Dómine, = te ofrecemos con gratitud, Señor,
      amóris hymnum prómimus. = un himno de amor.
    - |-
      Christi fidélis ássecla, = Fiel seguidor de Cristo,
      ultro relíquit gáudia = dejó por propia voluntad todos los gozos
      cuncta quæ mundus éxhibet = que el mundo ofrece
      fugáces atque cópias. = y las riquezas fugaces.
    - |-
      Tibi se vovit súbditum = Se consagró a ti como súbdito,
      humilitáte obœ́diens, = obediente con humildad,
      Christi, carnis mundítie, = imitador, por la pureza de la carne,
      sponsi æmulátor vírginum. = de las vírgenes de Cristo, el esposo.
    - |-
      Tibi placére géstiit = Ansió agradarte
      tibíque adhǽsit únice, = y se unió solo a ti,
      mentem, verba vel ópera = alimentando su mente, sus palabras y sus obras
      amóris fovens ígnibus. = con los fuegos del amor.
    - |-
      His caritátis vínculis = Entregado a ti en la tierra
      in terris tibi déditus, = con estos lazos de caridad,
      liber ad astra iúgiter = salió libre hacia los astros
      triumphatúrus pródiit. = para triunfar para siempre.
    - |-
      Eius exémplis éxcitos = A nosotros, movidos por sus ejemplos,
      da gradi nos alácriter, = concédenos avanzar con presteza,
      ut te cum Nato et Spíritu = para alabarte, con el Hijo y el Espíritu,
      laudémus hymnis cǽlicis. = con himnos celestiales.
    variantes:
      mujer:
        1: |-
          Læti coléntes fámulam = Alegres, venerando a la sierva
          quæ te perfécte cóluit, = que te sirvió perfectamente,
          tibi gratánter, Dómine, = te ofrecemos con gratitud, Señor,
          amóris hymnum prómimus. = un himno de amor.
        3: |-
          Tibi se vovit súbditam = Se consagró a ti como súbdita,
          humilitáte obœ́diens, = obediente con humildad,
          Christi, carnis mundítie, = imitadora, por la pureza de la carne,
          sponsi æmulátrix vírginum. = de las vírgenes de Cristo, el esposo.
        5: |-
          His caritátis vínculis = Entregada a ti en la tierra
          in terris sibi dédita, = con estos lazos de caridad,
          líbera ad astra iúgiter = salió libre hacia los astros
          triumphatúra pródiit. = para triunfar para siempre.
  o-redemptoris-pietas-colenda:
    titulo: O redemptóris píetas colénda
    amen: true
    estrofas:
    - |-
      O redemptóris píetas colénda, = ¡Oh piedad del Redentor, digna de veneración,
      quæ Patri exóptans hómines dicári, = que, deseando consagrar los hombres al Padre,
      Spíritus miro varióque ducis = conduces los corazones con la admirable y variada
      péctora nutu! = inspiración del Espíritu!
    - |-
      Quos tua lympha facis esse natos = A los que con tu agua haces nacer
      ex Deo vero, nova vis in illis = del Dios verdadero, una fuerza nueva en ellos
      grátiam crebro dare caritátis = da con frecuencia, como gracia, gérmenes
      gérmina, Christe. = de caridad, Cristo.
    - |-
      Tu vocas: currunt álacres vocáti, = Tú llamas: corren ágiles los llamados,
      ábdicant cunctis, duce te voléntes, = renuncian a todo, queriendo, contigo como guía,
      calle regáli crucis, usque solum = por el camino real de la cruz, buscar
      quǽrere Patrem. = solo al Padre.
    - |-
      Cǽlitus fervens ita sanctus iste = Ferviente desde el cielo, este santo
      víribus totis tibi amánter hæsit, = se unió así a ti con amor, con todas sus fuerzas,
      atque virtútum cúpiit tenére = y deseó alcanzar las alegres
      cúlmina læta. = cumbres de las virtudes.
    - |-
      Laus Patri summo, tibi, Christe princeps, = Alabanza al Padre altísimo, a ti, Cristo príncipe,
      Flámini Sancto párilis resúltet, = y resuene igual al Espíritu Santo,
      parva qui danti, bona corde magno = que al que da poco le devolvéis, con gran corazón,
      céntupla fertis. = bienes centuplicados.
  qui-vivis-ante-saecula:
    titulo: Qui vivis ante sǽcula
    amen: true
    estrofas:
    - |-
      Qui vivis ante sǽcula = Tú que vives antes de los siglos
      vitǽque fons es únicus, = y eres la única fuente de la vida,
      nos, Deus, morti obnóxios = a nosotros, oh Dios, sujetos a la muerte
      culpǽque reos áspice. = y reos de culpa, míranos.
    - |-
      Peccánti, Pater, hómini = Al hombre que pecó, Padre,
      pœnam sanxísti intéritum, = le impusiste como pena la muerte,
      ut, pulvis datus púlveri, = para que, polvo devuelto al polvo,
      se súbderet piáculum. = se sometiera a la expiación.
    - |-
      Vitále sed spiráculum = Pero el soplo vital
      quod indidísti próvidus, = que infundiste con providencia
      æternitátis pérmanet = permanece como germen
      germen immarcescíbile. = imperecedero de eternidad.
    - |-
      Hæc spes, hoc est solácium: = Esta es la esperanza, este el consuelo:
      revirescémus, Dómine, = reverdeceremos, Señor,
      primúsque resurgéntium = y Cristo, el primero de los que resucitan,
      ad te nos Christus rápiet. = nos llevará hacia ti.
    - |-
      Hoc vitæ regno pérfrui = Concede gozar de este reino de la vida
      defúnctum præsta fámulum, = a tu siervo difunto,
      quem Christi fides ímbuit, = a quien la fe de Cristo impregnó,
      quem almus unxit Spíritus. = a quien ungió el Espíritu bondadoso.
    - |-
      Hoc regnum nobis própera = Apresura este reino para nosotros,
      e terris cum cessérimus, = cuando hayamos dejado la tierra,
      ut concinámus ómnium = para que cantemos que tú eres
      te finem, te princípium. = el fin y el principio de todas las cosas.
    variantes:
      una:
        5: |-
          Hoc vitæ regno pérfrui = Concede gozar de este reino de la vida
          defúnctam præsta fámulam, = a tu sierva difunta,
          quam Christi fides ímbuit, = a quien la fe de Cristo impregnó,
          quam almus unxit Spíritus. = a quien ungió el Espíritu bondadoso.
      varios:
        5: |-
          Hoc vitæ regno pérfrui = Concede gozar de este reino de la vida
          da fratres in te mórtuos, = a los hermanos muertos en ti,
          quos Christi fides ímbuit, = a quienes la fe de Cristo impregnó,
          quos almus unxit Spíritus. = a quienes ungió el Espíritu bondadoso.
  spes-christe-nostrae-veniae:
    titulo: Spes, Christe, nostræ véniæ
    amen: true
    estrofas:
    - |-
      Spes, Christe, nostræ véniæ, = Cristo, esperanza de nuestro perdón,
      tu vita, resurréctio; = tú, vida y resurrección;
      ad te sunt corda et óculi = a ti se dirigen los corazones y los ojos
      cum mortis dolor íngruit. = cuando acecha el dolor de la muerte.
    - |-
      Tu quoque mortis tǽdia = Tú también, habiendo padecido el hastío
      passus dirósque stímulos, = de la muerte y sus crueles aguijones,
      Patri, inclináto cápite, = inclinando la cabeza, al Padre
      mitis dedísti spíritum. = entregaste manso el espíritu.
    - |-
      Vere nostros excípiens = Tomando verdaderamente sobre ti
      languóres, pastor míserens, = nuestras dolencias, pastor compasivo,
      tecum donásti cómpati = nos concediste padecer contigo
      Patrísque in sinu cómmori. = y morir contigo en el seno del Padre.
    - |-
      Apértis pendens bráchiis, = Colgado con los brazos abiertos,
      in cor transfíxum pértrahis = atraes a tu corazón traspasado
      quos moritúros ággravat = a los que, a punto de morir, agobia
      morbus vel mæror ánxius. = la enfermedad o la angustiosa tristeza.
    - |-
      Qui portis fractis ínferi = Tú que, rotas las puertas del infierno,
      victor pandísti cǽlicas, = abriste vencedor las del cielo,
      nos nunc doléntes érige, = levántanos ahora en el dolor,
      post óbitum vivífica. = vivifícanos después de la muerte.
    - |-
      Sed et qui frater córpore = Y también el hermano que en el cuerpo
      nunc dormit pacis réquie, = duerme ahora en el descanso de la paz,
      iam te beánte vígilet = que, dichoso por ti, despierte ya
      tibíque laudes réferat. = y te tribute alabanzas.
    variantes:
      una:
        6: |-
          Sed et quæ soror córpore = Y también la hermana que en el cuerpo
          nunc dormit pacis réquie, = duerme ahora en el descanso de la paz,
          iam te beánte vígilet = que, dichosa por ti, despierte ya
          tibíque laudes réferat. = y te tribute alabanzas.
      varios:
        6: |-
          Sed et qui fratres córpore = Y también los hermanos que en el cuerpo
          nunc somno pacis dórmiunt, = duermen ahora el sueño de la paz,
          iam te beánte vígilent = que, dichosos por ti, despierten ya
          tibíque laudes réferant. = y te tributen alabanzas.
  immensae-rex-potentiae:
    titulo: Imménsæ rex poténtiæ
    amen: true
    estrofas:
    - |-
      Imménsæ rex poténtiæ, = Rey de poder inmenso,
      Christe, tu Patris glóriam = Cristo, tú, procurando la gloria del Padre
      nostrúmque decus móliens, = y nuestro honor,
      mortis fregísti iácula. = quebraste los dardos de la muerte.
    - |-
      Infírma nostra súbiens = Tomando sobre ti nuestras debilidades
      magnúmque petens prœ́lium, = y entrando en un gran combate,
      mortem qua serpens vícerat, = la muerte con la que la serpiente había vencido
      victor calcásti móriens. = la pisoteaste, vencedor, al morir.
    - |-
      Surgens fortis e túmulo, = Resucitando fuerte del sepulcro,
      pascháli nos mystério = por el misterio pascual
      peccáto rursus mórtuos = a nosotros, muertos de nuevo por el pecado,
      ad vitam semper ínnovas. = nos renuevas siempre para la vida.
    - |-
      Vitam largíre grátiæ, = Concede la vida de la gracia,
      ut, sponsus cum redíeris, = para que, cuando vuelvas como esposo,
      ornáta nos cum lámpade = nos encuentres ya preparados para el cielo,
      iam promptos cælo invénias. = con la lámpara adornada.
    - |-
      In lucem nos et réquiem = En la luz y en el descanso
      serénus iudex áccipe, = recíbenos, juez sereno,
      quos fides Sanctæ Tríadi = a los que la fe y la caridad
      devínxit atque cáritas. = unieron a la Santa Trinidad.
    - |-
      Tuúmque voca fámulum, = Y llama a tu siervo,
      qui nunc exútus córpore = que ahora, despojado del cuerpo,
      in regna Patris ínhiat, = anhela el reino del Padre,
      ut te colláudet pérpetim. = para que te alabe para siempre.
    variantes:
      una:
        6: |-
          Tuámque voca fámulam, = Y llama a tu sierva,
          quæ nunc exúta córpore = que ahora, despojada del cuerpo,
          in regna Patris ínhiat, = anhela el reino del Padre,
          ut te colláudet pérpetim. = para que te alabe para siempre.
      varios:
        6: |-
          Fratres et omnes ádvoca, = Y llama a todos los hermanos,
          qui nunc exúti córpore = que ahora, despojados del cuerpo,
          in regna Patris ínhiant, = anhelan el reino del Padre,
          ut te colláudent pérpetim. = para que te alaben para siempre.
  qui-lacrimatus-lazarum:
    titulo: Qui lacrimátus Lázarum
    amen: true
    estrofas:
    - |-
      Qui lacrimátus Lázarum = Tú que lloraste a Lázaro
      geménsque cum soróribus, = y gemiste con sus hermanas,
      ipsum fecísti prǽpotens = e hiciste, poderoso,
      illárum reddi stúdiis: = que él les fuera devuelto por sus ruegos;
    - |-
      Qui petivísti sóntibus = tú que pediste, benigno,
      benígnus indulgéntiam, = el perdón para los culpables,
      ac verba miserántia = y dijiste palabras de misericordia
      dixísti pœnæ sócio: = al compañero de suplicio;
    - |-
      Qui, móriens, discípulo = tú que, al morir, al discípulo
      matrem donásti Vírginem, = le diste por madre a la Virgen,
      tuórum quæ fidélium = para que asistiera a tus fieles
      agóni adésset último: = en su última agonía:
    - |-
      Da nobis, Christe Dómine, = concédenos, Cristo Señor,
      tuo redémptis sánguine, = a los redimidos con tu sangre,
      duræ mortis tristítiam = que la tristeza de la dura muerte
      in vitæ verti gáudium. = se convierta en gozo de la vida.
    - |-
      Tuúmque voca fámulum, = Y llama a tu siervo,
      ex hoc proféctum sǽculo, = partido de este mundo,
      ut ubi mors iam déerit = para que, donde ya no habrá muerte,
      te vitæ canat príncipem. = te cante como príncipe de la vida.
    variantes:
      una:
        5: |-
          Tuámque voca fámulam, = Y llama a tu sierva,
          ex hoc proféctam sǽculo, = partida de este mundo,
          ut ubi mors iam déerit = para que, donde ya no habrá muerte,
          te vitæ canat príncipem. = te cante como príncipe de la vida.
      varios:
        5: |-
          Tuósque voca fámulos, = Y llama a tus siervos,
          ex hoc proféctos sǽculo, = partidos de este mundo,
          ut ubi mors iam déerit = para que, donde ya no habrá muerte,
          te vitæ canant príncipem. = te canten como príncipe de la vida.
  deus-creator-omnium:
    titulo: Deus, creátor ómnium
    amen: true
    estrofas:
    - |-
      Deus, creátor ómnium = Dios, creador de todas las cosas
      políque rector, véstiens = y gobernante del cielo, que revistes
      diem decóro lúmine, = el día de hermosa luz
      noctem sopóris grátia, = y la noche con la gracia del sueño,
    - |-
      Artus solútos ut quies = para que el descanso devuelva los miembros
      reddat labóris úsui = relajados al uso del trabajo,
      mentésque fessas állevet = alivie las mentes cansadas
      luctúsque solvat ánxios, = y disipe las penas angustiosas:
    - |-
      Grates perácto iam die = acabado ya el día,
      et noctis exórtu preces, = y al nacer la noche, [te damos] gracias y súplicas;
      voti reos ut ádiuves, = obligados por un voto, para que nos ayudes,
      hymnum canéntes sólvimus. = lo cumplimos cantando un himno.
    - |-
      Te cordis ima cóncinant, = Que te canten lo íntimo del corazón,
      te vox canóra cóncrepet, = que te celebre la voz sonora,
      te díligat castus amor, = que te ame el amor casto,
      te mens adóret sóbria, = que te adore la mente sobria,
    - |-
      Ut cum profúnda cláuserit = para que, cuando la oscuridad profunda
      diem calígo nóctium, = de las noches haya encerrado el día,
      fides ténebras nésciat = la fe no conozca tinieblas
      et nox fide relúceat. = y la noche resplandezca por la fe.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  dies-aetasque-ceteris:
    titulo: Dies ætásque céteris
    amen: true
    estrofas:
    - |-
      Dies ætásque céteris = Día y edad, más santo que los demás,
      octáva splendet sánctior = resplandece el octavo,
      in te quam, Iesu, cónsecras, = que tú, Jesús, consagras en ti,
      primítiæ surgéntium. = primicia de los que resucitan.
    - |-
      Tu tibi nostras ánimas = Tú resucita ahora para ti, primero,
      nunc primo conresúscita; = nuestras almas;
      tibi consúrgant córpora = que los cuerpos se levanten para ti
      secúnda morte líbera. = libres de la segunda muerte.
    - |-
      Tibíque mox in núbibus, = Y que pronto, en las nubes,
      Christe, ferámur óbviam = seamos llevados a tu encuentro, Cristo,
      tecum victúri pérpetim: = para vivir contigo por siempre:
      tu vita, resurréctio. = tú, la vida, la resurrección.
    - |-
      Cuius vidéntes fáciem, = Viendo tu rostro,
      configurémur glóriæ; = seamos configurados a tu gloria;
      te cognoscámus sicut es, = que te conozcamos tal como eres,
      lux vera et suávitas. = luz verdadera y dulzura.
    - |-
      Regnum, cum Patri tráditos, = Entregados al Padre en el Reino,
      plenos septéno chrísmate, = llenos de la séptuple unción,
      in temet nos lætíficas, = en ti mismo nos alegras;
      consúmmet Sancta Trínitas. = que lo consume la Santa Trinidad.
  primo-dierum-omnium:
    titulo: Primo diérum ómnium
    amen: true
    estrofas:
    - |-
      Primo diérum ómnium, = En el primero de todos los días,
      quo mundus exstat cónditus = en que el mundo fue creado
      vel quo resúrgens cónditor = o en que el Creador, resucitando,
      nos, morte victa, líberat, = vencida la muerte, nos libra,
    - |-
      Pulsis procul torpóribus, = echada lejos la pereza,
      surgámus omnes ócius, = levantémonos todos cuanto antes,
      et nocte quærámus pium, = y busquemos de noche al Piadoso,
      sicut Prophétam nóvimus, = como sabemos que lo hizo el Profeta,
    - |-
      Nostras preces ut áudiat = para que escuche nuestras súplicas,
      suámque dextram pórrigat, = nos tienda su diestra
      et hic piátos sórdibus = y, purificados aquí de las manchas,
      reddat polórum sédibus, = nos devuelva a las moradas del cielo,
    - |-
      Ut, quique sacratíssimo = para que a cuantos en el tiempo
      huius diéi témpore = santísimo de este día
      horis quiétis psállimus, = salmodiamos en las horas de reposo
      donis beátis múneret. = nos recompense con dones dichosos.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  aeterne-rerum-conditor:
    titulo: Ætérne rerum cónditor
    amen: true
    estrofas:
    - |-
      Ætérne rerum cónditor, = Eterno creador de las cosas,
      noctem diémque qui regis, = que gobiernas la noche y el día
      et témporum das témpora = y das a los tiempos sus tiempos
      ut álleves fastídium, = para aliviar el hastío,
    - |-
      Præco diéi iam sonat, = ya suena el heraldo del día,
      noctis profúndæ pérvigil, = centinela de la noche profunda,
      noctúrna lux viántibus = luz nocturna para los caminantes,
      a nocte noctem ségregans. = que separa una noche de la otra.
    - |-
      Hoc excitátus lúcifer = Despertado por él, el lucero
      solvit polum calígine; = libra al cielo de la oscuridad;
      hoc omnis errónum chorus = por él, todo el coro de los vagabundos
      vias nocéndi déserit. = abandona los caminos de hacer daño.
    - |-
      Hoc nauta vires cólligit = Por él, el navegante recobra las fuerzas
      pontíque mitéscunt freta; = y se calman las olas del mar;
      hoc, ipse Petra Ecclésiæ, = por él, la misma Piedra de la Iglesia,
      canénte, culpam díluit. = al cantar [el gallo], lavó su culpa.
    - |-
      Iesu, labántes réspice = Jesús, mira a los que vacilan
      et nos vidéndo córrige; = y corrígenos con tu mirada;
      si réspicis, lapsus cadunt = si nos miras, caen las faltas
      fletúque culpa sólvitur. = y la culpa se disuelve en llanto.
    - |-
      Tu, lux, refúlge sénsibus = Tú, luz, brilla en los sentidos
      mentísque somnum díscute; = y sacude el sueño de la mente;
      te nostra vox primum sonet = que nuestra voz te cante primero a ti
      et vota solvámus tibi. = y te cumplamos nuestros votos.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  lucis-creator-optime:
    titulo: Lucis creátor óptime
    amen: true
    estrofas:
    - |-
      Lucis creátor óptime, = Óptimo creador de la luz,
      lucem diérum próferens, = que haces brotar la luz de los días
      primórdiis lucis novæ = y, con los comienzos de la luz nueva,
      mundi parans oríginem; = preparas el origen del mundo;
    - |-
      Qui mane iunctum vésperi = tú que mandas llamar día
      diem vocári prǽcipis: = a la mañana unida a la tarde:
      tætrum chaos illábitur; = cae el horrible caos;
      audi preces cum flétibus. = escucha las súplicas con llantos.
    - |-
      Ne mens graváta crímine = Que la mente, agobiada por el pecado,
      vitæ sit exsul múnere, = no quede desterrada del don de la vida,
      dum nil perénne cógitat = mientras no piensa nada perenne
      seséque culpis ílligat. = y se enreda en las culpas.
    - |-
      Cælórum pulset íntimum, = Que llame a lo más íntimo del cielo,
      vitále tollat prǽmium; = que alcance el premio de la vida;
      vitémus omne nóxium, = evitemos todo lo dañino,
      purgémus omne péssimum. = purifiquemos todo lo malo.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  somno-refectis-artubus:
    titulo: Somno reféctis ártubus
    amen: true
    estrofas:
    - |-
      Somno reféctis ártubus, = Repuestos los miembros por el sueño,
      spreto cubíli, súrgimus: = dejado el lecho, nos levantamos:
      nobis, Pater, canéntibus = te pedimos, Padre, que estés presente
      adésse te depóscimus. = con nosotros, que cantamos.
    - |-
      Te lingua primum cóncinat, = Que la lengua te cante primero a ti,
      te mentis ardor ámbiat, = que el ardor de la mente te busque,
      ut áctuum sequéntium = para que de los actos que siguen
      tu, sancte, sis exórdium. = tú, santo, seas el comienzo.
    - |-
      Cedant ténebræ lúmini = Cedan las tinieblas a la luz
      et nox diúrno síderi, = y la noche al astro del día,
      ut culpa, quam nox íntulit, = para que la culpa que trajo la noche
      lucis labáscat múnere. = se desvanezca con el don de la luz.
    - |-
      Precámur idem súpplices = Te pedimos también, suplicantes,
      noxas ut omnes ámputes, = que cortes todas las faltas,
      et ore te canéntium = y por boca de los que te cantan
      laudéris in perpétuum. = seas alabado para siempre.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  aeterna-lux-divinitas:
    titulo: Ætérna lux, divínitas
    amen: true
    estrofas:
    - |-
      Ætérna lux, divínitas, = Luz eterna, divinidad,
      in unitáte Trínitas, = Trinidad en la unidad,
      te confitémur débiles, = te confesamos, débiles,
      te deprecámur súpplices. = te suplicamos, suplicantes.
    - |-
      Summum Paréntem crédimus = Creemos en el sumo Padre
      Natúmque Patris únicum, = y en el Hijo único del Padre,
      et caritátis vínculum = y en el Espíritu, vínculo de caridad
      qui iungit illos Spíritum. = que los une.
    - |-
      O véritas, o cáritas, = Oh verdad, oh caridad,
      o finis et felícitas, = oh fin y felicidad,
      speráre fac et crédere, = haznos esperar y creer,
      amáre fac et cónsequi. = haznos amar y alcanzar.
    - |-
      Qui finis et exórdium = Tú que eres el fin y el principio
      rerúmque fons es ómnium, = y la fuente de todas las cosas,
      tu solus es solácium, = tú solo eres el consuelo,
      tu certa spes credéntium. = tú, la esperanza cierta de los creyentes.
    - |-
      Qui cuncta solus éfficis = Tú que solo lo haces todo
      cunctísque solus súfficis, = y solo bastas a todos,
      tu sola lux es ómnibus = tú solo eres la luz para todos
      et prǽmium sperántibus. = y el premio de los que esperan.
    - |-
      Christum rogámus et Patrem, = Rogamos a Cristo y al Padre,
      Christi Patrísque Spíritum; = y al Espíritu de Cristo y del Padre:
      unum potens per ómnia, = poderosa en todo, uno,
      fove precántes, Trínitas. = ampara a los que te suplican, Trinidad.
  splendor-paternae-gloriae:
    titulo: Splendor patérnæ glóriæ
    amen: true
    estrofas:
    - |-
      Splendor patérnæ glóriæ, = Resplandor de la gloria del Padre,
      de luce lucem próferens, = que de la luz haces brotar la luz,
      lux lucis et fons lúminis, = luz de la luz y fuente de la luz,
      diem dies illúminans, = día que iluminas el día:
    - |-
      Verúsque sol, illábere = y tú, sol verdadero, desciende,
      micans nitóre pérpeti, = brillando con resplandor perpetuo,
      iubárque Sancti Spíritus = y derrama en nuestros sentidos
      infúnde nostris sénsibus. = el fulgor del Espíritu Santo.
    - |-
      Votis vocémus et Patrem, = Invoquemos también con votos al Padre,
      Patrem perénnis glóriæ, = Padre de la gloria perenne,
      Patrem poténtis grátiæ, = Padre de la gracia poderosa,
      culpam reléget lúbricam. = que aleje la culpa resbaladiza.
    - |-
      Infórmet actus strénuos, = Que inspire los actos esforzados,
      dentem retúndat ínvidi, = que embote el diente del envidioso,
      casus secúndet ásperos, = que haga favorables los trances difíciles,
      donet geréndi grátiam. = que dé la gracia de obrar.
    - |-
      Mentem gubérnet et regat = Que guíe y gobierne la mente
      casto, fidéli córpore; = en un cuerpo casto y fiel;
      fides calóre férveat, = que la fe hierva con calor
      fraudis venéna nésciat. = y no conozca el veneno del engaño.
    - |-
      Christúsque nobis sit cibus, = Que Cristo sea nuestro alimento,
      potúsque noster sit fides; = y la fe, nuestra bebida;
      læti bibámus sóbriam = bebamos alegres la sobria
      ebrietátem Spíritus. = embriaguez del Espíritu.
    - |-
      Lætus dies hic tránseat; = Que este día pase alegre;
      pudor sit ut dilúculum, = que el pudor sea como el alba,
      fides velut merídies, = la fe como el mediodía,
      crepúsculum mens nésciat. = que la mente no conozca el ocaso.
    - |-
      Auróra cursus próvehit; = La aurora avanza en su curso;
      Auróra totus pródeat, = que aparezca toda la Aurora:
      in Patre totus Fílius = todo el Hijo en el Padre
      et totus in Verbo Pater. = y todo el Padre en el Verbo.
  immense-caeli-conditor:
    titulo: Imménse cæli cónditor
    amen: true
    estrofas:
    - |-
      Imménse cæli cónditor, = Inmenso creador del cielo,
      qui, mixta ne confúnderent, = que, para que no confundieran lo mezclado,
      aquæ fluénta dívidens, = dividiendo las corrientes del agua,
      cælum dedísti límitem, = diste el firmamento como límite,
    - |-
      Firmans locum cæléstibus = asentando un lugar a las aguas de arriba
      simúlque terræ rívulis, = y a la vez a los arroyos de la tierra,
      ut unda flammas témperet, = para que el agua templara las llamas
      terræ solum ne díssipet: = y no disipara el suelo de la tierra:
    - |-
      Infúnde nunc, piíssime, = infunde ahora, piadosísimo,
      donum perénnis grátiæ, = el don de la gracia perenne,
      fraudis novæ ne cásibus = para que, con las caídas de un nuevo engaño,
      nos error átterat vetus. = no nos destruya el antiguo error.
    - |-
      Lucem fides invéniat, = Que la fe encuentre la luz
      sic lúminis iubar ferat; = y así lleve el fulgor de la luz;
      hæc vana cuncta térreat, = que ella aterre todo lo vano,
      hanc falsa nulla cómprimant. = que nada falso la oprima.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  consors-paterni-luminis:
    titulo: Consors patérni lúminis
    amen: true
    estrofas:
    - |-
      Consors patérni lúminis, = Partícipe de la luz del Padre,
      lux ipse lucis et dies, = tú mismo luz de la luz y día,
      noctem canéndo rúmpimus: = rompemos la noche cantando:
      assíste postulántibus. = asiste a los que te piden.
    - |-
      Aufer ténebras méntium, = Quita las tinieblas de las mentes,
      fuga catérvas dǽmonum, = pon en fuga las turbas de los demonios,
      expélle somnoléntiam = expulsa la somnolencia,
      ne pigritántes óbruat. = para que no abrume a los perezosos.
    - |-
      Sic, Christe, nobis ómnibus = Así, Cristo, a todos nosotros,
      indúlgeas credéntibus, = creyentes, concédenos
      ut prosit exorántibus = que aproveche a los que suplicamos
      quod præcinéntes psállimus. = lo que salmodiamos cantando.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-sacrosancta-trinitas:
    titulo: O sacrosáncta Trínitas
    amen: true
    estrofas:
    - |-
      O sacrosáncta Trínitas, = Oh sacrosanta Trinidad,
      quæ cuncta condens órdinas, = que, creándolo todo, lo ordenas,
      diem labóri députans = y, asignando el día al trabajo,
      noctem quiéti dédicas, = dedicas la noche al descanso:
    - |-
      Te mane, simul véspere, = a ti, en la mañana y también en la tarde,
      te nocte ac die cánimus; = a ti, de noche y de día, te cantamos;
      in tua nos tu glória = tú, en tu gloria,
      per cuncta serva témpora. = guárdanos en todo tiempo.
    - |-
      Nos ádsumus te cérnui = Aquí estamos ante ti, postrados,
      en adorántes fámuli; = he aquí tus siervos, que te adoran;
      vota precésque súpplicum = une los votos y las súplicas de los que te imploran
      hymnis adiúnge cǽlitum. = a los himnos de los del cielo.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  pergrata-mundo-nuntiat:
    titulo: Pergráta mundo núntiat
    amen: true
    estrofas:
    - |-
      Pergráta mundo núntiat = La aurora anuncia al mundo, gratísimos,
      auróra solis spícula, = los rayos del sol,
      res et colóre véstiens = y, vistiendo las cosas de color,
      iam cuncta dat nitéscere. = hace ya brillar todo.
    - |-
      Qui sol per ævum prǽnites, = Tú, que por siempre brillas como sol,
      o Christe, nobis vívidus, = oh Cristo, vivo para nosotros,
      ad te canéntes vértimur, = nos volvemos a ti cantando,
      te gestiéntes pérfrui. = deseosos de gozarte.
    - |-
      Tu Patris es sciéntia = Tú eres la sabiduría del Padre
      Verbúmque per quod ómnia = y la Palabra por la que todas las cosas
      miro refúlgent órdine = resplandecen en orden admirable
      mentésque nostras áttrahunt. = y atraen nuestras mentes.
    - |-
      Da lucis ut nos fílii = Haz que, como hijos de la luz,
      sic ambulémus ímpigri, = caminemos así, sin pereza,
      ut Patris usque grátiam = para que nuestras costumbres y actos
      mores et actus éxprimant. = expresen siempre la gracia del Padre.
    - |-
      Sincéra præsta ut prófluant = Concede que de nuestra boca
      ex ore nostro iúgiter, = salgan siempre palabras sinceras,
      et veritátis dúlcibus = y que seamos animados
      ut excitémur gáudiis. = por los dulces gozos de la verdad.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  telluris-ingens-conditor:
    titulo: Tellúris ingens cónditor
    amen: true
    estrofas:
    - |-
      Tellúris ingens cónditor, = Gran creador de la tierra,
      mundi solum qui éruens, = que, sacando el suelo del mundo
      pulsis aquæ moléstiis, = y echando las molestias del agua,
      terram dedísti immóbilem, = diste a la tierra estabilidad,
    - |-
      Ut germen aptum próferens, = para que, produciendo los brotes adecuados,
      fulvis decóra flóribus, = adornada de flores doradas,
      fecúnda fructu sísteret = fuera fecunda en frutos
      pastúmque gratum rédderet: = y diera un grato alimento:
    - |-
      Mentis perústæ vúlnera = lava con el verdor de la gracia
      munda viróre grátiæ, = las heridas de la mente abrasada,
      ut facta fletu díluat = para que borre con el llanto sus hechos
      motúsque pravos átterat, = y aplaste los movimientos malos,
    - |-
      Iussis tuis obtémperet, = obedezca a tus mandatos,
      nullis malis appróximet, = no se acerque a ningún mal,
      bonis repléri gáudeat = se alegre de llenarse de bienes
      et mortis actum nésciat. = y no conozca la obra de la muerte.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  rerum-creator-optime:
    titulo: Rerum creátor óptime
    amen: true
    estrofas:
    - |-
      Rerum creátor óptime = Óptimo creador de las cosas
      rectórque noster, réspice; = y guía nuestro, mira;
      nos a quiéte nóxia = líbranos, sumergidos en el sueño,
      mersos sopóre líbera. = del reposo dañino.
    - |-
      Te, sancte Christe, póscimus; = A ti, Cristo santo, te pedimos:
      ignósce tu crimínibus, = perdona tú los pecados;
      ad confiténdum súrgimus = nos levantamos para confesarte
      morásque noctis rúmpimus. = y rompemos la demora de la noche.
    - |-
      Mentes manúsque tóllimus, = Elevamos las mentes y las manos,
      Prophéta sicut nóctibus = como el Profeta nos manda
      nobis geréndum prǽcipit = hacer de noche
      Paulúsque gestis cénsuit. = y Pablo lo enseñó con sus hechos.
    - |-
      Vides malum quod géssimus; = Ves el mal que hemos hecho;
      occúlta nostra pándimus, = descubrimos lo que tenemos oculto,
      preces geméntes fúndimus; = derramamos súplicas gimiendo;
      dimítte quod peccávimus. = perdona lo que hemos pecado.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  scientiarum-domino:
    titulo: Scientiárum Dómino
    amen: true
    estrofas:
    - |-
      Scientiárum Dómino, = A ti, Señor de las ciencias,
      sit tibi iubilátio, = sea el júbilo,
      qui nostra vides íntima = que ves lo íntimo de nosotros
      tuáque foves grátia. = y lo abrigas con tu gracia.
    - |-
      Qui bonum, pastor óptime, = Tú que, buen pastor, mientras guardas
      dum servas, quæris pérditum, = el bien, buscas lo perdido,
      in páscuis ubérrimis = en pastos abundantísimos
      nos iunge piis grégibus, = únenos a los rebaños piadosos,
    - |-
      Ne terror iræ iúdicis = para que el terror de la ira del juez
      nos hædis iungat réprobis, = no nos una a los cabritos réprobos,
      sed simus temet iúdice = sino que, siendo tú el juez,
      oves ætérnæ páscuæ. = seamos ovejas del pasto eterno.
    - |-
      Tibi, Redémptor, glória, = A ti, Redentor, la gloria,
      honor, virtus, victória, = el honor, el poder, la victoria,
      regnánti super ómnia = que reinas sobre todas las cosas
      per sæculórum sǽcula. = por los siglos de los siglos.
  nox-et-tenebrae-et-nubila:
    titulo: Nox et ténebræ et núbila
    amen: true
    estrofas:
    - |-
      Nox et ténebræ et núbila, = Noche, tinieblas y nubarrones,
      confúsa mundi et túrbida, = confusión y turbulencia del mundo:
      lux intrat, albéscit polus: = entra la luz, blanquea el cielo,
      Christus venit; discédite. = Cristo viene; marchaos.
    - |-
      Calígo terræ scínditur = La oscuridad de la tierra se rasga,
      percússa solis spículo, = herida por el rayo del sol,
      rebúsque iam color redit = y a las cosas vuelve ya el color
      vultu niténtis síderis. = con el rostro del astro que brilla.
    - |-
      Sic nostra mox obscúritas = Así nuestra oscuridad
      fraudísque pectus cónscium, = y el pecho consciente de su engaño,
      ruptis retéctum núbibus, = rotas las nubes, al descubierto,
      regnánte palléscet Deo. = palidecerán cuando Dios reine.
    - |-
      Te, Christe, solum nóvimus, = Solo a ti, Cristo, conocemos;
      te mente pura et símplici = aprendemos a rogarte con mente pura
      rogáre curváto genu = y sencilla, de rodillas,
      flendo et canéndo díscimus. = llorando y cantando.
    - |-
      Inténde nostris sénsibus = Atiende a nuestros sentidos
      vitámque totam díspice: = y examina toda nuestra vida:
      sunt multa fucis íllita = hay muchas cosas manchadas de afeites
      quæ luce purgéntur tua. = que han de ser purificadas por tu luz.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  caeli-deus-sanctissime:
    titulo: Cæli Deus Sanctíssime
    amen: true
    estrofas:
    - |-
      Cæli Deus Sanctíssime, = Santísimo Dios del cielo,
      qui lúcidum centrum poli = que pintas el centro luminoso del cielo
      candóre pingis ígneo = con un resplandor de fuego,
      augens decóro lúmine, = aumentándolo con hermosa luz;
    - |-
      Quarto die qui flámmeam = que al cuarto día, estableciendo
      solis rotam constítuens, = la rueda llameante del sol,
      lunæ minístras órdini = procuras al orden de la luna
      vagos recúrsus síderum, = y a los cursos errantes de los astros,
    - |-
      Ut nóctibus vel lúmini = para dar a las noches y a la luz
      diremptiónis términum, = un término que las separe
      primórdiis et ménsium = y una señal conocidísima
      signum dares notíssimum: = al comienzo de los meses:
    - |-
      Illúmina cor hóminum, = ilumina el corazón de los hombres,
      abstérge sordes méntium, = limpia las manchas de las mentes,
      resólve culpæ vínculum, = desata el lazo de la culpa,
      evérte moles críminum. = derriba el peso de los pecados.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  nox-atra-rerum-contegit:
    titulo: Nox atra rerum cóntegit
    amen: true
    estrofas:
    - |-
      Nox atra rerum cóntegit = La noche negra cubre
      terræ colóres ómnium: = los colores de todas las cosas de la tierra:
      nos confiténtes póscimus = nosotros, confesándonos, te pedimos
      te, iuste iudex córdium, = a ti, justo juez de los corazones,
    - |-
      Ut áuferas piácula = que quites los pecados
      sordésque mentis ábluas, = y laves las manchas de la mente,
      donésque, Christe, grátiam = y nos des, Cristo, la gracia
      ut arceántur crímina. = para que se alejen las culpas.
    - |-
      Mens, ecce, torpet ímpia, = He aquí que la mente impía está entumecida,
      quam culpa mordet nóxia; = mordida por la culpa dañina;
      obscúra gestit tóllere = desea quitar lo oscuro
      et te, Redémptor, quǽrere. = y buscarte a ti, Redentor.
    - |-
      Repélle tu calíginem = Rechaza tú la oscuridad,
      intrínsecus quam máxime, = sobre todo la de dentro,
      ut in beáto gáudeat = para que se alegre de verse
      se collocári lúmine. = colocada en la luz dichosa.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  christe-precamur-adnuas:
    titulo: Christe, precámur ádnuas
    amen: true
    estrofas:
    - |-
      Christe, precámur ádnuas = Cristo, te rogamos que concedas
      orántibus servis tuis, = a tus siervos que te ruegan
      iníquitas hæc sǽculi = que esta iniquidad del mundo
      ne nostram captívet fidem. = no haga cautiva nuestra fe.
    - |-
      Non cogitémus ímpie, = Que no pensemos con impiedad,
      invideámus némini, = que no envidiemos a nadie,
      læsi non reddámus vicem, = que, ofendidos, no devolvamos el mal,
      vincámus in bono malum. = que venzamos el mal con el bien.
    - |-
      Absit nostris e córdibus = Lejos de nuestros corazones
      ira, dolus, supérbia; = la ira, el engaño, la soberbia;
      absístat avarítia, = aléjese la avaricia,
      malórum radix ómnium. = raíz de todos los males.
    - |-
      Consérvet pacis fœ́dera = Que una caridad no fingida
      non simuláta cáritas; = guarde los lazos de la paz;
      sit illibáta cástitas = que la castidad quede intacta
      credulitáte pérpeti. = con una fe perpetua.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  sol-ecce-surgit-igneus:
    titulo: Sol ecce surgit ígneus
    amen: true
    estrofas:
    - |-
      Sol ecce surgit ígneus: = He aquí que surge el sol de fuego:
      piget, pudéscit, pǽnitet, = [nos] pesa, [nos] avergüenza, [nos] arrepentimos,
      nec teste quisquam lúmine = y nadie, con la luz como testigo,
      peccáre constánter potest. = puede pecar con firmeza.
    - |-
      Tandem facéssat cǽcitas, = Que al fin se aleje la ceguera,
      quæ nosmet in præceps diu = que, tras habernos caído de cabeza
      lapsos sinístris gréssibus = con pasos siniestros, por largo tiempo
      erróre traxit dévio. = nos arrastró por un error extraviado.
    - |-
      Hæc lux serénum cónferat = Que esta luz nos dé serenidad
      purósque nos præstet sibi; = y nos haga puros para ella;
      nihil loquámur súbdolum, = que no digamos nada engañoso,
      volvámus obscúrum nihil. = que no tramemos nada oscuro.
    - |-
      Sic tota decúrrat dies, = Que así transcurra todo el día:
      ne lingua mendax, ne manus = que ni la lengua mentirosa, ni las manos,
      oculíve peccent lúbrici, = ni los ojos lascivos pequen,
      ne noxa corpus ínquinet. = que ninguna falta manche el cuerpo.
    - |-
      Speculátor astat désuper, = Un vigía está en lo alto,
      qui nos diébus ómnibus = que todos los días
      actúsque nostros próspicit = mira nuestros actos
      a luce prima in vésperum. = desde la primera luz hasta la tarde.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  magnae-deus-potentiae:
    titulo: Magnæ Deus poténtiæ
    amen: true
    estrofas:
    - |-
      Magnæ Deus poténtiæ, = Dios de gran poder,
      qui ex aquis ortum genus = que a la especie nacida de las aguas
      partim remíttis gúrgiti, = en parte la devuelves al abismo,
      partim levas in áera, = en parte la elevas a los aires,
    - |-
      Demérsa lymphis ímprimens, = hundiendo a unos en las aguas,
      subvécta cælis írrogans, = destinando a otros, levantados, al cielo,
      ut, stirpe una pródita, = para que, salidos de una misma estirpe,
      divérsa répleant loca: = llenen lugares diversos:
    - |-
      Largíre cunctis sérvulis, = concede a todos tus siervecillos,
      quos mundat unda sánguinis, = a los que lava la ola de la sangre,
      nescíre lapsus críminum = no conocer las caídas del pecado
      nec ferre mortis tǽdium, = ni sufrir el hastío de la muerte,
    - |-
      Ut culpa nullum déprimat, = para que la culpa no hunda a ninguno,
      nullum levet iactántia, = que la jactancia no levante a ninguno,
      elísa mens ne cóncidat, = que la mente abatida no se derrumbe,
      eláta mens ne córruat. = que la mente engreída no se precipite.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  tu-trinitatis-unitas:
    titulo: Tu, Trinitátis Únitas
    amen: true
    estrofas:
    - |-
      Tu, Trinitátis Únitas, = Tú, Unidad de la Trinidad,
      orbem poténter qui regis, = que gobiernas el orbe con poder,
      atténde laudum cántica = atiende los cantos de alabanza
      quæ excubántes psállimus. = que salmodiamos en vela.
    - |-
      Nam léctulo consúrgimus = Pues nos levantamos del lecho
      noctis quiéto témpore, = en el tiempo tranquilo de la noche,
      ut flagitémus vúlnerum = para pedirte con insistencia
      a te medélam ómnium, = el remedio de todas las heridas,
    - |-
      Quo, fraude quicquid dǽmonum = para que lo que, por engaño de los demonios,
      in nóctibus delíquimus, = hayamos faltado en las noches,
      abstérgat illud cǽlitus = lo borre desde el cielo
      tuæ potéstas glóriæ. = el poder de tu gloria.
    - |-
      Te corde fido quǽsumus, = Te pedimos con corazón fiel:
      reple tuo nos lúmine, = llénanos de tu luz,
      per quod diérum círculis = por la que, en el curso de los días,
      nullis ruámus áctibus. = no caigamos en ningún acto [malo].
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  adesto-christe-cordibus:
    titulo: Adésto, Christe, córdibus
    amen: true
    estrofas:
    - |-
      Adésto, Christe, córdibus, = Asiste, Cristo, a los corazones,
      celsa redémptis cáritas; = excelsa caridad de los redimidos;
      infúnde nostris férvidos = infunde en nuestras voces,
      fletus, rogámus, vócibus. = te rogamos, lágrimas fervientes.
    - |-
      Ad te preces, piíssime = A ti, piadosísimo Jesús,
      Iesu, fide profúndimus; = derramamos con fe las súplicas;
      dimítte, Christe, quǽsumus, = perdona, Cristo, te pedimos,
      factis malum quod fécimus. = el mal que hemos hecho en obras.
    - |-
      Sanctæ crucis signáculo, = Con la señal de la santa cruz,
      tuo sacráto córpore, = por tu cuerpo consagrado,
      defénde nos ut fílios = defiéndenos como a hijos,
      omnes, rogámus, úndique. = a todos, te rogamos, por todas partes.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  aeterna-caeli-gloria:
    titulo: Ætérna cæli glória
    amen: true
    estrofas:
    - |-
      Ætérna cæli glória, = Gloria eterna del cielo,
      beáta spes mortálium, = esperanza dichosa de los mortales,
      celsi Paréntis Únice = Único del Padre excelso
      castǽque proles Vírginis, = e hijo de la Virgen casta:
    - |-
      Da déxteram surgéntibus, = da la diestra a los que se levantan,
      exsúrgat et mens sóbria = y que se alce también la mente sobria
      flagrans et in laudem Dei = y, ardiendo en la alabanza de Dios,
      grates repéndat débitas. = devuelva las gracias debidas.
    - |-
      Ortus refúlget lúcifer = Resplandece el lucero naciente
      ipsámque lucem núntiat, = y anuncia la luz misma,
      cadit calígo nóctium, = cae la oscuridad de las noches:
      lux sancta nos illúminet, = que la luz santa nos ilumine
    - |-
      Manénsque nostris sénsibus = y, permaneciendo en nuestros sentidos,
      noctem repéllat sǽculi = rechace la noche del mundo
      omníque fine témporis = y hasta el fin del tiempo
      purgáta servet péctora. = guarde puros los corazones.
    - |-
      Quæsíta iam primum fides = Que la fe, buscada ya primero,
      radícet altis sénsibus, = eche raíces en lo hondo de los sentidos,
      secúnda spes congáudeat; = que la esperanza, segunda, se alegre con ella;
      tunc maior exstat cáritas. = entonces sobresale la caridad, mayor.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  plasmator-hominis-deus:
    titulo: Plasmátor hóminis, Deus
    amen: true
    estrofas:
    - |-
      Plasmátor hóminis, Deus, = Dios, formador del hombre,
      qui, cuncta solus órdinans, = que, ordenándolo todo tú solo,
      humum iubes prodúcere = mandas a la tierra producir
      reptántis et feræ genus; = la especie del reptil y de la fiera;
    - |-
      Qui magna rerum córpora, = que, sometiéndolos, diste al hombre,
      dictu iubéntis vívida, = para que le sirvan en orden,
      ut sérviant per órdinem = los grandes cuerpos de las cosas,
      subdens dedísti hómini: = vivificados por la palabra del que manda:
    - |-
      Repélle a servis tuis = aleja de tus siervos
      quicquid per immundítiam = todo lo que por la impureza
      aut móribus se súggerit, = o se insinúa en las costumbres
      aut áctibus se intérserit. = o se introduce en los actos.
    - |-
      Da gaudiórum prǽmia, = Da los premios de los gozos,
      da gratiárum múnera; = da los dones de las gracias;
      dissólve litis víncula, = deshaz los lazos de la discordia,
      astrínge pacis fœ́dera. = estrecha los lazos de la paz.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  summae-deus-clementiae:
    titulo: Summæ Deus cleméntiæ
    amen: true
    estrofas:
    - |-
      Summæ Deus cleméntiæ = Dios de suma clemencia
      mundíque factor máchinæ, = y artífice de la máquina del mundo,
      qui trinus almo númine = que, trino en la divinidad bondadosa
      unúsque firmas ómnia, = y uno, lo sostienes todo,
    - |-
      Nostros piis cum cánticis = recibe benigno nuestras lágrimas
      fletus benígne súscipe, = con cánticos piadosos,
      quo corde puro sórdibus = para que, con el corazón limpio de manchas,
      te perfruámur lárgius. = te gocemos más abundantemente.
    - |-
      Lumbos adúre cóngruis = Abrasa nuestros lomos
      tu caritátis ígnibus, = con los fuegos convenientes de la caridad,
      accíncti ut adsint pérpetim = para que estén siempre ceñidos
      tuísque prompti advéntibus, = y dispuestos para tu venida,
    - |-
      Ut, quique horas nóctium = para que todos los que las horas de la noche
      nunc concinéndo rúmpimus, = rompemos ahora cantando
      donis beátæ pátriæ = seamos enriquecidos abundantemente
      ditémur omnes áffatim. = con los dones de la patria dichosa.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  auctor-perennis-gloriae:
    titulo: Auctor perénnis glóriæ
    amen: true
    estrofas:
    - |-
      Auctor perénnis glóriæ, = Autor de la gloria perenne,
      qui septifórmis grátiæ = que das a los creyentes el Espíritu
      das Spíritum credéntibus, = de la gracia séptuple,
      assíste mitis ómnibus. = asiste manso a todos.
    - |-
      Expélle morbos córporum, = Expulsa las enfermedades de los cuerpos,
      mentis repélle scándalum, = rechaza el escándalo de la mente,
      exscínde vires críminum, = corta las fuerzas de los pecados,
      fuga dolóres córdium. = ahuyenta los dolores de los corazones.
    - |-
      Serénas mentes éffice, = Haz serenas las mentes,
      opus honéstum pérfice, = lleva a término la obra honesta,
      preces orántium áccipe, = recibe las súplicas de los que oran,
      vitam perénnem tríbue. = concede la vida perenne.
    - |-
      Septem diérum cúrsibus = Con el curso de siete días
      nunc tempus omne dúcitur; = se mide ahora todo el tiempo;
      octávus ille últimus = aquel octavo, el último,
      dies erit iudícii, = será el día del juicio,
    - |-
      In quo, Redémptor, quǽsumus, = en el que, Redentor, te pedimos,
      ne nos in ira árguas, = no nos reprendas en tu ira,
      sed a sinístra líbera, = sino líbranos de la izquierda,
      ad déxteram nos cólloca, = colócanos a la derecha,
    - |-
      Ut, cum preces suscéperis = para que, cuando hayas recibido, clemente,
      clemens tuárum plébium, = las súplicas de tus pueblos,
      reddámus omnes glóriam = demos todos gloria
      trino Deo per sǽcula. = al Dios trino por los siglos.
  aurora-iam-spargit-polum:
    titulo: Auróra iam spargit polum
    amen: true
    estrofas:
    - |-
      Auróra iam spargit polum, = La aurora esparce ya [luz por] el cielo,
      terris dies illábitur, = el día se desliza sobre las tierras,
      lucis resúltat spículum: = rebota el rayo de la luz:
      discédat omne lúbricum. = que se aleje todo lo resbaladizo.
    - |-
      Iam vana noctis décidant, = Caigan ya las vanidades de la noche,
      mentis reátus súbruat, = que se hunda la culpa de la mente,
      quicquid ténebris hórridum = que caiga todo lo horrible de culpa
      nox áttulit culpæ, cadat, = que la noche trajo con sus tinieblas,
    - |-
      Ut mane illud últimum, = para que aquella mañana última,
      quod præstolámur cérnui, = que esperamos postrados,
      in lucem nobis éffluat, = brote para nosotros en luz,
      dum hoc canóre cóncrepat. = mientras resuena este canto.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  rerum-deus-fons-omnium:
    titulo: Rerum, Deus, fons ómnium
    amen: true
    estrofas:
    - |-
      Rerum, Deus, fons ómnium, = Dios, fuente de todas las cosas,
      qui, rebus actis ómnibus, = que, hechas ya todas las cosas,
      totíus orbis ámbitum = llenaste el ámbito de todo el orbe
      censu replésti múnerum, = con la riqueza de tus dones,
    - |-
      Ac, mole tanta cóndita, = y, creada una obra tan grande,
      tandem quiétem díceris = se dice que al fin tomaste
      sumpsísse, dans labóribus = el descanso, dándolo a los trabajos
      ut nos levémur grátius: = para que seamos aliviados con más gracia:
    - |-
      Concéde nunc mortálibus = concede ahora a los mortales
      deflére vitæ crímina, = llorar los pecados de la vida,
      instáre iam virtútibus = aplicarse ya a las virtudes
      et munerári prósperis, = y ser recompensados con bienes,
    - |-
      Ut cum treméndi iúdicis = para que, cuando comience el horror
      horror suprémus cœ́perit, = supremo del juez temible,
      lætémur omnes ínvicem = nos alegremos todos juntos,
      pacis repléti múnere. = llenos del don de la paz.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  salve-dies-dierum-gloria:
    titulo: Salve dies, diérum glória
    amen: true
    estrofas:
    - |-
      Salve dies, diérum glória, = Salve, día, gloria de los días,
      dies felix Christi victória, = día feliz, victoria de Cristo,
      dies digna iugi lætítia, = día digno de alegría continua,
      dies prima. = primer día.
    - |-
      Lux divína cæcis irrádiat, = La luz divina irradia a los ciegos;
      in qua Christus inférnum spóliat, = en este día Cristo despoja el infierno,
      mortem vincit et reconcíliat = vence la muerte y reconcilia
      summis ima. = lo de abajo con lo de arriba.
    - |-
      Sempitérni regis senténtia = La sentencia del rey sempiterno
      sub peccáto conclúsit ómnia; = encerró todo bajo el pecado,
      ut infírmis supérna grátia = para que la gracia de lo alto
      subveníret, = socorriera a los débiles;
    - |-
      Dei virtus et sapiéntia = el poder y la sabiduría de Dios
      temperávit iram cleméntia, = templó la ira con la clemencia,
      cum iam mundus in præcipítia = cuando ya el mundo entero
      totus iret. = iba al precipicio.
    - |-
      Resurréxit liber ab ínferis = Resucitó libre de los infiernos
      restaurátor humáni géneris, = el restaurador del género humano,
      ovem suam repórtans úmeris = llevando su oveja sobre los hombros
      ad supérna. = a lo alto.
    - |-
      Angelórum pax fit et hóminum, = Se hace la paz de los ángeles y de los hombres,
      plenitúdo succréscit órdinum, = se completa la plenitud de los coros;
      triumphántem laus decet Dóminum, = al Señor triunfante conviene la alabanza,
      laus ætérna. = la alabanza eterna.
    - |-
      Harmoníæ cæléstis pátriæ = Que con la armonía de la patria celestial
      vox concórdet matris Ecclésiæ, = concuerde la voz de la madre Iglesia;
      «Allelúia» frequéntet hódie = que el pueblo fiel repita hoy
      plebs fidélis. = «Aleluia».
    - |-
      Triumpháto mortis império, = Vencido el imperio de la muerte,
      triumpháli fruámur gáudio; = gocemos del gozo del triunfo;
      in terra pax, et iubilátio = en la tierra paz, y júbilo
      sit in cælis. = en los cielos.
  mediae-noctis-tempus-est:
    titulo: Médiæ noctis tempus est
    amen: true
    estrofas:
    - |-
      Médiæ noctis tempus est; = Es la hora de la medianoche;
      prophética vox ádmonet = la voz profética nos exhorta
      dicámus laudes ut Deo = a decir alabanzas a Dios,
      Patri semper ac Fílio, = al Padre siempre y al Hijo,
    - |-
      Sancto quoque Spirítui: = y también al Espíritu Santo,
      perfécta enim Trínitas = porque la Trinidad perfecta
      uniúsque substántiæ = y de una sola sustancia
      laudánda nobis semper est. = ha de ser siempre alabada por nosotros.
    - |-
      Terrórem tempus hoc habet, = Esta hora tiene un terror,
      quo, cum vastátor ángelus = pues en ella, cuando el ángel exterminador
      Ægýpto mortem íntulit, = llevó la muerte a Egipto,
      delévit primogénita. = destruyó a los primogénitos.
    - |-
      Hæc iustis hora salus est, = Esta hora es salvación para los justos,
      quos tunc ibídem ángelus = a quienes allí mismo el ángel
      ausus puníre non erat, = no se había atrevido a castigar,
      signum formídans sánguinis. = temiendo la señal de la sangre.
    - |-
      Ægýptus flebat fórtiter = Egipto lloraba fuertemente
      tantórum diro fúnere; = por la cruel muerte de tantos;
      solus gaudébat Israel = solo Israel se alegraba,
      agni protéctus sánguine. = protegido por la sangre del cordero.
    - |-
      Nos verus Israel sumus: = Nosotros somos el verdadero Israel:
      lætámur in te, Dómine, = nos alegramos en ti, Señor,
      hostem spernéntes et malum, = despreciando al enemigo y al mal,
      Christi defénsi sánguine. = defendidos por la sangre de Cristo.
    - |-
      Dignos nos fac, rex óptime, = Haznos dignos, rey óptimo,
      futúri regni glória, = de la gloria del reino futuro,
      ut mereámur láudibus = para que merezcamos cantarte
      ætérnis te concínere. = con alabanzas eternas.
  ecce-iam-noctis-tenuatur-umbra:
    titulo: Ecce iam noctis tenuátur umbra
    amen: true
    estrofas:
    - |-
      Ecce iam noctis tenuátur umbra, = He aquí que la sombra de la noche se adelgaza,
      lucis auróra rútilans corúscat; = la aurora de la luz brilla rojiza;
      nísibus totis rogitémus omnes = roguemos todos con todas nuestras fuerzas
      cunctipoténtem, = al todopoderoso,
    - |-
      Ut Deus, nostri miserátus, omnem = para que Dios, compadecido de nosotros, aleje
      pellat angórem, tríbuat salútem, = toda angustia, conceda la salvación
      donet et nobis pietáte patris = y nos dé, con piedad de padre,
      regna polórum. = el reino de los cielos.
    - |-
      Præstet hoc nobis Déitas Beáta = Concédanos esto la Divinidad bienaventurada
      Patris ac Nati, paritérque Sancti = del Padre y del Hijo, y también del Santo
      Spíritus, cuius résonat per omnem = Espíritu, cuya gloria resuena
      glória mundum. = por todo el mundo.
  o-lux-beata-trinitas:
    titulo: O lux, Beáta Trínitas
    amen: true
    estrofas:
    - |-
      O lux, Beáta Trínitas = Oh luz, bienaventurada Trinidad
      et principális Únitas, = y Unidad principal,
      iam sol recédit ígneus: = ya se retira el sol de fuego:
      infúnde lumen córdibus. = derrama la luz en los corazones.
    - |-
      Te mane laudum cármine, = A ti en la mañana con canto de alabanzas,
      te deprecémur véspere; = a ti te supliquemos en la tarde;
      te nostra supplex glória = que nuestra gloria suplicante
      per cuncta laudet sǽcula. = te alabe por todos los siglos.
    - |-
      Christum rogámus et Patrem, = Rogamos a Cristo y al Padre,
      Christi Patrísque Spíritum; = y al Espíritu de Cristo y del Padre:
      unum potens per ómnia, = poderosa en todo, uno,
      fove precántes, Trínitas. = ampara a los que te suplican, Trinidad.
  ipsum-nunc-nobis-tempus-est:
    titulo: Ipsum nunc nobis tempus est
    amen: true
    estrofas:
    - |-
      Ipsum nunc nobis tempus est = Ahora es para nosotros el tiempo mismo
      quo voce evangélica = en que, según la voz del Evangelio,
      ventúrus sponsus créditur, = se cree que vendrá el esposo,
      regni cæléstis cónditor. = fundador del reino celestial.
    - |-
      Occúrrunt sanctæ vírgines = Salen las vírgenes santas
      óbviam tunc advéntui, = al encuentro de su llegada,
      gestántes claras lámpadas, = llevando lámparas encendidas,
      magno lætántes gáudio. = alegrándose con gran gozo.
    - |-
      Stultæ vero quæ rémanent = Pero las necias, que se quedan,
      exstínctas habent lámpadas, = tienen las lámparas apagadas,
      frustra pulsántes iánuam, = golpeando en vano la puerta,
      clausa iam regni régia. = cerrado ya el palacio del reino.
    - |-
      Nunc vigilémus sóbrii = Velemos ahora sobrios,
      gestántes mentes spléndidas, = llevando mentes resplandecientes,
      ut veniénti Dómino = para correr dignos al encuentro
      digni currámus óbviam. = del Señor que viene.
    - |-
      Dignos nos fac, rex óptime, = Haznos dignos, rey óptimo,
      futúri regni glória, = de la gloria del reino futuro,
      ut mereámur láudibus = para que merezcamos cantarte
      ætérnis te concínere. = con alabanzas eternas.
  vita-sanctorum-via-spes-salusque:
    titulo: Vita sanctórum, via, spes salúsque
    amen: true
    estrofas:
    - |-
      Vita sanctórum, via, spes salúsque, = Vida de los santos, camino, esperanza y salvación,
      Christe, largítor probitátis atque = Cristo, dador de la bondad y
      cónditor pacis, tibi voce, sensu = creador de la paz, a ti, con la voz y con el sentir,
      pángimus hymnum: = te cantamos un himno:
    - |-
      Cuius est virtus manifésta totum = tu poder se manifiesta en todo
      quod pii possunt, quod habent, quod ore, = lo que los piadosos pueden, lo que tienen, lo que desean
      corde vel factis cúpiunt, amóris = con la boca, el corazón o las obras,
      igne flagrántes. = ardiendo con el fuego del amor.
    - |-
      Témporum pacem, fídei tenórem, = Paz en los tiempos, constancia en la fe,
      lánguidis curam veniámque lapsis, = cuidado a los enfermos y perdón a los caídos,
      ómnibus præsta páriter beátæ = concede a todos por igual los dones
      múnera vitæ. = de la vida dichosa.
    - |-
      Æqua laus summum célebret Paréntem = Que una alabanza igual celebre al Padre altísimo
      teque, Salvátor, pie rex, per ævum; = y a ti, Salvador, rey piadoso, por siempre;
      Spíritus Sancti résonet per omnem = que la gloria del Espíritu Santo resuene
      glória mundum. = por todo el mundo.
  lucis-largitor-splendide:
    titulo: Lucis largítor spléndide
    amen: true
    estrofas:
    - |-
      Lucis largítor spléndide, = Espléndido dador de la luz,
      cuius seréno lúmine = por cuya luz serena,
      post lapsa noctis témpora = pasados los tiempos de la noche,
      dies refúsus pánditur, = se extiende el día derramado de nuevo:
    - |-
      Tu verus mundi lúcifer, = tú, verdadero lucero del mundo,
      non is qui parvi síderis = no aquel que, de pequeño astro,
      ventúræ lucis núntius = mensajero de la luz que vendrá,
      angústo fulget lúmine, = brilla con luz estrecha,
    - |-
      Sed toto sole clárior, = sino más claro que todo el sol,
      lux ipse totus et dies, = tú mismo todo luz y día,
      intérna nostri péctoris = que iluminas lo íntimo
      illúminans præcórdia. = de nuestro pecho.
    - |-
      Evíncat mentis cástitas = Que la castidad de la mente venza
      quæ caro cupit árrogans, = lo que la carne arrogante desea,
      sanctúmque puri córporis = y que el Espíritu guarde el santo
      delúbrum servet Spíritus. = templo del cuerpo puro.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  luminis-fons-lux-et-origo-lucis:
    titulo: Lúminis fons, lux et orígo lucis
    amen: true
    estrofas:
    - |-
      Lúminis fons, lux et orígo lucis, = Fuente de la luz, luz y origen de la luz,
      tu pius nostris précibus favéto, = tú, piadoso, favorece nuestras súplicas,
      luxque, peccáti ténebris fugátis, = y que tu luz, ahuyentadas las tinieblas del pecado,
      nos tua adórnet. = nos adorne.
    - |-
      Ecce transáctus labor est diéi, = He aquí que ha pasado el trabajo del día,
      teque nos tuti sumus adnuénte; = y estamos seguros porque tú lo concedes;
      en tibi grates ágimus libéntes = he aquí que te damos gracias con gusto
      tempus in omne. = para siempre.
    - |-
      Solis abscéssus ténebras redúxit: = La puesta del sol trajo de vuelta las tinieblas:
      ille sol nobis rádiet corúscus = que brille para nosotros, resplandeciente, aquel sol
      luce qui fulva fovet angelórum = que con luz dorada calienta las santas
      ágmina sancta. = multitudes de los ángeles.
    - |-
      Quas dies culpas hodiérna texit, = Las culpas que el día de hoy cubrió,
      Christus deléto pius atque mitis, = bórrelas Cristo, piadoso y manso,
      pectus et puro rútilet nitóre = y que el pecho brille con resplandor puro
      témpore noctis. = en el tiempo de la noche.
    - |-
      Laus tibi Patri, decus atque Nato, = Alabanza a ti, Padre; honor al Hijo;
      Flámini Sancto párilis potéstas, = al Espíritu Santo, igual poder;
      cuncta qui sceptro régitis suprémo = que todo lo regís con el cetro supremo
      omne per ævum. = por toda la eternidad.
  nocte-surgentes-vigilemus-omnes:
    titulo: Nocte surgéntes vigilémus omnes
    amen: true
    estrofas:
    - |-
      Nocte surgéntes vigilémus omnes, = Levantándonos de noche, velemos todos,
      semper in psalmis meditémur atque = meditemos siempre en los salmos y
      víribus totis Dómino canámus = con todas las fuerzas cantemos al Señor
      dúlciter hymnos, = dulcemente himnos,
    - |-
      Ut, pio regi páriter canéntes, = para que, cantando juntos al rey piadoso,
      cum suis sanctis mereámur aulam = merezcamos entrar con sus santos
      íngredi cæli, simul et beátam = en el palacio del cielo, y a la vez llevar
      dúcere vitam. = la vida dichosa.
    - |-
      Præstet hoc nobis Déitas Beáta = Concédanos esto la Divinidad bienaventurada
      Patris ac Nati, paritérque Sancti = del Padre y del Hijo, y también del Santo
      Spíritus, cuius résonat per omnem = Espíritu, cuya gloria resuena
      glória mundum. = por todo el mundo.
  ad-preces-nostras-deitatis-aures:
    titulo: Ad preces nostras deitátis aures
    amen: true
    estrofas:
    - |-
      Ad preces nostras deitátis aures, = A nuestras súplicas los oídos de tu divinidad,
      Deus, inclína pietáte sola; = oh Dios, inclina solo por tu piedad;
      súpplicum vota súscipe, precámur = recibe los votos de los que te suplican, rogamos,
      fámuli tui. = tus siervos.
    - |-
      Réspice clemens sólio de sancto = Mira clemente desde el santo trono
      vultu seréno, lámpadas illústra = con rostro sereno, ilumina las lámparas
      ólei nostri, ténebras depélle = de nuestro aceite, aleja todas las tinieblas
      péctore cunctas. = del pecho.
    - |-
      Crímina laxa pietáte multa, = Perdona los pecados con tu mucha piedad,
      áblue sordes, víncula disrúmpe, = lava las manchas, rompe las cadenas,
      parce peccátis, réleva iacéntes = perdona los pecados, levanta a los caídos
      déxtera tua. = con tu diestra.
    - |-
      Glória Deo sit ætérno Patri, = Gloria sea a Dios, Padre eterno,
      sit tibi semper, Genitóris Nate, = y a ti siempre, Hijo del Padre,
      cum quo per cuncta Spíritus æquális = con quien el Espíritu, igual, reina
      sǽcula regnat. = por todos los siglos.
  aeterne-lucis-conditor:
    titulo: Ætérne lucis cónditor
    amen: true
    estrofas:
    - |-
      Ætérne lucis cónditor, = Eterno creador de la luz,
      lux ipse totus et dies, = tú mismo todo luz y día,
      noctem nec ullam séntiens = que no sientes ninguna noche
      natúra lucis pérpeti, = por tu naturaleza de luz perpetua,
    - |-
      Iam cedit pallens próximo = ya la noche, palideciendo, cede
      diéi nox advéntui, = a la cercana llegada del día;
      obtúndens lumen síderum = apagando la luz de los astros,
      adest et clarus lúcifer. = aparece también el claro lucero.
    - |-
      Iam stratis læti súrgimus = Ya nos levantamos alegres del lecho,
      grates canéntes et tuas, = cantándote también gracias,
      quod cæcam noctem vícerit = porque el sol, trayendo de nuevo el día,
      revéctans rursus sol diem. = ha vencido la noche ciega.
    - |-
      Te nunc, ne carnis gáudia = Te pedimos ahora, santo,
      blandis subrépant ǽstibus, = que los placeres de la carne no se infiltren
      dolis ne cedat sǽculi = con ardores seductores,
      mens nostra, sancte, quǽsumus. = que nuestra mente no ceda a los engaños del mundo.
    - |-
      Ira ne rixas próvocet, = Que la ira no provoque riñas,
      gulam ne venter íncitet, = que el vientre no excite la gula,
      opum pervértat ne famis, = que el hambre de riquezas no pervierta,
      turpis ne luxus óccupet, = que no se apodere el lujo vergonzoso,
    - |-
      Sed firma mente sóbrii, = sino que, sobrios, con mente firme,
      casto manéntes córpore = permaneciendo castos en el cuerpo,
      totum fidéli spíritu = pasemos todo este día para Cristo
      Christo ducámus hunc diem. = con espíritu fiel.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  sator-princepsque-temporum:
    titulo: Sator princépsque témporum
    amen: true
    estrofas:
    - |-
      Sator princépsque témporum, = Creador y príncipe de los tiempos,
      clarum diem labóribus = que con orden fijo distingues
      noctémque qui sopóribus = el día claro para los trabajos
      fixo distínguis órdine, = y la noche para el sueño,
    - |-
      Mentem tu castam dírige, = dirige tú la mente casta,
      obscúra ne siléntia = para que los oscuros silencios
      ad dira cordis vúlnera = no abran a los dardos del envidioso
      telis patéscant ínvidi. = las crueles heridas del corazón.
    - |-
      Vacent ardóre péctora, = Que los pechos estén libres del ardor
      faces nec ullas pérferant, = y no lleven ningunas antorchas
      quæ nostro hæréntes sénsui = que, pegándose a nuestros sentidos,
      mentis vigórem sáucient. = hieran el vigor de la mente.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      Cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  o-sator-rerum-reparator-aevi:
    titulo: O sator rerum, reparátor ævi
    amen: true
    estrofas:
    - |-
      O sator rerum, reparátor ævi, = Oh creador de las cosas, restaurador del tiempo,
      Christe, rex regum, metuénde censor, = Cristo, rey de reyes, juez temible,
      tu preces nostras paritérque laudes = recibe tú, clemente, nuestras súplicas
      súscipe clemens. = y a la vez nuestras alabanzas.
    - |-
      Noctis en cursu tibi vota laudum = He aquí que en el curso de la noche te cantamos
      pángimus; præsta tibi sint ut apta, = votos de alabanza; concede que te sean agradables
      nosque concéntu réfove perénni, = y repáranos con un canto perenne,
      lúminis auctor. = autor de la luz.
    - |-
      Da dies nobis probitáte faustos = Danos días dichosos por la bondad,
      mortis ignáram tribuéndo vitam, = concediendo una vida que no conozca la muerte,
      semper ut nostros tua sit per actus = para que siempre, por nuestros actos, sea
      glória perpes. = perpetua tu gloria.
    - |-
      Ure cor nostrum, pius ure lumbos = Abrasa, piadoso, nuestro corazón, abrasa los lomos
      igne divíno vigilésque nos fac, = con fuego divino, y haznos vigilantes,
      semper ardéntes mánibus lucérnas = para que tengamos siempre en las manos
      ut teneámus. = lámparas encendidas.
    - |-
      Æqua laus summum célebret Paréntem = Que una alabanza igual celebre al Padre altísimo
      teque, Salvátor, pie rex, per ævum; = y a ti, Salvador, rey piadoso, por siempre;
      Spíritus Sancti résonet per omnem = que la gloria del Espíritu Santo resuene
      glória mundum. = por todo el mundo.
  christe-lux-vera-bonitas-et-vita:
    titulo: Christe, lux vera, bónitas et vita
    amen: true
    estrofas:
    - |-
      Christe, lux vera, bónitas et vita, = Cristo, luz verdadera, bondad y vida,
      gáudium mundi, píetas imménsa, = gozo del mundo, piedad inmensa,
      qui nos a morte vívido salvásti = que nos salvaste de la muerte con tu sangre
      sánguine tuo, = vivificante,
    - |-
      Insere tuum, pétimus, amórem = infunde, te pedimos, tu amor
      méntibus nostris, fídei refúnde = en nuestras mentes, derrama de nuevo
      lumen ætérnum, caritátis auge = la luz eterna de la fe, aumenta
      dilectiónem. = el amor de la caridad.
    - |-
      Procul a nobis pérfidus absístat = Que se aleje de nosotros el pérfido
      Satan, a tuis víribus confráctus; = Satanás, quebrantado por tu poder;
      Sanctus assístat Spíritus, a tua = que asista el Espíritu Santo, enviado
      sede demíssus. = desde tu trono.
    - |-
      Glória Deo sit ætérno Patri, = Gloria sea a Dios, Padre eterno,
      sit tibi semper, Genitóris Nate, = y a ti siempre, Hijo del Padre,
      cum quo per cuncta Spíritus æquális = con quien el Espíritu, igual, reina
      sǽcula regnat. = por todos los siglos.
  fulgentis-auctor-aetheris:
    titulo: Fulgéntis auctor ǽtheris
    amen: true
    estrofas:
    - |-
      Fulgéntis auctor ǽtheris, = Autor del cielo resplandeciente,
      qui lunam lumen nóctibus, = que estableciste en un camino seguro
      solem diérum cúrsibus = la luna como luz para las noches
      certo fundásti trámite, = y el sol para el curso de los días:
    - |-
      Nox atra iam depéllitur, = ya es expulsada la noche negra,
      mundi nitor renáscitur, = renace el brillo del mundo,
      novúsque iam mentis vigor = y un nuevo vigor de la mente
      dulces in actus érigit. = nos eleva a obras dulces.
    - |-
      Laudes sonáre iam tuas = El día que vuelve nos exhorta
      dies relátus ádmonet, = a que suenen ya tus alabanzas,
      vultúsque cæli blándior = y el rostro más amable del cielo
      nostra serénat péctora. = serena nuestros pechos.
    - |-
      Vitémus omne lúbricum, = Evitemos todo lo resbaladizo,
      declínet prava spíritus, = que el espíritu se aparte de lo malo,
      vitam facta non ínquinent, = que los hechos no manchen la vida,
      linguam culpa non ímplicet; = que la culpa no enrede la lengua;
    - |-
      Sed, sol diem dum cónficit, = sino que, mientras el sol cumple el día,
      fides profúnda férveat, = la fe profunda arda,
      spes ad promíssa próvocet, = la esperanza nos lleve a lo prometido,
      Christo coniúngat cáritas. = la caridad nos una a Cristo.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  sol-ecce-lentus-occidens:
    titulo: Sol, ecce, lentus óccidens
    amen: true
    estrofas:
    - |-
      Sol, ecce, lentus óccidens = He aquí que el sol, poniéndose lentamente,
      montes et arva et ǽquora = deja triste los montes, los campos y los mares,
      mæstus relínquit, ínnovat = pero renueva el presagio
      sed lucis omen crástinæ, = de la luz de mañana,
    - |-
      Mirántibus mortálibus = para que los mortales admiren
      sic te, Creátor próvide, = cómo tú, Creador previsor,
      leges vicésque témporum = diste las leyes y alternancias de los tiempos
      umbris dedísse et lúmini. = a las sombras y a la luz.
    - |-
      Ac dum, ténebris ǽthera = Y mientras, oprimiendo las tinieblas
      siléntio preméntibus, = el cielo con su silencio,
      vigor labórum déficit, = desfallece el vigor de los trabajos
      quies cupíta quǽritur, = y se busca el descanso deseado,
    - |-
      Spe nos fidéque dívites = ricos de esperanza y de fe,
      tui beámur lúmine = somos hechos dichosos por la luz
      Verbi, quod est a sǽculis = de tu Verbo, que es desde los siglos
      splendor patérnæ glóriæ. = resplandor de la gloria del Padre.
    - |-
      Est ille sol qui nésciat = Él es el sol que no conoce
      ortum vel umquam vésperum; = nunca ni la salida ni la tarde;
      quo terra gestit cóntegi, = por él desea la tierra ser cubierta,
      quo cæli in ævum iúbilant. = por él los cielos se alegran por siempre.
    - |-
      Hac nos seréna pérpetim = Concédenos gozar al fin para siempre
      da luce tandem pérfrui, = de esta luz serena,
      cum Nato et almo Spíritu = cantándote cantos nuevos
      tibi novántes cántica. = con el Hijo y el Espíritu bondadoso.
  ales-diei-nuntius:
    titulo: Ales diéi núntius
    amen: true
    estrofas:
    - |-
      Ales diéi núntius = El ave mensajera del día
      lucem propínquam prǽcinit; = anuncia que la luz está cerca;
      nos excitátor méntium = Cristo, el que despierta las mentes,
      iam Christus ad vitam vocat. = nos llama ya a la vida.
    - |-
      «Auférte –clamat– léctulos = «Dejad —grita— los lechos
      ægros, sopóros, désides; = enfermos, soñolientos, perezosos;
      castíque, recti ac sóbrii = y velad castos, rectos
      vigiláte; iam sum próximus». = y sobrios; ya estoy cerca».
    - |-
      Ut, cum corúscis flátibus = Para que, cuando la aurora con soplos
      auróra cælum spárserit, = brillantes haya rociado el cielo,
      omnes labóre exércitos = confirme en la esperanza de la luz
      confírmet ad spem lúminis, = a todos los cansados por el trabajo,
    - |-
      Iesum ciámus vócibus = invoquemos a Jesús con nuestras voces,
      flentes, precántes, sóbrii; = llorando, suplicando, sobrios;
      inténta supplicátio = la súplica atenta
      dormíre cor mundum vetat. = impide dormir al corazón puro.
    - |-
      Tu, Christe, somnum dísice, = Tú, Cristo, disipa el sueño,
      tu rumpe noctis víncula, = tú rompe las cadenas de la noche,
      tu solve peccátum vetus = tú desata el pecado antiguo
      novúmque lumen íngere. = e infunde una luz nueva.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  amoris-sensus-erige:
    titulo: Amóris sensus érige
    amen: true
    estrofas:
    - |-
      Amóris sensus érige = Eleva los sentimientos del amor
      ad te, largítor véniæ, = hacia ti, dador del perdón,
      ut fias clemens córdibus = para que te hagas clemente con los corazones
      purgátis inde sórdibus. = limpios ya de las manchas.
    - |-
      Extérni huc advénimus = Hemos llegado aquí como extranjeros
      et éxsules ingémimus; = y gemimos como desterrados;
      tu portus es et pátria, = tú eres el puerto y la patria:
      ad vitæ duc nos átria. = llévanos a los atrios de la vida.
    - |-
      Felix quæ sitit cáritas = Feliz la caridad que tiene sed
      te fontem vitæ, o Véritas; = de ti, fuente de la vida, oh Verdad;
      beáti valde óculi = muy dichosos los ojos
      te speculántis pópuli. = del pueblo que te contempla.
    - |-
      Grandis est tibi glória = Gran gloria es para ti
      tuæ laudis memória, = el recuerdo de tu alabanza,
      quam sine fine célebrant = que celebran sin fin
      qui cor ab imis élevant. = los que elevan el corazón desde lo hondo.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  iam-lucis-orto-sidere:
    titulo: Iam lucis orto sídere
    amen: true
    estrofas:
    - |-
      Iam lucis orto sídere = Nacido ya el astro de la luz,
      Deum precémur súpplices, = supliquemos a Dios, humildes,
      ut in diúrnis áctibus = que en las acciones del día
      nos servet a nocéntibus. = nos guarde de lo que daña.
    - |-
      Linguam refrénans témperet, = Que frene y modere la lengua,
      ne litis horror ínsonet; = para que no resuene el horror de la discordia;
      visum fovéndo cóntegat, = que proteja la vista, cuidándola,
      ne vanitátes háuriat. = para que no absorba vanidades.
    - |-
      Sint pura cordis íntima, = Que lo íntimo del corazón sea puro,
      absístat et vecórdia; = y se aleje también la locura;
      carnis terat supérbiam = que la sobriedad en la bebida y la comida
      potus cibíque párcitas; = quebrante la soberbia de la carne;
    - |-
      Ut, cum dies abscésserit = para que, cuando el día se haya ido
      noctémque sors redúxerit, = y la suerte haya traído la noche,
      mundi per abstinéntiam = limpios por la abstinencia,
      ipsi canámus glóriam. = cantemos nosotros su gloria.
    - |-
      Deo Patri sit glória = A Dios Padre sea la gloria
      eiúsque soli Fílio = y a su único Hijo,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      nunc et per omne sǽculum. = ahora y por todos los siglos.
  deus-qui-claro-lumine:
    titulo: Deus, qui claro lúmine
    amen: true
    estrofas:
    - |-
      Deus, qui claro lúmine = Dios, que con luz clara
      diem fecísti, Dómine, = hiciste el día, Señor,
      tuam rogámus glóriam = imploramos tu gloria
      dum pronus dies vólvitur. = mientras el día declina.
    - |-
      Iam sol urgénte véspero = Ya el sol, apremiado por la tarde,
      occásum suum gráditur, = camina hacia su ocaso,
      mundum conclúdens ténebris, = encerrando el mundo en tinieblas,
      suum obsérvans órdinem. = guardando su orden.
    - |-
      Tu vero, excélse Dómine, = Pero tú, excelso Señor,
      precántes tuos fámulos = no permitas que tus siervos que te ruegan,
      diúrno lassos ópere = cansados por el trabajo del día,
      ne sinas umbris ópprimi, = sean oprimidos por las sombras,
    - |-
      Ut non fuscátis méntibus = para que, sin oscurecerse las mentes,
      dies abscédat sǽculi, = se vaya el día del mundo,
      sed tua tecti grátia = y, cubiertos por tu gracia,
      cernámus lucem prósperam. = veamos la luz dichosa.
    - |-
      Præsta, Pater piíssime, = Concédelo, Padre piadosísimo,
      Patríque compar Únice, = y tú, Único igual al Padre,
      cum Spíritu Paráclito = con el Espíritu Paráclito,
      regnans per omne sǽculum. = que reinas por todos los siglos.
  galli-cantu-mediante:
    titulo: Galli cantu mediánte
    amen: true
    estrofas:
    - |-
      Galli cantu mediánte = Mientras el canto del gallo
      noctis iam calíginem = quita ya la oscuridad de la noche
      et profúndæ noctis atram = y el negro temor
      levánte formídinem, = de la noche profunda,
      Deus alme, te rogámus = Dios bondadoso, te rogamos
      supplicésque póscimus. = y te pedimos suplicantes.
    - |-
      Vigil, potens, lux venísti = Vigilante, poderoso, viniste como luz
      atque custos hóminum, = y guardián de los hombres,
      dum tenérent simul cuncta = cuando todas las cosas a la vez guardaban
      médium siléntium, = el silencio de la medianoche
      rédderent necnon mortálem = y [los dormidos] reproducían
      mórtui effígiem, = la imagen mortal de los muertos,
    - |-
      Excitáres quo nos, Christe, = para despertarnos, Cristo,
      de somno malítiæ, = del sueño de la maldad,
      atque gratis liberáres = y librarnos gratuitamente
      noctúrno de cárcere, = de la cárcel de la noche,
      redderésque nobis lucem = y devolvernos la luz,
      vitæ semper cómitem. = compañera perpetua de la vida.
    - |-
      Honor Patri sit ac tibi, = Honor al Padre y a ti,
      Sancto sit Spirítui, = y al Espíritu Santo,
      Deo trino sed et uni, = a Dios trino y también uno,
      paci, vitæ, lúmini, = paz, vida, luz,
      nómini præ cunctis dulci = nombre más dulce que todos
      divinóque númini. = y divino poder.
  adesto-rerum-conditor:
    titulo: Adésto, rerum cónditor
    amen: true
    estrofas:
    - |-
      Adésto, rerum cónditor, = Asiste, creador de las cosas,
      patérnæ lucis glória, = gloria de la luz del Padre,
      cuius amóta grátia = sin cuya gracia
      nostra pavéscunt péctora, = se espantan nuestros pechos,
    - |-
      Tuóque plena Spíritu, = y que, llenos de tu Espíritu,
      secum Deum gestántia, = llevando a Dios consigo,
      nil rapiéntis pérfidi = no se abran en nada a los crueles
      diris patéscant fráudibus, = engaños del pérfido raptor,
    - |-
      Ut inter actus sǽculi, = para que, entre los actos del mundo
      vitæ quos usus éxigit, = que exige el uso de la vida,
      omni caréntes crímine = libres de todo pecado,
      tuis vivámus légibus. = vivamos según tus leyes.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  deus-qui-caeli-lumen-es:
    titulo: Deus, qui cæli lumen es
    amen: true
    estrofas:
    - |-
      Deus, qui cæli lumen es = Dios, que eres la luz del cielo
      satórque lucis, qui polum = y creador de la luz, que despliegas el cielo
      patérno fultum bráchio = sostenido por el brazo del Padre
      præclára pandis déxtera, = con tu preclara diestra:
    - |-
      Auróra stellas iam tegit = la aurora cubre ya las estrellas,
      rubrum sustóllens gúrgitem, = levantando el abismo rojo,
      uméctis atque flátibus = y con soplos húmedos
      terram baptízans róribus. = bautiza la tierra con el rocío.
    - |-
      Iam noctis umbra línquitur, = Ya se va la sombra de la noche,
      polum calígo déserit, = la oscuridad abandona el cielo,
      typúsque Christi, lúcifer = y el lucero, figura de Cristo,
      diem sopítum súscitat. = despierta al día dormido.
    - |-
      Dies diérum tu, Deus, = Tú, Dios, eres el día de los días
      lucísque lumen ipse es, = y la luz misma de la luz,
      Unum potens per ómnia, = uno poderoso en todas las cosas,
      potens in unum Trínitas. = Trinidad poderosa en uno.
    - |-
      Te nunc, Salvátor, quǽsumus = Ahora, Salvador, te pedimos
      tibíque genu fléctimus, = y doblamos ante ti la rodilla,
      Patrem cum Sancto Spíritu = alabando al Padre con el Espíritu Santo
      totis laudántes vócibus. = con todas nuestras voces.
  horis-peractis-undecim:
    titulo: Horis peráctis úndecim
    amen: true
    estrofas:
    - |-
      Horis peráctis úndecim = Cumplidas once horas,
      ruit dies in vésperum; = el día se precipita hacia la tarde;
      solvámus omnes débitum = paguemos todos con gusto
      mentis libénter cánticum. = la deuda del canto de la mente.
    - |-
      Labor diúrnus tránsiit = Pasó el trabajo del día
      quo, Christe, nos condúxeras; = para el que, Cristo, nos habías contratado;
      da iam colónis víneæ = da ya a los labradores de la viña
      promíssa dona glóriæ. = los dones prometidos de la gloria.
    - |-
      Mercéde quos nunc ádvocas, = A los que ahora llamas para el salario,
      quos ad futúrum múneras, = a los que recompensas para el futuro,
      nos in labóre ádiuva = ayúdanos en el trabajo
      et post labórem récrea. = y repáranos después del trabajo.
    - |-
      Sit, Christe, rex piíssime, = Gloria a ti, Cristo, rey piadosísimo,
      tibi Patríque glória = y al Padre,
      cum Spíritu Paráclito, = con el Espíritu Paráclito,
      in sempitérna sǽcula. = por los siglos sempiternos.
  lux-aeterna-lumen-potens:
    titulo: Lux ætérna, lumen potens
    amen: true
    estrofas:
    - |-
      Lux ætérna, lumen potens, = Luz eterna, luz poderosa,
      dies indefíciens, = día que no decae,
      debellátor atræ noctis, = vencedor de la noche negra,
      reparátor lúminis, = restaurador de la luz,
      destructórque tenebrárum, = destructor de las tinieblas,
      illustrátor méntium: = iluminador de las mentes:
    - |-
      Quo nascénte suscitámur, = al nacer tú, somos despertados;
      quo vocante súrgimus; = al llamar tú, nos levantamos;
      faciénte quo beáti, = si tú obras, somos dichosos;
      quo linquénte míseri; = si tú te vas, desdichados;
      quo a morte liberáti, = por ti somos librados de la muerte,
      quo sumus perlúcidi; = por ti somos luminosos;
    - |-
      Mortis quo victóres facti, = por ti fuimos hechos vencedores de la muerte,
      noctis atque sǽculi; = de la noche y del mundo;
      ergo nobis, rex ætérne, = danos, pues, rey eterno,
      lucem illam tríbue, = aquella luz
      quæ fuscátur nulla nocte, = que no se oscurece con ninguna noche
      solo gaudens lúmine. = y goza de la sola luz.
    - |-
      Honor Patri sit ac tibi, = Honor al Padre y a ti,
      Sancto sit Spirítui, = y al Espíritu Santo,
      Deo trino sed et uni, = a Dios trino y también uno,
      paci, vitæ, lúmini, = paz, vida, luz,
      nómini præ cunctis dulci = nombre más dulce que todos
      divinóque númini. = y divino poder.
  deus-de-nullo-veniens:
    titulo: Deus de nullo véniens
    amen: true
    estrofas:
    - |-
      Deus de nullo véniens, = Dios que de nadie vienes,
      Deus de Deo pródiens, = Dios que procedes de Dios,
      Deus ab his progrédiens, = Dios que procedes de ambos,
      in nos veni subvéniens. = ven a nosotros a socorrernos.
    - |-
      Tu nostrum desidérium, = Tú seas nuestro deseo,
      tu sis amor et gáudium; = tú, el amor y el gozo;
      in te nostra cupíditas = en ti esté nuestro anhelo
      et sit in te iucúnditas. = y en ti la alegría.
    - |-
      Pater, cunctórum Dómine, = Padre, Señor de todas las cosas,
      cum Génito de Vírgine, = con el Hijo nacido de la Virgen,
      intus et in circúitu = por dentro y alrededor
      nos rege Sancto Spíritu. = gobiérnanos con el Espíritu Santo.
    - |-
      Meménto, Sancta Trínitas, = Acuérdate, Santa Trinidad,
      quod tua fecit bónitas, = de lo que hizo tu bondad,
      creándo prius hóminem, = creando primero al hombre,
      recreándo per sánguinem. = recreándolo por la sangre.
    - |-
      Nam quos creávit Únitas, = Pues a los que creó la Unidad
      redémit Christi cáritas; = los redimió la caridad de Cristo;
      patiéndo tunc díligens, = que el que entonces amó padeciendo
      nunc díligat nos éligens. = nos ame ahora eligiéndonos.
    - |-
      Tríadi sanctæ gáudium, = A la Tríada santa, el gozo,
      pax, virtus et impérium, = la paz, el poder y el imperio,
      decus, omnipoténtia, = el honor, la omnipotencia,
      laus, honor, reveréntia. = la alabanza, la honra, la reverencia.
  diei-luce-reddita:
    titulo: Diéi luce réddita
    amen: true
    estrofas:
    - |-
      Diéi luce réddita, = Devuelta la luz del día,
      lætis gratísque vócibus = con voces alegres y agradecidas
      Dei canámus glóriam, = cantemos la gloria de Dios,
      Christi faténtes grátiam. = confesando la gracia de Cristo,
    - |-
      Per quem creátor ómnium = por quien el creador de todas las cosas
      diem noctémque cóndidit, = hizo el día y la noche,
      ætérna lege sánciens = estableciendo con ley eterna
      ut semper succédant sibi. = que se sucedan siempre.
    - |-
      Tu vera lux fidélium, = Tú, luz verdadera de los fieles,
      quem lex vetérna non tenet, = a quien no sujeta la ley antigua,
      noctis nec ortu súccidens, = que no caes con la salida de la noche,
      ætérno fulgens lúmine. = brillando con luz eterna.
    - |-
      Præsta, Pater ingénite, = Concede, Padre no engendrado,
      totum ducámus iúgiter = que pasemos continuamente todo
      Christo placéntes hunc diem = este día agradando a Cristo,
      Sancto repléti Spíritu. = llenos del Espíritu Santo.
  immensa-et-una-trinitas:
    titulo: Imménsa et una, Trínitas
    amen: true
    estrofas:
    - |-
      Imménsa et una, Trínitas, = Inmensa y única Trinidad,
      cuius potéstas ómnia = cuyo poder hace y gobierna
      facit regítque témpora = todas las cosas y los tiempos
      et exstat ante sǽcula, = y existe antes de los siglos,
    - |-
      Tu sola pleno súfficis = tú sola te bastas, dichosa,
      tibi beáta gáudio; = con gozo pleno;
      tu pura, simplex, próvida = tú, pura, simple, providente,
      cælos et orbem cóntines. = contienes los cielos y el orbe.
    - |-
      Omnis, Pater, fons grátiæ, = Padre, fuente de toda gracia;
      Lumen patérnæ glóriæ, = Luz de la gloria del Padre;
      Sancte utriúsque Spíritus = Espíritu Santo de ambos,
      intermináta cáritas, = caridad sin término:
    - |-
      Ex te supréma orígine, = de ti, origen supremo,
      Trias benígna, prófluit = Tríada benigna, fluye
      creáta quicquid sústinet, = todo lo que sostiene lo creado,
      quicquid decóre pérficit. = todo lo que lo perfecciona con belleza.
    - |-
      Quos et coróna múneras = A los que obsequias también con la corona
      adoptiónis íntimæ, = de la adopción íntima,
      nos templa fac niténtia = haznos templos resplandecientes
      tibi placére iúgiter. = que te agraden siempre.
    - |-
      O viva lux, nos ángelis = Oh luz viva, concédenos unirnos
      da iungi in aula cǽlica, = a los ángeles en el palacio del cielo,
      ut grati amóris láudibus = para que te cantemos por siempre
      te concinámus pérpetim. = con alabanzas de amor agradecido.
  te-patrem-summum-genitumque-verbum:
    titulo: Te Patrem summum genitúmque Verbum
    amen: true
    estrofas:
    - |-
      Te Patrem summum genitúmque Verbum = A ti, Padre altísimo, y al Verbo engendrado
      Flamen ac Sanctum Dóminum faténtur = y al Espíritu Santo los confiesan como único
      únicum, quotquot paradísi amœ́nus = Señor todos cuantos reúne el ameno
      hortus adúnat. = huerto del paraíso.
    - |-
      Quam modis miris, Trias alma, vivas = De qué modos admirables vives, Tríada bondadosa,
      pércipit nemo, tamen usque in ævum = nadie lo comprende; sin embargo, por siempre
      cǽlites vultu sátias, alácri = sacias con tu rostro a los del cielo,
      voce canéntes. = que cantan con voz alegre.
    - |-
      Te canunt mundi statuísse molem, = Te cantan porque estableciste la mole del mundo,
      Lúmine ætérno régere univérsa, = porque lo gobiernas todo con luz eterna,
      ígnibus celsi refovére Amóris = porque reanimas con los fuegos del Amor excelso
      corda tuórum. = los corazones de los tuyos.
    - |-
      Mente permísti súperum catérvis, = Unidos con la mente a las multitudes de lo alto,
      iam choris illis sociámus hymnos, = ya juntamos nuestros himnos a aquellos coros,
      qui tua optámus fore sempitérna = nosotros, que deseamos ser dichosos
      pace beáti. = en tu paz sempiterna.
  trinitas-summo-solio-coruscans:
    titulo: Trínitas, summo sólio corúscans
    amen: true
    estrofas:
    - |-
      Trínitas, summo sólio corúscans, = Trinidad, que resplandeces en el sumo trono,
      glóriæ carmen tibi sit perénne, = sea para ti el canto perenne de la gloria,
      quæ tenes nostri veheménti amóre = que posees con amor vehemente
      péctoris ima. = lo íntimo de nuestro pecho.
    - |-
      Cónditor rerum, Pater, alma virtus, = Creador de las cosas, Padre, poder bondadoso,
      quos tuæ vitæ facis atque formæ = a quienes haces partícipes de tu vida
      esse consórtes, fídei fac usque = y de tu forma, haz que merezcamos
      dona meréri. = siempre los dones de la fe.
    - |-
      Candor ætérnæ speculúmque lucis, = Resplandor y espejo de la luz eterna,
      Nate, quos dicis sociásque fratres, = Hijo, a quienes llamas y asocias como hermanos,
      pálmites viti tibi nos inésse = concédenos estar en ti
      da viridántes. = como sarmientos verdes en la vid.
    - |-
      Cáritas, ignis, píetas, poténti = Caridad, fuego, piedad, que gobiernas lo creado
      lúmine ac blando móderans creáta, = con luz poderosa y suave,
      Spíritus, mentem rénova, fovéto = Espíritu, renueva la mente, calienta
      íntima cordis. = lo íntimo del corazón.
    - |-
      Hospes o dulcis, Trias obsecránda, = Oh dulce huésped, Tríada a quien suplicamos,
      nos tibi iugi fac amóre nexos, = haznos unidos a ti con amor continuo,
      pérpetes donec modulémur hymnos = hasta que cantemos himnos perpetuos
      teque fruámur. = y gocemos de ti.
  pange-lingua-gloriosi-corporis:
    titulo: Pange, lingua, gloriósi
    amen: true
    estrofas:
    - |-
      Pange, lingua, gloriósi = Canta, lengua, el misterio
      córporis mystérium, = del cuerpo glorioso
      sanguinísque pretiósi, = y de la sangre preciosa
      quem in mundi prétium = que, como precio del mundo,
      fructus ventris generósi = derramó el Rey de las naciones,
      Rex effúdit géntium. = fruto de un vientre generoso.
    - |-
      Nobis datus, nobis natus = Dado a nosotros, nacido para nosotros
      ex intácta Vírgine, = de una Virgen intacta,
      et in mundo conversátus, = y habiendo vivido en el mundo,
      sparso verbi sémine, = esparcida la semilla de la palabra,
      sui moras incolátus = cerró el tiempo de su morada [en la tierra]
      miro clausit órdine. = de un modo admirable.
    - |-
      In suprémæ nocte cenæ = En la noche de la última cena,
      recúmbens cum frátribus, = recostado con los hermanos,
      observáta lege plene = observada plenamente la ley
      cibis in legálibus, = en los alimentos legales,
      cibum turbæ duodénæ = como alimento a los doce
      se dat suis mánibus. = se da con sus propias manos.
    - |-
      Verbum caro panem verum = El Verbo hecho carne, con su palabra,
      verbo carnem éfficit, = convierte el pan verdadero en carne,
      fitque sanguis Christi merum, = y el vino se hace sangre de Cristo,
      et, si sensus déficit, = y, si los sentidos fallan,
      ad firmándum cor sincérum = para afirmar el corazón sincero
      sola fides súfficit. = basta solo la fe.
    - |-
      Tantum ergo sacraméntum = Veneremos, pues, postrados,
      venerémur cérnui, = tan grande sacramento,
      et antíquum documéntum = y que la antigua enseñanza
      novo cedat rítui; = ceda al nuevo rito;
      præstet fides suppleméntum = que la fe supla
      sénsuum deféctui. = la falta de los sentidos.
    - |-
      Genitóri Genitóque = Al Padre y al Hijo,
      laus et iubilátio, = alabanza y júbilo,
      salus, honor, virtus quoque = salud, honor y también poder
      sit et benedíctio; = y bendición;
      procedénti ab utróque = al que procede de ambos
      compar sit laudátio. = sea igual alabanza.
  sacris-sollemniis-iuncta-sint-gaudia:
    titulo: Sacris sollémniis iuncta sint gáudia
    amen: true
    estrofas:
    - |-
      Sacris sollémniis iuncta sint gáudia, = Únanse los gozos a las sagradas solemnidades,
      et ex præcórdiis sonent præcónia; = y resuenen las alabanzas desde lo hondo del corazón;
      recédant vétera, nova sint ómnia, = retírese lo viejo, que todo sea nuevo:
      corda, voces et ópera. = los corazones, las voces y las obras.
    - |-
      Noctis recólitur cena novíssima, = Se recuerda la última cena de aquella noche,
      qua Christus créditur agnum et ázyma = en la que se cree que Cristo dio a los hermanos
      dedísse frátribus iuxta legítima = el cordero y los ázimos, según lo legítimo
      priscis indúlta pátribus. = concedido a los padres antiguos.
    - |-
      Dedit fragílibus córporis férculum, = Dio a los frágiles el manjar del cuerpo,
      dedit et trístibus sánguinis póculum, = dio también a los tristes la copa de la sangre,
      dicens: «Accípite quod trado vásculum; = diciendo: «Tomad la copa que os entrego;
      omnes ex eo bíbite». = bebed todos de ella».
    - |-
      Sic sacrifícium istud instítuit, = Así instituyó este sacrificio,
      cuius offícium commítti vóluit = cuyo ministerio quiso confiar
      solis presbýteris, quibus sic cóngruit, = solo a los presbíteros, a quienes corresponde
      ut sumant et dent céteris. = tomarlo y darlo a los demás.
    - |-
      Panis angélicus fit panis hóminum; = El pan de los ángeles se hace pan de los hombres;
      dat panis cǽlicus figúris términum. = el pan del cielo pone término a las figuras.
      O res mirábilis: mandúcat Dóminum = ¡Oh cosa admirable: come al Señor
      servus pauper et húmilis. = el siervo pobre y humilde!
    - |-
      Te, trina Déitas únaque, póscimus; = A ti, Deidad trina y una, te pedimos:
      sic nos tu vísitas sicut te cólimus: = visítanos así como te veneramos;
      per tuas sémitas duc nos quo téndimus = por tus senderos llévanos adonde tendemos,
      ad lucem quam inhábitas. = a la luz que habitas.
  verbum-supernum-prodiens-nec-patris:
    titulo: Verbum supérnum pródiens
    amen: true
    estrofas:
    - |-
      Verbum supérnum pródiens = El Verbo de lo alto, saliendo
      nec Patris linquens déxteram, = sin dejar la diestra del Padre,
      ad opus suum éxiens = partiendo a su obra,
      venit ad vitæ vésperam. = llegó a la tarde de su vida.
    - |-
      In mortem a discípulo = Antes de ser entregado a la muerte
      suis tradéndus ǽmulis, = por un discípulo a sus rivales,
      prius in vitæ férculo = se entregó a los discípulos
      se trádidit discípulis. = como manjar de vida.
    - |-
      Quibus sub bina spécie = A ellos, bajo una doble especie,
      carnem dedit et sánguinem, = les dio la carne y la sangre,
      ut dúplicis substántiæ = para alimentar entero al hombre
      totum cibáret hóminem. = de doble sustancia.
    - |-
      Se nascens dedit sócium, = Al nacer se dio como compañero,
      convéscens in edúlium, = en la cena, como alimento,
      se móriens in prétium, = al morir, como precio,
      se regnans dat in prǽmium. = reinando se da como premio.
    - |-
      O salutáris hóstia, = Oh víctima salvadora,
      quæ cæli pandis óstium, = que abres la puerta del cielo,
      bella premunt hostília: = nos oprimen guerras enemigas:
      da robur, fer auxílium. = da fuerza, trae auxilio.
    - |-
      Uni trinóque Dómino = Al Señor uno y trino
      sit sempitérna glória, = sea la gloria sempiterna,
      qui vitam sine término = que nos dé en la patria
      nobis donet in pátria. = la vida sin término.
  auctor-beate-saeculi:
    titulo: Auctor beáte sǽculi
    amen: true
    estrofas:
    - |-
      Auctor beáte sǽculi, = Bondadoso autor del mundo,
      Christe, Redémptor ómnium, = Cristo, Redentor de todos,
      lumen Patris de lúmine = luz de luz del Padre
      Deúsque verus de Deo: = y Dios verdadero de Dios:
    - |-
      Amor coégit te tuus = tu amor te obligó
      mortále corpus súmere, = a tomar un cuerpo mortal,
      ut, novus Adam, rédderes = para que, nuevo Adán, devolvieras
      quod vetus ille abstúlerat: = lo que aquel viejo había quitado.
    - |-
      Ille amor, almus ártifex = Aquel amor, artífice bondadoso
      terræ marísque et síderum, = de la tierra, del mar y de los astros,
      erráta patrum míserans = compadecido de los errores de los padres,
      et nostra rumpens víncula. = rompe también nuestras cadenas.
    - |-
      Non corde discédat tuo = Que no se aparte de tu corazón
      vis illa amóris íncliti: = aquella fuerza del amor ínclito:
      hoc fonte gentes háuriant = que de esta fuente saquen los pueblos
      remissiónis grátiam. = la gracia del perdón.
    - |-
      Ad hoc acérbam lánceam = Para esto [fue herido por] la lanza amarga
      passúmque ad hoc est vúlnera, = y para esto padeció las heridas:
      ut nos laváret sórdibus = para lavarnos de las manchas
      unda fluénte et sánguine. = con el agua y la sangre que brotaron.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui corde fundis grátiam, = que derramas la gracia desde tu corazón,
      cum Patre et almo Spíritu = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  cor-arca-legem-continens:
    titulo: Cor, arca legem cóntinens
    amen: true
    estrofas:
    - |-
      Cor, arca legem cóntinens = Corazón, arca que contiene la ley,
      non servitútis véteris, = no de la antigua servidumbre,
      sed grátiæ, sed véniæ, = sino de la gracia, del perdón
      sed et misericórdiæ; = y también de la misericordia;
    - |-
      Cor, sanctuárium novi = Corazón, santuario intacto
      intemerátum fœ́deris, = de la nueva alianza,
      templum vetústo sánctius = templo más santo que el antiguo
      velúmque scisso utílius: = y velo más útil que el rasgado:
    - |-
      Te vulnerátum cáritas = la caridad quiso que fueras herido
      ictu paténti vóluit, = con un golpe abierto,
      amóris invisíbilis = para que veneremos las heridas
      ut venerémur vúlnera. = del amor invisible.
    - |-
      Hoc sub amóris sýmbolo = Bajo este símbolo del amor,
      passus cruénta et mýstica, = habiendo padecido [muertes] sangrienta y mística,
      utrúmque sacrifícium = Cristo sacerdote ofreció
      Christus sacérdos óbtulit. = uno y otro sacrificio.
    - |-
      Quis non amántem rédamet? = ¿Quién no devolverá amor al que ama?
      quis non redémptus díligat = ¿Quién, redimido, no lo amará
      et caritáte iúgiter = y no deseará estar unido
      hærére Christo géstiat? = a Cristo siempre por la caridad?
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui corde fundis grátiam, = que derramas la gracia desde tu corazón,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  iesu-auctor-clementiae:
    titulo: Iesu, auctor cleméntiæ
    amen: true
    estrofas:
    - |-
      Iesu, auctor cleméntiæ, = Jesús, autor de la clemencia,
      totíus spes lætítiæ, = esperanza de toda alegría,
      dulcóris fons et grátiæ, = fuente de dulzura y de gracia,
      veræ cordis delíciæ: = verdaderas delicias del corazón:
    - |-
      Iesu, spes pæniténtibus, = Jesús, esperanza de los penitentes,
      quam pius es peténtibus, = ¡qué piadoso eres con los que piden,
      quam bonus te quæréntibus; = qué bueno con los que te buscan!,
      sed quid inveniéntibus? = pero ¿qué con los que te encuentran?
    - |-
      Tua, Iesu, diléctio, = Tu amor, Jesús,
      grata mentis reféctio, = grato alimento de la mente,
      replet sine fastídio, = sacia sin hastío,
      dans famem desidério. = dando hambre al deseo.
    - |-
      O Iesu dilectíssime, = Oh Jesús amadísimo,
      spes suspirántis ánimæ, = esperanza del alma que suspira,
      te quærunt piæ lácrimæ, = te buscan las lágrimas piadosas,
      te clamor mentis íntimæ. = te [busca] el clamor de la mente íntima.
    - |-
      Mane nobíscum, Dómine, = Quédate con nosotros, Señor,
      mane novum cum lúmine, = quédate con la luz nueva,
      pulsa noctis calígine = ahuyentada la oscuridad de la noche,
      mundum replens dulcédine. = llenando el mundo de dulzura.
    - |-
      Iesu, summa benígnitas, = Jesús, suma benignidad,
      mira cordis iucúnditas, = admirable alegría del corazón,
      incomprehénsa bónitas, = bondad incomprensible,
      tua nos stringit cáritas. = tu caridad nos estrecha.
    - |-
      Iesu, flos Matris vírginis, = Jesús, flor de la Madre virgen,
      amor nostræ dulcédinis, = amor de nuestra dulzura,
      laus tibi sine términis, = a ti la alabanza sin término,
      regnum beatitúdinis. = el reino de la bienaventuranza.
  aeterne-christe-pontifex:
    titulo: Ætérne, Christe, póntifex
    amen: true
    estrofas:
    - |-
      Ætérne, Christe, póntifex = Cristo, pontífice eterno,
      novi sacérdos fœderis, = sacerdote de la nueva alianza,
      te nostra vota cóndecent, = a ti convienen nuestros votos,
      te grati amóris cántica. = a ti los cantos del amor agradecido.
    - |-
      E Patris aula pródiens, = Saliendo del palacio del Padre,
      nostri misértus crímina, = compadecido de nuestros pecados,
      venis in alvum Vírginis, = vienes al seno de la Virgen,
      egénus atque obœdiens. = pobre y obediente.
    - |-
      Delens vetústa et ómnia, = Borrando todo lo antiguo,
      in lumen aptans grátiæ, = acomodándolo a la luz de la gracia,
      a Patre digne ac Spíritu = eres ungido dignamente por el Padre y el Espíritu
      princeps sacérdos úngeris. = como sacerdote principal.
    - |-
      Tu pura solus hóstia, = Tú solo, víctima pura,
      amóre fundis sánguinem, = derramas por amor tu sangre,
      donas amóre ut fílii = concedes por amor que los hijos
      iam pace Patris gáudeant. = gocen ya de la paz del Padre.
    - |-
      Nostræ salúti iúgiter = Para nuestra salvación te das
      te das in aris víctimam; = continuamente como víctima en los altares;
      throno suprémo et ássides = y te sientas en el trono supremo
      perfécte ut unus ímpetres. = para interceder perfectamente, tú solo.
    - |-
      Sit, Christe, summe póntifex = Cristo, sumo pontífice,
      tibi Patríque glória, = a ti y al Padre sea la gloria,
      qui vivis, offers, ímperas = que vives, ofreces y reinas
      in sempitérna sǽcula. = por los siglos sempiternos.
  pontifex-iesu-mediator-une:
    titulo: Póntifex Iesu, mediátor une
    amen: true
    estrofas:
    - |-
      Póntifex Iesu, mediátor une = Jesús pontífice, único mediador
      ad thronum Patris precibúsque fautor = ante el trono del Padre y abogado con tus ruegos,
      iure conclámat, celebrátque nostrum = con razón te aclama y te celebra
      te genus omne. = todo nuestro linaje.
    - |-
      Spíritu factus grémio puéllæ = Hecho por el Espíritu en el seno de una doncella,
      tu puer, cuius tenet ulna mundum, = tú, niño cuyo brazo sostiene el mundo,
      natus es nobis bene digna sola = naciste para nosotros, la única
      hóstia laudis. = víctima de alabanza digna.
    - |-
      Te sacerdótem Pater ipse sancti = A ti como sacerdote el Padre mismo te ungió
      gáudii donis oleóque inúnxit = con los dones y el óleo de la santa alegría,
      summa maiéstas sibi ut usque ferret = para llevar siempre hacia sí, majestad suprema,
      culmen honóris. = la cumbre del honor.
    - |-
      Carne mortáli, Deus alte, sumpta = Tomada una carne mortal, Dios altísimo,
      sánguinis præbens decus et lavácrum, = ofreciendo la honra y el lavado de la sangre,
      iusta pro nostræ prétia obtulísti = pagaste el justo precio
      crímine mortis. = por el pecado de nuestra muerte.
    - |-
      Christe, qui ligno crucis elevátus = Cristo, que, elevado en el leño de la cruz,
      cuncta traxísti, corda amóre figens, = lo atrajiste todo, clavando los corazones con amor,
      fac tibi, Patri, Paracléto in ævum = haz que te demos a ti, al Padre y al Paráclito
      cántica demus. = cantos por siempre.
  concinunt-caeli-parilique-tellus:
    titulo: Cóncinunt cæli parilíque tellus
    amen: true
    estrofas:
    - |-
      Cóncinunt cæli parilíque tellus = Los cielos y la tierra te cantan
      laude te, nostri géneris Redémptor, = con igual alabanza, Redentor de nuestro linaje,
      Christe, te Patri pérhibens piáclum = Cristo, que te ofreces al Padre como expiación,
      Ipse sacérdos. = tú mismo sacerdote.
    - |-
      Tu libens, Iesu, voluísti ad atræ = Tú, Jesús, quisiste ser llevado, voluntario
      mortis angórem placidúsque ferri, = y sereno, a la angustia de la muerte negra,
      pérditis nobis iter ut patéret = para que se abriera para nosotros, perdidos,
      portáque cæli. = el camino y la puerta del cielo.
    - |-
      Sacra tu delens veterúmque ritus = Tú, poniendo fin a los ritos sagrados de los antiguos
      ac prophetárum moniménta adímplens = y cumpliendo los anuncios de los profetas,
      iam cum summis novo amóre iungens = uniendo ya lo humano con lo supremo con un amor nuevo,
      fœdus inísti. = sellaste la alianza.
    - |-
      Fœderis tanti miserátus auctor, = Compasivo autor de tan gran alianza,
      te cibum vitæ tribuísti, ad aras = te diste como alimento de vida, para inmolar
      pignus ut pacis pius immoláres = en los altares, piadoso, la prenda de la paz,
      tu sacer unus. = tú, el único sacerdote.
    - |-
      Christe, qui ligno crucis elevátus = Cristo, que, elevado en el leño de la cruz,
      cuncta traxísti, corda amóre figens, = lo atrajiste todo, clavando los corazones con amor,
      fac tibi, Patri, Paracléto in ævum = haz que te demos a ti, al Padre y al Paráclito
      cántica demus. = cantos por siempre.
  captator-olim-piscium:
    titulo: Captátor olim píscium
    amen: true
    estrofas:
    - |-
      Captátor olim píscium, = Antes pescador de peces,
      iam nunc piscátor hóminum, = y ahora pescador de hombres,
      tuis, Andréa, rétibus = arrebátanos, Andrés, con tus redes
      mundi nos rape flúctibus. = de las olas del mundo.
    - |-
      Germánus Petri córpore = Hermano de Pedro en la carne
      nec mortis dispar órdine; = y no distinto en el modo de morir;
      quos una caro génuit, = a quienes engendró una misma carne,
      crux cælo fratres édidit. = la cruz los dio a luz como hermanos para el cielo.
    - |-
      O germen venerábile, = ¡Oh linaje venerable,
      o par coróna glóriæ! = oh pareja coronada de gloria!
      Ecclésiæ patres pii = Los padres piadosos de la Iglesia
      crucis sunt æque fílii. = son igualmente hijos de la cruz.
    - |-
      Ad Iesum fratri prǽvius = Tú, que precediste a tu hermano hacia Jesús
      indéxque vitæ strénuus, = y fuiste diligente guía de vida,
      et nobis esto míseris = sé también para nosotros, desdichados,
      beáti dux itíneris. = guía del camino dichoso.
    - |-
      Fratris comes egrégius, = Compañero insigne de tu hermano,
      Ecclésias impénsius = concede a las Iglesias, más intensamente
      da caritáte exércitas = ejercitadas en la caridad,
      pastóri Petro súbditas. = estar sometidas al pastor Pedro.
    - |-
      Vir Christo dilectíssime, = Varón amadísimo de Cristo,
      amóre fac nos cúrrere, = haznos correr por amor,
      ut læti adépti pátriam = para que, alcanzada alegres la patria,
      Deo canámus glóriam. = cantemos la gloria de Dios.
  fortem-piumque-praesulem:
    titulo: Fortem piúmque prǽsulem
    amen: true
    estrofas:
    - |-
      Fortem piúmque prǽsulem = Al obispo fuerte y piadoso
      canámus omnes, túrbidas = cantemos todos, que alejó
      qui fluctuántis sǽculi = de las tierras las tempestades turbulentas
      terris procéllas éxpulit. = del mundo agitado.
    - |-
      Non sceptra concússus timet, = No teme, conmovido, los cetros,
      non imperántem féminam, = ni a la mujer que manda,
      templóque, clausis póstibus, = y, cerradas las puertas, aparta
      arcet cruéntum cǽsarem. = del templo al césar ensangrentado.
    - |-
      Arcána sacræ páginæ = Los secretos de la página sagrada
      altus magíster éxplicat; = explica el alto maestro;
      divína pandens dógmata, = desplegando los dogmas divinos,
      mira nitet facúndia. = brilla con admirable elocuencia.
    - |-
      Fide ciénte spíritum, = Movido el espíritu por la fe,
      præclára fundit cármina; = compone cantos preclaros;
      fide coǽquans mártyres, = igualando por la fe a los mártires,
      depréndit artus mártyrum. = descubre los cuerpos de los mártires.
    - |-
      Iam nunc furéntem tártari = Ahora aparta con el látigo
      lupum flagéllo súbmove; = al lobo furioso del infierno;
      sciéntiæ nos lúmine = ampáranos con la luz de la ciencia,
      fove, tuére iúgiter. = protégenos siempre.
    - |-
      Sit Trinitáti glória, = Gloria sea a la Trinidad,
      quam, te rogánte próspere, = a quien, rogando tú con éxito,
      hymnis in aula cǽlica = alabemos con himnos en el palacio del cielo
      laudémus usque in sǽculum. = por los siglos.
  praeclara-custos-virginum:
    titulo: Præclára custos vírginum
    amen: true
    estrofas:
    - |-
      Præclára custos vírginum = Preclara custodia de las vírgenes
      Deíque mater ínnuba, = y madre de Dios sin esposo,
      cæléstis aulæ iánua, = puerta del palacio celestial,
      spes nostra, cæli gáudium; = esperanza nuestra, gozo del cielo;
    - |-
      Inter rubéta lílium, = lirio entre zarzas,
      colúmba formosíssima, = paloma hermosísima,
      e stirpe virga gérminans = vara que brota de la raíz
      nostro medélam vúlneri; = como remedio de nuestra herida;
    - |-
      Turris dracóni impérvia, = torre inaccesible al dragón,
      amíca stella náufragis, = estrella amiga de los náufragos,
      defénde nos a fráudibus = defiéndenos de los engaños
      tuáque luce dírige. = y guíanos con tu luz.
    - |-
      Erróris umbras díscute, = Disipa las sombras del error,
      syrtes dolósas ámove, = aparta los bancos de arena engañosos,
      fluctus tot inter, déviis = entre tantas olas, abre a los extraviados
      tutam reclúde sémitam. = un sendero seguro.
    - |-
      Quæ labe nostræ oríginis = Tú, que brillas, única, intacta
      intácta splendes única, = de la mancha de nuestro origen,
      serpéntis artes ǽmuli = burla, vengadora ínclita,
      elúde vindex ínclita. = las artes de la serpiente rival.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui sanctitátis únicæ = que te obsequiaron con la gracia
      te munerárunt grátia. = de una santidad única.
  te-dicimus-praeconio:
    titulo: Te dícimus præcónio
    amen: true
    estrofas:
    - |-
      Te dícimus præcónio, = Te celebramos con alabanza,
      mater Dei puríssima; = purísima madre de Dios;
      nostris benígna láudibus = a nuestras alabanzas, benigna,
      tuam repénde grátiam. = corresponde con tu gracia.
    - |-
      Sontes Adámi pósteri = Culpables descendientes de Adán,
      infécta proles gígnimur; = nacemos como prole manchada;
      labis patérnæ néscia = solo tú, Virgen, eres creída
      tu sola, Virgo, créderis. = ajena a la mancha paterna.
    - |-
      Caput dracónis ínvidi = La cabeza del dragón envidioso
      tu cónteris vestígio, = aplastas tú con tu pie,
      gerísque sola glóriam = y llevas tú sola la gloria
      intaminátæ oríginis. = de un origen sin mancha.
    - |-
      Nostræ decus propáginis, = Honra de nuestro linaje,
      quæ tollis Evæ oppróbrium, = que quitas el oprobio de Eva,
      tu nos tuére súpplices, = protégenos tú, que te suplicamos,
      tu nos labántes érige. = levántanos tú, que vacilamos.
    - |-
      Serpéntis antíqui potens = Poderosa, quebranta las astucias
      astus retúnde et ímpetus, = y los ataques de la antigua serpiente,
      ut cǽlitum perénnibus = para que por ti gocemos
      per te fruámur gáudiis. = de los gozos perennes de los del cielo.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui sanctitátis únicæ = que te obsequiaron con la gracia
      te munerárunt grátia. = de una santidad única.
  in-plausu-grati-carminis:
    titulo: In plausu grati cárminis
    amen: true
    estrofas:
    - |-
      In plausu grati cárminis = En el aplauso de un canto agradecido
      adsit nova lætítia, = esté presente una alegría nueva,
      dum Dei matris Vírginis = mientras la Virgen madre de Dios
      sumit vita princípia. = recibe los comienzos de la vida.
    - |-
      María, mundi glória, = María, gloria del mundo,
      lucis ætérnæ fília, = hija de la luz eterna,
      te præservávit Fílius = te preservó tu Hijo
      ab omni labe pénitus. = del todo de toda mancha.
    - |-
      Originális mácula = La mancha original
      cuncta respérsit sǽcula; = salpicó todos los siglos;
      sola post Natum vítiis = de ti sola, después del Hijo, se dice
      numquam contácta díceris. = que nunca fuiste tocada por los vicios.
    - |-
      Caput serpéntis cállidi = La cabeza de la serpiente astuta
      tuo pede contéritur; = es aplastada por tu pie;
      fastus gigántis pérfidi = el orgullo del gigante pérfido
      David funda devíncitur. = es vencido por la honda de David.
    - |-
      Colúmba mitis, húmilis, = Paloma mansa, humilde,
      fers, carens felle críminis, = libre de la hiel del pecado,
      signum Dei cleméntiæ, = llevas la señal de la clemencia de Dios,
      ramum viréntis grátiæ. = el ramo de la gracia que reverdece.
    - |-
      Patri sit et Paráclito = Gloria sea al Padre y al Paráclito
      tuóque Nato glória, = y a tu Hijo,
      qui sanctitátis únicæ = que te obsequiaron con la gracia
      te munerárunt grátia. = de una santidad única.
  festum-celebre-martyris:
    titulo: Festum celébre mártyris
    amen: true
    estrofas:
    - |-
      Festum celébre mártyris = La célebre fiesta del mártir
      digne colámus Stéphani, = Esteban celebremos dignamente,
      qui primus in certámine = que, el primero en el combate,
      palma nitet victóriæ. = brilla con la palma de la victoria.
    - |-
      Martyr fidélis, cómminus = Mártir fiel, resistiendo
      falsis renítens téstibus, = de cerca a los falsos testigos,
      Iesu vidébat glóriam, = veía la gloria de Jesús,
      stantis Patris ad déxteram. = de pie a la derecha del Padre.
    - |-
      Nunc te precámur, ínclite, = Ahora te pedimos, ínclito mártir:
      succúrre, martyr, cóncite; = socórrenos pronto;
      nobis rogátus ímpetra = rogado por nosotros, alcánzanos
      cæli ut patéscat régia. = que se nos abra el palacio del cielo.
    - |-
      Lotus cruóris flúmine, = Lavado en el río de la sangre,
      splendéscis alto lúmine; = resplandeces con la luz de lo alto;
      nostri memor nunc súpplica = acordándote ahora de nosotros, suplica
      tecum fruámur glória. = que gocemos contigo de la gloria.
    - |-
      Præstet favens hæc múnera = Concédanos, favorable, estos dones
      natus Puer de Vírgine, = el Niño nacido de la Virgen,
      cum Patre et almo Spíritu = que reina con el Padre y el Espíritu bondadoso
      regnans per omne sǽculum. = por todos los siglos.
  christus-est-vita-veniens-in-orbem:
    titulo: Christus est vita véniens in orbem
    amen: true
    estrofas:
    - |-
      Christus est vita véniens in orbem, = Cristo es la vida que viene al mundo,
      qui ferens vulnus removénsque mortem, = que, cargando la herida y quitando la muerte,
      ad Patris dextram repeténdo, regnat = volviendo a la derecha del Padre, reina
      sede supérna. = en el trono de lo alto.
    - |-
      Hunc sequens primus Stéphanus miníster = Siguiéndolo, Esteban, el primer ministro,
      sortis illátæ título est decórus, = se adorna con el título de la suerte recibida,
      quam dedit spirans Dómini benígnus = que le dio, al soplar sobre él, el benigno
      Spíritus illi. = Espíritu del Señor.
    - |-
      Sáxeo nimbo lapidátus instat, = Apedreado por una nube de piedras, se mantiene firme,
      sústinet mortis rábiem profánam, = soporta la rabia profana de la muerte,
      hóstibus quærit véniam misértus = pide, compadecido, perdón para los enemigos
      péctore grato. = con un pecho agradecido.
    - |-
      Quǽsumus flentes, benedícte prime = Te pedimos llorando, bendito primer
      martyr et civis sociáte iustis: = mártir y ciudadano asociado a los justos:
      cǽlitus, claræ regiónis heres, = desde el cielo, heredero de la región luminosa,
      mitte favóres. = envíanos tus favores.
    - |-
      Glóriæ laudes Tríadi Beátæ = Alabanzas de gloria a la Tríada bienaventurada
      mártyrum læti cómites canámus, = cantemos alegres, compañeros de los mártires,
      quæ dedit primas Stéphano ex agóne = que concedió a Esteban llevar del combate
      ferre corónas. = las primeras coronas.
  virginis-virgo-venerande-custos:
    titulo: Vírginis virgo veneránde custos
    amen: true
    estrofas:
    - |-
      Vírginis virgo veneránde custos, = Virgen venerable, custodio de la Virgen,
      præco qui Verbi cóleris fidélis, = que eres honrado como heraldo fiel del Verbo,
      terge servórum fácinus tuórum, = limpia la culpa de tus siervos,
      sancte Ioánnes. = san Juan.
    - |-
      Fonte prorúmpens flúvius perénni = Río que brota de una fuente perenne,
      curris, aréntis satiátor orbis; = corres saciando al orbe sediento;
      hausit ex pleno, modo quod propínat, = tu pecho bebió del pecho lleno
      péctore pectus. = lo que ahora da a beber.
    - |-
      Tu, decus mundi iubar atque cæli, = Tú, honra del mundo y resplandor del cielo,
      ímpetra nostris véniam ruínis; = alcanza el perdón para nuestras caídas;
      da sacraméntum penetráre summum, = concédenos penetrar el misterio supremo
      quod docuísti. = que enseñaste.
    - |-
      Patris arcánum speculándo Verbum = Contemplando al Verbo, secreto del Padre,
      grátiam fundis fídei per orbem; = derramas la gracia de la fe por el orbe;
      nos ad ætérnam spéciem fruéndam, = llévanos, buen guía, a gozar
      dux bone, transfer. = de la visión eterna.
    - |-
      Sit decus summo sine fine Christo, = Honra sin fin sea a Cristo altísimo,
      sancta quem virgo génuit María, = a quien engendró la santa virgen María,
      qui Patri compar Flaminíque Sancto = que, igual al Padre y al Espíritu Santo,
      regnat in ævum. = reina por siempre.
  cohors-beata-seraphim:
    titulo: Cohors beáta Séraphim
    amen: true
    estrofas:
    - |-
      Cohors beáta Séraphim = Que la cohorte bienaventurada de los serafines
      quem Christus arcte díligit = alabe al que Cristo ama estrechamente,
      laudet, chorúsque cánticis = y que nuestro coro resuene
      noster resúltet ǽmulis. = con cantos que los imiten.
    - |-
      Hic discit, almus édocet = Este aprende, el bondadoso enseña
      hic unde Verbum pródeat, = de dónde procede el Verbo,
      sinúmque matris ímpleat, = que llena el seno de la madre
      sinum Patris non déserens. = sin dejar el seno del Padre.
    - |-
      Felix Ioánnes, déligit = Feliz Juan, también a ti te elige
      et te Magíster próvidus, = el Maestro previsor,
      ut clara Thabor lúmina = para que veas las claras luces del Tabor
      hortíque cernas tǽdia. = y las angustias del huerto.
    - |-
      Tu, raptus in sublímia, = Tú, arrebatado a las alturas,
      arcána cæli cónspicis, = contemplas los secretos del cielo,
      Agni sed et mystéria = y percibes también los misterios
      Ecclesiǽque pércipis. = del Cordero y de la Iglesia.
    - |-
      O digne fili Vírgine, = Oh digno hijo de la Virgen,
      succéssor alti nóminis, = sucesor de un nombre excelso,
      nos adde Matri fílios, = agréganos a la Madre como hijos,
      nos conde Christi in péctore. = guárdanos en el pecho de Cristo.
    - |-
      Verbo sit ingens glória, = Gloria inmensa al Verbo,
      caro quod est et créditur, = que es y es creído carne,
      cum Patre et almo Spíritu = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  hymnum-canentes-martyrum:
    titulo: Hymnum canéntes mártyrum
    amen: true
    estrofas:
    - |-
      Hymnum canéntes mártyrum = Cantando el himno de los mártires,
      dicámus Innocéntium, = celebremos a los Inocentes,
      quos terra deflens pérdidit, = a quienes la tierra perdió llorando,
      gaudens sed æthra súscipit; = pero el cielo recibe gozoso;
    - |-
      Quos rex perémit ímpius, = a quienes mató el rey impío,
      pius sed Auctor cólligit, = pero recoge el piadoso Autor,
      secum beátos cóllocans = colocándolos consigo, dichosos,
      in luce regni pérpetis. = en la luz del reino perpetuo.
    - |-
      Præclára Christo splénduit = Preclara brilló para Cristo
      mors ínnocens fidélium; = la muerte inocente de los fieles;
      cælis ferébant ángeli = al cielo llevaban los ángeles
      bimos et infra párvulos. = a los niños de dos años y menores.
    - |-
      O quam beáta cívitas, = ¡Oh qué dichosa la ciudad
      in qua Redémptor náscitur, = en la que nace el Redentor
      natóque primæ mártyrum = y en la que al recién nacido se le dedican
      in qua dicántur hóstiæ! = las primeras víctimas de los mártires!
    - |-
      Astant niténtes fúlgidis = Están ahora ante su trono,
      eius throno nunc véstibus, = brillantes con vestiduras resplandecientes,
      stolas suas qui láverant = los que habían lavado sus túnicas,
      Agni rubéntes sánguine. = rojos con la sangre del Cordero.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  audit-tyrannus-anxius:
    titulo: Audit tyránnus ánxius
    amen: true
    estrofas:
    - |-
      Audit tyránnus ánxius = Oye el tirano, angustiado,
      adésse regum príncipem, = que ha llegado el príncipe de los reyes,
      qui nomen Israel regat = que ha de regir el nombre de Israel
      teneátque David régiam. = y ocupar el trono de David.
    - |-
      Exclámat amens núntio: = Exclama, enloquecido por la noticia:
      «Succéssor instat, péllimur; = «El sucesor apremia, somos expulsados;
      satélles, i, ferrum rape, = soldado, ve, toma la espada,
      perfúnde cunas sánguine!». = ¡baña las cunas en sangre!».
    - |-
      Quo próficit tantum nefas? = ¿De qué sirve tan gran crimen?
      Quid crimen Heródem iuvat? = ¿En qué le ayuda a Herodes el delito?
      Unus tot inter fúnera = Solo, entre tantas muertes,
      impúne Christus tóllitur. = Cristo es sacado sin daño.
    - |-
      Salvéte, flores mártyrum, = Salve, flores de los mártires,
      quos lucis ipso in límine = a quienes, en el umbral mismo de la luz,
      Christi insecútor sústulit = el perseguidor de Cristo arrancó
      ceu turbo nascéntes rosas. = como el torbellino a las rosas que nacen.
    - |-
      Vos prima Christi víctima, = Vosotros, primera víctima de Cristo,
      grex immolatórum tener, = tierno rebaño de inmolados,
      aram sub ipsum símplices = jugáis, sencillos, junto al altar mismo
      palma et corónis lúditis. = con la palma y las coronas.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  igne-divini-radians-amoris:
    titulo: Igne divíni rádians amóris
    amen: true
    estrofas:
    - |-
      Igne divíni rádians amóris = Radiante con el fuego del amor divino,
      córporis sexum superávit Agnes, = Inés superó la condición de su sexo,
      et super carnem potuére carnis = y más que la carne pudieron
      claustra pudícæ. = los cerrojos de la carne pudorosa.
    - |-
      Spíritum celsæ cápiunt cohórtes = Las cohortes excelsas reciben su espíritu
      cándidum, cæli super astra tollunt; = blanco, lo elevan sobre los astros del cielo;
      iúngitur Sponsi thálamis pudíca = la esposa pudorosa se une a las bodas
      sponsa beátis. = dichosas del Esposo.
    - |-
      Virgo, nunc nostræ miserére sortis = Virgen, compadécete ahora de nuestra suerte,
      et, tuum quisquis célebrat tropǽum, = y quien celebra tu triunfo
      ímpetret sibi véniam reátus = alcance para sí el perdón de la culpa
      atque salútem. = y la salvación.
    - |-
      Redde pacátum pópulo precánti = Devuelve propicio al pueblo que suplica
      príncipem cæli dominúmque terræ, = al príncipe del cielo y señor de la tierra,
      donet ut pacem pius et quiétæ = para que, piadoso, dé la paz y tiempos
      témpora vitæ. = de vida tranquila.
    - |-
      Láudibus mitem celebrémus Agnum, = Celebremos con alabanzas al manso Cordero,
      casta quem sponsum sibi legit Agnes, = a quien la casta Inés eligió como esposo,
      astra qui cæli moderátur atque = que gobierna los astros del cielo
      cuncta gubérnat. = y rige todas las cosas.
  agnes-beatae-virginis:
    titulo: Agnes beátæ vírginis
    amen: true
    estrofas:
    - |-
      Agnes beátæ vírginis = Es el natalicio de la bienaventurada
      natális est, quo spíritum = virgen Inés, en el que devolvió
      cælo refúdit débitum, = al cielo el espíritu que le debía,
      pio sacráta sánguine. = consagrada por su sangre piadosa.
    - |-
      Matúra martýrio fuit = Estaba madura para el martirio,
      matúra nondum núptiis; = aún no madura para las bodas;
      prodíre quis nuptum putet, = ¿quién no pensaría que iba a casarse?,
      sic læta vultu dúcitur. = tan alegre de rostro es conducida.
    - |-
      Aras nefándi núminis = Es obligada a quemar antorchas
      adolére tædis cógitur; = en los altares de un numen impío;
      respóndet: «Haud tales faces = responde: «No toman tales antorchas
      sumpsére Christi vírgines. = las vírgenes de Cristo.
    - |-
      Hic ignis extínguit fidem, = Este fuego apaga la fe,
      hæc flamma lumen éripit; = esta llama arrebata la luz;
      hic, hic feríte, ut prófluo = aquí, aquí herid, para que con la sangre
      cruóre restínguam focos». = que brote apague los fuegos».
    - |-
      Percússa quam pompam tulit! = Herida, ¡qué decoro guardó!
      Nam veste se totam tegens, = Pues, cubriéndose toda con el vestido,
      terram genu flexo petit = busca la tierra de rodillas,
      lapsu verecúndo cadens. = cayendo con pudor.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  pressi-malorum-pondere:
    titulo: Pressi malórum póndere
    amen: true
    estrofas:
    - |-
      Pressi malórum póndere = Oprimidos por el peso de los males,
      te, Paule, adímus súpplices, = acudimos a ti, Pablo, suplicantes,
      qui certa largus désuper = que, generoso, nos darás desde lo alto
      dabis salútis pígnora. = prendas seguras de salvación.
    - |-
      Nam tu beáto cóncitus = Pues tú, movido por el dichoso
      divíni amóris ímpetu, = ímpetu del amor divino,
      quos insecútor óderas, = a los que odiabas como perseguidor
      defénsor inde amplécteris. = abrazas después como defensor.
    - |-
      Amóris, eia, prístini = ¡Ea!, no te olvides, te pedimos,
      ne sis, precámur, ímmemor, = de tu antiguo amor,
      et nos supérnæ lánguidos = y a nosotros, débiles, llévanos de nuevo
      in spem redúcas grátiæ. = a la esperanza de la gracia de lo alto.
    - |-
      Te deprecánte flóreat = Que por tu ruego florezca
      ignára damni cáritas, = la caridad que no conoce daño,
      quam nulla turbent iúrgia = a la que ninguna discordia turbe
      nec ullus error sáuciet. = ni ningún error hiera.
    - |-
      O grata cælo víctima, = Oh víctima grata al cielo,
      te, lux amórque Géntium, = luz y amor de las naciones,
      o Paule, clarum víndicem, = oh Pablo, ilustre defensor,
      nos te patrónum póscimus. = te pedimos como patrono.
    - |-
      Laus Trinitáti, cántica = Alabanza a la Trinidad, cantos
      sint sempitérnæ glóriæ, = de gloria sempiterna,
      quæ nos boni certáminis = que nos corone contigo con los premios
      tecum corónet prǽmiis. = del buen combate.
  doctor-egregie-paule-mores-instrue:
    titulo: Doctor egrégie, Paule, mores ínstrue
    amen: true
    estrofas:
    - |-
      Doctor egrégie, Paule, mores ínstrue = Insigne doctor, Pablo, instruye las costumbres
      et mente polum nos transférre sátage, = y esfuérzate por llevar nuestra mente al cielo,
      donec perféctum largiátur plénius, = hasta que se nos dé más plenamente lo perfecto,
      evacuáto quod ex parte gérimus. = quitado lo que ahora tenemos en parte.
    - |-
      Sit Trinitáti sempitérna glória, = Sea a la Trinidad la gloria sempiterna,
      honor, potéstas atque iubilátio, = el honor, el poder y el júbilo,
      in unitáte, cui manet impérium = en la unidad, a la que pertenece el imperio
      ex tunc et modo per ætérna sǽcula. = desde entonces y ahora por los siglos eternos.
  excelsam-pauli-gloriam:
    titulo: Excélsam Pauli glóriam
    amen: true
    estrofas:
    - |-
      Excélsam Pauli glóriam = La excelsa gloria de Pablo
      concélebret Ecclésia, = celebre la Iglesia,
      quem mire sibi apóstolum = a quien el Señor, de enemigo, hizo
      ex hoste fecit Dóminus. = admirablemente su apóstol.
    - |-
      Quibus succénsus ǽstibus = Con los mismos ardores con que, encendido,
      in Christi nomen sǽviit, = se ensañó contra el nombre de Cristo,
      exársit his impénsius = con esos ardió más intensamente
      amórem Christi prǽdicans. = predicando el amor de Cristo.
    - |-
      O magnum Pauli méritum! = ¡Oh gran mérito de Pablo!
      Cælum conscéndit tértium, = Sube al tercer cielo,
      audit verba mystérii = oye palabras del misterio
      quæ nullus audet éloqui. = que nadie se atreve a decir.
    - |-
      Dum verbi spargit sémina, = Mientras esparce las semillas de la palabra,
      seges surgit ubérrima; = surge una cosecha abundantísima;
      sic cæli replent hórreum = así los frutos de las buenas obras
      bonórum fruges óperum. = llenan el granero del cielo.
    - |-
      Micántis more lámpadis = Como una lámpara que brilla,
      perfúndit orbem rádiis; = baña el orbe con sus rayos;
      fugat errórum ténebras, = ahuyenta las tinieblas de los errores,
      ut sola regnet véritas. = para que reine solo la verdad.
    - |-
      Christo sit omnis glória, = A Cristo sea toda la gloria,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      qui dedit vas tam fúlgidum = que dio a las naciones un vaso de elección
      electiónis géntibus. = tan resplandeciente.
  legis-sacratae-sanctis-caeremoniis:
    titulo: Legis sacrátæ sanctis cæremóniis
    amen: true
    estrofas:
    - |-
      Legis sacrátæ sanctis cæremóniis = A las santas ceremonias de la ley sagrada,
      subiéctus omnis cálamo Mosáico = sometido del todo a la pluma de Moisés,
      dignátur esse, qui regit perfúlgidos = se digna estar el que rige en el alcázar del Padre
      in arce Patris órdines angélicos, = los órdenes resplandecientes de los ángeles
      cælúmque, terram fundávit ac mária. = y fundó el cielo, la tierra y los mares.
    - |-
      Mater Beáta carnis sub velámine = La Madre dichosa, bajo el velo de la carne,
      Deum ferébat úmeris castíssimis, = llevaba a Dios en sus hombros castísimos,
      dúlcia strictis óscula sub lábiis = y había impreso dulces besos con labios apretados
      Deíque veri hominísque imprésserat = en la boca del Dios verdadero y hombre,
      ori, iubénte quo sunt cuncta cóndita. = por cuyo mandato fueron creadas todas las cosas.
    - |-
      Hic lumen ardens géntium in óculis, = Este es la luz ardiente ante los ojos de las naciones,
      glória plebis Israélis gérminis; = gloria del pueblo de la estirpe de Israel;
      pósitus hic est in ruínam scándali = este ha sido puesto para ruina y escándalo
      et in salútem populórum ómnium, = y para salvación de todos los pueblos,
      donec secréta reveléntur córdium. = hasta que se revelen los secretos de los corazones.
    - |-
      Glória Patri per imménsa sǽcula, = Gloria al Padre por los siglos inmensos,
      sit tibi, Nate, decus et impérium, = a ti, Hijo, sea la honra y el imperio,
      honor, potéstas Sanctóque Spirítui: = el honor, el poder, y al Espíritu Santo;
      sit Trinitáti salus indivídua = sea a la Trinidad la salvación indivisa
      per infiníta sæculórum sǽcula. = por los siglos infinitos de los siglos.
  adorna-sion-thalamum:
    titulo: Adórna, Sion, thálamum
    amen: true
    estrofas:
    - |-
      Adórna, Sion, thálamum, = Adorna, Sion, la cámara nupcial,
      quæ præstoláris Dóminum; = tú que esperas al Señor;
      sponsum et sponsam súscipe = recibe al esposo y a la esposa,
      vigil fídei lúmine. = vigilante con la luz de la fe.
    - |-
      Beáte senex, própera, = Anciano dichoso, apresúrate,
      promíssa comple gáudia = cumple los gozos prometidos
      et revelándum géntibus = y revela a todos la luz
      revéla lumen ómnibus. = que ha de revelarse a las naciones.
    - |-
      Paréntes Christum déferunt, = Los padres llevan a Cristo,
      in templo templum ófferunt; = ofrecen en el templo el templo;
      legi parére vóluit = quiso obedecer a la ley
      qui legi nihil débuit. = el que nada debía a la ley.
    - |-
      Offer, beáta, párvulum, = Ofrece, dichosa, al niño,
      tuum et Patris únicum; = tuyo y único del Padre;
      offer per quem offérimur, = ofrece a aquel por quien somos ofrecidos,
      prétium quo redímimur. = el precio con que somos redimidos.
    - |-
      Procéde, virgo régia, = Avanza, virgen real,
      profer Natum cum hóstia; = presenta al Hijo con la víctima;
      monet omnes ad gáudium = invita a todos al gozo
      qui venit salus ómnium. = el que viene como salvación de todos.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui te revélas géntibus, = que te revelas a las naciones,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  quod-chorus-vatum-venerandus-olim:
    titulo: Quod chorus vatum venerándus olim
    amen: true
    estrofas:
    - |-
      Quod chorus vatum venerándus olim = Lo que el venerable coro de los profetas
      Spíritu Sancto cécinit replétus, = cantó antiguamente, lleno del Espíritu Santo,
      in Dei factum genetríce constat = consta que se ha cumplido en la Madre de Dios,
      esse María. = María.
    - |-
      Hæc Deum cæli Dominúmque terræ = Ella, virgen, concibió al Dios del cielo
      virgo concépit peperítque virgo, = y Señor de la tierra, y lo dio a luz virgen,
      atque post partum méruit manére = y después del parto mereció permanecer
      invioláta. = intacta.
    - |-
      Quem senex iustus Símeon in ulnis = Al que el justo anciano Simeón tomó en brazos
      in domo sumpsit Dómini, gavísus = en la casa del Señor, gozoso
      ob quod optátum próprio vidéret = porque veía con sus propios ojos
      lúmine Christum. = a Cristo, el deseado.
    - |-
      Tu libens votis, pétimus, precántum, = Tú, Madre del rey eterno, te pedimos,
      regis ætérni génetrix, favéto, = favorece gustosa los votos de los que suplican,
      clara quæ fundis Géniti benígni = tú que derramas los claros dones de la luz
      múnera lucis. = de tu Hijo benigno.
    - |-
      Christe, qui lumen Patris es supérni, = Cristo, que eres la luz del Padre de lo alto,
      qui Patris nobis réseras profúnda, = que nos abres las profundidades del Padre,
      nos fac ætérnæ tibi ferre laudes = haz que te demos alabanzas eternas
      lucis in aula. = en el palacio de la luz.
  divina-vox-te-deligit:
    titulo: Divína vox te déligit
    amen: true
    estrofas:
    - |-
      Divína vox te déligit, = La voz divina te elige,
      piscátor, ac pro rétibus = pescador, ¡y con qué gloria,
      remísque qua tu glória = en lugar de las redes y los remos,
      cæli refúlges clávibus! = resplandeces con las llaves del cielo!
    - |-
      Tenax amóris próferens = Dando un testimonio firme
      ac dulce testimónium, = y dulce de amor,
      omnes amor quos láverat = recibes para que las gobiernes a todas las ovejas
      oves regéndas áccipis. = que el amor había lavado.
    - |-
      Lapsus, supérno róbore = Caído, por la fuerza de lo alto
      tu petra stas Ecclésiæ, = tú te yergues como piedra de la Iglesia,
      qua splendet illa sǽculis = por la que ella brilla a través de los siglos,
      nullis subácta víribus. = no sometida por ninguna fuerza.
    - |-
      Tu, Petre, Christi oráculo = Tú, Pedro, por el oráculo de Cristo,
      luces magíster ómnium, = brillas como maestro de todos,
      fratrésque firmas, próvidus = y confirmas a los hermanos; previsor,
      tu verba vitæ núntias. = anuncias las palabras de vida.
    - |-
      Gregem fac unum, próspera = Haz un solo rebaño, próspero
      lætis in ævum frúctibus, = con frutos alegres para siempre,
      salvúmque ab hostis ímpetu = y, a salvo del ataque del enemigo,
      ad lucis adduc pábula. = llévalo a los pastos de la luz.
    - |-
      Sit summa Christo glória, = Suma gloria a Cristo,
      qui nos tuis suffrágiis = que, por tus sufragios, nos conceda
      intráre cæli iánuam = entrar por la puerta del cielo
      det in supérna gáudia. = a los gozos de lo alto.
  iam-bone-pastor-petre-clemens-accipe:
    titulo: Iam, bone pastor, Petre, clemens áccipe
    amen: true
    estrofas:
    - |-
      Iam, bone pastor, Petre, clemens áccipe = Ahora, buen pastor, Pedro, recibe clemente
      vota precántum, et peccáti víncula = los votos de los que suplican, y desata
      resólve, tibi potestáte trádita, = las cadenas del pecado con el poder que se te dio,
      qua cunctis cælum verbo claudis, áperis. = con el que a todos cierras y abres el cielo con tu palabra.
    - |-
      Sit Trinitáti sempitérna glória, = Sea a la Trinidad la gloria sempiterna,
      honor, potéstas atque iubilátio, = el honor, el poder y el júbilo,
      in unitáte, cui manet impérium = en la unidad, a la que pertenece el imperio
      ex tunc et modo per ætérna sǽcula. = desde entonces y ahora por los siglos eternos.
  petrus-beatus-catenarum-laqueos:
    titulo: Petrus beátus catenárum láqueos
    amen: true
    estrofas:
    - |-
      Petrus beátus catenárum láqueos = El bienaventurado Pedro rompió admirablemente
      Christo iubénte rupit mirabíliter; = los lazos de las cadenas por mandato de Cristo;
      custos ovílis et doctor Ecclésiæ, = guardián del redil y doctor de la Iglesia,
      pastórque gregis, conservátor óvium = pastor del rebaño, protector de las ovejas,
      arcet lupórum truculéntam rábiem. = aparta la rabia feroz de los lobos.
    - |-
      Quodcúmque vinclis super terram strínxeris, = Todo lo que hayas atado con cadenas sobre la tierra
      erit in astris religátum fórtiter, = quedará firmemente atado en los astros,
      et quod resólvis in terris arbítrio, = y lo que desates en la tierra a tu arbitrio
      erit solútum super cæli rádium; = quedará desatado sobre el resplandor del cielo;
      in fine mundi iudex eris sǽculi. = al fin del mundo serás juez del siglo.
    - |-
      Glória Patri per imménsa sǽcula, = Gloria al Padre por los siglos inmensos,
      sit tibi, Nate, decus et impérium, = a ti, Hijo, sea la honra y el imperio,
      honor, potéstas Sanctóque Spirítui; = el honor, el poder, y al Espíritu Santo;
      sit Trinitáti salus indivídua = sea a la Trinidad la salvación indivisa
      per infiníta sæculórum sǽcula. = por los siglos infinitos de los siglos.
  te-ioseph-celebrent-agmina-caelitum:
    titulo: Te, Ioseph, célebrent ágmina cǽlitum
    amen: true
    estrofas:
    - |-
      Te, Ioseph, célebrent ágmina cǽlitum, = Que te celebren, José, las multitudes del cielo,
      te cuncti résonent christíadum chori, = que te canten todos los coros de los cristianos,
      qui, clarus méritis, iunctus es ínclitæ = porque, ilustre por tus méritos, te uniste a la Virgen
      casto fœ́dere Vírgini. = ínclita con un casto vínculo.
    - |-
      Almo cum túmidam gérmine cóniugem = Cuando, admirado, ves a tu esposa con el vientre
      admírans dúbio tángeris ánxius, = crecido por un germen divino, te tocan la duda y la angustia;
      afflátu súperi Fláminis ángelus = el ángel te enseña que el niño fue concebido
      concéptum púerum docet. = por el soplo del Espíritu de lo alto.
    - |-
      Tu natum Dóminum stringis, ad éxteras = Tú abrazas al Señor nacido, tú lo sigues
      Ægýpti prófugum tu séqueris plagas; = prófugo a las tierras extranjeras de Egipto;
      amíssum Sólymis quæris et ínvenis, = perdido en Jerusalén, lo buscas y lo encuentras,
      miscens gáudia flétibus. = mezclando gozos con llantos.
    - |-
      Eléctos réliquos mors pia cónsecrat = A los demás elegidos los consagra una muerte piadosa
      palmámque eméritos glória súscipit; = y la gloria recibe a los que han merecido la palma;
      tu vivens, súperis par, frúeris Deo, = tú, en vida, igual a los del cielo, gozas de Dios,
      mira sorte beátior. = más dichoso por una suerte admirable.
    - |-
      Nobis, summa Trias, parce precántibus; = Tríada suprema, perdónanos a los que te suplicamos;
      da Ioseph méritis sídera scándere, = concédenos subir a los astros por los méritos de José,
      ut tandem líceat nos tibi pérpetim = para que al fin podamos cantarte por siempre
      gratum prómere cánticum. = un cántico agradecido.
  iste-quem-laeti-colimus-fideles:
    titulo: Iste, quem læti cólimus, fidéles
    amen: true
    estrofas:
    - |-
      Iste, quem læti cólimus, fidéles, = Este a quien, fieles, honramos alegres,
      cuius excélsos cánimus triúmphos, = cuyos excelsos triunfos cantamos,
      hac die Ioseph méruit perénnis = José, mereció en este día los gozos
      gáudia vitæ. = de la vida perenne.
    - |-
      O nimis felix, nimis o beátus, = ¡Oh muy feliz, oh muy dichoso,
      cuius extrémam vígiles ad horam = junto a quien, en la hora final,
      Christus et Virgo simul astitérunt = estuvieron vigilantes a la vez Cristo y la Virgen
      ore seréno. = con rostro sereno!
    - |-
      Iustus insígnis, láqueo solútus = Justo insigne, libre del lazo
      carnis, ad sedes plácido sopóre = de la carne, pasa con plácido sueño
      migrat ætérnas, rutilísque cingit = a las moradas eternas, y ciñe sus sienes
      témpora sertis. = con guirnaldas brillantes.
    - |-
      Ergo regnántem flagitémus omnes, = Supliquemos, pues, todos al que reina
      adsit ut nobis, veniámque nostris = que nos asista y, obteniendo el perdón
      óbtinens culpis, tríbuat supérnæ = de nuestras culpas, nos conceda los dones
      múnera pacis. = de la paz de lo alto.
    - |-
      Sint tibi plausus, tibi sint honóres, = Para ti los aplausos, para ti los honores,
      trine qui regnas Deus, et corónas = Dios que reinas trino y que concedes
      áureas servo tríbuis fidéli = coronas de oro al siervo fiel
      omne per ævum. = por toda la eternidad.
  caelitum-ioseph-decus-atque-nostrae:
    titulo: Cǽlitum, Ioseph, decus atque nostræ
    amen: true
    estrofas:
    - |-
      Cǽlitum, Ioseph, decus atque nostræ = José, honra de los del cielo y esperanza
      certa spes vitæ columénque mundi, = cierta de nuestra vida y columna del mundo,
      quas tibi læti cánimus, benígnus = recibe benigno las alabanzas
      súscipe laudes. = que te cantamos alegres.
    - |-
      Te, satum David, státuit Creátor = A ti, hijo de David, el Creador te estableció
      Vírginis sponsum, voluítque Verbi = como esposo de la Virgen, y quiso que fueras llamado
      te patrem dici, dedit et minístrum = padre del Verbo, y te concedió ser
      esse salútis. = ministro de la salvación.
    - |-
      Tu Redemptórem stábulo iacéntem, = Tú contemplas gozoso al Redentor, que yace en el establo,
      quem chorus vatum cécinit futúrum, = el que el coro de los profetas cantó que vendría,
      áspicis gaudens, sociúsque matris = y, compañero de la madre, lo adoras
      primus adóras. = el primero.
    - |-
      Rex Deus regum, dominátor orbis, = Dios, Rey de reyes, señor del orbe,
      cuius ad nutum tremit inferórum = a cuya señal tiembla la turba
      turba, cui pronus famulátur æther, = de los infiernos, a quien sirve postrado el cielo,
      se tibi subdit. = se te somete.
    - |-
      Laus sit excélsæ Tríadi perénnis, = Alabanza perenne a la excelsa Tríada,
      quæ, tibi insígnes tríbuens honóres, = que, concediéndote honores insignes,
      det tuis nobis méritis beátæ = nos dé, por tus méritos, los gozos
      gáudia vitæ. = de la vida dichosa.
  agnoscat-omne-saeculum:
    titulo: Agnóscat omne sǽculum
    amen: true
    estrofas:
    - |-
      Agnóscat omne sǽculum = Reconozca todo el mundo
      venísse vitæ prǽmium; = que ha llegado el premio de la vida;
      post hostis ásperi iugum = tras el yugo del cruel enemigo
      appáruit redémptio. = ha aparecido la redención.
    - |-
      Isaías quæ prǽcinit = Lo que Isaías predijo
      compléta sunt in Vírgine; = se ha cumplido en la Virgen;
      annuntiávit Ángelus, = el Ángel lo anunció,
      Sanctus replévit Spíritus. = el Espíritu Santo la llenó.
    - |-
      María ventre cóncipit = María concibe en su seno
      verbi fidélis sémine; = por la semilla de la palabra fiel;
      quem totus orbis non capit, = al que el orbe entero no puede contener
      portant puéllæ víscera. = lo llevan las entrañas de una doncella.
    - |-
      Adam vetus quod pólluit, = Lo que el viejo Adán manchó
      Adam novus hoc ábluit; = lo lava el nuevo Adán;
      tumens quod ille déicit, = lo que aquel, soberbio, derribó,
      humíllimus hic érigit. = este, humildísimo, lo levanta.
    - |-
      Christo sit omnis glória, = A Cristo sea toda la gloria,
      Dei Paréntis Fílio, = Hijo de Dios Padre,
      quem Virgo felix cóncipit = a quien la feliz Virgen concibe
      Sancti sub umbra Spíritus. = bajo la sombra del Espíritu Santo.
  iam-caeca-vis-mortalium:
    titulo: Iam cæca vis mortálium
    amen: true
    estrofas:
    - |-
      Iam cæca vis mortálium = En otro tiempo la ciega multitud de los mortales,
      vénerans inánes nǽnias, = venerando vanas fábulas,
      vel æra vel saxa álgida = creía que eran Dios el bronce,
      vel ligna credébat Deum. = las piedras frías o los leños.
    - |-
      Hæc dum sequúntur pérfidi, = Mientras los infieles seguían esto,
      prædónis in ius vénerant = habían caído bajo el dominio del ladrón
      et mancipátam fúmido = y habían sumergido la vida, esclavizada,
      vitam baráthro immérserant. = en el abismo humeante.
    - |-
      Stragem sed istam non tulit = Pero Cristo no soportó esta ruina
      Christus cadéntum géntium; = de las naciones que caían;
      impúne ne forsan sui = para que no pereciera impunemente
      Patris períret fábrica, = la obra de su Padre,
    - |-
      Mortále corpus índuit = se vistió de un cuerpo mortal
      ut, excitáto córpore, = para que, resucitado el cuerpo,
      mortis caténam frángeret = rompiera la cadena de la muerte
      hominémque portáret Patri. = y llevara al hombre al Padre.
    - |-
      Hic ille natális dies, = Este es aquel día natal
      quo te Creátor árduus = en que el Creador altísimo
      spirávit et limo índidit, = te infundió el soplo y te puso en el barro,
      Sermóne carnem glútinans. = uniendo la carne a la Palabra.
    - |-
      O quanta rerum gáudia = ¡Oh cuántos gozos del universo
      alvus pudíca cóntinet, = contiene el seno pudoroso
      ex qua novéllum sǽculum = del que procede un mundo nuevo
      procédit et lux áurea! = y la luz de oro!
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-lux-salutis-nuntia:
    titulo: O lux, salútis núntia
    amen: true
    estrofas:
    - |-
      O lux, salútis núntia, = Oh luz, mensajera de la salvación,
      qua Vírgini fert Ángelus = en la que el Ángel lleva a la Virgen
      complénda mox orácula = oráculos que pronto se cumplirán
      et cara terris gáudia. = y gozos queridos para la tierra.
    - |-
      Qui Patris ætérno sinu = El que, Hijo eterno, nace
      ætérna Proles náscitur, = del seno eterno del Padre,
      obnóxius fit témpori = se somete al tiempo
      matrémque in orbe séligit. = y elige una madre en el mundo.
    - |-
      Nobis piándis víctima = Víctima para expiar por nosotros,
      nostros se in artus cólligit, = se recoge en nuestros miembros,
      ut innocénti sánguine = para lavar con sangre inocente
      scelus nocéntum díluat. = el crimen de los culpables.
    - |-
      Concépta carne Véritas, = Verdad concebida en la carne,
      umbráta velo Vírginis, = cubierta por el velo de la Virgen,
      puris vidénda méntibus, = que han de ver las mentes puras,
      imple tuo nos lúmine. = llénanos de tu luz.
    - |-
      Et quæ modésto péctore = Y tú, que con pecho modesto
      te dicis ancíllam Dei, = te llamas esclava de Dios,
      regína nunc cæléstium, = ahora reina de los del cielo,
      patróna sis fidélium. = sé patrona de los fieles.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-vir-beate-apostolis:
    titulo: O vir beáte, Apóstolis
    amen: true
    estrofas:
    - |-
      O vir beáte, Apóstolis = Oh varón dichoso, compañero diligente
      comes labórum sédule = de los Apóstoles en los trabajos
      adiútor atque múneris, = y ayudante en su ministerio,
      laudes precésque súscipe. = recibe las alabanzas y las súplicas.
    - |-
      Christi per illos núntios = Por medio de aquellos mensajeros de Cristo
      exórta sunt lætíssima = nacieron los siglos alegrísimos
      et veritátis sǽcula = de la verdad
      et pacis atque gáudii. = y de la paz y del gozo.
    - |-
      Assúmptus et tu cǽlitus = Llamado tú también desde el cielo,
      ad tanta consors póndera, = partícipe de tan grandes cargas,
      compar nitéscis glória = brillas igual en la gloria
      potentiáque prómines. = y sobresales en el poder.
    - |-
      Tu, seminátor lúminis, = Tú, sembrador de la luz,
      fac sole Christi vívido = haz que con el sol vivo de Cristo
      virére ubíque gérmina = reverdezcan por todas partes los brotes
      cæli replénda ad hórrea. = para llenar los graneros del cielo.
    - |-
      Simúlque cum primóribus = Y, junto con los primeros,
      summo astitúrus Iúdici, = tú que estarás ante el Juez supremo,
      da nostra solvi débita, = concede que se perdonen nuestras deudas,
      nos da fovéri grátia. = concede que seamos amparados por la gracia.
    - |-
      Christo sit omnis glória = A Cristo sea toda la gloria,
      cum Patre et almo Spíritu = con el Padre y el Espíritu bondadoso,
      quorum beáti lúmine, = en cuya luz, dichosos,
      simul fruémur gáudiis. = gozaremos juntos de los gozos.
  mentibus-laetis-tua-festa-marce:
    titulo: Méntibus lætis tua festa, Marce
    amen: true
    estrofas:
    - |-
      Méntibus lætis tua festa, Marce, = Con mentes alegres y muy agradecidas
      atque pergrátis celebrámus omnes, = celebramos todos tu fiesta, Marcos,
      magna qui Christi tribuísse plebi = recordando que diste grandes cosas
      te memorámus. = al pueblo de Cristo.
    - |-
      Matris exémplis, vénerans amóre = Por el ejemplo de tu madre, venerando con amor
      férvido Petrum, séqueris fidélis, = ferviente a Pedro, lo sigues fiel,
      verba de Christi lábiis ab ipso = y guardas las palabras de Cristo
      hausta recóndis. = bebidas de sus mismos labios.
    - |-
      Spíritu accénsus, módico libéllo = Encendido por el Espíritu, en un pequeño libro
      mira tu summi réseras Magístri = revelas tú los hechos admirables del sumo Maestro,
      gesta, tu narras quibus et loquélis = tú cuentas con qué palabras
      ínstruat orbem. = instruye al orbe.
    - |-
      Carus et Paulo, studiósus eius = Querido también por Pablo, deseoso de imitar
      cordis ardóres ímitans, labóras, = los ardores de su corazón, trabajas,
      multa pro Iesu páteris, cruórem = padeces muchas cosas por Jesús,
      fundis amánter. = derramas con amor tu sangre.
    - |-
      Laus, honor Christo, decus atque virtus, = Alabanza, honor a Cristo, honra y poder,
      cuius et testes valeámus esse, = de quien podamos ser también testigos,
      ac, tuis escis recreáti, in ævum = y, repuestos con tus alimentos, contemplar
      cérnere vultum. = por siempre su rostro.
  gaude-fidelis-concio:
    titulo: Gaude, fidélis cóncio
    amen: true
    estrofas:
    - |-
      Gaude, fidélis cóncio, = Alégrate, asamblea fiel,
      et bénedic Altíssimo = y bendice al Altísimo
      in die hac lætítiæ, = en este día de alegría,
      qua confert dona grátiæ. = en que concede los dones de la gracia.
    - |-
      Nam doctor hic sanctíssimus, = Pues este santísimo doctor,
      cuius nunc festum cólimus, = cuya fiesta celebramos ahora,
      lumen fuit in pópulo = fue luz en el pueblo,
      exémplar toti sǽculo. = ejemplo para todo el mundo.
    - |-
      Inténde, doctor, précibus = Atiende, doctor, a las súplicas
      quas actu ad te fúndimus; = que de hecho derramamos ante ti;
      stantes ne cadant róbora, = que los fuertes que están de pie no caigan;
      lapsos ut surgant ádiuva. = ayuda a los caídos a levantarse.
    - |-
      Erróris pelle núbilum = Aleja la nube del error
      per lucis tuæ rádium; = por el rayo de tu luz;
      fac Deum semper cólere = haz que adoremos siempre a Dios
      et spem in ipsum pónere. = y pongamos en él la esperanza.
    - |-
      Laus Trinitáti débita, = A la Trinidad, la alabanza debida,
      honor, potéstas, glória, = el honor, el poder, la gloria,
      quæ sua ex cleméntia = que por su clemencia
      præstat salútis prǽmia. = concede los premios de la salvación.
  virgo-prudentum-comitata-coetum:
    titulo: Virgo prudéntum comitáta cœtum
    amen: true
    estrofas:
    - |-
      Virgo prudéntum comitáta cœtum = La virgen, acompañada por el grupo de las prudentes,
      óbviam sponso véniens paráta, = saliendo preparada al encuentro del esposo,
      noctis horréndæ rémovet ténebras = aparta las tinieblas de la noche horrenda
      lámpade pura. = con la lámpara pura.
    - |-
      Ille fulgéntem nítidis lapíllis = Él le dio un anillo de belleza admirable,
      ánulum miri tríbuit decóris = brillante de piedras relucientes,
      vírgini dicens: «Tibi trado sancti = diciendo a la virgen: «Te entrego la prenda
      pignus amóris». = de un amor santo».
    - |-
      Mota flagrántis stímulo calóris = Movida por el aguijón de un ardor ardiente,
      mentis excéssu rápitur frequénti, = es arrebatada a menudo en éxtasis de la mente,
      fixa dum portat Catharína membris = mientras Catalina lleva clavadas en sus miembros
      vúlnera Christi. = las heridas de Cristo.
    - |-
      Unde ter felix quater et beáta = Por eso, tres veces feliz y cuatro veces dichosa,
      in sinu sponsi requiévit almi, = descansó en el seno del esposo bondadoso,
      inter illústres ánimas reláta = contada entre las almas ilustres,
      lux nova cæli. = luz nueva del cielo.
    - |-
      Sit Deus cæli résidens in arce, = Sea bendito Dios, que reside en el alcázar del cielo,
      trinus et simplex benedíctus ille, = trino y simple,
      qui potens totum stábili gubérnat = que, poderoso, gobierna todo el mundo
      órdine mundum. = con orden estable.
  te-catharina-maximis:
    titulo: Te, Catharína, máximis
    amen: true
    estrofas:
    - |-
      Te, Catharína, máximis = A ti, Catalina, con las más grandes
      nunc venerámur láudibus, = alabanzas te veneramos ahora,
      cunctæ lumen Ecclésiæ, = luz de toda la Iglesia,
      sertis ornáta plúrimis. = adornada con muchísimas coronas.
    - |-
      Magnis aucta virtútibus = Enriquecida con grandes virtudes
      et vita florens ínclita, = y floreciente con una vida ínclita,
      húmili mente ac strénua = con mente humilde y esforzada
      per crucis pergis trámitem. = avanzas por el camino de la cruz.
    - |-
      Stella vidéris pópulis = Te ven los pueblos como estrella,
      salúbris pacis núntia; = mensajera de la paz saludable;
      mores restáuras óptimos, = restauras las buenas costumbres,
      feróces mulces ánimos. = apaciguas los ánimos feroces.
    - |-
      Sancto compúlsa Spíritu, = Impulsada por el Espíritu Santo,
      igníta verba lóqueris, = dices palabras de fuego
      quæ lucem sapiéntiæ, = que infunden la luz de la sabiduría
      æstus amóris íngerunt. = y los ardores del amor.
    - |-
      Tuis confísos précibus, = A nosotros, que confiamos en tus súplicas,
      virgo dilécta Dómino, = virgen amada del Señor,
      nos caritáte cóncitos = movidos por la caridad,
      fac Sponsi regna quǽrere. = haznos buscar el reino del Esposo.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  te-pater-ioseph-opifex-colende:
    titulo: Te, pater Ioseph, ópifex colénde
    amen: true
    estrofas:
    - |-
      Te, pater Ioseph, ópifex colénde, = A ti, padre José, artesano venerable,
      Názaræ felix látitans in umbra, = feliz, escondido en la sombra de Nazaret,
      vócibus lætis humilíque cuncti = cantemos todos con voces alegres
      corde canámus. = y corazón humilde.
    - |-
      Régiam stirpem tenuémque victum = La estirpe real y el pobre sustento
      mente fers æqua tacitúsque portas, = llevas con ánimo igual y los cargas en silencio,
      sacra dum multo mánuum labóre = mientras con mucho trabajo de las manos
      pígnora nutris. = alimentas a las prendas sagradas.
    - |-
      O faber, sanctum spéculum fabrórum, = Oh artesano, santo espejo de los artesanos,
      quanta das plebi documénta vitæ, = ¡cuántas enseñanzas de vida das al pueblo,
      ut labor sudans ut et officína = para que el trabajo sudoroso y el taller
      sanctificétur. = sean santificados!
    - |-
      Qui carent escis, míseros fovéto; = Ampara a los desdichados que carecen de alimento;
      témpera effrénos perimásque lites; = modera a los desenfrenados y suprime las discordias;
      mýsticus Christus pátriæ sub umbræ = que el Cristo místico crezca bajo el amparo
      tégmine crescat. = de la sombra paterna.
    - |-
      Qui Deus trinus simul unus exstas, = Dios que existes trino y a la vez uno,
      qui pater cunctis opiféxque rerum, = padre de todos y artífice de las cosas,
      fac patrem Ioseph imitémur actu, = haz que imitemos al padre José en la acción,
      morte imitémur. = que lo imitemos en la muerte.
  aurora-solis-nuntia:
    titulo: Auróra solis núntia
    amen: true
    estrofas:
    - |-
      Auróra solis núntia, = La aurora, mensajera del sol,
      mundi labóres éxcitans, = que despierta los trabajos del mundo,
      fabri sonóram málleo = saluda la casa de Nazaret,
      domum salútat Názaræ. = sonora por el martillo del artesano.
    - |-
      Salve, caput domésticum, = Salve, cabeza de la casa,
      sub quo supérnus Artifex, = bajo quien el Artífice de lo alto,
      sudóre salso róridus, = húmedo de sudor salado,
      exércet artem pátriam. = ejerce el oficio paterno.
    - |-
      Altis locátus sédibus = Colocado en las altas moradas
      celsǽque Sponsæ próximus, = y muy cerca de la Esposa excelsa,
      adésto nunc cliéntibus, = asiste ahora a tus protegidos,
      quos vexat indigéntia. = a quienes aflige la necesidad.
    - |-
      Absíntque vis et iúrgia, = Que se alejen la violencia y las riñas,
      fraus omnis a mercédibus, = todo fraude de los salarios;
      victus cibíque cópiam = que la sola sobriedad mida
      mensúret una párcitas. = la abundancia del sustento y la comida.
    - |-
      Sit Trinitáti glória, = Gloria sea a la Trinidad,
      quæ, te precánte, iúgiter = que, rogando tú, dirija siempre
      in pace nostros ómnium = en paz los pasos
      gressus viámque dírigat. = y el camino de todos nosotros.
  philippe-summae-honoribus:
    titulo: Philíppe, summæ honóribus
    amen: true
    estrofas:
    - |-
      Philíppe, summæ honóribus = Felipe, que brillas con los honores
      vocatiónis énitens, = de la más alta vocación,
      cum cive Petro príncipe = ¡con qué ánimo amas a Cristo
      qua mente Christum díligis! = junto con tu conciudadano, el príncipe Pedro!
    - |-
      At ipse amóris íntima = Y él te devuelve
      tibi repéndit pígnora, = las prendas más íntimas del amor,
      tibíque Patris dísserit = y te explica las enseñanzas
      suǽque vitæ dógmata. = del Padre y de su vida.
    - |-
      Nec te minus compléctitur, = Y no menos te abraza
      Iacóbe, Christi cáritas, = a ti, Santiago, la caridad de Cristo,
      qui frater eius díceris = que eres llamado su hermano,
      sed et colúmna Ecclésiæ. = pero también columna de la Iglesia.
    - |-
      Almæ Sion qui prǽsides = Tú que, el primero, presides en la bondadosa Sion
      primus gregi claríssimo, = el rebaño ilustrísimo,
      nos usque scriptis próvidis = nos enseñas siempre con tus escritos previsores
      verbum salútis édoces. = la palabra de la salvación.
    - |-
      O vos, beáti, nóbili = Oh vosotros, dichosos, que confesasteis
      Iesum proféssi sánguine, = a Jesús con vuestra noble sangre,
      spe nos fidéque cúrrere = concedednos correr con esperanza y fe
      date in supérnam pátriam, = hacia la patria de lo alto,
    - |-
      Ut, quando mansiónibus = para que, cuando ya habitemos
      iam Patris immorábimur, = en las moradas del Padre,
      simul canámus pérpetim = cantemos juntos por siempre
      in Trinitátis glóriam. = para gloria de la Trinidad.
  matthia-sacratissimo:
    titulo: Matthía, sacratíssimo
    amen: true
    estrofas:
    - |-
      Matthía, sacratíssimo = Matías, ¡con qué admirable designio
      Apostolórum cœ́tui = fuiste agregado divinamente
      quam miro tu consílio = al sacratísimo grupo
      ascríptus es divínitus! = de los Apóstoles!
    - |-
      Abscésserat discípulus, = Se había apartado el discípulo,
      tristi miser suspéndio = desdichado, por la triste horca,
      magni gradum fastígii = negando el grado de la gran dignidad
      Christíque amórem dénegans. = y el amor de Cristo.
    - |-
      En Christi te diléctio = He aquí que el amor de Cristo
      ad eius transfert glóriam, = te traslada a su gloria,
      Petri movénte lábia = moviendo el Espíritu Santo
      sortésque Sancto Spíritu. = los labios de Pedro y las suertes.
    - |-
      Tanto dicátus múneri, = Consagrado a tan gran ministerio,
      lucem revélas géntibus = revelas la luz a las naciones
      ad mortem usque, strénuus = hasta la muerte, esforzado,
      Iesum conféssus sánguine. = confesando a Jesús con tu sangre.
    - |-
      Da nos, beáte Apóstole, = Concédenos, bienaventurado Apóstol,
      lætis promptísque córdibus = seguir con corazones alegres y dispuestos
      almus quascúmque Spíritus = todos los caminos que el Espíritu
      vias demónstrat, pérsequi. = bondadoso nos muestra.
    - |-
      Sit Trinitáti glória, = Gloria sea a la Trinidad,
      quæ nobis ad cæléstia = que nos conceda por ti subir
      per te concédat scándere = a lo celestial
      hymnósque ætérnos dícere. = y cantar himnos eternos.
  veni-praecelsa-domina:
    titulo: Veni, præcélsa Dómina
    amen: true
    estrofas:
    - |-
      Veni, præcélsa Dómina; = Ven, Señora excelsa;
      María, tu nos vísita, = María, visítanos tú,
      quæ iam cognátæ dómui = que a la casa de tu parienta
      tantum portásti gáudii. = llevaste tan gran gozo.
    - |-
      Veni, iuvámen sǽculi, = Ven, auxilio del mundo,
      sordes aufer piáculi, = quita las manchas del pecado
      ac visitándo pópulum = y, visitando al pueblo,
      pœnæ tolle perículum. = aparta el peligro del castigo.
    - |-
      Veni, stella, lux márium, = Ven, estrella, luz de los mares,
      infúnde pacis rádium; = derrama el rayo de la paz;
      rege quodcúmque dévium, = gobierna todo lo extraviado,
      da vitam innocéntium. = da la vida de los inocentes.
    - |-
      Veni, precámur, vísites = Ven, te pedimos, visítanos
      nobísque vires róbores = y fortalece nuestras fuerzas
      virtúte sacri ímpetus, = con el poder del impulso sagrado,
      ne fluctuétur ánimus. = para que el ánimo no vacile.
    - |-
      Veni, virga regálium, = Ven, vara de los reyes,
      reduc fluctus errántium = trae de vuelta las olas de los que yerran
      ad unitátem fídei, = a la unidad de la fe,
      in qua salvántur cǽlici. = en la que se salvan los del cielo.
    - |-
      Veni, tecúmque Fílium = Ven, y contigo alabemos
      laudémus in perpétuum, = para siempre a tu Hijo,
      cum Patre et Sancto Spíritu, = con el Padre y el Espíritu Santo,
      qui nobis dent auxílium. = que nos den su auxilio.
  veniens-mater-inclita:
    titulo: Véniens, mater ínclita
    amen: true
    estrofas:
    - |-
      Véniens, mater ínclita, = Viniendo, madre ínclita,
      cum Sancti dono Spíritus, = con el don del Espíritu Santo,
      nos ut Ioánnem vísita = visítanos como a Juan
      in huius carnis sédibus. = en las moradas de esta carne.
    - |-
      Procéde, portans párvulum, = Avanza llevando al niño,
      ut mundus possit crédere = para que el mundo pueda creer
      et tuæ laudis títulum = y todos sepan ensalzar
      omnes sciant extóllere. = el título de tu alabanza.
    - |-
      Salúta nunc Ecclésiam, = Saluda ahora a la Iglesia,
      ut tuam vocem áudiens = para que, oyendo tu voz,
      exsúrgat in lætítia, = se levante con alegría,
      advéntum Christi séntiens. = sintiendo la llegada de Cristo.
    - |-
      María, levans óculos, = María, levantando los ojos,
      vide credéntes pópulos: = mira a los pueblos creyentes:
      te quærunt piis méntibus, = te buscan con mentes piadosas;
      his opem feres ómnibus. = darás ayuda a todos ellos.
    - |-
      O veræ spes lætítiæ, = Oh esperanza de la verdadera alegría,
      nostræ portus misériæ, = puerto de nuestra miseria,
      nos iunge cæli cúriæ = únenos a la corte del cielo,
      ornátos stola glóriæ. = adornados con la vestidura de la gloria.
    - |-
      Tecum, Virgo, magníficat = Contigo, Virgen, nuestra alma
      ánima nostra Dóminum, = engrandece al Señor,
      qui laude te nobílitat = que te ennoblece con la alabanza
      et hóminum et cǽlitum. = de los hombres y de los del cielo.
  concito-gressu-petis-alta-montis:
    titulo: Cóncito gressu petis alta montis
    amen: true
    estrofas:
    - |-
      Cóncito gressu petis alta montis, = Con paso apresurado buscas las alturas del monte,
      Virgo, quam matrem Deus ipse fecit, = Virgen, a quien Dios mismo hizo su madre,
      ut seni matri studiósi amóris = para ofrecer a una madre anciana prendas
      pígnora promas. = de amor solícito.
    - |-
      Cum salutántis capit illa vocem, = Cuando ella recibe la voz del saludo,
      ábditus gestit puer exsilíre, = el niño escondido se agita por saltar;
      te parens dicit dóminam, salútat = la madre te llama señora, te saluda
      teque beátam. = y te llama dichosa.
    - |-
      Ipsa prædícis fore te beátam = Tú misma predices que serás dichosa,
      Spíritu fervens pénitus loquénte, = ferviente, hablando el Espíritu en lo hondo,
      ac Deum cantu célebras amœ́no = y celebras con canto ameno a Dios,
      magna operántem. = que obra grandes cosas.
    - |-
      Teque felícem pópuli per orbem = Y los pueblos por el orbe te proclaman
      semper, o mater, récitant ovántes = siempre feliz, oh madre, con júbilo,
      atque te credunt Dómini favórum = y creen que eres ministra
      esse minístram. = de los favores del Señor.
    - |-
      Quæ, ferens Christum, nova semper affers = Tú, que, llevando a Cristo, traes siempre nuevos
      dona, tu nobis fer opes salútis, = dones, tráenos a nosotros riquezas de salvación,
      qui pie tecum Tríadem supérnam = a nosotros, que contigo engrandecemos piadosamente
      magnificámus. = a la Tríada de lo alto.
  barnabae-clarum-colimus-tropaeum:
    titulo: Bárnabæ clarum cólimus tropǽum
    amen: true
    estrofas:
    - |-
      Bárnabæ clarum cólimus tropǽum, = Celebramos el ilustre trofeo de Bernabé,
      quo micat celsus mérita coróna, = en el que brilla excelso por la corona merecida,
      multa pro Christi veheménter usque = tras haber padecido mucho y con vehemencia
      passus honóre. = por la honra de Cristo.
    - |-
      Abdicans agro, generósus urget = Renunciando a su campo, generoso, se empeña
      ut, fide vivax ope caritátis, = en que, vivo por la fe y por la ayuda de la caridad,
      nóminis plebes nova christiáni = el pueblo nuevo del nombre cristiano
      læta viréscat. = reverdezca alegre.
    - |-
      Quam libens noscit, petit atque defert = ¡Con qué gusto conoce, busca y presenta
      máximum Paulum, sócio labóre = al grandísimo Pablo, y, con trabajo compartido,
      Spíritus nutu péragrans fidélis = recorre fiel, por indicación del Espíritu,
      lítora multa! = muchas costas!
    - |-
      Nil sibi parcit cupidúsque Christo = No se ahorra nada y, deseoso de Cristo,
      plúrimos affert, bonus atque pascit, = le trae muchísimos y, bueno, los apacienta,
      donec effúso rútila probátur = hasta que, derramada su sangre, se prueba
      sánguine palma. = la palma brillante.
    - |-
      Da, Deus, tanto fámulo rogánte, = Concédenos, Dios, por el ruego de tan gran siervo,
      nos sequi fortes iter ad salútem, = seguir fuertes el camino de la salvación,
      ut domo ætérna tibi concinámus = para cantarte en la casa eterna
      cántica laudis. = cánticos de alabanza.
  ut-queant-laxis-resonare-fibris:
    titulo: Ut queant laxis resonáre fibris
    amen: true
    estrofas:
    - |-
      Ut queant laxis resonáre fibris = Para que tus siervos puedan cantar
      mira gestórum fámuli tuórum, = con cuerdas sueltas las maravillas de tus hechos,
      solve pollúti lábii reátum, = quita la culpa del labio manchado,
      sancte Ioánnes. = san Juan.
    - |-
      Núntius cælo véniens suprémo, = Un mensajero venido del cielo supremo
      te patri magnum fore nascitúrum, = anuncia en orden a tu padre que nacerás grande,
      nomen et vitæ sériem geréndæ = y tu nombre y la serie
      órdine promit. = de la vida que llevarías.
    - |-
      Ille promíssi dúbius supérni = Él, dudando de la promesa de lo alto,
      pérdidit promptæ módulos loquélæ; = perdió los acentos de la palabra pronta;
      sed reformásti génitus perémptæ = pero tú, al nacer, rehiciste los órganos
      órgana vocis. = de la voz perdida.
    - |-
      Ventris obstrúso pósitus cubíli = Puesto en el escondido lecho del vientre,
      sénseras regem thálamo manéntem; = habías sentido al rey que permanecía en su cámara;
      hinc parens nati méritis utérque = por eso ambas madres, por los méritos de sus hijos,
      ábdita pandit. = revelan lo oculto.
    - |-
      Láudibus cives célebrant supérni = Los ciudadanos de lo alto te celebran con alabanzas,
      te, Deus simplex paritérque trine; = Dios simple y a la vez trino;
      súpplices ac nos véniam precámur: = también nosotros, suplicantes, pedimos perdón:
      parce redémptis. = perdona a los redimidos.
  antra-deserti-teneris-sub-annis:
    titulo: Antra desérti téneris sub annis
    amen: true
    estrofas:
    - |-
      Antra desérti téneris sub annis, = En tus tiernos años buscaste las cuevas del desierto,
      cívium turmas fúgiens, petísti, = huyendo de las multitudes de los ciudadanos,
      ne levi saltem maculáre vitam = para no poder manchar tu vida
      fámine posses. = ni siquiera con una palabra ligera.
    - |-
      Prǽbuit hirtum tégimen camélus = El camello dio un vestido áspero
      ártubus sacris, stróphium bidéntes, = a tus miembros sagrados, las ovejas un cinturón,
      cui latex haustum, sociáta pastum = el agua la bebida, y la miel junto
      mella locústis. = con las langostas el alimento.
    - |-
      Céteri tantum cecinére vatum = Los demás profetas solo cantaron,
      corde præságo iubar affutúrum; = con corazón presago, el resplandor que vendría;
      tu quidem mundi scelus auferéntem = tú, en cambio, señalas con el dedo
      índice prodis. = al que quita el pecado del mundo.
    - |-
      Non fuit vasti spátium per orbis = No hubo en el espacio del vasto orbe
      sánctior quisquam génitus Ioánne, = nadie nacido más santo que Juan,
      qui nefas sæcli méruit lavántem = que mereció bañar en las aguas
      tíngere lymphis. = al que lava el pecado del mundo.
    - |-
      Láudibus cives célebrant supérni = Los ciudadanos de lo alto te celebran con alabanzas,
      te, Deus simplex paritérque trine; = Dios simple y a la vez trino;
      súpplices ac nos véniam precámur: = también nosotros, suplicantes, pedimos perdón:
      parce redémptis. = perdona a los redimidos.
  o-nimis-felix-meritique-celsi:
    titulo: O nimis felix meritíque celsi
    amen: true
    estrofas:
    - |-
      O nimis felix meritíque celsi, = Oh muy feliz y de mérito excelso,
      nésciens labem nívei pudóris, = que no conociste mancha en tu pureza de nieve,
      prǽpotens martyr eremíque cultor, = poderoso mártir y habitante del desierto,
      máxime vatum. = el mayor de los profetas.
    - |-
      Nunc potens nostri méritis opímis = Ahora, poderoso por tus ricos méritos,
      péctoris duros lápides repélle, = aparta las piedras duras de nuestro pecho,
      ásperum planans iter, et refléxos = allanando el camino áspero, y endereza
      dírige calles, = los senderos torcidos,
    - |-
      Ut pius mundi sator et redémptor, = para que el piadoso creador y redentor del mundo,
      méntibus pulsa mácula polítis, = quitada la mancha de las mentes pulidas,
      rite dignétur véniens sacrátos = se digne, al venir, poner como corresponde
      pónere gressus. = sus pasos sagrados.
    - |-
      Láudibus cives célebrant supérni = Los ciudadanos de lo alto te celebran con alabanzas,
      te, Deus simplex paritérque trine; = Dios simple y a la vez trino;
      súpplices ac nos véniam precámur: = también nosotros, suplicantes, pedimos perdón:
      parce redémptis. = perdona a los redimidos.
  aurea-luce-et-decore-roseo:
    titulo: Aurea luce et decóre róseo
    amen: true
    estrofas:
    - |-
      Aurea luce et decóre róseo, = Con luz de oro y belleza de rosa,
      lux lucis, omne perfudísti sǽculum, = luz de la luz, inundaste todo el mundo,
      décorans cælos ínclito martýrio = adornando los cielos con un martirio ínclito
      hac sacra die, quæ dat reis véniam. = en este día sagrado, que da a los culpables el perdón.
    - |-
      Iánitor cæli, doctor orbis páriter, = El portero del cielo y a la vez el doctor del orbe,
      iúdices sæcli, vera mundi lúmina, = jueces del mundo, verdaderas luces del mundo,
      per crucem alter, alter ense triúmphans, = triunfando uno por la cruz, otro por la espada,
      vitæ senátum laureáti póssident. = poseen coronados el senado de la vida.
    - |-
      O Roma felix, quæ tantórum príncipum = ¡Oh Roma feliz, que fuiste teñida de púrpura
      es purpuráta pretióso sánguine, = con la sangre preciosa de tan grandes príncipes!
      non laude tua, sed ipsórum méritis = No por tu alabanza, sino por los méritos de ellos,
      excéllis omnem mundi pulchritúdinem. = superas toda la belleza del mundo.
    - |-
      Olívæ binæ pietátis únicæ, = Olivos gemelos de una piedad única,
      fide devótos, spe robústos máxime, = a los devotos en la fe, robustos sobre todo en la esperanza,
      fonte replétos caritátis géminæ = llenos de la fuente de una doble caridad,
      post mortem carnis impetráte vívere. = alcanzadles vivir después de la muerte de la carne.
    - |-
      Sit Trinitáti sempitérna glória, = Sea a la Trinidad la gloria sempiterna,
      honor, potéstas atque iubilátio, = el honor, el poder y el júbilo,
      in unitáte, cui manet impérium = en la unidad, a la que pertenece el imperio
      ex tunc et modo per ætérna sǽcula. = desde entonces y ahora por los siglos eternos.
  felix-per-omnes-festum-mundi-cardines:
    titulo: Felix per omnes festum mundi cárdines
    amen: true
    estrofas:
    - |-
      Felix per omnes festum mundi cárdines = Feliz, por todos los confines del mundo,
      apostolórum præpóllet alácriter, = sobresale alegremente la fiesta de los apóstoles,
      Petri beáti, Pauli sacratíssimi, = del bienaventurado Pedro, del sacratísimo Pablo,
      quos Christus almo consecrávit sánguine, = a quienes Cristo consagró con su sangre bondadosa
      ecclesiárum deputávit príncipes. = y designó príncipes de las iglesias.
    - |-
      Hi sunt olívæ duæ coram Dómino = Estos son los dos olivos ante el Señor
      et candelábra luce radiántia, = y los candelabros radiantes de luz,
      præclára cæli duo luminária; = las dos preclaras lumbreras del cielo;
      fórtia solvunt peccatórum víncula = desatan las fuertes cadenas de los pecados
      portásque cæli réserant fidélibus. = y abren a los fieles las puertas del cielo.
    - |-
      Glória Patri per imménsa sǽcula, = Gloria al Padre por los siglos inmensos,
      sit tibi, Nate, decus et impérium, = a ti, Hijo, sea la honra y el imperio,
      honor, potéstas Sanctóque Spirítui; = el honor, el poder, y al Espíritu Santo;
      sit Trinitáti salus indivídua = sea a la Trinidad la salvación indivisa
      per infiníta sæculórum sǽcula. = por los siglos infinitos de los siglos.
  apostolorum-passio:
    titulo: Apostolórum pássio
    amen: true
    estrofas:
    - |-
      Apostolórum pássio = La pasión de los apóstoles
      diem sacrávit sǽculi, = consagró un día del año,
      Petri triúmphum nóbilem, = mostrando el noble triunfo de Pedro
      Pauli corónam prǽferens. = y la corona de Pablo.
    - |-
      Coniúnxit æquáles viros = Unió a varones iguales
      cruor triumphális necis; = la sangre de una muerte triunfal;
      Deum secútos prǽsulem = a los que siguieron a Dios como guía
      Christi coronávit fides. = los coronó la fe de Cristo.
    - |-
      Primus Petrus apóstolus; = El primero es el apóstol Pedro;
      nec Paulus impar grátia, = y Pablo, no inferior en la gracia,
      electiónis vas sacræ = vaso de sagrada elección,
      Petri adæquávit fidem. = igualó la fe de Pedro.
    - |-
      Verso crucis vestígio = Invertida la posición de la cruz,
      Simon, honórem dans Deo, = Simón, dando honor a Dios,
      suspénsus ascéndit, dati = sube colgado, sin olvidarse
      non ímmemor oráculi. = del oráculo recibido.
    - |-
      Hinc Roma celsum vérticem = Por eso Roma elevó
      devotiónis éxtulit, = su excelsa cumbre de devoción,
      fundáta tali sánguine = fundada con tal sangre
      et vate tanto nóbilis. = y noble por tan gran profeta.
    - |-
      Huc ire quis mundum putet, = ¿Quién pensaría que el mundo viene aquí
      concúrrere plebem poli: = y que acude el pueblo del cielo?:
      elécta géntium caput, = la cabeza elegida de las naciones,
      sedes magístri géntium. = la sede del maestro de las naciones.
    - |-
      Horum, Redémptor, quǽsumus, = Te pedimos, Redentor, que a tus siervos
      ut príncipum consórtio = que te suplican
      iungas precántes sérvulos = los unas a la compañía de estos príncipes
      in sempitérna sǽcula. = por los siglos sempiternos.
  o-roma-felix-quae-tantorum-principum:
    titulo: O Roma felix, quæ tantórum príncipum
    amen: true
    estrofas:
    - |-
      O Roma felix, quæ tantórum príncipum = ¡Oh Roma feliz, que fuiste teñida de púrpura
      es purpuráta pretióso sánguine! = con la sangre preciosa de tan grandes príncipes!
      Excéllis omnem mundi pulchritúdinem = Superas toda la belleza del mundo,
      non laude tua, sed sanctórum méritis, = no por tu alabanza, sino por los méritos de los santos,
      quos cruentátis iugulásti gládiis. = a quienes degollaste con espadas ensangrentadas.
    - |-
      Vos ergo modo, gloriósi mártyres, = Vosotros, pues, gloriosos mártires,
      Petre beáte, Paule, mundi lílium, = Pedro bienaventurado, Pablo, lirio del mundo,
      cæléstis aulæ triumpháles mílites, = soldados triunfantes del palacio celestial,
      précibus almis vestris nos ab ómnibus = con vuestras súplicas bondadosas
      muníte malis, ferte super ǽthera. = defendednos de todos los males, llevadnos sobre el cielo.
    - |-
      Glória Patri per imménsa sǽcula, = Gloria al Padre por los siglos inmensos,
      sit tibi, Nate, decus et impérium, = a ti, Hijo, sea la honra y el imperio,
      honor, potéstas Sanctóque Spirítui; = el honor, el poder, y al Espíritu Santo;
      sit Trinitáti salus indivídua = sea a la Trinidad la salvación indivisa
      per infiníta sæculórum sǽcula. = por los siglos infinitos de los siglos.
  qui-luce-splendes-ordinis:
    titulo: Qui luce splendes órdinis
    amen: true
    estrofas:
    - |-
      Qui luce splendes órdinis = Tú que resplandeces con la luz grandísima
      apostolórum máxima, = del orden de los apóstoles,
      Thoma, benígnus áccipe = Tomás, recibe benigno
      laudes tibi quas pángimus. = las alabanzas que te cantamos.
    - |-
      Te lúcidis in sédibus = Cristo te coloca por amor
      amóre Christus cóllocat; = en las moradas luminosas;
      amóre promptus éxpetis = pronto por amor, deseas
      tu pro Magístro cómmori. = morir con el Maestro.
    - |-
      Te torquet et diléctio = Te atormenta también el amor
      narrántibus cum frátribus = cuando los hermanos cuentan [lo sucedido]:
      vis certus esse, vísere, = quieres estar cierto, ver,
      palpáre Iesu vúlnera. = tocar las heridas de Jesús.
    - |-
      Quantóque cordis gáudio = ¡Y con cuánto gozo del corazón
      ipsum misértum cónspicis, = lo contemplas compadecido de ti,
      Deúmque dicis crédulus, = y lo llamas Dios, creyendo,
      fervóre adórans péctoris! = adorándolo con el fervor de tu pecho!
    - |-
      Nobísque qui non vídimus = Y para nosotros, que no hemos visto,
      per te fides fit ácrior, = por ti la fe se hace más viva,
      fit æstus et poténtior = y se hace más poderoso el ardor
      quo Christi amórem quǽrimus. = con que buscamos el amor de Cristo.
    - |-
      Christo sit omnis glória, = A Cristo sea toda la gloria,
      qui te rogánte prǽbeat = que, rogando tú, nos conceda
      nobis fide ambulántibus = a los que caminamos en la fe
      ipsum vidére pérpetim. = verlo a él para siempre.
  inter-aeternas-superum-coronas:
    titulo: Inter ætérnas súperum corónas
    amen: true
    estrofas:
    - |-
      Inter ætérnas súperum corónas, = Entre las coronas eternas de los del cielo,
      quas sacro partas cólimus triúmpho, = que, ganadas con triunfo sagrado, veneramos,
      émicas celsis méritis corúscus, = brillas resplandeciente por tus excelsos méritos,
      o Benedícte! = oh Benito.
    - |-
      Sancta te compsit púerum senéctus, = Una santa madurez te adornó de niño,
      nil sibi de te rápuit volúptas, = nada de ti arrebató el placer,
      áruit mundi tibi flos, ad alta = se secó para ti la flor del mundo,
      mente leváto. = elevada tu mente a lo alto.
    - |-
      Hinc fuga lapsus pátriam, paréntes = Por eso, huyendo, dejas la patria
      déseris, fervens némorum colónus; = y los padres, ferviente habitante de los bosques;
      inde conscríbis documénta vitæ = después escribes las hermosas enseñanzas
      pulchra beátæ. = de una vida dichosa.
    - |-
      Iam docens omnes pópulos subésse = Tú que enseñas ahora a todos los pueblos
      légibus tandem placitísque Christi, = a someterse al fin a las leyes y a los preceptos de Cristo,
      fac tuis cuncti précibus petámus = haz que con tus súplicas todos busquemos
      cǽlica semper. = siempre lo celestial.
    - |-
      Cláritas Patri genitǽque Proli, = Claridad al Padre y a la Prole engendrada,
      Flámini Sancto decus atque cultus, = al Espíritu Santo honra y culto,
      grátia quorum tibi tanta laudis = por cuya gracia brilla para ti
      glória lucet. = tan gran gloria de alabanza.
  legifer-prudens-venerande-doctor:
    titulo: Légifer prudens, veneránde doctor
    amen: true
    estrofas:
    - |-
      Légifer prudens, veneránde doctor, = Prudente legislador, venerable doctor,
      qui nites celsis méritis per orbem, = que brillas por el orbe con méritos excelsos,
      dénuo comple, Benedícte, mundum = llena de nuevo el mundo, Benito,
      lúmine Christi. = con la luz de Cristo.
    - |-
      Flóruit per te novus atque miro = Floreció por ti un orden nuevo,
      géntium nexu sociátus ordo; = asociado por un admirable vínculo de pueblos;
      iúribus sacris tua vox subégit = tu voz sometió dulcemente a todos
      dúlciter omnes. = a los derechos sagrados.
    - |-
      Líberos Iesu paritérque servos = Como discípulos de Jesús, libres y siervos por igual,
      régula magna statuísti alúmnos, = los estableciste con tu gran regla,
      quos amor fotus précibus revínxit = a quienes el amor, alimentado por las oraciones,
      et labor unus. = y un mismo trabajo unieron.
    - |-
      Iamque fratérne, duce te, labórent, = Y que ahora, guiados por ti, trabajen como hermanos,
      mútuo certent pópuli favóre, = rivalicen los pueblos en el favor mutuo,
      gáudeant pacis refovére semper = se alegren de reanimar siempre
      dona beátæ. = los dones de la paz dichosa.
    - |-
      Cláritas Patri genitǽque Proli, = Claridad al Padre y a la Prole engendrada,
      Flámini Sancto decus atque cultus, = al Espíritu Santo honra y culto,
      grátia quorum tibi tanta laudis = por cuya gracia brilla para ti
      glória lucet. = tan gran gloria de alabanza.
  magdalae-sidus-mulier-beata:
    titulo: Mágdalæ sidus, múlier beáta
    amen: true
    estrofas:
    - |-
      Mágdalæ sidus, múlier beáta, = Astro de Magdala, mujer dichosa,
      te pio cultu venerámur omnes, = todos te veneramos con piadoso culto,
      quam sibi Christus sociávit arcti = a quien Cristo se asoció
      fœ́dere amóris. = con un estrecho vínculo de amor.
    - |-
      Cum tibi illíus pátefit potéstas = Cuando se te manifiesta su poder,
      dǽmonum vires ábigens treménda, = que expulsa las fuerzas tremendas de los demonios,
      tu fide gaudes potióre necti = te alegras de unirte por una fe más firme,
      grata medénti. = agradecida, al que te sana.
    - |-
      Hæret hinc urgens tibi caritátis = Desde entonces te apremia la fuerza
      vis ut insístas pédibus Magístri, = de la caridad para que sigas los pasos del Maestro,
      férvidis illum comitáta semper = acompañándolo siempre, diligente,
      sédula curis. = con cuidados fervientes.
    - |-
      Tuque complóras Dóminum, crucíque = Y tú lloras al Señor, y estás junto a la cruz
      ímpetu flagrans pietátis astas; = ardiendo con el ímpetu de la piedad;
      membra tu terges studiósa et ungis = tú, solícita, limpias y unges los miembros
      danda sepúlcro. = que se han de dar al sepulcro.
    - |-
      Quos amor Christi péperit, triúmphis = A los que el amor de Cristo engendró, haznos
      nos fac adiúngi sócios per ævum, = unirnos a sus triunfos como compañeros por siempre,
      atque Dilécto simul affluénter = y cantar a la vez abundantemente
      pángere laudes. = alabanzas al Amado.
  aurora-surgit-lucida:
    titulo: Auróra surgit lúcida
    amen: true
    estrofas:
    - |-
      Auróra surgit lúcida = Surge la aurora luminosa,
      Christi triúmphos áfferens, = trayendo los triunfos de Cristo,
      cum corpus eius vísere, = cuando tú, María, quieres
      María, vis et úngere. = ver y ungir su cuerpo.
    - |-
      Anhéla curris; ángelus = Corres jadeante; pero he aquí
      at ecce lætus prǽdocet = que un ángel alegre te anuncia
      mortis refráctis póstibus = que, rotas las puertas de la muerte,
      redísse quem desíderas. = ha vuelto el que deseas.
    - |-
      Sed te manet iucúndius = Pero te espera un premio más grato
      intácti amóris prǽmium, = de tu amor intacto,
      cum, voce pulsans vílicum, = cuando, llamándolo con tu voz al hortelano,
      tuum Magístrum cónspicis. = ves a tu Maestro.
    - |-
      Quæ cum dolénti Vírgine = Tú, que con la Virgen dolorosa
      hæsísti acérbo stípiti, = estuviste junto al leño amargo,
      tu prima vivi ab ínferis = eres la primera testigo y mensajera
      es testis atque núntia. = del que vive, salido de los infiernos.
    - |-
      O flos venúste Mágdalæ, = Oh hermosa flor de Magdala,
      o Christi amóre sáucia, = oh herida por el amor de Cristo,
      tu caritátis ígnibus = haz que nuestros corazones ardan
      fac nostra corda férveant. = con los fuegos de la caridad.
    - |-
      Da, Christe, tantæ sérvulæ = Concede, Cristo, seguir el amor
      dilectiónem pérsequi, = de tan gran sierva,
      et nos ut in cæléstibus = para que también nosotros te cantemos
      tibi canámus glóriam. = la gloria en el cielo.
  te-nostra-laetis-laudibus:
    titulo: Te nostra lætis láudibus
    amen: true
    estrofas:
    - |-
      Te nostra lætis láudibus, = A ti, Santiago, te elevan nuestros cantos
      Iacóbe, tollunt cántica, = con alegres alabanzas,
      quem Christus arte ex rétium = a quien Cristo llevó del oficio de las redes
      ad tanta vexit cúlmina. = a tan grandes cumbres.
    - |-
      Ipso vocánte, cóncitus = Llamándote él, presuroso
      cum fratre linquis ómnia, = lo dejas todo con tu hermano,
      ipsíus et fis nóminis = y te haces heraldo ferviente
      verbíque præco férvidus. = de su nombre y de su palabra.
    - |-
      Testis poténtis déxteræ = Testigo preclaro de la diestra poderosa,
      præclárus alta cónspicis, = contemplas cosas altas:
      in monte celsam glóriam, = en el monte la excelsa gloria,
      tristes in horto angústias. = en el huerto las tristes angustias.
    - |-
      Qui promptus exstas, póscitur = Tú, que estás dispuesto cuando se pide
      cum passiónis póculum, = [beber] el cáliz de la pasión,
      tu primus ex apóstolis = eres el primero de los apóstoles
      pro Christi amóre plécteris. = en ser ejecutado por amor de Cristo.
    - |-
      Iesu fidélis ássecla = Fiel seguidor de Jesús
      satórque lucis cǽlicæ, = y sembrador de la luz del cielo,
      mentes fide claréscere, = concede que las mentes brillen por la fe
      da spe fovéri péctora. = y que los pechos sean animados por la esperanza.
    - |-
      Christi sequi da sédulos = Concédenos seguir diligentes
      præcépta nos in sǽculo, = los preceptos de Cristo en el mundo,
      hymnos ut olim glóriæ = para que un día le cantemos
      fundámus illi pérpetim. = himnos de gloria para siempre.
  dum-tuas-festo-pater-o-colende:
    titulo: Dum tuas festo, pater o colénde
    amen: true
    estrofas:
    - |-
      Dum tuas festo, pater o colénde, = Mientras esta asamblea, oh padre venerable,
      cántico laudes habet hæc coróna, = celebra tus alabanzas con un canto festivo,
      vocis ac mentis, Ióachim, benígne = recibe benigno, Joaquín, el don
      áccipe munus. = de la voz y de la mente.
    - |-
      Longa te regum séries avórum = Una larga serie de abuelos reyes
      Ábrahæ prolem tulit atque David; = te trajo como descendiente de Abraham y de David;
      clárior mundi dómina corúscas = más ilustre brillas por tu hija María,
      prole María. = señora del mundo.
    - |-
      Sic tuum germen benedícta ab Anna = Así tu fruto, dado a luz por la bendita Ana,
      éditum, patrum repetíta vota = cumple los votos repetidos de los padres
      implet, et mæsto próperat reférre = y se apresura a llevar los gozos
      gáudia mundo. = al mundo triste.
    - |-
      Laus tibi, Prolis Pater increátæ; = Alabanza a ti, Padre de la Prole increada;
      laus tibi, summi Súboles Paréntis; = alabanza a ti, Hijo del Padre supremo;
      summa laus, compar, tibi sit per omne, = suma alabanza a ti, igual a ellos, Espíritu,
      Spíritus, ævum. = por toda la eternidad.
  nocti-succedit-lucifer:
    titulo: Nocti succédit lúcifer
    amen: true
    estrofas:
    - |-
      Nocti succédit lúcifer, = A la noche sucede el lucero,
      quem mox auróra séquitur, = al que pronto sigue la aurora,
      solis ortum prænúntians = anunciando la salida del sol
      mundum lustrántis lúmine. = que recorre el mundo con su luz.
    - |-
      Christus sol est iustítiæ, = Cristo es el sol de justicia,
      auróra Mater grátiæ, = la aurora es la Madre de la gracia,
      quam, Anna, præis rútilans = a la que tú, Ana, precedes brillante,
      legis propéllens ténebras. = alejando las tinieblas de la ley.
    - |-
      Anna, radix ubérrima, = Ana, raíz abundantísima,
      arbor tu salutífera, = tú, árbol saludable,
      virgam prodúcens flóridam = que produces la vara florida
      quæ Christum nobis áttulit. = que nos trajo a Cristo.
    - |-
      O matris Christi génetrix = Oh madre de la madre de Cristo,
      tuque parens sanctíssime, = y tú, padre santísimo,
      natæ favénte mérito, = con el favor del mérito de vuestra hija,
      nobis rogáte véniam. = pedid perdón para nosotros.
    - |-
      Iesu, tibi sit glória, = Jesús, a ti sea la gloria,
      qui natus es de Vírgine, = que naciste de la Virgen,
      cum Patre et almo Spíritu, = con el Padre y el Espíritu bondadoso,
      in sempitérna sǽcula. = por los siglos sempiternos.
  te-gratulantes-pangimus:
    titulo: Te gratulántes pángimus
    amen: true
    estrofas:
    - |-
      Te gratulántes pángimus, = Felicitándote te cantamos,
      Martha, beáta múlier, = Marta, mujer dichosa,
      quæ meruísti sǽpius = que mereciste muchas veces
      Christum domi recípere. = recibir a Cristo en tu casa.
    - |-
      Tantum libénter hóspitem = A tan gran huésped, con gusto,
      curis ornábas sédulis, = lo honrabas con cuidados diligentes,
      in plúrima sollícita = preocupada por muchas cosas
      amóris dulci stímulo. = por el dulce aguijón del amor.
    - |-
      Pascis dum læta Dóminum, = Mientras alimentas alegre al Señor,
      soror ac frater ávide = tu hermana y tu hermano pueden
      possunt ab illo grátiæ = recibir de él con avidez
      vitǽque cibum súmere. = el alimento de la gracia y de la vida.
    - |-
      Captúro mortis trámitem = Cuando él iba a tomar el camino de la muerte,
      dante soróre arómata, = al dar tu hermana los perfumes,
      extrémi tu servítii = tú, vigilante, diste los dones
      vigil donásti múnera. = del último servicio.
    - |-
      Magístri felix hóspita, = Feliz hospedera del Maestro,
      corda fac nostra férveant, = haz que nuestros corazones ardan,
      ut illi gratæ iúgiter = para que sean siempre para él
      sint sedes amicítiæ. = gratas moradas de amistad.
    - |-
      Sit Trinitáti glória, = Gloria sea a la Trinidad,
      quæ nos in domum cǽlicam = que nos conceda al fin ser admitidos
      admítti tandem tríbuat = en la casa del cielo
      tecúmque laudes cánere. = y cantar contigo las alabanzas.
  quas-tibi-laudes-ferimusque-vota:
    titulo: Quas tibi laudes ferimúsque vota
    amen: true
    estrofas:
    - |-
      Quas tibi laudes ferimúsque vota, = Que las alabanzas y los votos que te ofrecemos
      nos tuis possint méritis iuváre, = puedan ayudarnos por tus méritos,
      Martha, quam mire sibi corde iungit = Marta, a quien Cristo admirablemente une a sí
      Christus amíco. = con corazón de amigo.
    - |-
      Te frequens visit Dóminus tuáque = El Señor te visita a menudo y vive
      in domo degit plácida quiéte = en tu casa en plácida tranquilidad,
      ac tuis verbis studiísque lætans = y se alegra con tus palabras y tus atenciones,
      teque minístra. = y contigo como servidora.
    - |-
      Tu prior fratrem quéreris perísse, = Tú, la primera, te quejas de que tu hermano ha muerto,
      cumque germána lacrimáta multum, = y, habiendo llorado mucho con tu hermana,
      áspicis vitæ súbita Magístri = lo ves volver de repente a la vida
      voce redíre. = por la voz del Maestro.
    - |-
      Quæ fide prompta stábilem fatéris = Tú, que, pronta en la fe, confiesas la esperanza
      spem resurgéndi, Dómino probánte, = firme de resucitar, aprobándolo el Señor,
      ímpetra nobis cúpide in perénne = alcánzanos avanzar con deseo
      pérgere regnum. = hacia el reino perenne.
    - |-
      Laus Deo Patri, Genitóque virtus, = Alabanza a Dios Padre, y al Hijo el poder,
      Flámini Sancto párilis potéstas, = al Espíritu Santo igual potestad,
      glóriam quorum pétimus per ævum = cuya gloria pedimos contemplar
      cérnere tecum. = por siempre contigo.
  magnae-cohortis-principem:
    titulo: Magnæ cohórtis príncipem
    amen: true
    estrofas:
    - |-
      Magnæ cohórtis príncipem = Al jefe de una gran cohorte,
      Ignátium laus cóncinat, = Ignacio, cante la alabanza,
      clarum loquélis, áctibus = ilustre por sus palabras, por sus hechos,
      ducem ciéntem mílites. = capitán que convoca a los soldados.
    - |-
      Regi suprémo cǽlitum = Atado por un amor único
      amóre vinctus único, = al Rey supremo de los del cielo,
      eius fovénda glória = nada juzgó más agradable
      nil cénsuit iucúndius. = que promover su gloria.
    - |-
      Hinc se suósque dévovet, = Por eso se consagra él y los suyos,
      urgéntis instar ágminis, = a manera de un ejército que avanza,
      ut iura Christi víndicet, = para defender los derechos de Cristo
      erróris umbras díssipet. = y disipar las sombras del error.
    - |-
      Sancto monénte Spíritu, = Aconsejándolo el Espíritu Santo,
      certam salútis sémitam = escrutador profundo y doctor prudente,
      scrutátor altus sǽculis = señala a los siglos el camino
      doctórque prudens dénotat. = seguro de la salvación.
    - |-
      Suis alúmnis díssita = Enviados sus discípulos
      missis in orbis lítora, = a las costas lejanas del orbe,
      Ecclésiam quot éxpetit = ¡con cuántas naciones busca
      frondére lætam géntibus! = que florezca alegre la Iglesia!
    - |-
      Sit Trinitáti glória, = Gloria sea a la Trinidad,
      quæ nos det huius mílitis = que nos conceda seguir con fortaleza
      exémpla fortes pérsequi = los ejemplos de este soldado
      in Christi honórem pérpetim. = para honra de Cristo para siempre.
