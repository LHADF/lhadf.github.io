# Himnos de Nona en español, por primer verso.
Cada tarde se nos van los días:
- |-
  Cada tarde se nos van los días,
  y cada tarde el tiempo pasa;
  se acaba nuestra vida cada tarde
  y miramos la muerte más cercana.
- |-
  Déjame todavía gozar el milagro
  de tu luz, de tu sol, de tus albas;
  déjame gozar el milagro de sentirme vivo
  y de nacer para ti cada mañana.
- |-
  Déjame, Señor, gozar de tu milagro
  al llegar una vez más la tarde mansa,
  porque tú eres el Dios de nuestras horas,
  el Dios oculto de nuestra esperanza. Amén.
Cruz de Cristo:
- |-
  Cruz de Cristo,
  cuyos brazos
  todo el mundo han acogido.
- |-
  Cruz de Cristo,
  cuya sangre
  todo el mundo ha redimido.
- |-
  Cruz de Cristo,
  luz que brilla
  en la noche del camino.
- |-
  Cruz de Cristo,
  cruz del hombre,
  su bastón de peregrino.
- |-
  Cruz de Cristo,
  árbol de vida,
  vida nuestra, don eximio.
- |-
  Cruz de Cristo,
  altar divino
  de Dios-Hombre en sacrificio. Amén.
Danos, Señor, la firme voluntad:
- |-
  Danos, Señor, la firme voluntad,
  compañera y sostén de la virtud,
  que sabe en la fatiga hallar quietud
  y en medio de las sombras claridad:
- |-
  La que trueca en tesón la veleidad,
  y el ocio en perennal solicitud,
  y las ásperas fiebres en salud
  y los torpes engaños en verdad.
- |-
  Y así conseguirá mi corazón
  que los favores que a tu amor debí
  le ofrezcan algún fruto en galardón.
- |-
  Y aún tú, Señor, conseguirás así
  que no llegue a romper mi confusión
  la imagen tuya que pusiste en mí. Amén.
Fundamento de todo lo que existe:
- |-
  Fundamento de todo lo que existe,
  de tu pueblo elegido eterna roca,
  de los tiempos Señor, que prometiste
  dar tu vigor al que con fe te invoca.
- |-
  Mira al hombre que es fiel y no te olvida,
  tu Espíritu, tu paz háganlo fuerte
  para amarte y servirte en esta vida
  y gozarte después de santa muerte.
- |-
  Jesús, Hijo del Padre, ven aprisa
  en este atardecer que se avecina,
  serena claridad y dulce brisa
  será tu amor que todo lo domina. Amén.
Oh Dios, tenaz vigor de toda cosa:
- |-
  Oh Dios, tenaz vigor de toda cosa,
  que inmóvil en ti mismo permaneces,
  y que el orden del tiempo determinas
  por medio de la luz que nace y muere.
- |-
  Dígnate concedernos, en la tarde,
  Luz con que nuestra vida nunca cese,
  y haz que el bien infinito de la gloria
  siga a la gracia de una santa muerte.
- |-
  Glorificado seas, Jesucristo,
  nacido del más puro y santo vientre,
  y que sean también glorificados
  el Padre y el Espíritu por siempre. Amén.
Oh Jesús, que en tu cruz has demostrado:
- |-
  Oh Jesús, que en tu cruz has demostrado
  tu gran amor, tu gran misericordia,
  y tu fuerza nos das para seguirte
  por el mismo camino hacia la gloria.
- |-
  Que fielmente cumplamos en tu Iglesia
  nuestra parte en tu obra salvadora,
  y, al llegar a la tarde de la vida,
  en gozo eterno el Padre nos acoja.
- |-
  Gracias, Padre, a ti porque nos llamas,
  a Jesús, que en su sangre nos redime,
  y al Espíritu Santo, luz y guía
  de este pueblo que al cielo se dirige. Amén.
Ojos de aquel publicano:
- |-
  Ojos de aquel publicano
  hasta la tierra caídos,
  el Dios de la luz os mira,
  miradle con regocijo.
- |-
  Mano que pide clemencia
  hiriendo el pecho contrito,
  el Señor te abre la puerta
  de su pecho compasivo.
- |-
  Lengua que en bajo murmullo
  dices tu dolor sentido,
  el Juez que sabe juzgar
  ha escuchado complacido.
- |-
  Padre del octavo día,
  glorioso siendo propicio,
  perdónanos, purifícanos,
  por el honor de tu Hijo. Amén.
Reina el Señor allí donde ninguno:
- |-
  Reina el Señor allí donde ninguno
  ciñe corona que haya dado el mundo;
  reina el Señor allí donde la vida
  sin lágrimas es río de delicias.
- |-
  Reina el Señor, el compasivo siervo,
  que en sus hombros cargó nuestro madero;
  vive el muerto en la cruz, el sepultado
  y con hierro sellado y custodiado.
- |-
  Cruzó el oscuro valle de la muerte
  hasta bajar a tumba de rebeldes;
  fingía que era suya nuestra pena,
  y en silencio escuchó nuestra sentencia.
- |-
  Pero reina el Señor, la tierra goza,
  y ya se escuchan los cánticos de boda.
  ¡Gloria al Señor Jesús resucitado,
  nuestra esperanza y triunfo deseado! Amén.
Salvador del mundo:
- |-
  Salvador del mundo,
  Señor de los ángeles:
  por tu cruz gloriosa
  la muerte venciste.
- |-
  Oh Señor, consérvanos
  los dones amables
  que, con sufrimientos,
  tú nos mereciste.
- |-
  Y a quienes a precio
  de dolor salvaste,
  llévalos al cielo
  para que te alaben.
- |-
  Llévanos a todos,
  Señor, suplicámoste,
  pues que nos hiciste
  reino de tu Padre. Amén.
