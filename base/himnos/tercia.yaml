# Himnos de Tercia en español, por primer verso.
Al Señor confesamos, ¡aleluia!:
- |-
  Al Señor confesamos, ¡aleluia!
  En la hora de tercia a la mañana
  se llenaron los suyos de esperanza,
  y lejos de la noche y de la duda
  salieron con la llama y la palabra.
- |-
  Al Señor adoramos, ¡aleluia!
  Han marcado sus pies nuestros caminos,
  marcó su nombre el nombre de los siglos,
  y en la tierra su voz cual voz ninguna
  convoca seguidores y testigos.
- |-
  Al Señor esperamos, ¡aleluia!
  Y ahora celebramos al Viviente,
  a Jesús victorioso de la muerte;
  acéptanos, oh Cristo, cual liturgia
  de gloria que ganaste y a ti vuelve. Amén.
Amigo de los hombres, Jesucristo:
- |-
  Amigo de los hombres, Jesucristo,
  tú solo das sentido a nuestra historia,
  y, con los ojos fijos al futuro,
  la Iglesia vive fiel a tu memoria.
- |-
  Este tiempo de ayuno te presenta
  de nosotros la parte más oscura,
  y tus manos clavadas al madero
  nos devuelven tu paz y tu ternura.
- |-
  A lo largo del día no nos dejes,
  no nos falte la luz de tu mirada:
  llena de amor los pasos que caminan
  de este mundo a la luz de tu alborada. Amén.
Como el fuego calcina:
- |-
  Como el fuego calcina
  la madera reseca,
  cuando el pecado nos domina,
  Espíritu de Dios,
  purifícanos.
- |-
  Como el río derrama
  por la tierra sus aguas
  y hay flor y fruto en la rama,
  Espíritu de Dios,
  vivifícanos.
- |-
  Como tu fuerte viento
  hizo en el mar camino,
  cuando haya duda y desaliento,
  Espíritu de Dios,
  ayúdanos.
- |-
  Luz, Amor, Viento, Fuego,
  los caminos de éxodo
  enseña al hombre pobre y ciego.
  Espíritu de Dios,
  condúcenos. Amén.
Cruz preciosa:
- |-
  Cruz preciosa,
  inmerecida:
  a los hombres diste vida.
- |-
  Un dolor
  en el madero;
  y a los hombres
  un Cordero.
- |-
  Sangre roja
  del combate;
  y para el hombre
  el rescate.
- |-
  Tu victoria
  es nuestra vida,
  por la sangre
  de tu herida.
- |-
  Nuestra vida
  es tu muerte
  ¡y para el hombre
  qué suerte! Amén.
Dejad que el grano se muera:
- |-
  Dejad que el grano se muera
  y venga el tiempo oportuno:
  dará cien granos por uno
  la espiga de primavera.
- |-
  Mirad que es dulce la espera
  cuando los signos son ciertos;
  tened los ojos abiertos
  y el corazón consolado;
  si Cristo ha resucitado,
  ¡resucitarán los muertos! Amén.
El trabajo, Señor, de cada día:
- |-
  El trabajo, Señor, de cada día
  nos sea por tu amor santificado,
  convierte su dolor en alegría
  de amor, que para dar tú nos has dado.
- |-
  Paciente y larga es nuestra tarea
  en la noche oscura del amor que espera;
  dulce huésped del alma, al que flaquea
  dale tu luz, tu fuerza que aligera.
- |-
  En el alto gozoso del camino,
  demos gracias a Dios, que nos concede
  la esperanza sin fin del don divino;
  todo lo puede en él quien nada puede. Amén.
Espíritu de Dios, la tierra llenas:
- |-
  Espíritu de Dios, la tierra llenas,
  las mentes de los hombres las bañas en tu luz,
  tú que eres Luz de Dios, divino fuego,
  infunde en todo hombre la fuerza de la cruz.
- |-
  Sé luz resplandeciente en las tinieblas
  de quienes el pecado sumió en la obscuridad,
  reúne en la asamblea de los hijos
  los justos que te amaron, los muertos por la paz.
- |-
  Acaba en plenitud al Cristo vivo,
  confirma en el creyente la gracia y el perdón,
  reúnelos a todos en la Iglesia,
  testigos jubilosos de la resurrección. Amén.
Fuego de Dios a nuestras frentes baje:
- |-
  Fuego de Dios a nuestras frentes baje,
  intelecto de amor en ellas prenda,
  y con lumbres de gozo y de martirio
  nuestras almas encienda.
- |-
  Como el viento, impetuoso; como el fuego,
  candente, nuestro celo se propague,
  ¡y juzguen ebriedad de los sentidos
  la divina embriaguez que nos embriague!
- |-
  Todos transverberados, desechemos
  nuestro albergue precario,
  y escuche todo oído en toda lengua
  el subversor mensaje del Calvario.
- |-
  Nuevo diluvio de aguas cenagosas
  trae en cruda zozobra nuestra barca.
  ¡Vuelve, Amor, con el ramo del olivo!
  ¡Vuelve, Paloma, a serenar el arca! Amén.
Oh Santo Espíritu, que con el Padre:
- |-
  Oh Santo Espíritu, que con el Padre
  y el Hijo eres un solo Dios eterno:
  dígnate ya bajar hasta nosotros
  y entrar y derramarte en nuestros pechos.
- |-
  Que la mente, la lengua y el sentido
  den testimonio de tu nombre excelso,
  y que las llamas del amor despunten,
  y que al prójimo abrasen con su fuego.
- |-
  Escúchanos, oh Padre piadosísimo,
  y haz que se cumpla nuestro buen deseo,
  tú que reinas sin tiempo con tu Hijo
  Jesucristo y el Santo Paracleto. Amén.
Ven del seno de Dios, oh Santo Espíritu:
- |-
  Ven del seno de Dios, oh Santo Espíritu,
  a visitar las mentes de tus fieles;
  y haz que los corazones que creaste
  se llenen con tus dádivas celestes.
- |-
  Ilumine tu luz nuestros sentidos,
  encienda el fuego de tu amor los pechos;
  Espíritu de Cristo, fortalece
  este barro mortal de nuestros corazones.
- |-
  Danos, Amor, tu amor y la alegría
  de conocer al Padre y a su Hijo,
  de poseerte a ti que eres de entrambos
  eternamente el inefable Espíritu. Amén
Ven, Espíritu Santo, luz y gozo:
- |-
  Ven, Espíritu Santo, luz y gozo,
  Amor, que en tus incendios nos abrasas:
  renueva el alma de este pueblo tuyo
  que por mis labios canta tu alabanza.
- |-
  En sus fatigas diarias, sé descanso;
  en su lucha tenaz, vigor y gracia:
  haz germinar la caridad del Padre,
  que engendra flores y que quema zarzas.
- |-
  Ven, Amor, que iluminas el camino,
  compañero divino de las almas:
  ven con tu viento a sacudir al mundo
  y a abrir nuevos senderos de esperanza. Amén.
