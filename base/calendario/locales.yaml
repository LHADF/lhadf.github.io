# Calendarios locales: lo que cambia en una diócesis respecto del calendario de su país.
# Lo lee tools/calendario.py, que aplica el cambio al motor del Ordo (precedencias, I Vísperas y traslados salen de ahí).
#   calendario: sigla (debe estar en «calendarios», abajo)      fecha: MM-DD      celebracion: comienzo del nombre en el Ordo
#   grado: Solemnidad | Fiesta | Memoria obligatoria             nota: opcional (las notas del calendario van en notas.yaml)
#   calendario: '*' = todos (va primero; un calendario local lo puede cambiar después). siglas: opcional, quién la celebra así.
# Vale también para un calendario nacional del Ordo (ARG, PGY) cuando el Calendario ADF indica un grado distinto.
calendarios:
  CRG: Calendario romano general
  ADF: Uso del Movimiento Cultural de Renovación Ad Fontes
  ARG: Calendario de Argentina
  PGY: Calendario del Paraguay
  BRS: Calendario del Brasil
  CHL: Calendario de Chile
  ESP: Calendario de España
  FRC: Calendario de Francia
  CDE: Calendario de la Diócesis de Ciudad del Este
  BUE: Calendario de la Arquidiócesis de Buenos Aires
# De qué calendario nacional parte cada calendario local
padres:
  BUE: ARG
  CDE: PGY
cambios:
# San Blas: el Ordo la trae como solemnidad (CDE, ADF). Calendario ADF, notas 2 y 3: solemnidad solo en CDE (patrono de
# la diócesis); en ADF, memoria obligatoria.
- calendario: '*'
  fecha: 02-03
  celebracion: San Blas
  grado: Memoria obligatoria
  siglas: ADF
- calendario: BUE
  fecha: 11-11
  celebracion: San Martín de Tours
  grado: Solemnidad
- calendario: CDE
  fecha: 02-03
  celebracion: San Blas
  grado: Solemnidad
- calendario: PGY
  fecha: 11-15
  celebracion: Santos Roque González
  grado: Fiesta
