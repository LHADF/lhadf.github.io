# Notas del Calendario litúrgico ADF, por celebración: «MM-DD Nombre, título» como en el Ordo («movible» para las del Propio del tiempo).
# Cada nota lleva la sigla del calendario al que se refiere. Se muestran con el signo (!) en el inicio.
# Importadas una vez del PDF (tools/importar/notas_calendario.py); se corrigen acá.
01-01 Santa María, Madre de Dios:
- calendario: CRG
  texto: Jornada mundial de la paz. Día de precepto.
01-03 Santísimo Nombre de Jesús:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria.
01-14 San Hilario de Poitiers, obispo y doctor de la Iglesia:
- calendario: ADF
  texto: En razón de la concurrencia ocasional con el Bautismo del Señor, es trasladada del 13 al 14, de acuerdo al Calendario de la Forma extraordinaria. Y es elevada de la categoría de Memoria obligatoria en razón de la importancia del modelo de vida comunitaria y pastoral del clero diocesano que ofreció san Hilario de Poitiers.
01-15 Santos Mauro y Plácido, religiosos:
- calendario: ADF
  texto: Agregada al Calendario en razón de su relación al grupo fundacional de san Benito de Nursia, patrono secundario de ADF.
01-19 Beata Laura Vicuña, virgen:
- calendario: ARG
  texto: Trasladada del 22 de enero para dar lugar a la Memoria obligatoria de san Vicente.
01-20 Santos Fabián, papa, y Sebastián, mártires:
- calendario: ADF
  texto: Las Memorias libres de los santos Fabián y Sebastián se unen en una sola celebración de acuerdo al uso de la Forma extraordinaria y es elevada a la categoría de Memoria obligatoria por la difusión de la devoción de estos mártires.
01-22 San Vicente, diácono y mártir:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria.
01-24 Bienaventurada Virgen María, Reina de la Paz:
- calendario: ADF
  texto: Elevada de Memoria libre o Feria por S.E.R. Mons. Rogelio Livieres con ocasión de su declaración como Co-Patrona principal de la Diócesis de Ciudad del Este, para invocar la protección de María frente a los ataques de los enemigos de la Iglesia, y adoptada como tal por ADF en todas sus comunidades.
01-28 Santo Tomás de Aquino, presbítero y doctor de la Iglesia:
- calendario: ADF
  texto: Patrono de los estudios superiores de Filosofía y Teología de ADF. Elevada de la categoría de Memoria obligatoria.
01-29 San Francisco de Sales, obispo y doctor de la Iglesia:
- calendario: ADF
  texto: Trasladada del 24 de enero para dar lugar a la Solemnidad de María, Reina de la Paz, y elevada de la categoría de Memoria libre o Feria en razón de la importancia de los escritos espirituales del Santo.
02-02 Presentación del Señor en el Templo y Purificación de la Virgen María:
- calendario: CRG
  texto: 'Jornada de la vida consagrada (mundial y pontificia): liturgia del día, alusión en la mon. de entrada y en la hom., intención en la orac. univ. En Argentina se celebra el 8 de septiembre. Las candelas pueden ser bendecidas con procesión o entrada solemne. Se encienden las candelas desde el principio, mientras se canta la antífona «Nuestro Señor llega con poder». Al entrar en la iglesia o en el presbiterio se canta la antífona de entrada de la Misa, sigue el Gloria y la oración colecta. En la procesión el sacerdote puede usar capa pluvial o casulla.'
02-03 San Blas, obispo y mártir:
- calendario: CDE
  texto: Patrono principal de la Diócesis de CDE, elevada a la categoría de Solemnidad.
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria a Memoria obligatoria.
02-08 San Jerónimo Emiliano, presbítero:
- calendario: CRG
  texto: Jornada de oración y reflexión contra la trata de personas (ARG).
02-09 Beata Ana Catalina Emmerick, virgen:
- calendario: ADF
  texto: Incorporada al Calendario y elevada a la categoría de Memoria obligatoria por la importancia singular del saber bíblico de sus visiones para la Iglesia de nuestro tiempo.
02-11 Bienaventurada Virgen María de Lourdes:
- calendario: CRG
  texto: 'Jornada mundial del enfermo (pontificia): liturgia del día (aunque por utilidad pastoral, a juicio del rector de la iglesia o del sacerdote celebrante, se puede usar el formulario «Por los enfermos», cf. Ordenación General del Misal Romano 376), alusión en la mon. de entrada y en la hom., intención en la orac. univ.'
02-15 San Claudio de la Colombière, presbítero:
- calendario: ADF
  texto: Agregada al Calendario por el valor de su obra espiritual de la escuela francesa.
02-18 Beato Juan de Fiésole (Fra Angelico), religioso:
- calendario: ADF
  texto: Patrono de los artistas. Agregada al Calendario y elevada a la categoría de Memoria obligatoria.
02-23 San Policarpo, obispo y mártir:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria en razón de que el Santo perteneció a la generación de los discípulos que aprendieron la fe directamente del Apóstol san Juan. También fue discípulo de san Papías.
02-24 San Papías, obispo:
- calendario: ADF
  texto: Agregada al Calendario como Memoria obligatoria en razón de que fue de la primera generación de discípulos de san Juan Evangelista.
03-19 San José, esposo de la bienaventurada Virgen María:
- calendario: CRG
  texto: Patrono de la Iglesia.
03-21 Tránsito de san Benito, abad:
- calendario: ADF
  texto: Patrono secundario de ADF, razón de su agregación al Calendario y elevación a la categoría de Fiesta. Se recuerda hoy la filiación espiritual de ADF con la Abadía de Fontgombault.
03-24 San Gabriel Arcángel:
- calendario: ADF
  texto: Siguiendo el uso de la Forma extraordinaria, las celebraciones de cada uno de los tres Arcángeles Miguel, Gabriel y Rafael tienen lugar en sus fechas tradicionales, por separado.
04-04 San Isidoro de Sevilla, obispo y doctor de la Iglesia:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria en razón de la importancia de las enseñanzas de este Santo del mundo hispano.
04-13 San Hermenegildo, mártir:
- calendario: ADF
  texto: Agregada al Calendario en razón de la importancia en el mundo hispano de este Santo, mártir de la Eucaristía.
04-27 Santo Toribio de Mogrovejo, obispo:
- calendario: ARG
  texto: Patrono del Episcopado Latinoamericano. En el Calendario universal se celebra como conmemoración el 23 de marzo.
04-28 San Luis María Grignon de Montfort, presbítero:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria por la importancia de la consagración a María predicada por el Santo. En este día se renueva anualmente la Consagración de ADF al Sagrado Corazón, al Inmaculado Corazón de María y al Patriarca san José.
05-01 San José, obrero:
- calendario: ADF
  texto: Elevada de la categoría de Memoria en razón de la importancia de san José en la vida de la Iglesia.
05-03 Exaltación de la Santa Cruz, Kurusu ára:
- calendario: PGY
  texto: Fecha tradicional de esta celebración que se mantiene en el PGY y que en el Calendario romano general se celebra el 14 de septiembre, en las vísperas de Nuestra Señora de los Dolores. La Fiesta de san Felipe y Santiago el Menor, apóstoles, se traslada en PGY al 11 de mayo.
05-05 San Pío V, papa:
- calendario: ADF
  texto: Memoria trasladada del 30 de abril y elevada a Memoria en razón de que los miembros fundadores de ADF reciben en esta fecha, al concluir un triduo de oración para pedir el discernimiento de la voluntad de Dios, la señal providencial de que debían iniciar el proceso de fundación de las Comunidades Sacerdotales de San Juan. La fecha de conclusión del Triduo fue elegida por ser el aniversario del acuerdo firmado el 5 de mayo de 1988 (san Pío V, en el Calendario de la Forma extraordinaria) por el entonces Cardenal Joseph Ratzinger y el Arzobispo Marcel Lefèbvre para regularizar la situación canónica de la Fraternidad San Pío X en la Iglesia.
05-06 San Juan ante la Puerta Latina:
- calendario: ADF
  texto: Aniversario de los inicios de la libre asociación de las CSI (1997), cuando los miembros fundadores de ADF salen de Saint Thomas Aquinas Seminary en Winona, Minnesota.
05-08 Bienaventurada Virgen María de Luján:
- calendario: ARG
  texto: Patrona de la República Argentina.
05-10 San Juan de Ávila, presbítero y doctor de la Iglesia:
- calendario: ADF
  texto: Agregada al Calendario en razón de la importancia de la doctrina espiritual de este Santo español.
05-11 Santos Felipe y Santiago el Menor, apóstoles:
- calendario: PGY
  texto: Trasladada del 3 de mayo para dar lugar a la Fiesta de la Santa Cruz (ver nota del día correspondiente).
05-12 San Pancracio, mártir:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria.
05-15 San Isidro, labrador:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria en ARG y PGY por la importancia tradicional de este santo español.
05-23 Beata Crescencia Pérez, religiosa:
- calendario: ARG
  texto: Trasladada del 20 de mayo.
05-24 María, Auxilio de los Cristianos:
- calendario: ADF
  texto: Aniversario de la fundación de las CSI como Asociación Pública Clerical de Fieles en Scranton, Pensilvania, 1998. Solemnidad en la Diócesis de Ciudad del Este y Fiesta en la República Argentina.
05-28 Santa Juana de Arco, virgen y mártir:
- calendario: ADF
  texto: Agregada al Calendario, trasladada del 30 de mayo para dar lugar a la Memoria de san Fernando y elevada a la categoría de Memoria obligatoria en razón de la importancia histórica de esta santa francesa.
05-30 San Fernando de Castilla, rey:
- calendario: ADF
  texto: Agregada al Calendario y elevada a la categoría de Memoria obligatoria en razón de la importancia del Santo.
06-23 San Pelayo, mártir:
- calendario: ADF
  texto: Trasladada del 26 de junio para dar lugar a la Memoria de san Josemaría Escrivá de Balaguer.
06-25 San Cirilo de Alejandría, obispo y doctor de la Iglesia:
- calendario: ADF
