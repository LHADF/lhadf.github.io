09-30 San Jerónimo, presbítero y doctor de la Iglesia:
- calendario: ADF
  texto: Patrono de la dedicación a la fuente de las Sagradas Escrituras. Elevada de la categoría de Memoria obligatoria.
10-08 San Dionisio, obispo, y compañeros, mártires:
- calendario: ADF
  texto: La Memoria libre de san Dionisio y compañeros que se celebra en el CRG el día 9 es elevada a la categoría de Memoria obligatoria y anticipada en este Calendario al día 8 para permitir la celebración de la Memoria libre de san Juan Enrique Newman, de mucho significado para la vida inteectual católica y la renovación ad fontes. Por lo cual es también elevada a la categoría de Memoria obligatoria.
10-12 Bienaventurada Virgen María de Aparecida:
- calendario: BRS
  texto: Agregada al Calendario en aquellas comunidades en las que hay un importante número de miembros brasileños, para honrar a la patrona principal de ese país latinoamericano. Es decir, no se sigue aquí un criterio territorial, sino personal.
10-12 Bienaventurada Virgen María del Pilar:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria en razón de la importancia de esta devoción en el mundo hispano y del uso del Calendario de la Forma extraordinaria.
10-13 San Eduardo de Inglaterra, rey:
- calendario: ADF
  texto: Agregado al Calendario en razón de su intensa devoción al apóstol san Juan.
10-16 Santa Margarita María de Alacoque, virgen:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria en razón de la importancia de la devoción al Sagrado Corazón en la espiritualidad de ADF.
10-24 San Rafael Arcángel:
- calendario: ADF
  texto: Agregado al Calendario de acuerdo al uso de la Forma extraordinaria por la importancia que los tres Arcángeles tienen, singularmente, en la historia de la salvación. La Memoria de san Antonio María Claret se traslada al 25 de octubre.
10-25 San Antonio María Claret, obispo:
- calendario: ADF
  texto: Trasladada del 24 de octubre para dar lugar a la celebración de la Fiesta de san Rafael Arcángel.
11-01 Todos los Santos:
- calendario: CRG
  texto: A los fieles que visiten devotamente el cementerio u oren sólo mentalmente por los difuntos se les concede la indulgencia plenaria (aplicable solamente a las almas del purgatorio) en cada uno de los días del 1 al 8 de noviembre, e indulgencia parcial en los demás días del año. En el día de la Conmemoración de los fieles difuntos (o, con el consentimiento del Ordinario, en el domingo anterior o posterior, o en la Solemnidad de Todos los Santos), en todas las iglesias y oratorios se puede lucrar de indulgencia plenaria. En Argentina, Jornada nacional de oración por la santificación del pueblo argentino y la glorificación de sus siervos de Dios.
11-02 Todos los Fieles Difuntos:
- calendario: CRG
  texto: Todos los sacerdotes pueden celebrar tres Misas; pero sólo se puede recibir un estipendio; la segunda se debe aplicar por el sufragio de todos los fieles difuntos y la tercera por las intenciones del Sumo Pontífice. Los fieles que hayan recibido la comunión en una Misa pueden recibirla otra vez, solamente dentro de la celebración eucarística en la que participe (c. 917).
11-07 Bienaventurada Virgen María, Madre y Medianera de la Gracia:
- calendario: ADF
  texto: Tomada del Calendario de ARG.
11-11 San Martín de Tours, obispo:
- calendario: BUE
  texto: Patrono principal de la Ciudad de Buenos Aires. Se celebra con el grado de Solemnidad.
- calendario: ADF
  texto: Patrono secundario de ADF por ser modelo de vida en común del clero diocesano.
