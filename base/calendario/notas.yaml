11-16 Santa Gertrudis, virgen:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria por su intensa devoción al apóstol san Juan.
11-17 San Alberto Magno, obispo y doctor de la Iglesia:
- calendario: ADF
  texto: Trasladada del 15 de noviembre para dar lugar a la Memoria de los santos Roque González de Santa Cruz y compañeros.
11-22 Santa Cecilia, virgen y mártir:
