11-26 San Columbano, abad:
- calendario: ADF
  texto: Trasladada del 23 de noviembre para dar lugar a la Fiesta de san Clemente.
11-27 Nuestra Señora de la Medalla Milagrosa:
- calendario: ADF
  texto: Incorporada al Calendario en razón de la importancia de esta advocación entre los fieles cristianos.
12-03 San Francisco Javier, presbítero:
- calendario: CRG
  texto: Patrono universal de las misiones.
12-08 Inmaculada Concepción de la Santísima Virgen María:
- calendario: CRG
  texto: Día de precepto.
12-10 Bienaventurada Virgen María de Loreto:
- calendario: ADF
  texto: Patrona de los templos e inmuebles de ADF. Agregada al Calendario en razón de su mediación en la adquisición y mantenimiento de la primera propiedad en Shohola, EE.UU., donde el oratorio fue dedicado como Iglesia Traspontina de Santa María de Loreto en el Misterio de la Encarnación del Señor. El papa Francisco la agregó al Calendario universal como Memoria libre o Feria el 25 de marzo de 2019.
12-12 Bienaventurada Virgen María de Guadalupe:
- calendario: ADF
  texto: Patrona de América.
12-17 San Lázaro, amigo de Jesús:
- calendario: ADF
  texto: Las Ferias del 17 al 24 de diciembre, inclusive, tienen la finalidad de preparar más directamente la Navidad (Normas universales sobre el Año litúrgico y el Calendario, 42). A partir de hoy el belén es expuesto a la veneración de los fieles, salvo la figura del Niño Jesús. Los árboles de Navidad son iluminados con luces blancas, pero sin otra decoración.
12-27 San Juan, apóstol y evangelista:
- calendario: ADF
  texto: Patrono principal de ADF. Elevada de la categoría de Fiesta. Prefacio propio (véase tesis doctoral del Pbro. Dominic Carey).
movible Bautismo del Señor:
- calendario: CRG
  texto: Con esta fiesta concluye el Ciclo de la Encarnación y el Tiempo de Navidad-Epifanía. Se celebra el domingo siguiente a la Epifanía del Señor; o, según el uso de la Forma extraordinaria, el 13 de enero como conclusión de la antigua Octava de la Epifanía. La ornamentación del Tiempo de Navidad es retirada antes del comienzo del Oficio del Bautismo del Señor. Si ha de bendecirse el baptisterio o la nueva pila bautismal, se escogerá un domingo, principalmente del tiempo pascual, o la fiesta del Bautismo del Señor (cf. Bendicional, nn. 933 y ss.).
movible Epifanía del Señor:
- calendario: CRG
  texto: 'Colecta del catequista nativo (pontificia: Congregación para la Evangelización de los Pueblos): Liturgia del día, mon. justificativa de la colecta y colecta. Después del Evangelio se anuncian las fiestas movibles del año en curso: de acuerdo a los usos del lugar y tras el canto del Evangelio, un diácono u otro ministro subirá al ambón y desde allí anunciará al pueblo la relación de fiestas móviles del año en curso: «Queridos hermanos: la gloria del Señor se ha manifestado y se continuará manifestando entre nosotros, hasta el día de su retorno glorioso. En la sucesión de las diversas fiestas y solemnidades del tiempo, recordamos y vivimos los misterios de la salvación. Cada domingo, Pascua semanal, la santa Iglesia hará presente este mismo acontecimiento, en el cual Cristo ha vencido al pecado y la muerte. También en las fiestas de la Virgen María, Madre de Dios, de los apóstoles, de los santos y en la conmemoración de todos los fieles difuntos, la Iglesia, peregrina en la tierra,
    proclama la Pascua de su Señor. A Él, el Cristo glorioso, el que es, el que era y ha de venir, al que es Señor del tiempo y de la historia, el honor y la gloria por los siglos de los siglos».'
movible Natividad del Señor:
- calendario: CRG
  texto: 'Día de precepto. Todos los sacerdotes pueden celebrar o concelebrar tres Misas, con tal que se celebren a su tiempo: medianoche, aurora y día. Los que celebran solo una Misa, dicen la que corresponda a la hora del día. El sacerdote que hoy celebra tres Misas puede percibir tres estipendios (c. 951, 1). La bendición del belén colocado en la iglesia puede hacerse al final de las Vísperas o al final de la Misa de la Noche (cf. Bendicional, nn. 1245 y ss.). Al iniciarse las fiestas de Navidad, puede bendecirse el árbol adornado para este tiempo (cf. Bendicional, nn. 1272 y ss.). Los árboles de Navidad son decorados por completo después del Oficio de Nona, antes de la celebración de las I Vísperas de la Natividad del Señor. Lo mismo se aplica a toda otra decoración acostumbrada. Conviene celebrar antes de la Misa de Medianoche una Vigilia solemne con el Oficio de Lectura. Tras el saludo inicial de la Misa de Medianoche, si no se hizo ya durante la Vigilia de los Villancicos, el celebrante
    u otro ministro puede proclamar el anuncio del nacimiento del Salvador, o Kalendas de la Navidad: «Pasados innumerables siglos desde la creación del mundo, cuando en el principio Dios creó el cielo y la tierra y formó al hombre a su imagen; después también de muchos siglos, desde que el Altísimo pusiera su arco en las nubes tras el diluvio como signo de alianza y de paz; veintiún siglos después de la emigración de Abrahán, nuestro padre en la fe, de Ur de Caldea; trece siglos después de la salida del pueblo de Israel de Egipto bajo la guía de Moisés; cerca de mil años después de que David fuera ungido como rey; en la semana sesenta y cinco según la profecía de Daniel; en la Olimpíada ciento noventa y cuatro, el año setecientos cincuenta y dos de la fundación de la Urbe, el año cuarenta y dos del imperio de César Octavio Augusto; estando todo el orbe en paz, Jesucristo, Dios eterno e Hijo del eterno Padre, queriendo consagrar el mundo con su piadosísima venida, concebido del Espíritu
    Santo, nueve meses después de su concepción, nace en Belén de Judea, hecho hombre, de María Virgen: la Natividad de nuestro Señor Jesucristo según la carne». No celebran Completas los que participan en la Vigilia. La adecuación de las Horas del Oficio con el tiempo real impide la celebración de Laudes inmediatamente después de la Misa de Medianoche. La figura del Niño Jesús es ubicada en el belén como conclusión del Oficio de Villancicos, antes de la Misa de Medianoche. A partir de hoy, en todas las Misas de la Octava de la Navidad, y en la Epifanía del Señor, la bendición final se hace con el Niño Jesús, que después es presentado a la veneración de los fieles. Los fieles que hubiesen comulgado en la Misa de Medianoche pueden volver a hacerlo en la Misa del Día.'
