07-25 Santiago, apóstol:
- calendario: CRG
  texto: Patrono de España.
07-27 San Charbel Maklüf, presbítero:
- calendario: ADF
  texto: Agregada al Calendario en razón de la importancia de este santo del rito maronita. Trasladada del 24 de julio en el Calendario de ARG para dar lugar a la Memoria de san Francisco Solano.
08-03 San Eusebio de Vercelli, presbítero:
- calendario: ADF
  texto: Trasladada del día anterior para dar lugar a la Memoria libre de San Pedro Julián Eymard.
08-09 Santa Teresa Benedicta de la Cruz (Edith Stein), virgen y mártir:
- calendario: CRG
  texto: Patrona de Europa.
