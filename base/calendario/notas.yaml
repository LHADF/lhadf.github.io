09-18 Santa Hildegarda de Bingen, virgen y doctora de la Iglesia:
- calendario: ADF
  texto: Agregada al Calendario y elevada a la categoría de Memoria obligatoria en razón de la importancia de las enseñanzas de esta santa para la Iglesia.
09-19 Nuestra Señora de la Salette:
- calendario: ADF
  texto: Agregada en razón de la importancia de estas apariciones para nuestro tiempo. La Memoria de san Jenaro queda trasladada al 22 de septiembre.
09-22 San Jenaro, obispo y mártir:
- calendario: ADF
  texto: Trasladada del 19 de septiembre para dar lugar a la Fiesta de Nuestra Señora de La Salette.
09-24 Bienaventurada Virgen María de la Merced:
- calendario: ADF
  texto: Agregada al Calendario por la importancia de esta advocación española.
09-27 San Vicente de Paúl, presbítero:
- calendario: CRG
  texto: Jornada mundial del turismo.
09-29 San Miguel Arcángel:
- calendario: ADF
