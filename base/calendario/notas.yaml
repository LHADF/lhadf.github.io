08-18 Santa Helena, emperatriz:
- calendario: ADF
  texto: Agregada al Calendario por su importancia en la conversión del Imperio Romano y el descubrimiento de la Santa Cruz en Jerusalén.
08-21 San Pío X, papa:
- calendario: ADF
  texto: Patrono de la dedicación a la fuente de la Catequesis, o Doctrina de la Fe. Elevada de la categoría de Memoria obligatoria.
08-23 Beata María Tránsito de Jesús Sacramentado, religiosa:
- calendario: ARG
  texto: Trasladada del 25 de agosto para dar lugar a la Memoria de san Luis.
08-23 Santa Rosa de Lima, virgen:
- calendario: CRG
  texto: En América Latina se celebra en la fecha tradicional (30 de agosto).
08-25 San Luis de Francia, rey:
- calendario: ADF
  texto: Elevada de la categoría de Memoria libre o Feria en razón de la importancia histórica de este Santo, rey de Francia.
08-26 San José de Calasanz, presbítero:
- calendario: ADF
  texto: Trasladada del 25 de agosto para dar lugar a la Memoria de san Luis de Francia.
08-29 Pasión de san Juan Bautista:
- calendario: CRG
  texto: Se le da en este Calendario el nombre tradicional en vez de denominarlo «martirio», como en el Calendario romano general actual. San Juan Bautista tiene su «Natividad» y su «Pasión», imitando los dos Ciclos principales de los misterios del Señor, de quien fue el Precesor.
08-30 Santa Rosa de Lima, virgen:
- calendario: PGY
  texto: Patrona de América Latina.
08-31 Santos José de Arimatea y Nicodemo, discípulos del Señor:
- calendario: ADF
  texto: Agregada al Calendario por el culto que valientemente demostraron al Cuerpo de Jesús durante su Misterio Pascual y, por lo tanto, pueden servir de aliento al cultivo de las Fuentes en nuestra época.
09-01 San Junípero Serra, religioso:
- calendario: ADF
  texto: Trasladada del 28 de agosto para dar lugar a la Memoria de san Agustín y agregada al Calendario por la importancia de este Santo para el catolicismo en América.
