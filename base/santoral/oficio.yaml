      En aquellos días, los apóstoles hacían muchos signos y prodigios en medio del pueblo. Los fieles se reunían de común acuerdo en el pórtico de Salomón; los demás no se atrevían a juntárseles, aunque la gente se hacía lenguas de ellos; más aún, crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor. La gente sacaba los enfermos a la calle y los ponía en catres y camillas, para que, al pasar Pedro, su sombra por lo menos cayera sobre alguno. Mucha gente de los alrededores acudía a Jerusalén llevando enfermos y poseídos de espíritu inmundo; y todos se curaban.
      Entonces el sumo sacerdote y los de su partido —la secta de los saduceos—, llenos de coraje, mandaron prender a los apóstoles y meterlos en la cárcel común. Pero por la noche el ángel del Señor les abrió las puertas y los sacó fuera, diciéndoles:
      «Id al templo y explicadle allí al pueblo este modo de vida.» Entonces ellos entraron en el templo al amanecer y se pusieron a enseñar. Llegó entre tanto el sumo sacerdote con los de su partido, convocaron el Consejo y el pleno del senado israelita y mandaron por los presos a la cárcel. Fueron los guardias, pero no los encontraron en la celda, y volvieron a informar:
      «Hemos encontrado la cárcel cerrada, con las barras echadas, y a los centinelas guardando las puertas; pero al abrir no encontramos a nadie dentro.»
      El comisario del templo y los sumos sacerdotes no atinaban a explicarse qué había pasado con los presos.
      Uno se presentó avisando:
      «Los hombres que metisteis en la cárcel están ahí en el templo y siguen enseñando al pueblo.»
      El comisario salió con los guardias y se los trajo, sin emplear la fuerza, por miedo a que el pueblo los apedrease. Los guardias condujeron a los apóstoles a presencia del Consejo, y el sumo sacerdote les interrogó:
      «¿No os habíamos prohibido expresamente enseñar en nombre de ése? En cambio, habéis llenado Jerusalén con vuestra enseñanza y queréis hacernos responsables de la sangre de ese hombre.»
      Pedro y los apóstoles replicaron:
      «Hay que obedecer a Dios antes que a los hombres. El Dios de nuestros padres resucitó a Jesús, a quien vosotros matasteis colgándole de un madero. La diestra de Dios lo exaltó haciéndolo jefe y salvador, para otorgar a Israel la conversión, el perdón de los pecados. Testigos de esto somos nosotros y el Espíritu Santo, que Dios da a los que le obedecen.»
    titulo: LOS APÓSTOLES EN LA IGLESIA PRIMITIVA
  resp1:
    ref: Cf. Hch 4, 33. 31b
    vr:
    - - R
      - Los apóstoles daban testimonio de la resurrección del Señor con mucho valor. * Todos eran muy bien vistos. Aleluia.
    - - V
      - Los llenó a todos el Espíritu Santo y anunciaban con valentía la palabra de Dios.
    - - R
      - Todos eran muy bien vistos. Aleluia.
  lectura2:
    autor: |-
      De las Homilías de san Juan Crisóstomo, obispo, sobre los Hechos de los apóstoles.
      (Homilía 3, 1. 2. 3: PG 60, 33-36. 38)
    texto: |-
      Uno de aquellos días, dirigiéndose Pedro a los hermanos reunidos, habló así. Pedro, a quien el Señor había encomendado su grey, vehemente como siempre, ejerce el papel de protagonista y es el primero en tomar la palabra: Hermanos, es preciso que elijamos a uno de entre nosotros. Permite que todos den su opinión, a fin de que el elegido sea recibido con agrado, precaviéndose de la envidia a que este hecho podía dar ocasión, ya que estas cosas, con frecuencia, son origen de grandes males.
      ¿Qué conclusión, por tanto, sacaremos de esto? ¿Es que Pedro no podía elegir por sí mismo? Ciertamente, podía; pero se abstuvo de ello, para no demostrar preferencia por nadie. Además, no había recibido aún el Espíritu Santo. Y presentaron a dos —dice el texto sagrado—: a José, llamado Barsabás, por sobrenombre Justo, y a Matías. No los presenta él, sino todos, Él lo que hizo fue aconsejar esta elección, haciendo ver que la iniciativa no partía de él, sino que se trataba de algo ya profetizado de antemano. Por esto su intervención en este caso fue la del que interpreta los designios de Dios, no la del que manda algo.
      Hay aquí entre nosotros —dice— hombres que han andado en nuestra compañía. Fijémonos cómo quiere que el elegido sea un testigo ocular; aunque luego había de venir el Espíritu Santo, pone en esto un gran interés.
      Hombres que han andado en nuestra compañía, y añade: todo el tiempo del ministerio público de Jesús, el Señor. Se refiere a los que han convivido con él, y no a los que sólo han sido discípulos suyos. Es sabido, en efecto, que eran muchos los que lo seguían desde el principio. Y, así, vemos que dice el Evangelio: Era uno de los dos que, oídas las palabras de Juan, habían ido en seguimiento de Jesús.
      Y prosigue: Todo el tiempo del ministerio público de Jesús, el Señor, es decir, desde el bautismo de Juan. Con razón señala este punto de partida, ya que los hechos anteriores nadie los conocía por experiencia, sino que los enseñó el Espíritu Santo.
      Luego continúa diciendo: Hasta el día de la ascensión; es, pues, preciso que elijamos a uno de ellos para que, junto con nosotros, dé testimonio de la verdad de la resurrección. No dice: «Para que dé testimonio de la verdad de las demás cosas», sino taxativamente: Para que dé testimonio de la verdad de la resurrección. En efecto, había de ser más digno de crédito uno que pudiera afirmar: «Aquel mismo que comía, bebía y fue crucificado es el que ahora ha resucitado.» Por lo tanto, interesaba un testigo no de lo del tiempo pasado ni de lo del futuro ni de los milagros, sino escuetamente de la resurrección. Porque todas aquellas cosas eran patentes y manifiestas; la resurrección, en cambio, era algo oculto que sólo ellos conocían.
      Y todos juntos oraron, diciendo: Tú, Señor, que conoces los corazones de todos, muéstranos. «Tú, no nosotros.» Muy acertadamente invocan al que conoce los corazones, ya que él, y nadie más, era el que tenía que hacer la elección. Y hablan a Dios con esta confianza, porque saben que la elección es algo absolutamente necesario. Y no dicen: «Escoge», sino: «Muéstranos al elegido» —a quién has elegido, dice el texto—, pues saben que Dios lo tiene todo determinado ya de antemano. Echaron suertes entre ellos. Es que aún no se consideraban dignos de hacer por sí mismos la elección, y por esto deseaban alguna señal que les diera seguridad.
    titulo: MUÉSTRANOS, SEÑOR, A QUIÉN HAS ELEGIDO
  resp2:
    ref: Hch 1, 24-26
    vr:
    - - R
      - Tú, Señor, que conoces los corazones de todos, * muéstranos a quién has elegido para ocupar el puesto en el ministerio del apostolado. Aleluia.
    - - V
      - Echaron suertes entre ellos, y la suerte cayó sobre Matías; así quedó agregado a los once apóstoles.
    - - R
      - Muéstranos a quién has elegido para ocupar el puesto en el ministerio del apostolado. Aleluia.
  te_deum: true
  oracion: Señor Dios, tú que, para completar el número de los doce apóstoles, elegiste a san Matías, concédenos, por la intercesión de este apóstol, a nosotros, que hemos recibido el don de tu amistad, poder ser contados un día entre tus elegidos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
MARÍA, MADRE DE LA IGLESIA:
  grado: Memoria
  fecha: variable
  comun: Del Común de la Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De las obras oratorias de Bossuet, obispo de Meaux, sobre la bienaventurada Virgen María
      (Sermón sobre la fiesta del escapulario: Oeuvres oratoires, edición Lebarq, Desclée de Brouver 1926, I, 388-389)
    texto: |-
      La santa Virgen María es la verdadera Eva, la verdadera madre de todos los vivientes. Vivid, vivid, y María será vuestra madre. Pero vivid de Jesucristo y por Jesucristo, porque incluso María tiene vida únicamente de Jesucristo y por Jesucristo.
      La maternidad de la santa Virgen es una realidad innegable. Por otra parte, que María sea madre de los cristianos es algo que no puede ser más oportuno; éste fue también el designio de Dios, revelado ya desde el paraíso. Pero para que esta realidad penetre más profundamente en vuestros corazones, debéis admirar el modo como este designio de Dios llegó a cumplimiento en el Evangelio de nuestro Salvador, contemplando cómo Jesús quiso asociar a sí a la santa Virgen al engendrarnos por medio del alumbramiento de su sangre, que siempre tan fértil, produjo frutos agradables al Padre.
      En aquella ocasión, san Juan representaba la universalidad de los fieles. Entended mi raciocinio: todos los demás discípulos del Salvador abandonaron a Jesús. Dios permitió que esto sucediera así para que comprendiéramos que son pocos los que siguen a Jesús hasta su cruz.
      Así, pues, habiéndose dispersado todos los demás discípulos, la providencia quiso que, junto al Dios que moría, no permaneciera sino Juan, el discípulo amado. Él fue el único, él, el verdadero fiel; porque únicamente es verdadero fiel de Jesús el que le sigue hasta la cruz. Y fue así como este único fiel representó a todos los fieles. Por consiguiente, cuando Jesucristo, hablando a su Madre, le dice que Juan es su hijo, no penséis que considera a san Juan como un hombre particular: en la persona de Juan entrega a María todos sus discípulos, todos sus fieles, todos los herederos de la nueva alianza, todos los hijos de su cruz.
      Por esto, precisamente, llama a María «Mujer»; con esta expresión quería significar «Mujer por excelencia, Mujer elegida singularmente para ser la madre del pueblo elegido». «Oh Mujer, oh nueva Eva —le dice—, ahí tienes a tu hijo; por tanto, Juan y todos los fieles a quienes él representa son tus hijos. Juan es mi discípulo, mi discípulo amado; recibe, pues, en su persona a todos los cristianos, porque aquí Juan los representa a todos, ya que todos ellos son, como lo es Juan, mis discípulos, mis discípulos amados.» Esto es lo que el Salvador quería significar a su santa Madre.
      Y lo que más importante se me antoja en este hecho es que Jesús dirija estas palabras a María desde la cruz. Porque en la cruz es donde el Hijo de Dios nos dio la vida y nos engendró a la gracia por la fuerza de su sangre derramada por nosotros. Y es precisamente desde la cruz desde donde significa a la purísima virgen María que ella es madre de Juan y madre de todos los fieles. Mujer, ahí tienes a tu hijo, le dice. En estas palabras contemplo al nuevo Adán que, al engendrarnos por su muerte, asocia a la nueva Eva, su santa Madre, en la generación, casta y misteriosa, de los hijos del nuevo Testamento.
    titulo: MARÍA, MADRE DE LA IGLESIA
  resp2:
    ref: Jn 19, 26; cf. Gn 3, 20
    vr:
    - - R
      - '«Mujer, ahí tienes a tu hijo», dijo Jesús a su madre; luego dijo al discípulo: * «Ahí tienes a tu madre.»'
    - - V
      - Se llamará nueva Eva, por ser la madre de todos los vivientes.
    - - R
      - Ahí tienes a tu madre.
  oracion: Señor, Padre de misericordia, cuyo Hijo, clavado en la cruz, proclamó como Madre nuestra a su Madre, santa María virgen, concédenos por su mediación amorosa, que tu Iglesia, cada día más fecunda, se llene de gozo por la santidad de sus hijos, y atraiga a su seno a todos los pueblos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SANTÍSIMA TRINIDAD:
  grado: Solemnidad
  fecha: variable
  himno: Uno es Amor, y tres son los amados
  salmodia:
  - ant: Sé nuestra ayuda, Dios único y todopoderoso, Padre, Hijo y Espíritu Santo.
    salmo: salmo-8
  - ant: 'Tú, oh Trinidad, eres santa: el Padre es amor, el Hijo es gracia, el Espíritu Santo es comunión.'
    salmo: salmo-32-i
  - ant: 'Tú, oh Trinidad, eres santa: el Padre es fuente de verdad, el Hijo es la Verdad, el Espíritu Santo es también la Verdad.'
    salmo: salmo-32-ii
  versiculo:
  - - V
    - La Palabra del Señor hizo el cielo.
  - - R
    - y el Aliento de su boca, sus ejércitos.
  lectura1:
    ref: De la primera carta del apóstol san Pablo a los Corintios 2, 1-16
    texto: |-
      Cuando vine a vosotros, hermanos, a anunciaros el testimonio de Dios, no lo hice con sublime elocuencia ni sabiduría, pues nunca entre vosotros me precié de saber cosa alguna, sino a Jesucristo, y éste crucificado. Me presenté a vosotros débil y temeroso; mi palabra y mi predicación no fue con persuasiva sabiduría humana, sino en la manifestación y el poder del Espíritu, para que vuestra fe no se apoye en la sabiduría de los hombres, sino en el poder de Dios.
      Sin embargo, hablamos, entre los perfectos, una sabiduría que no es de este mundo, ni de los príncipes de este siglo, que quedan desvanecidos, sino que enseñamos una sabiduría divina, misteriosa, escondida, predestinada por Dios antes de los siglos para nuestra gloria, que no conoció ninguno de los príncipes de este siglo; pues si la hubieran conocido, nunca hubieran crucificado al Señor de la gloria. Pero, según está escrito: «Ni el ojo vio, ni el oído oyó, ni vino a la mente del hombre lo que Dios ha preparado para los que le aman.»
      Pero a nosotros nos lo ha revelado por su Espíritu: y el Espíritu todo lo penetra, hasta la profundidad de Dios. En efecto, ¿qué hombre conoce lo íntimo del hombre, sino el espíritu del hombre que está en él? Del mismo modo, nadie conoce lo íntimo de Dios, sino el Espíritu de Dios. Y nosotros no hemos recibido el espíritu del mundo, sino el Espíritu que viene de Dios, para conocer las gracias que Dios nos ha otorgado, de las cuales también hablamos, no con palabras aprendidas de la sabiduría humana, sino aprendidas del Espíritu, expresando realidades espirituales en términos espirituales.
      El hombre naturalmente no capta las cosas del Espíritu de Dios; son necedad para él. Y no las puede entender, pues sólo el Espíritu puede juzgarlas. En cambio, el hombre espiritual lo juzga todo; y a él nadie puede juzgarlo. Porque ¿quién conoció el pensamiento del Señor para instruirle? Pero nosotros poseemos el pensamiento de Cristo.
    titulo: EL GRAN MISTERIO DEL DESIGNIO DE DIOS
  resp1:
    ref: Cf. Ef 1, 17. 18; 1Co 2, 12
    vr:
    - - R
      - El Dios de nuestro Señor Jesucristo, el Padre de la gloria, quiera concedernos el don de sabiduría y de revelación, para que lleguemos al pleno conocimiento de él e, iluminados así los ojos de nuestra mente, * conozcamos cuál es la esperanza a que nos ha llamado y cuáles las riquezas de gloria otorgadas por él como herencia a su pueblo santo.
    - - V
      - y nosotros no hemos recibido el espíritu del mundo, sino el Espíritu que viene de Dios.
    - - R
      - Para que conozcamos cuál es la esperanza a que nos ha llamado y cuáles las riquezas de gloria otorgadas por él como herencia a su pueblo santo.
  lectura2:
    autor: |-
      De las Cartas de san Atanasio, obispo
      (Carta 1 a Serapión, 28-30: PG 26, 594-595. 599)
    texto: |-
      Siempre resultará provechoso esforzarse en profundizar el contenido de la antigua tradición, de la doctrina y la fe de la Iglesia católica, tal como el Señor nos la entregó, tal como la predicaron los apóstoles y la conservaron los santos Padres. En ella, efectivamente, está fundamentada la Iglesia, de manera que todo aquel que se aparta de esta fe deja de ser cristiano y ya no merece el nombre de tal.
      Existe, pues, una Trinidad, santa y perfecta, de la cual se afirma que es Dios en el Padre, el Hijo y el Espíritu Santo, que no tiene mezclado ningún elemento extraño o externo, que no se compone de uno que crea y de otro que es creado, sino que toda ella es creadora, es consistente por naturaleza y su actividad es única. El Padre hace todas las cosas a través del que es su Palabra, en el Espíritu Santo. De esta manera queda a salvo la unidad de la santa Trinidad. Así, en la Iglesia se predica un solo Dios, que lo trasciende todo, y lo penetra todo, y lo invade todo. Lo trasciende todo, en cuanto Padre, principio y fuente; lo penetra todo, por su Palabra; lo invade todo, en el Espíritu Santo.
      San Pablo, hablando a los corintios acerca de los dones del Espíritu, lo reduce todo al único Dios Padre, como al origen de todo, con estas palabras: Hay diversidad de dones, pero un mismo Espíritu; hay diversidad de servicios, pero un mismo Señor; y hay diversidad de funciones, pero un mismo Dios que obra todo en todos.
      El Padre es quien da, por mediación de aquel que es su Palabra, lo que el Espíritu distribuye a cada uno. Porque todo lo que es del Padre es también del Hijo; por esto, todo lo que da el Hijo en el Espíritu es realmente don del Padre. De manera semejante, cuando el Espíritu está en nosotros, lo está también la Palabra, de quien recibimos el Espíritu, y en la Palabra está también el Padre, realizándose así aquellas palabras: El Padre y yo vendremos a fijar en él nuestra morada. Porque donde está la luz, allí está también el resplandor; y donde está el resplandor, allí está también su eficiencia y su gracia esplendorosa.
      Es lo que nos enseña el mismo Pablo en su segunda carta a los Corintios, cuando dice: La gracia de Jesucristo el Señor, el amor de Dios y la participación del Espíritu Santo estén con todos vosotros. Porque toda gracia o don que se nos da en la Trinidad se nos da por el Padre, a través del Hijo, en el Espíritu Santo. Pues así como la gracia se nos da por el Padre, a través del Hijo, así también no podemos recibir ningún don si no es en el Espíritu Santo, ya que hechos partícipes del mismo poseemos el amor del Padre, la gracia del Hijo y la participación de este Espíritu.
    titulo: LUZ, RESPLANDOR Y GRACIA EN LA TRINIDAD Y POR LA TRINIDAD
  resp2:
    ref: ''
    vr:
    - - R
      - Bendigamos al Padre, al Hijo y al Espíritu Santo. * Ensalcémoslo con himnos por los siglos.
    - - V
      - Bendito sea el Señor en la bóveda del cielo, alabado y glorioso por los siglos.
    - - R
      - Ensalcémoslo con himnos por los siglos.
  oracion: Dios Padre, que has enviado al mundo la Palabra de verdad y el Espíritu de santificación para revelar a los hombres tu misterio admirable, concédenos que, al profesar la fe verdadera, reconozcamos la gloria de la eterna Trinidad y adoremos la Unidad de tu majestad omnipotente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FELIPE NERI, presbítero:
  grado: Memoria
  fecha: 05-26
  comun: Del Común de pastores para un santo presbítero.
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De los Sermones de san Agustín, obispo
      (Sermón 171, 1-3. 5: PL 38, 933-935)
    texto: |-
      El Apóstol nos manda estar alegres, pero en el Señor, no en el mundo. Porque, como dice la Escritura, quien pretende ser amigo del mundo se hace enemigo de Dios. Así como el hombre no puede servir a dos señores, así también nadie puede estar alegre en el mundo y en el Señor.
      Por lo tanto, que prevalezca el gozo en el Señor y que se extinga el gozo en el mundo. El gozo en el Señor debe ir creciendo continuamente, mientras que el gozo en el mundo debe ir disminuyendo hasta extinguirse. Esto no debe entenderse en el sentido de que no debemos alegrarnos mientras estamos en el mundo, sino que es una exhortación a que, aun viviendo en el mundo, nos alegremos ya en el Señor.
      Pero alguno dirá: «Estoy en el mundo y, por lo tanto, si me alegro no puedo dejar de hacerlo en el lugar en que estoy.» A este tal yo le respondería: «¿Es que por estar en el mundo no estás en el Señor?» Atiende cómo el mismo Apóstol, hablando a los atenienses, como nos refieren los Hechos de los apóstoles, les decía respecto al Dios y Señor creador nuestro: En él vivimos, nos movemos y existimos. ¿Habrá algún lugar en que no esté aquel que está en todas partes? ¿No es éste el sentido de su exhortación, cuando dice: El Señor está cerca; no os inquietéis por cosa alguna?
      Gran cosa es ésta, que el mismo que asciende a lo más alto de los cielos continúa cercano a los que viven en la tierra. ¿Quién es éste, lejano y próximo a la vez, sino aquel que por su misericordia se nos hizo cercano?
      En efecto, todo el género humano está representado en aquel hombre al que unos ladrones habían dejado tendido en el camino, medio muerto, junto al cual pasaron un sacerdote y un levita sin atenderlo, y al que se acercó para curarlo y socorrerlo el samaritano que pasó junto a él. Aquel que por su condición de inmortal y justo se hallaba tan alejado de nosotros, mortales y pecadores, descendió a nosotros y se hizo cercano a nosotros.
      En efecto, no nos trata como merecen nuestros pecados; y esto porque somos hijos. ¿Cómo lo demostramos? El, el Hijo único, murió por nosotros para dejar de ser único. Murió él solo porque no quería ser él solo. El que era Hijo único de Dios hizo a muchos otros también hijos de Dios. Al precio de su sangre se compró una multitud de hermanos, con su reprobación los hizo probos, fue vendido para redimirlos, injuriado para hacerlos honorables, muerto para darles vida.
      Así pues, hermanos, estad alegres en el Señor, no en el mundo, es decir: alegraos en la verdad, no en la iniquidad; alegraos en la esperanza de la eternidad, no en la flor pasajera de la vanidad. Ésta debe ser vuestra alegría; y, en cualquier lugar en que estéis y todo el tiempo que aquí estéis, el Señor está cerca; no os inquietéis por cosa alguna.
    titulo: ESTAD SIEMPRE ALEGRES EN EL SEÑOR
  resp2:
    ref: 2Co 13, 11; Rm 15, 13
    vr:
    - - R
      - Hermanos, alegraos, trabajad por vuestra perfección, alentaos unos a otros, tened un mismo sentir y vivid en paz; * y el Dios del amor y de la paz estará con vosotros.
    - - V
      - El Dios de la esperanza os colme de todo gozo y paz en la práctica de vuestra fe.
    - - R
      - Y el Dios del amor y de la paz estará con vosotros.
  oracion: Señor Dios nuestro, que nunca dejas de glorificar la santidad de quienes con fidelidad te sirven, haz que el fuego del Espíritu Santo nos encienda en aquel mismo ardor que tan maravillosamente inflamó el corazón de san Felipe Neri. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARÍA DE JESÚS PAREDES, virgen:
  grado: Memoria
  fecha: 05-26
  comun: Del Común vírgenes.
  himno: Esta mujer no quiso
  lectura1:
    ref: De la segunda carta a los Corintios 11, 7-29
    texto: |-
      Hermanos: ¿Acaso he cometido alguna falta por el hecho de haberme abajado para encumbraros a vosotros, anunciándoos gratuitamente el Evangelio de Dios? Despojé a otras Iglesias recibiendo de ellas con qué vivir, para poder serviros a vosotros; y estando entre vosotros, y necesitado, no fui gravoso a nadie; fueron los hermanos llegados de Macedonia quienes remediaron mis necesidades. Y en todas las cosas me guardé y me guardaré bien de seros gravoso. Por la verdad de Cristo que en mí reside: no se verá coartada esta gloria en las regiones de Acaya. Y ¿por qué? ¿Porque no os amo? Bien sabe Dios que sí os amo.
      Pues bien, tal como ahora lo hago, lo continuaré haciendo. Así cortaré toda ocasión a los que bien quisieran tener una de poder ser como nosotros en el apostolado de que se glorían. Esos tales son falsos apóstoles, saboteadores, que se disfrazan de apóstoles de Cristo. Y no es maravilla, cuando el mismo Satanás se disfraza de ángel de luz. Por consiguiente, no es mucho que sus ministros se disfracen también de ministros de la justificación. Pero su fin corresponderá a sus obras.
      Una vez más os digo: no penséis que soy un fatuo. Con todo, aceptadme como tal, y permitidme que me gloríe un poco. Lo que voy a decir no lo voy a decir según el espíritu del Señor, sino como si desvariase por motivos de vanagloria. Ya que muchos se jactan a lo humano, también yo me voy a jactar. Realmente, ¡con qué gusto soportáis a los tontos, siendo vosotros tan sensatos! Porque aguantáis que esa gente os esclavice, os devore, os explote, os humille y os abofetee en el rostro. Con pena lo digo, pues tal parece que nuestro comportamiento para con vosotros ha sido débil.
      Pero de todo cuanto alguien quisiera alardear (hablo como hablaría un fatuo) me atrevería yo también a jactarme. ¿Que son hebreos? También yo. ¿Que son israelitas? También yo. ¿Descendientes de Abraham? También yo. ¿Que son ministros de Cristo? Voy a decir una locura: ¡Mucho más lo soy yo! Los supero en trabajos, en encarcelamientos, en muchísimos más azotes; por tantísimas veces que he estado en peligro de muerte.
      Cinco veces recibí de los judíos los cuarenta azotes menos uno. Tres veces fui golpeado con varas. Una vez fui apedreado. Tres veces sufrí naufragio. Un día y una noche los pasé entre las olas. He vivido en un continuo peregrinar, con peligros en los ríos, peligros de bandidos, peligros de parte de los de mi raza, peligros de parte de los paganos, peligros en las ciudades, peligros en el desierto, peligros en el mar, peligros de parte de falsos hermanos; con trabajos y fatigas, con muchas noches sin dormir, con hambre y con sed, con ayunos frecuentes, con frío y sin ropa.
      Y, además de muchas otras cosas, la responsabilidad que pesa sobre mí diariamente, mi preocupación por todas las Iglesias. ¿Quién sufre angustias sin que yo las comparta? ¿Quién es impugnado por el enemigo sin que esté yo en ascuas?
    titulo: CONTRA LOS FALSOS APÓSTOLES
  resp1:
    ref: Ga 1, 11. 12; cf. 2Co 11, 10. 7
    vr:
    - - R
      - El Evangelio anunciado por mí no es cosa humana; * y no lo recibí de hombre alguno, sino por revelación de Jesucristo.
    - - V
      - Por la verdad de Cristo que en mí reside, os aseguro que os he anunciado el Evangelio de Dios.
    - - R
      - Y no lo recibí de hombre alguno, sino por revelación de Jesucristo.
  lectura2:
    autor: |-
      De la homilía del Papa Pío XII en la canonización de santa Mariana de Jesús
      (9 de junio de 1950).
    texto: |-
      Repasando la vida de esta virgen angelical, a quien hoy elevamos al honor de los altares, nos parece oportuno proponernos estos puntos de reflexión: su inmaculado candor, las ásperas penitencias a que sometió su cuerpo para ofrendarlo como víctima al Señor, su caridad infatigable hacía toda clase de miserias.
      Conservó la virginidad por inspiración de Dios y con la ayuda de su gracia; apenas contaba diez años, cuando, con el consentimiento de su director espiritual, emitió sus votos privados, consagrándose al divino Esposo. Más que una niña, parecía un ángel por su dedicación a los ejercicios de piedad, por su asidua oración, por su meditación y ejercicio de la penitencia. No todos entienden, en los tiempos que nos alcanzan, este rigor de vida; no todos lo aprecian en su justo valor. Muchos, más bien, lo desprecian. Pero hemos de recordar que después de la culpa de Adán, cuya herencia todos llevamos, se torna indispensable para todos la penitencia. Ella tiene su dulzura propia, conforme lo experimentó Mariana de Jesús, siendo transportada en celestes arrobamientos cuando afligía su cuerpo con los rigores de la penitencia, pregustando con frecuencia las delicias celestiales. Con un tal género de vida y con la gracia del cielo, no sólo buscaba su propia santificación, sino en cuanto le era posible, la salvación del prójimo. En efecto, habiendo intentado viajar a remotas tierras a evangelizar a los paganos, a cuantos encontraba exhortaba con su palabra y ejemplo a las virtudes cristianas y a entrar o perseverar en el recto camino.
      Socorría con generosidad las miserias de los indigentes; cuidaba a los enfermos con ternura. En tiempo de calamidades para sus conciudadanos, ofrendó su vida para implorar clemencia al Padre de las misericordias. Aquí tenéis, en síntesis, la imagen de esta santa virgen, propuesta a vuestra consideración. Contempladla, para que os asombréis y procuréis esforzaros, cada uno en vuestro propio estado, en su imitación. Hágalo en especial la juventud entusiasta, rodeada hoy de tantos y tan graves peligros. Aprenda de ella, a luchar con ahínco y a resistir con fortaleza las seducciones del mal, antes que mancillar sus almas. Principalmente el amadísimo pueblo ecuatoriano emule las glorias de sus mayores y, con el auxilio y el patrocinio de santa Mariana de Jesús Paredes, ofrezca a la Iglesia nuevos ejemplos de santidad y de virtud.
    titulo: NO SÓLO BUSCABA SU PROPIA SANTIFICACIÓN, SINO LA SALVACIÓN DEL PRÓJIMO
  resp2:
    ref: Sal 40, 12-13; Rm 12, 1
    vr:
    - - R
      - En esto conozco que me amas, Señor, en que * has conservado mi inocencia y no has permitido que mi enemigo triunfe sobre mí. Aleluia
    - - V
      - Presentad vuestros cuerpos como hostia viva, santa, agradable a Dios.
    - - R
      - Has conservado mi inocencia y no has permitido que mi enemigo triunfe de mí. Aleluia.
  oracion: Padre de bondad, que hiciste florecer también en tierra americana la gloria de la santidad en la virgen santa Mariana de Jesús, concede a estos pueblos imitar su celo por el Evangelio y dar vivo testimonio de fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARIANA DE JESÚS PAREDES, virgen:
  grado: Memoria
  fecha: 05-26
  comun: Del Común vírgenes.
  himno: Esta mujer no quiso
