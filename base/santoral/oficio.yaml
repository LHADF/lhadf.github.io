  te_deum: true
  oracion: Señor, tú que quisiste dilatar la Iglesia por medio de la actividad apostólica de santo Toribio de Mogrovejo y por su gran amor a la verdad, suscita también hoy en el pueblo cristiano aquellas mismas virtudes que resplandecen en este santo obispo, para que así la Iglesia crezca constantemente en la fe y se renueve por la santidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA CATALINA DE SIENA, virgen y doctora de la Iglesia:
  grado: Memoria
  fecha: 04-29
  comun: Del Común de vírgenes.
  himno: Esta mujer no quiso
  lectura2:
    autor: |-
      Del Diálogo de santa Catalina de Siena, virgen, Sobre la divina providencia
      (Cap. 167, Acción de gracias a la Santísima Trinidad: edición latina, Ingolstadt 1583, ff. 290v-291)
    texto: |-
      ¡Oh Divinidad eterna, oh eterna Trinidad, que por la unión con tu divina naturaleza hiciste de tan gran precio la sangre de tu Hijo unigénito! Tú, Trinidad eterna, eres como un mar profundo, en el que cuanto más busco más encuentro, y cuanto más encuentro más te busco. Tú sacias el alma de una manera en cierto modo insaciable, ya que siempre queda con hambre y apetito, deseando con avidez que tu luz nos haga ver la luz, que eres tú misma.
      Gusté y vi con la luz de mi inteligencia, ilustrada con tu luz, tu profundidad insondable, Trinidad eterna, y la belleza de tus creaturas: por esto, introduciéndome en ti, vi que era imagen tuya, y esto por un don que tú me has hecho, Padre eterno, don que procede de tu poder y de tu sabiduría, sabiduría que es atribuida por apropiación a tu Unigénito y el Espíritu Santo, que procede de ti, Padre, y de tu Hijo, me dio una voluntad capaz de amar.
      Porque tú, Trinidad eterna, eres el hacedor, y yo la hechura: por esto he conocido con la luz que tú me has dado, al contemplar cómo me has creado de nuevo por la sangre del Hijo único, que estás enamorado de la belleza de tu hechura.
      ¡Oh abismo, oh Trinidad eterna, oh Divinidad, oh mar profundo!: ¿qué don más grande podías otorgarme que el de ti mismo? Tú eres el fuego que arde constantemente sin consumirse; tú eres quien consumes con tu calor todo amor del alma a sí misma. Tú eres, además, el fuego que aleja toda frialdad, e iluminas las mentes con tu luz, esta luz con la que me has dado a conocer tu verdad.
      En esta luz, como en un espejo, te veo reflejado a ti, sumo bien, bien sobre todo bien, bien dichoso, bien incomprensible, bien inestimable, belleza sobre toda belleza, sabiduría sobre toda sabiduría: porque tú eres la misma sabiduría, tú el manjar de los ángeles, que por tu gran amor te has comunicado a los hombres.
      Tú eres la vestidura que cubre mi desnudez, tú sacias nuestra hambre con tu dulzura, porque eres dulce sin mezcla de amargor, ¡oh Trinidad eterna!
    titulo: GUSTÉ Y VÍ
  resp2:
    ref: Cf. Ct 5, 2
    vr:
    - - R
      - Ábreme, hermana mía, que has llegado a ser coheredera de mi reino; amada mía, que has llegado a conocer los profundos misterios de mi verdad; * tú has sido enriquecida con la donación de mi Espíritu, tú has sido purificada de toda mancha con mi sangre. Aleluia.
    - - V
      - Sal del reposo de la contemplación y consagra tu vida a dar testimonio de mi verdad.
    - - R
      - Tú has sido enriquecida con la donación de mi Espíritu, tú has sido purificada de toda mancha con mi sangre. Aleluia.
  oracion: Señor Dios nuestro, que diste a santa Catalina de Siena el don de entregarse con amor a la contemplación de la pasión de Cristo y al servicio de la Iglesia, haz que, por su intercesión, el pueblo cristiano viva siempre unido al misterio de Cristo, para que pueda rebosar de gozo cuando se manifieste su gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL VALLE:
  grado: Memoria
  fecha: variable
  comun: Del Común de la Santísima Virgen María.
  himno: Brotó de ti la gracia y nuestra vida
  lectura2:
    autor: |-
      De las Disertaciones de san Sofronio, obispo
      (Disertación 2, Sobre la anunciación de la Santísima Virgen, 21-22. 26: PG 87, 3, 3242. 3250)
    texto: |-
      Alégrate, llena de gracia, el Señor es contigo. ¿Y qué puede haber más sublime que esta alegría, oh Virgen Madre? ¿O qué puede haber más excelente que esta gracia, que tú sola has alcanzado de Dios? ¿ O qué puede imaginarse más amable o espléndido que esta gracia? Nada puede equipararse a las maravillas que en ti vemos realizadas, nada hay que iguale la gracia que tú posees; todo lo demás, por excelente que sea, ocupa un lugar secundario y goza de una excelencia claramente inferior.
      El Señor es contigo; ¿quién, pues, se atreverá a competir contigo? De ti nacerá Dios; ¿quién, por tanto, no se reconocerá al momento inferior a ti y no admitirá de buen grado tu primacía y superioridad? Es por esto que, al contemplar tus eminentes prerrogativas, que superan las de cualquier otra creatura, te aclamo lleno de entusiasmo: Alégrate, llena de gracia, el Señor es contigo. Por ti ha venido la alegría, no sólo a los hombres, sino también a los mismos coros celestiales.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva y has hecho que Adán, que yacía postrado bajo el peso de la maldición, alcanzara, por ti, la bendición.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, por ti, la bendición del Padre ha brillado sobre los hombres, librándolos de la antigua maldición.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, por ti, alcanzan la salvación tus progenitores; pues has de dar a luz a aquel que les obtendrá la salvación divina.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, sin concurso de semilla, has producido aquel fruto que esparce la bendición sobre el orbe de la tierra, redimiéndola de la maldición que le hacía producir espinas y abrojos.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, siendo por condición natural una mujer como las demás, llegarás a ser en verdad Madre de Dios. Efectivamente, si el que ha de nacer de ti es, con toda verdad, el Dios hecho hombre, con toda razón eres llamada Madre de Dios, ya que realmente das a luz a Dios.
      Llevas en la intimidad de tu seno al mismo Dios, el cual mora en ti según la carne, y sale de ti como un esposo, trayendo a todos la alegría y comunicando a todos la luz divina.
      Pues en ti, oh Virgen, como en un cielo nítido y purísimo, ha puesto Dios su tienda; y saldrá de ti como el esposo de su alcoba; y, cual gigante que emprende su carrera, recorrerá el camino de su vida, provechosa en todo para todos, alcanzando con su giro del término del cielo hasta el opuesto confín, llenándolo todo de su calor divino y de su resplandor vivificante.
    titulo: POR MARÍA, LA BENDICIÓN DEL PADRE HA BRILLADO SOBRE LOS HOMBRES
  resp2:
    ref: S. Sofronio, Disertación 2
    vr:
    - - R
      - Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva. * Por ti la bendición del Padre ha brillado sobre los hombres. Aleluia.
    - - V
      - Por ti alcanzan la salvación tus progenitores.
    - - R
      - Por ti la bendición del Padre ha brillado sobre los hombres. Aleluia.
  oracion: Dios todopoderoso y eterno, que nos colocaste bajo el especial patrocinio de la santísima Virgen María, te pedimos que, gracias a la ayuda de la Virgen Inmaculada, podamos vencer a nuestros enemigos y llegar felizmente a ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSÉ OBRERO:
  grado: Memoria
  fecha: 05-01
  himno: A ti, José, patriarca y artesano
  lectura2:
    autor: |-
      De la Constitución pastoral Gáudium el spes, sobre la Iglesia en el mundo actual, del Concilio Vaticano segundo
      (Núms. 33-34)
    texto: |-
      El hombre, con su trabajo e ingenio, siempre se ha esforzado por desarrollar más y más su vida; pero hoy, gracias a la ciencia y la técnica, ha dilatado su dominio casi a la universalidad de la naturaleza, y lo acrecienta de día en día; y, con la ayuda principalmente de los múltiples intercambios entre las naciones, la familia humana poco a poco ha llegado a reconocerse y constituirse como una sola comunidad mundial. Con lo cual se consigue que muchos de los bienes que en otro tiempo el hombre esperaba principalmente de las fuerzas superiores hoy se los procure ya por su propio trabajo.
      Frente a un esfuerzo tan colosal, que ya envuelve a todo el género humano, se plantean ante los hombres múltiples interrogantes: ¿cuál es el sentido y valor de tanta laboriosidad?, ¿qué uso se ha de hacer de estas riquezas?, ¿a qué fin tiende el esfuerzo de individuos y sociedades? La Iglesia, que guarda el depósito de la palabra de Dios, de la que se deducen los principios del orden religioso y moral, sin que por ello posea siempre la inmediata respuesta a cada una de las preguntas, desea unir la luz de la revelación al saber de todos los hombres, para iluminar el camino recientemente emprendido por la humanidad.
      Una cosa hay cierta para los creyentes: que la actividad humana, individual y colectiva, es decir, el conjunto inmenso de los esfuerzos realizados por el hombre a lo largo de los siglos para mejorar su condición de vida, considerado en sí mismo, responde a la voluntad de Dios. El hombre, creado a imagen de Dios, recibió el mandato de someter la tierra y cuanto en ella se contiene, gobernar el mundo en la justicia y santidad y, reconociendo a Dios como creador de todo, orientar hacia él la propia persona y todo el universo: de este modo, sometiendo a sí todas las cosas, hacer admirable el nombre de Dios en el universo.
      Este destino vale también para los quehaceres más ordinarios. Hombres y mujeres, que mientras se ganan con el trabajo el sustento para sí y para la familia organizan su trabajo de modo que resulte provechoso para la sociedad, tienen derecho a pensar que con ese mismo trabajo complementan la obra del Creador, sirven al bien de sus hermanos y contribuyen de modo personal a que se cumplan los designios de Dios en la historia.
      Los cristianos, por consiguiente, lejos de pensar que las obras que consigue realizar el hombre con su talento y su capacidad se oponen al poder de Dios y que la creatura racional es como émula del Creador, cultivan más bien la persuasión de que las victorias del género humano son un signo de las grandezas de Dios y un fruto de su inefable designio.
      Por eso, cuanto más crece el poder del hombre, más aumenta su propia responsabilidad, singular o colectiva. De donde es evidente que el mensaje cristiano no aparta al hombre de la construcción del mundo, ni lo impulsa a descuidar el interés por sus semejantes; más bien lo obliga a sentir esta colaboración como un verdadero deber.
    titulo: LA ACTIVIDAD HUMANA EN EL MUNDO
  resp2:
