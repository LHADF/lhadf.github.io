  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder. Aleluia.
  - - R
    - Y las maravillas que realizó. Aleluia.
  lectura1:
    ref: De los Hechos de los apóstoles 5, 12-32
    texto: |-
      En aquellos días, los apóstoles hacían muchos signos y prodigios en medio del pueblo. Los fieles se reunían de común acuerdo en el pórtico de Salomón; los demás no se atrevían a juntárseles, aunque la gente se hacía lenguas de ellos; más aún, crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor. La gente sacaba los enfermos a la calle y los ponía en catres y camillas, para que, al pasar Pedro, su sombra por lo menos cayera sobre alguno. Mucha gente de los alrededores acudía a Jerusalén llevando enfermos y poseídos de espíritu inmundo; y todos se curaban.
      Entonces el sumo sacerdote y los de su partido —la secta de los saduceos—, llenos de coraje, mandaron prender a los apóstoles y meterlos en la cárcel común. Pero por la noche el ángel del Señor les abrió las puertas y los sacó fuera, diciéndoles:
      «Id al templo y explicadle allí al pueblo este modo de vida.» Entonces ellos entraron en el templo al amanecer y se pusieron a enseñar. Llegó entre tanto el sumo sacerdote con los de su partido, convocaron el Consejo y el pleno del senado israelita y mandaron por los presos a la cárcel. Fueron los guardias, pero no los encontraron en la celda, y volvieron a informar:
      «Hemos encontrado la cárcel cerrada, con las barras echadas, y a los centinelas guardando las puertas; pero al abrir no encontramos a nadie dentro.»
      El comisario del templo y los sumos sacerdotes no atinaban a explicarse qué había pasado con los presos.
      Uno se presentó avisando:
      «Los hombres que metisteis en la cárcel están ahí en el templo y siguen enseñando al pueblo.»
      El comisario salió con los guardias y se los trajo, sin emplear la fuerza, por miedo a que el pueblo los apedrease. Los guardias condujeron a los apóstoles a presencia del Consejo, y el sumo sacerdote les interrogó:
      «¿No os habíamos prohibido expresamente enseñar en nombre de ése? En cambio, habéis llenado Jerusalén con vuestra enseñanza y queréis hacernos responsables de la sangre de ese hombre.»
      Pedro y los apóstoles replicaron:
      «Hay que obedecer a Dios antes que a los hombres. El Dios de nuestros padres resucitó a Jesús, a quien vosotros matasteis colgándole de un madero. La diestra de Dios lo exaltó haciéndolo jefe y salvador, para otorgar a Israel la conversión, el perdón de los pecados. Testigos de esto somos nosotros y el Espíritu Santo, que Dios da a los que le obedecen.»
    titulo: LOS APÓSTOLES EN LA IGLESIA PRIMITIVA
  resp1:
    ref: Cf. Hch 4, 33. 31b
    vr:
    - - R
      - Los apóstoles daban testimonio de la resurrección del Señor con mucho valor. * Todos eran muy bien vistos. Aleluia.
    - - V
      - Los llenó a todos el Espíritu Santo y anunciaban con valentía la palabra de Dios.
    - - R
      - Todos eran muy bien vistos. Aleluia.
  lectura2:
    autor: |-
      Del Tratado de Tertuliano, presbítero, Sobre la prescripción de los herejes
      (Cap. 20, 1-9; 21, 3; 22, 8-10: CCL 1, 201-204)
    texto: |-
      Cristo Jesús, nuestro Señor, durante su vida terrena, iba enseñando por sí mismo quién era él, qué había sido desde siempre, cuál era el designio del Padre que él realizaba en el mundo, cuál ha de ser la conducta del hombre para que sea conforme a este mismo designio; y lo enseñaba unas veces abiertamente ante el pueblo, otras aparte a sus discípulos, principalmente a los doce que había elegido para que estuvieran junto a él, y a los que había destinado como maestros de las naciones.
      Y así, después de la defección de uno de ellos, cuando estaba para volver al Padre, después de su resurrección, mandó a los otros once que fueran por el mundo a adoctrinar a los hombres y bautizarlos en el nombre del Padre, del Hijo y del Espíritu Santo.
      Los apóstoles —palabra que significa «enviados»—, después de haber elegido a Matías, echándolo a suertes, para sustituir a Judas y completar así el número de doce (apoyados para esto en la autoridad de una profecía contenida en un salmo de David), y después de haber obtenido la fuerza del Espíritu Santo para hablar y realizar milagros, como lo había prometido el Señor, dieron primero en Judea testimonio de la fe en Jesucristo e instituyeron allí Iglesias, después fueron por el mundo para proclamar a las naciones la misma doctrina y la misma fe.
      De modo semejante, continuaron fundando Iglesias en cada población, de manera que las demás Iglesias fundadas posteriormente, para ser verdaderas Iglesias, tomaron y siguen tomando de aquellas primeras Iglesias el retoño de su fe y la semilla de su doctrina. Por esto también aquellas Iglesias son consideradas apostólicas, en cuanto que son descendientes de las Iglesias apostólicas.
      Es norma general que toda cosa debe ser referida a su origen. Y, por esto, toda la multitud de Iglesias son una con aquella primera Iglesia fundada por los apóstoles, de la que proceden todas las otras. En este sentido son todas primeras y todas apostólicas, en cuanto que todas juntas forman una sola. De esta unidad son prueba la comunión y la paz que reinan entre ellas, así como su mutua fraternidad y hospitalidad. Todo lo cual no tiene otra razón de ser que su unidad en una misma tradición apostólica.
      El único medio seguro de saber qué es lo que predicaron los apóstoles, es decir, qué es lo que Cristo les reveló, es el recurso a las Iglesias fundadas por los mismos apóstoles, las que ellos adoctrinaron de viva voz y, más tarde, por carta.
      El Señor había dicho en cierta ocasión: Tendría aún muchas cosas que deciros, pero no estáis ahora en disposición de entenderlas; pero añadió a continuación: Cuando venga el Espíritu de verdad, os conducirá a la verdad completa; con estas palabras demostraba que nada habían de ignorar, ya que les prometía que el Espíritu de verdad les daría el conocimiento de la verdad completa. Y esta promesa la cumplió, ya que sabemos por los Hechos de los apóstoles que el Espíritu Santo bajó efectivamente sobre ellos.
    titulo: LA PREDICACIÓN APOSTÓLICA
  resp2:
    ref: Jn 12, 21-22; Rm 9, 26
    vr:
    - - R
      - 'Se acercaron a Felipe algunos gentiles y le hicieron este ruego: «Señor, queremos ver a Jesús.» * Felipe fue a decírselo a Andrés; y en seguida Andrés y Felipe se lo dijeron a Jesús. Aleluia.'
    - - V
      - 'Ahí donde se dijo: «No sois mi pueblo», serán llamados «hijos del Dios vivo».'
    - - R
      - Felipe fue a decírselo a Andrés; y en seguida Andrés y Felipe se lo dijeron a Jesús. Aleluia.
  te_deum: true
  oracion: Señor, tú que nos alegras todos los años con esta fiesta de los santos apóstoles Felipe y Santiago, concédenos, por su intercesión, que, viviendo ahora íntimamente unidos a la muerte y resurrección de tu Hijo, podamos, en la eternidad, contemplar la gloria de tu rostro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE LUJÁN, Patrona de la República Argentina:
  grado: Solemnidad
  fecha: 05-08
  comun: Del Común de la Santísima Virgen María.
  himno: Tú eres toda hermosa
  salmodia:
  - ant: Pongo hostilidad entre ti y la mujer, entre tu linaje y el suyo. Aleluia.
    salmo: salmo-23
  - ant: El Señor te ha bendecido, santa Virgen María, más que a todas las mujeres de la tierra. Aleluia.
    salmo: salmo-45
  - ant: La santidad, Señor, es el adorno de tu casa. Aleluia.
    salmo: salmo-86
  versiculo:
  - - V
    - Dichosa tú, María, que has creído. Aleluia.
  - - R
    - Porque lo que te ha dicho el Señor se cumplirá. Aleluia.
  lectura1:
    ref: De la carta a los Romanos 5, 12-21
    texto: |-
      Hermanos: Así como por un solo hombre entró el pecado en el mundo y, por el pecado, la muerte, y, de este modo, la muerte pasó a todos los hombres, dado que todos han pecado...
      (Porque ya antes de la promulgación de la ley existía el pecado en el mundo, y sin embargo no puede imputarse pecado si no hay ley; vemos, empero, que, de hecho, la muerte reinó ya desde Adán a Moisés sobre todos los que pecaron, aun cuando su transgresión no fue en las mismas condiciones en que pecó Adán, el cual era figura del que había de venir.
      Sin embargo, con el don no sucedió como con el delito, pues, si por el delito de uno solo murió la multitud, ¡con cuánta mayor profusión, por la gracia de un solo hombre, Jesucristo, se derramó sobre todos la bondad y el don de Dios! Ni fueron los efectos de este don como los efectos del pecado de aquel único hombre que pecó, porque la sentencia que llevó a la condenación vino por uno solo, en cambio, el don, partiendo de muchas transgresiones, lleva a la justificación.)
      ...Así pues (decía), si, por la falta de uno solo, la muerte estableció su reinado, también, con mucha mayor razón, por causa de uno solo, de Jesucristo, reinarán en la vida los que reciben la sobreabundancia de la gracia y el don de la justificación.
      Por consiguiente, así como el delito de uno solo atrajo sobre todos los hombres la condenación, así también la obra de justicia de uno solo procura a todos la justificación que da la vida. Y como por la desobediencia de un solo hombre todos los demás quedaron constituidos pecadores, así también por la obediencia de uno solo todos quedarán constituidos justos.
      La ley, ciertamente, fue ocasión de que se multiplicasen los delitos, pero donde abundó el pecado sobreabundó la gracia, para que así como reinó el pecado produciendo la muerte, así también reine la gracia dándonos vida eterna por Jesucristo, Señor nuestro.
    titulo: EL VIEJO Y EL NUEVO ADÁN
  resp1:
    ref: Rm 5, 12; Lc 1, 30; cf. Sal 114, 8; cf. 17, 19
    vr:
    - - R
      - Por un solo hombre entró el pecado en el mundo y, por él, todos han pecado. Pero tú * no temas, María, porque has hallado gracia a los ojos de Dios. Aleluia.
    - - V
      - El Señor arrancó tu alma de la muerte, y fue tu apoyo contra tu adversario.
    - - R
      - No temas, María, porque has hallado gracia a los ojos de Dios. Aleluia.
  lectura2:
    autor: |-
      De la relación del mercedario fray Pedro Nolasco de Santa María
      (Año 1737: Archivo de la Basílica nacional de Luján)
    texto: |-
      En aquel tiempo que el reino de Portugal y el de Castilla se gobernaban por una Corona, con el mucho comercio que tenía esta ciudad con el Brasil, un portugués, vecino de Córdoba, que fundó la hacienda de Sumampa, pidió a un paisano suyo le trajese del Brasil una imagen pequeña de la Concepción, para colocar en una capilla que estaba fabricando en dicha su hacienda; y con este encargue le remitieron a un mismo tiempo dos, las cuales, encajonadas, cargó en su carretón. Y llegando al río de Luján hizo noche en lo de un paisano suyo, llamado fulano Rosendo.
      Queriendo proseguir su viaje, uncidos los bueyes por la mañana, no pudieron mover dicho carretón; por cuya causa le volvieron a descargar, y entonces le movieron los bueyes sin alguna dificultad. Y admirados todos de este prodigio, le preguntaron qué llevaba en la carga, que allí se había descargado, que pudiese servir de impedimento a su viaje; y él respondió que no llevaba cosa de impedimento, antes sí dos imágenes para darles culto.
      Y determinaron se embarcase en el carretón los dos cajoncitos de las imágenes e hiciesen caminar el carretón; y se hallaron con el impedimento primero; a que empezó a exclamar el devoto portugués a la Virgen Santísima que bien sabía el efecto, para qué la llevaba, que era para colocarla en la capilla que en su nombre tenía fabricada; y, persuadiéndole a que sacase él un cajón y dejase el otro, probaron a que caminase el carretón, y no se pudo mover de su lugar; volvieron a hacer la diligencia de sacar el cajón que había quedado y cargar el que habían bajado, y entonces se movió dicho carretón sin impedimento alguno; quedando el dueño muy contento con la imagen que se llevó, dejando la otra en el paraje, donde le mostraba quererse quedar.
      Ésta es la imagen de Nuestra Señora de Luján, que estuvo muchos años en lo de dicho Rosendo, en un oratorio muy corto, y muy venerada la imagen de todo el pago. Y dicho Rosendo dedicó un negro, llamado Manuel, al culto de dicha imagen, quien cuidaba de la lámpara de dicha Señora, que incesantemente ardía.
      Y con el transcurso del tiempo y muerto el dueño de aquella estancia vino a quedar en casi despoblado. Y por ser mucha la frecuencia de devotos, que acudían movidos de sus muchos milagros, y no tener en dicha estancia dónde albergarse, pidió una señora, doña Ana de Matos, le diesen dicha imagen que la llevaría a su hacienda, que estaba en dicho río y colocóla en un oratorio; y con la asistencia y fervor del capellán don Pedro Montalbo y del mayordomo, don Manuel Casco de Mendoza, se enfervorizó la devoción de todo el pago y aun de las provincias remotas y se pusieron a fabricar la capilla, que hasta hoy permanece.
    titulo: ORIGEN DE LA ADVOCACIÓN DE NUESTRA SEÑORA DE LUJAN
  resp2:
    ref: ''
    vr:
