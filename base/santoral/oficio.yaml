  te_deum: true
  oracion: Atiende propicio, Señor, a tu pueblo que con júbilo festivo celebra la solemnidad de la Virgen María, Madre de la Divina Providencia, y concédele que, bajo el glorioso patrocinio de tan excelsa madre, con su caridad fraterna promueva una sociedad más humana y a la vez sea edificador y testigo de tu verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA PRESENTACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: 11-21
  comun: Del Común de la Santísima Virgen María -
  himno: Salve, madre de misericordia
  lectura2:
    autor: |-
      De los sermones de san Agustín, obispo
      (Sermón 25, 7-8: PL 46, 937-938)
    texto: |-
      Os pido que atendáis a lo que dijo Cristo el Señor, extendiendo la mano sobre sus discípulos: Estos son mi madre y mis hermanos; y el que hace la voluntad de mi Padre, que me ha enviado, es mi hermano y mi hermana y mi madre. ¿Por ventura no cumplió la voluntad del Padre la Virgen María, ella, que dio fe al mensaje divino, que concibió por su fe, que fue elegida para que de ella naciera entre los hombres el que había de ser nuestra salvación, que fue creada por Cristo antes que Cristo fuera creado en ella? Ciertamente, cumplió santa María con toda perfección, la voluntad del Padre, y por esto es más importante su condición de discípula de Cristo que la de madre de Cristo, es más dichosa por ser discípula de Cristo que por ser madre de Cristo. Por esto María fue bienaventurada, porque, antes de dar a luz a su maestro, lo llevó en su seno.
      Mira si no es tal como digo. Pasando el Señor, seguido de las multitudes y realizando milagros, dijo una mujer: Dichoso el seno que te llevó. Y el Señor, para enseñarnos que no hay que buscar la felicidad en las realidades de orden material, ¿qué es lo que respondió?: Dichosos más bien los que escuchan la palabra de Dios y la cumplen. De ahí que María es dichosa también porque escuchó la palabra de Dios y la cumplió; llevó en su seno el cuerpo de Cristo, pero más aún guardó en su mente la verdad de Cristo. Cristo es la verdad, Cristo tuvo un cuerpo: en la mente de María estuvo Cristo, la verdad; en su seno estuvo Cristo hecho carne, un cuerpo. Y es más importante lo que está en la mente que lo que se lleva en el seno.
      María fue santa, María fue dichosa, pero más importante es la Iglesia que la misma Virgen María. ¿En qué sentido? En cuanto que María es parte de la Iglesia, un miembro santo, un miembro excelente, un miembro supereminente, pero un miembro de la totalidad del cuerpo. Ella es parte de la totalidad del cuerpo, y el cuerpo entero es más que uno de sus miembros. La cabeza de este cuerpo es el Señor, y el Cristo total lo constituyen la cabeza y el cuerpo. ¿Qué más diremos? Tenemos, en el cuerpo de la Iglesia, una cabeza divina, tenemos al mismo Dios por cabeza.
      Por tanto, amadísimos hermanos, atended a vosotros mismos: también vosotros sois miembros de Cristo, cuerpo de Cristo. Así lo afirma el Señor, de manera equivalente, cuando dice: Estos son mi madre y mis hermanos. ¿Cómo seréis madre de Cristo? El que escucha y el que hace la voluntad de mi Padre celestial es mi hermano y mi hermana y mi madre. Podemos entender lo que significa aquí el calificativo que nos da Cristo de «hermanos» y «hermanas»: la herencia celestial es única, y, por tanto, Cristo, que siendo único no quiso estar solo, quiso que fuéramos herederos del Padre y coherederos suyos.
    titulo: DIO FE AL MENSAJE DIVINO Y CONCIBIÓ POR SU FE
  resp2:
    ref: Is 61, 10; Lc 1, 46-47
    vr:
    - - R
      - 'Desbordo de gozo en el Señor, y me alegro con mi Dios: * porque me ha vestido un traje de gala, como a una novia que se adorna con sus joyas.'
    - - V
      - Proclama mi alma la grandeza del Señor, se alegra mi espíritu en Dios mi salvador.
    - - R
      - Porque me ha vestido un traje de gala, como a una novia que se adorna con sus joyas.
  oracion: Señor, Dios nuestro, al celebrar esta festividad de la Santísima Virgen María, te pedimos, por su intercesión, nos concedas también a nosotros participar de la plenitud de tu gracia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRO SEÑOR JESUCRISTO, REY UNIVERSAL:
  grado: Solemnidad
  fecha: variable
  himno: Porque eres Hijo de Dios
  salmodia:
  - ant: Yo he sido establecido Rey en Sión, su monte santo, y he proclamado sus decretos.
    salmo: salmo-2
  - ant: Que se postren ante él todos los reyes, y que todos los pueblos le sirvan.
    salmo: salmo-71-i
  - ant: Que él sea la bendición de todos los pueblos, y lo proclamen dichoso todas las razas de la tierra.
    salmo: salmo-71-ii
  versiculo:
  - - V
    - Te hago luz de las naciones.
  - - R
    - Para que mi salvación alcance hasta el confín de la tierra.
  lectura1:
    ref: Del libro del Apocalipsis 1, 4-6. 10. 12-18; 2, 26. 28; 3, 5b. 12. 20-21
    texto: |-
      Gracia y paz a vosotros de parte de aquel que es, que era y que será; de parte de los siete espíritus que están ante su trono; y de parte de Jesucristo, el testigo veraz, el primogénito de entre los muertos, el príncipe de los reyes de la tierra.
      Y a aquel que nos ama, que nos ha lavado de nuestros pecados con su sangre, que ha hecho de nosotros un reino y sacerdotes para Dios, su Padre: A él la gloria y el poder por los siglos de los siglos. Amén.
      Un domingo fui arrebatado en espíritu y oí tras de mí una gran voz como de trompeta. Me volví para ver qué voz era la que me hablaba y, al volverme, vi siete candelabros de oro y, en medio de ellos, una figura como de Hijo de hombre, vestido de una túnica talar y ceñido el pecho con un ceñidor de oro. Sus cabellos y su barba eran blancos como la blanca lana o como la nieve, sus ojos eran como llamas de fuego, sus pies parecían de metal precioso acrisolado en el horno y su voz era como el estruendo de muchas aguas. Tenía en su diestra siete estrellas y de su boca salía una aguda espada de dos filos; su semblante era como el sol cuando brilla con toda su fuerza. Así que lo vi, caí como muerto a sus pies. Él puso su diestra sobre mí y me dijo:
      «Yo soy el primero y el último, el que vive. Estaba muerto, pero ahora vivo por los siglos de los siglos, y tengo las llaves de la muerte y del hades.
      Al que salga vencedor y me sea fiel hasta el fin le daré potestad sobre las naciones, como la he recibido yo de mi Padre, y le daré, además, el lucero del alba. No borraré jamás su nombre del libro de la vida, sino que lo proclamaré en presencia de mi Padre y de sus ángeles. Lo haré columna en el templo de mi Dios, y ya nunca saldrá fuera, y sobre él escribiré el nombre de mi Dios y el nombre de la ciudad de mi Dios, de la nueva Jerusalén, que baja del cielo desde mi Dios, y mi nombre nuevo.
      Mira que estoy a la puerta y llamo; si alguno escucha mi voz y me abre la puerta entraré en su casa, cenaré con él y él conmigo. Al vencedor lo sentaré en mi trono, junto a mí; lo mismo que yo, cuando vencí, me senté en el trono de mi Padre, junto a él.»
    titulo: VISIÓN DEL HIJO DEL HOMBRE EN SU MAJESTAD
  resp1:
    ref: Mc 13, 26-27; Sal 97, 9
    vr:
    - - R
      - Verán al Hijo del hombre venir entre nubes con gran poder y gloria, y entonces enviará a sus ángeles, * y reunirá a sus elegidos de los cuatro puntos cardinales y desde el extremo de la tierra hasta el extremo del cielo.
    - - V
      - Regirá el orbe con justicia y los pueblos con rectitud.
    - - R
      - Y reunirá a sus elegidos de los cuatro puntos cardinales y desde el extremo de la tierra hasta el extremo del cielo.
  lectura2:
    autor: |-
      Del Opúsculo de Orígenes, presbítero, Sobre la oración
      (Cap. 25: PG 11, 495-499)
    texto: |-
      Si, como dice nuestro Señor y Salvador, el reino de Dios no ha de venir espectacularmente, ni dirán: «Vedlo aquí o vedlo allí», sino que el reino de Dios está dentro de nosotros, pues cerca está la palabra, en nuestra boca y en nuestro corazón, sin duda cuando pedimos que venga el reino de Dios lo que pedimos es que este reino de Dios, que está dentro de nosotros, salga afuera, produzca fruto y se vaya perfeccionando. Efectivamente, Dios reina ya en cada uno de los santos, ya que éstos se someten a su ley espiritual, y así Dios habita en ellos como en una ciudad bien gobernada. En el alma perfecta está presente el Padre, y Cristo reina en ella junto con el Padre, de acuerdo con aquellas palabras del Evangelio: Vendremos a fijar en él nuestra morada.
      Este reino de Dios que está dentro de nosotros llegará, con nuestra cooperación, a su plena perfección cuando se realice lo que dice el Apóstol, esto es, cuando Cristo, una vez sometidos a él todos sus enemigos, entregue el reino a Dios Padre, para que Dios sea todo en todo. Por esto, rogando incesantemente con aquella actitud interior que se hace divina por la acción del Verbo, digamos a nuestro Padre que está en los cielos: Santificado sea tu nombre, venga tu reino.
      Con respecto al reino de Dios, hay que tener también esto en cuenta: del mismo modo que no tiene que ver la justificación con la impiedad, ni hay nada de común entre la luz y las tinieblas, ni puede haber armonía entre Cristo y Belial, así tampoco pueden coexistir el reino de Dios y el reino del pecado.
      Por consiguiente, si queremos que Dios reine en nosotros, procuremos que de ningún modo continúe el pecado reinando en nuestro cuerpo mortal, antes bien, mortifiquemos las pasiones de nuestro hombre terrenal y fructifiquemos por el Espíritu; de este modo Dios se paseará por nuestro interior como por un paraíso espiritual y reinará en nosotros él solo con su Cristo, el cual se sentará en nosotros a la derecha de aquella virtud espiritual que deseamos alcanzar: se sentará hasta que todos sus enemigos que hay en nosotros sean puestos por estrado de sus pies, y sean reducidos a la nada en nosotros todos los principados, todos los poderes y todas las fuerzas.
      Todo esto puede realizarse en cada uno de nosotros, y el último enemigo, la muerte, puede ser reducido a la nada, de modo que Cristo diga también en nosotros: ¿Dónde está, muerte, tu victoria? ¿Dónde está, muerte, tu aguijón? Ya desde ahora este nuestro ser, corruptible, debe revestirse de santidad y de incorrupción, y este nuestro ser, mortal, debe revestirse de la inmortalidad del Padre, después de haber reducido a la nada el poder de la muerte, para que así, reinando Dios en nosotros, comencemos ya a disfrutar de los bienes de la regeneración y de la resurrección.
    titulo: VENGA TU REINO
  resp2:
    ref: Ap 11, 15; Sal 21, 28-29
    vr:
    - - R
      - Ha llegado a este mundo el reino de nuestro Dios y de su Ungido, * y reinará por los siglos de los siglos.
    - - V
      - En su presencia se postrarán las familias de los pueblos, porque del Señor es el reino.
    - - R
      - Y reinará por los siglos de los siglos.
  oracion: Dios todopoderoso y eterno, que quisiste fundar todas las cosas en tu Hijo muy amado, rey del universo, haz que toda creatura, libertada de toda esclavitud, sirva a tu majestad y te alabe eternamente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA CECILIA, virgen y mártir:
  grado: Memoria
  fecha: 11-22
  comun: Del Común de un mártir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De los Comentarios de san Agustín, obispo, sobre los salmos
      (Salmo 32, sermón 1, 7-8: CCL 38, 253-254)
    texto: |-
      Dad gracias al Señor con la cítara, tocad en su honor el arpa de diez cuerdas; cantadle un cántico nuevo. Despojaos de lo antiguo, ya que se os invita al cántico nuevo. Nuevo hombre, nuevo Testamento, nuevo cántico. El nuevo cántico no responde al hombre antiguo. Sólo pueden aprenderlo los hombres nuevos, renovados de su antigua condición por obra de la gracia y pertenecientes ya al nuevo Testamento, que es el reino de los cielos. Por él suspira todo nuestro amor y canta el cántico nuevo. Pero es nuestra vida, más que nuestra voz, la que debe cantar el cántico nuevo.
      Cantadle un cántico nuevo, cantadle con maestría. Cada uno se pregunta cómo cantará a Dios. Cántale, pero hazlo bien. Él no admite un canto que ofenda sus oídos. Cantad bien, hermanos. Si se te pide que cantes para agradar a alguien entendido en música, no te atreverás a cantarle sin la debida preparación musical, por temor a desagradarle, ya que él, como perito en la materia, descubrirá unos defectos que pasarían desapercibidos a otro cualquiera. ¿Quién, pues, se prestará a cantar con maestría para Dios, que sabe juzgar del cantor, que sabe escuchar con oídos críticos? ¿Cuándo podrás prestarte a cantar con tanto arte y maestría que en nada desagrades a unos oídos tan perfectos?
      Mas he aquí que él mismo te sugiere la manera cómo has de cantarle: no te preocupes por las palabras, como si éstas fuesen capaces de expresar lo que deleita a Dios. Canta con júbilo. Éste es el canto que agrada a Dios, el que se hace con júbilo. ¿Qué quiere decir cantar con júbilo? Darse cuenta de que no podemos expresar con palabras lo que siente el corazón. En efecto, los que cantan, ya sea en la siega, ya en la vendimia o en algún otro trabajo intensivo, empiezan a cantar con palabras que manifiestan su alegría, pero luego es tan grande la alegría que los invade que, al no poder expresarla con palabras, prescinden de ellas y acaban en un simple sonido de júbilo.
      El júbilo es un sonido que indica la incapacidad de expresar lo que siente el corazón. Y este modo de cantar es el más adecuado cuando se trata del Dios inefable. Porque, si es inefable, no puede ser traducido en palabras. Y, si no puedes traducirlo en palabras y, por otra parte, no te es lícito callar, lo único que puedes hacer es cantar con júbilo. De este modo, el corazón se alegra sin palabras y la inmensidad del gozo no se ve limitada por unos vocablos. Cantadle con maestría y con júbilo.
    titulo: CANTAD A DIOS CON MAESTRÍA Y CON JÚBILO
  resp2:
    ref: Sal 70, 8. 23; 9 A, 3
    vr:
    - - R
      - Llena está mi boca de tu alabanza y de tu gloria, todo el día; * te aclamarán mis labios, Señor.
    - - V
      - Me alegro y exulto contigo y toco en honor de tu nombre, ¡oh Altísimo!
    - - R
      - Te aclamarán mis labios, Señor.
  oracion: Acoge con bondad nuestras súplicas, Señor, y, por intercesión de santa Cecilia, dígnate escucharnos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS ANDRÉS DUNG-LAC, presbítero, y compañeros, mártires:
  grado: Memoria
  fecha: 11-24
  comun: Del Común de varios mártires.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la carta de san Pablo Le-Bao-Tinh a los alumnos del seminario de Ke-Vinh, enviada el año mil ochocientos cuarenta y tres.
      (A. Launay, Le clergé tonkinois et ses pretres martyrs, MEP, Paris 1925, pp. 80-83)
    texto: |-
      Yo, Pablo, encarcelado por el nombre de Cristo, os quiero explicar las tribulaciones en que me veo sumergido cada día, para que, enfervorizados en el amor a Dios, alabéis conmigo al Señor, porque es eterna su misericordia. Esta cárcel es un verdadero infierno: a los crueles suplicios de toda clase, como son grillos, cadenas de hierro y ataduras, hay que añadir el odio, las venganzas, las calumnias, palabras indecentes, peleas, actos perversos, juramentos injustos, maldiciones y, finalmente, angustias y tristeza. Pero Dios, que en otro tiempo libró a los tres jóvenes del horno de fuego, está siempre conmigo y me libra de estas tribulaciones y las convierte en dulzura, porque es eterna su misericordia.
      En medio de estos tormentos, que aterrorizarían a cualquiera, por la gracia de Dios estoy lleno de gozo y alegría, porque no estoy solo, sino que Cristo está conmigo.
      Él, nuestro maestro, aguanta todo el peso de la cruz, dejándome a mí solamente la parte más pequeña e insignificante. Él, no sólo es espectador de mi combate, sino que toma parte en él, vence y lleva a feliz término toda la lucha. Por esto en su cabeza lleva la corona de la victoria, de cuya gloria participan también sus miembros.
      ¿Cómo resistir este espectáculo, viendo cada día cómo los emperadores, los mandarines y sus cortesanos blasfeman tu santo nombre, Señor, que te sientas sobre querubines y serafines? ¡Mira, tu cruz es pisoteada por los paganos! ¿Dónde está tu gloria? Al ver todo esto, prefiero, encendido en tu amor, morir descuartizado, en testimonio de tu amor.
      Muestra, Señor, tu poder, sálvame y dame tu apoyo, para que la fuerza se manifieste en mi debilidad y sea glorificada ante los gentiles, ya que, si llegara a vacilar en el camino, tus enemigos podrían levantar la cabeza con soberbia.
      Queridos hermanos, al escuchar todo esto, llenos de alegría, tenéis que dar gracias incesantes a Dios, de quien procede todo bien; bendecid conmigo al Señor, porque es eterna su misericordia. Proclame mi alma la grandeza del Señor, se alegre mi espíritu en Dios, mi salvador; porque ha mirado la humillación de su siervo y desde ahora me felicitarán todas las generaciones futuras, porque es eterna su misericordia.
      Alabad al Señor, todas las naciones, aclamadlo, todos los pueblos, porque lo débil del mundo lo ha escogido Dios para humillar el poder, y lo despreciable, lo que no cuenta, lo ha escogido Dios para humillar lo elevado. Por mi boca y mi inteligencia humilla a los filósofos, discípulos de los sabios de este mundo, porque es eterna su misericordia.
      Os escribo todo esto para que se unan vuestra fe y la mía. En medio de esta tempestad echo el ancla hasta el trono de Dios, esperanza viva de mi corazón.
      En cuanto a vosotros, queridos hermanos, corred de manera que ganéis el premio, haced que la fe sea vuestra coraza y empuñad las armas de Cristo con la derecha y con la izquierda, como enseña san Pablo, mi patrono. Más os vale entrar tuertos o mancos en la vida que ser arrojados fuera con todos los miembros.
      Ayudadme con vuestras oraciones para que pueda combatir como es de ley, que pueda combatir bien mi combate y combatirlo hasta el final, corriendo así hasta alcanzar felizmente la meta; en esta vida ya no nos veremos, pero hallaremos la felicidad en el mundo futuro, cuando, ante el trono del Cordero inmaculado, cantaremos juntos sus alabanzas, rebosantes de alegría por el gozo de la victoria para siempre. Amén.
    titulo: LA PARTICIPACIÓN DE LOS MÁRTIRES EN LA VICTORIA DE CRISTO CABEZA
  resp2:
    ref: Cf. Hb 12, 1-3
    vr:
    - - R
      - 'Corramos en la carrera que nos toca, sin retirarnos, * fijos los ojos en el que inició y completa nuestra fe: Jesús.'
    - - V
      - Recordad al que soportó la oposición de los pecadores, y no os canséis ni perdáis el ánimo.
    - - R
      - 'Fijos los ojos en el que inició y completa nuestra fe: Jesús.'
  oracion: Oh Dios, fuente y origen de toda paternidad, tú hiciste que los santos mártires Andrés y sus compañeros fueran fieles a la cruz de Cristo, con una fidelidad que llegó hasta el derramamiento de su sangre; concédenos, por su intercesión, que difundamos tu amor entre nuestros hermanos y que nos llamemos y seamos de verdad hijos tuyos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANDRÉS APÓSTOL:
  grado: Fiesta
  fecha: 11-30
  comun: Del Común de Apóstoles.
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder.
  - - R
    - Y las maravillas que realizó.
  lectura1:
    ref: De la primera carta del apóstol san Pablo a los Corintios 1, 18—2, 5
    texto: |-
      Hermanos: El mensaje de la cruz es necedad para los que están en vías de perdición; pero para los que están en vías de salvación —para nosotros— es fuerza de Dios. Dice la escritura: «Destruiré la sabiduría de los sabios, frustraré la sagacidad de los sagaces.» ¿Dónde está el sabio? ¿Dónde está el letrado? ¿Dónde esta el sofista de nuestros tiempos? ¿No ha convertido Dios en necedad la sabiduría del mundo?
      Y, como en la sabiduría de Dios el mundo no lo conoció por el camino de la sabiduría, quiso Dios valerse de la necedad de la predicación, para salvar a los creyentes. Porque los judíos exigen signos, los griegos buscan sabiduría. Pero nosotros predicamos a Cristo crucificado: escándalo para los judíos, necedad para los gentiles; pero para los llamados a Cristo —judíos o griegos—: fuerza de Dios y sabiduría de Dios. Pues lo necio de Dios es más sabio que los hombres; y lo débil de Dios es más fuerte que los hombres.
      Fijaos en vuestra asamblea: no hay en ella muchos sabios en lo humano, ni muchos poderosos, ni muchos nobles; todo lo contrario: lo necio del mundo lo ha escogido Dios para confundir a los sabios. Y lo débil del mundo lo ha escogido Dios para humillar el poder. Aún más: ha escogido la gente baja del mundo, lo despreciable, lo que no cuenta, para anular a lo que cuenta; de modo que nadie pueda gloriarse en presencia del Señor. Por él vosotros sois en Cristo Jesús, en este Cristo que Dios ha hecho para nosotros sabiduría, justicia, santificación y redención. Y así —como dice la Escritura— «el que se gloría, que se gloríe en el Señor».
      Cuando vine a vosotros, hermanos, a anunciaros el testimonio de Dios, no lo hice con sublime elocuencia ni sabiduría, pues nunca entre vosotros me precié de saber cosa alguna, sino a Jesucristo, y éste crucificado. Me presenté a vosotros débil y temeroso; mi palabra y mi predicación no fue con persuasiva sabiduría humana, sino en la manifestación y el poder del Espíritu, para que vuestra fe no se apoye en la sabiduría de los hombres, sino en el poder de Dios.
    titulo: LOS APÓSTOLES PREDICAN LA CRUZ
  resp1:
    ref: Cf. Mt 4, 18. 19
    vr:
    - - R
      - 'Caminando por la ribera del mar de Galilea, vio el Señor a Pedro y a Andrés, que estaban echando la red en el mar, y los llamó: * «Venid en pos de mí, y yo os haré pescadores de hombres.»'
    - - V
      - 'Pues eran pescadores, y les dijo:'
    - - R
      - «Venid en pos de mí, y yo os haré pescadores de hombres.»
  lectura2:
    autor: |-
      De las Homilías de san Juan Crisóstomo, obispo, sobre el evangelio de san Juan
      (Homilía 19, 1: PG 59, 120-121)
    texto: |-
      Andrés, después de haber estado con Jesús y haber aprendido de él muchas cosas, no guardó para sí este tesoro, sino que se apresuró a acudir a su hermano, para hacerle participe de su dicha. Fijémonos en lo que dice a su hermano: «Hemos encontrado al Mesías» (traducido, quiere decir «Cristo»). ¿Te das cuenta cómo empieza, ya desde este momento, a enseñar lo que en breve tiempo había aprendido? Con ello demuestra la eficacia del Maestro, que tan convencidos los había dejado, y su propio interés y diligencia, manifestada ya desde el primer momento. Este mensaje, en efecto, es propio del alma que anhela ardientemente la llegada del Señor, que espera su venida del cielo, que se llena de gozo con su aparición y que se apresura a anunciar a los demás algo tan grande. Ésta es la prueba del verdadero y sincero amor fraternal, el mutuo intercambio de bienes espirituales.
      También es digna de notar la docilidad y prontitud de ánimo de Pedro. Al momento, sin dilación, acude a Jesús. Y lo presentó —dice— a Jesús. Pero no debemos extrañarnos de esta facilidad de Pedro, que acude sin previo examen. Lo más verosímil es que su hermano le explicara todas estas cosas con detalle; pero es que los evangelistas lo explican siempre todo de manera resumida, por razón de brevedad. Por lo demás, tampoco dice que hubiese creído al instante, sino: Y lo presentó a Jesús, para ponerlo en sus manos y para que fuese él quien le enseñase; pues estaba ahí en calidad de un discípulo más y a eso venía.
      En efecto, si Juan Bautista —cuando dijo: Es el Cordero, y: Bautiza con el Espíritu— dejó a Cristo la ulterior explicación de estas palabras, con mayor razón lo hizo Andrés, ya que él no se consideraba capaz de explicarlo todo, y por esto condujo a su hermano a la fuente de la luz, a la que éste acudió con prisa y alegría, sin perder un instante.
    titulo: HEMOS ENCONTRADO AL MESÍAS
  resp2:
    ref: ''
    vr:
    - - R
      - Tan pronto como san Andrés oyó la voz del Señor, que le llamaba, dejó las redes, con las cuales ganaba el sustento, * y siguió al que otorga las recompensas de la vida eterna.
    - - V
      - Éste es aquel que sufrió el martirio de la cruz por amor de Cristo y por difundir su ley.
    - - R
      - y siguió al que otorga las recompensas de la vida eterna.
  te_deum: true
  oracion: Dios todopoderoso y eterno, escucha la oración de tu pueblo y concédenos que, así como el apóstol san Andrés fue en la tierra predicador del Evangelio y pastor de tu Iglesia, así ahora en el cielo sea nuestro poderoso abogado ante ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO JAVIER, presbítero:
  grado: Memoria
  fecha: 12-03
  comun: Del común de los pastores, para un santo presbítero -
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De las cartas de san Francisco Javier, presbítero, a san Ignacio.
      (De la Vida de Francisco Javier, escrita por H. Tursellini, Roma 1956, libro 4, cartas 4 [1542] y 5 [1544])
    texto: |-
      Visitamos las aldeas de los neófitos, que pocos años antes habían recibido la iniciación cristiana. Esta tierra no es habitada por los portugueses, ya que es sumamente estéril y pobre, y los cristianos nativos, privados de sacerdotes, lo único que saben es que son cristianos. No hay nadie que celebre para ellos la misa, nadie que les enseñe el Credo, el Padrenuestro, el Avemaría o los mandamientos de la ley de Dios.
      Por esto, desde que he llegado aquí, no me he dado momento de reposo: me he dedicado a recorrer las aldeas, a bautizar a los niños que no habían recibido aún este sacramento. De este modo, purifiqué a un número ingente de niños que, como suele decirse, no sabían distinguir su mano derecha de la izquierda. Los niños no me dejaban recitar el Oficio divino ni comer ni descansar, hasta que les enseñaba alguna oración; entonces comencé a darme cuenta de que de ellos es el reino de los cielos.
      Por tanto, como no podía cristianamente negarme a tan piadosos deseos, comenzando por la profesión de fe en el Padre, el Hijo y el Espíritu Santo, les enseñaba el Símbolo de los apóstoles y las oraciones del Padrenuestro y el Avemaria. Advertí en ellos gran disposición, de tal manera que, si hubiera quien los instruyese en la doctrina cristiana, sin duda llegarían a ser unos excelentes cristianos.
      Muchos, en estos lugares, no son cristianos, simplemente porque no hay quien los haga tales. Muchas veces me vienen ganas de recorrer las universidades de Europa, principalmente la de París, y de ponerme a gritar por doquiera, como quien ha perdido el juicio, para impulsar a los que poseen más ciencia que caridad, con estas palabras: «¡Ay, cuántas almas, por vuestra desidia, quedan excluidas del cielo y se precipitan en el infierno!»
      ¡Ojalá pusieran en este asunto el mismo interés que ponen en sus estudios! Con ello podrían dar cuenta a Dios de su ciencia y de los talentos que les han confiado. Muchos de ellos, movidos por estas consideraciones y por la meditación de las cosas divinas, se ejercitarían en escuchar la voz divina que habla en ellos y, dejando de lado sus ambiciones y negocios humanos, se dedicarían por entero a la voluntad y al arbitrio de Dios, diciendo de corazón: «Señor, aquí me tienes; ¿qué quieres que haga? Envíame donde tú quieras, aunque sea hasta la India.»
    titulo: ¡AY DE MÍ SI NO ANUNCIARA LA BUENA NUEVA!
  resp2:
    ref: Lc 10, 2; Hch 1, 8
    vr:
    - - R
      - La mies es mucha, pero los operarios son pocos; * rogad al Señor que envíe trabajadores a su mies.
    - - V
      - Recibiréis la fortaleza del Espíritu Santo, que descenderá sobre vosotros; y seréis mis testigos hasta los últimos confines de la tierra.
    - - R
      - Rogad al Señor que envíe trabajadores a su mies.
  oracion: Señor, Dios nuestro, que quisiste que numerosos pueblos llegaran a conocerte por medio de la predicación de san Francisco Javier, concede a todos los bautizados un gran celo por la propagación de la fe, para que así tu Iglesia pueda alegrarse de ver aumentados sus hijos en todo el mundo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN AMBROSIO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 12-07
  comun: 'Del Común de pastores: para una santo obispo y del Común de doctores de la Iglesia.'
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura1:
    ref: Comienza el libro de Rut. 1, 1-22
    texto: |-
      En tiempo de los Jueces, hubo hambre en el país, y un hombre emigró, con su mujer y sus dos hijos, desde Belén de Judá a la campiña de Moab. Se llamaba Elimelec; su mujer, Noemí, y sus hijos, Majlón y Kilión. Eran efrateos, de Belén de Judá. Llegados a la campiña de Moab, se establecieron allí.
      Elimelec, el marido de Noemí, murió, y quedaron con ella sus dos hijos, que se casaron con dos mujeres moabitas: una se llamaba Orfá, y la otra, Rut. Pera al cabo de diez años de residir allí, murieron también los dos hijos, Majlón y Kilión, y la mujer se quedó sin marido y sin hijos.
      Al enterarse de que el Señor había atendido a su pueblo dándole pan, Noemí, con sus dos nueras, emprendió el camino de vuelta desde la campiña de Moab. En compañía de sus dos nueras salió del lugar donde residía, y emprendieron el regreso al país de Judá. Noemí dijo a sus dos nueras:
      «Andad, volveos cada una a vuestra casa. Que el Señor os trate con piedad, como vosotras lo habéis hecho con mis muertos y conmigo. El Señor os conceda vivir tranquilas en casa de un nuevo marido.»
      Las abrazó. Ellas, rompiendo a llorar, le replicaron:
      «¡De ningún modo! Volveremos contigo a tu pueblo.»
      Noemí insistió:
      «Volveos, hijas. ¿A qué vais a venir conmigo? ¿Creéis que podré tener más hijos, para casaros con ellos? Andad, volveos, hijas, que soy demasiado vieja para casarme. Y aunque pensara que me queda esperanza, y me casara esta noche, y tuviera hijos, ¿vais a esperar a que crezcan, vais a renunciar, por ellos, a casaros? No, hijas. Mi suerte es más amarga que la vuestra, porque la mano del Señor se ha desatado contra mí.»
      De nuevo rompieron a llorar. Orfá se despidió de su suegra y volvió a su pueblo, mientras que Rut se quedó con Noemí. Noemí le dijo:
      «Mira, tu cuñada se ha vuelto a su pueblo y a su dios. Vuélvete tú con ella.»
      Pero Rut contestó:
      «No insistas en que te deje y me vuelva. Donde tú vayas, iré yo; donde tú vivas, viviré yo; tu pueblo es el mío, tu Dios es mi Dios; donde tú mueras, allí moriré y allí me enterrarán. Sólo la muerte podrá separarnos; y si no, que el Señor me castigue.»
      Al ver que se empeñaba en ir con ella, Noemí no insistió más. Y siguieron caminando las dos hasta Belén.
      Cuando llegaron, se alborotó toda la población, y las mujeres decían:
      «¡Si es Noemí!»
      Ella corregía:
      «No me llaméis Noemí. Llamadme Mara, porque el Todopoderoso me ha llenado de amargura. Llena me marché, y el Señor me trae vacía. No me llaméis Noemí, que el Señor me afligió, el Todopoderoso me maltrató.»
      Así fue como Noemí, con su nuera Rut, la moabita, volvió de la campiña de Moab. Empezaba la siega de la cebada cuando llegaron a Belén.
    titulo: FIDELIDAD DE RUT
  resp1:
    ref: Jl 3, 5; Am 9, 11-12
    vr:
    - - R
      - En el monte de Sión y en Jerusalén quedará un resto; como lo ha prometido el Señor a los supervivientes * que él llamó.
    - - V
      - Levantaré la tienda caída de David, levantaré sus ruinas, para que posean las primicias de Edom y de todas las naciones.
    - - R
      - Que él llamó.
  lectura2:
    autor: |-
      De las Cartas de san Ambrosio, obispo
      (Carta 2, 1-2. 4-5. 7: PL 16 [edición 1845], 847-881)
    texto: |-
      Has recibido la carga del sacerdocio. Sentado en la popa de la Iglesia, gobiernas la nave en medio de las olas que la combaten. Mantén firme el timón de la fe, para que las fuertes tormentas de este mundo no te hagan desviar de tu rumbo. El mar es ciertamente grande y dilatado, pero no temas, porque él la fundó sobre los mares, él la afianzó sobre los ríos.
      Por ello no es de extrañar que, en medio de un mundo tan agitado, la Iglesia del Señor, edificada sobre la roca apostólica, permanezca estable y, a pesar de los furiosos embates del mar, resista inconmovible en sus cimientos. Las olas baten contra ella, pero se mantiene firme y, aunque con frecuencia los elementos de este mundo choquen con gran fragor, ella ofrece a los agobiados el seguro puerto de salvación.
      Sin embargo, aunque fluctúa en el mar, se desliza por los ríos, principalmente por aquellos ríos de los que dice el salmo: Levantan los ríos su voz. Porque existen unos ríos que manan de aquel que ha tomado de Cristo la bebida y ha recibido el Espíritu de Dios. Éstos son los ríos que, por la abundancia desbordante de la gracia espiritual, levantan su voz.
      Y existe también un río que se precipita entre sus santos como un torrente. Y existe un río que, como el correr de las acequias, alegra al alma pacífica y tranquila. Todo aquel que recibe de la plenitud de este río, como Juan Evangelista, como Pedro y Pablo, levanta su voz; y, así como los apóstoles pregonaron por todos los confines de la tierra el mensaje evangélico, así también éste se lanza a anunciar esa Buena Nueva del Señor Jesús. Recibe, pues, de Cristo, para que puedas hablar a los demás. Acoge en ti el agua de Cristo, aquella que alaba al Señor. Recoge el agua proveniente de diversos lugares, la que derraman las nubes de los profetas. Todo aquel que recoge el agua de los montes, el que la hace venir y la bebe de las fuentes, la derrama luego como las nubes. Llena, pues, de esta agua tu interior, para que la tierra de tu corazón quede humedecida y regada por sus propias fuentes.
      Para llenarse de esta agua es necesaria una frecuente e inteligente lectura; así, una vez lleno, regarás a los demás. Por esto dice la Escritura: Si las nubes van llenas, vierten lluvia sobre la tierra.
      Sean, pues, tus palabras fluidas, claras y transparentes, de modo que tu predicación infunda suavidad en los oídos de tu pueblo y con el atractivo de tus palabras lo hagas dúctil. De este modo te seguirá de buen grado a donde lo lleves.
      Tus exhortaciones estén llenas de sabiduría. En este sentido, dice Salomón: Las armas del espíritu son los labios del sabio; y, en otro lugar: Tus labios estén atados por la inteligencia, es decir, que tus sermones brillen por su claridad e inteligencia, y que tus exhortaciones y tratados no tengan necesidad de apoyarse en las afirmaciones de los demás, sino que tus palabras se defiendan con sus propias armas, y que ninguna palabra vana y sin inteligencia salga de tu boca.
    titulo: EL ATRACTIVO DE TUS PALABRAS HAGA DÚCTIL A TU PUEBLO
  resp2:
    ref: 2Tm 4, 2; Sir 48, 4. 8
    vr:
    - - R
      - Proclama la palabra, insiste con oportunidad o sin ella, persuade, reprende, exhorta, * armado de toda paciencia y doctrina.
    - - V
      - ¿Quién podrá gloriarse de ser como tú, que ungiste reyes para ejecutar castigos?
    - - R
      - Armado de toda paciencia y doctrina.
  oracion: Señor Dios, que hiciste del obispo san Ambrosio un insigne maestro de la fe católica y un admirable ejemplo de fortaleza apostólica, suscita en tu Iglesia hombres según tu corazón, que guíen siempre a tu pueblo con fortaleza y sabiduría. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  himno: Ninguno del ser humano
  salmodia:
  - ant: En su concepción María ha recibido la bendición del Señor y la misericordia de Dios, su salvador.
    salmo: salmo-23
  - ant: Dios la socorrió al despuntar la aurora; el Altísimo ha consagrado su morada.
    salmo: salmo-45
  - ant: '¡Qué pregón tan glorioso para ti, ciudad de Dios!: el Señor te ha cimentado sobre el monte santo.'
    salmo: salmo-86
  versiculo:
  - - V
    - El Dios todopoderoso me ciñe de valor.
  - - R
    - Y me enseña un camino perfecto.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Romanos 5, 12-21
    texto: |-
      Hermanos: Así como por un solo hombre entró el pecado en el mundo y, por el pecado, la muerte, y, de este modo, la muerte pasó a todos los hombres, dado que todos han pecado...
      (Porque ya antes de la promulgación de la ley existía el pecado en el mundo, y sin embargo no puede imputarse pecado si no hay ley; vemos, empero, que, de hecho, la muerte reinó ya desde Adán a Moisés sobre todos los que pecaron, aun cuando su transgresión no fue en las mismas condiciones en que pecó Adán, el cual era figura del que había de venir.
      Sin embargo, con el don no sucedió como con el delito, pues, si por el delito de uno solo murió la multitud, ¡con cuánta mayor profusión, por la gracia de un solo hombre, Jesucristo, se derramó sobre todos la bondad y el don de Dios! Ni fueron los efectos de este don como los efectos del pecado de aquel único hombre que pecó, porque la sentencia que llevó a la condenación vino por uno solo, en cambio, el don, partiendo de muchas transgresiones, lleva a la justificación.)
      ...Así pues (decía), si, por la falta de uno solo, la muerte estableció su reinado, también, con mucha mayor razón, por causa de uno solo, de Jesucristo, reinarán en la vida los que reciben la sobreabundancia de la gracia y el don de la justificación.
      Por consiguiente, así como el delito de uno solo atrajo sobre todos los hombres la condenación, así también la obra de justicia de uno solo procura a todos la justificación que da la vida. Y como por la desobediencia de un solo hombre todos los demás quedaron constituidos pecadores, así también por la obediencia de uno solo todos quedarán constituidos justos.
      La ley, ciertamente, fue ocasión de que se multiplicasen los delitos, pero donde abundó el pecado sobreabundó la gracia, para que así como reinó el pecado produciendo la muerte, así también reine la gracia dándonos vida eterna por Jesucristo, Señor nuestro.
    titulo: DONDE ABUNDÓ EL PECADO SOBREABUNDÓ LA GRACIA
  resp1:
    ref: Rm 5, 12; Lc 1, 30; cf. Sal 114, 8; cf. 17, 19
    vr:
    - - R
      - Por un solo hombre entró el pecado en el mundo y, por él, todos han pecado. Pero tú * no temas, María, porque has hallado gracia a los ojos de Dios.
    - - V
      - El Señor arrancó tu alma de la muerte, y fue tu apoyo contra tu adversario.
    - - R
      - No temas, María, porque has hallado gracia a los ojos de Dios.
  lectura2:
    autor: |-
      De las Oraciones de san Anselmo, obispo
      (Oración 52: PL 158, 955-956)
    texto: |-
      El cielo, los astros, la tierra, los ríos, el día, la noche, y todo lo que se halla sometido al poder y al servicio del hombre, se congratulan, Señora, porque, habiendo perdido su antigua nobleza, ahora han sido en cierto modo resucitados por ti y dotados de una gracia nueva e inefable.
      Porque todas estas cosas estaban como muertas, al haber perdido su congénita dignidad de servir al dominio y utilidad de los que alaban a Dios, que para eso habían sido creadas; estaban oprimidas y afeadas por el abuso de los que servían a los ídolos, para los cuales no habían sido creadas. Ahora se alegran como si hubieran vuelto a la vida, porque ya vuelven a estar sometidas al dominio de los que confiesan a Dios, y embellecidas por su uso natural.
      Es como si hubiesen saltado de alegría por esta gracia nueva e inapreciable, al sentir que el mismo Dios, su mismo creador, no sólo reinaba sobre ellas de un modo invisible, sino que incluso lo vieron en medio de ellas, santificándolas visiblemente con su uso. Estos bienes tan grandes provinieron a través del fruto bendito del vientre sagrado de la Virgen María.
      Por tu plenitud de gracia, lo que estaba en el país de los muertos se alegra al sentirse liberado, y lo que está por encima del mundo se alegra al sentirse restaurado.
      En efecto, por el glorioso Hijo de tu gloriosa virginidad, todos los justos que murieron antes de la muerte vivificante de Cristo se alegran al verse libres de su cautividad, y los ángeles se congratulan por la restauración de su ciudad medio en ruinas.
      ¡Oh mujer llena y rebosante de gracia, con la redundancia de cuya plenitud rocías y haces reverdecer toda la creación! ¡Oh Virgen bendita y desbordante de bendiciones, por cuya bendición queda bendecida toda la naturaleza, no sólo la creatura por el Creador, sino también el Creador por la creatura!
      Dios, a su Hijo, el único engendrado de su seno igual a sí, al que amaba como a sí mismo, lo dio a María; y de María se hizo un hijo, no distinto, sino el mismo, de suerte que por naturaleza fuese el mismo y único Hijo de Dios y de María. Toda la naturaleza ha sido creada por Dios, y Dios ha nacido de María. Dios lo creó todo, y María engendró a Dios. Dios, que hizo todas las cosas, se hizo a sí mismo de María; y de este modo rehizo todo lo que había hecho. El que pudo hacer todas las cosas de la nada, una vez profanadas, no quiso rehacerlas sin María.
      Dios, por tanto, es padre de las cosas creadas y María es madre de las cosas recreadas. Dios es padre de toda la creación, María es madre de la universal restauración. Porque Dios engendró a aquel por quien todo fue hecho, y María dio a luz a aquel por quien todo fue salvado. Dios engendró a aquel sin el cual nada en absoluto existiría, y María dio a luz a aquel sin el cual nada sería bueno.
      En verdad el Señor está contigo, ya que él ha hecho que toda la naturaleza estuviera en tan gran deuda contigo y con él.
    titulo: ¡OH VIRGEN, POR CUYA BENDICIÓN QUEDA BENDECIDA TODA LA NATURALEZA!
  resp2:
    ref: Sal 33, 4; 85, 13; Lc 1, 48
    vr:
    - - R
      - Proclamad conmigo la grandeza del Señor, * por su grande piedad para conmigo.
    - - V
      - Desde ahora me felicitarán todas las generaciones.
    - - R
      - Por su grande piedad para conmigo.
  te_deum: true
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  himno: Ninguno del ser humano
  salmodia:
  - ant: En su concepción María ha recibido la bendición del Señor y la misericordia de Dios, su salvador.
    salmo: salmo-23
  - ant: Dios la socorrió al despuntar la aurora; el Altísimo ha consagrado su morada.
    salmo: salmo-45
  - ant: '¡Qué pregón tan glorioso para ti, ciudad de Dios!: el Señor te ha cimentado sobre el monte santo.'
    salmo: salmo-86
  versiculo:
  - - V
    - El Dios todopoderoso me ciñe de valor.
  - - R
    - Y me enseña un camino perfecto.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Romanos 5, 12-21
    texto: |-
      Hermanos: Así como por un solo hombre entró el pecado en el mundo y, por el pecado, la muerte, y, de este modo, la muerte pasó a todos los hombres, dado que todos han pecado...
      (Porque ya antes de la promulgación de la ley existía el pecado en el mundo, y sin embargo no puede imputarse pecado si no hay ley; vemos, empero, que, de hecho, la muerte reinó ya desde Adán a Moisés sobre todos los que pecaron, aun cuando su transgresión no fue en las mismas condiciones en que pecó Adán, el cual era figura del que había de venir.
      Sin embargo, con el don no sucedió como con el delito, pues, si por el delito de uno solo murió la multitud, ¡con cuánta mayor profusión, por la gracia de un solo hombre, Jesucristo, se derramó sobre todos la bondad y el don de Dios! Ni fueron los efectos de este don como los efectos del pecado de aquel único hombre que pecó, porque la sentencia que llevó a la condenación vino por uno solo, en cambio, el don, partiendo de muchas transgresiones, lleva a la justificación.)
      ...Así pues (decía), si, por la falta de uno solo, la muerte estableció su reinado, también, con mucha mayor razón, por causa de uno solo, de Jesucristo, reinarán en la vida los que reciben la sobreabundancia de la gracia y el don de la justificación.
      Por consiguiente, así como el delito de uno solo atrajo sobre todos los hombres la condenación, así también la obra de justicia de uno solo procura a todos la justificación que da la vida. Y como por la desobediencia de un solo hombre todos los demás quedaron constituidos pecadores, así también por la obediencia de uno solo todos quedarán constituidos justos.
      La ley, ciertamente, fue ocasión de que se multiplicasen los delitos, pero donde abundó el pecado sobreabundó la gracia, para que así como reinó el pecado produciendo la muerte, así también reine la gracia dándonos vida eterna por Jesucristo, Señor nuestro.
    titulo: DONDE ABUNDÓ EL PECADO SOBREABUNDÓ LA GRACIA
  resp1:
    ref: Rm 5, 12; Lc 1, 30; cf. Sal 114, 8; cf. 17, 19
    vr:
    - - R
      - Por un solo hombre entró el pecado en el mundo y, por él, todos han pecado. Pero tú * no temas, María, porque has hallado gracia a los ojos de Dios. Aleluia.
    - - V
      - El Señor arrancó tu alma de la muerte, y fue tu apoyo contra tu adversario.
    - - R
      - No temas, María, porque has hallado gracia a los ojos de Dios. Aleluia.
  lectura2:
    autor: |-
      De las Oraciones de san Anselmo, obispo
      (Oración 52: PL 158, 955-956)
    texto: |-
      El cielo, los astros, la tierra, los ríos, el día, la noche, y todo lo que se halla sometido al poder y al servicio del hombre, se congratulan, Señora, porque, habiendo perdido su antigua nobleza, ahora han sido en cierto modo resucitados por ti y dotados de una gracia nueva e inefable.
      Porque todas estas cosas estaban como muertas, al haber perdido su congénita dignidad de servir al dominio y utilidad de los que alaban a Dios, que para eso habían sido creadas; estaban oprimidas y afeadas por el abuso de los que servían a los ídolos, para los cuales no habían sido creadas. Ahora se alegran como si hubieran vuelto a la vida, porque ya vuelven a estar sometidas al dominio de los que confiesan a Dios, y embellecidas por su uso natural.
      Es como si hubiesen saltado de alegría por esta gracia nueva e inapreciable, al sentir que el mismo Dios, su mismo creador, no sólo reinaba sobre ellas de un modo invisible, sino que incluso lo vieron en medio de ellas, santificándolas visiblemente con su uso. Estos bienes tan grandes provinieron a través del fruto bendito del vientre sagrado de la Virgen María.
      Por tu plenitud de gracia, lo que estaba en el país de los muertos se alegra al sentirse liberado, y lo que está por encima del mundo se alegra al sentirse restaurado.
      En efecto, por el glorioso Hijo de tu gloriosa virginidad, todos los justos que murieron antes de la muerte vivificante de Cristo se alegran al verse libres de su cautividad, y los ángeles se congratulan por la restauración de su ciudad medio en ruinas.
      ¡Oh mujer llena y rebosante de gracia, con la redundancia de cuya plenitud rocías y haces reverdecer toda la creación! ¡Oh Virgen bendita y desbordante de bendiciones, por cuya bendición queda bendecida toda la naturaleza, no sólo la creatura por el Creador, sino también el Creador por la creatura!
      Dios, a su Hijo, el único engendrado de su seno igual a sí, al que amaba como a sí mismo, lo dio a María; y de María se hizo un hijo, no distinto, sino el mismo, de suerte que por naturaleza fuese el mismo y único Hijo de Dios y de María. Toda la naturaleza ha sido creada por Dios, y Dios ha nacido de María. Dios lo creó todo, y María engendró a Dios. Dios, que hizo todas las cosas, se hizo a sí mismo de María; y de este modo rehizo todo lo que había hecho. El que pudo hacer todas las cosas de la nada, una vez profanadas, no quiso rehacerlas sin María.
      Dios, por tanto, es padre de las cosas creadas y María es madre de las cosas recreadas. Dios es padre de toda la creación, María es madre de la universal restauración. Porque Dios engendró a aquel por quien todo fue hecho, y María dio a luz a aquel por quien todo fue salvado. Dios engendró a aquel sin el cual nada en absoluto existiría, y María dio a luz a aquel sin el cual nada sería bueno.
      En verdad el Señor está contigo, ya que él ha hecho que toda la naturaleza estuviera en tan gran deuda contigo y con él.
    titulo: ¡OH VIRGEN, POR CUYA BENDICIÓN QUEDA BENDECIDA TODA LA NATURALEZA!
  resp2:
    ref: Sal 33, 4; 85, 13; Lc 1, 48
    vr:
    - - R
      - Proclamad conmigo la grandeza del Señor, * por su grande piedad para conmigo.
    - - V
      - Desde ahora me felicitarán todas las generaciones.
    - - R
      - Por su grande piedad para conmigo.
  te_deum: true
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE GUADALUPE:
  grado: Fiesta
  fecha: 12-12
  comun: Del Común de la Santísima Virgen María.
  himno: Eres mujer de casa y, además, peregrina
  salmodia:
  - ant: Tu sol ya no se pondrá, ni menguará tu luna.
    salmo: salmo-23
  - ant: Mirad que ya viene mi hijo el más pequeño, saltando sobre los montes, brincando por las colinas, como un ágil cervatillo.
    salmo: salmo-45
  - ant: 'Salgamos al campo, madruguemos para ver las viñas, para ver si las vides ya florecen y echan flores los granados: ahí te mostraré mi amor.'
    salmo: salmo-86
  versiculo:
  - - V
    - Señora de los jardines, mis compañeros te escuchan.
  - - R
    - Déjanos oir tu voz.
  lectura1:
    ref: Del libro del profeta Isaías 52, 7. 9-10; 54, 10a. 11b-14a. 15; 55, 3b. 12b-13
    texto: |-
      ¡Qué hermosos son sobre los montes los pies del mensajero que anuncia la paz, que trae la dicha, que anuncia la salvación, que dice a Sión: «Ya reina tu Dios»!
      Prorrumpid a una en gritos de júbilo, soledades de Jerusalén, porque el Señor ha consolado a su pueblo, ha rescatado a Jerusalén. Ha descubierto el Señor su santo brazo a la vista de todas las naciones y han contemplado los confines de la tierra la salvación de nuestro Dios.
      «Podrán correrse los montes —dice el Señor—, podrán moverse las colinas, pero mi amor nunca se apartará de ti. Yo asentaré tus piedras sobre jaspe y tus cimientos sobre zafiro. Te pondré almenas de rubíes y puertas de esmeralda, y haré tus murallas con piedras preciosas. Todos tus hijos serán discípulos del Señor y su dicha será inmensa. Serás consolidada en la justicia. Si alguien te ataca, no será de parte mía; cualquiera que te ataque, contra ti se estrellará. Pues voy a firmar con vosotros una alianza eterna.»
      Los montes y colinas romperán a cantar ante vosotros con gritos de alegría, y aplaudirán los árboles del campo. En lugar del espino crecerá el ciprés, en lugar de la ortiga crecerán los mirtos.
      Será esto para gloria del Señor, para señal eterna que jamás se borrará.
    titulo: SOBRE LOS MONTES SE ANUNCIÓ LA PAZ
  resp1:
    ref: Sal 22, 4; 108, 22; Is 66, 13; Sal 120, 6
    vr:
    - - R
      - 'No se turbe tu corazón ni te inquiete cosa alguna: aunque camines por cañadas oscuras, aunque te sientas pobre y desdichado y lleves traspasado el corazón. * Como una madre acaricia a su hijo, así yo os consolaré.'
    - - V
      - De día el sol no te hará daño, ni la luna de noche.
    - - R
      - Como una madre acaricia a su hijo, así yo os consolaré.
  lectura2:
    autor: |-
      Del Mensaje del papa Pablo sexto al pueblo mexicano
      (L 'Osservatore Romano, 18 de octubre de 1970)
    texto: |-
      Amadísimos hijos, deseamos unir nuestra voz a ese himno filial que el pueblo mexicano eleva hoy a la Madre de Dios. La devoción a la Virgen Santísima de Guadalupe debe ser para todos vosotros una constante y particular exigencia de auténtica renovación cristiana. La corona que ella espera de todos vosotros no es tanto una corona material, sino una preciosa corona espiritual, formada por un profundo amor a Cristo y por un sincero amor a todos los hombres: los dos mandamientos que resumen el mensaje evangélico. La misma Virgen Santísima, con su ejemplo, nos guía en estos dos caminos.
      En primer lugar, nos pide que hagamos de Cristo el centro y la cumbre de toda nuestra vida cristiana. Ella misma se oculta, con suprema humildad, para que la figura de su Hijo aparezca a los hombres con todo su incomparable fulgor. Por eso, la misma devoción mariana alcanza su plenitud y su expresión más exacta cuando es un camino hacia el Señor y dirige todo el amor hacia él, como ella supo hacerlo, al entrelazar en un mismo impulso la ternura de madre y la piedad de creatura.
      Pero además, y precisamente porque amaba tan entrañablemente a Cristo, nuestra Madre cumplió cabalmente ese segundo mandamiento que debe ser la norma de todas las relaciones humanas: el amor al prójimo. ¡Qué bella y delicada intervención de María en las bodas de Caná, cuando mueve a su Hijo a realizar el primer milagro de convertir el agua en vino, sólo para ayudar a aquellos jóvenes esposos! Es todo un signo del constante amor de la Virgen Santísima por la humanidad necesitada y debe ser un ejemplo para todos los que quieren considerarse verdaderamente hijos suyos.
      Un cristiano no puede menos que demostrar su solidaridad para solucionar la situación de aquellos a quienes aún no ha llegado el pan de la cultura o la oportunidad de un trabajo honorable y justamente remunerado; no puede quedar insensible mientras las nuevas generaciones no encuentren el cauce para hacer realidad sus legítimas aspiraciones, y mientras una parte de la humanidad siga estando marginada a las ventajas de la civilización y del progreso. Por ese motivo, en esta fiesta tan señalada os exhortamos de corazón a dar a vuestra vida cristiana un marcado sentido social —como pide el Concilio—, que os haga estar siempre en primera línea en todos los esfuerzos para el progreso y en todas las iniciativas para mejorar la situación de los que sufren necesidad. Ved en cada hombre un hermano, y en cada hermano, a Cristo, de manera que el amor a Dios y el amor al prójimo se unan en un mismo amor, vivo y operante, que es lo único que puede redimir las miserias del mundo, renovándolo en su raíz más honda: el corazón del hombre.
      El que tiene mucho que sea consciente de su obligación de servir y de contribuir con generosidad para el bien de todos. El que tiene poco o no tiene nada que, mediante la ayuda de una sociedad justa, se esfuerce en superarse y en elevarse a sí mismo y aun en cooperar al progreso de los que sufren su misma situación. Y, todos, sentid el deber de uniros fraternalmente para ayudar a forjar ese mundo nuevo que anhela la humanidad.
      Esto es lo que hoy os pide la Virgen de Guadalupe, ésta la fidelidad al Evangelio, de la que ella supo ser el ejemplo eminente.
      Sobre vosotros, muy queridos hijos, imploramos confiado la maternal benevolencia de la Madre de Dios y Madre de la Iglesia, para que siga protegiendo a vuestra nación y la dirija e impulse cada vez más por los caminos del progreso, del amor fraterno y de la pacífica convivencia.
    titulo: 'EL MEJOR HOMENAJE A MARÍA: AMAR A DIOS Y AL PRÓJIMO'
  resp2:
    ref: Mt 22, 37-38; 1Jn 4, 20; cf. Mt 25, 40
    vr:
    - - R
      - 'Amarás al Señor tu Dios con todo tu corazón, con toda tu alma y con toda tu mente: éste es el principal y el primero de los mandamientos. Pero * si alguno dice: «Yo amo a Dios», y no ama a su hermano, está mintiendo.'
    - - V
      - Todo lo que hacéis a uno de estos mis humildes hermanos, a mí me lo hacéis.
    - - R
      - 'Si alguno dice: «Yo amo a Dios», y no ama a su hermano, está mintiendo.'
  te_deum: true
  oracion: Señor, Dios nuestro, que has concedido a tu pueblo la protección maternal de la siempre Virgen María, Madre de tu Hijo, concédenos, por su intercesión, permanecer siempre firmes en la fe y servir con sincero amor a nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA LUCÍA, virgen y mártir:
  grado: Memoria
  fecha: 12-13
  comun: Del Común de un mártir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      Del Libro de san Ambrosio, obispo, Sobre la virginidad
      (Cap.12, 68. 74-75; 13, 77-78: PL 16 [edición 1845], 281. 283. 285-286)
    texto: |-
      Tú, que has salido de entre el pueblo, de entre la multitud, eres ciertamente una de las vírgenes que iluminas la gracia de tu cuerpo con el esplendor de tu espíritu (por eso, con toda razón, eres comparada a la Iglesia); así pues, en las noches, cuando estés en tu habitación, piensa siempre en Cristo y espera continuamente su llegada.
      Así te desea Cristo, por eso te ha elegido. El entra cuando se le deja la puerta abierta; él, que ha prometido entrar, no puede faltar a su promesa. Abraza entonces al que has buscado, acércate a él y quedarás radiante; deténlo, pídele que no se vaya luego, suplícale que no se marche. Pues la Palabra de Dios suele pasar de prisa: si siente algún desdén, no se entrega; si no se le hace caso, se retira. Atiende con interés a lo que te diga, sigue con insistencia las huellas de sus palabras; pues suele retirarse pronto.
      ¿Qué dice la esposa del Cantar de los cantares? Lo busqué y no lo encontré, lo llamé y no respondió. Si se ha marchado muy pronto de ti aquel a quien llamaste, a quien suplicaste, a quien abriste tu puerta, no por ello pienses que le has desagradado, pues a veces quiere ponernos a prueba. ¿Qué fue lo que dijo, en el Evangelio, a las turbas que le rogaban que no se fuese? Es necesario que yo vaya a anunciar la palabra de Dios también a otras ciudades, porque ésa es mi misión. Así pues, si pareciere apartarse de ti, sal fuera y búscalo de nuevo por todas partes.
      ¿Quién más, si no es la santa Iglesia, puede enseñarte cómo retener a Cristo? Y ya te lo ha enseñado, si entiendes lo que lees: Apenas los pasé, encontré al amor de mi alma; lo abracé y ya no lo soltaré.
      Y ¿cuál es la manera de retener a Cristo? No por la fuerza, no con los nudos de una soga, sino con ataduras de amor, con correas espirituales, con el afecto del alma es como se le retiene.
      Si quieres tener a Cristo contigo, búscalo sin temor al sufrimiento; muchas veces, donde mejor se lo encuentra es en medio de los suplicios del cuerpo, entre las mismas manos de los perseguidores.
      Apenas los pasé, hemos citado antes. Pasado un breve espacio de tiempo después que hayas escapado a los perseguidores, sin sucumbir a los poderes del mundo, Cristo te saldrá al encuentro y no permitirá que seas ya probada por mucho tiempo.
      La que de este modo busca a Cristo, la que lo encuentra, puede exclamar: Lo abracé y ya no lo soltaré, hasta entrarlo en la casa de mi madre, en la alcoba de la que me llevó en sus entrañas. Esta casa y alcoba de tu madre no significa otra cosa que la parte más íntima de tu ser. Conserva bien esa casa, limpia bien sus rincones más escondidos, para que así, limpia de toda mancha, se levante como una casa espiritual, hasta formar un sacerdocio santo, consolidada por la piedra angular, y que el Espíritu Santo habite en ella.
      La que de este modo busca a Cristo, la que le ruega, no queda abandonada por él; al contrario, él vuelve con frecuencia a visitarla, pues está con nosotros hasta el fin del mundo.
    titulo: ILUMINAS LA GRACIA DE TU CUERPO CON EL ESPLENDOR DE TU ESPÍRITU
  resp2:
    ref: ''
    vr:
    - - R
      - Agradó a Dios en el combate y fue glorificada ante Dios y ante los hombres; hablaba sabiamente ante los príncipes, * y la amó el Señor del universo.
    - - V
      - Esta virgen preparó en su corazón una morada digna para Dios.
    - - R
      - Y la amó el Señor del universo.
  oracion: Te pedimos, Señor, por intercesión de santa Lucía, virgen y mártir, que llenes de luz y de gozo nuestros corazones, y que quienes hoy celebramos su martirio en la tierra lleguemos a contemplar con nuestros propios ojos tu gloria en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN DE LA CRUZ, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 12-14
  comun: Del Común de pastores para un santo presbítero y del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      Del Cántico espiritual de san Juan de la Cruz, presbítero
      (Canciones 37, 4 Y 36, 13, declaración)
    texto: |-
      Por más misterios y maravillas que han descubierto los santos doctores Y entendido las santas almas en este estado de vida, les quedó todo lo más por decir y aun por entender, y así hay mucho que ahondar en Cristo, porque es como una abundante mina con muchos senos de tesoros, que por más que ahonden, nunca les hallan fin ni término, antes van en cada seno hallando nuevas venas de nuevas riquezas acá y allá. Que por eso dijo san Pablo del mismo Cristo, diciendo: En Cristo moran todos los tesoros y sabiduría escondidos, en los cuales el alma no puede entrar ni puede llegar a ellos, si no pasa primero por la estrechura del padecer interior y exterior a la divina Sabiduría.
      Porque aun a lo que en esta vida se puede alcanzar de estos misterios de Cristo, no se puede llegar sin haber padecido mucho y recibido muchas mercedes intelectuales y sensitivas de Dios, y habiendo precedido mucho ejercicio espiritual, porque todas estas mercedes son más bajas que la sabiduría de los misterios de Cristo, porque todas son como disposiciones para venir a ella.
      ¡Oh, si se acabase ya de entender cómo no se puede llegar a la espesura y sabiduría de las riquezas de Dios, que son de muchas maneras, si no es entrando en la espesura del padecer de muchas maneras, poniendo en eso el alma su consolación y deseo! ¡Y cómo el alma que de veras desea sabiduría divina desea primero el padecer, para entrar en ella, en la espesura de la cruz!
      Que por eso san Pablo amonestaba a los de Éfeso que no desfalleciesen en las tribulaciones, que estuviesen bien fuertes y arraigados en la caridad, para que pudiesen comprender con todos los santos qué cosa sea la anchura y la longura y la altura y la profundidad, y para saber también la supereminente caridad de la ciencia de Cristo, para ser llenos de todo henchimiento de Dios.
      Porque para entrar en estas riquezas de su sabiduría, la puerta es la cruz, que es angosta. Y desear entrar por ella es de pocos; mas desear los deleites a que se viene por ella es de muchos.
    titulo: EL CONOCIMIENTO DEL MISTERIO ESCONDIDO EN CRISTO JESÚS
  resp2:
    ref: 1Co 2, 9-10
    vr:
    - - R
      - Ni el ojo vio, ni el oído oyó, ni vino a la mente del hombre * lo que Dios ha preparado para los que le aman.
    - - V
      - Pero a nosotros nos lo ha revelado por su Espíritu.
    - - R
      - Lo que Dios ha preparado para los que le aman.
  oracion: Oh Dios, que inspiraste a san Juan un amor extraordinario a la cruz y a la renuncia de sí mismo, concédenos seguir incesantemente su ejemplo, para alcanzar la gloria eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ESTEBAN, protomártir:
  grado: Fiesta
  fecha: 12-26
  himno: Palabra del Señor ya rubricada
  salmodia:
  - ant: Esteban, lleno del Espíritu Santo, con la mirada fija en el cielo, vio la gloria de Dios y a Jesús a la diestra del Padre.
    salmo: salmo-2
  - ant: 'Esteban, puesto de rodillas, decía con fuerte voz: «Señor Jesús, no les tomes en cuenta este pecado.»'
    salmo: salmo-10
  - ant: Nadie podía resistir a la sabiduría y al espíritu con que hablaba.
    salmo: salmo-16
  versiculo:
  - - V
    - Me asaltaron angustias y opresiones.
  - - R
    - Pero tus mandatos son mi delicia.
  lectura1:
    ref: De los Hechos de los apóstoles 6, 8—7, 2a. 44-59
    texto: |-
      Esteban, lleno de gracia y de poder sobrenatural, obraba señales y prodigios entre el pueblo. Algunos de la facción llamada de los libertos y algunos cirenenses y alejandrinos y otros de Cilicia y del Asia proconsular se levantaron a disputar con Esteban; pero no podían resistir a la sabiduría y al espíritu con que hablaba.
      Por eso sobornaron a algunos para que presentasen esta acusación:
      «Nosotros le hemos oído proferir blasfemias contra Moisés y contra Dios.»
      Así excitaron los ánimos del pueblo, de los ancianos y de los escribas. Luego, cayendo de improviso sobre él, lo arrebataron y lo condujeron ante el Consejo. Allí hicieron comparecer testigos falsos con esta acusación:
      «Este hombre no cesa de hablar contra el lugar santo y contra la ley. Nosotros le hemos oído decir que ese Jesús Nazareno destruirá este templo y cambiará las costumbres que nos ha transmitido Moisés.»
      Todos los que estaban sentados en el Consejo pusieron en él los ojos, y vieron su rostro como el de un ángel. El sumo sacerdote le preguntó:
      «¿Es verdad lo que éstos dicen?»
      Él contestó:
      «Hermanos y padres, escuchad: Nuestros padres tuvieron consigo, en el desierto, el tabernáculo del testimonio. Así lo había dispuesto el que mandó a Moisés fabricado según el modelo que le había mostrado. Nuestros padres lo recibieron en herencia y lo introdujeron, bajo la dirección de Josué, en la tierra que ocupaban los gentiles, a quienes arrojó Dios para dar lugar a nuestros padres. Y así hasta los días de David. David halló gracia a los ojos de Dios. Pidió el privilegio de construir morada para el Dios de Jacob; pero fue Salomón quien se la edificó, aunque ciertamente el Altísimo no habita en casas construidas por los hombres, como dice el profeta: "El cielo es mi trono y la tierra es escabel de mis pies. ¿Qué casa me vais a construir —dice el Señor—, o cuál va a ser el lugar de mi descanso? ¿No soy yo quien ha hecho todas estas cosas?"
      ¡Hombres de dura cerviz, que cerráis obstinadamente vuestro entendimiento y vuestro corazón a la verdad, vosotros habéis ido siempre en contra del Espíritu Santo! Lo mismo que hicieron vuestros padres hacéis también vosotros. ¿A qué profeta dejaron de perseguir vuestros padres? Ellos quitaron la vida a los que anunciaban la venida del Justo, al cual vosotros habéis ahora traicionado y asesinado; vosotros, que recibisteis la ley por ministerio de los ángeles y no la guardasteis.»
      Al escuchar esta diatriba, ardían de rabia sus corazones y rechinaban sus dientes de coraje. Esteban, por su parte, lleno del Espíritu Santo, con la mirada fija en el cielo, vio la gloria de Dios y a Jesús a su diestra; y exclamó:
      «Veo los cielos abiertos y al Hijo del hombre a la diestra de Dios.»
      Ante estas palabras, con gran gritería, se taparon los oídos. Embistieron todos a una contra él y, sacándolo a empellones fuera de la ciudad, lo apedrearon. Los testigos dejaron sus mantos a los pies de un joven, llamado Saulo. Mientras lo apedreaban, Esteban oraba con estas palabras:
      «Señor Jesús, recibe mi espíritu.»
      Y, puesto de rodillas, dijo con fuerte voz:
      «Señor, no les tomes en cuenta este pecado.»
      Y, dicho esto, murió. Saulo, por su parte, aprobaba su muerte.
    titulo: MARTIRIO DE SAN ESTEBAN
