LA VISITACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 05-31
  himno: María subió a la montaña
  salmodia:
  - ant: María ha recibido la bendición del Señor y la misericordia de Dios, su salvador. Aleluia.
    salmo: salmo-23
  - ant: El Altísimo consagra su morada. Aleluia.
    salmo: salmo-45
  - ant: ¡Qué pregón tan glorioso para ti, Virgen María! Aleluia.
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas. Aleluia.
  - - R
    - Meditándolas en su corazón. Aleluia.
  lectura1:
    ref: Del libro del Cantar de los cantares 2, 8-14; 8, 6-7
    texto: |-
      ¡Escucho una voz...! Es mi amado que ya llega, saltando sobre los montes, brincando por las colinas. Es mi amado semejante a un venado, a un ágil cervatillo. Vedle aquí ya apostado detrás de nuestra cerca, mirando por las ventanas, atisbando por las rejas. Empieza a hablar mi amado y me dice:
      «Levántate, amada mía, hermosa mía, y ven. Porque, mira, ya ha pasado el invierno, ya han cesado las lluvias y se han ido. Brotan flores en los campos, el tiempo de canciones ha llegado, ya el arrullo de la tórtola se ha escuchado en nuestra tierra. Apuntan ya los higos de la higuera, y las viñas en flor exhalan sus perfumes. ¡Levántate, amada mía, hermosa mía, y ven! Paloma mía que anidas en los huecos de la peña, en las grietas del barranco, déjame escuchar tu voz, permíteme ver tu rostro, porque es muy dulce tu hablar y gracioso tu semblante.
      Ponme como un sello sobre tu brazo, como un sello sobre tu corazón, porque el amor es fuerte como la muerte, es cruel la pasión como el abismo; es centella de fuego, llamarada divina. Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.»
    titulo: LA LLEGADA DEL AMADO
  resp1:
    ref: Lc 1, 41b-43. 44
    vr:
    - - R
      - 'Isabel quedó llena del Espíritu Santo y exclamó: «Bendita tú entre las mujeres y bendito el fruto de tu vientre; * ¿cómo he merecido yo que la madre de mi Señor venga a mi casa?». Aleluia.'
    - - V
      - Tan pronto como llegaron a mis oídos las palabras de tu saludo, dio luego el niño en mi seno saltos de alegría.
    - - R
      - ¿Cómo he merecido yo que la madre de mi Señor venga a mi casa?. Aleluia.
  lectura2:
    autor: |-
      De las Homilías de san Beda el Venerable, presbítero
      (Libro 1, 4: CCL 122, 25-26, 30)
    texto: |-
      Proclama mi alma la grandeza del Señor, se alegra mi espíritu en Dios mi salvador. Con estas palabras, María reconoce en primer lugar los dones singulares que le han sido concedidos, pero alude también a los beneficios comunes con que Dios no deja nunca de favorecer al género humano.
      Proclama la grandeza del Señor el alma de aquel que consagra todos sus afectos interiores a la alabanza y al servicio de Dios y, con la observancia de los preceptos divinos, demuestra que nunca echa en olvido las proezas de la majestad de Dios.
      Se alegra en Dios su salvador el espíritu de aquel cuyo deleite consiste únicamente en el recuerdo de su creador, de quien espera la salvación eterna.
      Estas palabras, aunque son aplicables a todos los santos, hallan su lugar más adecuado en los labios de la Madre de Dios, ya que ella, por un privilegio único, ardía en amor espiritual hacia aquel que llevaba corporalmente en su seno.
      Ella con razón pudo alegrarse, más que cualquier otro santo, en Jesús, su salvador, ya que sabía que aquel mismo al que reconocía como eterno autor de la salvación había de nacer de su carne, engendrado en el tiempo, y había de ser, en una misma y úrica persona, su verdadero hijo y Señor.
      Porque el Poderoso ha hecho obras grandes por mí: su nombre es santo. No se atribuye nada a sus méritos, sino que toda su grandeza la refiere a la libre donación de aquel que es por esencia poderoso y grande, y que tiene por norma levantar a sus fieles de su pequeñez y debilidad para hacerlos grandes y fuertes.
      Muy acertadamente añade: Su nombre es santo, para que los que entonces la oían y todos aquellos a los que habían de llegar sus palabras comprendieran que la fe y el recurso a este nombre había de procurarles, también a ellos, una participación en la santidad eterna y en la verdadera salvación, conforme al oráculo profético que afirma: Todo el que invoque el nombre del Señor se salvará, ya que este nombre se identifica con aquel del que antes ha dicho: Se alegra mi espíritu en Dios mi salvador.
      Por esto se introdujo en la Iglesia la hermosa y saludable costumbre de cantar diariamente este cántico de María en la salmodia de la alabanza vespertina, ya que así el recuerdo frecuente de la encarnación del Señor enardece la devoción de los fieles y la meditación repetida de los ejemplos de la Madre de Dios los corrobora en la solidez de la virtud. Y ello precisamente en la hora de Vísperas, para que nuestra mente, fatigada y tensa por el trabajo y las múltiples preocupaciones del día, al llegar el tiempo del reposo, vuelva a encontrar el recogimiento y la paz del espíritu.
    titulo: MARÍA PROCLAMA LA GRANDEZA DEL SEÑOR POR LAS OBRAS QUE HA HECHO EN ELLA
  resp2:
    ref: Lc 1, 45. 46; Sal 65, 16
    vr:
    - - R
      - '«Dichosa tú que has creído, porque lo que te ha dicho el Señor se cumplirá.» Y dijo María: * «Proclama mi alma la grandeza del Señor». Aleluia.'
    - - V
      - Venid a escuchar, os contaré lo que Dios ha hecho conmigo.
    - - R
      - Proclama mi alma la grandeza del Señor. Aleluia.
  te_deum: true
  oracion: Dios todopoderoso y eterno, tú que, cuando María llevaba en su seno a tu Hijo, le inspiraste que visitara a su prima santa Isabel, haz que nosotros seamos siempre dóciles a las inspiraciones de tu Espíritu, para que, con María, podamos proclamar eternamente tu grandeza. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUSTINO, mártir:
  grado: Memoria
  fecha: 06-01
  comun: Del Común de un mártir -
  himno: Testigos de amor
  lectura2:
    autor: |-
      De las Actas del martirio de los santos Justino y compañeros
      (Cap. 1-5: cf. PG 6, 1566-1571)
    texto: |-
      Aquellos santos varones, una vez apresados, fueron conducidos al prefecto de Roma, que se llamaba Rústico. Cuando estuvieron ante el tribunal, el prefecto Rústico dijo a Justino:
      «Antes que nada, profesa tu fe en los dioses y obedece a los emperadores.»
      Justino respondió:
      «No es motivo de acusación ni de detención el hecho de obedecer a los mandamientos de nuestro Salvador Jesucristo.»
      Rústico dijo:
      «¿Cuáles son las enseñanzas que profesas?»
      Respondió Justino:
      «Yo me he esforzado en conocer toda clase de enseñanzas, pero he abrazado las verdaderas enseñanzas de los cristianos, aunque no sean aprobadas por los que viven en el error.»
      El prefecto Rústico dijo:
      «¿Y tú las apruebas, miserable?»
      Respondió Justino:
      «Así es, ya que las sigo según sus rectos principios.»
      Dijo el prefecto Rústico:
      «¿Y cuáles son estos principios?»
      Justino respondió:
      «Que damos culto al Dios de los cristianos, al que consideramos como el único creador desde el principio y artífice de toda la creación, de todo lo visible y lo invisible, y al Señor Jesucristo, de quien anunciaron los profetas que vendría como mensajero de salvación al género humano y maestro de insignes discípulos. Y yo, que no soy más que un mero hombre, sé que mis palabras están muy por debajo de su divinidad infinita, pero admito el valor de las profecías que atestiguan que éste, al que acabo de referirme, es el Hijo de Dios. Porque sé que los profetas hablaban por inspiración divina al vaticinar su venida a los hombres.»
      Rústico dijo:
      «Luego, ¿eres cristiano?»
      Justino respondió:
      «Así es, soy cristiano.»
      El prefecto dijo a Justino:
      «Escucha, tú que eres tenido por sabio y crees estar en posesión de la verdad: si eres flagelado y decapitado ¿estás persuadido de que subirás al cielo?»
      Justino respondió:
      «Espero vivir en la casa del Señor, si sufro tales cosas, pues sé que, a todos los que hayan vivido rectamente, les está reservado el don de Dios para el fin del mundo.»
      El prefecto Rústico dijo:
      «Tú, pues, supones que has de subir al cielo, para recibir un cierto premio merecido.»
      Justino respondió:
      «No lo supongo, lo sé con certeza.»
      El prefecto Rústico dijo:
      «Dejemos esto y vayamos a la cuestión que ahora interesa y urge. Poneos de acuerdo y sacrificad a los dioses.»
      Justino dijo:
      «Nadie que piense rectamente abandonará la piedad para caer en la impiedad.»
      El prefecto Rústico dijo:
      «Si no hacéis lo que se os manda, seréis atormentados sin piedad.»
      Justino respondió:
      «Nuestro deseo es llegar a la salvación a través de los tormentos sufridos por causa de nuestro Señor Jesucristo, ya que ello será para nosotros motivo de salvación y de confianza ante el tribunal de nuestro Señor y Salvador, que será universal y más temible que éste.»
      Los otros mártires dijeron asimismo:
      «Haz lo que quieras; somos cristianos y no sacrificamos a los ídolos.»
      El prefecto Rústico pronunció la sentencia, diciendo:
      «Por haberse negado a sacrificar a los dioses y a obedecer las órdenes del emperador, serán flagelados y decapitados en castigo de su delito y a tenor de lo establecido por la ley.»
      Los santos mártires salieron, glorificando a Dios, hacia el lugar acostumbrado y allí fueron decapitados, coronando así el testimonio de su fe en el Salvador.
    titulo: HE ABRAZADO LAS VERDADERAS ENSEÑANZAS DE LOS CRISTIANOS
  resp2:
    ref: Cf. Hch 20, 20. 21. 24; Rm 1, 16
    vr:
    - - R
      - 'No he ahorrado medio alguno al insistiros a creer en nuestro Señor Jesús; * a mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios. Aleluia.'
    - - V
      - No me avergüenzo del Evangelio; es, en verdad, poder de Dios para salvación de todo el que crea, primero de los judíos y luego de los gentiles.
    - - R
      - 'A mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios. Aleluia.'
  oracion: Dios nuestro, que enseñaste a san Justino a descubrir en la locura de la cruz la incomparable sabiduría de Jesucristo, concédenos, por la intercesión de éste mártir, la gracia de alejar los errores que nos cercan y de mantenernos siempre firmes en la fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS CARLOS LWANGA y COMPAÑEROS, mártires:
  grado: Memoria
  fecha: 06-03
  comun: Del Común de varios mártires.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la Homilía del papa Pablo sexto, en la canonización de los mártires de Uganda
      (AAS 56 [1964], 905-906)
    texto: |-
      Estos mártires africanos añaden una nueva página a aquella lista de vencedores llamada Martirologio, página que contiene unos hechos a la vez siniestros y magníficos; página digna de formar parte de aquellas ilustres narraciones de la antigua África, que nosotros, los que vivimos en esta época, pensábamos, como hombres de poca fe, que nunca tendrían una continuación adecuada.
      ¿Quién hubiera podido sospechar, por ejemplo, que aquellas actas, tan conmovedoras, de los mártires escilitanos, de los mártires cartagineses, de los mártires de la «blanca multitud» de Útica, recordados por san Agustín y Prudencia, de los mártires de Egipto, ampliamente ensalzados en los escritos de Juan Crisóstomo, de los mártires de la persecución de los vándalos, se verían enriquecidas en nuestro tiempo con nuevas historias, en las que se narrarían unas hazañas no inferiores en fortaleza y en brillantez?
      ¿Quién hubiera podido imaginar que a aquellos ilustres mártires y confesores africanos, tan conocidos y recordados, como Cipriano, Felicidad y Perpetua, y Agustín, aquel gran hombre, añadiríamos un día los nombres tan queridos de Carlos Lwanga, de Matías Mulumba Kalemba y de sus veinte compañeros? Sin olvidar aquellos otros, de confesión anglicana, que sufrieron la muerte por el nombre de Cristo.
      Estos mártires africanos significan, en verdad, el inicio de una nueva era. No permita Dios que el pensamiento de los hombres retorne a las persecuciones y conflictos de orden religioso, sino que tiendan a una renovación cristiana y civil.
      África, regada con la sangre de estos mártires, los primeros de esta nueva era (y quiera Dios que los últimos, tratándose de un holocausto tan grande y de tanto precio), África renace libre y dueña de sí misma.
      Aquel crimen, del que ellos fueron víctima, es tan abominable y tan significativo, que proporciona un motivo claro y suficiente para que este nuevo pueblo adquiera una formación moral, para que prevalezcan nuevas costumbres espirituales y sean transmitidas a los descendientes, para que sea como un símbolo eficaz del paso de un estado de vida simple y primitivo, en el que no faltaban unos valores humanos dignos de consideración, pero que era también corrompido y débil y como esclavo de sí mismo, a una cultura más civilizada, que tienda a unas más elevadas expresiones de la mente humana y a unas superiores condiciones de vida social.
    titulo: LA GLORIA DE LOS MÁRTIRES SIGNO DE RENOVACIÓN
  resp2:
    ref: S. Cipriano, Carta 58
    vr:
    - - R
      - Dios nos contempla, Cristo y sus ángeles nos miran, mientras luchamos por la fe. * Qué dignidad tan grande, qué felicidad tan plena es luchar bajo la mirada de Dios y ser coronados por Cristo. Aleluia.
    - - V
      - Revistámonos de fuerza y preparémonos para la lucha con un espíritu indoblegable, con una fe sincera, con una entrega total.
    - - R
      - Qué dignidad tan grande, qué felicidad tan plena es luchar bajo la mirada de Dios y ser coronados por Cristo. Aleluia.
  oracion: Señor Dios, que has querido que la sangre de los mártires sea semilla de nuevos cristianos, haz que el campo de tu Iglesia, regado con la sangre de san Carlos Lwanga y de sus compañeros mártires, produzca abundante cosecha para tu reino. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BONIFACIO, obispo y mártir:
  grado: Memoria
  fecha: 06-05
  comun: Del Común de un mártrir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De las Cartas de san Bonifacio, obispo y mártir
      (Carta 78; MGH, Epistolae 3, 352. 354)
    texto: |-
      La Iglesia, que como una gran nave surca los mares de este mundo, y que es azotada por las olas de las diversas pruebas de esta vida, no ha de ser abandonada a sí misma, sino gobernada.
      De ello nos dan ejemplo nuestros primeros padres Clemente y Cornelio y muchos otros en la ciudad de Roma, Cipriano en Cartago, Atanasio en Alejandría, los cuales, bajo el reinado de los emperadores paganos, gobernaban la nave de Cristo, su amada esposa, que es la Iglesia, con sus enseñanzas, con su protección, con sus trabajos y sufrimientos hasta derramar su sangre.
      Al pensar en éstos y otros semejantes, me estremezco y me asalta el temor y el terror, me cubre el espanto por mis pecados, y de buena gana abandonaría el gobierno de la Iglesia que me ha sido confiado, si para ello encontrara apoyo en el ejemplo de los Padres o en la sagrada Escritura.
      Mas, puesto que las cosas son así y la verdad puede ser impugnada, pero no vencida ni engañada, nuestra mente fatigada se refugia en aquellas palabras de Salomón: Confía en el Señor con toda el alma, no te fíes de tu propia inteligencia; en todos tus caminos piensa en él, y él allanará tus sendas. Y en otro lugar: Torre fortísima es el nombre del Señor, en él espera el justo y es socorrido. Mantengámonos en la justicia y preparemos nuestras almas para la prueba; sepamos aguantar hasta el tiempo que Dios quiera y digámosle: Señor, tú has sido nuestro refugio de generación en generación.
      Tengamos confianza en él, que es quien nos ha impuesto esta carga. Lo que no podamos llevar por nosotros mismos, llevémoslo con la fuerza de aquel que es todopoderoso y que ha dicho: Mi yugo es suave y mi carga ligera. Mantengámonos firmes en la lucha en el día del Señor, ya que han venido sobre nosotros días de angustia y aflicción. Muramos, si así lo quiere Dios, por las santas leyes de nuestros padres, para que merezcamos como ellos conseguir la herencia eterna.
      No seamos perros mudos, no seamos centinelas silenciosos, no seamos mercenarios que huyen del lobo, sino pastores solícitos que vigilan sobre el rebaño de Cristo, anunciando el designio de Dios a los grandes y a los pequeños, a los ricos y a los pobres, a los hombres de toda condición y de toda edad, en la medida en que Dios nos dé fuerzas, a tiempo y a destiempo, tal como lo escribió san Gregorio en su libro a los pastores de la Iglesia.
    titulo: PASTOR SOLÍCITO, QUE VELA SOBRE EL REBAÑO DE CRISTO
  resp2:
    ref: 1Ts 2, 8; Ga 4, 19
    vr:
    - - R
      - Queríamos daros no sólo el Evangelio de Dios, sino incluso nuestro propio ser, * porque habíais llegado a sernos muy queridos.
    - - V
      - ¡Hijos míos!, por quienes sufro de nuevo dolores de parto, hasta ver a Cristo formado en vosotros.
    - - R
      - Porque habíais llegado a sernos muy queridos.
  oracion: Señor, que la intercesión de tu mártir san Bonifacio nos ayude a mantener con firmeza y a proclamar con nuestras obras aquella misma fe que él predicó con su palabra y testimonió con su sangre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL SANTÍSIMO CUERPO Y SANGRE DE CRISTO:
  grado: Solemnidad
  fecha: variable
  himno: Aquella noche santa
  salmodia:
  - ant: 'Decid a los invitados: «Tengo ya preparado el banquete, venid a las bodas.» Aleluia.'
    salmo: salmo-22
  - ant: El que tenga sed que venga a mí y que beba en la fuente eterna.
    salmo: salmo-41
  - ant: El Señor nos alimentó con flor de harina, nos sació con miel silvestre.
    salmo: salmo-80
  versiculo:
  - - V
    - La Sabiduría se ha construido su casa. Aleluia.
  - - R
    - Ha mezclado el vino y puesto la mesa. Aleluia.
  lectura1:
    ref: Del libro del Éxodo 24, 1-11
    texto: |-
      En aquellos días, dijo Dios a Moisés:
      «Sube hacia mí con Aarón, Nadab, Abihú y los setenta ancianos de Israel, y prosternaos a distancia. Después se acercará Moisés solo, ellos no se acercarán; tampoco el pueblo subirá con ellos.»
      Moisés bajó y contó al pueblo todo lo que le había dicho el Señor, todos sus mandatos, y el pueblo contestó a una:
      «Haremos todo lo que dice el Señor.»
      Entonces Moisés puso por escrito todas las palabras del Señor. Se levantó temprano y edificó un altar en la falda del monte, y doce estelas por las doce tribus de Israel. Mandó luego a algunos jóvenes israelitas que ofreciesen holocaustos e inmolasen vacas como sacrificio de comunión para el Señor. Después tomó la mitad de la sangre y la echó en recipientes, y con la otra roció el altar. Tomó en seguida el documento del pacto y se lo leyó en voz alta al pueblo, el cual respondió:
      «Haremos todo lo que manda el Señor y obedeceremos.»
      Moisés tomó el resto de la sangre y roció con ella al pueblo, diciendo:
      «Ésta es la sangre de la alianza que el Señor hace con vosotros, de acuerdo con todas estas palabras.»
      Subieron Moisés, Aarón, Nadab, Abihú y los setenta ancianos de Israel, y vieron al Dios de Israel. Bajo sus pies había como un pavimento de zafiro, tan puro como el mismo cielo cuando está sereno. Dios no extendió la mano contra los notables de Israel, los cuales pudieron contemplar a Dios y después comieron y bebieron.
    titulo: VIERON AL SEÑOR Y COMIERON Y BEBIERON EN SU PRESENCIA
  resp1:
    ref: Jn 6, 48. 49. 50. 51. 52
    vr:
    - - R
      - Yo soy el pan de vida; vuestros padres comieron el maná en el desierto y murieron; * éste es el pan que baja del cielo para que quien lo coma no muera.
    - - V
      - Yo soy el pan vivo bajado del cielo; todo el que coma de este pan vivirá eternamente.
    - - R
      - Éste es el pan que baja del cielo para que quien lo coma no muera.
  lectura2:
    autor: |-
      De las Obras de santo Tomás de Aquino, presbítero
      (Opúsculo 57, En la fiesta del Cuerpo de Cristo, lect. 1-4)
    texto: |-
      El Hijo único de Dios, queriendo hacernos partícipes de su divinidad, tomó nuestra naturaleza, a fin de que, hecho hombre, divinizase a los hombres.
      Además, entregó por nuestra salvación todo cuanto tomó de nosotros. Porque, por nuestra reconciliación, ofreció, sobre el altar de la cruz, su cuerpo como víctima a Dios, su Padre, y derramó su sangre como precio de nuestra libertad y como baño sagrado que nos lava, para que fuésemos liberados de una miserable esclavitud y purificados de todos nuestros pecados.
      Pero, a fin de que guardásemos por siempre jamás en nosotros la memoria de tan gran beneficio, dejó a los fieles, bajo la apariencia de pan y de vino, su cuerpo, para que fuese nuestro alimento, y su sangre, para que fuese nuestra bebida.
      ¡Oh banquete precioso y admirable, banquete saludable y lleno de toda suavidad! ¿Qué puede haber, en efecto, de más precioso que este banquete en el cual no se nos ofrece, para comer, la carne de becerros o de machos cabríos, como se hacía antiguamente, bajo la ley, sino al mismo Cristo, verdadero Dios?
      No hay ningún sacramento más saludable que éste, pues por él se borran los pecados, se aumentan las virtudes y se nutre el alma con la abundancia de todos los dones espirituales.
      Se ofrece, en la Iglesia, por los vivos y por los difuntos, para que a todos aproveche, ya que ha sido establecido para la salvación de todos.
      Finalmente, nadie es capaz de expresar la suavidad de este sacramento, en el cual gustamos la suavidad espiritual en su misma fuente y celebramos la memoria del inmenso y sublime amor que Cristo mostró en su pasión.
      Por eso, para que la inmensidad de este amor se imprimiese más profundamente en el corazón de los fieles, en la última cena, cuando después de celebrar la Pascua con sus discípulos iba a pasar de este mundo al Padre, Cristo instituyó este sacramento como el memorial perenne de su pasión, como el cumplimiento de las antiguas figuras y la más maravillosa de sus obras; y lo dejó a los suyos como singular consuelo en las tristezas de su ausencia.
    titulo: ¡OH BANQUETE PRECIOSO Y ADMIRABLE!
  resp2:
    ref: ''
    vr:
    - - R
      - Reconoced en el pan al mismo que pendió en la cruz; reconoced en el cáliz la sangre que brotó de su costado. Tomad, pues, y comed el cuerpo de Cristo; tomad y bebed su sangre. * Sois ya miembros de Cristo.
    - - V
      - Comed el vínculo que os mantiene unidos, no sea que os disgreguéis; bebed el precio de vuestra redención, no sea que os depreciéis.
    - - R
      - Sois ya miembros de Cristo.
  oracion: Señor nuestro Jesucristo, que en este sacramento admirable nos dejaste el memorial de tu pasión, concédenos venerar de tal modo los sagrados misterios de tu cuerpo y de tu sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas con el Padre en la unidad del Espíritu Santo y eres Dios, por los siglos de los siglos.
SAN BERNABÉ, apóstol:
  grado: Memoria
  fecha: 06-11
  comun: Del Común de Apóstoles.
  himno: Mensajeros de Dios
  lectura2:
    autor: |-
      De los Tratados de san Cromacio, obispo, sobre el evangelio de san Mateo
      (Tratado 5, 1. 3-4: CCL 9. 405-407)
    texto: |-
      Vosotros sois la luz del mundo. No puede ocultarse una ciudad situada en lo alto del monte; ni se enciende una lámpara para meterla bajo el celemín, sino para ponerla sobre el candelero, así alumbra a todos los que están en la casa. El Señor dijo a sus discípulos que eran la sal de la tierra, porque ellos, por medio de la sabiduría celestial, condimentaron los corazones de los hombres que, por obra del demonio, habían perdido su sabor. Ahora añade también que son la luz del mundo, ya que, iluminados por él mismo, que es la luz verdadera y eterna, se convirtieron ellos también en luz que disipó las tinieblas.
      Puesto que él era el sol de justicia, con razón llama a sus discípulos luz del mundo, ya que ellos fueron como los rayos a través de los cuales derramó sobre el mundo la luz de su conocimiento; ellos, en efecto, ahuyentaron del corazón de los hombres las tinieblas del error, dándoles a conocer la luz de la verdad.
      También nosotros, iluminados por ellos, nos hemos convertido de tinieblas en luz, tal como dice el Apóstol: Un tiempo erais tinieblas, pero ahora sois luz en el Señor. Caminad como hijos de la luz. Y también: Todos sois hijos de la luz e hijos del día. No somos de la noche ni de las tinieblas.
      En este mismo sentido habla san Juan en su carta, cuando dice: Dios es luz, y el que permanece en Dios está en la luz, como él también está en la luz. Por lo tanto, ya que tenemos la dicha de haber sido liberados de las tinieblas del error, debemos caminar siempre en la luz, como hijos que somos de la luz. Por esto dice el Apóstol: Aparecéis como antorchas en el mundo, presentándole la palabra de vida.
      Si así no lo hacemos, es como si, con nuestra infidelidad, pusiéramos un velo que tapa y oscurece esta luz tan útil y necesaria, en perjuicio nuestro y de los demás. Por esto también incurrió en castigo aquel siervo que prefirió esconder el talento, que había recibido para negociar un lucro celestial, antes que ponerlo en el banco, como sabemos por el Evangelio.
      Así, pues, aquella lámpara resplandeciente, encendida para nuestra salvación, debe brillar siempre en nosotros. Poseemos, en efecto, la lámpara de los mandatos celestiales y de la gracia espiritual, acerca de la cual afirma el salmista: Lámpara es tu palabra para mis pasos, luz en mi sendero. De ella dice también Salomón: El consejo de la ley es lámpara.
      Por consiguiente, nuestro deber es no ocultar esta lámpara de la ley y de la fe, sino ponerla siempre en alto en la Iglesia, como en un candelero, para la salvación de todos, para que así nos beneficiemos nosotros de la luz de su verdad y para que ilumine a todos los creyentes.
    titulo: VOSOTROS SOIS LA LUZ DEL MUNDO
  resp2:
    ref: Hch 11, 23-24
    vr:
    - - R
      - Cuando Bernabé llegó a Antioquía y vio la gracia de Dios, se llenó de júbilo; * pues era un hombre de gran virtud, lleno del Espíritu Santo y de una grande fe.
    - - V
      - Y exhortaba a todos a que con entera voluntad permaneciesen fieles al Señor.
    - - R
      - Pues era un hombre de gran virtud, lleno del Espíritu Santo y de una grande fe.
  oracion: Dios nuestro, que, después de haber infundido en abundancia la fe y el Espíritu Santo en San Bernabé, lo destinaste para que anunciara a los pueblos paganos el mensaje de salvación, haz que el Evangelio de Cristo, que él predicó valerosamente, sea proclamado con fidelidad por nuestras palabras y nuestras obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL SAGRADO CORAZÓN DE JESÚS:
  grado: Solemnidad
  fecha: variable
  himno: Por la lanza en su costado
  salmodia:
  - ant: En ti está la fuente viva; tú nos das a beber del torrente de tus delicias.
    salmo: salmo-35
  - ant: Cuando esté con el corazón abatido, llévame a una roca inaccesible.
    salmo: salmo-60
  - ant: Los confines de la tierra han contemplado la victoria de nuestro Dios.
    salmo: salmo-97
  versiculo:
  - - V
    - Recuerdo las proezas del Señor.
  - - R
    - Traigo a la memoria sus antiguos portentos.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Romanos 8, 28-39
    texto: |-
      Hermanos: Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.
      ¿Qué decir a todo esto? Si Dios está con nosotros, ¿quién estará contra nosotros? El que no perdonó a su propio Hijo, sino que lo entregó a la muerte por todos nosotros, ¿cómo no nos dará con él todo lo demás? ¿Quién se atreverá a acusar a los elegidos de Dios? Siendo Dios quien justifica, ¿quién podrá condenar? ¿Acaso Cristo Jesús, el que murió por nosotros? Más aún, ¿el que fue resucitado y está a la diestra de Dios intercediendo por nosotros? ¿Quién podrá apartarnos del amor de Cristo? ¿La aflicción? ¿La angustia? ¿La persecución? ¿El hambre? ¿La desnudez? ¿El peligro? ¿La espada? (Como dice la Escritura: «Por tu causa nos llevan a la muerte uno y otro día; nos tratan como a ovejas que van al matadero.») Pero en todo esto vencemos fácilmente por aquel que nos ha amado.
      Pues estoy convencido de que ni muerte, ni vida, ni ángeles, ni principados, ni presente, ni futuro, ni potencias, ni altura, ni profundidad, ni creatura alguna podrá apartarnos del amor de Dios manifestado en Cristo Jesús, Señor nuestro.
    titulo: EL AMOR DE DIOS SE MANIFIESTA EN CRISTO
  resp1:
    ref: Ef 2, 5. 4. 7
    vr:
    - - R
      - Cuando estábamos muertos por nuestros pecados, Dios nos vivificó con Cristo, * por el gran amor con que nos amó.
    - - V
      - Quiso mostrar en los siglos venideros la sublime riqueza de su gracia.
    - - R
      - Por el gran amor con que nos amó.
  lectura2:
    autor: |-
      De las Obras de san Buenaventura, obispo
      (Opúsculo 3, El árbol de la vida, 29-30. 47: Opera omnia 8, 79)
    texto: |-
      Y tú, hombre redimido, considera quién, cuál y cuán grande es éste que está pendiente de la cruz por ti. Su muerte resucita a los muertos, su tránsito lo lloran los cielos y la tierra, y las mismas piedras, como movidas de compasión natural, se quebrantan. ¡Oh corazón humano, más duro eres que ellas, si con el recuerdo de tal víctima ni el temor te espanta, ni la compasión te mueve, ni la compunción te aflige, ni la piedad te ablanda!
      Para que del costado de Cristo dormido en la cruz se formase la Iglesia y se cumpliese la Escritura que dice: Mirarán a quien traspasaron, uno de los soldados lo hirió con una lanza y le abrió el costado. Y fue permisión de la divina providencia, a fin de que, brotando de la herida sangre y agua, se derramase el precio de nuestra salud, el cual, manando de la fuente arcana del corazón, diese a los sacramentos de la Iglesia la virtud de conferir la vida de la gracia, y fuese para los que viven en Cristo como una copa llenada en la fuente viva, que brota para comunicar vida eterna.
      Levántate, pues, alma amiga de Cristo, y sé la paloma que labra su nido en los agujeros de la peña; sé el pájaro que encuentra su casa y no deja de guardarla; sé la tórtola que esconde los polluelos de su casto amor en aquella abertura sacratísima. Aplica a ella tus labios para que bebas el agua de las fuentes del Salvador. Porque ésta es la fuente que mana en medio del paraíso y, dividida en cuatro ríos que se derraman en los corazones amantes, riega y fecunda toda la tierra.
      Corre con vivo deseo a esta fuente de vida y de luz quienquiera que seas, ¡oh alma amante de Dios!, y con toda la fuerza del corazón exclama:
      «¡Oh hermosura inefable del Dios altísimo, resplandor purísimo de la eterna luz! ¡Vida que vivificas toda vida, luz que iluminas toda luz y conservas en perpetuo resplandor millares de luces, que desde la primera aurora fulguran ante el trono de tu divinidad!
      ¡Oh eterno e inaccesible, claro y dulce manantial de la fuente oculta a los ojos mortales, cuya profundidad es sin fondo, cuya altura es sin término, su anchura ilimitada y su pureza imperturbable!
      De ti procede el río que alegra a la ciudad de Dios. Recrea con el agua de este deseable torrente los resecos labios de los sedientos de amor, para que con voz de regocijo y gratitud te cantemos himnos de alabanza, probando por experiencia que en ti está la fuente de la vida y tu luz nos hace ver la luz.»
    titulo: EN TI ESTA LA FUENTE DE LA VIDA
  resp2:
    ref: Sal 102, 2. 4; 33, 9
    vr:
    - - R
      - Bendice, alma mía, al Señor, y no olvides sus beneficios. * Él rescata tu vida de la fosa y te colma de gracia y de ternura.
    - - V
      - Gustad y ved que bueno es el Señor.
    - - R
      - Él rescata tu vida de la fosa y te colma de gracia y de ternura.
  te_deum: true
  oracion: Te pedimos, Dios todopoderoso y eterno, que, al celebrar la grandeza del amor que resplandece en el corazón de tu Hijo, recibamos de esta fuente divina gracias cada vez más abundantes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL INMACULADO CORAZÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: variable
  comun: Del Común de la Santísima Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De los Sermones de san Lorenzo Justiniano, obispo
      (Sermón 8, En la fiesta de la Purificación de la Santísima Virgen María: Opera 2, Venecia 1751, 38-39)
    texto: |-
      María iba reflexionando sobre todas las cosas que había conocido leyendo, escuchando, mirando, y de este modo su fe iba en aumento constante, sus méritos crecían, su sabiduría se hacía más clara y su caridad era cada vez más ardiente. Su conocimiento y penetración, siempre renovados, de los misterios celestiales la llenaban de alegría, la hacían gozar de la fecundidad del Espíritu, la atraían hacia Dios y la hacían perseverar en su propia humildad. Porque en esto consisten los progresos de la gracia divina, en elevar desde lo más humilde hasta lo más excelso y en ir transformando de resplandor en resplandor. Bienaventurada el alma de la Virgen que, guiada por el magisterio del Espíritu que habitaba en ella, se sometía siempre y en todo a las exigencias de la Palabra de Dios.
      Ella no se dejaba llevar por su propio instinto o juicio, sino que su actuación exterior correspondía siempre a las insinuaciones internas de la sabiduría que nace de la fe. Convenía, en efecto, que la sabiduría divina, que se iba edificando la casa de la Iglesia para habitar en ella, se valiera de María santísima para lograr la observancia de la ley, la purificación de la mente, la justa medida de la humildad y el sacrificio espiritual.
      Imítala tú, alma fiel. Entra en el templo de tu corazón, si quieres alcanzar la purificación espiritual y la limpieza de todo contagio de pecado. Allí Dios atiende más a la intención que a la exterioridad de nuestras obras. Por esto, ya sea que por la contemplación salgamos de nosotros mismos para reposar en Dios, ya sea que nos ejercitemos en la práctica de las virtudes o que nos esforcemos en ser útiles a nuestro prójimo con nuestras buenas obras, hagámoslo de manera que la caridad de Cristo sea lo único que nos apremie. Éste es el sacrificio de la purificación espiritual, agradable a Dios, que se ofrece no en un templo hecho por mano de hombres, sino en el templo del corazón, en el que Cristo el Señor entra de buen grado.
    titulo: MARÍA CONSERVABA TODAS ESTAS COSAS EN SU CORAZÓN
  resp2:
    ref: ''
    vr:
    - - R
      - No hay alabanza digna de ti, virginidad inmaculada y santa. * Porque en tu seno has llevado al que ni el cielo puede contener.
    - - V
      - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
    - - R
      - Porque en tu seno has llevado al que ni el cielo puede contener.
  oracion: Señor Dios, que en el corazón de santa María Virgen preparaste al Espíritu Santo una digna morada, haz que también nosotros, por intercesión de María, seamos transformados en templos de tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANTONIO DE PADUA, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 06-13
  comun: 'Del Común de pastores: para un santo presbítero y del Común de doctores de la Iglesia.'
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura1:
    ref: Comienza el libro de Esdras 1, 1-8; 2, 68-3, 8
    texto: |-
      El año primero de Ciro, rey de Persia, el Señor, para cumplir lo qué había anunciado por boca de Jeremías, movió a Ciro de Persia a promulgar de palabra y por escrito en todo su reino:
      «Ciro, rey de Persia, decreta: El Señor, Dios del cielo, me ha entregado todos los reinos de la tierra y me ha encargado construirle un templo en Jerusalén de Judá. Los que entre vosotros pertenezcan a ese pueblo, que su Dios los acompañe y suban a Jerusalén de Judá para reconstruir el templo del Señor, Dios de Israel, el Dios que habita en Jerusalén. Y a todos los supervivientes, dondequiera que residan, la gente del lugar les proporcionará plata, oro, hacienda y ganado, además de las ofrendas voluntarias para el templo del Dios de Jerusalén.»
      Entonces, todos los que se sintieron movidos por Dios —cabezas de familia de Judá y Benjamín, sacerdotes y levitas— se pusieron en marcha y subieron a reedificar el templo de Jerusalén. Sus vecinos les proporcionaron de todo: plata, oro, hacienda, ganado y otros muchos regalos, además de las ofrendas voluntarias.
      El rey Ciro mandó sacar los utensilios del templo que Nabucodonosor se había llevado de Jerusalén para colocarlos en el templo de su dios. Ciro de Persia los consignó al tesorero Mitrídates, que los contó delante de Sesbasar, príncipe de Judá.
      Cuando llegaron al templo de Jerusalén, algunos cabezas de familia hicieron donativos para que se reconstruyese en su mismo sitio. De acuerdo con sus posibilidades, entregaron al fondo del culto sesenta y una mil dracmas de oro, cinco mil minas de plata y cien túnicas sacerdotales.
      Los sacerdotes, los levitas y parte del pueblo se establecieron en Jerusalén; los cantores, los porteros y los donados, en sus pueblos; y el resto de Israel, en los suyos.
      Los israelitas se encontraban ya en sus poblaciones cuando, al llegar el séptimo mes, se reunieron todos a una en Jerusalén. Entonces Josué, hijo de Josadac, con sus parientes los sacerdotes, y Zorobabel, hijo de Salatiel, con sus parientes, se pusieron a construir el altar del Dios de Israel para ofrecer en él holocaustos, como manda la ley de Moisés, hombre de Dios. Levantaron el altar en su antiguo sitio —aunque intimidados por los colonos extranjeros— y ofrecieron en él al Señor los holocaustos matutinos y vespertinos.
      Celebraron la fiesta de los Tabernáculos como está mandado, ofreciendo holocaustos según el número y el ritual de cada día; y siguieron ofreciendo el holocausto diario, el de principios de mes, el de las solemnidades dedicadas al Señor y los ofrecidos voluntariamente al Señor.
      El día primero del séptimo mes, comenzaron a ofrecer holocaustos al Señor. Pero aún no se habían echado los cimientos del templo. Entonces, de acuerdo con lo autorizado por Ciro de Persia, contrataron canteros y carpinteros, y dieron a los sidonios y tirios alimentos, bebidas y aceite para que enviasen a Jafa, por vía marítima, madera de cedro del Líbano.
      A los dos años de haber llegado al templo de Jerusalén, el segundo mes, Zorobabel, hijo de Salatiel, Josué, hijo de Josadac, sus demás parientes sacerdotes y levitas, y todos los que habían vuelto a Jerusalén del cautiverio comenzaron la obra del templo, poniendo al frente de ella a los levitas mayores de veinte años.
    titulo: LIBERACIÓN DEL PUEBLO Y RETORNO DE LOS DESTERRADOS. RESTAURACIÓN DEL CULTO
  resp1:
    ref: Is 48, 20; 40, 1
    vr:
    - - R
      - 'Proclamadlo, publicadlo hasta el confín de la tierra, decid: * «El Señor ha rescatado a su siervo Jacob.»'
    - - V
      - «Consolad, consolad a mi pueblo», dice vuestro Dios.
    - - R
      - El Señor ha rescatado a su siervo Jacob.
  lectura2:
    autor: |-
      De los Sermones de san Antonio de Padua, presbítero
      (I, 226)
    texto: |-
      El que está lleno del Espíritu Santo habla diversas lenguas. Estas diversas lenguas son los diversos testimonios que da de Cristo, como por ejemplo la humildad, la pobreza, la paciencia y la obediencia, que son las palabras con que hablamos cuando los demás pueden verlas reflejadas en nuestra conducta. La palabra tiene fuerza cuando va acompañada de las obras. Cesen, por favor, las palabras y sean las obras quienes hablen. Estamos repletos de palabras, pero vacíos de obras, y por esto el Señor nos maldice como maldijo aquella higuera en la que no halló fruto, sino hojas tan sólo. «La norma del predicador —dice san Gregorio— es poner por obra lo que predica.» En vano se esfuerza en propagar la doctrina cristiana el que la contradice con sus obras.
      Pero los apóstoles hablaban según les hacía expresarse el Espíritu Santo. ¡Dichoso el que habla según le hace expresarse el Espíritu Santo y no según su propio sentir!
      Porque hay algunos que hablan movidos por su propio espíritu, roban las palabras de los demás y las proponen como suyas, atribuyéndolas a sí mismos. De estos tales y de otros semejantes dice el Señor por boca de Jeremías: Aquí estoy yo contra los profetas que se roban mis palabras uno a otro. Aquí estoy yo contra los profetas —oráculo del Señor— que manejan la lengua para echar oráculos. Aquí estoy yo contra los profetas de sueños falsos —oráculo del Señor—, que los cuentan para extraviar a mi pueblo, con sus embustes y jactancias. Yo no los mandé ni los envié, por eso son inútiles a mi pueblo —oráculo del Señor—.
      Hablemos, pues, según nos haga expresarnos el Espíritu Santo, pidiéndole con humildad y devoción que infunda en nosotros su gracia, para que completemos el significado quincuagenario del día de Pentecostés, mediante el perfeccionamiento de nuestros cinco sentidos y la observancia de los diez mandamientos, y para que nos llenemos de la ráfaga de viento de la contrición, de manera que, encendidos e iluminados por los sagrados esplendores, podamos llegar a la contemplación del Dios uno y trino.
    titulo: LA PALABRA TIENE FUERZA CUANDO VA ACOMPAÑADA DE LAS OBRAS
  resp2:
    ref: Cf. Os 14, 6; cf. Sal 91, 13; Sir 24, 4
    vr:
    - - R
      - El justo florecerá como un lirio * y se alegrará eternamente ante el Señor.
    - - V
      - En medio de su pueblo se gloría.
    - - R
      - Y se alegrará eternamente ante el Señor.
  oracion: Dios todopoderoso y eterno, que diste a tu pueblo un predicador insigne del Evangelio en san Antonio de Padua, y un intercesor eficaz que lo asistiera en sus dificultades, concédenos, por su intercesión, que seamos fieles a las enseñanzas del Evangelio y que contemos con tu ayuda en todas las adversidades. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN LUIS GONZAGA, religioso:
  grado: Memoria
  fecha: 06-21
  comun: 'Del Común de santos varones: para los santos religiosos.'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De una Carta de san Luis Gonzaga, dirigida a su madre
      (Acta Sanctorum Iunii 5, 878)
    texto: |-
      Pido para ti, ilustre señora, que goces siempre de la gracia y del consuelo del Espíritu Santo. Al llegar tu carta, me encuentro todavía en esta región de los muertos. Pero un día u otro ha de llegar el momento de volar al cielo, para alabar al Dios eterno en la tierra de los que viven. Yo esperaba poco ha que habría realizado ya este viaje antes de ahora. Si la caridad consiste, como dice san Pablo, en alegrarse con los que se alegran y llorar con los que lloran, ha de ser inmensa tu alegría, madre ilustre, al pensar que Dios me llama a la verdadera alegría, que pronto poseeré con la seguridad de no perderla jamás.
      Te he de confesar, ilustre señora, que al sumergir mi pensamiento en la consideración de la divina bondad, que es como un mar sin fondo ni litoral, no me siento digno de su inmensidad, ya que él, a cambio de un trabajo tan breve y exiguo, me invita al descanso eterno y me llama desde el cielo a la suprema felicidad, que con tanta negligencia he buscado, y me promete el premio de unas lágrimas, que tan parcamente he derramado.
      Considéralo una y otra vez, ilustre señora, y guárdate de menospreciar esta infinita benignidad de Dios, que es lo que harías si lloraras como muerto al que vive en la presencia de Dios y que con su intercesión puede ayudarte en tus asuntos mucho más que cuando vivía en este mundo. Esta separación no será muy larga; volveremos a encontrarnos en el cielo, y todos juntos, unidos a nuestro Salvador, lo alabaremos con toda la fuerza de nuestro espíritu y cantaremos eternamente sus misericordias, gozando de una felicidad sin fin. Al morir, nos quita lo que antes nos había prestado, con el solo fin de guardarlo en un lugar más inmune y seguro, y para enriquecernos con unos bienes que superan nuestros deseos.
      Todo esto lo digo solamente para expresar mi deseo de que tú, ilustre señora, así como los demás miembros de mi familia, consideréis mi partida de este mundo como un motivo de gozo, y para que no me falte tu bendición materna en el momento de atravesar este mar hasta llegar a la orilla en donde tengo puestas todas mis esperanzas. Así te escribo, porque estoy convencido de que ésta es la mejor manera de demostrarte el amor y respeto que te debo como hijo.
    titulo: CANTARÉ ETERNAMENTE LAS MISERICORDIAS DEL SEÑOR
  resp2:
    ref: Sal 40, 13; 83, 11
    vr:
    - - R
      - Has conservado mi inocencia, Señor, * tú me mantienes siempre en tu presencia.
    - - V
      - Prefiero el umbral de la casa de Dios a vivir con los malvados.
    - - R
      - Tú me mantienes siempre en tu presencia.
  oracion: Dios nuestro, fuente y origen de todos los dones celestiales, tú que uniste en San Luis Gonzaga una admirable pureza de vida con la práctica de la penitencia, concédenos, por sus méritos e intercesión, que los que no hemos podido imitarlo en la inocencia de su vida lo imitemos en su espíritu de penitencia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL NACIMIENTO DE SAN JUAN BAUTISTA:
  grado: Solemnidad
  fecha: 06-24
  himno: Voz más rica que un concierto
  salmodia:
  - ant: El Señor me llamó desde el vientre de mi madre, cuando aún estaba yo en el seno materno pronunció mi nombre.
    salmo: salmo-20-2-8-14
  - ant: El Señor hizo de mi boca una espada afilada, me escondió en la sombra de su mano.
    salmo: salmo-91-i
  - ant: 'Juan declaró como testigo: «El que ha de venir después de mí existía antes que yo.»'
    salmo: salmo-91-ii
  versiculo:
  - - V
    - Éste vino como testigo enviado a declarar en favor de la luz.
  - - R
    - Para que por su medio todos abrazasen la fe.
  lectura1:
    ref: Del libro del profeta Jeremías 1, 4-10. 17-19
    texto: |-
      Recibí esta palabra del Señor:
      «Antes de formarte en el vientre, te escogí; antes de que salieras del seno materno, te consagré: te nombré profeta de los gentiles.»
      Yo repuse:
      «¡Ay, Señor mío! Mira que no sé hablar, que soy un muchacho.»
      El Señor me contestó:
      «No digas: "Soy un muchacho", que adonde yo te envíe irás, y lo que yo te mande lo dirás. No les tengas miedo, yo estoy contigo para librarte —oráculo del Señor—.»
      El Señor extendió la mano y me tocó la boca; y me dijo:
      «Mira: yo pongo mis palabras en tu boca, hoy te establezco sobre pueblos y reyes, para arrancar y arrasar, para destruir y demoler, para edificar y plantar. Pero tú cíñete los lomos, ponte en pie y diles lo que yo te mando. No les tengas miedo, que yo no te haré desmayar delante de ellos. Mira: Yo te convierto hoy en plaza fuerte, en columna de hierro, en muralla de bronce, frente a todo el país: frente a los reyes y príncipes de Judá, frente a los sacerdotes y la gente del pueblo; lucharán contra ti, pero no podrán contigo, porque yo estoy contigo para librarte —oráculo del Señor—.»
    titulo: LA VOCACIÓN DEL PROFETA
  resp1:
    ref: Jr 1, 5. 9. 10
    vr:
    - - R
      - 'Antes de formarte en el vientre, te escogí; antes de que salieras del seno materno, te consagré: * te nombré profeta de los gentiles.'
    - - V
      - Yo pongo mis palabras en tu boca, yo te establezco sobre pueblos y reyes.
    - - R
      - Te nombré profeta de los gentiles.
  lectura2:
    autor: |-
      De los Sermones de san Agustín, obispo
      (Sermón 293, 1-3: PL 38, 1327-1328)
    texto: |-
      La Iglesia celebra el nacimiento de Juan como algo sagrado, y él es el único de los santos cuyo nacimiento se festeja; celebramos el nacimiento de Juan y el de Cristo. Ello no deja de tener su significado, y, si nuestras explicaciones no alcanzaran a estar a la altura de misterio tan elevado, no hemos de perdonar esfuerzo para profundizarlo y sacar provecho de él.
      Juan nace de una anciana estéril; Cristo, de una jovencita virgen. El futuro padre de Juan no cree el anuncio de su nacimiento y se queda mudo; la Virgen cree el del nacimiento de Cristo y lo concibe por la fe. Esto es, en resumen, lo que intentaremos penetrar y analizar; y, si el poco tiempo y las pocas facultades de que disponemos no nos permiten llegar hasta las profundidades de este misterio tan grande, mejor os adoctrinará aquel que habla en vuestro interior, aun en ausencia nuestra, aquel que es el objeto de vuestros piadosos pensamientos, aquel que habéis recibido en vuestro corazón y del cual habéis sido hechos templo.
      Juan viene a ser como la línea divisoria entre los dos Testamentos, el antiguo y el nuevo. Así lo atestigua el mismo Señor, cuando dice: La ley y los profetas llegan hasta Juan. Por tanto, él es como la personificación de lo antiguo y el anuncio de lo nuevo. Porque personifica lo antiguo, nace de padres ancianos; porque personifica lo nuevo, es declarado profeta en el seno de su madre. Aún no ha nacido y, al venir la Virgen María, salta de gozo en las entrañas de su madre. Con ello queda ya señalada su misión, aun antes de nacer; queda demostrado de quién es precursor, antes de que él lo vea. Estas cosas pertenecen al orden de lo divino y sobrepasan la capacidad de la humana pequeñez. Finalmente, nace, se le impone el nombre, queda expedita la lengua de su padre. Estos acontecimientos hay que entenderlos con toda la fuerza de su significado.
      Zacarías calla y pierde el habla hasta que nace Juan, el precursor del Señor, y abre su boca. Este silencio de Zacarías significaba que, antes de la predicación de Cristo, el sentido de las profecías estaba en cierto modo latente, oculto, encerrado. Con el advenimiento de aquel a quien se referían estas profecías, todo se hace claro. El hecho de que en el nacimiento de Juan se abre la boca de Zacarías tiene el mismo significado que el rasgarse el velo al morir Cristo en la cruz. Si Juan se hubiera anunciado a sí mismo, la boca de Zacarías habría continuado muda. Si se desata su lengua es porque ha nacido aquel que es la voz; en efecto, cuando Juan cumplía ya su misión de anunciar al Señor, le dijeron: Dinos quién eres. Y él respondió: Yo soy la voz del que clama en el desierto. Juan era la voz; pero el Señor era la Palabra que existía ya al comienzo de las cosas. Juan era una voz pasajera, Cristo la Palabra eterna desde el principio.
    titulo: LA VOZ DEL QUE CLAMA EN EL DESIERTO
  resp2:
    ref: Lc 1, 76-77
    vr:
    - - R
      - A ti, niño, te llamarán profeta del Altísimo, * porque irás delante del Señor a preparar sus caminos.
    - - V
      - Anunciando a su pueblo la salvación, el perdón de sus pecados.
    - - R
      - Porque irás delante del Señor a preparar sus caminos.
  te_deum: true
  oracion: Dios todopoderoso, que suscitaste a san Juan Bautista, para que le preparara a Cristo un pueblo bien dispuesto, concede a tu pueblo el don de la alegría espiritual y guíanos por el camino de la salvación y de la paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN IRENEO, obispo y mártir:
  grado: Memoria
  fecha: 06-28
  comun: Del Común de un mártir.
  himno: Testigos de amor
  lectura1:
    ref: Del libro de Nehemías 8, 1-18
    texto: |-
      Al llegar el séptimo mes, los israelitas se encontraban instalados en sus ciudades. Entonces, todo el pueblo se reunió, como un solo hombre, en la plaza que se abre ante la puerta del Agua, y pidió a Esdras, el letrado, que trajera el libro de la ley de Moisés, que Dios había dado a Israel. El sacerdote Esdras trajo el libro de la ley ante la asamblea, compuesta de hombres, mujeres y todos los que tenían uso de razón. Era a mediados del mes séptimo.
      En la plaza de la puerta del Agua, desde el amanecer hasta el mediodía, estuvo leyendo el libro a los hombres, a las mujeres y a los que tenían uso de razón. Toda la gente seguía con atención la lectura de la ley. Esdras, el letrado, estaba de pie en el púlpito de madera que había hecho para esta ocasión. A su derecha se encontraban Matitías, Sema, Anayas, Urías, Jelcías y Maseyas; a su izquierda, Fedayas, Misael, Malquías, Jasún, Jasbadana, Zacarías y Mesulán.
      Esdras abrió el libro a la vista de todo el pueblo -pues se hallaba en un puesto elevado- y, cuando lo abrió, toda la gente se puso en pie. Esdras bendijo al Señor, Dios grande, y todo el pueblo, levantando las manos, respondió:
      «Amén, amén.»
      Después, se inclinaron y adoraron al Señor, rostro en tierra. Los levitas Josué, Baní, Serebías, Yamín, Acub, Sabtay, Hodiyías, Maseyas, Quelitá, Azarías, Yozabad, Janán y Felayas explicaron la ley al pueblo, que se mantenía en sus puestos. Leían el libro de la ley de Dios, traduciéndolo y explicándolo para que se entendiese la lectura. El gobernador Nehemías, el sacerdote y letrado Esdras y los levitas que instruían al pueblo, viendo que la gente lloraba al escuchar la lectura de la ley, le dijeron:
      «Este día está consagrado al Señor, vuestro Dios; no hagáis duelo ni lloréis.»
      Después añadió:
      «Id a casa, comed buenas tajadas, bebed vinos generosos y enviad porciones a los que no tienen nada, porque hoy es día consagrado a nuestro Dios. No estéis tristes: la alegría del Señor es vuestra fortaleza.»
      Los levitas acallaban al pueblo, diciendo:
      «Silencio, que es un día santo; no estéis tristes.»
      El pueblo se fue, comió, bebió, envió porciones y organizó una gran fiesta, porque había comprendido lo que le habían explicado. Al día siguiente, los cabezas de familia de todo el pueblo, los sacerdotes y los levitas se reunieron con el letrado Esdras para estudiar el libro de la ley. En la ley que había mandado el Señor por medio de Moisés encontraron escrito: «Los israelitas habitarán en chozas durante la fiesta del séptimo mes.»
      Entonces, pregonaron en todos sus pueblos y en Jerusalén:
      «Id al monte y traed ramas de olivo, pino, mirto, palmera y de otros árboles frondosos para construir las chozas, como está mandado.»
      La gente fue, las trajo e hicieron las chozas; unos en la azotea, otros en sus patios, en los patios del templo, en la plaza de la puerta del Agua y en la plaza de la puerta de Efraím. Toda la asamblea que había vuelto del destierro hizo chozas, habitaron en ellas -cosa que no hacían los israelitas desde tiempos de Josué, hijo de Nun- y hubo una gran fiesta. Todos los días, del primero al último, leyó Esdras el libro de la ley de Dios. La fiesta duró siete días, y el octavo tuvo lugar una asamblea solemne, como está mandado.
    titulo: ESDRAS LEE, POR PRIMERA VEZ Y DE MODO SOLEMNE, LA LEY AL PUEBLO
  resp1:
    ref: Sal 18, 8-9; Rm 13, 8. 10
    vr:
    - - R
      - La ley del Señor es perfecta y es descanso del alma; el precepto del Señor es fiel e instruye al ignorante; * los mandatos del Señor son rectos y alegran el corazón; la norma del Señor es límpida y da luz a los ojos.
    - - V
      - Quien ama al prójimo ya ha cumplido la ley; así que amar es cumplir la ley entera.
    - - R
      - Los mandatos del Señor son rectos y alegran el corazón; la norma del Señor es límpida y da luz a los ojos.
  lectura2:
    autor: |-
      Del Tratado de san Ireneo, obispo, Contra las herejías
      (Libro 4, 20, 5-7: SC 100, 640-642. 644-648)
    texto: |-
      La claridad de Dios vivifica y, por lo tanto, los que ven a Dios reciben la vida. Por esto aquel que supera nuestra capacidad, que es incomprensible, invisible, se hace visible y comprensible para los hombres, se adapta a su capacidad, para dar vida a los que lo perciben y lo ven. Vivir sin vida es algo imposible, y la subsistencia de esta vida proviene de la participación de Dios, que consiste en ver a Dios y gozar de su bondad.
      Los hombres, pues, verán a Dios y vivirán, ya que esta visión los hará inmortales, al hacer que lleguen hasta la posesión de Dios. Esto, como dije antes, lo anunciaban ya los profetas de un modo velado, a saber, que verán a Dios los que son portadores de su Espíritu y esperan continuamente su venida. Como dice Moisés en el Deuteronomio: Aquel día veremos que puede Dios hablar a un hombre, y seguir éste con vida.
      Aquel que obra todo en todos es invisible e inefable en su ser y en su grandeza, con respecto a todos los seres creados por él, mas no por esto deja de ser conocido, porque todos sabemos, por medio de su Verbo, que es un solo Dios Padre, que lo abarca todo y que da el ser a todo; este conocimiento viene atestiguado por el Evangelio, cuando dice: Nadie ha visto jamás a Dios; el Hijo unigénito, que está en el seno del Padre, es quien nos lo ha dado a conocer.
      Así, pues, el Hijo nos ha dado a conocer al Padre desde el principio, ya que desde el principio está con el Padre; él, en efecto, ha manifestado al género humano el sentido de las visiones proféticas, de la distribución de los diversos carismas, con sus ministerios, y en qué consiste la glorificación del Padre, y lo ha hecho de un modo consecuente y ordenado, a su debido tiempo y con provecho; porque donde hay orden allí hay armonía, y donde hay armonía allí todo sucede a su debido tiempo, y donde todo sucede a su debido tiempo allí hay provecho.
      Por esto el Verbo se ha constituido en distribuidor de la gracia del Padre en provecho de los hombres, en cuyo favor ha puesto por obra los inescrutables designios de Dios, mostrando a Dios a los hombres, presentando al hombre a Dios; salvaguardando la invisibilidad del Padre, para que el hombre tuviera siempre un concepto muy elevado de Dios y un objetivo hacia el cual tender, pero haciendo también visible a Dios para los hombres, realizando así los designios eternos del padre, no fuera que el hombre, privado totalmente de Dios, dejara de existir; porque la gloria de Dios consiste en que el hombre viva, y la vida del hombre consiste en la visión de Dios. En efecto, si la revelación de Dios a través de la creación es causa de vida para todos los seres que viven en la tierra, mucho más lo será la manifestación del Padre por medio del Verbo para los que ven a Dios.
    titulo: LA GLORIA DE DIOS CONSISTE EN QUE EL HOMBRE VIVA Y LA VIDA DEL HOMBRE CONSISTE EN LA VISIÓN DE DIOS
  resp2:
    ref: Ml 2, 6; Sal 88, 22
    vr:
    - - R
      - «Una doctrina auténtica llevaba en su boca, y en sus labios no se hallaba maldad; * en paz y rectitud andaba conmigo», dice el Señor.
    - - V
