  te_deum: true
  oracion: No permitas, Señor, que ninguna desorientación llegue a perturbar nunca la fe de la Iglesia, que tú quisiste estuviera cimentada sobre la roca sólida de la confesión del apóstol san Pedro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN POLICARPO, obispo y mártir:
  grado: Memoria
  fecha: 02-23
  comun: Del Común de un mártir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la Carta de la Iglesia de Esmirna sobre el martirio de san Policarpo
      (Cap. 13, 2—15, 2: Funk 1, 297-299)
    texto: |-
      Cuando estuvo preparada la hoguera, Policarpo, habiéndose despojado de sus vestidos y soltado el ceñidor, se esforzaba también en descalzarse, cosa que no hubiera tenido que hacer antes, pues siempre todos los fieles rivalizaban en hacerlo, por el afán de ser los primeros en tocar su cuerpo, ya que, aun antes de su martirio, era grande la fama de virtud que le había ganado su santa vida.
      Llegó el momento en que ya estaban preparados a su alrededor todos los instrumentos necesarios para la hoguera. Cuando iban a clavarlo en el poste, dijo:
      «Dejadme así; el que me ha hecho la gracia de morir en el fuego hará también que permanezca inmóvil en la hoguera, sin necesidad de vuestros clavos.»
      Ellos, pues, no lo clavaron, sino que se limitaron a atarlo. Policarpo, con las manos atadas a la espalda, como una víctima insigne tomada del gran rebaño, dispuesta para la oblación, como ofrenda agradable a Dios, mirando al cielo, dijo:
      «Señor Dios todopoderoso, Padre de tu amado y bendito siervo Jesucristo, por quien hemos recibido el conocimiento de tu persona, Dios de los ángeles y de las potestades, de toda la creación y de toda la raza de los justos que viven en tu presencia: te bendigo porque en este día y en esta hora te has dignado agregarme al número de los mártires y me has concedido tener parte en el cáliz de tu Ungido, para alcanzar la resurrección y la vida eterna del alma y del cuerpo en la incorrupción por el Espíritu Santo; ojalá sea hoy recibido como ellos en tu presencia como un sacrificio pingüe y acepto, tal como de antemano lo dispusiste y me diste a conocer, y ahora lo cumples, oh Dios, veraz y verdadero. Por esto te alabo por todas estas cosas, te bendigo, te glorifico por mediación del eterno y celestial pontífice, Jesucristo, tu amado siervo, por quien sea la gloria a ti, junto con él y el Espíritu Santo, ahora y por los siglos venideros. Amén.»
      Cuando hubo pronunciado el «Amén», concluyendo así su oración, los esbirros encendieron el fuego. Se levantó una gran llamarada, y entonces pudimos contemplar algo maravilloso, nosotros, los que tuvimos el privilegio de verlo, y que por esto hemos sobrevivido, para contar a los demás lo acaecido. El fuego, en efecto, abombándose como la vela de un navio henchida por el viento, formó como un círculo alrededor del cuerpo del mártir; el cual, puesto en medio, no tomó el aspecto de un cuerpo quemado, sino que parecía pan cocido u oro y plata que se acrisolan al fuego. Y nosotros percibíamos un olor tan agradable como si se quemara incienso u otro precioso aroma.
    titulo: COMO UN SACRIFICIO PINGÜE Y ACEPTO
  resp2:
    ref: Ap 2, 8-9. 10
    vr:
    - - R
      - 'Al ángel de la Iglesia de Esmirna escribe: «Esto dice el primero y el último, el que estaba muerto y revivió: Conozco tu tribulación y tu pobreza; aunque eres rico. * Mantente fiel hasta la muerte y te daré la corona de la vida.»'
    - - V
      - 'No temas por lo que vas a sufrir: el Diablo va a meter a algunos de vosotros en la cárcel para que seáis tentados.'
    - - R
      - Mantente fiel hasta la muerte y te daré la corona de la vida.
  oracion: Dios y Señor de todo lo creado, que quisiste que san Policarpo fuera contado entre tus mártires, concédenos, por su intercesión, participar con él en la pasión de Cristo, para poder así resucitar, también con él, a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSÉ, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 03-19
  himno: Custodio providente y fiel del Hijo
  salmodia:
  - ant: 'Un ángel del Señor se apareció en sueños a José, y le dijo: «José, hijo de David, no temas recibir a María como esposa; dará a luz un Hijo y le llamarás Jesús.»'
    salmo: salmo-20-2-8-14
  - ant: Al despertar José del sueño, hizo como le había ordenado el ángel del Señor y llevó a María como esposa a su casa.
    salmo: salmo-91-i
  - ant: José subió de la ciudad de Nazaret a la ciudad de David que se llama Belén, para empadronarse con María.
    salmo: salmo-91-ii
  versiculo:
  - - V
    - El justo florecerá como un lirio.
  - - R
    - Y se alegrará eternamente ante el Señor.
  lectura1:
    ref: De la carta a los Hebreos 11, 1-16
    texto: |-
      Hermanos: La fe es la firme seguridad de los bienes que se esperan, la plena convicción de las realidades que no se ven. A causa de ella fueron alabados nuestros mayores. Por la fe sabemos que el universo fue formado por la palabra de Dios, de modo que lo visible ha tenido su origen en una causa invisible.
      Por la fe ofreció Abel a Dios un sacrificio más excelente que el de Caín; por ella fue proclamado justo, dando Dios mismo testimonio a favor de sus ofrendas, y por la fe continúa hablando aun después de su muerte.
      Por la fe fue trasladado Henoc sin experimentar la muerte: «No fue hallado más, porque Dios se lo llevó.» Pero antes de ser trasladado se da testimonio en su favor de que «había sido grato a Dios». Ahora bien, sin la fe es imposible agradar a Dios, pues el que se acerca a Dios debe creer que existe y que es remunerador de los que lo buscan.
      Por la fe, movido de religioso temor, Noé fabrico el arca para salvar a su familia, advertido por Dios de lo que aún no se veía venir; e, igualmente por la fe, condenó al mundo y se hizo heredero de la justificación que se alcanza por la fe.
      Por la fe obedeció Abraham al ser llamado por Dios, saliendo hacia la tierra que había de recibir en herencia, y salió sin saber a dónde iba. Por la fe peregrinó por la tierra prometida, como en tierra extraña, habitando en tiendas con Isaac y Jacob, coherederos de las mismas promesas, pues esperaba entrar en esa ciudad de sólidos cimientos, cuyo arquitecto y constructor es el mismo Dios.
      Por la fe la misma Sara, a pesar de su avanzada edad, recibió el poder de ser madre, pues tuvo fe en aquel que se lo había prometido. Y, por esto mismo, de un solo hombre, ya incapaz de transmitir la vida, nacieron hijos, «numerosos como las estrellas del cielo, incontables como las arenas del mar».
      En la fe murieron todos ellos, sin haber alcanzado la realización de las promesas, pero las vieron desde lejos y las saludaron, reconociendo que eran «forasteros y peregrinos sobre la tierra». En verdad que quienes así se expresan dan a entender claramente que van en busca de una patria, pues, si hubiesen pensado en aquella de la que habían salido, ocasiones tuvieron para volver a ella. Pero ellos aspiraban a una patria mejor, es decir, a la celestial. Por eso Dios no se desdeña de llamarse su Dios, pues les tenía ya preparada una ciudad.
    titulo: LA FE DE LOS ANTIGUOS PADRES
  resp1:
    ref: Rm 4, 20. 22; St 2, 22
    vr:
    - - R
      - No lo hizo vacilar la incredulidad ante la promesa de Dios, sino que, fortalecido por la fe, dio gloria a Dios; * por lo cual Dios se lo tomó como justificación.
    - - V
      - La fe cooperaba con sus obras, y por sus obras su fe alcanzó la plenitud.
    - - R
      - Por lo cual Dios se lo tomó como justificación.
  lectura2:
    autor: |-
      De los Sermones de san Bernardino de Siena, presbítero
      (Sermón 2, Sobre san José: Opera 7, 16. 27-30)
    texto: |-
      Es norma general de todas las gracias especiales comunicadas a cualquier creatura racional que, cuando la gracia divina elige a alguien para algún oficio especial o algún estado muy elevado, otorga todos los carismas que son necesarios a aquella persona así elegida, y que la adornan con profusión.
      Ello se realizó de un modo eminente en la persona de san José, que hizo las veces de padre de nuestro Señor Jesucristo y que fue verdadero esposo de la Reina del mundo y Señora de los ángeles, que fue elegido por el Padre eterno como fiel cuidador y guardián de sus más preciados tesoros, a saber, de su Hijo y de su esposa; cargo que él cumplió con absoluta fidelidad. Por esto el Señor le dice: Bien, siervo bueno y fiel, pasa al banquete de tu Señor.
      Si miramos la relación que tiene José con toda la Iglesia, ¿no es éste el hombre especialmente elegido, por el cual y bajo el cual Cristo fue introducido en el mundo de un modo regular y honesto? Por tanto, si toda la Iglesia está en deuda con la Virgen Madre, ya que por medio de ella recibió a Cristo, de modo semejante le debe a san José, después de ella, una especial gratitud y reverencia.
      Él, en efecto, cierra el antiguo Testamento, ya que en él la dignidad patriarcal y profética alcanza el fruto prometido. Además, él es el único que poseyó corporalmente lo que la condescendencia divina había prometido a los patriarcas y a los profetas.
      Hemos de suponer, sin duda alguna, que aquella misma familiaridad, respeto y altísima dignidad que Cristo tributó a José mientras vivía aquí en la tierra, como un hijo con su padre, no se la ha negado en el cielo; al contrario, la ha colmado y consumado.
      Por esto, no sin razón añade el Señor: Pasa al banquete de tu Señor. Pues, aunque el gozo festivo de la felicidad eterna entra en el corazón del hombre, el Señor prefirió decirle: Pasa al banquete, para insinuar de un modo misterioso que este gozo festivo no sólo se halla dentro de él, sino que lo rodea y absorbe por todas partes, y que está sumergido en él como en un abismo infinito.
      Acuérdate, pues, de nosotros, bienaventurado José, e intercede con tus oraciones ante tu Hijo; haz también que sea propicia a nosotros la santísima Virgen, tu esposa, que es madre de aquel que con el Padre y el Espíritu Santo vive y reina por siglos infinitos. Amén.
    titulo: FIEL CUIDADOR Y GUARDIÁN
  resp2:
    ref: ''
    vr:
    - - R
      - Dios me constituyó como padre del rey y como señor de toda su casa; * me elevó para hacer llegar la salvación a muchos pueblos.
    - - V
      - El Señor ha sido el auxilio y refugio que me ha salvado.
    - - R
      - Me elevó para hacer llegar la salvación a muchos pueblos.
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
