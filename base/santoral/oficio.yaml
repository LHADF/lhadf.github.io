LA ANUNCIACIÓN DEL SEÑOR:
  grado: Solemnidad
  fecha: 03-25
  himno: ¿Por qué bajaste a nosotros?
  salmodia:
  - ant: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, para que recibiéramos el ser hijos por adopción.
    salmo: salmo-2
  - ant: 'Al entrar en este mundo, dice: «Me has preparado un cuerpo; ya estoy aquí, oh Dios, para cumplir tu voluntad.»'
    salmo: salmo-18-a
  - ant: 'En esto se manifestó el amor que Dios nos tiene: en que envió al mundo a su Hijo único para que vivamos por medio de él.'
    salmo: salmo-44
  versiculo:
  - - V
    - La Palabra se hizo carne.
  - - R
    - Y puso su morada entre nosotros.
  lectura1:
    ref: Del primer libro de las Crónicas 17, 1-15
    texto: |-
      En aquellos días, morando ya David en su casa, dijo a Natán, profeta:
      «Mira, yo habito en una casa de cedro, mientras el arca de la alianza del Señor está bajo pieles.» Respondió Natán a David:
      «Haz todo cuanto tienes en tu corazón, porque Dios está contigo.»
      Pero aquella misma noche vino la palabra de Dios a Natán en estos términos:
      «Vete y di a mi siervo David:
      "Así dice el Señor: No serás tú quien me edifique casa para que habite yo en ella. Pues no he habitado en casa alguna desde el día en que hice subir a los hijos de Israel hasta el día de hoy; sino que he andado de tienda en tienda y de morada en morada. En todo el tiempo que he ido de un lado para otro con todo Israel, ¿he dicho acaso a alguno de los jueces de Israel, a los que mandé me apacentaran a mi pueblo: 'Por qué no me edificáis una casa de cedro'?"
      Di, pues, esto a mi siervo David:
      "Así habla el Señor de los ejércitos: Yo te he sacado del campo, de detrás del rebaño, para que seas caudillo de mi pueblo Israel. He estado contigo en todas tus empresas, he eliminado a todos tus enemigos de delante de ti Y voy a hacerte un nombre grande como el nombre de los grandes de la tierra. Fijaré un lugar a mi pueblo Israel, y lo plantaré allí para que more en él; no será ya perturbado, y los malhechores no seguirán oprimiéndolo como al principio, y como en los días en que instituí Jueces sobre mi pueblo Israel. Someteré a todos tus enemigos. Yo te haré grande y el Señor te edificará una casa. Cuando se cumplan tus días para ir con tus padres, afirmaré después de ti la descendencia que saldrá de tus entrañas y consolidaré su reino. Él me edificará una casa y yo afirmaré su trono para siempre. Yo seré para él un padre, y él será para mí un hijo, y no apartaré de él mi amor, como lo aparté de aquel que fue antes de ti. Yo lo estableceré en mi casa y en mi reino para siempre, y su trono estará firme eternamente."»
      Conforme a todas estas palabras, y conforme a toda esta visión, habló Natán a David.
    titulo: PROFECÍA SOBRE EL HIJO DE DAVID
  resp1:
    ref: Cf. Lc 1, 26-32
    vr:
    - - R
      - 'Fue enviado el ángel Gabriel a una virgen desposada con un hombre llamado José, para anunciarle el mensaje; y se turbó la Virgen ante su resplandor. «No temas, María, porque has hallado gracia a los ojos de Dios: * concebirás y darás a luz un hijo, el cual será llamado Hijo del Altísimo».'
    - - V
      - Alégrate, María, llena de gracia, el Señor está contigo.
    - - R
      - Concebirás y darás a luz un hijo, el cual será llamado Hijo del Altísimo.
  lectura2:
    autor: |-
      De las Cartas de san León Magno, papa
      (Carta 28, a Flaviano, 3-4: PL 54, 763-767)
    texto: |-
      La majestad asume la humildad, el poder la debilidad, la eternidad la mortalidad; y, para saldar la deuda contraída por nuestra condición pecadora, la naturaleza invulnerable se une a la naturaleza pasible; de este modo, tal como convenía para nuestro remedio, el único y mismo mediador entre Dios y los hombres, Cristo Jesús, hombre también él, pudo ser a la vez mortal e inmortal, por la conjunción en él de esta doble condición.
      El que es Dios verdadero nace como hombre verdadero, sin que falte nada a la integridad de su naturaleza humana, conservando la totalidad de la esencia que le es propia y asumiendo la totalidad de nuestra esencia humana. Y, al decir nuestra esencia humana, nos referimos a la que fue plasmada en nosotros por el Creador, y que él asume para restaurarla.
      Esta naturaleza nuestra quedó viciada cuando el hombre se dejó engañar por el maligno, pero ningún vestigio de este vicio original hallamos en la naturaleza asumida por el Salvador. Él, en efecto, aunque hizo suya nuestra misma debilidad, no por esto se hizo partícipe de nuestros pecados.
      Tomó la condición de esclavo, pero libre de la sordidez del pecado, ennobleciendo nuestra humanidad sin mermar su divinidad, porque aquel anonadamiento suyo -por el cual, él, que era invisible, se hizo visible, y él, que es el Creador y Señor de todas las cosas, quiso ser uno más entre los mortales- fue una dignación de su misericordia, no una falta de poder. Por tanto, el mismo que, permaneciendo en su condición divina, hizo al hombre es el mismo que se hace él mismo hombre, tomando la condición de esclavo.
      Y, así, el Hijo de Dios hace su entrada en la bajeza de este mundo, bajando desde el trono celestial, sin dejar la gloria que tiene junto al Padre, siendo engendrado en un nuevo orden de cosas.
      En un nuevo orden de cosas, porque el que era invisible por su naturaleza se hace visible en la nuestra, el que era inaccesible a nuestra mente quiso hacerse accesible, el que existía antes del tiempo empezó a existir en el tiempo, el Señor de todo el universo, velando la inmensidad de su majestad, asume la condición de esclavo, el Dios impasible e inmortal se digna hacerse hombre pasible y sujeto a las leyes de la muerte.
      El mismo que es Dios verdadero es también hombre verdadero, y en él, con toda verdad, se unen la pequeñez del hombre y la grandeza de Dios.
      Ni Dios sufre cambio alguno con esta dignación de su piedad, ni el hombre queda destruido al ser elevado a esta dignidad. Cada una de las dos naturalezas realiza sus actos propios en comunión con la otra, a saber, la Palabra realiza lo que es propio de la Palabra, y la carne lo que es propio de la carne.
      En cuanto que es la Palabra, brilla por sus milagros; en cuanto que es carne, sucumbe a las injurias. Y así como la Palabra retiene su gloria igual al Padre, así también su carne conserva la naturaleza propia de nuestra raza.
      La misma y única persona, no nos cansaremos de repetirlo, es verdaderamente Hijo de Dios y verdaderamente hijo del hombre. Es Dios, porque ya al comienzo de las cosas existía la Palabra, y la Palabra estaba con Dios y la Palabra era Dios; es hombre, porque la Palabra se hizo carne y puso su morada entre nosotros.
    titulo: EL MISTERIO DE NUESTRA RECONCILIACIÓN
  resp2:
    ref: Cf. Lc 1, 31. 42
    vr:
    - - R
      - 'Recibe la palabra, Virgen María, que el Señor te anuncia por medio del ángel: concebirás y darás a luz al Dios hecho hombre, * para que te llamen bendita entre las mujeres.'
    - - V
      - Darás a luz un hijo sin perder tu virginidad, concebirás en tu seno y serás madre siempre intacta.
    - - R
      - Para que te llamen bendita entre las mujeres.
  oracion: Señor Dios nuestro, que quisiste que tu Verbo se hiciera hombre en el seno de la Virgen María, concede a quienes proclamamos que nuestro Redentor es realmente Dios y hombre que lleguemos a ser partícipes de su naturaleza divina. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN BAUTISTA DE LA SALLE, presbítero:
  grado: Memoria
  fecha: 04-07
  comun: 'Del común de santos varones: para los santos educadores.'
  himno: Dichosos los que, oyendo la llamada
  lectura1:
    ref: De los Hechos de los apóstoles 7, 1-16
    texto: |-
      En aquellos días, el sumo sacerdote preguntó a Esteban:
      «¿Es verdad lo que éstos dicen?»
      Él contestó:
      «Hermanos y padres, escuchad: El Dios de la gloria se apareció a nuestro padre Abraham, cuando vivía en Mesopotamia, antes de establecerse en Harán, y le dijo: "Sal de tu tierra y de tu parentela; y vete a la tierra que yo te indicaré." Salió entonces del país de los caldeos y se estableció en Harán. Y de allí, después de la muerte de su padre, Dios lo trasladó a esta tierra que vosotros habitáis ahora. Y no le dio propiedad en ella, ni siquiera de un palmo de terreno. Eso sí, le hizo promesa de darla en posesión a él y a su descendencia, cuando no tenía hijos todavía.
      Y Dios le habló así: "Tus descendientes vivirán en tierra extranjera, y serán reducidos a esclavitud y maltratados por espacio de cuatrocientos años; pero yo juzgaré al pueblo que los va a esclavizar —palabra de Dios—. Después de esto, saldrán en libertad y me darán culto en este lugar." Luego hizo un pacto con él, pacto que selló con la circuncisión. De esta manera llegó a ser Abraham padre de Isaac, a quien circuncidó al octavo día; e Isaac lo fue de Jacob, y Jacob de los doce patriarcas.
      Los patriarcas, por pura envidia, vendieron a José como esclavo con destino a Egipto; pero Dios, que estaba con él, lo libró de todas las tribulaciones, y le dio gracia y sabiduría ante el Faraón, rey de Egipto, quien lo constituyó gobernador de Egipto y de toda su casa. Sobrevino entonces en todo Egipto y en Canaán un hambre y una miseria tan grande que nuestros padres no encontraban provisión alguna. Habiéndose enterado Jacob de que había trigo en Egipto, envió allá a nuestros padres en un primer viaje. En el segundo viaje, José se dio a conocer a sus hermanos, y así el Faraón llegó a tener conocimiento del linaje de José.
      José hizo venir a su padre Jacob con toda su familia; eran setenta y cinco personas en total. Y Jacob bajó a Egipto, donde murieron él y también nuestros padres. Y los trasladaron a Siquem, y los depositaron en él sepulcro que Abraham había comprado a precio de plata a los hijos de Emor, en Siquem.»
    titulo: COMIENZO DEL DISCURSO DE ESTEBAN SOBRE LA HISTORIA DE LOS PATRIARCAS
  resp1:
    ref: Cf. Hch 18, 24. 25; 6, 8
    vr:
    - - R
      - Muy versado en las Escrituras e instruido en la doctrina del Señor, hablaba con fervor de espíritu * y enseñaba rectamente todo lo referente a Jesús. Aleluia.
    - - V
      - Esteban, lleno de gracia y de poder sobrenatural, obraba señales y prodigios entre el pueblo.
    - - R
      - Y enseñaba rectamente todo lo referente a Jesús. Aleluia.
  lectura2:
    autor: |-
      De las Meditaciones de san Juan Bautista de la Salle, presbítero.
      (Meditación 201)
    texto: |-
      Reflexionad lo que dice el apóstol Pablo, a saber, que Dios ha puesto en la Iglesia apóstoles, profetas y doctores, y os convenceréis de que es Dios quien os ha asignado vuestro cargo. De ello os da testimonio el mismo Apóstol, cuando dice que hay diversos ministerios y diversas operaciones, y que en cada uno de estos dones se pone de manifiesto un mismo Espíritu Santo para común utilidad, esto es, para utilidad de la Iglesia.
      Debéis estar, pues, bien seguros de que la gracia que se os ha dado, es decir, la de enseñar a los niños, anunciarles el Evangelio y formarlos cristianamente, es un gran don de Dios, ya que es él quien os ha llamado a esta santa ocupación.
      Por consiguiente, procurad que los niños confiados a vuestros cuidados vean, en toda vuestra manera de enseñar, que sois ministros de Dios, ejerciendo vuestro cargo con una caridad no fingida y con verdadera diligencia. Tanto más debéis sentiros vinculados a vuestra labor, cuanto que sois ministros no sólo de Dios, sino también de Jesucristo y de la Iglesia.
      Así lo afirma san Pablo, exhortando a que sean tenidos como ministros de Cristo todos los que anuncian el Evangelio, los que escriben aquella carta, dictada por el mismo Cristo, no con tinta, sino con el Espíritu de Dios vivo, no en tablas de piedra, sino en las tablas de carne del corazón, que son los corazones de los niños. Por esto el amor de Dios debe apremiaros, ya que Jesucristo murió por todos, a fin de que los que viven no vivan ya para sí mismos, sino para aquel que por ellos murió y resucitó. Y, así, vuestros discípulos, impresionados por vuestra diligencia y asiduidad, han de sentir realmente que es Dios quien los exhorta a través de vosotros, ya que sois embajadores de Cristo.
      Conviene, además, que manifestéis a la Iglesia el gran amor que le tenéis, y que le deis pruebas de vuestra diligencia. Vosotros, en efecto, trabajáis en unión con la Iglesia, que es el cuerpo de Jesucristo. Demostrad, pues, con vuestra actividad, que amáis a los que Dios os ha confiado, como Cristo amó a la Iglesia.
      Esforzaos porque los niños entren verdaderamente a formar parte de este templo espiritual y lleguen a hacerse dignos de presentarse un día ante el tribunal de Jesucristo, gloriosos, sin mancha ni arruga ni cosa parecida, para que se muestre en los siglos venideros la sublime riqueza de la gracia que Dios les ha dado, ayudándolos a ellos en su aprendizaje y a vosotros en vuestra labor de enseñarlos y educarlos, para que posean la herencia en el reino de Dios y de Jesucristo, nuestro Señor.
    titulo: EL AMOR DE DIOS DEBE APREMIARNOS
  resp2:
    ref: Mc 10, 13-14. 16
    vr:
    - - R
      - 'Le presentaban a Jesús unos niños para que les impusiera las manos; pero los discípulos trataban de apartarlos. Jesús, al verlo, les dijo: * «Dejad que los niños vengan a mí y no se lo estorbéis, porque el reino de Dios es de los que son como ellos.» Aleluia.'
    - - V
      - Y tomándolos en sus brazos los bendecía, imponiendo su mano sobre ellos.
    - - R
      - Dejad que los niños vengan a mí y no se lo estorbéis, porque el reino de Dios es de los que son como ellos. Aleluia.
  oracion: Señor, Dios nuestro, que elegiste a san Juan Bautista de la Salle para educar cristianamente a la juventud, suscita en tu Iglesia educadores que se consagren por entero a la formación humana y cristiana de los jóvenes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ESTANISLAO, Obispo y mártir:
  grado: Memoria
  fecha: 04-11
  comun: Del común de un mártir.
  himno: Testigos de amor
  lectura1:
    ref: De los Hechos de los apóstoles 6, 1-15
    texto: |-
      Por aquellos días, habiendo aumentado el número de los discípulos, se levantaron quejas de los helenistas contra los hebreos, porque se atendía mal a sus viudas en la asistencia diaria. Los Doce convocaron entonces a la asamblea de los discípulos y dijeron:
      «No está bien que nosotros descuidemos la palabra de Dios por atender al servicio de las mesas. Elegid, pues, hermanos, de entre vosotros, a siete hombres llenos del Espíritu Santo y de sabiduría, a quienes podamos encomendar este servicio. Nosotros, por nuestra parte, nos dedicaremos a la oración en común y al ministerio de la palabra.»
      Y pareció bien esta proposición a toda la comunidad. Y eligieron a Esteban, hombre lleno de fe y del Espíritu Santo, y a Felipe, Prócoro, Nicanor, Timón, Pármenas y Nicolás, prosélito de Antioquía. Los presentaron a los apóstoles, quienes, después de orar, les impusieron las manos. El Evangelio se extendía cada vez más, y se multiplicaba extraordinariamente el número de los discípulos en Jerusalén. Era también numeroso el grupo de los sacerdotes que abrazaban la fe.
      Esteban, lleno de gracia y de poder sobrenatural, obraba señales y prodigios entre el pueblo. Algunos de la facción llamada de los libertos y algunos cirenenses y alejandrinos y otros de Cilicia y del Asia proconsular se levantaron a disputar con Esteban; pero no podían resistir a la sabiduría y al espíritu con que hablaba.
      Por eso sobornaron a algunos para que presentasen esta acusación:
      «Nosotros le hemos oído proferir blasfemias contra Moisés y contra Dios.»
      Así excitaron los ánimos del pueblo, de los ancianos y de los escribas. Luego, cayendo de improviso sobre él, lo arrebataron y lo condujeron ante el Consejo. Allí hicieron comparecer testigos falsos con esta acusación:
      «Este hombre no cesa de hablar contra el lugar santo y contra la ley. Nosotros le hemos oído decir que ese Jesús Nazareno destruirá este templo y cambiará las costumbres que nos ha transmitido Moisés.»
      Todos los que estaban sentados en el Consejo pusieron en él los ojos, y vieron su rostro como el de un ángel.
    titulo: 'ELECCIÓN DE LOS PRIMEROS DIÁCONOS: SIETE HOMBRES LLENOS DEL ESPÍRITU SANTO'
  resp1:
    ref: Cf. Hch 6, 3. 6; cf. Nm 8, 5. 6. 10
    vr:
    - - R
      - Eligieron a siete hombres llenos del Espíritu Santo y de sabiduría. * Y, después de orar, les impusieron las manos. Aleluia.
    - - V
      - 'El Señor dijo a Moisés: «Escoge entre los israelitas a los levitas, y los demás israelitas les impondrán las manos.»'
    - - R
      - Y, después de orar, les impusieron las manos. Aleluia.
  lectura2:
    autor: |-
      De las Cartas de san Cipriano, obispo y mártir
      (Carta 58, 8-9. 11: CSEL 3, 663-666)
    texto: |-
      Dios nos contempla, Cristo y sus ángeles nos miran, mientras luchamos por la fe. Qué dignidad tan grande, que felicidad tan plena es luchar bajo la mirada de Dios y ser coronados por Cristo.
      Revistámonos de fuerza, hermanos muy amados, y preparémonos para la lucha con un espíritu indoblegable con una fe sincera, con una total entrega. Marche el ejército de Dios a la lucha que se nos declara.
      El Apóstol nos indica cómo debemos revestirnos y prepararnos, cuando dice: Ceñida vuestra cintura con la verdad, revestidos con la coraza de la justicia y calzados los pies con el celo por el Evangelio de la paz. Embrazad en todo momento el escudo de la fe, con que podáis apagar los encendidos dardos del maligno. Tomad el yelmo de la salvación y la espada del espíritu, que es la palabra de Dios.
      Éstas son las armas que hemos de tomar, éstas las defensas espirituales y celestiales con que hemos de protegernos, para poder resistir y rechazar los ataques del demonio en el día de la prueba.
      Revistámonos la coraza de la justicia, para que nuestro pecho esté protegido y seguro contra los dardos del enemigo.
      Estén calzados y armados nuestros pies con las enseñanzas evangélicas, para que, cuando la serpiente sea hollada y pisoteada por nosotros, no pueda mordernos ni echarnos la zancadilla.
      Llevemos fuertemente asido el escudo de la fe, para que con su protección podamos repeler todos los dardos del enemigo.
      Tomemos también el yelmo de la salvación, que cubra nuestra cabeza: nuestros oídos, para que no lleguen a ellos los edictos convocando a las fiestas idolátricas; nuestros ojos, para que no vean los ídolos detestables; nuestra frente, para que conserve incólume la marca de Dios; nuestra boca, para que la lengua confiese victoriosa a Cristo, su Señor.
      Armemos nuestra derecha con la espada del espíritu, para que rechace con energía los sacrificios funestos, para que, acordándose de la eucaristía, ella, que recibe el cuerpo del Señor, lo abrace, con miras a recibir más tarde el premio de la corona celestial de manos del Señor.
      Estas consideraciones, hermanos muy amados, han de estar bien grabadas en vuestros corazones. Si el día de la persecución nos sorprende mientras estamos pensando y meditando estas cosas, el soldado de Cristo, adoctrinado con sus preceptos y recomendaciones, no se amilanará ante la lucha, sino que se hallará preparado para la corona.
    titulo: LUCHAMOS POR LA FE
  resp2:
    ref: ''
    vr:
    - - R
      - Este santo combatió hasta la muerte por ser fiel al Señor, sin temer las amenazas de los enemigos; * pues estaba cimentado sobre roca firme. Aleluia.
    - - V
      - Él tuvo en menos la vida del mundo y llegó hasta el reino celestial.
    - - R
      - Pues estaba cimentado sobre roca firme. Aleluia.
  oracion: Señor, tú que concediste al santo obispo Estanislao la valentía de derramar su sangre para confesar tu nombre, haz que también nosotros permanezcamos firmes en la fe, hasta morir, si es necesario, por conservarla. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MARCOS, Evangelista:
  grado: Fiesta
  fecha: 04-25
  comun: Del Común de apóstoles.
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje. Aleluia.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones. Aleluia.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria. Aleluia.
    salmo: salmo-96
  versiculo:
  - - V
    - El Señor pronuncia un oráculo. Aleluia.
  - - R
    - Millares pregonan la alegre noticia. Aleluia.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Efesios 4, 1-16
    texto: |-
      Hermanos: Yo, el prisionero por Cristo, os ruego que andéis como pide la vocación a la que habéis sido convocados. Sed siempre humildes y amables, sed comprensivos; sobrellevaos mutuamente con amor; esforzaos por mantener la unidad del Espíritu, con el vínculo de la paz. Un solo cuerpo y un solo Espíritu, como una sola es la meta de la esperanza en la vocación a la que habéis sido convocados. Un Señor, una fe, un bautismo. Un Dios, Padre de todo, que lo trasciende todo, y lo penetra todo, y lo invade todo.
      A cada uno de nosotros le ha sido concedida la gracia a la medida del don de Cristo. Por eso dice: «Subiendo a la altura, llevó cautivos y dio dones a los hombres.» ¿Qué quiere decir «subió» sino que antes bajó a las regiones inferiores de la tierra? Éste que bajó es el mismo que subió por encima de todos los cielos, para llenarlo todo.
      Él mismo ha constituido a unos, apóstoles; a otros, profetas; a otros, evangelistas; a otros, pastores y doctores, para el perfeccionamiento de los fieles, en función de su ministerio, y para la edificación del cuerpo de Cristo; hasta que lleguemos todos a la unidad en la fe y en el conocimiento del Hijo de Dios, al hombre perfecto, a la medida de Cristo en su plenitud. Para que ya no seamos niños sacudidos por las olas y llevados al retortero por todo viento de doctrina, en la trampa de los hombres, que con astucia conduce al error; sino que, realizando la verdad en el amor, hagamos crecer todas las cosas hacia él, que es la cabeza: Cristo, del cual todo el cuerpo, bien ajustado y unido a través de todo el complejo de junturas que lo nutren y actuando a la medida de cada parte, se procura su propio crecimiento para construcción de sí mismo en el amor.
    titulo: DIVERSIDAD DE DONES EN UN MISMO CUERPO
  resp1:
    ref: 2Pe 1, 21; Pr 2, 6
    vr:
    - - R
      - Nunca fue proferida profecía alguna por voluntad humana, sino que, * llevados del Espíritu Santo, hablaron los hombres de parte de Dios. Aleluia.
    - - V
      - El Señor es quien da sabiduría, de su boca proceden la prudencia y la ciencia.
    - - R
      - Llevados del Espíritu Santo, hablaron los hombres de parte de Dios. Aleluia.
  lectura2:
    autor: |-
      Del Tratado de san Ireneo, obispo, Contra las herejías
      (Libro 1, 10, 1-3: PG 7, 550-554)
    texto: |-
      La Iglesia, esparcida por el orbe hasta los confines de la tierra, ha recibido de los apóstoles y de los discípulos de los mismos aquella fe cuyo objeto es: un solo Dios, Padre todopoderoso, que hizo el cielo y la tierra, el mar y cuanto hay en él; y un solo Hijo de Dios, Jesucristo, que por nuestra salvación se hizo hombre; y el Espíritu Santo, que, por boca de los profetas, anunció de antemano los designios de Dios; y la venida al mundo, la encarnación en el seno de María, la pasión y resurrección de entre los muertos, la ascensión corporal del amado Jesucristo, Señor nuestro, así como su futura venido desde el cielo, en la gloria del Padre, para recapitular todas las cosas y resucitar corporalmente a todo el género humano, para que, según ha dispuesto el Padre invisible, ante Cristo Jesús, nuestro Señor y Dios, salvador y rey, toda rodilla se doble en el cielo, en la tierra, en el abismo y toda lengua lo proclame, y él juzgue a todos con justicia.
      La Iglesia, habiendo recibido, como hemos dicho, esta predicación y esta fe, aunque esparcida por todo el mundo, la guarda con diligencia, como si todos sus hijos habitaran en una misma casa; y toda ella cree estas mismas verdades, como quien tiene una sola alma y un solo corazón, y, en consecuencia, las predica, las enseña y las transmite, como quien tiene una sola boca. Porque, si bien en el mundo hay diversidad de lenguajes, el contenido de la tradición es uno e idéntico para todos.
      Y lo mismo creen y transmiten las Iglesias fundadas en Germania, así como las de los iberos, las de los celtas, las del Oriente, las de Egipto, las de Libia y las que se hallan en el centro del mundo; pues, del mismo modo que el sol, creatura de Dios, es uno e idéntico en todo el mundo, así también la predicación de la verdad brilla en todas partes e ilumina a todos los hombres que quieren llegar al conocimiento de la verdad.
      Y ni el que posee dotes oratorias, entre los que presiden las Iglesias, enseñará algo diverso a lo que hemos dicho (ya que nadie está por encima de su maestro), ni el que está privado de estas dotes aminorará por ello el contenido de la tradición. En efecto, siendo la fe única e idéntica para todos, ni la amplía el que es capaz de hablar mucho sobre ella, ni la aminora el que no es capaz de tanto.
    titulo: LA PREDICACIÓN DE LA VERDAD
  resp2:
    ref: 1Co 1, 17-18. 21
    vr:
    - - R
      - Cristo me envió a evangelizar, y no con sabiduría de palabras, a fin de no quitar eficacia a la cruz de Cristo. * Pues el mensaje de la cruz es necedad para los que están en vías de perdición; pero para los que están en vías de salvación es fuerza de Dios. Aleluia.
    - - V
      - Como en la sabiduría de Dios, el mundo no lo conoció por el camino de la sabiduría, quiso Dios valerse de la necedad de la predicación, para salvar a los creyentes.
    - - R
      - Pues el mensaje de la cruz es necedad para los que están en vías de perdición; pero para los que están en vías de salvación es fuerza de Dios. Aleluia.
  te_deum: true
  oracion: Señor, tú que diste a san Marcos el carisma de anunciar el Evangelio, haz que sepamos aprovecharnos de sus escritos y por ellos aprendamos a seguir fielmente a Jesucristo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  himno: Puerta de Dios en el redil humano
  salmodia:
  - ant: Quien quiera ser el primero que sea el último de todos y el servidor de todos. Aleluia.
    salmo: salmo-20-2-8-14
  - ant: Cuando aparezca el supremo Pastor, recibiréis la corona de gloria que no se marchita. Aleluia.
    salmo: salmo-91-i
  - ant: Siervo bueno y fiel, pasa al banquete de tu Señor. Aleluia.
    salmo: salmo-91-ii
  versiculo:
  - - V
    - Oirás de mi boca una palabra. Aleluia.
  - - R
    - Y le advertirás de mi nombre. Aleluia.
  lectura1:
    ref: De los Hechos de los apóstoles 20, 17-36
    texto: |-
      En aquellos días, desde Mileto, mandó Pablo llamar a los presbíteros de la Iglesia de Éfeso. Cuando se presentaron les dijo:
      «Vosotros sabéis que todo el tiempo que he estado aquí, desde el día que por primera vez puse pie en Asia, he servido al Señor con toda humildad, en las penas y pruebas que me han procurado las maquinaciones de los judíos. Sabéis que no he ahorrado medio alguno, que he predicado y enseñado en público y en privado, insistiendo a judíos y griegos a que se convirtieran y crean en nuestro Señor Jesús.
      Y ahora me dirijo a Jerusalén, forzado por el Espíritu. No sé lo que me espera allí, sólo sé que el Espíritu Santo, de ciudad en ciudad, me asegura que me aguardan cárceles y luchas. Pero a mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios.
      He pasado por aquí predicando el reino, y ahora sé que ninguno de vosotros me volverá a ver. Por eso declaro hoy que no soy responsable de la suerte de nadie: nunca me he reservado nada, os he anunciado enteramente el plan de Dios.
      Tened cuidado de vosotros y del rebaño que el Espíritu Santo os ha encargado guardar, como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Ya sé que, cuando os deje, se meterán entre vosotros lobos feroces que no tendrán piedad del rebaño. Incluso algunos de vosotros deformarán la doctrina y arrastrarán a los discípulos. Por eso, estad alerta: acordaos que durante tres años, de día y de noche, no he cesado de aconsejar con lágrimas en los ojos a cada uno en particular. Ahora os dejo en manos de Dios y de su palabra que es gracia, y tiene poder para construiros y daros parte en la herencia de los santos.
      A nadie le he pedido dinero, oro ni ropa. Bien sabéis que estas manos han ganado lo necesario para mí y mis compañeros. Siempre os he enseñado que es nuestro deber trabajar para socorrer a los necesitados, acordándonos de las palabras del Señor Jesús: "Más dichoso es el que da que el que recibe."»
      Cuando terminó de hablar, se pusieron todos de rodillas, y Pablo rezó.
    titulo: EXHORTACIÓN DE PABLO A LOS PASTORES DE LA IGLESIA DE ÉFESO
  resp1:
    ref: Hch 20, 28; 1Co 4, 2
    vr:
    - - R
      - Tened cuidado del rebaño que el Espíritu Santo os ha encargado guardar, * como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Aleluia.
    - - V
      - En un administrador lo que se busca es que sea fiel.
    - - R
      - Como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Aleluia.
  lectura2:
    autor: |-
      Del Decreto Christus Dominus, sobre el deber pastoral de los obispos en la Iglesia, del Concilio Vaticano segundo.
      (nn. 12-13. 16)
    texto: |-
      Los obispos, en el ejercicio de su deber de enseñar, anuncien a los hombres el Evangelio de Cristo, deber que sobresale entre los principales de los obispos, llamándolos a la fe con la fortaleza del Espíritu o confirmándolos en la fe viva. Propónganles el misterio íntegro de Cristo, es decir, aquellas verdades cuyo desconocimiento es ignorancia de Cristo, e igualmente el camino que se ha revelado para la glorificación de Dios y por ello mismo para la consecución de la felicidad eterna.
      Muéstrenles, asimismo, que las mismas cosas terrenas y las instituciones humanas, por la determinación de Dios Creador, se ordenan también a la salvación de los hombres y, por consiguiente, pueden contribuir mucho a la edificación del Cuerpo de Cristo.
      Enséñenles, por consiguiente, cuánto hay que apreciar la persona humana, con su libertad y la misma vida del cuerpo, según la doctrina de la Iglesia; la familia y su unidad y estabilidad, la procreación y educación de los hijos; la sociedad civil, con sus leyes y profesiones; el trabajo y el descanso, las artes y los inventos técnicos; la pobreza y la abundancia, y expónganles, finalmente, los principios con los que hay que resolver los gravísimos problemas acerca de la posesión de los bienes materiales, de su incremento y recta distribución, acerca de la paz y de las guerras y de la vida hermanada de todos pueblos.
      Expliquen la doctrina cristiana con métodos acomodados a las necesidades de los tiempos, es decir, que respondan a las dificultades y problemas que más preocupan y angustian a los hombres; defiendan también esta doctrina enseñando a los fieles a defenderla y propagarla. Demuestren en su enseñanza la materna solicitud de la Iglesia para con todos los hombres, sean fieles o infieles, teniendo un cuidado especial de los pobres y de los débiles, a los que el Señor les envió a evangelizar.
      Siendo propio de la Iglesia el establecer diálogo con la sociedad humana dentro de la que vive, los obispos tienen, ante todo, el deber de llegar a los hombres, buscar y promover el diálogo con ellos. Diálogos de salvación, que, como siempre hace la verdad, han de llevarse a cabo con caridad, comprensión y amor; conviene que se distingan siempre por la claridad de su conversación, al mismo tiempo que por la humildad y la delicadeza, llenos siempre de prudencia y de confianza, puesto que han surgido para favorecer la amistad y acercar las almas.
      Esfuércense en aprovechar la variedad de medios que hay en estos tiempos para anunciar la doctrina cristiana, sobre todo la predicación y la formación catequética, que ocupa siempre el primer lugar; la exposición de la doctrina en las escuelas, universidades, conferencias y asambleas de todo género, con declaraciones públicas, hechas con ocasión de algunos sucesos; con la prensa y demás medios de comunicación social, que es necesario usar para anunciar el Evangelio de Cristo.
      En el ejercicio de su ministerio de padre y pastor, compórtense los obispos en medio de los suyos como los que sirven, pastores buenos que conocen a sus ovejas y son conocidos por ellas, verdaderos padres, que se distinguen por el espíritu de amor y preocupación para con todos, y a cuya autoridad, confiada por Dios, todos se someten gustosa mente. Congreguen y formen a toda la familia de su grey, de modo que todos, conscientes de sus deberes, vivan y obren en unión de caridad.
      Para realizar esto eficazmente los obispos, «dispuestos para toda buena obra» y «soportándose todo por el amor de los elegidos», ordenen su vida de forma que responda a las necesidades de los tiempos.
      Traten siempre con caridad especial a los sacerdotes, puesto que reciben parte de sus obligaciones y cuidados y los realizan celosamente con el trabajo diario, considerándolos siempre como hijos y amigos, y, por tanto, estén siempre dispuestos a oírlos, y tratando confidencialmente con ellos, procuren promover la labor pastoral integra de toda la diócesis.
      Vivan preocupados de su condición espiritual, intelectual y material, para que ellos puedan vivir santa y piadosamente, cumpliendo su ministerio con fidelidad y éxito. Por lo cual han de fomentar las instituciones y establecer reuniones especiales, de las que los sacerdotes participen algunas veces, bien para practicar algunos ejercicios espirituales más prolongados para la renovación de la vida, o bien para adquirir un conocimiento más profundo de las disciplinas eclesiásticas, sobre todo de la Sagrada Escritura y de la Teología, de las cuestiones sociales de mayor importancia, de los nuevos métodos de acción pastoral.
      Ayuden con activa misericordia a los sacerdotes que vean en cualquier peligro o que hubieran faltado en algo.
      Para procurar mejor el bien de los fieles, según la condición de cada uno, esfuércense en conocer bien sus necesidades, las condiciones sociales en que viven, usando de medios oportunos, sobre todo de investigación social.
      Muéstrense interesados por todos, cualquiera que sea su edad, condición, nacionalidad, ya sean naturales del país, ya advenedizos, ya forasteros. En la aplicación de este cuidado pastoral por sus fieles guarden el papel reservado a ellos en las cosas de la Iglesia, reconociendo también la obligación y el derecho que ellos tienen de colaborar en la edificación del Cuerpo Místico de Cristo.
      Extiendan su amor a los hermanos separados, recomendando también a los fieles que se comporten con ellos con gran humildad y caridad, fomentando igualmente el ecumenismo, tal como la Iglesia lo entiende. Amen también a los no bautizados, para que germine en ellos la caridad de Jesucristo, de quien los obispos deben ser testigos.
    titulo: DISPONIBLES PARA TODA OBRA BUENA
  resp2:
    ref: 1Pe 5,2.3-4; Hch 20,28
    vr:
    - - R
      - Sean pastores del rebaño de Dios, convirtiéndose en modelos del rebaño, * y cuando aparezca el supremo Pastor, recibirán la corona de gloria que no se marchita.
    - - V
      - Velen por el rebaño que el Espíritu Santo les ha encargado guardar, como pastores de la Iglesia de Dios.
    - - R
      - Y cuando aparezca el supremo Pastor, recibirán la corona de gloria que no se marchita.
  te_deum: true
  oracion: Señor, tú has querido fortalecer a tu Iglesia en América mediante los trabajos apostólicos y el celo por la verdad de tu obispo santo Toribio, concede al pueblo a ti consagrado crecer constantemente en fe y dar auténticos frutos de santidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  comun: 'Del Común de pastores: para un santo obispo.'
  himno: Puerta de Dios en el redil humano
  salmodia:
  - ant: Quien quiera ser el primero que sea el último de todos y el servidor de todos. Aleluia.
    salmo: salmo-20-2-8-14
  - ant: Cuando aparezca el supremo Pastor, recibiréis la corona de gloria que no se marchita. Aleluia.
    salmo: salmo-91-i
  - ant: Siervo bueno y fiel, pasa al banquete de tu Señor. Aleluia.
    salmo: salmo-91-ii
  versiculo:
  - - V
    - Oirás de mi boca una palabra. Aleluia.
  - - R
    - Y le advertirás de mi nombre. Aleluia.
  lectura1:
    ref: De los Hechos de los apóstoles 20, 17-36
    texto: |-
      En aquellos días, desde Mileto, mandó Pablo llamar a los presbíteros de la Iglesia de Éfeso. Cuando se presentaron les dijo:
      «Vosotros sabéis que todo el tiempo que he estado aquí, desde el día que por primera vez puse pie en Asia, he servido al Señor con toda humildad, en las penas y pruebas que me han procurado las maquinaciones de los judíos. Sabéis que no he ahorrado medio alguno, que he predicado y enseñado en público y en privado, insistiendo a judíos y griegos a que se convirtieran y crean en nuestro Señor Jesús.
      Y ahora me dirijo a Jerusalén, forzado por el Espíritu. No sé lo que me espera allí, sólo sé que el Espíritu Santo, de ciudad en ciudad, me asegura que me aguardan cárceles y luchas. Pero a mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios.
      He pasado por aquí predicando el reino, y ahora sé que ninguno de vosotros me volverá a ver. Por eso declaro hoy que no soy responsable de la suerte de nadie: nunca me he reservado nada, os he anunciado enteramente el plan de Dios.
      Tened cuidado de vosotros y del rebaño que el Espíritu Santo os ha encargado guardar, como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Ya sé que, cuando os deje, se meterán entre vosotros lobos feroces que no tendrán piedad del rebaño. Incluso algunos de vosotros deformarán la doctrina y arrastrarán a los discípulos. Por eso, estad alerta: acordaos que durante tres años, de día y de noche, no he cesado de aconsejar con lágrimas en los ojos a cada uno en particular. Ahora os dejo en manos de Dios y de su palabra que es gracia, y tiene poder para construiros y daros parte en la herencia de los santos.
      A nadie le he pedido dinero, oro ni ropa. Bien sabéis que estas manos han ganado lo necesario para mí y mis compañeros. Siempre os he enseñado que es nuestro deber trabajar para socorrer a los necesitados, acordándonos de las palabras del Señor Jesús: "Más dichoso es el que da que el que recibe."»
      Cuando terminó de hablar, se pusieron todos de rodillas, y Pablo rezó.
    titulo: EXHORTACIÓN DE PABLO A LOS PASTORES DE LA IGLESIA DE ÉFESO
  resp1:
    ref: Hch 20, 28; 1Co 4, 2
    vr:
    - - R
      - Tened cuidado del rebaño que el Espíritu Santo os ha encargado guardar, * como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo, Aleluia.
    - - V
      - En un administrador lo que se busca es que sea fiel.
    - - R
      - Como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo. Aleluia.
