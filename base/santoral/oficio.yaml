NUESTRA SEÑORA DEL ROSARIO DE CHIQUINQUIRÁ, patrona de Colombia:
  grado: Fiesta
  fecha: 07-09
  comun: Del común de la Santísima Virgen María.
  himno: Lucero de la mañana
  salmodia:
  - ant: María ha recibido la bendición del Señor y la misericordia de Dios, su salvador.
    salmo: salmo-23
  - ant: El Altísimo consagra su morada.
    salmo: salmo-45
  - ant: ¡Qué pregón tan glorioso para ti, Virgen María!
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas.
  - - R
    - Meditándolas en su corazón.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Gálatas 3, 22—4, 7
    texto: |-
      Hermanos: La Escritura ha declarado que todos los hombres son culpables de pecado, para que así la promesa se concediese a los creyentes, por su fe en Jesucristo.
      Antes de venir la economía de la fe, estábamos encerrados bajo la custodia de la ley, en espera de la fe que había de revelarse. De este modo la ley fue nuestro ayo para llevarnos a Cristo, a fin de ser justificados por la fe. Pero, una vez llegada la era de la fe, no estamos más bajo la potestad del ayo, pues ya sois todos hijos de Dios por la fe en Cristo Jesús.
      En efecto, todos los que habéis sido bautizados en Cristo os habéis revestido de Cristo. Ya no hay distinción entre judío y gentil, ni entre libre y esclavo, ni entre hombre y mujer: todos sois uno en Cristo Jesús. Y si sois de Cristo sois por lo mismo descendencia de Abraham, herederos según la promesa.
      Pongo también otra comparación: El heredero, mientras es menor de edad, con ser dueño de todo, no se distingue en nada del esclavo: está bajo tutores y administradores hasta el tiempo prefijado por su padre. De igual modo: Nosotros, cuando éramos menores de edad, vivíamos esclavizados por los «elementos del mundo».
      Pero, cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción. Y la prueba de que sois hijos es que Dios ha enviado a vuestros corazones el Espíritu de su Hijo, que clama: «¡Padre!» Por consiguiente, ya no eres esclavo, sino hijo; y, si eres hijo, también eres heredero por voluntad de Dios.
    titulo: POR LA FE, SOMOS HIJOS Y HEREDEROS DE DIOS
  resp1:
    ref: Cf. Ga 4, 4-5; Ef 2,4; Rm 8, 3
    vr:
    - - R
      - Mirad que ya se cumplió el tiempo, y ha enviado Dios a su Hijo a la tierra, nacido de una Virgen, nacido bajo la ley, * para rescatar a los que estaban bajo la ley.
    - - V
      - Por el gran amor con que nos amó, envió a su propio Hijo, sometido a una existencia semejante a la de la carne de pecado.
    - - R
      - Para rescatar a los que estaban bajo la ley.
  lectura2:
    autor: |-
      De las Disertaciones de san Sofronio, obispo
      (Disertación 2, Sobre la anunciación de la Santísima Virgen, 21-22. 26: PG 87, 3, 3242. 3250)
    texto: |-
      Alégrate, llena de gracia, el Señor es contigo. ¿Y qué puede haber más sublime que esta alegría, oh Virgen Madre? ¿O qué puede haber más excelente que esta gracia, que tú sola has alcanzado de Dios? ¿ O qué puede imaginarse más amable o espléndido que esta gracia? Nada puede equipararse a las maravillas que en ti vemos realizadas, nada hay que iguale la gracia que tú posees; todo lo demás, por excelente que sea, ocupa un lugar secundario y goza de una excelencia claramente inferior.
      El Señor es contigo; ¿quién, pues, se atreverá a competir contigo? De ti nacerá Dios; ¿quién, por tanto, no se reconocerá al momento inferior a ti y no admitirá de buen grado tu primacía y superioridad? Es por esto que, al contemplar tus eminentes prerrogativas, que superan las de cualquier otra creatura, te aclamo lleno de entusiasmo: Alégrate, llena de gracia, el Señor es contigo. Por ti ha venido la alegría, no sólo a los hombres, sino también a los mismos coros celestiales.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva y has hecho que Adán, que yacía postrado bajo el peso de la maldición, alcanzara, por ti, la bendición.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, por ti, la bendición del Padre ha brillado sobre los hombres, librándolos de la antigua maldición.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, por ti, alcanzan la salvación tus progenitores; pues has de dar a luz a aquel que les obtendrá la salvación divina.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, sin concurso de semilla, has producido aquel fruto que esparce la bendición sobre el orbe de la tierra, redimiéndola de la maldición que le hacía producir espinas y abrojos.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, siendo por condición natural una mujer como las demás, llegarás a ser en verdad Madre de Dios. Efectivamente, si el que ha de nacer de ti es, con toda verdad, el Dios hecho hombre, con toda razón eres llamada Madre de Dios, ya que realmente das a luz a Dios.
      Llevas en la intimidad de tu seno al mismo Dios, el cual mora en ti según la carne, y sale de ti como un esposo, trayendo a todos la alegría y comunicando a todos la luz divina.
      Pues en ti, oh Virgen, como en un cielo nítido y purísimo, ha puesto Dios su tienda; y saldrá de ti como el esposo de su alcoba; y, cual gigante que emprende su carrera, recorrerá el camino de su vida, provechosa en todo para todos, alcanzando con su giro del término del cielo hasta el opuesto confín, llenándolo todo de su calor divino y de su resplandor vivificante.
    titulo: POR MARÍA, LA BENDICIÓN DEL PADRE HA BRILLADO SOBRE LOS HOMBRES
  resp2:
    ref: S. Sofronio, Disertación 2
    vr:
    - - R
      - Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva. * Por ti la bendición del Padre ha brillado sobre los hombres.
    - - V
      - Por ti alcanzan la salvación tus progenitores.
    - - R
      - Por ti la bendición del Padre ha brillado sobre los hombres.
  te_deum: true
  oracion: Padre nuestro, en tu amorosa solicitud has querido favorecer a nuestra Patria dándonos en Chiquinquirá un signo de tu presencia; por la intercesión poderosa de la Virgen María, cuyo patrocinio hoy celebramos, concédenos crecer en la fe y lograr la prosperidad por caminos de paz y de justicia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BENITO ABAD, patrono de Europa:
  grado: Memoria
  fecha: 07-11
  comun: Del Común de santos varones para los santos religiosos.
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De la Regla de san Benito, abad
      (Prólogo, 4-22; cap. 72, 1-12: CSEL 75, 2-5. 162-163)
    texto: |-
      Cuando emprendas alguna obra buena, lo primero que has de hacer es pedir constantemente a Dios que sea él quien la lleve a término, y así nunca lo contristaremos con nuestras malas acciones, a él, que se ha dignado contarnos en el número de sus hijos, ya que en todo tiempo debemos someternos a él en el uso de los bienes que pone a nuestra disposición, no sea que algún día, como un padre que se enfada con sus hijos, nos desherede, o, como un amo temible, irritado por nuestra maldad, nos entregue al castigo eterno, como a servidores perversos que han rehusado seguirlo a la gloria.
      Por lo tanto, despertémonos ya de una vez, obedientes a la llamada que nos hace la Escritura: Ya es hora que despertéis del sueño. Y, abiertos nuestros ojos a la luz divina, escuchemos bien atentos la advertencia que nos hace cada día la voz de Dios: Hoy, si escucháis su voz, no endurezcáis el corazón; y también: El que tenga oídos oiga lo que el Espíritu dice a las Iglesias.
      ¿Y qué es lo que dice? Venid, hijos, escuchadme: os instruiré en el temor del Señor. Caminad mientras tenéis luz, para que las tinieblas de la muerte no os sorprendan.
      Y el Señor, buscando entre la multitud de los hombres a uno que realmente quisiera ser operario suyo, dirige a todos esta invitación: ¿Hay alguien que ame la vida y desee días de prosperidad? Y si tú, al oír esta invitación, respondes: «Yo», entonces Dios te dice: «Si amas la vida verdadera y eterna, guarda tu lengua del mal, tus labios de la falsedad; apártate del mal, obra el bien, busca la paz y corre tras ella. Si así lo hacéis, mis ojos estarán sobre vosotros y mis oídos atentos a vuestras plegarias; y, antes de que me invoquéis, os diré: Aquí estoy.»
      ¿Qué hay para nosotros más dulce, hermanos muy amados, que esta voz del Señor que nos invita? Ved cómo el Señor, con su amor paternal, nos muestra el camino de la vida.
      Ceñida, pues, nuestra cintura con la fe y la práctica de las buenas obras, avancemos por sus caminos, tomando por guía el Evangelio, para que alcancemos a ver a aquél que nos ha llamado a su reino. Porque, si queremos tener nuestra morada en las estancias de su reino, hemos de tener presente que para llegar allí hemos de caminar aprisa por el camino de las buenas obras.
      Así como hay un celo malo, lleno de amargura, que separa de Dios y lleva al infierno, así también hay un celo bueno, que separa de los vicios y lleva a Dios y a la vida eterna. Éste es el celo que han de practicar con ferviente amor los monjes, esto es: tengan por más dignos a los demás; soporten con una paciencia sin límites sus debilidades, tanto corporales como espirituales; pongan todo su empeño en obedecerse los unos a los otros; procuren todos el bien de los demás, antes que el suyo propio; pongan en práctica un sincero amor fraterno; vivan siempre en el temor y amor de Dios; amen a su abad con una caridad sincera y humilde; no antepongan nada absolutamente a Cristo, el cual nos lleve a todos juntos a la vida eterna.
    titulo: NO ANTEPONGAN NADA ABSOLUTAMENTE A CRISTO
  resp2:
    ref: S. Gregorio Magno, Diálogos, lib. 2, prólogo; 3
    vr:
    - - R
      - El bienaventurado Benito, habiendo dejado su casa y sus bienes familiares y queriendo agradar sólo a Dios, buscó la manera de llevar una vida santa, * y habitó en la soledad, ante los ojos del Altísimo, que todo lo ve.
    - - V
      - Sabiamente indocto, se retiró, consciente de su ignorancia.
    - - R
      - Y habitó en la soledad, ante los ojos del Altísimo, que todo lo ve.
  oracion: Dios nuestro, que constituiste al abad san Benito como un insigne maestro para los que quieren entregarse a tu servicio, concédenos que, anteponiendo tu amor a todas las cosas, corramos con un amor generoso por el camino de tus mandamientos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BUENAVENTURA, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 07-15
  comun: 'Del común de pastores: para un santo obispo y Del Común de doctores de la Iglesia.'
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      Del Opúsculo de san Buenaventura, obispo, Sobre el itinerario de la mente hacia Dios
      (Cap. 7, 1. 2. 4. 6: Opera omnia 5, 312-313)
    texto: |-
      Cristo es el camino y la puerta. Cristo es la escalera y el vehículo, él, que es el propiciatorio colocado sobre el arca de Dios y el misterio oculto desde los siglos. El que mira plenamente de cara este propiciatorio y lo contempla suspendido en la cruz, con fe, con esperanza y caridad, con devoción, admiración, alegría, reconocimiento, alabanza y júbilo, este tal realiza con él la pascua, esto es, el paso, ya que, sirviéndose del bastón de la cruz, atraviesa el mar Rojo, sale de Egipto y penetra en el desierto, donde saborea el maná escondido, y descansa con Cristo en el sepulcro, como muerto en lo exterior, pero sintiendo, en cuanto es posible en el presente estado de viadores, lo que dijo Cristo al ladrón que estaba crucificado a su lado: Hoy estarás conmigo en el paraíso.
      Para que este paso sea perfecto, hay que abandonar toda especulación de orden intelectual y concentrar en Dios la totalidad de nuestras aspiraciones. Esto es algo misterioso y secretísimo, que sólo puede conocer aquel que lo recibe, y nadie lo recibe sino el que lo desea, y no lo desea sino aquel a quien inflama en lo más íntimo el fuego del Espíritu Santo, que Cristo envió a la tierra. Por esto dice el Apóstol que esta sabiduría misteriosa es revelada por el Espíritu Santo.
      Si quieres saber cómo se realizan estas cosas, pregunta a la gracia, no al saber humano; pregunta al deseo, no al entendimiento; pregunta al gemido expresado en la oración, no al estudio y la lectura; pregunta al Esposo, no al Maestro; pregunta a Dios, no al hombre; pregunta a la oscuridad, no a la claridad; no a la luz, sino al fuego que abrasa totalmente y que transporta hacia Dios con unción suavísima y ardentísimos afectos. Este fuego es Dios, cuyo horno, como dice el profeta, está en Jerusalén, y Cristo es quien lo enciende con el fervor de su ardentísima pasión, fervor que sólo puede comprender el que es capaz de decir: Preferiría morir asfixiado, preferiría la muerte. El que de tal modo ama la muerte puede ver a Dios, ya que está fuera de duda aquella afirmación de la Escritura: Nadie puede ver mi rostro y seguir viviendo. Muramos, pues, y entremos en la oscuridad, impongamos silencio a nuestras preocupaciones, deseos e imaginaciones; pasemos con Cristo crucificado de este mundo al Padre, y así, una vez que nos haya mostrado al Padre, podremos decir con Felipe: Eso nos basta; oigamos aquellas palabras dirigidas a Pablo: Te basta mi gracia; alegrémonos con David, diciendo: Se consumen mi corazón y mi carne por Dios, mi herencia eterna. Bendito el Señor por siempre, y todo el pueblo diga: «¡Amén!»
    titulo: LA SABIDURÍA MISTERIOSA REVELADA POR EL ESPÍRITU SANTO
  resp2:
    ref: 1Jn 3, 24; Sir 1, 9. 10
    vr:
    - - R
      - Quien guarda los mandamientos de Dios permanece en Dios y Dios en él; * Y conocemos que él permanece en nosotros por el Espíritu que nos ha dado.
    - - V
      - Dios mismo creó la sabiduría, la derramó sobre todas sus obras y se la regaló a los que lo aman.
    - - R
      - y conocemos que él permanece en nosotros por el Espíritu que nos ha dado.
  oracion: Dios todopoderoso, al celebrar hoy la festividad del obispo san Buenaventura, te pedimos nos concedas saber aprovechar sus preclaras enseñanzas e imitar su ardiente amor hacia ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL CARMEN:
  grado: Memoria
  fecha: 07-16
  comun: Del Común de la Santísima Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De los Sermones de san león Magno, papa
      (Sermón 1, En la Natividad del Señor, 2. 3: PL 54, 191-192)
    texto: |-
      Dios elige a una virgen de la descendencia real de David; y esta virgen, destinada a llevar en su seno el fruto de una sagrada fecundación, antes de concebir corporalmente a su prole, divina y humana a la vez, la concibió en su espíritu. Y, para que no se espantara, ignorando los designios divinos, al observar en su cuerpo unos cambios inesperados, conoce, por la conversación con el ángel, lo que el Espíritu Santo ha de operar en ella. Y la que ha de ser Madre de Dios confía en que su virginidad ha de permanecer sin detrimento. ¿Por qué había de dudar de este nuevo género de concepción, si se le promete que el Altísimo pondrá en juego su poder? Su fe y su confianza quedan, además, confirmadas cuando el ángel le da una prueba de la eficacia maravillosa de este poder divino, haciéndole saber que Isabel ha obtenido también una inesperada fecundidad: el que es capaz de hacer concebir a una mujer estéril puede hacer lo mismo con una mujer virgen.
      Así, pues, el Verbo de Dios, que es Dios, el Hijo de Dios, que ya al comienzo estaba con Dios, por quien empezaron a existir todas las cosas, y ninguna de las que existen empezó a ser sino por él, se hace hombre para librar al hombre de la muerte eterna; se abaja hasta asumir nuestra pequeñez, sin menguar por ello su majestad, de tal modo que, permaneciendo lo que era y asumiendo lo que no era, une la auténtica condición de esclavo a su condición divina, por la que es igual al Padre; la unión que establece entre ambas naturalezas es tan admirable, que ni la gloria de la divinidad absorbe la humanidad, ni la humanidad disminuye en nada la divinidad.
      Quedando, pues, a salvo el carácter propio de cada una de las naturalezas, y unidas ambas en una sola persona, la majestad asume la humildad, el poder la debilidad, la eternidad la mortalidad; y, para saldar la deuda contraída por nuestra condición pecadora, la naturaleza invulnerable se une a la naturaleza pasible, Dios verdadero y hombre verdadero se conjugan armoniosamente en la única persona del Señor; de este modo, tal como convenía para nuestro remedio, el único y mismo mediador entre Dios y los hombres pudo a la vez morir y resucitar, por la conjunción en él de esta doble condición. Con razón, pues, este nacimiento salvador había de dejar intacta la virginidad de la madre, ya que fue a la vez salvaguarda del pudor y alumbramiento de la verdad.
      Tal era, amadísimos, la clase de nacimiento que convenía a Cristo, fuerza y sabiduría de Dios; con él se mostró igual a nosotros por su humanidad, superior a nosotros por su divinidad. Si no hubiera sido Dios verdadero, no hubiera podido remediar nuestra situación; si no hubiera sido hombre verdadero, no hubiera podido darnos ejemplo.
      Por eso, al nacer el Señor, los ángeles cantan llenos de gozo: Gloria a Dios en el cielo, y proclaman: y en la tierra paz a los hombres que ama el Señor. Ellos ven, en efecto, que la Jerusalén celestial se va edificando por medio de todas las naciones del orbe. ¿Cómo, pues, no habría de alegrarse la pequeñez humana ante esta obra inenarrable de la misericordia divina, cuando incluso los coros sublimes de los ángeles encontraban en ella un gozo tan intenso?
    titulo: MARÍA, ANTES DE CONCEBIR CORPORALMENTE, CONCIBIÓ EN SU ESPÍRITU
  resp2:
    ref: ''
    vr:
    - - R
      - Celebremos la festividad de la gloriosa Virgen María, en cuya humildad puso el Señor sus ojos; * ella concibió al Salvador del mundo, como el ángel lo anunció.
    - - V
      - Cantemos alabanzas a Cristo en este día, al celebrar las glorias de la admirable Madre de Dios.
    - - R
      - Ella concibió al Salvador del mundo, como el ángel lo anunció.
  oracion: Haz venir, Señor, sobre nosotros la poderosa intercesión de la gloriosa Virgen María, para que, protegidos con su auxilio, podamos llegar a tu monte santo, que es Jesucristo, tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos. Amén.
SANTA MARÍA MAGDALENA:
  grado: Memoria
  fecha: 07-22
  comun: Del Común de santas mujeres.
  himno: Dichosa la mujer que ha conservado
  lectura2:
    autor: |-
      De las Homilías de san Gregorio Magno, papa, sobre los Evangelios
      (Homilía 25, 1-2. 4-5: PL 76, 1189-1193)
    texto: |-
      María Magdalena, cuando llegó a al sepulcro y no encontró allí el cuerpo del Señor, creyó que alguien se lo había llevado y así lo comunicó a los discípulos. Ellos fueron también al sepulcro, miraron dentro y creyeron que era tal como aquella mujer les había dicho. Y dice el Evangelio acerca de ellos: Los discípulos se volvieron a su casa. Y añade, a continuación: María se había quedado fuera, llorando junto al sepulcro.
      Lo que hay que considerar en estos hechos es la intensidad del amor que ardía en el corazón de aquella mujer, que no se apartaba del sepulcro, aunque los discípulos se habían marchado de allí. Buscaba al que no había hallado, lo buscaba llorando y, encendida en el fuego de su amor, ardía en deseos de aquel a quien pensaba que se lo habían llevado. Por esto ella fue la única en verlo entonces, porque se había quedado buscándolo, pues lo que da fuerza a las buenas obras es la perseverancia en ellas, tal como afirma la voz de aquel que es la Verdad en persona: El que persevere hasta el fin se salvará.
      Primero lo buscó, sin encontrarlo; perseveró luego en la búsqueda, y así fue como lo encontró; con la dilación iba aumentando su deseo, y este deseo aumentado le valió hallar lo que buscaba. Los santos deseos, en efecto, aumentan con la dilación. Si la dilación los enfría, es porque no son o no eran verdaderos deseos. Todo aquel que ha sido capaz de llegar a la verdad es porque ha sentido la fuerza de este amor. Por esto dice David: Mi alma tiene sed de Dios, del Dios vivo: ¿cuándo entraré a ver el rostro de Dios? Idénticos sentimientos expresa la Iglesia cuando dice, en el Cantar de los cantares: Desfallezco de amor; y también: Mi alma se derrite.
      Mujer, ¿por qué lloras? ¿A quién buscas? Se le pregunta la causa de su dolor con la finalidad de aumentar su deseo, ya que, al recordarle a quién busca, se enciende con más fuerza el fuego de su amor.
      Jesús dijo: «¡María!» Después de haberla llamado con el nombre genérico de «mujer», sin haber sido reconocido, la llama ahora por su nombre propio. Es como si le dijera: «Reconoce a aquel que te reconoce a ti. Yo te conozco, no de un modo genérico, como a los demás, sino en especial.» María, al sentirse llamada por su nombre, reconoce al que lo ha pronunciado, y, al momento, lo llama «rabbuní»,es decir: «maestro», ya que el mismo a quien ella buscaba exteriormente era el que interiormente la instruía para que lo buscase.
    titulo: ARDÍA EN DESEOS DE CRISTO, A QUIEN PENSABA QUE SE LO HABÍAN LLEVADO
  resp2:
    ref: ''
    vr:
    - - R
      - 'Cuando volvió del sepulcro del Señor, María Magdalena anunció a los discípulos: «He visto al Señor.» * Dichosa ella que fue digna de llevar la noticia de la resurrección de la Vida.'
    - - V
      - Llorando al que amaba, encontró al que buscaba, y anunció luego al que había encontrado.
    - - R
      - Dichosa ella que fue digna de llevar la noticia de la resurrección de la Vida.
  oracion: Dios nuestro, que quisiste que santa María Magdalena fuese la primera en recibir de tu Hijo unigénito la misión de anunciar el gozo pascual, concédenos, por su intercesión, que, siguiendo su ejemplo, demos a conocer a Cristo resucitado y merezcamos contemplarlo luego reinando en tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO SOLANO, presbítero:
  grado: Memoria
  fecha: 07-24
  comun: Del común de los pastores.
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      Del decreto Presbyterórum órdinis, sobre el ministerio y vida de los presbíteros, del Concilio Vaticano segundo.
      (Núm. 12)
    texto: |-
      Por el Sacramento del Orden, los presbíteros se configuran a Cristo Sacerdote, como miembros con la Cabeza, para la estructuración y edificación de todo su Cuerpo, que es la Iglesia, como cooperadores del orden episcopal. Ya en la consagración del bautismo, como todos los fieles cristianos, recibieron ciertamente la señal y el don de tan gran vocación y gracia para sentirse capaces y obligados, en la misma debilidad humana, a seguir la perfección, según la palabra del Señor: Sed perfectos como vuestro Padre celestial es perfecto.
      Los sacerdotes están obligados especialmente a adquirir aquella perfección, puesto que, consagrados de una forma nueva a Dios en la recepción del Orden, se constituyen en instrumentos vivos del Sacerdote Eterno para poder proseguir, a través del tiempo, su obra admirable, que restauró, con divina eficacia, a todo el género humano.
      Siendo, pues, que todo sacerdote representa a su modo la persona del mismo Cristo, tiene también la gracia singular de, al mismo tiempo que sirve a la plebe encomendada y a todo el pueblo de Dios, poder conseguir más aptamente la perfección de aquel cuya función representa, y de que sane la debilidad de la carne humana la santidad de quien es hecho por nosotros Pontífice santo, sin maldad, sin mancha, excluído del número de los pecadores.
      Cristo, a quien el Padre santificó o consagró y envió al mundo, se entregó por nosotros para rescatarnos de toda iniquidad y adquirirse un pueblo propio y aceptable, celador de obras buenas, y así, por su pasión, entró en su gloria; del mismo modo, los presbíteros, consagrados por la unción del Espíritu Santo, y enviados por Cristo, mortifican en sí mismos las tendencias de la carne y se entregan totalmente al servicio de los hombres, y de esta forma pueden caminar hacia el varón perfecto, en la santidad con que han sido enriquecidos en Cristo.
      Así, pues, ejerciendo el ministerio del Espíritu y de la justicia, se fortalecen en la vida del Espíritu, con tal que sean dóciles al Espíritu de Cristo, que los vivifica y conduce. Pues ellos se ordenan a la perfección de la vida por las mismas acciones sagradas que realizan cada día, como por todo su ministerio, que desarrollan en unión con el obispo y con los demás presbíteros.
      Mas la santidad de los presbíteros contribuye poderosamente al cumplimiento fructuoso del propio ministerio, porque, aunque la gracia de Dios puede realizar la obra de la salvación también por medio de ministros indignos, sin embargo, Dios prefiere, por ley ordinaria, manifestar sus maravillas por medio de quienes, hechos más dóciles al impulso y guía del Espíritu Santo, por su íntima unión con Cristo y su santidad de vida, pueden decir con el apóstol: Vivo yo, pero no soy yo, es Cristo quien vive en mí.
    titulo: VOCACIÓN DE LOS PRESBÍTEROS A LA PERFECCIÓN
  resp2:
    ref: 1Ts 2, 8; Ga 4, 19
    vr:
    - - R
      - Queríamos daros no sólo el Evangelio de Dios, sino incluso nuestro propio ser, * porque habíais llegado a sernos muy queridos.
    - - V
      - ¡Hijos míos!, por quienes sufro de nuevo dolores de parto, hasta ver a Cristo formado en vosotros.
    - - R
      - Porque habíais llegado a sernos muy queridos.
  oracion: Señor, que, por medio del presbítero san Francisco Solano, llevaste a muchos pueblos de América al seno de la Iglesia, por sus méritos e intercesión, míranos con bondad y atrae hacia ti a los pueblos que aún no te conocen. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTIAGO, apóstol:
  grado: Fiesta
  fecha: 07-25
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder.
  - - R
    - Y las maravillas que realizó.
  lectura1:
    ref: De la primera carta del apóstol san Pablo a los Corintios 4,1-16
    texto: |-
      Hermanos: Que la gente sólo vea en nosotros servidores de Cristo y administradores de los misterios de Dios. Ahora, en un administrador lo que se busca es que sea fiel. Por lo que a mí se refiere, me importa muy poco ser juzgado por vosotros o por cualquier tribunal humano. Ni siquiera yo mismo juzgo mi actuación. Cierto que mi conciencia nada me reprocha, mas no por eso me creo justificado. Mi juez será el Señor. No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.
      Estas verdades, hermanos, las he expuesto por vuestro provecho, aplicándolas a mi persona y a Apolo. Así, por esta aplicación, aprenderéis aquello de: «No más de lo que está escrito», a fin de que nadie se enorgullezca de un apóstol y desprecie a otro. Porque, ¿quién es el que te distingue? ¿Qué tienes que no hayas recibido? Y, si lo recibiste, ¿por qué te glorías como si no lo hubieras recibido? ¡Ya estáis satisfechos! ¡Os habéis hecho ya ricos! ¡Habéis ganado un reino sin ayuda nuestra! ¡Ya lo podíais haber ganado! ¡Así tendríamos nosotros parte en vuestro reino!
      Por lo que veo, Dios nos ha asignado a los apóstoles el último lugar, como a condenados a muerte; porque hemos venido a ser el espectáculo del mundo, de los ángeles y de los hombres. Nosotros somos insensatos por Cristo, vosotros sensatos en Cristo; nosotros débiles, vosotros fuertes; vosotros estimados, nosotros despreciados. Todavía ahora pasamos hambre, sed y desnudez. Somos maltratados y arrojados de una parte a otra, y nos fatigamos trabajando con nuestras manos. Cuando nos maldicen, bendecimos; cuando nos persiguen, soportamos; cuando nos injurian, respondemos con dulzura. Hemos venido a ser hasta ahora como basura del mundo, como el desecho de la humanidad.
      No os escribo esto para confundiros, sino para amonestaros como a hijos míos carísimos. Aunque tengáis, en efecto, diez mil maestros que os lleven a Cristo, de hecho sólo tenéis un padre. Yo os engendré para Cristo por la predicación del evangelio.
      Os exhorto, pues, a que seáis mis imitadores, como yo imito a Cristo.
    titulo: SEAMOS IMITADORES DEL APÓSTOL, COMO ÉL IMITA A CRISTO
  resp1:
    ref: Jn 15, 15; Mt 13, 11. 16
    vr:
    - - R
      - Ya no os llamaré siervos; os he llamado amigos, * porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
    - - V
      - A vosotros ha concedido Dios conocer los misterios del reino de los cielos; dichosos vuestros ojos porque ven, y vuestros oídos porque oyen.
    - - R
      - Porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
  lectura2:
    autor: |-
      De las Homilías de san Juan Crisóstomo, obispo, sobre el evangelio de san Mateo
      (Homilía 65, 2-4: PG 58, 619-622)
    texto: |-
      Los hijos de Zebedeo apremian a Cristo, diciéndole: Haz que se siente uno a tu derecha y otro a tu izquierda. ¿Qué les responde el Señor? Para hacerles ver que lo que piden no tiene nada de espiritual y que, si hubieran sabido lo que pedían, nunca se hubieran atrevido a hacerlo, les dice: No sabéis lo que pedís, es decir: «No sabéis cuán grande, cuán admirable, cuán superior a los mismos coros celestiales es esto que pedís.» Luego añade: ¿Podéis beber el cáliz que yo tengo que beber o recibir el bautismo con que yo he de ser bautizado? Es como si les dijera: «Vosotros me habláis de honores y de coronas, pero yo os hablo de luchas y fatigas. No es éste tiempo de premios, ni es ahora cuando se ha de manifestar mi gloria; la vida presente es tiempo de muertes, de guerra y de peligros.»
      Pero fijémonos cómo la manera de interrogar del Señor equivale a una exhortación y a un aliciente. No dice: «¿Podéis soportar la muerte? ¿Sois capaces de derramar vuestra sangre?», sino que sus palabras son: ¿Podéis beber el cáliz? Y, para animarlos a ello, añade: Que yo tengo que beber; de este modo, la consideración de que se trata del mismo cáliz que ha de beber el Señor había de estimularlos a una respuesta más generosa. Y a su pasión le da el nombre de «bautismo», para significar con ello que sus sufrimientos habían de ser causa de una gran purificación para todo el mundo. Ellos responden: Sí, podemos. El fervor de su espíritu les hace dar esta respuesta espontánea, sin saber bien lo que prometen, pero con la esperanza de que de este modo alcanzarán lo que desean.
      ¿Qué les dice entonces el Señor? En efecto, mi cáliz lo beberéis y recibiréis el bautismo que yo he de recibir. Grandes son los bienes que les anuncia, esto es: «Seréis dignos del martirio y sufriréis lo mismo que yo, vuestra vida acabará con una muerte violenta y así seréis partícipes de mi pasión. Pero el sentarse a mi derecha o a mi izquierda no me corresponde a mi otorgarlo; es para quienes lo ha reservado mi Padre.» Después que ha levantado sus ánimos y ha provocado su magnanimidad, después que los ha hecho capaces de superar el sufrimiento, entonces es cuando corrige su petición.
      Los otros diez se disgustaron contra los dos hermanos. Ya veis cuán imperfectos eran todos, tanto aquellos que pretendían una precedencia sobre los otros diez, como también los otros diez que envidiaban a sus dos colegas. Pero -como ya dije en otro lugar- si nos fijamos en su conducta posterior, observamos que están ya libres de esta clase de aspiraciones. El mismo Juan, uno de los protagonistas de este episodio, cede siempre el primer lugar a Pedro, tanto en la predicación como en la realización de los milagros, como leemos en los Hechos de los apóstoles. En cuanto a Santiago, no vivió por mucho tiempo; ya desde el principio se dejó llevar de su gran vehemencia y, dejando a un lado toda aspiración humana, obtuvo bien pronto la gloria inefable del martirio.
    titulo: PARTICIPES DE LA PASIÓN DE CRISTO
  resp2:
    ref: ''
    vr:
    - - R
      - Éstos son los que a su paso por este mundo plantaron con su sangre a la Iglesia; * bebieron el cáliz del Señor y se convirtieron en amigos de Dios.
    - - V
      - A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    - - R
      - Bebieron el cáliz del Señor y se convirtieron en amigos de Dios.
  te_deum: true
  oracion: Dios todopoderoso y eterno, que quisiste que Santiago fuera el primero de entre los apóstoles en derramar su sangre por la predicación del Evangelio, fortalece a tu Iglesia con el testimonio de su martirio y confórtala con su valiosa protección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS JOAQUÍN Y ANA, padres de la Santísima Virgen María:
  grado: Memoria
  fecha: 07-26
  comun: Del común de santos varones -
  himno: Dichosos los que, oyendo la llamada
  lectura1:
    ref: Del libro de Job 31, 1-8. 13-23. 35-37
    texto: |-
      Pronunció Job estas palabras:
      «Yo hice un pacto con mis ojos de no fijarme en doncellas. Mas Dios ¿qué suerte me reserva desde el cielo?, ¿qué herencia el Poderoso desde lo alto? ¿No es acaso la desgracia para el hombre que es injusto, y el fracaso para el que obra iniquidad?
      ¿No contempla él mis caminos? ¿No me lleva la cuenta de mis pasos? ¿He caminado yo con embusteros, o han corrido mis pies tras la mentira? Péseme Dios en balanza no alterada y entonces mi honradez comprobará.
      Si aparté mis pasos del camino, siguiendo los caprichos de mis ojos, o si a mis manos mancha alguna se adhirió, ¡que otro coma lo que yo sembrare y arranque los retoños de mis campos!
      Si negué su derecho al esclavo o a la esclava en litigio surgido contra mí, ¿qué podría yo hacer cuando Dios se levantase, o qué respondería, si me llegase a interrogar? El que me hizo a mí en el vientre ¿no lo hizo también a él?, ¿no nos hizo él a todos igualmente?
      Si al pobre negué lo que deseaba o dejé bañarse en llanto los ojos de la viuda, si comí yo solo mi pan, sin compartirlo con el huérfano —yo que desde joven los he cuidado como un padre, yo que los he guiado desde niño—, si vi al pobre o al vagabundo sin ropa con qué cubrirse, y no me dieron las gracias sus cuerpos, calientes con el vellón de mis ovejas, si contra el inocente alcé la mano, por saber que el tribunal su apoyo me brindaba, ¡que mi espalda se arranque de mi nuca y mi brazo del hombro se desgaje!
      Pues el terror de mi Dios me invadiría y no sería capaz de resistir el esplendor de tanta majestad.
      ¡Ojalá que él me escuchara! ¡Yo estampo aquí mi firma! Que me responda el Todopoderoso, que mi rival escriba su alegato: Yo lo llevaría sobre mis hombros, lo ceñiría sobre mi frente igual que una diadema, de cada uno de mis pasos cuenta le daría, y avanzaría hacia él, igual que un príncipe.»
    titulo: CONDUCTA LIMPIA Y RECTA DE JOB
  resp1:
    ref: Jb 31, 3; Pr 15, 3; Jb 31, 4
    vr:
    - - R
      - ¿No es acaso la desgracia para el hombre que es injusto, y el fracaso para el que obra iniquidad? * En todo lugar están los ojos del Señor observando a los malos y a los buenos.
    - - V
      - ¿No contempla él mis caminos? ¿No me lleva la cuenta de mis pasos?
    - - R
      - En todo lugar están los ojos del Señor observando a los malos y a los buenos.
  lectura2:
    autor: |-
      De los Sermones de san Juan Damasceno, obispo
      (Disertación 6, Sobre la Natividad de la Virgen María, 2. 4. 5. 6: PG 96, 663. 667. 670)
    texto: |-
      Ya que estaba determinado que la Virgen Madre de Dios nacería de Ana, la naturaleza no se atrevió a adelantarse al germen de la gracia, sino que esperó a dar su fruto hasta que la gracia hubo dado el suyo. Convenía, en efecto, que naciese como primogénita aquella de la que había de nacer el primogénito de toda la creación, en el cual todo se mantiene.
      ¡Oh bienaventurados esposos Joaquín y Ana! Toda la creación os está obligada, ya que por vosotros ofreció al Creador el más excelente de todos los dones, a saber, aquella madre casta, la única digna del Creador.
      Alégrate, Ana, la estéril, que no dabas a luz; rompe a cantar de júbilo, la que no tenías dolores. Salta de gozo, Joaquín, porque de tu hija un niño nos ha nacido, un hijo se nos ha dado, y será llamado: «Ángel del gran designio» de la salvación universal, «Dios poderoso». Este niño es Dios.
      ¡Oh bienaventurados esposos Joaquín y Ana, totalmente inmaculados! Sois conocidos por el fruto de vuestro vientre, tal como dice el Señor: Por sus frutos los conoceréis. Vosotros os esforzasteis en vivir siempre de una manera agradable a Dios y digna de aquella que tuvo en vosotros su origen. Con vuestra conducta casta y santa, ofrecisteis al mundo la joya de la virginidad, aquella que había de permanecer virgen antes del parto, en el parto y después del parto; aquella que, de un modo único y excepcional, cultivaría siempre la virginidad en su mente, en su alma y en su cuerpo.
      ¡Oh castísimos esposos Joaquín y Ana! Vosotros, guardando la castidad prescrita por la ley natural, conseguisteis, por la gracia de Dios, un fruto superior a la ley natural, ya que engendrasteis para el mundo a la que fue madre de Dios sin conocer varón. Vosotros, comportándoos en vuestras relaciones humanas de un modo piadoso y santo, engendrasteis una hija superior a los ángeles, que es ahora la reina de los ángeles. ¡Oh bellísima niña, sumamente amable! ¡Oh hija de Adán y madre de Dios! ¡Bienaventuradas las entrañas y el vientre de los que saliste! ¡Bienaventurados los brazos que te llevaron, los labios que tuvieron el privilegio de besarte castamente, es decir, únicamente los de tus padres, para que siempre y en todo guardaras intacta tu virginidad!
      Aclama al Señor, tierra entera; gritad, vitoread, tocad. Alzad fuerte la voz, alzadla, no temáis.
    titulo: POR SUS FRUTOS LOS CONOCERÉIS
  resp2:
    ref: Cf. Lc 2, 37. 38; cf. 7, 16
    vr:
    - - R
      - Servían día y noche al Señor con ayunos y oraciones, * y esperaban la redención de Israel.
    - - V
      - Pedían a Dios que visitase a su pueblo.
    - - R
      - Y esperaban la redención de Israel.
  oracion: Señor, Dios de nuestros padres, que concediste a san Joaquín y a santa Ana el privilegio de tener como hija a María, la madre del Señor, concédenos, por la intercesión de estos dos santos, la salvación que has prometido a tu pueblo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARTA:
  grado: Memoria
  fecha: 07-29
  comun: Del Común de santas mujeres -
  himno: Dichosa la mujer que ha conservado
  lectura2:
    autor: |-
      De los Sermones de san Agustín, obispo
      (Sermón 103, 1-2. 6: PL 38, 613. 615)
    texto: |-
      Las palabras del Señor nos advierten que, en medio de la multiplicidad de ocupaciones de este mundo, hay una sola cosa a la que debemos tender. Tender, porque somos todavía peregrinos, no residentes; estamos aún en camino, no en la patria definitiva; hacia ella tiende nuestro deseo, pero no disfrutamos aún de su posesión. Sin embargo, no cejemos en nuestro esfuerzo, no dejemos de tender hacia ella, porque sólo así podremos un día llegar a término.
      Marta y María eran dos hermanas, unidas no sólo por su parentesco de sangre, sino también por sus sentimientos de piedad; ambas estaban estrechamente unidas al Señor, ambas le servían durante su vida mortal con idéntico fervor. Marta lo hospedó, como se acostumbra a hospedar a un peregrino cualquiera. Pero, en este caso, era una sirvienta que hospedaba a su Señor, una enferma al Salvador, una creatura al Creador. Le dio hospedaje para alimentar corporalmente a aquel que la había de alimentar con su Espíritu. Porque el Señor quiso tomar la condición de esclavo para así ser alimentado por los esclavos, y ello no por necesidad, sino por condescendencia, ya que fue realmente una condescendencia el permitir ser alimentado. Su condición humana lo hacía capaz de sentir hambre y sed.
      Así, pues, el Señor fue recibido en calidad de huésped, él, que vino a los suyos y los suyos no lo recibieron; pero a cuantos lo recibieron dio poder de llegar a ser hijos de Dios, adoptando a los siervos y convirtiéndolos en hermanos, redimiendo a los cautivos y convirtiéndolos en coherederos. Pero que nadie de vosotros diga: «Dichosos los que pudieron hospedar al Señor en su propia casa.» No te sepa mal, no te quejes por haber nacido en un tiempo en que ya no puedes ver al Señor en carne y hueso; esto no te priva de aquel honor, ya que el mismo Señor afirma: Cada vez que lo hicisteis con uno de estos mis humildes hermanos, conmigo lo hicisteis.
      Por lo demás, tú, Marta —dicho sea con tu venia, y bendita seas por tus buenos servicios—, buscas el descanso como recompensa de tu trabajo. Ahora estás ocupada en los mil detalles de tu servicio, quieres alimentar unos cuerpos que son mortales, aunque ciertamente son de santos; pero ¿por ventura, cuando llegues a la patria celestial, hallarás peregrinos a quienes hospedar, hambrientos con quienes partir tu pan, sedientos a quienes dar de beber, enfermos a quienes visitar, litigantes a quienes poner en paz, muertos a quienes enterrar?
      Todo esto allí ya no existirá; allí sólo habrá lo que María ha elegido: allí seremos nosotros alimentados, no tendremos que alimentar a los demás. Por esto, allí alcanzará su plenitud y perfección lo que aquí ha elegido María, la que recogía las migajas de la mesa opulenta de la palabra del Señor. ¿Quieres saber lo que allí ocurrirá? Dice el mismo Señor, refiriéndose a sus siervos: Os aseguro que se pondrá de faena, los hará sentar a la mesa y se prestará a servirlos.
    titulo: DICHOSOS LOS QUE PUDIERON HOSPEDAR AL SEÑOR EN SU PROPIA CASA
  resp2:
    ref: Cf. Jn 12, 1-3
    vr:
    - - R
      - Después de que Jesús resucitó a Lázaro, le ofrecieron un banquete en Betania, * y Marta servía la mesa.
    - - V
      - María tomó una libra de ungüento precioso y ungió los pies de Jesús.
    - - R
      - Y Marta servía la mesa.
  oracion: Dios todopoderoso y eterno, cuyo Hijo quiso aceptar la hospitalidad que santa Marta le ofreció en su casa, haz que nosotros, por intercesión de esta santa, estemos siempre dispuestos a servirte en cada uno de nuestros hermanos y así merezcamos ser recibidos por ti en las moradas eternas, al final de nuestra vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN IGNACIO DE LOYOLA, presbítero:
  grado: Memoria
  fecha: 07-31
  comun: 'Del Común de pastores: para un santo presbítero.'
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De los hechos de san Ignacio recibidos por Luis Goncalves de labios del mismo santo
      (Cap. 1, 5-9: Acta Sanctorum Iulii 7 [1868], 647)
    texto: |-
      Ignacio era muy aficionado a los llamados libros de caballerías, narraciones llenas de historias fabulosas e imaginarias. Cuando se sintió restablecido, pidió que le trajeran algunos de esos libros para entretenerse, pero no se halló en su casa ninguno; entonces le dieron para leer un libro llamado Vida de Cristo y otro que tenía por título Flos sanctorum, escritos en su lengua materna.
      Con la frecuente lectura de estas obras, empezó a sentir algún interés por las cosas que en ellas se trataban. A intervalos volvía su pensamiento a lo que había leído en tiempos pasados y entretenía su imaginación con el recuerdo de las vanidades que habitualmente retenían su atención durante su vida anterior.
      Pero entretanto iba actuando también la misericordia divina, inspirando en su ánimo otros pensamientos, además de los que suscitaba en su mente lo que acababa de leer. En efecto, al leer la vida de Jesucristo o de los santos, a veces se ponía a pensar y se preguntaba a sí mismo: «¿Y si yo hiciera lo mismo que san Francisco o que santo Domingo?» Y, así, su mente estaba siempre activa. Estos pensamientos duraban mucho tiempo, hasta que, distraído por cualquier motivo, volvía a pensar, también por largo tiempo, en las cosas vanas y mundanas. Esta sucesión de pensamientos duró bastante tiempo.
      Pero había una diferencia; y es que, cuando pensaba en las cosas del mundo, ello le producía de momento un gran placer; pero cuando, hastiado, volvía a la realidad, se sentía triste y árido de espíritu; por el contrario, cuando pensaba en la posibilidad de imitar las austeridades de los santos, no sólo entonces experimentaba un intenso gozo, sino que además tales pensamientos lo dejaban lleno de alegría. De esta diferencia él no se daba cuenta ni le daba importancia, hasta que un día se le abrieron los ojos del alma y comenzó a admirarse de esta diferencia que experimentaba en sí mismo, que, mientras una clase de pensamientos lo dejaban triste, otros, en cambio, alegre. Y así fue como empezó a reflexionar seriamente en las cosas de Dios. Más tarde, cuando se dedicó a las prácticas espirituales, esta experiencia suya le ayudó mucho a comprender lo que sobre la discreción de espíritus enseñaría luego a los suyos.
    titulo: EXAMINAD SI LOS ESPÍRITUS PROVIENEN DE DIOS
  resp2:
    ref: 1Pe 4, 11. 8
    vr:
    - - R
      - El que toma la palabra que hable palabra de Dios. El que se dedica al servicio que lo haga en virtud del encargo recibido de Dios. * Así, Dios será glorificado en todo, por medio de Jesucristo.
    - - V
      - Ante todo, teneos una constante caridad unos con otros.
    - - R
      - Así, Dios será glorificado en todo, por medio de Jesucristo.
  oracion: Señor Dios, que suscitaste en tu Iglesia a san Ignacio de Loyola para que extendiera más la gloria de tu nombre, concédenos que, a imitación suya y apoyados en su auxilio, libremos también en la tierra el noble combate de la fe, para que merezcamos ser coronados juntamente con él en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ALFONSO MARÍA DE LIGORIO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 08-01
  comun: Del Común de pastores para un santo obispo y del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De las obras de San Alfonso María de Ligorio, obispo.
      (Tratado sobre la práctica del amor a Jesucristo, edición latina, Roma 1909, pp. 9-14)
    texto: |-
      Toda la santidad y la perfección del alma consiste en el amor a Jesucristo, nuestro Dios, nuestro sumo bien y nuestro redentor. La caridad es la que da unidad y consistencia a todas las virtudes que hacen al hombre perfecto.
      ¿Por ventura Dios no merece todo nuestro amor? Él nos ha amado desde toda la eternidad. «Considera, oh hombre —así nos habla—, que yo he sido el primero en amarte. Aún no habías nacido, ni siquiera existía el mundo, y yo ya te amaba. Desde que existo, yo te amo.»
      Dios, sabiendo que al hombre se lo gana con beneficios, quiso llenarlo de dones para que se sintiera obligado a amarlo: «Quiero atraer a los hombres a mi amor con los mismos lazos con que habitualmente se dejan seducir: con los vínculos del amor.» Y éste es el motivo de todos los dones que concedió al hombre. Además de haber dado un alma dotada, a imagen suya, de memoria, entendimiento y voluntad, y un cuerpo con sus sentidos, no contento con esto, creó, en beneficio suyo, el cielo y la tierra y tanta abundancia de cosas, y todo ello por amor al hombre, para que todas aquellas creaturas estuvieran al servicio del hombre, y así el hombre lo amara a él en atención a tantos beneficios.
      Y no sólo quiso darnos aquellas creaturas, con toda su hermosura, sino que además, con el objeto de conquistarse nuestro amor, llegó al extremo de darse a sí mismo por entero a nosotros. El Padre eterno llegó a darnos a su Hijo único. Viendo que todos nosotros estábamos muertos por el pecado y privados de su gracia, ¿que es lo que hizo? Llevado por su amor inmenso, mejor aún, excesivo, como dice el Apóstol, nos envió a su Hijo amado para satisfacer por nuestros pecados y para restituirnos a la vida, que habíamos perdido por el pecado.
      Dándonos al Hijo, al que no perdonó, para perdonarnos a nosotros, nos dio con él todo bien: la gracia, la caridad y el paraíso, ya que todas estas cosas son ciertamente menos que el Hijo: El que no perdonó a su propio Hijo, sino que lo entregó a la muerte por todos nosotros, ¿cómo no nos dará con él todo lo demás?
    titulo: EL AMOR A CRISTO
  resp2:
    ref: Sal 144, 19-20; 1Jn 3, 9
    vr:
    - - R
      - El Señor satisface los deseos de sus fieles, escucha sus gritos, y los salva. * El Señor guarda a los que lo aman.
    - - V
      - Quien ha nacido de Dios no comete pecado, porque su germen permanece en él.
    - - R
      - El Señor guarda a los que lo aman.
  oracion: Dios nuestro, que propones constantemente a tu Iglesia nuevos modelos de vida cristiana, apropiados a todas las circunstancias en que puedan vivir tus hijos, concédenos imitar el celo apostólico que desplegó el santo obispo Alfonso María de Ligorio por la salvación de sus hermanos, para que, como él, lleguemos también a recibir el premio reservado a tus servidores fieles. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN MARÍA VIANNEY, presbítero:
  grado: Memoria
  fecha: 08-04
  comun: Del Común de pastores para un santo presbítero.
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De la catequesis de san Juan María Vianney, presbítero
      («Catéchisme sur la priére»: A. Monnin, «Esprit du Curé d'Ars», París 1899, pp. 87-89)
    texto: |-
      Consideradlo, hijos míos: el tesoro del hombre cristiano no está en la tierra, sino en el cielo. Por esto nuestro pensamiento debe estar siempre orientado hacia allí donde está nuestro tesoro.
      El hombre tiene un hermoso deber y obligación: orar y amar. Si oráis y amáis, habréis hallado la felicidad en este mundo.
      La oración no es otra cosa que la unión con Dios. Todo aquel que tiene el corazón puro y unido a Dios experimenta en sí mismo como una suavidad y dulzura que lo embriaga, se siente como rodeado de una luz admirable. En esta íntima unión, Dios y el alma son como dos trozos de cera fundidos en uno solo, que ya nadie puede separar. Es algo muy hermoso esta unión de Dios con su pobre creatura; es una felicidad que supera nuestra comprensión.
      Nosotros nos habíamos hecho indignos de orar, pero Dios, por su bondad, nos ha permitido hablar con él. Nuestra oración es el incienso que más le agrada.
      Hijos míos, vuestro corazón es pequeño, pero la oración lo dilata y lo hace capaz de amar a Dios. La oración es una degustación anticipada del cielo, hace que una parte del paraíso baje hasta nosotros. Nunca nos deja sin dulzura; es como una miel que se derrama sobre el alma y lo endulza todo. En la oración hecha debidamente, se funden las penas como la nieve ante el sol.
      Otro beneficio de la oración es que hace que el tiempo transcurra tan aprisa y con tanto deleite, que ni se percibe su duración. Mirad: cuando era párroco en Bresse, en cierta ocasión, en que casi todos mis colegas habían caído enfermos, tuve que hacer largas caminatas, durante las cuales oraba al buen Dios, y, creedme, que el tiempo se me hacía corto.
      Hay personas que se sumergen totalmente en la oración, como los peces en el agua, porque están totalmente entregadas al buen Dios. Su corazón no está dividido. ¡Cuánto amo a estas almas generosas! San Francisco de Asís y santa Coleta veían a nuestro Señor y hablaban con él, del mismo modo que hablamos entre nosotros.
      Nosotros, por el contrario, ¡cuántas veces venimos a la iglesia sin saber lo que hemos de hacer o pedir! Y, sin embargo, cuando vamos a casa de cualquier persona, sabemos muy bien para qué vamos. Hay algunos que incluso parece como si le dijeran al buen Dios: «Sólo dos palabras, para deshacerme de ti ... » Muchas veces pienso que, cuando venimos a adorar al Señor, obtendríamos todo lo que le pedimos si se lo pidiéramos con una fe muy viva y un corazón muy puro.
    titulo: 'HERMOSA OBLIGACIÓN DEL HOMBRE: ORAR Y AMAR'
  resp2:
    ref: 2Co 4, 17; 1Co 2, 9
    vr:
    - - R
      - Una tribulación pasajera y liviana produce en nosotros * un inmenso e incalculable tesoro de gloria.
    - - V
      - Ni el ojo vio, ni el oído oyó, ni vino a la mente del hombre lo que Dios ha preparado para los que le aman.
    - - R
      - Un inmenso e incalculable tesoro de gloria.
  oracion: Dios todopoderoso y lleno de bondad, que nos has dado en san Juan María Vianney un modelo de pastor apasionadamente consagrado a su ministerio, concédenos, por su intercesión, dedicar como él nuestras vidas a ganar para Cristo a nuestros hermanos por medio de la caridad y alcanzar, juntamente con ellos, la gloria eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA TRANSFIGURACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 08-06
  himno: Para la cruz y la crucifixión
  salmodia:
  - ant: Un solo día en tu casa vale más que otros mil.
    salmo: salmo-83
  - ant: Amanece la luz para el justo, y la alegría para los rectos de corazón. Aleluia.
    salmo: salmo-96
  - ant: Ensalzad al Señor, Dios nuestro; postraos ante su monte santo.
    salmo: salmo-98
  versiculo:
  - - V
    - Dios les hablaba desde la columna de nube.
  - - R
    - Oyeron sus mandatos.
  lectura1:
    ref: De la segunda carta del apóstol san Pablo a los Corintios 3, 7—4, 6
    texto: |-
      Hermanos: Si el régimen de la ley que mata, que fue grabada con letras en piedra, fue glorioso, y de tal modo que ni podían fijar la vista los israelitas en el rostro de Moisés por la gloria de su rostro, que era pasajera, ¿cuánto más glorioso no será el régimen del espíritu? Efectivamente, si hubo gloria en el régimen que lleva a la condenación, con mayor razón hay profusión de gloria en el régimen que conduce a la justificación. Y, en verdad, lo que en aquel caso fue gloria, no es tal en comparación con ésta, tan eminente y radiante. Pues si lo perecedero fue como un rayo de gloria, con más razón será glorioso lo imperecedero.
      Estando, pues, en posesión de una esperanza tan grande, procedemos con toda decisión y seguridad, y no como Moisés, que ponía un velo sobre su rostro, para que no se fijasen los hijos de Israel en su resplandor, que era perecedero. Y sus entendimientos quedaron embotados, pues, en efecto, hasta el día de hoy perdura ese mismo velo en la lectura de la antigua alianza. El velo no se ha descorrido, pues sólo con Cristo queda removido. Y así, hasta el día de hoy, siempre que leen a Moisés, persiste un velo tendido sobre sus corazones. Mas cuando se vuelvan al Señor, será descorrido el velo. El Señor es espíritu, y donde está el Espíritu del Señor, ahí está la libertad. Y todos nosotros, reflejando como en un espejo en nuestro rostro descubierto la gloria del Señor, nos vamos transformando, en su propia imagen, hacia una gloria cada vez mayor, por la acción del Señor, que es espíritu.
      Por eso, investidos, por la misericordia de Dios, de este ministerio, no sentimos desfallecimiento, antes bien, renunciamos a todo encubrimiento vergonzoso del Evangelio; procedemos sin astucia y sin adulterar la palabra de Dios y, dando a conocer la verdad, nos encomendamos al juicio de toda humana conciencia en la presencia de Dios. Si, con todo, nuestro Evangelio queda cubierto como por un velo, queda así encubierto sólo para los que van camino de perdición, para aquellos cuyos entendimientos incrédulos cegó el dios del mundo presente, para que no vean brillar la luz del mensaje evangélico sobre la gloria de Cristo, que es imagen de Dios.
      No nos predicamos a nosotros mismos, sino que predicamos a Cristo Jesús como Señor; nosotros nos presentamos como siervos vuestros por Jesús. El mismo Dios que dijo: «Brille la luz del seno de las tinieblas», ha hecho brillar la luz en nuestros corazones, para que demos a conocer la gloria de Dios que resplandece en el rostro de Cristo.
    titulo: GLORIA DIFUNDIDA POR CRISTO EN LA NUEVA ALIANZA
  resp1:
    ref: 1Jn 3, 1. 2
    vr:
    - - R
      - Mirad qué amor nos ha tenido el Padre * para llamarnos hijos de Dios, pues ¡lo somos!
    - - V
      - Sabemos que, cuando se manifieste, seremos semejantes a él, porque lo veremos tal cual es.
    - - R
      - Para llamarnos hijos de Dios, pues ¡lo somos!
  lectura2:
    autor: |-
      Del Sermón de Anastasio Sinaíta, obispo, en el día de la Transfiguración del Señor .
      (Núms. 6-10: «Mélanges d'archéologie et d'histoire» 67 [1955], 241-244)
    texto: |-
      El misterio que hoy celebramos lo manifestó Jesús a sus discípulos en el monte Tabor. En efecto, después de haberles hablado, mientras iba con ellos, acerca del reino y de su segunda venida gloriosa, teniendo en cuenta que quizá no estaban muy convencidos de lo que les había anunciado acerca del reino y deseando infundir en sus corazones una firmísima e intima convicción, de modo que por lo presente creyeran en lo futuro, realizó ante sus ojos aquella admirable manifestación, en el monte Tabor, como una imagen prefigurativa del reino de los cielos. Era como si les dijese: «El tiempo que ha de transcurrir antes de que se realicen mis predicciones no ha de ser motivo de que vuestra fe se debilite, y por esto, ahora mismo, en el tiempo presente, os aseguro que algunos de los aquí presentes no morirán, sin haber visto al Hijo del hombre presentarse con la gloria de su Padre.»
      Y el evangelista, para mostrar que el poder de Cristo estaba en armonía con su voluntad, añade: Seis días después, Jesús tomó consigo a Pedro, a Santiago y a su hermano Juan, y los llevó aparte a un alto monte, y se transfiguró en su presencia; su rostro se puso brillante como el sol y sus vestidos se volvieron blancos como la luz. Y se aparecieron Moisés y Elías conversando con él.
      Éstas son las maravillas de la presente solemnidad, éste es el misterio, saludable para nosotros, que ahora se ha cumplido en el monte, ya que ahora nos reúne la muerte y, al mismo tiempo, la festividad de Cristo. Por esto, para que podamos penetrar, junto con los elegidos entre los discípulos inspirados por Dios, el sentido profundo de estos inefables y sagrados misterios, escuchemos la voz divina y sagrada que nos llama con insistencia desde lo alto, desde la cumbre del monte.
      Debemos apresurarnos a ir hacia allí -así me atrevo a decirlo- como Jesús, que allí en el cielo es nuestro guía y precursor, con quien brillaremos con nuestra mirada espiritualizada, renovados en cierta manera en los trazos de nuestra alma, hechos conformes a su imagen, y, como él, transfigurados continuamente y hechos participes de la naturaleza divina, y dispuestos para los dones celestiales.
      Corramos hacia allí, animosos y alegres, y penetremos en la intimidad de la nube, a imitación de Moisés y Elías, o de Santiago y Juan. Seamos como Pedro, arrebatado por la visión y aparición divina, transfigurado por aquella hermosa transfiguración, desasido del mundo, abstraído de la tierra; despojémonos de lo carnal, dejemos lo creado y volvámonos al Creador, al que Pedro, fuera de sí, dijo: Señor, qué bien estaría quedamos aquí.
      Ciertamente, Pedro, en verdad qué bien estaría quedarnos aquí con Jesús, y permanecer aquí para siempre. ¿Hay algo más dichoso, más elevado, más importante que estar con Dios, ser hechos conformes con él, vivir en la luz? Cada uno de nosotros, por el hecho de tener a Dios en sí y de ser transfigurado en su imagen divina, tiene derecho a exclamar con alegría: Qué bien estaría quedanos aquí, donde todo es resplandeciente, donde está el gozo, la felicidad y la alegría, donde el corazón disfruta de absoluta tranquilidad, serenidad y dulzura, donde vemos a (Cristo) Dios, donde él, junto con el Padre, pone su morada y dice, al entrar: Hoy ha venido la salud a esta casa, donde con Cristo se hallan acumulados los tesoros de los bienes eternos, donde hallamos reproducidas, como en un espejo, las imágenes de las realidades futuras.
    titulo: QUE BIEN ESTARÍA QUEDARNOS AQUÍ
  resp2:
    ref: Mt 17, 2. 3; cf. Lc 9, 32. 34
    vr:
    - - R
      - El rostro de Jesús se puso brillante como el sol; * y los discípulos, al contemplarlo circundado de gloria, se llenaron de temor.
    - - V
      - Y se les aparecieron Moisés y Elías conversando con Jesús.
    - - R
      - Y los discípulos, al contemplarlo circundado de gloria, se llenaron de temor.
  te_deum: true
  oracion: Señor Dios, que en la gloriosa transfiguración de Jesucristo confirmaste los misterios de la fe con el testimonio de Moisés y de Elías, y nos hiciste entrever en la gloria de tu Hijo la grandeza de nuestra definitiva adopción filial, haz que escuchemos siempre la voz de tu Hijo amado y lleguemos a ser un día sus coherederos en la gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO DOMINGO, presbítero:
  grado: Memoria
  fecha: 08-08
  comun: 'Del Común de los santos varones: para los santos religiosos.'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De varios escritos de la Historia de la Orden de los Predicadores
      (Libellus de principiis Ordinis Praedicatorum; Acta canonizationis sancti Dominici: Monumenta Ordinis Praedicatorum historica 16, Roma 1935, pp. 30ss. 146-147)
    texto: |-
      La vida de Domingo era tan virtuosa y el fervor de su espíritu tan grande, que todos veían en él un instrumento elegido de la gracia divina. Estaba dotado de una firme ecuanimidad de espíritu, ecuanimidad que sólo lograban perturbar los sentimientos de compasión o de misericordia; y, como es norma constante que un corazón alegre se refleja en la faz, su porte exterior, siempre gozoso y afable, revelaba la placidez y armonía de su espíritu. En todas partes, se mostraba, de palabra y de obra, como hombre evangélico. De día, con sus hermanos y compañeros, nadie más comunicativo y alegre que él. De noche, nadie más constante que él en vigilias y oraciones de todo género. Raramente hablaba, a no ser con Dios, en la oración, o de Dios, y esto mismo aconsejaba a sus hermanos.
      Con frecuencia pedía a Dios una cosa: que le concediera una auténtica caridad, que le hiciera preocuparse de un modo efectivo en la salvación de los hombres, consciente de que la primera condición para ser verdaderamente miembro de Cristo era darse totalmente y con todas sus energías a ganar almas para Cristo, del mismo modo que el Señor Jesús, salvador de todos, ofreció toda su persona por nuestra salvación. Con este fin instituyó la Orden de Predicadores, realizando así un proyecto sobre el que había reflexionado profundamente desde hacia ya tiempo.
      Con frecuencia exhortaba, de palabra o por carta, a los hermanos de la mencionada Orden, a que estudiaran constantemente el nuevo y el antiguo Testamento. Llevaba siempre consigo el evangelio de san Mateo y las cartas de san Pablo, y las estudiaba intensamente, de tal modo que casi las sabía de memoria.
      Dos o tres veces fue elegido obispo, pero siempre rehusó, prefiriendo vivir en la pobreza, junto con sus hermanos, que poseer un obispado. Hasta el fin de su vida conservó intacta la gloria de la virginidad. Deseaba ser flagelado, despedazado y morir por la fe cristiana. De él afirmó el papa Gregorio noveno: «Conocí a un hombre tan fiel seguidor de las normas apostólicas, que no dudo que en el cielo ha sido asociado a la gloria de los mismos apóstoles.»
    titulo: HABLABA CON DIOS O DE DIOS
  resp2:
    ref: Cf. Sir 48, 1; Ml 2, 6
    vr:
    - - R
      - Surgió como un fuego un nuevo heraldo de la salvación, * y sus palabras eran como un horno encendido.
    - - V
      - Una doctrina auténtica llevaba en su boca, y en sus labios no se hallaba maldad.
    - - R
      - Y sus palabras eran como un horno encendido.
  oracion: 'Que tu Iglesia, Señor, encuentre siempre luz en las enseñanzas de santo Domingo y protección en sus méritos: que él, que durante su vida fue predicador insigne de la verdad, sea ahora para nosotros un eficaz intercesor ante ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
SAN LORENZO, diácono y mártir:
  grado: Fiesta
  fecha: 08-10
  comun: Del Común de un mártir.
  himno: Testigos de amor
  salmodia:
  - ant: Todos os odiarán por mi nombre; pero el que persevere hasta el fin se salvará.
    salmo: salmo-2
  - ant: Los trabajos de ahora no pesan lo que la gloria que un día se nos descubrirá.
    salmo: salmo-10
  - ant: El Señor probó a los elegidos como oro en el crisol, y los recibió como sacrificio de holocausto para siempre.
    salmo: salmo-16
  versiculo:
  - - V
    - Me asaltaban angustias y aprietos.
  - - R
    - Tus mandatos son mi delicia.
  lectura1:
    ref: De los Hechos de los apóstoles 6, 1-6; 8, 1. 4-8
    texto: |-
      Por aquellos días, habiendo aumentado el número de los discípulos, se levantaron quejas de los helenistas contra los hebreos, porque se atendía mal a sus viudas en la asistencia diaria. Los Doce convocaron entonces a la asamblea de los discípulos y dijeron:
      «No está bien que nosotros descuidemos la palabra de Dios por atender al servicio de las mesas. Elegid, pues, hermanos, de entre vosotros, a siete hombres llenos del Espíritu Santo y de sabiduría, a quienes podamos encomendar este servicio. Nosotros, por nuestra parte, nos dedicaremos a la oración en común y al ministerio de la palabra.»
      Y pareció bien esta proposición a toda la comunidad. Y eligieron a Esteban, hombre lleno de fe y del Espíritu Santo, y a Felipe, Prócoro, Nicanor, Timón, Pármenas y Nicolás, prosélito de Antioquía. Los presentaron a los apóstoles, quienes, después de orar, les impusieron las manos.
      Sucedió que una violenta persecución se desencadenó contra la Iglesia de Jerusalén, y todos, a excepción de los apóstoles, se dispersaron por las regiones de Judea y Samaría. Y, así, los que se habían dispersado fueron anunciando por todas partes la Buena Nueva de la palabra de Dios. Tal fue el caso de Felipe, que bajó a la ciudad de Samaría y predicó a Cristo. La gente, con asentimiento general, al oír y ver los prodigios que obraba Felipe, ponía mucha atención a sus palabras. De muchos posesos salían los espíritus inmundos, dando grandes alaridos; y muchos paralíticos y cojos quedaron curados. Con esto reinaba un gran júbilo en aquella ciudad.
    titulo: LOS APÓSTOLES ELIGEN SIETE AYUDANTES
  resp1:
    ref: Mt 10, 32; Jn 12, 26
    vr:
    - - R
      - A todo aquel que me reconozca ante los hombres —dice el Señor— * lo reconoceré yo también ante mi Padre que está en los cielos.
    - - V
      - Si alguno quiere ponerse a mi servicio, que me siga; y donde yo esté, allí estará también mi servidor.
    - - R
      - Lo reconoceré yo también ante mi Padre que está en los cielos.
  lectura2:
    autor: |-
      De los Sermones de san Agustín, obispo
      (Sermón 304, 1-4: PL 38, 1395-1397)
    texto: |-
      La Iglesia de Roma nos invita hoy a celebrar el triunfo de san Lorenzo, que superó las amenazas y seducciones del mundo, venciendo así la persecución diabólica. Él, como ya se os ha explicado más de una vez, era diácono de aquella Iglesia. En ella administró la sangre sagrada de Cristo, en ella también derramó su propia sangre por el nombre de Cristo. El apóstol san Juan expuso claramente el significado de la Cena del Señor, con aquellas palabras: Como Cristo dio su vida por nosotros, también nosotros debemos dar nuestra vida por los hermanos. Así lo entendió san Lorenzo; así lo entendió y así lo practicó; lo mismo que había tomado de la mesa del Señor, eso mismo preparó. Amó a Cristo durante su vida, lo imitó en su muerte.
      También nosotros, hermanos, si lo amamos de verdad, debemos imitarlo. La mejor prueba que podemos dar de nuestro amor es imitar su ejemplo, porque Cristo padeció por nosotros, dejándonos un ejemplo para que sigamos sus huellas. Según estas palabras de san Pedro, parece como si Cristo sólo hubiera padecido por los que siguen sus huellas, y que la pasión de Cristo sólo aprovechara a los que siguen sus huellas. Lo han imitado los santos mártires hasta el derramamiento de su sangre, hasta la semejanza con su pasión; lo han imitado los mártires, pero no sólo ellos. El puente no se ha derrumbado después de haber pasado ellos; la fuente no se ha secado después de haber bebido ellos.
      Tenedlo presente, hermanos: en el huerto del Señor no sólo hay las rosas de los mártires, sino también los lirios de las vírgenes y las yedras de los casados, así como las violetas de las viudas. Ningún hombre, cualquiera que sea su género de vida, ha de desesperar de su vocación: Cristo ha sufrido por todos. Con toda verdad está escrito de él: Nuestro Salvador quiere que todos los hombres se salven y lleguen al pleno conocimiento de la verdad.
      Entendamos, pues, de qué modo el cristiano ha de seguir a Cristo, además del derramamiento de sangre, además del martirio. El Apóstol, refiriéndose a Cristo, dice: A pesar de su condición divina, no hizo alarde de su categoría de Dios. ¡Qué gran majestad! Al contrario, se anonadó a sí mismo, y tomó la condición de esclavo, pasando por uno de tantos. ¡Qué gran humildad!
      Cristo se rebajó: esto es, cristiano, lo que debes tú procurar. Cristo se sometió: ¿cómo vas tú a enorgullecerte? Finalmente, después de haber pasado por semejante humillación y haber vencido la muerte, Cristo subió al cielo: sigámoslo. Oigamos lo que dice el Apóstol: Si habéis sido resucitados con Cristo, buscad las cosas de arriba, donde Cristo está sentado a la diestra de Dios.
    titulo: ADMINISTRÓ LA SANGRE SAGRADA DE CRISTO
  resp2:
    ref: ''
    vr:
    - - R
      - 'San Lorenzo exclamó: «Yo adoro a mi Dios y sólo a él le sirvo; * por eso no temo tus tormentos.»'
    - - V
      - El Señor es mi roca en que me amparo.
    - - R
      - Por eso no temo tus tormentos.
  te_deum: true
  oracion: Dios nuestro, que inflamaste con el fuego de tu amor a san Lorenzo, para que brillara por la fidelidad a su servicio diaconal y por la gloria de un heroico martirio, haz que nosotros te amemos siempre como él te amó y practiquemos lo que él enseñó. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA CLARA, vírgen:
  grado: Memoria
  fecha: 08-11
  comun: Del Común de vírgenes.
  himno: Esta mujer no quiso
  lectura2:
    autor: |-
      De la Carta de santa Clara, virgen, a la santa Inés de Praga
      (Escritos de santa Clara, edición Ignacio Omaechevarría. Madrid 1970, pp. 339-341)
    texto: |-
      Dichoso, en verdad, aquel a quien le es dado alimentarse en el sagrado banquete y unirse en lo íntimo de su corazón a aquel cuya belleza admiran sin cesar las multitudes celestiales, cuyo afecto produce afecto, cuya contemplación da nueva fuerza, cuya benignidad sacia, cuya suavidad llena el alma, cuyo recuerdo ilumina suavemente, cuya fragancia retornará los muertos a la vida y cuya visión gloriosa hará felices a los ciudadanos de la Jerusalén celestial: él es el brillo de la gloria eterna, un reflejo de la luz eterna, un espejo sin mancha, el espejo que debes mirar cada día, oh reina, esposa de Jesucristo, y observar en él reflejada tu faz, para que así te vistas y adornes por dentro y por fuera con toda la variedad de flores de las diversas virtudes, que son las que han de constituir tu vestido y tu adorno, como conviene a una hija y esposa castísima del Rey supremo. En este espejo brilla la dichosa pobreza, la santa humildad y la inefable caridad, como puedes observar si, con la gracia de Dios, vas recorriendo sus diversas partes.
      Atiende al principio de este espejo, quiero decir a la pobreza de aquel que fue puesto en un pesebre y envuelto en pañales. ¡Oh admirable humildad, oh pasmosa pobreza! El Rey de los ángeles, el Señor del cielo y de la tierra es reclinado en un pesebre. En el medio del espejo considera la humildad, al menos la dichosa pobreza, los innumerables trabajos y penalidades que sufrió por la redención del género humano. Al final de este mismo espejo contempla la inefable caridad por la que quiso sufrir en la cruz y morir en ella con la clase de muerte más infamante. Este mismo espejo, clavado en la cruz, invitaba a los que pasaban a estas consideraciones, diciendo: ¡Oh vosotros, todos los que pasáis por el camino, mirad y ved si hay dolor semejante a mi dolor! Respondamos nosotros, a sus clamores y gemidos, con una sola voz y un solo espíritu: Mi alma lo recuerda y se derrite de tristeza dentro de mi. De este modo, tu caridad arderá con una fuerza siempre renovada, oh reina del Rey celestial.
      Contemplando además sus inefables delicias, sus riquezas y honores perpetuos, y suspirando por el intenso deseo de tu corazón, proclamarás: «Arrástrame tras de ti, y correremos atraídos por el aroma de tus perfumes, esposo celestial. Correré sin desfallecer, hasta que me introduzcas en la sala del festín, hasta que tu mano izquierda esté bajo mi cabeza y tu diestra me abrace felizmente y me beses con los besos deliciosos de tu boca.»
      Contemplando estas cosas, dígnate acordarte de ésta tu insignificante madre, y sabe que yo tengo tu agradable recuerdo grabado de modo imborrable en mi corazón, ya que te amo más que nadie.
    titulo: ATIENDE A LA POBREZA, LA HUMILDAD Y LA CARIDAD DE CRISTO.
