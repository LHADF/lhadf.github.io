  oracion: Dios nuestro, que nos llenas de santa alegría con la solemnidad de los santos apóstoles Pedro y Pablo, haz que tu Iglesia se mantenga siempre fiel a las enseñanzas de estos apóstoles, de quienes recibió el primer anuncio de la fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO TOMÁS, apóstol:
