  lectura2:
    autor: |-
      De las Homilías de san Gregorio Magno, papa, sobre los Evangelios
      (Homilía 26, 7-9: PL 76, 1201-1202)
    texto: |-
      Tomás, uno de los Doce, llamado Dídimo, no estaba con ellos en el momento de presentarse Jesús. Sólo este discípulo estaba ausente y, al volver y escuchar lo que había sucedido, no quiso creer lo que le contaban. Se presenta de nuevo el Señor y ofrece al discípulo incrédulo su costado para que lo palpe, le muestra sus manos y, mostrándole la cicatriz de sus heridas, sana la herida de su incredulidad. ¿Qué es, hermanos muy amados, lo que descubrís en estos hechos? ¿Creéis acaso que sucedieron porque sí todas estas cosas: que aquel discípulo elegido estuviera primero ausente, que luego al venir oyese, que al oír dudase, que al dudar palpase, que al palpar creyese?
      Todo esto no sucedió porque sí, sino por disposición divina. La bondad de Dios actuó en este caso de un modo admirable, ya que aquel discípulo que había dudado, al palpar las heridas del cuerpo de su maestro, curó las heridas de nuestra incredulidad. Más provechosa fue para nuestra fe la incredulidad de Tomás que la fe de los otros discípulos, ya que, al ser él inducido a creer por el hecho de haber palpado, nuestra mente, libre de toda duda, es confirmada en la fe. De este modo, en efecto, aquel discípulo que dudó y que palpó se convirtió en testigo de la realidad de la resurrección.
      Palpó y exclamó: «¡Señor mío y Dios mío!» Jesús le dijo: «¿No has creído, Tomás, sino después de haberme visto?» Como sea que el apóstol Pablo dice: La fe es la firme seguridad de los bienes que se esperan, la plena convicción de las realidades que no se ven, es evidente que la fe es la plena convicción de aquellas realidades que no podemos ver, porque las que vemos ya no son objeto de fe, sino de conocimiento. Por consiguiente, si Tomás vio y palpó, ¿cómo es que le dice el Señor: No has creído, sino después de haberme visto? Pero es que lo que creyó supera a lo que vio. En efecto, un hombre mortal no puede ver la divinidad. Por esto lo que él vio fue la humanidad de Jesús, pero confesó su divinidad al decir: ¡Señor mío y Dios mío! Él, pues, creyó con todo y que vio, ya que, teniendo ante sus ojos a un hombre verdadero, lo proclamó Dios, cosa que escapaba a su mirada.
      Y es para nosotros motivo de alegría lo que sigue a continuación: Dichosos los que sin ver han creído. En esta sentencia el Señor nos designa especialmente a nosotros, que lo guardamos en nuestra mente sin haberlo visto corporalmente. Nos designa a nosotros, con tal de que las obras acompañen nuestra fe, porque el que cree de verdad es el que obra según su fe. Por el contrario, respecto de aquellos que creen sólo de palabra, dice Pablo: Van haciendo profesión de conocer a Dios, y lo van negando con sus obras. Y Santiago dice: La fe, si no va acompañada de las obras, está muerta.
    titulo: SEÑOR MÍO Y DIOS MÍO
  resp2:
    ref: 1Jn 1, 2. 1. 3
    vr:
    - - R
      - La vida se ha manifestado, y nosotros hemos visto y testificamos y os anunciamos * esta vida eterna, la que estaba con el Padre y se nos ha manifestado.
    - - V
      - 'Lo que hemos visto con nuestros ojos, lo que tocaron nuestras manos acerca de la Palabra de vida: lo que hemos visto y oído os lo anunciamos.'
    - - R
      - Esta vida eterna, la que estaba con el Padre y se nos ha manifestado.
  te_deum: true
  oracion: Concédenos, Señor, celebrar con alegría la fiesta de santo Tomás; que la intercesión de este apóstol, que reconoció y confesó a Cristo como a su Señor y su Dios, nos haga crecer en la fe, para que así, creyendo en Jesús, el Mesías, tengamos vida en su nombre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE ITATÍ:
  grado: Memoria
  fecha: 07-09
  comun: Del común de la Santísima Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De la Constitución dogmática Lumen géntium, sobre la Iglesia, del Concilio Vaticano Segundo
      (Núms. 61-62)
    texto: |-
      La Bienaventurada Virgen, predestinada desde toda la eternidad cual madre de Dios junto con la encarnación del Verbo por designio de la divina providencia, fue en la tierra la esclarecida madre del divino Redentor y en forma singular la generosa colaboradora entre todas las creaturas y la humilde esclava del Señor. Concibiendo a Cristo, engendrándolo, alimentándolo, presentándolo en el templo al Padre, padeciendo con su Hijo mientras él moría en la cruz, cooperó en forma del todo singular, por la obediencia, la fe, la esperanza y la encendida caridad, en la restauración de la vida sobrenatural de las almas. Por tal motivo es nuestra madre en el orden de la gracia.
      Y esta maternidad de María perdura sin cesar en la economía de la gracia, desde el momento en que prestó fiel asentimiento en la anunciación, y lo mantuvo sin vacilación al pie de la cruz, hasta la consumación perfecta de todos los elegidos. Pues una vez recibida en los cielos, no dejó su oficio salvador, sino que continúa alcanzándonos por su múltiple intercesión los dones de la eterna salvación.
      Por su amor materno cuida de los hermanos de su Hijo que peregrinan y se debaten entre peligros y angustias y luchan contra el pecado hasta que sean llevados a la patria feliz.
      Por eso la Bienaventurada Virgen en la Iglesia es invocada con los títulos de abogada, auxiliadora, favorecedora, mediadora. Lo cual, sin embargo, se entiende de manera que nada quite ni agregue a la dignidad y eficacia de Cristo, único mediador.
      Porque ninguna creatura puede compararse jamás con el Verbo encarnado, nuestro Redentor; pero así como el sacerdocio de Cristo es participado de varias maneras, tanto por los ministros como por el pueblo fiel, y así como la única bondad de Dios se difunde realmente en formas distintas en las creaturas, así también la única mediación del Redentor no excluye sino que suscita en sus creaturas una múltiple cooperación que participa de la fuente única.
      La Iglesia no duda en atribuir a María un tal oficio subordinado, lo experimenta continuamente y lo recomienda al corazón de los fieles para que, apoyados en esta protección maternal, se unan más íntimamente al Mediador y Salvador.
    titulo: LA MATERNIDAD DE MARÍA EN LA ECONOMÍA DE LA GRACIA
  resp2:
    ref: ''
