# Santoral de Oficio de lectura (calendario de sync): por celebración. Solo lo que cambia respecto del salterio y del tiempo.
SANTA MARÍA, MADRE DE DIOS:
  grado: Solemnidad
  fecha: 01-01
  himno: De la raíz de Jesé
  salmodia:
  - ant: 'Levantaos, puertas antiguas: va a entrar el Rey de la gloria.'
    salmo: salmo-23
  - ant: El Hombre ha nacido en ella; el Altísimo en persona la ha fundado.
    salmo: salmo-86
  - ant: Engendrado antes de la aurora de los siglos, el Señor, nuestro Salvador, hoy ha querido nacer como hombre.
    salmo: salmo-98
  versiculo:
  - - V
    - La Palabra se hizo carne. Aleluia.
  - - R
    - y puso su morada entre nosotros. Aleluia.
  lectura1:
    ref: De la carta a los Hebreos 2, 9-17
    texto: |-
      Hermanos: A Jesús, a quien Dios puso momentáneamente bajo los ángeles, lo vemos ahora coronado de gloria y de honor por haber padecido la muerte. Así, por amorosa dignación de Dios, gustó la muerte en beneficio de todos.
      Pues como quisiese Dios, por quien y para quien son todas las cosas, llevar un gran número de hijos a la gloria, convenía ciertamente que perfeccionase por medio del sufrimiento al que iba a guiarlos a la salvación, ya que tanto el que santifica como los que son santificados tienen un mismo origen. Por esta razón no se avergüenza de llamarlos hermanos, cuando dice: «Anunciaré tu nombre a mis hermanos; cantaré en la asamblea tus loores.» Y también: «Pondré en él mi confianza.» Y en otro lugar: «Aquí estoy con mis hijos, los hijos que Dios me ha dado.»
      Así pues, como los hijos participan de la carne y de la sangre, también él entró a participar de las mismas, para reducir a la impotencia, por su muerte, al que retenía el imperio de la muerte, es decir, al demonio, y librar a los que por temor a la muerte vivían toda su vida sometidos a esclavitud. Él no vino, ciertamente, en auxilio de los ángeles, sino en auxilio de la descendencia de Abraham. Por eso debía ser semejante en todo a sus hermanos, para poderse apiadar de ellos y ser fiel pontífice ante Dios, a fin de expiar los pecados del pueblo.
    titulo: CRISTO ES SEMEJANTE EN TODO A SUS HERMANOS
  resp1:
    ref: Lc 1, 28
    vr:
    - - R
      - Dichosa eres, Virgen María, que llevaste en tu seno al Creador del universo. * Engendraste al que te creó y permaneces virgen para siempre.
    - - V
      - Alégrate, María, llena de gracia, el Señor está contigo.
    - - R
      - Engendraste al que te creó y permaneces virgen para siempre.
  lectura2:
    autor: |-
      De las Cartas de san Atanasio, obispo
      (Carta a Epicteto, 5-9: PG 26, 1058. 1062-1066)
    texto: |-
      El Verbo de Dios tomó la descendencia de Abraham, como dice el Apóstol; por eso debía ser semejante en todo a sus hermanos, asumiendo un cuerpo semejante al nuestro. Por eso María está verdaderamente presente en este misterio, porque de ella el Verbo asumió como propio aquel cuerpo que ofreció por nosotros. La Escritura recuerda este nacimiento, diciendo: Lo envolvió en pañales; alaba los pechos que amamantaron al Señor y habla también del sacrificio ofrecido por el nacimiento de este primogénito. Gabriel había ya predicho esta concepción con palabras muy precisas; no dijo en efecto: «Lo que nacerá en ti», como si se tratara de algo extrínseco, sino de ti, para indicar que el fruto de esta concepción procedía de María.
      El Verbo, al recibir nuestra condición humana y al ofrecerla en sacrificio, la asumió en su totalidad, y luego nos revistió a nosotros de lo que era propio de su persona, como lo indica el Apóstol: Esto corruptible tiene que vestirse de incorrupción, y esto mortal tiene que vestirse de inmortalidad.
      Estas cosas no se realizaron de manera ficticia, como algunos pensaron —lo que es inadmisible—, sino que hay que decir que el Salvador se hizo verdaderamente hombre y así consiguió la salvación del hombre íntegro; pues esta nuestra salvación en modo alguno fue algo ficticio ni se limitó a solo el cuerpo, sino que en el Verbo de Dios se realizó la salvación del hombre íntegro, es decir, del cuerpo y del alma.
      Por lo tanto, el cuerpo que el Señor asumió de María era un verdadero cuerpo humano, conforme lo atestiguan las Escrituras; verdadero, digo, porque fue un cuerpo igual al nuestro. Pues María es nuestra hermana, ya que como todos nosotros es hija de Adán.
      Lo que dice Juan: La Palabra se hizo carne, tiene un sentido parecido a lo que se encuentra en una expresión similar de Pablo, que dice: Cristo se hizo maldición por nosotros. Pues de la unión íntima y estrecha del Verbo con el cuerpo humano se siguió un inmenso bien para el cuerpo de los hombres, porque de mortal que era llegó a ser inmortal, de animal se convirtió en espiritual y, a pesar de que había sido plasmado de tierra, llegó a traspasar las puertas del cielo.
      Pero hay que afirmar que la Trinidad, aun después de que el Verbo tomó cuerpo de María, continuó siendo siempre la Trinidad, sin admitir aumento ni disminución; ella continúa siendo siempre perfecta y debe confesarse como un solo Dios en Trinidad, como lo confiesa la Iglesia al proclamar al Dios único, Padre del Verbo.
    titulo: EL VERBO TOMÓ DE MARÍA UN CUERPO SEMEJANTE AL NUESTRO
  resp2:
    ref: ''
    vr:
    - - R
      - No hay alabanza digna de ti, virginidad inmaculada y santa. * Porque en tu seno has llevado al que ni el cielo puede contener.
    - - V
      - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
    - - R
      - Porque en tu seno has llevado al que ni el cielo puede contener.
  te_deum: true
  oracion: Señor Dios, que por la maternidad virginal de María has dado a los hombres los tesoros de la salvación, haz que sintamos la intercesión de la Virgen Madre, de quien hemos recibido al autor de la vida, Jesucristo, Hijo tuyo y Señor nuestro. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS BASILIO MAGNO Y GREGORIO NACIANZO, obispos y doctores de la Iglesia:
  grado: Memoria
  fecha: 01-02
  comun: Del común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  salmodia:
  - ant: Cantad al Señor y meditad sus maravillas.
    salmo: salmo-104-i
  - ant: No abandonó al justo vendido, sino que lo libró de sus calumniadores.
    salmo: salmo-104-ii
  - ant: Se acordó el Señor de su palabra y sacó a su pueblo con alegría.
    salmo: salmo-104-iii
  versiculo:
  - - V
    - Cantad al Señor, bendecid su nombre.
  - - R
    - Proclamad día tras día su victoria.
  lectura1:
    ref: Del libro del Cantar de los cantares 4, 1—5, 1
    texto: |-
      ¡Qué hermosa eres, mi amada, qué hermosa eres! Tus ojos de paloma, por entre el velo; tus cabellos son un rebaño de cabras, descolgándose por las laderas de Galaad. Son tus dientes un rebaño esquilado, recién salido de bañarse, cada oveja tiene mellizos, ninguna hay sin corderos. Tus labios son cinta escarlata, y tu hablar, melodioso; tus sienes, entre el velo, son dos mitades de granada. Es tu cuello la torre de David, construida con sillares, de la que penden miles de escudos, miles de adargas de capitanes. Son tus pechos dos crías mellizas de gacela, paciendo entre azucenas.
      Mientras sopla la brisa y se alargan las sombras, me voy al monte de la mirra, iré por la colina del incienso.
      ¡Toda hermosa eres, amada mía, y no hay en ti defecto! Ven desde el Líbano, novia mía, ven, baja del Líbano, desciende de la cumbre del Amaná, de la cumbre del Senil y del Hermón, de las cuevas de leones, de los montes de las panteras. Me has enamorado, hermana y novia mía, me has enamorado, con una sola de tus miradas, con una vuelta de tu collar.
      ¡Qué bellos tus amores, hermana y novia mía, tus amores son mejores que el vino! Un panal que destila son tus labios, y tienes, novia mía, miel y leche debajo de tu lengua; y la fragancia de tus vestidos es fragancia del Líbano.
      Eres jardín cerrado, hermana y novia mía, eres jardín cerrado, fuente sellada. Tus brotes son jardines de granados con frutos exquisitos, nardo y enebro y azafrán, canela y cinamomo, con árboles de incienso, mirra y aloé, con los mejores bálsamos y aromas. La fuente del jardín es pozo de agua viva que baja desde el Líbano.
      Despierta, cierzo; llégate, austro, orea mi jardín: que exhale sus perfumes. Entra, amor mío, en tu jardín a comer de sus frutos exquisitos.
      Ya vengo a mi jardín, hermana y novia mía, a recoger el bálsamo y la mirra, a comer de mi miel y mi panal, a beber de mi leche y de mi vino. Compañeros, comed y bebed y embriagaos, mis amigos.
    titulo: CRISTO DESEA EL AMOR DE LA IGLESIA, SU ESPOSA
  resp1:
    ref: Sal 44, 11-12a; cf. Is 62, 4. 5
    vr:
    - - R
      - 'Escucha, hija, mira: inclina el oído, olvida tu pueblo y la casa paterna: * prendado está el rey de tu belleza.'
    - - V
      - El Señor te prefiere a ti, y tu Dios se alegrará contigo.
    - - R
      - Prendado está el rey de tu belleza.
  lectura2:
    autor: |-
      De las Disertaciones de san Gregorio de Nacianzo, obispo
      (Disertación 43, en alabanza de Basilio Magno, 15. 16-17. 19.21: PG 36, 514-523)
    texto: |-
      Nos habíamos encontrado en Atenas, como el curso de un río que, naciendo en una misma patria, se divide luego hacia diversas regiones (a donde habíamos ido por el afán de aprender) y de nuevo, de común acuerdo, por disposición divina, vuelve a reunirse.
      Por entonces, no sólo admiraba yo a mi grande y querido Basilio, por la seriedad de sus costumbres y por la madurez y prudencia de sus palabras, sino que inducía también yo mismo a los demás que no lo conocían a que le tuviesen esta misma admiración. Los que conocían su fama y lo habían oído ya lo admiraban.
      ¿Qué consecuencias tuvo esto? Que él era casi el único que destacaba entre todos los que habían venido a Atenas para estudiar, y que alcanzó honores superiores a los que correspondían a su condición de mero discípulo. Éste fue el principio de nuestra amistad, el pequeño fuego que empezó a unirnos; de este modo, se estableció un mutuo afecto entre nosotros.
      Con el correr del tiempo, nos hicimos mutuas confidencias acerca de nuestro común deseo de estudiar la filosofía; ya por entonces se había acentuado nuestra mutua estimación, vivíamos juntos como camaradas, estábamos en todo de acuerdo, teníamos idénticas aspiraciones y nos comunicábamos cada día nuestra común afición por el estudio, con lo que ésta se hacía cada vez más ferviente y decidida.
      Teníamos ambos una idéntica aspiración a la cultura, cosa que es la que más se presta a envidias; sin embargo, no existía entre nosotros tal envidia, aunque sí el incentivo de la emulación. Nuestra competición consistía no en obtener cada uno para sí el primer puesto, sino en obtenerlo para el otro, pues cada uno consideraba la gloria de éste como propia.
      Era como si los dos cuerpos tuvieran un alma en común. Pues si bien no hay que dar crédito a los que afirman que todas las cosas están en todas partes, en nuestro caso sí podía afirmarse que estábamos el uno en el otro.
      Idéntica era nuestra actividad y nuestra afición: aspirar a la virtud, vivir con la esperanza de las cosas futuras y tratar de comportarnos de tal manera que, aun antes de que llegase el momento de salir de esta vida, pudiese decirse que ya habíamos salido de ella. Con estos pensamientos dirigíamos nuestra vida y todas nuestras acciones, esforzándonos en seguir el camino de los mandamientos divinos y estimulándonos el uno al otro a la práctica de la virtud; y, si no pareciese una arrogancia el decirlo, diría que éramos el uno para el otro la norma y regla para discernir el bien del mal.
      Y, así como hay algunos que tienen un sobrenombre, ya sea heredado de sus padres, ya sea adquirido por méritos personales, para nosotros el mayor título de gloria era el ser cristianos y ser con tal nombre reconocidos.
    titulo: COMO SI LOS DOS CUERPOS TUVIERAN UN ALMA EN COMÚN
  resp2:
    ref: Dn 2, 21-22; 1Co 12, 11
    vr:
    - - R
      - 'El Señor da sabiduría a los sabios y ciencia a los que saben discernir: * él revela honduras y secretos, y la luz mora junto a él.'
    - - V
      - Y todos estos dones son obra de un mismo y único Espíritu, que distribuye a cada uno según le place.
    - - R
      - Él revela honduras y secretos, y la luz mora junto a él.
  oracion: Señor Dios, que has iluminado a la Iglesia con los ejemplos y las enseñanzas de san Basilio Magno y san Gregorio de Nacianzo, haz que busquemos humildemente tu verdad y que, viviendo según esta verdad, crezcamos en el amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA EPIFANÍA DEL SEÑOR:
  grado: Solemnidad
  fecha: 01-06
EL BAUTISMO DEL SEÑOR:
  grado: Fiesta
  fecha: variable
  himno: Hoy dos extremos se han visto
  salmodia:
  - ant: La voz del Señor sobre las aguas, el Dios de la gloria hace oír su trueno.
    salmo: salmo-28
  - ant: Que se postre ante ti, Señor, la tierra entera, y se alegre porque has venido como luz de todos los siglos.
    salmo: salmo-65-i
  - ant: Bendito sea Dios, que nos ha devuelto la vida y nos ha dado respiro.
    salmo: salmo-65-ii
  versiculo:
  - - V
    - Éste es mi Hijo amado.
  - - R
    - Escuchadlo.
  lectura1:
    ref: Del libro del profeta Isaías 42, 1-9; 49, 1-9
    texto: |-
      Mirad a mi siervo, a quien sostengo; a mi elegido, en quien tengo mis complacencias. En él he puesto mi espíritu, para que haga brillar la justicia en las naciones.
      No gritará, no clamará, no voceará por las calles. No romperá la caña resquebrajada, no apagará la mecha aún humeante. Promoverá con firmeza la justicia, no titubeará ni se doblegará hasta implantar el derecho en la tierra, y sus leyes que esperan las islas.
      Así dice el Señor Dios, que creó y desplegó los cielos, que consolidó la tierra y todo lo que en ella brota, que dio el respiro al pueblo que la habita y el aliento a los que se mueven en ella:
      «Yo, el Señor, fiel a mi designio de salvación, te he llamado en la justicia, te he tomado de la mano, te he formado y te he puesto como alianza del pueblo y luz de las naciones, para que abras los ojos de los ciegos, saques a los cautivos de la prisión, y de la mazmorra a los que habitan las tinieblas. Yo soy el Señor, éste es mi nombre, no cedo mi gloria a ningún otro ni mi honor a los ídolos. Lo antiguo ya ha sucedido y algo nuevo yo anuncio, antes de que brote os lo hago oír.»
      Escuchadme, islas; atended, pueblos lejanos: el Señor me llamó desde el vientre de mi madre, cuando aún estaba yo en el seno materno pronunció mi nombre. Hizo de mi boca una espada afilada, me escondió en la sombra de su mano; me hizo flecha bruñida, me guardó en su aljaba y me dijo: «Tú eres mi siervo, en ti manifestaré mi gloria.» Mientras yo pensaba: «En vano me he cansado, en viento y en nada he gastado mis fuerzas», en realidad el Señor se ocupaba de mi causa, Dios tenía en sus manos mi recompensa; yo era glorificado ante sus ojos, mi Dios era mi fortaleza.
      Y ahora habla el Señor, que desde el seno materno me hizo su siervo para que le trajese a Jacob, para que le reuniese a Israel en torno suyo:
      «Es poco que seas mi siervo para restablecer a las tribus de Jacob y hacer volver a los supervivientes de Israel; te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.»
      Así dice el Señor, el redentor y Santo de Israel, al despreciado y aborrecido de las naciones, al esclavo de los tiranos:
      «Te verán los reyes y se pondrán de pie, te verán los príncipes y se postrarán; porque el Señor es fiel, porque el Santo de Israel te ha elegido.»
      Así dice el Señor:
      «En el tiempo de gracia te he respondido, en el día de salvación te he auxiliado; te he defendido y te he constituido como alianza del pueblo, para restaurar el país, para repartir las heredades desoladas, para decir a los cautivos: "Salid", y a los que están en tinieblas: "Venid a la luz"; aun por los caminos pastarán, tendrán praderas en todas las dunas.»
    titulo: EL SIERVO HUMILDE DEL SEÑOR ES LA LUZ DE LAS NACIONES
  resp1:
    ref: Cf. Mt 3, 16. 17; Lc 3, 22
    vr:
    - - R
      - 'Hoy se abrieron los cielos cuando fue bautizado el Señor en el Jordán, y el Espíritu de Dios bajó sobre él en forma de paloma, y se oyó la voz del Padre que decía: * «Éste es mi Hijo amado, en quien tengo mis complacencias.»'
    - - V
      - 'El Espíritu Santo descendió sobre él en forma visible, como una paloma, y se dejó oír una voz del cielo:'
    - - R
      - Éste es mi Hijo amado, en quien tengo mis complacencias.
  lectura2:
    autor: |-
      De las Disertaciones de san Gregorio de Nacianzo, obispo
      (Disertación 39, En las santas Luminarias, 14-16. 20: PG 36, 350-351. 354. 358-359)
    texto: |-
      Cristo es hoy iluminado, dejemos que esta luz divina nos penetre también a nosotros; Cristo es bautizado, bajemos con él al agua, para luego subir también con él.
      Juan está bautizando, y Jesús acude a él; posiblemente para santificar al mismo que lo bautiza; con toda seguridad para sepultar en el agua a todo el viejo Adán; antes de nosotros y por nosotros, el que era espíritu y carne santifica el Jordán, para así iniciarnos por el Espíritu y el agua en los sagrados misterios.
      El Bautista se resiste, Jesús insiste. Soy yo quien debo ser bautizado por ti, le dice la lámpara al Sol, la voz a la Palabra, el amigo al Esposo, el más grande entre los nacidos de mujer al Primogénito de toda creatura, el que había saltado de gozo ya en el seno materno al que había sido adorado también en el seno de su madre, el que lo había precedido y lo precederá al que se había manifestado y se manifestará. Soy yo quien debo ser bautizado por ti; podía haber añadido: «Y por causa de ti.» Él, en efecto, sabía con certeza que recibiría más tarde el bautismo del martirio y que, como a Pedro, le serían lavados no sólo los pies, sino todo su cuerpo.
      Pero, además, Jesús sube del agua; lo cual nos recuerda que hizo subir al mundo con él hacia lo alto, porque en aquel momento ve también cómo el cielo se rasga y se abre, aquel cielo que Adán había cerrado para sí y para su posteridad, como había hecho que se le cerrase la entrada al paraíso con una espada de fuego.
      El Espíritu atestigua la divinidad de Cristo, acudiendo a él como a su igual; y una voz bajó del cielo, ya que del cielo procedía aquel de quien testificaba esta voz; y el Espíritu se apareció en forma corporal de una paloma, para honrar así el cuerpo de Cristo, que es también divino por su excepcional unión con Dios. Muchos siglos atrás fue asimismo una paloma la que anunció el fin del diluvio.
      Honremos hoy, pues, el bautismo de Cristo y celebremos como es debido esta festividad.
      Procurad una limpieza de espíritu siempre en aumento. Nada agrada tanto a Dios como la conversión y salvación del hombre, ya que para él tienen lugar todas estas palabras y misterios; sed como lumbreras en medio del mundo, como una fuerza vital para los demás hombres; si así lo hacéis, llegaréis a ser luces perfectas en la presencia de aquella gran luz, impregnados de sus resplandores celestiales, iluminados de un modo más claro y puro por la Trinidad, de la cual habéis recibido ahora, con menos plenitud, un único rayo proveniente de la única Divinidad, en Cristo Jesús, nuestro Señor, a quien sea la gloria y el poder por los siglos de los siglos. Amén.
    titulo: EL BAUTISMO DE CRISTO
  resp2:
    ref: ''
    vr:
    - - R
      - 'Hoy se han abierto los cielos y el mar se dulcificó, la tierra canta de alegría y los montes y colinas se llenan de júbilo: * porque Cristo fue bautizado por Juan en el Jordán.'
    - - V
      - ¿Qué te pasa, mar, por qué huyes? Y tú, Jordán, ¿por qué te echas atrás?
    - - R
      - Porque Cristo fue bautizado por Juan en el Jordán.
  te_deum: true
  oracion: Dios todopoderoso y eterno, que proclamaste solemnemente a Cristo como tu Hijo amado, cuando era bautizado en el Jordán y descendía el Espíritu Santo sobre él, concede a tus hijos de adopción, renacidos del agua y del Espíritu Santo, que se conserven siempre dignos de tu complacencia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANTONIO, ABAD:
  grado: Memoria
  fecha: 01-17
  comun: 'Del Común de santos varones: para los santos religiosos.'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De la vida de san Antonio, escrita por san Atanasio, obispo
      (Cap. 2-4: PG 26, 842-846)
    texto: |-
      Cuando murieron sus padres, Antonio tenía unos dieciocho o veinte años, y quedó él solo con su única hermana, pequeña aún, teniendo que encargarse de la casa y del cuidado de su hermana.
      Habían transcurrido apenas seis meses de la muerte de sus padres, cuando un día en que se dirigía, según costumbre, a la iglesia, iba pensando en su interior cómo los apóstoles lo habían dejado todo para seguir al Salvador, y cómo, según narran los Hechos de los apóstoles, muchos vendían sus posesiones y ponían el precio de la venta a los pies de los apóstoles para que lo repartieran entre los pobres; pensaba también en la magnitud de la esperanza que para éstos estaba reservada en el cielo; imbuido de esos pensamientos, entró en la iglesia, y dio la casualidad de que en aquel momento estaban leyendo aquellas palabras del Señor en el Evangelio: Si quieres ser perfecto, ve a vender lo que tienes, dalo a los pobres, y tendrás un tesoro en el cielo; luego ven y sígueme.
      Entonces Antonio, como si Dios le hubiese infundido el recuerdo de lo que habían hecho los santos y como si aquellas palabras hubiesen sido leídas especialmente para él, salió en seguida de la iglesia e hizo donación a los aldeanos de las posesiones heredadas de sus padres (tenía trescientas parcelas fértiles y muy hermosas), con el fin de evitar toda inquietud para sí y para su hermana. Vendió también todos sus bienes muebles, y repartió entre los pobres la considerable cantidad resultante de esta venta, reservando sólo una pequeña parte para su hermana.
      Habiendo vuelto a entrar en la iglesia, oyó aquellas palabras del Señor en el Evangelio: No os inquietéis por el día siguiente. Saliendo otra vez, dio a los necesitados incluso lo poco que se había reservado, ya que no soportaba que quedase en su poder ni la más mínima cantidad. Encomendó su hermana a una vírgenes que él sabía eran de confianza y cuidó de que recibiese una conveniente educación; en cuanto a él, a partir de entonces, libre ya de cuidados ajenos, emprendió en frente de su misma casa una vida de ascetismo y de intensa mortificación.
      Trabajaba con sus propias manos, ya que conocía aquella afirmación de la Escritura: Si alguno no quiere trabajar, que tampoco coma; lo que ganaba con su trabajo lo destinaba parte a su propio sustento, parte a los pobres.
      Oraba con mucha frecuencia, ya que había aprendido que es necesario retirarse para orar sin cesar; en efecto, ponía tanta atención en la lectura, que retenía todo lo que había leído, hasta tal punto que llegó un momento en que su memoria suplía los libros.
      Todos los habitantes del lugar, y todos los hombres honrados, cuya compañía frecuentaba, al ver su conducta, lo llamaban amigo de Dios; y todos lo amaban como a un hijo o como a un hermano.
    titulo: LA VOCACIÓN DE SAN ANTONIO
  resp2:
    ref: Mt 19, 21; Lc 14, 33
    vr:
    - - R
      - Si quieres ser perfecto, ve a vender lo que tienes, dalo a los pobres, y tendrás un tesoro en el cielo; * luego ven y sígueme.
    - - V
      - El que no renuncia a todos sus bienes no puede ser mi discípulo.
    - - R
      - Luego ven y sígueme.
  oracion: Señor, tú que inspiraste a san Antonio abad el deseo de retirarse al desierto para servirte allí con una vida admirable, haz que, por su intercesión, tengamos la fuerza de renunciar a todo lo que nos separe de ti y sepamos amarte por encima de todo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA INÉS, virgen y mártir:
  grado: Memoria
  fecha: 01-21
  comun: Del común de vírgenes.
  himno: Esta mujer no quiso
  lectura2:
    autor: |-
      Del tratado de san Ambrosio, obispo, sobre las vírgenes
      (Libro 1, cap. 2. 5. 7-9: PL 16 [edición 1845], 189-191)
    texto: |-
      Celebramos hoy el nacimiento para el cielo de una virgen, imitemos su integridad; se trata también de una mártir, ofrezcamos el sacrificio. Es el día natalicio de santa Inés. Sabemos por tradición que murió mártir a los doce años de edad. Destaca en su martirio, por una parte, la crueldad que no se detuvo ni ante una edad tan tierna; por otra, la fortaleza que infunde la fe, capaz de dar testimonio en la persona de una jovencita.
      ¿Es que en aquel cuerpo tan pequeño cabía herida alguna? Y, con todo, aunque en ella no encontraba la espada donde descargar su golpe, fue ella capaz de vencer a la espada. Y eso que a esta edad las niñas no pueden soportar ni la severidad del rostro de sus padres, y si distraídamente se pican con una aguja, se ponen a llorar como si se tratara de una herida.
      Pero ella, impávida entre las sangrientas manos del verdugo, inalterable al ser arrastrada por pesadas y chirriantes cadenas, ofrece todo su cuerpo a la espada del enfurecido soldado, ignorante aún de lo que es la muerte, pero dispuesta a sufrirla; al ser arrastrada por la fuerza al altar idolátrico, entre las llamas tendía hacia Cristo sus manos, y así, en medio de la sacrílega hoguera, significaba con esta posición el estandarte triunfal de la victoria del Señor; intentaban aherrojar su cuello y sus manos con grilletes de hierro, pero sus miembros resultaban demasiado pequeños para quedar encerrados en ellos.
      ¿Una nueva clase de martirio? No tenía aún edad de ser condenada, pero estaba ya madura para la victoria; la lucha se presentaba difícil, la corona fácil; lo que parecía imposible por su poca edad lo hizo posible su virtud consumada. Una recién casada no iría al tálamo nupcial con la alegría con que iba esta doncella al lugar del suplicio, con prisa y contenta de su suerte, adornada su cabeza no con rizos, sino con el mismo Cristo, coronada no de flores, sino de virtudes.
      Todos lloraban, menos ella. Todos se admiraban de que con tanta generosidad entregara una vida de la que aún no había comenzado a gozar, como si ya la hubiese vivido plenamente. Todos se asombraban de que fuera ya testigo de Cristo una niña que, por su edad, no podía aún dar testimonio de sí misma. Resultó así que fue capaz de dar fe de las cosas de Dios una niña que era incapaz legalmente de dar fe de las cosas humanas, porque el Autor de la naturaleza puede hacer que sean superadas las leyes naturales.
      El verdugo hizo lo posible para aterrorizarla, para atraerla con halagos, muchos desearon casarse con ella. Pero ella dijo:
      «Sería una injuria para mi Esposo esperar a ver si me gusta otro; él me ha elegido primero, él me tendrá. ¿A qué esperas, verdugo, para asestar el golpe? Perezca el cuerpo que puede ser amado con unos ojos a los que yo no quiero».
      Se detuvo, oró, doblegó la cerviz. Hubieras visto cómo temblaba el verdugo, como si fuese él el condenado; como temblaba su diestra al ir a dar el golpe, cómo palidecían los rostros al ver lo que le iba a suceder a la niña, mientras ella se mantenía serena. En una sola víctima tuvo lugar un doble martirio: el de la castidad y el de la fe. Permaneció virgen y obtuvo la gloria del martirio.
    titulo: NO TENÍA AÚN EDAD DE SER CONDENADA, PERO ESTABA YA MADURA PARA LA VICTORIA
  resp2:
    ref: ''
    vr:
    - - R
      - 'Celebremos la festividad de santa Inés, recordemos su glorioso martirio: * en su juventud afrontó la muerte y encontró la vida.'
    - - V
      - Pues amó unicamente al Autor de la vida.
    - - R
      - En su juventud afrontó la muerte y encontró la vida.
  oracion: Dios todopoderoso y eterno, que te has complacido en elegir lo débil a los ojos del mundo para confundir a los que se creían fuertes, concede a quienes estamos celebrando el martirio de santa Inés imitar la heroica firmeza de su fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO DE SALES, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 01-24
  comun: Del Común de pastores para un santo obispo y del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De la introducción a la vida devota, de san Francisco de Sales, obispo
      (Parte 1, cap. 3)
    texto: |-
      En la misma creación, Dios creador mandó a las plantas que diera cada una fruto según su propia especie: así también mandó a los cristianos, que son como las plantas de su Iglesia viva, que cada uno diera un fruto de devoción conforme a su calidad, estado y vocación.
      La devoción, insisto, se ha de ejercitar de diversas maneras, según que se trate de una persona noble o de un obrero, de un criado o de un príncipe, de una viuda o de una joven soltera, o bien de una mujer casada. Más aún: la devoción se ha de practicar de un modo acomodado a las fuerzas, negocios y ocupaciones particulares de cada uno.
      Dime, te ruego, mi Filotea, si sería lógico que los obispos quisieran vivir entregados a la soledad, al modo de los cartujos; que los casados no se preocuparan de aumentar su peculio más que los religiosos capuchinos; que un obrero se pasara el día en la iglesia, como un religioso; o que un religioso, por el contrario, estuviera continuamente absorbido, a la manera de un obispo, por todas las circunstancias que atañen a las necesidades del prójimo. Una tal devoción ¿por ventura no sería algo ridículo, desordenado o inadmisible?
      Y, con todo, esta equivocación absurda es de lo más frecuente. No ha de ser así; la devoción, en efecto, mientras sea auténtica y sincera, nada destruye, sino que todo lo perfecciona y completa, y, si alguna vez resulta de verdad contraria a la vocación o estado de alguien, sin duda es porque se trata de una falsa devoción.
      La abeja saca miel de las flores sin dañarlas ni destruirlas, dejándolas tan íntegras, incontaminadas y frescas como las ha encontrado. Lo mismo, y mejor aún, hace la verdadera devoción: ella no destruye ninguna clase de vocación o de ocupaciones, sino que las adorna y embellece.
      Del mismo modo que algunas piedras preciosas bañadas en miel se vuelven más fúlgidas y brillantes, sin perder su propio color, así también el que a su propia vocación junta la devoción se hace más agradable a Dios y más perfecto. Esta devoción hace que sea mucho más apacible el cuidado de la familia, que el amor mutuo entre marido y mujer sea más sincero, que la sumisión debida a los gobernantes sea más leal, y que todas las ocupaciones, de cualquier clase que sean, resulten más llevaderas y hechas con más perfección.
      Es, por tanto, un error, por no decir una herejía, el pretender excluir la devoción de los regimientos militares, del taller de los obreros, del palacio de los príncipes, de los hogares y familias; hay que admitir, amadísima Filotea, que la devoción puramente contemplativa, monástica y religiosa no puede ser ejercida en estos oficios y estados; pero, además de este triple género de devoción, existen también otros muchos y muy acomodados a las diversas situaciones de la vida seglar.
      Así pues, en cualquier situación en que nos hallemos, debemos y podemos aspirar a la vida de perfección.
    titulo: LA DEVOCIÓN SE HA DE EJERCITAR DE DIVERSAS MANERAS
  resp2:
    ref: Ef 4, 32-5, 1; Mt 11, 29
    vr:
    - - R
      - Sed bondadosos y compasivos unos con otros, y perdonaos mutuamente como también Dios os ha perdonado en Cristo; * sed imitadores de Dios, como hijos amados que sois.
    - - V
      - Tomad sobre vosotros mi yugo y aprended de mí que soy manso y humilde de corazón.
    - - R
      - Sed imitadores de Dios, como hijos amados que sois.
  oracion: Señor Dios nuestro, que quisiste que el obispo san Francisco de Sales se hiciera todo para todos, para ganarlos a todos, haz que, iluminados por su ejemplo, también nosotros sepamos manifestar la dulzura de tu amor en el servicio de nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
MARÍA, REINA DE LA PAZ:
  grado: Memoria
  fecha: 01-24
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De las Disertaciones de san Sofronio, obispo
      (Disertación 2, Sobre la anunciación de la Santísima Virgen, 21-22. 26: PG 87, 3, 3242. 3250)
    texto: |-
      Alégrate, llena de gracia, el Señor es contigo. ¿Y qué puede haber más sublime que esta alegría, oh Virgen Madre? ¿O qué puede haber más excelente que esta gracia, que tú sola has alcanzado de Dios? ¿ O qué puede imaginarse más amable o espléndido que esta gracia? Nada puede equipararse a las maravillas que en ti vemos realizadas, nada hay que iguale la gracia que tú posees; todo lo demás, por excelente que sea, ocupa un lugar secundario y goza de una excelencia claramente inferior.
      El Señor es contigo; ¿quién, pues, se atreverá a competir contigo? De ti nacerá Dios; ¿quién, por tanto, no se reconocerá al momento inferior a ti y no admitirá de buen grado tu primacía y superioridad? Es por esto que, al contemplar tus eminentes prerrogativas, que superan las de cualquier otra creatura, te aclamo lleno de entusiasmo: Alégrate, llena de gracia, el Señor es contigo. Por ti ha venido la alegría, no sólo a los hombres, sino también a los mismos coros celestiales.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva y has hecho que Adán, que yacía postrado bajo el peso de la maldición, alcanzara, por ti, la bendición.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, por ti, la bendición del Padre ha brillado sobre los hombres, librándolos de la antigua maldición.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, por ti, alcanzan la salvación tus progenitores; pues has de dar a luz a aquel que les obtendrá la salvación divina.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, sin concurso de semilla, has producido aquel fruto que esparce la bendición sobre el orbe de la tierra, redimiéndola de la maldición que le hacía producir espinas y abrojos.
      Verdaderamente, bendita tú eres entre todas las mujeres, ya que, siendo por condición natural una mujer como las demás, llegarás a ser en verdad Madre de Dios. Efectivamente, si el que ha de nacer de ti es, con toda verdad, el Dios hecho hombre, con toda razón eres llamada Madre de Dios, ya que realmente das a luz a Dios.
      Llevas en la intimidad de tu seno al mismo Dios, el cual mora en ti según la carne, y sale de ti como un esposo, trayendo a todos la alegría y comunicando a todos la luz divina.
      Pues en ti, oh Virgen, como en un cielo nítido y purísimo, ha puesto Dios su tienda; y saldrá de ti como el esposo de su alcoba; y, cual gigante que emprende su carrera, recorrerá el camino de su vida, provechosa en todo para todos, alcanzando con su giro del término del cielo hasta el opuesto confín, llenándolo todo de su calor divino y de su resplandor vivificante.
    titulo: POR MARÍA, LA BENDICIÓN DEL PADRE HA BRILLADO SOBRE LOS HOMBRES
  resp2:
    ref: S. Sofronio, Disertación 2
    vr:
    - - R
      - Verdaderamente, bendita tú eres entre todas las mujeres, ya que has cambiado en bendición la maldición de Eva. * Por ti la bendición del Padre ha brillado sobre los hombres.
    - - V
      - Por ti alcanzan la salvación tus progenitores.
    - - R
      - Por ti la bendición del Padre ha brillado sobre los hombres.
  oracion: Abre, Señor, a tus servidores la riqueza de tu gracia y, ya que la maternidad de la Virgen María fue para nosotros el comienzo de la salvación, concédenos que esta celebración acreciente nuestra paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA CONVERSIÓN DE SAN PABLO:
  grado: Fiesta
  fecha: 01-25
  himno: ¿Quién es este viajero
  salmodia:
  - ant: «Señor, ¿quién eres?» «Yo soy Jesús a quien tú persigues; dura cosa será para ti dar coces contra el aguijón.»
    salmo: salmo-18-a
  - ant: Ananías, vete en seguida y pregunta por Saulo, el cual está orando; éste es un instrumento que me he escogido yo para que lleve mi nombre a los gentiles, a los reyes y a los hijos de Israel.
    salmo: salmo-63
  - ant: Saulo comenzó a predicar en las sinagogas a los judíos, afirmando que Jesús era el Cristo.
    salmo: salmo-96
  versiculo:
  - - V
    - El Señor es clemente y misericordioso.
  - - R
    - Lento a la cólera y rico en piedad.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Gálatas 1, 11.24
    texto: |-
      Os hago saber, hermanos, que el Evangelio anunciado por mí no es cosa humana; y no lo recibí de hombre alguno, sino por revelación de Jesucristo.
      Habéis oído hablar de cómo me portaba yo en otro tiempo en el judaísmo: cómo perseguía encarnizadamente a la Iglesia de Dios y la devastaba; cómo, en el celo por el judaísmo, iba más allá que muchos compatriotas de mi edad y me mostraba celoso partidario de las tradiciones paternas.
      Pero, cuando aquel que me eligió desde el seno de mi madre me llamó por su gracia y tuvo a bien revelarme a su Hijo para que lo anunciara a los gentiles, en seguida, sin pedir consejo a hombre alguno y sin subir a Jerusalén para hablar con los que eran apóstoles antes que yo, partí hacia Arabia, de donde luego volví a Damasco. Tres años más tarde, subí a Jerusalén a visitar a Cefas, y estuve con él quince días. No vi a ninguno otro de los apóstoles, fuera de Santiago, el hermano del Señor. Por el Dios que me está viendo, que no miento en lo que os escribo.
      Después vine a las regiones de Siria y de Cilicia, pero las Iglesias de Judea, que están en Cristo, no me conocían personalmente. Sólo oían decir: «El que antaño nos perseguía ahora va anunciando la Buena Nueva de la fe, que en otro tiempo quería destruir.» Y glorificaban a Dios, reconociendo su obra en mí.
    titulo: DIOS ME REVELÓ A SU HIJO PARA QUE LO ANUNCIARA
  resp1:
    ref: Ga 1, 11-12; 2Co 11, 10. cf. 7
    vr:
    - - R
      - El Evangelio anunciado por mí no es cosa humana; * y no lo recibí de hombre alguno, sino por revelación de Jesucristo.
    - - V
      - 'Por la verdad de Cristo que en mí reside: yo os he anunciado el Evangelio de Dios.'
    - - R
      - Y no lo recibí de hombre alguno, sino por revelación de Jesucristo.
  lectura2:
    autor: |-
      De las Homilías de san Juan Crisóstomo, obispo
      (Homilía 2 sobre las alabanzas de san Pablo: PG 50. 477-480)
    texto: |-
      Qué es el hombre, cuán grande su nobleza y cuánta su capacidad de virtud lo podemos colegir sobre todo de la persona de Pablo. Cada día se levantaba con una mayor elevación y fervor de espíritu y, frente a los peligros que lo acechaban, era cada vez mayor su empuje, como lo atestiguan sus propias palabras: Olvidando lo que queda atrás y lanzándome hacia lo que veo por delante; y, al presentir la inminencia de su muerte, invitaba a los demás a compartir su gozo, diciendo: Alegraos y congratulaos conmigo; y, al pensar en sus peligros y oprobios, se alegra también y dice, escribiendo a los corintios: Vivo contento en medio de mis debilidades de los insultos y de las persecuciones; incluso llama a estas cosas armas de justicia, significando con ello que le sirven de gran provecho.
      Y así, en medio de las asechanzas de sus enemigos, habla en tono triunfal de las victorias alcanzadas sobre los ataques de sus perseguidores y, habiendo sufrido en todas partes azotes, injurias y maldiciones, como quien vuelve victorioso de la batalla, colmado de trofeos, da gracias a Dios, diciendo: Gracias sean dadas a Dios, que en todo tiempo nos lleva en el cortejo triunfal de Cristo. Imbuido de estos sentimientos, se lanzaba a las contradicciones e injurias, que le acarreaba su predicación, con un ardor superior al que nosotros empleamos en la consecución de los honores, deseando la muerte más que nosotros deseamos la vida, la pobreza más que nosotros la riqueza, y el trabajo mucho más que otros apetecen el descanso que lo sigue. La única cosa que él temía era ofender a Dios; lo demás le tenía sin cuidado. Por esto mismo, lo único que deseaba era agradar siempre a Dios.
      Y, lo que era para él lo más importante de todo, gozaba del amor de Cristo; con esto se consideraba el más dichoso de todos, sin esto le era indiferente asociarse a los poderosos y a los príncipes; prefería ser, con este amor, el último de todos, incluso del número de los condenados, que formar parte sin él, de los más encumbrados y honorables.
      Para él, el tormento más grande y extraordinario era el verse privado de este amor: para él, su privación significaba el infierno, el único sufrimiento, el suplicio infinito e intolerable.
      Gozar del amor de Cristo representaba para él la vida, el mundo, la compañía de los ángeles, los bienes presentes y futuros, el reino, las promesas, el conjunto de todo bien; sin este amor, nada catalogaba como triste o alegre. Las cosas de este mundo no las consideraba, en sí mismas, ni duras ni suaves.
      Las realidades presentes las despreciaba como hierba ya podrida. A los mismos gobernantes y al pueblo enfurecido contra él les daba el mismo valor que a un insignificante mosquito.
      Consideraba como un juego de niños la muerte y la más variada clase de tormentos y suplicios, con tal de poder sufrir algo por Cristo.
    titulo: PABLO LO SUFRIÓ TODO POR AMOR A CRISTO
  resp2:
    ref: 1Tm 1, 13-14; 1Co 15, 9
    vr:
    - - R
      - Fui acogido por Dios con toda misericordia, porque obré por ignorancia en el tiempo de mi incredulidad. * Y en verdad que sobreabundó en mí la gracia de nuestro Señor, juntamente con la fe y la caridad de Cristo Jesús.
    - - V
      - Soy indigno del nombre de apóstol, pues perseguí a la Iglesia de Dios.
    - - R
      - Y en verdad que sobreabundó en mí la gracia de nuestro Señor, juntamente con la fe y la caridad de Cristo Jesús.
  te_deum: true
  oracion: Señor Dios, que has iluminado al mundo entero con la palabra del apóstol san Pablo, haz que quienes recordamos hoy su conversión, imitando sus ejemplos, anunciemos el Evangelio al mundo y seamos así testigos de tu verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS TIMOTEO Y TITO, obispos:
  grado: Memoria
  fecha: 01-26
  comun: Del común de pastores para un santo obispo.
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De las Homilías de san Juan Crisóstomo, obispo
      (Homilía 2 sobre las alabanzas de san Pablo: PG 50, 480-484)
    texto: |-
      Pablo, encerrado en la cárcel, habitaba ya en el cielo, y recibía los azotes y heridas con un agrado superior al de los que conquistan el premio en los juegos; amaba los sufrimientos no menos que el premio, ya que estos mismos sufrimientos, para él, equivalían al premio; por esto, los consideraba como una gracia. Sopesemos bien lo que esto significa. El premio consistía ciertamente en partir para estar con Cristo; en cambio, quedarse en esta vida significaba el combate; sin embargo, el mismo anhelo de estar con Cristo lo movía a diferir el premio, llevado del deseo del combate, ya que lo juzgaba más necesario.
      Comparando las dos cosas, el estar separado de Cristo representaba para él el combate y el sufrimiento, más aún, el máximo combate y el máximo sufrimiento. Por el contrario, estar con Cristo representaba el premio sin comparación; con todo, Pablo, por amor a Cristo, prefiere el combate al premio.
      Alguien quizá dirá que todas estas dificultades él las tenía por suaves, por su amor a Cristo. También yo lo admito, ya que todas aquellas cosas, que para nosotros son causa de tristeza, en él engendraban el máximo deleite. Y ¿para qué recordar las dificultades y tribulaciones? Su gran aflicción le hacía exclamar: ¿Quién sufre angustias sin que yo las comparta? ¿Quién es impugnado por el enemigo sin que esté yo en ascuas?
      Os ruego que no sólo admiréis, sino que también imitéis este magnífico ejemplo de virtud: así podremos ser partícipes de su corona.
      Y si alguien se admira de esto que hemos dicho, a saber, que el que posea unos méritos similares a los de Pablo obtendrá una corona semejante a la suya, que atienda a las palabras del mismo Apóstol: He combatido bien mi combate, he corrido hasta la meta, he mantenido la fe. Ahora me aguarda la corona merecida, que el Señor, justo juez, me otorgará aquel día; y no sólo a mí, sino también a todos los que hayan esperado con amor su venida. ¿Te das cuenta de cómo nos invita a todos a tener parte en su misma gloria?
      Así pues, ya que a todos nos aguarda una misma corona de gloria, procuremos hacernos dignos de los bienes que tenemos prometidos.
      Y no sólo debemos considerar en el Apóstol la magnitud y excelencia de sus virtudes y su pronta y robusta disposición de ánimo, por las que mereció llegar a un premio tan grande, sino que hemos de pensar también que su naturaleza era en todo igual a la nuestra; de este modo, las cosas más arduas nos parecerán fáciles y llevaderas y, esforzándonos en este breve tiempo de nuestra vida, alcanzaremos aquella corona incorruptible e inmortal, por la gracia y la misericordia de nuestro Señor Jesucristo, a quien pertenece la gloria y el imperio ahora y siempre y por los siglos de los siglos. Amén.
    titulo: HE COMBATIDO BIEN MI COMBATE
  resp2:
    ref: 1Tm 6, 11-12; Tt 2, 1
    vr:
    - - R
      - Como hombre de Dios que eres, corre al alcance de la justicia, de la piedad, de la fe, de la caridad, de la paciencia en el sufrimiento, de la dulzura. * Combate el buen combate de la fe, conquista la vida eterna.
    - - V
      - Enseña lo que es conforme a la sana doctrina.
    - - R
      - Combate el buen combate de la fe, conquista la vida eterna.
  oracion: Señor Dios nuestro, que concediste a los santos Timoteo y Tito vivir de manera semejante a los apóstoles, haz que, ayudados por su intercesión, vivamos en este mundo justa y piadosamente y alcancemos después tu reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO TOMÁS DE AQUINO, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 01-28
  comun: Del común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De las Conferencias de santo Tomás de Aquino, presbítero
      (Conferencia 6 sobre el Credo)
    texto: |-
      ¿Era necesario que el Hijo de Dios padeciera por nosotros? Lo era, ciertamente, y por dos razones fáciles de deducir: la una, para remediar nuestros pecados; la otra, para darnos ejemplo de cómo hemos de obrar.
      Para remediar nuestros pecados, en efecto, porque en la pasión de Cristo encontramos el remedio contra todos los males que nos sobrevienen a causa del pecado.
      La segunda razón tiene también su importancia, ya que la pasión de Cristo basta para servir de guía y modelo a toda nuestra vida. Pues todo aquel que quiera llevar una vida perfecta no necesita hacer otra cosa que despreciar lo que Cristo despreció en la cruz y apetecer lo que Cristo apeteció. En la cruz hallamos el ejemplo de todas las virtudes.
      Si buscas un ejemplo de amor: Nadie tiene más amor que el que da la vida por sus amigos. Esto es lo que hizo Cristo en la cruz. Y por esto, si él entregó su vida por nosotros, no debemos considerar gravoso cualquier mal que tengamos que sufrir por él.
      Si buscas un ejemplo de paciencia, encontrarás el mejor de ellos en la cruz. Dos cosas son las que nos dan la medida de la paciencia: sufrir pacientemente grandes males, o sufrir, sin rehuirlos, unos males que podrían evitarse. Ahora bien, Cristo, en la cruz, sufrió grandes males y los soportó pacientemente, ya que en su pasión no profería amenazas; como cordero llevado al matadero, enmudecía y no abría la boca. Grande fue la paciencia de Cristo en la cruz: corramos también nosotros con firmeza y constancia la carrera para nosotros preparada. Llevemos los ojos fijos en Jesús, caudillo y consumador de la fe, quien, para ganar el gozo que se le ofrecía, sufrió con toda constancia la cruz, pasando por encima de su ignominia.
      Si buscas un ejemplo de humildad, mira al crucificado: él, que era Dios, quiso ser juzgado bajo el poder de Poncio Pilato y morir.
      Si buscas un ejemplo de obediencia, imita a aquel que se hizo obediente al Padre hasta la muerte: Como por la desobediencia de un solo hombre —es decir, de Adán— todos los demás quedaron constituidos pecadores, así también por la obediencia de uno solo todos quedarán constituidos justos.
      Si buscas un ejemplo de desprecio de las cosas terrenales, imita a aquel que es Rey de reyes y Señor de señores, en el cual están escondidos todos los tesoros de la sabiduría y de la ciencia, desnudo en la cruz, burlado, escupido, flagelado, coronado de espinas, a quien, finalmente, dieron a beber hiel y vinagre.
      No te aficiones a los vestidos y riquezas, ya que se reparten mi ropa; ni a los honores, ya que él experimentó las burlas y azotes; ni a las dignidades, ya que, entretejiendo una corona de espinas, la pusieron sobre mi cabeza; ni a los placeres, ya que para mi sed me dieron vinagre.
    titulo: EN LA CRUZ HALLAMOS EL EJEMPLO DE TODAS LAS VIRTUDES
  resp2:
    ref: Sb 7, 7-8; 9, 17
    vr:
    - - R
      - Supliqué y se me concedió la prudencia, invoqué y vino a mí un espíritu de sabiduría. * La preferí a los cetros y a los tronos, y en su comparación tuve en nada la riqueza.
    - - V
      - Señor, ¿quién hubiera conocido tu voluntad, si tú no le hubieses dado la sabiduría y no le hubieses enviado de lo alto tu Espíritu Santo?
    - - R
      - La preferí a los cetros y a los tronos, y en su comparación tuve en nada la riqueza.
  oracion: Señor Dios nuestro, que hiciste admirable a santo Tomás de Aquino por su sed de santidad y por su amor a las ciencias sagradas, te pedimos que nos des su luz para entender sus enseñanzas y fuerza para imitar su vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN BOSCO, presbítero:
  grado: Memoria
  fecha: 01-31
  comun: 'Del Común de santos varones: para los santos educadores.'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De las cartas de san Juan Bosco, presbítero
      (Epistolario, Turín 1959, 4, 201-203)
    texto: |-
      Si de verdad buscamos la auténtica felicidad de nuestros alumnos y queremos inducirlos al cumplimiento de sus obligaciones, conviene ante todo que nunca olvidéis que hacéis las veces de padres de nuestros amados jóvenes, por quienes trabajé siempre con amor, por quienes estudié y ejercí el ministerio sacerdotal, y no sólo yo, sino toda la Congregación salesiana.
      ¡Cuántas veces, hijos míos, durante mi vida, ya bastante prolongada, he tenido ocasión de convencerme de esta gran verdad! Es más fácil enojarse que aguantar, amenazar al niño que persuadirlo; añadiré incluso que, para nuestra impaciencia y soberbia, resulta más cómodo castigar a los rebeldes que corregirlos, soportándolos con firmeza y suavidad a la vez.
      Os recomiendo que imitéis la caridad que usaba Pablo con los neófitos, caridad que con frecuencia los llevaba a derramar lágrimas y a suplicar, cuando los encontraba poco dóciles y rebeldes a su amor.
      Guardaos de que nadie pueda pensar que os dejáis llevar por los arranques de vuestro espíritu. Es difícil, al castigar, conservar la debida moderación, la cual es necesaria para que en nadie pueda surgir la duda de que obramos sólo para hacer prevalecer nuestra autoridad o para desahogar nuestro mal humor.
      Miremos como a hijos a aquellos sobre los cuales debemos ejercer alguna autoridad. Pongámonos a su servicio, a imitación de Jesús, el cual vino para obedecer y no para mandar, y avergoncémonos de todo lo que pueda tener incluso apariencia de dominio; si algún dominio ejercemos sobre ellos, ha de ser para servirlos mejor.
      Éste era el modo de obrar de Jesús con los apóstoles, ya que era paciente con ellos, a pesar de que eran ignorantes y rudos, e incluso poco fieles; también con los pecadores se comportaba con benignidad y con una amigable familiaridad, de tal modo que era motivo de admiración para unos, de escándalo para otros, pero también ocasión de que muchos concibieran la esperanza de alcanzar el perdón de Dios. Por esto nos mandó que fuésemos mansos y humildes de corazón.
      Son hijos nuestros, y por esto, cuando corrijamos sus errores, hemos de deponer toda ira o, por lo menos, dominarla de tal manera como si la hubiéramos extinguido totalmente.
      Mantengamos sereno nuestro espíritu, evitemos el desprecio en la mirada, las palabras hirientes; tengamos comprensión en el presente y esperanza en el futuro, como conviene a unos padres de verdad, que se preocupan sinceramente de la corrección y enmienda de sus hijos.
      En los casos más graves, es mejor rogar a Dios con humildad que arrojar un torrente de palabras, ya que éstas ofenden a los que las escuchan, sin que sirvan de provecho alguno a los culpables.
    titulo: TRABAJÉ SIEMPRE CON AMOR
  resp2:
    ref: Mc 10, 13-14; Mt 18, 5
    vr:
    - - R
      - 'Le presentaban a Jesús unos niños para que les impusiera las manos; pero los discípulos trataban de apartarlos. Jesús, al verlo, les dijo: * «Dejad que los niños vengan a mí y no se lo estorbéis, porque el reino de Dios es de los que son como ellos.»'
    - - V
      - El que reciba a un niño como éstos en mi nombre a mí me recibe.
    - - R
      - Dejad que los niños vengan a mí y no se lo estorbéis, porque el reino de Dios es de los que son como ellos.
  oracion: Señor Dios nuestro, que has dado a la Iglesia, en el presbítero san Juan Bosco, un padre y un maestro de la juventud, concédenos que, movidos por un amor semejante al suyo, nos entreguemos a tu servicio, trabajando por la salvación de nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA PRESENTACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 02-02
  himno: Criaturas, alegraos
  salmodia:
  - ant: Éste está predestinado para ruina o resurgimiento de muchos en Israel.
    salmo: salmo-2
  - ant: ¡Levántate y resplandece, Jerusalén, pues llega tu luz y la gloria del Señor alborea sobre ti!
    salmo: salmo-18-a
  - ant: Goza y alégrate, nueva Sión, mira a tu Rey que viene a ti, humilde y salvador de su pueblo.
    salmo: salmo-44
  versiculo:
  - - V
    - Oh Dios, meditamos tu misericordia.
  - - R
    - En medio de tu templo.
  lectura1:
    ref: Del libro del Éxodo 13, 1-3a.11-16
    texto: |-
      En aquellos días, dijo el Señor a Moisés:
      «Conságrame todo primogénito israelita; el primer parto, lo mismo de hombres que de ganados, me pertenece.»
      Dijo, pues, Moisés al pueblo:
      «Cuando el Señor te introduzca en la tierra de los cananeos, como juró a ti y a tus padres, y te la haya entregado, dedicarás al Señor todos los primogénitos. El primer parto de tus animales, si es macho, pertenece también al Señor. La primera cría de asno la rescatarás con un cordero; si no la rescatas la desnucarás. Pero los primogénitos de entre tus hijos los rescatarás siempre.
      Y cuando mañana tu hijo te pregunte: "¿Qué significa esto?", le responderás: "Con mano fuerte el Señor nos sacó de Egipto, de la esclavitud. El Faraón se había obstinado en no dejarnos salir; entonces el Señor dio muerte a todos los primogénitos de Egipto, lo mismo de hombres que de animales. Por eso yo sacrifico al Señor todo primogénito macho de los animales. Pero los primogénitos de los hombres los rescato."
      Este rito será para ti como señal sobre tu brazo y como recordatorio ante tus ojos, de que con mano fuerte te sacó de Egipto el Señor.»
    titulo: CONSAGRACIÓN DEL PRIMOGÉNITO
  resp1:
    ref: ''
    vr:
    - - R
      - 'Adorna tu tálamo, oh Sión, y recibe a Cristo, tu rey: * a quien la Virgen concibió y dio a luz, permaneciendo virgen después del parto; ella adoró a quien había engendrado.'
    - - V
      - Simeón tomó al Niño en sus brazos y, dando gracias, bendijo al Señor.
    - - R
      - A quien la Virgen concibió y dio a luz, permaneciendo virgen después del parto; ella adoró a quien había engendrado.
  lectura2:
    autor: |-
      De las Disertaciones de san Sofronio, obispo
      (Disertación 3, Sobre el Hipapanté, 6. 7: PG 87, 3, 3291-3293)
    texto: |-
      Corramos todos al encuentro del Señor los que con fe celebramos y veneramos su misterio, vayamos todos con alma bien dispuesta. Nadie deje de participar en este encuentro, nadie deje de llevar su luz.
      Llevamos en nuestras manos cirios encendidos, ya para significar el resplandor divino de aquel que viene a nosotros —el cual hace que todo resplandezca y, expulsando las negras tinieblas, lo ilumina todo con la abundancia de la luz eterna—, ya, sobre todo, para manifestar el resplandor con que nuestras almas han de salir al encuentro de Cristo.
      En efecto, del mismo modo que la Virgen Madre de Dios tomó en sus brazos la luz verdadera y la comunicó a los que yacían en tinieblas, así también nosotros, iluminados por él y llevando en nuestras manos una luz visible para todos, apresurémonos a salir al encuentro de aquel que es la luz verdadera.
      Sí, ciertamente, porque la luz ha venido al mundo, para librarlo de las tinieblas en que estaba envuelto y llenarlo de resplandor, y nos ha visitado el sol que nace de lo alto, llenando de su luz a los que vivían en tinieblas: esto es lo que nosotros queremos significar. Por esto avanzamos en procesión con cirios en las manos, por esto acudimos llevando luces, queriendo representar la luz que ha brillado para nosotros, así como el futuro resplandor que, procedente de ella, ha de inundarnos. Por tanto, corramos todos a una, salgamos al encuentro de Dios.
      Ha llegado ya aquella luz verdadera que viniendo a este mundo ilumina a todo hombre. Dejemos, hermanos, que esta luz nos penetre y nos transforme.
      Ninguno de nosotros ponga obstáculos a esta luz y se resigne a permanecer en la noche; al contrario, avancemos todos llenos de resplandor; todos juntos, iluminados, salgamos a su encuentro y, con el anciano Simeón, acojamos aquella luz clara y eterna; imitemos la alegría de Simeón y, como él, cantemos un himno de acción de gracias al Engendrador y Padre de la luz, que ha arrojado de nosotros las tinieblas y nos ha hecho partícipes de la luz verdadera.
      También nosotros, representados por Simeón, hemos visto la salvación de Dios, que él ha presentado ante todos los pueblos y que ha manifestado para gloria de nosotros, los que formamos el nuevo Israel; y, así como Simeón, al ver a Cristo, quedó libre de las ataduras de la vida presente, así también nosotros hemos sido liberados del antiguo y tenebroso pecado.
      También nosotros, acogiendo en los brazos de nuestra fe a Cristo, que viene desde Belén hasta nosotros, nos hemos convertido de gentiles en pueblo de Dios (Cristo es, en efecto, la salvación de Dios Padre) y hemos visto, con nuestros ojos, al Dios hecho hombre; y de este modo, habiendo visto la presencia de Dios y habiéndola aceptado, por decirlo así, en los brazos de nuestra mente, somos llamados el nuevo Israel. Esto es lo que vamos celebrando año tras año, porque no queremos olvidarlo.
    titulo: ACOJAMOS LA LUZ CLARA Y ETERNA
  resp2:
    ref: Ez 43, 4-5; cf. Lc 2, 27
    vr:
    - - R
      - La gloria del Señor entró en el templo por la puerta oriental, * y llenó el templo la gloria del Señor.
    - - V
      - Llevaron sus padres al niño Jesús al templo.
    - - R
      - Y llenó el templo la gloria del Señor.
  te_deum: true
  oracion: Dios todopoderoso y eterno, en este día en que tu Hijo único fue presentado en el templo con un cuerpo como el nuestro, te pedimos nos concedas a nosotros poder ser presentados ante ti, plenamente renovados en nuestro espíritu. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ÁGUEDA, virgen y mártir:
  grado: Memoria
  fecha: variable
  comun: Del Común de un mártir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la Disertación de san Metodio de Sicilia, obispo, sobre santa Águeda
      (Analecta Bollandiana 68, 76-78)
    texto: |-
      Nos ha reunido en este lugar, como ya sabéis vosotros, los que me escucháis, la celebración del aniversario de una santa mártir; su combate por la fe, tan conocido y venerado, es algo que históricamente pertenece al pasado, pero que, en cierto modo, se nos hace actual a través de los divinos milagros que un día tras otro van formando su corona y su ornato.
      Es virgen porque nació del Verbo inmortal de Dios, Hijo invisible del Padre (este Hijo que también por mí experimentó la muerte en su carne), según aquellas palabras del evangelista Juan: A cuantos lo recibieron dio poder de llegar a ser hijos de Dios.
      Esta mujer virgen, la que hoy os ha invitado a nuestro convite sagrado, es la mujer desposada con un solo esposo, Cristo, para decirlo con el mismo simbolismo nupcial que emplea el apóstol Pablo.
      Una virgen que, con la lámpara siempre encendida, enrojecía y embellecía sus labios, mejillas y lengua con la púrpura de la sangre del verdadero y divino Cordero, y que no dejaba de recordar y meditar continuamente la muerte de su ardiente enamorado, como si la tuviera presente ante sus ojos.
      De este modo, su mística vestidura es un testimonio que habla por sí mismo a todas las generaciones futuras, ya que lleva en sí la marca indeleble de la sangre de Cristo, de la que está impregnada, como también la blancura resplandeciente de su virginidad.
      Águeda hizo honor a su nombre, que significa «buena»; ella fue en verdad buena por su identificación con el mismo Dios; fue buena para su divino Esposo y lo es también para nosotros, ya que su bondad provenía del mismo Dios, fuente de todo bien.
      En efecto, ¿cuál es la causa suprema de toda bondad, sino aquel que es el sumo bien? Por esto, difícilmente hallaríamos algo que mereciera, como Águeda, nuestros elogios y alabanzas.
      Águeda, buena de nombre y por sus hechos; Águeda, cuyo nombre indica de antemano la bondad de sus obras maravillosas, y cuyas obras corresponden a la bondad de su nombre; Águeda, cuyo solo nombre es un estímulo para que todos acudan a ella, y que nos enseña también con su ejemplo a que todos pongamos el máximo empeño en llegar sin demora al bien verdadero, que es sólo Dios.
    titulo: SU BONDAD PROVENÍA DEL MISMO DIOS, FUENTE DE TODO BIEN
  resp2:
    ref: ''
    vr:
    - - R
      - Con la ayuda del Señor, le seré siempre fiel, cantando sus alabanzas; * él me ha salvado y me ha dado la paz.
    - - V
      - El Señor ha conservado a su sierva libre de toda mancha y me ha unido a él, movido por su misericordia.
    - - R
      - Él me ha salvado y me ha dado la paz.
  oracion: Que nos alcancen tu perdón, Señor, las súplicas de santa Águeda, ella que tanto te agradó por el resplandor de su virginidad y por la fortaleza de su martirio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FELIPE DE JESÚS, protomártir mexicano:
  grado: Fiesta
  fecha: 02-05
  comun: 'Del Común de varios mártires: para un mártir.'
  himno: Altas primicias de la fe de México
  salmodia:
  - ant: Todos os odiarán por mi nombre; pero el que perservere hasta el fin.
    salmo: salmo-2
  - ant: Los trabajos de ahora no pesan lo que la gloria que un día se nos descubrirá.
    salmo: salmo-10
  - ant: El Señor provó a los elegidos como oro en el crisol, y los recibió como sacrificio de holocausto para siempre.
    salmo: salmo-16
  versiculo:
  - - V
    - Me asaltaban angustias y aprietos.
  - - R
    - Tus mandatos son mi delicia.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Romanos 8, 28-39
    texto: |-
      Hermanos: Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.
      ¿Qué decir a todo esto? Si Dios está con nosotros, ¿quién estará contra nosotros? El que no perdonó a su propio Hijo, sino que lo entregó a la muerte por todos nosotros, ¿cómo no nos dará con él todo lo demás? ¿Quién se atreverá a acusar a los elegidos de Dios? Siendo Dios quien justifica, ¿quién podrá condenar? ¿Acaso Cristo Jesús, el que murió por nosotros? Más aún, ¿el que fue resucitado y está a la diestra de Dios intercediendo por nosotros? ¿Quién podrá apartarnos del amor de Cristo? ¿La aflicción? ¿La angustia? ¿La persecución? ¿El hambre? ¿La desnudez? ¿El peligro? ¿La espada? (Como dice la Escritura: «Por tu causa nos llevan a la muerte uno y otro día; nos tratan como a ovejas que van al matadero.») Pero en todo esto vencemos fácilmente por aquel que nos ha amado.
      Pues estoy convencido de que ni muerte, ni vida, ni ángeles, ni principados, ni presente, ni futuro, ni potencias, ni altura, ni profundidad, ni creatura alguna podrá apartarnos del amor de Dios manifestado en Cristo Jesús, Señor nuestro.
    titulo: EL AMOR DE DIOS SE MANIFIESTA EN CRISTO
  resp1:
    ref: Mt 5, 11-12a. 10
    vr:
    - - R
      - Dichosos vosotros, cuando os insulten y persigan, y propalen contra vosotros toda clase de calumnias por mi causa; * alegraos y regocijaos porque vuestra recompensa será grande en los cielos.
    - - V
      - Dichosos los que padecen persecusión por razón del bien y de la virtud, porque de ellos es el reino de los cielos.
    - - R
      - Alegraos y regocijaos porque vuestra recompensa será grande en los cielos.
  lectura2:
    autor: DE LOS OPÚSCULOS DE SAN FRANCISCO DE ASÍS
    texto: 'Y todos los hermanos, dondequiera que estuvieren, acuérdense que hicieron entrega de sí mismos y dejaron sus cuerpos a nuestro Señor Jesucristo, porque dice el Señor: Quien pierda su vida por amor a mí la salvará. Dichosos los que padecen persecución por razón del bien, porque de ellos es el reino de Dios. Si a mí me han perseguido, también a vosotros perseguirán. Cuando os persigan en una ciudad huid a otra. Dichosos seréis cuando los hombres os aborrezcan y os insulten y proscriban.y persigan vuestro nombre como infame y propalen contra vosotros toda clase de calumnias por mi causa. Alegraos entonces y saltad de gozo, porque grande será en los cielos vuestra recompensa. A vosotros, amigos míos, os doy este consejo: No tengáis miedo a los que matan el cuerpo, pero después de esto ya no pueden hacer otra cosa. No os alarméis, pues, siendo constantes, salvaréis vuestras vidas. Y el que persevere hasta el fin se salvará.'
    titulo: 'Los hermanos que van entre sarracenos y otros infieles pueden tratar con ellos Espiritualmente de dos maneras. La primera: que no muevan contiendas ni discusiones, mas sean sujetos a toda humana creatura por Dios y confiesen siempre que son cristianos. La segunda: que, cuando vieren ser voluntad de Dios, anuncien su palabra, para que crean en Dios todopoderoso, Padre, Hijo y Espíritu Santo, creador de todas las cosas, y en el Redentor y Salvador del mundo, Hijo del Padre eterno, y para que se bauticen y hagan cristianos; porque el que no nazca de agua y de Espíritu no puede entrar en el reino de Dios. Estas y otras cosas que fueren de la voluntad del Señor puedan decir a los infieles, porque dice el Señor en el Evangelio: A todo aquel que me reconozca ante los hombres lo reconoceré yo también ante mi Padre que está en los cielos. Y de aquel que se avergüence de mí y de mi doctrina se avergonzará el Hijo del hombre, cuando venga revestido de su gloria, de la del Padre y de la
      gloria de los santos ángeles.'
  resp2:
    ref: ''
    vr:
    - - R
      - Caí en tristeza y angustia * e invoqué el nombre del Señor.
    - - V
      - Torre fortísima es el nombre del Señor, en él esperé y fui socorrido.
    - - R
      - E invoqué el nombre del Señor.
  te_deum: true
  oracion: Dios nuestro, que te dignaste aceptar la sangre de san Felipe de Jesús como una primicia de la fe de nuestro pueblo, concédenos, por su intercesión, madurar en esa misma fe, para que demos testimonio de ella no sólo con las palabras, sino sobre todo con los actos de nuestra vida diaria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS PABLO MIKI Y COMPAÑEROS, mártires:
  grado: Memoria
  fecha: 02-06
  comun: Del Común de varios mártires.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la Historia del martirio de los santos Pablo Miki y compañeros, escrita por un autor contemporáneo.
      (Cap. 14, 109-110: Acta Sanctorum Februarii 1, 769)
    texto: |-
      Una vez crucificados, era admirable ver la constancia de todos, a la que los exhortaban, ora el padre Pasio, ora el padre Rodríguez. El padre comisario estaba como inmóvil, con los ojos fijos en el cielo. El hermano Martín cantaba salmos en acción de gracias a la bondad divina, intercalando el versículo: En tus manos, Señor. También el hermano Francisco Blanco daba gracias a Dios con voz inteligible. El hermano Gonzalo rezaba en voz alta el padrenuestro y el avemaría.
      Pablo Miki, nuestro hermano, viéndose colocado en el púlpito más honorable de los que hasta entonces había ocupado, empezó por manifestar francamente a los presentes que él era japonés, que pertenecía a la Compañía de Jesús, que moría por haber predicado el Evangelio y que daba gracias a Dios por un beneficio tan insigne; a continuación añadió estas palabras:
      «Llegado a este momento crucial de mi existencia, no creo que haya nadie entre vosotros que piense que pretendo disimular la verdad. Os declaro, pues, que el único camino que lleva a la salvación es el que siguen los cristianos. Y, como este camino me enseña a perdonar a los enemigos y a todos los que me han ofendido, perdono de buen grado al rey y a todos los que han contribuido a mi muerte, y les pido que quieran recibir la iniciación cristiana del bautismo.»
      Luego, vueltos los ojos a sus compañeros, comenzó a darles ánimo en aquella lucha decisiva; en el rostro de todos se veía una alegría especial, sobre todo en el de Luis; éste, al gritarle otro cristiano que pronto estaría en el paraíso, atrajo hacia sí las miradas de todos por el gesto lleno de gozo que hizo con los dedos y con todo su cuerpo. Antonio, que estaba al lado de Luis, con los ojos fijos en el cielo, después de haber invocado el santísimo nombre de Jesús y de María, se puso a cantar el salmo: Alabad, siervos del Señor, que había aprendido en la catequesis de Nagasaki, ya que en ella se enseña a los niños algunos salmos. Otros, finalmente, iban repitiendo con rostro sereno:
      «¡Jesús, María!.»
      Algunos también exhortaban a los presentes a una vida digna de cristianos; con estas y otras semejantes acciones demostraban su pronta disposición ante la muerte. Entonces los cuatro verdugos empezaron a sacar lanzas de las fundas que acostumbraban usar los japoneses; ante aquel horrendo espectáculo todos los fieles se pusieron a gritar:
      «¡Jesús, María!.»
      Y, lo que es más, prorrumpieron en unos lamentos capaces de llegar hasta el mismo cielo. Los verdugos asestaron a cada uno de los crucificados una o dos lanzadas con lo que, en un momento, pusieron fin a sus vidas.
    titulo: SERÉIS MIS TESTIGOS
  resp2:
    ref: Cf. Ga 6, 14; Flp 1, 29
    vr:
    - - R
      - Líbrenos Dios de gloriarnos si no es en la cruz de nuestro Señor Jesucristo, en quien está nuestra salvación, vida y resurrección; * por él hemos sido salvados y liberados.
    - - V
      - Dios os ha dado la gracia de creer en Jesucristo y aun de padecer por él.
    - - R
      - Por él hemos sido salvados y liberados.
  oracion: Señor Dios, fortaleza de los mártires, que quisiste que san Pablo Miki y sus compañeros alcanzaran la vida eterna, muriendo en cruz por confesar la fe verdadera, concédenos, por su intercesión, proclamar con valentía nuestra fe hasta derramar por ella, si es preciso, nuestra propia sangre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ESCOLÁSTICA, virgen:
  grado: Memoria
  fecha: 02-10
  comun: Del Común de Vírgenes.
  himno: Esta mujer no quiso
  lectura2:
    autor: |-
      De los libros de los Diálogos de san Gregorio Magno, papa
      (Libro 2, 33: PL 66, 194-196)
    texto: |-
      Escolástica, hermana de san Benito, consagrada a Dios desde su infancia, acostumbraba visitar a su hermano una vez al año. El Hombre de Dios acudía a ella y la recibía dentro de las posesiones del monasterio, no lejos de la puerta.
      Un día vino como de costumbre, y su venerable hermano bajó hacia ella con algunos discípulos; pasaron todo el día en la alabanza de Dios y en santas conversaciones y, cuando ya empezaba a oscurecer, tomaron juntos el alimento. En medio de santas conversaciones fue transcurriendo el tiempo, hasta que se hizo muy tarde, y entonces la santa monja suplicó a su hermano:
      «Te ruego que no me dejes esta noche, sino que hablemos de los gozos de la vida del cielo hasta mañana.»
      Él le respondió:
      «¿Qué es lo que dices, hermana? Yo no puedo en modo alguno quedarme fuera de la celda.»
      La santa monja, al oír la negativa de su hermano, puso sobre la mesa sus manos, con los dedos entrelazados, y escondió en ellas la cabeza, para rogar al Señor todopoderoso. Al levantar de nuevo la cabeza, se originó un temporal tan intenso de rayos, truenos y aguacero, que ni al venerable Benito ni a los hermanos que estaban con él les hubiera sido posible mover un solo pie del lugar en que se hallaban. Entonces el hombre de Dios comenzó a quejarse contrariado:
      «Dios todopoderoso te perdone, hermana: ¿qué es lo que has hecho?»
      Ella respondió:
      «Ya ves, te he suplicado a ti, y no has querido escucharme; he suplicado a mi Dios, y me ha escuchado. Ahora, pues, sal, si puedes, déjame y vuelve al monasterio.»
      Y Benito, que no había querido quedarse por propia voluntad, tuvo que hacerlo por fuerza. De este modo, pasaron toda la noche en vela, recreándose en santas conversaciones sobre la vida espiritual.
      Y no es de extrañar que prevaleciera el deseo de aquella mujer, ya que, como dice san Juan, Dios es amor, y, por esto, pudo más porque amó más.
      Tres días mas tarde, el hombre de Dios, estando en su celda, elevó sus ojos al cielo y vio el alma de su hermana, libre ya de las ataduras del cuerpo, que penetraba, en forma de paloma, en las intimidades del cielo. Lleno de alegría por una gloria tan grande, dio gracias a Dios con himnos y alabanzas, y envió a sus hermanos para que trajesen su cuerpo al monasterio y lo enterraran en el mismo sepulcro que había preparado para sí mismo.
      De este modo, ni la misma sepultura pudo separar los cuerpos de aquellos cuya alma había estado siempre unida en Dios.
    titulo: PUDO MÁS PORQUE AMÓ MÁS
  resp2:
    ref: ''
    vr:
    - - R
      - Cuando aquella santa virgen suplicó a Dios que su hermano no partiese, * consiguió mucho del Señor, porque había amado mucho.
    - - V
