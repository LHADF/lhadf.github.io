SAN PIO X, papa:
  grado: Memoria
  fecha: 08-21
  comun: 'Del común de los pastores: para un santo papa.'
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De la Constitución apostólica Divino afflátu del papa san Pío décimo
      (AAS 3 [1911], 633-635)
    texto: |-
      Es un hecho demostrado que los salmos, compuestos por inspiración divina, cuya colección forma parte de las Sagradas Escrituras, ya desde los orígenes de la Iglesia sirvieron admirablemente para fomentar la piedad de los fieles, que ofrecían continuamente a Dios un sacrificio de alabanza, es decir, el tributo de los labios que van bendiciendo su nombre, y que además, por una costumbre heredada del antiguo Testamento, alcanzaron un lugar importante en la sagrada liturgia y en el Oficio divino. De ahí nació lo que san Basilio llama «la voz de la Iglesia», y la salmodia, calificada por nuestro antecesor Urbano octavo como «hija de la himnodia que se canta asiduamente ante el trono de Dios y del Cordero», y que, según el dicho de san Atanasio, enseña, sobre todo a las personas dedicadas al culto divino, «cómo hay que alabar a Dios y cuáles son las palabras más adecuadas» para ensalzarlo. Con relación a este tema, dice bellamente san Agustín: «Para que el hombre alabara dignamente a Dios, Dios se alabó a sí mismo; y, porque se dignó alabarse, por esto el hombre halló el modo de alabarlo.»
      Los salmos tienen, además, una eficacia especial para suscitar en las almas el deseo de todas las virtudes. En efecto, «si bien es verdad que todas las partes de la Escritura, tanto del antiguo como del nuevo Testamento, están inspiradas por Dios y son útiles para instruir, según está escrito, sin embargo, el libro de los salmos, como el paraíso en el que se hallan (los frutos) de todos los demás (libros sagrados), prorrumpe en cánticos y, al salmodiar, pone de manifiesto sus propios frutos junto con aquellos otros.» Estas palabras son también de san Atanasio, quien añade asimismo: «A mi modo de ver, los salmos vienen a ser como un espejo, en el que quienes salmodian se contemplan a sí mismos y sus diversos sentimientos, y con esta sensación los recitan.» San Agustín dice en el libro de sus Confesiones: «¡Cuánto lloré con tus himnos y cánticos, conmovido intensamente por las voces de tu Iglesia que resonaba dulcemente! A medida que aquellas voces se infiltraban en mis oídos, la verdad se iba haciendo más clara en mi interior y me sentía inflamado en sentimientos de piedad, y corrían las lágrimas, que me hacían mucho bien.»
      En efecto, ¿quién dejará de conmoverse ante aquellas frecuentes expresiones de los salmos en las que se ensalza de un modo tan elevado la inmensa majestad de Dios, su omnipotencia, su inefable justicia, su bondad o clemencia y todos sus demás infinitos atributos, dignos de alabanza? ¿En quién no encontrarán eco aquellos sentimientos de acción de gracias por los beneficios recibidos de Dios, o aquellas humildes y confiadas súplicas por los que se espera recibir, o aquellos lamentos del alma que llora sus pecados? ¿Quién no se sentirá inflamado de amor al descubrir la imagen esbozada de Cristo redentor, de quien san Agustín «oía la voz en todos los salmos, ora salmodiando, ora gimiendo, ora alegre por la esperanza, ora suspirando por la realidad»?
    titulo: LA VOZ DE LA IGLESIA QUE RESUENA DULCEMENTE
  resp2:
    ref: 1Ts 2, 4. 3
    vr:
    - - R
      - Así como hemos sido juzgados aptos por Dios para confiarnos el Evangelio, así lo predicamos. * No buscamos agradar a los hombres, sino a Dios.
    - - V
      - Nuestra exhortación no procede del error, ni de la impureza, ni con engaño.
    - - R
      - No buscamos agradar a los hombres, sino a Dios.
  oracion: Dios todopoderoso y eterno, que, para defender la fe católica e instaurar todas las cosas en Cristo, colmaste al papa san Pío décimo de sabiduría divina y de fortaleza apostólica, concédenos que, dóciles a sus instrucciones y ejemplos, consigamos la recompensa eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SANTÍSIMA VIRGEN MARÍA, REINA:
  grado: Memoria
  fecha: 08-22
  comun: Del Común de la santísima Virgen María.
  himno: Asidos de tu falda, con los ojos
  lectura2:
    autor: |-
      De las Homilías de san Amadeo de Lausana, obispo
      (Homilía 7: SC 72, 188. 190. 192. 200)
    texto: |-
      Observa cuán adecuadamente brilló por toda la tierra, ya antes de la asunción, el admirable nombre de María y se difundió por todas partes su ilustre fama, antes de que fuera ensalzada su majestad sobre los cielos. Convenía, en efecto, que la Madre virgen, por el honor debido a su Hijo, reinase primero en la tierra y, así, penetrara luego gloriosa en el cielo; convenía que fuera engrandecida aquí abajo, para penetrar luego, llena de santidad, en las mansiones celestiales, yendo de virtud en virtud y de gloria en gloria por obra del Espíritu del Señor.
      Así pues, durante su vida mortal gustaba anticipadamente las primicias del reino futuro, ya sea elevándose hasta Dios con inefable sublimidad, como también descendiendo hacia sus prójimos con indescriptible caridad. Los ángeles la servían, los hombres le tributaban su veneración. Gabriel y los ángeles la asistían con sus servicios; también los apóstoles cuidaban de ella, especialmente san Juan, gozoso de que el Señor, en la cruz, le hubiese encomendado su madre virgen, a él, también virgen. Aquéllos se alegraban de contemplar a su reina, éstos a su señora, y unos y otros se esforzaban en complacerla con sentimientos de piedad y devoción.
      Y ella, situada en la altísima cumbre de sus virtudes, inundada como estaba por el mar inagotable de los carismas divinos, derramaba en abundancia sobre el pueblo creyente y sediento el abismo de sus gracias, que superaban a las de cualquiera otra creatura. Daba la salud a los cuerpos y el remedio para las almas, dotada como estaba del poder de resucitar de la muerte corporal y espiritual. Nadie se apartó jamás triste o deprimido de su lado, o ignorante de los misterios celestiales. Todos volvían contentos a sus casas, habiendo alcanzado por la madre del Señor lo que deseaban.
      Plena hasta rebosar de tan grandes bienes, la esposa, madre del esposo único, suave y agradable, llena de delicias, como una fuente de los jardines espirituales, como un pozo de agua viva y vivificante, que mana con fuerza del Líbano divino, desde el monte de Sión hasta las naciones extranjeras, hacía derivar ríos de paz y torrentes de gracia celestial. Por esto, cuando la Virgen de las vírgenes fue llevada al cielo por el que era su Dios y su Hijo, el rey de reyes, en medio de la alegría y exultación de los ángeles y arcángeles y de la aclamación de todos los bienaventurados, entonces se cumplió la profecía del Salmista, que decía al Señor: De pie a tu derecha está la reina enjoyada con oro de Ofir.
    titulo: REINA DEL MUNDO Y DE LA PAZ
  resp2:
    ref: Ap 12, 1; Sal 44, 10
    vr:
    - - R
      - 'Una gran señal apareció en el cielo: una Mujer, vestida del sol, con la luna bajo sus pies, * y una corona de doce estrellas sobre su cabeza.'
    - - V
      - De pie a tu derecha está la reina enjoyada con oro de Ofir.
    - - R
      - Y una corona de doce estrellas sobre su cabeza.
  oracion: Señor, Dios nuestro, que nos has dado como madre y como reina a la Madre de tu Hijo, concédenos que, protegidos por su intercesión, alcancemos la gloria que tienes preparada a tus hijos en el reino de los cielos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ROSA DE LIMA, virgen, Patrona de América Latina:
  grado: Fiesta
  fecha: variable
  comun: Del Común de vírgenes.
  himno: La santidad de Rosa cantad, ángeles
  salmodia:
  - ant: Virgen ilustre, sensata, prudente en tu decisión, tienes como esposo del alma al Verbo inmaculado.
    salmo: salmo-18-a
  - ant: Por amor a mi Señor Jesucristo, tuve en nada los bienes de este mundo y del tiempo presente.
    salmo: salmo-44-i
  - ant: Prendado está el rey de tu belleza, porque él es tu Señor y tu Dios.
    salmo: salmo-44-ii
  versiculo:
  - - V
    - Me enseñarás el sendero de la vida.
  - - R
    - Me saciarás de gozo en tu presencia.
  lectura1:
    ref: De la primera carta del apóstol san Pablo a los Corintios 7, 25-40
    texto: |-
      Hermanos: Respecto al celibato no tengo órdenes del Señor, sino que doy mi parecer como hombre de fiar que soy, por la misericordia del Señor. Estimo que es un bien, por la necesidad actual: quiero decir que es un bien vivir así.
      ¿Estás unido a una mujer? No busques la separación. ¿Estás libre? No busques mujer; aunque si te casas, no haces mal; y si una soltera se casa, tampoco hace mal. Pero estos tales sufrirán la tribulación de la carne. Yo respeto vuestras razones.
      Os digo esto, hermanos: el momento es apremiante. Queda como solución: que los que tienen mujer vivan como si no la tuvieran; los que lloran, como si no lloraran; los que están alegres, como si no lo estuvieran; los que compran, como si no poseyeran; los que negocian en el mundo, como si no disfrutaran de él: porque la presentación de este mundo se termina.
      Quiero que os ahorréis preocupaciones: el célibe se preocupa de los asuntos del Señor, buscando contentar al Señor; en cambio, el casado se preocupa de los asuntos del mundo, buscando contentar a su mujer, y anda dividido. Lo mismo, la mujer sin marido y la soltera se preocupan de los asuntos del Señor, consagrándose a ellos en cuerpo y alma; en cambio, la casada se preocupa de los asuntos del mundo, buscando contentar a su marido. Os digo todo esto para vuestro bien, no para poneros una trampa, sino para induciros a una cosa noble y al trato con el Señor sin preocupaciones.
      Si, a pesar de todo, alguien cree faltar a la conveniencia respecto de su doncella, por estar en la flor de su edad, y conviene proceder así, haga lo que quiera, no hace mal; cásense. Mas el que permanece firme en su corazón, y sin presión alguna y en pleno uso de su libertad está resuelto en su interior a guardar a su doncella, hará bien. Así pues, el que casa a su doncella obra bien. Y el que no la casa obra mejor.
      La mujer está ligada a su marido mientras él viva; mas una vez muerto el marido, queda libre para casarse con quien quiera, pero en el Señor. Sin embargo, será más feliz si permanece así según mi consejo; que yo también creo tener el Espíritu de Dios.
    titulo: LA VIRGINIDAD CRISTIANA
  resp1:
    ref: ''
    vr:
    - - R
      - Prendado está el rey de tu belleza, obra de sus manos; él es tu Dios y tu rey. * Tu rey es al mismo tiempo tu esposo.
    - - V
      - Has tomado por esposo al rey y Dios; él te ha dotado, él te ha engalanado, te ha redimido, te ha santificado.
    - - R
      - Tu rey es al mismo tiempo tu esposo.
  lectura2:
    autor: |-
      De los Escritos de santa Rosa de Lima, virgen
      (Al médico Castillo: edición L. Getino, La patrona de América, Madrid 1928, pp. 54-55)
    texto: |-
      El Salvador levantó la voz y dijo, con incomparable majestad:
      «¡Conozcan todos que la gracia sigue a la tribulación. Sepan que sin el peso de las aflicciones no se llega al colmo de la gracia. Comprendan que, conforme al acrecentamiento de los trabajos, se aumenta juntamente la medida de los carismas. Que nadie se engañe: ésta es la única verdadera escala del paraíso, y fuera de la cruz no hay camino por donde se pueda subir al cielo!»
      Oídas estas palabras, me sobrevino un ímpetu poderoso de ponerme en medio de la plaza para gritar con grandes clamores, diciendo a todas las personas, de cualquier edad, sexo, estado y condición que fuesen:
      «Oíd, pueblo; oíd, todo género de gentes: de parte de Cristo y con palabras tomadas de su misma boca, yo os aviso: Que no se adquiere gracia sin padecer aflicciones; hay necesidad de trabajos y más trabajos, para conseguir la participación íntima de la divina naturaleza, la gloria de los hijos de Dios y la perfecta hermosura del alma.»
      Este mismo estímulo me impulsaba impetuosamente a predicar la hermosura de la divina gracia, me angustiaba y me hacía sudar y anhelar. Me parecía que ya no podía el alma detenerse en la cárcel del cuerpo, sino que se había de romper la prisión y, libre y sola, con más agilidad, se había de ir por el mundo, dando voces:
      «¡Oh, si conociesen los mortales qué gran cosa es la gracia, qué hermosa, qué noble, qué preciosa, cuántas riquezas esconde en sí, cuántos tesoros, cuántos júbilos y delicias! Sin duda emplearían toda su diligencia, afanes y desvelos en buscar penas y aflicciones; andarían todos por el mundo en busca de molestias, enfermedades y tormentos, en vez de aventuras, por conseguir el tesoro inestimable de la gracia. Esta es la mercancía y logro último de la constancia en el sufrimiento. Nadie se quejaría de la cruz ni de los trabajos que le caen en suerte, si conociera las balanzas donde se pesan para repartirlos entre los hombres.»
    titulo: CONOZCAMOS EL AMOR DE CRISTO, QUE EXCEDE TODO CONOCIMIENTO
  resp2:
    ref: 1Co 1, 27. 28-29; Sal 137, 6
    vr:
    - - R
      - Lo necio del mundo lo ha escogido Dios para confundir a los sabios; ha escogido lo que no cuenta, para anular a lo que cuenta; * de modo que nadie pueda gloriarse en presencia del Señor.
    - - V
      - El Señor es sublime, se fija en el humilde, y de lejos conoce al soberbio.
    - - R
      - De modo que nadie pueda gloriarse en presencia del Señor.
  te_deum: true
  oracion: Dios nuestro, que impulsaste a santa Rosa de Lima a apartarse de la vida del mundo por amor tuyo y a consagrarse solo a ti, en la austeridad y en la penitencia, concédenos, por su intercesión, que sepamos seguir, en este mundo, el camino que conduce a la verdadera vida, para que lleguemos a gozar del torrente de tus delicias allá en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BARTOLOMÉ, apóstol:
  grado: Fiesta
  fecha: 08-24
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder.
  - - R
    - Y las maravillas que realizó.
  lectura1:
    ref: De la primera carta del apóstol san Pablo a los Corintios 4,1-16
    texto: |-
      Hermanos: Que la gente sólo vea en nosotros servidores de Cristo y administradores de los misterios de Dios. Ahora, en un administrador lo que se busca es que sea fiel. Por lo que a mí se refiere, me importa muy poco ser juzgado por vosotros o por cualquier tribunal humano. Ni siquiera yo mismo juzgo mi actuación. Cierto que mi conciencia nada me reprocha, mas no por eso me creo justificado. Mi juez será el Señor. No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.
      Estas verdades, hermanos, las he expuesto por vuestro provecho, aplicándolas a mi persona y a Apolo. Así, por esta aplicación, aprenderéis aquello de: «No más de lo que está escrito», a fin de que nadie se enorgullezca de un apóstol y desprecie a otro. Porque, ¿quién es el que te distingue? ¿Qué tienes que no hayas recibido? Y, si lo recibiste, ¿por qué te glorías como si no lo hubieras recibido? ¡Ya estáis satisfechos! ¡Os habéis hecho ya ricos! ¡Habéis ganado un reino sin ayuda nuestra! ¡Ya lo podíais haber ganado! ¡Así tendríamos nosotros parte en vuestro reino!
      Por lo que veo, Dios nos ha asignado a los apóstoles el último lugar, como a condenados a muerte; porque hemos venido a ser el espectáculo del mundo, de los ángeles y de los hombres. Nosotros somos insensatos por Cristo, vosotros sensatos en Cristo; nosotros débiles, vosotros fuertes; vosotros estimados, nosotros despreciados. Todavía ahora pasamos hambre, sed y desnudez. Somos maltratados y arrojados de una parte a otra, y nos fatigamos trabajando con nuestras manos. Cuando nos maldicen, bendecimos; cuando nos persiguen, soportamos; cuando nos injurian, respondemos con dulzura. Hemos venido a ser hasta ahora como basura del mundo, como el desecho de la humanidad.
      No os escribo esto para confundiros, sino para amonestaros como a hijos míos carísimos. Aunque tengáis, en efecto, diez mil maestros que os lleven a Cristo, de hecho sólo tenéis un padre. Yo os engendré para Cristo por la predicación del evangelio.
      Os exhorto, pues, a que seáis mis imitadores, como yo imito a Cristo.
    titulo: SEAMOS IMITADORES DEL APÓSTOL, COMO ÉL IMITA A CRISTO
  resp1:
    ref: Jn 15, 15; Mt 13, 11. 16
    vr:
    - - R
      - Ya no os llamaré siervos; os he llamado amigos, * porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
    - - V
      - A vosotros ha concedido Dios conocer los misterios del reino de los cielos; dichosos vuestros ojos porque ven, y vuestros oídos porque oyen.
    - - R
      - Porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
  lectura2:
    autor: |-
      De las Homilías de san Juan Crisóstomo, obispo, sobre la primera carta a los Corintios
      (Homilía 4, 3. 4: PG 61, 34-36)
    texto: |-
      El mensaje de la cruz, anunciado por unos hombres sin cultura, tuvo una virtud persuasiva que alcanzó a todo el orbe de la tierra; y se trataba de un mensaje que no se refería a cosas sin importancia, sino a Dios y a la verdadera religión, a una vida conforme al Evangelio y al futuro juicio, un mensaje que convirtió en sabios a unos hombres rudos e ignorantes. Ello nos demuestra que lo necio de Dios es mas sabio que los hombres, y lo débil de Dios es más fuerte que los hombres.
      ¿En qué sentido es más fuerte? En cuanto que invadió el orbe entero y sometió a todos los hombres, produciendo un efecto contrario al que pretendían todos aquellos que se esforzaban en extinguir el nombre del Crucificado, ya que hizo, en efecto, que este nombre obtuviera un mayor lustre y difusión. Ellos, por el contrario, desaparecieron y, aun durante el tiempo en que estuvieron vivos, nada pudieron contra un muerto. Por esto, cuando un pagano dice de mí que estoy muerto, es cuando muestra su gran necedad; cuando él me considera un necio, es cuando mi sabiduría se muestra superior a la suya; cuando me considera débil, es cuando él se muestra más débil que yo. Porque ni los filósofos, ni los maestros, ni mente humana alguna hubiera podido siquiera imaginar todo lo que eran capaces de hacer unos simples publicanos y pescadores.
      Pensando en esto, decía Pablo: Lo débil de Dios es más fuerte que los hombres. Esta fuerza de la predicación divina la demuestran los hechos siguientes. ¿De dónde les vino a aquellos doce hombres, ignorantes, que vivían junto a lagos, ríos y desiertos, el acometer una obra de tan grandes proporciones y el enfrentarse con todo el mundo, ellos, que seguramente no habían ido nunca a la ciudad ni se habían presentado en público? Y más, si tenemos en cuenta que eran miedosos y apocados, como sabemos por la descripción que de ellos nos hace el Evangelista, que no quiso disimular sus defectos, lo cual constituye la mayor garantía de su veracidad. ¿Qué nos dice de ellos? Que, cuando Cristo fue apresado, unos huyeron y otro, el primero entre ellos, lo negó, a pesar de todos los milagros que habían presenciado.
      ¿Cómo se explica, pues, que aquellos que, mientras Cristo vivía, sucumbieron al ataque de los judíos, después, una vez muerto y sepultado, se enfrentaran contra el mundo entero, si no es por el hecho de su resurrección, que algunos niegan, y porque les habló y les infundió ánimos? De lo contrario se hubieran dicho: «¿Qué es esto? No pudo salvarse a sí mismo, y ¿nos va a proteger a nosotros? Cuando estaba vivo no se ayudó a sí mismo, y ¿ahora, que está muerto, nos tenderá una mano? Él, mientras vivía, no convenció a nadie, y ¿nosotros, con sólo pronunciar su nombre, persuadiremos a todo el mundo? No sólo hacer, sino pensar algo semejante sería una cosa irracional.»
      Todo lo cual es prueba evidente de que, si no lo hubieran visto resucitado y no hubieran tenido pruebas bien claras de su poder, no se hubieran lanzado a una aventura tan arriesgada.
    titulo: LO DÉBIL DE DIOS ES MAS FUERTE QUE LOS HOMBRES
  resp2:
    ref: 1Co 1, 23-24; 2Co 4, 8; Rm 8, 37
    vr:
    - - R
      - 'Nosotros predicamos a Cristo crucificado: escándalo para los judíos, necedad para los gentiles; pero para los llamados a Cristo: * fuerza de Dios y sabiduría de Dios.'
    - - V
      - Nos aprietan por todos lados; pero en todo esto vencemos fácilmente por aquel que nos ha amado.
    - - R
      - Que es fuerza de Dios y sabiduría de Dios.
  te_deum: true
  oracion: Fortalece, Señor, nuestra fe, para que nos adhiramos a Cristo, tu Hijo, con la misma sinceridad con que lo hizo el apóstol san Bartolomé, y haz que, por la intercesión de este santo, sea siempre tu Iglesia sacramento de salvación universal para todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MÓNICA:
  grado: Memoria
  fecha: 08-27
  comun: Del Común de santas mujeres.
  himno: Dichosa la mujer que ha conservado
  lectura2:
    autor: |-
      De las Confesiones de san Agustín, obispo
      (Libro 9, 10, 23—11, 28: CSEL 33, 215-219)
    texto: |-
      Cuando ya se acercaba el día de su muerte —día por ti conocido, y que nosotros ignorábamos—, sucedió, por tus ocultos designios, como lo creo firmemente, que nos encontramos ella y yo solos, apoyados en una ventana que daba al jardín interior de la casa donde nos hospedábamos, allí en Ostia Tiberina, donde, apartados de la multitud, nos rehacíamos de la fatiga del largo viaje, próximos a embarcarnos. Hablábamos, pues, los dos solos, muy dulcemente y, olvidando lo que queda atrás y lanzándonos hacia lo que veíamos por delante, nos preguntábamos ante la verdad presente, que eres tú, cómo sería la vida eterna de los santos, aquella que ni el ojo vio, ni el oído oyó, ni vino a la mente del hombre. Y abríamos la boca de nuestro corazón, ávidos de las corrientes de tu fuente, la fuente de vida que hay en ti.
      Tales cosas decía yo, aunque no de este modo ni con estas mismas palabras; sin embargo, tú sabes, Señor, que, cuando hablábamos aquel día de estas cosas, y mientras hablábamos íbamos encontrando despreciable este mundo con todos sus placeres, ella dijo:
      «Hijo, por lo que a mí respecta, ya nada me deleita en esta vida. Qué es lo que hago aquí y por qué estoy aún aquí, lo ignoro, pues no espero ya nada de este mundo. Una sola cosa me hacía desear que mi vida se prolongara por un tiempo: el deseo de verte cristiano católico, antes de morir. Dios me lo ha concedido con creces, ya que te veo convertido en uno de sus siervos, habiendo renunciado a la felicidad terrena. ¿Qué hago ya en este mundo?».
      No recuerdo muy bien lo que le respondí, pero al cabo de cinco días o poco más cayó en cama con fiebre. Y, estando así enferma, un día sufrió un colapso y perdió el sentido por un tiempo. Nosotros acudimos corriendo, mas pronto recobró el conocimiento, nos miró, a mí y a mi hermano allí presentes, y nos dijo en tono de interrogación:
      «¿Dónde estaba?»
      Después, viendo que estábamos aturdidos por la tristeza, nos dijo:
      «Enterrad aquí a vuestra madre».
      Yo callaba y contenía mis lágrimas. Mi hermano dijo algo referente a que él hubiera deseado que fuera enterrada en su patria y no en país lejano. Ella lo oyó y, con cara angustiada, lo reprendió con la mirada por pensar así, y, mirándome a mí, dijo:
      «Mira lo que dice».
      Luego, dirigiéndose a ambos, añadió:
      «Sepultad este cuerpo en cualquier lugar: esto no os ha de preocupar en absoluto; lo único que os pido es que os acordéis de mí ante el altar del Señor, en cualquier lugar donde estéis».
      Habiendo manifestado, con las palabras que pudo, este pensamiento suyo, guardó silencio, e iba luchando con la enfermedad que se agravaba.
    titulo: ALCANCEMOS LA SABIDURÍA ETERNA
  resp2:
    ref: 1Co 7, 29. 30. 31; 2, 12
    vr:
    - - R
      - 'El momento es apremiante, Queda como solución: que los que están alegres vivan como si no lo estuvieran; los que negocian en el mundo, como si no disfrutaran de él: * Porque la presentación de este mundo se termina.'
    - - V
      - Y nosotros no hemos recibido el espíritu del mundo.
    - - R
      - Porque la presentación de este mundo se termina.
  oracion: Dios de bondad, consolador de los que lloran, tú que, lleno de compasión, acogiste las lágrimas que santa Mónica derramaba pidiendo la conversión de su hijo Agustín, concédenos, por la intercesión de ambos, el arrepentimiento sincero de nuestros pecados y la gracia de tu perdón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN AGUSTÍN, obispo y doctor de la iglesia:
  grado: Memoria
  fecha: 08-28
  comun: 'Del Común de pastores: para un santo obispo y del común de doctores de la Iglesia.'
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De las Confesiones de san Agustín, obispo
      (Libro 7, 10, 18; 10, 27: CSEL 33, 157-163. 255)
    texto: |-
      Habiéndome convencido de que debía volver a mí mismo, penetré en mi interior, siendo tu mi guía, y ello me fue posible porque tú, Señor, me socorriste. Entré y ví con los ojos de mi alma, de un modo u otro, por encima de la capacidad de estos mismos ojos, por encima de mi mente, una luz inconmutable; no esta luz ordinaria y visible a cualquier hombre, por intensa y clara que fuese y que lo llenara todo con su magnitud. Se trataba de una luz completamente distinta. Ni estaba por encima de mi mente, como el aceite sobre el agua o como el cielo sobre la tierra, sino que estaba en lo más alto, ya que ella fue quien me hizo, y yo estaba en lo más bajo, porque fui hecho por ella. La conoce el que conoce la verdad. ¡Oh eterna verdad, verdadera caridad y cara eternidad! Tú eres mi Dios, por ti suspiro día y noche. Y, cuando te conocí por vez primera, fuiste tú quien me elevó hacia ti, para hacerme ver que había algo que ver y que yo no era aún capaz de verlo. Y fortaleciste la debilidad de mi mirada irradiando con fuerza sobre mí, y me estremecí de amor y de temor; y me di cuenta de la gran distancia que me separaba de ti, por la gran desemejanza que hay entre tú y yo, como si oyera tu voz que me decía desde arriba: «Soy alimento de adultos: crece, y podrás comerme. Y no me transformarás en substancia tuya, como sucede con la comida corporal, sino que tú te transformarás en mí.»
      Y yo buscaba el camino para adquirir un vigor que me hiciera capaz de gozar de ti, y no lo encontraba, hasta que me abracé al mediador entre Dios y los hombres, Cristo Jesús, hombre también él, el cual está por encima de todas las cosas, Dios bendito por los siglos, que me llamaba y me decía: Yo soy el camino de la verdad y la vida, y el que mezcla aquel alimento, que yo no podía asimilar, con la carne, ya que la Palabra se hizo carne, para que, en atención a nuestro estado de infancia, se convirtiera en leche tu sabiduría, por la que creaste todas las cosas.
      ¡Tarde te amé, Hermosura tan antigua y tan nueva, tarde te amé! Y tú estabas dentro de mí y yo afuera, y así por fuera te buscaba; y, deforme como era, me lanzaba sobre estas cosas hermosas que tú creaste. Tú estabas conmigo, mas yo no estaba contigo. Reteníanme lejos de ti aquellas cosas que, si no estuviesen en ti, no existirían. Me llamaste y clamaste, y quebrantaste mi sordera; brillaste y resplandeciste, y curaste mi ceguera; exhalaste tu perfume y lo aspiré, y ahora te anhelo; gusté de ti, y ahora siento hambre y sed de ti; me tocaste, y deseé con ansia la paz que procede de ti.
    titulo: ¡OH ETERNA VERDAD, VERDADERA CARIDAD Y CARA ETERNIDAD!
  resp2:
    ref: S. Agustín, Confesiones
    vr:
    - - R
      - '¡Oh verdad, luz de mi corazón! No son ya mis tinieblas las que me hablan: me había equivocado, pero me acordé de ti; * y ahora vuelvo a tu fuente, sediento y anhelante.'
    - - V
      - No soy yo mi propia vida; por mí mismo, sólo viví mal, mas luego en ti resucité.
    - - R
      - Y ahora vuelvo a tu fuente, sediento y anhelante.
  oracion: Renueva, Señor, en tu Iglesia aquel espíritu que, con tanta abundancia, otorgaste al obispo san Agustín, para que también nosotros tengamos sed de ti, única fuente de la verdadera sabiduría, y en ti, único manantial del verdadero amor, encuentre descanso nuestro corazón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL MARTIRIO DE SAN JUAN BAUTISTA:
  grado: Memoria
  fecha: 08-29
  himno: Profeta de soledades
  lectura2:
    autor: |-
      De las Homilías de san Beda el Venerable, presbítero
      (Homilía 23: CCL 122, 354. 356-357)
    texto: |-
      El santo Precursor del nacimiento, de la predicación y de la muerte del Señor mostró en el momento de la lucha suprema una fortaleza digna de atraer la mirada de Dios, ya que, como dice la Escritura, aunque, a juicio de los hombres, haya sufrido castigos, su esperanza estaba llena de inmortalidad. Con razón celebramos su día natalicio, que él ha solemnizado con su martirio y adornado con el fulgor purpúreo de su sangre; con razón veneramos con gozo espiritual la memoria de aquel que selló con su martirio el testimonio que había dado del Señor.
      No debemos poner en duda que san Juan sufrió la cárcel y las cadenas y dio su vida en testimonio de nuestro Redentor, de quien fue precursor, ya que, si bien su perseguidor no lo forzó a que negara a Cristo, si trató de obligarlo a que callara la verdad; ello es suficiente para afirmar que murió por Cristo.
      Cristo, en efecto, dice: Yo soy la verdad; por consiguiente, si Juan derramó su sangre por la verdad, la derramó por Cristo; y él, que precedió a Cristo en su nacimiento en su predicación y en su bautismo, anunció también con su martirio, anterior al de Cristo, la pasión futura del Señor.
      Este hombre tan eximio terminó, pues, su vida derramando su sangre, después de un largo y penoso cautiverio. Él, que había evangelizado la libertad de una paz que viene de arriba, fue encarcelado por unos hombres malvados; fue encerrado en la oscuridad de un calabozo aquel que vino a dar testimonio de la luz y a quien Cristo, la luz en persona, dio el título de «lámpara que arde y que ilumina»; fue bautizado en su propia sangre aquel a quien fue dado bautizar al Redentor del mundo, oír la voz del Padre que resonaba sobre Cristo y ver la gracia del Espíritu Santo que descendía sobre él. Mas a él, todos aquellos tormentos temporales no le resultaban penosos, sino más bien leves y agradables, ya que los sufría por causa de la verdad y sabía que habían de merecerle un premio y un gozo sin fin.
      La muerte —que de todas maneras había de acaecerle por ley natural— era para él algo apetecible, teniendo en cuenta que la sufría por la confesión del nombre de Cristo y que con ella alcanzaría la palma de la vida eterna. Bien lo dice el Apóstol: Dios os ha dado la gracia de creer en Jesucristo y aun de padecer por él. El mismo Apóstol explica, en otro lugar, por qué sea un don el hecho de sufrir por Cristo: Los padecimientos de esta vida presente tengo por cierto que no son nada en comparación con la gloria futura que se ha de revelar en nosotros.
    titulo: PRECURSOR DEL NACIMIENTO Y DE LA MUERTE DE CRISTO
  resp2:
    ref: Mc 6, 17. 27
    vr:
    - - R
      - Herodes había mandado prender a Juan y, cargándolo de cadenas, lo metió en la cárcel, * por instigación de Herodías, la mujer de su hermano, con la cual se había casado.
    - - V
      - Y envió a uno de sus guardias, que lo decapitó en la cárcel.
    - - R
      - Por instigación de Herodías, la mujer de su hermano, con la cual se había casado.
  oracion: Dios nuestro, que quisiste que san Juan Bautista fuera el precursor de tu Hijo, tanto en su nacimiento como en su muerte, concédenos que, así como él dio su vida por dar testimonio de la verdad y de la justicia, así también nosotros entreguemos generosamente la nuestra al testimonio y servicio del Evangelio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN GREGORIO MAGNO, papa y doctor de la Iglesia:
  grado: Memoria
  fecha: 09-03
  comun: Del Común de pastores para un santo papa y del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De las Homilías de san Gregorio Magno, papa, sobre el profeta Ezequiel
      (Libro 1, 11, 4-6: CCL 142, 170-172)
    texto: |-
      Hijo de hombre, te he puesto como atalaya en la casa de Israel. Fijémonos cómo el Señor compara sus predicadores a un atalaya. El atalaya está siempre en un lugar alto para ver desde lejos todo lo que se acerca. Y todo aquel que es puesto como atalaya del pueblo de Dios debe, por su conducta, estar siempre en alto, a fin de preverlo todo y ayudar así a los que tiene bajo su custodia.
      Estas palabras que os dirijo resultan muy duras para mí, ya que con ellas me ataco a mí mismo, puesto que ni mis palabras ni mi conducta están a la altura de mi misión.
      Me confieso culpable, reconozco mi tibieza y mi negligencia. Quizá esta confesión de mi culpabilidad me alcance el perdón del Juez piadoso. Porque, cuando estaba en el monasterio, podía guardar mi lengua de conversaciones ociosas y estar dedicado casi continuamente a la oración. Pero, desde que he cargado sobre mis hombros la responsabilidad pastoral, me es imposible guardar el recogimiento que yo querría, solicitado como estoy por tantos asuntos.
      Me veo, en efecto, obligado a dirimir las causas, ora de las diversas Iglesias, ora de los monasterios, y a juzgar con frecuencia de la vida y actuación de los individuos en particular; otras veces tengo que ocuparme de asuntos de orden civil, otras, de lamentarme de los estragos causados por las tropas de los bárbaros y de temer por causa de los lobos que acechan al rebaño que me ha sido confiado. Otras veces debo preocuparme de que no falte la ayuda necesaria a los que viven sometidos a una disciplina regular, a veces tengo que soportar con paciencia a algunos que usan de la violencia, otras, en atención a la misma caridad que les debo, he de salirles al encuentro.
      Estando mi espíritu disperso y desgarrado con tan diversas preocupaciones, ¿cómo voy a poder reconcentrarme para dedicarme por entero a la predicación y al ministerio de la palabra? Además, muchas veces, obligado por las circunstancias, tengo que tratar con las personas del mundo, lo que hace que alguna vez se relaje la disciplina impuesta a mi lengua. Porque, si mantengo en esta materia una disciplina rigurosa, sé que ello me aparta de los más débiles, y así nunca podré atraerlos adonde yo quiero. y esto hace que, con frecuencia, escuche pacientemente sus palabras, aunque sean ociosas. Pero, como yo también soy débil, poco a poco me voy sintiendo atraído por aquellas palabras ociosas, y empiezo a hablar con gusto de aquello que había empezado a escuchar con paciencia, y resulta que me encuentro a gusto postrado allí mismo donde antes sentía repugnancia de caer.
      ¿Qué soy yo, por tanto, o qué clase de atalaya soy, que no estoy situado, por mis obras, en lo alto de la montaña, sino que estoy postrado aún en la llanura de mi debilidad? Pero el Creador y Redentor del género humano es bastante poderoso para darme a mí, indigno, la necesaria altura de vida y eficacia de palabra, ya que por su amor, cuando hablo de él, ni a mí mismo me perdono.
    titulo: POR AMOR A CRISTO, CUANDO HABLO DE ÉL, NI A Mi MISMO ME PERDONO
  resp2:
    ref: ''
    vr:
    - - R
      - Sacando enseñanzas morales de las sagradas Escrituras e interpretando sus misterios, encauzó hacia los pueblos las corrientes de agua viva del Evangelio; * y aun después de su muerte continúa hablando.
    - - V
      - Recorriendo todo el mundo como un águila, provee de alimento a los grandes y a los pequeños con su inmensa caridad.
    - - R
      - Y aun después de su muerte continúa hablando.
  oracion: Señor Dios, que cuidas a tu pueblo con ternura y lo gobiernas con amor, te pedimos que, por intercesión del papa san Gregorio Magno, concedas el espíritu de sabiduría a quienes has establecido como maestros y pastores de la Iglesia, para que así el progreso de los fieles constituya el gozo eterno de sus pastores. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA NATIVIDAD DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 09-08
  comun: Del Común de la santísima Virgen María.
  himno: Vestida de sol y pétalos
  salmodia:
  - ant: María ha recibido la bendición del Señor y la misericordia de Dios, su salvador.
    salmo: salmo-23
  - ant: El Altísimo consagra su morada.
    salmo: salmo-45
  - ant: ¡Qué pregón tan glorioso para ti, Virgen María!
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas.
  - - R
    - Meditándolas en su corazón.
  lectura1:
    ref: Del libro del Génesis 3, 9-20
    texto: |-
      En aquellos días, el Señor Dios llamó al hombre y le dijo:
      «¿Dónde estás?»
      Éste contestó:
      «Te oí andar por el jardín y tuve miedo, porque estoy desnudo. Por eso me escondí.»
      El Señor Dios le replicó:
      «Y ¿quién te ha hecho ver que estabas desnudo? ¿Has comido acaso del árbol del que te prohibí comer?»
      Respondió el hombre:
      «La mujer que me diste por compañera me dio del árbol y comí.»
      Dijo pues, el Señor Dios a la mujer:
      «¿Por qué lo has hecho?»
      Y contestó la mujer:
      «La serpiente me sedujo, y comí.»
      Entonces el Señor Dios dijo a la serpiente:
      Por haber hecho esto, maldita seas entre todas las bestias y entre todos los animales del campo. Sobre tu vientre caminarás y polvo comerás todos los días de tu vida. Pongo hostilidad entre ti y la mujer, entre tu linaje y el suyo: él herirá tu cabeza cuando tú hieras su talón.»
      A la mujer le dijo:
      «Tantas haré tus fatigas cuantos sean tus embarazos: con trabajo darás a luz a tus hijos. Pero tu deseo te impulsará hacia tu marido, y él te dominará.»
      Al hombre le dijo:
      «Por haber accedido a la voz de tu mujer, comiendo del árbol del que yo te había prohibido comer, maldito el suelo por tu culpa: con fatiga sacarás de él el alimento todos los días de tu vida. Brotará para ti cardos y espinas y comerás las hierbas del campo. Con sudor de tu frente comerás el pan, hasta que vuelvas al suelo, pues de él fuiste tomado, porque eres polvo y al polvo volverás.»
      El hombre llamó «Eva» a su mujer, por ser ella la madre de todos los vivientes.
    titulo: SENTENCIA CONTRA EL PECADOR Y PROMESA DE SALVACIÓN
  resp1:
    ref: ''
    vr:
    - - R
      - En este día nació la santísima Virgen María del linaje de David; * por ella surgió la salvación del mundo para los creyentes, de su vida gloriosa brotó la luz para todo el universo.
    - - V
      - Celebremos con gran fervor el nacimiento de la santísima Virgen María.
    - - R
      - Por ella surgió la salvación del mundo para los creyentes, de su vida gloriosa brotó la luz para todo el Universo.
  lectura2:
    autor: |-
      De las Disertaciones de san Andrés de Creta, obispo
      (Disertación 1: PG 97, 806-810)
    texto: |-
      Cristo es el término y el fin de la ley mosaica; él nos hace pasar de la esclavitud de esta ley a la libertad del espíritu. La ley tendía hacia él como a su complemento; y él, como supremo legislador, da cumplimiento a su misión, transformando en espíritu la letra de la ley. De este modo, hacía que todas las cosas lo tuviesen a él por cabeza. La gracia es la que da vida a la ley y, por esto, es superior a la misma, y de la unión de ambas resulta un conjunto armonioso, conjunto que no hemos de considerar como una mezcla, en la cual alguno de los dos elementos citados pierda sus características propias, sino como una transmutación divina, según la cual todo lo que había de esclavitud en la ley se cambia en suavidad y libertad, de modo que, como dice el Apóstol, no vivamos ya esclavizados por los «elementos del mundo» ni sujetos al yugo y a la esclavitud de la ley.
      Éste es el compendio de todos los beneficios que Cristo nos ha hecho; ésta es la revelación del designio amoroso de Dios: su anonadamiento, su encarnación y la consiguiente divinización del hombre. Convenía, pues, que esta fulgurante y sorprendente venida de Dios a los hombres fuera precedida de algún hecho que nos preparara a recibir con gozo el gran don de la salvación. Y éste es el significado de la fiesta que hoy celebramos, ya que el nacimiento de la Madre de Dios es el exordio de todo este cúmulo de bienes, exordio que hallará su término y complemento en la unión del Verbo con la carne que le estaba destinada. El día de hoy nació la Virgen; es luego amamantada y se va desarrollando; y es preparada para ser la madre de Dios, rey de todos los siglos.
      Un doble beneficio nos aporta este hecho: nos conduce a la verdad y nos libera de una manera de vivir sujeta a la esclavitud de la letra de la ley. ¿De qué modo tiene lugar esto? Por el hecho de que la sombra se retira ante la llegada de la luz, y la gracia sustituye a la letra de la ley por la libertad del espíritu. Precisamente la solemnidad de hoy representa el tránsito de un régimen al otro, en cuanto que convierte en realidad lo que no era más que símbolo y figura, sustituyendo lo antiguo por lo nuevo.
      Que toda la creación, pues, rebose de contento y contribuya a su modo a la alegría propia de este día. Cielo y tierra se aúnen en esta celebración, y que la festeje con gozo todo lo que hay en el mundo y por encima del mundo. Hoy, en efecto, ha sido construido el santuario creado del Creador de todas las cosas, y la creación, de un modo nuevo y más digno, queda dispuesta para hospedar en sí al supremo Hacedor.
    titulo: LO ANTIGUO HA PASADO, LO NUEVO HA COMENZADO
  resp2:
    ref: ''
    vr:
    - - R
      - Celebremos hoy con gran fervor el nacimiento de la siempre Virgen María, la Madre de Dios, * cuya existencia gloriosa ilumina a toda la Iglesia.
    - - V
      - Cantemos con todo el corazón y con toda nuestra mente las glorias de Cristo, en esta sagrada festividad de María, la excelsa Madre de Dios.
    - - R
      - Cuya existencia gloriosa ilumina a toda la Iglesia.
  te_deum: true
  oracion: Concede a tus siervos, Señor, el don de tu gracia, para que, a quienes recibimos las primicias de la salvación por la maternidad de la Virgen María, la fiesta anual de su nacimiento nos traiga aumento de paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN CRISÓSTOMO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 09-13
  comun: Del Común de pastores para un santo obispo y del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De las homilías de san Juan Crisóstomo, obispo
      (homilía antes de partir en exilio, 1-3: PG 52, 427-430)
    texto: |-
      Muchas son las olas que nos ponen en peligro, y una gran tempestad nos amenaza: sin embargo, no tememos ser sumergidos porque permanecemos de pie sobre la roca. Aun cuando el mar se desate, no romperá esta roca; aunque se levanten las olas, nada podrán contra la barca de Jesús. Decidme, ¿qué podemos temer? ¿La muerte? Para mí la vida es Cristo, y la muerte una ganancia. ¿El destierro? Del Señor es la tierra y cuanto la llena. ¿La confiscación de los bienes? Nada trajimos al mundo; de modo que nada podemos llevarnos de él. Yo me río de todo lo que es temible en este mundo y de sus bienes. No temo la muerte ni envidio las riquezas. No tengo deseos de vivir, si no es para vuestro bien espiritual. Por eso, os hablo de lo que sucede ahora exhortando vuestra caridad a la confianza.
      ¿No has oído aquella palabra del Señor: Donde dos o tres están reunidos en mi nombre, allí estoy yo en medio de ellos? Y allí donde un pueblo numeroso esté reunido por los lazos de la caridad ¿no estará presente el Señor? Él me ha garantizado su protección, no es en mis fuerzas que me apoyo. Tengo en mis manos su palabra escrita. Éste es mi báculo, ésta es mi seguridad, éste es mi puerto tranquilo. Aunque se turbe el mundo entero, yo leo esta palabra escrita que llevo conmigo, porque ella es mi muro y mi defensa. ¿Qué es lo que ella me dice? Yo estaré siempre con vosotros hasta el fin del mundo.
      Cristo está conmigo, ¿qué puedo temer? Que vengan a asaltarme las olas del mar y la ira de los poderosos; todo eso no pesa más que una tela de araña. Si no me hubiese retenido el amor que os tengo, no hubiese esperado a mañana para marcharme. En toda ocasión yo digo: «Señor, hágase tu voluntad: no lo que quiere éste o aquél, sino lo que tú quieres que haga.» Éste es mi alcázar, ésta es mi roca inamovible, éste es mi báculo seguro. Si esto es lo que quiere Dios, que así se haga. Si quiere que me quede aquí, le doy gracias. En cualquier lugar donde me mande, le doy gracias también.
      Además, donde yo esté estaréis también vosotros, donde estéis vosotros estaré también yo: formamos todos un solo cuerpo, y el cuerpo no puede separarse de la cabeza, ni la cabeza del cuerpo. Aunque estemos separados en cuanto al lugar, permanecemos unidos por la caridad, y ni la misma muerte será capaz de desunirnos. Porque, aunque muera mi cuerpo, mi espíritu vivirá y no echará en olvido a su pueblo.
      Vosotros sois mis conciudadanos, mis padres, mis hermanos, mis hijos, mis miembros, mi cuerpo y mi luz, una luz más agradable que esta luz material. Porque, para mí, ninguna luz es mejor que la de vuestra caridad. La luz material me es útil en la vida presente, pero vuestra caridad es la que va preparando mi corona para el futuro.
    titulo: PARA MÍ LA VIDA ES CRISTO, Y LA MUERTE UNA GANANCIA
  resp2:
    ref: 2Tm 2, 9-10; Sal 26. 1
    vr:
    - - R
      - Por la difusión del Evangelio, sufro hasta ser encadenado como un malhechor; pero la palabra de Dios no está encadenada; * por eso, todo lo soporto por los elegidos.
    - - V
      - El Señor es mi luz y mi salvación, ¿a quién temeré?
    - - R
      - Por eso, todo lo soporto por los elegidos.
  oracion: Señor Dios, fortaleza de los que en ti confían, tú que quisiste que el obispo san Juan Crisóstomo brillara por su admirable elocuencia y por su gran fortaleza en medio de las pruebas, haz que la sabiduría de este eximio doctor de la Iglesia nos ilumine y que el ejemplo de su invencible constancia nos fortalezca. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EXALTACIÓN DE LA SANTA CRUZ:
  grado: Fiesta
  fecha: 09-14
  himno: Cruz de Cristo
  salmodia:
  - ant: Mirad la cruz del Señor, que huyan los enemigos; ha vencido el león de la tribu de Judá, el vástago de David. Aleluia.
    salmo: salmo-2
  - ant: En la cruz ha sido ensalzada la majestad del Señor; su nombre ha sido enaltecido sobre los cielos y la tierra. Aleluia.
    salmo: salmo-8
  - ant: Oh cruz santa, tú has sido la única digna de llevar al Rey y Señor de los cielos y de la tierra. Aleluia.
    salmo: salmo-95
  versiculo:
  - - V
    - Así como Moisés levantó en alto la serpiente en el desierto.
  - - R
    - Así deberá ser levantado en alto el Hijo del hombre.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Gálatas 2, 19—3, 7. 13-14; 6, 14-16
    texto: |-
      Hermanos: Yo, Pablo, en virtud de la misma ley he muerto a la ley, a fin de vivir para Dios. Estoy crucificado con Cristo; vivo yo, pero no soy yo, es Cristo quien vive en mí. Y, mientras vivo en esta carne, vivo de la fe en el Hijo de Dios, que me amó hasta entregarse por mí. No tengo por inútil esta gracia de Dios: Si la justificación nos viniera por la ley, entonces deberíamos concluir que Cristo murió inútilmente.
      ¡Oh, insensatos gálatas! ¿Quién os fascinó, después que ante vuestros ojos presentamos a Jesucristo muerto en la cruz? Sólo quiero que me digáis una cosa: ¿Cómo habéis recibido el Espíritu, en virtud de las obras de la ley o por vuestra sumisión a la fe? ¿Tan insensatos sois, que, habiendo comenzado por espíritu, termináis ahora en carne? ¿Habrá sido en vano para vosotros el haber experimentado tan grandes dones? Pues ¡de veras que habría sido en vano! El que os da el Espíritu y obra prodigios entre vosotros ¿lo hace porque observáis la ley o por vuestra aceptación de la fe?
      Así se dice: «Abraham creyó a Dios y Dios estimó su fe como justificación.» Entended, pues, que los hijos de Abraham son sólo aquellos que viven según la fe.
      Cristo nos redimió de la maldición de la ley, haciéndose maldición por nosotros. Así lo dice la Escritura: «Maldito sea aquel que cuelga del madero.» De ese modo la bendición de Abraham alcanza a todas las naciones por Cristo Jesús, para que recibamos por la fe el Espíritu prometido por Dios.
      En cuanto a mí, líbreme Dios de gloriarme si no es en la cruz de nuestro Señor Jesucristo; por él el mundo está crucificado para mí y yo para el mundo. Lo que vale no es estar o no estar circuncidado, sino la nueva creatura que surge.
      Paz y misericordia para todos los que se ajusten a esta norma, y también para el Israel de Dios.
    titulo: LA GLORIA DE LA CRUZ
  resp1:
    ref: Cf. Ga 6, 14; Hb 2, 9
    vr:
    - - R
      - Líbrenos Dios de gloriarnos si no es en la cruz de nuestro Señor Jesucristo, en quien está nuestra salvación, vida y resurrección; * por él hemos sido salvados y liberados.
    - - V
      - Él fue coronado de gloria y de honor por haber padecido la muerte.
    - - R
      - Por él hemos sido salvados y liberados.
  lectura2:
    autor: |-
      De las Disertaciones de san Andrés de Creta, obispo
      (Disertación 10, Sobre la Exaltación de la santa cruz: PG 97, 1018-1019. 1022-1023)
    texto: |-
      Por la cruz, cuya fiesta celebramos, fueron expulsadas las tinieblas y devuelta la luz. Celebramos hoy la fiesta de la cruz, y junto con el Crucificado nos elevamos hacia lo alto, para, dejando abajo la tierra y el pecado, gozar de los bienes celestiales; tal y tan grande es la posesión de la cruz. Quien posee la cruz posee un tesoro. Y, al decir un tesoro, quiero significar con esta expresión a aquel que es, de nombre y de hecho, el más excelente de todos los bienes, en el cual, por el cual y para el cual culmina nuestra salvación y se nos restituye a nuestro estado de justicia original.
      Porque, sin la cruz, Cristo no hubiera sido crucificado. Sin la cruz, aquel que es la vida no hubiera sido clavado en el leño. Si no hubiese sido clavado, las fuentes de la inmortalidad no hubiesen manado de su costado la sangre y el agua que purifican el mundo, no hubiese sido rasgado el documento en que constaba la deuda contraída por nuestros pecados, no hubiéramos sido declarados libres, no disfrutaríamos del árbol de la vida, el paraíso continuaría cerrado. Sin la cruz, no hubiera sido derrotada la muerte, ni despojado el lugar de los muertos.
      Por esto la cruz es cosa grande y preciosa. Grande, porque ella es el origen de innumerables bienes, tanto más numerosos, cuanto que los milagros y sufrimientos de Cristo juegan un papel decisivo en su obra de salvación. Preciosa, porque la cruz significa a la vez el sufrimiento y el trofeo del mismo Dios: el sufrimiento, porque en ella sufrió una muerte voluntaria; el trofeo, porque en ella quedó herido de muerte el demonio y, con él, fue vencida la muerte. En la cruz fueron demolidas las puertas de la región de los muertos, y la cruz se convirtió en salvación universal para todo el mundo.
      La cruz es llamada también gloria y exaltación de Cristo. Ella es el cáliz rebosante de que nos habla el salmo, y la culminación de todos los tormentos que padeció Cristo por nosotros. El mismo Cristo nos enseña que la cruz es su gloria, cuando dice: Ya ha entrado el Hijo del hombre en su gloria, y Dios ha recibido su glorificación por él, y Dios a su vez lo revestirá de su misma gloria. Y también: Glorifícame tú, Padre, con la gloria que tenía junto a ti antes que el mundo existiese. Y asimismo dice: «Padre, glorifica tu nombre.» Y, de improviso, se dejaron oír del cielo estas palabras: «Lo he glorificado y lo glorificaré de nuevo», palabras que se referían a la gloria que había de conseguir en la cruz.
      También nos enseña Cristo que la cruz es su exaltación, cuando dice: Yo, cuando sea levantado en alto, atraeré a mí a todos los hombres. Está claro, pues, que la cruz es la gloria y exaltación de Cristo.
    titulo: LA CRUZ ES LA GLORIA Y EXALTACIÓN DE CRISTO
  resp2:
    ref: ''
    vr:
    - - R
      - ¡Oh cruz admirable, en cuyas ramas estuvo suspendido el tesoro y la redención de los cautivos! * Por ti el mundo fue redimido con la sangre de su Señor.
    - - V
      - ¡Salve, oh cruz, que fuiste consagrada por el cuerpo de Cristo, y estuviste adornada con sus sagrados miembros como con piedras preciosas!
    - - R
      - Por ti el mundo fue redimido con la sangre de su Señor.
  te_deum: true
  oracion: Señor, Dios nuestro, que has querido salvar a los hombres por medio de tu Hijo muerto en la cruz, te pedimos, ya que nos has dado a conocer en la tierra la fuerza misteriosa de la cruz de Cristo, que podamos alcanzar en el cielo los frutos de la redención. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE LOS DOLORES:
  grado: Memoria
  fecha: 09-15
  comun: Del Común de la Santísima Virgen María.
  himno: La Madre piadosa estaba
  lectura2:
    autor: |-
      De los Sermones de san Bernardo, abad
      (Sermón en el domingo infraoctava de la Asunción, 14-15: Opera omnia, edición cisterciense, 5 [1968], 273-274)
    texto: |-
      El martirio de la Virgen queda atestiguado por la profecía de Simeón y por la misma historia de la pasión del Señor. Éste —dice el santo anciano, refiriéndose al niño Jesús— está predestinado por Dios para ser signo de contradicción; tu misma alma —añade, dirigiéndose a María— quedará atravesada por una espada.
      En verdad, Madre santa, atravesó tu alma una espada. Por lo demás, esta espada no hubiera penetrado en la carne de tu Hijo sin atravesar tu alma. En efecto, después que aquel Jesús —que es de todos, pero que es tuyo de un modo especialísimo— hubo expirado, la cruel espada que abrió su costado, sin perdonarlo aun después de muerto, cuando ya no podía hacerle mal alguno, no llegó a tocar su alma, pero sí atravesó la tuya. Porque el alma de Jesús ya no estaba allí, en cambio la tuya no podía ser arrancada de aquel lugar. Por tanto, la punzada del dolor atravesó tu alma, y por esto, con toda razón, te llamamos más que mártir, ya que tus sentimientos de compasión superaron las sensaciones del dolor corporal.
      ¿Por ventura no fueron peores que una espada aquellas palabras que atravesaron verdaderamente tu alma y penetraron hasta la separación del alma y del espíritu: Mujer, ahí tienes a tu hijo? ¡Vaya cambio! Se te entrega a Juan en sustitución de Jesús, al siervo en sustitución del Señor, al discípulo en lugar del Maestro, al hijo de Zebedeo en lugar del Hijo de Dios, a un simple hombre en sustitución del Dios verdadero. ¿Cómo no habían de atravesar tu alma, tan sensible, estas palabras, cuando aun nuestro pecho, duro como la piedra o el hierro, se parte con sólo recordarlas?
      No os admiréis, hermanos, de que María sea llamada mártir en el alma. Que se admire el que no recuerde haber oído cómo Pablo pone entre las peores culpas de los gentiles el carecer de piedad. Nada más lejos de las entrañas de María, y nada más lejos debe estar de sus humildes servidores.
      Pero quizá alguien dirá: «¿Es que María no sabía que su Hijo había de morir?» Sí, y con toda certeza. «¿Es que no sabía que había de resucitar al cabo de muy poco tiempo?» Sí, y con toda seguridad. «¿Y, a pesar de ello, sufría por el Crucificado?» Sí, y con toda vehemencia. Y si no, ¿qué clase de hombre eres tú, hermano, o de dónde te viene esta sabiduría, que te extrañas más de la compasión de María que de la pasión del Hijo de María? Éste murió en su cuerpo, ¿y ella no pudo morir en su corazón? Aquélla fue una muerte motivada por un amor superior al que pueda tener cualquier otro hombre; esta otra tuvo por motivo un amor que, después de aquél, no tiene semejante.
    titulo: LA MADRE ESTABA JUNTO A LA CRUZ
  resp2:
    ref: Lc 23, 33; Jn 19, 25; cf. Lc 2, 35
    vr:
    - - R
      - Cuando llegaron al lugar llamado Calvario, crucificaron ahí a Jesús. * Estaba su madre junto a la cruz.
    - - V
      - Entonces quedó su alma atravesada por una espada de dolor.
    - - R
      - Estaba su madre junto a la cruz.
  oracion: Dios nuestro, que quisiste que la Madre de tu Hijo estuviera a su lado junto a la cruz, participando en sus sufrimientos, concede a tu Iglesia que, asociada con María a la pasión de Cristo, merezca también participar en su gloriosa resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS CORNELIO, Papa, y CIPRIANO, obispo, mártires:
  grado: Memoria
  fecha: 09-16
  comun: Del Común de varios mártires.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De las Cartas de San Cipriano, obispo y mártir
      (Carta 60, 1-2. 5: CSEL 3, 691-692. 694-695)
    texto: |-
      Cipriano a su hermano Cornelio:
      Hemos tenido noticia, hermano muy amado, del testimonio glorioso que habéis dado de vuestra fe y fortaleza; y hemos recibido con tanta alegría el honor de vuestra confesión, que nos consideramos partícipes y socios de vuestros méritos y alabanzas. En efecto, si formamos todos una misma Iglesia, si tenemos todos una sola alma y un solo corazón, ¿qué sacerdote no se congratulará de las alabanzas tributadas a un colega suyo, como si se tratara de las suyas propias? ¿O qué hermano no se alegrará siempre de las alegrías de sus otros hermanos?
      No hay manera de expresar cuán grande ha sido aquí la alegría y el regocijo, al enterarnos de vuestra victoria y vuestra fortaleza: de cómo tú has ido a la cabeza de tus hermanos en la confesión del nombre de Cristo, y de cómo esta confesión tuya, como cabeza de tu Iglesia, se ha visto a su vez robustecida por la confesión de los hermanos; de este modo, precediéndolos en el camino hacia la gloria, has hecho que fueran muchos los que te siguieran, y ha sido un estímulo para que el pueblo confesara su fe el hecho de que te mostraras tú, el primero, dispuesto a confesarla en nombre de todos; y, así, no sabemos qué es lo más digno de alabanza en vosotros, si tu fe generosa y firme o la inseparable caridad de los hermanos. Ha quedado públicamente comprobada la fortaleza del obispo que está al frente de su pueblo y ha quedado de manifiesto la unión entre los hermanos que han seguido sus huellas. Por el hecho de tener todos vosotros un solo espíritu y una sola voz, toda la Iglesia de Roma ha tenido parte en vuestra confesión.
      Ha brillado en todo su fulgor, hermano muy amado, aquella fe vuestra, de la que habló el Apóstol. Él preveía ya en espíritu, esta vuestra fortaleza y valentía, tan digna de alabanza, y pregonaba lo que más tarde había de suceder, atestiguando vuestros merecimientos, ya que, alabando a vuestros antecesores, os incitaba a vosotros a imitarlos. Con vuestra unanimidad y fortaleza, habéis dado a los demás hermanos un magnífico ejemplo de estas virtudes.
      Y, teniendo en cuenta que la providencia del Señor nos advierte y pone en guardia y que los saludables avisos de la misericordia divina nos previenen que se acerca ya el día de nuestra lucha y combate, os exhortamos de corazón, en cuanto podemos, hermano muy amado, por la mutua caridad que nos une, a que no dejemos de insistir, junto con todo el pueblo, en los ayunos, vigilias y oraciones. Porque éstas son nuestras armas celestiales, que nos harán mantener firmes y perseverar con fortaleza; éstas son las defensas espirituales y los dardos divinos que nos protegen.
      Acordémonos siempre unos de otros, con grande concordia y unidad de espíritu, encomendémonos siempre mutuamente en la oración y prestémonos ayuda con mutua caridad cuando llegue el momento de la tribulación y de la angustia.
    titulo: UNA FE GENEROSA Y FIRME
  resp2:
    ref: S. Cipriano, Carta 58
    vr:
    - - R
      - Dios nos contempla, Cristo y sus ángeles nos miran, mientras luchamos por la fe. * Qué dignidad tan grande, qué felicidad tan plena es luchar bajo la mirada de Dios y ser coronados por Cristo.
    - - V
      - Revistámonos de fuerza y preparémonos para la lucha con un espíritu indoblegable, con una fe sincera, con una entrega total.
    - - R
      - Qué dignidad tan grande, qué felicidad tan plena es luchar bajo la mirada de Dios y ser coronados por Cristo.
  oracion: Señor, tú que en los santos Cornelio y Cipriano diste a tu pueblo pastores llenos de celo y mártires victoriosos, concédenos por su valiosa intercesión, ser firmes e invencibles en la fe y trabajar con verdadero empeño por lograr la unidad de tu Iglesia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS ANDRÉS KIM TAEGON, presbítero, PABLO CHONG HASANG y compañeros mártires:
  grado: Memoria
  fecha: 09-20
  comun: Del Común de varios mártires.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la última exhortación de san Andrés Kim Taegon, presbítero y mártir.
      (Pro Corea Documenta. ed. Mission Catholique Séoul, Seul/París 1938, vol. I, 74- 75)
    texto: |-
      Hermanos y amigos muy queridos: Consideradlo una y otra vez: Dios, al principio de los tiempos, dispuso el cielo y la tierra y todo lo que existe, meditad luego por qué y con qué finalidad creó de modo especial al hombre a su imagen y semejanza.
      Si en este mundo, lleno de peligros y de miserias, no reconociéramos al Señor como creador, de nada nos serviría haber nacido ni continuar aún vivos. Aunque por la gracia de Dios hemos venido a este mundo y también por la gracia de Dios hemos recibido el bautismo y hemos ingresado en la Iglesia, y, convertidos en discípulos del Señor, llevamos un nombre glorioso, ¿de qué nos serviría un nombre tan excelso, si no correspondiera a la realidad? Si así fuera, no tendría sentido haber venido a este mundo y formar parte de la Iglesia; más aún, esto equivaldría a traicionar al Señor y su gracia. Mejor sería no haber nacido que recibir la gracia del Señor y pecar contra él.
      Considerad al agricultor cuando siembra en su campo: a su debido tiempo ara la tierra, luego la abona con estiércol y, sometiéndose de buen grado al trabajo y al calor, cultiva la valiosa semilla. Cuando llega el tiempo de la siega, si las espigas están bien llenas, su corazón se alegra y salta de felicidad, olvidándose del trabajo y del sudor. Pero si las espigas resultan vacías y no encuentra en ellas más que paja y cáscara, el agricultor se acuerda del duro trabajo y del sudor y abandona aquel campo en el que tanto había trabajado.
      De manera semejante el Señor hace de la tierra su campo, de nosotros, los hombres, el arroz, de la gracia el abono, y por la encarnación y la redención nos riega con su sangre, para que podamos crecer y llegar a la madurez. Cuando en el día del juicio llegue el momento de la siega, el que haya madurado por la gracia se alegrará en el reino de los cielos como hijo adoptivo de Dios, pero el que no haya madurado se convertirá en enemigo, a pesar de que él también ya había sido hijo adoptivo de Dios, y sufrirá el castigo eterno merecido.
      Hermanos muy amados, tened esto presente: Jesús, nuestro Señor, al bajar a este mundo, soportó innumerables padecimientos, con su pasión fundó la santa Iglesia y la hace crecer con los sufrimientos de los fieles. Por más que los poderes del mundo la opriman y la ataquen, nunca podrán derrotarla. Después de la ascensión de Jesús, desde el tiempo de los apóstoles hasta hoy, la Iglesia santa va creciendo por todas partes en medio de tribulaciones.
      También ahora, durante cincuenta o sesenta años, desde que la santa Iglesia penetró en nuestra Corea, los fieles han sufrido persecución, y aun hoy mismo la persecución se recrudece, de tal manera que muchos compañeros en la fe, entre los cuales yo mismo, están encarcelados, como también vosotros os halláis en plena tribulación. Si todos formamos un solo cuerpo, ¿cómo no sentiremos una profunda tristeza? ¿Cómo dejaremos de experimentar el dolor, tan humano, de la separación?
      No obstante, como dice la Escritura, Dios se preocupa del más pequeño cabello de nuestra cabeza y, con su omnisciencia, lo cuida; ¿cómo por tanto, esta gran persecución podría ser considerada de otro modo que como una decisión del Señor, o como un premio o castigo suyo?
      Buscad, pues, la voluntad de Dios y luchad de todo corazón por Jesús, el jefe celestial, y venced al demonio de este mundo, que ha sido ya vencido por Cristo.
      Os lo suplico: no olvidéis el amor fraterno, sino ayudaos mutuamente, y perseverad, hasta que el Señor se compadezca de nosotros y haga cesar la tribulación.
      Aquí estamos veinte y, gracias a Dios, estamos todos bien. Si alguno es ejecutado, os ruego que no os olvidéis de su familia. Me quedan muchas cosas por deciros, pero, ¿cómo expresarlas por escrito? Doy fin a esta carta. Ahora que está ya cerca el combate decisivo, os pido que os mantengáis en la fidelidad, para que, finalmente, nos congratulemos juntos en el cielo. Recibid el beso de mi amor.
    titulo: LA FE ES CORONADA POR EL AMOR Y LA PERSEVERANCIA
  resp2:
    ref: Cf. 2Co 6. 9-10
    vr:
    - - R
      - Éstos son los mártires que dieron testimonio de Cristo sin temor a las amenazas, alabando al Señor. * La sangre de los mártires es semilla de cristianos.
    - - V
      - Fueron tenidos por desconocidos, aunque eran conocidos de sobra; por moribundos, aunque estaban bien vivos; por necesitados, aunque todo lo poseían.
    - - R
      - La sangre de los mártires es semilla de cristianos.
  oracion: Oh Dios, creador y salvador de todos los hombres, que en Corea, de modo admirable, llamaste a la fe católica a un pueblo de adopción y lo acrecentaste por la gloriosa profesión de fe de los santos mártires Andrés, Pablo y sus compañeros, concédenos, por su ejemplo e intercesión, perseverar también nosotros hasta la muerte en el cumplimiento de tus mandatos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MATEO, apóstol y evangelista:
  grado: Fiesta
  fecha: 09-21
  comun: Del Común de apóstoles.
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder.
  - - R
    - Y las maravillas que realizó.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Efesios 4, 1-16
    texto: |-
      Hermanos: Yo, el prisionero por Cristo, os ruego que andéis como pide la vocación a la que habéis sido convocados. Sed siempre humildes y amables, sed comprensivos; sobrellevaos mutuamente con amor; esforzaos por mantener la unidad del Espíritu, con el vínculo de la paz. Un solo cuerpo y un solo Espíritu, como una sola es la meta de la esperanza en la vocación a la que habéis sido convocados. Un Señor, una fe, un bautismo. Un Dios, Padre de todo, que lo trasciende todo, y lo penetra todo, y lo invade todo.
      A cada uno de nosotros le ha sido concedida la gracia a la medida del don de Cristo. Por eso dice: «Subiendo a la altura, llevó cautivos y dio dones a los hombres.» ¿Qué quiere decir «subió» sino que antes bajó a las regiones inferiores de la tierra? Éste que bajó es el mismo que subió por encima de todos los cielos, para llenarlo todo.
      Él mismo ha constituido a unos, apóstoles; a otros, profetas; a otros, evangelistas; a otros, pastores y doctores, para el perfeccionamiento de los fieles, en función de su ministerio, y para la edificación del cuerpo de Cristo; hasta que lleguemos todos a la unidad en la fe y en el conocimiento del Hijo de Dios, al hombre perfecto, a la medida de Cristo en su plenitud. Para que ya no seamos niños sacudidos por las olas y llevados al retortero por todo viento de doctrina, en la trampa de los hombres, que con astucia conduce al error; sino que, realizando la verdad en el amor, hagamos crecer todas las cosas hacia él, que es la cabeza: Cristo, del cual todo el cuerpo, bien ajustado y unido a través de todo el complejo de junturas que lo nutren y actuando a la medida de cada parte, se procura su propio crecimiento para construcción de sí mismo en el amor.
    titulo: DIVERSIDAD DE DONES EN UN MISMO CUERPO
  resp1:
    ref: 2Pe 1, 21; Pr 2, 6
    vr:
    - - R
      - Nunca fue proferida profecía alguna por voluntad humana, sino que, * llevados del Espíritu Santo, hablaron los hombres de parte de Dios.
    - - V
      - El Señor es quien da sabiduría, de su boca proceden la prudencia y la ciencia.
    - - R
      - Llevados del Espíritu Santo, hablaron los hombres de parte de Dios.
  lectura2:
    autor: |-
      De las Homilías de san Beda el Venerable, presbítero
      (Homilía 21: CCL 122, 149-151)
    texto: |-
      Jesús vio a un hombre, llamado Mateo, sentado ante la mesa de cobro de los impuestos, y le dijo: «Sígueme.» Lo vio más con la mirada interna de su amor que con los ojos corporales. Jesús vio al publicano y, porque lo amó, lo eligió, y le dijo: Sígueme. «Sígueme», que quiere decir: «imítame.» Le dijo: «Sígueme», más que con sus pasos, con su modo de obrar. Porque, quien dice que está siempre en Cristo debe andar de continuo como él anduvo.
      Él —continúa el texto sagrado— se levantó y lo siguió. No hay que extrañarse del hecho de que aquel recaudador de impuestos, a la primera indicación imperativa del Señor, abandonase su preocupación por las ganancias terrenas y, dejando de lado todas sus riquezas, se adhiriese al grupo que acompañaba a aquel que él veía carecer en absoluto de bienes. Es que el Señor, que lo llamaba por fuera con su voz, lo iluminaba de un modo interior e invisible para que lo siguiera, infundiendo en su mente la luz de la gracia espiritual, para que comprendiese que aquel que aquí en la tierra lo invitaba a dejar sus negocios temporales era capaz de darle en el cielo un tesoro incorruptible.
      Y sucedió que, estando Jesús a la mesa en casa de Mateo, muchos publicanos y pecadores vinieron a colocarse junto a él y a sus discípulos. La conversión de un solo publicano fue una muestra de penitencia y de perdón para muchos otros publicanos y pecadores. Ello fue un hermoso y verdadero presagio, ya que Mateo, que estaba destinado a ser apóstol y maestro de los gentiles, en su primer trato con el Señor arrastró en pos de sí por el camino de la salvación a un considerable grupo de pecadores. De este modo, ya en los inicios de su fe, comienza su ministerio de evangelizador que luego, llegado a la madurez en la virtud, había de desempeñar. Pero, si deseamos penetrar más profundamente el significado de estos hechos, debemos observar que Mateo no sólo ofreció al Señor un banquete corporal en su casa terrena, sino que le preparó, por su fe y por su amor, otro banquete mucho más grato en la casa de su interior, según aquellas palabras del Apocalipsis: Mira que estoy a la puerta y llamo; si alguno escucha mi voz y me abre la puerta entraré en su casa, cenaré con él y él conmigo.
      Nosotros escuchamos su voz, le abrimos la puerta y lo recibimos en nuestra casa, cuando de buen grado prestamos nuestra asentimiento a sus advertencias, ya vengan desde fuera, ya desde dentro, y ponemos por obra lo que conocemos que es voluntad suya. Él entra para cenar con nosotros y nosotros con él, porque por el don de su amor habita en el corazón de los elegidos para saciarlos con la luz de su continua presencia, haciendo que sus deseos tiendan cada vez más hacia las cosas celestiales y deleitándose él mismo en estos deseos como en un manjar sabrosísimo.
    titulo: JESÚS LO VIO Y, PORQUE LO AMÓ, LO ELIGIÓ
  resp2:
    ref: ''
    vr:
    - - R
      - Fue Mateo un hábil escriba, doctísimo en la ley del Dios del cielo, * adiestró su corazón para investigar la ley del Señor, para practicar y enseñar sus mandatos, según el don que él le otorgó misericordiosamente.
    - - V
      - A él fue confiado el Evangelio de la gloria de Dios.
    - - R
      - Adiestró su corazón para investigar la ley del Señor, para practicar y enseñar sus mandatos, según el don que él le otorgó misericordiosamente.
  te_deum: true
  oracion: Dios nuestro, que, en tu inefable misericordia, elegiste a san Mateo, para transformarlo de recaudador de impuestos en un apóstol, haz que también nosotros, imitando su ejemplo y apoyados por su intercesión, te sigamos con fidelidad, cualesquiera que sean las circunstancias de nuestra vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN PÍO DE PIETRELCINA, presbítero:
  grado: Memoria
  fecha: 09-23
  comun: 'Del Común de santos varones: para los santos religiosos.'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De las cartas de San Pío de Pietrelcina
      (Carta 500; 510; Epist.1, 1065; 1093-1095, Edic. 1992)
    texto: |-
      En fuerza de esta obediencia me resuelvo a manifestarle lo que sucedió en mí desde el día 5 por la tarde que se prolongó durante todo el 6 del corriente mes de agosto.
      No soy capaz de decirle lo que pasó a lo largo de este tiempo de superlativo martirio. Me hallaba confesando a nuestros seráficos la tarde del 5, cuando de repente me llené de un espantoso terror ante la visión de un personaje celeste que se me presenta ante los ojos de la inteligencia. Tenía en la mano una especie de dardo, semejante a una larguísima lanza de hierro con una punta muy afilada y parecía como si de esa punta saliese fuego. Ver todo esto y observar que aquel personaje arrojaba con toda violencia tal dardo sobre el alma fue todo uno. A duras penas exhalé un gemido, me parecía morir. Le dije al seráfico que se marchase, porque me sentía mal y no me encontraba con fuerzas para continuar. Este martirio duro sin interrupción hasta la mañana del día siete. No sabría decir cuánto sufrí en este periodo tan luctuoso. Sentía también las entrañas como arrancadas y desgarradas por aquel instrumento mientras todo quedaba sometido a hierro y fuego.
      Y ¿qué decirle con respecto a lo que me pregunta sobre cómo sucedió mi crucifixión? ¡Dios mío, qué confusión y humillación experimento al tener que manifestar lo que tú has obrado en esta tu mezquina criatura!
      Era la mañana del 20 del pasado mes de septiembre en el coro, después de la celebración de la santa misa, sentí una sensación de descanso, semejante a un dulce sueño. Todos los sentidos internos y externos, incluso las mismas facultades del alma se encontraron en una quietud indescriptible. Durante todo esto se hizo un silencio total en torno a mí y dentro de mí; siguió luego una gran paz y abandono en la más completa privación de todo, como un descanso dentro de la propia ruina. Todo esto sucedió con la velocidad del rayo.
      Y mientras sucedía todo esto, me encontré delante de un misterioso personaje, semejante al que había visto la tarde del 5 de agosto, que se diferenciaba de éste solamente en que tenía las manos, los pies y el costado manando sangre. Sólo su visión me aterrorizó; no sabría expresar lo que sentí en aquel momento. Creí morir y habría muerto si el Señor no hubiera intervenido para sostener mi corazón, el cual latía como si se quisiera salir del pecho. La visión del personaje desapareció y yo me encontré con las manos, los pies y el costado traspasados y manando sangre. Imaginad qué desgarro estoy experimentando continuamente casi todos los días. La herida del corazón mana asiduamente sangre, sobre todo desde el jueves por la tarde hasta el sábado.
      Padre mío, yo muero de dolor por el desgarro y la subsiguiente confusión que yo sufro en lo más íntimo del corazón. Temo morir desangrado, si el Señor no escucha los gemidos de mi corazón y retira de mí este peso. ¿Me concederá esta gracia Jesús que es tan bueno? ¿Me quitará al menos esta confusión que experimento por estas señales externas? Alzaré fuerte mi voz a él sin cesar, para que por su misericordia retire de mí la aflicción, no el desgarro ni el dolor, porque lo veo imposible y yo deseo embriagarme de dolor, sino estas señales externas que son para mí de una confusión y humillación indescriptible e insostenible.
      El personaje del que quería hablarle en mi anterior, no es otro que el mismo del que le hablé en otra carta mía y que vi el 5 de agosto. El continúa su actividad sin parar, con gran desgarro del alma. Siento en mi interior como un continuo rumor, como el de una cascada, que está siempre echando sangre. ¡Dios mío!
      Es justo el castigo y recto tu juicio, pero trátame al fin con misericordia. Señor —te diré siempre con tu profeta—: Señor no me corrijas con ira, no me castigues con cólera. Padre mío, ahora que conoces toda mi interioridad, no desdeñes de hacer llegar hasta mí la palabra de consuelo, en medio de tan feroz y dura amargura.
    titulo: ALZARÉ FUERTE MI VOZ A ÉL Y NO CESARÉ
  resp2:
    ref: Mt 16, 24; Hb 12, 2
    vr:
    - - R
      - Si alguno quiere venir en pos de mí, niéguese a sí mismo, * tome su cruz y sígame.
    - - V
      - Cristo en lugar del gozo que se le proponía, soportó la cruz sin miedo a la ignominia.
    - - R
      - Tome su cruz y sígame.
  oracion: Tú, Señor, que concediste a san Pío de Pietrelcina el don de imitar con fidelidad a Cristo pobre y humilde, concédenos también a nosotros, por intercesión de este santo, la gracia de que, viviendo fielmente nuestra vocación, tendamos hacia la perfección que nos propones en la persona de tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE LA MERCED:
  grado: Memoria
  fecha: 09-24
  comun: Del Común de la santísima Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De los Sermones del beato Elredo, abad
      (Sermón 20, En la Natividad de la Virgen María: PL 195, 322-324)
    texto: |-
      Acudamos a la que es su esposa, su madre, su perfecta esclava. Todo esto es María.
      Pero, ¿qué haremos en su presencia? ¿Qué presentes le ofreceremos? ¡Ojalá pudiéramos, por lo menos, devolverle lo que le debemos en justicia! Le debemos honor, servicio, amor, alabanza. Le debemos honor, porque es madre de nuestro Señor. Pues el que no honra a la madre, sin duda deshonra al hijo. Y la Escritura dice: Honra a tu padre y a tu madre.
      ¿Qué más diremos, hermanos? ¿No es ella nuestra madre? Ciertamente, hermanos, es realmente madre nuestra, ya que por ella hemos nacido, no para el mundo, sino para Dios.
      Nos hallábamos todos, como creéis y sabéis, en la muerte, en la caducidad, en las tinieblas, en la miseria. En la muerte, porque habíamos perdido al Señor; en la caducidad, porque estábamos sometidos a la corrupción; en las tinieblas, porque habíamos perdido la luz de la sabiduría, y así estábamos totalmente perdidos.
      Mas, por María, hemos nacido mucho mejor que por Eva, por el hecho de haber nacido de ella Cristo. En vez de la caducidad hemos recobrado la novedad, en vez de la corrupción la incorrupción, en vez de las tinieblas la luz.
      Ella es madre nuestra, madre de nuestra vida, de nuestra incorrupción, de nuestra luz. Dice el Apóstol, refiriéndose a nuestro Señor: Dios lo ha hecho para nosotros sabiduría, justicia, santificación y redención.
      Ella, pues, por ser madre de Cristo, es madre de nuestra sabiduría, de nuestra justicia, de nuestra santificación, de nuestra redención. Por ello es más madre nuestra que la misma madre carnal, ya que nuestro nacimiento de ella es superior; de ella, en efecto, procede nuestra santidad, nuestra sabiduría, nuestra justicia, nuestra santificación, nuestra redención.
      Dice la Escritura: Alabad a Dios por sus santos. Si hemos de alabar a nuestro Señor por sus santos, a través de los cuales realiza portentos y milagros, ¡cuánto más no hemos de alabarlo por aquella en la cual se hizo a sí mismo aquel que es admirable sobre todo lo admirable!
    titulo: MARÍA, MADRE NUESTRA
  resp2:
    ref: ''
    vr:
    - - R
      - Dichosa eres, santa Virgen María, y digna de toda alabanza. * De ti nació el sol de justicia, Cristo, nuestro Dios, por quien hemos sido salvados y redimidos.
    - - V
      - Celebremos con gozo esta fiesta de santa María Virgen.
    - - R
      - De ti nació el sol de justicia, Cristo, nuestro Dios, por quien hemos sido salvados y redimidos.
  oracion: Señor, Dios nuestro, en tu admirable providencia quisiste que la Madre de tu único Hijo experimentase las angustias y los sufrimientos humanos; por la intercesión de María, consuelo de los afligidos y libertadora de los cautivos, concede a los que sufren cualquier modo de esclavitud la verdadera libertad de los hijos de Dios. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN VICENTE DE PAÚL, presbítero:
  grado: Memoria
  fecha: 09-27
  comun: 'Del Común de santos varones: para los santos que se distinguieron por el ejercicio de las obras de misericordia. Salterio'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De los Escritos de san Vicente de Paúl, presbítero.
      (Carta 2.546: «Correspondance, entretiens, documents», París 1922-1925, 7)
    texto: |-
      Nosotros no debemos estimar a los pobres por su apariencia externa o su modo de vestir, ni tampoco por sus cualidades personales, ya que con frecuencia son rudos e incultos. Por el contrario, si consideráis a los pobres a la luz de la fe, os daréis cuenta de que representan el papel del Hijo de Dios, ya que él quiso también ser pobre. Y así, aun cuando en su pasión perdió casi la apariencia humana, haciéndose necio para los gentiles y escándalo para los judíos, sin embargo, se presentó a éstos como evangelizador de los pobres: Me envió a evangelizar a los pobres. También nosotros debemos estar imbuidos de estos sentimientos e imitar lo que Cristo hizo, cuidando de los pobres, consolándolos, ayudándolos y apoyándolos.
      Cristo, en efecto, quiso nacer pobre, llamó junto a sí a unos discípulos pobres, se hizo él mismo servidor de los pobres, y de tal modo se identificó con ellos, que dijo que consideraría como hecho a él mismo todo el bien o el mal que se hiciera a los pobres. Porque Dios ama a los pobres y, por lo mismo, ama también a los que aman a los pobres, ya que, cuando alguien tiene un afecto especial a una persona, extiende este afecto a los que dan a aquella persona muestras de amistad o de servicio. Por esto nosotros tenemos la esperanza de que Dios nos ame, en atención a los pobres. Por esto, al visitarlos, esforcémonos en cuidar del pobre y desvalido, compartiendo sus sentimientos, de manera que podamos decir como el Apóstol: Me he hecho todo para todos. Por lo cual todo nuestro esfuerzo ha de tender a que, conmovidos por las inquietudes y miserias del prójimo, roguemos a Dios que infunda en nosotros sentimientos de misericordia y compasión, de manera que nuestros corazones estén siempre llenos de estos sentimientos.
      El servicio a los pobres ha de ser preferido a todo, y hay que prestarlo sin demora. Por esto, si en el momento de la oración hay que llevar a algún pobre un medicamento o un auxilio cualquiera, id a él con el ánimo bien tranquilo y haced lo que convenga, ofreciéndolo a Dios como una prolongación de la oración. Y no tengáis ningún escrúpulo ni remordimiento de conciencia si, por prestar algún servicio a los pobres, habéis dejado la oración; salir de la presencia de Dios por alguna de las causas enumeradas no es ningún desprecio a Dios, ya que es por él por quien lo hacemos.
      Así pues, si dejáis la oración para acudir con presteza en ayuda de algún pobre, recordad que aquel servicio lo prestáis al mismo Dios. La caridad, en efecto, es la máxima norma, a la que todo debe tender: ella es una ilustre señora, y hay que cumplir lo que ordena. Renovemos, pues, nuestro espíritu de servicio a los pobres, principalmente para con los abandonados y desamparados, ya que ellos nos han sido dados para que los sirvamos como a señores.
    titulo: EL SERVICIO A LOS POBRES HA DE SER PREFERIDO A TODO
  resp2:
    ref: 1Co 9, 19. 22; Jb 29, 15-16
    vr:
    - - R
      - Siendo libre en todo, me he hecho esclavo de todos. Me he hecho débil con los débiles. * Me he hecho todo para todos, para salvarlos a todos.
    - - V
      - Yo era ojos para el ciego y pies para el cojo; yo era padre de los pobres.
    - - R
      - Me he hecho todo para todos, para salvarlos a todos.
  oracion: Señor, tú que adornaste a san Vicente de Paúl con las cualidades de un verdadero apóstol, para que se entregara al servicio de los pobres y a la formación de los ministros de tu Iglesia, concédenos a nosotros que, animados por un celo semejante al suyo, amemos lo que él amó y practiquemos lo que él enseñó. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS ARCÁNGELES MIGUEL GABRIEL Y RAFAEL:
  grado: Fiesta
  fecha: 09-29
  himno: «¿Quién como Dios?», fue el grito de victoria
  salmodia:
  - ant: Se agitó el mar y se estremeció la tierra cuando el arcángel Miguel bajó del cielo.
    salmo: salmo-96
  - ant: 'El ángel Gabriel se apareció a Zacarías y le dijo: «Isabel, tu mujer, te dará a luz un hijo, al que pondrás el nombre de Juan.»'
    salmo: salmo-102-i
  - ant: Yo soy Rafael, uno de los ángeles que están al servicio de Dios; a él debéis bendecir y narrar todas sus maravillas.
    salmo: salmo-102-ii
  versiculo:
  - - V
    - Bendecid al Señor, ángeles suyos.
  - - R
    - Poderosos ejecutores de sus órdenes.
  lectura1:
    ref: Del libro del Apocalipsis 12, 1-17
    texto: |-
      Una gran señal apareció en el cielo: una Mujer, vestida del sol, con la luna bajo sus pies, y una corona de doce estrellas sobre su cabeza; está encinta, y grita con los dolores del parto y con el tormento de dar a luz. Apareció otra señal en el cielo: una gran Serpiente roja, con siete cabezas y diez cuernos, y sobre sus cabezas siete diademas. Su cola arrastra la tercera parte de las estrellas del cielo y las precipitó sobre la tierra. La Serpiente se detuvo delante de la Mujer que iba a dar a luz, para devorar a su Hijo en cuanto lo diera a luz.
      La Mujer dio a luz un Hijo varón, el que ha de regir a todas las naciones con cetro de hierro, y su Hijo fue arrebatado hasta Dios y hasta su trono. la Mujer huyó al desierto, donde tiene un lugar preparado por Dios para ser allí alimentada mil doscientos sesenta días.
      Entonces se entabló una batalla en el cielo: Miguel y sus ángeles combatieron con la Serpiente. También la Serpiente y sus ángeles combatieron, pero no prevalecieron y no hubo ya en el cielo lugar para ellos. Fue arrojada la gran Serpiente, la Serpiente antigua, el llamado Diablo y Satanás, el seductor del mundo entero; fue arrojada a la tierra y sus ángeles fueron arrojados con ella.
      Oí entonces una fuerte voz que decía en el cielo:
      «Ahora se estableció la salud y el poderío, y el reinado de nuestro Dios, y la potestad de su Cristo; porque fue precipitado el acusador de nuestros hermanos, el que los acusaba ante nuestro Dios día y noche. Ellos lo vencieron en virtud de la sangre del Cordero y por la palabra del testimonio que dieron, y no amaron tanto su vida que temieran la muerte. Por esto, estad alegres, cielos, y los que moráis en sus tiendas. ¡Ay de la tierra y del mar!, porque el Diablo ha bajado donde vosotros con gran furor, sabiendo que le queda poco tiempo.»
      Cuando la Serpiente vio que había sido arrojada a la tierra, persiguió a la Mujer que había dado a luz al Hijo varón. Pero se le dieron a la Mujer las dos alas del águila grande para volar al desierto, a su lugar, lejos de la Serpiente, donde tiene que ser alimentada un tiempo, algunos tiempos y medio tiempo.
      Entonces la Serpiente vomitó de su boca detrás de la Mujer como un río de agua, para arrastrarla con su corriente. Pero la tierra vino en auxilio de la Mujer; abrió la tierra su boca y tragó al río vomitado de la boca de la Serpiente. Entonces, despechada la Serpiente contra la Mujer, se fue a hacer la guerra al resto de sus hijos, los que guardan los mandamientos de Dios y mantienen el testimonio de Jesús.
    titulo: COMBATE DE MIGUEL CON EL DRAGÓN
  resp1:
    ref: Ap 8, 1; cf. 12, 7. 10
    vr:
    - - R
      - 'Se hizo un silencio en el cielo, mientras combatía el arcángel Miguel con la Serpiente, y se oyó una voz que decía: * «¡Victoria, honor y poder al Dios omnipotente!»'
    - - V
      - Ahora se estableció la salud y el poderío, y el reinado de nuestro Dios, y la potestad de su Cristo.
    - - R
      - ¡Victoria, honor y poder al Dios omnipotente!
  lectura2:
    autor: |-
      De las Homilías de san Gregorio Magno, papa, sobre los Evangelios
      (Homilía 34, 8-9: PL 76, 1250-1251)
    texto: |-
      Hay que saber que el nombre de «ángel» designa la función, no el ser, del que lo lleva. En efecto, aquellos santos espíritus de la patria celestial son siempre espíritus, pero no siempre pueden ser llamados ángeles, ya que solamente lo son cuando ejercen su oficio de mensajeros. Los que transmiten mensajes de menor importancia se llaman ángeles, los que anuncian cosas de gran trascendencia se llaman arcángeles.
      Por esto a la Virgen María no le fue enviado un ángel cualquiera, sino el arcángel Gabriel, ya que un mensaje de tal trascendencia requería que fuese transmitido por un ángel de la máxima categoría.
      Por la misma razón se les atribuyen también nombres personales, que designan cuál es su actuación propia. Porque en aquella ciudad santa, allí donde la visión del Dios omnipotente da un conocimiento perfecto de todo, no son necesarios estos nombres propios para conocer a las personas, pero sí lo son para nosotros, ya que a través de estos nombres conocemos cuál es la misión específica para la cual nos son enviados. Y, así, «Miguel» significa: «¿Quién como Dios?», «Gabriel» significa: «Fortaleza de Dios» y «Rafael» significa: «Medicina de Dios».
      Por esto, cuando se trata de alguna misión que requiera un poder especial, es enviado Miguel, dando a entender por su actuación y por su nombre que nadie puede hacer lo que sólo Dios puede hacer. De ahí que aquel antiguo enemigo, que por su soberbia pretendió igualarse a Dios, diciendo: Escalaré los cielos, por encima de los astros divinos levantaré mi trono, me igualaré al Altísimo, nos es mostrado luchando contra el arcángel Miguel, cuando al fin del mundo será desposeído de su poder y destinado al extremo suplicio, como nos lo presenta Juan: Se entabló una batalla con el arcángel Miguel.
      A María le fue enviado Gabriel, cuyo nombre significa: «Fortaleza de Dios», porque venía a anunciar a aquel que, a pesar de su apariencia humilde, había de reducir a los Principados y Potestades. Era, pues, natural que aquel que es la fortaleza de Dios anunciara la venida del que es el Señor de los ejércitos y héroe en las batallas.
      «Rafael» significa, como dijimos: «Medicina de Dios»; este nombre le viene del hecho de haber curado a Tobías, cuando, tocándole los ojos con sus manos, lo libró de las tinieblas de su ceguera. Si, pues, había sido enviado a curar, con razón es llamado «Medicina de Dios».
    titulo: El NOMBRE DE «ÁNGEL» DESIGNA LA FUNCIÓN, NO EL SER
  resp2:
    ref: Ap 8, 3. 4; Dn 7, 10
    vr:
    - - R
      - El ángel se puso en pie junto al altar, con un incensario de oro. Y se le dio gran cantidad de incienso; * Y el humo del incienso subió a la presencia de Dios, de mano del ángel.
    - - V
      - Miles de millares le servían, miríadas de miríadas estaban en pie delante de él.
    - - R
      - y el humo del incienso subió a la presencia de Dios, de mano del ángel.
  te_deum: true
  oracion: Señor Dios todopoderoso, que, con una providencia admirable, llamas a los ángeles y a los hombres para que cooperen a tu plan de salvación, haz que, durante nuestro peregrinar en la tierra, nos sintamos siempre protegidos por los ángeles, que en el cielo están en tu presencia para servirte y gozan ya contemplando tu rostro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JERÓNIMO, presbítero y doctor de la iglesia:
  grado: Memoria
  fecha: 09-30
  comun: Del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      Del prólogo al comentario de san Jerónimo, presbítero, sobre el libro del profeta Isaías.
      (Núms. 1. 2: CCL 73, 1-3)
    texto: |-
      Cumplo con mi deber, obedeciendo los preceptos de Cristo, que dice: Ocupaos en examinar las Escrituras, y también: Buscad y hallaréis, para que no tenga que decirme, como a los judíos: Estáis en un error; no entendéis las Escrituras ni el poder de Dios. Pues si, como dice el apóstol Pablo, Cristo es el poder de Dios y la sabiduría de Dios, y el que no conoce las Escrituras no conoce el poder de Dios ni su sabiduría, de ahí se sigue que ignorar las Escrituras es ignorar a Cristo.
      Por esto quiero imitar al amo de casa, que de su provisión saca lo nuevo y lo antiguo, y a la esposa que dice en el Cantar de los cantares: He guardado para ti, mi amado, lo nuevo y lo antiguo; y, así, expondré el libro de Isaías, haciendo ver en él no sólo al profeta, sino también al evangelista y apóstol. Él, en efecto, refiriéndose a sí mismo y a los demás evangelistas, dice: ¡Qué hermosos son los pies de los que anuncian el bien, de los que anuncian la paz! Y Dios le habla como a un apóstol, cuando dice: ¿A quién mandaré? ¿Quién irá a ese pueblo? Y él responde: Aquí estoy, mándame.
      Nadie piense que yo quiero resumir en pocas palabras el contenido de este libro, ya que él abarca todos los misterios del Señor: predice, en efecto, al Emmanuel que nacerá de la Virgen, que realizará obras y signos admirables, que morirá, será sepultado y resucitará del país de los muertos, y será el Salvador de todos los hombres.
      ¿Para qué voy a hablar de física, de ética, de lógica? Este libro es como un compendio de todas las Escrituras y encierra en sí cuanto es capaz de pronunciar la lengua humana y sentir el hombre mortal. El mismo libro contiene unas palabras que atestiguan su carácter misterioso y profundo: Cualquier visión se os volverá —dice— como el texto de un libro sellado: se lo dan a uno que sabe leer, diciéndole: «Por favor, lee esto». Y él responde: «No puedo, porque está sellado». Y se lo dan a uno que no sabe leer, diciéndole: «Por favor, lee esto». Y el responde: «No sé leer».
      Y si a alguno le parece débil esta argumentación, que oiga lo que dice el Apóstol: Cuanto a los dotados del carisma de profecía, que hablen dos o tres, y que los demás den su dictamen; y, si algún otro que está sentado recibiera una revelación, que calle el que está hablando. ¿Qué razón tienen los profetas para silenciar su boca, para callar o hablar, si el Espíritu es quien habla por boca de ellos? Por consiguiente, si recibían del Espíritu lo que decían, las cosas que comunicaban estaban llenas de sabiduría y de sentido. Lo que llegaba a oídos de los profetas no era el sonido de una voz material, sino que era Dios quien hablaba en su interior, como dice uno de ellos: El ángel que hablaba en mí, y también: Que clama en nuestros corazones: «¡Padre!», y asimismo: Voy a escuchar lo que dice el Señor.
    titulo: IGNORAR LAS ESCRITURAS ES IGNORAR A CRISTO
  resp2:
    ref: 2Tm 3, 16-17; Pr 28, 7
    vr:
    - - R
      - Todas las partes de la Escritura están inspiradas por Dios y son útiles para instruir y para educar en la buena conducta, * así, el siervo de Dios se hará perfecto y estará preparado para toda buena obra.
    - - V
      - El que guarda la ley es hijo prudente.
    - - R
      - Así, el siervo de Dios se hará perfecto y estará preparado para toda buena obra.
  oracion: Oh Dios, que concediste a san Jerónimo saber gustar de la sagrada Escritura y vivirla intensamente, haz que tu pueblo se alimente cada vez más en tu palabra y encuentre en ella la fuente de la vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA TERESA DEL NIÑO JESÚS:
  grado: Memoria
  fecha: 10-01
  comun: Del Común de vírgenes.
  himno: Esta mujer no quiso
  lectura2:
    autor: |-
      De la Narración de la vida de santa Teresa del Niño Jesús, virgen, escrita por ella misma
      (« Manuscrits autobiographiques», Lisieux 1957, 227-229)
    texto: |-
      Teniendo un deseo inmenso del martirio, acudí a las cartas de san Pablo, para tratar de hallar una respuesta. Mis ojos dieron casualmente con los capítulos doce y trece de la primera carta a los Corintios, y en el primero de ellos leí que no todos pueden ser al mismo tiempo apóstoles, profetas y doctores, que la Iglesia consta de diversos miembros y que el ojo no puede ser al mismo tiempo mano. Una respuesta bien clara, ciertamente, pero no suficiente para satisfacer mis deseos y darme la paz.
      Continué leyendo sin desanimarme, y encontré esta consoladora exhortación: Aspirad a los dones más excelentes; yo quiero mostraros un camino todavía mucho mejor. El Apóstol, en efecto, hace notar cómo los mayores dones sin la caridad no son nada y cómo esta misma caridad es el mejor camino para llegar a Dios de un modo seguro. Por fin había hallado la tranquilidad.
      Al contemplar el cuerpo místico de la Iglesia, no me había reconocido a mi misma en ninguno de los miembros que san Pablo enumera, sino que lo que yo deseaba era más bien verme en todos ellos. En la caridad descubrí el quicio de mi vocación. Entendí que la Iglesia tiene un cuerpo resultante de la unión de varios miembros, pero que en este cuerpo no falta el más necesario y noble de ellos: entendí que la Iglesia tiene un corazón y que este corazón está ardiendo en amor. Entendí que sólo el amor es el que impulsa a obrar a los miembros de la Iglesia y que, si faltase este amor, ni los apóstoles anunciarían ya el Evangelio, ni los mártires derramarían su sangre. Reconocí claramente y me convencí de que el amor encierra en sí todas las vocaciones, que el amor lo es todo, que abarca todos los tiempos y lugares, en una palabra, que el amor es eterno.
      Entonces, llena de una alegría desbordante, exclamé:
      «Oh Jesús, amor mío, por fin he encontrado mi vocación: mi vocación es el amor. Sí, he hallado mi propio lugar en la Iglesia, y este lugar es el que tú me has señalado, Dios mío. En el corazón de la Iglesia, que es mi madre, yo seré el amor; de este modo lo seré todo y mi deseo se verá colmado.»
    titulo: EN El CORAZÓN DE LA IGLESIA, YO SERÉ El AMOR
  resp2:
    ref: Cf. Sal 20,4; cf. Jb 31, 18; cf. Ef 3, 18; Sal 30, 20
    vr:
    - - R
      - Te adelantaste, Señor, a bendecirme con tu amor, el cual fue creciendo conmigo desde mi infancia; * y aun ahora no alcanzo a comprender la profundidad de tu amor.
    - - V
      - ¡Qué bondad tan grande, Señor, reservas para tus fieles!
    - - R
      - y aun ahora no alcanzo a comprender la profundidad de tu amor.
  oracion: Dios y Padre nuestro, que abres las puertas de tu reino a los pequeños y a los humildes, haz que sigamos confiadamente el camino de sencillez que siguió santa Teresa del Niño Jesús, para que, por su intercesión, también nosotros lleguemos a descubrir aquella gloria que permanece escondida a los sabios y a los prudentes según el mundo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LOS SANTOS ÁNGELES CUSTODIOS:
  grado: Memoria
  fecha: 10-02
  himno: Ángeles de la mañana
  lectura2:
    autor: |-
      De los Sermones de san Bernardo, abad
      (Sermón 12 sobre el salmo «Qui habitat», 3, 6-8: Opera omnia, edición cisterciense, 4 [1966], 458-462)
    texto: |-
      A sus ángeles ha dado órdenes para que te guarden en tus caminos. Den gracias al Señor por su misericordia, por las maravillas que hace con los hombres. Den gracias y digan entre los gentiles: «El Señor ha estado grande con ellos.» Señor, ¿qué es el hombre para que le des importancia, para que te ocupes de él? Porque te ocupas ciertamente de él, demuestras tu solicitud y tu interés para con él. Llegas hasta enviarle tu Hijo único, le infundes tu Espíritu, incluso le prometes la visión de tu rostro. Y, para que ninguno de los seres celestiales deje de tomar parte en esta solicitud por nosotros, envías a los espíritus bienaventurados para que nos sirvan y nos ayuden, los constituyes nuestros guardianes, mandas que sean nuestros ayos.
      A sus ángeles ha dado órdenes para que te guarden en tus caminos. Estas palabras deben inspirarte una gran reverencia, deben infundirte una gran devoción y conferirte una gran confianza. Reverencia por la presencia de los ángeles, devoción por su benevolencia, confianza por su custodia. Porque ellos están presentes junto a ti, y lo están para tu bien. Están presentes para protegerte, lo están en beneficio tuyo. Y, aunque lo están porque Dios les ha dado esta orden, no por ello debemos dejar de estarles agradecidos, pues que cumplen con tanto amor esta orden y nos ayudan en nuestras necesidades, que son tan grandes.
      Seamos, pues, devotos y agradecidos a unos guardianes tan eximios; correspondamos a su amor, honrémoslos cuanto podamos y según debemos. Sin embargo, no olvidemos que todo nuestro amor y honor ha de tener por objeto a aquel de quien procede todo, tanto para ellos como para nosotros, gracias al cual podemos amar y honrar, ser amados y honrados.
      En él, hermanos, amemos con verdadero afecto a sus ángeles, pensando que un día hemos de participar con ellos de la misma herencia y que, mientras llega este día, el Padre los ha puesto junto a nosotros, a manera de tutores y administradores. En efecto, ahora somos ya hijos de Dios, aunque ello no es aún visible, ya que, por ser todavía menores de edad, estamos bajo tutores y administradores, como si en nada nos distinguiéramos de los esclavos.
      Por lo demás, aunque somos menores de edad y aunque nos queda por recorrer un camino tan largo y tan peligroso, nada debemos temer bajo la custodia de unos guardianes tan eximios. Ellos, los que nos guardan en nuestros caminos, no pueden ser vencidos ni engañados, y menos aún pueden engañarnos. Son fieles, son prudentes, son poderosos: ¿por qué espantarnos? Basta con que los sigamos, con que estemos unidos a ellos, y viviremos así a la sombra del Omnipotente.
    titulo: QUE TE GUARDEN EN TUS CAMINOS
  resp2:
    ref: Sal 90, 11-12. 10
    vr:
    - - R
      - A sus ángeles ha dado órdenes para que te guarden en tus caminos; * te llevarán en sus palmas, para que tu pie no tropiece en la piedra.
    - - V
      - No se te acercará la desgracia, ni la plaga llegará hasta tu tienda.
    - - R
      - Te llevarán en sus palmas, para que tu pie no tropiece en la piedra.
  oracion: Dios, Padre misericordioso, que, en tu providencia inefable, te has dignado enviar, para nuestra guarda, a tus santos ángeles, concede a quienes te suplican ser siempre defendidos por su protección y gozar eternamente de su compañía. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO DE ASÍS:
  grado: Memoria
  fecha: 10-04
  comun: 'Del Común de santos varones: para los santos religiosos.'
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De las Cartas de san Francisco de Asís, dirigidas a todos los fieles
      (Opúsculos, edición Quaracchi [Florencia], 1949, 87-94)
    texto: |-
      La venida al mundo del Verbo del Padre, tan digno, tan santo y tan glorioso, fue anunciada por el Padre altísimo, por boca de su santo arcángel Gabriel, a la santa y gloriosa Virgen María, de cuyo seno recibió una auténtica naturaleza humana, frágil como la nuestra. Él, siendo rico sobre toda ponderación, quiso elegir la pobreza, junto con su santísima madre. Y, al acercarse su pasión, celebró la Pascua con sus discípulos. Luego oró al Padre, diciendo: Padre mío, si es posible, que pase de mi este cáliz.
      Sin embargo, sometió su voluntad a la del Padre. Y la voluntad del Padre fue que su Hijo bendito y glorioso, a quien entregó por nosotros y que nació por nosotros, se ofreciese a sí mismo como sacrificio y víctima en el ara de la cruz, con su propia sangre, no por sí mismo, por quien han sido hechas todas las cosas, sino por nuestros pecados, dejándonos un ejemplo para que sigamos sus huellas. Y quiere que todos nos salvemos por él y lo recibamos con puro corazón y cuerpo casto.
      ¡Qué dichosos y benditos son los que aman al Señor y cumplen lo que dice el mismo Señor en el Evangelio: Amarás al Señor, tu Dios, con todo tu corazón y con toda tu alma y a tu prójimo como a ti mismo! Amemos, pues, a Dios y adoremoslo con puro corazón y con mente pura, ya que él nos hace saber cuál es su mayor deseo, cuando dice: Los verdaderos adoradores adorarán al Padre en espíritu y en verdad. Porque todos los que lo adoran deben adorarlo en espíritu y en verdad. Y dirijámosle, día y noche, nuestra alabanza y oración, diciendo: Padre nuestro, que estás en el cielo; porque debemos orar siempre y no desfallecer jamás.
      Procuremos, además, dar frutos de verdadero arrepentimiento. Y amemos al prójimo como a nosotros mismos. Tengamos caridad y humildad y demos limosna, ya que ésta lava las almas de la inmundicia del pecado. En efecto, los hombres pierden todo lo que dejan en este mundo; tan sólo se llevan consigo el premio de su caridad y las limosnas que practicaron, por las cuales recibirán del Señor la recompensa y una digna remuneración.
      No debemos ser sabios y prudentes según la carne, sino más bien sencillos, humildes y puros. Nunca debemos desear estar por encima de los demás, sino, al contrarío, debemos, a ejemplo del Señor, vivir como servidores y sumisos a toda humana creatura, movidos por el amor de Dios. El Espíritu del Señor reposará sobre los que así obren y perseveren hasta el fin, y los convertirá en el lugar de su estancia y su morada, y serán hijos del Padre celestial, cuyas obras imitan; ellos son los esposos, los hermanos y las madres de nuestro Señor Jesucristo.
    titulo: DEBEMOS SER SENCILLOS, HUMILDES Y PUROS
  resp2:
    ref: Mt 5, 3-4. 6
    vr:
    - - R
      - Dichosos los pobres de espíritu, porque de ellos es el reino de los cielos . * Dichosos los sufridos, porque ellos heredarán la tierra.
    - - V
      - Dichosos los que tienen hambre y sed de ser justos, porque ellos quedarán saciados.
    - - R
      - Dichosos los sufridos, porque ellos heredarán la tierra.
  oracion: Señor Dios, que en el pobre y humilde Francisco de Asís has dado a tu Iglesia una imagen viva de Jesucristo, haz que nosotros, siguiendo su ejemplo, imitemos a tu Hijo y vivamos, como este santo, unidos a ti en el gozo del amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL ROSARIO:
  grado: Memoria
  fecha: 10-07
  comun: Del Común de la Santísima Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De los Sermones de san Bernardo, abad
      (Sermón sobre el Acueducto: Opera omnia, edición cisterciense, 5 [1968], 282-283)
    texto: |-
      El hijo, en ti engendrado, será santo, será Hijo de Dios. ¡La fuente de la sabiduría, la Palabra del Padre en las alturas! Esta Palabra, por tu mediación, Virgen santa, se hará carne, de manera que el mismo que afirma: Yo estoy en el Padre y el Padre está en mí podrá afirmar igualmente: Procedo y vengo del Padre.
      Ya al comienzo de las cosas —dice el Evangelio— existía la Palabra. Manaba ya la fuente, pero hasta entonces sólo dentro de sí misma. Y continúa el texto Sagrado: Y la Palabra estaba con Dios, es decir, morando en la luz inaccesible; y el Señor decía desde el principio: Mis designios son de paz y no de aflicción. Pero tus designios están escondidos en ti, y nosotros no los conocemos; porque, ¿quién había penetrado la mente del Señor?, o ¿quién había sido su consejero?
      Pero llegó el momento en que estos designios de paz se convirtieron en obra de paz: La Palabra se hizo carne y ha puesto ya su morada entre nosotros; ha puesto ciertamente su morada por la fe en nuestros corazones, ha puesto su morada en nuestra memoria, ha puesto su morada en nuestro pensamiento y desciende hasta la misma imaginación. En efecto, ¿qué idea de Dios hubiera podido antes formarse el hombre, que no fuese un ídolo fabricado por su corazón? Era incomprensible e inaccesible, invisible y superior a todo pensamiento humano; pero ahora ha querido ser comprendido, visto, accesible a nuestra inteligencia.
      ¿De qué modo?, te preguntarás. Pues yaciendo en un pesebre, reposando en el regazo virginal, predicando en la montaña, pasando la noche en oración; o bien pendiente de la cruz, en la lividez de la muerte, libre entre los muertos y dominando sobre el poder de la muerte, como también resucitando al tercer día y mostrando a los apóstoles la marca de los clavos, como signo de victoria, y subiendo finalmente ante la mirada de ellos hasta lo más íntimo de los cielos.
      ¿Hay algo de esto que no sea objeto de una verdadera, piadosa y santa meditación? Cuando medito en cualquiera de estas cosas, mi pensamiento va hasta Dios y, a través de todas ellas, llego hasta mi Dios. A esta meditación la llamo sabiduría, y para mí la prudencia consiste en ir saboreando en la memoria la dulzura que la vara sacerdotal infundió tan abundantemente en estos frutos, dulzura de la que María disfruta con toda plenitud en el cielo y la derrama abundantemente sobre nosotros.
    titulo: CONVIENE MEDITAR LOS MISTERIOS DE SALVACIÓN
  resp2:
    ref: ''
    vr:
    - - R
      - 'Virgen María, no hay quien se asemeje a ti entre las hijas de Jerusalén: tú eres la madre del Rey de los reyes, tú la señora de los ángeles, tú la reina de los cielos. * Bendita tú entre las mujeres y bendito el fruto de tu vientre.'
    - - V
      - Alégrate, llena de gracia, el Señor está contigo.
    - - R
      - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  oracion: Señor, que por el anuncio del ángel nos has hecho conocer la encarnación de tu Hijo, infunde tu gracia en nosotros y concédenos, por la intercesión de la Santísima Virgen María, que podamos alcanzar, por la virtud de la pasión y de la cruz de tu Hijo Jesucristo, la gloria de su resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL PILAR:
  grado: Fiesta
  fecha: 10-12
  comun: Del Común de la Santísima Virgen María.
  himno: Lucero de la mañana
  salmodia:
  - ant: María ha recibido la bendición del Señor y la misericordia de Dios, su salvador.
    salmo: salmo-23
  - ant: El Altísimo consagra su morada.
    salmo: salmo-45
  - ant: ¡Qué pregón tan glorioso para ti, Virgen María!
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas.
  - - R
    - Meditándolas en su corazón.
  lectura1:
    ref: De la carta del apóstol san Pablo a los Gálatas 3, 22—4, 7
    texto: |-
      Hermanos: La Escritura ha declarado que todos los hombres son culpables de pecado, para que así la promesa se concediese a los creyentes, por su fe en Jesucristo.
      Antes de venir la economía de la fe, estábamos encerrados bajo la custodia de la ley, en espera de la fe que había de revelarse. De este modo la ley fue nuestro ayo para llevarnos a Cristo, a fin de ser justificados por la fe. Pero, una vez llegada la era de la fe, no estamos más bajo la potestad del ayo, pues ya sois todos hijos de Dios por la fe en Cristo Jesús.
      En efecto, todos los que habéis sido bautizados en Cristo os habéis revestido de Cristo. Ya no hay distinción entre judío y gentil, ni entre libre y esclavo, ni entre hombre y mujer: todos sois uno en Cristo Jesús. Y si sois de Cristo sois por lo mismo descendencia de Abraham, herederos según la promesa.
      Pongo también otra comparación: El heredero, mientras es menor de edad, con ser dueño de todo, no se distingue en nada del esclavo: está bajo tutores y administradores hasta el tiempo prefijado por su padre. De igual modo: Nosotros, cuando éramos menores de edad, vivíamos esclavizados por los «elementos del mundo».
      Pero, cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción. Y la prueba de que sois hijos es que Dios ha enviado a vuestros corazones el Espíritu de su Hijo, que clama: «¡Padre!» Por consiguiente, ya no eres esclavo, sino hijo; y, si eres hijo, también eres heredero por voluntad de Dios.
    titulo: POR LA FE, SOMOS HIJOS Y HEREDEROS DE DIOS
  resp1:
    ref: Cf. Ga 4, 4-5; Ef 2,4; Rm 8,3
    vr:
    - - R
      - Mirad que ya se cumplió el tiempo, y ha enviado Dios a su Hijo a la tierra, nacido de una Virgen, nacido bajo la ley, * para rescatar a los que estaban bajo la ley.
    - - V
      - Por el gran amor con que nos amó, envió a su propio Hijo, sometido a una existencia semejante a la de la carne de pecado.
    - - R
      - Para rescatar a los que estaban bajo la ley.
  lectura2:
    autor: Elogio de la Virgen del Pilar
    texto: |-
      Según una piadosa y antigua tradición, ya desde los albores de su conversión, los primitivos cristianos levantaron una ermita en honor de la Virgen María, a las orillas del Ebro, en la ciudad de Zaragoza. La primitiva y pequeña capilla, con el correr de los siglos, se ha convertido hoy en una basílica grandiosa que acoge, como centro vivo y permanente de peregrinaciones, a innumerables fieles que, desde todas las partes del mundo, vienen a rezar a la Virgen y a venerar su Pilar.
      La advocación de nuestra Señora del Pilar ha sido objeto de un especial culto por parte de los españoles: difícilmente podrá encontrarse en el amplio territorio patrio un pueblo que no guarde con amor la pequeña imagen sobre la santa columna. Muchas instituciones la veneran también como patrona.
      Muy por encima de milagros espectaculares, de manifestaciones clamorosas y de organizaciones masivas, la virgen del Pilar es invocada como refugio de pecadores, consoladora de los afligidos, madre de España. Su quehacer es, sobre todo, espiritual. Y su basílica en Zaragoza es un lugar privilegiado de oración, donde sopla con fuerza el Espíritu.
      La devoción al Pilar tiene una gran repercusión en Iberoamérica, cuyas naciones celebran la fiesta del descubrimiento de su continente el doce de octubre, es decir, el mismo día del Pilar. Como prueba de su devoción a la Virgen, los numerosos mantos que cubren la sagrada imagen y las banderas que hacen guardia de honor a la Señora ante su santa capilla testimonian la vinculación fraterna que Iberoamérica tiene, por el Pilar, con la patria española.
      Abierta la basílica durante todo el día, jamás faltan fieles que llegan al Pilar en busca de reconciliación, gracia y diálogo con Dios.
    titulo: EL PILAR, LUGAR PRIVILEGIADO DE ORACIÓN Y DE GRACIA
  resp2:
    ref: Sal 71, 6. 19; Ap 21, 3
    vr:
    - - R
      - Que baje como lluvia sobre el césped. * Que la gloria de Dios llene la tierra.
    - - V
      - Esta es la morada de Dios con los hombres, y acampará entre ellos; ellos serán su pueblo y Dios estará con ellos.
    - - R
      - Que la gloria de Dios llene la tierra.
  te_deum: true
  oracion: Dios todopoderoso y eterno, que en la gloriosa Madre de tu Hijo has concedido un amparo celestial a cuantos la invocan con la secular advocación del Pilar, concédenos, por su intercesión, fortaleza en la fe, seguridad en la esperanza y constancia en el amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA TERESA DE JESÚS, virgen y doctora de la Iglesia:
  grado: Memoria
  fecha: 10-15
  comun: Del Común de vírgenes.
  himno: Vivo sin vivir en mí
  lectura2:
    autor: |-
      De las Obras de santa Teresa de Jesús, virgen y doctora de la Iglesia.
      (Libro de su vida, cap. 22, 6-7. 12. 14)
    texto: |-
      Con tan buen amigo presente —nuestro Señor Jesucristo—, con tan buen capitán, que se puso en lo primero en el padecer, todo se puede sufrir. Él ayuda y da esfuerzo, nunca falta, es amigo verdadero. Y veo yo claro, y he visto después, que para contentar a Dios y que nos haga grandes mercedes quiere que sea por manos de esta Humanidad sacratísima, en quien dijo Su Majestad se deleita.
      Muy muchas veces lo he visto por experiencia; hámelo dicho el Señor. He visto claro que por esta puerta hemos de entrar, si queremos nos muestre la soberana Majestad grandes secretos. Así que no queramos otro camino, aunque estemos en la cumbre de contemplación; por aquí vamos seguros. Este Señor nuestro es por quien nos vienen todos los bienes. Él lo enseñará; mirando su vida, es el mejor dechado.
      ¿Qué más queremos que un tan buen amigo al lado, que no nos dejará en los trabajos y tribulaciones, como hacen los del mundo? Bienaventurado quien de verdad le amare y siempre le trajere cabe de sí. Miremos al glorioso san Pablo, que no parece se le caía de la boca siempre Jesús, como quien le tenía bien en el corazón. Yo he mirado con cuidado, después que esto he entendido, de algunos santos, grandes contemplativos, y no iban por otro camino: san Francisco, san Antonio de Padua, san Bernardo, santa Catalina de Siena.
      Con libertad se ha de andar en este camino, puestos en las manos de Dios; si su Majestad nos quisiere subir a ser de los de su cámara y secreto, ir de buena gana.
      Siempre que se piense de Cristo, nos acordemos del amor con que nos hizo tantas mercedes y cuán grande nos le mostró Dios en darnos tal prenda del que nos tiene: que amor saca amor. Procuremos ir mirando esto siempre y despertándonos para amar, porque, si una vez nos hace el Señor merced que se nos imprima en el corazón este amor, sernos ha todo fácil, y obraremos muy en breve y muy sin trabajo.
    titulo: ACORDÉMONOS DEL AMOR DE CRISTO
  resp2:
    ref: Sal 72, 27. 28; 1Co 6, 17
    vr:
    - - R
      - Los que se alejan de ti se pierden. * Para mí lo bueno es estar junto a Dios, hacer del Señor mi refugio.
    - - V
      - Quien se une al Señor es un espíritu con él.
    - - R
      - Para mí lo bueno es estar junto a Dios, hacer del Señor mi refugio.
  oracion: Señor todopoderoso, que quisiste que santa Teresa de Jesús, bajo el impulso del Espíritu Santo, manifestara a tu Iglesia el camino de la perfección, haz que encontremos en sus escritos nuestro alimento y que encendamos con ellos en nosotros el deseo de una verdadera santidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN IGNACIO DE ANTIOQUÍA, obispo y mártir:
  grado: Memoria
  fecha: 10-17
  comun: Del común de un mártir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la carta de san Ignacio de Antioquía, obispo y mártir, a los Romanos
      (Cap. 4. 1-2; 6, 1—8, 3: Funk 1, 217-223)
    texto: |-
      Yo voy escribiendo a todas las Iglesias, y a todas les encarezco lo mismo: que moriré de buena gana por Dios, con tal que vosotros no me lo impidáis. Os lo pido por favor: no me demostréis una benevolencia inoportuna. Dejad que sea pasto de las fieras, ya que ello me hará posible alcanzar a Dios. Soy trigo de Dios y he de ser molido por los dientes de las fieras, para llegar a ser pan limpio de Cristo. Rogad por mí a Cristo, para que, por medio de esos instrumentos, llegue a ser una víctima para Dios.
      De nada me servirán los placeres terrenales ni los reinos de este mundo. Prefiero morir en Cristo Jesús que reinar en los confines de la tierra. Todo mi deseo y mi voluntad están puestos en aquel que por nosotros murió y resucitó. Se acerca ya el momento de mi nacimiento a la vida nueva. Por favor, hermanos, no me privéis de esta vida, no queráis que muera; si lo que yo anhelo es pertenecer a Dios, no me entreguéis al mundo ni me seduzcáis con las cosas materiales; dejad que pueda contemplar la luz pura; entonces seré hombre en pleno sentido. Permitid que imite la pasión de mi Dios. El que tenga a Dios en si entenderá lo que quiero decir y se compadecerá de mi, sabiendo cuál es el deseo que me apremia.
      El príncipe de este mundo me quiere arrebatar y pretende arruinar mi deseo que tiende hacia Dios. Que nadie de vosotros, los aquí presentes, lo ayude; poneos más bien de mi parte, esto es, de parte de Dios. No queráis a un mismo tiempo tener a Jesucristo en la boca y los deseos mundanos en el corazón. Que no habite la envidia entre vosotros. Ni me hagáis caso si, cuando esté aquí, os suplicare en sentido contrario; haced más bien caso de lo que ahora os escribo. Porque os escribo en vida, pero deseando morir. Mi amor está crucificado y ya no queda en mí el fuego de los deseos terrenos; únicamente siento en mi interior la voz de una agua viva que me habla y me dice: «Ven al Padre.» No encuentro ya deleite en el alimento material ni en los placeres de este mundo. Lo que deseo es el pan de Dios, que es la carne de Jesucristo, de la descendencia de David, y la bebida de su sangre, que es la caridad incorruptible.
      No quiero ya vivir más la vida terrena. Y este deseo será realidad si vosotros lo queréis. Os pido que lo queráis, y así vosotros hallaréis también benevolencia. En dos palabras resumo mi súplica: hacedme caso. Jesucristo os hará ver que digo la verdad, él, que es la boca que no engaña, por la que el Padre ha hablado verdaderamente. Rogad por mí, para que llegue a la meta. Os he escrito no con criterios humanos, sino conforme a la mente de Dios. Si sufro el martirio, es señal de que me queréis bien; de lo contrario, es que me habéis aborrecido.
    titulo: SOY TRIGO DE DIOS Y HE DE SER MOLIDO POR LOS DIENTES DE LAS FIERAS
  resp2:
    ref: S. Ignacio de Antioquia, Efesios, 14, 1; Tralianos, 8, 1
    vr:
    - - R
      - 'Nada os es desconocido si mantenéis de un modo perfecto, en Jesucristo, la fe y la caridad, que son el principio y el fin de la vida: * el principio es la fe, el fin la caridad.'
    - - V
      - Revestíos de mansedumbre y convertíos en creaturas nuevas por medio de la fe, que es como la carne del Señor, y por medio de la caridad, que es como su sangre.
    - - R
      - El principio es la fe, el fin la caridad.
  oracion: Dios todopoderoso y eterno, que has querido que el testimonio de los mártires sea el honor de todo el cuerpo de tu Iglesia, concédenos que el martirio de san Ignacio de Antioquia, que hoy conmemoramos, así como le mereció a él una gloria eterna, así también nos dé a nosotros valor en el combate de la fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN LUCAS, evangelista:
  grado: Fiesta
  fecha: 10-18
  comun: Del común de apóstoles.
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Al oír los gentiles sus palabras, quedaron llenos de gozo.
  - - R
    - Y enaltecían la doctrina del Señor.
  lectura1:
    ref: De los Hechos de los apóstoles 9, 27-31; 11, 19-26
    texto: |-
      En aquellos días, Bernabé tomó consigo a Saulo y lo llevó a presencia de los apóstoles. Con todo detalle les refirió cómo Saulo había visto al Señor en el camino y cómo éste le había hablado; les contó además cómo Saulo había predicado en Damasco con toda valentía en el nombre de Jesús.
      Quedóse, pues, Saulo con ellos en Jerusalén y predicaba con toda intrepidez en el nombre del Señor. Hablaba también y discutía con los judíos helenistas, hasta que éstos resolvieron quitarle la vida. Enterados de ello los hermanos, lo llevaron a Cesarea, y de allí lo enviaron a Tarso.
      Mientras tanto, la Iglesia disfrutaba de paz en toda Judea, Galilea y Samaría, y se edificaba y progresaba en el temor del Señor y estaba llena del consuelo del Espírítu Santo.
      Los fieles, que se habían dispersado con motivo de la persecución suscitada a la muerte de Esteban, llegaron hasta Fenicia, Chipre y Antioquía, pero predicaban la palabra sólo a los judíos. Había, sin embargo, entre ellos algunos de Chipre y de Cirene, que al llegar a Antioquía comenzaron a predicar también a los griegos, anunciándoles la Buena Nueva de Jesús, el Señor. El poder del Señor los asistía, y, así, un crecido número de gente abrazó la fe y se convirtió al Señor. La noticia de estos sucesos llegó a oídos de la Iglesia de Jerusalén, y enviaron a Antioquía Bernabé. Cuando éste llegó a Antioquía y vio la gracia de Dios, se llenó de júbilo, y exhortaba a todos a que con entera voluntad permaneciesen fieles al Señor. Era un hombre de gran virtud, lleno del Espíritu Santo y de una grande fe. Con esto, una gran multitud se agregó al Señor.
      Partió luego Bernabé para Tarso en busca de Saulo y, así que lo encontró, lo llevó a Antioquía. Allí estuvieron los dos durante todo un año con la comunidad e instruyeron a muchísima gente. Fue allí, en Antioquía, donde por primera vez se dio a los discípulos el nombre de «cristianos».
    titulo: LA IGLESIA ESTABA LLENA DEL CONSUELO DEL ESPÍRITU SANTO
  resp1:
    ref: Hch 12, 24; 13, 48. 52
    vr:
    - - R
      - La palabra del Señor arraigaba y se difundía cada vez más, * y abrazaron la fe cuantos estaban destinados a la vida eterna.
    - - V
      - y los discípulos quedaron llenos de gozo y del Espíritu Santo.
    - - R
      - y abrazaron la fe cuantos estaban destinados a la vida eterna.
  lectura2:
    autor: |-
      De las Homilías de san Gregorio Magno, papa, sobre los Evangelios
      (Homilía 17, 1-3: PL 76, 1139)
    texto: |-
      Nuestro Señor y Salvador, hermanos muy amados, nos enseña unas veces con sus palabras, otras con sus obras. Sus hechos, en efecto, son normas de conducta, ya que con ellos nos da a entender tácitamente lo que debemos hacer. Manda a sus discípulos a predicar de dos en dos, ya que es doble el precepto de la caridad, a saber, el amor de Dios y el del prójimo.
      El Señor envía a los discípulos a predicar de dos en dos, y con ello nos indica sin palabras que el que no tiene caridad para con los demás no puede aceptar, en modo alguno, el ministerio de la predicación.
      Con razón se dice que los envió delante de si por todas las aldeas y lugares que iba a visitar. En efecto, el Señor viene detrás de sus predicadores, ya que, habiendo precedido la predicación, viene entonces el Señor a la morada de nuestro interior, cuando ésta ha sido preparada por las palabras de exhortación, que han abierto nuestro espíritu a la verdad. En este sentido dice Isaías a los predicadores: Preparad el camino del Señor; enderezad las sendas para nuestro Dios. Por esto les dice también el salmista: Alfombrad el camino del que sube sobre el ocaso. Sobre el ocaso, en efecto, sube el Señor, ya que en el declive de su pasión fue precisamente cuando, por su resurrección, puso más plenamente de manifiesto su gloria. Sube sobre el ocaso, porque, con su resurrección, pisoteó la muerte que había sufrido. Por esto nosotros alfombramos el camino del que sube sobre el ocaso cuando os anunciamos su gloria, para que él, viniendo a continuación, os ilumine con su presencia amorosa.
      Escuchemos lo que dice el Señor a los predicadores que envía a sus campos: La mies es mucha, pero los operarios son pocos; rogad, pues, al Señor de la mies que envíe trabajadores a su mies. Por tanto, para una mies abundante son pocos los trabajadores; al escuchar esto, no podemos dejar de sentir una gran tristeza, porque hay que reconocer que, si bien hay personas que desean escuchar cosas buenas, faltan, en cambio, quienes se dediquen a anunciarlas. Mirad cómo el mundo está lleno de sacerdotes, y, sin embargo, es muy difícil encontrar un trabajador para la mies del Señor; porque hemos recibido el ministerio sacerdotal, pero no cumplimos con los deberes de este ministerio.
      Pensad, pues, amados hermanos, pensad bien en lo que dice el Evangelio: Rogad al Señor de la mies que envíe trabajadores a su mies. Rogad también por nosotros, para que nuestro trabajo en bien vuestro sea fructuoso y para que nuestra voz no deje nunca de exhortaros, no sea que, después de haber recibido el ministerio de la predicación, seamos acusados ante el justo Juez por nuestro silencio.
    titulo: EL SEÑOR VIENE DETRÁS DE SUS PREDICADORES
  resp2:
    ref: Cf. Lc 1, 3. 4; Hch 1, 1
    vr:
    - - R
      - Después de haber investigado todo diligentemente desde el principio, he escrito ordenadamente el Evangelio; * para que estemos convencidos de la seguridad de las enseñanzas que hemos recibido.
    - - V
      - He tratado de todo lo que hizo y enseñó Jesús desde sus comienzos.
    - - R
      - Para que estemos convencidos de la seguridad de las enseñanzas que hemos recibido.
  te_deum: true
  oracion: Señor Dios, que elegiste a san Lucas para que, con su predicación y sus escritos, revelara al mundo tu amor hacia los pobres, concede a quienes nos gloriamos de ser cristianos vivir unidos con un solo corazón y una sola alma y haz que todos los pueblos lleguen a contemplar a tu Salvador. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS SIMÓN Y JUDAS, apóstoles:
  grado: Fiesta
  fecha: 10-28
  comun: Del Común de apóstoles
  himno: Mensajeros de Dios
  salmodia:
  - ant: A toda la tierra alcanza su pregón y hasta los límites del orbe su lenguaje.
    salmo: salmo-18-a
  - ant: Proclamaron la obra de Dios y meditaron sus acciones.
    salmo: salmo-63
  - ant: Pregonaron su justicia y todos los pueblos contemplaron su gloria.
    salmo: salmo-96
  versiculo:
  - - V
    - Contaron las alabanzas del Señor y su poder.
  - - R
    - Y las maravillas que realizó.
  lectura1:
    ref: De la primera carta del apóstol san Pablo a los Corintios 4,1-16
    texto: |-
      Hermanos: Que la gente sólo vea en nosotros servidores de Cristo y administradores de los misterios de Dios. Ahora, en un administrador lo que se busca es que sea fiel. Por lo que a mí se refiere, me importa muy poco ser juzgado por vosotros o por cualquier tribunal humano. Ni siquiera yo mismo juzgo mi actuación. Cierto que mi conciencia nada me reprocha, mas no por eso me creo justificado. Mi juez será el Señor. No juzguéis antes de tiempo; dejad que venga el Señor. Él sacará a la luz lo que está oculto en las tinieblas y pondrá al descubierto las intenciones del corazón. Entonces vendrá a cada uno su alabanza de parte de Dios.
      Estas verdades, hermanos, las he expuesto por vuestro provecho, aplicándolas a mi persona y a Apolo. Así, por esta aplicación, aprenderéis aquello de: «No más de lo que está escrito», a fin de que nadie se enorgullezca de un apóstol y desprecie a otro. Porque, ¿quién es el que te distingue? ¿Qué tienes que no hayas recibido? Y, si lo recibiste, ¿por qué te glorías como si no lo hubieras recibido? ¡Ya estáis satisfechos! ¡Os habéis hecho ya ricos! ¡Habéis ganado un reino sin ayuda nuestra! ¡Ya lo podíais haber ganado! ¡Así tendríamos nosotros parte en vuestro reino!
      Por lo que veo, Dios nos ha asignado a los apóstoles el último lugar, como a condenados a muerte; porque hemos venido a ser el espectáculo del mundo, de los ángeles y de los hombres. Nosotros somos insensatos por Cristo, vosotros sensatos en Cristo; nosotros débiles, vosotros fuertes; vosotros estimados, nosotros despreciados. Todavía ahora pasamos hambre, sed y desnudez. Somos maltratados y arrojados de una parte a otra, y nos fatigamos trabajando con nuestras manos. Cuando nos maldicen, bendecimos; cuando nos persiguen, soportamos; cuando nos injurian, respondemos con dulzura. Hemos venido a ser hasta ahora como basura del mundo, como el desecho de la humanidad.
      No os escribo esto para confundiros, sino para amonestaros como a hijos míos carísimos. Aunque tengáis, en efecto, diez mil maestros que os lleven a Cristo, de hecho sólo tenéis un padre. Yo os engendré para Cristo por la predicación del evangelio.
      Os exhorto, pues, a que seáis mis imitadores, como yo imito a Cristo.
    titulo: SEAMOS IMITADORES DEL APÓSTOL, COMO ÉL IMITA A CRISTO
  resp1:
    ref: Jn 15, 15; Mt 13, 11. 16
    vr:
    - - R
      - Ya no os llamaré siervos; os he llamado amigos, * porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
    - - V
      - A vosotros ha concedido Dios conocer los misterios del reino de los cielos; dichosos vuestros ojos porque ven, y vuestros oídos porque oyen.
    - - R
      - Porque todo cuanto me ha comunicado el Padre os lo he dado a conocer.
  lectura2:
    autor: |-
      Del comentario de san Cirilo de Alejandría, obispo, sobre el evangelio de san Juan
      (Libro 12, 1: PG 74, 707-710)
    texto: |-
      Nuestro Señor Jesucristo instituyó a aquellos que habían de ser guías y maestros de todo el mundo y administradores de sus divinos misterios, y les mandó que fueran como astros que iluminaran con su luz no sólo el país de los judíos, sino también a todos los países que hay bajo el sol, a todos los hombres que habitan la tierra entera. Es verdad lo que afirma la Escritura: Nadie se arroga este honor; sólo lo toma aquel que es llamado por Dios. Fue, en efecto, nuestro Señor Jesucristo el que llamó a sus discípulos a la gloria del apostolado, con preferencia a todos los demás.
      Aquellos bienaventurados discípulos fueron columnas y fundamento de la verdad; de ellos afirma el Señor que los envía como el Padre lo ha enviado a él, con las cuales palabras, al mismo tiempo que muestra la dignidad del apostolado y la gloria incomparable de la potestad que les ha sido conferida, insinúa también, según parece, cuál ha de ser su estilo de obrar.
      En efecto, si el Señor tenía la convicción de que había de enviar a sus discípulos como el Padre lo había enviado a él, era necesario que ellos, que habían de ser imitadores de uno y otro, supieran con qué finalidad el Padre había enviado al Hijo. Por esto, Cristo, exponiendo en diversas ocasiones las características de su propia misión, decía: No he venido a invitar a los justos a que se arrepientan, sino a los pecadores. Y también: He bajado del cielo, no para hacer mi voluntad, sino para cumplir la voluntad de aquel que me ha enviado. Dios no ha enviado su Hijo al mundo para condenar al mundo, sino para salvarlo por medio de él.
      De este modo resume en pocas palabras la regla de conducta de los apóstoles, ya que, al afirmar que los envía como el Padre lo ha enviado a él, les da a entender que su misión consiste en invitar a los pecadores a que se arrepientan y curar a los enfermos de cuerpo y de alma, y que en el ejercicio de su ministerio no han de buscar su voluntad, sino la de aquel que los ha enviado, y que han de salvar al mundo con la doctrina que de él han recibido. Leyendo los Hechos de los apóstoles o los escritos de san Pablo, nos damos cuenta fácilmente del empeño que pusieron los apóstoles en obrar según estas consignas recibidas.
    titulo: COMO ME ENVIÓ MI PADRE, ASÍ OS ENVÍO YO
  resp2:
    ref: Jn 15, 16. 8
    vr:
    - - R
      - No me habéis elegido vosotros a mí, sino que yo os he elegido a vosotros, y os he destinado para que vayáis y deis fruto, * un fruto que sea permanente.
    - - V
      - Mi Padre queda glorificado si dais mucho fruto.
    - - R
      - Un fruto que sea permanente.
  te_deum: true
  oracion: Dios nuestro, que quisiste que te conociéramos por la predicación de los apóstoles, concédenos, por la intercesión de los santos Simón y Judas, que tu Iglesia siga creciendo en el mundo, acogiendo continuamente en su seno a nuevos pueblos que vengan a la fe en ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
TODOS LOS SANTOS:
  grado: Solemnidad
  fecha: 11-01
  himno: Nacidos del amor para la vida
  salmodia:
  - ant: Admirable es tu nombre, Señor, porque coronaste de gloria y dignidad a tus santos y les diste el mando sobre las obras de tus manos.
    salmo: salmo-8
  - ant: Dichosos los limpios de corazón, porque ellos verán a Dios.
    salmo: salmo-14
  - ant: A tus santos, Señor, les enseñaste el sendero de la vida; ahora los sacias de gozo en tu presencia.
    salmo: salmo-15
  versiculo:
  - - V
    - Contemplad al Señor y quedaréis radiantes.
  - - R
    - Vuestro rostro no se avergonzará.
  lectura1:
    ref: Del libro del Apocalipsis 5, 1-14
    texto: |-
      Yo, Juan, vi, a la derecha del que estaba sentado en el trono, un libro escrito por dentro y por fuera, y sellado con siete sellos. Y vi a un ángel poderoso que gritaba a grandes voces:
      «¿Quién es digno de abrir el libro y romper sus sellos?»
      Y nadie, ni en el cielo ni en la tierra ni debajo de la tierra, podía abrir el libro ni ver su contenido. Yo lloraba mucho, porque no se encontró a nadie digno de abrir el libro y de ver su contenido. Pero uno de los ancianos me dijo:
      «No llores más. Mira que ha vencido el león de la tribu de Judá, el vástago de David, y él puede abrir el libro y sus siete sellos.»
      Y vi en medio, donde estaban el trono y los cuatro seres y en medio de los ancianos, un Cordero en pie y como degollado. Tenía siete cuernos y siete ojos, es decir: los siete espíritus de Dios, enviados por toda la tierra. Vino y tomó el libro de la diestra del que estaba sentado en el trono. Y, cuando lo hubo tomado, los cuatro seres y los veinticuatro ancianos se postraron ante el Cordero, teniendo cada uno su cítara y sus copas de oro llenas de incienso, que significaban las oraciones de los santos. Y cantaban un cántico nuevo, diciendo:
      «Eres digno de tomar el libro y abrir sus sellos, porque fuiste degollado y por tu sangre compraste para Dios hombres de toda raza, lengua, pueblo y nación; y has hecho de ellos para nuestro Dios un reino de sacerdotes y reinan sobre la tierra.»
      Y tuve otra visión. Y oí un coro de muchos ángeles alrededor del trono y de los seres y de los ancianos. Y era su número miríadas de miríadas y millares de millares. Y aquel coro inmenso de voces decía:
      «Digno es el Cordero degollado de recibir el poder, la riqueza y la sabiduría, la fuerza y el honor, la gloria y la alabanza.»
      Y todas las creaturas que existen en el cielo y sobre la tierra y debajo de la tierra y en el mar, y todo cuanto en ellos se contiene, oí que decían:
      «Al que se sienta en el trono y al Cordero la alabanza, el honor, la gloria y el poder por los siglos de los siglos.»
      Y los cuatro seres respondían:
      «Amén.»
      Y los ancianos cayeron de hinojos y rindieron adoración al que vive por todos los siglos.
    titulo: COMPRASTE PARA DIOS HOMBRES DE TODA RAZA, LENGUA, PUEBLO Y NACIÓN
  resp1:
    ref: Ap 11, 17. 18; Sal 144, 10
    vr:
    - - R
      - Gracias te damos, Señor Dios omnipotente, el que eres y el que eras, * porque comenzaste a reinar y llegó el tiempo de dar el galardón a tus siervos y a los santos.
    - - V
      - Que todas tus creaturas te den gracias, Señor, que te bendigan tus fieles.
    - - R
      - Porque comenzaste a reinar y llegó el tiempo de dar el galardón a tus siervos y a los santos.
  lectura2:
    autor: |-
      De los Sermones de san Bernardo, abad
      (Sermón 2: Opera omnia, edición cisterciense, 5 [1968], 364-368 )
    texto: |-
      ¿De qué sirven a los santos nuestras alabanzas, nuestra glorificación, esta misma solemnidad que celebramos? ¿De qué les sirven los honores terrenos, si reciben del Padre celestial los honores que les había prometido verazmente el Hijo? ¿De qué les sirven nuestros elogios? Los santos no necesitan de nuestros honores, ni les añade nada nuestra devoción. Es que la veneración de su memoria redunda en provecho nuestro, no suyo. Por lo que a mí respecta, confieso que, al pensar en ellos, se enciende en mí un fuerte deseo.
      El primer deseo que promueve o aumenta en nosotros el recuerdo de los santos es el de gozar de su compañía, tan deseable, y de llegar a ser conciudadanos y compañeros de los espíritus bienaventurados, de convivir con la asamblea de los patriarcas, con el grupo de los profetas, con el senado de los apóstoles, con el ejército incontable de los mártires, con la asociación de los confesores, con el coro de las vírgenes, para resumir, el de asociarnos y alegrarnos juntos en la comunión de todos los santos. Nos espera la Iglesia de los primogénitos, y nosotros permanecemos indiferentes; desean los santos nuestra compañía, y nosotros no hacemos caso; nos esperan los justos, y nosotros no prestamos atención.
      Despertémonos, por fin, hermanos; resucitemos con Cristo, busquemos las cosas de arriba, pongamos nuestro corazón en las cosas del cielo. Deseemos a los que nos desean, apresurémonos hacia los que nos esperan, entremos a su presencia con el deseo de nuestra alma. Hemos de desear no sólo la compañía, sino también la felicidad de que gozan los santos, ambicionando ansiosamente la gloria que poseen aquellos cuya presencia deseamos. Y esta ambición no es mala, ni incluye peligro alguno el anhelo de compartir su gloria.
      El segundo deseo que enciende en nosotros la conmemoración de los santos es que, como a ellos, también a nosotros se nos manifieste Cristo, que es nuestra vida, y que nos manifestemos también nosotros con él, revestidos de gloria. Entretanto, aquel que es nuestra cabeza se nos representa no tal como es, sino tal como se hizo por nosotros, no coronado de gloria, sino rodeado de las espinas de nuestros pecados. Teniendo a aquel que es nuestra cabeza coronado de espinas, nosotros, miembros suyos, debemos avergonzarnos de nuestros refinamientos y de buscar cualquier púrpura que sea de honor y no de irrisión. Llegará un día en que vendrá Cristo, y entonces ya no se anunciará su muerte, para recordarnos que también nosotros estamos muertos y nuestra vida está oculta con el. Se manifestará la cabeza gloriosa y, junto con él, brillarán glorificados sus miembros, cuando transfigurará nuestro pobre cuerpo en un cuerpo glorioso semejante a la cabeza, que es él.
      Deseemos, pues, esta gloria con un afán seguro y total. Mas, para que nos sea permitido esperar esta gloria y aspirar a tan gran felicidad, debemos desear también en gran manera la intercesión de los santos, para que ella nos obtenga lo que supera nuestras fuerzas.
    titulo: APRESURÉMONOS HACIA LOS HERMANOS QUE NOS ESPERAN
  resp2:
    ref: Ap 19, 5. 6; Sal 32, 1
    vr:
    - - R
      - Alabad al Señor, sus siervos todos, los que le teméis, pequeños y grandes; * porque reina el Señor, nuestro Dios, dueño de todo.
    - - V
      - Aclamad, justos, al Señor, que merece la alabanza de los buenos.
    - - R
      - Porque reina el Señor, nuestro Dios, dueño de todo.
  te_deum: true
  oracion: Dios todopoderoso y eterno, que nos concedes celebrar los méritos de todos los santos en una misma solemnidad, te rogamos que, por las súplicas de tan numerosos intercesores, nos concedas en abundancia los dones que te pedimos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MARTIN DE PORRES, religioso:
  grado: Memoria
  fecha: 11-03
  comun: Del Común de santos varones para los santos religiosos.
  himno: Dichosos los que, oyendo la llamada
  lectura2:
    autor: |-
      De la homilía pronunciada por el papa Juan XXIII en la canonización de san Martín de Porres
      (Día 6 de mayo de 1962: AAS 54 [1962], 306-309)
    texto: |-
      Martín nos demuestra con el ejemplo de su vida que podemos llegar a la salvación y a la santidad por el camino que nos enseñó Cristo Jesús: a saber, si, en primer lugar, amamos a Dios con todo nuestro corazón, con toda nuestra alma y con toda nuestra mente; y si, en segundo lugar, amamos al prójimo como a nosotros mismos.
      Él sabía que Cristo Jesús padeció por nosotros y, cargado con nuestros pecados, subió al leño, y por esto tuvo un amor especial a Jesús crucificado, de tal modo que, al contemplar sus atroces sufrimientos, no podía evitar el derramar abundantes lágrimas. Tuvo también una singular devoción al santísimo sacramento de la eucaristía, al que dedicaba con frecuencia largas horas de oculta adoración ante el sagrario, deseando nutrirse de él con la máxima frecuencia que le era posible.
      Además, san Martín, obedeciendo el mandato del divino Maestro, se ejercitaba intensamente en la caridad para con sus hermanos, caridad que era fruto de su fe íntegra y de su humildad. Amaba a sus prójimos, porque los consideraba verdaderos hijos de Dios y hermanos suyos; y los amaba aún más que a sí mismo, ya que, por su humildad, los tenía a todos por más justos y perfectos que él.
      Disculpaba los errores de los demás; perdonaba las más graves injurias, pues estaba convencido que era mucho más lo que merecía por sus pecados; ponía todo su empeño en retornar al buen camino a los pecadores; socorría con amor a los enfermos; procuraba comida, vestido y medicinas a los pobres; en la medida que le era posible, ayudaba a los agricultores y a los negros y mulatos, que, por aquel tiempo, eran tratados como esclavos de la más baja condición, lo que le valió, por parte del pueblo, el apelativo de «Martín de la caridad».
      Este santo varón, que con sus palabras, ejemplos y virtudes impulsó a sus prójimos a una vida de piedad, también ahora goza de un poder admirable para elevar nuestras mentes a las cosas celestiales. No todos, por desgracia, son capaces de comprender estos bienes sobrenaturales, no todos los aprecian como es debido, al contrario, son muchos los que, enredados en sus vicios, los menosprecian, los desdeñan o los olvidan completamente. Ojalá que el ejemplo de Martín enseñe a muchos la dulzura y felicidad que se encuentra en el seguimiento de Jesucristo y en la sumisión a sus divinos mandatos.
    titulo: «MARTÍN DE LA CARIDAD»
  resp2:
    ref: Sir 31, 8. 11. 9
    vr:
    - - R
      - Dichoso el hombre que se conserva íntegro y no se pervierte por la riqueza. * Su dicha será consolidada por el Señor.
    - - V
      - ¿Quién es éste, y lo felicitaremos? Pues ha hecho algo admirable en su pueblo.
    - - R
      - Su dicha será consolidada por el Señor.
  oracion: Señor, Dios nuestro, que llevaste a san Martín de Porres a la gloria celestial, por medio de una vida escondida y humilde, concédenos seguir de tal manera sus ejemplos, que merezcamos, como él, ser llevados al cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN CARLOS BORROMEO, obispo:
  grado: Memoria
  fecha: 11-04
  comun: 'Del común de pastores: para un santo obispo.'
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      Del sermón pronunciado por san Carlos Borromeo en el último sínodo
      (Acta Ecclesiae Mediolanensis, Milán 1599, 1177-1178)
    texto: |-
      Todos somos débiles, lo admito, pero el Señor ha puesto en nuestras manos los medios con que poder ayudar fácilmente, si queremos, esta debilidad. Algún sacerdote querría tener aquella integridad de vida que sabe se le demanda, querría ser continente y vivir una vida angélica, como exige su condición, pero no piensa en emplear los medios requeridos para ello: ayunar, orar, evitar el trato con los malos y las familiaridades dañinas y peligrosas.
      Algún otro se queja de que, cuando va a salmodiar o a celebrar la misa, al momento le acuden a la mente mil cosas que lo distraen de Dios; pero éste, antes de ir al coro o a celebrar la misa, ¿qué ha hecho en la sacristía, cómo se ha preparado, qué medios ha puesto en práctica para mantener la atención?
      ¿Quieres que te enseñe cómo irás progresando en la virtud y, si ya estuviste atento en el coro, cómo la próxima vez lo estarás más aún y tu culto será más agradable a Dios? Oye lo que voy a decirte. Si ya arde en ti el fuego del amor divino, por pequeño que éste sea, no lo saques fuera en seguida, no lo expongas al viento, mantén el fogón protegido para que no se enfríe y pierda el calor; esto es, aparta cuanto puedas las distracciones, conserva el recogimiento, evita las conversaciones inútiles.
      ¿Estás dedicado a la predicación y la enseñanza? Estudia y ocúpate en todo lo necesario para el recto ejercicio de este cargo; procura antes que todo predicar con tu vida y costumbres, no sea que, al ver que una cosa es lo que dices y otra lo que haces, se burlen de tus palabras meneando la cabeza.
      ¿Ejerces la cura de almas? No por ello olvides la cura de ti mismo, ni te entregues tan pródigamente a los demás que no quede para ti nada de ti mismo; porque es necesario, ciertamente, que te acuerdes de las almas a cuyo frente estás, pero no de manera que te olvides de ti.
      Sabedlo, hermanos, nada es tan necesario para los clérigos como la oración mental; ella debe preceder, acompañar y seguir nuestras acciones: Salmodiaré —dice el salmista— y entenderé. Si administras los sacramentos, hermano, medita lo que haces; si celebras la misa, medita lo que ofreces; si salmodias en el coro, medita a quién hablas y qué es lo que hablas; si diriges las almas, medita con qué sangre han sido lavadas, y así hacedlo todo con espíritu de caridad; así venceremos fácilmente las innumerables dificultades que inevitablemente experimentamos cada día (ya que esto forma parte de nuestra condición); así tendremos fuerzas para dar a luz a Cristo en nosotros y en los demás.
    titulo: NO SEAS DE LOS QUE DICEN UNA COSA Y HACEN OTRA
  resp2:
    ref: 1Tm 6, 11; 4, 11. 12. 6
    vr:
    - - R
      - Corre al alcance de la justicia, de la piedad, de la fe, de la caridad, de la paciencia en el sufrimiento, de la dulzura. * Esto has de enseñar e inculcar; sé modelo para los fieles.
    - - V
      - Si propones estas cosas a los hermanos, serás un excelente servidor de Cristo Jesús.
    - - R
      - Esto has de enseñar e inculcar; sé modelo para los fieles.
  oracion: Conserva en tu pueblo, Señor, el espíritu que animara a san Carlos Borromeo, obispo, para que tu Iglesia se renueve siempre y, cada vez más transformada en Cristo, presente ante los hombres una imagen auténtica de su Señor, Jesucristo, tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
MARÍA, MEDIANERA DE TODAS LAS GRACIAS:
  grado: Memoria
  fecha: 11-07
  comun: Del Común de la Santísima Virgen María.
  himno: Lucero de la mañana
  lectura2:
    autor: |-
      De la Constitución dogmática Lumen géntium, sobre la Iglesia, del Concilio Vaticano Segundo
      (Núms. 61-62)
    texto: |-
      La Bienaventurada Virgen, predestinada desde toda la eternidad cual madre de Dios junto con la encarnación del Verbo por designio de la divina providencia, fue en la tierra la esclarecida madre del divino Redentor y en forma singular la generosa colaboradora entre todas las creaturas y la humilde esclava del Señor. Concibiendo a Cristo, engendrándolo, alimentándolo, presentándolo en el templo al Padre, padeciendo con su Hijo mientras él moría en la cruz, cooperó en forma del todo singular, por la obediencia, la fe, la esperanza y la encendida caridad, en la restauración de la vida sobrenatural de las almas. Por tal motivo es nuestra madre en el orden de la gracia.
      Y esta maternidad de María perdura sin cesar en la economía de la gracia, desde el momento en que prestó fiel asentimiento en la anunciación, y lo mantuvo sin vacilación al pie de la cruz, hasta la consumación perfecta de todos los elegidos. Pues una vez recibida en los cielos, no dejó su oficio salvador, sino que continúa alcanzándonos por su múltiple intercesión los dones de la eterna salvación.
      Por su amor materno cuida de los hermanos de su Hijo que peregrinan y se debaten entre peligros y angustias y luchan contra el pecado hasta que sean llevados a la patria feliz.
      Por eso la Bienaventurada Virgen en la Iglesia es invocada con los títulos de abogada, auxiliadora, favorecedora, mediadora. Lo cual, sin embargo, se entiende de manera que nada quite ni agregue a la dignidad y eficacia de Cristo, único mediador.
      Porque ninguna creatura puede compararse jamás con el Verbo encarnado, nuestro Redentor; pero así como el sacerdocio de Cristo es participado de varias maneras, tanto por los ministros como por el pueblo fiel, y así como la única bondad de Dios se difunde realmente en formas distintas en las creaturas, así también la única mediación del Redentor no excluye sino que suscita en sus creaturas una múltiple cooperación que participa de la fuente única.
      La Iglesia no duda en atribuir a María un tal oficio subordinado, lo experimenta continuamente y lo recomienda al corazón de los fieles para que, apoyados en esta protección maternal, se unan más íntimamente al Mediador y Salvador.
    titulo: LA MATERNIDAD DE MARÍA EN LA ECONOMÍA DE LA GRACIA
  resp2:
    ref: ''
    vr:
    - - R
      - No hay alabanza digna de ti, virginidad inmaculada y santa. * Porque en tu seno has llevado al que ni el cielo puede contener.
    - - V
      - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
    - - R
      - Porque en tu seno has llevado al que ni el cielo puede contener.
  oracion: Señor, por el misterioso designio de tu amor, has querido que la Virgen María fuese madre del autor de la gracia y estuviese asociada a él en el misterio de la redención humana; que ella nos alcance con profusión tus dones y nos conduzca hasta el puerto de la salvación eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA DEDICACIÓN DE LA BASÍLICA DE SAN JUAN DE LETRÁN:
  grado: Fiesta
  fecha: 11-09
  comun: Del Común de la dedicación de una iglesia.
  himno: Nueva Jerusalén y ciudad santa
  salmodia:
  - ant: ¡Portones!, alzad los dinteles, levantaos, puertas antiguas.
    salmo: salmo-23
  - ant: ¡Qué deseables son tus moradas, Señor de los ejércitos!
    salmo: salmo-83
  - ant: ¡Qué pregón tan glorioso para ti, ciudad de Dios!
    salmo: salmo-86
  versiculo:
  - - V
    - Me postraré hacia tu santuario.
  - - R
    - Daré gracias a tu nombre, Señor.
  lectura1:
    ref: De la primera carta del apóstol san Pedro 2, 1-17
    texto: |-
      Hermanos: Después de haberos despojado de toda maldad y de toda falsedad, de las hipocresías y envidias, y de toda clase de murmuración, apeteced, como niños recién nacidos, la leche pura espiritual. Con ella podréis crecer hasta alcanzar la salvación, si es que realmente habéis saboreado lo bueno que es el Señor.
      Acercándoos al Señor, la piedra viva, rechazada por los hombres, pero escogida y apreciada por Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo. Por eso se lee en la Escritura: «Ved que pongo en Sión una piedra angular escogida y preciosa. y quien tenga fe en ella no será defraudado.»
      Por consiguiente, a vosotros, que tenéis fe, os corresponde el honor; mas, para los que no tienen fe, «la piedra que desecharon los arquitectos es ahora la piedra angular, y ha venido a ser piedra de tropiezo y roca de escándalo», y tropiezan en ella porque no tienen fe en la palabra de Cristo, para la cual estaban destinados.
      Vosotros, en cambio, sois «linaje escogido, sacerdocio regio, nación santa, pueblo adquirido por Dios, para proclamar las hazañas del que os llamó a salir de la tiniebla y a entrar en su luz maravillosa». Vosotros, que en otro tiempo «no erais pueblo», sois ahora «pueblo de Dios»; vosotros, que estabais «excluidos de la misericordia», sois ahora «objeto de la misericordia de Dios».
      Hermanos, os exhorto a que, como forasteros y peregrinos que sois, os abstengáis de las pasiones terrenas que hacen guerra al alma. Observad entre los gentiles una conducta ejemplar. Así, por aquello mismo en que os calumnian como a malhechores, darán gloria a Dios, cuando vean y consideren vuestras buenas obras, el día en que él venga a «visitarlos» con su gracia.
      Sed sumisos a toda humana autoridad a causa del Señor: ya sea al soberano, en cuanto que tiene el mando; o bien a los gobernadores, como delegados suyos que son para castigar a los malhechores y para alabanza de los hombres de bien. Porque ésta es la voluntad de Dios: que, obrando el bien, hagáis callar a la ignorancia de los hombres insensatos. Portaos en esto como hombres libres, no como quienes se sirven de la libertad sólo para ocultar su maldad, sino como conviene a los que son siervos de Dios. Sed deferentes con todos, amad a vuestros hermanos, temed a Dios y honrad al soberano;
    titulo: COMO PIEDRAS VIVAS, ENTRÁIS EN LA CONSTRUCCIÓN DEL TEMPLO DEL ESPÍRITU
  resp1:
    ref: Cf. Ap 21, 19; Tb 13, 21
    vr:
    - - R
      - Las murallas de Jerusalén serán adornadas con piedras preciosas. * Y sus torres serán batidas con oro.
    - - V
      - Las puertas de Jerusalén serán rehechas con zafiros y esmeraldas, y con piedras preciosas sus murallas.
    - - R
      - Y sus torres serán batidas con oro.
  lectura2:
    autor: |-
      De los Sermones de san Cesáreo de Arlés, obispo.
      (Sermón 229, 1-3: CCL 104, 905-908)
    texto: |-
      Hoy, hermanos muy amados, celebramos con gozo y alegría, por la benignidad de Cristo, la dedicación de este templo; pero nosotros debemos ser el templo vivo y verdadero de Dios. Con razón, sin embargo, celebran los pueblos cristianos la solemnidad de la Iglesia madre, ya que son conscientes de que por ella han renacido espiritualmente. En efecto, nosotros, que por nuestro primer nacimiento fuimos objeto de la ira de Dios, por el segundo hemos llegado a ser objeto de su misericordia. El primer nacimiento fue para muerte; el segundo nos restituyó a la vida.
      Todos nosotros, amadísimos, antes del bautismo fuimos lugar en donde habitaba el demonio; después del bautismo nos convertimos en templos de Cristo. Y, si pensamos con atención en lo que atañe a la salvación de nuestras almas, tomamos conciencia de nuestra condición de templos verdaderos y vivos de Dios. Dios habita no sólo en templos levantados por los hombres ni en casas hechas de piedra y de madera, sino principalmente en el alma hecha a imagen de Dios y construida por él mismo, que es su arquitecto. Por esto dice el apóstol Pablo: El templo de Dios es santo: ese templo sois vosotros.
      Y, ya que Cristo, con su venida, arrojó de nuestros corazones al demonio para prepararse un templo en nosotros, esforcémonos al máximo, con su ayuda, para que Cristo no sea deshonrado en nosotros por nuestras malas obras. Porque todo el que obra mal deshonra a Cristo. Como antes he dicho, antes de que Cristo nos redimiera éramos casa del demonio; después hemos llegado a ser casa de Dios, ya que Dios se ha dignado hacer de nosotros una casa para sí.
      Por esto, nosotros, carísimos, si queremos celebrar con alegría la dedicación del templo, no debemos destruir en nosotros, con nuestras malas obras, el templo vivo de Dios. Lo diré de una manera inteligible para todos: debemos disponer nuestras almas del mismo modo como deseamos encontrar dispuesta la iglesia cuando venimos a ella.
      ¿Deseas encontrar limpia la basílica? Pues no ensucies tu alma con el pecado. Si deseas que la basílica esté bien iluminada, Dios desea también que tu alma no esté en tinieblas, sino que sea verdad lo que dice el Señor: que brille en nosotros la luz de las buenas obras y sea glorificado aquel que está en los cielos. Del mismo modo que tú entras en esta iglesia, así quiere Dios entrar en tu alma, como tiene prometido: Habitaré en medio de ellos y andaré entre ellos.
    titulo: TODOS, POR EL BAUTISMO, HEMOS SIDO HECHOS TEMPLOS DE DIOS.
  resp2:
    ref: Cf. Ez 47, 1. 9
    vr:
    - - R
      - 'Vi que debajo del umbral del templo salía agua, la cual se deslizaba hacia el lado derecho, aleluia; y todos aquellos a quienes llegó esta agua * tuvieron vida abundante y cantaban: «Aleluia, aleluia.»'
    - - V
      - En la dedicación del templo el pueblo entonaba alabanzas, y resonaba en su boca un bello canto.
    - - R
      - 'Tuvieron vida abundante y cantaban: «Aleluia, aleluia.»'
  te_deum: true
  oracion: 'Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo como cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
SAN LEÓN MAGNO, papa y doctor de la Iglesia:
  grado: Memoria
  fecha: 11-10
  comun: Del Común de pastores para un santo papa y del Común de doctores de la Iglesia.
  himno: Hondo saber de Dios fue vuestra ciencia
  lectura2:
    autor: |-
      De los Sermones de san León Magno, papa
      (Sermón 4, 1-2: PL 54, 148-149)
    texto: |-
      Aunque toda la Iglesia está organizada en distintos grados, de manera que la integridad del sagrado cuerpo consta de una diversidad de miembros, sin embargo, como dice el Apóstol, todos somos uno en Cristo Jesús; y esta diversidad de funciones no es en modo alguno causa de división entre los miembros, ya que todos, por humilde que sea su función, están unidos a la cabeza. En efecto, nuestra unidad de fe y de bautismo hace de todos nosotros una sociedad indiscriminada, en la que todos gozan de la misma dignidad, según aquellas palabras de san Pedro, tan dignas de consideración: También Vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo; y más adelante: Vosotros sois linaje escogido, sacerdocio regio, nación santa, pueblo adquirido por Dios.
      La señal de la cruz hace reyes a todos los regenerados en Cristo, y la unción del Espíritu Santo los consagra sacerdotes; y así, además de este especial servicio de nuestro ministerio, todos los cristianos espirituales y perfectos deben saber que son partícipes del linaje regio y del oficio sacerdotal. ¿Qué hay más regio que un espíritu que, sometido a Dios, rige su propio cuerpo? ¿Y qué hay más sacerdotal que ofrecer a Dios una conciencia pura y las inmaculadas víctimas de nuestra piedad en el altar del corazón? Aunque esto, por gracia de Dios, es común a todos, sin embargo, es también digno y laudable que os alegréis del día de nuestra promoción como de un honor que os atañe también a vosotros; para que sea celebrado así en todo el cuerpo de la Iglesia el único sacramento del pontificado, cuya unción consecratoria se derrama ciertamente con más profusión en la parte superior, pero desciende también con abundancia a las partes inferiores.
      Así pues, amadísimos hermanos, aunque todos tenemos razón para gozarnos de nuestra común participación en este oficio, nuestro motivo de alegría será más auténtico y elevado si no detenéis vuestra atención en nuestra humilde persona, ya que es mucho más provechoso y adecuado elevar nuestra mente a la contemplación de la gloria del bienaventurado Pedro y celebrar este día solemne con la veneración de aquel que fue inundado tan copiosamente por la misma fuente de todos los carismas, de modo que, habiendo sido el único que recibió en su persona tanta abundancia de dones, nada pasa a los demás si no es a través de él. Así, el Verbo hecho carne habitaba ya entre nosotros, y Cristo se había entregado totalmente a la salvación del género humano.
    titulo: EL ESPECIAL SERVICIO DE NUESTRO MINISTERIO
  resp2:
    ref: Mt 16, 18; Sal 47, 9
    vr:
    - - R
      - 'Dijo Jesús a Simón: «Yo te digo: Tú eres Pedro, y sobre esta piedra edificaré mi Iglesia, * y los poderes del infierno no la derrotarán.»'
    - - V
      - Dios la ha fundado para siempre.
    - - R
      - Y los poderes del infierno no la derrotarán.
  oracion: Señor, tú que nos has prometido que las fuerzas del mal nunca prevalecerán contra la Iglesia, cimentada sobre la roca de Pedro, haz que, por la intercesión del papa san León Magno, tu pueblo permanezca siempre firme en la verdad y goce de una paz estable y verdadera. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MARTÍN DE TOURS, obispo:
  grado: Memoria
  fecha: 11-11
  comun: 'Del Común de pastores: para un santo obispo.'
  himno: Puerta de Dios en el redil humano
  lectura2:
    autor: |-
      De las Cartas de Sulpicio Severo
      (Carta 3, 6. 9-10, 11. 14-17, 21: SC 133, 336-344)
    texto: |-
      Martín conoció con mucha antelación su muerte y anunció a sus hermanos la proximidad de la disolución de su cuerpo. Entretanto, por una determinada circunstancia, tuvo que visitar la diócesis de Candes. Existía en aquella Iglesia una desavenencia entre los clérigos, y, deseando él poner paz entre ellos, aunque sabía que se acercaba su fin, no dudó en ponerse en camino, movido por este deseo, pensando que si lograba pacificar la Iglesia sería éste un buen colofón a su vida.
      Permaneció por un tiempo en aquella población o comunidad, donde había establecido su morada. Una vez restablecida la paz entre los clérigos, cuando ya pensaba regresar a su monasterio, de repente empezaron a faltarle las fuerzas; llamó entonces a los hermanos y les indicó que se acercaba el momento de su muerte. Ellos, todos a una, empezaron a entristecerse y a decirle entre lágrimas:
      «¿Por qué nos dejas, padre? ¿A quién nos encomiendas en nuestra desolación? Invadirán tu grey lobos rapaces; ¿quién nos defenderá de sus mordeduras, si nos falta el pastor? Sabemos que deseas estar con Cristo, pero una dilación no hará que se pierda ni disminuya tu premio; compadécete más bien de nosotros, a quienes dejas».
      Entonces él, conmovido por este llanto, lleno como estaba siempre de entrañas de misericordia en el Señor, se cuenta que lloró también; y, vuelto al Señor, dijo tan sólo estas palabras en respuesta al llanto de sus hermanos:
      «Señor, si aún soy necesario a tu pueblo, no rehuyo el trabajo; hágase tu voluntad».
      ¡Oh varón digno de toda alabanza, nunca derrotado por las fatigas ni vencido por la tumba, igualmente dispuesto a lo uno y a lo otro, que no tembló ante la muerte ni rechazó la vida! Con los ojos y las manos continuamente levantados al cielo, no cejaba en la oración; y como los presbíteros, que por entonces habían acudido a él, le rogasen que aliviara un poco su cuerpo cambiando de posición, les dijo:
      «Dejad, hermanos, dejad que mire al cielo y no a la tierra, y que mi espíritu, a punto ya de emprender su camino, se dirija al Señor».
      Dicho esto, vio al demonio cerca de él, y le dijo:
      «¿Por que estás aquí, bestia feroz? Nada hallarás en mí, malvado; el seno de Abrahán está a punto de acogerme». Con estas palabras entregó su espíritu al cielo. Martín, lleno de alegría, fue recibido en el seno de Abrahán; Martín, pobre y humilde, entró en el cielo, cargado de riquezas.
    titulo: MARTÍN, POBRE Y HUMILDE
  resp2:
    ref: ''
    vr:
    - - R
      - ¡Oh tu, verdaderamente dichoso, en cuyos labios no hubo engaño, que a nadie juzgaste, a nadie condenaste! * nunca se encontró en su boca otra cosa que Cristo, la paz y la misericordia.
    - - V
      - ¡Oh varón digno de toda alabanza, nunca derrotado por las fatigas ni vencido por la tumba, que no tembló ante la muerte ni rechazó la vida!
    - - R
      - Nunca se encontró en su boca otra cosa que Cristo, la paz y la misericordia.
  oracion: Renueva, Señor, en nosotros las maravillas de tu gracia, para que, al celebrar hoy la memoria de san Martín, obispo, que te glorificó, tanto con su vida como con su muerte, nos sintamos de tal modo fortalecidos, que ni la vida ni la muerte puedan separarnos de tu amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSAFAT, obispo y mártir:
  grado: Memoria
  fecha: 11-12
  comun: Del Común de un mártir.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De la carta encíclica Ecclésiam Dei del papa Pío once
      (AAS 15 [1923], 573-582)
    texto: |-
      Sabemos que la Iglesia de Dios, constituida por su admirable designio para ser en la plenitud de los tiempos como una inmensa familia que abarque a todo el género humano, es notable, por institución divina, tanto por su unidad ecuménica, como por otras notas que la caracterizan.
      En efecto, Cristo el Señor no sólo encomendó a solos los apóstoles la misión que él había recibido del Padre, cuando les dijo: Dios me ha dado todo poder en el cielo y en la tierra; id, pues, y sed los maestros de todas las naciones, sino que quiso también que el colegio apostólico tuviera la máxima unidad, unido por un doble y estrecho vínculo, a saber: intrínsecamente, por una misma fe y por la caridad que ha sido derramada en nuestros corazones con el Espíritu Santo; extrínsecamente, por el gobierno de uno solo sobre todos, ya que confirió a Pedro la primacía sobre los demás apóstoles, como principio perpetuo y fundamento visible de unidad. Y, para que esta unidad y acuerdo se mantuviera a perpetuidad, Dios providentísimo la consagró en cierto modo con el signo de la santidad y del martirio.
      Este honor tan grande obtuvo aquel arzobispo de Pólotzk, llamado Josafat, de rito eslavo oriental, al que con razón consideramos como el hombre más eminente y destacado entre los eslavos de rito oriental, ya que difícilmente encontraríamos a otro que haya contribuido a la gloria y provecho de la Iglesia más que éste, su pastor y apóstol, principalmente cuando derramó su sangre por la unidad de la santa Iglesia. Además, sintiéndose movido por un impulso celestial, comprendió que podría contribuir en gran manera al restablecimiento de la santa unidad universal de la Iglesia el hecho de conservar en ella el rito oriental eslavo y la institución de la vida monástica según el espíritu de san Basilio.
      Pero entretanto, preocupado principalmente por la unión de sus conciudadanos con la cátedra de Pedro, buscaba por doquier toda clase de argumentos que pudieran contribuir a promover y confirmar esta unidad, sobre todo estudiando atentamente los libros litúrgicos que, según las prescripciones de los santos Padres, usaban los mismos orientales separados. Con esta preparación tan diligente, comenzó a dedicarse a la restauración de la unidad, con tanta fuerza y tanta suavidad a la vez y con tanto fruto que sus mismos adversarios lo llamaban «ladrón de almas».
    titulo: DERRAMÓ SU SANGRE POR LA UNIDAD DE LA IGLESIA
  resp2:
    ref: Jn 17, 11. 23. 22
    vr:
    - - R
      - 'Dijo Jesús: «Padre santo, cuida por tu nombre a los que me has dado, * para que sean perfectos en la unidad, y conozca el mundo que tú me has enviado.»'
    - - V
      - Yo les he dado la gloria que tú me diste.
    - - R
      - Para que sean perfectos en la unidad, y conozca el mundo que tú me has enviado.
  oracion: Aviva, Señor, en tu Iglesia aquel fuego del Espíritu Santo que impulsó a san Josafat a dar la vida por su pueblo, y haz que también nosotros, fortalecidos por este mismo Espíritu y ayudados por la plegaria de este santo, estemos dispuestos, si es preciso, a dar la vida por nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS ROQUE GONZÁLEZ, ALFONSO RODRÍGUEZ Y JUAN DEL CASTILLO, presbíteros y mártires:
  grado: Memoria
  fecha: 11-17
  comun: Del Común de varios mártires.
  himno: Testigos de amor
  lectura2:
    autor: |-
      De las Cartas del beato Roque González, presbítero y mártir
      (Cartas annuas del padre Roque González al provincial Pedro de Oñate, año 1615 [s.d.]: Documentos para la historia argentina, 20, Buenos Aires 1929, pp. 24.25)
    texto: |-
      Yo procuré volver con mucha brevedad. Acomodéme, en una chozuela junto al río, hasta que algo después me dieron otra choza pajiza algo mayor. Y poco más de dos meses después envió el padre Rector al padre Diego de Boroa. Llegó a aquel puesto segundo día de Pascua del Espíritu Santo, y ambos nos consolamos harto de vemos, por amor de Dios nuestro Señor, en partes tan remotas y apartadas. Acomodámonos en la choza ambos con unos apartadijos de caña, y con lo mismo estaba atajada una capillita poco más ancha que el altar, donde decíamos misa. Y con la virtud de este soberano y divino sacrificio de la santa cruz en que se ofreció y estaba allí triunfando, los demonios que antes se les aparecían a los indios, no se atrevieron a aparecer más, y así lo dijo un indio. En aquella casita estuvimos con no pequeña necesidad en todo, porque el frío, como no tenía defensa, era tanto, que nos quitaba el sueño. La comida, unas veces un poco de maíz cocido otras, harina de mandioca que comen los indios; y aun porque solíamos enviar al campo a buscar unas hierbas de que comen bien los papagayos, los indios por gracia dijeron que lo éramos.
      Y como el demonio vio que la cosa iba tan adelante, o por sí mismo hablándoles o por medio de sus ministros, temiendo perder lo que había ganado en tantos años si la Compañía de Jesús entraba en estas tan extendidas provincias; y así sembraron por todo el Paraná que éramos espías y sacerdotes falsos, y que en los libros traíamos la muerte, y esto en tanto grado, que, estando por medio de unas estampas declarándoles el padre Boroa a unos infieles los misterios de nuestra santa fe, se recelaban de llegar cerca de las imágenes no se les pegase la muerte. Pero poco a poco se van desengañando y viendo con sus ojos los indios cómo los nuestros les son verdaderos padres, dándoles con amor de tales cuanto piden como lo haya en casa, y siéndoles médicos no sólo de sus almas —que es lo principal—, sino de sus cuerpos, ayudándoles en todas sus enfermedades y trabajos de noche y de día.
      En viendo cómo los indios nos cobraron amor, tratamos de hacer una pequeña iglesia, y con serlo baja y cubierta de paja, estos pobrecitos lo son tanto, que les parecían palacios reales, y mirando hacia el techo, hacían milagros, y ambos embarrábamos a ratos para enseñar a los indios, que aun eso no sabían. Acabóse para el día de nuestro santo padre Ignacio del año pasado de seiscientos y quince. En el cual dijimos la primera misa, procurando celebrar aquella santa fiesta con la renovación de nuestros votos y con otros regocijos exteriores según el poco posible de la tierra; procuramos imponer una danza, pero los muchachos están todavía tan montaraces, que no salieron con ello. Púsose una campana en un campanario de madera, que no causó poca admiración, como cosa no vista ni oída en aquella tierra. Y lo que fue de mucha admiración es que los indios levantaron una cruz delante de la iglesia; y habiéndoles dicho la razón por que los cristianos la adoramos, nosotros y ellos la adoramos todos de rodillas; y aunque es la última que hay en estas partes, espero en nuestro Señor ha de ser principio de que se levanten otras muchas.
    titulo: ESTA CRUZ HA DE SER PRINCIPIO DE QUE SE LEVANTEN OTRAS MUCHAS
  resp2:
    ref: Jn 10, 15-18; cf. Jn 12, 7
    vr:
    - - R
      - Yo doy mi vida por mis ovejas; * nadie me la quita, yo la doy voluntariamente.
    - - V
      - He abandonado mi casa, he entregado mi vida en manos de mis enemigos.
    - - R
      - Nadie me la quita, yo la doy voluntariamente.
  oracion: Señor, haz que tu palabra crezca allá donde los mártires la sembraron y produzca el ciento por uno en frutos de justicia y de paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ISABEL DE HUNGRÍA:
  grado: Memoria
  fecha: variable
  comun: 'Del Común de santas mujeres: para los santos que se distinguieron por el ejercicio de las obras de misericordia.'
  himno: Dichosa la mujer que ha conservado
  lectura2:
    autor: |-
      De una Carta escrita por Conrado de Marburgo, director espiritual de santa Isabel
      (Al Sumo pontífice, año 1232: A. Wyss, «Hessisches Urkundenbuch» 1, Leipzig 1879, 31-35)
    texto: |-
      Pronto Isabel comenzó a destacar por sus virtudes, y, así como durante toda su vida había sido consuelo de los pobres, comenzó luego a ser plenamente remedio de los hambrientos. Mandó construir un hospital cerca de uno de sus castillos y acogió en él gran cantidad de enfermos e inválidos; a todos los que allí acudían en demanda de limosna les otorgaba ampliamente el beneficio de su caridad, y no sólo allí, sino también en todos los lugares sujetos a la jurisdicción de su marido, llegando a agotar de tal modo todas las rentas provenientes de los cuatro principados de éste, que se vio obligada finalmente a vender en favor de los pobres todas las joyas y vestidos lujosos.
      Tenía la costumbre de visitar personalmente a todos sus enfermos, dos veces al día, por la mañana y por la tarde, curando también personalmente a los más repugnantes, a los cuales daba de comer, les hacia la cama, los cargaba sobre sí y ejercía con ellos muchos otros deberes de humanidad; y su esposo, de grata memoria, no veía con malos ojos todas estas cosas. Finalmente, al morir su esposo, ella, aspirando a la máxima perfección, me pidió con lágrimas abundantes que le permitiese ir a mendigar de puerta en puerta.
      En el mismo día del Viernes santo, mientras estaban denudados los altares, puestas las manos sobre el altar de una capilla de su ciudad, en la que había establecido frailes menores, estando presentes algunas personas, renunció a su propia voluntad, a todas las pompas del mundo y a todas las cosas que el Salvador, en el Evangelio, aconsejó abandonar. Después de esto, viendo que podía ser absorbida por la agitación del mundo y por lá gloria mundana de aquel territorio en el que, en vida de su marido, había vivido rodeada de boato, me siguió hasta Marburgo, aun en contra de mi voluntad; allí, en la ciudad, hizo edificar un hospital, en el que dio acogida a enfermos e inválidos, sentando a su mesa a los más míseros y despreciados.
      Afirmo ante Dios que raramente he visto una mujer que a una actividad tan intensa juntara una vida tan contemplativa, ya que algunos religiosos y religiosas vieron más de una vez como, al volver de la intimidad de la oración, su rostro resplandecía de un modo admirable y de sus ojos salían como unos rayos de sol.
      Antes de su muerte la oí en confesión, y, al preguntarle cómo había de disponer de sus bienes y de su ajuar, respondió que hacía ya mucho tiempo que pertenecía a los pobres todo lo que figuraba como suyo, y me pidió que se lo repartiera todo, a excepción de la pobre túnica que vestía y con la que quería ser sepultada. Recibió luego el cuerpo del Señor y después estuvo hablando, hasta la tarde, de las cosas buenas que había oído en la predicación; finalmente, habiendo encomendado a Dios con gran devoción a todos los que la asistían, expiró como quien se duerme plácidamente.
    titulo: ISABEL RECONOCIÓ Y AMÓ A CRISTO EN LA PERSONA DE LOS POBRES
  resp2:
    ref: Jdt 15, 11; Hch 10, 4
    vr:
    - - R
      - 'Actuaste con valor, y tu corazón tuvo fortaleza porque amaste la castidad: * por eso serás por siempre bendita.'
    - - V
      - Tus oraciones y tus obras de caridad han subido hasta Dios como el sacrificio del memorial.
    - - R
      - Por eso serás por siempre bendita.
  oracion: Dios nuestro, que concediste a santa Isabel de Hungría el don de reconocer y venerar a Cristo en los pobres, concédenos, por su intercesión, que sirvamos siempre a los necesitados y afligidos con una incansable caridad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARÍA VIRGEN, MADRE DE LA DIVINA PROVIDENCIA:
  grado: Solemnidad
  fecha: 11-19
  comun: Del Común de la santísima Virgen María.
  himno: Madre de la Divina Providencia
  salmodia:
  - ant: Virgen Madre de Dios, que estás en la presencia de Dios, intercede por nosotros.
    salmo: salmo-23
  - ant: Bendita eres, María, entre todas las mujeres, porque en el peligro fuiste nuestro auxilio.
    salmo: salmo-45
  - ant: Reina sobre nosotros, junto con tu Hijo, porque nos has liberado de la mano de los enemigos.
    salmo: salmo-86
  versiculo:
  - - V
    - María conservaba todas estas cosas.
  - - R
    - Meditándolas en su corazón.
  lectura1:
    ref: Del libro del profeta Isaías 7, 10-14; 8, 10; 11, 1-9
    texto: |-
      En aquellos días, habló el Señor a Ajaz, diciendo:
      "Pide una señal al Señor, tu Dios: en lo hondo del abismo o en lo alto del cielo."
      Respondió Ajaz:
      "No la pido, no quiero tentar al Señor."
      Entonces dijo Isaías:
      "Escucha, heredero de David: ¿No os basta cansar a los hombres, que cansáis incluso a mi Dios? Pues el Señor, por su cuenta, os dará él mismo una señal. Mirad: la joven ha concebido y dará a luz un hijo, y le pondrá por nombre Emmanuel, porque tenemos a Dios-con-nosotros.
      Saldrá un renuevo del tronco de Jesé, y de su raíz brotará un vástago. Sobre él se posará el espíritu del Señor: espíritu de sabiduría y de inteligencia, espíritu de consejo y de fortaleza, espíritu de ciencia y de temor del Señor.
      No juzgará por apariencias ni sentenciará sólo de oídas; juzgará a los pobres con justicia, con rectitud a los desamparados. Herirá al violento con la vara de su boca, y al malvado con el aliento de sus labios. La justicia será el ceñidor de su cintura, y la lealtad el cinturón de sus caderas.
      Habitará el lobo con el cordero, y la pantera se echará con el cabrito, el novillo y el león pacerán juntos: y un niño pequeño los conducirá. La vaca pastará con el oso, sus crías yacerán juntas; el león comerá paja con el buey. El niño jugará junto al agujero del áspid, la criatura meterá la mano en el escondrijo de la serpiente. Nadie hará daño ni estrago por todo mi Monte Santo: porque estará lleno el país de ciencia del Señor, como las aguas colman el mar."
    titulo: EL EMMANUEL REY PACIFICO
  resp1:
    ref: Cf. Ga 4, 4-5; Ef 2,4; Rm 8, 3
    vr:
    - - R
      - Mirad que ya se cumplió el tiempo, y ha enviado Dios a su Hijo a la tierra, nacido de una Virgen, nacido bajo la ley, * para rescatar a los que estaban bajo la ley.
    - - V
      - Por el gran amor con que nos amó, envió a su propio Hijo, sometido a una existencia semejante a la de la carne de pecado.
    - - R
      - Para rescatar a los que estaban bajo la ley.
  lectura2:
    autor: |-
      De los Escritos del padre Juan Semeria, Barnabita.
      (Mater Divinæ Providentiæ, noviembre 1922, pp. 372-375)
    texto: |-
      Muchos hermosos títulos se le dan a la Virgen, en la mayoría de los casos fruto de la simple y espontánea piedad del pueblo, siguiendo esa teología amorosa que es el sensus fidei. Estos títulos emanan un calor de cariño, un perfume de franca bondad. Son poesía, luz, calor, manifiestan una verdad y la expresan eficazmente: esos títulos encierran toda una teología mariana. Al sólo repetirlos se renuevan, se fortalecen ideas y afectos.
      Nuestro título nos introduce de lleno en la teología. Madre: es la síntesis de las grandezas de la "Madonna". Ella es "Madonna" por haber sido madre. ¡Madre de Jesucristo!, esto lo dice todo. De allí brota la grandeza humana de María. Una mujer alcanza la plenitud cuando es madre. Madre es el título más excelso de y para una mujer. Hasta una reina no llega a ser feliz si no es madre; y una madre tiene en la maternidad el secreto de la alegría y el orgullo que una reina no conoce. La madre es bendita entre las mujeres, como María es bendita entre las madres.
      Ese nombre de madre expresa la grandeza divina de María. Más encumbrada que toda criatura, por ser madre de Jesús, hijo del hombre, hijo de Dios. La grandeza divina del Hijo se refleja en la madre. Es bendita entre las madres, es bendita porque el fruto de su vientre se llama Jesús, es Jesucristo.
      María es madre de todos nosotros; madre en Jesús, universal, por eso única. El amor, la acción, el sacrificio de Jesús recorre el mundo, el tiempo, llega a los límites de la tierra, alcanza la eternidad. Y donde llega, donde se ensancha la acción, el amor, la caridad de Cristo, se ensancha el amor de la madre María.
      Pero el título, el canto breve, la rápida, densa poesía continúa: de la divina Providencia, relacionando a María y, a través de esa relación llevándonos a nosotros al dogma fundamental no sólo del cristianismo, sino de toda experiencia religiosa, por muy elemental y pobre que ella sea: el dogma de la Providencia de Dios. Quien se acerque, quien simplemente quiere acercarse a Dios, dar un paso, aunque pequeño, pero sí un paso hacia Dios, no basta con que crea en su existencia, sino que es justo retribuidor de las obras del hombre, próvido en su sentido más fundamental y alto (cfr Heb 11,6). Cuando se cortan los puentes entre cielo y tierra, ¿qué importa que exista el cielo, qué nos importa a nosotros? Es por eso que San Pablo proclama que nuestra vida religiosa no es suficiente la fría y desnuda idea de un Dios: existe Dios. Es necesaria además, la cálida, luminosa benéfica idea de un Dios providente, que piensa en nosotros, que se preocupa de nosotros. El cristianismo, religión cálida, viva, el cristianismo, plena revelación de Dios, empieza allí, está todo en eso de alguna manera. Porque, al aceptar la Providencia, la Providencia de Dios, el resto deriva con una lógica propia, fácil, maravillosa.
      Todo es absurdo, sería absurdo, inconcebible en el cristianismo, al negar u olvidar este dogma grande de la Providencia. Mientras, al aceptar gozosos este dogma, todo es fácil. En eso se fundamenta toda nuestra vida práctica, toda. La vida cristiana es oración; pero no se reza a un Dios orgánicamente sordo y cerrado a nuestras invocaciones. La vida cristiana es coordinación de toda nuestra acción a un fin divinamente prefijado y, más simplemente, es obediencia a Dios; eso sí que sólo se puede obedecer a un Dios que nos mande con amor. La vida cristiana es viril resignación frente al dolor; pero no se puede aceptar con resignación el dolor a no ser que venga de las manos de un padre providente y bueno.
      Con su lindo nombre, con su dulce título, María, Madre de la Divina Providencia, nos guía a este punto central del cristianismo verdadero, sano, santo. Nos introduce suavemente, asiduamente en ese clima que debemos respirar si queremos que nuestra alma sea vigorosa, cristianamente fuerte. La Madre nos conduce al Padre.
    titulo: MADRE DE LA DIVINA PROVIDENCIA.
  resp2:
    ref: ''
    vr:
    - - R
      - Cambia nuestro duelo en día de fiesta, * para que podamos entonar himnos en tu nombre, Señor.
    - - V
      - Convierte nuestro duelo en alegría y nuestra angustia en salvación,
    - - R
