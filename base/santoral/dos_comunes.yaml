# Celebraciones que pueden tomar de dos (o tres) comunes: la rúbrica del libro dice «Del Común de … o del Común de …».
# Se elige al comienzo de la hora (botones debajo de la nota) y la elección vale para todas las horas de ese día.
# El primero de la lista es el de por defecto: en las vírgenes mártires, el de vírgenes; en los presbíteros, el de pastores
# (sobre religiosos, educadores o caridad) (25/11/2026). Claves de base/comunes/ (religiosos, educadores y caridad: de santos varones o de santas mujeres).
# Con propio en la base (sync): lo que es texto de uno de estos comunes se toma del elegido; lo propio queda.
# Un solo común: sin elección; lo que el propio de sync trae de otro común se toma de este (san Bernardo).
# No entran (25/11/2026): los pastores mártires (del común de mártires, sin opción), los pastores que el libro deja
# también en santos varones (Grignon de Montfort, Leandro: del común de pastores, sin opción), los doctores varones (del común de doctores, sin opción), las vírgenes (del común de vírgenes,
# sin opción, salvo las vírgenes mártires: vírgenes o mártires), las doctoras vírgenes (del común de vírgenes, sin
# opción), ni el caso dentro de un común («santos varones: para religiosos», que se completa con el otro).
