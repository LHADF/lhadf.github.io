SANTOS ANDRÉS DUNG-LAC, presbítero, y compañeros, mártires:
  grado: Memoria
  fecha: 11-24
  comun: Del Común de varios mártires.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Testigos de la sangre
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - Los justos viven eternamente.
  - - R
    - Los justos viven eternamente.
  - - V
    - Reciben de Dios su recompensa.
  - - R
    - Viven eternamente.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los justos viven eternamente.
  ant_benedictus: Dichosos los perseguidos por causa de la justicia, pues de ellos es el reino de los cielos.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Oh Dios, fuente y origen de toda paternidad, tú hiciste que los santos mártires Andrés y sus compañeros fueran fieles a la cruz de Cristo, con una fidelidad que llegó hasta el derramamiento de su sangre; concédenos, por su intercesión, que difundamos tu amor entre nuestros hermanos y que nos llamemos y seamos de verdad hijos tuyos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANDRÉS APÓSTOL:
  grado: Fiesta
  fecha: 11-30
  comun: Del Común de Apóstoles.
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Vosotros, que escuchasteis la llamada
  salmodia:
  - ant: Uno de los dos que había ido en seguimiento de Jesús era Andrés, el hermano de Simón Pedro.
    salmo: salmo-62-2-9
  - ant: El Señor amó a Andrés con singular predilección.
    salmo: cantico-dn-3-57-88-56
  - ant: 'Dijo Andrés a su hermano Simón: «Hemos encontrado al Mesías»; y lo presentó a Jesús.'
    salmo: salmo-149
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  ant_benedictus: Salve, oh cruz preciosa, recibe al discípulo de aquel que en ti estuvo clavado, Cristo, mi maestro.
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Dios todopoderoso y eterno, escucha la oración de tu pueblo y concédenos que, así como el apóstol san Andrés fue en la tierra predicador del Evangelio y pastor de tu Iglesia, así ahora en el cielo sea nuestro poderoso abogado ante ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO JAVIER, presbítero:
  grado: Memoria
  fecha: 12-03
  comun: Del común de los pastores, para un santo presbítero -
  inv_ant: Venid, adoremos a Cristo, Pastor supremo.
  himno: Cristo, cabeza, rey de los pastores
  lectura:
    ref: Hb 13, 7-9a
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre. No os dejéis extraviar por doctrinas llamativas y extrañas.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - He colocado centinelas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  ant_benedictus: No sois vosotros los que habláis, sino el Espíritu de vuestro Padre quien habla por vosotros.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor, Dios nuestro, que quisiste que numerosos pueblos llegaran a conocerte por medio de la predicación de san Francisco Javier, concede a todos los bautizados un gran celo por la propagación de la fe, para que así tu Iglesia pueda alegrarse de ver aumentados sus hijos en todo el mundo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN AMBROSIO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 12-07
  comun: 'Del Común de pastores: para una santo obispo y del Común de doctores de la Iglesia.'
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios, que hiciste del obispo san Ambrosio un insigne maestro de la fe católica y un admirable ejemplo de fortaleza apostólica, suscita en tu Iglesia hombres según tu corazón, que guíen siempre a tu pueblo con fortaleza y sabiduría. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  inv_ant: Celebremos a María, concebida sin pecado, y adoremos a su Hijo, Jesucristo el Señor.
  himno: Pureza inmaculada
  salmodia:
  - ant: ¡Qué admirable pureza la de aquella Virgen Madre que no conoció el pecado y que mereció llevar a Dios en su seno!
    salmo: salmo-62-2-9
  - ant: El Señor te ha bendecido, santa Virgen María, más que a todas las mujeres de la tierra.
    salmo: cantico-dn-3-57-88-56
  - ant: Arrástranos tras de ti, Virgen inmaculada, y correremos atraídos por el aroma de tus perfumes.
    salmo: salmo-149
  lectura:
    ref: Is 43, 1
    texto: 'Así dice el Señor, el que te creó, Jacob, el que te formó, Israel: «No temas, que yo te he rescatado, te he llamado por tu nombre; tú eres mío.»'
  responsorio:
  - - V
    - El Dios todopoderoso me ciñe de valor.
  - - R
    - El Dios todopoderoso me ciñe de valor.
  - - V
    - Y me enseña un camino perfecto.
  - - R
    - Me ciñe de valor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Dios todopoderoso me ciñe de valor.
  ant_benedictus: 'El Señor Dios dijo a la serpiente: «Pongo hostilidad entre ti y la mujer, entre tu linaje y el suyo: ella herirá tu cabeza.» Aleluia.'
  preces:
    intro: 'Elevemos nuestras súplicas al salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quién María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
