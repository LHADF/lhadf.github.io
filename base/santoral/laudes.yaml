  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios nuestro, que hiciste admirable a santo Tomás de Aquino por su sed de santidad y por su amor a las ciencias sagradas, te pedimos que nos des su luz para entender sus enseñanzas y fuerza para imitar su vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN BOSCO, presbítero:
  grado: Memoria
  fecha: 01-31
  comun: 'Del Común de santos varones: para los santos educadores.'
  inv_ant: Venid, adoremos al Señor, aclamemos al Dios admirable en sus santos.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: El hombre que se compadece de su prójimo educa, enseña y guía como pastor a su rebaño.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Señor Dios nuestro, que has dado a la Iglesia, en el presbítero san Juan Bosco, un padre y un maestro de la juventud, concédenos que, movidos por un amor semejante al suyo, nos entreguemos a tu servicio, trabajando por la salvación de nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA PRESENTACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 02-02
  inv_ant: Mirad, el Señor llega a su templo santo, venid, adorémosle.
  himno: Estás aquí, Señor, bien lo proclaman
  salmodia:
  - ant: Simeón, hombre recto y piadoso, esperaba la consolación de Israel y el Espíritu Santo moraba en él.
    salmo: salmo-62-2-9
  - ant: Simeón tomó al Niño en sus brazos y, dando gracias, bendijo a Dios.
    salmo: cantico-dn-3-57-88-56
  - ant: Luz para alumbrar a las naciones y gloria de tu pueblo Israel.
    salmo: salmo-149
  lectura:
    ref: Ml 3, 1
    texto: Mirad, yo os envío a mi mensajero para que prepare el camino delante de mí, y pronto entrará en el santuario el Señor a quien vosotros buscáis, el mensajero de la alianza que vosotros deseáis.
  responsorio:
  - - V
    - Postraos ante el Señor en el atrio sagrado.
  - - R
    - Postraos ante el Señor en el atrio sagrado.
  - - V
    - Aclamad la gloria y el poder del Señor.
  - - R
    - En el atrio sagrado.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Postraos ante el Señor en el atrio sagrado.
  ant_benedictus: Cuando entraban sus padres con el niño Jesús, Simeón lo tomó en sus brazos y bendijo a Dios.
  preces:
    intro: 'Adoremos a Cristo, nuestro salvador presentado en el templo, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesús, tú que quisiste ser presentado al Padre en el templo, según estaba prescrito por la ley,
      - enséñanos a ofrecernos contigo al Padre en el sacrificio de tu Iglesia.
    - - Consolador de Israel, a cuyo encuentro en el templo acudió el justo Simeón,
      - haz que también nosotros salgamos a tu encuentro, acogiéndote en cada uno de nuestros hermanos.
    - - Esperado de las naciones, de quien la profetisa Ana habló a todos los que esperaban la redención de Israel,
      - haz que también nosotros hablemos dignamente de ti y anunciemos tu nombre a nuestros hermanos.
    - - Piedra angular del reino de Dios, que has sido predestinado como signo de contradicción,
      - haz que los hombres encuentren en ti, por la fe y el amor, su resurrección y no su ruina.
    respuesta: Que nuestros ojos vean tu salvación.
  padrenuestro_intro: 'Con el deseo de que la luz de Cristo ilumine a todos los hombres, pidamos al Padre que su reino llegue al mundo:'
  oracion: Dios todopoderoso y eterno, en este día en que tu Hijo único fue presentado en el templo con un cuerpo como el nuestro, te pedimos nos concedas a nosotros poder ser presentados ante ti, plenamente renovados en nuestro espíritu. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ÁGUEDA, virgen y mártir:
  grado: Memoria
  fecha: variable
  comun: Del Común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Contenta y alegre, se dirigía Águeda a la cárcel, como invitada a bodas, y encomendaba al Señor su combate, con oración ferviente.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Que nos alcancen tu perdón, Señor, las súplicas de santa Águeda, ella que tanto te agradó por el resplandor de su virginidad y por la fortaleza de su martirio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FELIPE DE JESÚS, protomártir mexicano:
  grado: Fiesta
  fecha: 02-05
  comun: 'Del Común de varios mártires: para un mártir.'
  inv_ant: Venid, adoremos al Señor, rey de los mártires. Aleluia.
  himno: Salve, atleta victorioso
  salmodia:
  - ant: Felipe sufrió el martirio y confesó el nombre de nuestro Señor Jesucristo.
    salmo: salmo-62-2-9
  - ant: 'San Felipe exclamó: «Jesús, Jesús, Jesús», y entregó su espíritu al Señor.'
    salmo: cantico-dn-3-57-88-56
  - ant: Te doy gracias, Señor Jesucristo, porque he merecido dar testimonio de tu fe.
    salmo: salmo-149
  lectura:
    ref: Rm 10, 10-15
    texto: 'Con el corazón creemos para obtener la justificación y con la boca hacemos profesión de nuestra fe para alcanzar la salvación. Pues dice la Escritura: «Todo el que crea en él no será confundido.» Porque ya no hay distinción entre judío y gentil, ya que uno mismo es el Señor de todos, rico para todos los que lo invocan. Pues todo el que invoque el nombre del Señor se salvará. Pero, ¿cómo invocarán a aquel en quien no han creído? Y ¿cómo oirán si nadie les predica? Y ¿cómo predicarán si no son enviados? Como dice la Escritura: «¡Qué hermosos son los pies de los que anuncian el bien!».'
  responsorio:
  - - V
    - Dichoso el hombre que soporta la prueba.
  - - R
    - Dichoso el hombre que soporta la prueba.
  - - V
    - Porque, una vez aquilatado, recibirá la corona de la vida.
  - - R
    - El hombre que soporta la prueba.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dichoso el hombre que soporta la prueba.
  ant_benedictus: Un tiempo erais tinieblas, pero ahora sois luz en el Señor; caminad, pues, como hijos de la luz.
  preces:
    intro: 'Agradezcamos al Señor que en san Felipe de Jesús nos ha dado un modelo para servirlo a él y a nuestros hermanos hasta el completo sacrificio:'
    preces:
    - - Te alabamos, Señor, pues por medio de san Felipe de Jesús y sus compañeros mártires nos muestras el camino de la completa autenticidad;
      - concédenos profesar abnegada y generosamente nuestra fe.
    - - Te bendecimos, Señor, porque quisiste que san Felipe de Jesús fuese portador del mensaje de la cruz a lejanas tierras;
      - haz que México sea siempre fiel a tu doctrina y la difunda entre las naciones que menos te conocen.
    - - Te glorificamos, Señor, porque por medio de tus misioneros continúas tu presencia entre nosotros y en el mundo;
      - concédenos que nuestros misioneros sean totalmente fieles a su misión de servir a tu palabra.
    - - Te damos gracias, Señor, porque has querido que el testimonio del santo Evangelio vaya arraigando en nuestro patrio suelo y que desde él se difunda a otras naciones;
      - concédenos saber confesar siempre nuestra fe con las palabras y con las obras.
    respuesta: Concédenos, Señor, servir generosamente a nuestros hermanos.
  padrenuestro_intro: 'Revistiéndonos del Espíritu de Jesús, digamos confiadamente la oración que él mismo nos enseñó:'
  oracion: Dios nuestro, que te dignaste aceptar la sangre de san Felipe de Jesús como una primicia de la fe de nuestro pueblo, concédenos, por su intercesión, madurar en esa misma fe, para que demos testimonio de ella no sólo con las palabras, sino sobre todo con los actos de nuestra vida diaria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
