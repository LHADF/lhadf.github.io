SAN IGNACIO DE ANTIOQUÍA, obispo y mártir:
  grado: Memoria
  fecha: 10-17
  comun: Del común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Todo mi deseo y mi voluntad están puestos en aquel que por nosotros murió y resucitó.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios todopoderoso y eterno, que has querido que el testimonio de los mártires sea el honor de todo el cuerpo de tu Iglesia, concédenos que el martirio de san Ignacio de Antioquia, que hoy conmemoramos, así como le mereció a él una gloria eterna, así también nos dé a nosotros valor en el combate de la fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN LUCAS, evangelista:
  grado: Fiesta
  fecha: 10-18
  comun: Del común de apóstoles.
  inv_ant: Venid, adoremos al Señor, que nos habla por medio del Evangelio.
  himno: Vosotros, que escuchasteis la llamada
  salmodia:
  - ant: Los santos evangelistas se entregaron de lleno a indagar la sabiduría de sus predecesores y, con sus escritos, confirmaron las explicaciones de los profetas.
    salmo: salmo-62-2-9
  - ant: Dios nos convocó por medio del mensaje de la salud, para darnos la posesión de la gloria de nuestro Señor Jesucristo.
    salmo: cantico-dn-3-57-88-56
  - ant: Muchos alabarán su inteligencia, su fama vivirá por generaciones.
    salmo: salmo-149
  lectura:
    ref: 1Co 15, 1-2a. 3-4
    texto: 'Hermanos: Os quiero traer a la memoria el mensaje evangélico que os prediqué; el que abrazasteis, el mismo en que os mantenéis firmes todavía y por el que estáis en camino de salvación. En primer lugar os comuniqué el mensaje que yo mismo recibí: Que Cristo murió por nuestros pecados, según las Escrituras, y fue sepultado; resucitó al tercer día y vive, según lo anunciaron también las Escrituras.'
  responsorio:
  - - V
    - Proclamaron las alabanzas del Señor y su poder.
  - - R
    - Proclamaron las alabanzas del Señor y su poder.
  - - V
    - Y las maravillas que realizó.
  - - R
    - Y su poder.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Proclamaron las alabanzas del Señor y su poder.
  ant_benedictus: Al entregarnos su evangelio, san Lucas nos anunció a Cristo, el sol que nace de lo alto.
  preces:
    intro: 'Aclamemos a nuestro Salvador, que ha aniquilado la muerte, y ha hecho brillar la vida y la inmortalidad por el Evangelio, y supliquémosle, diciendo:'
    preces:
    - - Tú que por medio de doctores santos y eximios has glorificado a tu Iglesia,
      - haz que todos los cristianos resplandezcan por su virtud.
    - - Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles,
      - purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos.
    - - Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos,
      - llena también de tu Espíritu a todos los pastores del pueblo de Dios.
    - - Tú que fuiste la heredad de los santos pastores,
      - no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti.
    respuesta: Confirma a tu Iglesia en la fe y la caridad.
  padrenuestro_intro: 'Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oracion: Señor Dios, que elegiste a san Lucas para que, con su predicación y sus escritos, revelara al mundo tu amor hacia los pobres, concede a quienes nos gloriamos de ser cristianos vivir unidos con un solo corazón y una sola alma y haz que todos los pueblos lleguen a contemplar a tu Salvador. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS SIMÓN Y JUDAS, apóstoles:
  grado: Fiesta
  fecha: 10-28
  comun: Del Común de apóstoles
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Vosotros, que escuchasteis la llamada
  salmodia:
  - ant: 'Éste es mi mandamiento: que os améis unos a otros como yo os he amado.'
    salmo: salmo-62-2-9
  - ant: Nadie tiene amor más grande que el que da la vida por sus amigos.
    salmo: cantico-dn-3-57-88-56
  - ant: Vosotros sois mis amigos si hacéis lo que yo os mando.
    salmo: salmo-149
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  ant_benedictus: 'El muro de la ciudad tenía doce cimientos que llevaban doce nombres: los nombres de los apóstoles del Cordero: y su lámpara es el Cordero.'
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Dios nuestro, que quisiste que te conociéramos por la predicación de los apóstoles, concédenos, por la intercesión de los santos Simón y Judas, que tu Iglesia siga creciendo en el mundo, acogiendo continuamente en su seno a nuevos pueblos que vengan a la fe en ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
TODOS LOS SANTOS:
  grado: Solemnidad
  fecha: 11-01
  inv_ant: Venid, adoremos al Señor, a quien glorifica la asamblea de los santos.
  himno: Vosotros sois luz del mundo
  salmodia:
  - ant: Los santos tienen su morada en el reino de Dios, y allí han encontrado descanso eterno. Aleluia.
    salmo: salmo-62-2-9
  - ant: Santos de Dios, bendecid al Señor eternamente.
    salmo: cantico-dn-3-57-88-56
  - ant: Cantemos el himno de alabanza de todos los santos, de Israel, su pueblo escogido; es un honor para todos sus fieles.
    salmo: salmo-149
  lectura:
    ref: Ef 1, 17-18
    texto: El Dios de nuestro Señor Jesucristo, el Padre de la gloria, quiera concederos el don de sabiduría y de revelación, para que lleguéis al pleno conocimiento de él e, iluminados así los ojos de vuestra mente, conozcáis cuál es la esperanza a que nos ha llamado y cuáles las riquezas de gloria otorgadas por él como herencia a su pueblo santo.
  responsorio:
  - - V
    - Alegraos, justos, y gozad con el Señor.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  - - V
    - Aclamadlo, los de corazón sincero.
  - - R
    - Y gozad con el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  ant_benedictus: Los santos brillarán como el sol en el reino de su Padre. Aleluia.
  preces:
    intro: 'Acudamos, alegres, a nuestro Dios, corona de todos los santos, y digámosle:'
    preces:
    - - Oh Señor, fuente y origen de toda santidad, tú que has hecho resplandecer a los santos con gran variedad de dones,
      - haz que al contemplarlos sepamos celebrar tu grandeza.
    - - Señor todopoderoso, que has querido que los santos fueran imágenes admirables de tu Hijo,
      - concédenos que, por su ejemplo y su intercesión, vivamos más plenamente unidos a Cristo.
    - - Rey del cielo, que por medio de los fieles seguidores de Cristo nos estimulas a desear la ciudad futura,
      - haz que descubramos en los santos el mejor camino que lleva a ti.
    - - Dios y Señor nuestro, que en la celebración de la eucaristía nos pones en comunión con los santos,
      - concédenos celebrar cada día con mayor perfección tu culto en espíritu y en verdad.
    respuesta: Por intercesión de todos los santos, sálvanos, Señor.
  padrenuestro_intro: 'Con el gozo que nos da sabernos miembros de la gran familia de los santos, digamos al Padre de todos:'
  oracion: Dios todopoderoso y eterno, que nos concedes celebrar los méritos de todos los santos en una misma solemnidad, te rogamos que, por las súplicas de tan numerosos intercesores, nos concedas en abundancia los dones que te pedimos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MARTIN DE PORRES, religioso:
  grado: Memoria
  fecha: 11-03
  comun: Del Común de santos varones para los santos religiosos.
  inv_ant: Aclamemos al Señor, en esta fiesta de san Martín de Porres.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: Bendito sea el Señor, porque ha redimido a todos los pueblos, y a todos los ha llamado de las tinieblas a su luz admirable.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Señor, Dios nuestro, que llevaste a san Martín de Porres a la gloria celestial, por medio de una vida escondida y humilde, concédenos seguir de tal manera sus ejemplos, que merezcamos, como él, ser llevados al cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN CARLOS BORROMEO, obispo:
  grado: Memoria
  fecha: 11-04
  comun: 'Del común de pastores: para un santo obispo.'
  inv_ant: Venid, adoremos a Cristo, Pastor supremo.
  himno: Cristo, cabeza, rey de los pastores
  lectura:
    ref: Hb 13, 7-9a
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre. No os dejéis extraviar por doctrinas llamativas y extrañas.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - He colocado centinelas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  ant_benedictus: No sois vosotros los que habláis, sino el Espíritu de vuestro Padre quien habla por vosotros.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Conserva en tu pueblo, Señor, el espíritu que animara a san Carlos Borromeo, obispo, para que tu Iglesia se renueve siempre y, cada vez más transformada en Cristo, presente ante los hombres una imagen auténtica de su Señor, Jesucristo, tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
MARÍA, MEDIANERA DE TODAS LAS GRACIAS:
  grado: Memoria
  fecha: 11-07
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Venid, adoremos a Cristo, Hijo de María Virgen.
  himno: Eres tú la mujer llena de gloria
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Por Eva se cerraron a los hombres las puertas del paraíso, y por María Virgen han sido abiertas de nuevo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu Madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Palabra eterna del Padre, que enseñaste a María a escoger la parte mejor,
      - ayúdanos a imitarla y a buscar el alimento que perdura hasta la vida eterna.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    - - Señor del cielo y de la tierra, que has colocado a tu derecha a María reina,
      - danos el gozo de tener parte en su gloria.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, por el misterioso designio de tu amor, has querido que la Virgen María fuese madre del autor de la gracia y estuviese asociada a él en el misterio de la redención humana; que ella nos alcance con profusión tus dones y nos conduzca hasta el puerto de la salvación eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA DEDICACIÓN DE LA BASÍLICA DE SAN JUAN DE LETRÁN:
  grado: Fiesta
  fecha: 11-09
  comun: Del Común de la dedicación de una iglesia.
  inv_ant: Venid, adoremos a Cristo, que amó a la Iglesia y se entregó por ella.
  himno: El cielo y la tierra
  salmodia:
  - ant: Mi casa se llama casa de oración.
    salmo: salmo-62-2-9
  - ant: Bendito eres, Señor, en el templo de tu santa gloria.
    salmo: cantico-dn-3-57-88-56
  - ant: Cantad al Señor en la asamblea de los fieles.
    salmo: salmo-149
  lectura:
    ref: Is 56, 7
    texto: Los traeré a mi monte santo, los alegraré en mi casa de oración; aceptaré sobre mi altar sus holocaustos y sacrificios; porque mi casa es casa de oración y así la llamarán todos los pueblos.
  responsorio:
  - - V
    - Grande es el Señor y muy digno de alabanza.
  - - R
    - Grande es el Señor y muy digno de alabanza.
  - - V
    - En la ciudad de nuestro Dios, en su monte santo.
  - - R
    - Muy digno de alabanza.
  - - V
    - Gloria al Padre, al Hijo, y al Espíritu Santo
  - - R
    - Grande es el Señor y muy digno de alabanza.
  ant_benedictus: «Zaqueo, baja en seguida, porque hoy tengo que alojarme en tu casa.» Él bajó en seguida, y lo recibió muy contento. «Hoy Dios ha dado la salvación a esta casa.» Aleluia.
  preces:
    intro: 'Como piedras vivas, edificadas sobre Cristo, la piedra escogida, oremos al Padre todopoderoso por su Iglesia amada, y confesemos nuestra fe en ella diciendo:'
    preces:
    - - Padre del cielo, tú que eres el labrador de la vid, guarda, purifica y acrecienta tu viña,
      - haciendo que sus sarmientos llenen toda la tierra.
    - - Pastor eterno, protege y acrecienta tu rebaño,
      - y haz que todas las ovejas se reúnan en un solo redil bajo el cayado del único pastor, Jesucristo, tu Hijo.
    - - Sembrador todopoderoso, siembra la Palabra en tu campo,
      - y haz que dé frutos del ciento por uno para la vida eterna.
    - - Arquitecto prudente, santifica tu familia, que es la Iglesia,
      - y haz que aparezca ante el mundo como ciudad celestial, esposa sin tacha y Jerusalén del cielo.
    respuesta: Ésta es la casa de Dios y la puerta del cielo.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras que Cristo nos enseñó:'
  oracion: 'Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo como cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
SAN LEÓN MAGNO, papa y doctor de la Iglesia:
  grado: Memoria
  fecha: 11-10
  comun: Del Común de pastores para un santo papa y del Común de doctores de la Iglesia.
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: San Pedro, manteniéndose en la firmeza de piedra que recibió, no suelta el timón de la Iglesia.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor, tú que nos has prometido que las fuerzas del mal nunca prevalecerán contra la Iglesia, cimentada sobre la roca de Pedro, haz que, por la intercesión del papa san León Magno, tu pueblo permanezca siempre firme en la verdad y goce de una paz estable y verdadera. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MARTÍN DE TOURS, obispo:
  grado: Memoria
  fecha: 11-11
  comun: 'Del Común de pastores: para un santo obispo.'
  inv_ant: Aclamemos al Señor, al recordar hoy a san Martín.
  himno: Cristo, cabeza, rey de los pastores
  salmodia:
  - ant: Martín, sacerdote de Dios, el cielo, el reino de mi Padre, te ha sido abierto.
    salmo: salmo-62-2-9
  - ant: Con los ojos y las manos continuamente levantados al cielo, no cejaba en la oración. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Martín, lleno de alegría, fue recibido en el seno de Abraham; Martín pobre y humilde entró en el cielo, cargado de riquezas. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Hb 13, 7-8
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - He colocado centinelas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  ant_benedictus: '¡Oh varón dichoso, cuya alma posee ya el paraíso! Por ello se alegran los ángeles, se regocijan los arcángeles; y el coro de los santos y la multitud de las vírgenes lo aclaman, diciendo: «Quédate con nosotros para siempre.»'
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Renueva, Señor, en nosotros las maravillas de tu gracia, para que, al celebrar hoy la memoria de san Martín, obispo, que te glorificó, tanto con su vida como con su muerte, nos sintamos de tal modo fortalecidos, que ni la vida ni la muerte puedan separarnos de tu amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSAFAT, obispo y mártir:
  grado: Memoria
  fecha: 11-12
  comun: Del Común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: El que se aborrece a sí mismo en este mundo se guardará para la vida eterna.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Aviva, Señor, en tu Iglesia aquel fuego del Espíritu Santo que impulsó a san Josafat a dar la vida por su pueblo, y haz que también nosotros, fortalecidos por este mismo Espíritu y ayudados por la plegaria de este santo, estemos dispuestos, si es preciso, a dar la vida por nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
