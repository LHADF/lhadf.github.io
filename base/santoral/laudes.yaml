LA ANUNCIACIÓN DEL SEÑOR:
  grado: Solemnidad
  fecha: 03-25
  inv_ant: Adoremos al que es la Palabra y se ha hecho carne por nosotros.
  himno: Que hoy bajó Dios a la tierra
  salmodia:
  - ant: Fue enviado el ángel Gabriel a una virgen desposada con un hombre llamado José.
    salmo: salmo-62-2-9
  - ant: Bendita tú entre las mujeres y bendito el fruto de tu vientre.
    salmo: cantico-dn-3-57-88-56
  - ant: Con su consentimiento la Virgen concibió y, permaneciendo virgen, dio a luz al Salvador.
    salmo: salmo-149
  lectura:
    ref: Flp 2, 6-7
    texto: Cristo, a pesar de su condición divina, no hizo alarde de su categoría de Dios, al contrario, se anonadó a sí mismo, y tomó la condición de esclavo, pasando por uno de tantos.
  responsorio:
  - - V
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - V
    - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  - - R
    - El Señor está contigo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  ant_benedictus: Por el gran amor con que Dios nos amó nos envió a su Hijo en semejanza de carne de pecado.
  preces:
    intro: 'Al celebrar en este día de la Anunciación los comienzos de la salvación de los hombres, llenos de alegría, oremos, diciendo:'
    preces:
    - - Señor, haz que recibamos a nuestro Salvador
      - con la misma alegría con que María recibió alegre el anuncio del ángel.
    - - Tú que miraste la humillación de tu esclava,
      - acuérdate también de nosotros y socórrenos.
    - - Que sepamos conformarnos siempre a tu voluntad,
      - como María, la nueva Eva, se sometió siempre a tu palabra.
    - - Que santa María socorra a los pobres, levante a los decaídos, consuele a los tristes,
      - interceda por las vírgenes, por las madres y esposas, y por todas las jóvenes y niñas.
    respuesta: Que la santa Madre de Dios interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor Dios nuestro, que quisiste que tu Verbo se hiciera hombre en el seno de la Virgen María, concede a quienes proclamamos que nuestro Redentor es realmente Dios y hombre que lleguemos a ser partícipes de su naturaleza divina. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN BAUTISTA DE LA SALLE, presbítero:
  grado: Memoria
  fecha: 04-07
  comun: 'Del común de santos varones: para los santos educadores.'
  inv_ant: Venid, adoremos al Señor, aclamemos al Dios admirable en sus santos. Aleluia.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios. Aleluia, aleluia.
  - - R
    - Lleva en el corazón la ley de su Dios. Aleluia, aleluia.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios. Aleluia, aleluia.
  ant_benedictus: El hombre que se compadece de su prójimo educa, enseña y guía como pastor a su rebaño. Aleluia.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle, diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y la luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Señor, Dios nuestro, que elegiste a san Juan Bautista de la Salle para educar cristianamente a la juventud, suscita en tu Iglesia educadores que se consagren por entero a la formación humana y cristiana de los jóvenes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ESTANISLAO, Obispo y mártir:
  grado: Memoria
  fecha: 04-11
  comun: Del común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires. Aleluia.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 1Jn 5, 3-5
    texto: 'En esto consiste el amor a Dios: en que guardemos sus mandamientos. Y sus mandamientos no son pesados, pues todo el que ha nacido de Dios vence al mundo. Y ésta es la victoria que vence al mundo: nuestra fe; porque, ¿quién es el que vence al mundo, sino el que cree que Jesús es el Hijo de Dios?'
  responsorio:
  - - V
    - La alegría eterna coronará a los santos. Aleluia, aleluia.
  - - R
    - La alegría eterna coronará a los santos. Aleluia, aleluia.
  - - V
    - Vivirán en el gozo y la exultación.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La alegría eterna coronará a los santos. Aleluia, aleluia.
  ant_benedictus: Estad alegres y contentos, santos de Dios, pues vuestra recompensa es grande en el cielo. Aleluia.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Señor, tú que concediste al santo obispo Estanislao la valentía de derramar su sangre para confesar tu nombre, haz que también nosotros permanezcamos firmes en la fe, hasta morir, si es necesario, por conservarla. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MARCOS, Evangelista:
  grado: Fiesta
  fecha: 04-25
  comun: Del Común de apóstoles.
  inv_ant: Venid, adoremos al Señor, que nos habla por medio del Evangelio. Aleluia.
  himno: Con el gozo pascual
  salmodia:
  - ant: Los santos evangelistas se entregaron de lleno a indagar la sabiduría de sus predecesores y, con sus escritos, confirmaron las explicaciones de los profetas. Aleluia.
    salmo: salmo-62-2-9
  - ant: Dios nos convocó por medio del mensaje de la salud, para darnos la posesión de la gloria de nuestro Señor Jesucristo. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Muchos alabarán su inteligencia, su fama vivirá por generaciones. Aleluia.
    salmo: salmo-149
  lectura:
    ref: 1Co 15, 1-2a. 3-4
    texto: 'Hermanos: Os quiero traer a la memoria el mensaje evangélico que os prediqué; el que abrazasteis, el mismo en que os mantenéis firmes todavía y por el que estáis en camino de salvación. En primer lugar os comuniqué el mensaje que yo mismo recibí: Que Cristo murió por nuestros pecados, según las Escrituras, y fue sepultado; resucitó al tercer día y vive, según lo anunciaron también las Escrituras.'
  responsorio:
  - - V
    - Proclamaron las alabanzas del Señor y su poder. Aleluia, aleluia.
  - - R
    - Proclamaron las alabanzas del Señor y su poder. Aleluia, aleluia.
  - - V
    - Y las maravillas que realizó.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Proclamaron las alabanzas del Señor y su poder. Aleluia, aleluia.
  ant_benedictus: La gracia de Cristo ha constituido, a unos, evangelistas y, a otros, doctores, y los ha enviado al pueblo creyente como ministros de la fe. Aleluia.
  preces:
    intro: 'Glorifiquemos a Cristo, luz del mundo por el Evangelio, y, poniendo en sus manos nuestras vidas, digámosle:'
    preces:
    - - Tú que has mostrado familiarmente tu divinidad en medio de los hombres,
      - no dejes de resplandecer hoy en tu Iglesia con los múltiples signos de tu gloria.
    - - Tú que te acercas a nosotros por las palabras vivas de los evangelistas,
      - danos durante este día el gozo de tu presencia.
    - - Tú que por la cruz y la resurrección has manifestado la soberanía del amor del Padre,
      - acoge el trabajo y el dolor de los hombres y transfórmalos en ofrenda de salvación.
    - - Tú que en la naciente Iglesia escogiste a Marcos como evangelizador y evangelista,
      - haz que nosotros seamos hoy con nuestras palabras y ejemplos testigos del Evangelio.
    respuesta: Guía, Señor, a tu Iglesia con la fuerza del Evangelio.
  padrenuestro_intro: Digamos llenos de confianza la oración que Jesús enseñó a los apóstoles.
  oracion: Señor, tú que diste a san Marcos el carisma de anunciar el Evangelio, haz que sepamos aprovecharnos de sus escritos y por ellos aprendamos a seguir fielmente a Jesucristo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  inv_ant: Venid, adoremos a Cristo, Pastor supremo. Aleluia.
  himno: Cristo, cabeza, rey de los pastores
  salmodia:
  - ant: Vosotros sois la luz del mundo. No se puede ocultar una ciudad puesta en lo alto de un monte. Aleluia.
    salmo: salmo-62-2-9
  - ant: Alumbre así vuestra luz a los hombres, para que vean vuestras buenas obras y den gloria a vuestro Padre. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: La palabra de Dios es viva y eficaz, más tajante que espada de doble filo. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Hb 13, 7-9a
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre. No os dejéis extraviar por doctrinas llamativas y extrañas.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas. Aleluia, aleluia.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas. Aleluia, aleluia.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas. Aleluia, aleluia.
  ant_benedictus: No sois vosotros los que habláis, sino el Espíritu de vuestro Padre quien habla por vosotros. Aleluia.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor, tú has querido fortalecer a tu Iglesia en América mediante los trabajos apostólicos y el celo por la verdad de tu obispo santo Toribio, concede al pueblo a ti consagrado crecer constantemente en fe y dar auténticos frutos de santidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
