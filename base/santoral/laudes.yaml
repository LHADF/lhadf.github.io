    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Tú, Señor, que por medio de los santos hermanos Cirilo y Metodio iluminaste con la luz del Evangelio a las naciones eslavas, haz que nosotros, unidos en la confesión de la fe verdadera, demos al mundo, por nuestra unidad, testimonio del nombre cristiano. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA CÁTEDRA DE SAN PEDRO, APÓSTOL:
  grado: Fiesta
  fecha: 02-22
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Tú, Cefas, eres Pedro y eres roca
  salmodia:
  - ant: 'El Señor dijo a Simón: «Ten ánimo, de hoy en adelante vas a ser pescador de hombres.»'
    salmo: salmo-62-2-9
  - ant: «Tú eres el Mesías, el Hijo de Dios vivo.» «Bienaventurado eres tú, Simón Pedro.»
    salmo: cantico-dn-3-57-88-56
  - ant: 'El Señor dijo a Pedro: «Yo te daré las llaves del reino de los cielos.»'
    salmo: salmo-149
  lectura:
    ref: Hch 15, 7b-9
    texto: Dios determinó que por mi boca escuchasen los gentiles la doctrina del Evangelio y llegasen a la fe. Dios, que conoce los corazones, se ha declarado en favor de ellos, al darles el Espíritu Santo, igual que a nosotros; y no ha establecido diferencia alguna entre ellos y nosotros, pues ha purificado sus corazones por la fe.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  ant_benedictus: 'Dijo el Señor a Simón Pedro: «Yo he rogado por ti, para que tu fe no desfallezca; y tú, una vez convertido, confirma a tus hermanos.»'
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: No permitas, Señor, que ninguna desorientación llegue a perturbar nunca la fe de la Iglesia, que tú quisiste estuviera cimentada sobre la roca sólida de la confesión del apóstol san Pedro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN POLICARPO, obispo y mártir:
  grado: Memoria
  fecha: 02-23
  comun: Del Común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Hace ochenta y seis años que sirvo a Cristo, y nunca he recibido de él más que bienes; ¿cómo podría ahora maldecir a mi rey y salvador?
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios y Señor de todo lo creado, que quisiste que san Policarpo fuera contado entre tus mártires, concédenos, por su intercesión, participar con él en la pasión de Cristo, para poder así resucitar, también con él, a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSÉ, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 03-19
  inv_ant: Adoremos a Cristo, el Señor, en esta solemnidad de san José.
  himno: Escuchen qué cosa y cosa
  salmodia:
  - ant: Los pastores vinieron presurosos y encontraron a María y a José, y al niño acostado en un pesebre.
    salmo: salmo-62-2-9
  - ant: José y María, la madre de Jesús, estaban maravillados de lo que se decía de él, y Simeón los bendijo.
    salmo: cantico-dn-3-57-88-56
  - ant: Se levantó José y tomó de noche al niño y a su madre, y partió para Egipto, y allí permaneció hasta la muerte de Herodes.
    salmo: salmo-149
  lectura:
    ref: 2S 7, 28-29
    texto: Mi Señor, tú eres el Dios verdadero, tus palabras son de fiar, y has hecho esta promesa a tu siervo. Dígnate, pues, bendecir a la casa de tu siervo, para que esté siempre en tu presencia; ya que tú, mi Señor, lo has dicho, sea siempre bendita la casa de tu siervo.
  responsorio:
  - - V
    - Lo nombró administrador de su casa.
  - - R
    - Lo nombró administrador de su casa.
  - - V
    - Señor de todas sus posesiones.
  - - R
    - Administrador de su casa.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lo nombró administrador de su casa.
  ant_benedictus: 'José se estableció en una ciudad llamada Nazaret; así se cumplió lo que de Cristo habían anunciado los profetas: que sería llamado Nazareno.'
  preces:
    intro: 'Acudamos suplicantes al Señor, el único que puede hacernos justos, y digámosle suplicantes:'
    preces:
    - - Tú, Señor, que llamaste a nuestros padres en la fe para que caminasen en tu presencia con un corazón sincero,
      - haz que también nosotros, siguiendo sus huellas, seamos santos ante tus ojos.
    - - Tú que elegiste a José, varón justo, para que cuidara de tu Hijo durante su niñez y adolescencia,
      - haz que también nosotros nos consagremos al servicio del cuerpo de Cristo, sirviendo a nuestros hermanos.
    - - Tú que entregaste la tierra a los hombres para que la llenaran y la sometieran,
      - ayúdanos a trabajar con empeño en nuestro mundo, pero teniendo siempre nuestros ojos puestos en tu gloria.
    - - No te olvides, Padre del universo, de la obra de tus manos
      - y haz que todos los hombres, mediante su trabajo honesto, tengan una vida digna.
    respuesta: Con tu justicia, Señor, danos vida.
  padrenuestro_intro: 'Porque somos miembros de la familia de Dios, nos atrevemos a decir:'
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
