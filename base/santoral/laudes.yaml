    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, Dios nuestro, en tu admirable providencia quisiste que la Madre de tu único Hijo experimentase las angustias y los sufrimientos humanos; por la intercesión de María, consuelo de los afligidos y libertadora de los cautivos, concede a los que sufren cualquier modo de esclavitud la verdadera libertad de los hijos de Dios. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
