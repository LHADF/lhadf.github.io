  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Oh Dios, que a san Maximiliano María, apóstol de la Inmaculada y ejemplo de caridad hacia el prójimo, le infundiste un deseo ardiente de la salvación de los hombres, concédenos, por su intercesión, poder trabajar generosamente por tu gloria y por la salvación de los hombres hasta dar nuestra propia vida, como lo hizo tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA ASUNCIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 08-15
  inv_ant: Venid, adoremos al Rey de reyes, cuya Madre ha sido elevada a lo más alto del cielo.
  himno: Sólo la Niña aquella, la Niña inmaculada
  salmodia:
  - ant: Dichosa eres, María, porque de ti vino la salvación del mundo; tú ahora vives ya en la gloria del Señor.
    salmo: salmo-62-2-9
  - ant: La Virgen María ha sido glorificada sobre los coros de los ángeles; que se alegren los fieles y bendigan todos al Señor.
    salmo: cantico-dn-3-57-88-56
  - ant: El Señor ha glorificado tanto tu nombre, que tu alabanza no se apartará de la boca de los hombres.
    salmo: salmo-149
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - Hoy la Virgen María ha subido al cielo.
  - - R
    - Hoy la Virgen María ha subido al cielo.
  - - V
    - Y con Cristo reina eternamente.
  - - R
    - Ha subido al cielo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Hoy la Virgen María ha subido al cielo.
  ant_benedictus: Eres bella y hermosa, Hija de Jerusalén; subes al cielo, resplandeciente como la aurora cuando amanece.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen y digámosle:'
    preces:
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    - - Señor del cielo y de la tierra, que has colocado a tu derecha a María reina,
      - danos el gozo de tener parte en su gloria.
    respuesta: Mira a la llena de gracia y escúchanos.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Dios todopoderoso y eterno, que has elevado en cuerpo y alma a los cielos a la inmaculada Virgen María, madre de tu Hijo, haz que nosotros, ya desde este mundo, tengamos todo nuestro ser totalmente orientado hacia el cielo, para que podamos llegar a participar de su misma gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
