    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Señor, que la intercesión de tu mártir san Bonifacio nos ayude a mantener con firmeza y a proclamar con nuestras obras aquella misma fe que él predicó con su palabra y testimonió con su sangre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL SANTÍSIMO CUERPO Y SANGRE DE CRISTO:
  grado: Solemnidad
  fecha: variable
  inv_ant: A Cristo el Señor, el pan de vida, venid, adorémosle.
  himno: Sin dejar la derecha de su Padre
  salmodia:
  - ant: Alimentaste a tu pueblo con manjar de ángeles y les enviaste pan desde el cielo. Aleluia.
    salmo: salmo-62-2-9
  - ant: Los sacerdotes consagrados ofrecen a Dios incienso y panes. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Al vencedor le daré del maná escondido y un nombre nuevo. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Ml 1, 11
    texto: Desde el oriente hasta el poniente es grande mi nombre entre las naciones, y en todo lugar se ofrecerá incienso a mi nombre y una oblación pura, porque mi nombre es grande entre las naciones —dice el señor de los ejércitos—.
  responsorio:
  - - V
    - Sacas pan de los campos. Aleluia, aleluia.
  - - R
    - Sacas pan de los campos. Aleluia, aleluia.
  - - V
    - Y el vino que alegra el corazón del hombre.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sacas pan de los campos. Aleluia, aleluia.
  ant_benedictus: Yo soy el pan vivo bajado del cielo; todo el que coma de este pan vivirá eternamente. Aleluia.
  preces:
    intro: 'Oremos, hermanos, al Señor Jesús, pan de vida, y digamos llenos de gozo:'
    preces:
    - - Cristo Jesús, sacerdote de la alianza nueva y eterna, que sobre el altar de la cruz presentaste al Padre el sacrificio perfecto,
      - enséñanos a ofrecerlo contigo en el sacrificio eucarístico.
    - - Cristo, Señor nuestro, rey supremo de justicia y de paz, que consagraste el pan y el vino como símbolo de tu propia oblación,
      - enséñanos a ofrecernos contigo al Padre en el sacrificio eucarístico.
    - - Cristo Jesús, verdadero adorador del Padre, cuyo sacrificio ofrece tu Iglesia desde la salida del sol hasta el ocaso,
      - reúne en tu cuerpo a los que alimentas de un mismo pan.
    - - Cristo, Señor nuestro, maná bajado del cielo, que alimentas a tu Iglesia con tu cuerpo y con tu sangre,
      - fortalécenos con este alimento en nuestro camino hacia el Padre.
    - - Cristo Jesús, huésped invisible de nuestro banquete, que estás junto a la puerta y llamas,
      - entra en nuestra casa y cena con nosotros.
    respuesta: Dichosos los invitados a comer el pan en tu reino.
  padrenuestro_intro: 'Pidamos al Padre, como Cristo nos enseñó, nuestro pan de cada día:'
  oracion: Señor nuestro Jesucristo, que en este sacramento admirable nos dejaste el memorial de tu pasión, concédenos venerar de tal modo los sagrados misterios de tu cuerpo y de tu sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas con el Padre en la unidad del Espíritu Santo y eres Dios, por los siglos de los siglos.
SAN BERNABÉ, apóstol:
  grado: Memoria
  fecha: 06-11
  comun: Del Común de Apóstoles.
  inv_ant: Venid, adoremos al Espíritu Santo, que nos habló por los profetas y doctores.
  himno: Vosotros, que escuchasteis la llamada
  lectura:
    ref: 1Co 15, 1-2a. 3-4
    texto: 'Hermanos: Os quiero traer a la memoria el mensaje evangélico que os prediqué; el que abrazasteis, el mismo en que os mantenéis firmes todavía y por el que estáis en camino de salvación. En primer lugar os comuniqué el mensaje que yo mismo recibí: Que Cristo murió por nuestros pecados, según las Escrituras, y fue sepultado; resucitó al tercer día y vive, según lo anunciaron también las Escrituras.'
  responsorio:
  - - V
    - Proclamaron las alabanzas del Señor y su poder.
  - - R
    - Proclamaron las alabanzas del Señor y su poder.
  - - V
    - Y las maravillas que realizó.
  - - R
    - Las alabanzas del Señor y su poder.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Proclamaron las alabanzas del Señor y su poder.
  ant_benedictus: Bernabé partió para Tarso en busca de Saulo; y luego lo llevó a Antioquía, allí vivieron dentro de la comunidad e instruyeron a muchísima gente.
  preces:
    intro: 'Aclamemos a nuestro Salvador, que ha aniquilado la muerte, y ha hecho brillar la vida y la inmortalidad por el Evangelio, y supliquémosle, diciendo:'
    preces:
    - - Tú que por medio de doctores santos y eximios has glorificado a tu Iglesia,
      - haz que todos los cristianos resplandezcan por su virtud.
    - - Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles,
      - purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos.
    - - Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos,
      - llena también de tu Espíritu a todos los pastores del pueblo de Dios.
    - - Tú que fuiste la heredad de los santos pastores,
      - no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti.
    respuesta: Confirma a tu Iglesia en la fe y la caridad.
  padrenuestro_intro: 'Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oracion: Dios nuestro, que, después de haber infundido en abundancia la fe y el Espíritu Santo en San Bernabé, lo destinaste para que anunciara a los pueblos paganos el mensaje de salvación, haz que el Evangelio de Cristo, que él predicó valerosamente, sea proclamado con fidelidad por nuestras palabras y nuestras obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL SAGRADO CORAZÓN DE JESÚS:
  grado: Solemnidad
  fecha: variable
  inv_ant: Al Corazón de Jesús, herido por nuestro amor, venid, adorémosle.
  himno: Desde la cruz redentora
  salmodia:
  - ant: 'Jesús, puesto en pie, exclamó en alta voz: «El que tenga sed que venga a mí y que beba.»'
    salmo: salmo-62-2-9
  - ant: Venid a mí todos los que andáis rendidos y agobiados, que yo os daré descanso.
    salmo: cantico-dn-3-57-88-56
  - ant: Hijo mío, entrégame el corazón y acepta de buena gana mi camino.
    salmo: salmo-149
  lectura:
    ref: Jr 31, 33
    texto: 'Así será la alianza que haré con la casa de Israel, después de aquellos días —oráculo del Señor—: Pondré mi ley en su pecho, la escribiré en sus corazones; yo seré su Dios, y ellos serán mi pueblo.'
  responsorio:
  - - V
    - Tomad sobre vosotros mi yugo y aprended de mí.
  - - R
    - Tomad sobre vosotros mi yugo y aprended de mí.
  - - V
    - Que soy manso y humilde de corazón.
  - - R
    - Y aprended de mí.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Tomad sobre vosotros mi yugo y aprended de mí.
  ant_benedictus: Por su entrañable misericordia Dios nos ha visitado y ha redimido a su pueblo. Aleluia.
  preces:
    intro: 'Acudamos, hermanos, a Jesús, que es manso y humilde de corazón, y digámosle:'
    preces:
    - - Jesús, Señor nuestro, en quien habita corporalmente toda la plenitud de la divinidad,
      - haz que participemos de tu naturaleza divina.
    - - Jesús, único maestro, en quien están escondidos todos los tesoros de la sabiduría y del conocimiento,
      - danos, mediante la Iglesia, el conocimiento de la multiforme sabiduría de Dios.
    - - Jesús, Hijo de Dios, en quien el Padre se complace,
      - enséñanos a escuchar con perseverancia tu palabra.
    - - Jesús, hermano nuestro, de cuya plenitud todos hemos recibido,
      - concédenos la abundancia de tu gracia y de tu verdad.
    - - Jesús, salvador nuestro, fuente de vida y de santidad,
      - haz que seamos santos e irreprochables por el amor.
    respuesta: Rey amantísimo, ten piedad de nosotros.
  padrenuestro_intro: 'Unidos al Corazón de Jesucristo, que latió de amor por el Padre y por cada uno de nosotros, digamos confiadamente:'
  oracion: Te pedimos, Dios todopoderoso y eterno, que, al celebrar la grandeza del amor que resplandece en el corazón de tu Hijo, recibamos de esta fuente divina gracias cada vez más abundantes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL INMACULADO CORAZÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: variable
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Venid, adoremos a Cristo, Hijo de María Virgen.
  himno: Eres tú la mujer llena de gloria
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Mi corazón y mi carne se alegran por el Dios vivo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor Dios, que en el corazón de santa María Virgen preparaste al Espíritu Santo una digna morada, haz que también nosotros, por intercesión de María, seamos transformados en templos de tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANTONIO DE PADUA, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 06-13
  comun: 'Del Común de pastores: para un santo presbítero y del Común de doctores de la Iglesia.'
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Dios todopoderoso y eterno, que diste a tu pueblo un predicador insigne del Evangelio en san Antonio de Padua, y un intercesor eficaz que lo asistiera en sus dificultades, concédenos, por su intercesión, que seamos fieles a las enseñanzas del Evangelio y que contemos con tu ayuda en todas las adversidades. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN LUIS GONZAGA, religioso:
  grado: Memoria
  fecha: 06-21
  comun: 'Del Común de santos varones: para los santos religiosos.'
  inv_ant: Venid, adoremos al Señor, aclamemos al Dios admirable en sus santos.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: «El que cumple la voluntad de Dios, ése es mi hermano y mi hermana y mi madre», dice el Señor.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Dios nuestro, fuente y origen de todos los dones celestiales, tú que uniste en San Luis Gonzaga una admirable pureza de vida con la práctica de la penitencia, concédenos, por sus méritos e intercesión, que los que no hemos podido imitarlo en la inocencia de su vida lo imitemos en su espíritu de penitencia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL NACIMIENTO DE SAN JUAN BAUTISTA:
  grado: Solemnidad
  fecha: 06-24
  inv_ant: Venid, adoremos al Cordero de Dios, a quien Juan anunció lleno de alegría.
  himno: «¿Qué será este niño?», decía la gente
  salmodia:
  - ant: Le pondrás el nombre de Juan y su nacimiento será motivo de alegría para muchos.
    salmo: salmo-62-2-9
  - ant: Precederá al Señor en su venida con el espíritu y el poder de Elías, preparando al Señor un pueblo bien dispuesto.
    salmo: cantico-dn-3-57-88-56
  - ant: A ti, niño, te llamarán profeta del Altísimo, porque irás delante del Señor a preparar sus caminos.
    salmo: salmo-149
  lectura:
    ref: Ml 4, 5-6
    texto: Mirad, os enviaré al profeta Elías antes de que llegue el día del Señor, grande y terrible. Convertirá el corazón de los padres hacia los hijos, y el corazón de los hijos hacia los padres, para que no tenga que venir yo a destruir la tierra.
  responsorio:
  - - V
    - Será grande a los ojos del Señor y estará lleno del Espíritu Santo.
  - - R
    - Será grande a los ojos del Señor y estará lleno del Espíritu Santo.
  - - V
    - Precederá al Señor en su venida, preparándole un pueblo bien dispuesto.
  - - R
    - Y estará lleno del Espíritu Santo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Será grande a los ojos del Señor y estará lleno del Espíritu Santo.
  ant_benedictus: 'Zacarías recuperó el uso de la lengua e, inspirado, dijo: «Bendito sea el Señor, Dios de Israel.»'
  preces:
    intro: 'Oremos a Cristo, el Señor, que envió a Juan a preparar sus caminos delante de él, y digámosle:'
    preces:
    - - Tú que hiciste saltar de gozo a Juan cuando estaba en el vientre de su madre,
      - haz que siempre nos alegremos de que hayas venido al mundo.
    - - Tú que nos mostraste el camino de la conversión por la palabra y por el ejemplo del Bautista,
      - ilumina nuestros corazones, para que se conviertan a las enseñanzas de tu reino.
    - - Tú que quieres mostrarte a los hombres por la predicación de los hombres,
      - envía a todo el mundo profetas que anuncien tu Evangelio.
    - - Tú que quisiste ser bautizado por Juan en el Jordán para llevar a término toda justicia,
      - haz que trabajemos por la justicia de tu reino.
    respuesta: Visítanos, Sol que naces de lo alto.
  padrenuestro_intro: 'Dirijamos nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios todopoderoso, que suscitaste a san Juan Bautista, para que le preparara a Cristo un pueblo bien dispuesto, concede a tu pueblo el don de la alegría espiritual y guíanos por el camino de la salvación y de la paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN IRENEO, obispo y mártir:
  grado: Memoria
  fecha: 06-28
  comun: Del Común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Ireneo, haciendo honor a su nombre, con su vida y con su esfuerzo, trabajó a favor de la paz de las Iglesias.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Señor, tú que quisiste que el obispo san Ireneo hiciera triunfar la verdadera doctrina y lograra afianzar la paz de tu Iglesia, haz que nosotros, renovados, por su intercesión, en la fe y en la caridad, nos esforcemos siempre en fomentar la unidad y la concordia entre los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS PEDRO Y PABLO, APÓSTOLES:
  grado: Solemnidad
  fecha: 06-29
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Cuando el gallo, tres veces
  salmodia:
  - ant: Sé en quien he puesto mi fe, y estoy seguro que es poderoso para guardar hasta el último día lo que yo le he confiado.
    salmo: salmo-62-2-9
  - ant: La gracia de Dios no quedó infecunda en mí, sino que su gracia permanece siempre en mí.
    salmo: cantico-dn-3-57-88-56
  - ant: He combatido bien mi combate, he corrido hasta la meta, he mantenido la fe.
    salmo: salmo-149
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Consagraron sus vidas al servicio de nuestro Señor Jesucristo.
  - - R
    - Consagraron sus vidas al servicio de nuestro Señor Jesucristo.
  - - V
    - Salieron contentos de haber merecido aquel ultraje.
  - - R
    - Al servicio de nuestro Señor Jesucristo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Consagraron sus vidas al servicio de nuestro Señor Jesucristo.
  ant_benedictus: 'Dijo Simón Pedro: «Señor, ¿a quién vamos a ir? Tu tienes palabras de vida eterna. Y nosotros hemos creído y sabemos que tú eres el Santo de Dios.» Aleluia.'
  preces:
    intro: 'Oremos, hermanos, a Cristo, el Señor, que quiso edificar su Iglesia sobre el cimiento de los apóstoles y profetas, y digámosle confiados:'
    preces:
    - - Tú que rogaste por Pedro para que no se apagara su fe,
      - da firmeza a la fe de tu Iglesia.
    - - Tú que, después de la resurrección, te apareciste a Simón Pedro y te revelaste a Saulo,
      - ilumina nuestras mentes para que confesemos tu resurrección.
    - - Tú que elegiste al apóstol Pablo para que anunciara tu nombre a los paganos,
      - haz de nosotros verdaderos apóstoles de tu Evangelio.
    - - Tú que misericordiosamente perdonaste las negaciones de Pedro,
      - perdónanos también nuestras culpas y pecados.
    respuesta: Bendice, Señor, a tu Iglesia.
  padrenuestro_intro: 'Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  oracion: Dios nuestro, que nos llenas de santa alegría con la solemnidad de los santos apóstoles Pedro y Pablo, haz que tu Iglesia se mantenga siempre fiel a las enseñanzas de estos apóstoles, de quienes recibió el primer anuncio de la fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO TOMÁS, apóstol:
  grado: Fiesta
  fecha: 07-03
  comun: Del Común de apóstoles.
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Vosotros, que escuchasteis la llamada
  salmodia:
  - ant: 'Dijo Tomás: «Señor, si no sabemos adónde vas, ¿cómo vamos a conocer el camino?» Respondióle Jesús: «Yo soy el camino, la verdad y la vida.»'
    salmo: salmo-62-2-9
  - ant: 'Tomás, llamado Dídimo, no estaba con ellos en el momento de presentarse Jesús; dijéronle los otros discípulos: «Hemos visto al Señor.» Aleluia.'
    salmo: cantico-dn-3-57-88-56
  - ant: Trae tu mano y métela en mi costado; y no seas incrédulo sino fiel. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  ant_benedictus: ¿No has creído, Tomás, sino después de haberme visto? Dichosos los que sin ver han creído. Aleluia.
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Concédenos, Señor, celebrar con alegría la fiesta de santo Tomás; que la intercesión de este apóstol, que reconoció y confesó a Cristo como a su Señor y su Dios, nos haga crecer en la fe, para que así, creyendo en Jesús, el Mesías, tengamos vida en su nombre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE ITATÍ:
  grado: Memoria
  fecha: 07-09
  comun: Del común de la Santísima Virgen María.
  inv_ant: Aclamemos al Señor en esta fiesta de María Virgen.
  himno: Eres tú la mujer llena de gloria
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Por Eva se cerraron a los hombres las puertas del paraíso, y por María Virgen han sido abiertas de nuevo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu Madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Palabra eterna del Padre, que enseñaste a María a escoger la parte mejor,
      - ayúdanos a imitarla y a buscar el alimento que perdura hasta la vida eterna.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    - - Señor del cielo y de la tierra, que has colocado a tu derecha a María reina,
      - danos el gozo de tener parte en su gloria.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Que venga en nuestra ayuda, Señor, la poderosa intercesión de la Virgen María; así nos veremos libres de todo peligro y gozaremos de tu paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL ROSARIO DE CHIQUINQUIRÁ, patrona de Colombia:
  grado: Fiesta
  fecha: 07-09
  comun: Del común de la Santísima Virgen María.
  inv_ant: Celebremos la festividad de santa María Virgen y adoremos a su Hijo Jesucristo, el Señor.
  himno: Reina y Madre de Colombia
  salmodia:
  - ant: Hoy es la solemnidad de la gloriosa Virgen María, del linaje de Abraham, nacida de la tribu de Judá, y de la noble estirpe de David.
    salmo: salmo-62-2-9
  - ant: Cantemos con todo nuestro afecto la solemnidad de la santísima Virgen María, la excelsa Madre de Dios.
    salmo: cantico-dn-3-57-88-56
  - ant: Celebremos con todo nuestro afecto la solemnidad de la santísima Virgen María, para que ella interceda por nosotros ante nuestro Señor Jesucristo.
    salmo: salmo-149
  lectura:
    ref: Is 61,10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Celebremos la solemnidad de la siempre Virgen María, Madre de Dios, porque reina en su celeste trono. Aleluia.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocación de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Padre nuestro, en tu amorosa solicitud has querido favorecer a nuestra Patria dándonos en Chiquinquirá un signo de tu presencia; por la intercesión poderosa de la Virgen María, cuyo patrocinio hoy celebramos, concédenos crecer en la fe y lograr la prosperidad por caminos de paz y de justicia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BENITO ABAD, patrono de Europa:
  grado: Memoria
  fecha: 07-11
  comun: Del Común de santos varones para los santos religiosos.
  inv_ant: Aclamemos al Señor, en esta fiesta de san Benito.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: Hubo un hombre, venerable por su vida, Benito, que, como ya su propio nombre lo insinúa, fue bendecido por Dios con los dones de su gracia.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Dios nuestro, que constituiste al abad san Benito como un insigne maestro para los que quieren entregarse a tu servicio, concédenos que, anteponiendo tu amor a todas las cosas, corramos con un amor generoso por el camino de tus mandamientos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BUENAVENTURA, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 07-15
  comun: 'Del común de pastores: para un santo obispo y Del Común de doctores de la Iglesia.'
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten a tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Dios todopoderoso, al celebrar hoy la festividad del obispo san Buenaventura, te pedimos nos concedas saber aprovechar sus preclaras enseñanzas e imitar su ardiente amor hacia ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
