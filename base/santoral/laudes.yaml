SANTA ISABEL DE HUNGRÍA:
  grado: Memoria
  fecha: variable
  comun: 'Del Común de santas mujeres: para los santos que se distinguieron por el ejercicio de las obras de misericordia.'
  inv_ant: Venid, adoremos al Señor, aclamemos al Dios admirable en sus santos.
  himno: Finísimo fue el lino con que ella
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Dios la socorre al despuntar la aurora.
  - - R
    - Dios la socorre al despuntar la aurora.
  - - V
    - Teniendo a Dios en medio no vacila.
  - - R
    - Al despuntar la aurora.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la socorre al despuntar la aurora.
  ant_benedictus: La señal por la que conocerán que sois discípulos míos será que os améis unos a otros.
  preces:
    intro: 'Unidos, hermanos, a las mujeres santas, aclamemos a Jesús, nuestro Salvador, y supliquémosle diciendo:'
    preces:
    - - Señor Jesús, que perdonaste a la mujer pecadora sus muchos pecados porque tenía mucho amor,
      - perdónanos también a nosotros porque hemos pecado mucho.
    - - Señor Jesús, que fuiste asistido en tu misión evangélica por mujeres piadosas,
      - haz que también nosotros seamos fieles en nuestra misión apostólica.
    - - Señor Jesús, a quien María escuchaba y Marta servía,
      - concédenos servirte siempre con fe y amor.
    - - Señor Jesús, que llamaste hermano, hermana y madre a todos los que cumplen tu voluntad,
      - haz que todos nosotros la cumplamos siempre de palabra y de obra.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Fieles a la recomendación del Salvador, digamos al Padre común:'
  oracion: Dios nuestro, que concediste a santa Isabel de Hungría el don de reconocer y venerar a Cristo en los pobres, concédenos, por su intercesión, que sirvamos siempre a los necesitados y afligidos con una incansable caridad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARÍA VIRGEN, MADRE DE LA DIVINA PROVIDENCIA:
  grado: Solemnidad
  fecha: 11-19
  comun: Del Común de la santísima Virgen María.
  inv_ant: Venid, adoremos a Cristo Jesús, que nos encomendó como hijos a su providente madre.
  himno: Eres tú la mujer llena de gloria
  salmodia:
  - ant: Así como mi alma está rebosante de riquezas y abundancia, así mi boca prorrumpirá en cánticos de alegria.
    salmo: salmo-62-2-9
  - ant: Santos y humildes de corazón, bendecid al Señor; porque el Poderoso hizo cosas grandes en mí.
    salmo: cantico-dn-3-57-88-56
  - ant: Que los hijos de Sión salten de gozo en su Rey, y se alegren en su bendita madre.
    salmo: salmo-149
  lectura:
    ref: Sb 14, 1. 3-4
    texto: Algunos, al hacerse a la mar, dispuestos a atravesar las encrespadas olas, invocan a un leño más frágil que la embarcación que los transporta. Pero es tu providencia quien la gobierna. Padre, que trazaste un camino en el mismo mar y una senda segura entre las olas, demostrando que puedes salvar de todo riesgo, para que se embarquen aun los inespertos.
  responsorio:
  - - V
    - El poder de la teirra está en la mano de Dios.
  - - R
    - El poder de la teirra está en la mano de Dios.
  - - V
    - ¿Dónde se encuentra la prosperidad del hombre?.
  - - R
    - Está en la mano de Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El poder de la teirra está en la mano de Dios.
  ant_benedictus: 'Dijo su madre a Jesús: «No tienen vino»; y Jesús dio comienzo a sus milagros.'
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Atiende propicio, Señor, a tu pueblo que con júbilo festivo celebra la solemnidad de la Virgen María, Madre de la Divina Providencia, y concédele que, bajo el glorioso patrocinio de tan excelsa madre, con su caridad fraterna promueva una sociedad más humana y a la vez sea edificador y testigo de tu verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA PRESENTACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: 11-21
  comun: Del Común de la Santísima Virgen María -
  inv_ant: Aclamemos al Señor en esta fiesta de María Virgen.
  himno: Ésta era una niña
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Dichosa tú, María, que has creído; porque lo que te ha dicho el Señor se cumplirá. Aleluia.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu Madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Palabra eterna del Padre, que enseñaste a María a escoger la parte mejor,
      - ayúdanos a imitarla y a buscar el alimento que perdura hasta la vida eterna.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    - - Señor del cielo y de la tierra, que has colocado a tu derecha a María reina,
      - danos el gozo de tener parte en su gloria.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, Dios nuestro, al celebrar esta festividad de la Santísima Virgen María, te pedimos, por su intercesión, nos concedas también a nosotros participar de la plenitud de tu gracia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRO SEÑOR JESUCRISTO, REY UNIVERSAL:
  grado: Solemnidad
  fecha: variable
  inv_ant: A Jesucristo, rey de reyes, venid, adorémosle.
  himno: ¡Qué hermoso el Rey en la campaña!
  salmodia:
  - ant: He aquí un varón cuyo nombre es Germen, se sentará en su trono para reinar y proclamará la paz a las naciones.
    salmo: salmo-62-2-9
  - ant: Se mostrará él grande hasta los confines de la tierra, y él será nuestra paz.
    salmo: cantico-dn-3-57-88-56
  - ant: Dios le otorgó el imperio, el honor y la realeza, y todos los pueblos, naciones y lenguas lo servirán.
    salmo: salmo-149
  lectura:
    ref: Ef 4, 15-16
    texto: 'Realizando la verdad en el amor, hagamos crecer todas las cosas hacia él, que es la cabeza: Cristo, del cual todo el cuerpo, bien ajustado y unido a través de todo el complejo de junturas que lo nutren y actuando a la medida de cada parte, se procura su propio crecimiento, para construcción de sí mismo en el amor.'
  responsorio:
  - - V
    - Que tus fieles, Señor, proclamen la gloria de tu reinado.
  - - R
    - Que tus fieles, Señor, proclamen la gloria de tu reinado.
  - - V
    - Y que hablen de tus hazañas.
  - - R
    - Que proclamen la gloria de tu reinado.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Que tus fieles, Señor, proclamen la gloria de tu reinado.
  ant_benedictus: Cristo es el primogénito de entre los muertos y el Príncipe de los reyes de la tierra; él ha hecho de nosotros un reino para Dios, su Padre. Aleluia.
  preces:
    intro: 'Hermanos, adoremos a Cristo Rey, el cual existe antes que todas las cosas, y en quien todas las cosas tienen su razón de ser. Elevemos a él nuestra voz, clamando:'
    preces:
    - - Cristo, salvador nuestro, tú que eres nuestro Dios y Señor, nuestro rey y pastor,
      - conduce a tu pueblo a los pastos de vida.
    - - Buen Pastor, que diste la vida por tus ovejas,
      - si tú nos guías en nuestra vida, nada nos faltará.
    - - Redentor nuestro, que fuiste constituido rey sobre toda la tierra,
      - haz que todos los hombres te reconozcan como cabeza de toda la creación.
    - - Rey del universo, que viniste al mundo para dar testimonio de la verdad,
      - haz que todos proclamemos tu absoluta primacía en todo.
    - - Tú que eres nuestro maestro y modelo, y que nos has admitido a tu reino,
      - concédenos llevar desde hoy ante tus ojos una vida santa, sin mancha y sin culpa.
    respuesta: Que venga tu reino, Señor.
  padrenuestro_intro: 'Pidamos fervientemente al Padre celestial la llegada del reino de su Hijo a cada uno de los hombres, nuestros hermanos:'
  oracion: Dios todopoderoso y eterno, que quisiste fundar todas las cosas en tu Hijo muy amado, rey del universo, haz que toda creatura, libertada de toda esclavitud, sirva a tu majestad y te alabe eternamente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
