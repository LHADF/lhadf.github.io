    - Sacó de la descendencia de David un Salvador, Jesús.
  - - R
    - Nos visitó el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Por su entrañable misericordia nos visitó el Señor.
