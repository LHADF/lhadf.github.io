    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios, que cuidas a tu pueblo con ternura y lo gobiernas con amor, te pedimos que, por intercesión del papa san Gregorio Magno, concedas el espíritu de sabiduría a quienes has establecido como maestros y pastores de la Iglesia, para que así el progreso de los fieles constituya el gozo eterno de sus pastores. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA NATIVIDAD DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 09-08
  comun: Del Común de la santísima Virgen María.
  inv_ant: Celebremos el nacimiento de santa María Virgen y adoremos a su Hijo Jesucristo, el Señor.
  himno: Desde el albor de nuestra historia
  salmodia:
  - ant: Hoy es el nacimiento de la gloriosa Virgen María, del linaje de Abraham, nacida de la tribu de Judá, y de la noble estirpe de David.
    salmo: salmo-62-2-9
  - ant: Gloriosa es la estirpe de María, santa su raíz, bendito el fruto de su vientre; su nacimiento ilumina al mundo entero.
    salmo: cantico-dn-3-57-88-56
  - ant: Celebremos con gozo el nacimiento de santa María y pidámosle que interceda por nosotros ante Jesucristo, nuestro Señor.
    salmo: salmo-149
  lectura:
    ref: Is 11, 1-3a
    texto: 'Saldrá un renuevo del tronco de Jesé, y de su raíz brotará un vástago. Sobre él se posará el espíritu del Señor: espíritu de sabiduría y de inteligencia, espíritu de consejo y de fortaleza, espíritu de ciencia y de temor del Señor.'
  responsorio:
  - - V
    - Dios la eligió y la predestinó.
  - - R
    - Dios la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la eligió y la predestinó.
  ant_benedictus: 'Tu nacimiento, santa Madre de Dios, ha anunciado la alegría al mundo entero, pues de ti nació el sol de justicia, Cristo, nuestro Dios: él ha sido quien, destruyendo la maldición, nos ha aportado la bendición y, aniquilando la muerte, nos ha otorgado la vida eterna.'
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Concede a tus siervos, Señor, el don de tu gracia, para que, a quienes recibimos las primicias de la salvación por la maternidad de la Virgen María, la fiesta anual de su nacimiento nos traiga aumento de paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
