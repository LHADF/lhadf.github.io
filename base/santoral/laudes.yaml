LA VISITACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 05-31
  inv_ant: Aclamemos al Señor en esta fiesta de la Visitación de María Virgen. Aleluia.
  himno: La Virgen santa, grávida del Verbo
  salmodia:
  - ant: Se levantó María y se fue con prontitud a la región montañosa, a una ciudad de Judá. Aleluia.
    salmo: salmo-62-2-9
  - ant: Así que Isabel oyó el saludo de María, su criatura saltó de gozo en su seno y ella quedó llena del Espíritu Santo. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Dichosa tú, María, que has creído; porque lo que te ha dicho el Señor se cumplirá. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Jl 2, 27-28a
    texto: 'Sabréis que estoy en medio de Israel, yo, el Señor Dios vuestro, el Único. ¡Mi pueblo no será confundido jamás! Después de eso, derramaré mi Espíritu sobre toda carne: profetizarán vuestros hijos y vuestras hijas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó. Aleluia, Aleluia.
  - - R
    - El Señor la eligió y la predestinó. Aleluia, Aleluia.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó. Aleluia, Aleluia.
  ant_benedictus: 'Así que Isabel oyó el saludo de María, en alta voz exclamó: «¿Cómo he merecido yo que la madre de mi Señor venga a mi casa?» Aleluia.'
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, que enseñaste a María a escoger la parte mejor,
      - ayúdanos a imitarla y a buscar el alimento que perdura hasta la vida eterna.
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu Madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Dios todopoderoso y eterno, tú que, cuando María llevaba en su seno a tu Hijo, le inspiraste que visitara a su prima santa Isabel, haz que nosotros seamos siempre dóciles a las inspiraciones de tu Espíritu, para que, con María, podamos proclamar eternamente tu grandeza. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUSTINO, mártir:
  grado: Memoria
  fecha: 06-01
  comun: Del Común de un mártir -
  inv_ant: Venid, adoremos al Señor, rey de los mártires. Aleluia.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 1Jn 5, 3-5
    texto: 'En esto consiste el amor a Dios: en que guardemos sus mandamientos. Y sus mandamientos no son pesados, pues todo el que ha nacido de Dios vence al mundo. Y ésta es la victoria que vence al mundo: nuestra fe; porque, ¿quién es el que vence al mundo, sino el que cree que Jesús es el Hijo de Dios?'
  responsorio:
  - - V
    - La alegría eterna coronará a los santos. Aleluia, aleluia.
  - - R
    - La alegría eterna coronará a los santos. Aleluia, aleluia.
  - - V
    - Vivirán en el gozo y la exultación.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La alegría eterna coronará a los santos. Aleluia, aleluia.
  ant_benedictus: Al ofrecer nuestro sacrificio, alabamos al Creador de todo, por medio de su Hijo Jesucristo y del Espíritu Santo. Aleluia.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios nuestro, que enseñaste a san Justino a descubrir en la locura de la cruz la incomparable sabiduría de Jesucristo, concédenos, por la intercesión de éste mártir, la gracia de alejar los errores que nos cercan y de mantenernos siempre firmes en la fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
