  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Oh Dios, que inspiraste a san Juan un amor extraordinario a la cruz y a la renuncia de sí mismo, concédenos seguir incesantemente su ejemplo, para alcanzar la gloria eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ESTEBAN, protomártir:
  grado: Fiesta
  fecha: 12-26
  inv_ant: A Cristo recién nacido, que ha otorgado a Esteban la corona de la gloria, venid, adorémosle.
  himno: Cristo es la vida que, viniendo al mundo
  salmodia:
  - ant: Mi alma está unida a ti, Dios mío, pues mi carne fue lapidada por confesar tu nombre.
    salmo: salmo-62-2-9
  - ant: Esteban vio los cielos abiertos, y al punto entró en ellos; dichoso mortal, para quien los cielos se abrieron.
    salmo: cantico-dn-3-57-88-56
  - ant: Veo los cielos abiertos y a Jesús a la diestra del Padre.
    salmo: salmo-149
  lectura:
    ref: Hch 6, 2b-5a
    texto: «No está bien que nosotros descuidemos la palabra de Dios por atender al servicio de las mesas. Elegid, pues, hermanos, de entre vosotros, a siete hombres llenos del Espíritu Santo y de sabiduría, a quienes podamos encomendar este servicio. Nosotros, por nuestra parte, nos dedicaremos a la oración en común y al ministerio de la palabra.» Y pareció bien esta proposición a toda la comunidad.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Las puertas del cielo se abrieron para Esteban, que fue el primero en ingresar al ejército de los mártires, y victorioso entró coronado en los cielos.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémoslo diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Con la confianza de que Cristo ha abierto también los cielos para nosotros con su muerte, digamos la oración que él nos enseñó:'
  oracion: Concédenos, Señor, imitar las virtudes de san Esteban, cuya entrada en la gloria celebramos; y, así como él supo rogar por sus mismos perseguidores, sepamos nosotros amar a nuestros enemigos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN, apóstol y evangelista:
  grado: Fiesta
  fecha: 12-27
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Tú que revelaste a Juan
  salmodia:
  - ant: El Señor eligió a Juan, el apóstol y evangelista que conservó su castidad virginal, y lo distinguió entre los demás con una gran predilección.
    salmo: salmo-62-2-9
  - ant: Este es Juan, el apóstol virgen, a quien Cristo en la cruz le encomendó su Madre Virgen.
    salmo: cantico-dn-3-57-88-56
  - ant: 'El discípulo a quien Jesús amaba exclamó: «¡Es el Señor!» Aleluia.'
    salmo: salmo-149
  lectura:
    ref: Hch 4, 19-20
    texto: 'Pedro y Juan, tomando la palabra, dijeron: «Juzgad por vosotros mismos si es justo, delante de Dios, obedeceros a vosotros antes que a él. Nosotros no podemos dejar de hablar acerca de lo que hemos visto y oído.»'
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  ant_benedictus: La Palabra se hizo carne y puso su morada entre nosotros, y contemplamos su gloria. Aleluia.
  preces:
    intro: 'Hermanos: Edificados sobre el cimiento de los apóstoles, oremos al Padre por su pueblo santo, diciendo:'
    preces:
    - - Padre nuestro, que quisiste que tu Hijo resucitado de entre los muertos se manifestara en primer lugar a los apóstoles,
      - haz que también nosotros seamos testigos de Cristo hasta los confines del mundo.
    - - Padre nuestro, que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
      - haz que sepamos proclamar el Evangelio a todas las creaturas.
    - - Padre nuestro, que enviaste a tu Hijo a sembrar la semilla de la palabra,
      - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
    - - Padre nuestro, que enviaste a tu Hijo para que reconciliara al mundo contigo,
      - haz que también nosotros cooperemos a la reconciliación de los hombres.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Sintiéndonos asociados a Cristo en su obra redentora, sintámonos también unidos con él en su filiación divina, y digamos:'
  oracion: Dios nuestro, que nos descubriste los arcanos de tu Verbo por medio del apóstol san Juan, concédenos alcanzar una debida comprensión de todo aquello que él ha hecho llegar a nuestros oídos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LOS SANTOS INOCENTES, mártires:
  grado: Fiesta
  fecha: 12-28
  inv_ant: A Cristo recién nacido, que otorgó a los mártires Inocentes la corona de la gloria, venid, adorémosle.
  himno: Oye turbado el tirano
  salmodia:
  - ant: «Irán en mi cortejo vestidos de blanco, pues son dignos de ello», dice el Señor.
    salmo: salmo-62-2-9
  - ant: Los niños Inocentes cantan alabanzas al Señor; lo que en esta vida no pudieron hacer lo han realizado después de su muerte.
    salmo: cantico-dn-3-57-88-56
  - ant: De la boca de los niños de pecho has sacado una alabanza contra tus enemigos.
    salmo: salmo-149
  lectura:
    ref: Jr 31, 15
    texto: 'Una voz se escucha en Ramá, gemidos y llanto amargo: Raquel está llorando a sus hijos, y no se consuela, porque ya no existen.'
  responsorio:
  - - V
    - Los santos y los justos viven eternamente.
  - - R
    - Los santos y los justos viven eternamente.
  - - V
    - Reciben de Dios su recompensa.
  - - R
    - Viven eternamente.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los santos y los justos viven eternamente.
  ant_benedictus: 'Los niños Inocentes murieron por Cristo, fueron arrancados del pecho de su madre para ser asesinados: ahora siguen al Cordero sin mancha, cantando: «Gloria a ti, Señor.»'
  preces:
    intro: 'Celebremos la gloria de Cristo, que venció a un tirano, no con un ejército de soldados, sino con un blanco escuadrón de niños; digámosle llenos de júbilo:'
    preces:
    - - Cristo Señor, de quien dieron testimonio los niños Inocentes, no con sus palabras, sino con su sangre,
      - haz que nosotros demos testimonio de ti ante los hombres, tanto con nuestra palabra como con nuestra conducta.
    - - Tú que hiciste capaces del triunfo a quienes aún no eran capaces de entrar en combate,
      - no permitas que seamos vencidos nosotros, a quienes tantos medios has dado para llegar a la victoria.
    - - Tú que lavaste con tu sangre las vestiduras de los santos Inocentes,
      - purifícanos de toda maldad.
    - - Tú que enviaste al cielo a esos niños mártires como primicias de tu reino,
      - no permitas que nosotros seamos excluidos del festín eterno.
    - - Tú que experimentaste en tu infancia la persecución y el destierro,
      - protege a los niños que se ven acosados por la indigencia, la guerra o la desgracia.
    respuesta: A ti te aclama el ejército glorioso de los mártires.
  padrenuestro_intro: 'Elevemos nuestra voz al Padre celestial, ante el cual todos nos sentimos como niños pequeños, y digámosle confiadamente:'
  oracion: Señor Dios, cuya gloria pregonaron en este día los Inocentes mártires, no con palabras, sino dando su vida por ti, haz que nuestra conducta testifique con hechos la fe que proclamamos con los labios. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SAGRADA FAMILIA DE JESÚS MARÍA Y JOSÉ:
  grado: Fiesta
  fecha: variable
  inv_ant: A Cristo, el Hijo de Dios, que vivió sumiso a María y a José, venid, adorémosle.
  himno: Era pobre y silenciosa
  salmodia:
  - ant: Los padres de Jesús solían ir todos los años a Jerusalén para la fiesta de la Pascua.
    salmo: salmo-62-2-9
  - ant: Jesús iba creciendo en sabiduría y en estatura, y la gracia de Dios estaba en él.
    salmo: cantico-dn-3-57-88-56
  - ant: Su padre y su madre estaban maravillados de lo que se decía de él.
    salmo: salmo-149
  lectura:
    ref: Dt 5, 16
    texto: Honra a tu padre y a tu madre; así se prolongarán tus días y te irá bien en la tierra que el Señor, tu Dios, te va a dar.
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que fuiste obediente a María y a José.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  ant_benedictus: Ilumínanos, Señor, con los ejemplos de tu familia, y dirige nuestros pasos por el camino de la paz.
  preces:
    intro: 'Adoremos a Cristo, Hijo del Dios vivo, que quiso ser también hijo de una familia humana, y supliquémosle, diciendo:'
    preces:
    - - Oh Jesús, Palabra eterna del Padre, que quisiste vivir bajo la autoridad de María y de José,
      - enséñanos a vivir en la humildad y en la obediencia.
    - - Maestro de los hombres, que quisiste que María tu madre conservara en su corazón tus palabras y tus acciones,
      - enséñanos a escuchar con corazón puro y bueno las palabras de tu boca.
    - - Oh Cristo, tú que creaste el universo y quisiste ser llamado hijo del artesano,
      - enséñanos a trabajar con empeño y conciencia en nuestras tareas.
    - - Oh Jesús, que en el seno de tu familia de Nazaret creciste en sabiduría, estatura y gracia ante Dios y los hombres,
      - concédenos crecer siempre en ti, que eres nuestra cabeza.
    respuesta: Señor Jesús, tú que quisiste ser obediente, santifícanos.
  padrenuestro_intro: 'Gracias a Jesucristo somos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Dios nuestro, que has querido darnos en la Sagrada Familia ejemplos preclaros de virtudes domésticas, concédenos saber imitar su vida y su amor recíproco, para que un día podamos ir a disfrutar con ella de la alegría eterna de tu morada. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
