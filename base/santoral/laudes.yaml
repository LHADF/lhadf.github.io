    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios, fortaleza de los que en ti confían, tú que quisiste que el obispo san Juan Crisóstomo brillara por su admirable elocuencia y por su gran fortaleza en medio de las pruebas, haz que la sabiduría de este eximio doctor de la Iglesia nos ilumine y que el ejemplo de su invencible constancia nos fortalezca. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EXALTACIÓN DE LA SANTA CRUZ:
  grado: Fiesta
  fecha: 09-14
  inv_ant: A Cristo, Rey y Señor, que por nosotros fue exaltado en la cruz, venid, adorémosle.
  himno: Brille la cruz del Verbo, luminosa
  salmodia:
  - ant: Subió al árbol santo de la cruz, destruyó el poderío de la muerte, se revistió de poder, resucitó al tercer día.
    salmo: salmo-62-2-9
  - ant: ¡Cómo brilla la cruz santa! De ella colgó el cuerpo del Señor y desde ella derramó Cristo aquella sangre que ha sanado nuestras heridas.
    salmo: cantico-dn-3-57-88-56
  - ant: 'Resplandece la cruz santa: por ella el mundo ha obtenido la salvación; la cruz vence, la cruz reina, la cruz aleja todo pecado. Aleluia.'
    salmo: salmo-149
  lectura:
    ref: Hb 2, 9b-10
    texto: Vemos a Jesús coronado de gloria y de honor por haber padecido la muerte. Así, por amorosa dignación de Dios, gustó la muerte en beneficio de todos. Pues como quisiese Dios, por quien y para quien son todas las cosas, llevar un gran número de hijos a la gloria, convenía ciertamente que perfeccionase por medio del sufrimiento al que iba a guiarlos a la salvación.
  responsorio:
  - - V
    - Te adoramos, oh Cristo, y te bendecimos.
  - - R
    - Te adoramos, oh Cristo, y te bendecimos.
  - - V
    - Porque con tu santa cruz redimiste al mundo.
  - - R
    - Y te bendecimos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Te adoramos, oh Cristo, y te bendecimos.
  ant_benedictus: Tu cruz adoramos, Señor, y tu santa resurrección alabamos y glorificamos; por el madero ha venido la alegría al mundo entero.
  preces:
    intro: 'Oremos a nuestro Redentor, que por su cruz nos ha salvado, y digámosle confiados:'
    preces:
    - - Hijo de Dios, que por el símbolo de la serpiente de bronce sanaste al pueblo de Israel,
      - protégenos hoy de las heridas del pecado.
    - - Hijo del hombre, que fuiste elevado en la cruz, como la serpiente fue elevada por Moisés en el desierto,
      - elévanos hasta la gloria de tu reino.
    - - Hijo unigénito del Padre, que has sido enviado al mundo para que todo el que crea en ti no perezca,
      - concede la vida eterna a los que buscan tu rostro.
    - - Hijo amado del Padre, que has sido enviado al mundo no para condenar al mundo, sino para que el mundo sea salvado por ti,
      - concede el don de la fe a todos nuestros familiares y amigos, para que obtengan la salvación.
    - - Hijo eterno del Padre, que viniste a prender fuego a la tierra para que el mundo entero ardiera,
      - haz que vivamos de acuerdo con la verdad y lleguemos a la luz.
    respuesta: Por tu cruz, sálvanos, Señor.
  padrenuestro_intro: 'Pidamos ahora al Padre que venga al mundo su reino:'
  oracion: Señor, Dios nuestro, que has querido salvar a los hombres por medio de tu Hijo muerto en la cruz, te pedimos, ya que nos has dado a conocer en la tierra la fuerza misteriosa de la cruz de Cristo, que podamos alcanzar en el cielo los frutos de la redención. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE LOS DOLORES:
  grado: Memoria
  fecha: 09-15
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Venid, adoremos al Salvador del mundo, de cuya pasión María participó.
  himno: ¿Habrá dolor más intenso
  salmodia:
  - ant: Mi alma está unida a ti, Señor Jesús.
    salmo: salmo-62-2-9
  - ant: Estemos alegres cuando compartimos los padecimientos de Cristo.
    salmo: cantico-dn-3-57-88-56
  - ant: Dios quiso reconciliar consigo todas las cosas por la sangre de Cristo.
    salmo: salmo-149
  lectura:
    ref: Col 1, 24-25
    texto: 'Ahora me alegro de los padecimientos que he sufrido por vosotros, y voy completando en favor del cuerpo de Cristo, que es la Iglesia, las tribulaciones que aún me quedan por sufrir con Cristo en mi carne mortal. Pues he sido constituido ministro de la Iglesia conforme a la misión que él me ha confiado respecto de vosotros: dar cumplimiento a la palabra de Dios.'
  responsorio:
  - - V
    - Que por tu intervención, Virgen Maria, obtengamos la salvación.
  - - R
    - Que por tu intervención, Virgen Maria, obtengamos la salvación.
  - - V
    - De las llagas de Jesucristo.
  - - R
    - Obtengamos la salvación.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Que por tu intervención, Virgen Maria, obtengamos la salvación.
  ant_benedictus: Alégrate, Madre dolorosa, porque, después de tanto sufrir, te ves ahora rodeada de gloria y colocada, como reina del universo, al lado de tu Hijo.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu Madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Palabra eterna del Padre, que enseñaste a María a escoger la parte mejor,
      - ayúdanos a imitarla y a buscar el alimento que perdura hasta la vida eterna.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    - - Señor del cielo y de la tierra, que has colocado a tu derecha a María reina,
      - danos el gozo de tener parte en su gloria.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Dios nuestro, que quisiste que la Madre de tu Hijo estuviera a su lado junto a la cruz, participando en sus sufrimientos, concede a tu Iglesia que, asociada con María a la pasión de Cristo, merezca también participar en su gloriosa resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS CORNELIO, Papa, y CIPRIANO, obispo, mártires:
  grado: Memoria
  fecha: 09-16
  comun: Del Común de varios mártires.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Testigos de la sangre
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - Los justos viven eternamente.
  - - R
    - Los justos viven eternamente.
  - - V
    - Reciben de Dios su recompensa.
  - - R
    - Viven eternamente.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los justos viven eternamente.
  ant_benedictus: ¡Oh cuán preciosa muerte, en la cual se adquiere la inmortalidad al precio de la propia sangre!
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Señor, tú que en los santos Cornelio y Cipriano diste a tu pueblo pastores llenos de celo y mártires victoriosos, concédenos por su valiosa intercesión, ser firmes e invencibles en la fe y trabajar con verdadero empeño por lograr la unidad de tu Iglesia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS ANDRÉS KIM TAEGON, presbítero, PABLO CHONG HASANG y compañeros mártires:
