SAN PIO X, papa:
  grado: Memoria
  fecha: 08-21
  comun: 'Del común de los pastores: para un santo papa.'
  inv_ant: Venid, adoremos a Cristo, Pastor supremo.
  himno: Cristo, cabeza, rey de los pastores
  lectura:
    ref: Hb 13, 7-9a
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre. No os dejéis extraviar por doctrinas llamativas y extrañas.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - He colocado centinelas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  ant_benedictus: No sois vosotros los que habláis, sino el Espíritu de vuestro Padre quien habla por vosotros.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Dios todopoderoso y eterno, que, para defender la fe católica e instaurar todas las cosas en Cristo, colmaste al papa san Pío décimo de sabiduría divina y de fortaleza apostólica, concédenos que, dóciles a sus instrucciones y ejemplos, consigamos la recompensa eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SANTÍSIMA VIRGEN MARÍA, REINA:
  grado: Memoria
  fecha: 08-22
  comun: Del Común de la santísima Virgen María.
  inv_ant: Adoremos a Cristo, nuestro rey, que ha coronado como reina a María, su madre.
  himno: Vienes del trono de David profeta
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Excelsa Reina del mundo, siempre Virgen María, tú engendraste a Cristo, Señor y Salvador de todos los hombres.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, Dios nuestro, que nos has dado como madre y como reina a la Madre de tu Hijo, concédenos que, protegidos por su intercesión, alcancemos la gloria que tienes preparada a tus hijos en el reino de los cielos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ROSA DE LIMA, virgen, Patrona de América Latina:
  grado: Fiesta
  fecha: variable
  comun: Del Común de vírgenes.
  inv_ant: Venid, adoremos al Señor, rey de las vírgenes.
  himno: Cuando, Señor, en quieta lontananza
  salmodia:
  - ant: Libremente confieso a Cristo; de Cristo está sedienta mi alma; deseo estar por siempre con Cristo.
    salmo: salmo-62-2-9
  - ant: Vírgenes del Señor, bendecid al Señor; el que sembró en vosotras el deseo de la virginidad ha coronado ya su obra.
    salmo: cantico-dn-3-57-88-56
  - ant: Que los santos se alegren en la gloria, pues han conseguido una brillante victoria sobre la carne y la sangre.
    salmo: salmo-149
  lectura:
    ref: Ct 8, 7
    texto: Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.
  responsorio:
  - - V
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - V
    - Tu rostro buscaré, Señor.
  - - R
    - Buscad mi rostro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  ant_benedictus: Para mí la vida es Cristo, y la muerte una ganancia; he de gloriarme en la cruz de nuestro Señor Jesucristo.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa Rosa de Lima, que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
  oracion: Dios nuestro, que impulsaste a santa Rosa de Lima a apartarse de la vida del mundo por amor tuyo y a consagrarse solo a ti, en la austeridad y en la penitencia, concédenos, por su intercesión, que sepamos seguir, en este mundo, el camino que conduce a la verdadera vida, para que lleguemos a gozar del torrente de tus delicias allá en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BARTOLOMÉ, apóstol:
  grado: Fiesta
  fecha: 08-24
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles.
  himno: Vosotros, que escuchasteis la llamada
  salmodia:
  - ant: 'Éste es mi mandamiento: que os améis unos a otros como yo os he amado.'
    salmo: salmo-62-2-9
  - ant: Nadie tiene amor más grande que el que da la vida por sus amigos.
    salmo: cantico-dn-3-57-88-56
  - ant: Vosotros sois mis amigos si hacéis lo que yo os mando.
    salmo: salmo-149
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Sobre toda la tierra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra.
  ant_benedictus: 'El muro de la ciudad tenía doce cimientos que llevaban doce nombres: los nombres de los apóstoles del Cordero: y su lámpara es el Cordero.'
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Fortalece, Señor, nuestra fe, para que nos adhiramos a Cristo, tu Hijo, con la misma sinceridad con que lo hizo el apóstol san Bartolomé, y haz que, por la intercesión de este santo, sea siempre tu Iglesia sacramento de salvación universal para todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MÓNICA:
  grado: Memoria
  fecha: 08-27
  comun: Del Común de santas mujeres.
  inv_ant: Aclamemos al Señor, en esta fiesta de santa Mónica.
  himno: Finísimo fue el lino con que ella
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Dios la socorre al despuntar la aurora.
  - - R
    - Dios la socorre al despuntar la aurora.
  - - V
    - Teniendo a Dios en medio no vacila.
  - - R
    - Al despuntar la aurora.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la socorre al despuntar la aurora.
  ant_benedictus: La escuchaste, Señor, cuando, regando con sus lágrimas la tierra, acudía a tí en la oración.
  preces:
    intro: 'Unidos, hermanos, a las mujeres santas, aclamemos a Jesús, nuestro Salvador, y supliquémosle diciendo:'
    preces:
    - - Señor Jesús, que perdonaste a la mujer pecadora sus muchos pecados porque tenía mucho amor,
      - perdónanos también a nosotros porque hemos pecado mucho.
    - - Señor Jesús, que fuiste asistido en tu misión evangélica por mujeres piadosas,
      - haz que también nosotros seamos fieles en nuestra misión apostólica.
    - - Señor Jesús, a quien María escuchaba y Marta servía,
      - concédenos servirte siempre con fe y amor.
    - - Señor Jesús, que llamaste hermano, hermana y madre a todos los que cumplen tu voluntad,
      - haz que todos nosotros la cumplamos siempre de palabra y de obra.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Fieles a la recomendación del Salvador, digamos al Padre común:'
  oracion: Dios de bondad, consolador de los que lloran, tú que, lleno de compasión, acogiste las lágrimas que santa Mónica derramaba pidiendo la conversión de su hijo Agustín, concédenos, por la intercesión de ambos, el arrepentimiento sincero de nuestros pecados y la gracia de tu perdón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN AGUSTÍN, obispo y doctor de la iglesia:
  grado: Memoria
  fecha: 08-28
  comun: 'Del Común de pastores: para un santo obispo y del común de doctores de la Iglesia.'
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: De ti mismo proviene, Señor, la atracción a tu alabanza, porque nos has hecho para ti, y nuestro corazón no halla sosiego hasta que descanse en ti.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Renueva, Señor, en tu Iglesia aquel espíritu que, con tanta abundancia, otorgaste al obispo san Agustín, para que también nosotros tengamos sed de ti, única fuente de la verdadera sabiduría, y en ti, único manantial del verdadero amor, encuentre descanso nuestro corazón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL MARTIRIO DE SAN JUAN BAUTISTA:
  grado: Memoria
  fecha: 08-29
  inv_ant: Venid, adoremos al Cordero de Dios a quien Juan precedió en el martirio.
  himno: Varón feliz de méritos excelsos
  salmodia:
  - ant: El Señor extendió la mano y me tocó la boca, y me nombró profeta de los gentiles.
    salmo: salmo-62-2-9
  - ant: Herodes sentía respeto por la persona de Juan, sabiendo que era un hombre santo y consagrado al servicio de Dios, y le otorgaba su protección.
    salmo: cantico-dn-3-57-88-56
  - ant: Herodes escuchaba con gusto a Juan, y, en muchas de las cosas que hacía, era aconsejado por él.
    salmo: salmo-149
  lectura:
    ref: Is 49, 1b-2
    texto: El Señor me llamó desde el vientre de mi madre, cuando aún estaba yo en el seno materno pronunció mi nombre. Hizo de mi boca una espada afilada, me escondió en la sombra de su mano; me hizo flecha bruñida, me guardó en su aljaba.
  responsorio:
  - - V
    - Vosotros mandasteis preguntar a Juan, y él declaró en favor de la verdad.
  - - R
    - Vosotros mandasteis preguntar a Juan, y él declaró en favor de la verdad.
  - - V
    - Juan era la lámpara que arde y que ilumina.
  - - R
    - Y él declaró en favor de la verdad.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Vosotros mandasteis preguntar a Juan, y él declaró en favor de la verdad.
  ant_benedictus: El amigo del Esposo, que está para asistirle y atenderle, experimenta viva alegría cuando oye la voz del Esposo; así que ésta es mi alegría, la cual ahora rebasa todo límite.
  preces:
    intro: 'Oremos a Cristo, el Señor, que envió a Juan a preparar sus caminos delante de él, y digámosle:'
    preces:
    - - Tú que hiciste saltar de gozo a Juan cuando estaba en el vientre de su madre,
      - haz que siempre nos alegremos de que hayas venido al mundo.
    - - Tú que nos mostraste el camino de la conversión por la palabra y por el ejemplo del Bautista,
      - ilumina nuestros corazones, para que se conviertan a las enseñanzas de tu reino.
    - - Tú que quieres mostrarte a los hombres por la predicación de los hombres,
      - envía a todo el mundo profetas que anuncien tu Evangelio.
    - - Tú que quisiste ser bautizado por Juan en el Jordán para llevar a término toda justicia,
      - haz que trabajemos por la justicia de tu reino.
    respuesta: Visítanos, Sol que naces de lo alto.
  padrenuestro_intro: 'Dirijamos nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios nuestro, que quisiste que san Juan Bautista fuera el precursor de tu Hijo, tanto en su nacimiento como en su muerte, concédenos que, así como él dio su vida por dar testimonio de la verdad y de la justicia, así también nosotros entreguemos generosamente la nuestra al testimonio y servicio del Evangelio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN GREGORIO MAGNO, papa y doctor de la Iglesia:
