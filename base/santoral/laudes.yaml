  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios nuestro, que quisiste que el obispo san Francisco de Sales se hiciera todo para todos, para ganarlos a todos, haz que, iluminados por su ejemplo, también nosotros sepamos manifestar la dulzura de tu amor en el servicio de nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
MARÍA, REINA DE LA PAZ:
  grado: Memoria
  fecha: 01-24
  inv_ant: Aclamemos al Señor en esta fiesta de María Virgen.
  himno: Eres tú la mujer llena de gloria
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Tú, Virgen María, nos has dado el autor de nuestra paz; por ti ha venido la paz al mundo entero.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Abre, Señor, a tus servidores la riqueza de tu gracia y, ya que la maternidad de la Virgen María fue para nosotros el comienzo de la salvación, concédenos que esta celebración acreciente nuestra paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA CONVERSIÓN DE SAN PABLO:
  grado: Fiesta
  fecha: 01-25
  inv_ant: Aclamemos al Señor, en esta fiesta de la conversión del Maestro de los gentiles.
  himno: Con presunción de bélico soldado
  salmodia:
  - ant: Sé en quien he puesto mi fe, y estoy seguro que es poderoso para guardar hasta el último día lo que yo le he confiado.
    salmo: salmo-62-2-9
  - ant: Pablo, te basta mi gracia, que en la debilidad se muestra perfecto mi poder.
    salmo: cantico-dn-3-57-88-56
  - ant: La gracia de Dios no quedó infecunda en mí, sino que su gracia permanece siempre en mí.
    salmo: salmo-149
  lectura:
    ref: Hch 26, 16b-18
    texto: Me he dejado ver de ti para hacerte siervo mío y testigo de la visión en que me has visto y de otras que te manifestaré. Yo te sacaré de todos los peligros que te vengan de tu nación y de los gentiles. A éstos te envío ahora para que les abras los ojos y se conviertan de las tinieblas a la luz, del poder de Satanás a Dios; para que por la fe en mí reciban el perdón de los pecados y su parte en la herencia de los justos.
  responsorio:
  - - V
    - Tú eres un instrumento escogido, apóstol san Pablo.
  - - R
    - Tú eres un instrumento escogido, apóstol san Pablo.
  - - V
    - Predicador de la verdad en todo el mundo.
  - - R
    - Apóstol san Pablo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Tú eres un instrumento escogido, apóstol san Pablo.
  ant_benedictus: Celebremos la conversión del apóstol san Pablo, que de perseguidor pasó a ser un instrumento escogido.
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Señor Dios, que has iluminado al mundo entero con la palabra del apóstol san Pablo, haz que quienes recordamos hoy su conversión, imitando sus ejemplos, anunciemos el Evangelio al mundo y seamos así testigos de tu verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS TIMOTEO Y TITO, obispos:
  grado: Memoria
  fecha: 01-26
  comun: Del común de pastores para un santo obispo.
  inv_ant: Venid, adoremos a Cristo, Pastor supremo.
  himno: Cristo, cabeza, rey de los pastores
  lectura:
    ref: Hb 13, 7-9a
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre. No os dejéis extraviar por doctrinas llamativas y extrañas.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - He colocado centinelas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  ant_benedictus: Proclama la palabra, insiste con oportunidad o sin ella, persuade, reprende, exhorta, armado de toda paciencia y doctrina.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios nuestro, que concediste a los santos Timoteo y Tito vivir de manera semejante a los apóstoles, haz que, ayudados por su intercesión, vivamos en este mundo justa y piadosamente y alcancemos después tu reino eterno. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO TOMÁS DE AQUINO, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 01-28
  comun: Del común de doctores de la Iglesia.
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Bendito sea el Señor, por cuyo amor santo Tomás estudió con esfuerzo, oró asiduamente y trabajó sin desfallecer.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
