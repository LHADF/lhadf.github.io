  himno: Vosotros sois luz del mundo
  lectura:
    ref: Is 55, 3
    texto: 'Inclinad el oído, venid a mí: escuchadme y viviréis. Sellaré con vosotros alianza perpetua, la promesa que aseguré a David.'
  responsorio:
