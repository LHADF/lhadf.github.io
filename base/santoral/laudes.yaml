SANTA CATALINA DE SIENA, virgen y doctora de la Iglesia:
  grado: Memoria
  fecha: 04-29
  comun: Del Común de vírgenes.
  inv_ant: Venid, adoremos al Señor, rey de las vírgenes. Aleluia.
  himno: Nos apremia el amor, vírgenes santas
  lectura:
    ref: Ct 8, 7
    texto: Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.
  responsorio:
  - - V
    - 'Oigo en mi corazón: buscad mi rostro. Aleluia, aleluia.'
  - - R
    - 'Oigo en mi corazón: buscad mi rostro. Aleluia, aleluia.'
  - - V
    - Tu rostro buscaré, Señor.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Oigo en mi corazón: buscad mi rostro. Aleluia, aleluia.'
  ant_benedictus: La virgen santa Catalina no cesaba de suplicar al Señor que se dignara dar nuevamente la paz a la santa Iglesia. Aleluia.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa Catalina de Siena, que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
  oracion: Señor Dios nuestro, que diste a santa Catalina de Siena el don de entregarse con amor a la contemplación de la pasión de Cristo y al servicio de la Iglesia, haz que, por su intercesión, el pueblo cristiano viva siempre unido al misterio de Cristo, para que pueda rebosar de gozo cuando se manifieste su gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL VALLE:
  grado: Memoria
  fecha: variable
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Venid, adoremos a Cristo, Hijo de María Virgen. Aleluia.
  himno: La luz del Hijo la rodea
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó. Aleluia, Aleluia.
  - - R
    - El Señor la eligió y la predestinó. Aleluia, Aleluia.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó. Aleluia, Aleluia.
  ant_benedictus: Por Eva se cerraron a los hombres las puertas del paraíso, y por María Virgen han sido abiertas de nuevo. Aleluia.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Dios todopoderoso y eterno, que nos colocaste bajo el especial patrocinio de la santísima Virgen María, te pedimos que, gracias a la ayuda de la Virgen Inmaculada, podamos vencer a nuestros enemigos y llegar felizmente a ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSÉ OBRERO:
  grado: Memoria
  fecha: 05-01
  inv_ant: Venid, adoremos a Cristo, el Señor, que quiso ser tenido como hijo del carpintero. Aleluia.
  himno: Llamando a trabajo al mundo
  lectura:
    ref: 2S 7, 28-29
    texto: Mi Señor, tú eres el Dios verdadero, tus palabras son de fiar, y has hecho esta promesa a tu siervo. Dígnate, pues, bendecir a la casa de tu siervo, para que esté siempre en tu presencia; ya que tú, mi Señor, lo has dicho, sea siempre bendita la casa de tu siervo.
  responsorio:
  - - V
    - Lo nombró administrador de su casa. Aleluia, aleluia.
  - - R
    - Lo nombró administrador de su casa. Aleluia, aleluia.
  - - V
    - Señor de todas sus posesiones.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lo nombró administrador de su casa. Aleluia, aleluia.
  ant_benedictus: Por medio del honrado desempeño del oficio de carpintero, José ha venido a ser el modelo admirable de todos los trabajadores. Aleluia.
  preces:
    intro: 'Acudamos suplicantes al Señor, el único que puede hacernos justos, y digámosle suplicantes:'
    preces:
    - - Tú, Señor, que llamaste a nuestros padres en la fe para que caminasen en tu presencia con un corazón sincero,
      - haz que también nosotros, siguiendo sus huellas, seamos santos ante tus ojos.
    - - Tú que elegiste a José, varón justo, para que cuidara de tu Hijo durante su niñez y adolescencia,
      - haz que también nosotros nos consagremos al servicio del cuerpo de Cristo, sirviendo a nuestros hermanos.
    - - Tú que entregaste la tierra a los hombres para que la llenaran y la sometieran,
      - ayúdanos a trabajar con empeño en nuestro mundo, pero teniendo siempre nuestros ojos puestos en tu gloria.
    - - No te olvides, Padre del universo, de la obra de tus manos
      - y haz que todos los hombres, mediante su trabajo honesto, tengan una vida digna.
    respuesta: Con tu justicia, Señor, danos vida.
  padrenuestro_intro: 'Porque somos miembros de la familia de Dios, nos atrevemos a decir:'
  oracion: Dios nuestro, creador del universo, que has establecido que el hombre coopere con su trabajo al perfeccionamiento de tu obra, haz que, guiados por el ejemplo de san José y ayudados por sus plegarias, realicemos las tareas que nos asignas y alcancemos la recompensa que nos prometes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ATANASIO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 05-02
  comun: Del común de pastores para un santo obispo, y del común de doctores de la Iglesia.
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría. Aleluia.
  himno: Para vosotros, el misterio del Padre
  lectura:
