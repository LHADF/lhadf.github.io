  lectura:
    ref: Ap 21, 10. 23
    texto: El ángel me transportó en espíritu a un monte altísimo y me enseñó la ciudad santa, Jerusalén, que bajaba del cielo, de junto a Dios. La ciudad no necesita ni de sol ni de luna que la alumbren, porque la ilumina la gloria de Dios, y su lámpara es el Cordero.
  responsorio:
  - - V
    - Lo coronaste, Señor, de gloria y dignidad. Aleluia, aleluia.
  - - R
    - Lo coronaste, Señor, de gloria y dignidad. Aleluia, aleluia.
  - - V
    - Lo colocaste por encima de todas tus creaturas.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lo coronaste, Señor, de gloria y dignidad. Aleluia, aleluia.
  ant_benedictus: 'De la nube salió una voz que dijo: «Este es mi Hijo amado, en quien tengo mis complacencias, escuchadlo». Aleluia.'
  preces:
    intro: 'Acudamos al Padre, que maravillosamente transfiguró a Jesucristo, nuestro Salvador, en el monte santo, y digámosle con fe:'
    preces:
    - - Padre lleno de amor, tú que transfiguraste a tu Hijo amado en la montaña santa y, por medio de la nube luminosa, te manifestaste a tí mismo,
      - haz que escuchemos siempre fielmente la voz de tu Hijo amado.
    - - Señor, tú que nos nutres de lo sabroso de tu casa y nos das a beber del torrente de tus delicias,
      - haz que sepamos contemplar en la gloria de tu Hijo transfigurado nuestra futura condición gloriosa.
    - - Tú que hiciste que del seno de las tinieblas brillara la luz y has hecho brillar nuestros corazones para que contemplaran tu gloria en el rostro de Cristo,
      - haz que tu Iglesia viva atenta a la contemplación de las maravillas de tu Hijo amado.
    - - Tú que nos has llamado con una vocación santa, por tu gracia manifestada con la aparición de nuestro Salvador, Cristo Jesús,
      - ilumina a todos los hombres con el Evangelio, para que lleguen al conocimiento de la vida incorruptible.
    - - Padre amantísimo, tú que nos has tenido un amor tan grande que has querido nos llamáramos hijos tuyos y que lo fuéramos en verdad,
      - haz que, cuando Cristo se manifieste en su gloria, nosotros seamos semejantes a él.
    respuesta: Que tu luz, Señor, nos haga ver la luz.
  padrenuestro_intro: 'Ya que Dios nos ha llamado a ser sus hijos, acudamos a nuestro Padre, diciendo:'
  oracion: Señor Dios, que en la gloriosa transfiguración de Jesucristo confirmaste los misterios de la fe con el testimonio de Moisés y de Elías, y nos hiciste entrever en la gloria de tu Hijo la grandeza de nuestra definitiva adopción filial, haz que escuchemos siempre la voz de tu Hijo amado y lleguemos a ser un día sus coherederos en la gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTO DOMINGO, presbítero:
  grado: Memoria
  fecha: 08-08
  comun: 'Del Común de los santos varones: para los santos religiosos.'
  inv_ant: Venid, adoremos al Señor, aclamemos al Dios admirable en sus santos.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: Mi porción es el Señor; bueno es el Señor para el alma que lo busca.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: 'Que tu Iglesia, Señor, encuentre siempre luz en las enseñanzas de santo Domingo y protección en sus méritos: que él, que durante su vida fue predicador insigne de la verdad, sea ahora para nosotros un eficaz intercesor ante ti. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
SAN LORENZO, diácono y mártir:
  grado: Fiesta
  fecha: 08-10
  comun: Del Común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  salmodia:
  - ant: Mi alma está unida a ti, ya que por ti, Dios mío, ha sido quemada mi carne con el fuego.
    salmo: salmo-62-2-9
  - ant: El Señor ha enviado a su ángel y me ha librado del fuego; así no he sentido el ardor.
    salmo: cantico-dn-3-57-88-56
  - ant: 'El bienaventurado Lorenzo oraba, diciendo: «Te doy gracias, Señor, porque he merecido entrar en tu reino.»'
    salmo: salmo-149
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Hijo mío, no temas, que contigo estoy yo; cuando pases por el fuego, no te quemarás, la llama no te abrasará.
  preces:
    intro: 'Celebremos, amados hermanos, a Jesús, el testigo fiel, y al recordar hoy a los santos mártires sacrificados a causa de la palabra de Dios, aclamémosle diciendo:'
    preces:
    - - Por la intercesión de los santos mártires que entregaron libremente su vida como testimonio de la fe,
      - concédenos, Señor, la verdadera libertad de espíritu.
    - - Por la intercesión de los santos mártires que proclamaron la fe hasta derramar su sangre,
      - concédenos, Señor, la integridad y constancia de la fe.
    - - Por la intercesión de los santos mártires que soportando la cruz siguieron tus pasos,
      - concédenos, Señor, soportar con generosidad las contrariedades de la vida.
    - - Por la intercesión de los santos mártires que blanquearon su manto en la sangre del Cordero,
      - concédenos, Señor, vencer las obras del mundo y de la carne.
    respuesta: Nos has comprado, Señor, con tu sangre.
  padrenuestro_intro: 'Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios nuestro, que inflamaste con el fuego de tu amor a san Lorenzo, para que brillara por la fidelidad a su servicio diaconal y por la gloria de un heroico martirio, haz que nosotros te amemos siempre como él te amó y practiquemos lo que él enseñó. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA CLARA, vírgen:
  grado: Memoria
  fecha: 08-11
  comun: Del Común de vírgenes.
  inv_ant: Venid, adoremos al Cordero, al Esposo acompañado por el cortejo de vírgenes.
  himno: Nada posee clara
  lectura:
    ref: Ct 8, 7
    texto: Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.
  responsorio:
  - - V
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - V
    - Tu rostro buscaré, Señor.
  - - R
    - Buscad mi rostro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  ant_benedictus: Ésta es la virgen prudente que, unida a Cristo, resplandece como el sol en el reino celestial.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa Clara, que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
  oracion: Señor, Dios nuestro, que concediste a santa Clara un gran amor por la pobreza evangélica, concédenos, por su intercesión, seguir a Cristo en la pobreza del espíritu y llegar a contemplarte en tu glorioso reino. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
