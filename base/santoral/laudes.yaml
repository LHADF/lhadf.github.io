# Santoral de Laudes (calendario de sync, a revisar con el calendario ADF): por celebración.
# Solo figura lo que cambia respecto del salterio y del tiempo; «fecha: variable» = celebración movible.
SANTA MARÍA, MADRE DE DIOS:
  grado: Solemnidad
  fecha: 01-01
  inv_ant: Celebremos la maternidad de santa María Virgen y adoremos a su Hijo Jesucristo, el Señor.
  himno: Lucero del alba
  salmodia:
  - ant: 'Ha brotado un renuevo del tronco de Jesé, ha salido una estrella de la casa de Jacob: la Virgen ha dado a luz al Salvador; te alabamos, Dios nuestro.'
    salmo: salmo-62-2-9
  - ant: 'Mirad, María nos ha engendrado al Salvador, ante quien Juan exclamó: «Éste es el Cordero de Dios, que quita el pecado del mundo.» Aleluia.'
    salmo: cantico-dn-3-57-88-56
  - ant: 'La Madre ha dado a luz al Rey, cuyo nombre es eterno, y la que lo ha engendrado tiene, al mismo tiempo, el gozo de la maternidad y la gloria de la virginidad: un prodigio tal no se ha visto nunca ni se verá de nuevo jamás. Aleluia.'
    salmo: salmo-149
  lectura:
    ref: Mi 5, 3. 4. 5a
    texto: El jefe de Israel los abandonará hasta el tiempo en que dé a luz la que ha de dar a luz. Entonces el resto de sus hermanos volverá a los hijos de Israel. Él se alzará y pastoreará el rebaño con el poder del Señor, con la majestad del nombre del Señor su Dios; y él será nuestra paz.
  responsorio:
  - - V
    - El Señor revela su salvación. Aleluia, aleluia.
  - - R
    - El Señor revela su salvación. Aleluia, aleluia.
  - - V
    - Los confines de la tierra la han contemplado.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor revela su salvación. Aleluia, aleluia.
  ant_benedictus: 'Hoy se nos ha manifestado un misterio admirable: en Cristo se han unido dos naturalezas, Dios se ha hecho hombre y, sin dejar de ser lo que era, ha asumido lo que no era, sin sufrir mezcla ni división.'
  preces:
    intro: 'Glorifiquemos a Cristo, que ha nacido de María Virgen por obra del Espíritu Santo, y supliquémosle, diciendo:'
    preces:
    - - Oh Cristo, hijo admirable y príncipe de la paz, nacido de María Virgen,
      - concede al mundo entero una paz estable.
    - - Rey y Dios nuestro, que al venir al mundo has dignificado al hombre,
      - haz que te honremos todos los días de nuestra vida con nuestra fe y nuestra conducta.
    - - Tú que te has hecho semejante a nosotros,
      - concédenos ser semejantes a ti.
    - - Tú que has querido ser ciudadano de nuestro mundo,
      - concédenos ser ciudadanos de tu reino.
    respuesta: Hijo de la Virgen María, ten piedad de nosotros.
  padrenuestro_intro: 'Ya que somos la familia de Dios, digamos con grande confianza a nuestro Padre del cielo:'
  oracion: Señor Dios, que por la maternidad virginal de María has dado a los hombres los tesoros de la salvación, haz que sintamos la intercesión de la Virgen Madre, de quien hemos recibido al autor de la vida, Jesucristo, Hijo tuyo y Señor nuestro. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS BASILIO MAGNO Y GREGORIO NACIANZO, obispos y doctores de la Iglesia:
  grado: Memoria
  fecha: 01-02
  comun: Del común de doctores de la Iglesia.
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  salmodia:
  - ant: Me adelanto a la aurora pidiendo auxilio.
    salmo: salmo-118-145-152
  - ant: Mi fuerza y mi poder es el Señor, él fue mi salvación.
    salmo: cantico-ex-15-1-4-8-13-17-18
  - ant: Alabad al Señor, todas las naciones.
    salmo: salmo-116
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios, que has iluminado a la Iglesia con los ejemplos y las enseñanzas de san Basilio Magno y san Gregorio de Nacianzo, haz que busquemos humildemente tu verdad y que, viviendo según esta verdad, crezcamos en el amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA EPIFANÍA DEL SEÑOR:
  grado: Solemnidad
  fecha: 01-06
EL BAUTISMO DEL SEÑOR:
  grado: Fiesta
  fecha: variable
  inv_ant: Venid, adoremos a Cristo, el Hijo amado, en quien el Padre tiene sus complacencias.
  himno: A la orilla del Jordán
  salmodia:
  - ant: 'El soldado bautizaba a su Rey, el siervo a su Señor, Juan al Salvador: el agua del Jordán se estremece, la Paloma da testimonio, la voz del Padre declara: «Éste es mi Hijo.»'
    salmo: salmo-62-2-9
  - ant: 'Al manifestarse al mundo la gloria de Cristo, las aguas del Jordán fueron santificadas: sacad aguas con gozo de las fuentes del Salvador; Cristo, el Señor, ha santificado la creación entera.'
    salmo: cantico-dn-3-57-88-56
  - ant: Te glorificamos, Señor, Dios y redentor, a ti que con el Espíritu y el fuego purificas a los hombres de su pecado.
    salmo: salmo-149
  lectura:
    ref: Is 61, 1-2a
    texto: El Espíritu del Señor está sobre mí, porque el Señor me ha ungido. Me ha enviado para dar la buena noticia a los pobres, para vendar los corazones desgarrados, para proclamar la amnistía a los cautivos, la libertad a los prisioneros, para proclamar el año de gracia del Señor.
  responsorio:
  - - V
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  - - V
    - Tú que hoy te has manifestado.
  - - R
    - Ten piedad de nosotros.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo, Hijo de Dios vivo, ten piedad de nosotros.
  ant_benedictus: 'Cristo es bautizado y el universo entero se purifica; el Señor nos obtiene el perdón de los pecados: purifiquémonos todos por el agua y el Espíritu.'
  preces:
    intro: 'Roguemos a nuestro Redentor, bautizado por Juan en el Jordán, y digámosle:'
    preces:
    - - Cristo Jesús, que al manifestarte al mundo has iluminado a todos los hombres,
      - concede luz abundante a cuantos hoy se relacionen con nosotros.
    - - Cristo Jesús, que para enseñarnos un camino de humildad te humillaste recibiendo el bautismo de Juan,
      - danos un espíritu de humilde servicio para con todos los hombres.
    - - Cristo Jesús, que por tu bautismo nos purificaste de todo pecado y nos hiciste hijos del Padre,
      - concede el espíritu de adopción a todos los que buscan a Dios con sinceridad.
    - - Cristo Jesús, que en tu bautismo abriste una puerta de salvación para los cristianos y santificaste la creación entera,
      - haz de todos nosotros ministros de tu Evangelio en el mundo.
    - - Cristo Jesús, que en tu bautismo nos revelaste a la Trinidad,
      - renueva el espíritu de adopción y el sacerdocio real de los bautizados.
    respuesta: Señor, ten piedad.
  padrenuestro_intro: 'Gracias a Jesucristo somos hijos de Dios; por eso nos atrevemos a decir:'
  oracion: Dios todopoderoso y eterno, que proclamaste solemnemente a Cristo como tu Hijo amado, cuando era bautizado en el Jordán y descendía el Espíritu Santo sobre él, concede a tus hijos de adopción, renacidos del agua y del Espíritu Santo, que se conserven siempre dignos de tu complacencia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANTONIO, ABAD:
  grado: Memoria
  fecha: 01-17
  comun: 'Del Común de santos varones: para los santos religiosos.'
  inv_ant: Aclamemos al Señor, en esta fiesta de san Antonio, abad.
  himno: Vosotros sois luz del mundo
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: «El que cumple la voluntad de Dios, ése es mi hermano y mi hermana y mi madre», dice el Señor.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Señor, tú que inspiraste a san Antonio abad el deseo de retirarse al desierto para servirte allí con una vida admirable, haz que, por su intercesión, tengamos la fuerza de renunciar a todo lo que nos separe de ti y sepamos amarte por encima de todo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA INÉS, virgen y mártir:
  grado: Memoria
  fecha: 01-21
  comun: Del común de vírgenes.
  inv_ant: Venid, adoremos al Señor, rey de las vírgenes.
  himno: Nos apremia el amor, vírgenes santas
  salmodia:
  - ant: Mi Señor Jesucristo ha puestro en mi dedo un anillo nupcial y sobre mi cabeza ha colocado una corona de esposa.
    salmo: salmo-62-2-9
  - ant: Estoy desposada con aquel a quien sirven los ángeles y cuya belleza admiran el sol y la luna.
    salmo: cantico-dn-3-57-88-56
  - ant: Alegraos conmigo y felicitadme, porque he obtenido un trono resplandeciente en la asamblea de los santos.
    salmo: salmo-149
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - Dios la socorre al despuntar la aurora.
  - - R
    - Dios la socorre al despuntar la aurora.
  - - V
    - Teniendo a Dios en medio no vacila.
  - - R
    - Al despuntar la aurora.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la socorre al despuntar la aurora.
  ant_benedictus: Al que deseé ya lo contemplo, al que esperaba ya lo poseo; en el cielo estoy unida con aquel a quien tan ardientemente amé cuando estaba en la tierra.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa Inés, que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
  oracion: Dios todopoderoso y eterno, que te has complacido en elegir lo débil a los ojos del mundo para confundir a los que se creían fuertes, concede a quienes estamos celebrando el martirio de santa Inés imitar la heroica firmeza de su fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
