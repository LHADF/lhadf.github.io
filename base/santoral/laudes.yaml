NUESTRA SEÑORA DE GUADALUPE:
  grado: Fiesta
  fecha: 12-12
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Venid, adoremos a Cristo, hijo de la siempre Virgen María.
  himno: Ayer, alba en el alba, subiste presurosa
  salmodia:
  - ant: ¿Quién es esa que surge como el alba, hermosa como la luna y límpida como el sol, imponente como escuadrón a banderas desplegadas?
    salmo: salmo-62-2-9
  - ant: Yo soy la siempre Virgen santa María, Madre del verdadero Dios por quien se vive.
    salmo: cantico-dn-3-57-88-56
  - ant: Como el águila incita a volar a sus polluelos y revolotea sobre el nido, así extendió ella sus alas y los llevó sobre su plumaje.
    salmo: salmo-149
  lectura:
    ref: Cf. Sir 50, 5-10
    texto: ¡Qué majestuosa cuando salía detrás del velo! Como estrella matutina en medio de las nubes, como la luna en los días de plenilunio, como el sol cuando brilla sobre el templo del Altísimo, como el arco iris que ilumina las nubes de gloria, como flor de rosal en primavera, como lirio junto a un manantial, como vaso de oro macizo adornado con piedras preciosas.
  responsorio:
  - - V
    - Levanto mis ojos a los montes, ¿de dónde me vendrá el auxilio?
  - - R
    - Levanto mis ojos a los montes, ¿de dónde me vendrá el auxilio?
  - - V
    - Señor, por ti madrugo, dame una señal propicia.
  - - R
    - ¿De dónde me vendrá el auxilio?
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Levanto mis ojos a los montes, ¿de dónde me vendrá el auxilio?
  ant_benedictus: 'Sube a un alto monte, alegre mensajero de Jerusalén, di a las ciudades de Judá: «¡Aquí está vuestro Dios! Como un pastor pastorea a su pueblo.»'
  preces:
    intro: 'Alabemos a Dios Padre todopoderoso, el Creador por quien se vive, y digámosle:'
    preces:
    - - Bendito seas, Señor del universo, que en tu inmensa piedad nos enviaste a la Madre de tu Hijo,
      - para llamarnos a la fe y hacernos ingresar a tu pueblo santo.
    - - Te bendecimos, Señor, porque ocultaste tu mensaje a los sabios y prudentes según el mundo
      - y lo revelaste a los pequeños, a los que son tenidos por insignificantes y despreciables.
    - - Concédenos ser, como Juan Diego, embajadores tuyos muy dignos de confianza,
      - que llevemos a todos los hombres y a todas las naciones tu mensaje de amor y de paz.
    - - Tú que, con la presencia de María, haces brillar los riscos como perlas y las espinas como el oro,
      - haz que el amor de la Santísima Virgen María nos transforme en otros Cristos.
    - - Haz que , como Juan Diego, seamos siempre fieles al culto divino y a tus mandatos,
      - para que merezcamos, también nosotros, que la Virgen María nos salga al paso en el camino de nuestra vida.
    respuesta: Señor, por quien vivimos, escucha nuestras plegarias.
  padrenuestro_intro: 'Con la confianza que nos da la predilección mostrada por la santa Madre de Dios hacia nosotros, digámosle al Padre de los Cielos, con profundo amor filial:'
  oracion: Señor, Dios nuestro, que has concedido a tu pueblo la protección maternal de la siempre Virgen María, Madre de tu Hijo, concédenos, por su intercesión, permanecer siempre firmes en la fe y servir con sincero amor a nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA LUCÍA, virgen y mártir:
  grado: Memoria
  fecha: 12-13
  comun: Del Común de un mártir.
  inv_ant: Venid, adoremos al Señor, rey de los mártires.
  himno: Palabra del Señor ya rubricada
  lectura:
    ref: 2Co 1, 3-5
    texto: Bendito sea Dios, Padre de nuestro Señor Jesucristo, Padre de misericordia y Dios de todo consuelo; él nos consuela en todas nuestras luchas, para poder nosotros consolar a los que están en toda tribulación, mediante el consuelo con que nosotros somos consolados por Dios. Porque si es cierto que los sufrimientos de Cristo rebosan sobre nosotros, también por Cristo rebosa nuestro consuelo.
  responsorio:
  - - V
    - El Señor es mi fuerza y mi energía.
  - - R
    - El Señor es mi fuerza y mi energía.
  - - V
    - Él es mi salvación.
  - - R
    - Y mi energía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es mi fuerza y mi energía.
  ant_benedictus: Yo, humilde esclava, no he hecho otra cosa sino ofrecer sacrificios al Dios verdadero; ahora, como ya nada tengo, me ofrezco a mí misma.
  preces:
