    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Dios todopoderoso y eterno, que suscitaste a san Atanasio como preclaro defensor de la divinidad de tu Hijo, haz que nosotros, iluminados por sus enseñanzas y ayudados por sus ejemplos, crezcamos en tu conocimiento y en tu amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS FELIPE Y SANTIAGO, apóstoles:
  grado: Fiesta
  fecha: 05-04
  comun: Del Común de apóstoles.
  inv_ant: Aleluia. Venid, adoremos al Señor, rey de los apóstoles. Aleluia.
  himno: Con el gozo pascual
  salmodia:
  - ant: Señor, muéstranos al Padre, y eso nos bastará. Aleluia.
    salmo: salmo-62-2-9
  - ant: Tanto tiempo hace que estoy con vosotros y ¿no me acabas de conocer? Felipe, el que me ve ve también a mi Padre. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: 'No se aflija vuestro corazón: tened fe viva en Dios y tenedla también en mi; en la casa de mi Padre hay muchas moradas. Aleluia.'
    salmo: salmo-149
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra. Aleluia, aleluia.
  - - R
    - Los nombrarás príncipes sobre toda la tierra. Aleluia, aleluia.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra. Aleluia, aleluia.
  ant_benedictus: 'Felipe se encontró con Natanael, y le dijo: «Hemos encontrado a aquel de quien escribieron Moisés en la ley y los profetas: a Jesús de Nazaret, el hijo de José.» Aleluia.'
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Señor, tú que nos alegras todos los años con esta fiesta de los santos apóstoles Felipe y Santiago, concédenos, por su intercesión, que, viviendo ahora íntimamente unidos a la muerte y resurrección de tu Hijo, podamos, en la eternidad, contemplar la gloria de tu rostro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE LUJÁN, Patrona de la República Argentina:
  grado: Solemnidad
  fecha: 05-08
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Celebremos el patrocinio de santa María Virgen, concebida sin pecado, y adoremos a su Hijo, Jesucristo el Señor. Aleluia.
  himno: Salve divina María
  salmodia:
  - ant: ¿Quién es esa que surge como el alba, hermosa como la luna y límpida como el sol, imponente como escuadrón a banderas desplegadas? Aleluia.
    salmo: salmo-62-2-9
  - ant: Tú eres la gloria de Jerusalén; tú, la alegría de Israel; tú, el honor de nuestro pueblo. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Alégrate, María, llena de gracia, el Señor está contigo. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Cf. Sir 50, 5-10
    texto: ¡Qué majestuosa cuando salía detrás del velo! Como estrella matutina en medio de las nubes, como la luna en los días de plenilunio, como el sol cuando brilla sobre el templo del Altísimo, como el arco iris que ilumina las nubes de gloria, como flor de rosal en primavera, como lirio junto a un manantial, como vaso de oro macizo adornado con piedras preciosas.
  responsorio:
  - - V
    - Alégrate, María, llena de gracia, el Señor está contigo. Aleluia, Aleluia.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo. Aleluia, Aleluia.
  - - V
    - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  - - R
    - Aleluia, Aleluia.
  - - V
    - Gloria al Padre, al Hijo, y al Espíritu Santo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo. Aleluia, Aleluia.
  ant_benedictus: He elegido y santificado este lugar, para que en él permanezca mi nombre para siempre y estén fijos en él mis ojos y mi corazón. Aleluia.
  preces:
    intro: 'Elevemos nuestras súplicas a Cristo, el Salvador del mundo, que quiso darnos todos los bienes por mediación de María, y digámosle:'
    preces:
    - - Bendito seas, Señor, que en tu inmensa bondad quisiste que tu Madre pusiera su trono en nuestras pampas, a orillas del río Luján,
      - mira a tu pueblo que clama a ti y concédele los dones de la prosperidad y la paz.
    - - Bendito seas, Señor, que quisiste mostrar tus favores primero a los humildes y sencillos,
      - alivia a los necesitados, da pan a los hambrientos, consuelo a los afligidos, salud a los enfermos.
    - - Bendito seas, Señor, que quisiste darnos un ejemplo de fidelidad y piedad en la persona del negro Manuel,
      - haz que imitemos su sencillez y sepamos ser serviciales con nuestros hermanos.
    - - Bendito seas, Señor, que por María abriste en Luján una fuente de gracia y bendición,
      - mira a tu Iglesia, a nuestro santo padre, el papa Francisco, a nuestros obispos, sacerdotes, gobernantes y pueblo, y conserva a todos en la unidad de la fe y la caridad.
    - - Bendito seas, Señor, que constituiste a tu Madre señora y protectora de nuestra Patria,
      - que su patrocinio nos alcance en la tierra los bienes que necesitamos y que un día gocemos de las alegrías eternas del cielo.
    respuesta: Escucha, Señor, nuestras plegarias.
  padrenuestro_intro: 'Unidos fraternalmente bajo la protección maternal de María, digamos a Dios con profunda confianza filial:'
  oracion: Señor, mira con bondad la fidelidad de tu Pueblo y concédenos que, por los méritos e intercesión de la santísima Virgen María, obtengamos los dones de tu gracia en la vida presente y la salvación eterna en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN MATÍAS, apóstol:
  grado: Fiesta
  fecha: 05-14
  comun: Del Común de apóstoles.
  inv_ant: Venid, adoremos al Señor, rey de los apóstoles. Aleluia.
  himno: Con el gozo pascual
  salmodia:
  - ant: Éste es mi mandamiento, que os améis unos a otros como yo os he amado. Aleluia.
    salmo: salmo-62-2-9
  - ant: Nadie tiene más amor que el que da la vida por sus amigos. Aleluia.
    salmo: cantico-dn-3-57-88-56
  - ant: Vosotros sois mis amigos si hacéis lo que os mando. Aleluia.
    salmo: salmo-149
  lectura:
    ref: Ef 2, 19-22
    texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también vosotros os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
  responsorio:
  - - V
    - Los nombrarás príncipes sobre toda la tierra. Aleluia, aleluia.
  - - R
    - Los nombrarás príncipes sobre toda la tierra. Aleluia, aleluia.
  - - V
    - Harán memorable tu nombre, Señor.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los nombrarás príncipes sobre toda la tierra. Aleluia, aleluia.
  ant_benedictus: Hay aquí entre nosotros hombres que han andado en nuestra compañía todo el tiempo del ministerio público de Jesús, el Señor; es, pues, preciso que elijamos a uno de ellos para que, junto con nosotros, dé testimonio de la verdad de la resurrección. Aleluia.
  preces:
    intro: 'Demos gracias a nuestro Padre que está en los cielos, porque por medio de los apóstoles nos ha dado parte en la herencia de los elegidos, y aclamémosle diciendo:'
    preces:
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado la mesa de tu cuerpo y de tu sangre:'
      - en ella encontramos nuestra fuerza y nuestra vida.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has preparado la mesa de tu palabra:'
      - por ella crecemos en el conocimiento de la verdad y se acrecienta nuestro gozo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles has fundado tu Iglesia:'
      - por ella nos edificas en la unidad de tu pueblo.
    - - 'Te alabamos, Señor, porque por medio de los apóstoles nos has dado el bautismo y la penitencia:'
      - por ellos nos purificas de todas nuestras culpas.
    respuesta: El coro de los apóstoles te alaba, Señor.
  padrenuestro_intro: 'Concluyamos nuestra oración con la plegaria que Jesús enseñó a los apóstoles:'
  oracion: Señor Dios, tú que, para completar el número de los doce apóstoles, elegiste a san Matías, concédenos, por la intercesión de este apóstol, a nosotros, que hemos recibido el don de tu amistad, poder ser contados un día entre tus elegidos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
MARÍA, MADRE DE LA IGLESIA:
  grado: Memoria
  fecha: variable
  comun: Del Común de la Virgen María.
  inv_ant: Aclamemos al Señor en esta fiesta de María Virgen.
  himno: Cabeza y Cuerpo, Cristo forma un todo
  lectura:
    ref: Is 61, 10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_benedictus: Te glorificamos, santa Madre de Dios, porque al concebir en tu seno virginal al Hijo de Dios y al darlo a luz al mundo, preparaste el nacimiento de la Iglesia, que hoy por ello te aclama como madre.
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Salvador del mundo, tú que con la eficacia de tu redención preservaste a tu Madre de toda mancha de pecado,
      - líbranos también a nosotros de toda culpa.
    - - Redentor nuestro, tú que hiciste de la inmaculada Virgen María tabernáculo purísimo de tu presencia y sagrario del Espíritu Santo,
      - haz también de nosotros templos de tu Espíritu.
    - - Palabra eterna del Padre, que enseñaste a María a escoger la parte mejor,
      - ayúdanos a imitarla y a buscar el alimento que perdura hasta la vida eterna.
    - - Rey de reyes, que elevaste contigo a tu Madre en cuerpo y alma al cielo,
      - haz que aspiremos siempre a los bienes celestiales.
    - - Señor del cielo y de la tierra, que has colocado a tu derecha a María reina,
      - danos el gozo de tener parte en su gloria.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, Padre de misericordia, cuyo Hijo, clavado en la cruz, proclamó como Madre nuestra a su Madre, santa María virgen, concédenos por su mediación amorosa, que tu Iglesia, cada día más fecunda, se llene de gozo por la santidad de sus hijos, y atraiga a su seno a todos los pueblos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SANTÍSIMA TRINIDAD:
  grado: Solemnidad
  fecha: variable
  inv_ant: Al Dios verdadero, que es uno solo en tres personas, venid, adorémosle.
  himno: Oh tú, santa Unidad en Trinidad
  salmodia:
  - ant: A ti el honor y el imperio, a ti la gloria y el poder, a ti la alabanza y las aclamaciones por todos los siglos, oh excelsa Trinidad.
    salmo: salmo-62-2-9
  - ant: A ti con justicia te alaban, te adoran y glorifican todas las creaturas, oh bienaventurada Trinidad.
    salmo: cantico-dn-3-57-88-56
  - ant: De él, por él y para él son todas las cosas. ¡Gloria a él por todos los siglos!
    salmo: salmo-149
  lectura:
    ref: 1Co 12, 4-6
    texto: Hay diversidad de dones, pero un mismo Espíritu; hay diversidad de servicios, pero un mismo Señor; y hay diversidad de funciones, pero un mismo Dios que obra todo en todos.
  responsorio:
  - - V
    - Para ti la alabanza y la gloria, oh excelsa Trinidad.
  - - R
    - Para ti la alabanza y la gloria, oh excelsa Trinidad.
  - - V
    - Para ti continua acción de gracias por todos los siglos.
  - - R
    - Oh excelsa Trinidad.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Para ti la alabanza y la gloria, oh excelsa Trinidad.
  ant_benedictus: Bendita sea la santísima e indivisible Trinidad, que ha creado el universo y lo gobierna, bendita sea ahora y siempre y por todos los siglos.
  preces:
    intro: 'Alabemos con júbilo al Dios todopoderoso, Padre, Hijo y Espíritu Santo, y glorifiquémoslo, diciendo:'
    preces:
    - - Padre santo, ya que nosotros no sabemos pedir lo que nos conviene, danos tu Espíritu para que venga en ayuda de nuestra debilidad,
      - y que él mismo interceda por nosotros.
    - - Hijo único de Dios, que pediste al Padre para tu Iglesia el Espíritu de la verdad,
      - haz que este Defensor esté siempre con nosotros.
    - - 'Ven, Espíritu Santo, que procedes del Padre y del Hijo, y derrama en nosotros tus frutos: caridad, gozo espiritual, paz, paciencia, benignidad, bondad,'
      - longanimidad, mansedumbre, fe, modestia, continencia y castidad.
    - - 'Padre todopoderoso, tú que enviaste a nuestros corazones el Espíritu de tu Hijo que clama: «¡Padre!»,'
      - haz que nos dejemos llevar por ese Espíritu y lleguemos a ser herederos tuyos y coherederos de Cristo.
    - - Señor Jesús, que nos enviaste desde el Padre al Paráclito para que diera testimonio de ti,
      - haz que también nosotros demos testimonio de ti ante los hombres.
    respuesta: ¡Gloria al Padre, y al Hijo, y al Espíritu Santo!
  padrenuestro_intro: 'Digamos ahora al Padre, movidos por el Espíritu Santo que ora en nosotros, la plegaria que Cristo nos enseñó:'
  oracion: Dios Padre, que has enviado al mundo la Palabra de verdad y el Espíritu de santificación para revelar a los hombres tu misterio admirable, concédenos que, al profesar la fe verdadera, reconozcamos la gloria de la eterna Trinidad y adoremos la Unidad de tu majestad omnipotente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FELIPE NERI, presbítero:
  grado: Memoria
  fecha: 05-26
  comun: Del Común de pastores para un santo presbítero.
  inv_ant: Venid, adoremos a Cristo, Pastor supremo.
  himno: Cristo, cabeza, rey de los pastores
  lectura:
    ref: Hb 13, 7-9a
    texto: 'Acordaos de aquellos superiores vuestros que os expusieron la palabra de Dios: reflexionando sobre el desenlace de su vida, imitad su fe. Jesucristo es el mismo hoy que ayer, y para siempre. No os dejéis extraviar por doctrinas llamativas y extrañas.'
  responsorio:
  - - V
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  - - V
    - Ni de día ni de noche dejarán de anunciar el nombre del Señor.
  - - R
    - He colocado centinelas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Sobre tus murallas, Jerusalén, he colocado centinelas.
  ant_benedictus: No sois vosotros los que habláis, sino el Espíritu de vuestro Padre quien habla por vosotros.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Señor Dios nuestro, que nunca dejas de glorificar la santidad de quienes con fidelidad te sirven, haz que el fuego del Espíritu Santo nos encienda en aquel mismo ardor que tan maravillosamente inflamó el corazón de san Felipe Neri. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARÍA DE JESÚS PAREDES, virgen:
  grado: Memoria
  fecha: 05-26
  comun: Del Común vírgenes.
  inv_ant: Venid, adoremos al Cordero, al Esposo acompañado por el cortejo de vírgenes.
  himno: Nos apremia el amor, vírgenes santas
  lectura:
    ref: Ct 8, 7
    texto: Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.
  responsorio:
  - - V
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - V
    - Tu rostro buscaré, Señor.
  - - R
    - Buscad mi rostro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  ant_benedictus: Ésta es la virgen prudente que, unida a Cristo, resplandece como el sol en el reino celestial.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa Clara, que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
  oracion: Padre de bondad, que hiciste florecer también en tierra americana la gloria de la santidad en la virgen santa Mariana de Jesús, concede a estos pueblos imitar su celo por el Evangelio y dar vivo testimonio de fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
