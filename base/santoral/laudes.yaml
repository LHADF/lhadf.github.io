    - El pueblo cuenta su sabiduría. Aleluia, aleluia.
  - - R
    - El pueblo cuenta su sabiduría. Aleluia, aleluia.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría. Aleluia, aleluia.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad. Aleluia.
