  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Señor, tú que adornaste a san Vicente de Paúl con las cualidades de un verdadero apóstol, para que se entregara al servicio de los pobres y a la formación de los ministros de tu Iglesia, concédenos a nosotros que, animados por un celo semejante al suyo, amemos lo que él amó y practiquemos lo que él enseñó. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS ARCÁNGELES MIGUEL GABRIEL Y RAFAEL:
  grado: Fiesta
  fecha: 09-29
  inv_ant: Venid, adoremos al Señor, delante de los ángeles.
  himno: En la hora en que Cristo resucita
  salmodia:
  - ant: 'Alabemos al Señor, a quien alaban también los ángeles, a quien los querubines y serafines aclaman, diciendo: «Santo, santo, santo.»'
    salmo: salmo-62-2-9
  - ant: Ángeles del Señor, bendecid al Señor eternamente.
    salmo: cantico-dn-3-57-88-56
  - ant: 'En el cielo, Señor, todos los ángeles te proclaman santo, y dicen a una voz: «Oh Dios, tú mereces alabanza.»'
    salmo: salmo-149
  lectura:
    ref: Gn 28, 12-13a
    texto: 'Vio Jacob en sueños una escalinata apoyada en la tierra y cuya cima tocaba el cielo. Ángeles de Dios subían y bajaban por ella. Y vio al Señor que estaba de pie sobre ella y le decía: «Yo soy el Señor, el Dios de tu padre Abraham y el Dios de Isaac.»'
  responsorio:
  - - V
    - El ángel se puso en pie junto al altar.
  - - R
    - El ángel se puso en pie junto al altar.
  - - V
    - Con un incensario de oro en sus manos.
  - - R
    - Junto al altar.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El ángel se puso en pie junto al altar.
  ant_benedictus: 'Os lo digo con toda verdad: «Habéis de ver el cielo abierto y a los ángeles de Dios, subiendo y bajando en servicio del Hijo del hombre.»'
  preces:
    intro: 'Adoremos, hermanos, al Señor, a quien proclaman los ángeles a una voz, y digámosle con gozo:'
    preces:
    - - Tú, Señor, que has dado órdenes a tus ángeles para que nos guarden en nuestros caminos,
      - condúcenos hoy por tus sendas y no permitas que caigamos en el pecado.
    - - Haz que te busquemos a ti en todo lo que hagamos
      - y seamos así semejantes a los ángeles que están viendo siempre tu rostro.
    - - Concédenos, Señor, la pureza del alma y la castidad del cuerpo,
      - para que seamos como tus ángeles en el cielo.
    - - Manda, Señor, en ayuda de tu pueblo al gran arcángel Miguel,
      - para que nos sintamos protegidos en nuestras luchas contra Satanás y sus ángeles.
    respuesta: Bendecid al Señor, todos sus ángeles.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Señor Dios todopoderoso, que, con una providencia admirable, llamas a los ángeles y a los hombres para que cooperen a tu plan de salvación, haz que, durante nuestro peregrinar en la tierra, nos sintamos siempre protegidos por los ángeles, que en el cielo están en tu presencia para servirte y gozan ya contemplando tu rostro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JERÓNIMO, presbítero y doctor de la iglesia:
  grado: Memoria
  fecha: 09-30
  comun: Del Común de doctores de la Iglesia.
  inv_ant: Venid, adoremos al Señor, fuente de la sabiduría.
  himno: Para vosotros, el misterio del Padre
  lectura:
    ref: Sb 7, 13-14
    texto: 'Aprendí la sabiduría sin malicia, reparto sin envidia, y no me guardo sus riquezas. Porque es un tesoro inagotable para los hombres: los que lo adquieren se atraen la amistad de Dios, porque el don de su enseñanza los recomienda.'
  responsorio:
  - - V
    - El pueblo cuenta su sabiduría.
  - - R
    - El pueblo cuenta su sabiduría.
  - - V
    - La asamblea pregona su alabanza.
  - - R
    - Cuenta su sabiduría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El pueblo cuenta su sabiduría.
  ant_benedictus: Los sabios brillarán con esplendor de cielo, y los que enseñan la justicia a las multitudes serán como estrellas por toda la eternidad.
  preces:
    intro: 'Demos gracias a Cristo, el buen pastor que entregó la vida por sus ovejas, y supliquémosle diciendo:'
    preces:
    - - Señor Jesucristo, tú que en los santos pastores nos has revelado tu misericordia y tu amor,
      - haz que, por ellos, continúe llegando a nosotros tu acción misericordiosa.
    - - Señor Jesucristo, tú que a través de los santos pastores sigues siendo el único pastor de tu pueblo,
      - no dejes de guiarnos siempre por medio de ellos.
    - - Señor Jesucristo, tú que por medio de los santos pastores eres el médico de los cuerpos y de las almas,
      - haz que nunca falten en tu Iglesia los ministros que nos guíen por las sendas de una vida santa.
    - - Señor Jesucristo, tú que has adoctrinado a la Iglesia con la prudencia y el amor de los santos,
      - haz que, guiados por nuestros pastores, progresemos en la santidad.
    respuesta: Apacienta a tu pueblo, Señor.
  padrenuestro_intro: 'Oremos confiadamente al Padre, como Cristo nos enseñó:'
  oracion: Oh Dios, que concediste a san Jerónimo saber gustar de la sagrada Escritura y vivirla intensamente, haz que tu pueblo se alimente cada vez más en tu palabra y encuentre en ella la fuente de la vida. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA TERESA DEL NIÑO JESÚS:
  grado: Memoria
  fecha: 10-01
  comun: Del Común de vírgenes.
  inv_ant: Venid, adoremos al Cordero, al Esposo acompañado por el cortejo de vírgenes.
  himno: Nos apremia el amor, vírgenes santas
  lectura:
    ref: Ct 8, 7
    texto: Las aguas torrenciales no podrían apagar el amor, ni anegarlo los ríos. Si alguien quisiera comprar el amor con todas las riquezas de su casa, se haría despreciable.
  responsorio:
  - - V
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  - - V
    - Tu rostro buscaré, Señor.
  - - R
    - Buscad mi rostro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - 'Oigo en mi corazón: buscad mi rostro.'
  ant_benedictus: Yo os aseguro que, si no volvéis a haceros como niños, no entraréis en el reino de los cielos.
  preces:
    intro: 'Glorifiquemos a Cristo, esposo y corona de las vírgenes, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, a quien las vírgenes amaron como a su único esposo,
      - concédenos que nada nos aparte de tu amor.
    - - Tú que coronaste a María como reina de las vírgenes,
      - por su intercesión concédenos recibirte siempre con pureza de corazón.
    - - Por intercesión de las santas vírgenes que te sirvieron siempre con fidelidad, consagradas a ti en cuerpo y alma,
      - ayúdanos, Señor, a que los bienes de este mundo que pasa no nos separen de tu amor eterno.
    - - Señor Jesús, esposo que has de venir y a quien las vírgenes prudentes esperaban,
      - concédenos que aguardemos tu retorno glorioso con una esperanza activa.
    - - Por intercesión de santa [VIRGEN], que fue virgen sensata y una de las prudentes,
      - concédenos, Señor, la verdadera sabiduría y la pureza de costumbres.
    respuesta: Jesús, corona de las vírgenes, escúchanos.
  padrenuestro_intro: 'Con sencillez y humildad digamos la oración que Jesús nos enseñó:'
  oracion: Dios y Padre nuestro, que abres las puertas de tu reino a los pequeños y a los humildes, haz que sigamos confiadamente el camino de sencillez que siguió santa Teresa del Niño Jesús, para que, por su intercesión, también nosotros lleguemos a descubrir aquella gloria que permanece escondida a los sabios y a los prudentes según el mundo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LOS SANTOS ÁNGELES CUSTODIOS:
