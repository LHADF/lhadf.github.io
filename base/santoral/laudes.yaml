    - - Manda, Señor, en ayuda de tu pueblo al gran arcángel Miguel,
      - para que nos sintamos protegidos en nuestras luchas contra Satanás y sus ángeles.
    respuesta: Bendecid al Señor, todos sus ángeles.
  padrenuestro_intro: 'Terminemos nuestra oración con las palabras del Señor:'
  oracion: Dios, Padre misericordioso, que, en tu providencia inefable, te has dignado enviar, para nuestra guarda, a tus santos ángeles, concede a quienes te suplican ser siempre defendidos por su protección y gozar eternamente de su compañía. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO DE ASÍS:
  grado: Memoria
  fecha: 10-04
  comun: 'Del Común de santos varones: para los santos religiosos.'
  inv_ant: Venid, adoremos al Señor, aclamemos al Dios admirable en sus santos.
  himno: Ven, Francisco, a tus hermanos
  lectura:
    ref: Rm 12, 1-2
    texto: Os exhorto, por la misericordia de Dios, a presentar vuestros cuerpos como hostia viva, santa, agradable a Dios; éste es vuestro culto razonable. Y no os ajustéis a este mundo, sino transformaos por la renovación de la mente, para que sepáis discernir lo que es la voluntad de Dios, lo bueno, lo que agrada, lo perfecto.
  responsorio:
  - - V
    - Lleva en el corazón la ley de su Dios.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Y sus pasos no vacilan.
  - - R
    - Lleva en el corazón la ley de su Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Lleva en el corazón la ley de su Dios.
  ant_benedictus: Francisco, pobre y humilde en la tierra, entra colmado de riquezas en el cielo, y en su honor se elevan himnos celestes.
  preces:
    intro: 'Adoremos, hermanos, a Cristo, el Dios santo, y, pidiéndole que nos enseñe a servirle con santidad y justicia en su presencia todos nuestros días, aclamémosle diciendo:'
    preces:
    - - Señor Jesús, probado en todo exactamente como nosotros, menos en el pecado,
      - compadécete de nuestras debilidades.
    - - Señor Jesús, que a todos nos llamas a la perfección del amor,
      - danos el progresar por caminos de santidad.
    - - Señor Jesús, que nos quieres sal de la tierra y luz del mundo,
      - ilumina nuestras vidas con tu propia luz.
    - - Señor Jesús, que viniste al mundo no para que te sirvieran, sino para servir,
      - haz que sepamos servir con humildad a ti y a nuestros hermanos.
    - - Señor Jesús, reflejo de la gloria del Padre e impronta de su ser,
      - haz que un día podamos contemplar la claridad de tu gloria.
    respuesta: Tú solo eres santo, Señor.
  padrenuestro_intro: 'Oremos ahora al Padre, como nos enseñó el mismo Jesús:'
  oracion: Señor Dios, que en el pobre y humilde Francisco de Asís has dado a tu Iglesia una imagen viva de Jesucristo, haz que nosotros, siguiendo su ejemplo, imitemos a tu Hijo y vivamos, como este santo, unidos a ti en el gozo del amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL ROSARIO:
  grado: Memoria
  fecha: 10-07
  comun: Del Común de la Santísima Virgen María.
  inv_ant: Venid, adoremos a Cristo, Hijo de María Virgen.
  himno: Resplandeciente de alegría
  salmodia:
  - ant: De María nació Jesús, que es el Mesías.
    salmo: salmo-62-2-9
  - ant: Unidos a ti, Madre, bendecimos al Señor, que al morir nos puso como hijos bajo tu cuidado.
    salmo: cantico-dn-3-57-88-56
  - ant: La Virgen María ha sido glorificada por encima de los coros de los ángeles y lleva una corona de doce estrellas sobre su cabeza.
    salmo: salmo-149
  lectura:
    ref: Is 61,10
    texto: 'Desbordo de gozo en el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como a una novia que se adorna con sus joyas.'
  responsorio:
  - - V
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - V
    - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  - - R
    - El Señor está contigo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  ant_benedictus: 'Madre dichosa, Virgen intacta, Reina gloriosa del mundo: haz que sintamos tu protección los que hoy celebramos esta fiesta en tu honor.'
  preces:
    intro: 'Elevemos nuestras súplicas al Salvador, que quiso nacer de María Virgen, y digámosle:'
    preces:
    - - Sol de justicia, a quien María Virgen precedía cual aurora luciente,
      - haz que vivamos siempre iluminados por la claridad de tu presencia.
    - - Palabra eterna del Padre, tú que elegiste a María como arca de tu morada,
      - líbranos de toda ocasión de pecado.
    - - Salvador del mundo, que quisiste que tu Madre estuviera junto a tu cruz,
      - por su intercesión concédenos compartir con alegría tus padecimientos.
    - - Señor Jesús, que colgado en la cruz entregaste María a Juan como madre,
      - haz que nosotros vivamos también como hijos suyos.
    respuesta: Que tu santa Madre, Señor, interceda por nosotros.
  padrenuestro_intro: 'Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, que por el anuncio del ángel nos has hecho conocer la encarnación de tu Hijo, infunde tu gracia en nosotros y concédenos, por la intercesión de la Santísima Virgen María, que podamos alcanzar, por la virtud de la pasión y de la cruz de tu Hijo Jesucristo, la gloria de su resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
