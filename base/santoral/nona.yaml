# Santoral de Nona (calendario de sync): por celebración; solo lo que cambia.
SANTA MARÍA, MADRE DE DIOS:
  grado: Solemnidad
  fecha: 01-01
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Ba 5, 3-4
    texto: 'Dios mostrará tu esplendor, Jerusalén, a todo lo que hay bajo el cielo. Dios te dará para siempre este nombre: «Paz de la justicia» y «Gloria de la piedad.»'
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran. Aleluia.
  - - R
    - La justicia y la paz se besan. Aleluia.
  oracion: Señor Dios, que por la maternidad virginal de María has dado a los hombres los tesoros de la salvación, haz que sintamos la intercesión de la Virgen Madre, de quien hemos recibido al autor de la vida, Jesucristo, Hijo tuyo y Señor nuestro. Él, que vive y reina por los siglos de los siglos.
SANTOS BASILIO MAGNO Y GREGORIO NACIANZO, obispos y doctores de la Iglesia:
  grado: Memoria
  fecha: 01-02
  lectura:
    ref: 1Jn 1, 5
    texto: 'El mensaje que de él hemos recibido y os transmitimos es éste: Dios es luz y en él no hay tiniebla alguna.'
  oracion: Concede, Señor, una fe inquebrantable a tu pueblo, que confiesa y proclama que tu Hijo único, eterno y glorioso como tú, nació de la Virgen María, tomando un cuerpo humano como el nuestro; haz que, por ese misterio inefable, nos veamos libres de las adversidades de esta vida y merezcamos ir después a disfrutar del gozo que no tiene fin. Por Cristo nuestro Señor.
EL BAUTISMO DEL SEÑOR:
  grado: Fiesta
  fecha: 01-10
  himno: Fundamento de todo lo que existe
  ant: 'Juan habla como testigo y dice: «Vi al Espíritu Santo descender y posarse sobre él como una paloma.»'
  lectura:
    ref: Is 49, 6
    texto: 'El Señor me dijo: «Es poco que seas mi siervo para restablecer a las tribus de Jacob y hacer volver a los supervivientes de Israel; te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.»'
  versiculo:
  - - V
    - Haré posar mi Espíritu sobre él.
  - - R
    - Y dará a conocer mi ley a todas las naciones.
  oracion: Dios todopoderoso y eterno, que proclamaste solemnemente a Cristo como tu Hijo amado, cuando era bautizado en el Jordán y descendía el Espíritu Santo sobre él, concede a tus hijos de adopción, renacidos del agua y del Espíritu Santo, que se conserven siempre dignos de tu complacencia. Por Cristo nuestro Señor.
SANTA INÉS, virgen y mártir:
  grado: Memoria
  fecha: 01-21
  himno: Oh Jesús, que en tu cruz has demostrado
SAN FRANCISCO DE SALES, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 01-24
  himno: Oh Jesús, que en tu cruz has demostrado
MARÍA, REINA DE LA PAZ:
  grado: Memoria
  fecha: 01-24
  himno: Oh Jesús, que en tu cruz has demostrado
LA CONVERSIÓN DE SAN PABLO:
  grado: Fiesta
  fecha: 01-25
  ant: 'El Señor dijo a Saulo: «Yo soy Jesús Nazareno, a quien tú persigues.»'
  lectura:
    ref: 1Tm 1, 16
    texto: Dios me concedió su misericordia, para que Cristo Jesús manifestase primeramente en mi toda su benignidad y sirviese de ejemplo a quienes habían de creer en él para conseguir la vida eterna.
  versiculo:
  - - V
    - Daré gloria a tu nombre por siempre, Señor.
  - - R
    - Por tu grande piedad para conmigo.
  oracion: Señor Dios, que has iluminado al mundo entero con la palabra del apóstol san Pablo, haz que quienes recordamos hoy su conversión, imitando sus ejemplos, anunciemos el Evangelio al mundo y seamos así testigos de tu verdad. Por Cristo nuestro Señor.
SANTOS TIMOTEO Y TITO, obispos:
  grado: Memoria
  fecha: 01-26
  himno: Oh Jesús, que en tu cruz has demostrado
LA PRESENTACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 02-02
  himno: Oh Jesús, que en tu cruz has demostrado
  lectura:
    ref: Is 12, 5-6
    texto: 'Tañed para el Señor, que hizo proezas; anunciadlas a toda la tierra; gritad jubilosos, habitantes de Sión: «¡Qué grande es en medio de ti el Santo de Israel!»'
  versiculo:
  - - V
    - La misericordia y la fidelidad se encuentran.
  - - R
    - La justicia y la paz se besan.
  oracion: Dios todopoderoso y eterno, en este día en que tu Hijo único fue presentado en el templo con un cuerpo como el nuestro, te pedimos nos concedas a nosotros poder ser presentados ante ti, plenamente renovados en nuestro espíritu. Por Cristo nuestro Señor.
SANTA ÁGUEDA, virgen y mártir:
  grado: Memoria
  fecha: 02-04
  himno: Oh Jesús, que en tu cruz has demostrado
SAN FELIPE DE JESÚS, protomártir mexicano:
  grado: Fiesta
  fecha: 02-05
  himno: Fundamento de todo lo que existe
  ant: Al ir, iban llorando, llevando la semilla.
  lectura:
    ref: Sb 3, 1-2a. 3b
    texto: Las almas de los justos están en las manos de Dios y no los alcanzará tormento alguno. Creyeron los insensatos que habían muerto; pero ellos están en la paz.
  versiculo:
  - - V
    - Al volver, vuelven cantando.
  - - R
    - Trayendo sus gavillas.
  oracion: Dios nuestro, que te dignaste aceptar la sangre de san Felipe de Jesús como una primicia de la fe de nuestro pueblo, concédenos, por su intercesión, madurar en esa misma fe, para que demos testimonio de ella no sólo con las palabras, sino sobre todo con los actos de nuestra vida diaria. Por Cristo nuestro Señor.
SANTA ESCOLÁSTICA, virgen:
  grado: Memoria
  fecha: 02-10
  himno: Oh Jesús, que en tu cruz has demostrado
SANTOS CIRILO, monje y METODIO, obispo:
  grado: Memoria
  fecha: 02-14
  himno: Oh Jesús, que en tu cruz has demostrado
LA CÁTEDRA DE SAN PEDRO, APÓSTOL:
  grado: Fiesta
  fecha: 02-22
  himno: Oh Jesús, que en tu cruz has demostrado
  lectura:
    ref: 2Pe 1, 16
    texto: No os hemos dado a conocer el poder y la venida de nuestro Señor Jesucristo por haber dado crédito a sutiles quimeras, sino porque fuimos testigos oculares de su grandeza y majestad.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: No permitas, Señor, que ninguna desorientación llegue a perturbar nunca la fe de la Iglesia, que tú quisiste estuviera cimentada sobre la roca sólida de la confesión del apóstol san Pedro. Por Cristo nuestro Señor.
SAN JOSÉ, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 03-19
  himno: Ojos de aquel publicano
  ant: Al no dar con Jesús, sus padres se volvieron a Jerusalén, sin dejar de buscarlo.
  lectura:
    ref: Sir 2, 18-19
    texto: Los que temen al Señor no desobedecen sus palabras; los que lo aman siguen sus caminos. Los que temen ofenderlo buscan lo que es de su agrado; los que lo aman cumplen su ley.
  versiculo:
  - - V
    - Tu victoria ha engrandecido su fama.
  - - R
    - Lo has vestido de honor y majestad.
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por Cristo nuestro Señor.
SAN JOSE, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 03-19
  himno: Ojos de aquel publicano
  ant: Al no dar con Jesús, sus padres se volvieron a Jerusalén, sin dejar de buscarlo.
  lectura:
    ref: Sir 2, 18-19
    texto: Los que temen al Señor no desobedecen sus palabras; los que lo aman siguen sus caminos. Los que temen ofenderlo buscan lo que es de su agrado; los que lo aman cumplen su ley.
  versiculo:
  - - V
    - Tu victoria ha engrandecido su fama.
  - - R
    - Lo has vestido de honor y majestad.
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por Cristo nuestro Señor.
LA ANUNCIACIÓN DEL SEÑOR:
  grado: Solemnidad
  fecha: 03-25
  himno: Ojos de aquel publicano
  ant: Se mostrará grande hasta los confines de la tierra, y él será nuestra paz.
  lectura:
    ref: 1Tm 2, 5-6a
    texto: Hay un solo Dios, y único es el mediador entre Dios y los hombres, Cristo Jesús, hombre también él, el cual se entregó a si mismo como precio de rescate por todos.
  versiculo:
  - - V
    - La Palabra se hizo carne.
  - - R
    - Y puso su morada entre nosotros.
  oracion: Señor Dios nuestro, que quisiste que tu Verbo se hiciera hombre en el seno de la Virgen María, concede a quienes proclamamos que nuestro Redentor es realmente Dios y hombre que lleguemos a ser partícipes de su naturaleza divina. Por Cristo nuestro Señor.
SAN JUAN BAUTISTA DE LA SALLE, presbítero:
  grado: Memoria
  fecha: 04-07
  himno: Reina el Señor allí donde ninguno
SAN ESTANISLAO, Obispo y mártir:
  grado: Memoria
  fecha: 04-11
  himno: Reina el Señor allí donde ninguno
SAN MARCOS, Evangelista:
  grado: Fiesta
  fecha: 04-25
  himno: Reina el Señor allí donde ninguno
  lectura:
    ref: 2Tm 1, 8b-9
    texto: Comparte valientemente conmigo los sufrimientos por la causa del Evangelio, apoyado en el poder de Dios, que nos ha salvado y nos ha llamado con santa llamada, no según nuestras obras, sino según su propio propósito y su gracia, que nos dio con Cristo Jesús.
  versiculo:
  - - V
    - Estad alegres, dice el Señor. Aleluia.
  - - R
    - Porque vuestros nombres están inscritos en el cielo. Aleluia.
  oracion: Señor, tú que diste a san Marcos el carisma de anunciar el Evangelio, haz que sepamos aprovecharnos de sus escritos y por ellos aprendamos a seguir fielmente a Jesucristo. Él, que vive y reina por los siglos de los siglos.
SAN TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  lectura:
    ref: 2Tm 2, 8. 11
    texto: 'Acuérdate de Cristo Jesús, del linaje de David, que vive resucitado de entre los muertos, como enseño en mi mensaje de salud. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él.'
  oracion: Señor, tú has querido fortalecer a tu Iglesia en América mediante los trabajos apostólicos y el celo por la verdad de tu obispo santo Toribio, concede al pueblo a ti consagrado crecer constantemente en fe y dar auténticos frutos de santidad. Por Cristo nuestro Señor.
SANTO TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  himno: Reina el Señor allí donde ninguno
  lectura:
    ref: 1Tm 3, 13
    texto: Los que ejercen bien el diaconado alcanzan un puesto honroso y grande entereza en la fe de Cristo Jesús.
  versiculo:
  - - V
    - Si el Señor no construye la casa. Aleluia.
  - - R
    - En vano se cansan los albañiles. Aleluia.
  oracion: Señor, tú que quisiste dilatar la Iglesia por medio de la actividad apostólica de santo Toribio de Mogrovejo y por su gran amor a la verdad, suscita también hoy en el pueblo cristiano aquellas mismas virtudes que resplandecen en este santo obispo, para que así la Iglesia crezca constantemente en la fe y se renueve por la santidad. Por Cristo nuestro Señor.
SANTOS FELIPE Y SANTIAGO, apóstoles:
  grado: Fiesta
  fecha: 05-04
  himno: Reina el Señor allí donde ninguno
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquél ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor. Aleluia.
  - - R
    - Porque vuestros nombres están inscritos en el cielo. Aleluia.
  oracion: Señor, tú que nos alegras todos los años con esta fiesta de los santos apóstoles Felipe y Santiago, concédenos, por su intercesión, que, viviendo ahora íntimamente unidos a la muerte y resurrección de tu Hijo, podamos, en la eternidad, contemplar la gloria de tu rostro. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE LUJÁN, Patrona de la República Argentina:
  grado: Solemnidad
  fecha: 05-08
  himno: Salvador del mundo
  ant: Pondré entre ellos mi morada, y enjugaré toda lágrima de sus ojos. Aleluia.
  lectura:
    ref: Cf. Sir 24, 16
    texto: Eché raíces entre un pueblo glorioso, en la porción del Señor, en su heredad, y vivo en medio de la asamblea de los santos.
  versiculo:
  - - V
    - Bendita tú entre las mujeres. Aleluia.
  - - R
    - Y bendito el fruto de tu vientre. Aleluia.
  oracion: Señor, mira con bondad la fidelidad de tu Pueblo y concédenos que, por los méritos e intercesión de la santísima Virgen María, obtengamos los dones de tu gracia en la vida presente y la salvación eterna en el cielo. Por Cristo nuestro Señor.
SAN MATÍAS, apóstol:
  grado: Fiesta
  fecha: 05-14
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquél ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor. Aleluia.
  - - R
    - Porque vuestros nombres están inscritos en el cielo. Aleluia.
  oracion: Señor Dios, tú que, para completar el número de los doce apóstoles, elegiste a san Matías, concédenos, por la intercesión de este apóstol, a nosotros, que hemos recibido el don de tu amistad, poder ser contados un día entre tus elegidos. Por Cristo nuestro Señor.
LA SANTÍSIMA TRINIDAD:
  grado: Solemnidad
  fecha: 05-22
  ant: Confesamos que tú eres siempre el mismo, que vives por siempre y que eres la inteligencia infinita.
  lectura:
    ref: Ap 7, 12
    texto: La bendición y la gloria, la sabiduría, y la acción de gracias, y el honor, y el poder, y la fuerza son de nuestro Dios por los siglos de los siglos. Amén.
  versiculo:
  - - V
    - Bendito eres, Señor, en la bóveda del cielo.
  - - R
    - Alabado y glorioso por los siglos.
  oracion: Dios Padre, que has enviado al mundo la Palabra de verdad y el Espíritu de santificación para revelar a los hombres tu misterio admirable, concédenos que, al profesar la fe verdadera, reconozcamos la gloria de la eterna Trinidad y adoremos la Unidad de tu majestad omnipotente. Por Cristo nuestro Señor.
SANTA MARÍA DE JESÚS PAREDES, virgen:
  grado: Memoria
  fecha: 05-26
  himno: Oh Jesús, que en tu cruz has demostrado
LA VISITACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 05-31
  lectura:
    ref: Sb 7, 27-28
    texto: La sabiduría, sin salir de si misma, todo lo renueva; en todas las edades entra en las almas santas y forma en ellas amigos de Dios y profetas, porque Dios no ama sino a quien vive con la sabiduría.
  versiculo:
  - - V
    - Bendita tú entre las mujeres.
  - - R
    - Y bendito el fruto de tu vientre.
  oracion: Dios todopoderoso y eterno, tú que, cuando María llevaba en su seno a tu Hijo, le inspiraste que visitara a su prima santa Isabel, haz que nosotros seamos siempre dóciles a las inspiraciones de tu Espíritu, para que, con María, podamos proclamar eternamente tu grandeza. Por Cristo nuestro Señor.
EL SANTÍSIMO CUERPO Y SANGRE DE CRISTO:
  grado: Solemnidad
  fecha: 06-07
  ant: Reconocieron a Jesús, el Señor, al partir el pan. Aleluia.
  lectura:
    ref: Hch 2, 42. 47
    texto: Los hermanos eran constantes en escuchar la enseñanza de los apóstoles, en la vida común, en la fracción del pan y en las oraciones. Alababan a Dios y gozaban de la simpatía general del pueblo.
  versiculo:
  - - V
    - Quédate con nosotros, Señor. Aleluia.
  - - R
    - Porque atardece y el día va ya declinando. Aleluia.
  oracion: Señor nuestro Jesucristo, que en este sacramento admirable nos dejaste el memorial de tu pasión, concédenos venerar de tal modo los sagrados misterios de tu cuerpo y de tu sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas por los siglos de los siglos.
SAN BERNABÉ, apóstol:
  grado: Memoria
  fecha: 06-11
  lectura:
    ref: 2Tm 1, 8b-9
    texto: Comparte valientemente conmigo los sufrimientos por la causa del Evangelio, apoyado en el poder de Dios, que nos ha salvado y nos ha llamado con santa llamada, no según nuestras obras, sino según su propio propósito y su gracia, que nos dio con Cristo Jesús.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios nuestro, que, después de haber infundido en abundancia la fe y el Espíritu Santo en San Bernabé, lo destinaste para que anunciara a los pueblos paganos el mensaje de salvación, haz que el Evangelio de Cristo, que él predicó valerosamente, sea proclamado con fidelidad por nuestras palabras y nuestras obras. Por Cristo nuestro Señor.
EL SAGRADO CORAZÓN DE JESÚS:
  grado: Solemnidad
  fecha: 06-12
  himno: Oh Jesús, que en tu cruz has demostrado
  ant: Uno de los soldados le atravesó con su lanza el costado y al instante salió sangre y agua.
  lectura:
    ref: Rm 5, 8-9
    texto: Dios nos demuestra el amor que nos tiene en el hecho de que, siendo todavía pecadores, murió Cristo por nosotros. Así que con mayor razón, ahora que hemos sido justificados por su sangre, seremos salvados por él de la cólera divina.
  versiculo:
  - - V
    - Fue traspasado por nuestras rebeliones.
  - - R
    - Sus cicatrices nos curaron.
  oracion: Te pedimos, Dios todopoderoso y eterno, que, al celebrar la grandeza del amor que resplandece en el corazón de tu Hijo, recibamos de esta fuente divina gracias cada vez más abundantes. Por Cristo nuestro Señor.
EL INMACULADO CORAZÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: 06-13
  himno: Oh Jesús, que en tu cruz has demostrado
EL NACIMIENTO DE SAN JUAN BAUTISTA:
  grado: Solemnidad
  fecha: 06-24
  himno: Oh Jesús, que en tu cruz has demostrado
  ant: Este niño será grande a los ojos del Señor, pues una providencia especial se manifiesta sobre él.
  lectura:
    ref: Is 49, 7b
    texto: Te verán los reyes y se pondrán de pie, te verán los príncipes y se postrarán; porque el Señor es fiel, porque el Santo de Israel te ha elegido.
  versiculo:
  - - V
    - 'Mira: yo pongo las palabras en tu boca.'
  - - R
    - Hoy te establezco sobre pueblos y reyes.
  oracion: Dios todopoderoso, que suscitaste a san Juan Bautista, para que le preparara a Cristo un pueblo bien dispuesto, concede a tu pueblo el don de la alegría espiritual y guíanos por el camino de la salvación y de la paz. Por Cristo nuestro Señor.
SANTOS PEDRO Y PABLO, APÓSTOLES:
  grado: Solemnidad
  fecha: 06-29
  himno: Fundamento de todo lo que existe
  ant: Pedro y Juan subieron al templo a la hora de la oración de la tarde, a eso de las tres.
  lectura:
    ref: 2Co 4, 13-14
    texto: 'Como somos impulsados por el mismo poder de la fe —del que dice la Escritura: «Creí, por eso hablé»—, también nosotros creemos, y por eso hablamos. Y sabemos que aquel que resucitó a Jesús nos resucitará también a nosotros con Jesús, y nos hará aparecer en su presencia juntamente con vosotros.'
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios nuestro, que nos llenas de santa alegría con la solemnidad de los santos apóstoles Pedro y Pablo, haz que tu Iglesia se mantenga siempre fiel a las enseñanzas de estos apóstoles, de quienes recibió el primer anuncio de la fe. Por Cristo nuestro Señor.
SANTO TOMÁS, apóstol:
  grado: Fiesta
  fecha: 07-03
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Concédenos, Señor, celebrar con alegría la fiesta de santo Tomás; que la intercesión de este apóstol, que reconoció y confesó a Cristo como a su Señor y su Dios, nos haga crecer en la fe, para que así, creyendo en Jesús, el Mesías, tengamos vida en su nombre. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE ITATÍ:
  grado: Memoria
  fecha: 07-09
  himno: Oh Jesús, que en tu cruz has demostrado
NUESTRA SEÑORA DEL ROSARIO DE CHIQUINQUIRÁ, patrona de Colombia:
  grado: Fiesta
  fecha: 07-09
  ant: 'Dijo el Señor a su madre: «Mujer, ahí tienes a tu hijo.» Luego dijo al discípulo: «Ahí tienes a tu madre.»'
  lectura:
    ref: Jdt 13, 18-19
    texto: Que el Altísimo te bendiga, hija, más que a todas las mujeres de la tierra. Bendito el Señor, creador del cielo y tierra, que enderezó tu golpe contra la cabeza del general enemigo. los que recuerdan esta hazaña de Dios jamás perderán la confianza que tú inspiras.
  versiculo:
  - - V
    - Bendita tú entre las mujeres.
  - - R
    - Y bendito el fruto de tu vientre.
  oracion: Padre nuestro, en tu amorosa solicitud has querido favorecer a nuestra Patria dándonos en Chiquinquirá un signo de tu presencia; por la intercesión poderosa de la Virgen María, cuyo patrocinio hoy celebramos, concédenos crecer en la fe y lograr la prosperidad por caminos de paz y de justicia. Por Cristo nuestro Señor.
NUESTRA SEÑORA DEL CARMEN:
  grado: Memoria
  fecha: 07-16
  himno: Oh Jesús, que en tu cruz has demostrado
SANTA MARÍA MAGDALENA:
  grado: Memoria
  fecha: 07-22
  himno: Oh Jesús, que en tu cruz has demostrado
SAN FRANCISCO SOLANO, presbítero:
  grado: Memoria
  fecha: 07-24
  himno: Oh Jesús, que en tu cruz has demostrado
SANTIAGO, apóstol:
  grado: Fiesta
  fecha: 07-25
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios todopoderoso y eterno, que quisiste que Santiago fuera el primero de entre los apóstoles en derramar su sangre por la predicación del Evangelio, fortalece a tu Iglesia con el testimonio de su martirio y confórtala con su valiosa protección. Por Cristo nuestro Señor.
SANTOS JOAQUÍN Y ANA, padres de la Santísima Virgen María:
  grado: Memoria
  fecha: 07-26
  himno: Oh Jesús, que en tu cruz has demostrado
LA TRANSFIGURACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 08-06
  himno: Danos, Señor, la firme voluntad
  ant: Al oír la voz del Padre, los discípulos cayeron sobre sus rostros, sobrecogidos de temor.
  lectura:
    ref: 2Co 3, 18
    texto: Todos nosotros, reflejando como en un espejo en nuestro rostro descubierto la gloria del Señor, nos vamos transformando en su propia imagen, hacia una gloria cada vez mayor, por la acción del Señor, que es espíritu.
  versiculo:
  - - V
    - En ti, Señor, está la fuente viva.
  - - R
    - Y tu luz nos hace ver la luz.
  oracion: Señor Dios, que en la gloriosa transfiguración de Jesucristo confirmaste los misterios de la fe con el testimonio de Moisés y de Elías, y nos hiciste entrever en la gloria de tu Hijo la grandeza de nuestra definitiva adopción filial, haz que escuchemos siempre la voz de tu Hijo amado y lleguemos a ser un día sus coherederos en la gloria. Por Cristo nuestro Señor.
SAN LORENZO, diácono y mártir:
  grado: Fiesta
  fecha: 08-10
  himno: Danos, Señor, la firme voluntad
  lectura:
    ref: Sb 3, 1-2a. 3b
    texto: Las almas de los justos están en las manos de Dios y no los alcanzará tormento alguno. Creyeron los insensatos que habían muerto; pero ellos están en la paz.
  versiculo:
  - - V
    - Al volver, vuelven cantando.
  - - R
    - Trayendo sus gavillas.
  oracion: Dios nuestro, que inflamaste con el fuego de tu amor a san Lorenzo, para que brillara por la fidelidad a su servicio diaconal y por la gloria de un heroico martirio, haz que nosotros te amemos siempre como él te amó y practiquemos lo que él enseñó. Por Cristo nuestro Señor.
SAN MAXIMILIANO MARÍA KOLBE, presbítero y mártir:
  grado: Memoria
  fecha: 08-14
  himno: Danos, Señor, la firme voluntad
LA ASUNCIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 08-15
  ant: La santa Madre de Dios ha sido glorificada en el reino celestial sobre los coros de los ángeles.
  lectura:
    ref: 2Co 5, 1
    texto: Aunque se desmorone la morada terrestre en que acampamos, sabemos que Dios nos dará una casa eterna en el cielo, no construida por hombres.
  versiculo:
  - - V
    - La Virgen María ha sido elevada al tálamo celestial.
  - - R
    - Donde el Rey de reyes tiene un trono adornado con estrellas.
  oracion: Dios todopoderoso y eterno, que has elevado en cuerpo y alma a los cielos a la inmaculada Virgen María, madre de tu Hijo, haz que nosotros, ya desde este mundo, tengamos todo nuestro ser totalmente orientado hacia el cielo, para que podamos llegar a participar de su misma gloria. Por Cristo nuestro Señor.
SAN BERNARDO, abad y doctor de la Iglesia:
  grado: Memoria
  fecha: 08-20
  himno: Danos, Señor, la firme voluntad
LA SANTÍSIMA VIRGEN MARÍA, REINA:
  grado: Memoria
  fecha: 08-22
  himno: Danos, Señor, la firme voluntad
SANTA ROSA DE LIMA, virgen, Patrona de América Latina:
  grado: Fiesta
  fecha: 08-23
  himno: Danos, Señor, la firme voluntad
  ant: Qué hermosa y resplandeciente es la generación casta.
  lectura:
    ref: Ap 19, 6. 7
    texto: Reina el Señor, nuestro Dios, dueño de todo; alegrémonos y gocemos y démosle gracias, porque llegó la boda del Cordero, y su esposa se ha embellecido.
  versiculo:
  - - V
    - Encontré al amor de mi alma.
  - - R
    - Lo abracé y ya no lo soltaré.
  oracion: Dios nuestro, que impulsaste a santa Rosa de Lima a apartarse de la vida del mundo por amor tuyo y a consagrarse solo a ti, en la austeridad y en la penitencia, concédenos, por su intercesión, que sepamos seguir, en este mundo, el camino que conduce a la verdadera vida, para que lleguemos a gozar del torrente de tus delicias allá en el cielo. Por Cristo nuestro Señor.
SAN BARTOLOMÉ, apóstol:
  grado: Fiesta
  fecha: 08-24
  himno: Danos, Señor, la firme voluntad
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Fortalece, Señor, nuestra fe, para que nos adhiramos a Cristo, tu Hijo, con la misma sinceridad con que lo hizo el apóstol san Bartolomé, y haz que, por la intercesión de este santo, sea siempre tu Iglesia sacramento de salvación universal para todos los hombres. Por Cristo nuestro Señor.
SAN AGUSTÍN, obispo y doctor de la iglesia:
  grado: Memoria
  fecha: 08-28
  himno: Danos, Señor, la firme voluntad
LA NATIVIDAD DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 09-08
  himno: Danos, Señor, la firme voluntad
  ant: Cantemos con todo el corazón y con toda nuestra mente las glorias de Cristo, en esta sagrada festividad de María, la excelsa Madre de Dios.
  lectura:
    ref: Ap 21, 3
    texto: Esta es la morada de Dios con los hombres, y acampará entre ellos. Ellos serán su pueblo y Dios estará con ellos.
  versiculo:
  - - V
    - Bendita tú entre las mujeres.
  - - R
    - Y bendito el fruto de tu vientre.
  oracion: Concede a tus siervos, Señor, el don de tu gracia, para que, a quienes recibimos las primicias de la salvación por la maternidad de la Virgen María, la fiesta anual de su nacimiento nos traiga aumento de paz. Por Cristo nuestro Señor.
EXALTACIÓN DE LA SANTA CRUZ:
  grado: Fiesta
  fecha: 09-14
  himno: Danos, Señor, la firme voluntad
  ant: Por tu cruz, sálvanos, oh Cristo redentor, tú que muriendo destruiste nuestra muerte y resucitando restauraste la vida.
  lectura:
    ref: 1Pe 1, 18-19
    texto: 'Os rescataron de la vana conducta que habíais heredado de vuestros mayores: no con bienes efímeros, con oro o plata, sino al precio de la sangre de Cristo, el cordero sin defecto ni mancha.'
  versiculo:
  - - V
    - Cuando venga el Señor para juzgar al mundo.
  - - R
    - Aparecerá el signo de la cruz en el cielo.
  oracion: Señor, Dios nuestro, que has querido salvar a los hombres por medio de tu Hijo muerto en la cruz, te pedimos, ya que nos has dado a conocer en la tierra la fuerza misteriosa de la cruz de Cristo, que podamos alcanzar en el cielo los frutos de la redención. Por Cristo nuestro Señor.
SANTOS CORNELIO, Papa, y CIPRIANO, obispo, mártires:
  grado: Memoria
  fecha: 09-16
  himno: Danos, Señor, la firme voluntad
SANTOS ANDRÉS KIM TAEGON, presbítero, PABLO CHONG HASANG y compañeros mártires:
  grado: Memoria
  fecha: 09-20
  himno: Danos, Señor, la firme voluntad
SAN MATEO, apóstol y evangelista:
  grado: Fiesta
  fecha: 09-21
  himno: Fundamento de todo lo que existe
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios nuestro, que, en tu inefable misericordia, elegiste a san Mateo, para transformarlo de recaudador de impuestos en un apóstol, haz que también nosotros, imitando su ejemplo y apoyados por su intercesión, te sigamos con fidelidad, cualesquiera que sean las circunstancias de nuestra vida. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE LA MERCED:
  grado: Memoria
  fecha: 09-24
  himno: Danos, Señor, la firme voluntad
SANTOS ARCÁNGELES MIGUEL GABRIEL Y RAFAEL:
  grado: Fiesta
  fecha: 09-29
  ant: El ángel Rafael fue enviado a Tobías y a Sara para curarlos.
  lectura:
    ref: Tb 12, 15. 18. 20
    texto: Yo soy Rafael, uno de los siete ángeles que están al servicio de Dios. Mi presencia entre vosotros no se ha debido a mí, sino a la voluntad de Dios. A él debéis bendecir y cantar todos los días. Yo subo ahora al que me envió. Vosotros bendecid a Dios y narrad todas sus maravillas.
  versiculo:
  - - V
    - A sus ángeles ha dado órdenes el Señor.
  - - R
    - Para que te guarden en tus caminos.
  oracion: Señor Dios todopoderoso, que, con una providencia admirable, llamas a los ángeles y a los hombres para que cooperen a tu plan de salvación, haz que, durante nuestro peregrinar en la tierra, nos sintamos siempre protegidos por los ángeles, que en el cielo están en tu presencia para servirte y gozan ya contemplando tu rostro. Por Cristo nuestro Señor.
SAN JERÓNIMO, presbítero y doctor de la iglesia:
  grado: Memoria
  fecha: 09-30
  himno: Danos, Señor, la firme voluntad
LOS SANTOS ÁNGELES CUSTODIOS:
  grado: Memoria
  fecha: 10-02
  lectura:
    ref: Hch 10, 3-5
    texto: |-
      Un día, a eso de las tres de la tarde, Cornelio tuvo una visión. Vio claramente que un ángel del Señor entraba a donde estaba él y le decía: «¡Cornelio!» Él lo miró fijamente y respondió atemorizado: «¿Qué quieres, señor?»
      El ángel le dijo: «Tus oraciones y tus obras de caridad han subido hasta Dios como el sacrificio del memorial. Manda ahora unos hombres a Joppe y haz venir a un tal Simón, a quien llaman Pedro.»
  versiculo:
  - - V
    - El humo del incienso subió a la presencia de Dios, de mano del ángel.
  - - R
    - En representación de las oraciones de todos los santos.
  oracion: Dios, Padre misericordioso, que, en tu providencia inefable, te has dignado enviar, para nuestra guarda, a tus santos ángeles, concede a quienes te suplican ser siempre defendidos por su protección y gozar eternamente de su compañía. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO DE ASÍS:
  grado: Memoria
  fecha: 10-04
  himno: Danos, Señor, la firme voluntad
NUESTRA SEÑORA DEL PILAR:
  grado: Fiesta
  fecha: 10-12
  himno: Danos, Señor, la firme voluntad
  lectura:
    ref: Jdt 13, 18-19
    texto: Que el Altísimo te bendiga, hija, más que a todas las mujeres de la tierra. Bendito el Señor, creador del cielo y tierra, que enderezó tu golpe contra la cabeza del general enemigo. los que recuerdan esta hazaña de Dios jamás perderán la confianza que tú inspiras.
  versiculo:
  - - V
    - Bendita tú entre las mujeres.
  - - R
    - Y bendito el fruto de tu vientre.
  oracion: Dios todopoderoso y eterno, que en la gloriosa Madre de tu Hijo has concedido un amparo celestial a cuantos la invocan con la secular advocación del Pilar, concédenos, por su intercesión, fortaleza en la fe, seguridad en la esperanza y constancia en el amor. Por Cristo nuestro Señor.
SAN LUCAS, evangelista:
  grado: Fiesta
  fecha: 10-18
  himno: Danos, Señor, la firme voluntad
  lectura:
    ref: 2Tm 1, 8b-9
    texto: Comparte valientemente conmigo los sufrimientos por la causa del Evangelio, apoyado en el poder de Dios, que nos ha salvado y nos ha llamado con santa llamada, no según nuestras obras, sino según su propio propósito y su gracia, que nos dió con Cristo Jesús.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Señor Dios, que elegiste a san Lucas para que, con su predicación y sus escritos, revelara al mundo tu amor hacia los pobres, concede a quienes nos gloriamos de ser cristianos vivir unidos con un solo corazón y una sola alma y haz que todos los pueblos lleguen a contemplar a tu Salvador. Él, que vive y reina por los siglos de los siglos.
SANTOS SIMÓN Y JUDAS, apóstoles:
  grado: Fiesta
  fecha: 10-28
  himno: Danos, Señor, la firme voluntad
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios nuestro, que quisiste que te conociéramos por la predicación de los apóstoles, concédenos, por la intercesión de los santos Simón y Judas, que tu Iglesia siga creciendo en el mundo, acogiendo continuamente en su seno a nuevos pueblos que vengan a la fe en ti. Por Cristo nuestro Señor.
TODOS LOS SANTOS:
  grado: Solemnidad
  fecha: 11-01
  ant: Los santos, por la fe, subyugaron reinos, ejercieron la justicia, alcanzaron lo prometido.
  lectura:
    ref: Ap 21, 10-11a; 22, 3b-4
    texto: El ángel me transportó en espíritu a un monte altísimo y me enseñó la ciudad santa, Jerusalén, que bajaba del cielo, de junto a Dios, y traía la gloria de Dios. El trono de Dios y del Cordero estará allí, y los siervos de Dios le rendirán culto. Verán su rostro, y tendrán su nombre en la frente.
  versiculo:
  - - V
    - Los justos alabarán tu nombre, Señor.
  - - R
    - Los honrados habitarán en tu presencia.
  oracion: Dios todopoderoso y eterno, que nos concedes celebrar los méritos de todos los santos en una misma solemnidad, te rogamos que, por las súplicas de tan numerosos intercesores, nos concedas en abundancia los dones que te pedimos. Por Cristo nuestro Señor.
SAN CARLOS BORROMEO, obispo:
  grado: Memoria
  fecha: 11-04
  himno: Danos, Señor, la firme voluntad
LA DEDICACIÓN DE LA BASÍLICA DE SAN JUAN DE LETRÁN:
  grado: Fiesta
  fecha: 11-09
  lectura:
    ref: Jr 7, 2b. 4-5a. 7a
    texto: '¡Escucha, Judá, la palabra del Señor, los que entráis por estas puertas para adorar al Señor! No os creáis seguros con palabras engañosas, repitiendo: «Es el templo del Señor, el templo del Señor, el templo del Señor.» Si enmendáis vuestra conducta y vuestras acciones, entonces habitaré con vosotros en este lugar.'
  versiculo:
  - - V
    - Entrad por las puertas del Señor con acción de gracias.
  - - R
    - Por sus atrios con himnos.
  oracion: 'Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo como cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por Cristo nuestro Señor.'
SAN LEÓN MAGNO, papa y doctor de la Iglesia:
  grado: Memoria
  fecha: 11-10
  himno: Danos, Señor, la firme voluntad
SAN JOSAFAT, obispo y mártir:
  grado: Memoria
  fecha: 11-12
  himno: Danos, Señor, la firme voluntad
SANTA MARÍA VIRGEN, MADRE DE LA DIVINA PROVIDENCIA:
  grado: Solemnidad
  fecha: 11-19
  himno: Danos, Señor, la firme voluntad
  ant: 'Dijo el Señor a su madre: «Mujer, ahí tienes a tu hijo.» Luego dijo al discípulo: «Ahí tienes a tu madre.»'
  lectura:
    ref: Jdt 13, 18-19
    texto: Que el Altísimo te bendiga, hija, más que a todas las mujeres de la tierra. Bendito el Señor, creador del cielo y tierra, que enderezó tu golpe contra la cabeza del general enemigo. los que recuerdan esta hazaña de Dios jamás perderán la confianza que tú inspiras.
  versiculo:
  - - V
    - Bendita tú entre las mujeres.
  - - R
    - Y bendito el fruto de tu vientre.
  oracion: Atiende propicio, Señor, a tu pueblo que con júbilo festivo celebra la solemnidad de la Virgen María, Madre de la Divina Providencia, y concédele que, bajo el glorioso patrocinio de tan excelsa madre, con su caridad fraterna promueva una sociedad más humana y a la vez sea edificador y testigo de tu verdad. Por Cristo nuestro Señor.
NUESTRO SEÑOR JESUCRISTO, REY UNIVERSAL:
  grado: Solemnidad
  fecha: 11-22
  himno: Danos, Señor, la firme voluntad
  ant: Se dilatará su principado con una paz sin límites.
  lectura:
    ref: Col 1, 19-20
    texto: 'En él quiso Dios que residiera toda plenitud; y por él quiso reconciliar consigo todas las cosas: haciendo la paz por la sangre de su cruz con todos los seres, así del cielo como de la tierra.'
  versiculo:
  - - V
    - Aclamad al Rey y Señor.
  - - R
    - Porque llega para regir la tierra.
  oracion: Dios todopoderoso y eterno, que quisiste fundar todas las cosas en tu Hijo muy amado, rey del universo, haz que toda creatura, libertada de toda esclavitud, sirva a tu majestad y te alabe eternamente. Por Cristo nuestro Señor.
SANTA CECILIA, virgen y mártir:
  grado: Memoria
  fecha: 11-22
  himno: Danos, Señor, la firme voluntad
SANTOS ANDRÉS DUNG-LAC, presbítero, y compañeros, mártires:
  grado: Memoria
  fecha: 11-24
  himno: Danos, Señor, la firme voluntad
SAN ANDRÉS APÓSTOL:
  grado: Fiesta
  fecha: 11-30
  himno: Danos, Señor, la firme voluntad
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios todopoderoso y eterno, escucha la oración de tu pueblo y concédenos que, así como el apóstol san Andrés fue en la tierra predicador del Evangelio y pastor de tu Iglesia, así ahora en el cielo sea nuestro poderoso abogado ante ti. Por Cristo nuestro Señor.
INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: El Señor me ha llamado en la justicia, me ha tomado de la mano y me ha formado.
  lectura:
    ref: Ef 5, 25b-26a. 27
    texto: Cristo amó a su Iglesia y se entregó a la muerte por ella para santificarla y para hacerla comparecer ante su presencia toda resplandeciente, sin mancha ni defecto ni cosa parecida, sino santa e inmaculada.
  versiculo:
  - - V
    - Tu inmaculada concepción, santa Madre de Dios.
  - - R
    - Ha anunciado la alegría al mundo entero.
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por Cristo nuestro Señor.
LA INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  ant: El Señor me ha llamado en la justicia, me ha tomado de la mano y me ha formado.
  lectura:
    ref: Ef 5, 25b-26a. 27
    texto: Cristo amó a su Iglesia y se entregó a la muerte por ella para santificarla y para hacerla comparecer ante su presencia toda resplandeciente, sin mancha ni defecto ni cosa parecida, sino santa e inmaculada.
  versiculo:
  - - V
    - Tu inmaculada concepción, santa Madre de Dios.
  - - R
    - Ha anunciado la alegría al mundo entero.
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE GUADALUPE:
  grado: Fiesta
  fecha: 12-12
  ant: Pondré en ellos mi morada, y enjugaré toda lágrima de sus ojos.
  lectura:
    ref: Is 9, 2
    texto: 'Acrecentaste su gozo, hiciste inmensa su alegría: se han regocijado al verte como se alegran en la siega, como se gozan los que reparten el botín.'
  versiculo:
  - - V
    - El pueblo que caminaba en tinieblas vio una grande luz.
  - - R
    - Sobre los que vivían en tierra de sombras brilló un intenso resplandor.
  oracion: Señor, Dios nuestro, que has concedido a tu pueblo la protección maternal de la siempre Virgen María, Madre de tu Hijo, concédenos, por su intercesión, permanecer siempre firmes en la fe y servir con sincero amor a nuestros hermanos. Por Cristo nuestro Señor.
SAN ESTEBAN, protomártir:
  grado: Fiesta
  fecha: 12-26
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Sb 3, 1-2a. 3b
    texto: Las almas de los justos están en las manos de Dios y no los alcanzará tormento alguno. Creyeron los insensatos que habían muerto; pero ellos están en la paz.
  versiculo:
  - - V
    - Al volver, vuelven cantando.
  - - R
    - Trayendo sus gavillas.
  oracion: Concédenos, Señor, imitar las virtudes de san Esteban, cuya entrada en la gloria celebramos; y, así como él supo rogar por sus mismos perseguidores, sepamos nosotros amar a nuestros enemigos. Por Cristo nuestro Señor.
SAN JUAN, apóstol y evangelista:
  grado: Fiesta
  fecha: 12-27
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Hch 5, 41-42
    texto: Los apóstoles salieron del Consejo contentos de haber merecido aquel ultraje por el nombre de Jesús. Ningún día dejaban de enseñar, en el templo y por las casas, anunciando el Evangelio de Jesucristo.
  versiculo:
  - - V
    - Estad alegres, dice el Señor.
  - - R
    - Porque vuestros nombres están inscritos en el cielo.
  oracion: Dios nuestro, que nos descubriste los arcanos de tu Verbo por medio del apóstol san Juan, concédenos alcanzar una debida comprensión de todo aquello que él ha hecho llegar a nuestros oídos. Por Cristo nuestro Señor.
LOS SANTOS INOCENTES, mártires:
  grado: Fiesta
  fecha: 12-28
  himno: Oh Dios, tenaz vigor de toda cosa
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Jr 31, 16. 17a
    texto: Aparta tu voz del llanto, tus ojos de las lágrimas, porque habrá compensación para tu pena y esperanza para el porvenir —oráculo del Señor—.
  versiculo:
  - - V
    - Que los santos festejen su gloria.
  - - R
    - Y canten jubilosos en filas.
  oracion: Señor Dios, cuya gloria pregonaron en este día los Inocentes mártires, no con palabras, sino dando su vida por ti, haz que nuestra conducta testifique con hechos la fe que proclamamos con los labios. Por Cristo nuestro Señor.
LA SAGRADA FAMILIA DE JESÚS MARÍA Y JOSÉ:
  grado: Fiesta
  fecha: 12-30
  himno: Fundamento de todo lo que existe
  ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
  lectura:
    ref: Col 3, 17
    texto: Todo lo que de palabra o de obra realicéis, sea todo en nombre de Jesús, ofreciendo la Acción de Gracias a Dios Padre por medio de él.
  versiculo:
  - - V
    - Haré que todos tus hijos sean discípulos del Señor.
  - - R
    - y que una paz abundante reine entre ellos.
  oracion: Dios nuestro, que has querido darnos en la Sagrada Familia ejemplos preclaros de virtudes domésticas, concédenos saber imitar su vida y su amor recíproco, para que un día podamos ir a disfrutar con ella de la alegría eterna de tu morada. Por Cristo nuestro Señor.
