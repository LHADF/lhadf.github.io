# Santoral de Sexta (calendario de sync): por celebración; solo lo que cambia.
SANTA MARÍA, MADRE DE DIOS:
  grado: Solemnidad
  fecha: 01-01
  himno: Este mundo del hombre, en que él se afana
  ant: María conservaba todas estas cosas, meditándolas en su corazón.
  lectura:
    ref: Za 9, 9a
    texto: Alégrate, hija de Sión; canta, hija de Jerusalén. Mira a tu rey que viene a ti, justo y victorioso.
  versiculo:
  - - V
    - Los confines de la tierra han contemplado. Aleluia.
  - - R
    - La salvación de nuestro Dios. Aleluia.
  oracion: Señor Dios, que por la maternidad virginal de María has dado a los hombres los tesoros de la salvación, haz que sintamos la intercesión de la Virgen Madre, de quien hemos recibido al autor de la vida, Jesucristo, Hijo tuyo y Señor nuestro. Él, que vive y reina por los siglos de los siglos.
SANTOS BASILIO MAGNO Y GREGORIO NACIANZO, obispos y doctores de la Iglesia:
  grado: Memoria
  fecha: 01-02
  lectura:
    ref: Ap 21, 23-24
    texto: La ciudad santa de Jerusalén no necesita ni de sol ni de luna que la alumbren, porque la ilumina la gloria de Dios, y su lámpara es el Cordero. Las naciones caminarán a su luz, y los reyes de la tierra irán a llevarle su esplendor.
  oracion: Concede, Señor, una fe inquebrantable a tu pueblo, que confiesa y proclama que tu Hijo único, eterno y glorioso como tú, nació de la Virgen María, tomando un cuerpo humano como el nuestro; haz que, por ese misterio inefable, nos veamos libres de las adversidades de esta vida y merezcamos ir después a disfrutar del gozo que no tiene fin. Por Cristo nuestro Señor.
EL BAUTISMO DEL SEÑOR:
  grado: Fiesta
  fecha: 01-10
  himno: Cuando la luz del día está en su cumbre
  ant: 'Respondió Jesús, y le dijo: «Haz ahora lo que te digo, pues conviene que cumplamos de esta manera la voluntad de Dios.»'
  lectura:
    ref: Is 42, 1
    texto: Mirad a mi siervo, a quien sostengo; mi elegido, en quien tengo mis complacencias. En él he puesto mi espíritu, para que haga brillar la justicia en las naciones.
  versiculo:
  - - V
    - Mirad a mi siervo, a quien sostengo.
  - - R
    - Mi elegido, en quien tengo mis complacencias.
  oracion: Dios todopoderoso y eterno, que proclamaste solemnemente a Cristo como tu Hijo amado, cuando era bautizado en el Jordán y descendía el Espíritu Santo sobre él, concede a tus hijos de adopción, renacidos del agua y del Espíritu Santo, que se conserven siempre dignos de tu complacencia. Por Cristo nuestro Señor.
SAN ANTONIO, ABAD:
  grado: Memoria
  fecha: 01-17
  himno: Te está cantando el martillo
SANTA INÉS, virgen y mártir:
  grado: Memoria
  fecha: 01-21
  himno: Te está cantando el martillo
LA CONVERSIÓN DE SAN PABLO:
  grado: Fiesta
  fecha: 01-25
  himno: Te está cantando el martillo
  ant: Ya se acercaba Pablo a Damasco, cuando, de repente, se vio rodeado de un resplandor que venía del cielo.
  lectura:
    ref: 1Tm 1, 14-15
    texto: '¡En verdad que sobreabundó en mi la gracia de nuestro Señor, juntamente con la fe y la caridad de Cristo Jesús! Sentencia verdadera y digna de universal adhesión es esta: Cristo Jesús vino al mundo para salvar a los pecadores. Y de entre ellos yo soy el primero.'
  versiculo:
  - - V
    - Señor, tú eres mi lámpara.
  - - R
    - Dios mío, tú alumbras mis tinieblas.
  oracion: Señor Dios, que has iluminado al mundo entero con la palabra del apóstol san Pablo, haz que quienes recordamos hoy su conversión, imitando sus ejemplos, anunciemos el Evangelio al mundo y seamos así testigos de tu verdad. Por Cristo nuestro Señor.
SANTO TOMÁS DE AQUINO, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 01-28
  himno: Te está cantando el martillo
SAN JUAN BOSCO, presbítero:
  grado: Memoria
  fecha: 01-31
  himno: Te está cantando el martillo
LA PRESENTACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 02-02
  lectura:
    ref: Is 42, 13
    texto: El Señor sale como un héroe, excita su ardor como un guerrero, lanza el alarido, mostrándose valiente frente al enemigo.
  versiculo:
  - - V
    - Los confines de la tierra han contemplado la salvación de nuestro Dios.
  - - R
    - Aclama al Señor, tierra entera.
  oracion: Dios todopoderoso y eterno, en este día en que tu Hijo único fue presentado en el templo con un cuerpo como el nuestro, te pedimos nos concedas a nosotros poder ser presentados ante ti, plenamente renovados en nuestro espíritu. Por Cristo nuestro Señor.
SANTA ÁGUEDA, virgen y mártir:
  grado: Memoria
  fecha: 02-04
  himno: Te está cantando el martillo
SAN FELIPE DE JESÚS, protomártir mexicano:
  grado: Fiesta
  fecha: 02-05
  himno: Te está cantando el martillo
  ant: El Señor lo coronó con una diadema de justicia, y le dio un nombre santo y glorioso.
  lectura:
    ref: St 1, 12
    texto: Dichoso el hombre que soporta la prueba, porque, una vez aquilatado, recibirá la corona de la vida que el Señor ha prometido a los que lo aman.
  versiculo:
  - - V
    - En Dios confío y no temo.
  - - R
    - ¿Qué podrá hacerme un mortal?
  oracion: Dios nuestro, que te dignaste aceptar la sangre de san Felipe de Jesús como una primicia de la fe de nuestro pueblo, concédenos, por su intercesión, madurar en esa misma fe, para que demos testimonio de ella no sólo con las palabras, sino sobre todo con los actos de nuestra vida diaria. Por Cristo nuestro Señor.
SANTOS CIRILO, monje y METODIO, obispo:
  grado: Memoria
  fecha: 02-14
  himno: Este mundo del hombre, en que él se afana
LA CÁTEDRA DE SAN PEDRO, APÓSTOL:
  grado: Fiesta
  fecha: 02-22
  lectura:
    ref: 1Pe 5, 1-2a
    texto: 'A los presbíteros de esa comunidad, yo, presbítero como ellos, testigo de los sufrimientos de Cristo y partícipe de la gloria que va a descubrirse, os exhorto: Sed pastores del rebaño de Dios a vuestro cargo.'
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y los mandatos que les ordenó.
  oracion: No permitas, Señor, que ninguna desorientación llegue a perturbar nunca la fe de la Iglesia, que tú quisiste estuviera cimentada sobre la roca sólida de la confesión del apóstol san Pedro. Por Cristo nuestro Señor.
SAN POLICARPO, obispo y mártir:
  grado: Memoria
  fecha: 02-23
  himno: Te está cantando el martillo
SAN JOSÉ, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 03-19
  himno: Jesús, contigo iremos al desierto
  ant: Cuando ya volvían a su casa, el niño Jesús se quedó en Jerusalén, sin que sus padres se diesen cuenta de ello.
  lectura:
    ref: Sb 10, 10
    texto: La Sabiduría guió al justo por caminos seguros cuando tuvo que huir y le descubrió el reino de Dios; le dio el conocimiento de las cosas santas; le dio éxito en sus trabajos y multiplicó el fruto de sus fatigas.
  versiculo:
  - - V
    - En su casa habrá riquezas y abundancia.
  - - R
    - Su caridad es constante, sin falta.
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por Cristo nuestro Señor.
SAN JOSE, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 03-19
  himno: Jesús, contigo iremos al desierto
  ant: Cuando ya volvían a su casa, el niño Jesús se quedó en Jerusalén, sin que sus padres se diesen cuenta de ello.
  lectura:
    ref: Sb 10, 10
    texto: La Sabiduría guió al justo por caminos seguros cuando tuvo que huir y le descubrió el reino de Dios; le dio el conocimiento de las cosas santas; le dio éxito en sus trabajos y multiplicó el fruto de sus fatigas.
  versiculo:
  - - V
    - En su casa habrá riquezas y abundancia.
  - - R
    - Su caridad es constante, sin falta.
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por Cristo nuestro Señor.
LA ANUNCIACIÓN DEL SEÑOR:
  grado: Solemnidad
  fecha: 03-25
  himno: Jesús, contigo iremos al desierto
  ant: 'Mirad: la Virgen ha concebido y dará a luz un hijo, y le pondrá por nombre Emmanuel.'
  lectura:
    ref: 1Jn 4, 10
    texto: 'En esto consiste el amor: no en que nosotros hayamos amado a Dios, sino en que él nos amó y nos envió a su Hijo como propiciación por nuestros pecados.'
  versiculo:
  - - V
    - Aquí está la esclava del Señor.
  - - R
    - Hágase en mí según tu palabra.
  oracion: Señor Dios nuestro, que quisiste que tu Verbo se hiciera hombre en el seno de la Virgen María, concede a quienes proclamamos que nuestro Redentor es realmente Dios y hombre que lleguemos a ser partícipes de su naturaleza divina. Por Cristo nuestro Señor.
SAN JUAN BAUTISTA DE LA SALLE, presbítero:
  grado: Memoria
  fecha: 04-07
  himno: Verbo de Dios, el sol de mediodía
SAN ESTANISLAO, Obispo y mártir:
  grado: Memoria
  fecha: 04-11
  himno: Verbo de Dios, el sol de mediodía
SAN MARCOS, Evangelista:
  grado: Fiesta
  fecha: 04-25
  himno: Verbo de Dios, el sol de mediodía
  lectura:
    ref: 1Ts 2, 2b-4
    texto: Confiados en nuestro Dios, tuvimos la valentía de predicaros el Evangelio de Dios entre frecuentes luchas. Nuestra exhortación no procede del error, ni de la impureza ni con engaño, sino que así como hemos sido juzgados aptos por Dios para confiarnos el Evangelio, así lo predicamos, no buscando agradar a los hombres, sino a Dios.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor. Aleluia.
  - - R
    - Las normas y mandatos que les ordenó. Aleluia.
  oracion: Señor, tú que diste a san Marcos el carisma de anunciar el Evangelio, haz que sepamos aprovecharnos de sus escritos y por ellos aprendamos a seguir fielmente a Jesucristo. Él, que vive y reina por los siglos de los siglos.
SAN TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  lectura:
    ref: 1Tm 1, 12
    texto: Doy gracias a Cristo Jesús, nuestro Señor, que me hizo capaz, se fió de mí y me confió este ministerio.
  versiculo:
  - - V
    - No me avergüenzo del Evangelio. Aleluia.
  - - R
    - Que es una fuerza de Dios para la salvación. Aleluia.
  oracion: Señor, tú has querido fortalecer a tu Iglesia en América mediante los trabajos apostólicos y el celo por la verdad de tu obispo santo Toribio, concede al pueblo a ti consagrado crecer constantemente en fe y dar auténticos frutos de santidad. Por Cristo nuestro Señor.
SANTO TORIBIO DE MOGROVEJO, obispo:
  grado: Fiesta
  fecha: 04-27
  himno: Verbo de Dios, el sol de mediodía
  lectura:
    ref: 1Tm 1, 12
    texto: Doy gracias a Cristo Jesús, nuestro Señor, que me hizo capaz, se fió de mí y me confió este ministerio.
  versiculo:
  - - V
    - No me avergüenzo del Evangelio. Aleluia.
  - - R
    - Que es una fuerza de Dios para la salvación. Aleluia.
  oracion: Señor, tú que quisiste dilatar la Iglesia por medio de la actividad apostólica de santo Toribio de Mogrovejo y por su gran amor a la verdad, suscita también hoy en el pueblo cristiano aquellas mismas virtudes que resplandecen en este santo obispo, para que así la Iglesia crezca constantemente en la fe y se renueve por la santidad. Por Cristo nuestro Señor.
SANTOS FELIPE Y SANTIAGO, apóstoles:
  grado: Fiesta
  fecha: 05-04
  himno: Verbo de Dios, el sol de mediodía
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor. Aleluia.
  - - R
    - Las normas y mandatos que les ordenó. Aleluia.
  oracion: Señor, tú que nos alegras todos los años con esta fiesta de los santos apóstoles Felipe y Santiago, concédenos, por su intercesión, que, viviendo ahora íntimamente unidos a la muerte y resurrección de tu Hijo, podamos, en la eternidad, contemplar la gloria de tu rostro. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE LUJÁN, Patrona de la República Argentina:
  grado: Solemnidad
  fecha: 05-08
  himno: Cuando la luz del día está en su cumbre
  ant: 'Dijo la Madre de Jesús: «Haced lo que él os diga». Aleluia.'
  lectura:
    ref: Sir 24, 11. 12. 13
    texto: 'Por todas partes busqué reposo y una heredad para instalarme. Entonces el Hacedor estableció el lugar de mi morada: «Habita en Jacob, sea Israel tu heredad.»'
  versiculo:
  - - V
    - Dichosos los que escuchan la palabra de Dios. Aleluia.
  - - R
    - Y la cumplen. Aleluia.
  oracion: Señor, mira con bondad la fidelidad de tu Pueblo y concédenos que, por los méritos e intercesión de la santísima Virgen María, obtengamos los dones de tu gracia en la vida presente y la salvación eterna en el cielo. Por Cristo nuestro Señor.
SAN MATÍAS, apóstol:
  grado: Fiesta
  fecha: 05-14
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor. Aleluia.
  - - R
    - Las normas y mandatos que les ordenó. Aleluia.
  oracion: Señor Dios, tú que, para completar el número de los doce apóstoles, elegiste a san Matías, concédenos, por la intercesión de este apóstol, a nosotros, que hemos recibido el don de tu amistad, poder ser contados un día entre tus elegidos. Por Cristo nuestro Señor.
LA SANTÍSIMA TRINIDAD:
  grado: Solemnidad
  fecha: 05-22
  himno: Cuando la luz del día está en su cumbre
  ant: Tú eres nuestra esperanza, tú nuestra salvación, tú nuestra gloria, oh Trinidad santísima.
  lectura:
    ref: Ga 4, 4. 5-6
    texto: 'Envió Dios a su Hijo para que recibiéramos el ser hijos por adopción. Y la prueba de que sois hijos es que Dios ha enviado a vuestros corazones el Espíritu de su Hijo que clama: «¡Padre!»'
  versiculo:
  - - V
    - ¡Santísima, bendita y gloriosa Trinidad!.
  - - R
    - Padre, Hijo y Espíritu Santo.
  oracion: Dios Padre, que has enviado al mundo la Palabra de verdad y el Espíritu de santificación para revelar a los hombres tu misterio admirable, concédenos que, al profesar la fe verdadera, reconozcamos la gloria de la eterna Trinidad y adoremos la Unidad de tu majestad omnipotente. Por Cristo nuestro Señor.
SANTA MARÍA DE JESÚS PAREDES, virgen:
  grado: Memoria
  fecha: 05-26
  himno: Este mundo del hombre, en que él se afana
LA VISITACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 05-31
  himno: Te está cantando el martillo
  lectura:
    ref: Tb 12, 6
    texto: Bendecid a Dios y proclamad ante todos los vivientes los beneficios que os ha hecho, pues él os ha mostrado su misericordia.
  versiculo:
  - - V
    - Dichoso el seno de santa María Virgen.
  - - R
    - Que llevó al Hijo del eterno Padre.
  oracion: Dios todopoderoso y eterno, tú que, cuando María llevaba en su seno a tu Hijo, le inspiraste que visitara a su prima santa Isabel, haz que nosotros seamos siempre dóciles a las inspiraciones de tu Espíritu, para que, con María, podamos proclamar eternamente tu grandeza. Por Cristo nuestro Señor.
SAN BONIFACIO, obispo y mártir:
  grado: Memoria
  fecha: 06-05
  himno: Te está cantando el martillo
EL SANTÍSIMO CUERPO Y SANGRE DE CRISTO:
  grado: Solemnidad
  fecha: 06-07
  himno: Cuando la luz del día está en su cumbre
  ant: Mientras estaban cenando, Jesús tomó pan y, habiendo pronunciado la bendición, lo partió y lo dio a sus discípulos. Aleluia.
  lectura:
    ref: Pr 9, 1-2
    texto: La Sabiduría se ha construido su casa, plantando siete columnas; ha preparado el banquete, ha mezclado el vino y puesto la mesa.
  versiculo:
  - - V
    - Les enviaste pan desde el cielo. Aleluia.
  - - R
    - Que puede brindar todas las delicias. Aleluia.
  oracion: Señor nuestro Jesucristo, que en este sacramento admirable nos dejaste el memorial de tu pasión, concédenos venerar de tal modo los sagrados misterios de tu cuerpo y de tu sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas por los siglos de los siglos.
SAN BERNABÉ, apóstol:
  grado: Memoria
  fecha: 06-11
  himno: Te está cantando el martillo
  lectura:
    ref: 1Ts 2, 2b-4
    texto: Confiados en nuestro Dios, tuvimos la valentía de predicaros el Evangelio de Dios entre frecuentes luchas. Nuestra exhortación no procede del error, ni de la impureza ni con engaño, sino que así como hemos sido juzgados aptos por Dios para confiaros el Evangelio, así lo predicamos, no buscando agradar a los hombres, sino a Dios.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Dios nuestro, que, después de haber infundido en abundancia la fe y el Espíritu Santo en San Bernabé, lo destinaste para que anunciara a los pueblos paganos el mensaje de salvación, haz que el Evangelio de Cristo, que él predicó valerosamente, sea proclamado con fidelidad por nuestras palabras y nuestras obras. Por Cristo nuestro Señor.
EL SAGRADO CORAZÓN DE JESÚS:
  grado: Solemnidad
  fecha: 06-12
  himno: Cuando la luz del día está en su cumbre
  ant: Se me rompió mi corazón en mi pecho, se dislocaron todos mis huesos.
  lectura:
    ref: Jr 32, 40
    texto: Haré con ellos alianza eterna y no cesaré de hacerles bien. Pondré en sus corazones mi temor para que no se aparten de mí.
  versiculo:
  - - V
    - Esperé compasión y no la hubo.
  - - R
    - Consoladores y no los encontré.
  oracion: Te pedimos, Dios todopoderoso y eterno, que, al celebrar la grandeza del amor que resplandece en el corazón de tu Hijo, recibamos de esta fuente divina gracias cada vez más abundantes. Por Cristo nuestro Señor.
SAN ANTONIO DE PADUA, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 06-13
  himno: Te está cantando el martillo
SAN LUIS GONZAGA, religioso:
  grado: Memoria
  fecha: 06-21
  himno: Te está cantando el martillo
EL NACIMIENTO DE SAN JUAN BAUTISTA:
  grado: Solemnidad
  fecha: 06-24
  himno: Este mundo del hombre, en que él se afana
  ant: Tan pronto como llegaron a mis oídos las palabras de tu saludo, dio luego el niño en mi seno saltos de alegría. Aleluia.
  lectura:
    ref: Is 49, 5-6
    texto: 'Habla el Señor, que desde el seno materno me hizo su siervo: «Te hago luz de las naciones, para que mi salvación alcance hasta el confín de la tierra.»'
  versiculo:
  - - V
    - El Señor me llamó desde el vientre de mi madre.
  - - R
    - Cuando aún estaba yo en el seno materno pronunció mi nombre.
  oracion: Dios todopoderoso, que suscitaste a san Juan Bautista, para que le preparara a Cristo un pueblo bien dispuesto, concede a tu pueblo el don de la alegría espiritual y guíanos por el camino de la salvación y de la paz. Por Cristo nuestro Señor.
SANTOS PEDRO Y PABLO, APÓSTOLES:
  grado: Solemnidad
  fecha: 06-29
  himno: Cuando la luz del día está en su cumbre
  ant: Subió Pedro a la azotea hacia eso del mediodía a orar.
  lectura:
    ref: Ga 1, 15-16a. 17b-18a
    texto: Cuando aquel que me eligió desde el seno de mi madre me llamó por su gracia y tuvo a bien revelarme a su Hijo para que lo anunciara a los gentiles partí hacia Arabia, de donde luego volví a Damasco. Tres años más tarde, subí a Jerusalén a visitar a Cefas.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Dios nuestro, que nos llenas de santa alegría con la solemnidad de los santos apóstoles Pedro y Pablo, haz que tu Iglesia se mantenga siempre fiel a las enseñanzas de estos apóstoles, de quienes recibió el primer anuncio de la fe. Por Cristo nuestro Señor.
SANTO TOMÁS, apóstol:
  grado: Fiesta
  fecha: 07-03
  himno: Te está cantando el martillo
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Concédenos, Señor, celebrar con alegría la fiesta de santo Tomás; que la intercesión de este apóstol, que reconoció y confesó a Cristo como a su Señor y su Dios, nos haga crecer en la fe, para que así, creyendo en Jesús, el Mesías, tengamos vida en su nombre. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE ITATÍ:
  grado: Memoria
  fecha: 07-09
  himno: Te está cantando el martillo
NUESTRA SEÑORA DEL ROSARIO DE CHIQUINQUIRÁ, patrona de Colombia:
  grado: Fiesta
  fecha: 07-09
  himno: Te está cantando el martillo
  ant: 'Dijo la madre de Jesús: «Haced lo que él diga.»'
  lectura:
    ref: Za 9, 9a
    texto: Alégrate, hija de Sión; canta, hija de Jerusalén. Mira a tu rey que viene a ti, justo y victorioso.
  versiculo:
  - - V
    - Dichoso el seno de santa María Virgen.
  - - R
    - Que llevó al Hijo del eterno Padre.
  oracion: Padre nuestro, en tu amorosa solicitud has querido favorecer a nuestra Patria dándonos en Chiquinquirá un signo de tu presencia; por la intercesión poderosa de la Virgen María, cuyo patrocinio hoy celebramos, concédenos crecer en la fe y lograr la prosperidad por caminos de paz y de justicia. Por Cristo nuestro Señor.
SAN BENITO ABAD, patrono de Europa:
  grado: Memoria
  fecha: 07-11
  himno: Te está cantando el martillo
SAN BUENAVENTURA, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 07-15
  himno: Te está cantando el martillo
SANTIAGO, apóstol:
  grado: Fiesta
  fecha: 07-25
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Dios todopoderoso y eterno, que quisiste que Santiago fuera el primero de entre los apóstoles en derramar su sangre por la predicación del Evangelio, fortalece a tu Iglesia con el testimonio de su martirio y confórtala con su valiosa protección. Por Cristo nuestro Señor.
SAN IGNACIO DE LOYOLA, presbítero:
  grado: Memoria
  fecha: 07-31
  himno: Te está cantando el martillo
SAN ALFONSO MARÍA DE LIGORIO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 08-01
  himno: Te está cantando el martillo
LA TRANSFIGURACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 08-06
  ant: El Señor Dios, nuestro Salvador, ha hecho brillar la vida y la inmortalidad por el Evangelio.
  lectura:
    ref: Ex 33, 9. 11
    texto: En cuanto Moisés entraba en la Tienda de Reunión, la columna de nube bajaba y se quedaba a la entrada de la tienda, mientras él hablaba con el Señor, y el Señor hablaba con Moisés. El Señor hablaba con Moisés cara a cara, como habla un hombre con un amigo.
  versiculo:
  - - V
    - Contemplad al Señor y quedaréis radiantes.
  - - R
    - Vuestro rostro no se avergonzará.
  oracion: Señor Dios, que en la gloriosa transfiguración de Jesucristo confirmaste los misterios de la fe con el testimonio de Moisés y de Elías, y nos hiciste entrever en la gloria de tu Hijo la grandeza de nuestra definitiva adopción filial, haz que escuchemos siempre la voz de tu Hijo amado y lleguemos a ser un día sus coherederos en la gloria. Por Cristo nuestro Señor.
SAN LORENZO, diácono y mártir:
  grado: Fiesta
  fecha: 08-10
  lectura:
    ref: St 1, 12
    texto: Dichoso el hombre que soporta la prueba, porque, una vez aquilatado, recibirá la corona de la vida que el Señor ha prometido a los que lo aman.
  versiculo:
  - - V
    - En Dios confío y no temo.
  - - R
    - ¿Qué podrá hacerme un mortal?
  oracion: Dios nuestro, que inflamaste con el fuego de tu amor a san Lorenzo, para que brillara por la fidelidad a su servicio diaconal y por la gloria de un heroico martirio, haz que nosotros te amemos siempre como él te amó y practiquemos lo que él enseñó. Por Cristo nuestro Señor.
SANTA CLARA, vírgen:
  grado: Memoria
  fecha: 08-11
  himno: El pan de cada día
LA ASUNCIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Solemnidad
  fecha: 08-15
  himno: Cuando la luz del día está en su cumbre
  ant: Te proclamamos justamente, oh María, como reina del cielo, porque de ti ha nacido el Sol de justicia.
  lectura:
    ref: Ap 12, 1
    texto: 'Una gran señal apareció en el cielo: una Mujer, vestida de sol, con la luna bajo sus pies, y una corona de doce estrellas sobre su cabeza.'
  versiculo:
  - - V
    - La santa Madre de Dios ha sido glorificada en el reino celestial.
  - - R
    - Sobre los coros de los ángeles.
  oracion: Dios todopoderoso y eterno, que has elevado en cuerpo y alma a los cielos a la inmaculada Virgen María, madre de tu Hijo, haz que nosotros, ya desde este mundo, tengamos todo nuestro ser totalmente orientado hacia el cielo, para que podamos llegar a participar de su misma gloria. Por Cristo nuestro Señor.
SAN PIO X, papa:
  grado: Memoria
  fecha: 08-21
  himno: El pan de cada día
SANTA ROSA DE LIMA, virgen, Patrona de América Latina:
  grado: Fiesta
  fecha: 08-23
  ant: Sosténme, Señor, con tu promesa y viviré, que no quede frustrada mi esperanza.
  lectura:
    ref: 1Co 7, 25
    texto: Respecto al celibato no tengo órdenes del Señor, sino que doy mi parecer como hombre de fiar que soy, por la misericordia del Señor.
  versiculo:
  - - V
    - Ésta es la virgen sensata.
  - - R
    - Una del número de las prudentes.
  oracion: Dios nuestro, que impulsaste a santa Rosa de Lima a apartarse de la vida del mundo por amor tuyo y a consagrarse solo a ti, en la austeridad y en la penitencia, concédenos, por su intercesión, que sepamos seguir, en este mundo, el camino que conduce a la verdadera vida, para que lleguemos a gozar del torrente de tus delicias allá en el cielo. Por Cristo nuestro Señor.
SAN BARTOLOMÉ, apóstol:
  grado: Fiesta
  fecha: 08-24
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Fortalece, Señor, nuestra fe, para que nos adhiramos a Cristo, tu Hijo, con la misma sinceridad con que lo hizo el apóstol san Bartolomé, y haz que, por la intercesión de este santo, sea siempre tu Iglesia sacramento de salvación universal para todos los hombres. Por Cristo nuestro Señor.
SANTA MÓNICA:
  grado: Memoria
  fecha: 08-27
  himno: El pan de cada día
EL MARTIRIO DE SAN JUAN BAUTISTA:
  grado: Memoria
  fecha: 08-29
  himno: El pan de cada día
LA NATIVIDAD DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 09-08
  ant: Resplandece María, nacida de estirpe real; pidámosle devotamente que nos ayude con sus plegarias.
  lectura:
    ref: Jdt 13, 24. 25
    texto: Bendito sea el Señor, creador del cielo y de la tierra, porque ha glorificado tanto tu nombre en este día, que tu alabanza no se apartará de la boca de los hombres, que recordarán por siempre esta hazaña de Dios.
  versiculo:
  - - V
    - Dichoso el seno de santa María Virgen.
  - - R
    - Que llevó al Hijo del eterno Padre.
  oracion: Concede a tus siervos, Señor, el don de tu gracia, para que, a quienes recibimos las primicias de la salvación por la maternidad de la Virgen María, la fiesta anual de su nacimiento nos traiga aumento de paz. Por Cristo nuestro Señor.
SAN JUAN CRISÓSTOMO, obispo y doctor de la Iglesia:
  grado: Memoria
  fecha: 09-13
  himno: El pan de cada día
EXALTACIÓN DE LA SANTA CRUZ:
  grado: Fiesta
  fecha: 09-14
  ant: Salvador del mundo, sálvanos; tú que con tu cruz y tu sangre nos redimiste, socórrenos, Dios nuestro.
  lectura:
    ref: Ef 1, 7-8
    texto: Por Cristo, por su sangre, hemos recibido la redención, el perdón de los pecados. El tesoro de su gracia, sabiduría y prudencia ha sido un derroche para con nosotros.
  versiculo:
  - - V
    - Que se postre ante ti la tierra entera, que toquen en tu honor.
  - - R
    - Que toquen para tu nombre, Señor.
  oracion: Señor, Dios nuestro, que has querido salvar a los hombres por medio de tu Hijo muerto en la cruz, te pedimos, ya que nos has dado a conocer en la tierra la fuerza misteriosa de la cruz de Cristo, que podamos alcanzar en el cielo los frutos de la redención. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE LOS DOLORES:
  grado: Memoria
  fecha: 09-15
  himno: El pan de cada día
SAN MATEO, apóstol y evangelista:
  grado: Fiesta
  fecha: 09-21
  himno: El pan de cada día
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Dios nuestro, que, en tu inefable misericordia, elegiste a san Mateo, para transformarlo de recaudador de impuestos en un apóstol, haz que también nosotros, imitando su ejemplo y apoyados por su intercesión, te sigamos con fidelidad, cualesquiera que sean las circunstancias de nuestra vida. Por Cristo nuestro Señor.
SANTOS ARCÁNGELES MIGUEL GABRIEL Y RAFAEL:
  grado: Fiesta
  fecha: 09-29
  ant: Gabriel, el personaje que yo había visto en visión al principio, vino volando hacia mí y me habló.
  lectura:
    ref: Dn 9, 22-23
    texto: 'El ángel Gabriel me dijo: «Daniel, he salido ahora para ilustrar tu inteligencia. Desde el comienzo de tu súplica, una palabra se emitió y yo he venido a revelártela, porque tu eres el hombre de las predilecciones. Comprende la palabra, entiende la visión.»'
  versiculo:
  - - V
    - Bendecid al Señor, ángeles suyos.
  - - R
    - Servidores que cumplís sus deseos.
  oracion: Señor Dios todopoderoso, que, con una providencia admirable, llamas a los ángeles y a los hombres para que cooperen a tu plan de salvación, haz que, durante nuestro peregrinar en la tierra, nos sintamos siempre protegidos por los ángeles, que en el cielo están en tu presencia para servirte y gozan ya contemplando tu rostro. Por Cristo nuestro Señor.
LOS SANTOS ÁNGELES CUSTODIOS:
  grado: Memoria
  fecha: 10-02
  himno: El pan de cada día
  lectura:
    ref: Hch 12, 7
    texto: 'Se presentó un ángel del Señor, y el calabozo se llenó de luz. El ángel tocó a Pedro en el costado, lo despertó y le dijo: «Levántate en seguida.» Y, al momento, cayeron las cadenas de sus manos.'
  versiculo:
  - - V
    - El Señor ha enviado a su ángel.
  - - R
    - Me ha librado de las garras de Herodes.
  oracion: Dios, Padre misericordioso, que, en tu providencia inefable, te has dignado enviar, para nuestra guarda, a tus santos ángeles, concede a quienes te suplican ser siempre defendidos por su protección y gozar eternamente de su compañía. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DEL ROSARIO:
  grado: Memoria
  fecha: 10-07
  himno: El pan de cada día
NUESTRA SEÑORA DEL PILAR:
  grado: Fiesta
  fecha: 10-12
  lectura:
    ref: Za 9, 9a
    texto: Alégrate, hija de Sión; canta, hija de Jerusalén. Mira a tu rey que viene a ti, justo y victorioso.
  versiculo:
  - - V
    - Dichoso el seno de santa María Virgen.
  - - R
    - Que llevó al Hijo del eterno Padre.
  oracion: Dios todopoderoso y eterno, que en la gloriosa Madre de tu Hijo has concedido un amparo celestial a cuantos la invocan con la secular advocación del Pilar, concédenos, por su intercesión, fortaleza en la fe, seguridad en la esperanza y constancia en el amor. Por Cristo nuestro Señor.
SANTA TERESA DE JESÚS, virgen y doctora de la Iglesia:
  grado: Memoria
  fecha: 10-15
  himno: El pan de cada día
SAN IGNACIO DE ANTIOQUÍA, obispo y mártir:
  grado: Memoria
  fecha: 10-17
  himno: El pan de cada día
SAN LUCAS, evangelista:
  grado: Fiesta
  fecha: 10-18
  lectura:
    ref: 1Ts 2, 2b-4
    texto: Confiados en nuestro Dios, tuvimos la valentía de predicaros el Evangelio de Dios entre frecuentes luchas. Nuestra exhortación no procede del error, ni de la impureza ni con engaño, sino que así como hemos sido juzgados aptos por Dios para confiarnos el Evangelio, así lo predicamos, no buscando agradar a los hombres, sino a Dios.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Señor Dios, que elegiste a san Lucas para que, con su predicación y sus escritos, revelara al mundo tu amor hacia los pobres, concede a quienes nos gloriamos de ser cristianos vivir unidos con un solo corazón y una sola alma y haz que todos los pueblos lleguen a contemplar a tu Salvador. Él, que vive y reina por los siglos de los siglos.
SANTOS SIMÓN Y JUDAS, apóstoles:
  grado: Fiesta
  fecha: 10-28
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Dios nuestro, que quisiste que te conociéramos por la predicación de los apóstoles, concédenos, por la intercesión de los santos Simón y Judas, que tu Iglesia siga creciendo en el mundo, acogiendo continuamente en su seno a nuevos pueblos que vengan a la fe en ti. Por Cristo nuestro Señor.
TODOS LOS SANTOS:
  grado: Solemnidad
  fecha: 11-01
  himno: Cuando la luz del día está en su cumbre
  ant: El pueblo cuenta la sabiduría de los santos, y la asamblea pregona sus alabanzas.
  lectura:
    ref: 1Pe 1, 15-16
    texto: 'Como es santo el que os llamó, sed también santos en toda vuestra conducta, porque está escrito: «Sed santos, porque yo soy santo.»'
  versiculo:
  - - V
    - Alegraos, justos, con el Señor.
  - - R
    - Celebrad su santo nombre.
  oracion: Dios todopoderoso y eterno, que nos concedes celebrar los méritos de todos los santos en una misma solemnidad, te rogamos que, por las súplicas de tan numerosos intercesores, nos concedas en abundancia los dones que te pedimos. Por Cristo nuestro Señor.
SAN MARTIN DE PORRES, religioso:
  grado: Memoria
  fecha: 11-03
  himno: El pan de cada día
MARÍA, MEDIANERA DE TODAS LAS GRACIAS:
  grado: Memoria
  fecha: 11-07
  himno: El pan de cada día
LA DEDICACIÓN DE LA BASÍLICA DE SAN JUAN DE LETRÁN:
  grado: Fiesta
  fecha: 11-09
  himno: El pan de cada día
  lectura:
    ref: 2Co 6, 16
    texto: 'Nosotros somos templo de Dios vivo, como dijo Dios: «Habitaré en medio de ellos y andaré entre ellos; yo seré su Dios, y ellos serán mi pueblo.»'
  versiculo:
  - - V
    - Desead la paz a Jerusalén.
  - - R
    - Vivan seguros los que te aman.
  oracion: 'Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo como cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por Cristo nuestro Señor.'
SANTOS ROQUE GONZÁLEZ, ALFONSO RODRÍGUEZ Y JUAN DEL CASTILLO, presbíteros y mártires:
  grado: Memoria
  fecha: 11-17
  himno: El pan de cada día
SANTA ISABEL DE HUNGRÍA:
  grado: Memoria
  fecha: 11-17
  himno: El pan de cada día
SANTA MARÍA VIRGEN, MADRE DE LA DIVINA PROVIDENCIA:
  grado: Solemnidad
  fecha: 11-19
  ant: 'Dijo la madre de Jesús: «Haced lo que él diga.»'
  lectura:
    ref: Za 9, 9a
    texto: Alégrate, hija de Sión; canta, hija de Jerusalén. Mira a tu rey que viene a ti, justo y victorioso.
  versiculo:
  - - V
    - Dichoso el seno de santa María Virgen.
  - - R
    - Que llevó al Hijo del eterno Padre.
  oracion: Atiende propicio, Señor, a tu pueblo que con júbilo festivo celebra la solemnidad de la Virgen María, Madre de la Divina Providencia, y concédele que, bajo el glorioso patrocinio de tan excelsa madre, con su caridad fraterna promueva una sociedad más humana y a la vez sea edificador y testigo de tu verdad. Por Cristo nuestro Señor.
LA PRESENTACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: 11-21
  himno: El pan de cada día
NUESTRO SEÑOR JESUCRISTO, REY UNIVERSAL:
  grado: Solemnidad
  fecha: 11-22
  himno: Este mundo del hombre, en que él se afana
  ant: Brotarán aguas de vida de Jerusalén, y el Señor reinará sobre todo el orbe.
  lectura:
    ref: Col 1, 16b-18
    texto: Todo fue creado por él y para él; él es anterior a todo, y todo se mantiene en él. Él es también la cabeza del cuerpo de la Iglesia. Él es el principio, el primogénito de entre los muertos, y así es el primero en todo.
  versiculo:
  - - V
    - Tocad para nuestro rey.
  - - R
    - Porque él es el rey del mundo.
  oracion: Dios todopoderoso y eterno, que quisiste fundar todas las cosas en tu Hijo muy amado, rey del universo, haz que toda creatura, libertada de toda esclavitud, sirva a tu majestad y te alabe eternamente. Por Cristo nuestro Señor.
SANTOS ANDRÉS DUNG-LAC, presbítero, y compañeros, mártires:
  grado: Memoria
  fecha: 11-24
  himno: Este mundo del hombre, en que él se afana
SAN ANDRÉS APÓSTOL:
  grado: Fiesta
  fecha: 11-30
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardaron los preceptos del Señor.
  - - R
    - Las normas y mandatos que les ordenó.
  oracion: Dios todopoderoso y eterno, escucha la oración de tu pueblo y concédenos que, así como el apóstol san Andrés fue en la tierra predicador del Evangelio y pastor de tu Iglesia, así ahora en el cielo sea nuestro poderoso abogado ante ti. Por Cristo nuestro Señor.
INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  himno: Cuando la luz del día está en su cumbre
  ant: El Señor se complace en ti, y tu Dios encuentra contigo la alegría.
  lectura:
    ref: Ef 1, 11-12a
    texto: En Cristo hemos sido agraciados con la herencia, elegidos de antemano según el designio de aquel que todo lo ejecuta conforme a la decisión de su voluntad, para que seamos alabanza de su gloria.
  versiculo:
  - - V
    - Mi corazón y mi carne.
  - - R
    - Se alegran por el Dios vivo.
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por Cristo nuestro Señor.
LA INMACULADA CONCEPCIÓN DE LA SANTÍSIMA VIRGEN MARIA:
  grado: Solemnidad
  fecha: 12-08
  himno: Cuando la luz del día está en su cumbre
  ant: El Señor se complace en ti, y tu Dios encuentra contigo la alegría.
  lectura:
    ref: Ef 1, 11-12a
    texto: En Cristo hemos sido agraciados con la herencia, elegidos de antemano según el designio de aquel que todo lo ejecuta conforme a la decisión de su voluntad, para que seamos alabanza de su gloria.
  versiculo:
  - - V
    - Mi corazón y mi carne.
  - - R
    - Se alegran por el Dios vivo.
  oracion: Dios todopoderoso, que, por la inmaculada concepción de la Virgen María, preparaste una digna morada para tu Hijo y, en previsión de la muerte de Jesucristo, preservaste a su madre de toda mancha de pecado, concédenos también a nosotros, por intercesión de esta madre inmaculada, que lleguemos a ti limpios de toda culpa. Por Cristo nuestro Señor.
NUESTRA SEÑORA DE GUADALUPE:
  grado: Fiesta
  fecha: 12-12
  ant: Ella es más bella que el sol, supera a todas las constelaciones; comparada con la luz, sale ella vencedora.
  lectura:
    ref: Sir 24, 18. 23
    texto: 'He surgido como una palmera de Engadí, como rosal de Jericó, como gallardo olivo en la llanura: mis flores y mis frutos son bellos y abundantes.'
  versiculo:
  - - V
    - Un panal que destila son tus labios.
  - - R
    - Tu nombre es como un bálsamo fragante.
  oracion: Señor, Dios nuestro, que has concedido a tu pueblo la protección maternal de la siempre Virgen María, Madre de tu Hijo, concédenos, por su intercesión, permanecer siempre firmes en la fe y servir con sincero amor a nuestros hermanos. Por Cristo nuestro Señor.
SAN ESTEBAN, protomártir:
  grado: Fiesta
  fecha: 12-26
  himno: Oh Señor, Dios eterno y bondadoso
  ant: María conservaba todas estas cosas, meditándolas en su corazón.
  lectura:
    ref: St 1, 12
    texto: Dichoso el hombre que soporta la prueba, porque, una vez aquilatado, recibirá la corona de la vida que el Señor ha prometido a los que lo aman.
  versiculo:
  - - V
    - En Dios confío y no temo.
  - - R
    - ¿Qué podrá hacerme un mortal?
  oracion: Concédenos, Señor, imitar las virtudes de san Esteban, cuya entrada en la gloria celebramos; y, así como él supo rogar por sus mismos perseguidores, sepamos nosotros amar a nuestros enemigos. Por Cristo nuestro Señor.
SAN JUAN, apóstol y evangelista:
  grado: Fiesta
  fecha: 12-27
  himno: Este mundo del hombre, en que él se afana
  ant: María conservaba todas estas cosas, meditándolas en su corazón.
  lectura:
    ref: Hch 5, 12a. 14
    texto: Los apóstoles hacían muchos signos y prodigios en medio del pueblo, y crecía el número de los creyentes, hombres y mujeres, que se adherían al Señor.
  versiculo:
  - - V
    - Guardé los preceptos del Señor.
  - - R
    - Las normas y mandatos que me ordenó.
  oracion: Dios nuestro, que nos descubriste los arcanos de tu Verbo por medio del apóstol san Juan, concédenos alcanzar una debida comprensión de todo aquello que él ha hecho llegar a nuestros oídos. Por Cristo nuestro Señor.
LOS SANTOS INOCENTES, mártires:
  grado: Fiesta
  fecha: 12-28
  himno: Oh Señor, Dios eterno y bondadoso
  ant: María conservaba todas estas cosas, meditándolas en su corazón.
  lectura:
    ref: Lm 2, 11
    texto: Mis ojos están anegados en llanto, se estremecen mis entrañas, mientras desfallecen los niños y lactantes en las plazas de la ciudad.
  versiculo:
  - - V
    - Los justos viven eternamente.
  - - R
    - Reciben de Dios su recompensa.
  oracion: Señor Dios, cuya gloria pregonaron en este día los Inocentes mártires, no con palabras, sino dando su vida por ti, haz que nuestra conducta testifique con hechos la fe que proclamamos con los labios. Por Cristo nuestro Señor.
LA SAGRADA FAMILIA DE JESÚS MARÍA Y JOSÉ:
  grado: Fiesta
  fecha: 12-30
  himno: Cuando la luz del día está en su cumbre
  ant: María conservaba todas estas cosas, meditándolas en su corazón.
  lectura:
    ref: Col 3, 14-15
    texto: 'Por encima de todo, procurad el amor, que es el ceñidor de la unidad consumada. Que la paz de Cristo actúe de árbitro en vuestro corazón: a ella habéis sido convocados, en un solo cuerpo.'
  versiculo:
  - - V
    - Desde niño fui desdichado y enfermo.
  - - R
    - Me doblo bajo el peso de tus terrores.
  oracion: Dios nuestro, que has querido darnos en la Sagrada Familia ejemplos preclaros de virtudes domésticas, concédenos saber imitar su vida y su amor recíproco, para que un día podamos ir a disfrutar con ella de la alegría eterna de tu morada. Por Cristo nuestro Señor.
