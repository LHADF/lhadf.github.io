# Propio de los santos tomado del libro (Liturgia de las Horas, tools/importar/propio_libro.py), para las celebraciones
# que la base no traía (base/santoral/adf.yaml). Clave: el nombre en el Ordo. «oracion»: la propia; por hora, lo que el
# libro trae de propio (lo demás sale del común). «comun_libro» e «indicacion»: lo que dice el libro. Se corrige acá.
Bienaventurada Virgen María de Fátima:
  nombre_libro: La Bienaventurada Virgen María De Fátima
  comun_libro: virgen-maria
  indicacion: Del Común de santa María Virgen.
  oracion: Oh Dios, que a la Madre de tu Hijo la hiciste también Madre nuestra, concédenos que, perseverando en la penitencia y la plegaria por la salvación del mundo, podamos promover cada día con mayor eficacia el reino de Cristo. Por nuestro Señor Jesucristo. 14 de mayo
  oficio:
    lectura2:
      titulo: MARÍA SOLA ABRAZA AL QUE TODO EL UNIVERSO ABARCA
      texto: |-
        María fue hecha cielo en favor nuestro al llevar la divinidad que Cristo, sin dejar la gloria del Padre, encerró en los angostos límites de un seno para conducir a los hombres a una dignidad mayor. Eligió a ella sola entre toda la asamblea de las vírgenes para que fuese instrumento de nuestra salvación.

        En ella encontraron su culmen los vaticinios de todos los justos y profetas. De ella nació aquella brillantísima estrella bajo cuya guía vio una gran luz el pueblo, que caminaba en tinieblas.

        María puede ser denominada de forma adecuada con diversos títulos. Ella es el templo del Hijo de Dios, que salió de ella de manera muy distinta a como había entrado, porque, aunque había entrado en su seno sin cuerpo, salió revestido de un cuerpo.

        Ella es el nuevo cielo místico, en el que el Rey de reyes habitó como en su morada. De él bajó a la tierra mostrando ostensiblemente una forma y semejanza terrena.

        Ella es la vid que da como fruto un suave olor. Su fruto, como difería absolutamente por la naturaleza del árbol, necesariamente cambiaba su semejanza por causa del árbol.

        Ella es la fuente que brota de la casa del Señor, de la que fluyeron para los sedientos aguas vivas que, si alguien las gusta aunque sea con la punta de los labios, jamás sentirá sed.

        Amadísimos, se equivoca quien piensa que el día de la renovación de María puede ser comparado con otro día de la creación. En el inicio fue creada la tierra; por medio de ella es renovada. En el inicio fue maldita en su actividad por el pecado de Adán, por medio de ella le es devuelta la paz y la seguridad.

        En el inicio, la muerte se extendió a todos los hombres por el pecado de los primeros padres, pero ahora hemos sido trasladados de la muerte a la vida. En el inicio, la serpiente se adueñó de los oídos de Eva, y el veneno se extendió a todo el cuerpo; ahora María acoge en sus oídos al defensor de la perpetua felicidad. Lo que fue instrumento de muerte, ahora se alza como instrumento de vida.

        El que se sienta sobre los Querubines es sostenido ahora por los brazos de una mujer; Aquel al que todo el orbe no puede abarcar, María sola lo abraza; Aquel al que temen los Tronos y las Dominaciones, una joven lo protege; Aquel cuya morada es eterna, se sienta en las rodillas de una virgen; Aquel que tiene la tierra por escabel de sus pies, la pisa con pies de niño.
      autor: |-
        De los sermones de san Efrén, diácono
        (Sermón 3 de diversis: Opera omnia, III syr. et lat., Roma 1743, 607)
    resp2:
      ref: ''
      vr:
      - - R
        - 'Saltó el corazón de la Virgen: ante el anuncio del ángel concibió el misterio divino; entonces acogió en su virginal seno al más bello entre los hijos de los hombres * y la bendita por siempre nos dio a Dios hecho hombre.'
      - - V
        - 'La morada de su seno puro se convirtió inmediatamente en templo de Dios: por el poder de la palabra, la Virgen intacta concibió al Hijo.'
      - - R
        - Y la bendita por siempre nos dio a Dios hecho hombre.
Bienaventurada Virgen María de Lourdes:
  nombre_libro: Nuestra Señora De Lourdes
  comun_libro: virgen-maria
  indicacion: Del Común de santa María Virgen.
  oracion: Dios de misericordia, remedia con el amparo del cielo nuestro desvalimiento, para que, cuantos celebramos la memoria de la inmaculada Virgen María, Madre de Dios, podamos, por su intercesión, vernos libres de nuestros pecados. Por Jesucristo nuestro Señor.
  oficio:
    lectura2:
      titulo: LA SEÑORA ME HABLÓ
      texto: |-
        Cierto día fui a la orilla del río Gave a recoger leña con otras dos niñas. En seguida oí como un ruido. Miré a la pradera; pero los árboles no se movían. Alcé entonces la cabeza hacia la gruta y vi a una mujer vestida de blanco, con un cinturón azul celeste y sobre cada uno de sus pies una rosa amarilla, del mismo color que las cuentas de su rosario.

        Creyendo engañarme, me restregué los ojos. Metí la mano en el bolsillo para buscar mi rosario. Quise hacer la señal de la cruz, pero fui incapaz de llevar la mano a la frente. Cuando la Señora hizo la señal de la cruz, lo intenté yo también y, aunque me temblaba la mano, conseguí hacerla. Comencé a rezar el rosario, mientras la Señora iba desgranando sus cuentas, aunque sin despegar los labios. Al acabar el rosario, la visión se desvaneció.

        Pregunté entonces a las dos niñas si habían visto algo. Ellas lo negaron y me preguntaron si es que tenía que hacerles algún descubrimiento. Les dije que había visto a una mujer vestida de blanco, pero que no sabía de quién se trataba. Les pedí que no lo contaran. Ellas me recomendaron que no volviese más por allí, a lo que me opuse. El Domingo volví, pues sentía internamente que me impulsaban...

        Aquella Señora no me habló hasta la tercera vez, y me preguntó si querría ir durante quince días. Le dije que sí, y ella añadió que debía avisar a los sacerdotes para que edificaran allí una capilla. Luego me ordenó que bebiera de la fuente. Como no veía ninguna fuente, me fui hacia el río Gave, pero ella me indicó que no hablaba de ese río, y señaló con el dedo la fuente. Me acerqué, y no había más que un poco de agua entre el barro. Metí la mano, y apenas podía sacar nada, por lo que comencé a escarbar y al final

        pude sacar algo de agua; por tres veces la arrojé y a la cuarta pude beber. Después desapareció la visión y yo me marché.

        Volví a ir allí durante quince días. La Señora se me apareció como de costumbre, menos un Lunes y un Viernes. Siempre me decía que advirtiera a los sacerdotes que debían edificarle una capilla, me mandaba lavarme en la fuente y rogar por la conversión de los pecadores. Le pregunté varias veces quién era, a lo que me respondía con una leve sonrisa. Por fin, levantando los brazos y los ojos al cielo, me dijo: «Yo soy la Inmaculada Concepción.»

        En aquellos días me reveló también tres secretos, prohibiéndome absolutamente que los comunicase a nadie; lo que he cumplido fielmente hasta ahora.
      autor: |-
        De una carta de santa María Bernarda Soubirous, virgen
        (Carta al padre Gondrand, año 1861: cf. A. Ravier, Les ècrits de sainte Bernadette
        Soubirous, París 1961, pp. 53-59)
    resp2:
      ref: Lc 1, 46. 49. 48
      vr:
      - - R
        - 'Proclama mi alma la grandeza del Señor, * porque el Poderoso ha hecho obras grandes por mí: su nombre es santo.'
      - - V
        - Desde ahora me felicitarán todas las generaciones.
      - - R
        - 'Porque el Poderoso ha hecho obras grandes por mí: su nombre es santo.'
  laudes:
    ant_benedictus: De ti, Virgen María, luminosa aurora de nuestra salvación, surgió el Sol de justicia que nació de lo alto para visitarnos.
  visperas:
    ant_magnificat: Alégrate, María, llena de gracia, el Señor está contigo, bendita tú entre las mujeres y bendito el fruto de tu vientre.
Dedicación de la Basílica de Santa María la Mayor:
  nombre_libro: La Dedicación De La Basílica De Santa María
  comun_libro: virgen-maria
  indicacion: Del Común de santa María Virgen.
  oficio:
    lectura2:
      titulo: ALABANZAS DE LA MADRE DE DIOS
      texto: |-
        Tengo ante mis ojos la asamblea de los santos padres que, llenos de gozo y fervor, han acudido aquí, respondiendo con prontitud a la invitación de la santa Madre de Dios, la siempre Virgen María. Este espectáculo ha trocado en gozo la gran tristeza que antes me oprimía. Vemos realizadas en esta reunión aquellas hermosas palabras de David, el salmista: Ved qué dulzura, qué delicia; convivir los hermanos unidos.

        Te saludamos, santa y misteriosa Trinidad, que nos has convocado a todos nosotros en esta iglesia de santa María, Madre de Dios.

        Te saludamos, María, Madre de Dios, tesoro digno de ser venerado por todo el orbe, lámpara inextinguible, corona de la virginidad, trono de la recta doctrina, templo indestructible, lugar propio de aquel que no puede ser contenido en lugar alguno, madre y virgen, por quien es llamado bendito, en los santos evangelios, el que viene en nombre del Señor.

        Te saludamos, a ti, que encerraste en tu seno virginal a aquel que es inmenso e inabarcable; a ti, por quien la santa Trinidad es adorada y glorificada; por quien la cruz preciosa es celebrada y adorada en todo el orbe; por quien exulta el cielo; por quien se alegran los ángeles y arcángeles; por quien son puestos en fuga los demonios; por quien el diablo tentador cayó del cielo; por quien la criatura, caída en el pecado, es elevada al cielo; por quien la creación, sujeta a la insensatez de la idolatría, llega al conocimiento de la verdad; por quien los creyentes obtienen la gracia del bautismo y el aceite de la alegría; por quien han sido fundamentadas las Iglesias en el orbe de la tierra; por quien todos los hombres son llamados a la conversión.

        Y ¿qué más diré? Por ti, el Hijo unigénito de Dios ha iluminado a los que vivían en tinieblas y en sombra de muerte; por ti, los profetas anunciaron las cosas futuras; por ti, los apóstoles predicaron la salvación a los gentiles; por ti, los muertos resucitan; por ti, reinan los reyes, por la santísima Trinidad.

        ¿Quién habrá que sea capaz de cantar como es debido las alabanzas de María? Ella es madre y virgen a la vez; ¡qué cosa tan admirable! Es una maravilla que me llena de estupor. ¿Quién ha oído jamás decir que le esté prohibido al constructor habitar en el mismo templo que él ha construido? ¿Quién podrá tachar de ignominia el hecho de que la sirviente sea adoptada como madre?

        Mirad: hoy todo el mundo se alegra; quiera Dios que todos nosotros reverenciemos y adoremos la unidad, que rindamos un culto impregnado de santo temor a la Trinidad indivisa, al celebrar, con nuestras alabanzas, a María siempre Virgen, el templo santo de Dios, y a su Hijo y esposo inmaculado: porque a él pertenece la gloria por los siglos de los siglos. Amén.
      autor: |-
        De la homilía de san Cirilo de Alejandría, obispo, pronunciada en el Concilio de Éfeso
        (Homilía 4: PG 77, 991. 995-996)
    resp2:
      ref: ''
      vr:
      - - R
        - Felicitadme, todos los que amáis al Señor; porque, siendo pequeña, agradé al Altísimo, * y de mis entrañas engendré al Dios-Hombre.
      - - V
        - Me felicitarán todas las generaciones, porque Dios puso sus ojos en su humilde esclava.
      - - R
        - Y de mis entrañas engendré al Dios-Hombre.
  oracion: Perdona, Señor, los pecados de tus hijos y ya que nuestras obras no pueden complacerte haz que quienes no logramos agradarte con nuestros actos seamos salvados por la intercesión de la Madre de tu Hijo. Él que vive y reina contigo.
  laudes:
    ant_benedictus: María, santa madre de Dios y siempre virgen, bendita tú entre las mujeres y bendito el fruto de tu vientre.
  visperas:
    ant_magnificat: Santa María, madre de Dios, ruega por nosotros pecadores, ahora y en la hora de nuestra muerte.
María, Auxilio de los Cristianos:
  nombre_libro: Santa María, Auxilio De Los Cristianos
  comun_libro: virgen-maria
  indicacion: Del Común de santa María Virgen.
  oficio:
    lectura2:
      titulo: MIRA A MARÍA, ESTRELLA DEL MAR
      texto: |-
        María es llamada estrella del mar. Efectivamente, con sumo acierto se la compara a una estrella, porque así como el astro sin alterar su naturaleza difunde sus rayos, así, sin menoscabar su cuerpo, la Virgen dio a luz al Hijo de Dios. Y como el rayo no quita a la estrella su esplendor, el Hijo no mengua en la Virgen su integridad. Ella es, pues, la noble estrella de la Casa de Jacob: su luz ilumina todo el mundo, su fulgor resplandece en los cielos y penetra en los abismos; colma también la tierra y esclareciendo las almas más que los cuerpos, facilita la conquista de las virtudes y destruye los vicios. Ella, además, es la fulgente y sublime estrella que, necesariamente elevada sobre el vasto y espacioso mar de la vida, resplandece por sus méritos e ilumina con sus ejemplos.

        Tú, quienquiera que seas, si entre las olas del mar de este mundo te sientes arrastrado por violentas borrascas que te impiden alcanzar la orilla y quieres salvarte de la tempestad, no quites tus ojos del resplandor de esta estrella. Si te vieras envuelto por el huracán de las tentaciones y te sintieras golpeado entre los escollos de la tribulación, mira la estrella, invoca a María. Si fueras alcanzado por las ondas de la soberbia, de la ambición, de la calumnia, de la envidia, mira la estrella, invoca a María. Si la ira, la avaricia o la seducción de la carne golpean la navecilla de tu voluntad, mira la estrella, invoca a María. Si, conturbado por la gravedad de los pecados, confundido por la propia indignidad o sobrecogido por el temor del juicio, comenzaras a sumergirte en el abismo de la tristeza o desesperación, piensa en María, invoca a María. En los peligros, en las dificultades, en las dudas, piensa en María, invoca a María. Su nombre esté siempre en tus labios, su amor colme tu corazón y, para asegurarte la eficacia de su plegaria, no olvides los ejemplos de su vida. Siguiéndola no te desviarás del recto sendero; invocándola no podrás desesperar; pensando en Ella no errarás. Si Ella te sostiene, no caerás; si te protege, nada podrás temer; si Ella te guía, no sentirás el cansancio del camino; si Ella te ampara, llegarás a la meta.
      autor: |-
        De las Homilías de San Bernardo Abad.
        (Hom. 11 super Missus est, 17: PL 183, 7013-71A)
    resp2:
      ref: ''
      vr:
      - - R
        - Bendita tú, Madre de Cristo; has engendrado al que es tu Señor. Fulgente estrella del mar, guía y salva a tus fieles. * Tú, ensalzada por los coros de los ángeles.
      - - V
        - Ruega por nosotros, dulce Virgen María.
      - - R
        - Tú, ensalzada por los coros de los ángeles.
  oracion: 'Oh Dios, que hiciste a la Virgen María madre y auxilio de los cristianos: fortalece a tu Iglesia con su intercesión, para que pueda soportar con paciencia y vencer con amor las opresiones interiores y externas, y así manifestar abiertamente a los hombres el misterio de Cristo. Él que vive y reina contigo.'
  laudes:
    ant_benedictus: 'Alégrate, Virgen Madre: contigo el Señor nos ha librado de los enemigos y nos ha revelado su amor. (T. P. Aleluia.)'
  visperas:
    ant_magnificat: A ti acudimos, Santa Madre de Dios; por ti nos ha llegado el auxilio del Señor. (T. P. Aleluia.)
Nuestro Señor Jesucristo, Sumo y Eterno Sacerdote:
  nombre_libro: Jesucristo, Sumo Y Eterno Sacerdote
  comun_libro: null
  invitatorio:
    inv_ant: Glorifiquemos a Cristo, que tiene el sacerdocio que no pasa.
  oracion: Oh Dios, que para gloria tuya y salvación del género humano constituiste a tu Hijo único sumo y eterno Sacerdote; concede a quienes él eligió para ministros y dispensadores de sus misterios la gracia de ser fieles en el cumplimiento del ministerio recibido. Por nuestro Señor Jesucristo.
  oficio:
    himno: A ti, Jesús, te alaban las naciones
    salmodia:
    - ant: Lo he pedido a mi Padre, y me ha dado en herencia las naciones.
      salmo: salmo-2
    - ant: Presentad vuestros cuerpos como hostia viva, santa, agradable a Dios.
      salmo: salmo-39-2-14-17-18-i
    - ant: Cristo amó a su Iglesia; él se entregó a sí mismo por ella, para consagrarla.
      salmo: salmo-84
    versiculo:
    - - V
      - Cristo ofreció por los pecados un solo sacrificio.
    - - R
      - Y ha perfeccionado para siempre a los que van siendo consagrados.
    lectura1:
      titulo: JESUCRISTO, SUMO SACERDOTE
      texto: |-
        Hermanos: Mantengamos la confesión de la fe, ya que tenemos un sumo sacerdote grande, que ha atravesado el cielo, Jesús, Hijo de Dios.

        No tenemos un sumo sacerdote incapaz de compadecerse de nuestras debilidades, sino que ha sido probado en todo exactamente como nosotros, menos en el pecado. Por eso, acerquémonos con seguridad al trono de la gracia, para alcanzar misericordia y encontrar gracia que nos auxilie oportunamente.

        Porque todo sumo sacerdote, escogido entre los hombres, está puesto para representar a los hombres en el culto a Dios: para ofrecer dones y sacrificios por los pecados. Él puede comprender a los ignorantes y extraviados, ya que él mismo está envuelto en debilidades. A causa de ellas, tiene que ofrecer sacrificios por sus propios pecados, como por los del pueblo. Nadie puede arrogarse este honor: Dios es quien llama, como en el caso de Aarón.

        Tampoco Cristo se confirió a sí mismo la dignidad de sumo sacerdote, sino aquel que le dijo: «Tú eres mi Hijo: yo te he engendrado hoy», o, como dice otro pasaje de la Escritura: «Tú eres sacerdote eterno, según el rito de Melquisedec.»

        Cristo, en los días de su vida mortal, a gritos y con lágrimas, presentó oraciones y súplicas al que podía salvarlo de la muerte, cuando en su angustia fue escuchado. Él, a pesar de ser Hijo, aprendió, sufriendo, a obedecer. Y, llevado a la consumación, se ha convertido para todos los que le obedecen en autor de salvación eterna, proclamado por Dios sumo sacerdote, según el rito de Melquisedec.
      ref: De la carta a los Hebreos 4,14-5,10
    resp1:
      ref: Flp 2, 8; Is 53, 7
      vr:
      - - R
        - Cristo se rebajó * Hasta someterse incluso a la muerte.
      - - V
        - Maltratado, voluntariamente se humillaba.
      - - R
        - Hasta someterse incluso a la muerte.
    lectura2:
      titulo: (AAS 39 [1947], 552-553) CRISTO, SACERDOTE Y VÍCTIMA
      texto: |-
        Cristo es ciertamente sacerdote, pero lo es para nosotros, no para sí mismo, ya que él, en nombre de todo el género humano, presenta al Padre eterno las aspiraciones y sentimientos religiosos de los hombres. Es también víctima, pero lo es igualmente para nosotros, ya que se pone en lugar del hombre pecador. Por esto, aquella frase del Apóstol: Tened entre vosotros los sentimientos propios de Cristo Jesús, exige de todos los cristianos que, en la medida de las posibilidades humanas, reproduzcan en su interior las mismas disposiciones que tenía el divino Redentor cuando ofrecía el sacrificio de sí mismo: disposiciones de una humilde sumisión, de adoración a la suprema majestad divina, de honor, alabanza y acción de gracias.

        Les exige asimismo que asuman en cierto modo la condición de víctimas, que se nieguen a sí mismos, conforme a las normas del Evangelio, que espontánea y libremente practiquen la penitencia, arrepintiéndose y expiando los pecados.

        Exige finalmente que todos, unidos a Cristo, muramos místicamente en la cruz, de modo que podamos hacernos nuestra aquella sentencia de san Pablo: Estoy crucificado con Cristo.
      autor: De la carta encíclica Mediator Dei del papa Pío doce
    resp2:
      ref: Ga 2, 20
      vr:
      - - R
        - Vivo de la fe en el Hijo de Dios, * Que me amó hasta entregarse por mí.
      - - V
        - Vivo yo, pero no soy yo, es Cristo quien vive en mí.
      - - R
        - Que me amó hasta entregarse por mí.
  laudes:
    himno: Cantan a tu gloria, Cristo Sacerdote
    lectura:
      ref: Hb 10, 5-10
      texto: 'Cuando Cristo entró en el mundo, dijo: «Tú no quieres sacrificios ni ofrendas, pero me has preparado un cuerpo; no aceptas holocaustos ni víctimas expiatorias. Entonces yo dije lo que está escrito en el libro: "Aquí estoy, oh Dios, para hacer tu voluntad."» Primero dice: «No quieres ni aceptas sacrificios ni ofrendas, holocaustos ni víctimas expiatorias», que se ofrecen según la ley. Después añade: «Aquí estoy yo para hacer tu voluntad.» Niega lo primero, para afirmar lo segundo. Y conforme a esa voluntad todos quedamos santificados por la oblación del cuerpo de Jesucristo, hecha una vez para siempre.'
    responsorio:
    - - V
      - Aquí estoy para hacer tu voluntad.
    - - R
      - Aquí estoy para hacer tu voluntad.
    - - V
      - Llevo tu ley en las entrañas.
    - - R
      - Para hacer tu voluntad.
    - - V
      - Gloria al Padre, al Hijo y al Espíritu Santo.
    - - R
      - Aquí estoy para hacer tu voluntad.
    ant_benedictus: Padre, que todos sean uno, para que el mundo crea que tú me has enviado.
    preces:
      intro: 'En el comienzo de este día, alabemos a Jesucristo, fuente de salvación eterna para todos los hombres, y pidámosle con humildad:'
      respuesta: Señor, óyenos.
      preces:
      - - Jesús, Hijo de Dios vivo,
        - guíanos hacia la luz de tu verdad.
      - - Cristo, Palabra de Dios, que estás junto al Padre desde siempre y por siempre,
        - consagra a tu Iglesia en la unidad.
      - - Jesús, ungido por el Padre con la fuerza del Espíritu Santo,
        - consagra a tu Iglesia en la santidad.
      - - Cristo, sumo sacerdote del nuevo Testamento,
        - comunica a los sacerdotes tu santidad, para gloria del Padre.
      - - Cristo, sabiduría de Dios, paz y reconciliación nuestra,
        - haz que nos mantengamos todos unánimes y concordes en tu Iglesia.
      - - Cristo, sacerdote eterno, glorificador del Padre,
        - haz que sepamos ofrecernos contigo, para alabanza de la gloria eterna.
    padrenuestro_intro: 'Con la confianza puesta en la mediación de Jesucristo, sumo y eterno sacerdote, digamos a Dios Padre:'
  tercia:
    lectura:
      ref: Hb 7, 26-27
      texto: 'Tal convenía que fuese nuestro sumo sacerdote: santo, inocente, sin mancha, separado de los pecadores y encumbrado sobre el cielo. Él no necesita ofrecer sacrificios cada día — como los sumos sacerdotes, que ofrecían primero por los propios pecados, después por los del pueblo—, porque Jesucristo, Señor nuestro, lo hizo de una vez para siempre, ofreciéndose a sí mismo.'
    ant: Por Cristo todos podemos acercarnos al Padre con un mismo Espíritu.
    versiculo:
    - - V
      - Estad alegres cuando compartís los padecimientos de Cristo.
    - - R
      - Para que, cuando se manifieste su gloria, reboséis de gozo.
  sexta:
    lectura:
      ref: 1 Pe 2, 4-5
      texto: Acercándoos al Señor, la piedra viva desechada por los hombres, pero escogida y preciosa ante Dios, también vosotros, como piedras vivas, entráis en la construcción del templo del Espíritu, formando un sacerdocio sagrado, para ofrecer sacrificios espirituales que Dios acepta por Jesucristo.
    ant: Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular.
    versiculo:
    - - V
      - Ya que habéis aceptado a Cristo Jesús, el Señor, proceded según él.
    - - R
      - Arraigados en él, dejaos construir y edificar en la fe.
  nona:
    lectura:
      ref: 1 Pe 2, 9-10
      texto: Vosotros sois una raza elegida, un sacerdocio real, una nación consagrada, un pueblo adquirido por Dios para proclamar las hazañas del que os llamó a salir de la tiniebla y a entrar en su luz maravillosa. Antes erais «no pueblo», ahora sois «pueblo de Dios»; antes erais «no compadecidos», ahora sois « compadecidos ».
    ant: A cada uno de nosotros se le ha dado la gracia según la medida del don de Cristo, para la edificación de su cuerpo, que es la Iglesia.
    versiculo:
    - - V
      - Que la paz de Cristo actúe de árbitro en vuestro corazón.
    - - R
      - A ella habéis sido convocados, en un solo cuerpo.
  visperas:
    himno: A Ti, sumo y eterno Sacerdote
    salmodia:
    - ant: 'El Señor lo ha jurado y no se arrepiente: «Tú eres sacerdote eterno.»'
      salmo: salmo-109-1-5-7
    - ant: Dios, rico en misericordia, nos ha hecho vivir con Cristo.
      salmo: salmo-110
    - ant: Cristo es imagen de Dios invisible, primogénito de toda criatura.
      salmo: cantico-col-1-12-20
    lectura:
      ref: Hb 10, 19-23
      texto: Hermanos, teniendo entrada libre al santuario, en virtud de la sangre de Jesús, contando con el camino nuevo y vivo que él ha inaugurado para nosotros a través de la cortina, o sea, de su carne, y teniendo un gran sacerdote al frente de la casa de Dios, acerquémonos con corazón sincero y llenos de fe, con el corazón purificado de mala conciencia y con el cuerpo lavado en agua pura. Mantengámonos firmes en la esperanza que profesamos, porque es fiel quien hizo la promesa.
    responsorio:
    - - V
      - Estamos en paz con Dios, por medio de nuestro Señor Jesucristo.
    - - R
      - Estamos en paz con Dios, por medio de nuestro Señor Jesucristo.
    - - V
      - Y nos gloriamos, apoyados en la esperanza de alcanzar la gloria de Dios.
    - - R
      - Por medio de nuestro Señor Jesucristo.
    - - V
      - Gloria al Padre, y al Hijo y al Espíritu Santo.
    - - R
      - Estamos en paz con Dios, por medio de nuestro Señor Jesucristo.
    ant_magnificat: Padre, te ruego por ellos, que son tuyos, y por ellos me consagro yo, para que también se consagren ellos en la verdad.
    preces:
      intro: 'Dirijámonos confiadamente a Cristo, nuestro sumo sacerdote, y presentémosle nuestros deseos y peticiones, diciendo con humildad:'
      respuesta: Escúchanos, Señor, te suplicamos con fe.
      preces:
      - - Cristo, tú que eres la Palabra del Padre,
        - pon en nuestros labios lo que hemos de pedir.
      - - Cristo sacerdote, tú que eres el pan de la vida,
        - haz que los que tú has elegido vivan el don de su sacerdocio, consumando en ti su propia oblación.
      - - Cristo glorioso, que vives siempre para interceder ante el Padre en favor nuestro,
        - haz que seamos fieles en la oración por tu Iglesia.
      - - Cristo Señor, que fuiste enviado por el Padre,
        - haz que todos encuentren en ti la vida y el camino del reino.
      - - Cristo, Hijo de Dios vivo, que con tu muerte venciste a la muerte,
        - haz que la oblación final de nuestros difuntos los lleve al gozo eterno de la gloria.
    padrenuestro_intro: 'Con la confianza puesta en la mediación de Jesucristo, sumo y eterno sacerdote, digamos a Dios Padre:'
San Agustín de Canterbury, obispo:
  nombre_libro: San Agustín De Cantorbery, Obispo
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Señor Dios, que por la predicación del obispo san Agustín de Cantorbery llevaste a los pueblos de Inglaterra la luz del Evangelio, concédenos que el fruto de su trabajo apostólico perdure en tu Iglesia con perenne fecundidad. Por nuestro Señor Jesucristo. 30 de mayo
  oficio:
    lectura2:
      titulo: LOS INGLESES HAN SIDO REVESTIDOS POR LA LUZ DE LA SANTA FE
      texto: |-
        Gloria a Dios en el cielo, y en la tierra paz a los hombres que ama el Señor, porque el grano de trigo caído en tierra murió, para no reinar él solo en el cielo; por su muerte vivimos, su debilidad nos conforta, su pasión nos libera de la nuestra, su amor nos hace buscar en las Islas Británicas hermanos a quienes no conocemos, y su don nos hace encontrar a quienes buscábamos sin conocerlos.

        ¿Quién será capaz de relatar la alegría nacida en el corazón de todos los fieles al tener noticias de que los ingleses, por obra de la gracia de Dios y con tu colaboración, expulsadas las tinieblas de sus errores, han sido revestidos por la luz de la santa fe; de

        que con espíritu fidelísimo pisotean los ídolos a los que antes estaban sometidos por un temor tirano; de que con puro corazón se someten al Dios omnipotente; de que abandonando sus malas acciones siguen las normas de la predicación; de que se someten a los preceptos divinos y se eleva su inteligencia; de que se humillan en oración hasta la tierra para que su mente no quede en la tierra? ¿Quién ha podido realizar todo esto sino aquel que dijo: Mi Padre sigue actuando, y yo también actúo?

        Para demostrar que no es la sabiduría humana, sino su propio poder el que convierte al mundo, eligió Dios como predicadores suyos a hombres incultos, y lo mismo ha hecho en Inglaterra, realizando obras grandes por medio de instrumentos débiles. Ante este don divino hay, hermano carísimo, mucho de qué alegrarse y mucho de qué temer.

        Sé bien que el Dios todopoderoso, por tu amor, ha realizado grandes milagros entre esta gente que ha querido hacerse suya. Por ello, es preciso que este don del cielo sea para ti al mismo tiempo causa de gozo en el temor y de temor en el gozo. De gozo, ciertamente, pues ves cómo el alma de los ingleses es atraída a la gracia interior por obra de los milagros exteriores; de temor, también, para que tu debilidad no caiga en el orgullo al ver los milagros que se producen, y no vaya a suceder que, mientras se te rinde un honor externo, la vanagloria te pierda en tu interior.

        Debemos recordar que, cuando los discípulos regresaban gozosos de su misión y dijeron al Señor: Hasta los demonios se nos someten en tu nombre, él les contestó: No estéis alegres porque se os someten los espíritus; estad alegres porque vuestros nombres están inscritos en el cielo.
      autor: |-
        De las cartas de san Gregorio Magno, papa
        (Libro 9, 36: MGH, Epistolae 2, 305-306)
    resp2:
      ref: Flp 3, 17; 4, 9; 1 Co 1, 10
      vr:
      - - R
        - Seguid mi ejemplo, hermanos, y fijaos en los que caminan según el modelo que tenéis en nosotros; * seguid practicando lo que habéis aprendido y recibido, lo que habéis oído y visto en mí, y el Dios de la paz estará con vosotros. Aleluia.
      - - V
        - Os exhorto por el nombre de nuestro Señor Jesucristo a que tengáis todos unión y concordia.
      - - R
        - Seguid practicando lo que habéis aprendido y recibido, lo que habéis oído y visto en mí, y el Dios de la paz estará con vosotros. Aleluia.
San Anselmo, obispo y doctor de la Iglesia:
  nombre_libro: San Anselmo, Obispo Y Doctor De La Iglesia
  comun_libro: pastores
  indicacion: Del Común de pastores o de doctores de la Iglesia.
  oracion: Señor Dios, tú has concedido a tu obispo san Anselmo el don de investigar y enseñar, para que pudiera penetrar tus insondables misterios y los supiera enseñar a tu pueblo, haz que la luz de la fe venga en ayuda de nuestra inteligencia, para que las verdades que tú nos has revelado colmen nuestros anhelos de saber. Por nuestro Señor Jesucristo. 23 de abril
  oficio:
    lectura2:
      titulo: QUE TE CONOZCA Y TE AME PARA QUE ENCUENTRE EN TI MI ALEGRÍA
      texto: |-
        ¿Has encontrado, alma mía, lo que buscabas? Buscabas a Dios, y has encontrado que él está por encima de todas las cosas, que nada mejor que él se puede imaginar, y que él es la vida, la luz, la sabiduría, la bondad, la bienaventuranza eterna y la eternidad dichosa; él está por todas partes y siempre.

        Señor Dios mío, creador y restaurador de mi ser, di a mi alma deseosa que eres otro del que ella ha visto para que vea limpiamente lo que desea. Intenta ver más, pero no ve nada más de lo que ha visto, sino tinieblas. En verdad no ve tinieblas; puesto que en ti no existen, pero ve que no puede ver más por sus propias tinieblas.

        De verdad, Señor, que esta luz en la que habitas es inaccesible, pues no existe nadie que pueda penetrar esta luz para contemplarte. Yo no la veo, pues es excesiva para mí, y, sin embargo, todo lo que veo lo veo por ella, del mismo modo que el ojo débil, lo que ve, lo ve por la luz del sol, aunque no pueda mirarlo directamente.

        ¡Mi entendimiento no puede alcanzar esa luz!; es demasiado resplandeciente para comprenderla, y tampoco los ojos de mi alma soportan el mirarla por mucho tiempo. Su fulgor la deslumbra, su sublimidad la supera, su inmensidad la anonada, su amplitud la ofusca.

        ¡Oh luz suprema e inaccesible! ¡Oh verdad íntegra y feliz, qué lejos estás de mí que estoy tan cerca de ti! ¡Qué lejos estás de mi presencia, mientras yo siempre estoy en la tuya!

        En todas partes estás presente e íntegra, y yo no te veo. Me muevo y existo en ti, y, sin embargo, no puedo alcanzarte. Estás dentro y alrededor de mí y no te siento.

        Te ruego, Señor, que te conozca y te ame para que encuentre en ti mi alegría. Y si en esta vida no puedo alcanzar la plenitud, que al menos crezca de día en día hasta que llegue a aquella plenitud. Que en esta vida se haga más profundo mi conocimiento de ti, para que allí sea completo; que tu amor crezca en mí para que allí sea perfecto, y que mi alegría, grande en esperanza, sea completa en la posesión.

        Señor, por medio de tu Hijo nos ordenas e incluso nos aconsejas que pidamos, y prometes que recibiremos, para que nuestro gozo sea perfecto. Yo te pido, Señor, como nos aconsejas por medio de nuestro admirable consejero, que reciba lo que prometes por tu fidelidad, para que mi gozo sea perfecto. Yo te pido, Dios veraz, que reciba, para que mi gozo sea perfecto.

        Entre tanto, que esto sea lo que medite mi mente, proclame mi lengua, ame mi corazón y hable mi boca. Que sea el hambre de mi alma, y la sed de mi cuerpo: que todo mi ser lo desee, hasta que entre en el gozo del Señor, que es Dios trino y uno, bendito en todos los siglos. Amén.
      autor: |-
        Del libro Proslógion de san Anselmo, obispo
        (Caps. 14. 16. 26: Opera omnia, edición Schmitt, Seckau [Austria]
        1938,1,111-113.121-122)
    resp2:
      ref: ''
      vr:
      - - R
        - Anselmo, doctor insigne, formado bajo la enseñanza de Lanfranco, después de haber sido un padre bondadoso para los monjes, fue llamado a la dignidad episcopal, * y luchó valerosamente por la libertad de la santa Iglesia. Aleluia.
      - - V
        - Afirmó siempre con voz invencible que la Iglesia no era esclava de nadie, sino la esposa libre de Jesucristo.
      - - R
        - Y luchó valerosamente por la libertad de la santa Iglesia. Aleluia.
San Antonio María Claret, obispo:
  nombre_libro: San Antonio María Claret, Obispo
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Oh Dios, que concediste a tu obispo san Antonio María Claret una caridad y un valor admirables para anunciar el Evangelio a los pueblos, concédenos, por su intercesión, que, buscando siempre tu voluntad en todas las cosas, trabajemos generosamente por ganar nuevos hermanos para Cristo. Que vive y reina contigo. 28 de octubre
  oficio:
    lectura2:
      titulo: NOS APREMIA EL AMOR DE CRISTO
      texto: |-
        Inflamados por el fuego del Espíritu Santo, los misioneros apostólicos han llegado, llegan y llegarán hasta los confines del mundo, desde uno y otro polo, para anunciar la palabra divina; de modo que pueden decirse con razón a sí mismos las palabras del apóstol san Pablo: Nos apremia el amor de Cristo.

        El amor de Cristo nos estimula y apremia a correr y volar con las alas del santo celo. El verdadero amante ama a Dios y a su prójimo; el verdadero celador es el mismo amante, pero en grado superior, según los grados de amor; de modo que, cuanto más amor tiene, por tanto mayor celo es compelido. Y, si uno no tiene celo, es señal cierta que tiene apagado en su corazón el fuego del amor, la caridad. Aquel que tiene celo desea y procura, por todos los medios posibles, que Dios sea siempre más conocido, amado y servido en esta vida y en la otra, puesto que este sagrado amor no tiene ningún límite.

        Lo mismo practica con su prójimo, deseando y procurando que todos estén contentos en este mundo y sean felices y bienaventurados en el otro; que todos se salven, que ninguno se pierda eternamente, que nadie ofenda a Dios y que ninguno, finalmente, se encuentre un solo momento en pecado. Así como lo vemos en los santos apóstoles y en cualquiera que esté dotado de espíritu apostólico.

        Yo me digo a mí mismo: Un hijo del Inmaculado Corazón de María es un hombre que arde en caridad y que abrasa por donde pasa; que desea eficazmente y procura, por todos los medios, encender a todo el mundo en el fuego del divino amor. Nada le arredra, se goza en las privaciones, aborda los trabajos, abraza los sacrificios, se complace en las calumnias y se alegra en los tormentos. No piensa sino cómo seguirá e imitará a Jesucristo en trabajar, sufrir y en procurar siempre y únicamente la mayor gloria de Dios y la salvación de las almas.
      autor: |-
        De las obras de san Antonio María Claret, obispo
        (L'egoismo vinto, Roma 1869, 60; Autobiografía, cap. 34)
    resp2:
      ref: 1 Ts 2, 8; Ga 4, 19
      vr:
      - - R
        - Deseábamos entregaros no sólo el Evangelio de Dios, sino hasta nuestras propias personas. * Porque os habíais ganado nuestro amor.
      - - V
        - Hijos míos, otra vez me causáis dolores de parto, hasta que Cristo tome forma en vosotros.
      - - R
        - Porque os habíais ganado nuestro amor.
San Antonio María Zaccaría, presbítero:
  nombre_libro: San Antonio María Zaccaría, Presbítero
  comun_libro: pastores
  indicacion: 'Del Común de pastores, o de santos varones: para educadores o para religiosos.'
  oracion: Concédenos, Señor, crecer, según el espíritu de san Pablo, apóstol, en el conocimiento incomparable de tu Hijo Jesucristo, que impulsó a san Antonio María Zaccaría, a proclamar en tu Iglesia la palabra de salvación. Por Jesucristo nuestro Señor. 6 de julio
  oficio:
    lectura2:
      titulo: EL DISCÍPULO DEL APÓSTOL PABLO
      texto: |-
        Nosotros, unos necios por Cristo: esto lo decía nuestro bienaventurado guía y santísimo patrono, refiriéndose a sí mismo y a los demás apóstoles, como también a todos los que profesan las enseñanzas cristianas y apostólicas. Pero ello, hermanos muy amados, no ha de sernos motivo de admiración o de temor, ya que un discípulo no es más que su maestro, ni un esclavo más que su amo. Nuestros enemigos se hacen mal a sí mismos y nos prestan a nosotros un servicio, ya que nos ayudan a conseguir la corona de la gloria eterna, mientras que provocan sobre ellos la ira de Dios, y, por esto, debemos compadecerlos y amarlos en vez de odiarlos y aborrecerlos. Más aún, debemos orar por ellos y no dejarnos vencer del mal, sino vencer el mal con el bien, y amontonar las muestras de bondad sobre sus cabezas, según nos aconseja nuestro Apóstol, como carbones encendidos de ardiente caridad; así ellos, viendo nuestra paciencia y mansedumbre, se convertirán y se inflamarán en amor de Dios.

        A nosotros, aunque indignos, Dios nos ha elegido del mundo, por su misericordia, para que, dedicados a su servicio, vayamos progresando constantemente en la virtud y, por nuestra constancia, demos fruto abundante de caridad, jubilosos por la esperanza de poseer la gloria que nos corresponde por ser hijos de Dios, y gloriándonos incluso en medio de nuestras tribulaciones.

        Fijaos en vuestro llamamiento, hermanos muy amados; si lo consideramos atentamente, fácilmente nos daremos cuenta de que exige de nosotros que no rehusemos el participar en los sufrimientos de Cristo, puesto que nuestro propósito es seguir, aunque sea de lejos, las huellas de los santos apóstoles y demás soldados del Señor. Corramos en la carrera que nos toca, sin retirarnos, fijos los ojos en el que inició y completa nuestra fe: Jesús.

        Los que hemos tomado por guía y padre a un apóstol tan eximio y hacemos profesión de seguidores suyos debemos esforzarnos en poner por obra sus enseñanzas y ejemplos; no sería correcto que, en las filas de semejante capitán, militaran unos soldados cobardes o desertores, o que un padre tan ilustre tuviera unos hijos indignos de él.
      autor: |-
        De un sermón de san Antonio María Zaccaría, presbítero, a sus hermanos de religión
        (J. A. Gabutio, Historia Congregationis Clericorum Regularium sancti Pauli, 1, 8)
    resp2:
      ref: Cf. Hch 20, 20. 21. 24; Rm 1, 16a
      vr:
      - - R
        - 'No he ahorrado medio alguno al insistiros a creer en nuestro Señor Jesús; * a mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios.'
      - - V
        - No me avergüenzo del Evangelio.
      - - R
        - 'A mí no me importa la vida; lo que me importa es completar mi carrera, y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios.'
San Apolinar, obispo y mártir:
  nombre_libro: San Apolinar, Obispo Y Mártir
  comun_libro: un-martir
  indicacion: 'Del Común de pastores: obispo, o del Común de un mártir.'
  oracion: Conduce, Señor, a tus fieles por el camino de la eterna salvación, que tu obispo san Apolinar enseñó con su doctrina y martirio, y haz que, perseverando en tus mandamientos, merezcamos ser coronados con él. Por nuestro Señor Jesucristo. 21 de julio
  oficio:
    lectura2:
      titulo: EL MÁRTIR REINA Y VIVE
      texto: |-
        El bienaventurado Apolinar enriqueció a la Iglesia con el honor local y eximio del martirio. Hizo honor al nombre de Apolinar, porque perdió aquí su vida según el mandato de su Dios, para conquistarla en la vida eterna. Bienaventurado el que acabó su carrera y mantuvo la fe de tal manera que volvió a ser el primero de su iglesia para los que confiaban en él. Nadie crea, porque se le otorgue el título de confesor, que es inferior al mártir el que, por voluntad de Dios, piensa en el combate que se vuelve a entablar cada mañana de múltiples formas. Escucha lo que dice Pablo: “Muero cada día”. Es poca cosa que muera una sola vez en el que a menudo puede ofrecer a su rey una gloriosa victoria sobre sus enemigos. Al mártir no lo hace tanto la muerte como la fe y la piedad: y como es propio del valor sucumbir en la batalla por amor al rey, así también es propio del valor perfecto combatir durante mucho tiempo. Fue mártir no porque le produjera la muerte, sino que reconoció al mártir porque no le arrancó la fe; el astuto enemigo lanzó todos los dardos que pudo y recurrió a todas sus clases de armas, pero no pudo mover la posición de aquel fortísimo jefe ni violar su constancia. Hermanos, si es necesario, es gran cosa

        despreciar la vida presente por el Señor, pero es hasta glorioso despreciar el mundo con la forma de vivir y pisotear a su príncipe.

        Cristo corría al encuentro del mártir; el mártir corría al encuentro de su Rey. Lo hemos dichO bien: “corría”, tal como dice el profeta: “Levántate para venir a mi encuentro y mira”. Pero para conservar a quien la defendía luchando a favor de ella, la santa Iglesia corre apresuradamente al encuentro de Cristo para que reservase al vencedor la corona de la justicia y le procurase a ella la presencia de su combatiente en tiempo de guerra. El confesor derramaba sangre a menudo y daba testimonio de su Creador con sus heridas y con la fe de su mente. Levantando los ojos al cielo despreciaba la carne y la tierra. Pero la todavía tierna infancia de la Iglesia venció, resistió y consiguió con su deseo que el mártir fuese retardado. Hermanos, hablo de la infancia que siempre lo consigue todo, que combate más con las lágrimas que con las fuerzas. El rostro y el sudor de los fuertes no tienen el poder de las lágrimas de los niños, porque unos quebrantan los cuerpos, pero los otros quebrantan los corazones; en un caso apenas se mueven los juicios de la mente pero, en el otro, toda la piedad se abaja condescendiente.

        Hermanos, ¿qué más se puede decir? La santa madre Iglesia procuró no ser separada de su obispo. Éste vive como el buen pastor que está en medio de su grey, y el que nos precedió corporalmente nunca se separó en cuanto al espíritu. Digo que nos precedió con su apariencia externa; por lo demás, la morada de su cuerpo descansa entre nosotros. El diablo desapareció; el perseguidor sucumbió; pero reina y vive el que deseó morir por su Rey.
      autor: |-
        De los sermones de san Pedro Crisólogo, obispo
        (Sermón 128, 1-3: CCL 24A, 789-791)
    resp2:
      ref: 2Tm 4, 7-8; Flp 1, 21
      vr:
      - - R
        - He combatido bien mi combate, he corrido hasta la meta, he mantenido la fe * Pero ahora se me ha dado la corona de la justicia que en aquel día me restituirá el Señor, juez justo.
      - - V
        - Para mí la vida es Cristo, y una ganancia el morir.
      - - R
        - Pero ahora se me ha dado la corona de la justicia que en aquel día me restituirá el Señor, juez justo.
San Beda el Venerable, abad y doctor de la Iglesia:
  nombre_libro: San Beda El Venerable, Presbítero Y Doctor De La Iglesia
  comun_libro: pastores
  indicacion: Del Común de pastores o del Común de doctores de la Iglesia.
  oracion: Señor Dios, que has iluminado a tu Iglesia con la sabiduría de san Beda el Venerable, concede a tus siervos la gracia de ser constantemente orientados por las enseñanzas de tu santo presbítero y ayudados por sus méritos. Por nuestro Señor Jesucristo. El mismo día 25 de mayo
  oficio:
    lectura2:
      titulo: DESEO VER A CRISTO
      texto: |-
        El martes, antes de la fiesta de la Ascensión, la enfermedad de Beda se agravó; su respiración era fatigosa y los pies se le hinchaban. Sin embargo, durante todo aquel día siguió sus lecciones y el dictado de sus escritos con ánimo alegre. Dijo, entre otras cosas:

        «Aprended de prisa porque no sé cuánto tiempo viviré aún, ni si el Creador me llevará consigo en seguida.»

        Nosotros teníamos la impresión de que tenía noticia clara de su muerte; prueba de ello es que se pasó toda la noche velando y en acción de gracias.

        Al amanecer del miércoles, nos mandó que escribiéramos lo que teníamos comenzado; lo hicimos hasta la hora de Tercia. A la hora de Tercia tuvimos la procesión con las reliquias de los santos, como es costumbre ese día. Uno de los nuestros, que estaba con Beda, le dijo:

        «Maestro, falta aún un capítulo del libro que últimamente dictabas; ¿te resultaría muy difícil seguir contestando a nuestras preguntas?»

        A lo que respondió: «No hay dificultad. Toma la pluma y ponte a escribir en seguida.»

        Así lo hizo él. Pero a la hora de Nona me dijo: «Tengo en mi baúl unos cuantos objetos de cierto valor, a saber; pimienta, pañuelos e incienso; ve corriendo y avisa a los presbíteros del monasterio para repartir entre ellos estos regalos que Dios me ha hecho.»

        Ellos vinieron, y Beda les dirigió la palabra, rogando a todos y cada uno que celebraran misas por él y recitaran oraciones por su alma, lo que prometieron todos de buena gana.

        Se les caían las lágrimas, sobre todo cuando Beda dijo que ya no verían por más tiempo su rostro en este mundo. Pero se alegraron cuando dijo:

        «Hora es ya de que vuelva a mi Creador (si así le agrada), a quien me creó cuando yo no era y me formó de la nada. He vivido mucho tiempo, y el piadoso juez ha tenido especial providencia de mi vida; es inminente el momento de mi partida, pues deseo partir para estar con Cristo; mi alma desea ver en todo su esplendor a mi rey, Cristo.»

        Y dijo más cosas edificantes, continuando con su alegría de siempre hasta el atardecer. Wiberto, de quien ya hemos hablado, se atrevió aún a decirle:

        «Querido maestro, queda aún por escribir una frase.» Contestó Beda:

        «Pues escribe en seguida.» Al poco tiempo dijo el muchacho:

        «Ya está.» Y Beda contestó de nuevo:

        «Bien dices, está cumplido. Ahora haz el favor de colocarme la cabeza de manera que pueda sentarme mirando a la capilla en que solía orar; pues también ahora quiero invocar a mi Padre.»

        Y así, tendido sobre el suelo de su celda, comenzó a recitar: «Gloria al Padre y al Hijo y al Espíritu Santo.»

        Al nombrar al Espíritu Santo exhaló el último suspiro, y, sin duda, emigró a las delicias del cielo, como merecía, por su constancia en las alabanzas divinas.
      autor: |-
        De la carta de Cutberto sobre la muerte de san Beda el Venerable
        (Núms. 4-6: PL 90, 64-66)
    resp2:
      ref: S. Beda, Historia de los anglos; Mt 5, 19
      vr:
      - - R
        - Pasé todo el tiempo de mi vida en el monasterio, entregado a la meditación de las sagradas Escrituras, a la observancia de la vida religiosa y a la tarea cotidiana de cantar con la Iglesia las alabanzas de Dios. * Tuve siempre mi delicia en aprender, en enseñar y en escribir. Aleluia.
      - - V
        - Quien cumpla y enseñe mi ley será grande en el reino de los cielos.
      - - R
        - Tuve siempre mi delicia en aprender, en enseñar y en escribir. Aleluia.
San Bernardino de Siena, presbítero:
  nombre_libro: San Bernardino De Siena, Presbítero
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Señor Dios, que infundiste en el corazón de san Bernardino de Siena un amor admirable al nombre de Jesús; concédenos, por su intercesión y sus méritos, vivir siempre impulsados por el espíritu de tu amor. Por nuestro Señor Jesucristo. 21 de mayo
  oficio:
    lectura2:
      titulo: EL NOMBRE DE JESÚS, LUZ DE LOS PREDICADORES
      texto: |-
        El nombre de Jesús es la luz de los predicadores, pues es su resplandor el que hace anunciar y oír su palabra. ¿Por qué crees que se extendió tan rápidamente y con tanta fuerza la fe por el mundo entero, sino por la predicación del nombre de Jesús? ¿No ha sido por esta luz y por el gusto de este nombre como nos llamó Dios a su luz maravillosa? Iluminados todos y viendo ya la luz en esta luz, puede decirnos el Apóstol: En otro tiempo erais tinieblas, ahora sois luz en el Señor; caminad como hijos de la luz.

        Es preciso predicar este nombre para que resplandezca y no quede oculto. Pero no debe ser predicado con el corazón impuro o la boca manchada, sino que hay que guardarlo y exponerlo en un vaso elegido.

        Por esto dice el Señor, refiriéndose al Apóstol: Ese hombre es un vaso elegido por mi para dar a conocer mi nombre a pueblos, reyes, y a los israelitas. Un vaso —dice— elegido por mi, como aquellos vasos elegidos en que se expone a la venta una bebida de agradable sabor, para que el brillo y esplendor del recipiente invite a beber de ella; para dar a conocer —dice— mi nombre.

        Pues igual que con el fuego se limpian los campos, se consumen los hierbajos, las zarzas y las espinas inútiles, e igual también que cuando sale el sol y, disipadas las tinieblas, huyen los ladrones, los atracadores y los que andan errantes por la noche, así también cuando hablaba Pablo a la gente era como el fragor de un trueno, o como un incendio crepitante, o como el sol que de pronto brilla con más claridad, y consumía la incredulidad, lucía la verdad y desaparecía el error como la cera que se derrite en el fuego.

        Pablo hablaba del nombre de Jesús en sus cartas, en sus milagros y ejemplos. Alababa y bendecía el nombre de Jesús.

        El Apóstol llevaba este nombre, como una luz, a pueblos, reyes y a los israelitas, y con él iluminaba las naciones, proclamando por doquier aquellas palabras: La noche está avanzada, el día se echa encima: dejemos las actividades de las tinieblas y

        pertrechémonos con las armas de la luz. Conduzcámonos como en pleno día, con dignidad. Mostraba a todos la lámpara que arde y que ilumina sobre el candelero, anunciando en todo lugar a Jesús, y éste crucificado.

        Por eso la Iglesia, esposa de Cristo, basándose en su testimonio, salta de júbilo con el Profeta, diciendo: Dios mío, me instruiste desde mi juventud, y hasta hoy relato tus maravillas, es decir, siempre. El Profeta exhorta igualmente en este sentido: Cantad al Señor, bendecid su nombre, proclamad día tras día su salvación, es decir, Jesús, el Salvador que él ha enviado.
      autor: |-
        De los sermones de san Bernardino de Siena, presbítero
        (Sermón 49, sobre el glorioso nombre de Jesucristo, cap. 2: Opera omnia 4, 505-506)
    resp2:
      ref: Sir 51, 15; Sal 9, 3
      vr:
      - - R
        - Alabaré siempre tu nombre * y te llamaré en mi súplica. Aleluia.
      - - V
        - Me alegro y exulto contigo y toco en honor de tu nombre, ¡oh Altísimo!
      - - R
        - Y te llamaré en mi súplica. Aleluia.
San Blas, obispo y mártir:
  nombre_libro: San Blas, Obispo Y Mártir
  comun_libro: un-martir
  indicacion: Del Común de un mártir, o del Común de pastores.
  oracion: 'Escucha, Señor, las súplicas de tu pueblo, que hoy te invoca apoyado en la protección de tu mártir san Blas: concédenos, por sus méritos, la paz en esta vida y el premio de la vida eterna. Por Jesucristo nuestro Señor. El mismo día 3 de febrero'
  oficio:
    lectura2:
      titulo: SUFRE POR MIS OVEJAS
      texto: |-
        El Hijo del hombre no ha venido para que le sirvan, sino para servir y dar su vida en rescate por muchos. Tal es el modo como el Señor se puso a nuestro servicio, y como quiere que nosotros nos pongamos al servicio de los demás. Dio su vida en rescate por muchos: así es como nos redimió.

        ¿Quién de nosotros es capaz de redimir a otro? Fue su sangre y su muerte lo que nos redimió de la muerte, fue su abajamiento lo que nos levantó de nuestra postración; pero también nosotros debemos poner nuestra pequeña parte en favor de sus miembros, ya que hemos sido hechos miembros suyos: él es la cabeza, nosotros su cuerpo.

        El Señor había dicho: El que quiera ser primero entre vosotros, que sea vuestro esclavo. Igual que el Hijo del hombre no ha venido para que le sirvan, sino para servir y dar su vida en rescate por muchos. Por esto, el apóstol Juan nos exhorta a imitar su ejemplo, con estas palabras: Cristo dio su vida por nosotros; también nosotros debemos dar nuestra vida por los hermanos.

        Y el mismo Señor, después de su resurrección, dijo a Pedro: ¿Me quieres? El respondió: Te quiero. Por tres veces se repitió la misma pregunta y respuesta, y las tres veces dijo el Señor: Apacienta mis ovejas.

        «¿Cómo podrás demostrar que me quieres, sino apacentando mis ovejas? ¿Qué vas a darme con tu amor, si todo lo esperas de mí? Aquí tienes lo que has de hacer para quererme: apacienta mis ovejas.»

        Por tres veces se repiten las mismas palabras: «Me quieres?» «Te quiero.» «Apacienta mis ovejas.» Tres veces lo había negado por temor; tres veces le hace profesión de amor.

        Finalmente, después que el Señor ha encomendado por tercera vez sus ovejas a Pedro, al responderle éste con su profesión de amor, con la que condenaba y borraba su pasado temor, añade el Señor a continuación: «Cuando eras joven, tú mismo te ceñías e ibas adonde querías; pero cuando seas viejo, otro te ceñirá y te llevará a donde no quieras.» Esto dijo aludiendo a la muerte con que iba a dar gloria a Dios. Le anunciaba por adelantado la cruz, le predecía su martirio.

        El Señor, pues, va más allá de lo que había dicho: Apacienta mis ovejas, ya que añade equivalentemente: «Sufre por mis ovejas.»
      autor: |-
        De los sermones de san Agustín, obispo
        (Sermón Güelferbitano 32, Sobre la ordenación episcopal: PLS 2, 639-640)
    resp2:
      ref: Flp 1, 20; Sal 68, 21
      vr:
      - - R
        - En ningún caso he de fracasar; * con toda seguridad, Cristo será enaltecido en mí, ya sea por mi vida o ya sea por mi muerte.
      - - V
        - La afrenta me destroza el corazón, y desfallezco.
      - - R
        - Con toda seguridad, Cristo será enaltecido en mí, ya sea por mi vida o ya sea por mi muerte.
San Bruno, presbítero:
  nombre_libro: San Bruno, Presbítero
  comun_libro: pastores
  indicacion: 'Del Común de pastores o del Común de santos varones: para religiosos.'
  oracion: Señor, Dios nuestro, tú que llamaste a san Bruno para que te sirviera en la soledad, concédenos, por su intercesión, que, en medio de las vicisitudes de este mundo, vivamos entregados siempre a ti. Por nuestro Señor Jesucristo. 7 de octubre
  oficio:
    lectura2:
      titulo: SE ALEGRA MI ESPÍRITU EN EL SEÑOR
      texto: |-
        Habiéndome enterado, por la detallada y agradable relación de nuestro venerable hermano Landovino, del inflexible rigor con que observáis, de un modo tan sabio y digno de alabanza, vuestra Regla, y habiendo sabido de vuestro santo amor y vuestro constante interés por todo lo que se refiere a la integridad y la honestidad, se alegra mi espíritu en el Señor. En verdad, me alegro y prorrumpo en alabanzas y acciones de gracias al Señor y, sin embargo, suspiro amargamente. Me alegro, ciertamente, como es de justicia, por el incremento de los frutos de vuestras virtudes, pero me duelo y me avergüenzo de verme yo postrado, por mi indolencia y apatía, en la sordidez de mis pecados.

        Alegraos, pues, hermanos míos muy amados, por vuestro feliz destino y por la liberalidad de la gracia divina para con vosotros. Alegraos, porque habéis escapado de los múltiples peligros y naufragios de este mundo tan agitado. Alegraos, porque habéis llegado a este puerto escondido, lugar de seguridad y de calma, al cual son muchos los que desean venir, muchos los que incluso llegan a intentarlo, pero sin llegar a él. Muchos también, después de haberlo conseguido, han sido excluidos de él, porque a ninguno de ellos le había sido concedida esta gracia desde lo alto.

        Por lo tanto, hermanos míos, tened por bien cierto que todo aquel que ha llegado a disfrutar de este bien tan deseable, si llega a perderlo, se arrepentirá hasta el fin si es que tiene un mínimo de interés y solicitud por la salvación de su alma.

        Con respecto a vosotros, mis amadísimos hermanos legos, yo os digo: Proclama mi alma la grandeza del Señor, porque veo la magnificencia de su misericordia sobre vosotros, por lo que me ha contado vuestro prior y padre amantísimo, el cual está muy satisfecho y contento de vuestro proceder. Alegrémonos también nosotros porque, sin haberos dedicado al estudio, el Dios poderoso graba en vuestros corazones no sólo el amor, sino también el

        conocimiento de su santa ley. En efecto, vuestra conducta es una prueba de vuestro amor, como también de vuestra sabiduría. Porque vuestro interés y cautela en practicar la verdadera obediencia pone de manifiesto que sabéis captar el fruto dulcísimo y vital de la sagrada Escritura.
      autor: |-
        De una carta de san Bruno, presbítero, a sus hijos cartujos
        (Núms. 1-3: SC 88, 82-84)
    resp2:
      ref: Sal 54, 7-8; 1 Jn 2, 17
      vr:
      - - R
        - ¡Quien me diera alas de paloma para volar y posarme! * Emigraría lejos, habitaría en el desierto.
      - - V
        - El mundo pasa, con sus pasiones. Pero el que hace la voluntad de Dios permanece para siempre.
      - - R
        - Emigraría lejos, habitaría en el desierto.
San Calixto I, papa y mártir:
  nombre_libro: San Calixto I, Papa Y Mártir
  comun_libro: un-martir
  indicacion: Del Común de un mártir o del Común de pastores.
  oracion: Escucha, Señor, las súplicas de tu pueblo y concédenos la protección del papa san Calixto, cuyo martirio celebramos llenos de alegría. Por nuestro Señor Jesucristo. 15 de octubre
  oficio:
    lectura2:
      titulo: EN LA PERSECUCIÓN SE INFLIGE LA MUERTE, PERO SIGUE LA INMORTALIDAD
      texto: |-
        Si los soldados de este mundo consideran un honor volver victoriosos a su patria después de haber vencido al enemigo, un honor mucho más grande y valioso es volver triunfante al paraíso después de haber vencido al demonio y llevar consigo los trofeos de victoria a aquel mismo lugar de donde fue expulsado Adán por su pecado —arrastrando en el cortejo triunfal al mismo que antes lo había engañado—, ofrecer al Señor, como un presente de gran valor a sus ojos, la fe inconmovible, la incolumidad de la fuerza del espíritu, la alabanza manifiesta de la propia entrega, acompañarlo cuando comience a venir para tomar venganza de sus enemigos, estar a su lado cuando comience a juzgar, convertirse en heredero junto con Cristo, ser equiparado a los ángeles, alegrarse con los patriarcas, los apóstoles y los profetas por la posesión del reino celestial. ¿Qué persecución podrá vencer estos pensamientos, o qué tormentos superarlos?

        La mente que se apoya en santas meditaciones persevera firme y segura y se mantiene inconmovible frente a todos los terrores diabólicos y amenazas del mundo, ya que se halla fortalecida por una fe cierta y sólida en el premio futuro. En la persecución se cierra el mundo, pero se abre el cielo; amenaza el anticristo, pero protege Cristo; se inflige la muerte, pero sigue la inmortalidad. ¡Qué gran dignidad y seguridad, salir contento de este mundo, salir glorioso en medio de la aflicción y la angustia, cerrar en un momento estos ojos con los que vemos a los hombres y el mundo para volverlos a abrir en seguida y contemplar a Dios y a Cristo! ¡Cuán rápidamente se recorre este feliz camino! Se te arranca repentinamente de la tierra, para colocarte en el reino celestial.

        Estas consideraciones son las que deben impregnar nuestra mente, esto es lo que hay que meditar día y noche. Si la persecución encuentra así preparado al soldado de Dios, su fuerza, dispuesta a la lucha, no podrá ser vencida. Y aun en el caso de que llegue antes la llamada de Dios, no quedará sin premio una fe que estaba dispuesta al martirio; sin pérdida de tiempo, Dios, que es el juez, dará la recompensa; porque en tiempo de persecución se premia el combate, en tiempo de paz la buena conciencia.
      autor: |-
        Del tratado de san Cipriano, obispo y mártir, a Fortunato
        (Cap. 13: CSEL 3, 346-347)
        Los sufrimientos de ahora no pesan lo que la gloria que un día se nos
        descubrirá. ¿Quién, por tanto, no pondrá por obra todos los remedios a su
        alcance para llegar a una gloria tan grande, para convertirse en amigo de Dios,
        para tener parte al momento en el gozo de Cristo, para recibir la recompensa
        divina después de los tormentos y suplicios terrenos?
    resp2:
      ref: Cf. Hch 20, 28; 1 Co 4, 2
      vr:
      - - R
        - Tened cuidado del rebaño que el Espíritu Santo os ha encargado guardar, * Como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo.
      - - V
        - En un administrador, lo que se busca es que sea fiel.
      - - R
        - Como pastores de la Iglesia de Dios, que él adquirió con la sangre de su Hijo.
San Camilo de Lelis, presbítero:
  nombre_libro: San Camilo De Lelis, Presbítero
  comun_libro: santos-varones
  indicacion: 'Del Común de santos varones: para los santos que se consagraron a una actividad caritativa.'
  oracion: Oh Dios, que has enaltecido a san Camilo de Lelis con el carisma singular del amor a los enfermos, infunde en nosotros, por su intercesión, el espíritu de tu caridad, para que, sirviéndote en nuestros hermanos, podamos llegar seguros a ti en la hora de la muerte. Por Jesucristo nuestro Señor. El mismo día 14 de julio
  oficio:
    lectura2:
      titulo: SERVIDOR DE CRISTO EN LA PERSONA DE LOS HERMANOS
      texto: |-
        Empezaré por la santa caridad, raíz y complemento de todas las virtudes, con la que Camilo estaba familiarizado más que con ninguna otra. Y, así, afirmo que nuestro santo estaba inflamado en el fuego de esta santa virtud, no sólo para con Dios, sino también para con el prójimo, en especial para con los enfermos; y esto en tal grado que la sola vista de los enfermos bastaba para enternecer y derretir su corazón y para hacerle olvidar completamente todas las delicias, deleites y afectos mundanos. Cuando servía a algún enfermo, lo hacía con un amor y compasión tan grandes que parecía como si en ello tuviera que agotar y consumir todas sus fuerzas. De buena gana hubiera tomado sobre sí todos los males y dolencias de los enfermos con tal de aliviar sus sufrimientos o curar sus enfermedades.

        Descubría en ellos la persona de Cristo con una viveza tal, que muchas veces, mientras les daba de comer, se imaginaba que eran el mismo Cristo en persona y les pedía su gracia y el perdón de los pecados. Estaba ante ellos con un respeto tan grande como si real y verdaderamente estuviera en presencia del Señor. De nada hablaba con tanta frecuencia y con tanto fervor como de la santa caridad, y hubiera querido poderla infundir en el corazón de todos los mortales.

        Deseoso de inflamar a sus hermanos de religión en esta virtud, la primera de todas, acostumbraba inculcarles aquellas dulcísimas palabras de Jesucristo: Estuve enfermo, y me visitasteis. Estas palabras parecía tenerlas realmente esculpidas en su corazón; tanta era la frecuencia con que las decía y repetía.

        La caridad de Camilo era tan grande y tan amplia que tenían cabida en sus entrañas de piedad y benevolencia no sólo los enfermos y moribundos, sino toda clase de pobres y

        desventurados. Finalmente, era tan grande la piedad de su corazón para con los necesitados, que solía decir:

        "Si no se hallaran pobres en el mundo, habría que dedicarse a buscarlos y sacarlos de bajo tierra, para ayudarlos y practicar con ellos la misericordia."
      autor: |-
        De la Vida de san Camilo, escrita por un colega suyo
        (S. Cicatelli, Vita del P. Camillo de Lellis, Viterbo 1615)
    resp2:
      ref: 1 Ts 5, 14. 15. 18; Rm 15,7
      vr:
      - - R
        - 'Sostened a los débiles, esmeraos siempre en hacer el bien a todos: * Ésta es la voluntad de Dios en Cristo Jesús respecto de nosotros.'
      - - V
        - Acogeos mutuamente, como Cristo os acogió para gloria de Dios.
      - - R
        - Ésta es la voluntad de Dios en Cristo Jesús respecto de nosotros.
San Casimiro, príncipe:
  nombre_libro: San Casimiro
  comun_libro: santos-varones
  indicacion: Del Común de santos varones.
  oracion: Dios todopoderoso, sabemos que servirte es reinar; por eso te pedimos nos concedas, por intercesión de san Casimiro, vivir sometidos a tu voluntad en santidad y justicia. Por Jesucristo nuestro Señor. 7 de marzo
  oficio:
    lectura2:
      titulo: INVIRTIÓ SU TESORO SEGÚN EL MANDATO DEL ALTÍSIMO
      texto: |-
        La sorprendente, sincera y no engañosa caridad de Casimiro, por la que amaba ardientemente al Dios todopoderoso en el Espíritu, impregnaba de tal forma su corazón, que brotaba espontáneamente hacia su prójimo. No había cosa más agradable y más deseable para él que repartir sus bienes y entregarse a sí mismo a los pobres de Cristo, a los peregrinos, enfermos, cautivos y atribulados.

        Para las viudas y huérfanos y necesitados era no solamente un defensor y un protector, sino que se portaba con ellos como si fuera su padre, su hijo o su hermano.

        Tendríamos que escribir una larga historia si hubiésemos de contar uno por uno sus actos de amor a Dios y sus obras de caridad con el prójimo.

        Es poco menos que imposible describir su gran amor por la justicia, su templanza, su prudencia, su fortaleza y constancia, precisamente en esa edad en la que los hombres suelen sentir mayor inclinación al mal.

        A cada paso exhortaba a su padre, el rey, a respetar la justicia en el gobierno de la nación y en el de los pueblos que le estaban sometidos. Y, si alguna vez el rey por debilidad o negligencia incurría en algún error, no dudaba en reprochárselo con modestia.

        Tomaba como suyas las causas de los pobres y miserables, por lo que la gente le llamaba «defensor de los pobres». A pesar de su dignidad de príncipe y de su nobleza de sangre, no tenía dificultad en tratar con cualquier persona por humilde y despreciable que pareciera.

        Siempre fue su deseo ser contado más bien entre los pobres de espíritu, de quienes es el reino de los cielos, que entre los personajes famosos y poderosos de este mundo. No tuvo ambición del dominio terreno ni quiso nunca recibir la corona que el padre le ofrecía, por temor de que su alma se viera herida por el aguijón de las riquezas, que nuestro Señor Jesucristo llamó espinas, o sufriera el contagio de las cosas terrenas.

        Personas de gran autoridad, algunas de las cuales viven aún y que conocían hasta el fondo su comportamiento, aseguran que permaneció virgen hasta el fin de sus días.
      autor: |-
        De la Vida de san Casimiro, escrita por un autor casi contemporáneo
        (Caps. 2-3: Acta Sanctorum Martii 1, 347-348)
    resp2:
      ref: Sir 29, 14; 1 Tm 6, 11
      vr:
      - - R
        - Dispón de tus tesoros según el mandato del Altísimo, * y te aprovecharán más que el oro.
      - - V
        - Corre al alcance de la justicia, de la piedad, de la fe, de la caridad, de la paciencia en el sufrimiento, de la dulzura.
      - - R
        - Y te aprovecharán más que el oro.
San Cayetano, presbítero:
  nombre_libro: San Cayetano, Presbítero
  comun_libro: pastores
  indicacion: 'Del Común de pastores o del Común de santos varones: para religiosos.'
  oracion: Señor, Dios nuestro, que concediste a san Cayetano imitar el modo de vivir de los apóstoles, concédenos, por su intercesión y ejemplo, poner en ti nuestra confianza y buscar siempre el reino de los cielos. Por nuestro Señor Jesucristo. 8 de agosto
San Clemente I, papa y mártir:
  nombre_libro: San Clemente I, Papa Y Mártir
  comun_libro: un-martir
  indicacion: Del Común de un mártir o del Común de pastores.
  oracion: Dios todopoderoso y eterno, que te muestras admirable en la gloria de tus santos, concédenos celebrar con alegría la fiesta de san Clemente, sacerdote y mártir de tu Hijo, que dio testimonio con su muerte de los misterios que celebraba y confirmó con el ejemplo lo que predicó con su palabra. Por nuestro Señor Jesucristo. El mismo día 23 de noviembre
  oficio:
    lectura2:
      titulo: MARAVILLOSOS SON LOS DONES DE DIOS
      texto: |-
        ¡Qué grandes y maravillosos son, amados hermanos, los dones de Dios! La vida en la inmortalidad, el esplendor en la justicia, la verdad en la libertad, la fe en la confianza, la templanza en la santidad; y todos estos dones son los que están ya desde ahora al alcance de nuestro conocimiento. ¿Y cuáles serán, pues, los bienes que están preparados para los que lo aman? Solamente los conoce el Artífice supremo, el Padre de los siglos; sólo él sabe su número y su belleza.

        Nosotros, pues, si deseamos alcanzar estos dones, procuremos, con todo ahínco, ser contados entre aquellos que esperan su llegada. ¿Y cómo podremos lograrlo, amados hermanos? Uniendo a Dios nuestra alma con toda nuestra fe, buscando siempre, con diligencia, lo que es grato y acepto a sus ojos, realizando lo que está de acuerdo con su santa voluntad, siguiendo la senda de la verdad y rechazando de nuestra vida toda injusticia, maldad, avaricia, rivalidad, malicia y fraude.

        Éste es, amados hermanos, el camino por el que llegamos a la salvación, Jesucristo, el sumo sacerdote de nuestras oblaciones, sostén y ayuda de nuestra debilidad. Por él, podemos elevar nuestra mirada hasta lo alto de los cielos; por él, vemos como en un espejo el rostro inmaculado y excelso de Dios; por él, se abrieron los ojos de nuestro corazón; por él, nuestra mente, insensata y entenebrecida, se abre al resplandor de la luz; por él, quiso el Señor que gustásemos el conocimiento inmortal, ya que él es el reflejo de la gloria de Dios, tanto más encumbrado sobre los ángeles, cuanto más sublime es el nombre que ha heredado. Militemos, pues, hermanos, con todas nuestras fuerzas, bajo sus órdenes irreprochables.

        Ni los grandes podrían hacer nada sin los pequeños, ni los pequeños sin los grandes; la efectividad depende precisamente de la conjunción de todos. Tomemos como ejemplo a nuestro cuerpo. La cabeza sin los pies no es nada, como tampoco los pies sin la cabeza; los miembros más ínfimos de nuestro cuerpo son necesarios y útiles a la totalidad del cuerpo; más aún, todos ellos se coordinan entre sí para el bien de todo el cuerpo.

        Procuremos, pues, conservar la integridad de este cuerpo que formamos en Cristo Jesús, y que cada uno se ponga al servicio de su prójimo según la gracia que le ha sido asignada por donación de Dios.

        El fuerte sea protector del débil, el débil respete al fuerte; el rico dé al pobre, el pobre dé gracias a Dios por haberle deparado quien remedie su necesidad. El sabio manifieste su sabiduría no con palabras, sino con buenas obras; el humilde no dé testimonio de sí mismo, sino deje que sean los demás quienes lo hagan.

        Por esto, debemos dar gracias a aquel de quien nos vienen todos estos bienes, al cual sea la gloria por los siglos de los siglos. Amén.
      autor: |-
        De la carta de san Clemente primero, papa, a los Corintios
        (Caps. 35,1-5; 36,1-2; 37,1. 4-5; 38,1-2. 4: Funk 1,105-109)
    resp2:
      ref: Cf. Mt 7, 24; 1P 2, 22; 1S 2, 28; Si 44, 16. 17
      vr:
      - - R
        - Éste es el hombre prudente que edificó su casa sobre roca, y no encontraron engaño en su boca; * Dios se lo eligió para que fuera sacerdote.
      - - V
        - Éste es el gran sacerdote que durante su vida agradó al Señor y fue hallado justo.
      - - R
        - Dios se lo eligió para que fuera sacerdote.
San Cristóbal Magallanes, presbítero, y compañeros, mártires:
  nombre_libro: Santos Cristóbal Magallanes Y Compañeros, Mártires
  comun_libro: null
  indicacion: Del Común de mártires.
  oracion: Dios todopoderoso y eterno, que a san Cristóbal, presbítero, y a sus compañeros los hiciste fieles a Cristo Rey hasta el martirio, concédenos, por su intercesión, perseverar en la confesión de la fe verdadera y poder ajustarnos siempre a los mandatos de tu amor. Por nuestro Señor Jesucristo. 22 de mayo
  oficio:
    lectura2:
      titulo: EL QUE DÉ TESTIMONIO DE LA VERDAD SERÁ MÁRTIR DE CRISTO
      texto: |-
        Queridísimos hermanos, cada vez que celebramos las fiestas de los mártires, debemos pensar que militamos bajo el mismo Rey bajo el que también ellos merecieron luchar y vencer. Debemos pensar que hemos sido salvados por el mismo bautismo por el que ellos también fueron salvados, que gozamos y somos fortalecidos con los mismos sacramentos que ellos merecieron recibir, que llevamos en la frente el sello del Emperador que ellos también llevaron felizmente.

        Por ello, cada vez que celebramos el aniversario de los santos mártires, los bienaventurados mártires deben reconocer en nosotros algo de sus virtudes, para que les agrade suplicar para nosotros la misericordia de Dios. En efecto, todos aman lo que les es

        semejante. Por tanto, si lo semejante se une a lo semejante, lo desemejante se aleja mucho. Nuestro particular bienaventurado, cuya festividad deseamos celebrar con gozo, fue sobrio, ¿cómo se le podrá unir el que se da a la bebida? ¿Qué unión puede tener el humilde con el soberbio, el generoso con el envidioso, el espléndido con el avaro, el pacífico con el iracundo? El bienaventurado mártir fue, sin duda, casto: ¿cómo podrá unirse al adúltero? Queridísimos hermanos, si los gloriosos mártires repartieron lo suyo con los pobres, ¿cómo podrán ser amigos de los que roban lo ajeno? Los santos mártires se afanaban en amar a los enemigos, ¿cómo tendrán parte con los que, a veces, ni siquiera se esfuerzan en el amor recíproco entre amigos? Queridísimos hermanos, no nos contraríe imitar, en la medida de nuestras fuerzas, a los santos mártires para que, por sus méritos y oraciones, merezcamos ser absueltos de todos los pecados.

        Alguno dirá: ¿quién puede imitar a los santos mártires? Con la ayuda de Dios podemos y debemos imitarlos en muchas cosas, si no en todo. ¿No puedes soportar el fuego? Puedes evitar la lujuria.

        ¿No puedes soportar la pezuña desgarradora? Rechaza la avaricia que conduce a negocios perversos y a ganancias malvadas. Si te vence lo fácil, ¿cómo no te destrozará lo difícil? La paz tiene también sus mártires: pues, en buena medida, participa del martirio el que vence a la ira, el que rehúye la envidia como si fuera un veneno viperino, el que rechaza la soberbia, el que expulsa del corazón el odio, el que refrena los deseos superfluos de la gula, el que no se entrega a la embriaguez.

        Cada vez que y en cualquier lugar que trabajes por una causa justa, si das testimonio de ella, serás mártir. Puesto que Cristo es la justicia y la verdad, en cualquier lugar donde trabajes por la justicia o por la verdad o por la castidad, si las defiendes con todas tus fuerzas, recibirás la recompensa de los mártires. Y como la palabra mártir significa testigo, quien da testimonio en favor de la verdad será indudablemente mártir de Cristo, que es la verdad.
      autor: |-
        De los sermones de san Cesáreo de Arlés, obispo
        (Sermón 225, 1-2: CCL 104, 888-889)
    resp2:
      ref: Flp 1, 21; Ga 6, 14
      vr:
      - - R
        - Para mí la vida es Cristo, y una ganancia el morir. * Dios me libre de gloriarme si no es en la cruz de nuestro Señor Jesucristo.
      - - V
        - En la cual el mundo está crucificado para mí, y yo para el mundo.
      - - R
        - Dios me libre de gloriarme si no es en la cruz de nuestro Señor Jesucristo.
San Dionisio, obispo, y compañeros, mártires:
  nombre_libro: San Dionisio, Obispo, Y Compañeros Mártires
  comun_libro: null
  indicacion: Del Común de mártires.
  oracion: Oh Dios, que enviaste a san Dionisio y a sus compañeros a proclamar tu gloria ante las gentes, y les dotaste de admirable fortaleza en el martirio, concédenos imitarlos en su desprecio a la soberbia del mundo, para que no temamos nunca sus ataques. Por nuestro Señor Jesucristo. El mismo día 9 de octubre
  oficio:
    resp2:
      ref: ''
      vr:
      - - R
        - Los santos de Dios libraron un gran combate, pasaron por el fuego y por el agua y se salvaron; * y recibieron del Señor, nuestro Dios, la corona del triunfo.
      - - V
        - Éstos son los santos que para dar testimonio de Dios entregaron sus cuerpos al martirio.
      - - R
        - Y recibieron del Señor, nuestro Dios, la corona del triunfo.
San Dámaso I, papa:
  nombre_libro: San Dámaso I, Papa
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Concédenos la gracia, Señor, de glorificarte siempre por el triunfo de tus mártires, a quienes profesó devoción entrañable el papa san Dámaso. Por nuestro Señor Jesucristo. 12 de diciembre
  oficio:
    lectura2:
      titulo: DAMOS CULTO A LOS MÁRTIRES CON UN CULTO DE AMOR Y PARTICIPACIÓN
      texto: |-
        El pueblo cristiano celebra la conmemoración de sus mártires con religiosa solemnidad, para animarse a su imitación, participar de sus méritos y ayudarse con sus oraciones, pero nunca dedica altares a los mártires, sino sólo en memoria de los mártires.

        ¿Pues quién es el obispo, que, al celebrar la misa sobre los sepulcros de los santos, haya dicho alguna vez: «Te ofrecemos a ti, Pedro», o: «a ti, Pablo», o: «a ti, Cipriano»? La ofrenda se ofrece a Dios, que coronó a los mártires, junto a los sepulcros de aquellos a los que coronó, para que la amonestación, por estar en presencia de los santos lugares, despierte un afecto más vivo para acrecentar la caridad con aquellos a los que podemos imitar, y con aquel cuya ayuda hace posible la imitación.

        Damos culto a los mártires con un culto de amor y participación, con el que veneramos, en esta vida, a los santos, cuyo corazón sabemos que está ya dispuesto al

        martirio como testimonio de la verdad del Evangelio. Pero a aquéllos los honramos con mucha más devoción, por la certeza de que han superado el combate, y por ello les confesamos vencedores en una vida feliz, con una alabanza más segura que aquellos que todavía luchan en esta vida.

        Pero aquel culto que se llama de latría, y que consiste en el servicio debido a la divinidad, lo reservamos a solo Dios, pero no tributamos este culto a los mártires ni enseñamos que haya que tributárselo.

        Ahora bien, la ofrenda forma parte de este culto de latría, y por eso se llama idolatría la ofrenda hecha a los ídolos; pero nosotros no ofrecemos nada semejante, ni tampoco mandamos que se ofrezca, en el culto a los ángeles, los santos o los mártires; y, si alguien cae en tan gran tentación, se le amonesta con la verdadera doctrina, para que se corrija o para que tenga cuidado.

        Los mismos santos y los hombres se niegan a apropiarse estos honores exclusivos de Dios. Así hicieron Pablo y Bernabé, cuando los habitantes de Licaonia, después de haber visto los milagros que hicieron, quisieron ofrecerles sacrificios como a dioses; pero ellos, rasgando sus vestiduras, proclamaron y les persuadieron que no eran dioses, y, de esta forma, impidieron que les fueran ofrecidos sacrificios.

        Pero una cosa es lo que enseñamos, y otra lo que soportamos; una cosa es lo que mandamos hacer, y otra lo que queremos corregir, y así, mientras vamos buscando la corrección más adecuada, tenemos que tolerar muchas cosas.
      autor: |-
        Del tratado de san Agustín, obispo, contra Fausto
        (Lib. 20, 21: CSEL 25, 562-563)
    resp2:
      ref: Sal 115, 15; 33, 21; cf. Jdt 10, 3
      vr:
      - - R
        - Vale mucho a los ojos del Señor la vida de sus fieles. * Él cuida de todos sus huesos, y ni uno solo se quebrará.
      - - V
        - El Señor los revistió con vestiduras de alegría.
      - - R
        - Él cuida de todos sus huesos, y ni uno solo se quebrará.
San Efrén, diácono y doctor de la Iglesia:
  nombre_libro: San Efrén, Diácono Y Doctor De La Iglesia
  comun_libro: doctores
  indicacion: Del Común de doctores de la Iglesia.
  oracion: Señor, infunde en nuestros corazones el Espíritu Santo que con su inspiración impulsaba a tu diácono san Efrén a cantar con alegría tus misterios y a consagrar su vida a tu servicio. Por Jesucristo nuestro Señor. 11 de junio
  oficio:
    lectura2:
      titulo: LOS DESIGNIOS DIVINOS SON FIGURA DEL MUNDO ESPIRITUAL
      texto: |-
        Señor, con la meridiana luz de tu sabiduría disipa las tinieblas nocturnas de nuestra mente, para que, iluminada, te sirva en la renovación de nuestra vida purificada. La salida del sol señala el comienzo de las obras de los mortales; prepara tú en nuestros corazones una mansión para aquel día que no tiene ocaso. Concédenos que en nuestra persona lleguemos a ver la vida resucitada y que nada aparte nuestras mentes de tus delicias. Imprime en nuestros corazones, por nuestra asidua búsqueda de ti, el sello de ese día sin fin que no comienza con el movimiento y el curso del sol.

        A diario te abrazamos en tus sacramentos y te recibimos en nuestro cuerpo. Haznos dignos de sentir en nuestra persona la resurrección que esperamos. Con la gracia del bautismo hemos escondido tu tesoro en nuestros corazones; este mismo tesoro se acrecienta en la mesa de tus sacramentos; concédenos el gozo de tu gracia. Poseemos, Señor, en nuestra propia persona, tu memorial, tomado en la mesa espiritual; haz que lleguemos a poseerlo en toda su realidad en la renovación futura.

        Que seamos capaces de comprender la belleza de nuestra condición mediante esa belleza espiritual que crea tu voluntad inmortal en las mismas criaturas mortales.

        La crucifixión fue, Señor, el término de tu vida corporal; concédenos que nuestra mente quede también crucificada figuradamente en nuestra vida espiritual. Que tu resurrección, oh Jesús, preste su grandeza a nuestro hombre espiritual; que la contemplación de tus misterios nos sirva de espejo para conocerla.

        Tus designios divinos, oh Salvador nuestro, son figura del mundo espiritual; concédenos la gracia de correr en él como corresponde al hombre espiritual.

        No prives a nuestra mente de tu manifestación espiritual, ni apartes de nuestros miembros el calor de tu suavidad. La mortalidad latente en nuestro cuerpo nos lleva a la corrupción; que la difusión de tu amor espiritual repare sus efectos en nuestro corazón. Concédenos, Señor, llegar cuanto antes a nuestra ciudad y, al igual que Moisés desde la cumbre del monte, poseerla ya por tu revelación.
      autor: |-
        De los sermones de san Efrén, diácono
        (Sermón 3, De fine et admonitione; 2, 4-5: edición Lamy, 3, 216-222)
    resp2:
      ref: Sir 47, 10. 11. 12
      vr:
      - - R
        - Con todo su corazón amó a su Creador, entonándole himnos cada día; * trajo instrumentos musicales para servicio del altar y, con su acompañamiento, dio dulzura a los cantos. Aleluia.
      - - V
        - Para alabar el nombre santo del Señor, haciendo resonar desde la aurora el santuario.
      - - R
        - Trajo instrumentos musicales para servicio del altar y, con su acompañamiento, dio dulzura a los cantos. Aleluia.
San Eusebio de Vercelli, presbítero:
  nombre_libro: San Eusebio De Vercelli, Obispo
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Concédenos, Señor, Dios nuestro, imitar la fortaleza de tu obispo san Eusebio de Vercelli al proclamar su fe en la divinidad de tu Hijo, y haz que, perseverando en esa misma fe de la que fue maestro, merezcamos un día participar de la vida divina de Cristo. Él que vive y reina contigo. El mismo día 2 de agosto
  oficio:
    lectura2:
      titulo: HE CORRIDO HASTA LA META, HE MANTENIDO LA FE
      texto: |-
        He tenido noticias de vosotros, hermanos muy amados, y he sabido que estáis bien, como era mi deseo, y he tenido de pronto la sensación de que, atravesando la gran distancia que nos separa, me encontraba entre vosotros, igual como sucedió con Habacuc, que fue llevado por un ángel a la presencia de Daniel. Al recibir cada una de vuestras cartas y al leer en ellas vuestras santas disposiciones de ánimo y vuestro amor, las lágrimas se mezclaban con mi gozo y refrenaban mi avidez de leer; y era necesaria esta alternancia de sentimientos, ya que, en su mutuo afán de adelantarse el uno al otro, contribuían a una más plena manifestación de la intensidad de mi amor. Así, ocupado un día tras otro en esta lectura, me imaginaba que estaba hablando con vosotros y me olvidaba de los sufrimientos pasados; así, me sentía inundado de gozo al considerar

        vuestra fe, vuestro amor y los frutos que de ellos se derivan, a tal punto que, al sentirme tan feliz, era como si de repente no me hallara en el destierro, sino entre vosotros.

        Por tanto, hermanos muy amados, me alegro de vuestra fe, me alegro de la salvación, que es consecuencia de esta fe, me alegro del fruto que producís, el cual redunda en provecho no sólo de los que están entre vosotros, sino también de los que viven lejos; y, así como el agricultor se dedica al cultivo del árbol que da fruto y que, por lo tanto, no está destinado a ser talado y echado al fuego, así también yo quiero y deseo emplearme, en cuerpo y alma, en vuestro servicio, con miras a vuestra salvación.

        Por lo demás, esta carta he tenido que escribirla a duras penas y como he podido, rogando continuamente a Dios que sujetase por un tiempo a mis guardianes y me hiciese la merced de un diácono que, más que llevaros noticias de mis sufrimientos, os transmitiese mi carta de saludo, tal cual la he escrito. Por todo ello, os ruego encarecidamente que pongáis todo vuestro empeño en mantener la integridad de la fe, en guardar la concordia, en dedicaros a la oración, en acordaros constantemente de mí, para que el Señor se digne dar la libertad a su Iglesia, que en todo el mundo trabaja esforzadamente; y para que yo, que ahora estoy postergado, pueda, una vez liberado, alegrarme con vosotros.

        También pido y os ruego, por la misericordia de Dios, que cada uno de vosotros quiera ver en esta carta un saludo personal, ya que las circunstancias me impiden escribiros a cada uno personalmente como solía; por ello, en esta carta, me dirijo a todos vosotros, hermanos y santas hermanas, hijos e hijas, de cualquier sexo y edad, rogándoos que os conforméis con este saludo y que me hagáis el favor de transmitirlo también a los que, aun estando ausentes, se dignan favorecerme con su afecto.
      autor: |-
        De las cartas de san Eusebio de Vercelli, obispo
        (Carta 2,1, 3-2, 3; 10,1-11,1: CCL 9,104-105.109)
    resp2:
      ref: Lc 12, 35-36a; Mt 24, 42
      vr:
      - - R
        - Estén ceñidos vuestros lomos, y encendidas vuestras lámparas; * así seréis como los siervos que están esperando a su amo de regreso de las bodas.
      - - V
        - Velad, porque no sabéis cuándo vendrá vuestro Señor.
      - - R
        - Así seréis como los siervos que están esperando a su amo de regreso de las bodas.
San Fernando de Castilla, rey:
  nombre_libro: San Fernando
  comun_libro: santos-varones
  indicacion: Del Común de santos varones.
  oracion: Oh Dios, que elegiste al rey san Fernando como defensor de tu Iglesia en la tierra, escucha las súplicas de tu pueblo que te pide tenerlo como protector en el cielo. Por nuestro Señor Jesucristo. 31 de mayo
  oficio:
    lectura2:
      titulo: EL PODER TEMPORAL PUESTO AL SERVICIO DE DIOS Y DE LA IGLESIA
      texto: |-
        Fernando tercero, además de conquistador victorioso, fue gobernante modelo. Fomentó la restauración religiosa de España, en estrecha unión con el papa y con la jerarquía eclesiástica española. Con celo incansable promovió la organización de las sedes de Baeza, Jaén, Córdoba, Sevilla, Badajoz y Mérida. El aspecto más conocido y sobresaliente de su reinado es la Reconquista, que quedó virtualmente terminada en su tiempo. Protector de las ciencias y de las artes, la universidad de Salamanca le debe el comienzo de su florecimiento, y las catedrales de Burgos y Toledo lo proclaman mecenas de los artistas cristianos.

        En medio de las glorias del mundo, fue piadoso, generoso con los vencidos, humilde hasta penitenciarse en público, mortificado con cilicios; dado a la oración.

        A la vida y a la acción de san Fernando podrían aplicarse perfectamente aquellas palabras de san Agustín en su carta a Donato, procónsul de África:

        «¡Ojalá no se encontrara la Iglesia agitada por tan grandes aflicciones que tenga necesidad del auxilio de poder alguno temporal! Y puesto que eres tú el que socorres a la madre Iglesia, favoreciendo a sus sincerísimos hijos, ¿quién no verá que hemos recibido del cielo un no pequeño alivio en estas aflicciones, cuando un tal varón como tú, amantísimo del nombre de Cristo, ha ascendido a la dignidad real?»
      autor: Elogio de san Fernando
    resp2:
      ref: Cf. Jb 7, 1; cf. 2 Co 10, 4
      vr:
      - - R
        - No empleamos en nuestro combate armas carnales. * En el nombre de Dios somos capaces de arrasar fortalezas.
      - - V
        - Milicia es la vida del hombre sobre la tierra.
      - - R
        - En el nombre de Dios somos capaces de arrasar fortalezas.
San Fidel de Sigmaringen, presbítero y mártir:
  nombre_libro: San Fidel De Sigmaringa, Presbítero Y Mártir
  comun_libro: un-martir
  indicacion: Del Común de un mártir.
  oracion: Señor Dios, que te has dignado conceder la palma del martirio a san Fidel de Sigmaringa, cuando, abrasado en tu amor, se entregaba a la propagación de la fe; concédenos, te rogamos, que, arraigados como él, en el amor, lleguemos a conocer el poder de la resurrección de Jesucristo. Él que vive y reina contigo. 25 de abril
  oficio:
    lectura2:
      titulo: HOMBRE FIEL POR SU NOMBRE Y POR SU VIDA
      texto: |-
        El papa Benedicto catorce celebró la figura de san Fidel, defensor de la fe católica, con estas palabras:

        «Desplegando la plenitud de su caridad al socorro material de sus prójimos, acogía paternalmente a todos los pobres y los sustentaba haciendo colectas en favor suyo por todas partes.

        Remediaba la indigencia de los huérfanos y las viudas con las limosnas de los ricos; socorría a los presos con toda clase de ayudas materiales y espirituales, visitaba a los enfermos y los reconciliaba con Dios, preparándoles para el último combate.

        Su actividad más meritoria fue la que desplegó con ocasión de la peste que se declaró en el ejército austríaco, exponiéndose constantemente a las enfermedades y a la muerte.»

        Junto con esta caridad, Fidel —hombre fiel por su nombre y por su vida— sobresalió en la defensa de la fe católica que predicó incansablemente. Pocos días antes de morir y confirmar esa fe con su propia sangre, en su último sermón dejó lo que podríamos llamar su testamento:

        «¡Oh fe católica, qué estable y firme eres, qué bien arraigada, qué bien cimentada estás sobre roca inconmovible! El cielo y la tierra pasarán, pero tú nunca podrás pasar. El orbe entero te contradijo desde un principio, pero con tu poder triunfaste de todos.

        Lo que ha conseguido la victoria sobre el mundo es nuestra fe, que sometió al imperio de Cristo a los reyes más poderosos y puso a las naciones a su servicio.

        ¿Qué otra cosa, sino la fe, y principalmente la fe en la resurrección, hizo a los apóstoles y mártires soportar sus dificultades y sufrimientos?

        ¿Qué fue lo que hizo a los anacoretas despreciar los placeres y los honores y vivir en el celibato y la soledad, sino la fe viva?

        ¿Qué es lo que hoy lleva a los verdaderos cristianos a despreciar los placeres, resistir a la seducción y soportar rudos sufrimientos?

        La fe viva, activa en la práctica del amor, es la que hace dejar los bienes presentes por la esperanza de los futuros y trocar los primeros por los segundos.»
      autor: Elogio de san Fidel, presbítero y mártir
    resp2:
      ref: 2 Tm 4, 7-8; Flp 3, 8. 10
      vr:
      - - R
        - He combatido bien mi combate, he corrido hasta la meta, he mantenido la fe. * Ahora me aguarda la corona merecida. Aleluia.
      - - V
        - Lo perdí todo a fin de tener una íntima experiencia de Cristo y de la comunión con sus padecimientos, muriendo su misma muerte.
      - - R
        - Ahora me aguarda la corona merecida. Aleluia.
San Hermenegildo, mártir:
  nombre_libro: San Hermenegildo, Mártir
  comun_libro: un-martir
  indicacion: Del Común de un mártir.
  oracion: Oh Dios, que suscitaste en tu Iglesia a san Hermenegildo, mártir, como intrépido defensor de la fe, concédenos a cuantos veneramos hoy la memoria de su martirio la unidad en la confesión de tu nombre y la perseverancia en tu amor. Por nuestro Señor Jesucristo. 17 de abril
  oficio:
    lectura2:
      titulo: LA CARIDAD, GARANTÍA DE LA UNIDAD DE LA IGLESIA
      texto: |-
        Muchas son las olas que nos ponen en peligro, y una gran tempestad nos amenaza: sin embargo, no tememos ser sumergidos porque permanecemos de pie sobre la roca. Aun cuando el mar se desate, no romperá esta roca; aunque se levanten las olas, nada podrá contra la barca de Jesús. Decidme, ¿qué podemos temer? ¿La muerte? Para mí la vida es Cristo, y una ganancia el morir. ¿El destierro? Del Señor es la tierra y cuanto la llena. ¿La confiscación de los bienes? Sin nada vinimos al mundo y sin nada nos iremos de él. Yo me río de todo lo que es temible en este mundo y de sus bienes. No temo la muerte ni envidio las riquezas. No tengo deseos de vivir, si no es para vuestro bien espiritual. Por eso, os hablo de lo que sucede ahora exhortando vuestra caridad a la confianza.

        Nadie nos podrá separar. Lo que Dios ha unido, no puede separarlo el hombre. Del hombre y de la mujer se dice: Abandonará el hombre a su padre y a su madre, y se unirá a su mujer, y serán los dos una sola carne. De modo que ya no son dos, sino una sola carne. Pues lo que Dios ha unido que no lo separe el hombre.

        Si no puedes romper el vínculo conyugal, ¿cuánto menos podrás llegar a dividir la Iglesia? ¿No has oído aquella palabra del Señor: Donde dos o tres están reunidos en mi nombre, allí estoy yo en medio de ellos? Y, allí donde un pueblo numeroso esté reunido por los lazos de la caridad, ¿no estará presente el Señor?

        Cristo está conmigo, ¿qué puedo temer? Que vengan a asaltarme las olas del mar y la ira de los poderosos; todo eso no pesa más que una tela de araña.
      autor: |-
        De las homilías de san Juan Crisóstomo, obispo
        (Homilía antes de partir en exilio: PG 52, 427*-430)
    resp2:
      ref: Rm 8, 35. 38; Sal 26, 1
      vr:
      - - R
        - ¿Quién podrá apartarnos del amor de Cristo? * Ni la muerte ni la vida. (T. P. Aleluia.)
      - - V
        - El Señor es la defensa de mi vida, ¿quién me hará temblar?
      - - R
        - Ni la muerte ni la vida. (T. P. Aleluia.)
San Hilario de Poitiers, obispo y doctor de la Iglesia:
  nombre_libro: San Hilario, Obispo Y Doctor De La Iglesia
  comun_libro: pastores
  indicacion: Del Común de pastores o del Común de doctores de la Iglesia.
  oracion: Concédenos, Dios todopoderoso, progresar cada día en el conocimiento de la divinidad de tu Hijo y proclamarla con firmeza, como lo hizo, con celo infatigable, tu obispo y doctor san Hilario. Por Jesucristo nuestro Señor. 17 de enero
  oficio:
    lectura2:
      titulo: TE SERVIRÉ PREDICÁNDOTE
      texto: |-
        Yo tengo plena conciencia de que es a ti, Dios Padre omnipotente, a quien debo ofrecer la obra principal de mi vida, de tal suerte que todas mis palabras y pensamientos hablen de ti.

        Y el mayor premio que puede reportarme esta facultad de hablar, que tú me has concedido, es el de servirte predicándote a ti y demostrando al mundo, que lo ignora, o a los herejes, que lo niegan, lo que tú eres en realidad: Padre; Padre, a saber, del Dios unigénito.

        Y, aunque es ésta mi única intención, es necesario para ello invocar el auxilio de tu misericordia, para que hinches con el soplo de tu Espíritu las velas de nuestra fe y nuestra confesión, extendidas para ir hacia ti, y nos impulses así en el camino de la predicación que hemos emprendido. Porque merece toda confianza aquel que nos ha prometido: Pedid, y se os dará; buscad, y encontraréis; llamad, y se os abrirá.

        Somos pobres y, por esto, pedimos que remedies nuestra indigencia; nosotros ponemos nuestro esfuerzo tenaz en penetrar las palabras de tus profetas y apóstoles y llamamos con insistencia para que se nos abran las puertas de la comprensión de tus misterios; pero el darnos lo que pedimos, el hacerte encontradizo cuando te buscamos y el abrir cuando llamamos, eso depende de ti.

        Cuando se trata de comprender las cosas que se refieren a ti, nos vemos como frenados por la pereza y torpeza inherentes a nuestra naturaleza y nos sentimos limitados por nuestra inevitable ignorancia y debilidad; pero el estudio de tus enseñanzas nos

        dispone para captar el sentido de las cosas divinas, y la sumisión de nuestra fe nos hace superar nuestras culpas naturales.

        Confiamos, pues, que tú harás progresar nuestro tímido esfuerzo inicial y que, a medida que vayamos progresando, lo afianzarás, y que nos llamarás a compartir el espíritu de los profetas y apóstoles; de este modo, entenderemos sus palabras en el mismo sentido en que ellos las pronunciaron y penetraremos en el verdadero significado de su mensaje.

        Nos disponemos a hablar de lo que ellos anunciaron de un modo velado: que tú, el Dios eterno, eres el Padre del Dios eterno unigénito, que tú eres el único no engendrado y que el Señor Jesucristo es el único engendrado por ti desde toda la eternidad, sin negar, por esto, la unicidad divina, ni dejar de proclamar que el Hijo ha sido engendrado por ti, que eres un solo Dios, confesando, al mismo tiempo, que el que ha nacido de ti, Padre, Dios verdadero, es también Dios verdadero como tú.

        Otórganos, pues, un modo de expresión adecuado y digno, ilumina nuestra inteligencia, haz que no nos apartemos de la verdad de la fe; haz también que nuestras palabras sean expresión de nuestra fe, es decir, que nosotros, que por los profetas y apóstoles te conocemos a ti, Dios Padre, y al único Señor Jesucristo, y que argumentamos ahora contra los herejes que esto niegan, podamos también celebrarte a ti como Dios en el que no hay unicidad de persona y confesar a tu Hijo, en todo igual a ti.
      autor: |-
        Del tratado de san Hilario, obispo, sobre la Trinidad
        (Libro 1, 37-38: PL 10, 48-49)
    resp2:
      ref: 1 Jn 4, 2-3. 6. 15
      vr:
      - - R
        - Todo espíritu que reconozca a Jesucristo, que ha venido en la carne, es de Dios; pero el espíritu que no reconozca a Jesús no es de Dios. * En eso distinguimos al espíritu de la verdad y al espíritu del error.
      - - V
        - Quien confiese que Jesús es el Hijo de Dios, Dios permanece en él y él en Dios.
      - - R
        - En eso distinguimos al espíritu de la verdad y al espíritu del error.
San Ildefonso, obispo:
  nombre_libro: San Ildefonso, Obispo
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Dios todopoderoso, que hiciste a san Ildefonso insigne defensor de la virginidad de María; concede a los que creemos en este privilegio de la Madre de tu Hijo, sentirnos amparados por su poderosa y materna intercesión. Por Jesucristo nuestro Señor. 24 de enero
  oficio:
    lectura2:
      titulo: EN EL BAUTISMO, CRISTO ES QUIEN BAUTIZA
      texto: |-
        Vino el Señor para ser bautizado por el siervo. Por humildad, el siervo lo apartaba, diciendo: Soy yo el que necesito que tú me bautices, ¿y tú acudes a mí? Pero, por justicia, el Señor se lo ordenó, respondiendo: Déjalo ahora. Está bien que cumplamos así todo lo que Dios quiere.

        Después de esto, declinó el bautismo de Juan, que era bautismo de penitencia y sombra de la verdad, y empezó el bautismo de Cristo, que es la verdad, en el cual se obtiene la remisión de los pecados, aun cuando no bautizase Cristo, sino sus discípulos. En este caso, bautiza Cristo, pero no bautiza. Y las dos cosas son verdaderas: bautiza Cristo, porque es él quien purifica, pero no bautiza, porque no es él quien baña. Sus discípulos, en aquel tiempo, ponían las acciones corporales de su ministerio, como hacen también ahora los ministros, pero Cristo ponía el auxilio de su majestad divina. Nunca deja de bautizar el que no cesa de purificar; y, así, hasta el fin de los siglos, Cristo es el que bautiza, porque es siempre él quien purifica.

        Por tanto, que el hombre se acerque con fe al humilde ministro, ya que éste está respaldado por tan gran maestro. El maestro es Cristo. Y la eficacia de este sacramento reside no en las acciones del ministro, sino en el poder del maestro, que es Cristo.
      autor: |-
        Del libro de san Ildefonso, obispo, sobre el conocimiento del bautismo
        (Caps. 15-16: PL 96,117-118)
    resp2:
      ref: Rm 6, 3. 10
      vr:
      - - R
        - Los que por el bautismo nos incorporamos a Cristo * Fuimos incorporados a su muerte.
      - - V
        - Su morir fue un morir al pecado, su vivir es un vivir para Dios.
      - - R
        - Fuimos incorporados a su muerte.
San Isidro, labrador:
  nombre_libro: San Isidro, Labrador
  comun_libro: santos-varones
  indicacion: Del Común de santos varones.
  oracion: Señor, Dios nuestro, que en la humildad y sencillez de san Isidro labrador nos dejaste un ejemplo de vida escondida en ti, con Cristo; concédenos que el trabajo de cada día humanice nuestro mundo y sea al mismo tiempo plegaria de alabanza a tu nombre. Por nuestro Señor Jesucristo. 17 de mayo
  oficio:
    lectura2:
      titulo: SEMBRAD SIEMPRE BUENAS OBRAS
      texto: |-
        Sed ricos en buenas obras, dice el Señor. Éstas son las riquezas que debéis ostentar, que debéis sembrar. Éstas son las obras a las que se refiere el Apóstol, cuando dice que no debemos cansarnos de hacer el bien, pues a su debido tiempo recogeremos. Sembrad, aunque no veáis todavía lo que habéis de recoger. Tened fe y seguid sembrando. ¿Acaso el labrador, cuando siembra, contempla ya la cosecha? El trigo de tantos sudores, guardado en el granero, lo saca y lo siembra. Confía sus granos a la tierra. Y vosotros, ¿no confiáis vuestras obras al que hizo el cielo y la tierra?

        Fijaos en los que tienen hambre, en los que están desnudos, en los necesitados de todo, en los peregrinos, en los que están presos. Todos éstos serán los que os ayudarán a sembrar vuestras obras en el cielo... La cabeza, Cristo, está en el cielo, pero tiene en la tierra sus miembros. Que el miembro de Cristo dé al miembro de Cristo; que el que tiene dé al que necesita. Miembro eres tú de Cristo y tienes que dar, miembro es él de Cristo y tiene que recibir. Los dos vais por el mismo camino, ambos sois compañeros de ruta. El pobre camina agobiado; tú, rico, vas cargado. Dale parte de tu carga. Dale, al que necesita, parte de lo que a ti te pesa. Tú te alivias y a tu compañero le ayudas.
      autor: |-
        De los sermones de san Agustín, obispo
        (Sermón Morin 11, sobre las bienaventuranzas)
    resp2:
      ref: ''
      vr:
      - - R
        - Éste sí que realizó ante Dios obras realmente maravillosas, y alabó al Señor de todo corazón. * Que él interceda por los pecados de todos los pueblos.
      - - V
        - Éste fue un hombre paciente, que tributó a Dios un culto verdadero, se abstuvo de todo mal y se mantuvo en la inocencia.
      - - R
        - Que él interceda por los pecados de todos los pueblos.
San Jerónimo Emiliano, presbítero:
  nombre_libro: San Jerónimo Emiliani
  comun_libro: santos-varones
  indicacion: 'Del Común de santos varones: para los santos educadores.'
  oracion: Señor, Dios de las misericordias, que hiciste a san Jerónimo Emiliani padre y protector de los huérfanos, concédenos, por su intercesión, la gracia de permanecer siempre fieles al espíritu de adopción que nos hace verdaderamente hijos tuyos. Por Jesucristo nuestro Señor. El mismo día 8 de febrero
  oficio:
    lectura2:
      titulo: SÓLO EN EL SEÑOR DEBEMOS CONFIAR
      texto: |-
        Hermanos dilectísimos en Cristo e hijos de la Sociedad de los Siervos de los pobres: Os saluda vuestro humilde padre, y os exhorta a que perseveréis en el amor de Cristo y en la fiel observancia de la ley cristiana, tal como os lo demostré de palabra y obra cuando estaba con vosotros, a fin de que el Señor sea glorificado por mí en vosotros.

        Nuestro fin es Dios, fuente de todo bien, y, como decimos en nuestra oración, sólo en él debemos confiar, y no en otros. Nuestro Señor, que es benigno, queriendo aumentar vuestra fe (sin la cual, como dice el Evangelio, Cristo no pudo hacer muchos milagros) y escuchar vuestra oración, determinó que vivierais pobres, enfermos, afligidos, cansados y abandonados de todos, y que os vieseis incluso privados de mi presencia corporal, aunque no de la presencia espiritual de este vuestro pobre padre, que tanto os ama.

        Sólo Dios sabe por qué obra así con vosotros; pero podemos sospechar tres razones: La primera, que nuestro Señor os quiere contar entre sus hijos queridos, con tal que perseveréis en sus caminos; esto es lo que suele hacer con sus amigos para santificarlos.

        La otra razón es que pretende haceros confiar exclusivamente en él. Dios, como os he dicho, no realiza sus obras en aquellos que se resisten a depositar en él totalmente su fe y su esperanza; en cambio, infunde la plenitud de su caridad en aquellos que están llenos de fe y esperanza, y realiza grandes obras en ellos. Por eso, si tenéis auténtica fe y esperanza, hará con vosotros grandes cosas, él, que exalta a los humildes. Al hacer que me haya alejado de vosotros, y al alejar también a cualquier otro que goce de vuestro favor, Dios os da a elegir entre dos cosas: apartaros de la fe, volviendo a las cosas del mundo, o permanecer fuertes en la fe y obtener así su aprobación.

        He aquí pues, la tercera razón: Dios quiere probaros como al oro en el crisol. El fuego va consumiendo la ganga del oro, pero el oro bueno permanece y aumenta su valor: De igual modo se comporta Dios con su siervo bueno que espera y persevera en la tribulación. El Señor lo levanta y le devuelve, ya en este mundo, el ciento por uno de todo lo que dejó por amor suyo, y después le da la vida eterna.

        Así es como se comporta Dios con todos sus santos. Así hizo con el pueblo de Israel después de que pasó tantas tribulaciones en Egipto: lo condujo por el desierto entre prodigios, lo alimentó con el mana y sobre todo le dio la tierra prometida. Si vosotros perseveráis constantes en la fe en medio de las tentaciones, Dios os dar paz y descanso temporal en este mundo, y sosiego imperecedero en el otro.
      autor: |-
        De las cartas de san Jerónimo Emiliani a sus hermanos de religión
        (Venecia, 21 de junio de 1535)
    resp2:
      ref: 1 Pe 3, 8. 9; Rm 12, 10-11
      vr:
      - - R
        - 'Procurad todos tener un mismo pensar y un mismo sentir: con afecto fraternal, con ternura, con humildad; * porque vuestra vocación mira a esto: a heredar una bendición.'
      - - V
        - En cuanto a caridad fraterna, amaos entrañablemente unos a otros; en cuanto a la mutua estima, tened por más dignos a los demás; nada de pereza en vuestro celo, sirviendo con fervor de espíritu al Señor.
      - - R
        - 'Porque vuestra vocación mira a esto: a heredar una bendición.'
San Jorge, mártir:
  nombre_libro: San Jorge, Mártir
  comun_libro: un-martir
  indicacion: Del Común de un mártir.
  oracion: Señor, alabamos tu poder y te rogamos que san Jorge, fiel imitador de la pasión de tu Hijo, sea para nosotros protector generoso en nuestra debilidad. Por nuestro Señor Jesucristo. El mismo día 23 de abril
  oficio:
    lectura2:
      titulo: PROTEGIDO INEXPUGNABLEMENTE CON EL ESTANDARTE DE LA CRUZ
      texto: |-
        La festividad de hoy, queridos hermanos, duplica la alegría de la gloria pascual, y es como una piedra preciosa que da un nuevo esplendor al oro en que se incrusta.

        Jorge fue trasladado de una milicia a otra, pues dejó su cargo en el ejército, cambiándolo por la profesión de la milicia cristiana y, con la valentía propia de un soldado; repartió primero sus bienes entre los pobres, despreciando el fardo de los bienes del mundo, y así, libre y dispuesto, se puso la coraza de la fe y, cuando el combate se hallaba en todo su fragor, entró en él como un valeroso soldado de Cristo.

        Esta actitud nos enseña claramente que no se puede pelear por la fe con firmeza y decisión si no se han dejado primero los bienes terrenos.

        San Jorge, encendido en fuego del Espíritu Santo y protegiéndose inexpugnablemente con el estandarte de la cruz, peleó de tal modo con aquel rey inicuo, que, al vencer a este delegado de Satanás, venció al príncipe de la iniquidad y dio ánimos a los soldados de Cristo para combatir con valentía.

        Junto al mártir estaba el Árbitro invisible y supremo que, según sus designios, permitía a los impíos que le atormentaran. Si es verdad que entregaba su cuerpo en manos de los verdugos, guardaba su alma bajo su constante protección, escondiéndola en el baluarte inexpugnable de la fe.

        Hermanos carísimos: no debemos limitarnos a admirar a este combatiente de la milicia celeste, sino que debemos imitarle.

        Que nuestro espíritu se eleve hacia el premio de la gloria celestial, de modo que, centrado nuestro corazón en su contemplación, no nos dejemos doblegar, tanto si el mundo seductor se burla de nosotros como si con sus amenazas quiere atemorizarnos.

        Purifiquémonos, pues, de cualquier impureza de cuerpo o espíritu, siguiendo el mandato de Pablo, para poder entrar al fin en ese templo de la bienaventuranza al que se dirige ahora nuestra intención.

        El que dentro de este templo que es la Iglesia quiere ofrecerse a Dios en sacrificio necesita, una vez que haya sido purificado por el bautismo, revestirse luego de las diversas virtudes, como está escrito: Que tus sacerdotes se vistan de justicia; en efecto, quien renace en Cristo como hombre nuevo por el bautismo no debe volver a ponerse la mortaja del hombre viejo, sino la vestidura del hombre nuevo, viviendo con una conducta renovada.

        Así es como, limpios de las manchas del antiguo pecado y resplandecientes por el brillo de la nueva conducta, celebramos dignamente el misterio pascual e imitamos realmente el ejemplo de los santos mártires.
      autor: |-
        De los sermones de san Pedro Damiani, obispo
        (Sermón 3, Sobre san Jorge: PL 144, 567-571)
    resp2:
      ref: ''
      vr:
      - - R
        - Este santo combatió hasta la muerte por ser fiel al Señor, sin temer las amenazas de los enemigos; * pues estaba cimentado sobre roca firme. Aleluia.
      - - V
        - Él tuvo en menos la vida del mundo y llegó hasta el reino celestial.
      - - R
        - Pues estaba cimentado sobre roca firme. Aleluia.
San Josemaría Escrivá de Balaguer, presbítero:
  nombre_libro: San Josemaría Escrivá De Balaguer, Presbítero
  comun_libro: pastores
  oracion: Oh Dios, que has suscitado en la Iglesia a san Josemaría, sacerdote, para proclamar la vocación universal a la santidad y al apostolado, concédenos, por su intercesión y su ejemplo, que en el ejercicio del trabajo ordinario nos configuremos a tu Hijo Jesucristo y sirvamos con ardiente amor a la obra de la Redención. Por Jesucristo nuestro Señor.
  oficio:
    himno: Josemaría fue maestro, rector, padre nutricio
    lectura2:
      titulo: CONDUCIR EN MEDIO DEL MUNDO UNA VIDA VERDADERAMENTE CONTEMPLATIVA
      texto: |-
        Nos quedamos removidos, con una fuerte sacudida en el corazón, al escuchar atentamente aquel grito de San Pablo: ésta es la voluntad de Dios, vuestra santificación. Hoy, una vez más me lo propongo a mí, y os lo recuerdo también a vosotros y a la humanidad entera: ésta es la Voluntad de Dios, que seamos santos. Para pacificar las almas con auténtica paz, para transformar la tierra, para buscar en el mundo y a través de las cosas del mundo a Dios Señor nuestro, resulta indispensable la santidad personal. A cada uno llama a la santidad, de cada uno pide amor: jóvenes y ancianos, solteros y casados, sanos y enfermos, cultos e ignorantes, trabajen donde trabajen, estén donde estén. Hay un solo modo de crecer en la familiaridad y en la confianza con Dios: tratarle en la oración, hablar con Él, manifestarle —de corazón a corazón— nuestro afecto.

        Primero una jaculatoria, y luego otra, y otra...., hasta que parece insuficiente ese fervor, porque las palabras resultan pobres...: y se deja paso a la intimidad divina, en un mirar a Dios sin descanso y sin cansancio. Vivimos entonces como cautivos, como prisioneros. Mientras realizamos con la mayor perfección posible, dentro de nuestras equivocaciones y limitaciones, las tareas propias de nuestra condición y de nuestro oficio, el alma ansía escaparse. Se va hacia Dios, como el hierro atraído por la fuerza del imán. Se comienza a amar a Jesús, de forma más eficaz, con un dulce sobresalto. Pero no olvidéis que estar con Jesús es, seguramente, toparse con su Cruz. Cuando nos abandonamos en las manos de Dios, es frecuente que Él permita que saboreemos el dolor, la soledad, las contradicciones, las calumnias, las difamaciones, las burlas, por dentro y por fuera: porque quiere conformarnos a su imagen y semejanza, y tolera también que nos llamen locos y que nos tomen por necios. Al admirar y al amar de veras la Humanidad Santísima de Jesús, descubriremos una a una sus Llagas. Y en esos tiempos de purgación pasiva, penosos, fuertes, de lágrimas dulces y amargas que procuramos esconder, necesitaremos meternos dentro de cada una de aquellas Santísimas Heridas: para purificarnos, para gozarnos con esa Sangre redentora, para fortalecernos.

        El corazón necesita, entonces, distinguir y adorar a cada una de las Personas divinas. De algún modo, es un descubrimiento, el que realiza el alma en la vida sobrenatural, como los de una criaturica que va abriendo los ojos a la existencia. Y se entretiene amorosamente con el Padre y con el Hijo y con el Espíritu Santo; y se somete fácilmente a la actividad del Paráclito vivificador, que se nos entrega sin merecerlo. Sobran las palabras, porque la lengua no logra expresarse; ya el entendimiento se aquieta. No se discurre, ¡se mira! Y el alma rompe otra vez a cantar con cantar nuevo, porque se siente y se sabe también mirada amorosamente por Dios, a todas horas.

        Con esta entrega, el celo apostólico se enciende, aumenta cada día —pegando esta ansia a los otros—, porque el bien es difusivo. No es posible que nuestra pobre naturaleza, tan cerca de Dios, no arda en hambres de sembrar en el mundo entero la alegría y la paz, de regar todo con las aguas redentoras que brotan del Costado abierto de Cristo, de empezar y acabar todas las tareas por Amor.

        Que la Madre de Dios y Madre nuestra nos proteja, con el fin de que cada uno de nosotros pueda servir a la Iglesia en la plenitud de la fe, con los dones del Espíritu Santo y con la vida contemplativa.
      autor: |-
        De las Homilías de San Josemaría Escrivá de Balaguer, presbítero.
        (Hacia la santidad, ed. Palabra, Madrid 1973, pp. 7-9, 12-13, 20-21, 23-24, 32-33, 40-41,
        52)
    resp2:
      ref: Ef 1, 4; 1 Pe 2, 21
      vr:
      - - R
        - Dios nos eligió en la persona de Cristo, antes de crear el mundo, * para que fuésemos consagrados e irreprochables ante él por el amor.
      - - V
        - Cristo padeció por nosotros, dejándonos un ejemplo para que sigamos sus huellas.
      - - R
        - Para que fuésemos consagrados e irreprochables ante él por el amor.
  laudes:
    himno: Alabemos al Santo que nos mostró los caminos
    ant_benedictus: No me habéis elegido vosotros a mí, sino que yo os he elegido a vosotros, y os he destinado para que vayáis y deis fruto, y vuestro fruto permanezca.
  visperas:
    himno: Tú nos mostraste el sendero de lo ordinario
    ant_magnificat: Un mandamiento nuevo os doy, que os améis unos a otros; como yo os he amado, amaos también vosotros unos a otros.
San José de Calasanz, presbítero:
  nombre_libro: San José De Calasanz, Presbítero
  comun_libro: pastores
  indicacion: 'Del Común de santos varones: para educadores, o del Común de pastores.'
  oracion: Señor, Dios nuestro, que has enriquecido a san José de Calasanz con la caridad y la paciencia, para que pudiera entregarse sin descanso a la formación humana y cristiana de los niños, concédenos, te rogamos, imitar en su servicio a la verdad al que veneramos hoy como maestro de sabiduría. Por nuestro Señor Jesucristo. 26 de agosto
  oficio:
    lectura2:
      titulo: PROCUREMOS VIVIR UNIDOS A CRISTO Y AGRADARLE SÓLO A ÉL
      texto: |-
        Nadie ignora la gran dignidad y mérito que tiene el ministerio de instruir a los niños, principalmente a los pobres, ayudándolos así a conseguir la vida eterna. En efecto, la solicitud por instruirlos, principalmente en la piedad y en la doctrina cristiana, redunda en bien de sus cuerpos y de sus almas, y, por esto, los que a ello se dedican ejercen una función muy parecida a la de sus ángeles custodios.

        Además, es una gran ayuda para que los adolescentes de cualquier género o condición, se aparten del mal y se sientan suavemente atraídos e impulsados a la práctica del bien. La experiencia demuestra que, con esta ayuda, los adolescentes llegan a mejorar de tal modo su conducta, que ya no parecen los mismos de antes. Mientras son adolescentes, son como retoños de plantas que su educador puede inclinar en la dirección que le plazca, mientras que, si se espera a que endurezcan, ya sabemos la gran dificultad o, a veces, la total imposibilidad que supone el doblegarlos.

        La adecuada educación de los niños, principalmente de los pobres, no sólo contribuye al aumento de su dignidad humana, sino que es algo que merece la aprobación de todos los miembros de la sociedad civil y cristiana: de los padres, que son los primeros en alegrarse de que sus hijos sean conducidos por el buen camino; de los gobernantes, que obtienen así unos súbditos honrados y unos buenos ciudadanos; y, sobre todo, de la Iglesia, ya que son introducidos de un modo más eficaz en su multiforme manera de vivir y de obrar, como seguidores de Cristo y testigos del Evangelio.

        Los que se comprometen a ejercer con la máxima solicitud esta misión educadora han de estar dotados de una gran caridad, de una paciencia sin límites y, sobre todo, de una profunda humildad, para que así sean hallados dignos de que el Señor, si se lo piden con humilde afecto, los haga idóneos cooperadores de la verdad, los fortalezca en el cumplimiento de este nobilísimo oficio y les dé finalmente el premio celestial, según aquellas palabras de la

        Escritura: Los que enseñaron a muchos la justicia brillarán como las estrellas, por toda la eternidad.

        Todo esto conseguirán más fácilmente si, fieles a su compromiso perpetuo de servicio, procuran vivir unidos a Cristo y agradarle sólo a él, ya que él ha dicho: Cada vez que lo hicisteis con uno de éstos, mis humildes hermanos, conmigo lo hicisteis.
      autor: |-
        De los escritos de san José de Calasanz, presbítero
        (Memorial al cardenal M. A. Tonti, 1621: Ephemerides Calasantiae 36, 9-10,
        Roma 1967, pp. 473-474; L. Picanyol, Epistolario di S. Giuseppe Calasanzio, 9
        volúmenes, edición calasancia, Roma 1951-1956, passim)
    resp2:
      ref: 1 Ts 2, 8; Ga 4, 19
      vr:
      - - R
        - Queríamos daros no sólo el Evangelio de Dios, sino incluso nuestro propio ser, * porque habíais llegado a sernos muy queridos.
      - - V
        - Hijos míos, por quienes sufro de nuevo dolores de parto, hasta ver a Cristo formado en vosotros.
      - - R
        - Porque habíais llegado a sernos muy queridos.
San Juan Capistrano, presbítero:
  nombre_libro: San Juan De Capistrano, Presbítero
  comun_libro: pastores
  oracion: Oh Dios, que suscitaste a san Juan de Capistrano para confortar a tu pueblo en las adversidades, te rogamos humildemente que reafirmes nuestra confianza en tu protección y conserves en paz a tu Iglesia. Por nuestro Señor Jesucristo. 24 de octubre
  oficio:
    lectura2:
      titulo: LA VIDA DE LOS CLÉRIGOS VIRTUOSOS ILUMINA Y SERENA
      texto: |-
        Los que han sido llamados a ministrar en la mesa del Señor deben brillar por el ejemplo de una vida loable y recta, en la que no se halle mancha ni suciedad alguna de pecado. Viviendo honorablemente como sal de la tierra, para sí mismos y para los demás, e iluminando a todos con el resplandor de su conducta, como luz que son del mundo, deben tener presente la solemne advertencia del sublime maestro Cristo Jesús, dirigida no sólo a los apóstoles y discípulos, sino también a todos sus sucesores, presbíteros y clérigos: Vosotros sois la sal de la tierra. Pero si la sal se vuelve sosa, ¿con qué la salarán? No sirve más que para tirarla fuera y que la pise la gente.

        En verdad es pisado por la gente, como barro despreciable, el clero inmundo y sucio, impregnado de la sordidez de sus vicios y envuelto en las cadenas de sus pecados, considerado inútil para sí y para los demás; porque, como dice san Gregorio: "De aquel cuya vida está desprestigiada queda también desprestigiada la predicación."

        Los presbíteros que dirigen bien merecen doble honorario, sobre todo los que se atarean predicando y enseñando. En efecto, los presbíteros que se comportan con dignidad son acreedores a un doble honorario, material y personal, o sea, temporal y a la vez espiritual, que es lo mismo que decir transitorio y eterno al mismo tiempo; pues, aunque viven en la tierra sujetos a las limitaciones naturales como los demás mortales, su anhelo tiende a la convivencia con los ángeles en el cielo, para ser agradables al Rey, como prudentes ministros suyos. Por lo cual, como un sol que nace para el mundo desde las alturas donde habita Dios, alumbre la luz del clero a los hombres, para que vean sus buenas obras y den gloria al Padre que está en el cielo.

        Vosotros sois la luz del mundo. Pues, así como la luz no se ilumina a sí misma, sino que con sus rayos llena de resplandor todo lo que está a su alrededor, así también la vida luminosa de los clérigos virtuosos y justos ilumina y serena, con el fulgor de su santidad, a todos los que la observan. por consiguiente, el que está puesto al cuidado de los demás debe mostrar en sí mismo cómo deben conducirse los otros en la casa de Dios.
      autor: |-
        Del tratado "Espejo de los clérigos", de san Juan de Capistrano, presbítero
        (Parte 1, Venecia 1580, 2)
    resp2:
      ref: Si 4, 23-24; 2 Tm 4, 2
      vr:
      - - R
        - No retengas la palabra oportuna ni escondas tu sabiduría; * Pues hablando se muestra la sabiduría, y la inteligencia, en la respuesta de la lengua.
      - - V
        - Proclama la palabra, insiste a tiempo y a destiempo, reprende, reprocha, exhorta, con toda paciencia y deseo de instruir.
      - - R
        - Pues hablando se muestra la sabiduría, y la inteligencia, en la respuesta de la lengua.
San Juan Damasceno, presbítero y doctor de la Iglesia:
  nombre_libro: San Juan Damasceno, Presbítero Y Doctor De La Iglesia
  comun_libro: pastores
  indicacion: 'Del Común de pastores: para un presbítero, y de doctores de la Iglesia.'
  oracion: Te rogamos, Señor, que nos ayude en todo momento la intercesión de san Juan Damasceno, para que la fe verdadera que tan admirablemente enseñó sea siempre nuestra luz y nuestra fuerza. Por nuestro Señor Jesucristo. 6 de diciembre
  oficio:
    lectura2:
      titulo: ME LLAMASTE, SEÑOR, PARA SERVIR A TUS HIJOS
      texto: |-
        Tú, Señor, me sacaste de los lomos de mi padre; tú me formaste en el vientre de mi madre; tú me diste a luz niño y desnudo, puesto que las leyes de la naturaleza siguen tus mandatos.

        Con la bendición del Espíritu Santo preparaste mi creación y mi existencia, no por voluntad de varón, ni por deseo carnal, sino por una gracia tuya inefable. Previniste mi nacimiento con un cuidado superior al de las leyes naturales; pues me sacaste a la luz adoptándome como hijo tuyo y me contaste entre los hijos de tu Iglesia santa e inmaculada.

        Me alimentaste con la leche espiritual de tus divinas enseñanzas. Me nutriste con el vigoroso alimento del cuerpo de Cristo, nuestro Dios, tu santo Unigénito, y me

        embriagaste con el cáliz divino, o sea, con su sangre vivificante, que él derramó por la salvación de todo el mundo.

        Porque tú, Señor, nos has amado y has entregado a tu único y amado Hijo para nuestra redención, que él aceptó voluntariamente, sin repugnancia; más aún, puesto que él mismo se ofreció, fue destinado al sacrificio como cordero inocente, porque, siendo Dios, se hizo hombre y con su voluntad humana se sometió, haciéndose obediente a ti, Dios, su Padre, hasta la muerte, y una muerte de cruz.

        Así, pues, oh Cristo, Dios mío, te humillaste para cargarme sobre tus hombros, como oveja perdida, y me apacentaste en verdes pastos; me has alimentado con las aguas de la verdadera doctrina por mediación de tus pastores, a los que tú mismo alimentas para que alimenten a su vez a tu grey elegida y excelsa.

        Por la imposición de manos del obispo, me llamaste para servir a tus hijos. Ignoro por qué razón me elegiste; tú solo lo sabes.

        Pero tú, Señor, aligera la pesada carga de mis pecados, con los que gravemente te ofendí; purifica mi corazón y mi mente. Condúceme por el camino recto, tú que eres una lámpara que alumbra.

        Pon tus palabras en mis labios; dame un lenguaje claro y fácil, mediante la lengua de fuego de tu Espíritu, para que tu presencia siempre vigile.

        Apaciéntame, Señor, y apacienta tú conmigo, para que mi corazón no se desvíe a derecha ni izquierda, sino que tu Espíritu bueno me conduzca por el camino recto y mis obras se realicen según tu voluntad hasta el último momento.

        Y tú, cima preclara de la más íntegra pureza, excelente congregación de la Iglesia, que esperas la ayuda de Dios, tú, en quien Dios descansa, recibe de nuestras manos la doctrina inmune de todo error, tal como nos la transmitieron nuestros Padres, y con la cual se fortalece la Iglesia.
      autor: |-
        De la Declaración de la fe, de san Juan Damasceno
        (Cap. l: PG 95, 417-419)
    resp2:
      ref: Mt 2, 6; Sal 88, 22
      vr:
      - - R
        - «Una doctrina auténtica llevaba en su boca y en sus labios no se hallaba maldad; * en paz y rectitud andaba conmigo», dice el Señor.
      - - V
        - Mi mano estuvo siempre con él y mi brazo lo hizo valeroso.
      - - R
        - «En paz y rectitud andaba conmigo», dice el Señor.
San Juan Diego Cuauhtlatoatzin, religioso:
  nombre_libro: San Juan Diego De Cuauhtlatoatzin
  comun_libro: null
  oracion: Dios nuestro, que concediste a Juan Diego el privilegio de ser el mensajero de la siempre Virgen María de Guadalupe, Madre del Salvador, concédenos por su intercesión la gracia de transformarnos en templos vivos de tu reino. Por nuestro Señor Jesucristo. Laudes y vísperas
  oficio:
    himno: ¡Dancemos! ¡cantemos!
    lectura:
      ref: Ef 2, 19-22
      texto: Ya no sois extranjeros ni forasteros, sino que sois ciudadanos del pueblo de Dios y miembros de la familia de Dios. Estáis edificados sobre el cimiento de los apóstoles y profetas, y el mismo Cristo Jesús es la piedra angular. Por él todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado al Señor. Por él también os vais integrando en la construcción, para ser morada de Dios por el Espíritu.
    responsorio:
    - - V
      - Levanto mis ojos a los montes, ¿de dónde me vendrá el auxilio?
    - - R
      - Levanto mis ojos a los montes, ¿de dónde me vendrá el auxilio?
    - - V
      - Señor, por ti madrugo, dame una señal propicia.
    - - R
      - ¿De dónde me vendrá el auxilio?
    - - V
      - Gloria al Padre, y al Hijo, y al Espíritu Santo.
    - - R
      - Levanto mis ojos a los montes, ¿de dónde me vendrá el auxilio?
    ant_magnificat: ':'
    preces:
      intro: 'Alabemos a Dios Padre todopoderoso, el Creador por quien se vive, y digámosle:'
      respuesta: Señor, por quien vivimos, escucha nuestras plegarias.
      preces:
      - - Bendito seas, Señor del universo, que en tu inmensa piedad nos enviaste a la Madre de tu Hijo,
        - para llamarnos a la fe y hacernos ingresar en tu pueblo santo.
      - - Te bendecimos, Señor, porque ocultaste tu mensaje a los sabios y prudentes según el mundo y lo revelaste a los pequeños,
        - a los que son tenidos por insignificantes y despreciables.
      - - Concédenos ser, como Juan Diego, embajadores tuyos muy dignos de confianza,
        - que llevemos a todos los hombres y a todas las naciones tu mensaje de amor y de paz.
      - - Tú que, con la presencia de María, haces brillar los riscos como perlas y las espinas como el oro,
        - haz que el amor de la Santísima Virgen María nos transforme en otros cristos.
      - - Haz que, como Juan Diego, seamos siempre fieles al culto divino y a tus mandatos,
        - para que merezcamos, también nosotros, que la Virgen María nos salga al paso en el camino de nuestra vida.
      - - Tú que permitiste que los misioneros encontraran en los indígenas buenos colaboradores en la evangelización,
        - 'suscita en todos un testimonio de fe viva y operante en las condiciones ordinarias de la vida cotidiana. Con la confianza que nos da la predilección mostrada a Juan Diego por la Santa Madre de Dios hacia nosotros, digámosle al Padre de los Cielos, con profundo amor filial: Padre nuestro.'
    lectura2:
      titulo: LA VIRGEN MARÍA CONSOLÓ A JUAN DIEGO
      texto: |-
        Exaltó a los humildes (Lc 1, 52): Dios Padre puso su mirada en un humilde indígena mexicano, Juan Diego, al que enriqueció con el don de renacer en Cristo, de contemplar el rostro de la bienaventurada Virgen María y de unirlo a la evangelización del continente americano. De esta manera se muestra la verdad que encierran las palabras del Apóstol Pablo cuando enseña el método por el que se lleva a cabo la salvación.

        Lo plebeyo y despreciable del mundo, lo que no es, Dios lo eligió para vencer lo que es, para que ninguna carne se gloríe en presencia de Dios (1 Co 1, 28-29). Este beato que, según la tradición se llama Cuauhtlatoatzin, nombre que significa “águila habladora”, nació alrededor del año 1474 en Cuauhtitlan, en el reino conocido comúnmente como Texcoco. Ya adulto y habiendo contraído matrimonio, abrazó el Evangelio y fue bautizado junto con su esposa, dispuesto a vivir a la luz de la fe y de manera coherente con las obligaciones asumidas ante Dios y la Iglesia.

        En el mes de diciembre del año 1531, cuando caminaba hacia Tlatelolco, en el monte llamado Tepeyac se le apareció la Madre de Dios, que le ordenó que pidiese al obispo mexicano que se edificase un templo en el lugar de la parición. Ante las peticiones insistentes del indígena, el obispo exigió una prueba evidente del extraordinario suceso. El día 12 de diciembre, la bienaventurada Virgen María se volvió a aparecer a Juan Diego, lo

        consoló y le ordenó que se dirigiese a la cumbre del monte Tepeyac, donde habría de recoger unas flores y regresar con ellas. A pesar del frío invernal y de la aridez del lugar, el bienaventurado encontró unas flores bellísimas, las puso en su capa y las llevó a la Virgen. Ésta le ordenó que las entregase al obispo como señal de la verdad. En presencia del prelado, Juan Diego extendió la capa y dejó caer las flores; en ese momento apareció en el tejido de la capa, milagrosamente impresa, la imagen de la Virgen de Guadalupe, que desde entonces se convirtió en el centro espiritual de la nación.

        Cuando se construyó el templo en honor de “la Señora del cielo”, el beato, movido de gran piedad, dejó todo y consagró toda su vida a guardar aquel pequeño santuario y a recibir a los peregrinos. Recorrió el camino de la santidad en oración y caridad, sacando las fuerzas del banquete eucarístico de nuestro Redentor, del culto a la Madre del Redentor, de la comunión con la santa Iglesia y de la obediencia a los sagrados Pastores. Cuantos lo pudieron conocer, admiraron el esplendor de sus virtudes, sobre todo la fe, la esperanza, la caridad, la humildad y desprecio de las realidades terrenas.

        Juan Diego, con la sencillez de su vida cotidiana, guardó fielmente el Evangelio, que no había despreciado su condición indígena, consciente de que Dios no hace distinciones de linaje o de cultura e invita a todos para que sean sus hijos. De esta manera, el beato facilitó el camino para que los indígenas de México y del Nuevo Mundo se encontrasen con Cristo y la Iglesia. Hasta el último día de su vida caminó con Dios, que lo llamó a sí el año 1548. Su recuerdo, que siempre va unido a la aparición de nuestra Señora de Guadalupe, ha trascendido los siglos y ha alcanzado las diversas regiones de la tierra.
      autor: Del decreto del Papa Juan Pablo II (México, 31 de julio de 2002).
    resp2:
      ref: Cf. 1 Co 1, 27-29; Lc 1, 51-52
      vr:
      - - R
        - Dios eligió lo débil del mundo para confundir lo fuerte; lo que no es, * para que ninguna carne se gloríe en presencia de Dios.
      - - V
        - Hizo proezas con su brazo y exaltó a los humildes.
      - - R
        - Para que ninguna carne se gloríe en presencia de Dios.
San Juan Eudes, presbítero:
  nombre_libro: San Juan Eudes, Presbítero
  comun_libro: pastores
  indicacion: 'Del Común de pastores o del Común de santos varones: para religiosos.'
  oracion: Oh Dios, que elegiste a san Juan Eudes para anunciar al mundo las insondables riquezas del misterio de Cristo, concédenos, te rogamos, que por su palabra y su ejemplo crezcamos en el conocimiento de tu verdad y vivamos según el Evangelio. Por nuestro Señor Jesucristo. El mismo día 19 de agosto
  oficio:
    lectura2:
      titulo: FUENTE DE SALVACIÓN Y DE VIDA VERDADERA
      texto: |-
        Te pido que pienses que nuestro Señor Jesucristo es realmente tu cabeza y que tú eres uno de sus miembros.

        Él es para ti como la cabeza para con los miembros; todo lo suyo es tuyo: el espíritu, el corazón, el cuerpo, alma y todas sus facultades, y tú debes usar de todo ello como de algo propio, para que, sirviéndolo, lo alabes, ames y lo glorifiques. En cuanto a ti, eres para él como el miembro para con la cabeza, por lo cual él desea intensamente usar de todas tus facultades como propias, para servir y glorificar al Padre.

        Y él no es para ti sólo eso que hemos dicho, sino que además quiere estar en ti, viviendo y dominando en ti a la manera que la cabeza vive en sus miembros y los gobierna. Quiere que todo lo que hay en él viva y domine en ti: su espíritu en tu espíritu, su corazón en él tuyo, todas las facultades de su alma en las tuyas, de modo que en ti se realicen aquellas palabras: Glorificad a Dios con vuestro cuerpo, y que la vida de Jesús se manifieste en vosotros.

        Igualmente, tú no sólo eres para el Hijo de Dios sino que debes estar en él como los miembros están en la cabeza. Todo lo que hay en ti debe ser injertado en él, y de él debes recibir la vida y ser gobernado por él. Fuera de él no hallarás la vida verdadera, ya que él es la única fuente de vida verdadera; fuera de él no hallarás sino muerte y destrucción. Él ha de ser el único principio de toda tu actividad y de todas tus energías; debes vivir de él y por él, para que en ti se cumplan aquellas palabras: Ninguno de nosotros vive para sí mismo y ninguno muere para sí mismo. Si vivimos, vivimos para el Señor: si

        morimos, morimos para el Señor; en la vida y en la muerte somos del Señor. Para esto murió y resucitó Cristo: para ser Señor de vivos y muertos.

        Eres, por tanto, una sola cosa con Jesús, del mismo modo que los miembros son una sola cosa con la cabeza, por eso, debes tener con él un solo espíritu, una sola alma, una sola vida, una sola voluntad, un solo sentir, un solo corazón. Y él debe ser tu espíritu, tu corazón, tu amor, tu vida y todo lo tuyo. Todas estas grandezas del cristiano tienen su origen en el bautismo, son aumentadas y corroboradas por el sacramento de la confirmación y por el buen empleo de las demás gracias comunicadas por Dios, que en la sagrada eucaristía encuentran su mejor complemento.
      autor: |-
        Del tratado de san Juan Eudes, presbítero, sobre el admirable Corazón de
        Jesús
        (Libro 1, 5: Opera omnia 6,107.113-115)
    resp2:
      ref: Rm 14, 9. 8. 7
      vr:
      - - R
        - Para esto murió Cristo y retornó a la vida, para ser Señor de vivos y muertos. * Pues tanto en vida como en muerte somos del Señor.
      - - V
        - Ninguno de nosotros vive para sí y ninguno muere para sí. Que si vivimos, vivimos para el Señor; y si morimos, para el Señor morimos.
      - - R
        - Pues tanto en vida como en muerte somos del Señor.
San Juan de Ávila, presbítero y doctor de la Iglesia:
  nombre_libro: San Juan De Ávila, Presbítero
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Oh Dios, que hiciste de san Juan de Ávila un maestro ejemplar para tu pueblo por la santidad de su vida y por su celo apostólico, haz que también en nuestros días crezca la Iglesia en santidad por el celo ejemplar de tus ministros. Por nuestro Señor Jesucristo. 12 de mayo
  oficio:
    lectura2:
      titulo: EL SACERDOTE DEBE SER SANTO
      texto: |-
        No sé otra cosa más eficaz con que a vuestras mercedes persuada lo que les conviene hacer que con traerles a la memoria la alteza del beneficio que Dios nos ha hecho en llamarnos para la alteza del oficio sacerdotal. Y si elegir sacerdotes entonces era gran beneficio, ¿qué será en el nuevo Testamento, en el cual los sacerdotes de él somos como sol en comparación de noche y como verdad en comparación de figura?

        Mirémonos, padres, de pies a cabeza, ánima y cuerpo, y vernos hecho semejantes a la sacratísima Virgen María, que con sus palabras trajo a Dios a su vientre, y semejantes al

        portal de Belén y pesebre donde fue reclinado, y a la cruz donde murió, y al sepulcro donde fue sepultado. Y todas estas son cosas santas, por haberlas Cristo tocado; y de lejanas tierras van a las ver, y derraman de devoción muchas lágrimas, y mudan sus vidas movidos por la gran santidad de aquellos lugares. ¿Por qué los sacerdotes no son santos, pues es lugar donde Dios viene glorioso, inmortal, inefable, como no vino en los otros lugares? Y el sacerdote le trae con las palabras de la consagración, y no lo trajeron los otros lugares, sacando a la Virgen. Relicarios somos de Dios, casa de Dios y, a modo de decir, criadores de Dios; a los cuales nombres conviene gran santidad.

        Esto, padres, es ser sacerdotes: que amansen a Dios cuando estuviere, ¡ay!, enojado con su pueblo; que tengan experiencia que Dios oye sus oraciones y les da lo que piden, y tengan tanta familiaridad con él; que tengan virtudes más que de hombres y pongan admiración a los que los vieren: hombres celestiales o ángeles terrenales; y aun, si pudiere ser, mejor que ellos, pues tienen oficio más alto que ellos.
      autor: |-
        De una plática de san Juan de Ávila, presbítero
        (Plática enviada al padre Francisco Gómez, S. I:, para ser predicada en el Sínodo
        diocesano de Córdoba del año 1563: BAC 304, Obras completas del santo maestro Juan
        de Ávila, 3, pp. 364-365. 370. 373)
    resp2:
      ref: 1 Ts 2, 8; Ga 4, 19
      vr:
      - - R
        - Queríamos daros no sólo el Evangelio de Dios, sino incluso nuestro propio ser, * porque habíais llegado a sernos muy queridos.
      - - V
        - Hijos míos, por quienes sufro de nuevo dolores de parto, hasta ver a Cristo formado en vosotros.
      - - R
        - Porque habíais llegado a sernos muy queridos.
San Leandro de Sevilla, obispo:
  nombre_libro: San Leandro, Obispo
  comun_libro: pastores
  indicacion: 'Del Común de pastores: obispos, o del Común de santos varones.'
  oracion: Oh Dios, que por medio de tu obispo san Leandro mantuviste en tu Iglesia la integridad de la fe, concede a tu pueblo permanecer siempre libre de todos los errores. Por nuestro Señor Jesucristo. 15 de noviembre
  oficio:
    lectura2:
      titulo: (PL 72, 894-895) GOZO DE LA UNIDAD DE LA IGLESIA
      texto: |-
        Regocíjate y alégrate, Iglesia de Dios, gózate porque formas un solo cuerpo para Cristo. Ármate de fortaleza y llénate de júbilo. Tus aflicciones se han convertido en gozo. Tu traje de tristeza se cambiará por el de alegría. Ya queda atrás tu esterilidad y pobreza. En un solo parto diste a Cristo innumerables pueblos. Grande es tu Esposo, por cuyo imperio eres gobernada. Él convierte en gozo tus sufrimientos y te devuelve a tus enemigos convertidos en amigos.

        No llores ni te apenes, porque algunos de tus hijos se hayan separado de ti temporalmente. Ahora vuelven a tu seno gozosos y enriquecidos.

        Fíate de tu cabeza, que es Cristo. Afiánzate en la fe. Se han cumplido las antiguas promesas. Sabes cuál es la dulzura de la caridad y el deleite de la unidad. No predicas sino la unión de las naciones. No aspiras más que a la unidad de los pueblos. No siembras más que semillas de paz y caridad. Alégrate en el Señor, porque no has sido defraudada en tus sentimientos. Pasados los hielos invernales y el rigor de las nieves, has dado a luz, como fruto delicioso, como suaves flores de primavera, a aquellos que concebiste entre gemidos y oraciones ininterrumpidas.
      autor: |-
        De la homilía pronunciada por san Leandro, obispo, en honor de la Iglesia, al
        final del Concilio tercero de Toledo
    resp2:
      ref: Jn 10, 11. 14
      vr:
      - - R
        - Yo soy el buen Pastor —dice el Señor—; * El buen Pastor da la vida por las ovejas. v. Conozco a mis ovejas, y ellas me conocen.
      - - R
        - El buen Pastor da la vida por las ovejas.
San Lorenzo de Brindisi, presbítero y doctor de la Iglesia:
  nombre_libro: San Lorenzo De Brindis, Presbítero Y Doctor De La Iglesia
  comun_libro: pastores
  indicacion: Del Común de pastores o del Común de doctores de la Iglesia.
  oracion: Oh Dios, que para gloria de tu nombre y salvación de las almas otorgaste a san Lorenzo de Brindis espíritu de consejo y fortaleza, concédenos llegar a conocer con ese mismo espíritu las cosas que debemos realizar y la gracia de llevarlas a la práctica después de conocerlas. Por Jesucristo nuestro Señor. 22 de julio
  oficio:
    lectura2:
      titulo: LA PREDICACIÓN ES UNA FUNCIÓN APOSTÓLICA
      texto: |-
        Para llevar una vida espiritual, que nos es común con los ángeles y los espíritus celestes y divinos, ya que ellos y nosotros hemos sido creados a imagen y semejanza de Dios, es necesario el pan de la gracia del Espíritu Santo y de la caridad de Dios. Pero la gracia y la caridad son imposibles sin la fe, ya que sin la fe es imposible agradar a Dios. Y esta fe se origina necesariamente de la predicación de la palabra de Dios: La fe nace del mensaje, y el mensaje consiste en hablar de Cristo. Por tanto, la predicación de la palabra de Dios es necesaria para la vida espiritual, como la siembra es necesaria para la vida del cuerpo.

        Por esto, dice Cristo: Salió el sembrador a sembrar su semilla. Salió el sembrador a pregonar la justicia, y este pregonero, según leemos, fue algunas veces el mismo Dios, como cuando en el desierto dio a todo el pueblo, de viva voz bajada del cielo, la ley de justicia; fue otras veces un ángel del Señor, como cuando en el llamado "lugar de los que lloran" echó en cara al pueblo sus transgresiones de la ley divina, y todos los hijos de Israel, al oír sus palabras, se arrepintieron y lloraron todos a voces; también Moisés predicó a todo el pueblo la ley del Señor, en las campiñas de Moab, como sabemos por el Deuteronomio. Finalmente, vino Cristo, Dios y hombre, a predicar la palabra del Señor, y para ello envió también a los apóstoles, como antes había enviado a los profetas.

        Por consiguiente, la predicación es una función apostólica, angélica, cristiana, divina. Así comprendemos la múltiple riqueza que encierra la palabra de Dios, ya que es como el tesoro en que se hallan todos los bienes. De ella proceden la fe, la esperanza, la caridad, todas las virtudes, todos los dones del Espíritu Santo, todas las bienaventuranzas evangélicas, todas las buenas obras, todos los actos meritorios, toda la gloria del paraíso: Aceptad dócilmente la palabra que ha sido plantada y es capaz de salvaros.

        La palabra de Dios es luz para el entendimiento, fuego para la voluntad, para que el hombre pueda conocer y amar a Dios; y para el hombre interior, el que vive por la gracia del Espíritu Santo, es pan y agua, pero un pan más dulce que la miel y el panal, un agua mejor que el vino y la leche; es para el alma un tesoro espiritual de méritos, y por esto es comparada al oro y a la piedra preciosa; es como un martillo que doblega la dureza del corazón obstinado en el vicio; y como una espada que da muerte a todo pecado, en nuestra lucha contra la carne, el mundo y el demonio.
      autor: |-
        De los sermones de san Lorenzo de Brindis, presbítero
        (Sermón cuaresmal 2: Opera omnia 5,1, Núms. 48. 50. 52)
    resp2:
      ref: Is 40, 9; Lc 9, 59. 60
      vr:
      - - R
        - 'Súbete a un monte elevado, heraldo de Sión; * di a las ciudades de Judá: «Aquí está vuestro Dios.»'
      - - V
        - Sígueme y ven a anunciar el reino de los cielos.
      - - R
        - 'Di a las ciudades de Judá: «Aquí está vuestro Dios.»'
San Luis María Grignon de Montfort, presbítero:
  nombre_libro: San Luis María Grignon De Monfort, Presbítero
  comun_libro: pastores
  indicacion: 'Del Común de pastores: presbíteros, o del Común de santos varones.'
  oracion: Oh Dios, sabiduría eterna, que hiciste al presbítero San Luis María insigne testigo y maestro de la total consagración a Cristo, tu Hijo, por mano de su Madre, la bienaventurada Virgen María; concédenos que, siguiendo su mismo camino espiritual, podamos extender tu reino en el mundo. Por nuestro Señor Jesucristo. 29 de abril
  oficio:
    lectura2:
      titulo: TODO TUYO
      texto: |-
        Siendo así que la cumbre de nuestra perfección consiste en estar identificados, unidos y consagrados a Jesucristo, la mejor devoción es, sin duda, la que más perfectamente nos identifica con Cristo, nos une y nos consagra a él. Y pues María es entre todas las criaturas la más plenamente conforme con su Hijo, de ahí que entre todas las devociones, la que más consagra e identifica a una persona con nuestro Señor es la devoción a la Santísima Virgen, su Madre; y cuanto más se consagre la persona a María, más consagrada estará a Jesucristo.

        Por tanto, la consagración perfecta a Jesucristo no es sino la suma y plena consagración de sí mismo a la Santísima Virgen. Y ésta es la devoción que enseño.

        Esta forma de devoción se puede llamar muy bien una perfecta renovación de los votos y promesas del bautismo. Pues en ella, el fiel cristiano se entrega todo entero a la Santísima Virgen, y así, por María es todo de Cristo.

        De donde resulta que una persona, a la vez queda consagrada a la Santísima Virgen y a Jesucristo: a la Virgen María porque es el camino más apto que el mismo Jesús escogió para unirse a nosotros y unirnos a él; y a Jesús, el Señor, nuestro fin último, es al que debemos todo cuanto somos como a nuestro Redentor y nuestro Dios.

        Además, hay que tener en cuenta que toda persona cuando recibe el Bautismo, por sus propias palabras o las del padrino o madrina renuncia solemnemente a Satanás, a sus tentaciones y sus obras, y escoge a Jesucristo como su Maestro y supremo Señor, dispuesto a obedecerle como esclavo de amor. Pues bien, esto es lo que se realiza en la presente devoción. El cristiano renuncia al demonio, al mundo, al pecado y a sí mismo, y se entrega todo entero a Jesucristo por manos de María.

        En el Bautismo, no se da uno —al menos expresamente— a Jesucristo por manos de María, ni se hace al Señor entrega del mérito de las buenas obras. Y después del Bautismo, queda todavía el cristiano totalmente libre para aplicar estos méritos a los demás o retenerlos en favor propio. En cambio, con esta devoción el fiel cristiano explícitamente se da a nuestro Señor por manos de María y le entrega totalmente el valor de sus buenas obras.
      autor: |-
        Del Tratado "De la verdadera devoción a la Santísima Virgen", por San Luis M. Griñón de
        Montfort, presbítero.
        (nn. 120-121.125-126: oeuvres completes, Seuil, Paris 1966, 562-563.566-567). (cf. Obras
        completas, BAC, n. 451).
    resp2:
      ref: Sal 115, 16-18
      vr:
      - - R
        - Señor, yo soy tu siervo e hijo de tu esclava. * Te ofreceré un sacrificio de alabanza, aleluia.
      - - V
        - Cumpliré al Señor mis votos en presencia de todo el pueblo.
      - - R
        - Te ofreceré un sacrificio de alabanza, aleluia.
San Luis de Francia, rey:
  nombre_libro: San Luís De Francia
  comun_libro: santos-varones
  indicacion: Del Común de santos varones.
  oracion: Oh Dios, que has trasladado a san Luis de Francia desde los afanes del gobierno temporal al reino de tu gloria, concédenos, por su intercesión, buscar ante todo tu reino en medio de nuestras ocupaciones temporales. Por nuestro Señor Jesucristo. El mismo día 25 de agosto
  oficio:
    lectura2:
      titulo: EL REY JUSTO HACE ESTABLE EL PAÍS
      texto: |-
        Hijo amadísimo, lo primero que quiero enseñarte es que ames al Señor, tu Dios, con todo tu corazón y con todas tus fuerzas; sin ello no hay salvación posible.

        Hijo, debes guardarte de todo aquello que sabes que desagrada a Dios, esto es, de todo pecado mortal, de tal manera que has de estar dispuesto a sufrir toda clase de martirios antes que cometer un pecado mortal.

        Además, si el Señor permite que te aflija alguna tribulación, debes soportarla generosamente y con acción de gracias, pensando que es para tu bien y que es posible que la hayas merecido. Y, si el Señor te concede prosperidad, debes darle gracias con humildad y vigilar que no sea en detrimento tuyo, por vanagloria o por cualquier otro motivo, porque los dones de Dios no han de ser causa de que le ofendas.

        Asiste, de buena gana y con devoción, al culto divino y, mientras estés en el templo, guarda recogida la mirada y no hables sin necesidad, sino ruega devotamente al Señor con oración vocal o mental.

        Ten piedad para con los pobres, desgraciados y afligidos, y ayúdalos y consuélalos según tus posibilidades. Da gracias a Dios por todos sus beneficios, y así te harás digno de recibir otros mayores. Para con tus súbditos obra con toda rectitud y justicia, sin desviarte a la derecha ni a la izquierda; ponte siempre más del lado del pobre que del rico, hasta que averigües de qué lado está la razón. Pon la mayor diligencia en que todos tus súbditos vivan en paz y con justicia, sobre todo las personas eclesiásticas y religiosas.

        Sé devoto y obediente a nuestra madre, la Iglesia romana, y al sumo pontífice, nuestro padre espiritual. Esfuérzate en alejar de tu territorio toda clase de pecado, principalmente la blasfemia y la herejía.

        Hijo amadísimo, llegado al final, te doy toda la bendición que un padre amante puede dar a su hijo; que la santísima Trinidad y todos los santos te guarden de todo mal. Y que el Señor te dé la gracia de cumplir su voluntad, de tal manera que reciba de ti servicio y honor, y así, después de esta vida, los dos lleguemos a verlo, amarlo y alabarlo sin fin. Amén.
      autor: |-
        Del testamento espiritual de san Luis a su hijo
        (Acta Sanctorum Augusti 5 [1868), 546)
    resp2:
      ref: 2 R 18, 3. 5. 6. 7
      vr:
      - - R
        - 'Hizo lo que es recto a los ojos del Señor; entre todos los reyes no hubo otro semejante a él: * se unió al Señor y no se apartó de él.'
      - - V
        - Guardó sus mandamientos y el Señor estuvo con él
      - - R
        - Se unió al Señor y no se apartó de él.
San Marcelino y Pedro, mártires:
  nombre_libro: San Marcelino Y San Pedro, Mártires
  comun_libro: null
  indicacion: Del Común de mártires.
  oracion: Señor, tú has hecho del glorioso testimonio de tus mártires san Marcelino y san Pedro nuestra protección y defensa; concédenos la gracia de seguir sus ejemplos y de vernos continuamente sostenidos por su intercesión. Por Jesucristo nuestro Señor. 3 de junio
  oficio:
    lectura2:
      titulo: LOS QUE SON COMPAÑEROS DE CRISTO EN EL SUFRIR TAMBIÉN LO SON EN EL BUEN ÁNIMO
      texto: |-
        Si hemos pasado de la muerte a la vida, al pasar de la infidelidad a la fe, no nos extrañemos de que el mundo nos odie. Pues quien no ha pasado aún de la muerte a la vida, sino que permanece en la muerte, no puede amar a quienes salieron de las tinieblas y han entrado, por así decirlo, en esta mansión de la luz edificada con piedras vivas.

        Jesús dio su vida por nosotros; demos también nuestra vida, no digo por él, sino por nosotros mismos y, me atrevería a decirlo, por aquellos que van a sentirse alentados por nuestro martirio.

        Nos ha llegado, oh cristiano, el tiempo de gloriarnos. Pues dice la Escritura: Nos gloriamos en las tribulaciones, sabiendo que la tribulación produce constancia, la constancia, virtud probada, la virtud, esperanza, y la esperanza no defrauda, porque el amor de Dios ha sido derramado en nuestros corazones con el Espíritu Santo que se nos ha dado.

        Si los sufrimientos de Cristo rebosan sobre nosotros, gracias a Cristo rebosa en proporción nuestro ánimo; aceptemos, pues, con gran gozo los padecimientos de Cristo, y que se multipliquen en nosotros, si realmente apetecemos un abundante consuelo, como lo obtendrán todos aquellos que lloran. Pero este consuelo seguramente superará a los

        sufrimientos, ya que, si hubiera una exacta proporción, no estaría escrito: Si los sufrimientos de Cristo rebosan sobre nosotros, rebosa en proporción nuestro ánimo.

        Los que se hacen solidarios de Cristo en sus padecimientos participarán también, de acuerdo con su grado de participación, en sus consuelos. Tal es el pensamiento de Pablo, que afirma con toda confianza: Si sois compañeros en el sufrir, también lo sois en el buen ánimo.

        Dice también Dios por el Profeta: En el tiempo de gracia te he respondido, en el día de salvación te he auxiliado. ¿Qué tiempo puede ofrecerse más aceptable que el momento en el que, por nuestra fe en Dios por Cristo, somos escoltados solemnemente al martirio, pero como triunfadores, no como vencidos?

        Los mártires de Cristo, con su poder, derrotan a los principados y potestades y triunfan sobre ellos, para que, al ser solidarios de sus sufrimientos, tengan también parte en lo que él consiguió por medio de su fortaleza en los sufrimientos.

        Por tanto, el día de salvación no es otro que aquel en que de este modo salís de este mundo.

        Pero, os lo ruego: Para no poner en ridículo nuestro ministerio, nunca deis a nadie motivo de escándalo; al contrario; continuamente dad prueba de que sois ministros de Dios con lo mucho que pasáis, diciendo: Y ahora, Señor, ¿qué esperanza me queda? Tú eres mi confianza.
      autor: |-
        De la Exhortación al martirio, de Orígenes, presbítero
        (Núms. 41-42: PG 11, 618-619)
    resp2:
      ref: Ef 6, 12. 14. 13
      vr:
      - - R
        - Nuestra lucha no es contra hombres de carne y hueso, sino contra los principados y potestades, contra los espíritus del mal. * Tened, pues, ceñida vuestra cintura con la verdad. Aleluia.
      - - V
        - Echad mano de la armadura de Dios, para que podáis resistir en el día malo y, vencidos todos los enemigos, quedar dueños del campo.
      - - R
        - Tened, pues, ceñida vuestra cintura con la verdad. Aleluia.
San Nicolás, obispo:
  nombre_libro: San Nicolás, Obispo
  comun_libro: pastores
  indicacion: 'Del Común de pastores: para un obispo.'
  oracion: Imploramos, Señor, tu misericordia y te suplicamos que, por la intercesión de tu obispo san Nicolás, nos protejas en todos los peligros, para que podamos caminar seguros por la senda de la salvación. Por nuestro Señor Jesucristo. 7 de diciembre
  oficio:
    lectura2:
      titulo: QUE LA FUERZA DEL AMOR SUPERE EL PESAR POR LA MUERTE
      texto: |-
        Primero pregunta el Señor lo que ya sabía, y no sólo una vez, sino dos y tres veces: si Pedro le ama, y otras tantas veces le oye decir que le ama, y otras tantas veces no le recomienda otra cosa sino que apaciente sus ovejas.

        A la triple negación corresponde la triple confesión, para que la lengua no fuese menos esclava del amor que del temor, y para que no pareciese que la inminencia de la muerte le obligó a decir más palabras que la presencia de la vida. Sea servicio del amor el apacentar la grey del Señor; como fue señal del temor la negación del Pastor.

        Los que apacientan las ovejas de Cristo con la disposición de que sean suyas y no de Cristo demuestran que se aman a sí mismos y no a Cristo.

        Contra estos tales nos ponen continuamente en guardia estas palabras de Cristo, como también las del Apóstol, quien se queja de los que buscan sus propios intereses, no los de Jesucristo.

        Pues qué significa: ¿Me amas? Apacienta mis ovejas, sino lo siguiente: «Si me amas, no pienses en apacentarte a ti mismo, sino a mis ovejas; apaciéntalas como mías, no como tuyas; busca mi gloria en ellas, no la tuya; mi propiedad, no la tuya; mis intereses, y no los tuyos; no te encuentres nunca en compañía de aquellos que pertenecen a los tiempos peligrosos, puesto que se aman a sí mismos y aman todas aquellas cosas que se deducen de este mal principio.»

        Los que apacientan las ovejas de Cristo que no se amen a sí mismos, para que no las apacienten como propias, sino como de Cristo.

        EL defecto que más deben de evitar los que apacientan las ovejas de Cristo consiste en buscar sus intereses propios, y no los de Jesucristo, y en utilizar para sus propios deseos a aquellos por quienes Cristo derramó su sangre.

        El amor de Cristo debe crecer hasta tal grado de ardor espiritual en aquel que apacienta sus ovejas, que supere también el natural temor a la muerte, por el que no queremos morir aun cuando queremos vivir con Cristo.

        Pero, por muy grande que sea el pesar por la muerte, debe ser superado por la fuerza del amor hacia aquel que, siendo nuestra vida, quiso padecer hasta la misma muerte por nosotros.

        Pues, si en la muerte no hubiera ningún pesar, o éste fuera muy pequeño, no sería tan grande la gloria de los mártires. Pero, si el buen Pastor, que dio su vida por sus ovejas, suscitó tantos mártires suyos, ¿cuánto más deben luchar hasta la muerte, por la verdad, y hasta derramar la sangre, contra el pecado, aquellos a quienes Cristo encomendó a apacentar sus ovejas, es decir, el instruirlas y gobernarlas?

        Por esta razón, y ante el ejemplo de la pasión de Cristo, ¿quién no comprende que son los pastores quienes más deben imitarlo, puesto que muchas de sus ovejas lo han imitado, y que bajo el cayado del único Pastor, y en un solo rebaño los mismos pastores son

        también ovejas? A todos hizo ovejas suyas, ya que por todos padeció, pues él mismo, por padecer por todos, se hizo oveja.
      autor: |-
        De los Tratados de san Agustín, obispo, sobre el evangelio de san Juan
        (Tratado 123, 5: CCL 36, 678-680)
    resp2:
      ref: Sir 45, 3; Sal 77, 70. 71
      vr:
      - - R
        - El Señor lo mostró poderoso ante el rey; le dio mandamientos para su pueblo * y le mostró algo de su gloria.
      - - V
        - Escogió Dios a David, su siervo, para pastorear a Israel, su heredad.
      - - R
        - Y le mostró algo de su gloria.
San Norberto, obispo:
  nombre_libro: San Norberto, Obispo
  comun_libro: pastores
  indicacion: Del Común de pastores.
  oracion: Señor, tú hiciste del obispo san Norberto un pastor admirable de tu Iglesia por su espíritu de oración y su celo apostólico; te rogamos que, por su intercesión, tu pueblo encuentre siempre pastores ejemplares que lo conduzcan a la salvación. Por Jesucristo nuestro Señor. El mismo 6 de junio SAN MARCELINO CHAMPAGNAT, PRESBÍTERO Solemnidad Nacido en 1789 en Marlhes, Francia, Marcelino, Sacerdote de la Sociedad de María, dolorido por el estado de ignorancia de los niños del campo, fundó el Instituto de los Hermanos maristas de la enseñanza para su educación cristiana. Encendido de un amor singular por la Madre de Dios, aprendió de ella la práctica de la humildad y del amor hacia Dios y hacia los hombres. Quiso que sus discípulos la tuviesen por Madre y como norma en la educación de los jóvenes. Murió en el Hermitage, cerca de Saint Chamond, Francia, el 6 de junio de 1840. Del Común de pastores, o de los santos varones.
  oficio:
    lectura2:
      titulo: 'OJALÁ SE PUDIERA AFIRMAR DE LOS HERMANITOS DE MARÍA: «MIRAD CÓMO SE AMAN».'
      texto: |-
        Muero lleno de respeto, gratitud y sumisión al Superior General de la Sociedad de María y animado por los sentimientos de la unión más perfecta con todos los miembros que la componen, especialmente con los Hermanos que el Señor ha confiado a mis desvelos y que siempre han sido tan queridos de mi corazón.

        Deseo que reine siempre entre los Hermanos de María una obediencia total y perfecta; que los súbditos, viendo en los Superiores la persona de Jesucristo, los obedezcan de corazón y espíritu, y renuncien siempre, si fuere necesario, a la voluntad y juicio propios. Recuerden que el religioso obediente cantará victoria y que la obediencia es, sobre todo,

        el cimiento y soporte de la comunidad. Animados de este espíritu, sométanse ciegamente los Hermanitos de María no sólo a los Superiores mayores, sino a cuantos estén encargados de dirigirlos y guiarlos. Penétrense bien de esta verdad de fe: el Superior representa a Jesucristo, y, cuando manda, debe ser obedecido como si mandara el mismo Cristo.

        Os suplico también, muy queridos Hermanos, con todo el cariño de mi alma y por el que vosotros me profesáis, que os comportéis de tal modo que la caridad reine siempre entre vosotros. Amaos unos a otros como Cristo os ha amado. No haya entre vosotros sino un corazón y un mismo espíritu. Ojalá se pudiera afirmar de los Hermanitos de María lo que se decía de los primeros Cristianos: “¡Mirad cómo se aman”!… Es el deseo más vivo de mi corazón en estos últimos instantes de mi vida. Sí, carísimos Hermanos míos, escuchad las últimas palabras de vuestro padre, que son las de nuestro amadísimo Salvador: “Amaos unos a otros”.

        Deseo, queridísimos Hermanos míos, que esta caridad, que debe uniros a todos, como miembros de un mismo cuerpo, alcance a las demás congregaciones. Os conjuro, por la caridad sin límites de Jesucristo, que no envidiéis jamás a nadie, y menos aún a quienes Dios llama al estado religioso para trabajar, como vosotros, en la educación de la juventud. Sed los primeros en alegraros de sus éxitos y apenaos por sus fracasos. Encomendadlos a menudo a Dios y a la divina Madre. Dadles con gusto la preferencia. Jamás prestéis oídos a los dichos que pudieran perjudicarlos. Que la gloria de Dios y el honor de María sean vuestro único fin y vuestra sola ambición.

        Un mismo espíritu y un mismo afecto os una a los Padres de la Sociedad de María como ramas de un mismo tronco y como hijos de una misma familia y de una Buena Madre, María Santísima.
      autor: |-
        Del ‘Testamento espiritual’ de S. Marcelino Champagnat
        (Constituciones de los Hermanos Maristas, p. 158)
    resp2:
      ref: 2 Tm 4, 2. 5; Hch 20, 28
      vr:
      - - R
        - Proclama la palabra, insiste con oportunidad o sin ella, persuade, reprende, exhorta, armado de toda paciencia y doctrina; * arrostra los trabajos, realiza la función de proclamar la Buena Nueva. Aleluia.
      - - V
        - Ten cuidado del rebaño que el Espíritu Santo te ha encargado guardar, como pastor de la Iglesia de Dios.
      - - R
        - Arrostra los trabajos, realiza la función de proclamar la Buena Nueva. Aleluia.
    versiculo:
    - - V
      - Escucharás una palabra de mi boca (T. P. Aleluia).
    - - R
      - Y les darás la alarma de mi parte (T. P. Aleluia).
    lectura1:
      titulo: VUESTRA VIDA ESTÁ CON CRISTO ESCONDIDA EN DIOS
      texto: |-
        Hermanos Ya que habéis resucitado con Cristo, buscad los bienes de allá arriba, donde está Cristo, sentado a la derecha de Dios; aspirad a los bienes de arriba, no a los de la tierra. Porque habéis muerto, y vuestra vida está escondida en Dios. Cuando aparezca Cristo, vida nuestra, entonces también vosotros apareceréis, junto con él, en gloria.

        En consecuencia dad muerte a todo lo terreno que hay en vosotros: la fornicación, la impureza, la pasión, la codicia y la avaricia, que es una idolatría. Eso es lo que atrae el castigo de Dios sobre los desobedientes.

        Entre ellos andabais también vosotros, cuando vivíais de esa manera; ahora, en cambio deshaceos de todo eso: ira, coraje, maldad, calumnias y groserías, ¡fuera de vuestra boca! No sigáis engañándoos unos a otros.

        Despojaos del hombre viejo, con sus obras, y revestíos del nuevo, que se va renovando como imagen de su Creador, hasta llegar a conocerlo. En este orden nuevo no hay distinción entre judíos y gentiles, circuncisos e incircuncisos, bárbaros y escitas, esclavos y libres, porque Cristo es la síntesis de todo y está en todos.

        Como elegidos de Dios, santos y amados, vestíos de la misericordia entrañable, bondad, humildad, dulzura, comprensión. Sobrellevaos mutuamente y perdonaos, cuando alguno tenga quejas contra otro. El Señor os ha perdonado: haced vosotros lo mismo.

        Y, por encima de esto, el amor, que es el ceñidor de la unidad consumada. Que la paz de Cristo actúe de árbitro en vuestro corazón; a ella habéis sido convocados, en un solo cuerpo. Y sed agradecidos.

        La palabra de Cristo habite en vosotros en toda su riqueza; enseñaos unos a otros con toda sabiduría; corregíos mutuamente. Cantad a Dios, dadle gracias de corazón, con salmos, himnos y cánticos inspirados. Y, todo lo que de palabra o de obra realicéis, sea todo en nombre del Señor Jesús, ofreciendo la Acción de gracias a Dios Padre por medio de él.
      ref: De la carta del apóstol San Pablo a los Colosenses Col 3, 1-17
    resp1:
      ref: Ga 3, 27. 28; cf. Ef 4, 24
      vr:
      - - R
        - 'Todos los que habéis sido bautizados en Cristo os habéis revestido de Cristo. Ya no hay distinción entre judío y gentil: * todos sois uno en Cristo Jesús.'
      - - V
        - 'Vestíos de la nueva condición humana, creada a imagen de Dios: justicia y santidad verdaderas.'
      - - R
        - Todos sois uno en Cristo Jesús.
  visperas1:
