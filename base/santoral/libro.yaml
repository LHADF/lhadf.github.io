  visperas:
    lectura:
      ref: 1 P 5, 1-4
      texto: A los ancianos que están entre vosotros los exhorto yo, anciano como ellos, testigo de los sufrimientos de Cristo y partícipe de la gloria que está por manifestarse. Apacentad la grey de Dios que os está encomendada, vigilando, no forzando, sino voluntariamente, según Dios, no por mezquino afán de ganancia, sino de corazón; no tiranizando a los que os ha tocado cuidar, sino siendo modelos de la grey. Cuando aparezca el Pastor, recibiréis la corona de gloria que no se marchita. RRESPONSORIO BREVE Fuera del tiempo pascual V. Verdadero amigo de tus hermanos, ruega por tu pueblo. R. Verdadero amigo de tus hermanos, ruega por tu pueblo. V. Has dado la vida por los hermanos. R. Ruega por tu pueblo. V. Gloria al Padre, al Hijo y al Espíritu Santo. R. Verdadero amigo de tus hermanos, ruega por tu pueblo. En tiempo pascual V. Verdadero amigo de tus hermanos, ruega por tu pueblo, aleluia, aleluia. R. Verdadero amigo de tus hermanos, ruega por tu pueblo, aleluia, aleluia. V. Has dado la
        vida por los hermanos. R. Aleluia, aleluia. V. Gloria al Padre, al Hijo y al Espíritu Santo. R. Verdadero amigo de tus hermanos, ruega por tu pueblo, aleluia, aleluia.
