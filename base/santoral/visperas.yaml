    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús.
    respuesta: Mira a la llena de gracia y escúchanos.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oracion: Señor, Dios nuestro, que nos has dado como madre y como reina a la Madre de tu Hijo, concédenos que, protegidos por su intercesión, alcancemos la gloria que tienes preparada a tus hijos en el reino de los cielos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN BARTOLOMÉ, apóstol:
  grado: Fiesta
  fecha: 08-24
  himno: ¡Columnas de la Iglesia, piedras vivas!
  salmodia:
  - ant: Vosotros sois los que habéis perseverado conmigo en mis pruebas.
    salmo: salmo-115
  - ant: Yo estoy en medio de vosotros como el que sirve.
    salmo: salmo-125
  - ant: Ya no os llamo siervos, a vosotros os llamo amigos, porque todo lo que he oído a mi Padre os lo he dado a conocer.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Ef 4, 11-13
    texto: Cristo ha constituido a unos, apóstoles; a otros, profetas; a otros, evangelistas; a otros, pastores y doctores, para el perfeccionamiento de los fieles, en función de su ministerio, y para la edificación del cuerpo de Cristo; hasta que lleguemos todos a la unidad en la fe y en el conocimiento del Hijo de Dios, al hombre perfecto, a la medida de Cristo en su plenitud.
  responsorio:
  - - V
    - Contad a los pueblos la gloria del Señor.
  - - R
    - Contad a los pueblos la gloria del Señor.
  - - V
    - Sus maravillas a todas las naciones.
  - - R
    - Contad a los pueblos la gloria del Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Contad a los pueblos la gloria del Señor.
  ant_magnificat: Cuando llegue la renovación y el Hijo del hombre se siente en el trono de su gloria, os sentaréis también vosotros en doce tronos para regir a las doce tribus de Israel.
  preces:
    intro: 'Hermanos: Edificados sobre el cimiento de los apóstoles, oremos al Padre por su pueblo santo, diciendo:'
    preces:
    - - Padre santo, que quisiste que tu Hijo resucitado de entre los muertos se manifestara en primer lugar a los apóstoles,
      - haz que también nosotros seamos testigos de Cristo hasta los confines del mundo.
    - - Padre santo, tú que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
      - haz que el Evangelio sea proclamado a toda la creación.
    - - Tú que enviaste a tu Hijo a sembrar la semilla de la palabra,
      - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
    - - Tú que enviaste a tu Hijo para que reconciliara el mundo contigo,
      - haz que también nosotros cooperemos a la reconciliación de los hombres.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Tú que quisiste que tu Hijo resucitara el primero de entre los muertos, concede a todos los que son de Cristo resucitar con él, el día de su venida. Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  oracion: Fortalece, Señor, nuestra fe, para que nos adhiramos a Cristo, tu Hijo, con la misma sinceridad con que lo hizo el apóstol san Bartolomé, y haz que, por la intercesión de este santo, sea siempre tu Iglesia sacramento de salvación universal para todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MÓNICA:
  grado: Memoria
  fecha: 08-27
  comun: Del Común de santas mujeres.
  himno: Un amor casto y puro
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
  responsorio:
  - - V
    - Dios la eligió y la predestinó.
  - - R
    - Dios la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dios la eligió y la predestinó.
  ant_magnificat: Cuando aún permanecía en el cuerpo, vivía ya Mónica de tal manera con Cristo, que su fe y sus costumbres eran una perfecta alabanza al nombre de Dios.
  preces:
    intro: 'Supliquemos a Dios en bien de su Iglesia por intercesión de las santas mujeres y digámosle:'
    preces:
    - - Por intercesión de las santas mártires, que con la fuerza del espíritu superaron la muerte del cuerpo,
      - concede, Señor, a tu Iglesia ser fuerte en la tentación.
    - - Por intercesión de las santas esposas, que por medio del matrimonio crecieron en tu amor,
      - concede, Señor, a tu Iglesia la fecundidad apostólica.
    - - Por intercesión de las santas viudas, que por la hospitalidad y la oración superaron la soledad,
      - concede, Señor, a tu Iglesia ser para el mundo signo manifiesto de tu amor a los hombres.
    - - Por intercesión de las santas madres, que engendraron sus hijos no sólo para la vida del mundo, sino también para la salvación eterna,
      - concede, Señor, a tu Iglesia engendrar para tu reino a todos los pueblos.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Por intercesión de todas las mujeres santas, que han sido ya admitidas a contemplar la belleza de tu rostro, concede, Señor, a los difuntos de la Iglesia gozar también de la luz eterna de tu presencia. Fieles a la recomendación del Salvador, digamos al Padre común:'
  oracion: Dios de bondad, consolador de los que lloran, tú que, lleno de compasión, acogiste las lágrimas que santa Mónica derramaba pidiendo la conversión de su hijo Agustín, concédenos, por la intercesión de ambos, el arrepentimiento sincero de nuestros pecados y la gracia de tu perdón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN AGUSTÍN, obispo y doctor de la iglesia:
  grado: Memoria
  fecha: 08-28
  comun: 'Del Común de pastores: para un santo obispo y del común de doctores de la Iglesia.'
  himno: Verbo de Dios, eterna luz divina
  lectura:
    ref: St 3, 17-18
    texto: La sabiduría que viene de arriba ante todo es pura y, además, es amante de la paz, comprensiva, dócil, llena de misericordia y buenas obras, constante, sincera. Los que procuran la paz están sembrando la paz; y su fruto es la justicia.
  responsorio:
  - - V
    - En la asamblea le da la palabra.
  - - R
    - En la asamblea le da la palabra.
  - - V
    - Lo llena de espíritu, sabiduría e inteligencia.
  - - R
    - Le da la palabra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - En la asamblea le da la palabra.
  ant_magnificat: ¡Tarde te amé, Hermosura tan antigua y tan nueva, tarde te amé! Me llamaste y clamaste, y quebrantaste mi sordera.
  preces:
    intro: 'Glorifiquemos a Cristo, constituido pontífice en favor de los hombres en lo que se refiere a Dios, y supliquémosle humildemente diciendo:'
    preces:
    - - Tú que por medio de pastores santos y eximios has glorificado a tu Iglesia,
      - haz que todos los cristianos resplandezcan por su virtud.
    - - Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles,
      - purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos.
    - - Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos,
      - llena también de tu Espíritu a todos los pastores del pueblo de Dios.
    - - Tú que fuiste la heredad de los santos pastores,
      - no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti.
    respuesta: Salva a tu pueblo, Señor.
  padrenuestro_intro: 'Tú que por medio de los pastores de la Iglesia das la vida eterna a tus ovejas para que nadie las arrebate de tu mano, salva a los difuntos, por quienes entregaste tu vida. Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oracion: Renueva, Señor, en tu Iglesia aquel espíritu que, con tanta abundancia, otorgaste al obispo san Agustín, para que también nosotros tengamos sed de ti, única fuente de la verdadera sabiduría, y en ti, único manantial del verdadero amor, encuentre descanso nuestro corazón. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL MARTIRIO DE SAN JUAN BAUTISTA:
  grado: Memoria
  fecha: 08-29
  himno: Ángel fiel de la verdad
  lectura:
    ref: Hch 13, 23-25
    texto: 'Según lo prometido, Dios sacó para Israel de la descendencia de David un Salvador, Jesús. Y su precursor fue Juan. Ya éste, antes de presentarse Jesús, había predicado a todo el pueblo de Israel un bautismo como señal de arrepentimiento. Y, cuando estaba para terminar su misión, solía decir: «No soy yo el que vosotros os imagináis. Pero, mirad, viene otro después de mí; y yo no soy digno de desatar su calzado.»'
  responsorio:
  - - V
    - El amigo del Esposo experimenta viva alegría cuando oye la voz del Esposo.
  - - R
    - El amigo del Esposo experimenta viva alegría cuando oye la voz del Esposo.
  - - V
    - Ésta es mi alegría, la cual ahora rebasa todo límite.
  - - R
    - Cuando oye la voz del Esposo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El amigo del Esposo experimenta viva alegría cuando oye la voz del Esposo.
  ant_magnificat: Yo no soy el Mesías, sino que soy enviado delante de él; es preciso que él crezca y que yo disminuya.
  preces:
    intro: 'Oremos confiados al Señor, que eligió a Juan Bautista para anunciar a los hombres el reino de Cristo, y digámosle:'
    preces:
    - - Tú, Señor, que llamaste a Juan cuando estaba aún en las entrañas maternas y lo elegiste para que preparara los caminos de tu Hijo,
      - danos ánimos para seguir siempre a Cristo con la misma fidelidad con que Juan lo precedió.
    - - Tú que concediste al Bautista reconocer al Cordero de Dios,
      - concede a la Iglesia anunciar a Cristo de tal manera que los hombres de nuestro tiempo puedan reconocerlo.
    - - Tú que dispusiste que Juan menguase y que Cristo creciera,
      - enséñanos a saber humillarnos, para que brille Cristo a los ojos de los hombres.
    - - Tú que, por el martirio de Juan, quisiste manifestar la justicia,
      - concédenos testificar tu verdad con valentía, sin temor a la tribulación.
    respuesta: Guía, Señor, nuestros pasos por el camino de la paz.
  padrenuestro_intro: 'Acuérdate, Señor, de los que han salido ya de este mundo y colócalos en el reino de la luz y de la paz. Dirijamos nuestra oración al Padre que está en los cielos diciendo:'
  oracion: Dios nuestro, que quisiste que san Juan Bautista fuera el precursor de tu Hijo, tanto en su nacimiento como en su muerte, concédenos que, así como él dio su vida por dar testimonio de la verdad y de la justicia, así también nosotros entreguemos generosamente la nuestra al testimonio y servicio del Evangelio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ROSA DE LIMA, virgen, Patrona de América Latina:
  grado: Fiesta
  fecha: 08-30
  comun: Del Común de vírgenes.
  himno: Aplaudan a esta Rosa
  salmodia:
  - ant: Quiero ser solamente tuya, oh Cristo esposo, a ti vengo con mi lámpara encendida.
    salmo: salmo-121
  - ant: Dichosos los limpios de corazón, porque ellos verán a Dios.
    salmo: salmo-126
  - ant: Mi alma se siente firme, está cimentada en Cristo, el Señor.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: 1Co 7, 32. 34
    texto: El célibe se preocupa de los asuntos del Señor, buscando contentar al Señor; lo mismo, la mujer sin marido y la soltera se preocupan de los asuntos del Señor, consagrándose a ellos en cuerpo y alma.
  responsorio:
  - - V
    - Llevan ante el Rey al séquito de vírgenes, las traen entre alegría.
  - - R
    - Llevan ante el Rey al séquito de vírgenes, las traen entre alegría.
  - - V
    - Van entrando en el palacio real.
  - - R
    - Las traen entre alegría.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Llevan ante el Rey al séquito de vírgenes, las traen entre alegría.
  ant_magnificat: Mi Señor Jesucristo se desposó conmigo con su anillo, y como verdadera esposa me adornó con una corona.
  padrenuestro_intro: 'Tú que recibiste en el banquete de tus bodas a las vírgenes santas, admite también a nuestros hermanos difuntos en el convite festivo de tu reino. Oremos con Jesús, diciendo a nuestro Padre:'
  oracion: Dios nuestro, que impulsaste a santa Rosa de Lima a apartarse de la vida del mundo por amor tuyo y a consagrarse solo a ti, en la austeridad y en la penitencia, concédenos, por su intercesión, que sepamos seguir, en este mundo, el camino que conduce a la verdadera vida, para que lleguemos a gozar del torrente de tus delicias allá en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
