  oracion: Dios todopoderoso, que suscitaste a san Juan Bautista, para que le preparara a Cristo un pueblo bien dispuesto, concede a tu pueblo el don de la alegría espiritual y guíanos por el camino de la salvación y de la paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN IRENEO, obispo y mártir:
  grado: Memoria
  fecha: 06-28
  comun: Del Común de un mártir.
SANTOS PEDRO Y PABLO, APÓSTOLES · I Vísperas:
  grado: Solemnidad
  fecha: 06-29
  himno: La hermosa luz de eternidad inunda
  salmodia:
  - ant: «Tú eres el Mesías, el Hijo de Dios vivo». «Bienaventurado eres tú, Simón, hijo de Jonás».
    salmo: salmo-116
  - ant: Tú eres Pedro, y sobre esta piedra edificaré mi Iglesia.
    salmo: salmo-147
  - ant: Tú eres un instrumento escogido, apóstol san Pablo, predicador de la verdad en todo el mundo.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Rm 1, 1-3a. 7
    texto: 'Pablo, esclavo de Jesucristo, convocado para ser apóstol y elegido para anunciar la Buena Nueva de Dios, que ya antes había él prometido, por medio de los profetas en las sagradas Escrituras, acerca de su Hijo: Desea la gracia y la paz de parte de Dios, nuestro Padre, y de Jesucristo, el Señor, a cuantos estáis en Roma, amados de Dios, asamblea santa.'
  responsorio:
  - - V
    - Los apóstoles anunciaban la palabra de Dios con valentía.
  - - R
    - Los apóstoles anunciaban la palabra de Dios con valentía.
  - - V
    - Y daban testimonio de la resurrección del Señor.
  - - R
    - Con valentía.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los apóstoles anunciaban la palabra de Dios con valentía.
  ant_magnificat: Estos dos gloriosos apóstoles de Cristo, a quienes en la vida les unió un estrecho afecto, ni en la muerte fueron separados.
  preces:
    intro: 'Oremos hermanos, a Cristo, el Señor, que quiso edificar su Iglesia sobre el cimiento de los apóstoles y profetas, y digámosle confiados:'
    preces:
    - - Tú que llamaste a Pedro para hacerlo pescador de hombres,
      - no dejes de llamar obreros a tu mies para que el mundo se salve.
    - - Tú que increpaste a los vientos y al mar para que la barca de los discípulos no se hundiera,
      - protege a tu Iglesia de toda perturbación y fortalece al sucesor de Pedro.
    - - Tú que, después de la resurrección, congregaste en torno a Pedro tu grey dispersa,
      - reúne a tu Iglesia en un solo aprisco.
    - - Tú que enviaste a Pablo a evangelizar a los paganos,
      - haz que el anuncio de la salvación llegue a todos los pueblos.
    respuesta: Socorre, Señor, a tu pueblo.
  padrenuestro_intro: 'Tú que diste a la Iglesia las llaves del reino de los cielos, abre las puertas de la felicidad a los que durante su vida confiaron en tu misericordia. Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  oracion: Señor, Dios nuestro, concédenos la poderosa ayuda de los santos apóstoles Pedro y Pablo, para que aquellos mismos que nos comunicaron las primeras enseñanzas de la fe nos obtengan ahora, con su intercesión, el auxilio necesario para llegar a la salvación eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS PEDRO Y PABLO, APÓSTOLES:
  grado: Solemnidad
  fecha: 06-29
  himno: La hermosa luz de eternidad inunda
  salmodia:
  - ant: Yo he rogado por ti, Pedro, para que tu fe no desfallezca; y tú, una vez convertido, confirma a tus hermanos.
    salmo: salmo-115
  - ant: Muy a gusto presumo de mis debilidades, porque así residirá en mí la fuerza de Cristo.
    salmo: salmo-125
  - ant: Tú eres pastor de las ovejas, Príncipe de los apóstoles; a ti te han sido entregadas las llaves del reino de los cielos.
    salmo: cantico-ef-1-3-10
  lectura:
