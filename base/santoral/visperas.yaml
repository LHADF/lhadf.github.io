    - Contad a los pueblos la gloria del Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Contad a los pueblos la gloria del Señor.
  ant_magnificat: Tú eres pastor de las ovejas, Príncipe de los apóstoles; a ti te han sido entregadas las llaves del reino de los cielos.
  preces:
    intro: 'Hermanos: Edificados sobre el cimiento de los apóstoles, oremos al Padre por su pueblo santo, diciendo:'
    preces:
    - - Padre santo, que quisiste que tu Hijo resucitado de entre los muertos se manifestara en primer lugar a los apóstoles,
      - haz que también nosotros seamos testigos de Cristo hasta los confines del mundo.
    - - Padre santo, tú que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
      - haz que el Evangelio sea proclamado a toda la creación.
    - - Tú que enviaste a tu Hijo a sembrar la semilla de la palabra,
      - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
    - - Tú que enviaste a tu Hijo para que reconciliara el mundo contigo,
      - haz que también nosotros cooperemos a la reconciliación de los hombres.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Tú que quisiste que tu Hijo resucitara el primero de entre los muertos, concede a todos los que son de Cristo resucitar con él, el día de su venida. Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  oracion: No permitas, Señor, que ninguna desorientación llegue a perturbar nunca la fe de la Iglesia, que tú quisiste estuviera cimentada sobre la roca sólida de la confesión del apóstol san Pedro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN POLICARPO, obispo y mártir:
  grado: Memoria
  fecha: 02-23
  comun: Del Común de un mártir.
  himno: Oh Dios, que eres el premio, la corona
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  - - R
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  - - V
    - Nos refinaste como refinan la plata.
  - - R
    - Pero nos has dado respiro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  ant_magnificat: 'Señor Dios todopoderoso: te bendigo porque me has hecho digno de ser agregado al número de los mártires y me has concedido tener parte en el cáliz de tu Ungido.'
  preces:
    intro: 'En esta hora en la que el Señor, cenando con sus discípulos, presentó al Padre su propia vida que luego entregó en la cruz, aclamemos al Rey de los mártires, diciendo:'
    preces:
    - - Te damos gracias, Señor, principio, ejemplo y rey de los mártires,
      - porque nos amaste hasta el extremo.
    - - Te damos gracias, Señor, porque no cesas de llamar a los pecadores arrepentidos
      - y les das parte en los premios de tu reino.
    - - Te damos gracias, Señor, porque hoy hemos ofrecido, como sacrificio para el perdón de los pecados,
      - la sangre de la alianza nueva y eterna.
    - - Te damos gracias, Señor,
      - porque con tu gracia nos has dado perseverar en la fe durante el día que ahora termina.
    respuesta: Te glorificamos, Señor.
  padrenuestro_intro: 'Te damos gracias, Señor, porque has asociado a nuestros hermanos difuntos a tu muerte. Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Dios y Señor de todo lo creado, que quisiste que san Policarpo fuera contado entre tus mártires, concédenos, por su intercesión, participar con él en la pasión de Cristo, para poder así resucitar, también con él, a la vida eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JOSÉ, ESPOSO DE LA BIENAVENTURADA VIRGEN MARÍA · I Vísperas:
  grado: Solemnidad
  fecha: 03-19
  himno: Cante tu gloria célica armonía
  salmodia:
  - ant: Jacob engendró a José, el esposo de María, de la cual nació Jesús, que es el Mesías.
    salmo: salmo-112
  - ant: Fue enviado de parte de Dios el ángel Gabriel a una ciudad de Galilea, llamada Nazaret, a una virgen desposada con un hombre llamado José.
    salmo: salmo-145
  - ant: Estando desposada María, madre de Jesús, con José, antes de que empezaran a vivir juntos, se encontró encinta por obra del Espíritu Santo.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Col 3, 23-24
    texto: 'Lo que hacéis, hacedlo con toda el alma, como para servir al Señor y no a los hombres: sabiendo bien que recibiréis del Señor en recompensa la herencia. Servid a Cristo Señor.'
  responsorio:
  - - V
    - El justo florecerá como un lirio.
  - - R
    - El justo florecerá como un lirio.
  - - V
    - Y se alegrará eternamente ante el Señor.
  - - R
    - Como un lirio.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El justo florecerá como un lirio.
  ant_magnificat: Éste es el administrador fiel y solícito a quien el amo ha puesto al frente de su servidumbre.
  preces:
    intro: 'Acudamos suplicantes a Dios Padre todopoderoso, de quien procede toda la familia del cielo y de la tierra, y digámosle suplicantes:'
    preces:
    - - Padre santo, tú que en la aurora del nuevo Testamento revelaste a José el misterio mantenido en silencio desde el origen de los siglos,
      - ayúdanos a conocer cada vez mejor a tu Hijo, verdadero Dios y verdadero hombre.
    - - Padre celestial, tú que alimentas las aves del cielo y vistes la hierba del campo,
      - concede a todos los hombres el pan de cada día para su cuerpo y el alimento de la eucaristía para su espíritu.
    - - Creador del universo, tú que entregaste al hombre la obra de tus manos,
      - haz que los trabajadores puedan disfrutar de manera digna del fruto de su trabajo.
    - - Señor, tú que eres la fuente de toda la justicia y deseas que todos seamos justos,
      - por intercesión de san José, ayúdanos a agradarte en todo.
    respuesta: Padre nuestro que estás en los cielos, escúchanos.
  padrenuestro_intro: 'Haz, Señor, que los moribundos y los que ya han muerto, obtengan tu misericordia eterna, por medio de tu Hijo, de María y de san José. Porque somos miembros de la familia de Dios, nos atrevemos a decir:'
  oracion: Dios todopoderoso, que, en los albores del nuevo Testamento, encomendaste a san José los misterios de nuestra salvación, haz que ahora tu Iglesia, sostenida por la intercesión del esposo de María, lleve a su pleno cumplimiento la obra de la salvación de los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
