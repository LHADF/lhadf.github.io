EL SANTÍSIMO CUERPO Y SANGRE DE CRISTO · I Vísperas:
  grado: Solemnidad
  fecha: variable
  himno: Publica, lengua, y canta
  salmodia:
  - ant: El Señor es clemente, él da alimento a sus fieles en memoria de sus maravillas.
    salmo: salmo-110
  - ant: El Señor da la paz a su Iglesia, la sacia con flor de harina.
    salmo: salmo-147
  - ant: 'Yo os digo con toda verdad: Moisés no os dio el pan del cielo; es mi Padre el que os da el verdadero pan del cielo. Aleluia.'
    salmo: cantico-ap-11-17-18-12-10b-12a
  lectura:
    ref: 1Co 10, 16-17
    texto: El cáliz bendito que consagramos es la comunión de la sangre de Cristo; y el pan que partimos es la comunión del cuerpo del Señor. Y, puesto que es un solo Pan, somos todos un solo cuerpo; ya que todos participamos de ese único pan.
  responsorio:
  - - V
    - Les ha dado pan del cielo. Aleluia, aleluia.
  - - R
    - Les ha dado pan del cielo. Aleluia, aleluia.
  - - V
    - El hombre ha comido pan de ángeles.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Les ha dado pan del cielo. Aleluia, aleluia.
  ant_magnificat: Señor, cuán suave es tu Espíritu; para hacer sentir tu dulzura a tus hijos, los llenas de bienes con un pan delicioso que les mandas del cielo; dejas, en cambio, sin nada a los ricos insolentes.
  preces:
    intro: 'Acudamos a Cristo, que invita a todos a su cena y en ella entrega su cuerpo y su sangre para la vida del mundo; digámosle:'
    preces:
    - - Cristo, Hijo de Dios vivo, que nos mandaste celebrar la eucaristía como memorial tuyo,
      - enriquece a tu Iglesia con la celebración de tus misterios.
    - - Cristo, Señor nuestro, sacerdote único del Dios altísimo, que has querido que tus ministros te representaran en la cena eucarística,
      - haz que los que presiden nuestras asambleas imiten en su manera de vivir lo que celebran en el sacramento.
    - - Cristo, maná bajado del cielo, que haces un solo cuerpo de cuantos participan de un mismo pan,
      - aumenta la unidad y la concordia entre los que creen en ti.
    - - Cristo Jesús, médico enviado por el Padre, que por el pan de la eucaristía nos das el remedio de la inmortalidad y el germen de la resurrección,
      - da salud a los enfermos y esperanza a los pecadores.
    respuesta: Cristo, pan bajado del cielo, danos la vida eterna.
  padrenuestro_intro: 'Cristo Señor, rey al que esperamos, tu que nos mandaste celebrar la eucaristía para anunciar tu muerte y pedir tu retorno, haz participar en tu resurrección a los que han muerto estando en tu amor. Pidamos al Padre, como Cristo nos enseñó, nuestro pan de cada día:'
  oracion: Señor nuestro Jesucristo, que en este sacramento admirable nos dejaste el memorial de tu pasión, concédenos venerar de tal modo los sagrados misterios de tu cuerpo y de tu sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas con el Padre en la unidad del Espíritu Santo y eres Dios, por los siglos de los siglos.
