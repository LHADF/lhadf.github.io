LA ANUNCIACIÓN DEL SEÑOR · I Vísperas:
  grado: Solemnidad
  fecha: 03-25
  himno: Hoy es del divino amor
  salmodia:
  - ant: Saldrá un renuevo del tronco de Jesé, y de su raíz brotará un vástago; sobre él se posará el Espíritu del Señor.
    salmo: salmo-112
  - ant: El Señor Dios le dará el trono de David, su padre, y reinará para siempre.
    salmo: salmo-147
  - ant: El que era la Palabra substancial del Padre, engendrado antes del tiempo, hoy se ha anonadado a sí mismo, haciéndose carne por nosotros.
    salmo: cantico-flp-2-6-11
  lectura:
    ref: 1Jn 1, 1-3a
    texto: 'Lo que existía desde un principio, lo que hemos oído, lo que hemos visto con nuestros ojos, lo que contemplamos y lo que tocaron nuestras manos acerca de la Palabra de vida (porque la vida se ha manifestado, y nosotros hemos visto y testificamos y os anunciamos esta vida eterna, la que estaba con el Padre y se nos ha manifestado): lo que hemos visto y oído os lo anunciamos, a fin de que viváis en comunión con nosotros.'
  responsorio:
  - - V
    - Ha brotado un renuevo del tronco de Jesé, ha salido una estrella de la casa de Jacob.
  - - R
    - Ha brotado un renuevo del tronco de Jesé, ha salido una estrella de la casa de Jacob.
  - - V
    - La Virgen ha dado a luz al Salvador.
  - - R
    - Ha salido una estrella de la casa de Jacob.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Ha brotado un renuevo del tronco de Jesé, ha salido una estrella de la casa de Jacob.
  ant_magnificat: El Espíritu Santo descenderá sobre ti, María, y el poder del Altísimo te envolverá como una nube.
  preces:
    intro: 'Acudamos a Dios Padre, que por medio del ángel anunció hoy a María su designio de salvarnos, y digámosle confiados:'
    preces:
    - - Tú que elegiste a la Virgen María para madre de tu Hijo,
      - ten piedad de todos los que esperamos la redención de Jesucristo.
    - - Tú que por boca de Gabriel anunciaste a María el gozo y la paz,
      - concede a todo el mundo la alegría de la salvación y el don de una paz verdadera.
    - - Tú que por la aceptación de María y por obra del Espíritu Santo hiciste que tu Verbo habitara entre nosotros,
      - haz que nosotros recibamos siempre a Cristo como lo recibió María.
    - - Tú que enalteces a los humildes y a los pobres los colmas de bienes,
      - conforta a los que se sienten abatidos, socorre a los necesitados y ayuda a los moribundos.
    respuesta: Derrama, Señor, tu gracia sobre nosotros.
  padrenuestro_intro: 'Tú que eres el único que realizas maravillas y el Dios para quien nada hay imposible, resucita a los muertos en el último día. Ya que Cristo al hacerse hombre nos ha hermanado a todos, digamos a nuestro Padre común:'
  oracion: Señor Dios nuestro, que quisiste que tu Verbo se hiciera hombre en el seno de la Virgen María, concede a quienes proclamamos que nuestro Redentor es realmente Dios y hombre que lleguemos a ser partícipes de su naturaleza divina. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
