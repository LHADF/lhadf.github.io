# Santoral de Vísperas (calendario de sync, a revisar con el ADF). «· I Vísperas» = primeras vísperas de la solemnidad.
# Solo figura lo que cambia respecto del salterio y del tiempo; «fecha: variable» = celebración movible.
SANTA MARÍA, MADRE DE DIOS · I Vísperas:
  grado: Solemnidad
  fecha: 01-01
  himno: Reina del libro de la vieja alianza
  salmodia:
  - ant: ¡Qué admirable intercambio! El Creador del género humano, tomando cuerpo y alma, nace de una Virgen y, hecho hombre sin concurso de varón, nos hace participar de su divinidad.
    salmo: salmo-112
  - ant: 'Cuando naciste inefablemente de la Virgen se cumplieron las Escrituras: descendiste como el rocío sobre el vellón, para salvar a los hombres; te alabamos, Dios nuestro.'
    salmo: salmo-147
  - ant: En la zarza que Moisés vio arder sin consumirse, reconocemos tu virginidad admirablemente conservada; Madre de Dios, intercede por nosotros.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Ga 4, 4-5
    texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: 'Por el gran amor con que Dios nos amó nos envió a su Hijo en semejanza de carne de pecado: nacido de una mujer, nacido bajo la ley. Aleluia.'
  preces:
    intro: 'Bendito sea el Señor Jesús, nuestra paz, que ha venido para hacer de dos pueblos uno solo; supliquémosle, diciendo:'
    preces:
    - - Tú que al nacer has revelado la bondad de Dios y su amor al hombre,
      - ayúdanos a vivir siempre en acción de gracias por todos tus beneficios.
    - - Tú que hiciste a María llena de gracia,
      - concede también la abundancia de tu gracia a todos los hombres.
    - - Tú que viniste a anunciar la Buena Noticia de Dios al mundo, multiplica los ministros de tu Evangelio
      - y da a quien escucha su mensaje un corazón dócil a tu palabra.
    - - Tú que has querido nacer de María para ser nuestro hermano,
      - haz que todos los hombres sepamos amarnos fraternalmente.
    respuesta: Concede, Señor, tu paz a todos los hombres.
  padrenuestro_intro: 'Tú que apareciste en el mundo como sol que nace de lo alto, revela la claridad de tu presencia a los difuntos y haz que puedan contemplarte cara a cara. A pesar de que en el mundo existe el odio y la división, oremos a aquel que nos ha hermanado en Jesucristo, diciendo:'
  oracion: Señor Dios, que por la maternidad virginal de María has dado a los hombres los tesoros de la salvación, haz que sintamos la intercesión de la Virgen Madre, de quien hemos recibido al autor de la vida, Jesucristo, Hijo tuyo y Señor nuestro. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
