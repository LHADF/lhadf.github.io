    intro: 'Oremos confiados al Señor, que eligió a Juan Bautista para anunciar a los hombres el reino de Cristo, y digámosle:'
    preces:
    - - Tú, Señor, que llamaste a Juan cuando estaba aún en las entrañas maternas y lo elegiste para que preparara los caminos de tu Hijo,
      - danos ánimos para seguir siempre a Cristo con la misma fidelidad con que Juan lo precedió.
    - - Tú que concediste al Bautista reconocer al Cordero de Dios,
      - concede a la Iglesia anunciar a Cristo de tal manera que los hombres de nuestro tiempo puedan reconocerlo.
    - - Tú que dispusiste que Juan menguase y que Cristo creciera,
      - enséñanos a saber humillarnos, para que brille Cristo a los ojos de los hombres.
    - - Tú que, por el martirio de Juan, quisiste manifestar la justicia,
      - concédenos testificar tu verdad con valentía, sin temor a la tribulación.
    respuesta: Guía, Señor, nuestros pasos por el camino de la paz.
  padrenuestro_intro: 'Acuérdate, Señor, de los que han salido ya de este mundo y colócalos en el reino de la luz y de la paz. Dirijamos nuestra oración al Padre que está en los cielos diciendo:'
  oracion: Dios todopoderoso, haz que tu pueblo, siguiendo las exhortaciones de san Juan Bautista, progrese por las sendas de la salvación y llegue así, con seguridad, al encuentro del Mesías, anunciado por el santo precursor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL NACIMIENTO DE SAN JUAN BAUTISTA:
  grado: Solemnidad
  fecha: 06-24
  himno: Profeta de soledades
  salmodia:
  - ant: Apareció un hombre, enviado por Dios, que se llamaba Juan.
    salmo: salmo-14
  - ant: Juan vino como testigo para declarar en favor de la verdad.
    salmo: salmo-111
  - ant: Juan era la lámpara que arde y que ilumina.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: Hch 13, 23-25
    texto: 'Según lo prometido, Dios sacó para Israel de la descendencia de David un Salvador, Jesús. Y su precursor fue Juan. Ya éste, antes de presentarse Jesús, había predicado a todo el pueblo de Israel un bautismo como señal de arrepentimiento. Y, cuando estaba para terminar su misión, solía decir: «No soy yo el que vosotros os imagináis. Pero, mirad, viene otro después de mí; y yo no soy digno de desatar su calzado.»'
  responsorio:
  - - V
    - Preparad el camino del Señor, enderezad sus sendas.
  - - R
    - Preparad el camino del Señor, enderezad sus sendas.
  - - V
    - El que viene después de mí ya existía antes que yo.
  - - R
    - Enderezad sus sendas.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Preparad el camino del Señor, enderezad sus sendas.
  ant_magnificat: 'El niño que nos ha nacido es más que un profeta; es aquel de quien dice el Salvador: «Entre los nacidos de mujer no ha surgido nadie mayor que Juan Bautista».'
