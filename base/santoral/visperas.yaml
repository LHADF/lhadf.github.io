    - - Tú, Señor, que has dado órdenes a tus ángeles para que guarden siempre los caminos de tus hijos,
      - haz que cuantos viajan por la tierra, por el mar y por el aire puedan regresar con paz y alegría a sus hogares.
    - - Tú que quisiste que los ángeles anunciaran la paz a los hombres que tú amas,
      - envía también a tus ángeles a los que gobiernan las naciones para que procuren la paz de los pueblos.
    respuesta: Con los ángeles, cantamos el himno de tu gloria.
  padrenuestro_intro: 'Cuando mandes a tus ángeles con la trompeta atronadora para reunir a tus elegidos de los cuatro vientos, haz que nuestros difuntos sean colocados entre tus elegidos. Terminemos nuestra oración con las palabras del Señor:'
  oracion: Dios, Padre misericordioso, que, en tu providencia inefable, te has dignado enviar, para nuestra guarda, a tus santos ángeles, concede a quienes te suplican ser siempre defendidos por su protección y gozar eternamente de su compañía. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO DE ASÍS:
  grado: Memoria
  fecha: 10-04
  comun: 'Del Común de santos varones: para los santos religiosos.'
  himno: En la cumbre de la Verna
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
