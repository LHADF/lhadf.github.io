  preces:
    intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    preces:
    - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
      - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - - Tú que nos diste a María por madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores
      - y a todos abundancia de salud y de paz.
    - - Tú que hiciste de María la llena de gracia,
      - concede la abundancia de tu gracia a todos los hombres.
    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús.
    respuesta: Que la llena de gracia interceda por nosotros.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor, que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oracion: Haz venir, Señor, sobre nosotros la poderosa intercesión de la gloriosa Virgen María, para que, protegidos con su auxilio, podamos llegar a tu monte santo, que es Jesucristo, tu Hijo. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA MARÍA MAGDALENA:
  grado: Memoria
  fecha: 07-22
  comun: Del Común de santas mujeres.
  himno: Un amor casto y puro
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
  responsorio:
  - - V
    - María, no llores más, el Señor ha resucitado de entre los muertos.
  - - R
    - María, no llores más, el Señor ha resucitado de entre los muertos.
  - - V
    - 'Ve a mis hermanos y diles:'
  - - R
    - El Señor ha resucitado de entre los muertos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - María, no llores más, el Señor ha resucitado de entre los muertos.
  ant_magnificat: María vino a anunciar a los discípulos que había visto al Señor. Aleluia.
  preces:
    intro: 'Unidos, hermanos, a las mujeres santas, aclamemos a Jesús, nuestro Salvador, y supliquémosle diciendo:'
    preces:
    - - Señor Jesús, que perdonaste a la mujer pecadora sus muchos pecados porque tenía mucho amor,
      - perdónanos también a nosotros porque hemos pecado mucho.
    - - Señor Jesús, que fuiste asistido en tu misión evangélica por mujeres piadosas,
      - haz que también nosotros seamos fieles en nuestra misión apostólica.
    - - Señor Jesús, a quien María escuchaba y Marta servía,
      - concédenos servirte siempre con fe y amor.
    - - Señor Jesús, que llamaste hermano, hermana y madre a todos los que cumplen tu voluntad,
      - haz que todos nosotros la cumplamos siempre de palabra y de obra.
    respuesta: Ven, Señor Jesús.
  padrenuestro_intro: 'Fieles a la recomendación del Salvador, digamos al Padre común:'
  oracion: Dios nuestro, que quisiste que santa María Magdalena fuese la primera en recibir de tu Hijo unigénito la misión de anunciar el gozo pascual, concédenos, por su intercesión, que, siguiendo su ejemplo, demos a conocer a Cristo resucitado y merezcamos contemplarlo luego reinando en tu gloria. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN FRANCISCO SOLANO, presbítero:
