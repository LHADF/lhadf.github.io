  preces:
    intro: 'Oremos, hermanos, a nuestro Salvador, que dio su vida para reunir a los hijos de Dios dispersos, y digámosle:'
    preces:
    - - Señor Jesús, que cimentaste tu casa en la roca,
      - confirma y robustece la fe y la esperanza de tu Iglesia.
    - - Señor Jesús, de cuyo costado salió sangre y agua,
      - renueva la Iglesia con los sacramentos de la nueva y eterna alianza.
    - - Señor Jesús, que estás en medio de los que se reúnen en tu nombre,
      - atiende la oración unánime de tu Iglesia congregada.
    - - Señor Jesús, que con el Padre haces morada en los que te aman,
      - perfecciona a tu Iglesia por la caridad.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Señor Jesús, que no echas fuera a ninguno de los que vienen a ti, acoge a todos los difuntos en la mansión del Padre. Terminemos nuestra oración con las palabras que Cristo nos enseñó:'
  oracion: 'Señor, tú que con piedras vivas y elegidas edificas el templo eterno de tu gloria: acrecienta los dones que el Espíritu ha dado a la Iglesia para que tu pueblo fiel, creciendo como cuerpo de Cristo, llegue a ser la nueva y definitiva Jerusalén. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.'
