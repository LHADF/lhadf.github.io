NUESTRA SEÑORA DE GUADALUPE:
  grado: Fiesta
  fecha: 12-12
  comun: Del Común de la Santísima Virgen María.
  himno: Morenez de morena hermosura
  salmodia:
  - ant: He elegido y santificado este lugar, para que en él permanezca mi nombre para siempre y estén fijos en él mis ojos y mi corazón.
    salmo: salmo-121
  - ant: Reconozcan, Señor, que aquí está tu mano, que eres tú quien lo ha hecho.
    salmo: salmo-126
  - ant: El gorrión ha encontrado una casa, y la tórtola ha hallado un nido para colocar a sus polluelos.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Ap 21, 2-3
    texto: 'Vi la ciudad santa, la nueva Jerusalén, que descendía del cielo, enviada por Dios, arreglada como una novia que se adorna para su esposo. Y escuché una voz potente que decía desde el trono: «Ésta es la morada de Dios con los hombres, y acampará entre ellos. Ellos serán su pueblo y Dios estará con ellos.»'
  responsorio:
  - - V
    - Se levantaron sus hijos, y la proclamaron bienaventurada.
  - - R
    - Se levantaron sus hijos, y la proclamaron bienaventurada.
  - - V
    - Ella abrió sus labios con sabiduría y su lengua pronunció palabras de amor.
  - - R
    - Y la proclamaron bienaventurada.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Se levantaron sus hijos, y la proclamaron bienaventurada.
  ant_magnificat: Las aguas torrenciales no han podido apagar el amor, ni los ríos extinguirlo.
  preces:
    intro: 'Elevemos nuestras súplicas a Dios, que quiso enviarnos a la Santísima Virgen María para darnos consuelo en nuestras penas y llevarnos hacia él; pidámosle confiadamente:'
    preces:
    - - Tú que has hecho surgir a la Santísima Virgen María como el sol sobre los montes para iluminar a tu Iglesia, haz que, bajo el influjo de su belleza y de su amor, reine la justicia y la paz en todo el mundo.
      - Señor, Dios nuestro, que quisiste que la Madre de tu Hijo imprimiera su figura en el ayate del indio Juan Diego y tomara nuestros rasgos, haz que copiemos en nosotros sus virtudes y su amor hacia los pobres y desamparados.
    - - Tú que, por medio de María, convertiste la aridez del Tepeyac en jardín florido y perfumado, trasforma a nuestro pueblo, por medio de ella, en un plantío fecundo de verdaderos cristianos.
      - Haz que aprendamos de Juan Diego la sencillez y la humildad, la constancia en el sufrimiento y la fidelidad a tu santísima Madre.
    respuesta: Concédenos su amor, auxilio y defensa.
  padrenuestro_intro: 'Tú que has constituido a la Virgen María como protectora de todos los que la invoquen y en ella confíen, haz llegar la luz de su consuelo hasta los miembros de tu pueblo santo que ya han salido de este mundo. Unidos fraternalmente bajo la protección maternal de María, digamos a Dios con profunda confianza filial:'
  oracion: Señor, Dios nuestro, que has concedido a tu pueblo la protección maternal de la siempre Virgen María, Madre de tu Hijo, concédenos, por su intercesión, permanecer siempre firmes en la fe y servir con sincero amor a nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA LUCÍA, virgen y mártir:
  grado: Memoria
  fecha: 12-13
  comun: Del Común de un mártir.
  himno: Oh Dios, que eres el premio, la corona
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  - - R
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  - - V
    - Nos refinaste como refinan la plata.
  - - R
    - Pero nos has dado respiro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  ant_magnificat: Con tu constancia, Lucía, esposa de Cristo, has salvado tu vida; despreciaste las cosas del mundo, y ahora brillas entre los ángeles; con tu propia sangre has vencido al enemigo.
  preces:
    intro: 'En esta hora en la que el Señor, cenando con sus discípulos, presentó al Padre su propia vida que luego entregó en la cruz, aclamemos al Rey de los mártires, diciendo:'
    preces:
    - - Te damos gracias, Señor, principio, ejemplo y rey de los mártires,
      - porque nos amaste hasta el extremo.
    - - Te damos gracias, Señor, porque no cesas de llamar a los pecadores arrepentidos
      - y les das parte en los premios de tu reino.
    - - Te damos gracias, Señor, porque hoy hemos ofrecido, como sacrificio para el perdón de los pecados,
      - la sangre de la alianza nueva y eterna.
    - - Te damos gracias, Señor,
      - porque con tu gracia nos has dado perseverar en la fe durante el día que ahora termina.
    respuesta: Te glorificamos, Señor.
  padrenuestro_intro: 'Te damos gracias, Señor, porque has asociado a nuestros hermanos difuntos a tu muerte. Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Te pedimos, Señor, por intercesión de santa Lucía, virgen y mártir, que llenes de luz y de gozo nuestros corazones, y que quienes hoy celebramos su martirio en la tierra lleguemos a contemplar con nuestros propios ojos tu gloria en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN DE LA CRUZ, presbítero y doctor de la Iglesia:
  grado: Memoria
  fecha: 12-14
  comun: Del Común de pastores para un santo presbítero y del Común de doctores de la Iglesia.
  himno: Verbo de Dios, eterna luz divina
  lectura:
    ref: St 3, 17-18
    texto: La sabiduría que viene de arriba ante todo es pura y, además, es amante de la paz, comprensiva, dócil, llena de misericordia y buenas obras, constante, sincera. Los que procuran la paz están sembrando la paz; y su fruto es la justicia.
  responsorio:
  - - V
    - En la asamblea le da la palabra.
  - - R
    - En la asamblea le da la palabra.
  - - V
    - Lo llena de espíritu, sabiduría e inteligencia.
  - - R
    - Le da la palabra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - En la asamblea le da la palabra.
  ant_magnificat: Oh doctor admirable, luz de la Iglesia santa, san Juan de la Cruz, fiel cumplidor de la ley, ruega por nosotros al Hijo de Dios.
  preces:
    intro: 'Glorifiquemos a Cristo, constituido pontífice en favor de los hombres en lo que se refiere a Dios, y supliquémosle humildemente diciendo:'
    preces:
    - - Tú que por medio de pastores santos y eximios has glorificado a tu Iglesia,
      - haz que todos los cristianos resplandezcan por su virtud.
    - - Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles,
      - purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos.
    - - Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos,
      - llena también de tu Espíritu a todos los pastores del pueblo de Dios.
    - - Tú que fuiste la heredad de los santos pastores,
      - no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti.
    respuesta: Salva a tu pueblo, Señor.
  padrenuestro_intro: 'Tú que por medio de los pastores de la Iglesia das la vida eterna a tus ovejas para que nadie las arrebate de tu mano, salva a los difuntos, por quienes entregaste tu vida. Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oracion: Oh Dios, que inspiraste a san Juan un amor extraordinario a la cruz y a la renuncia de sí mismo, concédenos seguir incesantemente su ejemplo, para alcanzar la gloria eterna. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ESTEBAN, protomártir:
  grado: Fiesta
  fecha: 12-26
  himno: Hermanos, Dios ha nacido
  salmodia:
  - ant: Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora.
    salmo: salmo-109-1-5-7
  - ant: Del Señor viene la misericordia y la redención copiosa.
    salmo: salmo-129
  - ant: En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo.
    salmo: cantico-col-1-12-20
  lectura:
    ref: 1Jn 1, 5b. 7
    texto: Dios es luz y en él no hay tiniebla alguna. Si caminamos en la luz, lo mismo que está él en la luz, entonces vivimos en comunión unos con otros; y la sangre de Jesús, su Hijo, nos purifica de todo pecado.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: Cuando un sosegado silencio todo lo envolvía y la noche se encontraba en la mitad de su carrera, tu Palabra omnipotente, Señor, descendió del cielo, desde el trono real. Aleluia.
  preces:
    intro: 'Acudamos a Cristo, Palabra eterna de Dios, que al poner su morada entre nosotros nos ha abierto el camino de la salvación, y digámosle con fe:'
    preces:
    - - 'Por el misterio de tu encarnación, por tu nacimiento y por tu infancia, por toda tu vida consagrada al servicio del Padre:'
      - Líbranos, Señor, de todo mal.
    - - 'Por tus trabajos, por tu predicación y por tus largas horas de camino, por toda tu vida de entrega a la salvación de los pecadores:'
      - Líbranos, Señor, de todo mal.
    - - 'Por tu agonía y tu pasión, por tu cruz y tu desamparo, por tus angustias, por tu muerte y tu sepultura:'
      - Líbranos, Señor, de todo mal.
    respuesta: Líbranos, Señor, de todo mal.
  padrenuestro_intro: 'Por tu santa resurrección y tu admirable ascensión, por el don del Espíritu Santo, por tu triunfo eterno y tu gloria, libra, Señor, a nuestros hermanos que ya han muerto. Líbranos, Señor, de todo mal. Ya que Cristo con su nacimiento ha hecho de todos nosotros los hijos de Dios, acudamos a nuestro Padre, diciendo:'
  oracion: Concédenos, Dios todopoderoso, que el nacimiento de tu Hijo en nuestra carne mortal nos libre de la antigua servidumbre del pecado que pesa aún sobre nosotros. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JUAN, apóstol y evangelista:
  grado: Fiesta
  fecha: 12-27
  himno: Norabuena vengáis al mundo
  salmodia:
  - ant: Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora.
    salmo: salmo-109-1-5-7
  - ant: Del Señor viene la misericordia y la redención copiosa.
    salmo: salmo-129
  - ant: En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Rm 8, 3b-4
    texto: Dios envió a su propio Hijo, sometido a una existencia semejante a la de la carne de pecado. Así dictó sentencia de condenación contra el pecado, que ejercía su poder en la vida según la carne. De este modo la exigencia y el fin de la ley tuvieron cumplimiento en nosotros, que no vivimos la vida puramente natural según la carne, sino la vida sobrenatural según el espíritu.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: 'Por ti, Virgen María, han llegado a su cumplimiento los oráculos de los profetas que anunciaron a Cristo: siendo virgen, concebiste al Hijo de Dios y, permaneciendo virgen, lo engendraste.'
  preces:
    intro: 'Oremos, hermanos, a Dios Padre, que por su gran amor hacia nosotros nos ha enviado a su Hijo, y digámosle:'
    preces:
    - - Dios de amor y Padre de nuestro Señor Jesucristo, tú que te has compadecido de los que viven en las tinieblas,
      - escucha las súplicas que te dirigimos por la salvación de todos los hombres.
    - - Acuérdate, Señor, de tu Iglesia extendida por toda la tierra,
      - bendice al pueblo cristiano y concédele abundancia de paz.
    - - Padre de todos los hombres, encamina a los pueblos al conocimiento de Jesucristo
      - y da a los gobernantes de las naciones la luz de tu Espíritu.
    respuesta: Que la gracia de tu Hijo nos acompañe, Señor.
  padrenuestro_intro: 'Tú que proclamaste dichosos a los que mueren en tu paz, haz que la luz eterna brille sobre los que han muerto en Cristo, para que descansen de sus fatigas y reciban el premio de sus obras. A pesar de que en el mundo existe el odio y la división, oremos a aquel que nos ha hermanado en Jesucristo, diciendo:'
  oracion: Dios todopoderoso, concédenos que, al vernos envueltos en la luz nueva de tu Palabra hecha carne, hagamos resplandecer en nuestras obras la fe que haces brillar en nuestra mente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LOS SANTOS INOCENTES, mártires:
  grado: Fiesta
  fecha: 12-28
  himno: Hoy el Verbo sacrosanto
  salmodia:
  - ant: Eres príncipe desde el día de tu nacimiento, entre esplendores sagrados; yo mismo te engendré, como rocío, antes de la aurora.
    salmo: salmo-109-1-5-7
  - ant: Del Señor viene la misericordia y la redención copiosa.
    salmo: salmo-129
  - ant: En el principio, antes de los siglos, la Palabra era Dios, y hoy esta Palabra ha nacido como Salvador del mundo.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Ef 2, 3b-5
    texto: Eramos por nuestro natural hijos de cólera, como los demás. Pero Dios, que es rico en misericordia, por el gran amor con que nos amó, aun cuando estábamos muertos por nuestros pecados, nos vivificó con Cristo —por pura gracia habéis sido salvados—.
  responsorio:
  - - V
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  - - V
    - Y puso su morada entre nosotros.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - La Palabra se hizo carne. Aleluia, aleluia.
  ant_magnificat: La Virgen inmaculada y santa nos ha engendrado a Dios, revistiéndolo con débiles miembros y alimentándolo con su leche materna; adoremos todos a este Hijo de María que ha venido a salvarnos.
  preces:
    intro: 'Dios envió a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley; fortalecidos por esta esperanza, oremos confiados, diciendo:'
    preces:
    - - Oh Dios de amor y de paz, acrecienta en todos los cristianos la fe en la encarnación de tu Hijo,
      - para que vivan siempre en continua acción de gracias.
    - - Levanta, Señor, la esperanza de los enfermos, de los pobres, de los ancianos
      - y da tu ayuda a los oprimidos, a los desalentados, a los que sufren.
    - - Acuérdate, Señor, de los que están detenidos en las cárceles
      - y de los que viven lejos de su patria.
    respuesta: Que la gracia de tu Hijo nos acompañe, Señor.
  padrenuestro_intro: 'Tú que en el nacimiento de tu Hijo quisiste que se oyeran los ángeles que cantaban tu gloria, haz que los difuntos puedan asociarse eternamente al canto de los ángeles en tu reino. Como Jesucristo, también nosotros somos hijos de Dios; por eso con él nos atrevemos a decir:'
  oracion: Dios nuestro, que de modo admirable creaste al hombre a tu imagen y semejanza y de un modo todavía más admirable elevaste su condición por medio de Jesucristo, concédenos compartir la divinidad de aquel que se ha dignado compartir nuestra humanidad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SAGRADA FAMILIA DE JESÚS MARÍA Y JOSÉ:
  grado: Fiesta
  fecha: variable
  himno: Al caer de la tarde
  salmodia:
  - ant: Al cabo de tres días hallaron a Jesús en el templo, sentado en medio de los doctores, escuchándolos y haciéndoles preguntas.
    salmo: salmo-121
  - ant: Jesús bajó a Nazaret con sus padres, y vivía sumiso a ellos.
    salmo: salmo-126
  - ant: Jesús fue progresando en perfección intelectual y física, y en gracia ante Dios y ante los hombres.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Flp 2, 6-7
    texto: Cristo, a pesar de su condición divina, no hizo alarde de su categoría de Dios, al contrario, se anonadó a sí mismo, y tomó la condición de esclavo, pasando por uno de tantos.
  responsorio:
  - - V
    - Debía ser semejante en todo a sus hermanos, para poderse apiadar de ellos.
  - - R
    - Debía ser semejante en todo a sus hermanos, para poderse apiadar de ellos.
  - - V
    - Apareció en la tierra y convivió entre los hombres.
  - - R
    - Para poderse apiadar de ellos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Debía ser semejante en todo a sus hermanos, para poderse apiadar de ellos.
  ant_magnificat: «Hijo mío, ¿por qué te has portado así con nosotros? Tu padre y yo te buscábamos llenos de angustia.» «¿Por qué me buscabais? ¿No sabíais que debo estar en la casa de mi Padre?»
  preces:
    intro: 'Adoremos a Cristo, Hijo del Dios vivo, que quiso ser también hijo de una familia humana, y aclamémoslo, diciendo:'
    preces:
    - - Cristo Jesús. por el misterio de tu sumisión a María y a José,
      - enséñanos a respetar y a obedecer a los que nos gobiernan legítimamente.
    - - Tú que amaste a tus padres y fuiste amado por ellos,
      - afianza a todas las familias en el amor y la concordia.
    - - Tú que estuviste siempre atento a las cosas de tu Padre,
      - haz que Dios sea honrado en todas las familias.
    - - Tú que quisiste que tus padres, angustiados, te encontraran al cabo de tres días en la casa de tu Padre,
      - enséñanos a buscar siempre primero el reino de Dios y su justicia.
    respuesta: Tú eres, Señor, el modelo y el salvador de los hombres.
  padrenuestro_intro: 'Tú que has dado parte en tu gloria a María y a José, admite también a nuestros difuntos en la familia de los santos. Alegres porque Jesucristo nos ha hecho hijos de Dios, digamos:'
  oracion: Dios nuestro, que has querido darnos en la Sagrada Familia ejemplos preclaros de virtudes domésticas, concédenos saber imitar su vida y su amor recíproco, para que un día podamos ir a disfrutar con ella de la alegría eterna de tu morada. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
