LA PRESENTACIÓN DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Memoria
  fecha: 11-21
  comun: Del Común de la Santísima Virgen María -
  himno: Ésta era una niña
  lectura:
    ref: Ga 4, 4-5
    texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
  responsorio:
  - - V
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - V
    - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  - - R
    - El Señor está contigo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  ant_magnificat: 'Dichosa tú, siempre Virgen María y santa Madre de Dios, templo del Señor, sagrario del Espíritu Santo: tú fuiste la única que agradaste plenamente a nuestro Señor Jesucristo.'
  preces:
    intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    preces:
    - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
      - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - - Tú que nos diste a María por madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores
      - y a todos abundancia de salud y de paz.
    - - Tú que hiciste de María la llena de gracia,
      - concede la abundancia de tu gracia a todos los hombres.
    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús.
    respuesta: Que la llena de gracia interceda por nosotros.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor, que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oracion: Señor, Dios nuestro, al celebrar esta festividad de la Santísima Virgen María, te pedimos, por su intercesión, nos concedas también a nosotros participar de la plenitud de tu gracia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRO SEÑOR JESUCRISTO, REY UNIVERSAL · I Vísperas:
  grado: Solemnidad
  fecha: variable
  himno: Oh príncipe absoluto de los siglos
  salmodia:
  - ant: Será llamado Príncipe de la paz, y su trono estará firmemente asentado para siempre.
    salmo: salmo-112
  - ant: Su reino es un reino eterno, y todos los imperios lo servirán y lo obedecerán.
    salmo: salmo-116
  - ant: 'A Cristo se le ha otorgado el imperio, el honor y la realeza: todos los pueblos, naciones y lenguas por siempre lo servirán.'
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: Cf. Ef 1, 20-23
    texto: Dios resucitó a Cristo de entre los muertos y lo constituyó a su diestra en los cielos, por encima de todo principado, potestad, virtud y dominación, y de todo ser que exista no sólo en el mundo presente, sino también en el futuro. Todo lo puso bajo sus pies y lo dio a la Iglesia, que es su cuerpo, como cabeza, sobre todo, es decir, como plenitud de aquel que lo llena todo en todo.
  responsorio:
  - - V
    - Tuya es la grandeza y el poder, tuyo, Señor, es el reino.
  - - R
    - Tuya es la grandeza y el poder, tuyo, Señor, es el reino.
  - - V
    - Tú gobiernas todo el universo.
  - - R
    - Tuyo, Señor, es el reino.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Tuya es la grandeza y el poder, tuyo, Señor, es el reino.
  ant_magnificat: El Señor Dios le dará el trono de David, su padre; reinará en la casa de Jacob para siempre, y su reino no tendrá fin. Aleluia.
  preces:
    intro: 'Hermanos, adoremos a Cristo Rey, el cual existe antes que todas las cosas, y en quien todas las cosas tienen su razón de ser. Elevemos a él nuestra voz, clamando:'
    preces:
    - - Cristo, nuestro rey y pastor, congrega a tus ovejas de todos los puntos de la tierra
      - y apaciéntalas en verdes praderas de pastos abundantes.
    - - 'Cristo, nuestro salvador y nuestro guía, reúne a todos los hombres dentro de tu pueblo santo: sana a los enfermos, busca a los extraviados, conserva a los fuertes,'
      - haz volver a los que se han alejado, congrega a los dispersos, alienta a los desanimados.
    - - Juez eterno, cuando pongas tu reino en manos de tu Padre, colócanos a tu derecha
      - y haz que poseamos el reino que nos ha sido preparado desde la creación del mundo.
    - - Príncipe de la paz, quebranta las armas homicidas
      - e infunde en todas las naciones el amor a la paz.
    - - Heredero universal de todas las naciones, haz entrar a la humanidad con todos sus bienes al reino de tu Iglesia que tu Padre te ha dado,
      - para que todos, unidos en el Espíritu Santo, te reconozcan como su cabeza.
    respuesta: Que venga tu reino, Señor.
  padrenuestro_intro: 'Cristo, primogénito de entre los muertos y primicia de los que duermen, admite a los fieles difuntos a la gloria de tu resurrección. Con la confianza que nos da el ser participantes de la realeza de Cristo y coherederos de su reino, elevemos nuestra voz al Padre celestial:'
  oracion: Dios todopoderoso y eterno, que quisiste fundar todas las cosas en tu Hijo muy amado, rey del universo, haz que toda creatura, libertada de toda esclavitud, sirva a tu majestad y te alabe eternamente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRO SEÑOR JESUCRISTO, REY UNIVERSAL:
  grado: Solemnidad
  fecha: variable
  himno: Oh príncipe absoluto de los siglos
  salmodia:
  - ant: Se sentará sobre el trono de David para reinar eternamente. Aleluia.
    salmo: salmo-109-1-5-7
  - ant: Tu reinado es un reinado perpetuo, tu gobierno va de edad en edad.
    salmo: salmo-144-i
  - ant: 'Lleva escrito sobre su manto y en su estandarte este nombre: «Rey de reyes y Señor de señores.» A él la gloria y el poder por los siglos de los siglos.'
    salmo: cantico-ap-19-1-2-5-7
  lectura:
    ref: 1Co 15, 25-28
    texto: Cristo debe reinar hasta poner todos sus enemigos bajo sus pies. El último enemigo aniquilado será la muerte. Porque Dios ha sometido todas las cosas bajo sus pies. Mas cuando él dice que «todo está sometido», es evidente que se excluye a aquel que ha sometido a él todas las cosas. Cuando hayan sido sometidas a él todas las cosas, entonces también el Hijo se someterá a aquel que ha sometido a él todas las cosas, para que Dios sea todo en todo.
  responsorio:
  - - V
    - Tu trono, Señor, permanece para siempre.
  - - R
    - Tu trono, Señor, permanece para siempre.
  - - V
    - Tu cetro real es cetro de rectitud.
  - - R
    - Permanece para siempre.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Tu trono, Señor, permanece para siempre.
