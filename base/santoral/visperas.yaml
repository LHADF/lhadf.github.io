SAN JUAN BOSCO, presbítero:
  grado: Memoria
  fecha: 01-31
  comun: 'Del Común de santos varones: para los santos educadores.'
  himno: Cuando, Señor, el día ya declina
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
  responsorio:
  - - V
    - El Señor es justo y ama la justicia.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Los buenos verán su rostro.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es justo y ama la justicia.
  ant_magnificat: 'Dejad que los niños se acerquen a mí: no se lo impidáis; de los que son como ellos es el reino de Dios.'
  preces:
    intro: 'Pidamos a Dios Padre, fuente de toda santidad, que con la intercesión y el ejemplo de los santos nos ayude, y digamos:'
    preces:
    - - Padre santo, que has querido que nos llamemos y seamos hijos tuyos,
      - haz que la Iglesia santa, extendida por los confines de la tierra, cante tus grandezas.
    - - Padre santo, que deseas que vivamos de una manera digna, buscando siempre tu beneplácito,
      - ayúdanos a dar fruto de buenas obras.
    - - Padre santo, que nos reconciliaste contigo por medio de Cristo,
      - guárdanos en tu nombre para que todos seamos uno.
    - - Padre santo, que nos convocas al banquete de tu reino,
      - haz que comiendo el pan que ha bajado del cielo alcancemos la perfección del amor.
    respuesta: Haz que seamos santos, porque tú, Señor, eres santo.
  padrenuestro_intro: 'Padre santo, perdona a los pecadores sus delitos y admite a los difuntos en tu reino para que puedan contemplar tu rostro. Porque nos llamamos y somos hijos de Dios, nos atrevemos a decir:'
  oracion: Señor Dios nuestro, que has dado a la Iglesia, en el presbítero san Juan Bosco, un padre y un maestro de la juventud, concédenos que, movidos por un amor semejante al suyo, nos entreguemos a tu servicio, trabajando por la salvación de nuestros hermanos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA PRESENTACIÓN DEL SEÑOR:
  grado: Fiesta
  fecha: 02-02
  himno: De una Virgen hermosa
  salmodia:
  - ant: El Espíritu Santo había revelado a Simeón que no moriría sin haber visto antes al Ungido del Señor.
    salmo: salmo-109-1-5-7
  - ant: Ofrecieron por él al Señor un par de tórtolas o de pichones.
    salmo: salmo-129
  - ant: Mis ojos han visto a tu Salvador, a quien has presentado ante todos los pueblos.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Hb 4, 15-16
    texto: No tenemos un sacerdote incapaz de compadecerse de nuestras debilidades, al contrario, él mismo pasó por todas las pruebas a semejanza nuestra, fuera del pecado. Acerquémonos, pues, con seguridad y confianza a este trono de la gracia. Aquí alcanzaremos misericordia y hallaremos gracia para ser socorridos en el momento oportuno.
  responsorio:
  - - V
    - El Señor revela su salvación.
  - - R
    - El Señor revela su salvación.
  - - V
    - Que presentó ante todos los pueblos.
  - - R
    - Su salvación.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor revela su salvación.
  ant_magnificat: Hoy la Virgen María presentó al niño Jesús en el templo, y Simeón, lleno del Espíritu Santo, lo tomó en sus brazos y bendijo a Dios.
  preces:
    intro: 'Adoremos a Cristo, nuestro salvador presentado en el templo, y supliquémosle, diciendo:'
    preces:
    - - Cristo salvador, tú que eres la luz para alumbrar las naciones,
      - ilumina a los que aún te desconocen y haz que crean en ti, Dios verdadero.
    - - Redentor nuestro y gloria de tu pueblo Israel,
      - haz que tu Iglesia sea la luz de las naciones.
    - - Señor Jesucristo, deseado de todos los pueblos y contemplado por los ojos del justo Simeón,
      - haz que todos los hombres puedan alcanzar tu salvación.
    - - Señor, que dispusiste que, al ser tú presentado en el templo, el justo Simeón anunciara a tu madre que una espada atravesaría su alma,
      - fortifica a quienes sufren tribulaciones a causa de tu servicio.
    respuesta: Que nuestros ojos vean tu salvación.
  padrenuestro_intro: 'Cristo, felicidad de los santos, a quien Simeón pudo contemplar antes de la muerte como tanto había deseado, haz que los difuntos que desean contemplar tu rostro se sacien de tu visión. Con el deseo de que la luz de Cristo ilumine a todos los hombres, pidamos al Padre que su reino llegue al mundo:'
  oracion: Dios todopoderoso y eterno, en este día en que tu Hijo único fue presentado en el templo con un cuerpo como el nuestro, te pedimos nos concedas a nosotros poder ser presentados ante ti, plenamente renovados en nuestro espíritu. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA ÁGUEDA, virgen y mártir:
  grado: Memoria
  fecha: 02-05
  comun: Del Común de un mártir.
  himno: Oh Dios, que eres el premio, la corona
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  - - R
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  - - V
    - Nos refinaste como refinan la plata.
  - - R
    - Pero nos has dado respiro.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Oh Dios, nos pusiste a prueba, pero nos has dado respiro.
  ant_magnificat: Señor Jesús, maestro bueno, te doy gracias por que me has hecho vencer los tormentos de mis verdugos; haz, Señor, que llegue felizmente a la felicidad de tu reino eterno.
  preces:
    intro: 'En esta hora en la que el Señor, cenando con sus discípulos, presentó al Padre su propia vida que luego entregó en la cruz, aclamemos al Rey de los mártires, diciendo:'
    preces:
    - - Te damos gracias, Señor, principio, ejemplo y rey de los mártires,
      - porque nos amaste hasta el extremo.
    - - Te damos gracias, Señor, porque no cesas de llamar a los pecadores arrepentidos
      - y les das parte en los premios de tu reino.
    - - Te damos gracias, Señor, porque hoy hemos ofrecido, como sacrificio para el perdón de los pecados,
      - la sangre de la alianza nueva y eterna.
    - - Te damos gracias, Señor,
      - porque con tu gracia nos has dado perseverar en la fe durante el día que ahora termina.
    respuesta: Te glorificamos, Señor.
  padrenuestro_intro: 'Te damos gracias, Señor, porque has asociado a nuestros hermanos difuntos a tu muerte. Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Que nos alcancen tu perdón, Señor, las súplicas de santa Águeda, ella que tanto te agradó por el resplandor de su virginidad y por la fortaleza de su martirio. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
