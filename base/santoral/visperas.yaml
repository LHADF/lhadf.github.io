LA ASUNCIÓN DE LA SANTÍSIMA VIRGEN MARÍA · I Vísperas:
  grado: Solemnidad
  fecha: 08-15
  himno: El cielo se maravilla
  salmodia:
  - ant: Subió Cristo al cielo y preparó una mansión de inmortalidad a su Madre purísima. Aleluia.
    salmo: salmo-112
  - ant: Por Eva se cerraron a los hombres las puertas del paraíso, y por María Virgen han sido abiertas de nuevo. Aleluia.
    salmo: salmo-147
  - ant: La Virgen María ha sido glorificada por encima de todos los ángeles y santos; venid, pues, y alabemos a Cristo, el rey cuyo reino no tendrá fin.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Rm 8, 30
    texto: A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.
  responsorio:
  - - V
    - María ha sido elevada al cielo, los ángeles se alegran.
  - - R
    - María ha sido elevada al cielo, los ángeles se alegran.
  - - V
    - Y, llenos de gozo, alaban al Señor.
  - - R
    - Los ángeles se alegran.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - María ha sido elevada al cielo, los ángeles se alegran.
  ant_magnificat: Me felicitarán todas las generaciones, porque el poderoso ha hecho obras grandes por mí. Aleluia.
  preces:
    intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    preces:
    - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
      - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - - Tú que nos diste a María por Madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores,
      - y a todos abundancia de salud y de paz.
    - - Tú que hiciste de María la llena de gracia,
      - concede la abundancia de tu gracia a todos los hombres.
    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús.
    respuesta: Mira a la llena de gracia y escúchanos.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oracion: Señor Dios todopoderoso, tú que, mirando complacido la profunda humildad de la siempre Virgen María, la elevaste a la excelsa dignidad de ser madre de tu Hijo hecho hombre y, en este día, la coronaste de gloria y de honor, concédenos, por su intercesión, que, ya que como María tenemos parte en tu redención, alcancemos, también como ella, la gloria del reino de los cielos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
