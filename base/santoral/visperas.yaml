  oracion: Señor Dios, que cuidas a tu pueblo con ternura y lo gobiernas con amor, te pedimos que, por intercesión del papa san Gregorio Magno, concedas el espíritu de sabiduría a quienes has establecido como maestros y pastores de la Iglesia, para que así el progreso de los fieles constituya el gozo eterno de sus pastores. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA NATIVIDAD DE LA SANTÍSIMA VIRGEN MARÍA:
  grado: Fiesta
  fecha: 09-08
  comun: Del Común de la santísima Virgen María.
  himno: Vino a la vida para que la muerte
  salmodia:
  - ant: De la estirpe de Jesé nació la Virgen María, en cuyo tálamo tuvo morada el Espíritu del Dios altísimo.
    salmo: salmo-121
  - ant: Hoy es el nacimiento de santa María Virgen, cuya hermosura y humildad miró Dios complacido.
    salmo: salmo-126
  - ant: Bendita y venerable eres, santa María, virgen y madre de Dios; al celebrar tu nacimiento, te pedimos que intercedas por nosotros al Señor, nuestro Dios.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Rm 9, 4-5
    texto: Son ellos israelitas, de quienes es la adopción divina, la manifestación sensible de la presencia de Dios, las alianzas con él, la legislación de Moisés, el culto del templo y las promesas de Dios. De ellos son los patriarcas, y de ellos procede también Cristo según la carne, el cual está por encima de todas las cosas, Dios bendito por los siglos. Amén.
  responsorio:
  - - V
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  - - V
    - Bendita tú entre las mujeres y bendito el fruto de tu vientre.
  - - R
    - El Señor está contigo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alégrate, María, llena de gracia, el Señor está contigo.
  ant_magnificat: Celebremos el nacimiento glorioso de la Virgen María, quien, ante el anuncio del ángel, concibió al Redentor del mundo, porque Dios había mirado su humillación.
  preces:
    intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    preces:
    - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
      - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - - Tú que nos diste a María por Madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores,
      - y a todos abundancia de salud y de paz.
    - - Tú que hiciste de María la llena de gracia,
      - concede la abundancia de tu gracia a todos los hombres.
    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús.
    respuesta: Mira a la llena de gracia y escúchanos.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oracion: Concede a tus siervos, Señor, el don de tu gracia, para que, a quienes recibimos las primicias de la salvación por la maternidad de la Virgen María, la fiesta anual de su nacimiento nos traiga aumento de paz. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
