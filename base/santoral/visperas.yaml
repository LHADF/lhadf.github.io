    ref: Ap 21, 2-3. 22. 27
    texto: 'Vi la ciudad santa, la nueva Jerusalén, que descendía del cielo, enviada por Dios, arreglada como una novia que se adorna para su esposo. Y escuché una voz potente que decía desde el trono: «Ésta es la morada de Dios con los hombres, y acampará entre ellos. Ellos serán su pueblo y Dios estará con ellos.» Pero no vi santuario alguno en ella; porque el Señor, Dios todopoderoso, y el Cordero, es su santuario. Nada profano entrará en ella, ni los que cometen abominación y mentira, sino solamente los inscritos en el libro de la vida del Cordero.'
  responsorio:
  - - V
    - Dichosos, Señor, los que habitan en tu casa.
  - - R
    - Dichosos, Señor, los que habitan en tu casa.
  - - V
    - Alabándote siempre.
  - - R
    - En tu casa.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Dichosos, Señor, los que habitan en tu casa.
