SANTOS ARCÁNGELES MIGUEL GABRIEL Y RAFAEL:
  grado: Fiesta
  fecha: 09-29
  himno: Envía Cristo a tu valiente jefe
  salmodia:
  - ant: Ensalzaste tu majestad sobre los cielos, oh Rey de los ángeles.
    salmo: salmo-8
  - ant: Delante de los ángeles tañeré para ti, Dios mío.
    salmo: salmo-137
  - ant: Vi en medio, donde estaba el trono, un Cordero en pie y como degollado; y oí un coro de muchos ángeles alrededor del trono.
    salmo: cantico-col-1-12-20
  lectura:
    ref: Ap 1, 4b-5
    texto: Gracia y paz a vosotros de parte de aquel que es, que era y que será; de parte de los siete espíritus que están ante su trono; y de parte de Jesucristo, el testigo veraz, el primogénito de entre los muertos, el príncipe de los reyes de la tierra, aquel que nos ama y que nos ha lavado de nuestros pecados con su sangre.
  responsorio:
  - - V
    - El humo del incienso subió a la presencia de Dios.
  - - R
    - El humo del incienso subió a la presencia de Dios.
  - - V
    - De mano del ángel.
  - - R
    - A la presencia de Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El humo del incienso subió a la presencia de Dios.
  ant_magnificat: 'El ángel Gabriel dijo a María: «Concebirás y darás a luz un hijo, a quien llamarás Jesús.»'
  preces:
    intro: 'Oremos al Señor, pidiéndole que nos haga siempre prontos a la voz de su palabra, como los ángeles, y supliquémosle, diciendo:'
    preces:
    - - Para que, por mano de los ángeles, suban nuestras oraciones hasta ti como aroma de perfume.
      - Para que, por mano de los ángeles, sean llevadas nuestras ofrendas a tu presencia hasta el altar del cielo.
    - - Para que, con el ejército celestial de los ángeles, demos gloria a Dios en el cielo y anunciemos en la tierra la paz a los hombres.
      - Para que, al fin de nuestra vida, nos reciban los ángeles y nos lleven a la patria del paraíso.
    respuesta: Escúchanos, Señor.
  padrenuestro_intro: 'Para que el arcángel san Miguel conduzca a todos los difuntos al lugar de la luz y de la paz. Terminemos nuestra oración con las palabras del Señor:'
  oracion: Señor Dios todopoderoso, que, con una providencia admirable, llamas a los ángeles y a los hombres para que cooperen a tu plan de salvación, haz que, durante nuestro peregrinar en la tierra, nos sintamos siempre protegidos por los ángeles, que en el cielo están en tu presencia para servirte y gozan ya contemplando tu rostro. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN JERÓNIMO, presbítero y doctor de la iglesia:
  grado: Memoria
  fecha: 09-30
  comun: Del Común de doctores de la Iglesia.
  himno: Verbo de Dios, eterna luz divina
  lectura:
    ref: St 3, 17-18
    texto: La sabiduría que viene de arriba ante todo es pura y, además, es amante de la paz, comprensiva, dócil, llena de misericordia y buenas obras, constante, sincera. Los que procuran la paz están sembrando la paz; y su fruto es la justicia.
  responsorio:
