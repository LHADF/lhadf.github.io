LA CONVERSIÓN DE SAN PABLO:
  grado: Fiesta
  fecha: 01-25
  himno: Tan cerca, Saulo, de nosotros
  salmodia:
  - ant: Muy a gusto presumo de mis debilidades, porque así residirá en mí la fuerza de Cristo.
    salmo: salmo-115
  - ant: Yo planté, Apolo regó, pero fue Dios quien dio el crecimiento.
    salmo: salmo-125
  - ant: Para mí la vida es Cristo, y la muerte una ganancia; líbreme Dios de gloriarme si no es en la cruz de nuestro Señor Jesucristo.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: 1Co 15, 9-10
    texto: Yo soy el menor de los apóstoles, indigno del nombre de apóstol, pues perseguí a la Iglesia de Dios. Mas, por la gracia de Dios, soy lo que soy; y la gracia que él me concedió no quedó infecunda en mí. He trabajado con más afán que todos ellos, aunque no yo, sino la gracia de Dios que está conmigo.
  responsorio:
  - - V
    - Te doy gracias, Señor, de todo corazón.
  - - R
    - Te doy gracias, Señor, de todo corazón.
  - - V
    - Tañeré en honor de tu nombre entre las naciones.
  - - R
    - De todo corazón.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Te doy gracias, Señor, de todo corazón.
  ant_magnificat: Apóstol san Pablo, predicador de la verdad y maestro de los gentiles, intercede por nosotros ante Dios que te eligió.
  preces:
    intro: 'Hermanos: Edificados sobre el cimiento de los apóstoles, oremos al Padre por su pueblo santo, diciendo:'
    preces:
    - - Padre santo, que quisiste que tu Hijo resucitado de entre los muertos se manifestara en primer lugar a los apóstoles,
      - haz que también nosotros seamos testigos de Cristo hasta los confines del mundo.
    - - Padre santo, tú que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
      - haz que el Evangelio sea proclamado a toda la creación.
    - - Tú que enviaste a tu Hijo a sembrar la semilla de la palabra,
      - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
    - - Tú que enviaste a tu Hijo para que reconciliara el mundo contigo,
      - haz que también nosotros cooperemos a la reconciliación de los hombres.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Tú que quisiste que tu Hijo resucitara el primero de entre los muertos, concede a todos los que son de Cristo resucitar con él, el día de su venida. Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  oracion: Señor Dios, que has iluminado al mundo entero con la palabra del apóstol san Pablo, haz que quienes recordamos hoy su conversión, imitando sus ejemplos, anunciemos el Evangelio al mundo y seamos así testigos de tu verdad. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS TIMOTEO Y TITO, obispos:
