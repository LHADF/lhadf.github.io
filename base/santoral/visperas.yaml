    preces:
    - - Tú que diste a María el gozo de la maternidad,
      - concede a todos los padres y madres de familia poder alegrarse en sus hijos.
    - - Rey pacífico, cuyo reino es justicia y paz,
      - haz que busquemos siempre lo que lleve a la paz.
    - - Tú que viniste para hacer del género humano el pueblo de Dios,
      - haz que todas las naciones alcancen la concordia mutua y vivan como una sola familia.
    - - Tú que al nacer en una familia fortaleciste los vínculos familiares,
      - haz que las familias vean crecer su unidad.
    respuesta: Hijo de la Virgen María, escúchanos.
  padrenuestro_intro: 'Tú que quisiste nacer en el tiempo, concede a los difuntos nacer a tu eternidad. Con el deseo de que la luz de Cristo ilumine a todos los hombres y que su amor se extienda por toda la tierra, pidamos al Padre que su reino venga a nosotros:'
  oracion: Señor Dios, que por la maternidad virginal de María has dado a los hombres los tesoros de la salvación, haz que sintamos la intercesión de la Virgen Madre, de quien hemos recibido al autor de la vida, Jesucristo, Hijo tuyo y Señor nuestro. Él, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS BASILIO MAGNO Y GREGORIO NACIANZO, obispos y doctores de la Iglesia:
  grado: Memoria
  fecha: 01-02
  comun: Del común de doctores de la Iglesia.
  himno: Verbo de Dios, eterna luz divina
  salmodia:
  - ant: Eres el más bello de los hombres, en tus labios se derrama la gracia.
    salmo: salmo-44-i
  - ant: Llega el esposo, salid a recibirlo.
    salmo: salmo-44-ii
  - ant: Dios proyectó hacer que todas las cosas tuviesen a Cristo por cabeza, cuando llegase el momento culminante.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: St 3, 17-18
    texto: La sabiduría que viene de arriba ante todo es pura y, además, es amante de la paz, comprensiva, dócil, llena de misericordia y buenas obras, constante, sincera. Los que procuran la paz están sembrando la paz; y su fruto es la justicia.
  responsorio:
  - - V
    - En la asamblea le da la palabra.
  - - R
    - En la asamblea le da la palabra.
  - - V
    - Lo llena de espíritu, sabiduría e inteligencia.
  - - R
    - Le da la palabra.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - En la asamblea le da la palabra.
  ant_magnificat: Quien cumpla y enseñe mi ley será grande en el reino de los cielos.
  preces:
    intro: 'Glorifiquemos a Cristo, constituido pontífice en favor de los hombres en lo que se refiere a Dios, y supliquémosle humildemente diciendo:'
    preces:
    - - Tú que por medio de pastores santos y eximios has glorificado a tu Iglesia,
      - haz que todos los cristianos resplandezcan por su virtud.
    - - Tú que por la oración de los santos pastores, que a semejanza de Moisés oraban por el pueblo, perdonaste los pecados de tus fieles,
      - purifica y santifica también ahora a la santa Iglesia por la intercesión de los santos.
    - - Tú que de entre los fieles elegiste a los santos pastores y, por tu Espíritu, los consagraste como ministros en bien de sus hermanos,
      - llena también de tu Espíritu a todos los pastores del pueblo de Dios.
    - - Tú que fuiste la heredad de los santos pastores,
      - no permitas que ninguno de los que fueron adquiridos por tu sangre viva alejado de ti.
    respuesta: Salva a tu pueblo, Señor.
  padrenuestro_intro: 'Tú que por medio de los pastores de la Iglesia das la vida eterna a tus ovejas para que nadie las arrebate de tu mano, salva a los difuntos, por quienes entregaste tu vida. Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oracion: Señor Dios, que has iluminado a la Iglesia con los ejemplos y las enseñanzas de san Basilio Magno y san Gregorio de Nacianzo, haz que busquemos humildemente tu verdad y que, viviendo según esta verdad, crezcamos en el amor. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
