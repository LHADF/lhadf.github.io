  oracion: Señor nuestro Jesucristo, que en este sacramento admirable nos dejaste el memorial de tu pasión, concédenos venerar de tal modo los sagrados misterios de tu cuerpo y de tu sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas con el Padre en la unidad del Espíritu Santo y eres Dios, por los siglos de los siglos.
SAN BERNABÉ, apóstol:
  grado: Memoria
  fecha: 06-11
  comun: Del Común de Apóstoles.
  himno: ¡Columnas de la Iglesia, piedras vivas!
  lectura:
    ref: Col 1, 3b-6a
    texto: Damos gracias a Dios, Padre de nuestro Señor Jesucristo, en todo momento, rezando por vosotros, al oír hablar de vuestra fe en Jesucristo y del amor que tenéis a todos los santos, por la esperanza que os está reservada en los cielos, sobre la cual oísteis hablar por la palabra verdadera de la Buena Noticia, que se os hizo presente, y está dando fruto y prosperando en todo el mundo igual que entre vosotros.
  responsorio:
  - - V
    - Contad a los pueblos la gloria del Señor.
  - - R
    - Contad a los pueblos la gloria del Señor.
  - - V
    - Sus maravillas a todas las naciones.
  - - R
    - Contad a los pueblos la gloria del Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Contad a los pueblos la gloria del Señor.
  ant_magnificat: Toda la asamblea guardó silencio y escucharon a Pablo y a Bernabé, que contaban todas las señales y prodigios que, por su medio, había obrado Dios entre los gentiles.
  preces:
    intro: 'Invoquemos a Dios, fuente de toda luz, que por medio del Evangelio de su Hijo nos ha llamado a la fe verdadera, y oremos por su pueblo santo, diciendo:'
    preces:
    - - Padre santo, que sacaste de entre los muertos a Jesús, gran pastor de las ovejas,
      - haz que nosotros seamos testigos de Cristo hasta los confines del mundo.
    - - Padre santo, tú que enviaste a tu Hijo al mundo para dar la Buena Noticia a los pobres,
      - haz que el Evangelio sea proclamado a toda la creación.
    - - Tú que enviaste a tu Hijo a sembrar la semilla de la palabra,
      - haz que, sembrando también tu palabra con nuestro esfuerzo, recojamos sus frutos con alegría.
    - - Tú que enviaste a tu Hijo para que reconciliara el mundo contigo,
      - haz que también nosotros cooperemos a la reconciliación de los hombres.
    respuesta: Acuérdate, Señor, de tu Iglesia.
  padrenuestro_intro: 'Tú que quisiste que tu Hijo resucitara el primero de entre los muertos, concede a todos los que son de Cristo resucitar con él, el día de su venida. Oremos ahora al Padre, como Jesús enseñó a los apóstoles:'
  oracion: Dios nuestro, que, después de haber infundido en abundancia la fe y el Espíritu Santo en San Bernabé, lo destinaste para que anunciara a los pueblos paganos el mensaje de salvación, haz que el Evangelio de Cristo, que él predicó valerosamente, sea proclamado con fidelidad por nuestras palabras y nuestras obras. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EL SAGRADO CORAZÓN DE JESÚS · I Vísperas:
  grado: Solemnidad
  fecha: variable
  himno: Mármol con sangre, tu frente
  salmodia:
  - ant: Con amor eterno nos amó Dios; por eso levantado sobre la tierra nos atrajo a su corazón, compadeciéndose de nosotros.
    salmo: salmo-112
  - ant: Aprended de mí que soy manso y humilde de corazón y hallaréis descanso para vuestras almas.
    salmo: salmo-145
  - ant: Yo soy el buen pastor que apaciento mis ovejas, y doy mi vida por las ovejas.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: Ef 5, 25b-27
    texto: Cristo amó a su Iglesia y se entregó a la muerte por ella para santificarla, purificándola en el baño del agua, que va acompañado de la palabra, y para hacerla comparecer ante su presencia toda resplandeciente, sin mancha ni defecto ni cosa parecida, sino santa e inmaculada.
  responsorio:
  - - V
    - Cristo nos ama y nos ha absuelto por la virtud de su sangre.
  - - R
    - Cristo nos ama y nos ha absuelto por la virtud de su sangre.
  - - V
    - Y ha hecho de nosotros reino y sacerdotes para el Dios y Padre suyo.
  - - R
    - Por la virtud de su sangre.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Cristo nos ama y nos ha absuelto por la virtud de su sangre.
  ant_magnificat: He venido a traer fuego al mundo, y ¡cuánto deseo que esté ya ardiendo!
  preces:
    intro: 'Acudamos, hermanos, a Jesús, descanso de nuestras almas fatigadas, y digámosle suplicantes:'
    preces:
    - - Oh Jesús, que quisiste ser traspasado por la lanza para que de tu corazón abierto, al brotar el agua y la sangre, naciera tu esposa la Iglesia,
      - haz que esta Iglesia sea siempre santa e inmaculada.
    - - Jesús, templo santo de Dios, destruido por los hombres y levantado nuevamente por el Padre,
      - dígnate hacer de la Iglesia morada del Altísimo.
    - - Jesús, rey y centro de todos los corazones, que con amor eterno nos amas y nos atraes con misericordia,
      - renueva tu alianza con todos los hombres.
    - - Jesús, paz y reconciliación nuestra, que has hecho las paces en un solo hombre nuevo, dando muerte al odio mediante la cruz,
      - danos acceso al Padre.
    - - Jesús, vida y resurrección nuestra, alivio de los que están cansados y descanso de los que se sienten agobiados,
      - atrae hacia ti a los pecadores.
    respuesta: Rey amantísimo, ten piedad de nosotros.
  padrenuestro_intro: 'Jesús, que por tu amor desbordante te rebajaste hasta someterte incluso a la muerte y una muerte de cruz, llama a los fieles difuntos a la resurrección. Unidos a Jesucristo, que nos ama como hermano, acudamos al Padre, diciendo:'
  oracion: Te pedimos, Dios todopoderoso y eterno, que, al celebrar la grandeza del amor que resplandece en el corazón de tu Hijo, recibamos de esta fuente divina gracias cada vez más abundantes. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
LA SANTÍSIMA TRINIDAD · I Vísperas:
  grado: Solemnidad
  fecha: variable
  himno: Cantad y alabad al Señor
  salmodia:
  - ant: Gloria a ti, oh Dios único en tres personas iguales, antes de los siglos, ahora y por toda la eternidad.
    salmo: salmo-112
  - ant: Bendita sea la Trinidad santa y la Unidad indivisa; démosle gracias porque ha tenido misericordia de nosotros.
    salmo: salmo-147
  - ant: Gloria y honor por los siglos al Dios uno en tres personas, Padre, Hijo y Espíritu Santo.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Rm 11, 33-36
    texto: ¡Qué abismo de riqueza es la sabiduría y ciencia de Dios! ¡Qué insondables son sus juicios y qué irrastreables sus caminos! ¿Quién ha conocido jamás la mente del Señor? ¿Quién ha sido su consejero? ¿Quién le ha dado primero, para que él le devuelva? Él es origen, camino y término de todo. A él la gloria por los siglos. Amén.
  responsorio:
  - - V
    - Bendigamos al Padre, al Hijo y al Espíritu Santo, ensalcémoslo con himnos por los siglos.
  - - R
    - Bendigamos al Padre, al Hijo y al Espíritu Santo, ensalcémoslo con himnos por los siglos.
  - - V
    - Honor y gloria al único Dios.
  - - R
    - Ensalcémoslo con himnos por los siglos.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Bendigamos al Padre, al Hijo y al Espíritu Santo, ensalcémoslo con himnos por los siglos.
  ant_magnificat: Gracias a ti, Señor Dios; gracias a ti, Trinidad única y verdadera, Dios único y supremo, Unidad única y santa.
  preces:
    intro: 'Glorifiquemos a Dios Padre que, por el Espíritu Santo, vivificó el cuerpo de su Hijo, para que su carne resucitada fuera fuente de vida para los hombres, y aclamemos al Dios uno y trino, diciendo:'
    preces:
    - - Padre todopoderoso y eterno, envía tu Espíritu consolador en nombre de tu Hijo sobre la Iglesia,
      - para que la conserve en la unidad de la caridad y de la verdad perfectas.
    - - Manda, Señor, trabajadores a tu mies, para que hagan discípulos de entre todos los pueblos
      - y, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo, los confirmen en la fe verdadera.
    - - Ayuda, Señor, a los perseguidos por causa de tu Hijo,
      - que el Espíritu Santo hable por ellos, como Jesucristo nos prometió.
    - - Que todos los hombres, Señor, te confiesen como único Dios en tres personas,
      - y que vivan en la fe, en la esperanza y en el amor.
    respuesta: ¡Gloria al Padre, y al Hijo, y al Espíritu Santo!
  padrenuestro_intro: 'Padre de todos los vivientes, tú que vives y reinas con el Hijo y el Espíritu Santo, recibe a nuestros hermanos difuntos en tu reino. Digamos ahora al Padre, movidos por el Espíritu Santo que ora en nosotros, la plegaria que Cristo nos enseñó:'
  oracion: Dios Padre, que has enviado al mundo la Palabra de verdad y el Espíritu de santificación para revelar a los hombres tu misterio admirable, concédenos que, al profesar la fe verdadera, reconozcamos la gloria de la eterna Trinidad y adoremos la Unidad de tu majestad omnipotente. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
