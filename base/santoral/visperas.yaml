  padrenuestro_intro: 'Tú que por medio de los pastores de la Iglesia das la vida eterna a tus ovejas para que nadie las arrebate de tu mano, salva a los difuntos, por quienes entregaste tu vida. Digamos juntos la oración que Cristo nos enseñó como modelo de toda oración:'
  oracion: Señor Dios, fortaleza de los que en ti confían, tú que quisiste que el obispo san Juan Crisóstomo brillara por su admirable elocuencia y por su gran fortaleza en medio de las pruebas, haz que la sabiduría de este eximio doctor de la Iglesia nos ilumine y que el ejemplo de su invencible constancia nos fortalezca. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
EXALTACIÓN DE LA SANTA CRUZ:
  grado: Fiesta
  fecha: 09-14
  himno: Las banderas reales se adelantan
  salmodia:
  - ant: ¡Oh gran obra de amor! Cuando en el árbol murió la Vida, con su muerte destruyó la misma muerte.
    salmo: salmo-109-1-5-7
  - ant: Adoramos, Señor, tu cruz y recordamos tu gloriosa muerte; compadécete de nosotros, tú que por nosotros padeciste.
    salmo: salmo-115
  - ant: Te adoramos, oh Cristo, y te bendecimos, porque con tu santa cruz redimiste al mundo.
    salmo: cantico-ap-4-11-5-9-10-12
  lectura:
    ref: 1Co 1, 23-24
    texto: 'Nosotros predicamos a Cristo crucificado: escándalo para los judíos, necedad para los gentiles; pero para los llamados a Cristo —judíos o griegos—: fuerza de Dios y sabiduría de Dios.'
  responsorio:
  - - V
    - Oh cruz gloriosa, en ti triunfó el Rey de los ángeles.
  - - R
    - Oh cruz gloriosa, en ti triunfó el Rey de los ángeles.
  - - V
    - Con su sangre lavó nuestras heridas.
  - - R
    - En ti triunfó el Rey de los ángeles.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Oh cruz gloriosa, en ti triunfó el Rey de los ángeles.
  ant_magnificat: Oh cruz victoriosa, signo admirable, ayúdanos a alcanzar el triunfo eterno.
  preces:
    intro: 'Oremos a nuestro Redentor, que por su cruz nos ha salvado, y digámosle confiados:'
    preces:
    - - Oh Cristo, que te anonadaste a ti mismo, tomando la condición de esclavo y pasando por uno de tantos,
      - haz que la Iglesia imite siempre tu humildad.
    - - Cristo Señor, que te rebajaste hasta someterte incluso a la muerte y una muerte de cruz,
      - haz que te sigamos por el camino de la obediencia y de la paciencia.
    - - Cristo Señor, que fuiste levantado por Dios y recibiste el «Nombre-sobre-todo-nombre»,
      - concede a todos tus fieles perseverar hasta el fin.
    - - Cristo Jesús, ante cuyo nombre se dobla toda rodilla en el cielo, en la tierra y en el abismo,
      - haz que todos los hombres te adoren y vivan en tu paz.
    respuesta: Por tu cruz, Señor, llévanos a tu reino.
  padrenuestro_intro: 'Cristo Jesús, a quien toda lengua proclamará: Señor, para gloria de Dios Padre, recibe a nuestros hermanos difuntos en el reino de la eterna felicidad. Terminemos nuestra oración con las palabras que Cristo nos enseñó:'
  oracion: Señor, Dios nuestro, que has querido salvar a los hombres por medio de tu Hijo muerto en la cruz, te pedimos, ya que nos has dado a conocer en la tierra la fuerza misteriosa de la cruz de Cristo, que podamos alcanzar en el cielo los frutos de la redención. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
NUESTRA SEÑORA DE LOS DOLORES:
  grado: Memoria
  fecha: 09-15
  comun: Del Común de la Santísima Virgen María.
  himno: ¡Virgen de vírgenes santas!
  lectura:
    ref: 2Tm 2, 10-12a
    texto: 'Todo lo soporto por los elegidos, para que también ellos alcancen la salvación que está en la incorporación a Cristo Jesús y la gloria eterna. Verdadera es la sentencia que dice: Si hemos muerto con él, viviremos también con él. Si tenemos constancia en el sufrir, reinaremos también con él.'
  responsorio:
  - - V
    - Junto a la cruz del Señor, estaba santa María, la reina del cielo y señora del mundo.
  - - R
    - Junto a la cruz del Señor, estaba santa María, la reina del cielo y señora del mundo.
  - - V
    - Feliz ella, que, sin morir, mereció la palma del martirio.
  - - R
    - La reina del cielo y señora del mundo.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Junto a la cruz del Señor, estaba santa María, la reina del cielo y señora del mundo.
  ant_magnificat: 'Viendo a su madre y al discípulo predilecto junto a ella, dijo Jesús a su madre: «Mujer, ahí tienes a tu hijo.» Luego dijo al discípulo: «Ahí tienes a tu madre.»'
  preces:
    intro: 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    preces:
    - - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
      - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - - Tú que nos diste a María por madre, concede por su mediación salud a los enfermos, consuelo a los tristes, perdón a los pecadores
      - y a todos abundancia de salud y de paz.
    - - Tú que hiciste de María la llena de gracia,
      - concede la abundancia de tu gracia a todos los hombres.
    - - Haz, Señor, que tu Iglesia tenga un solo corazón y una sola alma por el amor,
      - y que todos los fieles perseveren unánimes en la oración con María, la madre de Jesús.
    respuesta: Que la llena de gracia interceda por nosotros.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor, que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento:'
  oracion: Dios nuestro, que quisiste que la Madre de tu Hijo estuviera a su lado junto a la cruz, participando en sus sufrimientos, concede a tu Iglesia que, asociada con María a la pasión de Cristo, merezca también participar en su gloriosa resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTOS CORNELIO, Papa, y CIPRIANO, obispo, mártires:
  grado: Memoria
  fecha: 09-16
  comun: Del Común de varios mártires.
  himno: Espíritus sublimes
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuándo se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - Alegraos, justos, y gozad con el Señor.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  - - V
    - Aclamadlo, los rectos de corazón.
  - - R
    - Y gozad con el Señor.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Alegraos, justos, y gozad con el Señor.
  ant_magnificat: ¡Oh Iglesia, madre nuestra, cuán dichosa eres, ennoblecida con la sangre gloriosa de los mártires de Cristo!
  preces:
    intro: 'En esta hora en la que el Señor, cenando con sus discípulos, presentó al Padre su propia vida que luego entregó en la cruz, aclamemos al Rey de los mártires, diciendo:'
    preces:
    - - Te damos gracias, Señor, principio, ejemplo y rey de los mártires, porque nos amaste hasta el extremo.
      - Te damos gracias, Señor, porque no cesas de llamar a los pecadores arrepentidos y les das parte en los premios de tu reino.
    - - Te damos gracias, Señor, porque hoy hemos ofrecido, como sacrificio para el perdón de los pecados, la sangre de la alianza nueva y eterna.
      - Te damos gracias, Señor, porque con tu gracia nos has dado perseverar en la fe durante el día que ahora termina.
    respuesta: Te glorificamos, Señor.
  padrenuestro_intro: 'Te damos gracias, Señor, porque has asociado a nuestros hermanos difuntos a tu muerte. Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo:'
  oracion: Señor, tú que en los santos Cornelio y Cipriano diste a tu pueblo pastores llenos de celo y mártires victoriosos, concédenos por su valiosa intercesión, ser firmes e invencibles en la fe y trabajar con verdadero empeño por lograr la unidad de tu Iglesia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
