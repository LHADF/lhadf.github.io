NUESTRA SEÑORA DE LUJÁN, Patrona de la República Argentina · I Vísperas:
  grado: Solemnidad
  fecha: 05-08
  comun: Del Común de la Santísima Virgen María.
  himno: Excelsa Reina de vírgenes
  salmodia:
  - ant: Como aurora naciente, Virgen Madre de Dios, anunciaste la alegría a nuestro pueblo. Aleluia.
    salmo: salmo-112
  - ant: He elegido y santificado este lugar, para que en él permanezca mi nombre para siempre y estén fijos en él mis ojos y mi corazón. Aleluia.
    salmo: salmo-147
  - ant: Reconozcan, Señor, que aquí está tu mano, que eres tú quien lo ha hecho. Aleluia.
    salmo: cantico-ef-1-3-10
  lectura:
    ref: Ga 4, 4-5
    texto: Cuando se cumplió el tiempo, envió Dios a su Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción.
  responsorio:
  - - V
    - Se levantaron sus hijos, y la proclamaron bienaventurada. Aleluia, aleluia.
  - - R
    - Se levantaron sus hijos, y la proclamaron bienaventurada. Aleluia, aleluia.
  - - V
    - Porque el Señor obró en ella maravillas.
  - - R
    - Aleluia, aleluia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Se levantaron sus hijos, y la proclamaron bienaventurada. Aleluia, aleluia.
  ant_magnificat: 'Dijo la Madre de Jesús: «Haced lo que él os diga». Aleluia.'
  preces:
    renglones:
    - 'Proclamemos las grandezas de Dios Padre todopoderoso, que quiso que todas las generaciones felicitaran a María, la madre de su Hijo, y supliquémosle diciendo:'
    - Que la llena de gracia interceda por nosotros.
    - Señor, Dios nuestro, admirable siempre en tus obras, que has querido que la inmaculada Virgen María participara en cuerpo y alma de la gloria de Jesucristo,
    - haz que todos tus hijos deseen y caminen hacia esta misma gloria.
    - Tú que nos diste a María por madre, concede por su mediación salud a los enfermos, socorro a los desamparados, unidad a los hogares y casa a los sin techo.
    - Tú que hiciste de María la madre de misericordia,
    - haz que cuantos viven en peligros o están tentados sientan su protección maternal.
    - Tú que en tu madre, nuestra Señora de Luján, abriste en nuestra patria una fuente de bendición, mira benigno a nuestras autoridades y pueblo,
    - y haz que la Iglesia crezca y se dilate en la verdadera fe y caridad.
  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que nuestros queridos muertos puedan alcanzar con todos los santos la felicidad de tu reino. Confiando en el Señor, que hizo obras grandes en María, pidamos al Padre que colme también de bienes al mundo hambriento de verdad y de pan:'
  oracion: Señor, mira con bondad la fidelidad de tu Pueblo y concédenos que, por los méritos e intercesión de la santísima Virgen María, obtengamos los dones de tu gracia en la vida presente y la salvación eterna en el cielo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
