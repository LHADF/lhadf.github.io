EL BAUTISMO DEL SEÑOR:
  grado: Fiesta
  fecha: variable
  himno: Porque el bautismo hoy empieza
  salmodia:
  - ant: 'Se oyó una voz que venía del cielo y se oyó la voz del Padre: «Éste es mi hijo amado, en quien tengo mis complacencias, escuchadlo.»'
    salmo: salmo-109-1-5-7
  - ant: En el río Jordán aplastó nuestro Salvador la cabeza del antiguo dragón y nos libró a todos de su esclavitud.
    salmo: salmo-111
  - ant: Hoy se nos revela un gran misterio, porque el Creador del universo nos purifica de nuestros pecados en el Jordán.
    salmo: cantico-ap-15-3-4
  lectura:
    ref: Hch 10, 37-38
    texto: 'Vosotros sabéis lo acaecido en toda Judea: cómo Jesús de Nazaret empezó su actividad por Galilea después del Bautismo predicado por Juan; cómo Dios lo ungió con poder del Espíritu Santo; cómo pasó haciendo el bien y devolviendo la salud a todos los que estaban esclavizados por el demonio, porque Dios estaba con él.'
  responsorio:
  - - V
    - Éste es el que vino por el agua y por la sangre.
  - - R
    - Éste es el que vino por el agua y por la sangre.
  - - V
    - Jesucristo, nuestro Señor.
  - - R
    - Es el que vino por el agua y por la sangre.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Éste es el que vino por el agua y por la sangre.
  ant_magnificat: Cristo Jesús nos amó, nos ha librado de nuestros pecados por su sangre, nos ha convertido en un reino y nos ha hecho sacerdotes de Dios, su Padre; a él la gloria y el poder por los siglos de los siglos.
  preces:
    intro: 'Roguemos a nuestro Redentor, bautizado por Juan en el Jordán, y supliquémosle, diciendo:'
    preces:
    - - Cristo, siervo de Dios, en quien el Padre tiene todo su gozo,
      - envía tu Espíritu sobre nosotros.
    - - Cristo, elegido de Dios, tú que no rompiste la caña resquebrajada ni apagaste la mecha humeante,
      - compadécete de cuantos te buscan con sinceridad.
    - - Cristo, Hijo de Dios, a quien el Padre ha elegido como nueva alianza del pueblo y luz de las naciones,
      - abre por el bautismo los ojos de los que no ven.
    - - Cristo, salvador de los hombres, a quien el Padre ungió con el Espíritu Santo y envió para salvación del mundo,
      - haz que todos los hombres te conozcan y crean en ti para que así obtengan la vida eterna.
    respuesta: Envía, Señor, tu Espíritu sobre nosotros.
  padrenuestro_intro: 'Cristo, esperanza nuestra, que llevas la luz de la salvación a los pueblos que yacen en las tinieblas de la ignorancia, recibe en tu reino a nuestros difuntos. Ya que somos la familia de Dios, digamos con grande confianza a nuestro Padre del cielo:'
  oracion: Dios todopoderoso y eterno, que proclamaste solemnemente a Cristo como tu Hijo amado, cuando era bautizado en el Jordán y descendía el Espíritu Santo sobre él, concede a tus hijos de adopción, renacidos del agua y del Espíritu Santo, que se conserven siempre dignos de tu complacencia. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SAN ANTONIO, ABAD:
  grado: Memoria
  fecha: 01-17
  comun: 'Del Común de santos varones: para los santos religiosos.'
  himno: Feliz quien ha escuchado la llamada
  lectura:
    ref: Rm 8, 28-30
    texto: 'Sabemos que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó.'
  responsorio:
  - - V
    - El Señor es justo y ama la justicia.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Los buenos verán su rostro.
  - - R
    - El Señor es justo y ama la justicia.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor es justo y ama la justicia.
  ant_magnificat: Vosotros, los que lo habéis dejado todo y me habéis seguido, recibiréis cien veces más y heredaréis la vida eterna.
  preces:
    intro: 'Pidamos a Dios Padre, fuente de toda santidad, que con la intercesión y el ejemplo de los santos nos ayude, y digamos:'
    preces:
    - - Padre santo, que has querido que nos llamemos y seamos hijos tuyos,
      - haz que la Iglesia santa, extendida por los confines de la tierra, cante tus grandezas.
    - - Padre santo, que deseas que vivamos de una manera digna, buscando siempre tu beneplácito,
      - ayúdanos a dar fruto de buenas obras.
    - - Padre santo, que nos reconciliaste contigo por medio de Cristo,
      - guárdanos en tu nombre para que todos seamos uno.
    - - Padre santo, que nos convocas al banquete de tu reino,
      - haz que comiendo el pan que ha bajado del cielo alcancemos la perfección del amor.
    respuesta: Haz que seamos santos, porque tú, Señor, eres santo.
  padrenuestro_intro: 'Padre santo, perdona a los pecadores sus delitos y admite a los difuntos en tu reino para que puedan contemplar tu rostro. Porque nos llamamos y somos hijos de Dios, nos atrevemos a decir:'
  oracion: Señor, tú que inspiraste a san Antonio abad el deseo de retirarse al desierto para servirte allí con una vida admirable, haz que, por su intercesión, tengamos la fuerza de renunciar a todo lo que nos separe de ti y sepamos amarte por encima de todo. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
SANTA INÉS, virgen y mártir:
  grado: Memoria
  fecha: 01-21
  comun: Del común de vírgenes.
  himno: Dichosa tú, que, entre todas
  lectura:
    ref: 1Pe 4, 13-14
    texto: 'Queridos hermanos: Estad alegres cuando compartís los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros: porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros.'
  responsorio:
  - - V
    - El Señor la eligió y la predestinó.
  - - R
    - El Señor la eligió y la predestinó.
  - - V
    - La hizo morar en su templo santo.
  - - R
    - Y la predestinó.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - El Señor la eligió y la predestinó.
  ant_magnificat: 'Inés, con las manos extendidas, oraba, diciendo: «Ayúdame, Padre santo; estoy acercándome a ti, a quién tanto he amado, a quien siempre he deseado y buscado.»'
  preces:
    intro: 'Alabemos con gozo a Cristo, que elogió a los que permanecen vírgenes a causa del reino de Dios, y supliquémosle, diciendo:'
    preces:
    - - Señor Jesucristo, tú que como esposo amante colocaste junto a ti a la Iglesia sin mancha ni arruga,
      - haz que sea siempre santa e inmaculada.
    - - Señor Jesucristo, a cuyo encuentro salieron las vírgenes santas con sus lámparas encendidas,
      - no permitas que falte nunca el óleo de la fidelidad en las lámparas de las vírgenes que se han consagrado a ti.
    - - Señor Jesucristo, a quien la Iglesia virgen guardó siempre fidelidad intacta,
      - concede a todos los cristianos la integridad y la pureza de la fe.
    - - Tú que concedes hoy a tu pueblo alegrarse por la fiesta de santa Inés, virgen,
      - concédele también gozar siempre de su valiosa intercesión.
    respuesta: Jesús, rey de las vírgenes, escúchanos.
  padrenuestro_intro: 'Tú que recibiste en el banquete de tus bodas a las vírgenes santas, admite tanbién a nuestros hermanos difuntos en el convite festivo de tu reino. Oremos con Jesús, diciendo a nuestro Padre:'
  oracion: Dios todopoderoso y eterno, que te has complacido en elegir lo débil a los ojos del mundo para confundir a los que se creían fuertes, concede a quienes estamos celebrando el martirio de santa Inés imitar la heroica firmeza de su fe. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
