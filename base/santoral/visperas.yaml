  padrenuestro_intro: 'Tú que coronaste a María como reina del cielo, haz que los difuntos puedan alcanzar con todos los santos la felicidad de tu reino. Según el mandato del Señor, digamos confiadamente:'
  oracion: Señor, Padre de misericordia, cuyo Hijo, clavado en la cruz, proclamó como Madre nuestra a su Madre, santa María virgen, concédenos por su mediación amorosa, que tu Iglesia, cada día más fecunda, se llene de gozo por la santidad de sus hijos, y atraiga a su seno a todos los pueblos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
