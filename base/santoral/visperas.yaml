  lectura:
    ref: Hb 12, 22-24
    texto: Vosotros os habéis acercado al monte de Sión, ciudad del Dios vivo, Jerusalén del cielo, a la asamblea de los innumerables ángeles, a la congregación de los primogénitos inscritos en el cielo, a Dios, juez de todos, a las almas de los justos que han llegado a su destino, al Mediador de la nueva alianza, Jesús, y a la aspersión purificadora de una sangre que habla mejor que la de Abel.
  responsorio:
  - - V
    - Los justos se alegran en la presencia de Dios.
  - - R
    - Los justos se alegran en la presencia de Dios.
  - - V
    - Rebosando de alegría.
  - - R
    - En la presencia de Dios.
  - - V
    - Gloria al Padre, y al Hijo, y al Espíritu Santo.
  - - R
    - Los justos se alegran en la presencia de Dios.
  ant_magnificat: A ti, Señor, te alaba el coro celestial de los apóstoles, la multitud de los profetas te enaltece, el ejército glorioso de los mártires te aclama; todos los santos y elegidos te ensalzan unánimes, Trinidad santa, único Dios.
  preces:
    intro: 'Acudamos, alegres, a nuestro Dios, corona de todos los santos, y digámosle:'
    preces:
    - - Dios nuestro, fuente y origen de toda sabiduría, que por tu Hijo Jesucristo has hecho de los apóstoles fundamento de la Iglesia,
      - concédenos ser totalmente fieles a la fe que ellos enseñaron.
    - - Tú que otorgaste a los mártires fortaleza para dar testimonio de ti hasta derramar su sangre,
      - concede a todos los cristianos ser fieles testigos de tu Hijo.
    - - Tú que concediste a las vírgenes el don insigne de imitar a Cristo en su virginidad,
      - haz que sepamos ver siempre su virginidad consagrada como un signo del reino futuro.
    - - Tú que has manifestado en los santos tu presencia, tu grandeza y tu perfección,
      - haz que los fieles, al venerarlos, se sientan unidos a ti.
    respuesta: Por intercesión de todos los santos, sálvanos, Señor.
  padrenuestro_intro: 'Concede, Señor, a todos los difuntos gozar siempre de la compañía de María, de san José y de todos los santos, y, por su intercesión, dales parte en la alegría de tu reino. Con el gozo que nos da sabernos miembros de la gran familia de los santos, digamos al Padre de todos:'
  oracion: Dios todopoderoso y eterno, que nos concedes celebrar los méritos de todos los santos en una misma solemnidad, te rogamos que, por las súplicas de tan numerosos intercesores, nos concedas en abundancia los dones que te pedimos. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios, por los siglos de los siglos.
