# Traducción literal de los himnos latinos (extraccion/apendices/himnos_latinos.yaml), verso por verso:
# cada estrofa, una lista con la traducción de cada verso, en el mismo orden. Entre corchetes, lo que el castellano
# necesita y el latín sobreentiende.

# ---------------- Tiempo de Adviento ----------------
conditor-alme-siderum:
  - - Creador bondadoso de los astros,
    - luz eterna de los creyentes,
    - Cristo, redentor de todos,
    - escucha las súplicas de los que te imploran.
  - - Tú que, compadecido de que por la ruina
    - de la muerte pereciera el mundo,
    - salvaste al mundo enfermo,
    - dando a los culpables el remedio,
  - - al declinar la tarde del mundo,
    - como el esposo de la cámara nupcial,
    - saliste del honestísimo
    - claustro de la Virgen madre.
  - - Ante cuyo fuerte poder
    - se doblan todas las rodillas;
    - las cosas del cielo y de la tierra
    - con una señal se confiesan sometidas.
  - - A ti, Santo, con fe te pedimos,
    - 'juez que has de venir al fin del mundo:'
    - guárdanos en el tiempo [presente]
    - del dardo del enemigo pérfido.
  - - Sea, Cristo, rey piadosísimo,
    - a ti y al Padre la gloria
    - con el Espíritu Paráclito
    - por los siglos sempiternos.

te-lucis-ante-terminum:
  - - A ti, antes del término de la luz,
    - creador de las cosas, te pedimos
    - que, con tu acostumbrada clemencia,
    - seas protector y custodia.
  - - Que nuestros corazones sueñen contigo,
    - que te sientan durante el sueño,
    - y que siempre tu gloria
    - canten al acercarse la luz.
  - - Concede una vida saludable,
    - reanima nuestro ardor,
    - '[y que] la tenebrosa oscuridad de la noche'
    - la ilumine tu claridad.
  - - Concédelo, Padre omnipotente,
    - por Jesucristo, el Señor,
    - que contigo por siempre
    - reina con el Espíritu Santo.

verbum-supernum-prodiens:
  - - Verbo celestial que procedes
    - del seno del Padre eterno,
    - que, nacido, socorres al mundo
    - 'en el curso declinante del tiempo:'
  - - ilumina ahora los corazones
    - y abrásalos con tu amor,
    - para que el corazón, dejando lo caduco,
    - se llene del gozo del cielo.
  - - Para que, cuando el tribunal del Juez
    - condene al fuego a los culpables
    - y la voz amiga, como es debido,
    - llame al cielo a los piadosos,
  - - no seamos, como pasto de las llamas,
    - arrastrados entre negros torbellinos,
    - sino que, admitidos a [ver] el rostro de Dios,
    - gocemos de las alegrías del cielo.
  - - Al Padre, y a la vez al Hijo,
    - y a ti, Espíritu Santo,
    - como fue, sea por siempre
    - por todos los siglos la gloria.

vox-clara-ecce-intonat:
  - - He aquí que resuena una voz clara
    - 'que reprende todo lo oscuro:'
    - huyan lejos los sueños;
    - desde lo alto resplandece Cristo.
  - - Levántese ya la mente adormecida,
    - que yace herida por la suciedad;
    - brilla ya un astro nuevo,
    - para quitar todo lo dañino.
  - - De lo alto es enviado el Cordero
    - para perdonar gratuitamente la deuda;
    - todos, para [obtener] el perdón,
    - elevemos la voz con lágrimas,
  - - para que, cuando brille por segunda vez
    - y el espanto rodee al mundo,
    - no castigue [nuestra] culpa,
    - sino que entonces, piadoso, nos proteja.
  - - Al Padre altísimo [sea] la gloria,
    - y al Hijo sea la victoria,
    - y al Espíritu la alabanza debida,
    - por los siglos de los siglos.

nunc-sancte-nobis-spiritus:
  - - Ahora, Espíritu Santo,
    - uno con el Padre y el Hijo,
    - dígnate, solícito, entrar en nosotros,
    - derramado en nuestro pecho.
  - - Boca, lengua, mente, sentidos, fuerzas
    - hagan resonar la alabanza;
    - inflámese en fuego la caridad,
    - encienda su ardor a los prójimos.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

rector-potens-verax-deus:
  - - Gobernante poderoso, Dios veraz,
    - que regulas las vicisitudes de las cosas,
    - que adornas la mañana con resplandor
    - 'y con fuegos el mediodía:'
  - - apaga las llamas de las discordias,
    - quita el calor dañino,
    - concede la salud de los cuerpos
    - y la verdadera paz de los corazones.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

rerum-deus-tenax-vigor:
  - - Dios, fuerza que sostiene las cosas,
    - que permaneces inmóvil en ti mismo
    - y determinas los tiempos de la luz del día
    - 'en su sucesión:'
  - - concede luz en la tarde,
    - para que la vida nunca decaiga,
    - sino que, como premio de una santa muerte,
    - nos aguarde la gloria perenne.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

verbum-salutis-omnium:
  - - Al Verbo, salvación de todos,
    - que procede de la boca del Padre,
    - Virgen bienaventurada, recíbelo
    - en tu seno casto, María.
  - - A ti ahora te ilumina desde el cielo
    - la sombra del Espíritu fecundo,
    - para que lleves a Cristo, el Señor,
    - el Hijo igual al Padre.
  - - Esta es la puerta del templo sagrado,
    - cerrada para siempre,
    - que solo al Príncipe supremo
    - abre los umbrales dichosos.
  - - Prometido antiguamente por los profetas,
    - nacido antes del lucero,
    - el que Gabriel anuncia,
    - el Señor desciende a la tierra.
  - - Alégrense a una los ángeles,
    - 'exulten todos los pueblos:'
    - el excelso viene humilde
    - a salvar lo que se había perdido.
  - - Sea, Cristo, rey piadosísimo,
    - a ti y al Padre la gloria
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

christe-qui-splendor-et-dies:
  - - Cristo, que, esplendor y día,
    - descubres las tinieblas de la noche
    - y eres creído luz de la luz,
    - 'y anuncias la luz a los bienaventurados:'
  - - te rogamos, santo Señor,
    - que esta noche nos guardes;
    - que nuestro descanso esté en ti,
    - concédenos horas tranquilas.
  - - Si a los ojos se les da el sueño,
    - que el corazón vele siempre por ti;
    - y con tu diestra protege
    - a los fieles que te aman.
  - - Defensor nuestro, míranos,
    - reprime a los que nos acechan,
    - gobierna a tus siervos,
    - a los que compraste con tu sangre.
  - - Sea, Cristo, rey piadosísimo,
    - a ti y al Padre la gloria,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

veni-redemptor-gentium:
  - - Ven, redentor de las naciones,
    - muestra el parto de la Virgen;
    - 'admírese todo el mundo:'
    - tal parto conviene a Dios.
  - - No de semilla de varón,
    - sino por soplo misterioso,
    - el Verbo de Dios se hizo carne
    - y floreció el fruto del vientre.
  - - Se hincha el seno de la Virgen,
    - permanece el claustro del pudor,
    - brillan los estandartes de las virtudes,
    - Dios habita en [su] templo.
  - - Salga de su tálamo,
    - el palacio real del pudor,
    - el gigante de doble sustancia,
    - para correr ágil su camino.
  - - Igual al Padre eterno,
    - cíñete el trofeo de la carne,
    - fortaleciendo lo débil de nuestro cuerpo
    - con tu fuerza perpetua.
  - - Ya brilla tu pesebre
    - y la noche exhala una luz nueva,
    - que ninguna noche interrumpa
    - y que brille con fe continua.
  - - Gloria a ti, Señor,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu Santo,
    - por los siglos sempiternos.

magnis-prophetae-vocibus:
  - - Con grandes voces los profetas
    - anuncian que Cristo viene,
    - precursora de la feliz salvación,
    - la gracia con que nos redimió.
  - - Por eso brilla nuestra mañana
    - y los corazones arden de alegría,
    - cuando resuena la voz fiel,
    - mensajera de la gloria.
  - - Esta fue la primera venida,
    - en la que no vino a castigar
    - al mundo, sino a limpiar la herida,
    - salvando lo que se había perdido.
  - - Pero la segunda nos advierte
    - que Cristo está a las puertas
    - para dar coronas a los santos
    - y abrir los reinos del cielo.
  - - Se promete una luz eterna
    - y se muestra un astro que salva;
    - ya un resplandor brillantísimo
    - nos llama al derecho de los habitantes del cielo.
  - - A ti solo, Cristo, buscamos
    - ver, como eres, Dios,
    - para que esta visión sea perpetua,
    - cántico de alabanza perenne.

certum-tenentes-ordinem:
  - - Guardando el orden establecido,
    - pidamos con corazón piadoso,
    - en la hora tercera del día,
    - la gloria del poder trino,
  - - para que seamos morada
    - de aquel Espíritu Santo
    - que en otro tiempo, a los apóstoles,
    - a esta hora les fue repartido.
  - - Avanzando con este orden,
    - adornó todo espléndidamente
    - el creador del reino celestial
    - para nuestros premios eternos.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

dicamus-laudes-domino:
  - - Digamos alabanzas al Señor
    - con espíritu ferviente y dispuesto;
    - la hora sexta, que ha llegado,
    - nos invita a orar.
  - - Porque en ella a los fieles
    - la gloria de la verdadera salvación,
    - la víctima del Cordero bienaventurado,
    - por la fuerza de la cruz les es devuelta.
  - - Ante su luz clarísima
    - se oscurece el mediodía;
    - tomemos con todo el corazón
    - la gracia de tan gran esplendor.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

ternis-horarum-terminis:
  - - Cumplidos tres plazos de horas,
    - por don del Señor,
    - al que es perfectamente trino y uno
    - le cantamos salmos con devoción.
  - - Guardando con corazón puro
    - el sagrado misterio de Dios,
    - según la regla del maestro Pedro,
    - transmitida con la señal de salvación,
  - - salmodiemos también nosotros con el espíritu,
    - unidos así a los apóstoles,
    - para que a las plantas aún débiles
    - las dirijan con el poder de Cristo.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

# ---------------- Tiempo de Navidad ----------------
christe-redemptor-omnium-ex-patre:
  - - Cristo, redentor de todos,
    - Unigénito del Padre, [nacido] del Padre,
    - el único nacido antes del principio
    - 'de modo inefable:'
  - - tú, luz, tú, resplandor del Padre,
    - tú, esperanza perenne de todos,
    - atiende las súplicas que elevan
    - tus siervos por el mundo.
  - - Autor de la salvación, recuerda
    - que en otro tiempo, de nuestro cuerpo,
    - naciendo de la Virgen intacta,
    - tomaste la forma.
  - - Este día presente atestigua,
    - al recorrer el ciclo del año,
    - que solo tú, desde el trono del Padre,
    - viniste como salvación del mundo.
  - - A este, el cielo, la tierra, a este el mar,
    - a este todo lo que hay en ellos,
    - como autor de tu venida,
    - lo alaba exultante con un cántico.
  - - También nosotros, que con tu santa
    - sangre fuimos redimidos,
    - por el día de tu nacimiento
    - cantamos un himno nuevo.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

candor-aeternae-deitatis-alme:
  - - Resplandor bondadoso de la eterna Divinidad,
    - Cristo, tú, luz, perdón y vida,
    - vienes, remedio de las enfermedades de los hombres,
    - puerta de salvación.
  - - El coro de los ángeles entona a la tierra
    - un canto celestial, anunciando tiempos nuevos,
    - gloria al Padre, y a nuestro linaje
    - los gozos de la paz.
  - - Tú que yaces pequeño y reinas también sobre el mundo,
    - fruto de la Virgen santa sin mancha,
    - Cristo, poséelo ya todo el mundo,
    - siempre digno de ser amado.
  - - Naces para darnos el cielo como patria,
    - uno de nosotros, hecho carne nuestra;
    - renueva las mentes, atrae los corazones
    - con los lazos de la caridad.
  - - He aquí que nuestra asamblea, exultante, canta,
    - unida a los ángeles con boca alegre,
    - al Padre contigo y al Amor igual [a ambos]
    - cánticos de alabanza.

a-solis-ortus-cardine:
  - - Desde el punto donde sale el sol
    - hasta el límite de la tierra
    - cantemos a Cristo príncipe,
    - nacido de María Virgen.
  - - El bienaventurado autor del mundo
    - se revistió de un cuerpo de siervo,
    - para, liberando la carne con la carne,
    - no perder lo que había creado.
  - - En las entrañas de la madre intacta
    - entra la gracia del cielo;
    - el vientre de la doncella lleva
    - un secreto que no conocía.
  - - La casa del pecho pudoroso
    - se vuelve de repente templo de Dios;
    - intacta, sin conocer varón,
    - concibió por la palabra un Hijo.
  - - Dio a luz la parturienta
    - al que Gabriel había predicho,
    - al que Juan, saltando en el seno de su madre,
    - encerrado, había percibido.
  - - Soportó yacer en el heno,
    - no rehusó el pesebre,
    - y con un poco de leche se alimentó
    - aquel por quien ni el ave pasa hambre.
  - - Se alegra el coro de los habitantes del cielo
    - y los ángeles cantan a Dios,
    - y se manifiesta a los pastores
    - el pastor, creador de todas las cosas.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

hostis-herodes-impie:
  - - Herodes, enemigo impío,
    - '¿por qué temes que venga Cristo?'
    - No arrebata los reinos mortales
    - el que da los reinos celestiales.
  - - Iban los magos por donde habían venido,
    - siguiendo la estrella que los precedía;
    - buscan la luz con la luz,
    - confiesan a Dios con un don.
  - - Las aguas del baño puro
    - tocó el Cordero celestial;
    - los pecados que no tenía
    - los quitó lavándonos.
  - - 'Un nuevo género de poder:'
    - las tinajas de agua enrojecen,
    - y el agua, mandada a derramar vino,
    - cambió su origen.
  - - Jesús, a ti sea la gloria,
    - que te revelas a las naciones,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

magi-videntes-parvulum:
  - - Los magos, viendo al niño,
    - sacan los dones de oriente
    - y, postrados, ofrecen en homenaje
    - incienso, mirra y oro real.
  - - Reconoce las claras insignias
    - de tu poder y de tu reino,
    - Niño, a quien el Padre
    - 'predestinó una triple condición:'
  - - Rey y Dios lo anuncian
    - el tesoro y el aroma fragante
    - del incienso de Saba, pero el polvo
    - de mirra preanuncia el sepulcro.
  - - ¡Oh Belén, la única mayor
    - que las grandes ciudades, a quien tocó
    - engendrar, encarnado desde el cielo,
    - al guía de la salvación!
  - - A este, con los profetas como testigos
    - y como signatarios ellos mismos,
    - el testador y creador manda
    - 'entrar en posesión del reino y verlo:'
  - - el reino que abarca todas las cosas,
    - las celestes, las del mar y las de la tierra,
    - desde la salida del sol hasta el ocaso,
    - y el abismo y el cielo arriba.
  - - Jesús, a ti sea la gloria,
    - que te revelas a las naciones,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

quicumque-christum-quaeritis:
  - - Todos los que buscáis a Cristo,
    - 'levantad los ojos a lo alto:'
    - allí se podrá ver
    - la señal de la gloria perenne.
  - - Esta estrella, que a la rueda del sol
    - vence en belleza y en luz,
    - anuncia que ha venido a la tierra
    - Dios con carne terrena.
  - - He aquí que, desde el seno del mundo persa,
    - de donde el sol toma su puerta,
    - la ven los magos, intérpretes expertos,
    - '[como] estandarte real.'
  - - «¿Quién es este tan grande —dicen—,
    - soberano que manda a los astros,
    - ante quien así tiemblan las cosas celestes,
    - a quien sirven la luz y el éter?
  - - Vemos algo ilustre
    - que no conoce sufrir un fin,
    - sublime, excelso, sin término,
    - más antiguo que el cielo y el caos.
  - - Este es el rey de las naciones
    - y rey del pueblo judío,
    - prometido al padre Abraham
    - y a su descendencia para siempre».
  - - Jesús, a ti sea la gloria,
    - que te revelas a las naciones,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

o-lux-beata-caelitum:
  - - Oh luz bienaventurada de los habitantes del cielo
    - y suma esperanza de los mortales,
    - Jesús, a quien, al nacer, el amor
    - de un hogar te sonrió;
  - - María, rica en gracia,
    - oh tú, la única que puedes
    - abrigar a Jesús en tu casto pecho,
    - dándole besos con la leche;
  - - y tú, elegido entre los antiguos padres
    - como custodio de la Virgen,
    - a quien con el dulce nombre de padre
    - 'invoca la Prole divina:'
  - - nacidos de la noble estirpe de Jesé
    - para la salvación de las naciones,
    - escuchadnos a nosotros, que suplicantes
    - derramamos de corazón nuestros votos.
  - - Que la gracia de toda virtud
    - con que floreció vuestra casa
    - se nos conceda poder reproducirla
    - en las costumbres de nuestros hogares.
  - - Jesús, que te hiciste obediente
    - a tus padres,
    - con el Padre altísimo y el Espíritu,
    - a ti sea siempre la gloria.

dulce-fit-nobis-memorare-parvum:
  - - Nos resulta dulce recordar la pequeña
    - casa de Nazaret y su pobre vida;
    - conviene contar en verso
    - la vida oculta de Jesús.
  - - En el oficio humilde en que José lo ha de formar,
    - Jesús crece en una edad escondida,
    - y como compañero del trabajo de artesano
    - se ofrece por sí mismo.
  - - Se sienta junto a su Hijo la madre piadosa,
    - se sienta junto a su esposo la buena esposa, feliz
    - si puede aliviar las preocupaciones de los cansados
    - con su servicio amistoso.
  - - Oh vosotros, que no fuisteis ajenos a la tarea y al trabajo
    - ni ignorantes del mal, ayudad a los desdichados;
    - a cuantos imploran vuestro amparo,
    - miradlos con rostro benigno.
  - - Sea a ti, Jesús, el honor y el poder,
    - que nos das santas enseñanzas de vida,
    - y que con el sumo Padre y el Espíritu
    - bondadoso reinas.

christe-splendor-patris:
  - - Cristo, esplendor del Padre,
    - Virgen, madre de Dios,
    - José, guardián
    - 'de prendas tan sagradas:'
  - - brilla vuestra casa
    - con las flores de las virtudes,
    - de donde mana
    - la fuente misma de las gracias.
  - - Los ángeles, asombrados,
    - ven al Hijo de Dios
    - revestido de la forma de siervo,
    - sirviendo a sus siervos.
  - - Tú, José, el último, presides,
    - y, humilde, mandas;
    - mandas también a María,
    - y a ambos sirves.
  - - Supera a todos los palacios
    - este pobre recinto,
    - donde comenzó la salvación
    - del género humano.
  - - Jesús, Madre, José,
    - concedednos, en nuestras casas,
    - gozar de los santos dones
    - de vuestra morada.
  - - A ti las alabanzas, Cristo,
    - que nos das la esperanza
    - de llegar, por medio de tus padres,
    - a la casa del cielo.

corde-natus-ex-parentis:
  - - Nacido del corazón del Padre
    - antes del comienzo del mundo,
    - llamado Alfa y Omega,
    - él mismo fuente y término
    - de todo lo que es, lo que fue
    - y lo que será después.
  - - De un cuerpo caduco la forma,
    - miembros sujetos a la muerte,
    - tomó, para que no pereciera el linaje
    - nacido del primer hombre,
    - al que una ley de culpa había hundido
    - en el profundo abismo.
  - - ¡Oh bienaventurado aquel nacimiento,
    - cuando la Virgen parturienta,
    - fecunda por el Espíritu Santo,
    - dio a luz a nuestra salvación,
    - y el niño redentor del mundo
    - mostró su rostro sagrado!
  - - He aquí al que los profetas en siglos antiguos
    - cantaban a una,
    - al que las páginas fieles de los profetas
    - 'habían prometido:'
    - brilla el prometido de antaño;
    - ¡que todas las cosas lo alaben!
  - - Gloria al Padre con voces
    - melodiosas hagamos resonar;
    - gloria a Cristo cantemos,
    - nacido de madre virgen,
    - y gloria sempiterna
    - al ínclito Paráclito.

radix-iesse-floruit:
  - - La raíz de Jesé ya ha florecido
    - y la vara ha dado su fruto;
    - la fecunda ha dado a luz un hijo
    - y la virgen permanece madre.
  - - Soportó que lo pusieran en un pesebre
    - el que fue autor de la luz;
    - con el Padre creó los cielos,
    - bajo la madre se vistió de pañales.
  - - El que dio la ley al mundo,
    - cuyos preceptos son diez,
    - dignándose, se hizo hombre
    - para estar sujeto al vínculo de la ley.
  - - Ya nacen la luz y la salvación,
    - la noche huye, la muerte es vencida;
    - 'venid, naciones, creed:'
    - María dio a luz a Dios.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

fit-porta-christi-pervia:
  - - La puerta se hace transitable para Cristo,
    - llena de toda gracia,
    - y pasa el rey, y permanece
    - cerrada, como estaba, por los siglos.
  - - El Hijo del sumo Padre
    - salió del palacio de la Virgen,
    - esposo, redentor, creador,
    - gigante de su Iglesia.
  - - Honor y gozo de su madre,
    - inmensa esperanza de los creyentes,
    - piedra que viene del monte
    - y llena el mundo de gracia.
  - - Exulte toda alma,
    - porque ahora el salvador de las naciones,
    - el Señor del mundo, ha venido
    - a redimir a los que creó.
  - - A Cristo sea toda la gloria,
    - a quien el Padre engendró Dios,
    - a quien la Virgen madre dio a luz,
    - fecunda por el Espíritu Santo.

a-patre-unigenite:
  - - Unigénito del Padre,
    - vienes a nosotros por la Virgen,
    - consagrando a todos con el rocío del bautismo,
    - regenerándolos por la fe.
  - - Saliendo, excelso, del cielo,
    - tomas la forma del hombre,
    - redimiendo con la muerte a tu criatura,
    - concediendo los gozos de la vida.
  - - 'Esto te pedimos, Redentor:'
    - desciende propicio [sobre nosotros]
    - y da a nuestros corazones
    - la clara luz divina.
  - - Quédate con nosotros, Señor,
    - aparta la noche oscura,
    - lava todo delito,
    - concede, piadoso, el remedio.
  - - Oh Cristo, vida, verdad,
    - a ti sea toda la gloria,
    - a quien el esplendor del Padre y del Espíritu
    - revela desde el cielo.

implente-munus-debitum:
  - - Cumpliendo el oficio debido
    - Juan, el creador de las cosas,
    - sumergido en el Jordán en este día,
    - purificó el agua al lavarse.
  - - No quería él ser purificado,
    - nacido del seno de la Virgen,
    - sino quitar los pecados de los mortales
    - con su propio baño.
  - - 'Diciendo el Padre: «Este'
    - es mi Hijo amado»,
    - y tomando el Espíritu Santo
    - forma de paloma desde el cielo,
  - - bajo este nombre misterioso
    - brilla la salvación de la Iglesia;
    - la Persona trina permanece
    - un solo Dios en todo.
  - - Oh Cristo, vida, verdad,
    - a ti sea toda la gloria,
    - a quien el esplendor del Padre y del Espíritu
    - revela desde el cielo.

iesus-refulsit-omnium:
  - - Jesús ha resplandecido, piadoso redentor
    - de todas las naciones;
    - que todo el linaje de los fieles
    - celebre un cántico de alabanza.
  - - Viviendo ya tres decenas de años
    - en la condición del cuerpo,
    - pide el agua del bautismo,
    - libre de todo contagio.
  - - Feliz Juan tiembla de sumergir
    - en el río a aquel
    - que puede con su sangre
    - lavar los pecados del mundo.
  - - Entonces la voz del Padre excelso,
    - desde el cielo, da testimonio de su Hijo,
    - y fluye la fuerza del Espíritu
    - Santo, dador del carisma.
  - - Nosotros, Cristo, con voz suplicante
    - 'te rogamos: protégenos a todos'
    - y haz que brillemos en la mente
    - y vivamos puros para ti.
  - - Oh Cristo, vida, verdad,
    - a ti sea toda la gloria,
    - a quien el esplendor del Padre y del Espíritu
    - revela desde el cielo.

# ---------------- Tiempo de Cuaresma ----------------
audi-benigne-conditor:
  - - Escucha, Creador benigno,
    - nuestras súplicas con llanto,
    - derramadas en el sagrado
    - ayuno de cuarenta días.
  - - Escrutador bondadoso de los corazones,
    - tú conoces la debilidad de las fuerzas;
    - a los que vuelven a ti muéstrales
    - la gracia del perdón.
  - - Mucho, en verdad, hemos pecado,
    - pero perdona a los que confiesan,
    - y para alabanza de tu nombre
    - da remedio a los enfermos.
  - - Concede que así el cuerpo por fuera
    - se domine por la abstinencia,
    - para que la mente sobria ayune
    - del todo de la mancha de los pecados.
  - - Concédelo, bienaventurada Trinidad,
    - otórgalo, Unidad simple,
    - que sean fructuosos para los tuyos
    - estos dones del ayuno.

ex-more-docti-mystico:
  - - Instruidos por la costumbre mística,
    - guardemos la abstinencia
    - en el ciclo bien conocido de diez días
    - repetido cuatro veces.
  - - La ley y los profetas primero
    - la anunciaron; después
    - Cristo la consagró, de todos
    - los tiempos rey y creador.
  - - Usemos, pues, con más moderación
    - las palabras, la comida y la bebida,
    - el sueño, las bromas, y más estrictamente
    - perseveremos en la vigilancia.
  - - Evitemos además los males peores,
    - que arruinan las mentes inconstantes,
    - y no demos al astuto
    - enemigo lugar para su tiranía.
  - - Concédelo, bienaventurada Trinidad,
    - otórgalo, Unidad simple,
    - que sean fructuosos para los tuyos
    - estos dones del ayuno.

precemur-omnes-cernui:
  - - Oremos todos postrados,
    - clamemos cada uno,
    - lloremos ante el juez,
    - aplaquemos la ira vengadora.
  - - Con nuestros males hemos ofendido
    - tu clemencia, oh Dios;
    - derrama sobre nosotros desde lo alto,
    - tú que perdonas, la indulgencia.
  - - Recuerda que somos, aunque frágiles,
    - obra de tus manos;
    - no des el honor de tu nombre,
    - te rogamos, a otro.
  - - Perdona el mal que hicimos,
    - aumenta el bien que pedimos,
    - para que al fin podamos agradarte
    - aquí y para siempre.
  - - Concédelo, bienaventurada Trinidad,
    - otórgalo, Unidad simple,
    - que sean fructuosos para los tuyos
    - estos dones del ayuno.

iesu-quadragenariae:
  - - Jesús, que consagraste
    - la abstinencia de cuarenta días,
    - que por la salvación de las almas
    - 'habías mandado el ayuno:'
  - - asiste ahora a la Iglesia,
    - asiste a la penitencia
    - con la que, postrados, suplicamos
    - que nuestros pecados sean lavados.
  - - Tú, los crímenes pasados
    - perdónalos con tu gracia,
    - y contra los futuros pon
    - tu custodia, oh mansísimo,
  - - para que, purificados por los actos
    - anuales de compunción,
    - tendamos a los gozos pascuales,
    - que han de celebrarse dignamente.
  - - Que el universo de las cosas te adore,
    - clemente Trinidad,
    - y nosotros, renovados por el perdón,
    - cantemos un cántico nuevo.

nunc-tempus-acceptabile:
  - - Ahora brilla el tiempo favorable,
    - dado por Dios,
    - para que sane al mundo enfermo
    - el remedio de la sobriedad.
  - - Con la hermosa luz de Cristo
    - resplandece el día de la salvación,
    - mientras la abstinencia reforma
    - los corazones heridos por las culpas.
  - - Haz, oh Dios, que la guardemos
    - con la mente y con el cuerpo,
    - para que deseemos, con un feliz
    - tránsito, la Pascua perenne.
  - - Que el universo de las cosas te adore,
    - clemente Trinidad,
    - y nosotros, renovados por el perdón,
    - cantemos un cántico nuevo.

iam-christe-sol-iustitiae:
  - - Ya, Cristo, sol de justicia,
    - ábranse las tinieblas de la mente,
    - para que vuelva la luz de las virtudes,
    - cuando devuelves el día a la tierra.
  - - Al dar el tiempo favorable,
    - concede también un corazón penitente,
    - para que convierta la benignidad
    - a los que soporta tu larga piedad;
  - - y concede llevar algo de penitencia
    - por la que se obtenga el perdón
    - con tu don mayor,
    - aunque las culpas sean grandes.
  - - Viene el día, tu día,
    - por el que todo vuelve a florecer;
    - alegrémonos en él, como devueltos
    - por él a tu gracia.
  - - Que el universo de las cosas te adore,
    - clemente Trinidad,
    - y nosotros, renovados por el perdón,
    - cantemos un cántico nuevo.

dei-fide-qua-vivimus:
  - - Con la fe de Dios, por la que vivimos,
    - con la que creemos en la esperanza perenne,
    - por la gracia de la caridad
    - cantemos la gloria de Cristo,
  - - que, conducido a la hora tercia
    - al sacrificio de la pasión,
    - soportando el suplicio de la cruz,
    - devolvió la oveja perdida.
  - - Roguemos, pues, sometidos [a él],
    - libres por la redención,
    - que arranque del mundo
    - a los que libró del documento [de la deuda].
  - - A Cristo rogamos y al Padre,
    - al Espíritu de Cristo y del Padre;
    - Trinidad, una y poderosa en todo,
    - favorece a los que te suplican.

qua-christus-hora-sitiit:
  - - La hora en que Cristo tuvo sed
    - o en la que subió a la cruz,
    - a los que concede salmodiar en ella
    - los enriquezca con sed de justicia.
  - - Que tengan también hambre,
    - que él mismo sacie de sí,
    - para que el pecado les cause hastío
    - y la virtud, deseo.
  - - Que el carisma del Espíritu Santo
    - se derrame así sobre los que salmodian,
    - que el ardor de la carne se enfríe
    - y el frío de la mente arda.
  - - A Cristo rogamos y al Padre,
    - al Espíritu de Cristo y del Padre;
    - Trinidad, una y poderosa en todo,
    - favorece a los que te suplican.

ternis-ter-horis-numerus:
  - - El número de tres veces tres horas
    - se nos abre consagrado,
    - y en el santo nombre de Jesús
    - pidamos el don del perdón.
  - - He aquí que la confesión del ladrón
    - merece la gracia de Cristo;
    - que nuestra alabanza y nuestra devoción
    - obtengan la indulgencia.
  - - La muerte perece ahora por la cruz
    - y tras las tinieblas vuelve la luz;
    - que se disipe el horror de los pecados,
    - que brille el esplendor de las almas.
  - - A Cristo rogamos y al Padre,
    - al Espíritu de Cristo y del Padre;
    - Trinidad, una y poderosa en todo,
    - favorece a los que te suplican.

# ---------------- Semana Santa ----------------
vexilla-regis-prodeunt:
  - - Avanzan los estandartes del rey,
    - brilla el misterio de la cruz,
    - en la que con la carne el creador de la carne
    - fue colgado en el patíbulo;
  - - en la que, herido además
    - por la punta cruel de la lanza,
    - para lavarnos del pecado
    - manó agua y sangre.
  - - ¡Árbol hermoso y resplandeciente,
    - adornado con la púrpura del rey,
    - elegido para tocar con tu digno tronco
    - miembros tan santos!
  - - Dichoso, de cuyos brazos
    - colgó el precio del mundo;
    - se hizo balanza del cuerpo
    - y arrebató la presa al abismo.
  - - ¡Salve, altar; salve, víctima,
    - por la gloria de la pasión,
    - en la que la Vida soportó la muerte
    - y con la muerte devolvió la vida!
  - - ¡Oh cruz, salve, esperanza única!
    - En esta gloria del triunfo
    - aumenta a los piadosos la gracia
    - y borra los crímenes a los culpables.
  - - A ti, fuente de salvación, Trinidad,
    - te alabe todo espíritu;
    - a los que salvas por el misterio de la cruz,
    - protégelos por los siglos.

pange-lingua-gloriosi-proelium:
  - - Canta, lengua, el combate
    - de la gloriosa lucha,
    - y sobre el trofeo de la cruz
    - proclama el noble triunfo,
    - cómo el redentor del mundo,
    - inmolado, venció.
  - - Del engaño del primer padre
    - compadecido el creador,
    - cuando, al morder el fruto dañino,
    - cayó en la muerte,
    - él mismo señaló entonces el árbol
    - para reparar los daños del árbol.
  - - Esta obra de nuestra salvación
    - la había exigido el orden [divino],
    - para burlar con arte el arte
    - del traidor de mil formas
    - y traer el remedio de donde
    - el enemigo había herido.
  - - Cuando llegó, pues, la plenitud
    - del tiempo sagrado,
    - fue enviado desde el alcázar del Padre
    - el Hijo, creador del mundo,
    - y del seno virginal
    - salió hecho carne.
  - - Cumplidos ya seis lustros,
    - completando el tiempo de su vida corporal,
    - por su voluntad, nacido para esto,
    - entregado a la pasión,
    - el cordero es levantado en la cruz
    - para ser inmolado en el madero.
  - - Igual al Padre y al Hijo,
    - al ínclito Paráclito,
    - sea a la bienaventurada Trinidad
    - la gloria sempiterna,
    - cuya gracia bondadosa nos redimió
    - y nos conserva.

en-acetum-fel-arundo:
  - - He aquí el vinagre, la hiel, la caña,
    - los salivazos, los clavos, la lanza;
    - es perforado el cuerpo manso,
    - fluyen sangre y agua;
    - ¡la tierra, el mar, los astros, el mundo,
    - con qué río son lavados!
  - - ¡Cruz fiel, entre todos
    - el único árbol noble!
    - Ningún bosque produce otro igual
    - en flor, en hoja, en fruto.
    - ¡Dulce leño, que con dulce clavo
    - sostienes un dulce peso!
  - - Dobla tus ramas, árbol alto,
    - afloja tus entrañas tensas,
    - y que se ablande aquella rigidez
    - que te dio la naturaleza,
    - para que los miembros del rey celestial
    - los extiendas en un tronco blando.
  - - Solo tú fuiste digno
    - de llevar el precio del mundo
    - y de preparar, como un navegante,
    - el puerto al mundo náufrago,
    - tú, a quien ungió la sangre sagrada
    - derramada del cuerpo del Cordero.
  - - Igual al Padre y al Hijo,
    - al ínclito Paráclito,
    - sea a la bienaventurada Trinidad
    - la gloria sempiterna,
    - cuya gracia bondadosa nos redimió
    - y nos conserva.

celsae-salutis-gaudia:
  - - Los gozos de la excelsa salvación
    - 'celebre con júbilo el mundo fiel:'
    - Jesús, redentor de todos,
    - aniquiló al príncipe de la muerte.
  - - Llevando por el camino ramos
    - de palma y de olivo, la multitud
    - «Hosanna al hijo de David»
    - repite con voces claras.
  - - Nosotros, pues, al príncipe supremo
    - corramos todos al encuentro;
    - cantando melodías de gloria,
    - llevemos palmas de alegría.
  - - Y que nuestros pasos vacilantes
    - los levante con dones felices,
    - para que en todo tiempo
    - le demos las gracias debidas.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

o-memoriale-mortis-domini:
  - - Oh memorial de la muerte del Señor,
    - pan vivo que das la vida al hombre,
    - concede a mi mente vivir de ti
    - y que siempre le sepas dulce.
  - - Piadoso pelícano, Señor Jesús,
    - límpiame a mí, impuro, con tu sangre,
    - de la que una sola gota puede salvar
    - al mundo entero de todo crimen.
  - - Cuando te vea con el rostro descubierto,
    - alegre al fin con la visión de tu gloria,
    - al Padre, a ti y al Espíritu las alabanzas
    - diré, unido a la asamblea de los bienaventurados.

salva-redemptor-plasma-tuum-nobile:
  - - Salva, Redentor, a tu noble criatura,
    - marcada con la santa luz de tu rostro;
    - no permitas que la desgarre el engaño de los demonios,
    - por la cual pagaste el precio de la muerte.
  - - Duélete de que tus siervos estén cautivos,
    - absuelve a los culpables, levanta a los encadenados,
    - y a los que redimiste con tu propia sangre,
    - rey bueno, haz que se gocen contigo para siempre.

crux-mundi-benedictio:
  - - Cruz, bendición del mundo,
    - esperanza y redención segura,
    - en otro tiempo portadora del infierno,
    - 'ahora clara puerta del cielo:'
  - - en ti es levantada la víctima
    - que atrajo hacia sí todas las cosas,
    - a la que ataca el príncipe del mundo
    - y no encuentra nada suyo.
  - - Al Padre, a ti y al Paráclito
    - sea igual gloria, Jesús,
    - que nos concedes gozar
    - siempre de la victoria de la cruz.

per-crucem-christe-quaesumus:
  - - 'Por la cruz, Cristo, te pedimos:'
    - lleva al premio de la vida
    - a los que, clavado en el madero,
    - te dignaste redimir.
  - - Un artículo de tu ley
    - anula el antiguo documento [de la deuda];
    - perece la antigua servidumbre,
    - se devuelve la verdadera libertad.
  - - Al Padre, a ti y al Paráclito
    - sea igual gloria, Jesús,
    - que nos concedes gozar
    - siempre de la victoria de la cruz.

christe-caelorum-domine:
  - - Cristo, Señor de los cielos,
    - salvador supremo del mundo,
    - que con el don de la cruz
    - 'libraste a todos de las leyes de la muerte:'
  - - orando ahora, te pedimos
    - que conserves tus dones,
    - que por los sagrados misterios
    - diste a todas las naciones.
  - - Tú, cordero manso, inocente,
    - ofrecido como víctima de la tierra,
    - lavaste con tu sangre
    - las vestiduras de todos los santos.
  - - A los que redimiste con el precio
    - de tu cuerpo sagrado,
    - resucitando los llevas al cielo,
    - donde te alaban para siempre.
  - - Que nos agregues a su número,
    - te suplicamos, Señor,
    - tú que de entre todos los pueblos
    - nos hiciste un reino para el Padre.

tibi-redemptor-omnium:
  - - A ti, Redentor de todos,
    - te cantamos un himno entre lágrimas;
    - perdónanos, Señor,
    - perdona a los que confiesan.
  - - Tú que quebrantas por la cruz
    - las fuerzas del antiguo enemigo de la muerte,
    - '[cruz] que llevamos como estandarte de la fe,'
    - marcados en la frente,
  - - dígnate rechazarlo
    - continuamente de nosotros,
    - para que nunca pueda dañar
    - a los redimidos con tu sangre.
  - - Tú que por nosotros a los infiernos
    - te dignaste descender,
    - para dar a los deudores de la muerte
    - los dones de la vida,
  - - tú eres quien, en el tiempo fijado,
    - al poner fin al mundo,
    - justo remunerador, establecerás
    - los méritos de todos.
  - - Te pedimos, pues, Cristo,
    - que cures nuestras heridas,
    - tú que con el Padre y el Espíritu
    - eres digno de alabanza para siempre.

auctor-salutis-unice:
  - - Único autor de la salvación,
    - ínclito redentor del mundo,
    - rey, Cristo, concédenos
    - la gloria de la cruz fecunda.
  - - Tú, destruyendo con la muerte la muerte
    - y dando la vida con la vida,
    - habías vencido al astuto
    - ministro de la muerte, el diablo.
  - - Por las piadosas artes del amor
    - entregado al sueño del sepulcro,
    - abres las moradas del infierno
    - y declaras libres a los padres.
  - - Ahora, víctima sagrada que brillas
    - a la derecha del Padre,
    - escucha, te rogamos, a los redimidos
    - con tu sangre vivificante,
  - - para que, siguiéndote todos los días
    - con costumbres puras,
    - contra todos los asaltos
    - llevemos el lábaro de la cruz.
  - - Al Padre, a ti y al Paráclito
    - sea igual gloria, Jesús,
    - que nos concedes gozar
    - siempre de la victoria de la cruz.

# ---------------- Tiempo pascual ----------------
ad-cenam-agni-providi:
  - - Preparados para la cena del Cordero,
    - blancos con las vestiduras de la salvación,
    - después del paso del mar Rojo
    - cantemos a Cristo, nuestro príncipe.
  - - Su cuerpo santísimo,
    - abrasado en el altar de la cruz,
    - y también su sangre rosada
    - gustando, vivimos para Dios.
  - - Protegidos en la tarde de la Pascua
    - del ángel exterminador,
    - del duro imperio del Faraón
    - hemos sido arrancados.
  - - Ya Cristo es nuestra Pascua,
    - cordero inocente inmolado;
    - él, como ázimo de sinceridad,
    - ofreció su carne.
  - - ¡Oh víctima verdadera y digna,
    - por la que se quebranta el abismo,
    - el pueblo cautivo es redimido
    - y se devuelven los premios de la vida!
  - - Se levanta Cristo del sepulcro,
    - vuelve vencedor del abismo,
    - empujando al tirano encadenado
    - y abriendo el paraíso.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

o-rex-aeterne-domine:
  - - Oh rey eterno, Señor,
    - Hijo siempre con el Padre,
    - según tu imagen
    - formaste al hombre Adán.
  - - Al que el diablo había engañado,
    - enemigo del género humano,
    - de él también la forma del cuerpo
    - tomaste tú de la Virgen,
  - - para unirnos a Dios
    - por la convivencia de la carne,
    - para darnos en el bautismo,
    - Redentor, el perdón.
  - - Tú, por el hombre, la cruz
    - te dignaste tomar;
    - diste tu sangre
    - como precio de nuestra salvación.
  - - Tú resucitaste, recibiendo
    - del Padre la gloria debida;
    - por ti también nosotros resucitaremos,
    - lo creemos con mente devota.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

iesu-redemptor-saeculi:
  - - Jesús, redentor del mundo,
    - Verbo del Padre altísimo,
    - luz de la luz invisible,
    - 'guardián siempre en vela de los tuyos:'
  - - tú, artífice de todas las cosas
    - y ordenador de los tiempos,
    - a los cuerpos cansados por el trabajo
    - recréalos con el descanso de la noche.
  - - Tú que quebrantas el profundo abismo,
    - líbranos del enemigo,
    - para que no pueda seducir
    - a los redimidos con tu sangre,
  - - para que, mientras, cargados con el cuerpo,
    - permanecemos un breve tiempo,
    - nuestra carne duerma de tal modo
    - que la mente no conozca el sopor.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

hic-est-dies-verus-dei:
  - - Este es el verdadero día de Dios,
    - sereno con la santa luz,
    - en el que la sangre sagrada lavó
    - los vergonzosos crímenes del mundo.
  - - Devuelve la fe a los perdidos
    - e ilumina con la vista a los ciegos;
    - '¿a quién no libra de un grave temor'
    - la absolución del ladrón?
  - - Se asombran de la obra también los ángeles,
    - viendo el castigo del cuerpo
    - y al culpable, unido a Cristo,
    - alcanzar la vida bienaventurada.
  - - 'Misterio admirable:'
    - que, para lavar la mancha del mundo,
    - quite los pecados de todos
    - la carne, purificando los vicios de la carne.
  - - '¿Qué puede haber más sublime que esto:'
    - que la culpa busque la gracia,
    - que la caridad disipe el temor
    - y que la muerte devuelva una vida nueva?
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

laetare-caelum-desuper:
  - - Alégrate, cielo, desde lo alto,
    - 'aplaudan la tierra y el mar:'
    - Cristo, resucitando después de la cruz,
    - dio la vida a los mortales.
  - - Ya vuelve el tiempo favorable,
    - se ve el día de la salvación,
    - en el que el mundo, por la sangre del Cordero,
    - resplandeció [saliendo] de la oscuridad.
  - - Aquella muerte, pasión de la muerte,
    - es el perdón del pecado;
    - el poder permanece intacto;
    - el vencido dio la victoria.
  - - Esta fue una prueba anticipada de nuestra esperanza,
    - para que los fieles creyeran
    - que podrán después resucitar
    - y alcanzar la vida bienaventurada.
  - - Ahora, pues, la Pascua luminosa,
    - causa de tales bienes,
    - celebrémosla todos con empeño,
    - llenos de tan gran don.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

aurora-lucis-rutilat:
  - - La aurora de la luz resplandece,
    - el cielo resuena de alabanzas,
    - el mundo exultante se regocija,
    - el infierno gime y aúlla,
  - - cuando aquel rey fortísimo,
    - quebrantadas las fuerzas de la muerte,
    - pisoteando con su pie el abismo,
    - libra de la cadena a los desdichados.
  - - Aquel a quien, encerrado bajo la piedra,
    - el soldado custodia con rigor,
    - triunfando con noble cortejo,
    - se levanta vencedor del sepulcro.
  - - Ya acabados los gemidos
    - y los dolores del infierno,
    - porque resucitó el Señor,
    - clama el ángel resplandeciente.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

chorus-novae-ierusalem:
  - - El coro de la nueva Jerusalén
    - entone la nueva dulzura del himno,
    - celebrando con gozos sobrios
    - la fiesta pascual,
  - - en la que Cristo, león invicto,
    - levantándose tras aplastar al dragón,
    - mientras resuena su voz viva,
    - despierta de la muerte a los difuntos.
  - - La presa que había devorado,
    - el malvado abismo la devuelve;
    - libres de la cautividad,
    - las multitudes siguen a Jesús.
  - - Él triunfa espléndidamente
    - y, digno de su grandeza,
    - de la tierra y del cielo hace una sola patria,
    - una sola república.
  - - Cantándole, como soldados,
    - supliquemos al Rey
    - que en su clarísimo palacio
    - nos dé un lugar.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

iam-surgit-hora-tertia:
  - - Ya llega la hora tercia,
    - en la que Cristo subió a la cruz;
    - que la mente no piense nada soberbio,
    - que dirija su afecto a la oración.
  - - Quien recibe a Cristo en su corazón
    - tiene un sentir inocente
    - y con votos constantes consigue
    - merecer el Espíritu Santo.
  - - Esta es la hora que puso fin
    - al antiguo letargo del cruel pecado;
    - desde aquí comenzaron ya los tiempos dichosos
    - por la gracia de Cristo.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

venite-servi-supplices:
  - - Venid, siervos, suplicantes,
    - y con la mente y con la boca ensalzad
    - con alabanzas dignas
    - el nombre bienaventurado de Dios, con un cántico.
  - - Porque este es aquel tiempo
    - en que al juez de los siglos
    - entregó a la muerte
    - la sentencia injusta de los mortales.
  - - Y nosotros, con el amor debido,
    - sometidos con justo temor,
    - contra todos los asaltos
    - que lanza el enemigo cruel,
  - - roguemos al único [Dios], Padre,
    - y al Hijo, Dios y rey,
    - y a la vez al Espíritu Santo,
    - Señor en la Trinidad.

haec-hora-quae-resplenduit:
  - - Esta es la hora que resplandeció
    - y disipó las nubes de la cruz,
    - despojando al mundo de las tinieblas,
    - devolviendo la luz serena.
  - - Esta es la hora en que, resucitando
    - Jesús los cuerpos de los sepulcros,
    - les mandó salir libres de la muerte,
    - devuelto el espíritu.
  - - Creemos que los siglos renovados,
    - rotas las leyes de la muerte,
    - corren un curso perenne
    - de dones de la vida bienaventurada.
  - - Jesús, a ti sea la gloria,
    - que, vencida la muerte, resplandeces,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

iesu-nostra-redemptio:
  - - Jesús, nuestra redención,
    - amor y deseo,
    - Dios creador de todas las cosas,
    - 'hombre al final de los tiempos:'
  - - '¿qué clemencia te venció'
    - para que cargaras con nuestros pecados,
    - padeciendo una muerte cruel
    - para arrancarnos de la muerte,
  - - penetrando los cerrojos del infierno,
    - redimiendo a tus cautivos,
    - vencedor con noble triunfo,
    - sentado a la derecha del Padre?
  - - Que esa misma piedad te mueva
    - a vencer nuestros males
    - perdonando, y, cumplido nuestro deseo,
    - a saciarnos con tu rostro.
  - - Sé tú nuestro gozo,
    - tú que serás nuestro premio;
    - sea nuestra gloria en ti
    - siempre, por todos los siglos.

aeterne-rex-altissime:
  - - Rey eterno y altísimo,
    - redentor también de los fieles,
    - por quien la muerte, deshecha, perece
    - 'y se da el triunfo de la gracia:'
  - - subes al tribunal de la derecha
    - del Padre, y desde el cielo se te
    - confiere el poder sobre todas las cosas,
    - que no tenías en lo humano,
  - - para que la triple estructura de las cosas
    - de lo celeste, de lo terrestre
    - y de lo infernal, creada,
    - doble ya, sometida, la rodilla.
  - - Tiemblan los ángeles al ver
    - cambiada la suerte de los mortales;
    - la carne peca, la carne purifica,
    - reina la carne, Verbo de Dios.
  - - Tú, Cristo, gozo nuestro,
    - que permaneces como premio perenne,
    - que gobiernas la fábrica del mundo,
    - 'venciendo los gozos mundanos:'
  - - 'por eso, suplicantes, te pedimos:'
    - perdona todas nuestras culpas
    - y levanta los corazones hacia lo alto,
    - hacia ti, con la gracia celestial,
  - - para que, cuando comiences a brillar,
    - juez, en la nube rojiza,
    - apartes las penas merecidas
    - y devuelvas las coronas perdidas.
  - - Jesús, a ti sea la gloria,
    - que subes a lo celestial,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

optatus-votis-omnium:
  - - Deseado por los votos de todos,
    - ha amanecido el día sagrado
    - en que Cristo, esperanza del mundo, Dios,
    - subió a los altos cielos,
  - - el triunfo del gran combate,
    - aniquilado el príncipe del mundo,
    - presentando a la mirada del Padre
    - la gloria de la carne vencedora.
  - - Es llevado en una nube luminosa
    - y da esperanza a los creyentes,
    - abriendo ya el paraíso
    - que los primeros padres habían cerrado.
  - - '¡Oh gran gozo para todos:'
    - que el Hijo de nuestra Virgen,
    - después de los salivazos, los azotes, después de la cruz,
    - se une al trono del Padre!
  - - Demos, pues, gracias
    - al vengador de nuestra salvación,
    - porque llevó nuestro cuerpo
    - a lo alto, al palacio del cielo.
  - - Que sea para nosotros con los del cielo
    - 'un gozo común y permanente:'
    - para ellos, porque se les ofreció;
    - para nosotros, porque no se nos quitó.
  - - Ahora, Cristo, que subes al cielo,
    - eleva hacia ti nuestro corazón,
    - enviándonos desde el cielo
    - tu Espíritu y el del Padre.

veni-creator-spiritus:
  - - Ven, Espíritu creador,
    - visita las mentes de los tuyos,
    - llena de la gracia de lo alto
    - los corazones que tú creaste.
  - - Tú que eres llamado Paráclito,
    - don del Dios altísimo,
    - fuente viva, fuego, caridad
    - y unción espiritual.
  - - Tú, septiforme en tus dones,
    - tú, dedo de la diestra de Dios,
    - tú, el prometido solemnemente por el Padre,
    - que enriqueces las gargantas con la palabra.
  - - Enciende tu luz en los sentidos,
    - infunde amor en los corazones,
    - fortaleciendo lo débil de nuestro cuerpo
    - con tu fuerza perpetua.
  - - Aleja más y más al enemigo
    - y danos pronto la paz;
    - yendo tú así delante como guía,
    - evitemos todo lo dañino.
  - - Concédenos conocer por ti al Padre
    - y conocer también al Hijo,
    - y en ti, Espíritu de ambos,
    - creamos en todo tiempo.

lux-iucunda-lux-insignis:
  - - Luz alegre, luz insigne,
    - en la que, enviado desde el trono, el fuego
    - '[vino] sobre los discípulos de Cristo:'
    - llena los corazones, enriquece las lenguas,
    - nos invita a melodías concordes
    - del corazón y de la lengua.
  - - Consolador bondadoso, ven,
    - 'gobierna las lenguas, suaviza los corazones:'
    - nada de hiel ni de veneno
    - en tu presencia.
  - - Hechos una nueva criatura,
    - te alabamos con mente pura,
    - ahora hijos de la gracia, pero por naturaleza
    - antes hijos de la ira.
  - - Tú que eres dador y don,
    - todo el bien de nuestro corazón,
    - haz el corazón inclinado a la alabanza,
    - formando el sonido de nuestra lengua
    - para tus alabanzas.
  - - Purifícanos de los pecados,
    - tú, autor mismo de la piedad,
    - y a nosotros, renovados en Cristo,
    - danos los plenos gozos
    - de la perfecta novedad.

beata-nobis-gaudia:
  - - Gozos bienaventurados
    - nos ha traído el curso del año,
    - cuando el Espíritu Paráclito
    - brilló sobre los discípulos.
  - - El fuego, con luz vibrante,
    - tomó la forma de lengua,
    - para que fueran abundantes en palabras
    - y fervientes en caridad.
  - - Hablan las lenguas de todos;
    - se espantan las multitudes de los gentiles,
    - juzgan que están ebrios de mosto
    - los que el Espíritu había llenado.
  - - Esto se cumplió místicamente
    - acabado el tiempo de la Pascua,
    - en el número sagrado de los días,
    - en que por la ley se hace la remisión.
  - - A ti ahora, Dios piadosísimo,
    - 'te rogamos con el rostro inclinado:'
    - concédenos los dones
    - que bajaron del cielo, oh Espíritu.
  - - En otro tiempo llenaste con tu gracia
    - los corazones consagrados;
    - perdona ahora los pecados
    - y danos tiempos tranquilos.
  - - Concédenos conocer por ti al Padre
    - y conocer también al Hijo,
    - y en ti, Espíritu de ambos,
    - creamos en todo tiempo.

iam-christus-astra-ascenderat:
  - - Ya Cristo había subido a los astros,
    - volviendo de donde había venido,
    - para dar el don prometido del Padre,
    - el Espíritu Santo,
  - - cuando la feliz hora tercia
    - de repente resuena en el mundo,
    - anunciando a los apóstoles en oración
    - que Dios había venido.
  - - De la luz del Padre, pues,
    - es el fuego hermoso y bondadoso
    - que llena los corazones fieles a Cristo
    - con el calor de la palabra.
  - - Desciende, Espíritu Santo,
    - a nuestros corazones, altares;
    - adórnalos para ti con virtudes
    - y conságralos como templos para ti.
  - - Concédenos conocer por ti al Padre
    - y conocer también al Hijo,
    - y en ti, Espíritu de ambos,
    - creamos en todo tiempo.

# ---------------- Comunes ----------------
urbs-ierusalem-beata:
  - - Ciudad de Jerusalén bienaventurada,
    - llamada visión de paz,
    - que se construye en los cielos
    - con piedras vivas,
    - y coronada por los ángeles
    - 'como una esposa por su cortejo:'
  - - nueva, viniendo del cielo,
    - preparada para la cámara nupcial,
    - para unirse intacta
    - al Señor.
    - Sus plazas y sus muros
    - son de oro purísimo;
  - - las puertas brillan con perlas,
    - con los santuarios abiertos,
    - y por la fuerza de los méritos
    - es introducido allí
    - todo el que por el nombre de Cristo
    - es oprimido aquí en el mundo.
  - - Pulidas por golpes y presiones,
    - las piedras
    - se ajustan en su lugar
    - por la mano del artífice;
    - se disponen para permanecer
    - en los edificios sagrados.
  - - Gloria y honor a Dios
    - altísimo en todas partes,
    - a la vez al Padre y al Hijo
    - y al Espíritu Santo,
    - a quienes las alabanzas y el poder
    - por los siglos eternos.

christe-cunctorum-dominator-alme:
  - - Cristo, soberano bondadoso de todas las cosas,
    - que tu pueblo suplicante resuene en el templo,
    - cuyas fiestas, que han de celebrarse, vuelven
    - cada año.
  - - Este lugar, en efecto, es llamado palacio
    - del rey inmenso, y del cielo resplandeciente
    - puerta, que a todos los que buscan la patria de la vida
    - recibe.
  - - Esta casa sagrada reúne a tu pueblo,
    - esta, piadosa, lo enriquece siempre con los sacramentos,
    - lo alimenta con manjares celestiales para los dones
    - de la vida perenne.
  - - Te pedimos, pues, oh Dios, que con rostro sereno
    - asientas, gobernando a tus siervos,
    - que con sumo amor celebran
    - los gozos de tu templo.
  - - Que una alabanza igual celebre al Padre altísimo
    - y a ti, Salvador, rey piadoso, por siempre;
    - que la gloria del Espíritu Santo resuene
    - por todo el mundo.

angularis-fundamentum:
  - - Como fundamento angular
    - ha sido puesta la piedra, Cristo,
    - que en la trabazón de las paredes
    - se une a ambos lados;
    - a quien recibió la santa Sion,
    - en quien permanece el creyente.
  - - Toda aquella ciudad sagrada
    - y amada por Dios,
    - llena de melodías en la alabanza
    - y de canto jubiloso,
    - al Dios trino y uno
    - proclama con fervor.
  - - A este templo, Dios altísimo,
    - ven, invocado,
    - y con bondad clemente
    - recibe los votos de las súplicas;
    - derrama aquí continuamente
    - una abundante bendición.
  - - Que aquí merezcan todos
    - obtener lo que pidan
    - y poseer lo alcanzado
    - con los santos para siempre,
    - y entrar en el paraíso,
    - trasladados al descanso.
  - - Gloria y honor a Dios
    - altísimo en todas partes,
    - a la vez al Padre y al Hijo
    - y al Espíritu Santo,
    - a quienes las alabanzas y el poder
    - por los siglos eternos.

maria-quae-mortalium:
  - - María, que recibes con amor
    - las súplicas de los mortales,
    - 'he aquí que te rogamos suplicantes:'
    - asístenos siempre.
  - - Asístenos, si la horrible cadena
    - de los pecados nos aprieta;
    - desata pronto los grillos
    - que atan los corazones con las culpas.
  - - Socórrenos, si la imagen engañosa
    - del mundo nos seduce,
    - para que la mente no abandone el camino
    - de la salvación, olvidada del cielo.
  - - Socórrenos, si una suerte adversa
    - amenaza también al cuerpo;
    - haz que los tiempos sean tranquilos,
    - mientras brilla la eternidad.
  - - Y sé para tus hijos
    - amparo en la hora de la muerte,
    - para que, con tu ayuda, se nos conceda
    - alcanzar el premio perenne.
  - - Gloria sea al Padre y al Paráclito
    - y a tu Hijo,
    - que te rodearon con el admirable
    - vestido de la gracia.

quem-terra-pontus-aethera:
  - - Al que la tierra, el mar y el cielo
    - veneran, adoran y proclaman,
    - el que rige la triple estructura [del mundo],
    - lo lleva el seno de María.
  - - Aquel a quien la luna, el sol y todas las cosas
    - sirven a través de los tiempos,
    - inundadas por la gracia del cielo,
    - lo llevan las entrañas de una doncella.
  - - Madre dichosa por el don [recibido],
    - en cuyo seno, como en un arca,
    - quedó encerrado el artífice celestial,
    - que contiene el mundo en su puño.
  - - Dichosa por el mensaje del cielo,
    - fecunda por el Espíritu Santo,
    - por cuyo seno fue dado a luz
    - el deseado de las naciones.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

o-gloriosa-domina:
  - - Oh gloriosa señora,
    - excelsa sobre los astros,
    - al que te creó con providencia
    - lo amamantas con tu pecho sagrado.
  - - Lo que la triste Eva quitó,
    - tú lo devuelves con tu fruto bondadoso;
    - para que los que lloran entren en los astros,
    - benigna, preparas el camino.
  - - Tú eres la entrada del rey altísimo
    - y la puerta resplandeciente de la luz;
    - la vida dada por la Virgen,
    - pueblos redimidos, aplaudidla.
  - - Gloria sea al Padre y al Paráclito
    - y a tu Hijo,
    - que te rodearon con el admirable
    - vestido de la gracia.

ave-maris-stella:
  - - Salve, estrella del mar,
    - madre bondadosa de Dios,
    - y siempre virgen,
    - feliz puerta del cielo.
  - - Recibiendo aquel «Ave»
    - de la boca de Gabriel,
    - afiánzanos en la paz,
    - cambiando el nombre de Eva.
  - - Desata las cadenas de los culpables,
    - da luz a los ciegos,
    - aleja nuestros males,
    - pide para nosotros todos los bienes.
  - - Muestra que eres madre;
    - que reciba por ti nuestra súplica
    - el que, nacido por nosotros,
    - aceptó ser tuyo.
  - - Virgen singular,
    - mansa entre todas,
    - a nosotros, libres de culpas,
    - haznos mansos y castos.
  - - Concede una vida pura,
    - prepara un camino seguro,
    - para que, viendo a Jesús,
    - nos alegremos siempre juntos.
  - - Alabanza a Dios Padre,
    - honor a Cristo altísimo,
    - al Espíritu Santo
    - honra, a los tres, uno solo.

o-virgo-mater-filia:
  - - Oh virgen madre, hija
    - de tu Hijo, bienaventurada,
    - sublime y humildísima
    - más que todas las criaturas.
  - - Tú eres el término fijado desde siempre
    - del designio divino,
    - tú, el honor y la cumbre más alta
    - 'de nuestra naturaleza:'
  - - tú la ennobleciste de tal modo
    - que su supremo creador
    - se hiciera, por ti, en ella misma,
    - con arte admirable, criatura.
  - - En el seno virginal
    - revivió el amor ardiente,
    - por cuyo calor germinan
    - en la tierra flores del cielo.
  - - Gloria sea al Padre y al Paráclito
    - y a tu Hijo,
    - que te rodearon con el admirable
    - vestido de la gracia.

quae-caritatis-fulgidum:
  - - Tú que eres, Virgen, para los del cielo
    - el astro resplandeciente de la caridad,
    - para nosotros, los mortales, eres de la esperanza
    - fuente viva y abundante.
  - - Tanto puedes, excelsa Señora,
    - ante el corazón de tu Hijo piadosísimo,
    - que quien pide con confianza
    - obtiene seguro por ti.
  - - Tu benignidad no solo
    - da ayuda a los que la piden,
    - sino que muchas veces, gustosa,
    - se adelanta a los deseos de los que ruegan.
  - - En ti la misericordia,
    - en ti la magnificencia;
    - tú reúnes en ti todo lo bueno
    - que poseen las criaturas.
  - - Gloria sea al Padre y al Paráclito
    - y a tu Hijo,
    - que te rodearon con el admirable
    - vestido de la gracia.

exsultet-caelum-laudibus:
  - - Exulte el cielo con alabanzas,
    - 'resuene la tierra de gozo:'
    - la gloria de los apóstoles
    - cantan las sagradas solemnidades.
  - - Vosotros, jueces justos del mundo
    - y verdaderas luces de la tierra,
    - 'os rogamos con los votos del corazón:'
    - escuchad las súplicas de los que os imploran.
  - - Vosotros, que con la palabra cerráis el cielo
    - y abrís sus cerrojos,
    - desatadnos de todos los pecados
    - con vuestro mandato, os pedimos.
  - - Vosotros, a cuyo mandato están sometidas
    - la salud y la enfermedad de todos,
    - sanad a los enfermos de costumbres,
    - devolviéndonos a las virtudes,
  - - para que, cuando venga como juez
    - Cristo al fin del mundo,
    - nos haga partícipes
    - del gozo sempiterno.
  - - A Dios sean las alabanzas de la gloria,
    - que nos concede ser instruidos por vosotros
    - en las enseñanzas del Evangelio
    - y alcanzar las cosas celestiales.

o-sempiternae-curiae:
  - - Oh príncipes de la corte eterna
    - del rey supremo,
    - a quienes Jesús mismo, instruyéndoos,
    - 'dio al mundo como apóstoles:'
  - - la Jerusalén celestial,
    - cuya lámpara es el Cordero,
    - os posee como gemas brillantes,
    - como cimientos preclaros.
  - - Y os celebra, gozosa,
    - la Iglesia, esposa de Cristo,
    - a la que vuestra palabra despertó,
    - a la que consagrasteis con vuestra sangre.
  - - Cuando, al caer los siglos,
    - el Redentor se siente como juez,
    - ¡con qué alabanza os sentaréis,
    - senado de la alta gloria!
  - - Que, pues, vuestra oración
    - nos fortalezca siempre ayudándonos,
    - para que las semillas que esparcisteis
    - florezcan en granos del cielo.
  - - Gloria eterna a Cristo,
    - que os hizo mensajeros
    - del Padre, y os llenó del Espíritu
    - con su poder bondadoso.

tristes-erant-apostoli:
  - - Estaban tristes los apóstoles
    - por la muerte de su Señor,
    - a quien con la muerte más cruel
    - habían condenado los impíos feroces.
  - - Con palabra amable el ángel
    - 'predijo a las mujeres:'
    - «En Galilea el Señor
    - ha de ser visto cuanto antes».
  - - Mientras ellas van presurosas
    - a decir esto a los apóstoles,
    - viéndolo vivo,
    - besan los pies del Señor.
  - - Sabido esto, los discípulos
    - van rápidamente a Galilea
    - para ver el rostro
    - deseado del Señor.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Gloria a ti, Cristo,
    - que, destruido el reino de la muerte,
    - abriste por los apóstoles
    - los caminos de la vida y de la luz.

claro-paschali-gaudio:
  - - Con claro gozo pascual
    - brilla el sol para el mundo con su rayo,
    - cuando los apóstoles ven ya a Cristo
    - con la vista del cuerpo.
  - - Mostradas a ellos las heridas
    - resplandecientes en la carne de Cristo,
    - que el Señor ha resucitado
    - lo confiesan con voz pública.
  - - Rey, Cristo, clementísimo,
    - posee tú nuestros corazones,
    - para que te demos las alabanzas debidas
    - en todo tiempo.
  - - Sé para nuestras almas, Jesús,
    - el gozo pascual perenne,
    - y a nosotros, renacidos a la gracia,
    - únenos a tus triunfos.
  - - Gloria a ti, Cristo,
    - que, destruido el reino de la muerte,
    - abriste por los apóstoles
    - los caminos de la vida y de la luz.

sanctorum-meritis-inclita-gaudia:
  - - Los gozos ínclitos por los méritos de los santos
    - cantemos, compañeros, y sus hazañas valerosas;
    - pues el alma arde por celebrar con cantos
    - al linaje excelente de los vencedores.
  - - Estos son los que el mundo, reteniéndolos, aborreció,
    - pues lo despreciaron del todo, árido con su flor
    - estéril, y te siguieron a ti,
    - Cristo, buen rey de los del cielo.
  - - Estos soportan por ti furias y crueldades;
    - no resuena un murmullo, ni una queja,
    - sino que, con corazón callado, el alma bien consciente
    - conserva la paciencia.
  - - '¿Qué voz, qué lengua podrá contar'
    - los dones que preparas a los mártires?
    - Pues, rojos de sangre que corre, con laureles
    - bien resplandecientes se enriquecen.
  - - Te pedimos, Divinidad trina y una,
    - que laves las culpas, quites lo dañino,
    - des la paz a tus siervos, y a nosotros también, la gloria
    - por todos los siglos a ti.

rex-gloriose-martyrum:
  - - Rey glorioso de los mártires,
    - corona de los confesores,
    - que a los que rechazan lo terreno
    - 'los conduces a lo celestial:'
  - - presta pronto tu oído benigno
    - a nuestras voces;
    - cantamos los sagrados trofeos,
    - perdona lo que hemos pecado.
  - - Tú vences en los mártires,
    - perdonando a los confesores;
    - vence tú nuestros crímenes,
    - dándonos la indulgencia.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

aeterna-christi-munera:
  - - Los dones eternos de Cristo
    - y las victorias de los mártires,
    - ofreciendo las alabanzas debidas,
    - cantemos con almas alegres.
  - - Príncipes de las iglesias,
    - jefes triunfadores de la guerra,
    - soldados del palacio celestial
    - y verdaderas luces del mundo.
  - - Vencido el terror del mundo
    - y despreciadas las penas del cuerpo,
    - por el atajo de una muerte santa
    - poseen la luz bienaventurada.
  - - Por la mano del verdugo enloquecido
    - es derramada la sangre sagrada,
    - pero permanecen inmóviles
    - por la gracia de la vida perenne.
  - - La fe devota de los santos,
    - la esperanza invicta de los creyentes,
    - la caridad perfecta de Cristo
    - triunfa del príncipe del mundo.
  - - En ellos [está] la gloria del Padre,
    - en ellos la voluntad del Espíritu,
    - exulta en ellos el Hijo,
    - el cielo se llena de gozo.
  - - Ahora, Redentor, te pedimos
    - que a la compañía de los mártires
    - unas a tus siervos que te suplican,
    - por los siglos sempiternos.

deus-tuorum-militum:
  - - Oh Dios, herencia, corona y premio
    - de tus soldados,
    - a los que cantan las alabanzas del mártir
    - desátalos del lazo del pecado.
  - - Este testigo proclamó con la boca
    - lo que creyó en el arca del corazón;
    - siguiendo a Cristo, lo encontró
    - con el derramamiento de su sangre.
  - - Este, en efecto, considerando con razón
    - caducos los gozos del mundo
    - y sus halagos dañinos,
    - llegó a lo celestial.
  - - Corrió valerosamente a las penas
    - y las soportó con fortaleza;
    - derramando por ti su sangre,
    - posee los dones eternos.
  - - Por esto, con súplica humilde,
    - 'te pedimos, oh piadosísimo:'
    - en este triunfo del mártir
    - perdona la culpa a tus siervos,
  - - para que alcancemos también
    - la participación de su premio
    - y nos alegremos para siempre,
    - unidos en las moradas del cielo.
  - - Alabanza y gloria perenne
    - a ti, Padre, con el Hijo,
    - y a la vez al Santo Paráclito,
    - por los siglos de los siglos.

beate-martyr-prospera:
  - - Bienaventurado mártir, haz próspero
    - tu día triunfal,
    - en el que, como recompensa de tu sangre,
    - se te da la corona al vencer.
  - - Este día te sacó de las tinieblas del mundo,
    - vencidos el verdugo y el juez,
    - y te llevó al cielo,
    - y te devolvió, triunfante, a Cristo.
  - - Ahora, compañero de los ángeles,
    - brillas con la insigne vestidura
    - que, testigo indomable,
    - habías lavado con ríos de sangre.
  - - Asístenos ahora y suplica
    - que Cristo, aplacado, a los suyos
    - incline su oído propicio
    - y no les impute todas las culpas.
  - - Desciende aquí un momento,
    - trayendo el favor de Cristo,
    - para que los sentidos agobiados sientan
    - el alivio del perdón.
  - - Honor al Padre con el Hijo
    - y al Espíritu Paráclito,
    - que te ciñen con corona perpetua
    - en el palacio de la gloria.

martyr-dei-qui-unicum:
  - - Mártir de Dios, que, siguiendo
    - al Hijo único del Padre,
    - triunfas sobre los enemigos vencidos,
    - 'vencedor que gozas de lo celestial:'
  - - por el don de tu súplica
    - lava nuestra culpa,
    - apartando el contagio del mal,
    - alejando el hastío de la vida.
  - - Ya están desatadas las cadenas
    - de tu cuerpo sagrado;
    - desátanos de las cadenas del mundo
    - por amor del Hijo de Dios.
  - - Honor al Padre con el Hijo
    - y al Espíritu Paráclito,
    - que te ciñen con corona perpetua
    - en el palacio de la gloria.

virginis-proles-opifexque-matris:
  - - Hijo de la Virgen y creador de tu Madre,
    - a quien llevó y dio a luz una Virgen,
    - 'cantamos el trofeo festivo de una virgen:'
    - recibe nuestro voto.
  - - Esta virgen tuya, dichosa por doble
    - suerte, mientras se alegra de dominar
    - la frágil condición del cuerpo, dominó con su cuerpo
    - al mundo sangriento.
  - - Por eso, sin temer ni la muerte ni los crueles
    - géneros de tormentos, amigos de la muerte,
    - derramando su sangre, mereció subir
    - al cielo sagrado.
  - - Por su intercesión, Dios bondadoso,
    - perdona ya nuestras culpas, arrancados los vicios,
    - para que resuene para ti por siempre el himno
    - de un corazón puro.

o-christe-flos-convallium:
  - - Oh Cristo, flor de los valles,
    - te ensalzamos con alabanzas,
    - porque adornaste a esta virgen
    - también con las palmas del martirio.
  - - Ella, prudente, fuerte, sabia,
    - habiendo confesado libremente la fe,
    - por ti recibió crueles suplicios
    - sin temor.
  - - Así, despreciado el príncipe del mundo,
    - enriquecida con tu don,
    - conquistados en un combate sangriento,
    - obtuvo los premios eternos.
  - - Por sus méritos, Redentor,
    - piadoso, únenos [a ella] como compañeros,
    - para que con mente pura gocemos
    - de los frutos de tu sangre.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

o-castitatis-signifer:
  - - Oh abanderado de la castidad
    - y fortaleza de los mártires,
    - que das a ambos sus premios,
    - escucha benigno a los que te suplican.
  - - Esta virgen de gran corazón,
    - dichosa por doble suerte
    - y noble por doble palma,
    - es ensalzada aquí con alabanzas.
  - - Ella, obstinada en confesarte,
    - armó con valor contra sí
    - el brazo cruel del verdugo
    - y entregó por ti su espíritu.
  - - Así, enseñando a vencer las heridas
    - del mundo cuando se ensaña
    - y su seducción cuando halaga,
    - nos enseña la fe íntegra.
  - - Por su favor, perdónanos
    - todas nuestras deudas,
    - quitando lo que alimenta los pecados
    - y concediéndonos tu gracia.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

vir-celse-forma-fulgida:
  - - Varón excelso, imagen resplandeciente
    - de la virtud, recibe el himno
    - que, mientras te alaba con justicia,
    - canta las maravillas de Dios.
  - - El Pontífice sempiterno,
    - que reunió con Dios el linaje
    - de los mortales y nos devolvió
    - a la paz con una nueva alianza,
  - - él mismo, previsor, te hizo
    - ministro de su oficio,
    - para dar gloria al Padre
    - y su vida a los pueblos.
  - - Enriquecido con la fuerza
    - del Espíritu que te consagró,
    - como obispo diste
    - los pastos abundantes de la salvación.
  - - Colocado en el cielo,
    - acuérdate de la santa Iglesia,
    - para que todas las ovejas busquen
    - los pastos dichosos de Cristo.
  - - Gloria a la Trinidad,
    - que corona con gozos dignos
    - a ti, su ministro diligente,
    - los oficios del santo ministerio.

sacrata-nobis-gaudia:
  - - Gozos sagrados
    - nos ha traído el día anual,
    - en el que se alaba con el debido
    - culto a los guías de los rebaños.
  - - He aquí que por la custodia del rebaño
    - no descuidan ningún trabajo,
    - lo protegen, dándole
    - un pasto más sano.
  - - Alejan a los lobos de sus confines,
    - echan lejos a los ladrones,
    - llenan de abundancia a las ovejas,
    - nunca abandonan el redil.
  - - Ahora que gozáis de tantos gozos,
    - santísimos guías de los rebaños,
    - pedid para nosotros la gracia
    - ante el tribunal del juez.
  - - Cristo, pontífice eterno,
    - a ti sea igual gloria
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

christe-pastorum-caput-atque-princeps:
  - - Cristo, cabeza y príncipe de los pastores,
    - deseosa de celebrar la fiesta de este,
    - la multitud piadosa canta las alabanzas debidas
    - con un canto sagrado.
  - - A este, haciéndolo tu ministro elegido
    - y asociándolo al sacerdocio, lo diste
    - para que asistiera al pueblo como guía fiel
    - y buen sustentador.
  - - Este fue guía y modelo del rebaño,
    - era luz para el ciego, alivio para el desdichado,
    - padre previsor para todos, y para todos
    - se hizo todo.
  - - Cristo, que a los santos das en el cielo
    - la corona merecida, haz que, dóciles, sigamos
    - al maestro en la vida y que al fin alcancemos
    - un fin semejante.
  - - Que una alabanza igual celebre al Padre altísimo
    - y a ti, Salvador, rey piadoso, por siempre;
    - que la gloria del Espíritu Santo resuene
    - por todo el mundo.

dum-sacerdotum-celebrant-fideles:
  - - Mientras los fieles celebran las fiestas
    - de los sacerdotes, dignas de veneración con culto solemne,
    - este honor redunda en tu alabanza,
    - Sacerdote supremo.
  - - Por tu don pudieron los padres
    - enseñar a los pueblos los caminos de la luz,
    - regirlos con santas costumbres y apacentarlos
    - con la palabra de vida.
  - - Pero tampoco las adversidades podían apartarlos
    - del curso firme de tu fe,
    - pues los animaba la esperanza cierta
    - de los premios futuros.
  - - Por eso, después de los trabajos de la frágil vida,
    - debidamente recorridos, alcanzadas las moradas
    - de la patria celestial, gozan dichosos
    - de una paz firme.
  - - Que el sumo honor de la gloria y de la alabanza,
    - a ti, Rey de reyes, Divinidad perenne,
    - lo celebre todo lo que existe, por todo
    - tiempo y edad.

inclitus-rector-pater-atque-prudens:
  - - Ínclito pastor, padre y prudente,
    - cuyo insigne triunfo celebramos,
    - este confesor, alegre sin fin,
    - reina en los astros.
  - - Él asumió el oficio sagrado de sacerdote,
    - guía y maestro, para los pueblos,
    - y como obispo sabio preparó los dones
    - de la vida dichosa.
  - - Roguémosle ahora todos con empeño
    - que, piadoso, lave nuestra culpa
    - y con su súplica nos lleve a las altas
    - cumbres del cielo.
  - - Sea a Dios solo el honor y el poder,
    - la alabanza en las alturas, el honor perenne,
    - que, moderándolo todo, gobierna el mundo
    - con sus leyes.

hi-sacerdotes-domini-sacrati:
  - - Estos sacerdotes consagrados al Señor,
    - fieles consagradores del Señor,
    - fueron también pastores del pueblo
    - con amor diligente.
  - - Pues, guardando los dones de la bendición
    - recibida, se esforzaron, con la cintura
    - fuertemente ceñida, por llevar en las manos
    - lámparas brillantes.
  - - Y así, atentos y en vela, cuando
    - el Señor viniera llamando a la puerta,
    - le salieron al encuentro, prontos
    - a abrirle la entrada.
  - - Que el sumo honor de la gloria y de la alabanza,
    - a ti, Rey de reyes, Divinidad perenne,
    - lo celebre todo lo que existe, por todo
    - tiempo y edad.

aeterne-sol-qui-lumine:
  - - Sol eterno, que con tu luz
    - llenas todo lo creado,
    - luz suprema también de las mentes,
    - te cantan nuestros corazones.
  - - Con el aliento de tu Espíritu,
    - aquí brillaron luminarias vivas
    - por las que a través de los siglos
    - se abren los caminos de la salvación.
  - - Lo que las palabras enviadas del cielo,
    - lo que la mente por naturaleza muestra,
    - por estos ministros de la gracia
    - brilló con nuevo resplandor.
  - - Partícipe de su corona,
    - honrado por una doctrina luminosa,
    - brilló aquí este varón bienaventurado
    - que proclamamos con alabanzas.
  - - Con su favor, te pedimos,
    - concédenos, oh Dios, recorrer
    - el camino de la verdad,
    - para que podamos alcanzarte.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

doctor-aeternus-coleris-piusque:
  - - Eres venerado como doctor eterno y piadoso,
    - Cristo, que abres las leyes de la salvación,
    - tú, de quien con razón se piensa que solo
    - tienes palabras de vida.
  - - Y te aclamamos, buen Pastor del mundo,
    - porque desde el cielo afirmaste siempre
    - las palabras de tu Esposa, para que ella
    - fuera siempre luz para el mundo.
  - - Más aún, nos das servidores brillantes,
    - como estrellas de oro que resplandecen,
    - que nos abran las enseñanzas seguras
    - de la vida dichosa.
  - - Por eso te cantan alabanzas, Maestro,
    - porque derramas bienes asombrosos del Espíritu
    - por boca de los doctores, por los que poderosamente
    - se muestra tu luz bondadosa.
  - - Y el justo que ahora es celebrado, insista
    - para que concedas a tu pueblo avanzar por las delicias
    - de la luz, hasta que te diga himnos
    - en la luz plena.

iesu-corona-virginum:
  - - Jesús, corona de las vírgenes,
    - a quien concibió aquella Madre
    - que sola, virgen, dio a luz,
    - recibe, clemente, estos votos.
  - - Tú que te apacientas entre los lirios,
    - rodeado de coros de vírgenes,
    - esposo hermoso en la gloria,
    - que das a tus esposas los premios.
  - - Adondequiera que vas, las vírgenes
    - te siguen y con alabanzas
    - corren tras de ti cantando
    - y entonan dulces himnos.
  - - Te suplicamos que aumentes
    - generosamente en nuestras mentes
    - el no conocer en absoluto ninguna
    - herida de la corrupción.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

dulci-depromat-carmine:
  - - Con dulce canto
    - celebre el pueblo devoto esta solemnidad,
    - mientras en la cumbre de los cielos
    - brilla esta virgen en la gloria.
  - - La virgen que ya con valentía
    - se dedicó a las alabanzas de Cristo
    - ahora se une felizmente
    - a las filas de los santos.
  - - Venció por la pureza
    - el vicio de la carne débil;
    - despreció los halagos del mundo
    - siguiendo las huellas de Cristo.
  - - Por ella, Cristo, dirígenos,
    - guardándonos de todos los enemigos;
    - corrige las caídas de nuestras culpas,
    - impregnándonos de virtudes.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

gaudentes-festum-colimus:
  - - Gozosos celebramos la fiesta
    - de las santas vírgenes de Cristo,
    - que con corazón puro siguieron
    - al Señor entre alabanzas.
  - - Oh lirio de la castidad,
    - rey santísimo de las vírgenes,
    - tú, guardián de la pureza,
    - rechaza los engaños de los demonios.
  - - Tú que en las entrañas castas
    - te complaces, clementísimo,
    - lava nuestras culpas,
    - perdonando lo que hemos pecado.
  - - Suplicantes, te damos gracias;
    - 'erramos: dirige el camino;'
    - tú, padre de la indulgencia,
    - socórrenos, te pedimos.
  - - Jesús, a ti sea la gloria,
    - que naciste de la Virgen,
    - con el Padre y el Espíritu bondadoso,
    - por los siglos sempiternos.

aptata-virgo-lampade:
  - - Con la lámpara preparada, virgen,
    - entraste a las bodas
    - del rey eterno de la gloria,
    - a quien alaban las multitudes del cielo.
  - - Grata comensal de los del cielo,
    - te unes al esposo celestial
    - en el abrazo de una alianza casta,
    - rica en los méritos de la pureza.
  - - Instrúyenos en la norma de vida,
    - favorécenos con tu súplica,
    - para que podamos resistir
    - las astucias de nuestro enemigo.
  - - Modelo de vida de las vírgenes,
    - María ruegue a su Hijo
    - que su auxilio
    - nos ayude durante el destierro.
  - - Gloria sea a la Divinidad
    - por los siglos infinitos
    - por la victoria de la virgen,
    - con la que se alegra la corte del cielo.

iesu-redemptor-omnium-perpes-corona:
  - - Jesús, redentor de todos,
    - corona perpetua de los del cielo,
    - en este día, con más clemencia,
    - favorece nuestras voces,
  - - '[día] en que el bondadoso confesor'
    - de tu sagrado nombre brilló,
    - cuya solemnidad anual
    - celebra el pueblo devoto.
  - - Por las cosas del mundo
    - pasó con paso sereno,
    - fiel a ti continuamente,
    - siguiendo el camino de la salvación.
  - - Y, con razón, no aplicando el corazón
    - a los gozos caducos del mundo,
    - alegre con los ángeles del cielo
    - goza de los premios.
  - - Concédenos, benigno,
    - seguir sus huellas;
    - por su súplica, a tus siervos
    - perdónales la culpa del pecado.
  - - Sea, Cristo, rey piadosísimo,
    - a ti y al Padre la gloria
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

inclitos-christi-famulos-canamus:
  - - Cantemos a los ínclitos siervos de Cristo,
    - a quienes, ilustres por la fe y por obras resplandecientes,
    - en este día la tierra, unida al cielo,
    - adorna con alabanzas.
  - - Porque, mansos, humildes, pudorosos,
    - llevaron una vida que no conoció la culpa,
    - hasta que el alma voló de la tierra,
    - libre, a los astros.
  - - Por eso ya se alegran de asistir a los desdichados,
    - enjugan las lágrimas de los que lloran, curan
    - las heridas de las almas, devuelven la salud
    - a los miembros dañados.
  - - Resuene, pues, nuestra alabanza a estos
    - benignos siervos de Dios, y les dé gracias,
    - para que sigan ayudándonos con su piadoso auxilio
    - en las estrecheces.
  - - Sea a Dios solo el honor y el poder,
    - la alabanza en las alturas, el honor perenne,
    - que, moderándolo todo, gobierna el mundo
    - con sus leyes.

iesu-corona-celsior:
  - - Jesús, corona más excelsa
    - y verdad más sublime,
    - que al siervo que te confiesa
    - 'le das el premio perenne:'
  - - da a la asamblea que te suplica,
    - por el ruego de este santo del cielo,
    - la remisión de los pecados,
    - rompiendo el lazo de la cadena.
  - - No amando nada vano,
    - se ocupó de lo terreno de tal modo
    - que, ferviente con toda el alma,
    - te agradaba solo a ti.
  - - Confesándote aquí continuamente
    - a ti, Cristo, rey piadosísimo,
    - pisoteó con valentía al enemigo
    - soberbio y a su secuaz.
  - - Ilustre en la virtud y en la fe,
    - asiduo en la oración
    - y guardando sobrios sus miembros,
    - obtiene los manjares del cielo.
  - - A Dios Padre sea la gloria
    - y a ti, su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

beata-caeli-gaudia:
  - - Los gozos dichosos del cielo,
    - premio de la confesión [de la fe],
    - oh fieles seguidores de Cristo,
    - ya los poseéis en abundancia.
  - - Escuchad con oídos benignos
    - las alabanzas que os dirigimos
    - nosotros, desterrados de la patria,
    - con un canto sagrado.
  - - Impulsados por el amor de Cristo
    - llevasteis la cruz áspera,
    - obedientes, diligentes
    - y fervientes de caridad.
  - - Despreciasteis las artes de los demonios
    - y los engaños del mundo;
    - confesando a Cristo con las costumbres,
    - emigrasteis entre los astros.
  - - Ya que gozáis de la gloria,
    - asistid a los votos de todos
    - los que desean ardientemente
    - seguir vuestros ejemplos.
  - - Gloria a la Trinidad,
    - que, por su clemencia
    - y con vuestra intercesión,
    - nos lleve a lo celestial.

fortem-virili-pectore:
  - - A la mujer fuerte, de pecho varonil,
    - alabemos todos,
    - que por la gloria de la santidad
    - brilla ínclita en todas partes.
  - - Ella, herida por el santo amor,
    - mientras pisotea lo caduco
    - de este mundo, recorrió el arduo
    - camino hacia lo celestial.
  - - Dominando la carne con ayunos
    - y alimentando la mente con el dulce
    - alimento de la oración,
    - goza de los gozos del cielo.
  - - Rey Cristo, fuerza de los fuertes,
    - que solo haces grandes cosas,
    - por su ruego, te pedimos,
    - escucha benigno a los que te suplican.
  - - Jesús, a ti sea la gloria,
    - que nos concedes esperar la intercesión
    - de tu bienaventurada sierva
    - y los premios sempiternos.

christe-cunctorum-sator-et-redemptor:
  - - Cristo, creador y redentor de todas las cosas,
    - gobernante de los astros, de la tierra y del mar,
    - perdona la culpa de todos
    - los que te cantan alabanzas,
  - - tú que guardas gemas en un vaso frágil,
    - haciendo de mujeres débiles en fuerzas
    - almas pudorosas, y haciéndolas llevar
    - ilustres triunfos.
  - - A las que vemos tiernas en el sentir,
    - las coronas con el privilegio del mérito,
    - y las haces moradoras perennes
    - del reino celestial.
  - - Sea al Padre altísimo el honor y el poder,
    - la alabanza a ti, el Hijo, y un culto solemne,
    - al Espíritu Santo un poder igual,
    - ahora y por siempre.

haec-femina-laudabilis:
  - - Esta mujer digna de alabanza
    - y honrada por sus méritos,
    - así como sobresale por sus santas costumbres,
    - así triunfa con los ángeles.
  - - Con un corazón devotísimo,
    - orando a Dios con lágrimas,
    - se mantenía en vigilias
    - y ayunos asiduos.
  - - Despreciando la gloria del mundo
    - y con la mente siempre íntegra,
    - después de una justicia perfecta
    - emigró sobre los astros.
  - - La que con actos de santidad
    - enriqueció su casa
    - se alegra ahora con los premios perpetuos
    - de la morada celestial.
  - - Alabanza al Señor uno y trino,
    - que por sus súplicas,
    - acabado el término de la vida,
    - nos una a los ciudadanos del cielo.

hae-feminae-laudabiles:
  - - Estas mujeres dignas de alabanza
    - y honradas por sus méritos,
    - así como sobresalen por sus santas costumbres,
    - así triunfan con los ángeles.
  - - Con un corazón devotísimo,
    - orando al Señor entre lágrimas,
    - se mantenían en vigilias
    - y ayunos asiduos.
  - - Despreciando la gloria del mundo
    - y con la mente siempre íntegra,
    - después de una justicia perfecta
    - emigraron sobre los astros.
  - - Las que con actos de santidad
    - enriquecieron sus casas
    - se alegran ahora con los premios perpetuos
    - de la morada celestial.
  - - Alabanza al Señor uno y trino,
    - que por sus súplicas,
    - acabado el término de la vida,
    - nos una a los ciudadanos del cielo.

nobilem-christi-famulam-diserta:
  - - A la noble sierva de Cristo, con voz
    - elocuente cantemos, que imitó la gloria
    - de la mujer fuerte, a quien la página sagrada
    - prodigó alabanzas.
  - - En ella, la fe viva, la esperanza piadosa y el amor
    - ferviente a Dios, raíz fecunda
    - de buenas obras, de donde el amor a los hermanos
    - nace espontáneamente.
  - - Movido por sus méritos, perdona,
    - Jesús, a nosotros, culpables, todo pecado,
    - para que con pecho puro te cantemos
    - las alabanzas debidas.
  - - Sea al Padre altísimo el honor y el poder,
    - la alabanza a ti, el Hijo, y un culto solemne,
    - al Espíritu Santo un poder igual,
    - ahora y por siempre.

nobiles-christi-famulas-diserta:
  - - A las nobles siervas de Cristo, con voz
    - elocuente cantemos, que imitaron la gloria
    - de la mujer fuerte, a quien la página sagrada
    - prodigó alabanzas.
  - - No las atrapa el mundo con sus lazos
    - a ellas, que cumplen gustosas los mandatos del Padre,
    - para esforzarse por esparcir por todas partes
    - el buen olor de Cristo.
  - - Dominan el cuerpo, y alimentan la mente
    - con santas oraciones; desprecian las ganancias
    - perecederas, para buscar para sí los premios
    - de la vida que permanece.
  - - Sea a Dios solo el honor y el poder,
    - la alabanza en las alturas, el honor perenne,
    - que, moderándolo todo, gobierna el mundo
    - con sus leyes.

laeti-colentes-famulum:
  - - Alegres, venerando al siervo
    - que te sirvió perfectamente,
    - te ofrecemos con gratitud, Señor,
    - un himno de amor.
  - - Fiel seguidor de Cristo,
    - dejó por propia voluntad todos los gozos
    - que el mundo ofrece
    - y las riquezas fugaces.
  - - Se consagró a ti como súbdito,
    - obediente con humildad,
    - imitador, por la pureza de la carne,
    - de las vírgenes de Cristo, el esposo.
  - - Ansió agradarte
    - y se unió solo a ti,
    - alimentando su mente, sus palabras y sus obras
    - con los fuegos del amor.
  - - Entregado a ti en la tierra
    - con estos lazos de caridad,
    - salió libre hacia los astros
    - para triunfar para siempre.
  - - A nosotros, movidos por sus ejemplos,
    - concédenos avanzar con presteza,
    - para alabarte, con el Hijo y el Espíritu,
    - con himnos celestiales.

o-redemptoris-pietas-colenda:
  - - ¡Oh piedad del Redentor, digna de veneración,
    - que, deseando consagrar los hombres al Padre,
    - conduces los corazones con la admirable y variada
    - inspiración del Espíritu!
  - - A los que con tu agua haces nacer
    - del Dios verdadero, una fuerza nueva en ellos
    - da con frecuencia, como gracia, gérmenes
    - de caridad, Cristo.
  - - 'Tú llamas: corren ágiles los llamados,'
    - renuncian a todo, queriendo, contigo como guía,
    - por el camino real de la cruz, buscar
    - solo al Padre.
  - - Ferviente desde el cielo, este santo
    - se unió así a ti con amor, con todas sus fuerzas,
    - y deseó alcanzar las alegres
    - cumbres de las virtudes.
  - - Alabanza al Padre altísimo, a ti, Cristo príncipe,
    - y resuene igual al Espíritu Santo,
    - que al que da poco le devolvéis, con gran corazón,
    - bienes centuplicados.

# ---------------- Oficio de difuntos ----------------
qui-vivis-ante-saecula:
  - - Tú que vives antes de los siglos
    - y eres la única fuente de la vida,
    - a nosotros, oh Dios, sujetos a la muerte
    - y reos de culpa, míranos.
  - - Al hombre que pecó, Padre,
    - le impusiste como pena la muerte,
    - para que, polvo devuelto al polvo,
    - se sometiera a la expiación.
  - - Pero el soplo vital
    - que infundiste con providencia
    - permanece como germen
    - imperecedero de eternidad.
  - - 'Esta es la esperanza, este el consuelo:'
    - reverdeceremos, Señor,
    - y Cristo, el primero de los que resucitan,
    - nos llevará hacia ti.
  - - Concede gozar de este reino de la vida
    - a tu siervo difunto,
    - a quien la fe de Cristo impregnó,
    - a quien ungió el Espíritu bondadoso.
  - - Apresura este reino para nosotros,
    - cuando hayamos dejado la tierra,
    - para que cantemos que tú eres
    - el fin y el principio de todas las cosas.

spes-christe-nostrae-veniae:
  - - Cristo, esperanza de nuestro perdón,
    - tú, vida y resurrección;
    - a ti se dirigen los corazones y los ojos
    - cuando acecha el dolor de la muerte.
  - - Tú también, habiendo padecido el hastío
    - de la muerte y sus crueles aguijones,
    - inclinando la cabeza, al Padre
    - entregaste manso el espíritu.
  - - Tomando verdaderamente sobre ti
    - nuestras dolencias, pastor compasivo,
    - nos concediste padecer contigo
    - y morir contigo en el seno del Padre.
  - - Colgado con los brazos abiertos,
    - atraes a tu corazón traspasado
    - a los que, a punto de morir, agobia
    - la enfermedad o la angustiosa tristeza.
  - - Tú que, rotas las puertas del infierno,
    - abriste vencedor las del cielo,
    - levántanos ahora en el dolor,
    - vivifícanos después de la muerte.
  - - Y también el hermano que en el cuerpo
    - duerme ahora en el descanso de la paz,
    - que, dichoso por ti, despierte ya
    - y te tribute alabanzas.

immensae-rex-potentiae:
  - - Rey de poder inmenso,
    - Cristo, tú, procurando la gloria del Padre
    - y nuestro honor,
    - quebraste los dardos de la muerte.
  - - Tomando sobre ti nuestras debilidades
    - y entrando en un gran combate,
    - la muerte con la que la serpiente había vencido
    - la pisoteaste, vencedor, al morir.
  - - Resucitando fuerte del sepulcro,
    - por el misterio pascual
    - a nosotros, muertos de nuevo por el pecado,
    - nos renuevas siempre para la vida.
  - - Concede la vida de la gracia,
    - para que, cuando vuelvas como esposo,
    - nos encuentres ya preparados para el cielo,
    - con la lámpara adornada.
  - - En la luz y en el descanso
    - recíbenos, juez sereno,
    - a los que la fe y la caridad
    - unieron a la Santa Trinidad.
  - - Y llama a tu siervo,
    - que ahora, despojado del cuerpo,
    - anhela el reino del Padre,
    - para que te alabe para siempre.

qui-lacrimatus-lazarum:
  - - Tú que lloraste a Lázaro
    - y gemiste con sus hermanas,
    - e hiciste, poderoso,
    - que él les fuera devuelto por sus ruegos;
  - - tú que pediste, benigno,
    - el perdón para los culpables,
    - y dijiste palabras de misericordia
    - al compañero de suplicio;
  - - tú que, al morir, al discípulo
    - le diste por madre a la Virgen,
    - para que asistiera a tus fieles
    - 'en su última agonía:'
  - - concédenos, Cristo Señor,
    - a los redimidos con tu sangre,
    - que la tristeza de la dura muerte
    - se convierta en gozo de la vida.
  - - Y llama a tu siervo,
    - partido de este mundo,
    - para que, donde ya no habrá muerte,
    - te cante como príncipe de la vida.

# ---------------- Tiempo Ordinario: semanas I y III ----------------
deus-creator-omnium:
  - - Dios, creador de todas las cosas
    - y gobernante del cielo, que revistes
    - el día de hermosa luz
    - y la noche con la gracia del sueño,
  - - para que el descanso devuelva los miembros
    - relajados al uso del trabajo,
    - alivie las mentes cansadas
    - 'y disipe las penas angustiosas:'
  - - acabado ya el día,
    - y al nacer la noche, [te damos] gracias y súplicas;
    - obligados por un voto, para que nos ayudes,
    - lo cumplimos cantando un himno.
  - - Que te canten lo íntimo del corazón,
    - que te celebre la voz sonora,
    - que te ame el amor casto,
    - que te adore la mente sobria,
  - - para que, cuando la oscuridad profunda
    - de las noches haya encerrado el día,
    - la fe no conozca tinieblas
    - y la noche resplandezca por la fe.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

dies-aetasque-ceteris:
  - - Día y edad, más santo que los demás,
    - resplandece el octavo,
    - que tú, Jesús, consagras en ti,
    - primicia de los que resucitan.
  - - Tú resucita ahora para ti, primero,
    - nuestras almas;
    - que los cuerpos se levanten para ti
    - libres de la segunda muerte.
  - - Y que pronto, en las nubes,
    - seamos llevados a tu encuentro, Cristo,
    - 'para vivir contigo por siempre:'
    - tú, la vida, la resurrección.
  - - Viendo tu rostro,
    - seamos configurados a tu gloria;
    - que te conozcamos tal como eres,
    - luz verdadera y dulzura.
  - - Entregados al Padre en el Reino,
    - llenos de la séptuple unción,
    - en ti mismo nos alegras;
    - que lo consume la Santa Trinidad.

primo-dierum-omnium:
  - - En el primero de todos los días,
    - en que el mundo fue creado
    - o en que el Creador, resucitando,
    - vencida la muerte, nos libra,
  - - echada lejos la pereza,
    - levantémonos todos cuanto antes,
    - y busquemos de noche al Piadoso,
    - como sabemos que lo hizo el Profeta,
  - - para que escuche nuestras súplicas,
    - nos tienda su diestra
    - y, purificados aquí de las manchas,
    - nos devuelva a las moradas del cielo,
  - - para que a cuantos en el tiempo
    - santísimo de este día
    - salmodiamos en las horas de reposo
    - nos recompense con dones dichosos.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

aeterne-rerum-conditor:
  - - Eterno creador de las cosas,
    - que gobiernas la noche y el día
    - y das a los tiempos sus tiempos
    - para aliviar el hastío,
  - - ya suena el heraldo del día,
    - centinela de la noche profunda,
    - luz nocturna para los caminantes,
    - que separa una noche de la otra.
  - - Despertado por él, el lucero
    - libra al cielo de la oscuridad;
    - por él, todo el coro de los vagabundos
    - abandona los caminos de hacer daño.
  - - Por él, el navegante recobra las fuerzas
    - y se calman las olas del mar;
    - por él, la misma Piedra de la Iglesia,
    - al cantar [el gallo], lavó su culpa.
  - - Jesús, mira a los que vacilan
    - y corrígenos con tu mirada;
    - si nos miras, caen las faltas
    - y la culpa se disuelve en llanto.
  - - Tú, luz, brilla en los sentidos
    - y sacude el sueño de la mente;
    - que nuestra voz te cante primero a ti
    - y te cumplamos nuestros votos.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

lucis-creator-optime:
  - - Óptimo creador de la luz,
    - que haces brotar la luz de los días
    - y, con los comienzos de la luz nueva,
    - preparas el origen del mundo;
  - - tú que mandas llamar día
    - 'a la mañana unida a la tarde:'
    - cae el horrible caos;
    - escucha las súplicas con llantos.
  - - Que la mente, agobiada por el pecado,
    - no quede desterrada del don de la vida,
    - mientras no piensa nada perenne
    - y se enreda en las culpas.
  - - Que llame a lo más íntimo del cielo,
    - que alcance el premio de la vida;
    - evitemos todo lo dañino,
    - purifiquemos todo lo malo.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

somno-refectis-artubus:
  - - Repuestos los miembros por el sueño,
    - 'dejado el lecho, nos levantamos:'
    - te pedimos, Padre, que estés presente
    - con nosotros, que cantamos.
  - - Que la lengua te cante primero a ti,
    - que el ardor de la mente te busque,
    - para que de los actos que siguen
    - tú, santo, seas el comienzo.
  - - Cedan las tinieblas a la luz
    - y la noche al astro del día,
    - para que la culpa que trajo la noche
    - se desvanezca con el don de la luz.
  - - Te pedimos también, suplicantes,
    - que cortes todas las faltas,
    - y por boca de los que te cantan
    - seas alabado para siempre.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

aeterna-lux-divinitas:
  - - Luz eterna, divinidad,
    - Trinidad en la unidad,
    - te confesamos, débiles,
    - te suplicamos, suplicantes.
  - - Creemos en el sumo Padre
    - y en el Hijo único del Padre,
    - y en el Espíritu, vínculo de caridad
    - que los une.
  - - Oh verdad, oh caridad,
    - oh fin y felicidad,
    - haznos esperar y creer,
    - haznos amar y alcanzar.
  - - Tú que eres el fin y el principio
    - y la fuente de todas las cosas,
    - tú solo eres el consuelo,
    - tú, la esperanza cierta de los creyentes.
  - - Tú que solo lo haces todo
    - y solo bastas a todos,
    - tú solo eres la luz para todos
    - y el premio de los que esperan.
  - - Rogamos a Cristo y al Padre,
    - 'y al Espíritu de Cristo y del Padre:'
    - poderosa en todo, uno,
    - ampara a los que te suplican, Trinidad.

splendor-paternae-gloriae:
  - - Resplandor de la gloria del Padre,
    - que de la luz haces brotar la luz,
    - luz de la luz y fuente de la luz,
    - 'día que iluminas el día:'
  - - y tú, sol verdadero, desciende,
    - brillando con resplandor perpetuo,
    - y derrama en nuestros sentidos
    - el fulgor del Espíritu Santo.
  - - Invoquemos también con votos al Padre,
    - Padre de la gloria perenne,
    - Padre de la gracia poderosa,
    - que aleje la culpa resbaladiza.
  - - Que inspire los actos esforzados,
    - que embote el diente del envidioso,
    - que haga favorables los trances difíciles,
    - que dé la gracia de obrar.
  - - Que guíe y gobierne la mente
    - en un cuerpo casto y fiel;
    - que la fe hierva con calor
    - y no conozca el veneno del engaño.
  - - Que Cristo sea nuestro alimento,
    - y la fe, nuestra bebida;
    - bebamos alegres la sobria
    - embriaguez del Espíritu.
  - - Que este día pase alegre;
    - que el pudor sea como el alba,
    - la fe como el mediodía,
    - que la mente no conozca el ocaso.
  - - La aurora avanza en su curso;
    - 'que aparezca toda la Aurora:'
    - todo el Hijo en el Padre
    - y todo el Padre en el Verbo.

immense-caeli-conditor:
  - - Inmenso creador del cielo,
    - que, para que no confundieran lo mezclado,
    - dividiendo las corrientes del agua,
    - diste el firmamento como límite,
  - - asentando un lugar a las aguas de arriba
    - y a la vez a los arroyos de la tierra,
    - para que el agua templara las llamas
    - 'y no disipara el suelo de la tierra:'
  - - infunde ahora, piadosísimo,
    - el don de la gracia perenne,
    - para que, con las caídas de un nuevo engaño,
    - no nos destruya el antiguo error.
  - - Que la fe encuentre la luz
    - y así lleve el fulgor de la luz;
    - que ella aterre todo lo vano,
    - que nada falso la oprima.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

consors-paterni-luminis:
  - - Partícipe de la luz del Padre,
    - tú mismo luz de la luz y día,
    - 'rompemos la noche cantando:'
    - asiste a los que te piden.
  - - Quita las tinieblas de las mentes,
    - pon en fuga las turbas de los demonios,
    - expulsa la somnolencia,
    - para que no abrume a los perezosos.
  - - Así, Cristo, a todos nosotros,
    - creyentes, concédenos
    - que aproveche a los que suplicamos
    - lo que salmodiamos cantando.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

o-sacrosancta-trinitas:
  - - Oh sacrosanta Trinidad,
    - que, creándolo todo, lo ordenas,
    - y, asignando el día al trabajo,
    - 'dedicas la noche al descanso:'
  - - a ti, en la mañana y también en la tarde,
    - a ti, de noche y de día, te cantamos;
    - tú, en tu gloria,
    - guárdanos en todo tiempo.
  - - Aquí estamos ante ti, postrados,
    - he aquí tus siervos, que te adoran;
    - une los votos y las súplicas de los que te imploran
    - a los himnos de los del cielo.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

pergrata-mundo-nuntiat:
  - - La aurora anuncia al mundo, gratísimos,
    - los rayos del sol,
    - y, vistiendo las cosas de color,
    - hace ya brillar todo.
  - - Tú, que por siempre brillas como sol,
    - oh Cristo, vivo para nosotros,
    - nos volvemos a ti cantando,
    - deseosos de gozarte.
  - - Tú eres la sabiduría del Padre
    - y la Palabra por la que todas las cosas
    - resplandecen en orden admirable
    - y atraen nuestras mentes.
  - - Haz que, como hijos de la luz,
    - caminemos así, sin pereza,
    - para que nuestras costumbres y actos
    - expresen siempre la gracia del Padre.
  - - Concede que de nuestra boca
    - salgan siempre palabras sinceras,
    - y que seamos animados
    - por los dulces gozos de la verdad.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

telluris-ingens-conditor:
  - - Gran creador de la tierra,
    - que, sacando el suelo del mundo
    - y echando las molestias del agua,
    - diste a la tierra estabilidad,
  - - para que, produciendo los brotes adecuados,
    - adornada de flores doradas,
    - fuera fecunda en frutos
    - 'y diera un grato alimento:'
  - - lava con el verdor de la gracia
    - las heridas de la mente abrasada,
    - para que borre con el llanto sus hechos
    - y aplaste los movimientos malos,
  - - obedezca a tus mandatos,
    - no se acerque a ningún mal,
    - se alegre de llenarse de bienes
    - y no conozca la obra de la muerte.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

rerum-creator-optime:
  - - Óptimo creador de las cosas
    - y guía nuestro, mira;
    - líbranos, sumergidos en el sueño,
    - del reposo dañino.
  - - 'A ti, Cristo santo, te pedimos:'
    - perdona tú los pecados;
    - nos levantamos para confesarte
    - y rompemos la demora de la noche.
  - - Elevamos las mentes y las manos,
    - como el Profeta nos manda
    - hacer de noche
    - y Pablo lo enseñó con sus hechos.
  - - Ves el mal que hemos hecho;
    - descubrimos lo que tenemos oculto,
    - derramamos súplicas gimiendo;
    - perdona lo que hemos pecado.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

scientiarum-domino:
  - - A ti, Señor de las ciencias,
    - sea el júbilo,
    - que ves lo íntimo de nosotros
    - y lo abrigas con tu gracia.
  - - Tú que, buen pastor, mientras guardas
    - el bien, buscas lo perdido,
    - en pastos abundantísimos
    - únenos a los rebaños piadosos,
  - - para que el terror de la ira del juez
    - no nos una a los cabritos réprobos,
    - sino que, siendo tú el juez,
    - seamos ovejas del pasto eterno.
  - - A ti, Redentor, la gloria,
    - el honor, el poder, la victoria,
    - que reinas sobre todas las cosas
    - por los siglos de los siglos.

nox-et-tenebrae-et-nubila:
  - - Noche, tinieblas y nubarrones,
    - 'confusión y turbulencia del mundo:'
    - entra la luz, blanquea el cielo,
    - Cristo viene; marchaos.
  - - La oscuridad de la tierra se rasga,
    - herida por el rayo del sol,
    - y a las cosas vuelve ya el color
    - con el rostro del astro que brilla.
  - - Así nuestra oscuridad
    - y el pecho consciente de su engaño,
    - rotas las nubes, al descubierto,
    - palidecerán cuando Dios reine.
  - - Solo a ti, Cristo, conocemos;
    - aprendemos a rogarte con mente pura
    - y sencilla, de rodillas,
    - llorando y cantando.
  - - Atiende a nuestros sentidos
    - 'y examina toda nuestra vida:'
    - hay muchas cosas manchadas de afeites
    - que han de ser purificadas por tu luz.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

caeli-deus-sanctissime:
  - - Santísimo Dios del cielo,
    - que pintas el centro luminoso del cielo
    - con un resplandor de fuego,
    - aumentándolo con hermosa luz;
  - - que al cuarto día, estableciendo
    - la rueda llameante del sol,
    - procuras al orden de la luna
    - y a los cursos errantes de los astros,
  - - para dar a las noches y a la luz
    - un término que las separe
    - y una señal conocidísima
    - 'al comienzo de los meses:'
  - - ilumina el corazón de los hombres,
    - limpia las manchas de las mentes,
    - desata el lazo de la culpa,
    - derriba el peso de los pecados.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

nox-atra-rerum-contegit:
  - - La noche negra cubre
    - 'los colores de todas las cosas de la tierra:'
    - nosotros, confesándonos, te pedimos
    - a ti, justo juez de los corazones,
  - - que quites los pecados
    - y laves las manchas de la mente,
    - y nos des, Cristo, la gracia
    - para que se alejen las culpas.
  - - He aquí que la mente impía está entumecida,
    - mordida por la culpa dañina;
    - desea quitar lo oscuro
    - y buscarte a ti, Redentor.
  - - Rechaza tú la oscuridad,
    - sobre todo la de dentro,
    - para que se alegre de verse
    - colocada en la luz dichosa.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

christe-precamur-adnuas:
  - - Cristo, te rogamos que concedas
    - a tus siervos que te ruegan
    - que esta iniquidad del mundo
    - no haga cautiva nuestra fe.
  - - Que no pensemos con impiedad,
    - que no envidiemos a nadie,
    - que, ofendidos, no devolvamos el mal,
    - que venzamos el mal con el bien.
  - - Lejos de nuestros corazones
    - la ira, el engaño, la soberbia;
    - aléjese la avaricia,
    - raíz de todos los males.
  - - Que una caridad no fingida
    - guarde los lazos de la paz;
    - que la castidad quede intacta
    - con una fe perpetua.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

sol-ecce-surgit-igneus:
  - - 'He aquí que surge el sol de fuego:'
    - '[nos] pesa, [nos] avergüenza, [nos] arrepentimos,'
    - y nadie, con la luz como testigo,
    - puede pecar con firmeza.
  - - Que al fin se aleje la ceguera,
    - que, tras habernos caído de cabeza
    - con pasos siniestros, por largo tiempo
    - nos arrastró por un error extraviado.
  - - Que esta luz nos dé serenidad
    - y nos haga puros para ella;
    - que no digamos nada engañoso,
    - que no tramemos nada oscuro.
  - - 'Que así transcurra todo el día:'
    - que ni la lengua mentirosa, ni las manos,
    - ni los ojos lascivos pequen,
    - que ninguna falta manche el cuerpo.
  - - Un vigía está en lo alto,
    - que todos los días
    - mira nuestros actos
    - desde la primera luz hasta la tarde.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

magnae-deus-potentiae:
  - - Dios de gran poder,
    - que a la especie nacida de las aguas
    - en parte la devuelves al abismo,
    - en parte la elevas a los aires,
  - - hundiendo a unos en las aguas,
    - destinando a otros, levantados, al cielo,
    - para que, salidos de una misma estirpe,
    - 'llenen lugares diversos:'
  - - concede a todos tus siervecillos,
    - a los que lava la ola de la sangre,
    - no conocer las caídas del pecado
    - ni sufrir el hastío de la muerte,
  - - para que la culpa no hunda a ninguno,
    - que la jactancia no levante a ninguno,
    - que la mente abatida no se derrumbe,
    - que la mente engreída no se precipite.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

tu-trinitatis-unitas:
  - - Tú, Unidad de la Trinidad,
    - que gobiernas el orbe con poder,
    - atiende los cantos de alabanza
    - que salmodiamos en vela.
  - - Pues nos levantamos del lecho
    - en el tiempo tranquilo de la noche,
    - para pedirte con insistencia
    - el remedio de todas las heridas,
  - - para que lo que, por engaño de los demonios,
    - hayamos faltado en las noches,
    - lo borre desde el cielo
    - el poder de tu gloria.
  - - 'Te pedimos con corazón fiel:'
    - llénanos de tu luz,
    - por la que, en el curso de los días,
    - no caigamos en ningún acto [malo].
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

adesto-christe-cordibus:
  - - Asiste, Cristo, a los corazones,
    - excelsa caridad de los redimidos;
    - infunde en nuestras voces,
    - te rogamos, lágrimas fervientes.
  - - A ti, piadosísimo Jesús,
    - derramamos con fe las súplicas;
    - perdona, Cristo, te pedimos,
    - el mal que hemos hecho en obras.
  - - Con la señal de la santa cruz,
    - por tu cuerpo consagrado,
    - defiéndenos como a hijos,
    - a todos, te rogamos, por todas partes.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

aeterna-caeli-gloria:
  - - Gloria eterna del cielo,
    - esperanza dichosa de los mortales,
    - Único del Padre excelso
    - 'e hijo de la Virgen casta:'
  - - da la diestra a los que se levantan,
    - y que se alce también la mente sobria
    - y, ardiendo en la alabanza de Dios,
    - devuelva las gracias debidas.
  - - Resplandece el lucero naciente
    - y anuncia la luz misma,
    - 'cae la oscuridad de las noches:'
    - que la luz santa nos ilumine
  - - y, permaneciendo en nuestros sentidos,
    - rechace la noche del mundo
    - y hasta el fin del tiempo
    - guarde puros los corazones.
  - - Que la fe, buscada ya primero,
    - eche raíces en lo hondo de los sentidos,
    - que la esperanza, segunda, se alegre con ella;
    - entonces sobresale la caridad, mayor.
  - - Gloria a ti, Cristo, rey piadosísimo,
    - y al Padre,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

plasmator-hominis-deus:
  - - Dios, formador del hombre,
    - que, ordenándolo todo tú solo,
    - mandas a la tierra producir
    - la especie del reptil y de la fiera;
  - - que, sometiéndolos, diste al hombre,
    - para que le sirvan en orden,
    - los grandes cuerpos de las cosas,
    - 'vivificados por la palabra del que manda:'
  - - aleja de tus siervos
    - todo lo que por la impureza
    - o se insinúa en las costumbres
    - o se introduce en los actos.
  - - Da los premios de los gozos,
    - da los dones de las gracias;
    - deshaz los lazos de la discordia,
    - estrecha los lazos de la paz.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

summae-deus-clementiae:
  - - Dios de suma clemencia
    - y artífice de la máquina del mundo,
    - que, trino en la divinidad bondadosa
    - y uno, lo sostienes todo,
  - - recibe benigno nuestras lágrimas
    - con cánticos piadosos,
    - para que, con el corazón limpio de manchas,
    - te gocemos más abundantemente.
  - - Abrasa nuestros lomos
    - con los fuegos convenientes de la caridad,
    - para que estén siempre ceñidos
    - y dispuestos para tu venida,
  - - para que todos los que las horas de la noche
    - rompemos ahora cantando
    - seamos enriquecidos abundantemente
    - con los dones de la patria dichosa.
  - - Concédelo, Padre piadosísimo,
    - y tú, Único igual al Padre,
    - con el Espíritu Paráclito,
    - que reinas por todos los siglos.

auctor-perennis-gloriae:
  - - Autor de la gloria perenne,
    - que das a los creyentes el Espíritu
    - de la gracia séptuple,
    - asiste manso a todos.
  - - Expulsa las enfermedades de los cuerpos,
    - rechaza el escándalo de la mente,
    - corta las fuerzas de los pecados,
    - ahuyenta los dolores de los corazones.
  - - Haz serenas las mentes,
    - lleva a término la obra honesta,
    - recibe las súplicas de los que oran,
    - concede la vida perenne.
  - - Con el curso de siete días
    - se mide ahora todo el tiempo;
    - aquel octavo, el último,
    - será el día del juicio,
  - - en el que, Redentor, te pedimos,
    - no nos reprendas en tu ira,
    - sino líbranos de la izquierda,
    - colócanos a la derecha,
  - - para que, cuando hayas recibido, clemente,
    - las súplicas de tus pueblos,
    - demos todos gloria
    - al Dios trino por los siglos.

aurora-iam-spargit-polum:
  - - La aurora esparce ya [luz por] el cielo,
    - el día se desliza sobre las tierras,
    - 'rebota el rayo de la luz:'
    - que se aleje todo lo resbaladizo.
  - - Caigan ya las vanidades de la noche,
    - que se hunda la culpa de la mente,
    - que caiga todo lo horrible de culpa
    - que la noche trajo con sus tinieblas,
  - - para que aquella mañana última,
    - que esperamos postrados,
    - brote para nosotros en luz,
    - mientras resuena este canto.
  - - A Dios Padre sea la gloria
    - y a su único Hijo,
    - con el Espíritu Paráclito,
    - por los siglos sempiternos.

variantes:
  vir-celse-forma-fulgida:
    presbitero:
      3: ['Habiendo alcanzado la altura', 'de esta cumbre real,', 'fuiste con la palabra y las costumbres', 'doctor, sacerdote, víctima.']
    papa:
      3: ['Tú regías el redil de Pedro', 'con las llaves recibidas del cielo,', 'y al rebaño, con la palabra de la gracia', 'y con acciones puras, lo cuidabas.']
  christe-pastorum-caput-atque-princeps:
    obispo:
      1: ['Al valiente luchador, tu Espíritu', 'lo ungió por dentro con el don pleno del crisma', 'celestial, y lo puso para apacentar', 'al pueblo santo.']
    papa:
      1: ['Las ovejas que habías dado a Pedro, para que', 'todo el mundo llegara a ser un redil sagrado,', 'este, puesto por tu voluntad en la cumbre', 'suprema, las gobernó.']
  inclitus-rector-pater-atque-prudens:
    presbitero:
      1: ['Él fue guía ilustre y maestro,', 'mostrando las enseñanzas de una vida santa', 'y esforzándose siempre por agradar a Dios', 'con corazón puro.']
    papa:
      1: ['Sentado en la cátedra suprema de Pedro,', 'pastor y maestro de un rebaño inmenso,', 'con poder abre, por las llaves del Señor,', 'los reinos del cielo.']
  sanctorum-meritis-inclita-gaudia:
    mujeres:
      1: ['Estas son las que el mundo, reteniéndolas, aborreció,', 'pues lo despreciaron del todo, árido con su flor', 'estéril, y te siguieron a ti,', 'Cristo, buen rey de los del cielo.']
      2: ['Estas soportan por ti furias y crueldades;', 'no resuena un murmullo, ni una queja,', 'sino que, con corazón callado, el alma bien consciente', 'conserva la paciencia.']
  deus-tuorum-militum:
    mujer:
      1: ['Esta testigo proclamó con la boca', 'lo que creyó en el arca del corazón;', 'siguiendo a Cristo, lo encontró', 'con el derramamiento de su sangre.']
      2: ['Esta, en efecto, considerando con razón', 'caducos los gozos del mundo', 'y sus halagos dañinos,', 'llegó a lo celestial.']
  beate-martyr-prospera:
    mujer:
      0: ['Bienaventurada mártir, haz próspero', 'tu día triunfal,', 'en el que, como recompensa de tu sangre,', 'se te da la corona al vencer.']
  martyr-dei-qui-unicum:
    mujer:
      0: ['Mártir de Dios, que, siguiendo', 'al Hijo único del Padre,', 'triunfas sobre los enemigos vencidos,', 'vencedora que gozas de lo celestial:']
  laeti-colentes-famulum:
    mujer:
      0: ['Alegres, venerando a la sierva', 'que te sirvió perfectamente,', 'te ofrecemos con gratitud, Señor,', 'un himno de amor.']
      2: ['Se consagró a ti como súbdita,', 'obediente con humildad,', 'imitadora, por la pureza de la carne,', 'de las vírgenes de Cristo, el esposo.']
      4: ['Entregada a ti en la tierra', 'con estos lazos de caridad,', 'salió libre hacia los astros', 'para triunfar para siempre.']
  qui-vivis-ante-saecula:
    una:
      4: ['Concede gozar de este reino de la vida', 'a tu sierva difunta,', 'a quien la fe de Cristo impregnó,', 'a quien ungió el Espíritu bondadoso.']
    varios:
      4: ['Concede gozar de este reino de la vida', 'a los hermanos muertos en ti,', 'a quienes la fe de Cristo impregnó,', 'a quienes ungió el Espíritu bondadoso.']
  spes-christe-nostrae-veniae:
    una:
      5: ['Y también la hermana que en el cuerpo', 'duerme ahora en el descanso de la paz,', 'que, dichosa por ti, despierte ya', 'y te tribute alabanzas.']
    varios:
      5: ['Y también los hermanos que en el cuerpo', 'duermen ahora el sueño de la paz,', 'que, dichosos por ti, despierten ya', 'y te tributen alabanzas.']
  immensae-rex-potentiae:
    una:
      5: ['Y llama a tu sierva,', 'que ahora, despojada del cuerpo,', 'anhela el reino del Padre,', 'para que te alabe para siempre.']
    varios:
      5: ['Y llama a todos los hermanos,', 'que ahora, despojados del cuerpo,', 'anhelan el reino del Padre,', 'para que te alaben para siempre.']
  qui-lacrimatus-lazarum:
    una:
      4: ['Y llama a tu sierva,', 'partida de este mundo,', 'para que, donde ya no habrá muerte,', 'te cante como príncipe de la vida.']
    varios:
