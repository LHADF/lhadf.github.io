      corpus:
      - Linguam refrénans témperet,
    - tipo: variante del libro
      libro:
      - nunc et per omne saeculum.
      corpus:
      - in sempitérna sǽcula.
      va:
      - nunc et per omne sǽculum.
  deus-qui-claro-lumine:
    incipit: Deus, qui claro lúmine
    estrofas:
    - - Deus, qui claro lúmine
      - diem fecísti, Dómine,
      - tuam rogámus glóriam
      - dum pronus dies vólvitur.
    - - Iam sol urgénte véspero
      - occásum suum gráditur,
      - mundum conclúdens ténebris,
      - suum obsérvans órdinem.
    - - Tu vero, excélse Dómine,
      - precántes tuos fámulos
      - diúrno lassos ópere
      - ne sinas umbris ópprimi,
    - - Ut non fuscátis méntibus
      - dies abscédat sǽculi,
      - sed tua tecti grátia
      - cernámus lucem prósperam.
    - - Præsta, Pater piíssime,
      - Patríque compar Únice,
      - cum Spíritu Paráclito
      - regnans per omne sǽculum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Deus qui claro.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 4, p. 6248
    diferencias: []
  galli-cantu-mediante:
    incipit: Galli cantu mediánte
    estrofas:
    - - Galli cantu mediánte
      - noctis iam calíginem
      - et profúndæ noctis atram
      - levánte formídinem,
      - Deus alme, te rogámus
      - supplicésque póscimus.
    - - Vigil, potens, lux venísti
      - atque custos hóminum,
      - dum tenérent simul cuncta
      - médium siléntium,
      - rédderent necnon mortálem
      - mórtui effígiem,
    - - Excitáres quo nos, Christe,
      - de somno malítiæ,
      - atque gratis liberáres
      - noctúrno de cárcere,
      - redderésque nobis lucem
      - vitæ semper cómitem.
    - - Honor Patri sit ac tibi,
      - Sancto sit Spirítui,
      - Deo trino sed et uni,
      - paci, vitæ, lúmini,
      - nómini præ cunctis dulci
      - divinóque númini.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Galli cantu mediante.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 4, p. 6248
    diferencias: []
  adesto-rerum-conditor:
    incipit: Adésto, rerum cónditor,
    estrofas:
    - - Adésto, rerum cónditor,
      - patérnæ lucis glória,
      - cuius amóta grátia
      - nostra pavéscunt péctora,
    - - Tuóque plena Spíritu,
      - secum Deum gestántia,
      - nil rapiéntis pérfidi
      - diris patéscant fráudibus,
    - - Ut inter actus sǽculi,
      - vitæ quos usus éxigit,
      - omni caréntes crímine
      - tuis vivámus légibus.
    - - Sit, Christe, rex piíssime,
      - tibi Patríque glória
      - cum Spíritu Paráclito,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Adesto rerum conditor.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 4, p. 6249
