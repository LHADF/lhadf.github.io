      - qui pro nobis natus
      - tulit esse tuus.
    - - Virgo singuláris,
      - inter omnes mitis,
      - nos culpis solútos
      - mites fac et castos.
    - - Vitam præsta puram,
      - iter para tutum,
      - ut vidéntes Iesum
      - semper collætémur.
    - - Sit laus Deo Patri,
      - summo Christo decus,
      - Spirítui Sancto
      - honor, tribus unus.
