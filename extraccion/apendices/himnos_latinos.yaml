  ad-cenam-agni-providi:
    incipit: Ad cenam Agni próvidi,
    estrofas:
    - - Ad cenam Agni próvidi,
      - stolis salútis cándidi,
      - post tránsitum maris Rubri
      - Christo canámus príncipi.
    - - Cuius corpus sanctíssimum
      - in ara crucis tórridum,
      - sed et cruórem róseum
      - gustándo, Deo vívimus.
    - - Protécti paschæ véspero
      - a devastánte ángelo,
      - de Pharaónis áspero
      - sumus erépti império.
    - - Iam pascha nostrum Christus est,
      - agnus occísus ínnocens;
      - sinceritátis ázyma
      - qui carnem suam óbtulit.
    - - O vera, digna hóstia,
      - per quam frangúntur tártara,
      - captíva plebs redímitur,
      - reddúntur vitæ prǽmia!
    - - Consúrgit Christus túmulo,
      - victor redit de bárathro,
      - tyránnum trudens vínculo
      - et paradísum réserans.
    - - Esto perénne méntibus
      - paschále, Iesu, gáudium
      - et nos renátos grátiæ
      - tuis triúmphis ággrega.
    - - Iesu, tibi sit glória,
      - qui morte victa prǽnites,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Ad cenam Agni.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 2, p. 2720
