      - Ecclésias impénsius
      - da caritáte exércitas
      - pastóri Petro súbditas.
    - - Vir Christo dilectíssime,
      - amóre fac nos cúrrere,
      - ut læti adépti pátriam
      - Deo canámus glóriam.
