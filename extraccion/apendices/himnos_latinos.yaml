  inclitus-rector-pater-atque-prudens:
    incipit: Inclitus rector pater atque prudens,
    estrofas:
    - - Ínclitus rector pater atque prudens,
      - cuius insígnem cólimus triúmphum,
      - iste conféssor sine fine lætus
