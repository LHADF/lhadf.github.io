    incipit: Dicámus laudes Dómino
    estrofas:
    - - Dicámus laudes Dómino
      - fervénte prompti spíritu;
      - hora volúta séxies
      - nos ad orándum próvocat.
    - - In hac enim fidélibus
      - veræ salútis glória,
      - beáti Agni hóstia,
      - crucis virtúte rédditur.
    - - Cuius luce claríssima
      - tenébricat merídies;
      - sumámus toto péctore
