  pange-lingua-gloriosi-proelium:
    incipit: Pange, lingua, gloriósi
    estrofas:
    - - Pange, lingua, gloriósi
      - prœ́lium certáminis,
      - et super crucis tropǽo
      - dic triúmphum nóbilem,
      - quáliter redémptor orbis
      - immolátus vícerit.
    - - De paréntis protoplásti
      - fraude factor cóndolens,
      - quando pomi noxiális
      - morte morsu córruit,
      - ipse lignum tunc notávit,
      - damna ligni ut sólveret.
    - - Hoc opus nostræ salútis
      - ordo depopóscerat,
      - multifórmis perditóris
      - arte ut artem fálleret,
      - et medélam ferret inde,
      - hostis unde lǽserat.
    - - Quando venit ergo sacri
      - plenitúdo témporis,
      - missus est ab arce Patris
      - Natus, orbis cónditor,
      - atque ventre virgináli
      - carne factus pródiit.
    - - Lustra sex qui iam perácta
      - tempus implens córporis,
      - se volénte, natus ad hoc,
      - passióni déditus,
      - agnus in crucis levátur
      - immolándus stípite.
    - - Æqua Patri Filióque,
      - ínclito Paráclito,
      - sempitérna sit Beátæ
      - Trinitáti glória,
      - cuius alma nos redémit
      - atque servat grátia.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Pange lingua gloriosi proelium.txt
