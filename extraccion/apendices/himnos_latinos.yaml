    - - Cunctis præstant aulis
      - hæc egéna sæpta,
      - salus unde cœpit
      - géneris humáni.
    - - Iesu, Mater, Ioseph,
      - mansiónis vestræ
      - nostras date sedes
      - donis frui sanctis.
    - - Tibi laudes, Christe,
      - spem qui nobis præbes,
