      - ut culpa quærat grátiam,
  laetare-caelum-desuper:
    incipit: Lætáre, cælum, désuper,
    estrofas:
    - - Lætáre, cælum, désuper,
      - 'appláude, tellus ac mare:'
      - Christus resúrgens post crucem
      - vitam dedit mortálibus.
    - - Iam tempus accéptum redit,
