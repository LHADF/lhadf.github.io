  immensae-rex-potentiae:
    incipit: Imménsæ rex poténtiæ,
    estrofas:
    - - Imménsæ rex poténtiæ,
      - Christe, tu Patris glóriam
      - nostrúmque decus móliens,
      - mortis fregísti iácula.
    - - Infírma nostra súbiens
