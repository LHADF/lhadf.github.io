      corpus:
      - aquam lavándo díluit,
  iesus-refulsit-omnium:
    incipit: Iesus refúlsit ómnium
    estrofas:
    - - Iesus refúlsit ómnium
      - pius redémptor géntium;
      - totum genus fidélium
      - laudis celébret cánticum.
    - - Denis ter ævi círculis
      - iam parte vivens córporis,
      - lympham petit baptísmatis
      - cunctis carens contágiis.
    - - Felix Ioánnes mérgere
      - illum treméscit flúmine,
      - potest suo qui sánguine
      - peccáta mundi térgere.
    - - Vox ergo Prolem de polis
      - testátur excélsi Patris,
      - fluítque virtus Spíritus
      - sancti datrix charísmatis.
    - - Nos, Christe, voce súpplici
      - precámur, omnes prótege,
      - ac mente fac nitéscere
      - tibíque mundos vívere.
    - - O Christe, vita, véritas,
      - tibi sit omnis glória,
      - quem Patris atque Spíritus
      - splendor revélat cǽlitus.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Iesus refulsit omnium.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1082
    diferencias: []
  audi-benigne-conditor:
    incipit: Audi, benígne Cónditor,
    estrofas:
    - - Audi, benígne Cónditor,
      - nostras preces cum flétibus,
      - sacráta in abstinéntia
      - fusas quadragenária.
    - - Scrutátor alme córdium,
      - infírma tu scis vírium;
      - ad te revérsis éxhibe
      - remissiónis grátiam.
    - - Multum quidem peccávimus,
      - sed parce confiténtibus,
      - tuíque laude nóminis
      - confer medélam lánguidis.
    - - Sic corpus extra cónteri
      - dona per abstinéntiam,
      - ieiúnet ut mens sóbria
      - a labe prorsus críminum.
    - - Præsta, Beáta Trínitas,
      - concéde, simplex Únitas,
      - ut fructuósa sint tuis
      - hæc parcitátis múnera.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Audi benigne Conditor.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2708
    diferencias: []
  ex-more-docti-mystico:
    incipit: Ex more docti mýstico
    estrofas:
    - - Ex more docti mýstico
      - servémus abstinéntiam,
      - deno diérum círculo
      - ducto quater notíssimo.
    - - Lex et prophétæ prímitus
      - hanc prætulérunt, póstmodum
      - Christus sacrávit, ómnium
      - rex atque factor témporum.
    - - Utámur ergo párcius
      - verbis, cibis et pótibus,
      - somno, iocis et árctius
      - perstémus in custódia.
    - - Vitémus autem péssima
      - quæ súbruunt mentes vagas,
      - nullúmque demus cállido
      - hosti locum tyránnidis.
    - - Præsta, Beáta Trínitas,
      - concéde, simplex Únitas,
      - ut fructuósa sint tuis
      - hæc parcitátis múnera.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Ex more docti.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2710
    diferencias: []
  precemur-omnes-cernui:
    incipit: Precémur omnes cérnui,
    estrofas:
    - - Precémur omnes cérnui,
      - clamémus atque sínguli,
      - plorémus ante iúdicem,
      - 'flectámus iram víndicem:'
    - - Nostris malis offéndimus
      - tuam, Deus, cleméntiam;
      - effúnde nobis désuper,
      - remíssor, indulgéntiam.
    - - Meménto quod sumus tui,
      - licet cadúci, plásmatis;
      - ne des honórem nóminis
      - tui, precámur, álteri.
    - - Laxa malum quod fécimus,
      - auge bonum quod póscimus,
      - placére quo tandem tibi
      - possímus hic et pérpetim.
    - - Præsta, Beáta Trínitas,
      - concéde, simplex Únitas,
      - ut fructuósa sint tuis
      - hæc parcitátis múnera.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Precemur omnes cernui.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2711
    diferencias: []
  iesu-quadragenariae:
    incipit: Iesu, quadragenáriæ
    estrofas:
    - - Iesu, quadragenáriæ
      - dicátor abstinéntiæ,
      - qui ob salútem méntium
      - præcéperas ieiúnium,
    - - Adésto nunc Ecclésiæ,
      - adésto pæniténtiæ,
      - qua supplicámus cérnui
      - peccáta nostra dílui.
    - - Tu retroácta crímina
      - tua remítte grátia
      - et a futúris ádhibe
      - custódiam mitíssime,
    - - Ut, expiáti ánnuis
      - compunctiónis áctibus,
      - tendámus ad paschália
      - digne colénda gáudia.
    - - Te rerum univérsitas,
      - clemens, adóret, Trínitas,
      - et nos novi per véniam
      - novum canámus cánticum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Iesu quadragenariae.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2708
    diferencias: []
  nunc-tempus-acceptabile:
    incipit: Nunc tempus acceptábile
    estrofas:
    - - Nunc tempus acceptábile
      - fulget datum divínitus,
      - ut sanet orbem lánguidum
      - medéla parsimóniæ.
    - - Christi decóro lúmine
      - dies salútis émicat,
      - dum corda culpis sáucia
      - refórmat abstinéntia.
    - - Hanc mente nos et córpore,
      - Deus, tenére pérfice,
      - ut appetámus próspero
      - perénne pascha tránsitu.
    - - Te rerum univérsitas,
      - clemens, adóret, Trínitas,
      - et nos novi per véniam
      - novum canámus cánticum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Nunc tempus acceptabile.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 2, p. 2710
    diferencias: []
  iam-christe-sol-iustitiae:
    incipit: Iam, Christe, sol iustítiæ,
    estrofas:
    - - Iam, Christe, sol iustítiæ,
      - mentis dehíscant ténebræ,
      - virtútum ut lux rédeat,
      - terris diem cum réparas.
    - - Dans tempus acceptábile
      - et pǽnitens cor tríbue,
      - convértat ut benígnitas
      - quos longa suffert píetas;
    - - Quiddámque pæniténtiæ
      - da ferre, quo fit démptio,
      - maióre tuo múnere,
      - culpárum quamvis grándium.
    - - Dies venit, dies tua,
      - per quam reflórent ómnia;
      - lætémur in hac ut tuæ
      - per hanc redúcti grátiæ.
    - - Te rerum univérsitas,
      - clemens, adóret, Trínitas,
      - et nos novi per véniam
      - novum canámus cánticum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Iam Christe sol.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2711
    diferencias: []
  dei-fide-qua-vivimus:
    incipit: Dei fide, qua vívimus,
    estrofas:
    - - Dei fide, qua vívimus,
      - qua spe perénni crédimus,
