  pontifex-iesu-mediator-une:
    incipit: Póntifex Iesu, mediátor une
    estrofas:
    - - Póntifex Iesu, mediátor une
      - ad thronum Patris precibúsque fautor
      - iure conclámat, celebrátque nostrum
