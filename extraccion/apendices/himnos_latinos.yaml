      libro:
      - plebs tibi supplex resonat in aula,
      corpus:
      - plebs tibi supplex résonet in aula,
  angularis-fundamentum:
    incipit: Anguláris fundaméntum
    estrofas:
    - - Anguláris fundaméntum
      - lapis Christus missus est,
      - qui paríetum compáge
      - in utróque néctitur,
      - quem Sion sancta suscépit,
      - in quo credens pérmanet.
    - - Omnis illa Deo sacra
      - et dilécta cívitas,
      - plena módulis in laude
      - et canóre iúbilo,
      - trinum Deum unicúmque
      - cum fervóre prǽdicat.
    - - Hoc in templo, summe Deus,
      - exorátus ádveni,
      - et cleménti bonitáte
      - precum vota súscipe;
      - largam benedictiónem
      - hic infúnde iúgiter.
    - - Hic promereántur omnes
      - petíta acquírere
      - et adépta possidére
      - cum sanctis perénniter,
      - paradísum introíre
      - transláti in réquiem.
    - - Glória et honor Deo
      - usquequáque altíssimo,
      - una Patri Filióque
      - atque Sancto Flámini,
      - quibus laudes et potéstas
      - per ætérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Angularis fundamentum.txt
    coincidencia_libro: 0.97
    libro:
    - tomo 1, p. 1091
    diferencias: []
  maria-quae-mortalium:
    incipit: María, quæ mortálium
    estrofas:
    - - María, quæ mortálium
      - preces amánter éxcipis,
      - rogámus ecce súpplices,
      - nobis adésto pérpetim.
    - - Adésto, si nos críminum
      - caténa stringit hórrida;
      - cito resólve cómpedes
      - quæ corda culpis ílligant.
    - - Succúrre, si nos sǽculi
      - fallax imágo péllicit,
      - ne mens salútis trámitem,
      - oblíta cæli, déserat.
    - - Succúrre, si vel córpori
      - advérsa sors impéndeat;
      - fac sint quiéta témpora,
      - ætérnitas dum lúceat.
    - - Tuis et esto fíliis
      - tutéla mortis témpore,
      - ut, te iuvánte, cónsequi
      - perénne detur prǽmium.
    - - Patri sit et Paráclito
      - tuóque Nato glória,
      - qui veste te mirábili
      - circumdedérunt grátiæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Maria quae mortalium.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1092
    diferencias: []
  quem-terra-pontus-aethera:
    incipit: Quem terra, pontus, ǽthera
    estrofas:
    - - Quem terra, pontus, ǽthera
      - colunt, adórant, prǽdicant
      - trinam regéntem máchinam,
      - claustrum Maríæ báiulat.
    - - Cui luna, sol et ómnia
      - desérviunt per témpora,
      - perfúsa cæli grátia
      - gestant puéllæ víscera.
    - - Beáta mater múnere,
      - cuius, supérnus ártifex,
      - mundum pugíllo cóntinens,
      - ventris sub arca clausus est.
    - - Beáta cæli núntio,
      - fecúnda Sancto Spíritu,
      - desiderátus géntibus
      - cuius per alvum fusus est.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Quem terra pontus.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 1, p. 1093
    diferencias: []
  o-gloriosa-domina:
    incipit: O gloriósa dómina,
    estrofas:
    - - O gloriósa dómina,
      - excélsa super sídera,
      - qui te creávit próvide,
      - lactas sacráto úbere.
    - - Quod Eva tristis ábstulit,
      - tu reddis almo gérmine;
      - intrent ut astra flébiles,
      - sternis benígna sémitam.
    - - Tu regis alti iánua
      - et porta lucis fúlgida;
      - vitam datam per Vírginem,
      - gentes redémptæ, pláudite.
    - - Patri sit et Paráclito
      - tuóque Nato glória,
      - qui veste te mirábili
      - circumdedérunt grátiæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O gloriosa domina.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 1, p. 1093
    diferencias: []
  ave-maris-stella:
    incipit: Ave, maris stella,
    estrofas:
    - - Ave, maris stella,
      - Dei mater alma,
      - atque semper virgo,
      - felix cæli porta.
    - - Sumens illud «Ave»
      - Gabriélis ore,
      - funda nos in pace,
      - mutans Evæ nomen.
    - - Solve vincla reis,
      - profer lumen cæcis,
      - mala nostra pelle,
      - bona cuncta posce.
    - - Monstra te esse matrem,
      - sumat per te precem
      - qui pro nobis natus
      - tulit esse tuus.
    - - Virgo singuláris,
      - inter omnes mitis,
      - nos culpis solútos
      - mites fac et castos.
    - - Vitam præsta puram,
      - iter para tutum,
      - ut vidéntes Iesum
      - semper collætémur.
    - - Sit laus Deo Patri,
      - summo Christo decus,
      - Spirítui Sancto
      - honor, tribus unus.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Ave maris stella.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1094
    diferencias: []
  o-virgo-mater-filia:
    incipit: O virgo mater, fília
    estrofas:
    - - O virgo mater, fília
      - tui beáta Fílii,
      - sublímis et humíllima
      - præ creatúris ómnibus.
    - - Divíni tu consílii
      - fixus ab ævo términus,
      - tu decus et fastígium
      - 'natúræ nostræ máximum:'
    - - Quam sic prompsísti nóbilem
      - ut summus eius cónditor
      - in ipsa per te fíeret
      - arte miránda cónditus.
    - - In útero virgíneo
      - amor revíxit ígneus,
      - cuius calóre gérminant
      - flores in terra cǽlici.
    - - Patri sit et Paráclito
      - tuóque Nato glória,
      - qui veste te mirábili
      - circumdedérunt grátiæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O virgo mater.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 3, p. 4409
    diferencias: []
  quae-caritatis-fulgidum:
    incipit: Quæ caritátis fúlgidum
    estrofas:
    - - Quæ caritátis fúlgidum
      - es astrum, Virgo, súperis,
      - spei nobis mortálibus
      - fons vivax es et prófluus.
    - - Sic vales, celsa Dómina,
      - in Nati cor piíssimi,
      - ut qui fidénter póstulat,
      - per te secúrus ímpetret.
    - - Opem tua benígnitas
      - non solum fert poscéntibus,
      - sed et libénter sǽpius
      - precántum vota prǽvenit.
    - - In te misericórdia,
      - in te magnificéntia;
      - tu bonitátis cúmulas
      - quicquid creáta póssident.
    - - Patri sit et Paráclito
      - tuóque Nato glória,
      - qui veste te mirábili
      - circumdedérunt grátiæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Quae caritatis fulgidum.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 3, p. 4410
    diferencias: []
  exsultet-caelum-laudibus:
    incipit: Exsúltet cælum láudibus,
    estrofas:
    - - Exsúltet cælum láudibus,
      - 'resúltet terra gáudiis:'
      - Apostolórum glóriam
      - sacra canunt sollémnia.
    - - Vos, sæcli iusti iúdices
      - et vera mundi lúmina,
      - votis precámur córdium,
      - audíte preces súpplicum.
    - - Qui cælum verbo cláuditis
      - serásque eius sólvitis,
      - nos a peccátis ómnibus
      - sólvite iussu, quǽsumus.
    - - Quorum præcépto súbditur
      - salus et languor ómnium,
      - sanáte ægros móribus,
      - nos reddéntes virtútibus,
    - - Ut, cum iudex advénerit
      - Christus in fine sǽculi,
      - nos sempitérni gáudii
      - fáciat esse cómpotes.
    - - Deo sint laudes glóriæ,
      - qui dat nos evangélicis
      - per vos doctrínis ínstrui
      - et prósequi cæléstia.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Exsultet caelum laudibus.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1094
    diferencias: []
  o-sempiternae-curiae:
    incipit: O sempitérnæ cúriæ
    estrofas:
    - - O sempitérnæ cúriæ
      - regis suprémi príncipes,
      - quos ipse Iesus édocens
      - donávit orbi Apóstolos,
    - - Supérna vos Ierúsalem,
      - lucérna cuius Agnus est,
      - gemmas micántes póssidet,
      - præclára vos fundámina.
    - - Vos et celébrat grátulans
      - nunc sponsa Christi Ecclésia,
      - quam sermo vester éxciit,
      - quam consecrástis sánguine.
    - - Cadéntibus cum sǽculis
      - iudex Redémptor séderit,
      - qua laude vos sedébitis,
      - senátus altæ glóriæ!
    - - Nos ergo vestra iúgiter
      - prex adiuvándo róboret,
      - fudístis ut quæ sémina
      - in grana cæli flóreant.
    - - Ætérna Christo glória,
      - qui fecit esse núntios
      - vos Patris, atque Spíritus
      - replévit almo númine.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O sempiterne curiae.txt
    coincidencia_libro: 0.92
    libro:
    - tomo 1, p. 1095
    diferencias:
    - tipo: errata del PDF
      libro:
      - quam servo vester exciit,
      corpus:
      - quam sermo vester éxciit,
  tristes-erant-apostoli:
    incipit: Tristes erant Apóstoli
    estrofas:
    - - Tristes erant Apóstoli
      - de nece sui Dómini,
      - quem morte crudelíssima
      - sævi damnárant ímpii.
    - - Sermóne blando Ángelus
      - 'prædíxit muliéribus:'
      - «In Galilǽa Dóminus
      - vidéndus est quantócius».
    - - Illæ dum pergunt cóncitæ
      - Apóstolis hoc dícere,
      - vidéntes eum vívere,
      - ósculant pedes Dómini.
    - - Quo ágnito, discípuli
      - in Galilǽa própere
      - pergunt vidére fáciem
      - desiderátam Dómini.
    - - Esto perénne méntibus
      - paschále, Iesu, gáudium,
      - et nos renátos grátiæ
      - tuis triúmphis ággrega.
    - - Sit, Christe, tibi glória,
      - qui regno mortis óbruto,
      - pandísti per Apóstolos
      - vitæ lucísque sémitas.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Tristes erant Apostoli.txt
    coincidencia_libro: 0.92
    libro:
    - tomo 2, p. 2752
    diferencias:
    - tipo: errata del PDF
      libro:
      - in Galilaeam propere
      corpus:
      - in Galilǽa própere
  claro-paschali-gaudio:
    incipit: Claro pascháli gáudio
    estrofas:
    - - Claro pascháli gáudio
      - sol mundo nitet rádio
      - Cum Christum iam Apóstoli
      - visu cernunt corpóreo.
    - - Osténsa sibi vúlnera
      - in Christi carne fúlgida
      - resurrexísse Dóminum
      - voce faténtur pública.
    - - Rex, Christe, clementíssime,
      - tu corda nostra pósside
      - ut tibi laudes débitas
      - reddámus omni témpore.
    - - Esto perénne méntibus
      - paschále, Iesu, gáudium,
      - et nos renátos grátiæ
      - tuis triúmphis ággrega.
    - - Sit, Christe, tibi glória,
      - qui regno mortis óbruto,
      - pandísti per Apóstolos
      - vitæ lucísque sémitas.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Claro paschali gaudio.txt
    coincidencia_libro: 0.9
    libro:
    - tomo 2, p. 2753
    diferencias: []
  sanctorum-meritis-inclita-gaudia:
    incipit: Sanctórum méritis ínclita gáudia
    estrofas:
    - - Sanctórum méritis ínclita gáudia
      - pangámus, sócii, géstaque fórtia;
      - nam gliscit ánimus prómere cántibus
      - victórum genus óptimum.
    - - Hi sunt quos rétinens mundus inhórruit,
      - ipsum nam stérili flore peráridum
      - sprevére pénitus teque secúti sunt,
      - rex, Christe, bone cǽlitum.
    - - Hi pro te fúrias sǽvaque sústinent;
      - non murmur résonat, non querimónia,
      - sed corde tácito mens bene cónscia
      - consérvat patiéntiam.
    - - Quæ vox, quæ póterit lingua retéxere
      - quæ tu martýribus múnera prǽparas?
      - Rubri nam flúido sánguine láureis
      - ditántur bene fúlgidis.
    - - Te, trina Déitas únaque, póscimus,
      - ut culpas ábluas, nóxia súbtrahas,
      - des pacem fámulis, nos quoque glóriam
      - per cuncta tibi sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Sanctorum meritis inclita (masculine).txt
    coincidencia_libro: 0.9
    libro:
    - tomo 1, p. 1096
    diferencias:
    - tipo: errata del PDF
      libro:
      - rex, Christe, bone caelitus.
      corpus:
      - rex, Christe, bone cǽlitum.
  rex-gloriose-martyrum:
    incipit: Rex glorióse mártyrum,
    estrofas:
    - - Rex glorióse mártyrum,
      - coróna confiténtium,
      - qui respuéntes térrea
      - perdúcis ad cæléstia,
    - - Aurem benígnam prótinus
      - appóne nostris vócibus;
      - tropǽa sacra pángimus,
      - ignósce quod delíquimus.
    - - Tu vincis in martýribus
      - parcéndo confessóribus;
      - tu vince nostra crímina
      - donándo indulgéntiam.
    - - Præsta, Pater piíssime,
      - Patríque compar Únice,
      - cum Spíritu Paráclito
      - regnans per omne sǽculum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Rex gloriose martyrum.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 1, p. 1096
    diferencias: []
  aeterna-christi-munera:
    incipit: Ætérna Christi múnera
    estrofas:
    - - Ætérna Christi múnera
      - et mártyrum victórias,
      - laudes feréntes débitas,
      - lætis canámus méntibus.
    - - Ecclesiárum príncipes,
      - belli triumpháles duces,
      - cæléstis aulæ mílites
      - et vera mundi lúmina.
    - - Terróre victo sǽculi
      - pœnísque spretis córporis,
      - mortis sacræ compéndio
      - lucem beátam póssident.
    - - Tortóris insáni manu
      - sanguis sacrátus fúnditur,
      - sed pérmanent immóbiles
      - vitæ perénnis grátia.
    - - Devóta sanctórum fides,
      - invícta spes credéntium,
      - perfécta Christi cáritas
      - mundi triúmphat príncipem.
    - - In his patérna glória,
      - in his volúntas Spíritus,
      - exsúltat in his Fílius,
      - cælum replétur gáudio.
    - - Te nunc, Redémptor, quǽsumus,
      - ut mártyrum consórtio
      - iungas precántes sérvulos
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Aeterna Christi munera.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1097
    diferencias: []
  deus-tuorum-militum:
    incipit: Deus, tuórum mílitum
    estrofas:
    - - Deus, tuórum mílitum
      - sors et coróna, prǽmium,
      - laudes canéntes mártyris
      - absólve nexu críminis.
    - - Hic testis ore prótulit
      - quod cordis arca crédidit,
      - Christum sequéndo répperit
      - effusióne sánguinis.
    - - Hic nempe mundi gáudia
      - et blandiménta nóxia
      - cadúca rite députans,
      - pervénit ad cæléstia.
    - - Pœnas cucúrrit fórtiter
      - et sústulit viríliter;
      - pro te refúndens sánguinem,
      - ætérna dona póssidet.
    - - Ob hoc precátu súpplici
      - te póscimus, piíssime;
      - in hoc triúmpho mártyris
      - dimítte noxam sérvulis,
    - - Ut consequámur múneris
      - ipsíus et consórtia,
      - lætémur ac perénniter
      - iuncti polórum sédibus.
    - - Laus et perénnis glória
      - tibi, Pater, cum Fílio,
      - Sancto simul Paráclito
      - in sæculórum sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Deus tuorum militum (pro uno martyre).txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1097
    diferencias:
    - tipo: texto distinto
      libro: []
      corpus:
      - Hic testis ore prótulit
      - quod cordis arca crédidit,
      - Christum sequéndo répperit
      - effusióne sánguinis.
  beate-martyr-prospera:
    incipit: Beáte martyr, próspera
    estrofas:
    - - Beáte martyr, próspera
      - diem triumphálem tuum,
      - quo sánguinis merces tibi
      - coróna vincénti datur.
    - - Hic te ex ténebris sǽculi,
      - tortóre victo et iúdice,
      - evéxit ad cælum dies
      - Christóque ovántem réddidit.
    - - Nunc angelórum párticeps
      - collúces insígni stola,
      - quam testis indomábilis
      - rivis cruóris láveras.
    - - Adésto nunc et óbsecra,
      - placátus ut Christus suis
      - inclínet aurem prósperam,
      - noxas nec omnes ímputet.
    - - Paulísper huc illábere
      - Christi favórem déferens,
      - sensus graváti ut séntiant
      - levámen indulgéntiæ.
    - - Honor Patri cum Fílio
      - et Spíritu Paráclito,
      - qui te coróna pérpeti
      - cingunt in aula glóriæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Beate martyr prospera.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1098
    diferencias: []
  martyr-dei-qui-unicum:
    incipit: Martyr Dei, qui únicum
    estrofas:
    - - Martyr Dei, qui únicum
      - Patris sequéndo Fílium
      - victis triúmphas hóstibus,
      - victor fruens cæléstibus,
    - - Tui precátus múnere
      - nostrum reátum dílue,
      - arcens mali contágium,
      - vitæ repéllens tǽdium.
    - - Solúta sunt iam víncula
      - tui sacráti córporis;
      - nos solve vinclis sǽculi
      - amóre Fílii Dei.
    - - Honor Patri cum Fílio
      - et Spíritu Paráclito,
      - qui te coróna pérpeti
      - cingunt in aula glóriæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Martyr Dei qui.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 1, p. 1100
    diferencias: []
  virginis-proles-opifexque-matris:
    incipit: Vírginis Proles opiféxque Matris,
    estrofas:
    - - Vírginis Proles opiféxque Matris,
      - Virgo quem gessit peperítque Virgo,
      - 'vírginis festum cánimus tropǽum:'
      - áccipe votum.
    - - Hæc tua virgo, dúplici beáta
      - sorte dum gestit frágilem domáre
      - córporis sexum, dómuit cruéntum
      - córpore sæclum.
    - - Inde nec mortem nec amíca mortis
      - sæva pœnárum génera pavéscens,
      - sánguine fuso méruit sacrátum
      - scándere cælum.
    - - Huius obténtu, Deus alme, nostris
      - parce iam culpis, vítiis revúlsis,
      - quo tibi puri résonet per ævum
      - péctoris hymnus.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Virginis Proles opifexque.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 1, p. 1098
    diferencias: []
  o-christe-flos-convallium:
    incipit: O Christe, flos convállium,
    estrofas:
    - - O Christe, flos convállium,
      - te láudibus extóllimus,
      - quod hanc ornásti vírginem
      - palmis quoque martýrii.
    - - Hæc prudens, fortis, sápiens,
      - fidem proféssa, líbere,
      - pro te dira supplícia
      - excépit impertérrita.
    - - Sic spreto mundi príncipe,
      - tuo ditáta múnere,
      - cruénto parta prœ́lio,
      - ætérna tulit prǽmia.
    - - Huius, Redémptor, méritis
      - nos pius adde sócios,
      - ut, mente pura, frúctibus
      - tui fruámur sánguinis.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O Christe flos.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 1, p. 1099
    diferencias: []
  o-castitatis-signifer:
    incipit: O castitátis sígnifer
    estrofas:
    - - O castitátis sígnifer
      - et fortitúdo mártyrum,
      - utrísque reddens prǽmia,
      - audi benígnus súpplices.
    - - Hæc virgo magni péctoris,
      - beáta sorte dúplici
      - bináque palma nóbilis,
      - hic tóllitur præcóniis.
    - - Hæc te fatéri pértinax,
      - tortóris acre bráchium
      - armávit in se strénue
      - tibíque fudit spíritum.
    - - Sic sæviéntis vúlnera
      - et blandiéntis víncere
      - mundi docens illécebram,
      - fidem docet nos íntegram.
    - - Huius favóre débita
      - nobis remíttas ómnia,
      - foménta tollens críminum
      - tuámque subdens grátiam.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O castitatis signifer.txt
    coincidencia_libro: 0.92
    libro:
    - tomo 1, p. 1100
    diferencias:
    - tipo: errata del PDF
      libro:
      - tortoris acre bracchium
      corpus:
      - tortóris acre bráchium
  vir-celse-forma-fulgida:
    incipit: Vir celse, forma fúlgida
    estrofas:
    - - Vir celse, forma fúlgida
      - virtútis, hymnum súscipe,
      - qui iure dum te prǽdicat,
      - Dei canit magnália.
      - Qui sempitérnus Póntifex
      - stirpem Deo mortálium
      - revínxit, atque réddidit
      - paci novo nos fœ́dere,
    - - Te fecit ipse próvidus
      - sui minístrum múneris,
      - Patri datúrum glóriam
      - eiúsque vitam plébibus.
      - Virtúte factus dítior
      - te consecrántis Spíritus,
      - præsul, salútis pínguia
      - tu tradidísti pábula.
    - - Locátus in cæléstibus,
      - sanctæ meménto Ecclésiæ,
