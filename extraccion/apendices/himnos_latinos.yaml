      - Nunc eum nisu rogitémus omnes,
      - ábluat nostrum pius ut reátum,
      - et sua ducat prece nos ad alta
      - cúlmina cæli.
      - Sit Deo soli decus et potéstas,
      - laus in excélsis, honor ac perénnis,
      - qui suis totum móderans gubérnat
      - légibus orbem.
