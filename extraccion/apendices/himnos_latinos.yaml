  petrus-beatus-catenarum-laqueos:
    incipit: Petrus beátus catenárum láqueos
    estrofas:
    - - Petrus beátus catenárum láqueos
      - Christo iubénte rupit mirabíliter;
      - custos ovílis et doctor Ecclésiæ,
      - pastórque gregis, conservátor óvium
      - arcet lupórum truculéntam rábiem.
    - - Quodcúmque vinclis super terram strínxeris,
      - erit in astris religátum fórtiter,
      - et quod resólvis in terris arbítrio,
      - erit solútum super cæli rádium;
      - in fine mundi iudex eris sǽculi.
    - - Glória Patri per imménsa sǽcula,
      - sit tibi, Nate, decus et impérium,
      - honor, potéstas Sanctóque Spirítui;
      - sit Trinitáti salus indivídua
      - per infiníta sæculórum sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Petrus beatus catenarum.txt
    coincidencia_libro: 0.67
    libro:
    - tomo 2, p. 2733
    diferencias:
    - tipo: errata del PDF
      libro:
      - Quodcumque vinclis super terram strinxeris,
      corpus:
      - Quodcúmque vinclis super terram strínxerit,
    - tipo: errata del PDF
      libro:
      - et quod resolvis in terris arbitrio,
      - erit solutum super coeli radium;
      - in fine mundi iudex eris saeculi.
      corpus:
      - et quod resólvit in terris arbítrio,
      - erit solútum super cæli rádium;
      - in fine mundi iudex erit sǽculi.
  te-ioseph-celebrent-agmina-caelitum:
    incipit: Te, Ioseph, célebrent ágmina cǽlitum,
    estrofas:
    - - Te, Ioseph, célebrent ágmina cǽlitum,
      - te cuncti résonent christíadum chori,
      - qui, clarus méritis, iunctus es ínclitæ
      - casto fœ́dere Vírgini.
    - - Almo cum túmidam gérmine cóniugem
      - admírans dúbio tángeris ánxius,
      - afflátu súperi Fláminis ángelus
      - concéptum púerum docet.
    - - Tu natum Dóminum stringis, ad éxteras
      - Ægýpti prófugum tu séqueris plagas;
      - amíssum Sólymis quæris et ínvenis,
      - miscens gáudia flétibus.
    - - Eléctos réliquos mors pia cónsecrat
      - palmámque eméritos glória súscipit;
      - tu vivens, súperis par, frúeris Deo,
      - mira sorte beátior.
    - - Nobis, summa Trias, parce precántibus;
      - da Ioseph méritis sídera scándere,
      - ut tandem líceat nos tibi pérpetim
      - gratum prómere cánticum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Te Ioseph celebrent.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2734
    diferencias: []
  iste-quem-laeti-colimus-fideles:
    incipit: Iste, quem læti cólimus, fidéles,
    estrofas:
    - - Iste, quem læti cólimus, fidéles,
      - cuius excélsos cánimus triúmphos,
      - hac die Ioseph méruit perénnis
      - gáudia vitæ.
    - - O nimis felix, nimis o beátus,
      - cuius extrémam vígiles ad horam
      - Christus et Virgo simul astitérunt
      - ore seréno.
    - - Iustus insígnis, láqueo solútus
      - carnis, ad sedes plácido sopóre
      - migrat ætérnas, rutilísque cingit
      - témpora sertis.
    - - Ergo regnántem flagitémus omnes,
      - adsit ut nobis, veniámque nostris
      - óbtinens culpis, tríbuat supérnæ
      - múnera pacis.
    - - Sint tibi plausus, tibi sint honóres,
      - trine qui regnas Deus, et corónas
      - áureas servo tríbuis fidéli
      - omne per ævum.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Iste quem laeti.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2735
    diferencias: []
  caelitum-ioseph-decus-atque-nostrae:
    incipit: Cǽlitum, Ioseph, decus atque nostræ
    estrofas:
    - - Cǽlitum, Ioseph, decus atque nostræ
      - certa spes vitæ columénque mundi,
      - quas tibi læti cánimus, benígnus
      - súscipe laudes.
    - - Te, satum David, státuit Creátor
      - Vírginis sponsum, voluítque Verbi
      - te patrem dici, dedit et minístrum
      - esse salútis.
    - - Tu Redemptórem stábulo iacéntem,
      - quem chorus vatum cécinit futúrum,
      - áspicis gaudens, sociúsque matris
      - primus adóras.
    - - Rex Deus regum, dominátor orbis,
      - cuius ad nutum tremit inferórum
      - turba, cui pronus famulátur æther,
      - se tibi subdit.
    - - Laus sit excélsæ Tríadi perénnis,
      - quæ, tibi insígnes tríbuens honóres,
      - det tuis nobis méritis beátæ
      - gáudia vitæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Caelitum Ioseph decus.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2735
    diferencias: []
  agnoscat-omne-saeculum:
    incipit: Agnóscat omne sǽculum
    estrofas:
    - - Agnóscat omne sǽculum
      - venísse vitæ prǽmium;
      - post hostis ásperi iugum
      - appáruit redémptio.
    - - Isaías quæ prǽcinit
      - compléta sunt in Vírgine;
      - annuntiávit Ángelus,
      - Sanctus replévit Spíritus.
    - - María ventre cóncipit
      - verbi fidélis sémine;
      - quem totus orbis non capit,
      - portant puéllæ víscera.
    - - Adam vetus quod pólluit,
      - Adam novus hoc ábluit;
      - tumens quod ille déicit,
      - humíllimus hic érigit.
    - - Christo sit omnis glória,
      - Dei Paréntis Fílio,
      - quem Virgo felix cóncipit
      - Sancti sub umbra Spíritus.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Agnoscat omne saeculum.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 2, p. 2736
    diferencias: []
  iam-caeca-vis-mortalium:
    incipit: Iam cæca vis mortálium
    estrofas:
    - - Iam cæca vis mortálium
      - vénerans inánes nǽnias,
      - vel æra vel saxa álgida
      - vel ligna credébat Deum.
    - - Hæc dum sequúntur pérfidi,
      - prædónis in ius vénerant
      - et mancipátam fúmido
      - vitam baráthro immérserant.
    - - Stragem sed istam non tulit
      - Christus cadéntum géntium;
      - impúne ne forsan sui
      - Patris períret fábrica,
    - - Mortále corpus índuit
      - ut, excitáto córpore,
      - mortis caténam frángeret
      - hominémque portáret Patri.
    - - Hic ille natális dies,
      - quo te Creátor árduus
      - spirávit et limo índidit,
      - Sermóne carnem glútinans.
    - - O quanta rerum gáudia
      - alvus pudíca cóntinet,
      - ex qua novéllum sǽculum
      - procédit et lux áurea!
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Iam caeca vis.txt
    coincidencia_libro: 0.93
    libro:
    - tomo 2, p. 2736
    diferencias:
    - tipo: errata del PDF
      libro:
      - 'vitam barathro inmerserant:'
      corpus:
      - vitam baráthro immérserant.
  o-lux-salutis-nuntia:
    incipit: O lux, salútis núntia,
    estrofas:
    - - O lux, salútis núntia,
      - qua Vírgini fert Ángelus
      - complénda mox orácula
      - et cara terris gáudia.
    - - Qui Patris ætérno sinu
      - ætérna Proles náscitur,
      - obnóxius fit témpori
      - matrémque in orbe séligit.
    - - Nobis piándis víctima
      - nostros se in artus cólligit,
      - ut innocénti sánguine
      - scelus nocéntum díluat.
    - - Concépta carne Véritas,
      - umbráta velo Vírginis,
      - puris vidénda méntibus,
      - imple tuo nos lúmine.
    - - Et quæ modésto péctore
      - te dicis ancíllam Dei,
      - regína nunc cæléstium,
      - patróna sis fidélium.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O lux salutis.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 2, p. 2737
    diferencias: []
  o-vir-beate-apostolis:
    incipit: O vir beáte, Apóstolis
    estrofas:
    - - O vir beáte, Apóstolis
      - comes labórum sédule
      - adiútor atque múneris,
      - laudes precésque súscipe.
    - - Christi per illos núntios
      - exórta sunt lætíssima
      - et veritátis sǽcula
      - et pacis atque gáudii.
    - - Assúmptus et tu cǽlitus
      - ad tanta consors póndera,
      - compar nitéscis glória
      - potentiáque prómines.
    - - Tu, seminátor lúminis,
      - fac sole Christi vívido
      - virére ubíque gérmina
      - cæli replénda ad hórrea.
    - - Simúlque cum primóribus
      - summo astitúrus Iúdici,
      - da nostra solvi débita,
      - nos da fovéri grátia.
    - - Christo sit omnis glória
      - cum Patre et almo Spíritu
      - quorum beáti lúmine,
      - simul fruémur gáudiis.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O vir beate.txt
