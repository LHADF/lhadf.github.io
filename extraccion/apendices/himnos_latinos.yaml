  ales-diei-nuntius:
    incipit: Ales diéi núntius
    estrofas:
    - - Ales diéi núntius
      - lucem propínquam prǽcinit;
      - nos excitátor méntium
      - iam Christus ad vitam vocat.
    - - «Auférte –clamat– léctulos
      - ægros, sopóros, désides;
      - castíque, recti ac sóbrii
      - vigiláte; iam sum próximus».
    - - Ut, cum corúscis flátibus
      - auróra cælum spárserit,
      - omnes labóre exércitos
      - confírmet ad spem lúminis,
    - - Iesum ciámus vócibus
      - flentes, precántes, sóbrii;
      - inténta supplicátio
      - dormíre cor mundum vetat.
    - - Tu, Christe, somnum dísice,
      - tu rumpe noctis víncula,
      - tu solve peccátum vetus
      - novúmque lumen íngere.
    - - Sit, Christe, rex piíssime,
      - tibi Patríque glória
      - cum Spíritu Paráclito,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Ales diei nuntius.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 4, p. 6246
