      - quæ sacra per mystéria
      - cunctis donásti géntibus.
    - - Tu agnus mitis, ínnocens,
      - oblátus terræ víctima,
      - sanctórum vestes ómnium
      - tuo lavásti sánguine.
    - - Quos redemísti prétio
      - tui sacráti córporis,
      - cælo resúrgens ádvehis
