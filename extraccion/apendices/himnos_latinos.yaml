    - tipo: errata del PDF
      libro:
      - paterno fultum bracchio
      corpus:
      - patérno fultum bráchio
  horis-peractis-undecim:
    incipit: Horis peráctis úndecim
    estrofas:
    - - Horis peráctis úndecim
      - ruit dies in vésperum;
      - solvámus omnes débitum
      - mentis libénter cánticum.
    - - Labor diúrnus tránsiit
      - quo, Christe, nos condúxeras;
      - da iam colónis víneæ
      - promíssa dona glóriæ.
    - - Mercéde quos nunc ádvocas,
      - quos ad futúrum múneras,
      - nos in labóre ádiuva
      - et post labórem récrea.
    - - Sit, Christe, rex piíssime,
      - tibi Patríque glória
      - cum Spíritu Paráclito,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Horis peractis undecim.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 4, p. 6250
    diferencias: []
  lux-aeterna-lumen-potens:
    incipit: Lux ætérna, lumen potens,
    estrofas:
    - - Lux ætérna, lumen potens,
      - dies indefíciens,
      - debellátor atræ noctis,
      - reparátor lúminis,
      - destructórque tenebrárum,
      - 'illustrátor méntium:'
    - - Quo nascénte suscitámur,
      - quo vocante súrgimus;
      - faciénte quo beáti,
      - quo linquénte míseri;
      - quo a morte liberáti,
      - quo sumus perlúcidi;
    - - Mortis quo victóres facti,
      - noctis atque sǽculi;
      - ergo nobis, rex ætérne,
      - lucem illam tríbue,
      - quæ fuscátur nulla nocte,
      - solo gaudens lúmine.
    - - Honor Patri sit ac tibi,
      - Sancto sit Spirítui,
      - Deo trino sed et uni,
      - paci, vitæ, lúmini,
      - nómini præ cunctis dulci
      - divinóque númini.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Lux aeterna lumen.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 4, p. 6250
    diferencias: []
  deus-de-nullo-veniens:
    incipit: Deus de nullo véniens,
    estrofas:
    - - Deus de nullo véniens,
      - Deus de Deo pródiens,
      - Deus ab his progrédiens,
      - in nos veni subvéniens.
    - - Tu nostrum desidérium,
      - tu sis amor et gáudium;
      - in te nostra cupíditas
      - et sit in te iucúnditas.
    - - Pater, cunctórum Dómine,
      - cum Génito de Vírgine,
      - intus et in circúitu
      - nos rege Sancto Spíritu.
    - - Meménto, Sancta Trínitas,
      - quod tua fecit bónitas,
      - creándo prius hóminem,
      - recreándo per sánguinem.
    - - Nam quos creávit Únitas,
      - redémit Christi cáritas;
      - patiéndo tunc díligens,
      - nunc díligat nos éligens.
    - - Tríadi sanctæ gáudium,
      - pax, virtus et impérium,
      - decus, omnipoténtia,
      - laus, honor, reveréntia.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Deus de nullo.txt
    coincidencia_libro: 0.92
    libro:
    - tomo 4, p. 6251
    diferencias:
    - tipo: errata del PDF
      libro:
      - Deus ab his pregrediens,
      corpus:
      - Deus ab his progrédiens,
  diei-luce-reddita:
    incipit: Diéi luce réddita,
    estrofas:
    - - Diéi luce réddita,
      - lætis gratísque vócibus
      - Dei canámus glóriam,
      - Christi faténtes grátiam.
    - - Per quem creátor ómnium
      - diem noctémque cóndidit,
      - ætérna lege sánciens
      - ut semper succédant sibi.
    - - Tu vera lux fidélium,
      - quem lex vetérna non tenet,
      - noctis nec ortu súccidens,
      - ætérno fulgens lúmine.
    - - Præsta, Pater ingénite,
      - totum ducámus iúgiter
      - Christo placéntes hunc diem
      - Sancto repléti Spíritu.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Diei luce reddita.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 4, p. 6252
    diferencias: []
  immensa-et-una-trinitas:
    incipit: Imménsa et una, Trínitas,
    estrofas:
    - - Imménsa et una, Trínitas,
      - cuius potéstas ómnia
      - facit regítque témpora
      - et exstat ante sǽcula,
    - - Tu sola pleno súfficis
      - tibi beáta gáudio;
      - tu pura, simplex, próvida
      - cælos et orbem cóntines.
    - - Omnis, Pater, fons grátiæ,
      - Lumen patérnæ glóriæ,
      - Sancte utriúsque Spíritus
      - intermináta cáritas,
    - - Ex te supréma orígine,
      - Trias benígna, prófluit
      - creáta quicquid sústinet,
      - quicquid decóre pérficit.
    - - Quos et coróna múneras
      - adoptiónis íntimæ,
      - nos templa fac niténtia
      - tibi placére iúgiter.
    - - O viva lux, nos ángelis
      - da iungi in aula cǽlica,
      - ut grati amóris láudibus
      - te concinámus pérpetim.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Immensa et una.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 3, p. 4343
    - tomo 4, p. 6209
    diferencias: []
  te-patrem-summum-genitumque-verbum:
    incipit: Te Patrem summum genitúmque Verbum
    estrofas:
    - - Te Patrem summum genitúmque Verbum
      - Flamen ac Sanctum Dóminum faténtur
      - únicum, quotquot paradísi amœ́nus
      - hortus adúnat.
    - - Quam modis miris, Trias alma, vivas
      - pércipit nemo, tamen usque in ævum
      - cǽlites vultu sátias, alácri
      - voce canéntes.
    - - Te canunt mundi statuísse molem,
      - Lúmine ætérno régere univérsa,
      - ígnibus celsi refovére Amóris
      - corda tuórum.
    - - Mente permísti súperum catérvis,
      - iam choris illis sociámus hymnos,
      - qui tua optámus fore sempitérna
      - pace beáti.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Te Patrem summum.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 3, p. 4343
    - tomo 4, p. 6210
    diferencias: []
  trinitas-summo-solio-coruscans:
    incipit: Trínitas, summo sólio corúscans,
    estrofas:
    - - Trínitas, summo sólio corúscans,
      - glóriæ carmen tibi sit perénne,
      - quæ tenes nostri veheménti amóre
      - péctoris ima.
    - - Cónditor rerum, Pater, alma virtus,
      - quos tuæ vitæ facis atque formæ
      - esse consórtes, fídei fac usque
      - dona meréri.
    - - Candor ætérnæ speculúmque lucis,
      - Nate, quos dicis sociásque fratres,
      - pálmites viti tibi nos inésse
      - da viridántes.
    - - Cáritas, ignis, píetas, poténti
      - lúmine ac blando móderans creáta,
      - Spíritus, mentem rénova, fovéto
      - íntima cordis.
    - - Hospes o dulcis, Trias obsecránda,
      - nos tibi iugi fac amóre nexos,
      - pérpetes donec modulémur hymnos
      - teque fruámur.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Trinitas summo solio.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 3, p. 4344
    - tomo 4, p. 6210
    diferencias: []
  pange-lingua-gloriosi-corporis:
    incipit: Pange, lingua, gloriósi
    estrofas:
    - - Pange, lingua, gloriósi
      - córporis mystérium,
      - sanguinísque pretiósi,
      - quem in mundi prétium
      - fructus ventris generósi
      - Rex effúdit géntium.
    - - Nobis datus, nobis natus
      - ex intácta Vírgine,
      - et in mundo conversátus,
      - sparso verbi sémine,
      - sui moras incolátus
      - miro clausit órdine.
    - - In suprémæ nocte cenæ
      - recúmbens cum frátribus,
      - observáta lege plene
      - cibis in legálibus,
      - cibum turbæ duodénæ
      - se dat suis mánibus.
    - - Verbum caro panem verum
      - verbo carnem éfficit,
      - fitque sanguis Christi merum,
      - et, si sensus déficit,
      - ad firmándum cor sincérum
      - sola fides súfficit.
    - - Tantum ergo sacraméntum
      - venerémur cérnui,
      - et antíquum documéntum
      - novo cedat rítui;
      - præstet fides suppleméntum
      - sénsuum deféctui.
    - - Genitóri Genitóque
      - laus et iubilátio,
      - salus, honor, virtus quoque
      - sit et benedíctio;
      - procedénti ab utróque
      - compar sit laudátio.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Pange lingua gloriosi corporis.txt
    coincidencia_libro: 0.97
    libro:
    - tomo 3, p. 4344
    - tomo 4, p. 6211
    diferencias: []
  sacris-sollemniis-iuncta-sint-gaudia:
    incipit: Sacris sollémniis iuncta sint gáudia,
    estrofas:
    - - Sacris sollémniis iuncta sint gáudia,
      - et ex præcórdiis sonent præcónia;
      - recédant vétera, nova sint ómnia,
      - corda, voces et ópera.
    - - Noctis recólitur cena novíssima,
      - qua Christus créditur agnum et ázyma
      - dedísse frátribus iuxta legítima
      - priscis indúlta pátribus.
    - - Dedit fragílibus córporis férculum,
      - dedit et trístibus sánguinis póculum,
      - 'dicens: «Accípite quod trado vásculum;'
      - omnes ex eo bíbite».
    - - Sic sacrifícium istud instítuit,
      - cuius offícium commítti vóluit
      - solis presbýteris, quibus sic cóngruit,
      - ut sumant et dent céteris.
    - - Panis angélicus fit panis hóminum;
      - dat panis cǽlicus figúris términum.
      - 'O res mirábilis: mandúcat Dóminum'
      - servus pauper et húmilis.
    - - Te, trina Déitas únaque, póscimus;
      - 'sic nos tu vísitas sicut te cólimus:'
      - per tuas sémitas duc nos quo téndimus
      - ad lucem quam inhábitas.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Sacris sollemniis iuncta.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 3, p. 4345
    - tomo 4, p. 6212
    diferencias: []
  verbum-supernum-prodiens-nec-patris:
    incipit: Verbum supérnum pródiens
    estrofas:
    - - Verbum supérnum pródiens
      - nec Patris linquens déxteram,
      - ad opus suum éxiens
      - venit ad vitæ vésperam.
    - - In mortem a discípulo
      - suis tradéndus ǽmulis,
      - prius in vitæ férculo
      - se trádidit discípulis.
    - - Quibus sub bina spécie
