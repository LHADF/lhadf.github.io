  christe-redemptor-omnium-ex-patre:
    incipit: Christe, redémptor ómnium,
    estrofas:
    - - Christe, redémptor ómnium,
      - ex Patre, Patris Únice,
      - solus ante princípium
      - natus ineffabíliter,
    - - Tu lumen, tu splendor Patris,
      - tu spes perénnis ómnium,
      - inténde quas fundunt preces
      - tui per orbem sérvuli.
    - - Salútis auctor, récole
      - quod nostri quondam córporis,
      - ex illibáta Vírgine
      - nascéndo, formam súmpseris.
    - - Hic præsens testátur dies,
      - currens per anni círculum,
      - quod solus a sede Patris
      - mundi salus advéneris;
    - - Hunc cælum, terra, hunc mare,
      - hunc omne quod in eis est,
      - auctórem advéntus tui
      - laudat exsúltans cántico.
    - - Nos quoque, qui sancto tuo
      - redémpti sumus sánguine,
      - ob diem natális tui
      - hymnum novum concínimus.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Christe redemptor omnium ex.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1070
    diferencias: []
  candor-aeternae-deitatis-alme:
    incipit: Candor ætérnæ Deitátis alme,
    estrofas:
    - - Candor ætérnæ Deitátis alme,
      - Christe, tu lumen, vénia atque vita
      - ádvenis, morbis hóminum medéla,
      - porta salútis.
    - - Íntonat terræ chorus angelórum
      - cǽlicum carmen, nova sæcla dicens,
      - glóriam Patri, generíque nostro
      - gáudia pacis.
    - - Qui iaces parvus dóminans et orbi,
      - Vírginis fructus sine labe sanctæ,
      - Christe, iam mundo potiáris omni,
      - semper amándus.
    - - Násceris cælos pátriam datúrus,
      - unus e nobis, caro nostra factus;
      - ínnova mentes, trahe caritátis
      - péctora vinclis.
    - - Cœtus exsúltans canit ecce noster,
      - ángelis læto sociátus ore,
      - et Patri tecum parilíque Amóri
      - cántica laudis.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Candor aeternae Deitatis.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 1, p. 1071
    diferencias: []
  a-solis-ortus-cardine:
    incipit: A solis ortus cárdine
    estrofas:
    - - A solis ortus cárdine
      - adúsque terræ límitem
      - Christum canámus príncipem,
      - natum María Vírgine.
    - - Beátus auctor sǽculi
      - servíle corpus índuit,
      - ut carne carnem líberans
      - non pérderet quod cóndidit.
    - - Clausæ paréntis víscera
      - cæléstis intrat grátia;
      - venter puéllæ báiulat
      - secréta quæ non nóverat.
    - - Domus pudíci péctoris
      - templum repénte fit Dei;
      - intácta nésciens virum
      - verbo concépit Fílium.
    - - Eníxa est puérpera
      - quem Gábriel prædíxerat,
      - quem matris alvo géstiens
      - clausus Ioánnes sénserat.
    - - Feno iacére pértulit,
      - præsépe non abhórruit,
      - parvóque lacte pastus est
      - per quem nec ales ésurit.
    - - Gaudet chorus cæléstium
      - et ángeli canunt Deum,
      - palámque fit pastóribus
      - pastor, creátor ómnium.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/A solis ortus.txt
    coincidencia_libro: 0.97
    libro:
    - tomo 1, p. 1072
    diferencias: []
  hostis-herodes-impie:
    incipit: Hostis Heródes ímpie,
    estrofas:
    - - Hostis Heródes ímpie,
      - Christum veníre quid times?
      - Non éripit mortália
      - qui regna dat cæléstia.
    - - Ibant magi, qua vénerant
      - stellam sequéntes prǽviam,
      - lumen requírunt lúmine,
      - Deum faténtur múnere.
    - - Lavácra puri gúrgitis
      - cæléstis Agnus áttigit;
      - peccáta quæ non détulit
      - nos abluéndo sústulit.
    - - 'Novum genus poténtiæ:'
      - aquæ rubéscunt hýdriæ,
      - vinúmque iussa fúndere
      - mutávit unda oríginem.
    - - Iesu, tibi sit glória,
      - qui te revélas géntibus,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Hostis Herodes impie.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 1, p. 1073
    diferencias: []
  magi-videntes-parvulum:
    incipit: Magi vidéntes párvulum
    estrofas:
    - - Magi vidéntes párvulum
      - eóa promunt múnera,
      - stratíque votis ófferunt
      - tus, myrrham et aurum régium.
    - - Agnósce clara insígnia
      - virtútis ac regni tui,
      - Puer, cui trinam Pater
      - 'prædestinávit índolem:'
    - - Regem Deúmque annúntiant
      - thesáurus et fragrans odor
      - turis Sabǽi, at mýrrheus
      - pulvis sepúlcrum prǽdocet.
    - - O sola magnárum úrbium
