himnos:
  conditor-alme-siderum:
    incipit: Cónditor alme síderum,
    estrofas:
    - - Cónditor alme síderum,
      - ætérna lux credéntium,
      - Christe, redémptor ómnium,
      - exáudi preces súpplicum.
    - - Qui cóndolens intéritu
      - mortis períre sǽculum,
      - salvásti mundum lánguidum,
      - donans reis remédium,
    - - Vergénte mundi véspere,
      - uti sponsus de thálamo,
      - egréssus honestíssima
      - Vírginis matris cláusula.
    - - Cuius forti poténtiæ
      - genu curvántur ómnia;
      - cæléstia, terréstria
      - nutu faténtur súbdita.
    - - Te, Sancte, fide quǽsumus,
      - ventúre iudex sǽculi,
      - consérva nos in témpore
      - hostis a telo pérfidi.
    - - Sit, Christe, rex piíssime,
      - tibi Patríque glória
      - cum Spíritu Paráclito,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Conditor alme siderum.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1063
    diferencias: []
  te-lucis-ante-terminum:
    incipit: Te lucis ante términum,
    estrofas:
    - - Te lucis ante términum,
      - rerum creátor, póscimus,
      - ut sólita cleméntia
      - sis præsul et custódia.
    - - Te corda nostra sómnient,
      - te per sopórem séntiant,
      - tuámque semper glóriam
      - vicína luce cóncinant.
    - - Vitam salúbrem tríbue,
      - nostrum calórem réfice
      - tætram noctis calíginem
      - tua collústret cláritas.
    - - Præsta, Pater omnípotens,
      - per Iesum Christum Dóminum,
      - qui tecum in perpétuum
