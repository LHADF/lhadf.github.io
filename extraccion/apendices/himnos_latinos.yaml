  angularis-fundamentum:
    incipit: Anguláris fundaméntum
    estrofas:
    - - Anguláris fundaméntum
      - lapis Christus missus est,
      - qui paríetum compáge
      - in utróque néctitur,
      - quem Sion sancta suscépit,
      - in quo credens pérmanet.
    - - Omnis illa Deo sacra
      - et dilécta cívitas,
      - plena módulis in laude
      - et canóre iúbilo,
      - trinum Deum unicúmque
      - cum fervóre prǽdicat.
    - - Hoc in templo, summe Deus,
      - exorátus ádveni,
      - et cleménti bonitáte
      - precum vota súscipe;
      - largam benedictiónem
      - hic infúnde iúgiter.
    - - Hic promereántur omnes
      - petíta acquírere
      - et adépta possidére
      - cum sanctis perénniter,
      - paradísum introíre
      - transláti in réquiem.
    - - Glória et honor Deo
      - usquequáque altíssimo,
      - una Patri Filióque
      - atque Sancto Flámini,
      - quibus laudes et potéstas
      - per ætérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Angularis fundamentum.txt
    coincidencia_libro: 0.97
    libro:
    - tomo 1, p. 1091
    diferencias: []
  maria-quae-mortalium:
    incipit: María, quæ mortálium
    estrofas:
    - - María, quæ mortálium
      - preces amánter éxcipis,
      - rogámus ecce súpplices,
      - nobis adésto pérpetim.
    - - Adésto, si nos críminum
      - caténa stringit hórrida;
      - cito resólve cómpedes
      - quæ corda culpis ílligant.
    - - Succúrre, si nos sǽculi
      - fallax imágo péllicit,
      - ne mens salútis trámitem,
      - oblíta cæli, déserat.
    - - Succúrre, si vel córpori
      - advérsa sors impéndeat;
      - fac sint quiéta témpora,
      - ætérnitas dum lúceat.
    - - Tuis et esto fíliis
      - tutéla mortis témpore,
      - ut, te iuvánte, cónsequi
      - perénne detur prǽmium.
    - - Patri sit et Paráclito
      - tuóque Nato glória,
      - qui veste te mirábili
      - circumdedérunt grátiæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Maria quae mortalium.txt
    coincidencia_libro: 0.96
    libro:
    - tomo 1, p. 1092
    diferencias: []
  quem-terra-pontus-aethera:
    incipit: Quem terra, pontus, ǽthera
    estrofas:
    - - Quem terra, pontus, ǽthera
      - colunt, adórant, prǽdicant
      - trinam regéntem máchinam,
      - claustrum Maríæ báiulat.
    - - Cui luna, sol et ómnia
      - desérviunt per témpora,
      - perfúsa cæli grátia
      - gestant puéllæ víscera.
    - - Beáta mater múnere,
      - cuius, supérnus ártifex,
      - mundum pugíllo cóntinens,
      - ventris sub arca clausus est.
    - - Beáta cæli núntio,
      - fecúnda Sancto Spíritu,
      - desiderátus géntibus
      - cuius per alvum fusus est.
    - - Iesu, tibi sit glória,
      - qui natus es de Vírgine,
      - cum Patre et almo Spíritu,
      - in sempitérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Quem terra pontus.txt
    coincidencia_libro: 0.95
    libro:
    - tomo 1, p. 1093
    diferencias: []
  o-gloriosa-domina:
    incipit: O gloriósa dómina,
    estrofas:
    - - O gloriósa dómina,
      - excélsa super sídera,
      - qui te creávit próvide,
      - lactas sacráto úbere.
    - - Quod Eva tristis ábstulit,
      - tu reddis almo gérmine;
      - intrent ut astra flébiles,
      - sternis benígna sémitam.
    - - Tu regis alti iánua
      - et porta lucis fúlgida;
      - vitam datam per Vírginem,
      - gentes redémptæ, pláudite.
    - - Patri sit et Paráclito
      - tuóque Nato glória,
      - qui veste te mirábili
      - circumdedérunt grátiæ.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/O gloriosa domina.txt
    coincidencia_libro: 0.94
    libro:
    - tomo 1, p. 1093
    diferencias: []
  ave-maris-stella:
    incipit: Ave, maris stella,
    estrofas:
    - - Ave, maris stella,
      - Dei mater alma,
      - atque semper virgo,
      - felix cæli porta.
    - - Sumens illud «Ave»
      - Gabriélis ore,
      - funda nos in pace,
      - mutans Evæ nomen.
    - - Solve vincla reis,
      - profer lumen cæcis,
      - mala nostra pelle,
      - bona cuncta posce.
    - - Monstra te esse matrem,
