      mujer:
        1:
        - Hæc testis ore prótulit
        - quod cordis arca crédidit,
        - Christum sequéndo répperit
        - effusióne sánguinis.
        2:
        - Hæc nempe mundi gáudia
        - et blandiménta nóxia
        - cadúca rite députans,
        - pervénit ad cæléstia.
  beate-martyr-prospera:
    incipit: Beáte martyr, próspera
    estrofas:
    - - Beáte martyr, próspera
      - diem triumphálem tuum,
      - quo sánguinis merces tibi
      - coróna vincénti datur.
    - - Hic te ex ténebris sǽculi,
      - tortóre victo et iúdice,
      - evéxit ad cælum dies
      - Christóque ovántem réddidit.
    - - Nunc angelórum párticeps
      - collúces insígni stola,
      - quam testis indomábilis
      - rivis cruóris láveras.
    - - Adésto nunc et óbsecra,
      - placátus ut Christus suis
      - inclínet aurem prósperam,
      - noxas nec omnes ímputet.
    - - Paulísper huc illábere
      - Christi favórem déferens,
      - sensus graváti ut séntiant
      - levámen indulgéntiæ.
    - - Honor Patri cum Fílio
      - et Spíritu Paráclito,
      - qui te coróna pérpeti
      - cingunt in aula glóriæ.
    amen: true
