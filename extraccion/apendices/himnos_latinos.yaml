      corpus:
      - ac, tuis escis recreáti, in ævum
  gaude-fidelis-concio:
    incipit: Gaude, fidélis cóncio,
    estrofas:
    - - Gaude, fidélis cóncio,
      - et bénedic Altíssimo
      - in die hac lætítiæ,
      - qua confert dona grátiæ.
    - - Nam doctor hic sanctíssimus,
      - cuius nunc festum cólimus,
      - lumen fuit in pópulo
      - exémplar toti sǽculo.
    - - Inténde, doctor, précibus
      - quas actu ad te fúndimus;
      - stantes ne cadant róbora,
      - lapsos ut surgant ádiuva.
    - - Erróris pelle núbilum
      - per lucis tuæ rádium;
      - fac Deum semper cólere
      - et spem in ipsum pónere.
    - - Laus Trinitáti débita,
      - honor, potéstas, glória,
      - quæ sua ex cleméntia
      - præstat salútis prǽmia.
