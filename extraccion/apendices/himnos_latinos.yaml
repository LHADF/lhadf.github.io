  urbs-ierusalem-beata:
    incipit: Urbs Ierúsalem beáta,
    estrofas:
    - - Urbs Ierúsalem beáta,
      - dicta pacis vísio,
      - quæ constrúitur in cælis
      - vivis ex lapídibus,
      - angelísque coronáta
      - sicut sponsa cómite,
    - - Nova véniens e cælo,
      - nuptiáli thálamo
      - præparáta, ut intácta
      - copulétur Dómino.
      - Platéæ et muri eius
      - ex auro puríssimo;
    - - Portæ nitent margarítis
      - ádytis paténtibus,
      - et virtúte meritórum
      - illuc introdúcitur
      - omnis qui ob Christi nomen
      - hic in mundo prémitur.
    - - Tunsiónibus, pressúris
      - expolíti lápides
      - suis coaptántur locis
      - per manum artíficis;
      - disponúntur permansúri
      - sacris ædifíciis.
    - - Glória et honor Deo
      - usquequáque altíssimo,
      - una Patri Filióque
      - atque Sancto Flámini,
      - quibus laudes et potéstas
      - per ætérna sǽcula.
    amen: true
    fuente_texto: latin-ecclesiastic-accents, corpus/hymns/Urbs Ierusalem beata.txt
