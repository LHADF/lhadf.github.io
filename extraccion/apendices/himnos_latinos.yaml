  virginis-proles-opifexque-matris:
    incipit: Vírginis Proles opiféxque Matris,
    estrofas:
    - - Vírginis Proles opiféxque Matris,
      - Virgo quem gessit peperítque Virgo,
      - 'vírginis festum cánimus tropǽum:'
      - áccipe votum.
    - - Hæc tua virgo, dúplici beáta
