  celsae-salutis-gaudia:
    incipit: Celsæ salútis gáudia
    estrofas:
    - - Celsæ salútis gáudia
      - 'mundus fidélis iúbilet:'
      - Iesus, redémptor ómnium,
      - mortis perémit príncipem.
    - - Palmæ et olívæ súrculos
