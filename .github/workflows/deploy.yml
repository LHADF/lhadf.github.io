name: Publicar Septies en GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'   # cada lunes: recalcula el calendario con lo último del Ordo ADF
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calendario ADF (motor y datos del Ordo)
        run: |
          git clone --depth 1 https://github.com/lucasfelixjhs/ordo-telegram ../ordo-telegram
          python3 tools/calendario.py
      - name: Revisar la base de textos
        run: pip install pyyaml && python3 tools/verificar_base.py
      - name: Armar los datos
        run: python3 tools/base_js.py
      - name: Pruebas
        run: node --test tests/*.test.mjs
      - name: Armar la app
        run: python3 tools/armar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
